<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>내 소 현황</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --primary:#00A69C; --primary-dark:#008275; --accent:#2E70D6;
  --ink:#23211E; --ink-soft:#6B6862; --line:#E2E5E8; --bg:#F3F5F6; --surface:#FFFFFF; --surface-alt:#F7F9FA;
  --green-soft:#E3F4F1; --preg:#1B9C8E; --notpreg:#C0392B; --fatten:#9C6B3B; --tag-yellow:#F7C843;
  --vac:#6D4FC2; --vac-soft:#EFEAFB;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px;}

/* 헤더 */
.v-head{display:flex;align-items:center;gap:9px;padding:6px 2px 14px;}
.v-title{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.v-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.v-updated{margin-left:auto;font-size:10.5px;color:var(--ink-soft);text-align:right;line-height:1.4;}

/* 요약 카드 */
.v-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 16px;}
.v-stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.04);}
.v-stat .n{font-size:21px;font-weight:800;color:var(--primary-dark);line-height:1;}
.v-stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:5px;font-weight:600;}

/* 탭 */
.v-tabs{display:flex;gap:4px;margin:6px 0 12px;background:var(--surface-alt);padding:4px;border-radius:12px;}
.v-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:800;padding:9px 2px;border:none;border-radius:9px;background:transparent;color:var(--ink-soft);cursor:pointer;transition:all .12s;white-space:nowrap;}
.v-tab.on{background:var(--surface);color:var(--primary-dark);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.v-tab.on[data-tab="vac"]{color:var(--vac);}
.v-tab .cnt{font-size:10.5px;font-weight:800;background:var(--line);color:var(--ink-soft);border-radius:999px;padding:1px 6px;}
.v-tab.on .cnt{background:var(--green-soft);color:var(--primary-dark);}
.v-tab.on[data-tab="vac"] .cnt{background:var(--vac-soft);color:var(--vac);}
.v-panel{animation:vfade .15s ease;}
@keyframes vfade{from{opacity:.4;}to{opacity:1;}}
.v-sortbar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 9px;}
.v-sort{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:all .12s;}
.v-sort:hover{border-color:var(--primary);color:var(--primary-dark);}
.v-sort.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.v-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:var(--surface);margin-bottom:12px;}
.v-search:focus{outline:2px solid var(--tag-yellow);}

/* 개체 ID / 배지 */
.v-id,.v-sched-id,.v-today-id{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;letter-spacing:.02em;line-height:1.3;}
.v-id{background:var(--surface-alt);border:1px solid var(--line);border-radius:6px;padding:3px 7px;}
.v-id.oneyear{background:#FFF6D6;border-color:#F0D37A;color:#7A5A00;}
.v-badge{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;}
.v-badge.preg{background:var(--green-soft);color:var(--primary-dark);}
.v-badge.notpreg{background:#FBE9E7;color:var(--notpreg);}
.v-badge.check{background:#FFF3E0;color:#C8791A;}
.v-badge.wait{background:#EAF2FD;color:var(--accent);}
.v-badge.calved{background:#EAF2FD;color:var(--accent);}
.v-badge.fatten{background:#F3E9DD;color:var(--fatten);}
.v-badge.none{background:var(--surface-alt);color:var(--ink-soft);}
.v-badge.oneyear{background:#FFF6D6;color:#7A5A00;}
.v-badge.rep{background:#FBE9E7;color:var(--notpreg);}
.v-badge.kpn{background:#EAF2FD;color:var(--accent);font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;padding:3px 5px;}
#panel-preg .v-prow{gap:4px;}
#panel-preg .v-calv{font-size:11px;}
#panel-preg .v-badge.rep{padding:3px 5px;letter-spacing:-.02em;}
.v-dday{font-weight:800;color:var(--accent);}
.v-dday.soon{color:var(--notpreg);}

/* 오늘 할 일 배너 */
.v-today{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:13px;padding:14px 16px;margin:4px 0 6px;box-shadow:0 3px 12px rgba(0,166,156,.3);}
.v-today-h{font-size:13px;font-weight:800;margin-bottom:8px;opacity:.95;}
.v-today-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.22);}
.v-today-row:first-of-type{border-top:none;}
.v-today-id{}
.v-today-note{margin-left:auto;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.2);padding:3px 11px;border-radius:7px;}

/* 일정 — 날짜 그룹 */
.v-sched-hint{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.v-sgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.v-sgroup.today{border-color:var(--primary);background:var(--green-soft);}
.v-sgroup.past{opacity:.5;}
.v-sgroup-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--bg);}
.v-sched-md{font-size:13px;font-weight:800;color:var(--ink);}
.v-gitem{display:flex;align-items:center;gap:9px;padding:6px 0;}
.v-gitem+.v-gitem{border-top:1px solid var(--bg);}
.v-sched-id{color:var(--ink);}
.v-sched-note{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--primary-dark);background:var(--surface-alt);padding:4px 12px;border-radius:7px;white-space:nowrap;}
.v-sgroup.today .v-sched-note{background:var(--primary);color:#fff;}
/* 백신 탭 색 */
.v-vac .v-sgroup.today{border-color:var(--vac);background:var(--vac-soft);}
.v-vac .v-sched-note{color:var(--vac);background:var(--vac-soft);}
.v-vac .v-sgroup.today .v-sched-note{background:var(--vac);color:#fff;}
.v-vac .v-dday.today{color:var(--vac);}

.v-dday{font-size:11.5px;font-weight:800;color:var(--accent);}
.v-dday.soon{color:var(--notpreg);}
.v-dday.today{color:var(--primary-dark);}
.v-empty-sm{font-size:12.5px;color:var(--ink-soft);padding:14px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:11px;}

/* 소별 임신 현황 행 */
.v-prow{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:5px;flex-wrap:nowrap;overflow:hidden;}
.v-prow .v-id{flex:0 0 auto;}
.v-prow .v-badge{flex:0 0 auto;padding:3px 6px;font-size:10.5px;white-space:nowrap;}
.v-calv{font-size:11.5px;color:var(--ink-soft);margin-left:auto;white-space:nowrap;flex:0 0 auto;}

.v-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 0;}
.v-foot{text-align:center;font-size:10.5px;color:var(--ink-soft);margin-top:22px;line-height:1.6;}
.v-legend{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.7;background:#FFFBEA;border:1px solid #F0D37A;border-radius:8px;padding:7px 10px;}

/* 잠금(토큰 오류) 화면 */
.v-lock{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);}
.v-lock h2{font-size:17px;margin:0 0 8px;color:var(--ink);}
.v-lock p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
.v-lock .lk{margin-bottom:8px;color:var(--primary);display:flex;justify-content:center;}
.v-pick{border:1px solid var(--primary);background:var(--green-soft);color:var(--primary-dark);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.v-pick:hover{background:var(--primary);color:#fff;}

@media (max-width:420px){
  .v-summary{gap:6px;}
  .v-stat .n{font-size:18px;}
  .v-tab{font-size:12.5px;gap:4px;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   축주 보기앱 (읽기 전용) — 토큰 기반
   - 링크: viewer.html?t=토큰   (농장주 이름은 URL에 없음)
   - Firestore  shared/{토큰}  문서 하나만 읽음 → 다른 농장 접근 불가
   - data.schedule : 처치(동기화 등) 일정   data.vaccines : 백신 일정 (따로 탭)
   ========================================================= */

const FIREBASE_CONFIG = {

  authDomain: "aimanager-a36b3.firebaseapp.com",
  projectId: "aimanager-a36b3",
  storageBucket: "aimanager-a36b3.firebasestorage.app",
  messagingSenderId: "24929299448",
  appId: "1:24929299448:web:8259496a583a451a8d040d"
};

let DB = null;
async function initFirebase(){
  try{
    if(typeof firebase==='undefined') return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    DB = firebase.firestore();
    return true;
  }catch(e){ console.warn('Firebase 연결 실패, mock 사용', e); return false; }
}

// ---- 테스트용 MOCK (Firebase 없을 때만). 키 = 토큰 ----
const MOCK = {
  "a3f9k2": {
    owner: "김준규",
    updatedAt: "2026-06-22",
    animals: [
      { id:"002 1390 8161 6", status:"임신감정 필요", days:38, expectedCalving:null, aiCount:3 },
      { id:"002 1932 8629 4", status:"임신중", days:null, expectedCalving:"2026-06-29", oneYear:true },
      { id:"002 1986 7201 1", status:"임신중", days:null, expectedCalving:"2027-03-25" },
      { id:"002 1657 5259 8", status:"감정 대기", days:18, expectedCalving:null },
      { id:"002 1518 1402 2", status:"비임신", days:45, expectedCalving:null, aiCount:4 },
      { id:"002 2029 9407 0", status:"미수정", days:null, expectedCalving:null }
    ],
    schedule: [
      { date:"2026-06-20", id:"002 1657 5259 8", note:"GnRH" },
      { date:"2026-06-21", id:"002 1657 5259 8", note:"AI" },
      { date:"2026-06-22", id:"002 1932 9058 2", note:"PG" },
      { date:"2026-06-22", id:"002 1657 5259 8", note:"PG" },
      { date:"2026-06-22", id:"002 1390 8493 6", note:"GnRH" },
      { date:"2026-06-23", id:"002 1932 9058 2", note:"GnRH" },
      { date:"2026-06-23", id:"002 1657 5259 8", note:"GnRH" },
      { date:"2026-06-25", id:"002 1932 9058 2", note:"AI" },

    ],
    vaccines: [
      { date:"2026-06-24", id:"002 1986 7201 1", note:"설사 1차" },
      { date:"2026-07-15", id:"002 1986 7201 1", note:"설사 2차" },
      { date:"2026-07-15", id:"002 1932 8629 4", note:"설사 2차" }
    ]
  },
  "z7t1m4": {
    owner: "이종현",
    updatedAt: "2026-06-22",
    animals: [ { id:"002 2056 5187 6", status:"임신중", expectedCalving:"2027-03-20" } ],
    schedule: []
  }
};

function getToken(){
  const p = new URLSearchParams(location.search);
  return p.get('t') || p.get('token') || '';
}

async function loadByToken(token){
  if(DB){
    const snap = await DB.collection('shared').doc(token).get();
    return snap.exists ? snap.data() : null;
  }
  return MOCK[token] || null;
}

// ---- 날짜 유틸 ----
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function dday(s){
  const d=parseD(s); if(!d) return null;
  return Math.round((d - today())/86400000);
}
function ddayText(s){
  const n=dday(s); if(n===null) return '';
  if(n===0) return 'D-day';
  if(n>0) return 'D-'+n;
  return 'D+'+(-n);
}

function statusBadge(st){
  const map = {
    '임신중':['preg','임신중'],
    '비임신':['notpreg','재수정 대기'],
    '임신감정 필요':['check','임신감정 필요'],
    '감정 대기':['wait','감정 대기'],
    '분만완료':['calved','분만완료'],
    '비육전환':['fatten','비육전환'],
    '미수정':['none','미수정']
  };
  const [cls,label] = map[st] || ['none', st||'-'];
  return `<span class="v-badge ${cls}">${label}</span>`;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const ICON_PATHS = {
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  clipboard: '<rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4h6"/><path d="M9 12l2 2 3.5-3.5"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8 3v4M16 3v4"/>',
  syringe: '<path d="M18 4l2 2M15 7l2 2M5 19l-2 2M6 14l4 4M9 11l4 4"/><path d="M8 12l6-6 4 4-6 6-4-4z"/>',
  cow: '<ellipse cx="12" cy="13.5" rx="6" ry="5"/><path d="M6.2 9.5C4 7.5 3 8.5 3.6 11M17.8 9.5C20 7.5 21 8.5 20.4 11"/><circle cx="10" cy="14" r="0.9"/><circle cx="14" cy="14" r="0.9"/>'
};
function svgIcon(name, size){
  size = size || 16;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.16em;flex-shrink:0;">${ICON_PATHS[name]||''}</svg>`;
}

function fmtYmdShort(s){ const m=/^(\d{2})(\d{2})-(\d{2})-(\d{2})/.exec(s||''); return m ? `${m[2]}/${m[3]}/${m[4]}` : esc(s); }
const WEEK = ['일','월','화','수','목','금','토'];
function fmtDate(s){
  const d=parseD(s); if(!d) return esc(s);
  return `${d.getMonth()+1}/${d.getDate()} (${WEEK[d.getDay()]})`;
}

function renderLock(msg){
  document.getElementById('app').innerHTML = `
    <div class="v-lock">
      <div class="lk">${svgIcon("lock",34)}</div>
      <h2>접근할 수 없어요</h2>
      <p>${esc(msg)}<br>담당 수의사에게 받은 링크로 다시 접속해 주세요.</p>
    </div>`;
}

function groupByDate(list){
  const m = {};
  list.forEach(s=>{ (m[s.date]=m[s.date]||[]).push(s); });
  return Object.keys(m).sort().map(date=>({date, items:m[date]}));
}

/* 같은 날짜·같은 처치면 번호를 한 줄에 묶음 */
function schedGroup(g){
  const n = dday(g.date);
  let cls='', dtxt=ddayText(g.date), dcls='v-dday';
  if(n===0){ cls='today'; dcls='v-dday today'; dtxt='오늘'; }
  else if(n>0 && n<=2){ dcls='v-dday soon'; }
  else if(n<0){ cls='past'; }
  const byNote = {};
  g.items.forEach(s=>{ const k=s.note||''; (byNote[k]=byNote[k]||[]).push(s.id); });
  const rows = Object.keys(byNote).sort().map(note=>{
    const ids = byNote[note].slice().sort((a,b)=>a.localeCompare(b));
    return `
    <div class="v-gitem">
      <span class="v-sched-id" style="display:flex;flex-direction:column;gap:3px;">${ids.map(esc).join('<br>')}</span>
      <span class="v-sched-note">${esc(note)}</span>
    </div>`;
  }).join('');
  return `
    <div class="v-sgroup ${cls}">
      <div class="v-sgroup-head">
        <span class="v-sched-md">${fmtDate(g.date)}</span>
        <span class="${dcls}">${dtxt}</span>
      </div>
      ${rows}
    </div>`;
}

function renderApp(data){
  const animals = data.animals || [];
  const byDate = (a,b)=> (a.date<b.date?-1:a.date>b.date?1:0);
  const sched = (data.schedule || []).slice().sort(byDate);
  const vacs  = (data.vaccines || []).slice().sort(byDate);

  const future = s=>{ const n=dday(s.date); return n!==null && n>=1; };
  const upGroups  = groupByDate(sched.filter(future));
  const vacGroups = groupByDate(vacs.filter(future));

  const pregAnimals = animals.filter(a=>a.status==='임신중');
  const openAnimals = animals.filter(a=>a.status!=='임신중');
  const cntPreg = pregAnimals.length;
  const cntCheck = animals.filter(a=>a.status==='임신감정 필요'||a.status==='감정 대기').length;

  // 오늘 할 일: 처치 + 백신 모두
  const todayItems = sched.filter(s=>dday(s.date)===0).concat(vacs.filter(s=>dday(s.date)===0))
    .sort((a,b)=> (a.note||'').localeCompare(b.note||'') || (a.id||'').localeCompare(b.id||''));
  const todayBanner = todayItems.length ? `
    <div class="v-today">
      <div class="v-today-h">${svgIcon("clipboard",16)} 오늘 할 일</div>
      ${todayItems.map(s=>`<div class="v-today-row"><span class="v-today-id">${esc(s.id)}</span><span class="v-today-note">${esc(s.note||'')}</span></div>`).join('')}
    </div>` : '';

  const upN  = upGroups.reduce((s,g)=>s+g.items.length,0);
  const vacN = vacGroups.reduce((s,g)=>s+g.items.length,0);

  document.getElementById('app').innerHTML = `
    <div class="v-head">
      <div>
        <div class="v-title">${esc(data.owner)}님 농장</div>
        <div class="v-sub">처치 · 백신 · 공태 · 임신 현황</div>
      </div>
      <div class="v-updated">업데이트<br>${esc(data.updatedAt||'-')}</div>
    </div>

    <div class="v-summary">
      <div class="v-stat"><div class="n">${animals.length}</div><div class="l">전체 두수</div></div>
      <div class="v-stat"><div class="n">${cntPreg}</div><div class="l">임신중</div></div>
      <div class="v-stat"><div class="n">${cntCheck}</div><div class="l">감정 대상</div></div>
    </div>

    ${todayBanner}

    <div class="v-tabs">
      <button class="v-tab on" data-tab="sched">${svgIcon("calendar",15)} 처치 ${upN?`<span class="cnt">${upN}</span>`:''}</button>
      <button class="v-tab" data-tab="vac">${svgIcon("syringe",15)} 백신 ${vacN?`<span class="cnt">${vacN}</span>`:''}</button>
      <button class="v-tab" data-tab="status">${svgIcon("cow",15)} 공태</button>
      <button class="v-tab" data-tab="preg">${svgIcon("cow",15)} 임신</button>
    </div>

    <div id="panel-sched" class="v-panel">
      <div class="v-sched-hint">아래 날짜에 맞춰 처치(주사·수정 등)를 진행해 주세요.</div>
      ${upGroups.length ? upGroups.map(schedGroup).join('') : '<div class="v-empty-sm">예정된 처치 일정이 없어요.</div>'}
    </div>

    <div id="panel-vac" class="v-panel v-vac" style="display:none;">
      <div class="v-sched-hint">예정된 백신 접종 일정이에요.</div>
      ${vacGroups.length ? vacGroups.map(schedGroup).join('') : '<div class="v-empty-sm">예정된 백신 일정이 없어요.</div>'}
    </div>

    <div id="panel-status" class="v-panel" style="display:none;">
      <div class="v-sched-hint">임신 확인 전이거나 비임신인 소예요. (${openAnimals.length}두)</div>
      <div class="v-sortbar">
        <button class="v-sort on" data-sort="id">개체번호</button>
        <button class="v-sort" data-sort="status">상태별</button>
        <button class="v-sort" data-sort="days">수정 경과일</button>
      </div>
      <input class="v-search" id="vsearch" placeholder="개체번호 검색 (예: 8161)">
      <div id="vlist"></div>
    </div>

    <div id="panel-preg" class="v-panel" style="display:none;">
      <div class="v-sched-hint">임신 확인된 소예요. (${pregAnimals.length}두) · 파란 숫자 = 정액(KPN) 번호 · 우측 = 분만예정일과 남은 일수</div>
      <div class="v-sortbar">
        <button class="v-sort on" data-sort="calv" data-list="preg">분만예정일</button>
        <button class="v-sort" data-sort="id" data-list="preg">개체번호</button>
      </div>
      <input class="v-search" id="vsearch2" placeholder="개체번호 검색">
      <div class="v-legend"><span class="v-id oneyear" style="font-size:11px;padding:1px 6px;">노란색 번호</span> = 분만 후 81일 이내에 다시 임신한 <b>1년1산</b> 암소예요. 번식 성적이 우수한 소입니다.</div>
      <div id="vlist2"></div>
    </div>

    <div class="v-foot">
      이 화면은 담당 수의사가 공유한 정보예요.<br>
      자세한 내용은 수의사에게 문의해 주세요.
    </div>`;

  // ---- 탭 전환 ----
  const PANELS = {sched:'panel-sched', vac:'panel-vac', status:'panel-status', preg:'panel-preg'};
  document.querySelectorAll('.v-tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.v-tab').forEach(x=>x.classList.toggle('on', x===t));
      Object.keys(PANELS).forEach(k=>{ document.getElementById(PANELS[k]).style.display = k===t.dataset.tab ? '' : 'none'; });
    });
  });

  // ---- 번식 현황 정렬/검색 ----
  const third = x => { const p=(x.id||'').trim().split(/\s+/); return p[2]||x.id; };
  const STATUS_ORDER = {'임신감정 필요':0,'감정 대기':1,'비임신':2,'미수정':3,'임신중':4,'분만완료':5,'비육전환':6};
  function sortAnimals(key, src){
    const arr = src.slice();
    if(key==='status'){
      arr.sort((a,b)=>{ const d=(STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9); return d!==0?d:third(a).localeCompare(third(b)); });
    } else if(key==='days'){
      arr.sort((a,b)=>{ const da=a.days==null?-1:a.days, db=b.days==null?-1:b.days; return db-da; });
    } else if(key==='calv'){
      arr.sort((a,b)=>{ const ca=a.expectedCalving||'9999', cb=b.expectedCalving||'9999'; return ca<cb?-1:ca>cb?1:0; });
    } else {
      arr.sort((a,b)=> third(a).localeCompare(third(b)));
    }
    return arr;
  }
  function rowHtml(a){
    const rep = (a.aiCount>=3 && a.status!=='비육전환') ? `<span class="v-badge rep">수정 ${a.aiCount}회</span>` : '';
    return `<div class="v-prow" data-id="${esc(a.id.replace(/\s/g,''))}">
        <span class="v-id${a.oneYear?' oneyear':''}">${esc(a.id)}</span>
        ${statusBadge(a.status)}
        ${rep}
        ${(a.status==='임신감정 필요'||a.status==='감정 대기'||a.status==='비임신')&&(a.days!=null)?`<span class="v-calv">${a.basis==='calv'?'분만 후':'수정 후'} ${a.days}일</span>`:''}
      </div>`;
  }
  function pregRowHtml(a){
    const rep = a.aiCount>=3 ? `<span class="v-badge rep">수정${a.aiCount}회</span>` : '';
    return `<div class="v-prow" data-id="${esc(a.id.replace(/\s/g,''))}">
        <span class="v-id${a.oneYear?' oneyear':''}">${esc(a.id)}</span>
        ${a.kpn?`<span class="v-badge kpn" title="정액 번호">${esc(a.kpn)}</span>`:''}
        ${rep}
        ${a.expectedCalving?`<span class="v-calv">${fmtYmdShort(a.expectedCalving)} <b class="v-dday${(dday(a.expectedCalving)??99)<=14?' soon':''}">${ddayText(a.expectedCalving)}</b></span>`:''}
      </div>`;
  }
  const lists = {
    open: { sort:'id', q:'', src:openAnimals, el:'vlist', row:rowHtml },
    preg: { sort:'calv', q:'', src:pregAnimals, el:'vlist2', row:pregRowHtml }
  };
  function renderVlist(k){
    const L = lists[k]; const q = L.q.replace(/\s/g,'');
    const list = sortAnimals(L.sort, L.src).filter(a => !q || a.id.replace(/\s/g,'').includes(q));
    document.getElementById(L.el).innerHTML = list.length ? list.map(L.row).join('') : '<div class="v-empty-sm">해당하는 소가 없어요.</div>';
  }
  renderVlist('open'); renderVlist('preg');

  document.querySelectorAll('.v-sort').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.list==='preg' ? 'preg' : 'open';
      lists[k].sort = b.dataset.sort;
      b.parentElement.querySelectorAll('.v-sort').forEach(x=>x.classList.toggle('on', x===b));
      renderVlist(k);
    });
  });
  const si = document.getElementById('vsearch');
  si.addEventListener('input', ()=>{ lists.open.q = si.value; renderVlist('open'); });
  const si2 = document.getElementById('vsearch2');
  si2.addEventListener('input', ()=>{ lists.preg.q = si2.value; renderVlist('preg'); });
}

function renderPicker(){
  const tokens = Object.keys(MOCK);
  document.getElementById('app').innerHTML = `
    <div class="v-lock">
      <div class="lk">${svgIcon("cow",34)}</div>
      <h2>테스트 미리보기</h2>
      <p>실제로는 수의사가 보낸 링크(<b>?t=토큰</b>)로 바로 들어와요.<br>지금은 테스트용이라 골라보세요.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        ${tokens.map(t=>`<button class="v-pick" data-token="${esc(t)}">${esc(MOCK[t].owner)}님 농장 보기</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.v-pick').forEach(b=>{
    b.addEventListener('click', ()=>openToken(b.dataset.token));
  });
}

async function openToken(token){
  let data;
  try{ data = await loadByToken(token); }
  catch(e){ renderLock('데이터를 불러오지 못했어요.'); return; }
  if(!data){ renderLock('농장 정보를 찾을 수 없어요.'); return; }
  renderApp(data);
}

async function init(){
  await initFirebase();
  const token = getToken();
  if(!token){
    if(!DB){ renderPicker(); }
    else { renderLock('링크에 정보가 빠져 있어요.'); }
    return;
  }
  openToken(token);
}

init();
</script>
</body>
</html>
