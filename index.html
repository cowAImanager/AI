/* 1년1산: 올해 분만한 소 중 분만 후 81일 안에 수태(현재 임신중)한 소.
   base = 올해 분만우 중 결과가 난 소 (임신중이거나, 분만 81일이 지났는데 아직 임신 아님). 아직 81일 안 지난 비임신우는 판정 보류 */
function oneYearStats(yearCalvings, pregRows){
  const today = todayStr();
  const pregBy = {}; pregRows.forEach(r => { pregBy[r.animalId] = r; });
  const seen = new Set();
  let n=0, base=0, pending=0;
  yearCalvings.forEach(c => {
    if(seen.has(c.animalId)) return; seen.add(c.animalId);
    const p = pregBy[c.animalId];
    if(p && p.aiDate && dateOnly(p.aiDate) > c.calvDate){
      base++;
      if(daysBetween(c.calvDate, dateOnly(p.aiDate)) <= 81) n++;
    } else if(daysBetween(c.calvDate, today) > 81){
      base++;            // 81일 넘었는데 임신 아님 → 1년1산 실패
    } else pending++;    // 아직 기회 있음
  });
  return { n, base, pending };
}
function renderPregCheckView(){
  const today = todayStr();
  const animals = ownerAnimals();
  const rows = [];
  animals.forEach(a => {
    const allRecs = DATA.records.filter(r=>r.owner===UI.owner && r.animalId===a.animalId);
    const aiRecs = allRecs.filter(r=>r.aiDate).sort((x,y)=> sortKeyOf(y) - sortKeyOf(x));
    const sorted = allRecs.slice().sort((x,y)=> sortKeyOf(y) - sortKeyOf(x));
    // 감정은 '가장 최근 수정 이후'의 것만 현재 상태로 인정 (지난 수정의 감정은 무시)
    const latestAiTs = aiRecs.length ? sortKeyOf(aiRecs[0]) : -Infinity;
    const diagPool = sorted.filter(r => sortKeyOf(r) >= latestAiTs);
    const preg1 = (lastNonEmpty(diagPool,'pregnant')||'').trim();
    const preg2 = (lastNonEmpty(diagPool,'pregnant2')||'').trim();
    const fsex  = (lastNonEmpty(diagPool,'fetalSex')||'').trim();
    const syncAi = nextScheduledAiDate(UI.owner, a.animalId);   // 동기화 프로그램의 예정 수정일
    // 수정기록도, 감정 표기도, 분만이력도, 동기화 예정도 전혀 없으면 제외
    if(!aiRecs.length && !preg1 && !preg2 && !fsex && !latestCalvingDate(allRecs) && !latestStillbirthDate(allRecs) && !syncAi) return;
    const aiRec = aiRecs[0] || null;
    const aiD = aiRec ? dateOnly(aiRec.aiDate) : '';
    const days = aiD ? Math.floor((new Date(today+'T00:00') - new Date(aiD+'T00:00')) / 86400000) : null;
    const isPreg = isCurrentlyPregnant(allRecs);
    const calved = calvedAfterPregnancy(allRecs);
    const reproEnd = calved ? latestReproEnd(allRecs) : null;
    const isStillbirthEnd = !!(reproEnd && reproEnd.stillbirth);
    const calvRec = isStillbirthEnd ? latestStillbirthRec(allRecs) : latestCalvingRec(allRecs);
    const calvDate = calvRec ? dateOnly(isStillbirthEnd ? calvRec.stillbirthDate : calvRec.calvingDate) : '';
    const calfSex = (!isStillbirthEnd && calvRec) ? (calvRec.calfSex||'') : '';
    const expCalv = dateOnly(lastNonEmpty(sorted,'expectedCalving')||'');
    const recordForEdit = sorted.find(r => (r.pregnant||r.pregnant2||r.fetalSex||r.calvingDate||r.stillbirthDate)) || aiRec || sorted[0];
    const lastCalv = [latestCalvingDate(allRecs), dateOnly(a.lastCalving||'')].filter(Boolean).sort().pop() || '';
    rows.push({ animalId: a.animalId, record: recordForEdit, aiDate: aiRec ? aiRec.aiDate : null, days,
      pregnant: preg1, preg1, preg2, fsex, isPreg, calved, isStillbirthEnd, calvDate, calfSex, expCalv, lastCalv, fattening: !!a.fattening, syncAi, aiCountCur: currentAiCount(a, sorted), oneYear: !!(isPreg && lastCalv && aiD && daysBetween(lastCalv, aiD)>=0 && daysBetween(lastCalv, aiD)<=81) });
  });
  // 분만완료는 수정기록 없는 것으로 취급해 정렬(옛 수정일 기준 X). 나머지는 수정 후 경과일 내림차순.
  const effDays = r => (r.calved || r.days==null) ? -1 : r.days;
  rows.sort((x,y)=> effDays(y) - effDays(x) || (y.calvDate||'').localeCompare(x.calvDate||''));

  const isXof = r => {
    const p1=(r.preg1||'').trim().toUpperCase(), p2=(r.preg2||'').trim().toUpperCase();
    return (p1==='X' || p2==='X') && !r.isPreg && !r.calved;
  };
  const groupOf = r => {
    if(r.fattening) return 'fatten';       // 비육전환 (최우선 분리)
    if(r.isPreg)    return 'pregnant';      // 임신중
    if(r.calved || isXof(r)) return 'waiting'; // 분만완료 + 감정X → 수정대기
    if(!r.aiDate && r.syncAi) return 'waiting'; // 아직 실제 수정 전, 동기화 진행 중 → 수정대기(감정 대상 아님)
    return 'active';                        // 임신감정 대상 (감정 대기·필요)
  };
  const pregnant = rows.filter(r => groupOf(r)==='pregnant');
  const active   = rows.filter(r => groupOf(r)==='active');
  const waiting  = rows.filter(r => groupOf(r)==='waiting');
  const fatten   = rows.filter(r => groupOf(r)==='fatten');

  const renderRow = row => {
    const p1 = (row.preg1||'').trim().toUpperCase();
    const p2 = (row.preg2||'').trim().toUpperCase();
    const isMiscarry = p1==='O' && p2==='X' && !row.isPreg && !row.calved;   // 1차 O였다가 2차 X → 사산(유산)
    const isNotPregnant = (p1==='X' || isMiscarry) && !row.isPreg && !row.calved;
    const needsCheck = !row.fattening && !row.preg1 && !row.calved && row.days!=null && row.days>=30;
    let rowClass = '';
    if(row.calved) rowClass='confirmed';
    else if(row.isPreg) rowClass='confirmed';
    else if(isNotPregnant) rowClass='notpregnant';
    else if(needsCheck) rowClass='overdue';

    const tags = [];
    if(row.preg1 && !(isNotPregnant && p1==='X')) tags.push(`<span class="preg-tag ${p1==='O'?'pos':(p1==='X'?'neg':'rechk')}">1차 ${esc(row.preg1)}</span>`);   // 수정대기(비임신) 행의 '1차 X'는 중복이라 생략
    if(p1!=='X'){   // 1차 X면 2차·성감정은 의미 없으니 숨김
      if(row.preg2) tags.push(`<span class="preg-tag ${p2==='O'?'pos':(p2==='X'?'neg':'rechk')}">2차 ${esc(row.preg2)}</span>`);
      if(sexIcon(row.fsex)) tags.push(`<span class="preg-tag sex" title="태아 성별">${sexIcon(row.fsex)}</span>`);
      if(row.oneYear) tags.push(`<span class="preg-tag oy" title="분만 후 81일 내 수태">1년1산</span>`);
    }

    let badge = '';
    if(row.calved){
      const pp = daysBetween(row.calvDate, todayStr());
      const vwp = row.fattening ? '' : (pp < VWP_DAYS ? `재수정 대기 D-${VWP_DAYS-pp}` : '재수정 가능');
      tags.length = 0; // 분만·사산 완료 행은 해당 정보 위주로
      tags.push(row.isStillbirthEnd
        ? `<span class="preg-tag neg">사산 ${fmtShort(row.calvDate)}</span>`
        : `<span class="preg-tag calf">분만 ${fmtShort(row.calvDate)}</span>`);
      if(sexIcon(row.calfSex)) tags.push(`<span class="preg-tag sex" title="송아지 성별">${sexIcon(row.calfSex)}</span>`); else if(row.calfSex && /쌍/.test(row.calfSex)) tags.push(`<span class="preg-tag calf">${esc(row.calfSex)}</span>`);
      if(vwp) tags.push(`<span class="preg-tag ${pp<VWP_DAYS?'rechk':'pos'}">${vwp}</span>`);
    } else if(row.isPreg){
      if(row.expCalv){
        const dd = daysBetween(todayStr(), row.expCalv);
        if(dd >= 0){
          badge = `<span class="pc-badge preg pdday">${fmtShort(row.expCalv)} 분만 D-${dd}</span>`;
        } else {
          rowClass='overdue';
          badge = `<span class="pc-badge warn pdday">${fmtShort(row.expCalv)} 분만 확인</span>`;
        }
      } else {
        badge = `<span class="pc-badge unknown pdday">임신중</span>`;
      }
    } else if(needsCheck){
      badge = `<span class="pc-badge check">임신감정 필요</span>`;
    }

    // 보조 상태 (비육전환 / 사산 / 재수정 대기) — 메인 배지와 같은 모양·크기
    let subTag = '';
    if(row.fattening) subTag = `<span class="pc-badge fatten">비육전환</span>`;
    else if(isMiscarry) subTag = `<span class="pc-badge warn">사산</span>`;
    else if(isNotPregnant) subTag = `<span class="pc-badge rebreed">재수정 대기</span>`;

    // 임신중 행의 모바일 전용 요약 — 분만 D-day 대신 1·2차 감정 결과 (데스크톱에선 숨김, 모바일에서만 표시)
    let diagSum = '';
    if(row.isPreg){
      const dparts = [];
      // 2차 결과가 있으면 1차는 당연히 O → 모바일 폭 절약을 위해 최신 감정만 표시
      if(row.preg2) dparts.push('2차'+esc(row.preg2));
      else if(row.preg1) dparts.push('1차'+esc(row.preg1));
      if(sexIcon(row.fsex)) dparts.push(sexIcon(row.fsex));
      if(dparts.length) diagSum = `<span class="pc-badge unknown diagsum">${dparts.join('·')}</span>`;
    }

    // 동기화 프로그램의 예정 수정(AI)일 — 오른쪽 배지 영역에 표시(모바일에서도 잘리지 않음)
    let syncTag = '';
    if(!row.isPreg && row.syncAi) syncTag = `<span class="pc-badge sync">${svgIcon('calendar',11)} 동기화 ${fmtShort(row.syncAi)}</span>`;

    return `
    <div class="pregcheck-row ${rowClass} ${row.fattening?'fattened':''}" data-action="${row.record?'editRecord':'addRecord'}" data-id="${esc(row.record?row.record.id:row.animalId)}">
      ${idChip({animalId:row.animalId}, {oneYear:row.oneYear}, '')}
      <span class="pregcheck-mid">
        <span class="pregcheck-date">${(row.aiDate && !row.calved)?('<span class="pcd-prefix">수정일 </span><span class="pcd-val">'+fmtYmdShort(dateOnly(row.aiDate))+'</span>'):'<span class="pcd-val">수정기록 없음</span>'}${(!row.calved && row.aiCountCur>=3)?`<span class="open-repeat" title="${row.isPreg?'수정 '+row.aiCountCur+'회 만에 수태':'수정 '+row.aiCountCur+'회 불수태'}">리피트<span class="rp-suffix"> </span>${row.aiCountCur}<span class="rp-suffix">회</span></span>`:''}</span>
        ${row.calved && row.calvDate?`<span class="pregcheck-days">${row.isStillbirthEnd?'사산':'분만'} ${daysBetween(row.calvDate, todayStr())}일<span class="pcd-suffix"> 경과</span></span>`:(isNotPregnant && row.lastCalv?`<span class="pregcheck-days">분만 ${daysBetween(row.lastCalv, todayStr())}일<span class="pcd-suffix"> 경과</span></span>`:(row.days!=null && !row.calved?`<span class="pregcheck-days">${isNotPregnant?'수정<span class="pcd-suffix"> 후</span> ':''}${row.days}일<span class="pcd-suffix"> 경과</span></span>`:''))}
        <span class="preg-tags">${tags.join('')}</span>
      </span>
      <span class="pregcheck-end ${syncTag?'has-sync':''}">${syncTag}${badge}${diagSum}${subTag}</span>
      <button class="iconbtn sched-add-btn" data-action="editSchedItem" data-aid="${esc(row.animalId)}" data-date="${todayStr()}" data-stop="1" title="스케줄에 날짜·내용 바로 입력">${svgIcon('calendar',14)}</button>
    </div>
  `;
  };

  const activeHtml = active.map(renderRow).join('') || `<div class="empty-state">해당 개체가 없어요.</div>`;
  const pregnantHtml = pregnant.map(renderRow).join('') || `<div class="empty-state">임신 확인된 개체가 없어요.</div>`;
  const waitingHtml = waiting.map(renderRow).join('');
  const fattenHtml  = fatten.map(renderRow).join('');

  const { fsSuccess, fsTotal, concCows, concRounds, avgServices, rateFirst } = pregStatsFor(UI.owner);
  const ALL = pregStatsFor('');   // 전체 농장 합산

  const pf = UI.pregFilter || 'all';   // all | active | pregnant | calvings
  const showActive = (pf==='all' || pf==='active');
  const showPreg   = (pf==='all' || pf==='pregnant');
  const showCalv   = (pf==='all' || pf==='calvings');

  // 올해 출산 — 현재 상태(임신중/공태 등)와 무관하게, 선택 연도에 분만한 모든 개체를 모음 (연도 이동 가능)
  // 분만은 진료기록(calvingDate)에도, 개체정보(lastCalving)에도 남을 수 있어 둘 다 확인
  const thisYear = today.slice(0,4);
  const calvYear = UI.calvYear || thisYear;
  const yearNow = calvYear;
  const yearCalvings = [];
  animals.forEach(a => {
    const recCalvs = DATA.records.filter(r=>r.owner===UI.owner && r.animalId===a.animalId
      && dateOnly(r.calvingDate||'').slice(0,4)===yearNow && dateOnly(r.calvingDate)<=today);
    if(recCalvs.length){
      recCalvs.forEach(r => yearCalvings.push({ animalId:a.animalId, recordId:r.id, calvDate: dateOnly(r.calvingDate), calfSex: r.calfSex||'' }));
    } else {
      const lastCalv = dateOnly(a.lastCalving||'');
      const animalRecs = DATA.records.filter(r=>r.owner===UI.owner && r.animalId===a.animalId);
      const stillMatches = lastCalv && lastCalv === latestStillbirthDate(animalRecs); // 최근분만일이 실은 사산일과 같으면 출산 아님
      if(lastCalv && lastCalv.slice(0,4)===yearNow && lastCalv<=today && !stillMatches){
        // 진료기록엔 없지만 개체정보의 최근분만일이 해당 연도인 경우 (수기 입력분)
        yearCalvings.push({ animalId:a.animalId, recordId:null, calvDate: lastCalv, calfSex:'' });
      }
    }
  });
  yearCalvings.sort((x,y)=> y.calvDate.localeCompare(x.calvDate));
  const yearCalvingsHtml = yearCalvings.map(({animalId,recordId,calvDate,calfSex}) => `
    <div class="pregcheck-row" data-action="${recordId?'editRecord':'gotoAnimalDetail'}" data-id="${esc(recordId||animalId)}">
      <span class="tag-chip" data-animal-id="${esc(animalId)}">${esc(animalId)}</span>
      <span class="pregcheck-mid">
        <span class="pregcheck-date"><span class="pcd-prefix">분만일 </span>${fmtYmdShort(calvDate)}</span>
        <span class="pregcheck-days">${daysBetween(calvDate, today)}일 경과</span>
        <span class="preg-tags">${sexIcon(calfSex)?`<span class="preg-tag sex">${sexIcon(calfSex)}</span>`:(calfSex&&/쌍/.test(calfSex)?`<span class="preg-tag calf">${esc(calfSex)}</span>`:'')}</span>
      </span>
    </div>`).join('') || `<div class="empty-state">${yearNow}년 출산 기록이 없어요.</div>`;

  return `
    <div class="panel">
      <div class="preg-summary five preg-five">
        <div class="preg-stat clickable ${pf==='active'?'sel':''}" data-action="setPregFilter" data-filter="active">
          <div class="preg-stat-num">${active.length}</div>
          <div class="preg-stat-label">임신감정 대상</div>
        </div>
        <div class="preg-stat pregcol clickable ${pf==='pregnant'?'sel':''}" data-action="setPregFilter" data-filter="pregnant">
          <div class="preg-stat-num">${pregnant.length}</div>
          <div class="preg-stat-label">임신중</div>
        </div>
        <div class="preg-stat ratecol">
          <div class="preg-stat-num">${rateFirst}%</div>
          <div class="preg-stat-label">첫수정 수태율 <span class="preg-stat-sub">수태 ${fsSuccess} / 첫수정 ${fsTotal}</span><span class="preg-stat-sub all">전체 농장 ${ALL.rateFirst}% (${ALL.fsSuccess}/${ALL.fsTotal})</span></div>
        </div>
        <div class="preg-stat">
          <div class="preg-stat-num">${avgServices}<span style="font-size:14px;font-weight:700;">회</span></div>
          <div class="preg-stat-label">수태당 수정횟수 <span class="preg-stat-sub">수정 ${concRounds} / 수태 ${concCows}</span><span class="preg-stat-sub all">전체 농장 ${ALL.avgServices}회 (${ALL.concRounds}/${ALL.concCows})</span></div>
        </div>
        <div class="preg-stat clickable ${pf==='calvings'?'sel':''}" data-action="setPregFilter" data-filter="calvings">
          <div class="preg-stat-num">${yearCalvings.length}<span style="font-size:14px;font-weight:700;">두</span></div>
          <div class="preg-stat-label">${yearNow}년 출산</div>
        </div>
        ${(()=>{ const oy = oneYearStats(yearCalvings, pregnant); return `<div class="preg-stat ratecol2" title="올해 분만우 중 분만 후 81일 안에 수태한 소. 분모는 결과가 난 소(임신중 또는 81일 경과), 아직 81일 안 지난 비임신우 ${oy.pending}두는 보류">
          <div class="preg-stat-num">${oy.n}<span style="font-size:14px;font-weight:700;">두</span></div>
          <div class="preg-stat-label">1년1산 <span class="preg-stat-sub">${oy.base?Math.round(oy.n/oy.base*100):0}% (${oy.n}/${oy.base})${oy.pending?` · 보류 ${oy.pending}`:''}</span></div>
        </div>`; })()}
      </div>
      ${pf!=='all'?`<div class="filter-note">‘${pf==='active'?'임신감정 대상':(pf==='pregnant'?'임신중':yearNow+'년 출산')}’만 보는 중 · <button class="filter-clear" data-action="setPregFilter" data-filter="all">전체 보기</button></div>`:''}
      ${showActive?`<div class="section-title"><span>임신감정 대상 (${active.length}두)</span></div>
      <div class="pregcheck-list">${activeHtml}</div>`:''}
      ${(pf==='all' && waiting.length)?`<div class="section-title" style="margin-top:26px;"><span>수정대기 (${waiting.length}두)</span></div>
      <div class="pregcheck-list">${waitingHtml}</div>`:''}
      ${(pf==='all' && fatten.length)?`<div class="section-title" style="margin-top:26px;"><span>비육전환 (${fatten.length}두)</span></div>
      <div class="pregcheck-list fatten-list">${fattenHtml}</div>`:''}
      ${showPreg?`<div class="section-title" ${showActive?'style="margin-top:26px;"':''}><span>🐄 임신중 (${pregnant.length}두)</span></div>
      <div class="pregcheck-list">${pregnantHtml}</div>`:''}
      ${showCalv?`<div class="section-title calv-title" style="margin-top:26px;">
        <span>🐣 ${yearNow}년 출산 (${yearCalvings.length}두)</span>
        <span class="calv-year-nav">
          <button class="iconbtn" data-action="shiftCalvYear" data-dir="-1" title="이전 해">‹</button>
          ${yearNow!==thisYear?`<button class="iconbtn" data-action="shiftCalvYear" data-dir="0" title="올해로">${thisYear}</button>`:''}
          <button class="iconbtn" data-action="shiftCalvYear" data-dir="1" title="다음 해" ${yearNow>=thisYear?'disabled':''}>›</button>
        </span>
      </div>
      <div class="pregcheck-list">${yearCalvingsHtml}</div>`:''}
    </div>
  `;
}

/* ============================================================
   동기화 시작 적기 — 마지막 초음파 기준 주기일 추정 → 시작일별 기대 수태율
   · 첫 GnRH 배란 반응(Pursley): 황체 1~4일 23%, 5~10일 96%, 11~16일 54%, 17~21일 77%
   · 38일 수태율(Galvão): 황체+배란 42.2, 황체+무배란 37.7, 무황체+배란 27.6, 둘 다 없음 15.4
   · 기능 황체 있음 = 주기 5~17일. 젖소 자료라 절대값은 상대 비교용.
============================================================ */
function syncOvProb(d21){ if(d21<=0) d21=21; if(d21<=4) return .23; if(d21<=10) return .96; if(d21<=16) return .54; return .77; }
function syncClProb(d21){ return (d21>=5 && d21<=17) ? 1 : 0; }
function syncExpectedPAI(d21){
  const ov = syncOvProb(d21), cl = syncClProb(d21);
  return ov*cl*42.2 + (1-ov)*cl*37.7 + ov*(1-cl)*27.6 + (1-ov)*(1-cl)*15.4;
}
function syncStartPlan(animal, recs, horizon){
  let est = estimateCycleToday(animal, recs);
  if(!est || est.lo==null || est.hi==null || !est.baseDate) est = estrusBasedEst(animal, recs);   // 초음파 없으면 발정·수정일 기준
  if(!est) return null;
  horizon = horizon || 14;
  const L = 21;                                   // 주기일은 21일 척도로 정규화돼 있음
  const days = est.days && est.days.length ? est.days : [est.lo];   // 오늘 주기일 후보(균등 가중)
  const today = todayStr();
  const series = [];
  for(let k=0;k<=horizon;k++){
    let sum=0;
    days.forEach(d0 => { const dk = (d0 + k) % L; sum += syncExpectedPAI(dk); });
    series.push({ k, date: addDays(today,k), p: sum/days.length });
  }
  let best = series[0]; series.forEach(x => { if(x.p > best.p + 0.05) best = x; });   // 동률이면 빠른 날
  // 적기 범위: 최고치 -5%p 이내로 이어지는 날들 (best 포함)
  let k0 = best.k, k1 = best.k;
  while(k0 > 0 && series[k0-1].p >= best.p - 5) k0--;
  while(k1 < series.length-1 && series[k1+1].p >= best.p - 5) k1++;
  const win = { k0, k1, from: series[k0].date, to: series[k1].date, open: k1===series.length-1 };
  return { series, best, today: series[0], est, win };
}
/* 적기 범위 표기: 10/09~13, 10/30~11/02, 단일이면 10/09 */
function fmtRange(from, to){
  if(from===to) return fmtShort(from);
  const a = fmtShort(from), b = fmtShort(to);
  return a.slice(0,3)===b.slice(0,3) ? `${a}~${b.slice(3)}` : `${a}~${b}`;
}
/* 초음파 없을 때: 마지막 분만 이후, 63일 이내의 발정일(또는 수정일=발정)로 오늘 주기일 추정 */
function estrusBasedEst(animal, recs){
  if(!recs || !recs.length || (animal && animal.fattening)) return null;
  if(isCurrentlyPregnant(recs)) return null;
  const today = todayStr();
  const lastCalv = dateOnly((animal&&animal.lastCalving)||'') || latestCalvingDate(recs) || '';
  const bases = [];
  recs.forEach(r => {
    const e = dateOnly(r.estrusDate||''), ai = dateOnly(r.aiDate||'');
    if(e) bases.push(e);
    if(ai) bases.push(ai);
  });
  const ok = bases.filter(d => d <= today && (!lastCalv || d >= lastCalv) && daysBetween(d, today) <= 63).sort();
  if(!ok.length) return null;
  const baseDate = ok[ok.length-1];
  const cycleLen = parseInt(animal.cycleLength,10) || 21;
  const elapsed = daysBetween(baseDate, today);
  const day = Math.round((elapsed % cycleLen) * 21 / cycleLen);   // 21일 척도
  return { day, lo:day, hi:day, days:[day], stale:false, cycleLen, elapsed, baseDate, basis:'발정', fromEstrus:true };
}
function syncPlanSpark(plan){
  const max = Math.max(...plan.series.map(x=>x.p)), min = Math.min(...plan.series.map(x=>x.p));
  return `<span class="sync-spark" title="오늘부터 14일, 시작일별 기대 수태율">${plan.series.map(x=>{
    const h = max>min ? 3 + Math.round((x.p-min)/(max-min)*11) : 8;
    return `<i style="height:${h}px" class="${x.k===plan.best.k?'best':''}${x.k===0?' now':''}"></i>`; }).join('')}</span>`;
}
/* 동기화 묶음 제안: 공태 소들을 '같은 날 시작'으로 최대한 묶기
   · 소마다 오늘~21일 시작일별 기대 수태율 곡선 → 자기 최고치에서 -5%p 이내인 날을 '적기 범위'로 봄
   · 가장 많은 소의 적기 범위에 들어가는 날을 고르고(동률이면 빠른 날), 남은 소로 반복 */
function syncGroupPlan(items, tol){
  tol = tol==null ? 5 : tol;
  const H = 21;
  const pool = items.map(it => {
    const plan = syncStartPlan(it.a, it.recs, H);
    if(!plan) return null;
    const bestP = Math.max(...plan.series.map(x=>x.p));
    return { a: it.a, plan, ok: plan.series.map(x => x.p >= bestP - tol) };
  }).filter(Boolean);
  const groups = [];
  let left = pool.slice();
  while(left.length){
    let bestK = -1, bestN = 0;
    for(let k=0;k<=H;k++){ const n = left.filter(c=>c.ok[k]).length; if(n > bestN){ bestN=n; bestK=k; } }
    if(bestK<0){ break; }
    const members = left.filter(c=>c.ok[bestK]);
    left = left.filter(c=>!c.ok[bestK]);
    const avg = members.reduce((a,c)=>a+c.plan.series[bestK].p,0)/members.length;
    // 이 묶음 전원이 적기 범위에 드는 연속 기간
    let k0 = bestK, k1 = bestK;
    while(k0 > 0 && members.every(c=>c.ok[k0-1])) k0--;
    while(k1 < H && members.every(c=>c.ok[k1+1])) k1++;
    // 이 기간을 놓쳤을 때의 다음 기회: 이후 날짜 중 가장 많은 멤버가 적기인 연속 구간
    let alt = null;
    const cnt = k => members.filter(c=>c.ok[k]).length;
    let altN = 0; for(let k=k1+1;k<=H;k++) altN = Math.max(altN, cnt(k));
    if(altN > 0){
      let a0 = k1+1; while(a0<=H && cnt(a0)!==altN) a0++;
      let a1 = a0; while(a1<H && cnt(a1+1)===altN) a1++;
      alt = { from: addDays(todayStr(), a0), to: addDays(todayStr(), a1), n: altN, open: a1===H, k0:a0, k1:a1 };
    }
    groups.push({ k:bestK, k0, k1, date: addDays(todayStr(), bestK), from: addDays(todayStr(), k0), to: addDays(todayStr(), k1), open: k1===H, members, avg, alt });
  }
  groups.sort((x,y)=>x.k-y.k);
  return { groups, unplanned: left };
}
/* 수태율 집계 (owner 지정 시 그 농장, 빈 값이면 전체 농장) */
function pregStatsFor(owner){
  // 수태율: 임신감정(O/X)이 난 라운드 중 '그 라운드의 수정을 내가 한 것'만 집계.
  //   (감정은 감정한 날, 내수정횟수는 수정한 날에 적힐 수 있으므로 — 같은 줄이 아니어도
  //    개체별 날짜순으로 보며 '직전 수정' 기록의 내수정 여부로 내 라운드인지 판정)
  const dkeyP = r => dateOnly(r.examDate || r.aiDate || r.estrusDate || '');
  const inh = r => String((r.inHouseAiCount!=null && r.inHouseAiCount!=='') ? r.inHouseAiCount : (r.inHouseAi||'')).trim();
  const inhN = r => { const n = parseInt(inh(r),10); return isNaN(n) ? 0 : n; };
  const pregOf = r => (r.pregnant||'').trim().toUpperCase();
  const allByAnimal = {};
  DATA.records.filter(r=>!owner || r.owner===owner).forEach(r => { const k=r.owner+'|'+r.animalId; (allByAnimal[k] = allByAnimal[k] || []).push(r); });

  let totalServices = 0, svcSuccess = 0;   // 분모: 내가 수정한 라운드의 감정 수 / 분자: 그중 O
  let fsSuccess = 0, fsTotal = 0;          // 첫수정 수태율
  let concCows = 0, concRounds = 0;        // 수태당 수정횟수: 수태 소가 임신까지 걸린 수정(라운드) 합/수
  Object.values(allByAnimal).forEach(list => {
    list.sort((a,b)=> dkeyP(a).localeCompare(dkeyP(b)));
    // 수정횟수대비 수태율 — 각 감정(O/X)을 직전 수정의 내수정 여부와 연결
    let lastAiMine = null;   // 가장 최근 수정(aiDate)을 내가 했는지
    let roundToConc = 0;     // 이번 임신까지 누적 내수정 라운드(O 나오면 확정·리셋)
    list.forEach(r => {
      if(r.aiDate){
        lastAiMine = inhN(r) >= 1;
        if(lastAiMine) roundToConc++;    // 실제 수정(AI)이 발생할 때마다 라운드 카운트 (진단 유무와 무관)
      }
      const p = pregOf(r);
      if(p==='O' || p==='X'){
        let mine = lastAiMine;
        if(mine===null) mine = inhN(r) >= 1;   // 직전 수정이 없으면 감정 기록 자체의 내수정 사용
        if(mine){
          totalServices++; if(p==='O') svcSuccess++;
          if(p==='O'){ concCows++; concRounds += (roundToConc||1); roundToConc = 0; }  // 임신 성립 → 그 소가 걸린 수정 횟수 확정
        }
      }
    });
    // 첫수정 수태율 — '내수정 1' 실제수정이 분모(결과 난 사이클만), 재수정 없이 O면 성공
    const firstIdx = [];
    list.forEach((r,i)=>{ if(inh(r)==='1' && r.aiDate) firstIdx.push(i); });
    firstIdx.forEach((startI, k) => {
      const endI = (k+1 < firstIdx.length) ? firstIdx[k+1] : list.length;
      const cycle = list.slice(startI, endI);
      const hasResult = cycle.some(r => pregOf(r)==='O' || pregOf(r)==='X');
      if(!hasResult) return;
      fsTotal++;
      const hasReAI = cycle.some(r => inhN(r) >= 2);
      const hasO = cycle.some(r => pregOf(r)==='O');
      if(!hasReAI && hasO) fsSuccess++;
    });
  });
  const rateSvc = totalServices ? Math.round(svcSuccess / totalServices * 100) : 0;
  const avgServices = concCows ? (concRounds / concCows).toFixed(1) : '—';
  const rateFirst = fsTotal ? Math.round(fsSuccess / fsTotal * 100) : 0;
  return { totalServices, svcSuccess, fsSuccess, fsTotal, concCows, concRounds, rateSvc, avgServices, rateFirst };
}
/* ===== 공태관리: 미수정 개체의 다음 발정예정일 모음 ===== */
/* 동기화 프로그램의 예정된 수정(AI)일 — 오늘 이후 가장 이른 것.
   (1) 수동 스케줄(DATA.schedule)의 'AI'  (2) 진료기록의 동기화 단계 syncNType='AI' 둘 다 확인 */
function nextScheduledAiDate(owner, animalId){
  const today = todayStr();
  const dates = [];
  (DATA.schedule||[]).forEach(s => {
    if(s.owner===owner && s.animalId===animalId && (s.note||'').includes('AI')){
      const d = dateOnly(s.date); if(d && d>=today) dates.push(d);
    }
  });
  DATA.records.filter(r=>r.owner===owner && r.animalId===animalId).forEach(rec => {
    for(let i=1;i<=SYNC_STEPS;i++){
      const type = rec['sync'+i+'Type']; const d = dateOnly(rec['sync'+i+'Date']);
      if(type && d && String(type).includes('AI') && d>=today) dates.push(d);
    }
  });
  dates.sort();
  return dates.length ? dates[0] : null;
}
function nextEstrusForAnimal(a, recs){
  const cycleLen = parseInt(a.cycleLength,10) || 21;
  const today = todayStr();
  // 동기화 프로그램이 잡혀 있으면 그 수정(AI) 예정일을 최우선 발정예정일로 사용
  const syncAi = nextScheduledAiDate(a.owner, a.animalId);
  if(syncAi) return { date: syncAi, basis:'동기화', cycleLen };
  const project = (d) => { // 오늘 지난 예정일은 주기 더해 미래로
    let x = dateOnly(d); let guard=0;
    while(x < today && guard++ < 60){ x = addDays(x, cycleLen); }
    return x;
  };
  // 수기 '다음발정일'과 그 출처 기록의 기준일
  // 분만 이전 기록의 다음발정일은 무효. 또 3주기(63일) 넘게 지난 다음발정일을 주기 더해 미는 건 의미 없으니 버림
  const lastCalv = dateOnly(a.lastCalving||'') || latestCalvingDate(recs) || '';
  // 수기 다음발정일은 '실제 발정·수정 기록'이 있고 그 기록이 63일 이내일 때만 인정 (오래된 날짜를 주기로 밀어 만든 예정일은 안 씀)
  const manRec = recs.filter(r => dateOnly(r.nextEstrusDate||'') && (dateOnly(r.estrusDate||'') || dateOnly(r.aiDate||'')))
    .filter(r => { const b = dateOnly(r.estrusDate || r.aiDate); return (!lastCalv || b >= lastCalv) && daysBetween(b, today) <= 63; })
    .sort((x,y)=> dateOnly(y.nextEstrusDate).localeCompare(dateOnly(x.nextEstrusDate)))[0];
  const manual = manRec ? dateOnly(manRec.nextEstrusDate) : '';
  const manualBase = manRec ? dateOnly(manRec.estrusDate || manRec.aiDate || '') : '';
  // 발정주기 추정
  const est = estimateCycleToday(a, recs);
  const estOk = est && typeof est.day==='number' && est.baseDate;
  const estDate = () => addDays(today, (est.cycleLen - est.day) % est.cycleLen);
  // 추정 기준(초음파 등)이 수기 다음발정일의 출처보다 최근이면 추정을 우선 — 최신 진료 반영
  if(estOk && (!manual || est.baseDate > manualBase)) return { date: estDate(), basis:'추정', cycleLen: est.cycleLen };
  if(manual) return { date: project(manual), basis:'수기', cycleLen };
  if(estOk) return { date: estDate(), basis:'추정', cycleLen: est.cycleLen };
  return null; // 정보없음
}
function renderOpenView(){

    const hasCalvingRec = !!dateOnly(a.lastCalving||'') || (parseInt(a.parity,10) > 0);
    if(!a.fattening && recs.length===0 && !hasCalvingRec){ noRecord.push({ a }); return; }
    const st = shareAnimalStatus(owner, a).status;
    // 공태(빈 자궁) 대상: 미수정 + 비임신(재수정 대기). 임신중/비육전환/감정대기 제외

          ${isAdmin()&&g.members.some(c=>!inSyncSet.has(c.a.animalId))?`<button class="btn secondary small open-group-btn" data-action="openSyncBatchGroup" data-date="${g.date}" data-ids="${esc(g.members.filter(c=>!inSyncSet.has(c.a.animalId)).map(c=>c.a.animalId).join('|'))}">일괄 입력</button>`:''}</div>
        <div class="open-group-ids">${chips(g.members)}</div>
        ${g.alt?`<div class="open-group-alt">놓치면 다음: <b>${fmtShort(g.alt.from)}(${weekdayKr(g.alt.from)})${g.alt.k0!==g.alt.k1?'~'+(g.alt.open?'':(fmtShort(g.alt.to).slice(0,3)===fmtShort(g.alt.from).slice(0,3)?fmtShort(g.alt.to).slice(3):fmtShort(g.alt.to))+'('+weekdayKr(g.alt.to)+')'):''}</b> · ${g.alt.n}/${g.members.length}두 적기</div>`:''}

/* 개체번호에서 정렬용 숫자 키 (마지막 숫자그룹) */

function renderDiseaseView(){
  const dkey = r => dateOnly(r.examDate || r.aiDate || r.estrusDate || '');
  const allDiseaseRecs = DATA.records
    .filter(r => r.owner===UI.owner && (((r.uterineDisease||'').trim()) || ((r.ovarianDisease||'').trim()) || recHasCyst(r)))
    .sort((a,b)=> (dkey(b)||'').localeCompare(dkey(a)||''));

  // 호전된 개체는 목록에서 제외 (표시만 제외, 데이터는 보존)
  // 호전 정의: 가장 최근 진료에서 낭종 없음, 또는 자궁질환이 치료완료 처리됨
  const isImprovedRec = r => {

    // 낭종 기록인데 최신 진료에 낭종 없음 → 호전
    if(hasCyst && latest && !recHasCyst(latest)) return true;
    // 자궁질환: 이 기록 또는 이후(같은 날 포함) 진료에서 '치료완료' 체크되면 호전
    if(hasUt){
      const rDate = dkey(r);
      if(r.uterineResolved) return true;
      if(animalRecords(r.animalId).some(x => x.uterineResolved && dkey(x) >= rDate)) return true;
    }
    return false;
  };
  const recs = allDiseaseRecs.filter(r => !isImprovedRec(r));

  // 같은 개체는 최신 기록 1건만 (allDiseaseRecs가 이미 최신순 정렬이라 첫 등장분만 유지)
  const seenAnimal = new Set();
  const latestOnlyRecs = recs.filter(r => {
    if(seenAnimal.has(r.animalId)) return false;
    seenAnimal.add(r.animalId);
    return true;
  });

  const uterineCount = latestOnlyRecs.filter(r => (r.uterineDisease||'').trim()).length;
  const ovaryCount   = latestOnlyRecs.filter(r => (r.ovarianDisease||'').trim() || recHasCyst(r)).length;
  const animalsSet   = new Set(latestOnlyRecs.map(r=>r.animalId));

  const df = UI.diseaseFilter || 'all';   // all | uterine | ovary
  const matchFilter = r => {
    if(df==='all') return true;
    const hasUt = (r.uterineDisease||'').trim();
    if(df==='uterine') return hasUt;
    if(df==='ovary') return (r.ovarianDisease||'').trim() || recHasCyst(r);
    return true;
  };
  const filteredRecs = latestOnlyRecs.filter(matchFilter);

  const rows = filteredRecs.map(r => {
    const d = dkey(r);
    const tags = [];
    if((r.uterineDisease||'').trim()){
      tags.push(`<span class="disease-tag uterine">${esc(r.uterineDisease.trim())}</span>`);
    }
    if((r.ovarianDisease||'').trim()){
      tags.push(`<span class="disease-tag ovary">${esc(r.ovarianDisease.trim())}</span>`);
    } else if(recHasCyst(r)){
      tags.push(`<span class="disease-tag ovary">${esc(cystType(r))}</span>`);
    }
    return `
    <div class="disease-row" data-action="editRecord" data-id="${esc(r.id)}">
      <span class="tag-chip" data-animal-id="${esc(r.animalId)}">${esc(r.animalId)}</span>
      <span class="disease-date">${d?fmtShort(d):'—'}</span>
      <span class="disease-tags">${tags.join('')}</span>
      <button class="iconbtn sched-add-btn" data-action="addAnimalToSchedule" data-id="${esc(r.animalId)}" data-stop="1" title="스케줄에 추가">${svgIcon('calendar',14)}</button>
    </div>`;
  }).join('') || `<div class="empty-state">등록된 질환 기록이 없어요.</div>`;

  return `
    <div class="panel">
      <div class="preg-summary disease-three">
        <div class="preg-stat">
          <div class="preg-stat-num">${animalsSet.size}</div>
          <div class="preg-stat-label">질환 개체</div>
        </div>
        <div class="preg-stat ratecol clickable ${df==='uterine'?'sel':''}" data-action="setDiseaseFilter" data-filter="uterine">
          <div class="preg-stat-num">${uterineCount}</div>
          <div class="preg-stat-label">자궁질환</div>
        </div>
        <div class="preg-stat ratecol2 clickable ${df==='ovary'?'sel':''}" data-action="setDiseaseFilter" data-filter="ovary">
          <div class="preg-stat-num">${ovaryCount}</div>
          <div class="preg-stat-label">난소질환</div>
        </div>
      </div>
      ${df!=='all'?`<div class="filter-note">필터 적용 중 · <button class="filter-clear" data-action="setDiseaseFilter" data-filter="all">전체 보기</button></div>`:''}
      <div class="section-title"><span>질환 기록 (${filteredRecs.length}건)</span></div>
      <div class="pregcheck-list">${rows}</div>
    </div>
  `;
}

const OVARY_TYPES = ['난포','황체','낭종','소난포들'];
let ovaryState = {};   // { ultraOvaryL:{items,type,free}, ultraOvaryR:{...} }
function parseOvary(val){
  const items=[]; const leftover=[];
  String(val||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    let matched=false;
    for(const t of OVARY_TYPES){
      // 소난포들: 크기 없음, 뒤에 비고 가능
      if(t==='소난포들'){
        const m0 = part.match(/^소난포들(?:\s+(.+))?$/);
        if(m0){ items.push({type:t,size:'',note:(m0[1]||'').trim()}); matched=true; break; }
        continue;
      }
      const m = part.match(new RegExp('^'+t+'\\s*(\\d+(?:\\.\\d+)?)\\s*mm(?:\\s+(.+))?$'));
      if(m){ items.push({type:t,size:m[1],note:(m[2]||'').trim()}); matched=true; break; }
    }
    if(!matched) leftover.push(part);
  });
  return { items, free: leftover.join(', ') };
}
function ovaryCombined(key){
  const st = ovaryState[key]; if(!st) return '';
  const parts = st.items.map(it => {
    let s = it.type;
    if(it.size) s += ' ' + it.size + 'mm';
    if(it.note) s += ' ' + it.note;
    return s;
  });
  if(st.free && st.free.trim()) parts.push(st.free.trim());
  return parts.join(', ');
}

/* ---------- 동기화 템플릿 ----------
   내장 프로토콜(SYNC_PROTOCOLS) + 사용자 저장 템플릿(DATA.syncTemplates).
   steps: [{type, offset(1번 기준 일수), time, dose}]
   · 기록 저장 시 사용한 시간·용량을 그 프로토콜 이름으로 기억 → 다음에 버튼 한 번으로 전부 채움 */
function syncTemplates(){
  if(!DATA.syncTemplates) DATA.syncTemplates = {};
  const out = [];
  Object.keys(SYNC_PROTOCOLS).forEach(n => {
    const p = SYNC_PROTOCOLS[n];
    const saved = DATA.syncTemplates[n];
    out.push({ name:n, builtin:true, steps: p.steps.map((t,i)=>{
      const sv = (saved && saved.steps && saved.steps[i]) || {};
      return { type:t, offset:p.offsets[i], time:sv.time||'', dose:sv.dose||'' };
    }) });
  });
  Object.keys(DATA.syncTemplates).filter(n=>!SYNC_PROTOCOLS[n]).forEach(n => {
    const t = DATA.syncTemplates[n];
    if(t && Array.isArray(t.steps) && t.steps.length) out.push({ name:n, builtin:false, steps:t.steps });
  });
  return out;
}
function getSyncTemplate(name){ return syncTemplates().find(t=>t.name===name) || null; }
function syncProtoRowHtml(){
  const tpls = syncTemplates();
  const hasCustom = tpls.some(t=>!t.builtin);
  return `<div class="sync-proto-row" id="sync-proto-row">
        <span class="sync-proto-label">프로토콜:</span>
        ${tpls.map(t=>`<button type="button" class="sync-proto-btn ${t.builtin?'':'custom'}" data-action="applySyncProtocol" data-name="${esc(t.name)}">${esc(t.name)}</button>`).join('')}
        <button type="button" class="sync-proto-btn clear" data-action="clearSyncSteps">초기화</button>
        <button type="button" class="sync-proto-btn clear" data-action="saveSyncTemplate" title="지금 입력한 단계(종류·간격·시간·용량)를 새 템플릿으로 저장">템플릿 저장</button>
        ${hasCustom?`<button type="button" class="sync-proto-btn clear" data-action="manageSyncTemplates">템플릿 관리</button>`:''}
      </div>
      <div class="sync-alltime"><span class="sync-proto-label">시간 일괄:</span><input type="time" id="f_syncAllTime"><button type="button" data-action="syncApplyAllTime">모든 단계에 적용</button></div>`;
}
/* 용량 표시: 숫자만 저장돼 있으면 ml 붙여서 */
function doseText(d){ d = String(d==null?'':d).trim(); if(!d) return ''; return /^\d+(\.\d+)?$/.test(d) ? d+'ml' : d; }
function readSyncStepsFromForm(){
  const steps = [];
  for(let i=1;i<=SYNC_STEPS;i++){
    const g = id => document.getElementById(id);
    const typeEl = g('f_sync'+i+'Type'); if(!typeEl) break;
    steps.push({ type: typeEl.value, date: (g('f_sync'+i+'Date')||{value:''}).value, time: (g('f_sync'+i+'Time')||{value:''}).value, dose: ((g('f_sync'+i+'Dose')||{value:''}).value||'').trim() });
  }
  return steps;
}
function syncStepsToTemplate(steps){
  const used = steps.filter(s=>s.type);
  if(!used.length) return null;
  const base = used[0].date || steps.find(s=>s.date)?.date || '';
  return { steps: used.map(s=>({ type:s.type, offset: (base && s.date) ? daysBetween(base, s.date) : 0, time:s.time||'', dose:s.dose||'' })) };
}
/* 기록 저장 시: 적용된 프로토콜(또는 종류 순서가 같은 템플릿)에 시간·용량 기억 */
function rememberSyncUsage(steps){
  const used = steps.filter(s=>s.type);
  if(!used.length) return;
  let name = UI.activeSyncProtocol;
  if(!name){
    const m = syncTemplates().find(t => t.steps.length===used.length && t.steps.every((st,i)=>st.type===used[i].type));
    if(m) name = m.name;
  }
  if(!name) return;
  const tpl = syncStepsToTemplate(steps); if(!tpl) return;
  if(!DATA.syncTemplates) DATA.syncTemplates = {};
  if(SYNC_PROTOCOLS[name]){
    const p = SYNC_PROTOCOLS[name];
    if(tpl.steps.length!==p.steps.length || !tpl.steps.every((st,i)=>st.type===p.steps[i])) return;
    DATA.syncTemplates[name] = { steps: tpl.steps.map((st,i)=>({ type:st.type, offset:p.offsets[i], time:st.time, dose:st.dose })) };
  } else {
    DATA.syncTemplates[name] = tpl;
  }
}
/* 프로토콜 버튼: 종류·시간·용량 채우고, 1번 날짜가 있으면 오프셋 날짜 자동 계산 */
function applySyncProtocol(name){
  const t = getSyncTemplate(name);
  if(!t) return;
  for(let i=1;i<=SYNC_STEPS;i++){
    const typeEl = document.getElementById('f_sync'+i+'Type');
    const dateEl = document.getElementById('f_sync'+i+'Date');
    const timeEl = document.getElementById('f_sync'+i+'Time');
    const doseEl = document.getElementById('f_sync'+i+'Dose');
    if(!typeEl) continue;
    const st = t.steps[i-1];
    if(st){
      typeEl.value = st.type;
      if(timeEl) timeEl.value = st.time||'';

function drawSchedImage(owner, rows){
  const W = 760, S = 2, PAD = 28;
  const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif';
  const MONO = '"SF Mono", Menlo, Consolas, monospace';
  const groups = []; let last=null;
  rows.forEach(r=>{ if(!last || last.date!==r.date){ last={date:r.date, items:[]}; groups.push(last); } last.items.push(r); });
  const ROW=38, GH=44, GGAP=14, HEAD=112, FOOT=56;
  const H = HEAD + (groups.length ? groups.reduce((a,g)=>a+GH+g.items.length*ROW+GGAP,0) : 80) + FOOT;
  const c = document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const x = c.getContext('2d'); x.scale(S,S);
  const rr = (px,py,w,h,r,fill,stroke)=>{ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); if(fill){x.fillStyle=fill;x.fill();} if(stroke){x.strokeStyle=stroke;x.lineWidth=1;x.stroke();} };
  x.fillStyle='#F3F5F6'; x.fillRect(0,0,W,H);
  // 헤더
  x.fillStyle='#00A69C'; x.fillRect(0,0,W,HEAD-24);
  x.fillStyle='#fff'; x.font=`800 26px ${FONT}`; x.textBaseline='middle';
  x.fillText(`${owner}님 농장 처치 일정`, PAD, 36);
  x.font=`600 14px ${FONT}`; x.globalAlpha=.9;
  x.fillText(`기준일 ${fmtShort(todayStr())} (${weekdayKr(todayStr())}) · 날짜에 맞춰 주사·수정을 진행해 주세요`, PAD, 66);
  x.globalAlpha=1;
  let y = HEAD;
  if(!groups.length){
    rr(PAD,y,W-PAD*2,56,12,'#fff','#E2E5E8'); x.fillStyle='#6B6862'; x.font=`600 15px ${FONT}`; x.textAlign='center'; x.fillText('예정된 처치 일정이 없어요.', W/2, y+28); x.textAlign='left';
  }
  groups.forEach(g=>{
    const gh = GH + g.items.length*ROW;
    const n = daysBetween(todayStr(), g.date);
    const isToday = n===0;
    rr(PAD, y, W-PAD*2, gh, 14, isToday?'#E3F4F1':'#fff', isToday?'#00A69C':'#E2E5E8');
    const dateTxt = `${fmtShort(g.date)} (${weekdayKr(g.date)})`;
    x.fillStyle='#23211E'; x.font=`800 19px ${FONT}`;
    x.fillText(dateTxt, PAD+18, y+23);
    const dw = x.measureText(dateTxt).width;
    x.font=`800 14px ${FONT}`; x.fillStyle = isToday ? '#008275' : (n<=2 ? '#C0392B' : '#2E70D6');
    x.fillText(isToday ? '오늘' : `D-${n}`, PAD+18+dw+12, y+24);
    x.strokeStyle='#EEF1F3'; x.beginPath(); x.moveTo(PAD+18, y+GH-6); x.lineTo(W-PAD-18, y+GH-6); x.stroke();
    let ry = y + GH;
    g.items.forEach((it,i)=>{
      if(i>0){ x.strokeStyle='#F3F5F6'; x.beginPath(); x.moveTo(PAD+18, ry); x.lineTo(W-PAD-18, ry); x.stroke(); }
      x.fillStyle='#23211E'; x.font=`700 17px ${MONO}`; x.fillText(it.id, PAD+18, ry+ROW/2);
      x.font=`800 15px ${FONT}`; const tw = x.measureText(it.note).width + 26;
      rr(W-PAD-18-tw, ry+6, tw, ROW-12, 8, isToday?'#00A69C':'#F7F9FA', isToday?null:'#E2E5E8');
      x.fillStyle = isToday ? '#fff' : '#008275'; x.fillText(it.note, W-PAD-18-tw+13, ry+ROW/2);
      ry += ROW;
    });
    y += gh + GGAP;
  });
  x.fillStyle='#6B6862'; x.font=`600 12px ${FONT}`; x.textAlign='center';
  x.fillText('담당 수의사가 공유한 일정입니다 · 날짜·시간 변경은 수의사에게 문의', W/2, H-FOOT/2); x.textAlign='left';
  return c;
}

function parseDT(str){

/* ============================================================
   백신관리 — 접종 로그 + 다음 접종일 자동 계산
   로그: {id, owner, animalId, vaccine:'resp'|'diarrhea', dose:'1차'|'2차'|'보강', date}
   ============================================================ */
const VAC_LABEL = { resp:'호흡기', diarrhea:'설사' };
function vaccineLogsFor(owner, animalId, vaccine){
  return (DATA.vaccineLogs||[])
    .filter(v=>v.owner===owner && v.animalId===animalId && (!vaccine || v.vaccine===vaccine))
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}
function currentAiDate(recs){
  const ai = recs.filter(r=>r.aiDate).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x))[0];
  return ai ? dateOnly(ai.aiDate) : '';
}
function currentExpectedCalving(recs){
  const withC = recs.filter(r=>dateOnly(r.expectedCalving||'')).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x));
  if(withC.length) return dateOnly(withC[0].expectedCalving);
  const ai = currentAiDate(recs);
  return ai ? addDays(ai, 285) : '';
}
// 호흡기: 개체별·접종일 기준 (1차 수동 → 2주 후 2차 → 매년 보강)
function nextRespVaccine(owner, a){
  const logs = vaccineLogsFor(owner, a.animalId, 'resp');
  if(logs.length===0) return null;                                  // 1차는 수동 시작
  const last = logs[logs.length-1];
  if(logs.length===1 && last.dose==='1차') return { vaccine:'resp', dose:'2차', date: addDays(last.date, 14) };
  return { vaccine:'resp', dose:'보강', date: addDays(last.date, 365) };
}
// 설사: 임신 개체·분만예정일 역산 (첫 임신우 -49/-28, 이후 임신 보강 -28)
function nextDiarrheaVaccine(owner, a, recs){
  if(!isCurrentlyPregnant(recs)) return null;
  const expCalv = currentExpectedCalving(recs);
  if(!expCalv) return null;
  const aiStart = currentAiDate(recs);
  const logs = vaccineLogsFor(owner, a.animalId, 'diarrhea');
  const prior = logs.filter(v => aiStart && v.date < aiStart);       // 이전 임신 때 접종
  const thisCycle = logs.filter(v => !aiStart || v.date >= aiStart); // 이번 임신 접종
  if(prior.length===0){
    if(thisCycle.length===0) return { vaccine:'diarrhea', dose:'1차', date: addDays(expCalv, -49) };
    if(thisCycle.length===1) return { vaccine:'diarrhea', dose:'2차', date: addDays(expCalv, -28) };
    return null;
  }
  if(thisCycle.length===0) return { vaccine:'diarrhea', dose:'보강', date: addDays(expCalv, -28) };
  return null;
}
function vaccineItemsForOwner(owner){
  const items = [];
  ownerAnimalsFor(owner).filter(a=>!a.archived).forEach(a=>{
    const recs = animalRecords(a.animalId);
    const nr = nextRespVaccine(owner, a);
    const nd = nextDiarrheaVaccine(owner, a, recs);
    if(nr) items.push({ animalId:a.animalId, ...nr });
    if(nd) items.push({ animalId:a.animalId, ...nd });
  });
  items.sort((x,y)=> (x.date||'').localeCompare(y.date||''));
  return items;
}

  const rows = items.map(it=>{
    const dd = daysBetween(today, it.date);
    const ddText = dd===0 ? '오늘' : (dd>0 ? `D-${dd}` : `<span class="vac-over">${-dd}일 지남</span><span class="vac-over-s">+${-dd}일</span>`);
    const ddColor = dd<0 ? 'var(--overdue-days-text)' : (dd<=3 ? 'var(--accent)' : 'var(--primary-dark)');
    const vcls = it.vaccine==='resp' ? 'uterine' : 'ovary';
    return `
    <div class="disease-row vac-row">
      <span class="tag-chip" data-animal-id="${esc(it.animalId)}">${esc(it.animalId)}</span>
      <span class="disease-tags vac-tags"><span class="disease-tag ${vcls}">${VAC_LABEL[it.vaccine]} ${it.dose}</span></span>

    </div>`;
  }).join('') || `<div class="empty-state">예정된 백신이 없어요. 호흡기 1차는 아래 버튼으로 시작하세요.</div>`;
  return `

      <div class="open-head"><h2>백신관리</h2><span class="open-count">${items.length}건 예정</span></div>

        설사: 첫 임신우는 분만예정 −7주(1차)·−4주(2차), 이후 임신은 분만예정 −4주 보강.

function actionCalcInterval(silent){
  const sd = combineDT(document.getElementById('f_estrusDate_date').value, document.getElementById('f_estrusDate_time').value);
  const ad = combineDT(document.getElementById('f_aiDate_date').value, document.getElementById('f_aiDate_time').value);
  if(!sd || !ad){ if(!silent) toast('발정일시와 수정일시를 먼저 입력해주세요.'); return; }
  const t1 = parseDT(sd), t2 = parseDT(ad);
  let diffMin = Math.round((t2-t1)/60000);
  const neg = diffMin<0; diffMin = Math.abs(diffMin);
  const days = Math.floor(diffMin/1440), hours = Math.floor((diffMin%1440)/60), mins = diffMin%60;
  const parts = [];
  if(days) parts.push(days+'일');
  if(hours) parts.push(hours+'시간');
  if(!days && mins) parts.push(mins+'분');
  document.getElementById('f_aiInterval').value = (neg?'-':'') + (parts.join(' ') || '0분');
}

function actionSaveRecord(){
  const owner = modalCtx.owner;
  const animalId = (modalCtx.presetAnimalId || (document.getElementById('f_animalId')||{}).value || '').trim();
  if(!animalId){ toast('개체번호를 입력해주세요.'); return; }
  const g = id => document.getElementById(id);
  const rec = {
    id: modalCtx.id || uid(owner+'-rec'),
    owner, animalId,
    examDate: combineDT(g('f_examDate_date').value, g('f_examDate_time').value),
    estrusDate: combineDT(g('f_estrusDate_date').value, g('f_estrusDate_time').value),
    aiDate: combineDT(g('f_aiDate_date').value, g('f_aiDate_time').value),
    doubleAi: (g('f_doubleAi')||{value:''}).value==='1',
    aiDate2: ((g('f_doubleAi')||{value:''}).value==='1') ? combineDT((g('f_aiDate2_date')||{value:''}).value, (g('f_aiDate2_time')||{value:''}).value) : null,
    aiInterval: g('f_aiInterval').value.trim(),
    nextEstrusDate: g('f_nextEstrusDate').value || null,
    expectedCalving: g('f_expectedCalving').value || null,
    expectedCycle: g('f_expectedCycle').value.trim(),
    pregnant: g('f_pregnant').value.trim(),
    pregnant2: (g('f_pregnant2')||{value:''}).value.trim(),
    fetalSex: (g('f_fetalSex')||{value:''}).value.trim(),
    calvingDate: (g('f_calvingDate')||{value:''}).value || null,
    calfSex: (g('f_calfSex')||{value:''}).value.trim(),
    stillbirthDate: (g('f_stillbirthDate')||{value:''}).value || null,
    estrusVulvar: g('f_estrusVulvar').value.trim(),
    estrusMucus: g('f_estrusMucus').value.trim(),
    estrusContraction: g('f_estrusContraction').value.trim(),
    estrusMT: (g('f_estrusMT')||{value:''}).value.trim(),
    estrusST: (g('f_estrusST')||{value:''}).value.trim(),
    estrusOther: g('f_estrusOther').value.trim(),
    rectalUterus: g('f_rectalUterus').value.trim(),
    rectalHorn: modalCtx.legacy.rectalHorn,
    rectalOvaryL: g('f_rectalOvaryL').value.trim(),
    rectalOvaryR: g('f_rectalOvaryR').value.trim(),
    ultraUterus: g('f_ultraUterus').value.trim(),
    ultraHorn: modalCtx.legacy.ultraHorn,
    ultraOvaryL: g('f_ultraOvaryL').value.trim(),
    ultraOvaryR: g('f_ultraOvaryR').value.trim(),
    uterineDisease: (g('f_uterineDisease')||{value:''}).value.trim(),
    uterineResolved: !!((g('f_uterineResolved')||{}).checked),
    ovarianDisease: (g('f_ovarianDisease')||{value:''}).value.trim(),
    estrusSign: modalCtx.legacy.estrusSign,
    rectalExam: modalCtx.legacy.rectalExam,
    ultrasound: modalCtx.legacy.ultrasound,
    hormoneTreatment: g('f_hormoneTreatment').value.trim(),
    notes: g('f_notes').value.trim(),
    recordParity: modalCtx.legacy.recordParity,
    aiCount: g('f_aiCount').value.trim(),
    inHouseAiCount: g('f_inHouseAiCount').value.trim(),
    kpn: g('f_kpn').value.trim(),
    aiOrder: modalCtx.legacy.aiOrder,
    inHouseAi: modalCtx.legacy.inHouseAi,
    carcass: modalCtx.legacy.carcass,
    ribeye: modalCtx.legacy.ribeye,
    backfat: modalCtx.legacy.backfat,
    marbling: modalCtx.legacy.marbling,
  };
  for(let i=1;i<=SYNC_STEPS;i++){
    rec['sync'+i+'Type'] = g('f_sync'+i+'Type').value;
    rec['sync'+i+'Date'] = combineDT(g('f_sync'+i+'Date').value, g('f_sync'+i+'Time').value);
    rec['sync'+i+'Dose'] = rec['sync'+i+'Type'] ? ((g('f_sync'+i+'Dose')||{value:''}).value||'').trim() : '';
  }
  rememberSyncUsage(readSyncStepsFromForm());
  ensureAnimalExists(owner, animalId);
  registerSyncSchedule(owner, animalId, rec);
  const prevRec = DATA.records.find(x=>x.id===rec.id);
  const oldCalv = prevRec ? dateOnly(prevRec.calvingDate||'') : '';
  const newCalv = dateOnly(rec.calvingDate||'');
  const oldAi = prevRec ? (prevRec.aiDate||'') : '';
  const newAi = rec.aiDate || '';
  const idx = DATA.records.findIndex(x=>x.id===rec.id);
  // 자동 +1 기준값은 '이 기록을 제외한' 현재 수정횟수
  const baseAiCount = (()=>{
    const animal = DATA.animals.find(a=>a.owner===owner && a.animalId===animalId);
    if(!animal) return 0;
    return currentAiCount(animal, DATA.records.filter(r=>r.owner===owner && r.animalId===animalId && r.id!==rec.id));
  })();
  if(idx>-1) DATA.records[idx] = rec; else DATA.records.push(rec);

  // 분만일 자동 처리: 분만일이 '새로' 들어오면 산차 +1, 최근분만일 자동 갱신
  let parityBumped = false, aiBumped = false;
  if(newCalv){
    const animal = DATA.animals.find(a=>a.owner===owner && a.animalId===animalId);
    if(animal){
      if(!oldCalv){                                  // 빈 값 → 분만일 입력 (신규 분만)
        const p = parseInt(animal.parity,10);
        animal.parity = String((isNaN(p)?0:p) + 1);
        animal.aiCountCurrent = '0';                  // 분만하면 수정횟수 리셋 (다음 수정부터 0)
        parityBumped = true;
      }
      const latest = latestCalvingDate(DATA.records.filter(r=>r.owner===owner && r.animalId===animalId));
      if(latest) animal.lastCalving = latest;        // 최근분만일 = 기록 중 가장 최근 분만일
    }
  }
  // 수정일(aiDate)이 '새로' 들어오면 현재 수정횟수 자동 +1 (같은 저장에서 분만 리셋이 일어나면 제외)
  if(newAi && !oldAi && !(newCalv && !oldCalv)){
    const animal = DATA.animals.find(a=>a.owner===owner && a.animalId===animalId);
    if(animal){ animal.aiCountCurrent = String(baseAiCount + 1); aiBumped = true; }
  }
  saveState();
  closeModal();
  UI.selectedAnimal = animalId;
  renderMain();
  const msgs = [];

function actionSaveAnimal(){
  const owner = modalCtx.owner;
  const newId = document.getElementById('f_animalId').value.trim();
  if(!newId){ toast('개체번호를 입력해주세요.'); return; }
  const oldId = modalCtx.originalId;
  const dup = DATA.animals.find(a=>a.owner===owner && a.animalId===newId && a.animalId!==oldId);
  if(dup){ toast('이미 존재하는 개체번호예요.'); return; }
  const fields = {
    breed: (document.getElementById('f_breed')||{}).value || '한우',
    sire: document.getElementById('f_sire').value.trim(),
    damSire: document.getElementById('f_damSire').value.trim(),
    damDamSire: document.getElementById('f_damDamSire').value.trim(),
    birth: document.getElementById('f_birth').value || null,
    parity: document.getElementById('f_parity').value.trim(),
    lastCalving: document.getElementById('f_lastCalving').value || null,
    aiDifficulty: document.getElementById('f_aiDifficulty').value,
    aiDifficultyNote: document.getElementById('f_aiDifficultyNote').value.trim(),
    waveMode: (document.getElementById('f_waveMode')||{}).value || '2',
    cycleLength: (document.getElementById('f_cycleLength')||{}).value.trim() || '21',
    manualCycleDay: (document.getElementById('f_manualCycleDay')||{}).value.trim(),
    aiCountCurrent: (document.getElementById('f_aiCountCurrent')||{}).value.trim(),
  };
  if(oldId===null){
    DATA.animals.push({ animalId:newId, owner, ...fields });
    UI.selectedAnimal = newId;
  } else {
    const a = DATA.animals.find(x=>x.owner===owner && x.animalId===oldId);
    Object.assign(a, fields);
    if(newId!==oldId){
      a.animalId = newId;
      DATA.records.forEach(r=>{ if(r.owner===owner && r.animalId===oldId) r.animalId=newId; });
      DATA.schedule.forEach(s=>{ if(s.owner===owner && s.animalId===oldId) s.animalId=newId; });
      const sidx = DATA.scheduleAnimals[owner].indexOf(oldId);
      if(sidx>-1) DATA.scheduleAnimals[owner][sidx]=newId;
      if(UI.selectedAnimal===oldId) UI.selectedAnimal=newId;
    }
  }
  saveState();
  closeModal();
  renderMain();
  toast('개체정보를 저장했어요.');
}

function allOwnersScheduleHtml(){
  const today = todayStr();
  // 개체별 스케줄과 동일한 규칙(scheduleRowsForOwner): 자동개체 포함·숨긴칸 제외·축주별 설정 범위
  const allRows = [];
  DATA.owners.forEach(owner => {
    scheduleRowsForOwner(owner).forEach(r => { if(r.date >= today) allRows.push({ ...r, owner }); });
  });
  // 날짜·축주·할일이 같으면 개체번호를 한 줄로 묶어서 나열
  const groups = {}; const order = [];
  allRows.forEach(row => {
    const key = row.date+'|'+row.owner+'|'+row.note;
    if(!groups[key]){ groups[key] = { date:row.date, owner:row.owner, note:row.note, isAuto:row.isAuto, aids:[] }; order.push(key); }
    groups[key].aids.push(row.aid);
    if(!row.isAuto) groups[key].isAuto = false; // 하나라도 수기면 그룹 전체를 수기로 취급
  });
  const groupRows = order.map(k=>groups[k]);
  groupRows.sort((a,b)=>a.date.localeCompare(b.date)||a.owner.localeCompare(b.owner)||a.note.localeCompare(b.note));
  if(!groupRows.length) return `<div class="empty-state">표시할 스케줄이 없어요.</div>`;
  const MAX_AID = 4; // 이보다 많으면 중략
  let html = '';
  let lastDate = '';
  groupRows.forEach(g => {
    if(g.date !== lastDate){
      lastDate = g.date;
      const isToday = g.date === today;
      html += `<div class="allsched-date ${isToday?'allsched-today':''}">${g.date} (${weekdayKr(g.date)})</div>`;
    }
    const done = g.aids.every(aid => isCellDone(g.owner, aid, g.date));
    const skipped = g.aids.every(aid => isCellSkipped(g.owner, aid, g.date));
    const aidLabels = g.aids.map(aid => {
      const p = (aid||'').trim().split(/\s+/);
      return p.length>=4 ? p[2]+' '+p[3] : aid;
    });
    const aidText = aidLabels.length > MAX_AID
      ? aidLabels.slice(0, MAX_AID).join(', ') + ` 외 ${aidLabels.length-MAX_AID}두`
      : aidLabels.join(', ');
    html += `<div class="allsched-item ${done?'done':''} ${skipped?'skipped':''} ${g.isAuto?'auto':''}">
      <div class="as-main">
        <div class="as-top">
          <span class="allsched-owner">${esc(g.owner)}</span>
          <span class="allsched-note">${esc(g.note)}${g.isAuto?' <span style="font-size:10px;font-weight:600;opacity:.7;">(자동)</span>':''}</span>
        </div>
        <span class="allsched-aids" title="${esc(g.aids.join(', '))}">🐄 ${esc(aidText)}</span>
      </div>
    </div>`;
  });
  return html;
}

function exportData(){
  try{
    const payload = JSON.stringify(DATA, null, 2);
    const blob = new Blob([payload], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `번식기록부_백업_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('백업 파일을 내려받았어요.');
  }catch(e){ console.error(e); toast('백업 내보내기에 실패했어요.'); }
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || !Array.isArray(obj.owners) || !Array.isArray(obj.animals) || !Array.isArray(obj.records)){
        toast('형식이 올바른 백업 파일이 아니에요.'); return;
      }
      const cnt = `축주 ${obj.owners.length} · 개체 ${obj.animals.length} · 기록 ${obj.records.length}`;
      if(!confirm(`이 백업으로 현재 데이터를 모두 교체할까요?\n(${cnt})\n현재 내용은 사라집니다.`)) return;
      DATA = obj;
      SAVE_LOCKED = false;                 // 복원하면 저장 잠금 해제
      DATA.owners.forEach(ensureOwnerMeta);
      if(!DATA.owners.includes(UI.owner)) UI.owner = DATA.owners[0];
      saveState();
      applyTheme();
      const banner = document.getElementById('load-error-banner'); if(banner) banner.remove();
      closeModal();
      render();
      toast('백업을 복원했어요.');
    }catch(e){ console.error(e); toast('파일을 읽지 못했어요.'); }
  };
  reader.readAsText(file);
}

/* 축주 이름 변경 — 이름이 키로 쓰이는 모든 곳을 함께 이전 */
function renameOwnerTo(oldName, newName){
  newName = (newName||'').trim();
  if(!newName){ toast('이름을 입력해주세요.'); return false; }
  if(newName===oldName) return false;
  if(DATA.owners.includes(newName)){ toast('이미 있는 축주 이름이에요.'); return false; }
  const i = DATA.owners.indexOf(oldName);
  if(i<0){ toast('축주를 찾지 못했어요.'); return false; }
  DATA.owners[i] = newName;                                        // 1) 축주 목록
  ['animals','records','schedule','vaccineLogs'].forEach(k=>{      // 2) owner 필드를 가진 자료
    (DATA[k]||[]).forEach(x=>{ if(x.owner===oldName) x.owner = newName; });
  });
  ['scheduleAnimals','scheduleRange','ownerProfiles','ownerFlags','shareTokens'].forEach(k=>{ // 3) 이름을 키로 쓰는 맵
    const m = DATA[k]; if(!m || !(oldName in m)) return;
    m[newName] = m[oldName]; delete m[oldName];
  });
  ['completedCells','skippedCells','dismissedCells','aiPlanKpn'].forEach(k=>{  // 4) '축주|개체|날짜' 셀 키
    const m = DATA[k]; if(!m) return;
    Object.keys(m).forEach(key=>{
      if(key.indexOf(oldName+'|')===0){ m[newName+key.slice(oldName.length)] = m[key]; delete m[key]; }
    });
  });
  if(UI.owner===oldName) UI.owner = newName;                       // 5) 보고 있던 축주
  ensureOwnerMeta(newName);
  saveState();
  return true;
}

function genToken(){
  const c='abcdefghijkmnpqrstuvwxyz23456789'; let s='';
  for(let i=0;i<7;i++) s+=c[Math.floor(Math.random()*c.length)];
  return s;
}
function ownerShareToken(owner, regenerate){
  DATA.shareTokens = DATA.shareTokens || {};
  if(regenerate || !DATA.shareTokens[owner]){ DATA.shareTokens[owner] = genToken(); saveState(); }
  return DATA.shareTokens[owner];
}
function recordsOf(owner, animalId){
  return DATA.records.filter(r=>r.owner===owner && r.animalId===animalId)
    .sort((a,b)=> recordSortKey(b) - recordSortKey(a));
}
function shareAnimalStatus(owner, a){
  const recs = recordsOf(owner, a.animalId);
  if(isCurrentlyPregnant(recs)) return { status:'임신중', days:null };
  if(a.fattening) return { status:'비육전환', days:null };
  if(calvedAfterPregnancy(recs)){                       // 분만 후 아직 재수정(새 AI) 전 → 임신감정 대상 아님(재수정 대기)
    const calv = [latestCalvingDate(recs), dateOnly(a.lastCalving||'')].filter(Boolean).sort().pop() || '';
    const openDays = calv ? Math.floor((new Date(todayStr()+'T00:00') - new Date(calv+'T00:00'))/86400000) : null;
    return { status:'비임신', days: openDays };
  }
  const aiRecs = recs.filter(r=>r.aiDate).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x));
  if(!aiRecs.length) return { status:'미수정', days:null };
  const aiTs = sortKeyOf(aiRecs[0]);
  const diag = recs.filter(r=>r.pregnant && sortKeyOf(r)>=aiTs).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x));
  const preg = diag.length ? (diag[0].pregnant||'').trim().toUpperCase() : '';
  const diag2 = recs.filter(r=>r.pregnant2 && sortKeyOf(r)>=aiTs).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x));
  const preg2 = diag2.length ? (diag2[0].pregnant2||'').trim().toUpperCase() : '';
  const aiD = dateOnly(aiRecs[0].aiDate);
  const days = Math.floor((new Date(todayStr()+'T00:00') - new Date(aiD+'T00:00'))/86400000);
  if(preg==='X' || preg2==='X'){                                             // 1차 X 또는 2차 X → 비임신(재수정 대기)
    const calv = [latestCalvingDate(recs), dateOnly(a.lastCalving||'')].filter(Boolean).sort().pop() || '';
    const base = calv || aiD;                                                 // 비임신 경과일은 마지막 분만일 기준(분만 이력 없으면 수정일)
    const openDays = Math.floor((new Date(todayStr()+'T00:00') - new Date(base+'T00:00'))/86400000);
    return { status:'비임신', days: openDays };
  }
  if(preg==='O') return calvedAfterPregnancy(recs)
    ? { status:'분만', days:null }      // O 떴지만 이미 분만 → 임신중 아님
    : { status:'임신중', days:null };
  return { status: days>=30 ? '임신감정 필요' : '감정 대기', days };
}
/* 개체 표시용 플래그: 1년1산(임신중 + 마지막 분만 후 81일 안에 수태), 수정횟수(현재) */
function animalFlags(owner, a){
  const recs = recordsOf(owner, a.animalId);
  const aiN = currentAiCount(a, recs);
  let oneYear = false;
  if(isCurrentlyPregnant(recs)){
    const calv = [latestCalvingDate(recs), dateOnly(a.lastCalving||'')].filter(Boolean).sort().pop() || '';
    const aiRecs = recs.filter(r=>r.aiDate).sort((x,y)=> sortKeyOf(y)-sortKeyOf(x));
    if(calv && aiRecs.length){
      const d = daysBetween(calv, dateOnly(aiRecs[0].aiDate));
      if(d>=0 && d<=81) oneYear = true;
    }
  }
  return { oneYear, aiN, repeat: aiN>=3 };
}
function sexIcon(v){
  v = String(v||'').trim();
  if(/^(수|수컷|♂|m|male)$/i.test(v)) return '♂';
  if(/^(암|암컷|♀|f|female)$/i.test(v)) return '♀';
  return '';   // 불명·기타는 표시 안 함
}

}
function shareExpCalving(owner, a){
  const recs = recordsOf(owner, a.animalId);
  if(!isCurrentlyPregnant(recs)) return null;
  const withCalv = recs.filter(r=>(r.expectedCalving||'').trim());
  return withCalv.length ? dateOnly(withCalv[0].expectedCalving) : null;
}
function buildSharePayload(owner){
  const animals = DATA.animals.filter(a=>a.owner===owner)
    .sort((a,b)=>a.animalId.localeCompare(b.animalId))
    .map(a=>{ const s=shareAnimalStatus(owner,a); const f=animalFlags(owner,a); return { id:a.animalId, status:s.status, days:s.days, expectedCalving:shareExpCalving(owner,a), oneYear:f.oneYear, aiCount:f.aiN }; });
  // 동기화/처치 일정: 자동(동기화 프로토콜 등)+수동 일정 포함, 오늘 기준 과거 7일~미래, '안 함' 제외
  const cutoff = addDays(todayStr(), -7);
  const schedule = scheduleRowsForOwner(owner)
    .filter(r => r.date >= cutoff && !r.skipped)
    .map(r => ({
      date: r.date,
      id: r.aid,
      note: (r.note||'').split(' / ').map(t=>t.trim()).filter(t=>t).join(' / ').replace(/CIDR/gi, '사이더').replace(/\bAI\b/g, '인공수정')
    }))
    .filter(r => r.note);
  schedule.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  // 백신 예정은 별도 탭
  const vaccines = vaccineItemsForOwner(owner)
    .filter(it => it.date >= cutoff)
    .map(it => ({ date: it.date, id: it.animalId, note: `${VAC_LABEL[it.vaccine]} ${it.dose}` }))
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return { owner, updatedAt: todayStr(), animals, schedule, vaccines };
}

/* ============================================================
   전공책 보관함 (개인 라이브러리)
   · 진료 데이터와 분리된 Firestore 'library' 컬렉션에 저장
     - library/index           : 책·챕터 목차(가벼움)
     - library/chap_{책}_{챕터} : 챕터 본문(필요할 때만 로딩)
   · 로그인(주인)만 보고/편집. 축주(viewer)는 접근 불가
============================================================ */
let _libDB = null;
async function getLibDB(){
  if(_libDB) return _libDB;
  if(typeof firebase==='undefined') throw new Error('Firebase 미로딩');
  if(!firebase.auth().currentUser){ await firebase.auth().signInAnonymously(); }
  _libDB = firebase.firestore();
  return _libDB;
}
const LIB = { idx:{books:[]}, view:'books', bookId:null, chapId:null, content:'', query:'', editing:false, loading:false, reorder:false };

async function libLoadIndex(){
  const db = await getLibDB();
  const snap = await db.collection('library').doc('index').get();
  LIB.idx = snap.exists ? (snap.data()||{books:[]}) : {books:[]};
  if(!Array.isArray(LIB.idx.books)) LIB.idx.books = [];
  return LIB.idx;
}
async function libSaveIndex(){
  const db = await getLibDB();
  await db.collection('library').doc('index').set(LIB.idx);
}
async function libLoadChapter(bookId, chapId){
  const db = await getLibDB();
  const snap = await db.collection('library').doc('chap_'+bookId+'_'+chapId).get();
  return snap.exists ? (snap.data().content||'') : '';
}
async function libSaveChapter(bookId, chapId, content){
  const db = await getLibDB();
  await db.collection('library').doc('chap_'+bookId+'_'+chapId).set({ content, updatedAt: Date.now() });
}
async function libDeleteChapter(bookId, chapId){
  const db = await getLibDB();
  await db.collection('library').doc('chap_'+bookId+'_'+chapId).delete().catch(()=>{});
}
function libBook(id){ return LIB.idx.books.find(b=>b.id===id); }

async function openLibrary(){
  LIB.view='books'; LIB.bookId=null; LIB.chapId=null; LIB.editing=false; LIB.query='';
  renderLibrary(true);
  try{ await libLoadIndex(); renderLibrary(); }
  catch(e){ console.error(e); toast('보관함을 불러오지 못했어요.'); }
}

function libHighlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  try{
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return safe.replace(re, '<mark class="lib-mark">$1</mark>');
  }catch(_){ return safe; }
}

function renderLibrary(loading){

      </div>
      ${books.length ? `<div class="lib-list">${books.map(b=>`
        <div class="lib-book" data-action="libOpenBook" data-book="${esc(b.id)}">
          <div class="lib-book-main">
            <div class="lib-book-title">${esc(b.title)}</div>
            ${b.author?`<div class="lib-book-sub">${esc(b.author)}</div>`:''}
          </div>
          <div class="lib-book-meta">${(b.chapters||[]).length}장</div>
        </div>`).join('')}</div>`
        : `<div class="lib-empty">아직 책이 없어요.<br>“+ 책 추가”로 시작하세요.</div>`}
    `;
  } else if(LIB.view==='chapters'){
    const b = libBook(LIB.bookId); const chaps = (b&&b.chapters)||[];
    body = `
      <div class="lib-bar">
        <button class="lib-back" data-action="libBackBooks">‹ 보관함</button>
        <div style="display:flex;gap:6px;">
          ${LIB.reorder?`<button class="btn small" data-action="libSortByNumber" title="제목 앞 숫자(22장 등) 기준 정렬">번호순 정렬</button>`:''}
          <button class="btn secondary small" data-action="libToggleReorder">${LIB.reorder?'완료':'순서 변경'}</button>
          ${LIB.reorder?'':`<button class="btn small" data-action="libAddChapter">+ 장 추가</button>`}
        </div>
      </div>
      <div class="lib-book-head">
        <div class="lib-title-lg">${esc(b?b.title:'')}</div>
        ${b&&b.author?`<div class="lib-book-sub">${esc(b.author)}</div>`:''}
        <div class="lib-book-actions">
          <button class="lib-mini" data-action="libRenameBook">이름 수정</button>
          <button class="lib-mini danger" data-action="libDeleteBook">책 삭제</button>
        </div>
      </div>
      ${LIB.reorder?'<div class="lib-reorder-hint">↑↓ 로 순서를 바꾸거나, “번호순 정렬”을 누르세요.</div>':''}
      ${chaps.length ? `<div class="lib-list">${chaps.map((c,i)=>
        LIB.reorder
        ? `<div class="lib-chap reorder">
            <span class="lib-chap-no">${i+1}</span>
            <span class="lib-chap-title">${esc(c.title)}</span>
            <span class="lib-reorder-btns">
              <button class="lib-move" data-action="libMoveUp" data-chap="${esc(c.id)}" ${i===0?'disabled':''}>↑</button>
              <button class="lib-move" data-action="libMoveDown" data-chap="${esc(c.id)}" ${i===chaps.length-1?'disabled':''}>↓</button>
            </span>
          </div>`
        : `<div class="lib-chap" data-action="libOpenChapter" data-chap="${esc(c.id)}">
            <span class="lib-chap-no">${i+1}</span>
            <span class="lib-chap-title">${esc(c.title)}</span>
            <span class="lib-chevron">›</span>
          </div>`).join('')}</div>`
        : `<div class="lib-empty">아직 장이 없어요.<br>“+ 장 추가”로 번역을 넣어보세요.</div>`}
    `;
  } else if(LIB.view==='reader'){
    const b = libBook(LIB.bookId);
    const c = b && (b.chapters||[]).find(x=>x.id===LIB.chapId);
    if(LIB.editing){
      body = `
        <div class="lib-bar">
          <button class="lib-back" data-action="libBackChapters">‹ ${esc(b?b.title:'')}</button>
          <button class="btn small" data-action="libSaveChapter">저장</button>
        </div>
        <input class="lib-edit-title" id="lib-ctitle" value="${esc(c?c.title:'')}" placeholder="장 제목">
        <textarea class="lib-edit-body" id="lib-cbody" placeholder="번역 내용을 붙여넣으세요">${esc(LIB.content)}</textarea>
        <div class="lib-edit-foot">
          <button class="lib-mini danger" data-action="libDeleteChapter">이 장 삭제</button>
        </div>
      `;
    } else {
      body = `
        <div class="lib-bar">
          <button class="lib-back" data-action="libBackChapters">‹ ${esc(b?b.title:'')}</button>
          <button class="btn secondary small" data-action="libEditChapter">편집</button>
        </div>
        <div class="lib-reader-title">${esc(c?c.title:'')}</div>
        <input class="lib-search" id="lib-search" placeholder="이 장에서 찾기" value="${esc(LIB.query)}">
        <div class="lib-reader-body" id="lib-reader">${LIB.content ? libHighlight(LIB.content, LIB.query) : '<span class="lib-empty-inline">내용이 비어 있어요. ‘편집’으로 번역을 넣으세요.</span>'}</div>
      `;
    }
  }

  openModal(`<div class="modal lib-modal">
    ${body}
    <div class="lib-close-row"><button class="btn secondary" data-action="closeModal">닫기</button></div>
  </div>`);

  if(LIB.view==='reader' && !LIB.editing){
    const si = document.getElementById('lib-search');
    if(si) si.addEventListener('input', ()=>{
      LIB.query = si.value;
      const rd = document.getElementById('lib-reader');
      if(rd) rd.innerHTML = LIB.content ? libHighlight(LIB.content, LIB.query) : '';
    });
  }
}

const ACTIONS = {
  openLibrary: ()=>{ if(!isAdmin()) return noAdminToast(); openLibrary(); },
  libAddBook: async ()=>{
    const title = prompt('책 제목을 입력하세요'); if(!title) return;
    const author = prompt('저자 (없으면 비워두세요)') || '';
    LIB.idx.books.push({ id:'b'+Date.now(), title:title.trim(), author:author.trim(), chapters:[] });
    try{ await libSaveIndex(); renderLibrary(); toast('책을 추가했어요.'); }
    catch(e){ console.error(e); toast('저장 실패 — 보안 규칙(library)을 확인해주세요.'); }
  },
  libOpenBook: (ds)=>{ LIB.bookId=ds.book; LIB.view='chapters'; renderLibrary(); },
  libBackBooks: ()=>{ LIB.view='books'; renderLibrary(); },
  libRenameBook: async ()=>{
    const b = libBook(LIB.bookId); if(!b) return;
    const t = prompt('책 제목', b.title); if(t===null) return;
    const a = prompt('저자', b.author||''); 
    b.title=t.trim(); if(a!==null) b.author=a.trim();
    try{ await libSaveIndex(); renderLibrary(); toast('수정했어요.'); }catch(e){ toast('저장 실패'); }
  },
  libDeleteBook: async ()=>{
    const b = libBook(LIB.bookId); if(!b) return;
    if(!confirm(`"${b.title}" 책과 모든 장을 삭제할까요?`)) return;
    for(const c of (b.chapters||[])){ await libDeleteChapter(b.id, c.id); }
    LIB.idx.books = LIB.idx.books.filter(x=>x.id!==b.id);
    try{ await libSaveIndex(); LIB.view='books'; renderLibrary(); toast('삭제했어요.'); }catch(e){ toast('저장 실패'); }
  },
  libToggleReorder: ()=>{ LIB.reorder = !LIB.reorder; renderLibrary(); },
  libMoveUp: async (ds)=>{
    const b = libBook(LIB.bookId); if(!b) return;
    const i = b.chapters.findIndex(c=>c.id===ds.chap);
    if(i<=0) return;
    [b.chapters[i-1], b.chapters[i]] = [b.chapters[i], b.chapters[i-1]];
    renderLibrary();
    try{ await libSaveIndex(); }catch(e){ toast('저장 실패'); }
  },
  libMoveDown: async (ds)=>{
    const b = libBook(LIB.bookId); if(!b) return;
    const i = b.chapters.findIndex(c=>c.id===ds.chap);
    if(i<0 || i>=b.chapters.length-1) return;
    [b.chapters[i+1], b.chapters[i]] = [b.chapters[i], b.chapters[i+1]];
    renderLibrary();
    try{ await libSaveIndex(); }catch(e){ toast('저장 실패'); }
  },
  libSortByNumber: async ()=>{
    const b = libBook(LIB.bookId); if(!b) return;
    const numOf = t => { const m = String(t).match(/\d+/); return m ? parseInt(m[0],10) : 999999; };
    b.chapters.sort((x,y)=> numOf(x.title) - numOf(y.title));
    renderLibrary();
    try{ await libSaveIndex(); toast('번호순으로 정렬했어요.'); }catch(e){ toast('저장 실패'); }
  },
  libAddChapter: async ()=>{
    const b = libBook(LIB.bookId); if(!b) return;
    const title = prompt('장 제목 (예: 1장 번식생리)'); if(!title) return;
    const id = 'c'+Date.now();
    b.chapters = b.chapters||[]; b.chapters.push({ id, title:title.trim() });
    try{
      await libSaveChapter(b.id, id, '');
      await libSaveIndex();
      LIB.chapId=id; LIB.content=''; LIB.view='reader'; LIB.editing=true; LIB.query='';
      renderLibrary(); toast('장을 추가했어요. 번역을 붙여넣으세요.');
    }catch(e){ console.error(e); toast('저장 실패'); }
  },
  libOpenChapter: async (ds)=>{
    LIB.chapId=ds.chap; LIB.view='reader'; LIB.editing=false; LIB.query=''; LIB.content='';
    renderLibrary(true);
    try{ LIB.content = await libLoadChapter(LIB.bookId, LIB.chapId); renderLibrary(); }
    catch(e){ console.error(e); toast('내용을 불러오지 못했어요.'); }
  },
  libBackChapters: ()=>{ LIB.view='chapters'; LIB.editing=false; renderLibrary(); },
  libEditChapter: ()=>{ LIB.editing=true; renderLibrary(); },
  libSaveChapter: async ()=>{
    const b = libBook(LIB.bookId); const c = b&&(b.chapters||[]).find(x=>x.id===LIB.chapId); if(!c) return;
    const ti = document.getElementById('lib-ctitle');
    const bo = document.getElementById('lib-cbody');
    if(ti) c.title = ti.value.trim() || c.title;
    LIB.content = bo ? bo.value : LIB.content;
    try{
      await libSaveChapter(b.id, c.id, LIB.content);
      await libSaveIndex();
      LIB.editing=false; renderLibrary(); toast('저장했어요.');
    }catch(e){ console.error(e); toast('저장 실패'); }
  },
  libDeleteChapter: async ()=>{
    const b = libBook(LIB.bookId); const c = b&&(b.chapters||[]).find(x=>x.id===LIB.chapId); if(!c) return;
    if(!confirm(`"${c.title}" 장을 삭제할까요?`)) return;
    await libDeleteChapter(b.id, c.id);
    b.chapters = b.chapters.filter(x=>x.id!==c.id);
    try{ await libSaveIndex(); LIB.view='chapters'; LIB.editing=false; renderLibrary(); toast('삭제했어요.'); }catch(e){ toast('저장 실패'); }
  },

    const field = ds.field;
    const def = (field==='cycleLength') ? 21 : 0;
    const cur = parseInt(a[field],10);
    let next = (isNaN(cur)?def:cur) + parseInt(ds.delta,10);
    const min = ds.min!=null ? parseInt(ds.min,10) : 0;
    const max = ds.max!=null ? parseInt(ds.max,10) : 999;

function initEvents(){
  document.addEventListener('click', e=>{
    const chip = e.target.closest('.tag-chip[data-animal-id]');
    if(chip){
      e.preventDefault();
      const id = chip.dataset.animalId;
      const owner = chip.dataset.owner;
      if(owner && DATA.owners.includes(owner)) UI.owner = owner;
      if(document.getElementById('modalRoot')) closeModal();
      if(UI.globalSearch){ UI.globalSearch=''; const gi=document.getElementById('globalSearchInput'); if(gi) gi.value=''; }
      UI.view = 'animal';
      UI.selectedAnimal = id;
      renderMain();
      return;
    }
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(ACTIONS[action]) ACTIONS[action](el.dataset, e);
  });
  document.addEventListener('input', e=>{
    const t = e.target;
    if(t.id==='animalSearchInput'){
      UI.animalSearch=t.value;
      const box=document.getElementById('animalListBox'), cnt=document.getElementById('animalCount');
      if(box){ const d=animalListData(); box.innerHTML=d.listHtml; if(cnt) cnt.textContent=d.animals.length; }
      else { pendingFocus={id:t.id,pos:t.selectionStart}; renderMain(); }
    }
    else if(t.id==='dateSearchInput'){
      UI.dateSearch=t.value;
      const box=document.getElementById('dateRowsBox');
      if(box){ box.innerHTML=dateViewRows(); }
      else { pendingFocus={id:t.id,pos:t.selectionStart}; renderMain(); }
    }
    else if(t.id==='globalSearchInput'){
      UI.globalSearch=t.value;
      renderMain();
    }
    else if(t.id==='syncbatch_q'){ syncBatchFilter(t.value); }
    else if(t.classList && t.classList.contains('ov-free')){
      const key=t.dataset.key; if(ovaryState[key]){ ovaryState[key].free=t.value; const hid=document.getElementById('f_'+key); if(hid) hid.value=ovaryCombined(key); }
    }
  });
  document.addEventListener('keydown', e=>{
    const n=e.target;
    if(n && n.classList && (n.classList.contains('ov-num')||n.classList.contains('ov-note')) && e.key==='Enter'){
      e.preventDefault();
      ACTIONS.ovaryAdd({key:n.dataset.key});
    }
  });
  document.addEventListener('change', e=>{
    const t = e.target;
    if(t.matches && t.matches('.sched-cell input')){ if(!isAdmin()){ t.value = DATA.schedule.find(s=>s.owner===UI.owner&&s.animalId===t.dataset.aid&&s.date===t.dataset.date)?.note||''; return noAdminToast(); } (t.dataset.aids ? t.dataset.aids.split('|') : [t.dataset.aid]).forEach(aid => updateScheduleCell(aid, t.dataset.date, t.value)); }
    else if(t.matches && t.matches('.aiplan-kpn')){ if(!isAdmin()){ t.value = getAiPlanKpn(t.dataset.owner, t.dataset.aid, t.dataset.date); return noAdminToast(); } updateAiPlanKpn(t.dataset.owner, t.dataset.aid, t.dataset.date, t.value); }
    else if(t.id==='dateFromInput'){ UI.dateFrom=t.value; renderMain(); }
    else if(t.id==='dateToInput'){ UI.dateTo=t.value; renderMain(); }
    else if(t.id==='calc_aiDate'){ actionCalcDateChange(t.value); }
    else if(t.id==='f_estrusDate_date' || t.id==='f_aiDate_date'){
      const nextEl = document.getElementById('f_nextEstrusDate');
      if(nextEl && t.value){ nextEl.value = addDays(t.value, 21); }
      if(t.id==='f_aiDate_date'){
        const calvEl = document.getElementById('f_expectedCalving');
        if(calvEl && t.value){ calvEl.value = addDays(t.value, 285); }   // 수정일 + 285일 = 예상분만일 (수정 가능)
      }
    }
    else if(t.dataset && t.dataset.animalField){
      if(!isAdmin()) return noAdminToast();
      const a = DATA.animals.find(x=>x.owner===UI.owner && x.animalId===t.dataset.id);
      if(a){ a[t.dataset.animalField] = t.value; saveState(); renderMain(); }
    }
    else if(t.id==='f_pregnant'){ refreshPregStage(); }
    else if(t.id==='f_sync1Date' && UI.activeSyncProtocol){
      fillSyncProtocolDates(UI.activeSyncProtocol, t.value);
    }
    else if(t.classList && t.classList.contains('syncbatch-cb')){ syncBatchUpdateCount(); }
  });
  document.addEventListener('focusin', e=>{
    if(e.target.matches && e.target.matches('.sched-cell input')){
      UI.focusedCell = { id:e.target.id, aid:e.target.dataset.aid, aids:e.target.dataset.aids, date:e.target.dataset.date };
    }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeModal();
  });
}

function applyTheme(){
  if(!DATA.theme) DATA.theme = 'light';
  document.documentElement.setAttribute('data-theme', DATA.theme==='dark' ? 'dark' : 'light');
}
// 명백한 오류 날짜 정리 (2000년 이전 예상분만일 → 빈값). 멱등.
function sanitizeData(){
  let changed = false;
  if(!Array.isArray(DATA.vaccineLogs)){ DATA.vaccineLogs = []; changed = true; }
  (DATA.records||[]).forEach(r=>{
    const v = (r.expectedCalving||'');
    if(v && /^\d{4}-/.test(v) && parseInt(v.slice(0,4),10) < 2000){
      r.expectedCalving = ''; changed = true;
    }
  });
  return changed;
}
async function init(){
  STORAGE_MODE = await detectStorageMode();
  let stored = null, loadFailed = false;
  try{
    stored = await loadState();
  }catch(e){
    loadFailed = true;
    console.error('불러오기 실패 — 저장을 잠급니다', e);
  }

  if(loadFailed){
    // 읽기 실패: 절대 시드로 덮어쓰지 않음. 화면엔 시드를 보여주되 저장은 잠금.
    DATA = buildInitial();
    SAVE_LOCKED = true;
    setTimeout(showLoadErrorBanner, 0);
  } else if(stored){
    DATA = stored;
  } else {
    // 저장소가 정말 비어있음(최초 실행) → 시드 저장 OK
    DATA = buildInitial();
    await saveState();
  }
  DATA.owners.forEach(ensureOwnerMeta);
  const sanitized = sanitizeData();                 // 오류 날짜(1900 등) 자동 정리
  if(sanitized && !SAVE_LOCKED){ try{ await saveState(); }catch(e){ console.error('정리 저장 실패', e); } }
  UI.owner = DATA.owners[0];
  applyTheme();
  initEvents();
  render();
  subscribeRemoteIfNeeded();
  window.__appReady = true;
}

function showLoadErrorBanner(){
  if(document.getElementById('load-error-banner')) return;
  const bar = document.createElement('div');
  bar.id = 'load-error-banner';
  bar.style.cssText = 'position:sticky;top:0;z-index:9999;background:#A32D2D;color:#fff;'
    + 'padding:10px 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.5;';
  bar.innerHTML = svgIcon('noEntry',14)+' 저장된 데이터를 불러오지 못했어요. 표시된 건 기본 시드 데이터이며 '
    + '<u>저장이 잠겨 있어</u> 덮어쓰기 사고는 일어나지 않아요. 새로고침하면 다시 시도합니다.';
  document.body.prepend(bar);
}
