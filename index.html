  .sched-agenda .done-btn,.sched-agenda .skip-btn{flex:0 0 auto;margin-left:0;}
}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,24,18,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:200;}
.modal{background:var(--surface);border-radius:8px;padding:24px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.1);}
.modal h2{margin:0 0 4px;font-size:16px;color:var(--primary-dark);}
.modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px;}
.date-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px 10px;}
.date-grid .field label{font-size:10px;margin-bottom:2px;}
.date-grid .field input{height:30px;padding:3px 7px;font-size:11.5px;}
.date-grid .field-pair input[type=time]{max-width:88px;}
.date-grid .field-pair{flex-wrap:nowrap;}
.date-grid .field-pair input{min-width:0;flex:1 1 auto;}
.date-grid .field-pair input[type=time]{flex:0 0 92px;}
.date-grid .dt-field{grid-column:1 / -1;}
.form-grid.rc-grid{grid-template-columns:1fr 1fr 1fr;gap:8px 10px;}
.rc-grid .field label{font-size:10px;margin-bottom:2px;}
.rc-grid .field input{height:30px;padding:3px 8px;font-size:11.5px;}
.date-grid .dbl-toggle{font-size:10.5px;padding:5px 8px;}
.modal input[type=date],.modal input[type=time],.breeding-grid input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;}
.form-grid.full{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:10.5px;color:var(--ink-soft);font-weight:700;}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;width:100%;background:var(--bg);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--tag-yellow);background:var(--surface);}
.field textarea{resize:vertical;min-height:56px;}
.field-pair{display:flex;gap:6px;flex-wrap:wrap;}
.field-pair input{flex:1 1 92px;min-width:92px;}
.field.checkbox{flex-direction:row;align-items:center;gap:7px;}
.field.checkbox input{width:auto;}
.chips-inline{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px;}
.chips-inline button{border:1px solid var(--line);background:var(--surface-alt);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-weight:600;}
.fieldset-title{font-size:11.5px;font-weight:700;color:var(--primary-dark);margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line);}
.ovary-field .ov-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px;}
.ox-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;}
.ox-compact{flex-direction:row !important;align-items:center;justify-content:space-between;gap:8px;}
.ox-compact label{flex:1 1 auto;font-size:11px;}
.ox-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto;}
.ox-btn{border:none;background:var(--bg);color:var(--ink-soft);font-family:inherit;font-size:11px;font-weight:800;padding:4px 11px;cursor:pointer;}
.ox-btn+.ox-btn{border-left:1px solid var(--line);}
.ox-btn.on{background:var(--primary);color:#fff;}
.ox-btn.on.x{background:var(--notpregnant-bg);}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto;}
.seg-tbtn{border:none;background:var(--bg);color:var(--ink-soft);font-family:inherit;font-size:11px;font-weight:800;padding:4px 10px;cursor:pointer;}
.seg-tbtn+.seg-tbtn{border-left:1px solid var(--line);}
.seg-tbtn.on{background:var(--primary);color:#fff;}
.seg-tbtn.on[data-val="X"]{background:var(--notpregnant-bg);}
.ov-seg-group{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);height:32px;box-sizing:border-box;}
.ov-seg{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:11px;font-weight:700;height:32px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;}
.ov-seg+.ov-seg{border-left:1px solid var(--line);}
.ov-seg.on{background:var(--primary);color:#fff;}
.ov-num-wrap{position:relative;display:inline-flex;align-items:center;}
.ov-num-wrap input{width:74px;height:32px;padding:0 28px 0 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:var(--bg);box-sizing:border-box;}
.ov-num-wrap input:focus{outline:2px solid var(--tag-yellow);background:var(--surface);}
.ov-num-wrap .ov-unit{position:absolute;right:9px;font-size:12px;color:var(--ink-soft);font-weight:700;pointer-events:none;}
.ov-add{border:1px solid var(--line);background:var(--surface-alt);border-radius:7px;height:32px;padding:0 12px;font-family:inherit;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;}
.ov-note{flex:1 1 120px;min-width:100px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:var(--bg);box-sizing:border-box;}
.ov-note:focus{outline:2px solid var(--tag-yellow);background:var(--surface);}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.ov-chip{display:inline-flex;align-items:center;gap:5px;background:var(--green-soft);color:var(--primary-dark);border:1px solid var(--primary);border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:700;}
.ov-chip .ov-x{cursor:pointer;display:inline-flex;opacity:.6;}
.ov-chip .ov-x:hover{opacity:1;}
.ov-free{margin-top:7px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;width:100%;background:var(--bg);box-sizing:border-box;}
.ov-free:focus{outline:2px solid var(--tag-yellow);background:var(--surface);}
.legacy-note{font-size:11px;color:var(--ink-soft);background:var(--bg);border-radius:7px;padding:6px 10px;margin:6px 0 4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
.modal-actions .left{margin-right:auto;}
details.opt-section summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-top:14px;}

.confirm-modal{max-width:380px;text-align:center;}
.confirm-modal p{font-size:14px;color:var(--ink);line-height:1.5;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#262420;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);}

@media (max-width:600px){
  /* 정보 밀도 ↑ — 한 화면에 더 많이 */
  main{padding:12px 12px 60px;}
  .panel{padding:11px;border-radius:9px;}
  .toolbar{gap:4px;margin-bottom:5px;}
  .toolbar .seg{flex:1 1 60%;width:auto;order:0;}
  .toolbar .seg button{flex:1;padding:4px 6px;font-size:11.5px;height:28px;}
  .toolbar .date-field{flex:1 1 42%;min-width:0;order:2;}
  .toolbar > span{order:2;}
  .toolbar input[type=date]{width:100%;min-width:0;padding:0 5px;height:28px;font-size:11.5px;-webkit-appearance:none;appearance:none;line-height:28px;}
  .toolbar .search-input{flex:1 1 60%;width:auto;padding:0 8px;font-size:11.5px;height:28px;order:3;margin:0;}
  .toolbar .btn,.toolbar .btn.small{padding:0 8px;font-size:11px;height:28px;}
  .toolbar .btn.secondary{order:3;}
  .toolbar .btn:not(.secondary){order:1;margin-left:0 !important;}
  .search-input{padding:5px 9px;font-size:12px;margin-bottom:5px;height:30px;}
  .panel-head{margin-bottom:5px;}
  .panel-head h3{font-size:13px;margin:0;}
  .animal-sort{margin:4px 0 4px;gap:4px;}
  .animal-sort-btn{padding:4px 6px;font-size:11.5px;}
  .section-title{font-size:12.5px;margin:10px 0 6px;padding-bottom:3px;}
  .section-title::before{height:14px;}

  /* 통계 카드 */
  .preg-summary{gap:5px;margin-bottom:8px;}
  .preg-stat{padding:6px 4px;border-radius:8px;}
  .preg-stat-num{font-size:17px;}
  .preg-stat-label{font-size:9.5px;margin-top:3px;line-height:1.2;}
  .preg-stat-sub{font-size:8.5px;margin-top:1px;}

  /* 칩 */
  .tag-chip{font-size:11px;padding:3px 8px 3px 11px;}
  .tag-chip.lg{font-size:14px;padding:6px 11px 6px 14px;}
  .tag-chip.sm{font-size:10.5px;padding:3px 7px 3px 10px;}

  /* 배지 */
  .preg-badge,.fatten-badge,.pregcheck-badge{font-size:11px;padding:4px 9px;border-radius:6px;}
  .pregcheck-badge.preg,.pregcheck-badge.confirmed{font-size:11px;padding:4px 9px;}

  /* 임신감정 행 — 한 줄 압축 */
  .pregcheck-list{gap:3px;}
  .pregcheck-row{padding:4px 8px;gap:6px;border-radius:8px;flex-wrap:nowrap;min-height:34px;}
  .pregcheck-row .tag-chip{font-size:11px;}
  .pregcheck-row .tag-chip{flex:0 0 auto;}
  .pregcheck-mid{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;flex:1 1 auto;min-width:0;overflow:hidden;}
  .pregcheck-mid .pregcheck-date .pcd-prefix,.pregcheck-mid .pregcheck-date .pcd-val{display:none;}
  .pregcheck-mid .pregcheck-date{flex:0 0 auto;order:2;}
  .pregcheck-mid .pregcheck-date .open-repeat{margin-left:0;}
  .pregcheck-mid .pregcheck-date:not(:has(.open-repeat)){display:none;}
  .pregcheck-mid .pregcheck-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .pregcheck-mid .pregcheck-days{flex:0 0 auto;}
  .pregcheck-mid .preg-tags{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;}
  .pregcheck-mid .preg-tags .preg-tag.pos,
  .pregcheck-mid .preg-tags .preg-tag.neg,
  .pregcheck-mid .preg-tags .preg-tag.rechk,
  .pregcheck-mid .preg-tags .preg-tag.sex,
  .pregcheck-mid .preg-tags .preg-tag.calf{display:none;}
  .pc-badge.pdday{display:none !important;}                           /* 임신중 행: 분만 D-day 배지는 모바일에서 숨김 */
  .pc-badge.diagsum{display:inline-flex !important;}                  /* 임신중 행: 그 자리에 1·2차 감정 결과 표시 */
  .pregcheck-badge,.pregcheck-row .fatten-badge{flex:0 0 auto;margin-left:auto;}
  .pregcheck-badge{font-size:10px;padding:3px 7px;border-radius:6px;font-weight:800;}
  .pregcheck-badge.preg,.pregcheck-badge.confirmed,.pregcheck-badge.notpregnant,.pregcheck-badge.unknown{font-size:10px;padding:3px 7px;}
  .pregcheck-end{gap:5px;flex:1 1 auto;min-width:0;justify-content:flex-end;}
  .pregcheck-mid{flex:0 0 auto;overflow:visible;}
  .pc-badge.diagsum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;display:inline-block !important;line-height:1.3;font-size:10px;padding:3px 5px;letter-spacing:-.02em;}
  .pregcheck-end.has-sync .pregcheck-badge,.pregcheck-end.has-sync .pc-badge.rebreed{display:none;}
  .pregcheck-end.has-sync .pc-badge.sync svg{display:none;}
  .pregcheck-end.has-sync .pc-badge.sync{padding:3px 5px;font-size:9.5px;}
  .pregcheck-row{gap:5px;}
  .pregcheck-row .tag-chip{padding:2px 6px 2px 9px;}
  .pregcheck-mid{gap:5px;}
  .pregcheck-end.has-sync + .sched-add-btn{display:none;}   /* 동기화 잡힌 소: 일정 추가 버튼은 모바일에서 생략 */
  .pregcheck-mid .pregcheck-days{white-space:nowrap;}
  .pregcheck-mid .pregcheck-days .pcd-suffix{display:none;}
  .pregcheck-row .open-repeat .rp-suffix{display:none;}   /* 동기화 잡힌 소: '재수정 대기' 배지는 모바일에서 생략 */
  .pregcheck-row .open-repeat{font-size:9px;padding:1px 4px;}
  .preg-subtag{font-size:9.5px;padding:2px 6px;}
  .pc-badge{font-size:10.5px;padding:4px 8px;border-radius:6px;}
  .pregcheck-mid .pregcheck-date{font-size:10.5px;}
  .pregcheck-mid .pregcheck-days{font-size:11px;}
  .pregcheck-mid .preg-tags .preg-tag{font-size:9.5px;padding:2px 6px;}
  .pregcheck-row .fatten-badge.sm{font-size:10px;padding:3px 7px;font-weight:800;}

  /* 질환 행 — 한 줄 압축 */
  .disease-row{flex-wrap:nowrap;gap:8px;overflow:hidden;padding:5px 9px;}
  .disease-row .tag-chip{flex:0 0 auto;}
  .disease-date{flex:0 0 auto;}
  .disease-tags{margin-left:auto;display:flex;gap:6px;flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow:hidden;}
  .disease-tags .disease-tag{white-space:nowrap;font-size:11px;padding:4px 9px;}
  .disease-tags .disease-tag.ovary,.disease-tags .disease-tag.uterine{overflow:hidden;text-overflow:ellipsis;min-width:0;display:block;}
  .disease-tags .disease-tag.improved,.disease-tags .disease-tag.activecyst{flex:0 0 auto;}
  .disease-tag .dtag-prefix{display:none;}

  /* 개체 상세 — 혈통/번식 정보 패널 */
  .info-panel{padding:8px 0;gap:6px;}
  .info-row{gap:4px 10px;}
  .info-row .field{flex-direction:row;align-items:center;gap:6px;min-width:0;}      /* 라벨·값 한 줄 */
  .info-row .field label{font-size:10px;margin-bottom:0;flex:0 0 auto;}
  .info-row .field .val{font-size:11px;flex:1 1 auto;min-width:0;}
  .info-panel-title{font-size:11.5px;}
  .breeding-grid .val{min-height:24px;line-height:24px;}
  .breeding-grid .val .kv2-note,.breeding-grid .val > div{line-height:1.3;font-size:10px;}
  .breeding-grid .inline-edit,.breeding-grid .inline-edit.num,.breeding-grid .inline-edit.sel,.breeding-grid input[type=date].inline-edit{height:24px;max-width:100%;}
  .breeding-grid .inline-edit.num{width:44px;}
  .info-groups{gap:0;}
  .animal-detail-head,.head-actions{margin-bottom:4px;}
  .rec-title{margin-top:8px;}
  .info-row .field.cycle-field{grid-column:1/-1;}
  .info-row.ai-count-row{grid-template-columns:1fr;}
  .info-row.ai-count-row .field .val{white-space:nowrap;}
  .info-row .field.cycle-field .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .info-row .field.cycle-field .cycle-today-sub{display:inline;margin-left:6px;}
  /* 혈통: 3칸 한 줄 유지 (부·외조부·외외증조부 / 품종·출생·개월령) */
  .info-panel.pedigree .info-row.cols3{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;}
  .info-panel.pedigree .info-row.cols3 .field label{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .info-panel.pedigree .info-row.cols3 .field .val{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 번식정보 라벨-값 행 */
  .pair-grid > .field:nth-child(3){margin-left:0;}
  .kv2-row{padding:7px 0;min-height:34px;gap:10px;}
  .kv2-label{font-size:12px;}
  .kv2-val{font-size:13.5px;}
  .ai-stepper{gap:6px;}
  .ai-stepper .iconbtn.step{width:25px;height:25px;font-size:15px;border-radius:6px;}
  .ai-stepper .ai-count-num{font-size:15px;min-width:16px;}

  /* 진료·수정 기록 카드 — 모바일 축소 */
  .record-card{padding:7px 10px;margin-top:5px;}
  .record-body{font-size:12px;gap:2px;margin-top:5px;line-height:1.35;}
  .record-body .kv{gap:6px;padding-bottom:3px;font-size:11px;}
  .record-body .kv b{font-size:10.5px;min-width:70px;}
  .date-pill{font-size:10.5px;padding:3px 7px;}
  .record-dates{gap:6px;}
  .record-notes{font-size:11px;padding:4px 8px;margin-top:4px;line-height:1.35;}
  .record-card .row1 .iconbtn{font-size:11.5px;padding:3px 7px;}

  /* 날짜별 카드 더 조밀하게 */
  .data-table tr{padding:5px 9px;margin-bottom:4px;border-radius:8px;gap:2px 8px;}
  .data-table td{font-size:12px;padding:1px 0;}
  .data-table td.actions{order:1;margin-top:0;align-self:center;}   /* 수정·삭제를 날짜 줄 오른쪽으로 */
  .data-table td.actions .iconbtn{padding:2px 6px;font-size:10.5px;}
  .data-table td[data-label="진료"],.data-table td[data-label="수정"]{font-size:11.5px;}
  .data-table td.rowbreak{order:2;}
  .data-table td[data-label="비고"]{order:3;margin-top:1px;}

  /* 목록(개체 목록) 행 */
  .animal-list-item{padding:4px 7px;gap:1px;}

  /* 축사정보 (축주 정보) 컴팩트 */
  .info-grid{gap:8px;margin-top:10px;padding-top:10px;}
  .kv-display-list{gap:4px;}
  .kv-display-row{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .head-actions .btn.small{padding:5px 9px;font-size:11.5px;}

  /* 날짜 필터 비우기 버튼 */
  .date-field .date-clear{right:5px;}

  /* 상단 헤더·탭 조이기 */
  header.topbar{margin:0 12px;padding:11px 12px 0;}
  .title-row h1{font-size:16px;gap:6px;}
  .title-row h1 .brand-badge svg{width:22px;height:22px;}
  .header-actions{gap:5px;}
  .header-actions .btn-label{display:none;}
  .global-search-bar{flex:1 1 130px;width:auto;min-width:110px;}
  .header-actions .btn.small{padding:5px 9px;font-size:14px;}
  .status-badge .btn-label{display:none;}
  .status-badge{font-size:13px;padding:4px 8px;}
  .header-actions .theme-toggle{width:28px;height:28px;font-size:13px;}
  .owner-tabs{gap:3px;margin-top:6px;}
  .owner-tabs .tab-break{display:block;flex-basis:100%;height:0;margin:0;padding:0;border:none;}
  .owner-tab{padding:4px 9px;font-size:11.5px;border-radius:7px 7px 0 0;gap:3px;}
  .owner-tab.calc-tab{margin-right:3px;}
  .subnav{gap:12px;padding:6px 0 0;}
  .subnav button{font-size:12.5px;padding:4px 1px 7px;border-bottom-width:2px;}
  header.topbar{padding-top:8px;}
  .title-row{margin-bottom:4px;}
}
@media (max-width:540px){
  .modal{padding:18px;border-radius:14px;}
  .form-grid{grid-template-columns:1fr 1fr;}
  .sync-proto-hint{font-size:10.5px;}
  .sync-list{gap:5px;}
  .sync-row{display:grid;grid-template-columns:16px 1fr 1fr 1fr;grid-template-rows:auto auto;gap:3px 5px;align-items:center;background:var(--surface-alt);border:1px solid var(--line);border-radius:8px;padding:4px 6px;}
  .sync-num{grid-row:1;grid-column:1;width:16px;height:16px;font-size:9px;}
  .sync-row select{grid-row:1;grid-column:2/5;height:26px;font-size:11.5px;padding:2px 6px;}
  .sync-f{display:flex;align-items:center;gap:3px;min-width:0;}
  .sync-f>span:first-child{display:block;font-size:9.5px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
  .sync-f-date{grid-row:2;grid-column:1/3;}
  .sync-f-time{grid-row:2;grid-column:3;}
  .sync-f-dose{grid-row:2;grid-column:4;}
  .sync-row input[type=date],.sync-row input[type=time]{flex:1 1 0;width:100%;min-width:0;height:26px;font-size:11px;padding:2px 4px;-webkit-appearance:none;appearance:none;display:block;}
  .sync-dose-wrap{flex:1 1 0;width:100%;}
  .sync-dose-wrap em{font-size:10px;}
  .sync-row .sync-dose{height:26px;font-size:11.5px;padding:2px 4px;}
  .sync-proto-btn{padding:4px 8px;font-size:10.5px;}
}

/* 보관함 (라이브러리) */
.lib-modal{max-width:560px;width:100%;max-height:86vh;display:flex;flex-direction:column;}
.lib-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.lib-title-lg{font-size:18px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:7px;}
.lib-title-ic{display:inline-flex;color:var(--primary);}
.lib-back{background:none;border:none;color:var(--primary-dark);font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;}
.lib-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;min-height:0;}
.lib-book{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-alt);cursor:pointer;transition:all .12s;}
.lib-book:hover{border-color:var(--primary);}
.lib-book-main{flex:1;min-width:0;}
.lib-book-title{font-size:14.5px;font-weight:700;color:var(--ink);}
.lib-book-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.lib-book-meta{font-size:12px;color:var(--ink-soft);font-weight:700;flex:0 0 auto;}
.lib-book-head{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.lib-book-actions{display:flex;gap:8px;margin-top:8px;}
.lib-mini{font-size:11.5px;font-weight:700;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink-soft);cursor:pointer;}
.lib-mini.danger{color:var(--notpregnant-bg);border-color:var(--notpregnant-soft);}
.lib-chap{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .12s;}
.lib-chap:hover{border-color:var(--primary);background:var(--green-soft);}
.lib-chap-no{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.lib-chap-title{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
.lib-chevron{color:var(--ink-soft);font-size:18px;}
.lib-chap.reorder{cursor:default;}
.lib-reorder-hint{font-size:11.5px;color:var(--ink-soft);margin:2px 0 8px;}
.lib-reorder-btns{display:flex;gap:4px;margin-left:auto;flex:0 0 auto;}
.lib-move{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lib-move:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark);}
.lib-move:disabled{opacity:.3;cursor:default;}

.lib-empty,.lib-empty-inline{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px;line-height:1.6;}
.lib-loading{text-align:center;color:var(--ink-soft);padding:40px;font-size:14px;}
.lib-reader-title{font-size:17px;font-weight:800;color:var(--ink);margin:4px 0 10px;}
.lib-search{width:100%;box-sizing:border-box;padding:9px 12px;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--surface-alt);color:var(--ink);margin-bottom:12px;outline:none;}
.lib-reader-body{flex:1;overflow-y:auto;min-height:0;font-size:15px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word;padding-right:4px;}
.lib-mark{background:#ffe9a8;color:#7a5600;border-radius:3px;padding:0 1px;}
.lib-edit-title{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:9px;background:var(--surface-alt);color:var(--ink);margin-bottom:8px;outline:none;}
.lib-edit-body{width:100%;box-sizing:border-box;flex:1;min-height:300px;padding:12px;font-size:14px;line-height:1.8;border:1px solid var(--line);border-radius:9px;background:var(--surface-alt);color:var(--ink);resize:vertical;outline:none;font-family:inherit;white-space:pre-wrap;}
.lib-edit-foot{margin-top:8px;}
.lib-close-row{margin-top:12px;display:flex;justify-content:flex-end;flex:0 0 auto;}

/* 공태관리 */
/* 요약카드 클릭 필터 */
.preg-stat.clickable{cursor:pointer;transition:all .12s;position:relative;}
.preg-stat.clickable:hover{filter:brightness(.97);}
.preg-stat.clickable.sel{outline:2px solid var(--primary);outline-offset:-2px;border-radius:10px;}
.filter-note{font-size:12px;color:var(--ink-soft);margin:10px 2px 0;display:flex;align-items:center;gap:8px;}
.filter-clear{font-size:12px;font-weight:700;color:var(--primary-dark);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
.open-wrap{padding:4px 2px;}
.open-divider{margin:18px 2px 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;}
.open-sync-tag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--primary);border-radius:8px;padding:1px 6px;margin-right:2px;vertical-align:1px;}
.open-divider-n{font-size:12px;font-weight:800;color:#fff;background:var(--notpregnant-bg,#C0392B);border-radius:10px;padding:1px 8px;}
.open-divider-sub{font-size:12px;color:var(--ink-soft);margin:3px 2px 8px;}
.open-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.open-head h2{font-size:18px;font-weight:800;color:var(--ink);margin:0;}
.open-count{font-size:13px;font-weight:700;color:#fff;background:var(--primary);border-radius:20px;padding:2px 11px;}
.open-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
.open-list{display:flex;flex-direction:column;gap:5px;}
.open-row{display:flex;align-items:center;gap:12px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:all .12s;}
.open-row:hover{border-color:var(--primary);background:var(--green-soft);}
.open-row.noinfo{background:var(--surface-alt);}
.open-id{flex:0 0 auto;min-width:46px;font-size:15px;font-weight:800;color:var(--primary-dark);font-variant-numeric:tabular-nums;}
.open-main{flex:1;min-width:0;}
.open-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.open-due{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.open-due b{color:var(--ink);font-weight:800;font-size:14px;}
.open-due.muted{color:var(--ink-soft);font-style:normal;}
.open-dd{display:inline-block;font-size:11.5px;font-weight:800;color:var(--estrus-text);background:var(--estrus-soft);border-radius:6px;padding:1px 8px;}
.open-dd.today{color:#fff;background:var(--notpregnant-bg);}
.open-basis{font-size:10.5px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:0 5px;}
.open-chev{flex:0 0 auto;color:var(--ink-soft);font-size:20px;}
.open-st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
.open-row.oneline{gap:9px;}
.open-row.oneline .open-name{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.open-row.oneline .open-st{flex:0 0 auto;margin-left:0;}
.open-row.oneline .open-due{flex:0 0 auto;font-size:13px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px;}
.open-row.oneline .open-due.muted{color:var(--ink-soft);font-weight:600;}

.open-st.rebreed{color:var(--notpregnant-bg);background:var(--notpregnant-soft,#FBE9E7);}
.open-sync-tag.plan{background:var(--accent);}
.open-row.stale{opacity:.55;}
.open-row.stale:hover{opacity:.85;}
.open-pai{font-size:13px;font-weight:900;color:var(--accent);}
.sync-spark{display:inline-flex;align-items:flex-end;gap:1.5px;height:14px;margin:0 2px;}
.sync-spark i{display:inline-block;width:4px;border-radius:1px;background:var(--line);}
.sync-spark i.now{background:var(--ink-soft);}
.sync-spark i.best{background:var(--accent);}
.open-row.oneline .open-due{flex-wrap:wrap;row-gap:2px;}
/* PC: 공태관리 줄을 칸으로 정렬 (귀표 | 구분 | 날짜·D-day·% | 근거 | ›) */
@media (min-width:601px){
  .open-list{gap:3px;}
  .open-row.oneline{display:grid;grid-template-columns:150px 86px 215px minmax(0,1fr) 18px;gap:0 10px;padding:5px 12px;align-items:center;}
  .open-row.oneline .open-name{display:none;}
  .open-row.oneline .open-due{display:contents;}
  .open-row.oneline .open-sync-tag{justify-self:start;margin:0;}
  .open-row.oneline .open-date{margin:0;justify-self:start;}
  .open-row.oneline .open-basis{justify-self:start;border:none;padding:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .open-row.oneline .open-chev{justify-self:end;}
  .open-row.oneline.noinfo .open-due{display:block;grid-column:2/5;justify-self:start;}
  .open-id .open-repeat{margin-left:6px;}
.open-st.unbred{color:var(--ink-soft);background:var(--surface-alt);border:1px solid var(--line);}

/* 공태관리 — 모바일 글자 밀도 (다른 뷰와 동일하게) */
@media (max-width:600px){
  .open-wrap{padding:2px 0;}
  .open-head h2{font-size:15px;}
  .open-count{font-size:11px;padding:2px 9px;}
  .open-sub{font-size:11px;margin-bottom:10px;}
  .open-list{gap:3px;}
  .open-row{padding:5px 9px;gap:7px;border-radius:8px;}
  .open-id{min-width:38px;font-size:13px;}
  .open-name{font-size:12.5px;}
  .open-due{font-size:11.5px;gap:6px;}
  .open-due b{font-size:12.5px;}
  .open-dd{font-size:10.5px;padding:1px 7px;}
  .open-basis{font-size:9.5px;}
  .open-st{font-size:10px;padding:1px 6px;}
  .open-chev{font-size:18px;}
  .open-row.oneline{gap:7px;}
  .open-row.oneline .open-name{font-size:12.5px;}
  .open-row.oneline .open-due{font-size:11.5px;}
  .open-row.oneline .open-due b{font-size:12.5px;}
  /* 동기화 적기 행: 모바일에선 두 줄 (윗줄 번호·적기·날짜·%, 아랫줄 그래프·근거) */
  .open-row.oneline.plan{flex-wrap:wrap;row-gap:4px;column-gap:6px;}
  .open-row.oneline.plan .open-name,.open-row.oneline.plan .open-chev{display:none;}
  .open-row.oneline.plan .open-due{display:contents;font-size:11.5px;}
  .open-row.oneline.plan .open-due .open-pai{font-size:12.5px;}
  .open-row.oneline.plan .open-due .sync-spark{flex:0 0 100%;margin:0;}
  .open-row.oneline.plan .open-due .open-basis{flex:0 0 100%;width:100%;box-sizing:border-box;white-space:normal;line-height:1.4;border:none;padding:0;font-weight:600;font-size:10.5px;}
  .open-row.oneline.plan .open-due .open-basis::before{content:'↳ ';color:var(--line);}
  .open-group{padding:9px 11px;margin:6px 0 10px;border-radius:10px;}
  .open-group-h{font-size:13px;}
  .open-group-n{font-size:10.5px;}
  .open-group-sub{font-size:9px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;}
  .open-row.oneline .open-chev{display:none;}
  .open-sync-tag{font-size:9.5px;padding:1px 5px;}
  .open-sync-tag.plan .pcd-suffix{display:none;}
  .open-date{gap:4px;font-size:12px;}
  .open-dd{font-size:10px;padding:1px 6px;}
  .open-pai{font-size:12px;}
  .open-group-row{padding:6px 0 4px;}
  .open-group-date{font-size:12px;gap:6px;}
  .open-group-meta{font-size:11px;}
  .open-group-btn{padding:2px 7px;font-size:10.5px;height:24px;}
  .open-group-date{font-size:11.5px;gap:5px;}
  .open-group-date b{font-size:12px;}
  .open-group-ids{gap:4px;margin-top:4px;}
  .open-group-busy{font-size:10.5px;}
}

let STORAGE_MODE = 'local';      // 'claude' | 'cloud' | 'local'

async function detectStorageMode(){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    return 'claude';
  }
  const cloudOk = await window.__cloudReady;
  if(cloudOk && window.__cloud) return 'cloud';
  return 'local';
}

async function loadState(){
  if(STORAGE_MODE==='claude'){
    const res = await window.storage.get(STORAGE_KEY);
    return (res && res.value) ? JSON.parse(res.value) : null;
  } else if(STORAGE_MODE==='cloud'){
    const json = await window.__cloud.get();
    return json ? JSON.parse(json) : null;
  } else {
    const v = localStorage.getItem(STORAGE_KEY);
    return v ? JSON.parse(v) : null;
  }
}

async function saveState(){
  if(SAVE_LOCKED){ console.warn('저장 잠금 상태 — 쓰기 건너뜀'); return; }
  // 클라우드에서는 주인(구글 로그인)만 쓰기 가능 — 아니면 조용히 건너뜀(서버 규칙이 최종 차단)
  if(STORAGE_MODE==='cloud' && !isAdmin()){ console.warn('쓰기 권한 없음 — 건너뜀'); return; }
  try{
    const payload = JSON.stringify(DATA);
    if(STORAGE_MODE==='claude'){
      await window.storage.set(STORAGE_KEY, payload);
    } else if(STORAGE_MODE==='cloud'){
      lastLocalWriteTs = Date.now();
      await window.__cloud.set(payload, lastLocalWriteTs);
    } else {
      localStorage.setItem(STORAGE_KEY, payload);
    }
  }catch(e){ console.error('저장 실패', e); toast('저장에 실패했어요. 잠시 후 다시 시도해주세요.'); }
}
function subscribeRemoteIfNeeded(){
  if(STORAGE_MODE!=='cloud' || !window.__cloud) return;
  window.__cloud.subscribe((json, ts)=>{
    if(!json || ts===lastLocalWriteTs) return;     // 내가 방금 쓴 변경은 무시
    try{
      const incoming = JSON.parse(json);
      DATA = incoming;
      sanitizeData();
      DATA.owners.forEach(ensureOwnerMeta);
      if(!DATA.owners.includes(UI.owner)) UI.owner = DATA.owners[0];
      applyTheme();
      render();
      toast('다른 기기에서 변경된 내용을 불러왔어요.');
    }catch(e){ console.error('동기화 데이터 처리 실패', e); }
  });
}

function storageStatusLabel(){

  if(STORAGE_MODE==='cloud') return { icon:'☁️', key:'cloud', text:'클라우드 저장' };
  if(STORAGE_MODE==='claude') return null; // 미리보기(아티팩트) 환경 — 배지 숨김
  return { icon:'💾', key:'save', text:'이 브라우저에만 저장' };
}
function buildInitial(){
  const d = JSON.parse(JSON.stringify(RAW_INITIAL));
  d.scheduleAnimals = {};
  d.scheduleRange = {};
  d.ownerProfiles = {};
  d.vaccineLogs = [];
  d.theme = 'light';
  d.owners.forEach(o=>{
    const ids = [...new Set(d.schedule.filter(s=>s.owner===o).map(s=>s.animalId))];
    d.scheduleAnimals[o] = ids;
    const dates = d.schedule.filter(s=>s.owner===o).map(s=>s.date).sort();
    if(dates.length){
      d.scheduleRange[o] = { start: dates[0], end: addDays(dates[dates.length-1], 5) };
    } else {
      d.scheduleRange[o] = { start: todayStr(), end: addDays(todayStr(), 30) };
    }
    d.ownerProfiles[o] = defaultOwnerProfile();
  });
  return d;
}
function defaultOwnerProfile(){
  return { address:'', phone:'', feeds:[], grasses:[], supplements:[] };
}
function ensureOwnerMeta(owner){
  if(!DATA.scheduleAnimals[owner]) DATA.scheduleAnimals[owner] = [];
  if(!DATA.scheduleRange[owner]) DATA.scheduleRange[owner] = { start: todayStr(), end: addDays(todayStr(),30) };
  if(!DATA.ownerProfiles) DATA.ownerProfiles = {};
  if(!DATA.ownerProfiles[owner]) DATA.ownerProfiles[owner] = defaultOwnerProfile();
  if(!DATA.completedCells) DATA.completedCells = {};
  if(!DATA.skippedCells) DATA.skippedCells = {};
  if(!DATA.dismissedCells) DATA.dismissedCells = {};
  if(!DATA.ownerFlags) DATA.ownerFlags = {};
  if(!DATA.ownerFlags[owner]) DATA.ownerFlags[owner] = { favorite:false, archived:false };
}
function ownerFav(o){ return !!((DATA.ownerFlags||{})[o]||{}).favorite; }
function ownerArch(o){ return !!((DATA.ownerFlags||{})[o]||{}).archived; }
function orderedActiveOwners(){
  const active = DATA.owners.filter(o=>!ownerArch(o));
  return [...active.filter(ownerFav), ...active.filter(o=>!ownerFav(o))];
}
function archivedOwners(){ return DATA.owners.filter(ownerArch); }
// completedCells 키: "owner|animalId|date"
function cellKey(owner, aid, date){ return `${owner}|${aid}|${date}`; }
function isCellDone(owner, aid, date){ return !!(DATA.completedCells||{})[cellKey(owner,aid,date)]; }
function isCellSkipped(owner, aid, date){ return !!(DATA.skippedCells||{})[cellKey(owner,aid,date)]; }
function isCellDismissed(owner, aid, date){ return !!(DATA.dismissedCells||{})[cellKey(owner,aid,date)]; }
function getAiPlanKpn(owner, aid, date){ return (DATA.aiPlanKpn||{})[cellKey(owner,aid,date)] || ''; }
function updateAiPlanKpn(owner, aid, date, value){
  value = (value||'').trim();
  if(!DATA.aiPlanKpn) DATA.aiPlanKpn = {};
  const k = cellKey(owner,aid,date);
  if(value==='') delete DATA.aiPlanKpn[k];
  else DATA.aiPlanKpn[k] = value;
  saveState();
}
function dismissCell(owner, aid, date){
  if(!DATA.dismissedCells) DATA.dismissedCells = {};
  DATA.dismissedCells[cellKey(owner,aid,date)] = true;
}
function toggleCellDone(owner, aid, date){
  if(!DATA.completedCells) DATA.completedCells = {};
  const k = cellKey(owner, aid, date);
  if(DATA.completedCells[k]) delete DATA.completedCells[k];
  else { DATA.completedCells[k] = true; if(DATA.skippedCells) delete DATA.skippedCells[k]; }  // 완료 켜면 '안 함' 해제
  saveState();
}
function toggleCellSkip(owner, aid, date){
  if(!DATA.skippedCells) DATA.skippedCells = {};
  const k = cellKey(owner, aid, date);
  if(DATA.skippedCells[k]) delete DATA.skippedCells[k];
  else { DATA.skippedCells[k] = true; if(DATA.completedCells) delete DATA.completedCells[k]; }   // '안 함' 켜면 완료 해제
  saveState();
}
// 토글 시 전체 재렌더 없이 해당 셀의 ✓/✕ 버튼·클래스만 갱신 (표 스크롤 위치 유지)
function refreshSchedToggleBtns(e, owner, aid, date){
  const btn = e && e.target ? e.target.closest('button') : null;
  const cell = btn ? (btn.closest('.sched-cell') || btn.closest('.allsched-item')) : null;
  if(!cell) return;
  const doneOn = isCellDone(owner, aid, date);
  const skipOn = isCellSkipped(owner, aid, date);
  const dB = cell.querySelector('.done-btn');
  const sB = cell.querySelector('.skip-btn');
  if(dB) dB.classList.toggle('is-done', doneOn);
  if(sB) sB.classList.toggle('is-skip', skipOn);
  cell.classList.toggle('done', doneOn);
  cell.classList.toggle('skipped', skipOn);
}

/* ============================================================
   날짜 유틸
============================================================ */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function dateOnly(str){ return str ? str.slice(0,10) : ''; }
function timeOnly(str){ return (str && str.length>10) ? str.slice(11,16) : ''; }
function combineDT(dateVal, timeVal){
  if(!dateVal) return null;
  return timeVal ? (dateVal+' '+timeVal) : dateVal;
}
function ampmTime(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  if(isNaN(h)) return hhmm;
  const period = h < 12 ? '오전' : '오후';
  let h12 = h % 12;
  if(h12===0) h12 = 12;
  return `${period} ${h12}:${String(m).padStart(2,'0')}`;
}
function fmtShort(str){
  if(!str) return '—';
  const date = str.slice(0,10);
  const time = str.length>10 ? str.slice(11,16) : '';
  const [y,m,d] = date.split('-');
  return `${m}/${d}` + (time ? ' '+ampmTime(time) : '');
}
function fmtFull(str){ return str || '—'; }
function fmtYmd(str){
  if(!str) return '—';
  const date = str.slice(0,10);
  const time = str.length>10 ? str.slice(11,16) : '';
  const [y,m,d] = date.split('-');
  return `${y}/${m}/${d}` + (time ? ' '+ampmTime(time) : '');
}
function fmtYmdShort(str){ const t = fmtYmd(str); return t==='—' ? t : t.replace(/^\d{2}(\d{2}\/)/, '$1'); }
function ageMonths(birth){
  if(!birth) return '—';
  const [y,m,d] = birth.split('-').map(Number);
  const now = new Date();
  let months = (now.getFullYear()-y)*12 + (now.getMonth()+1-m);
  if(now.getDate() < d) months -= 1;
  return months + '개월';
}
/* 품종 그림/배지 + 수정난이도 별 꾸밈 */
function breedIcon(breed){ return breed==='젖소' ? '🐄' : '🐂'; }
function difficultyStars(level){
  if(!level) return '—';
  const n = Math.max(0, Math.min(5, +level));
  return `<span class="diff-stars"><span class="on">${Array(n).fill(`<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"currentColor\"><path d=\"M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z\"/></svg>`).join('')}</span><span class="off">${Array(5-n).fill(`<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><path d=\"M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z\"/></svg>`).join('')}</span></span> <span class="diff-num">(${n}/5)</span>`;
}
function weekdayKr(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
}
function isWeekend(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const wd = new Date(y,m-1,d).getDay();
  return wd===0 || wd===6;
}
function dateRangeArray(start,end){
  const out = [];
  let cur = start;
  let guard = 0;
  while(cur <= end && guard < 400){
    out.push(cur);
    cur = addDays(cur,1);
    guard++;
  }
  return out;
}
function uid(prefix){
  return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function esc(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  html += `<div class="tab-break" aria-hidden="true"></div>`;
  // 현재 보고 있는 축주가 보관됨이면 임시로 보여줌
  if(ownerArch(UI.owner)){
    html += `<div class="owner-tab active archived-view" data-action="setOwner" data-owner="${esc(UI.owner)}">${svgIcon('archive',15)} ${esc(UI.owner)}</div>`;
  }
  html += orderedActiveOwners().map(o => `
    <div class="owner-tab ${o===UI.owner?'active':''} ${ownerFav(o)?'fav':''}" data-action="setOwner" data-owner="${esc(o)}">${ownerFav(o)?svgIcon('star',14)+' ':''}${esc(o)}</div>

    html += `<div class="owner-tab manage" data-action="openOwnerManage">${svgIcon('gear',15)} 축주관리${archN?` ${svgIcon('archive',13)} ${archN}`:''}</div>`;
  }
  html += `<div class="owner-tab addnew" data-action="addOwner">+ 축주 추가</div>`;
  return html;
}

   전체 검색 (개체번호·비고·소견·질환·약물·축주 등 모든 텍스트)
============================================================ */
function gsHighlight(text, q){
  const e = esc(String(text));
  const eq = esc(q).trim();
  if(!eq) return e;
  try{
    const re = new RegExp(eq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
    return e.replace(re, m=>`<mark class="gs-mark">${m}</mark>`);
  }catch(err){ return e; }
}
function renderSearchResults(){
  const q = UI.globalSearch.trim();
  if(!q) return '';
  const ql = q.toLowerCase();
  const qn = q.replace(/\s/g,'').toLowerCase();
  const FIELD_LABELS = {
    notes:'비고', hormoneTreatment:'호르몬·처치', ultrasound:'초음파', ultraOvaryL:'좌난소',
    ultraOvaryR:'우난소', uterineDisease:'자궁', ovarianDisease:'난소', estrusInfo:'발정소견',
    kpn:'KPN', calfSex:'송아지', expectedCycle:'발정주기', memo:'메모', rectalExam:'직장검사'
  };
  const SKIP = new Set(['id','owner','animalId','done','skipped']);
  const groups = {};
  const ensure = (owner, animalId) => {
    const k = owner+'|'+animalId;
    return (groups[k] = groups[k] || { owner, animalId, idHit:false, hits:[] });
  };
  // 개체(혈통·번호)
  DATA.animals.forEach(a => {
    const idHit = a.animalId.replace(/\s/g,'').toLowerCase().includes(qn);
    let g = null;
    if(idHit){ g = ensure(a.owner, a.animalId); g.idHit = true; }
    ['breed','sire','damSire','damDamSire'].forEach(f => {
      if((a[f]||'').toLowerCase().includes(ql)){
        g = g || ensure(a.owner, a.animalId);
        g.hits.push({ label:({breed:'품종',sire:'부',damSire:'외조부',damDamSire:'외외증조부'})[f], text:a[f] });
      }
    });
  });
  // 기록(모든 텍스트 필드)
  DATA.records.forEach(r => {
    const idHit = (r.animalId||'').replace(/\s/g,'').toLowerCase().includes(qn);
    const snips = [];
    for(const k in r){
      if(SKIP.has(k)) continue;
      const v = r[k];
      if(typeof v==='string' && v && v.toLowerCase().includes(ql)){
        snips.push({ label: FIELD_LABELS[k] || k, text: v });
      }
    }
    if(idHit || snips.length){
      const g = ensure(r.owner, r.animalId);
      if(idHit) g.idHit = true;
      snips.forEach(s => g.hits.push(s));
    }
  });
  const list = Object.values(groups);
  if(!list.length){
    return `<div class="panel"><div class="empty-state">'${esc(q)}' 검색 결과가 없어요.<br><span style="font-size:13px;color:var(--ink-soft);">개체번호·비고·소견·질환·약물·혈통 등에서 찾아요.</span></div></div>`;
  }
  list.sort((a,b) => (b.owner===UI.owner?1:0)-(a.owner===UI.owner?1:0) || a.owner.localeCompare(b.owner) || a.animalId.localeCompare(b.animalId));
  const rows = list.map(g => {
    // 중복 스니펫 제거
    const seen = new Set();
    const uniq = g.hits.filter(h => { const key=h.label+'|'+h.text; if(seen.has(key)) return false; seen.add(key); return true; });
    const shown = uniq.slice(0,4);
    const more = uniq.length - shown.length;
    const snipHtml = shown.map(h => `<span class="sr-snip"><b>${esc(h.label)}</b> ${gsHighlight(h.text, q)}</span>`).join('');
    return `
      <div class="sr-row">
        <div class="sr-head">
          <span class="tag-chip" data-animal-id="${esc(g.animalId)}" data-owner="${esc(g.owner)}">${esc(g.animalId)}</span>
          <span class="sr-owner">${esc(g.owner)}</span>
          ${g.idHit?'<span class="sr-idtag">개체번호 일치</span>':''}
        </div>
        ${snipHtml?`<div class="sr-snips">${snipHtml}${more>0?`<span class="sr-more">+${more}건</span>`:''}</div>`:''}
      </div>`;
  }).join('');
  return `
    <div class="panel">
      <div class="section-title"><span>검색 결과 — '${esc(q)}' (${list.length}두)</span></div>
      <div class="sr-list">${rows}</div>
    </div>`;
}

/* ============================================================
   개체별 보기
============================================================ */
function ownerAnimals(){
  return DATA.animals.filter(a=>a.owner===UI.owner).sort((a,b)=>a.animalId.localeCompare(b.animalId));
}
function animalRecords(animalId){
  return DATA.records.filter(r=>r.owner===UI.owner && r.animalId===animalId)
    .sort((a,b)=> recordSortKey(b) - recordSortKey(a));
}
// 기록의 대표 날짜 = 진료일 우선, 없으면 발정→수정→분만→동기화 순. (동기화 미래일정이 진료일을 덮지 않음)
function recordSortKey(r){
  const d = r.examDate || r.estrusDate || r.aiDate || r.calvingDate || r.stillbirthDate || firstSyncDate(r);
  if(!d) return -1;
  return new Date(d.slice(0,10)+'T'+(d.length>10?d.slice(11,16):'00:00')).getTime();
}
function lastNonEmpty(recs, field){
  for(const r of recs){ if(r[field]) return r[field]; }
  return null;
}
function sortKeyOf(r){
  const d = r.examDate || r.aiDate || r.estrusDate;
  if(!d) return -1;
  return new Date(d.slice(0,10)+'T'+(d.length>10?d.slice(11,16):'00:00')).getTime();
}
// 개체번호 3번째 그룹 기준 정렬 (예: "002 2029 9407 0" → 9407)
function animalSortGroup(id){
  const parts = String(id||'').trim().split(/\s+/);
  const g = parts.length>=3 ? parts[2] : (parts[parts.length-1]||'');
  const n = parseInt(g,10);
  return isNaN(n) ? Infinity : n;
}
function sortScheduleIds(ids, owner, auto){
  const mode = DATA.scheduleSortMode || 'date';
  const asc = (DATA.scheduleSortDir||'asc') !== 'desc';
  if(mode==='date' && owner){
    const today = todayStr();
    const keyOf = aid => {
      const dates = new Set();
      if(auto && auto[aid]) Object.keys(auto[aid]).forEach(d=>{ if(!isCellDismissed(owner,aid,d)) dates.add(d); });
      DATA.schedule.filter(s=>s.owner===owner && s.animalId===aid && (s.note||'').trim()).forEach(s=>dates.add(dateOnly(s.date)));
      const arr = Array.from(dates).filter(Boolean).sort();
      const up = arr.filter(d=>d>=today);
      return up.length ? '0'+up[0] : '1';   // 다가오는 일정 가까운 순 → 없으면 뒤로(번호순)
    };
    return ids.slice().sort((a,b)=>{
      const ka=keyOf(a), kb=keyOf(b);
      if(ka!==kb) return ka<kb?-1:1;
      const ga=animalSortGroup(a), gb=animalSortGroup(b);
      if(ga!==gb) return ga-gb;
      return String(a).localeCompare(String(b));
    });
  }
  return ids.slice().sort((a,b)=>{
    const ka=animalSortGroup(a), kb=animalSortGroup(b);
    if(ka!==kb) return asc ? ka-kb : kb-ka;
    return asc ? String(a).localeCompare(String(b)) : String(b).localeCompare(String(a));
  });
}
function lastRecordDate(animalId){
  const recs = animalRecords(animalId);
  if(!recs.length) return null;
  return recs[0].examDate || recs[0].aiDate || recs[0].estrusDate || null;
}
// 개체 상태 → 배지 클래스 + 정렬 우선순위 (작을수록 위로)
function animalStatusMeta(status){
  switch(status){
    case '임신감정 필요': return { cls:'check',   order:0 };
    case '감정 대기':     return { cls:'warn',    order:1 };
    case '비임신':        return { cls:'rebreed', order:2 };
    case '미수정':        return { cls:'unknown', order:3 };
    case '임신중':        return { cls:'preg',    order:4 };
    case '비육전환':      return { cls:'fatten',  order:5 };
    default:              return { cls:'unknown', order:6 };
  }
}

/* ===== 발정주기일 추정 (초음파 → 프로토콜 → 오늘 투영) ===== */
function daysBetween(fromStr, toStr){
  if(!fromStr || !toStr) return 0;
  const a = new Date(fromStr.slice(0,10)+'T00:00');
  const b = new Date(toStr.slice(0,10)+'T00:00');
  return Math.round((b - a) / 86400000);
}
function parseUltra(text){
  text = text || '';
  const cyst = /낭종/.test(text);
  // 낭종으로 표기된 'NNmm' 수치는 집계에서 제거 (난포낭종/황체낭종 등)
  const clean = text.replace(/[가-힣A-Za-z]*낭종[^\d]{0,4}\(?\s*\d+(?:\.\d+)?\s*mm/g, ' 낭종 ')
                    .replace(/\d+(?:\.\d+)?\s*mm[^\d]{0,4}낭종/g, ' 낭종 ');
  const clMentioned = /황체/.test(clean);
  let clSize = null;
  const cm = clean.match(/황체[가-힣\s]*?(\d+(?:\.\d+)?)\s*mm/);
  if(cm) clSize = parseFloat(cm[1]);
  const smallFoll = /소난포/.test(clean);
  const allMm = [...clean.matchAll(/(\d+(?:\.\d+)?)\s*mm/g)].map(x=>parseFloat(x[1]));
  const foll = allMm.slice();
  if(clSize!=null){ const i=foll.indexOf(clSize); if(i>-1) foll.splice(i,1); }
  const follMax = foll.length ? Math.max(...foll) : null;
  const follBig = foll.filter(v => v >= 10).length;   // 10mm 넘는 난포 개수 (좌·우 각각 적힌 경우만 셀 수 있음)
  let dom = null;
  const dm = clean.match(/(?:우성|우세)난포[^\d]{0,3}(\d+(?:\.\d+)?)\s*mm/);
  if(dm) dom = parseFloat(dm[1]);
  return { clMentioned, clSize, smallFoll, follMax, follBig, dom, cyst };
}
function recHasCyst(r){
  if(!r) return false;
  if(/낭종/.test(r.ovarianDisease||'')) return true;
  const u = [r.ultraUterus, r.ultraOvaryL, r.ultraOvaryR, r.ultrasound].filter(Boolean).join(' ');
  return /낭종/.test(u);
}
const VWP_DAYS = 40;   // 분만 후 재수정 휴지기
// 낭종 종류를 명확히 식별 (난포낭종 / 황체낭종)
function cystType(r){
  const src = [r.ovarianDisease, r.ultraUterus, r.ultraOvaryL, r.ultraOvaryR, r.ultrasound].filter(Boolean).join(' ');
  if(/난포\s*낭종|난포낭종|난포성\s*낭종/.test(src)) return '난포낭종';
  if(/황체\s*낭종|황체낭종|황체성\s*낭종/.test(src)) return '황체낭종';
  return '낭종';
}
function recDate(r){ return dateOnly(r.examDate || r.aiDate || r.estrusDate || ''); }
/* 기록에 수기로 적어둔 '다음발정일' 중 가장 최근 것 (추정 불가일 때 보조용) */
function manualNextEstrus(recs){
  const ds = recs.filter(r => dateOnly(r.nextEstrusDate||'')).map(r => dateOnly(r.nextEstrusDate)).sort();
  return ds.length ? ds[ds.length-1] : '';
}
function latestCalvingDate(recs){
  const ds = recs.filter(r => dateOnly(r.calvingDate||'')).map(r => dateOnly(r.calvingDate)).sort();
  return ds.length ? ds[ds.length-1] : '';
}
function latestCalvingRec(recs){
  const cs = recs.filter(r => dateOnly(r.calvingDate||''))
    .sort((x,y)=> dateOnly(y.calvingDate).localeCompare(dateOnly(x.calvingDate)));
  return cs[0] || null;
}
function latestStillbirthDate(recs){
  const ds = recs.filter(r => dateOnly(r.stillbirthDate||'')).map(r => dateOnly(r.stillbirthDate)).sort();
  return ds.length ? ds[ds.length-1] : '';
}
function latestStillbirthRec(recs){
  const cs = recs.filter(r => dateOnly(r.stillbirthDate||''))
    .sort((x,y)=> dateOnly(y.stillbirthDate).localeCompare(dateOnly(x.stillbirthDate)));
  return cs[0] || null;
}
// 번식주기를 끝낸(분만 또는 사산) 가장 최근 날짜와 그 종류
function latestReproEnd(recs){
  const calv = latestCalvingDate(recs);
  const still = latestStillbirthDate(recs);
  if(!calv && !still) return null;
  const isStill = still && (!calv || still > calv);
  return { date: isStill ? still : calv, stillbirth: !!isStill };
}
// 직전 임신(1차 O) 이후 분만 또는 사산했는지 (번식주기 종료 여부)
function calvedAfterPregnancy(recs){
  const end = latestReproEnd(recs);
  if(!end) return false;                                                    // 분만·사산 없으면 종료 아님
  // 종료일 이후에 새 수정(AI)이나 임신(O) 감정이 있으면 새 번식주기 시작 → 종료 아님
  const bredAgain = recs.some(r =>
    (r.aiDate && dateOnly(r.aiDate) > end.date) ||
    ((r.pregnant||'').trim().toUpperCase()==='O' && recDate(r) > end.date)
  );
  return !bredAgain;
}
function isCurrentlyPregnant(recs){
  if(!recs || !recs.length) return false;
  const sorted = recs.slice().sort((x,y)=> sortKeyOf(y) - sortKeyOf(x));
  const aiRecs = recs.filter(r=>r.aiDate);
  const latestAiTs = aiRecs.length ? Math.max(...aiRecs.map(sortKeyOf)) : -Infinity;
  const diagPool = sorted.filter(r => sortKeyOf(r) >= latestAiTs);   // 최근 수정 이후의 감정만
  if((lastNonEmpty(diagPool,'pregnant')||'').trim().toUpperCase()!=='O') return false; // 최근 수정 후 1차 O 아님
  if((lastNonEmpty(diagPool,'pregnant2')||'').trim().toUpperCase()==='X') return false; // 2차 감정 X → 임신 아님(유산·오진). 수태율엔 1차 O로 남음
  if(calvedAfterPregnancy(recs)) return false;                                          // 임신 후 분만함
  return true;
}
// 최근 수정(AI) 후 임신감정 결과를 아직 기다리는 중인지 (1차 X도 O도 분만도 아님)
function awaitingPregOutcome(recs){
  const aiRecs = (recs||[]).filter(r=>r.aiDate);
  if(!aiRecs.length) return false;                                   // 수정 안 함 → 대기 아님
  if(calvedAfterPregnancy(recs)) return false;                       // 분만했으면 대기 아님
  const latestAiTs = Math.max(...aiRecs.map(sortKeyOf));
  const diag = recs.filter(r => sortKeyOf(r) >= latestAiTs);
  const preg1X = diag.some(r => (r.pregnant||'').trim().toUpperCase()==='X');
  const preg2X = diag.some(r => (r.pregnant2||'').trim().toUpperCase()==='X');
  if(preg1X || preg2X) return false;                                // 1차 또는 2차 X → 재수정 대상, 대기 끝
  return true;                                                       // 아직 감정 결과 없음 → 대기
}
/* 기록에 실제 발정징후가 있었는지 (없음/무발정/발정아님 등 부정표기는 제외) */
function hasEstrusSign(r){
  if(!r) return false;
  if(/발정\s*아님/.test(r.notes||'')) return false;              // notes에 '발정 아님' → 발정 아님
  const s = ((r.estrusSign)||'').trim();
  if(s){
    if(/없음|무발정/.test(s)) return false;
    if(/MT|ST|점액|빙빙|발정|출혈|bleeding|승가|활동성|부종|재발정|탐지기/i.test(s)) return true;
  }
  if(dateOnly(r.estrusDate||'')) return true;                    // 발정일시를 기록했으면 발정 들은 것
  return false;
}
function cycleDayRange(p, estrus){
  /* 직장검사 탭 '날짜별 난소 모식(21일 2파)' 기준. 황체 크기 + 가장 큰 난포 + 10mm 넘는 난포 개수로 주기일 범위를 추정.
     황체 크기 없이 '황체'만 적힌 기록은 20mm(기능성)로 간주 */
  const cl = p.clSize!=null ? p.clSize : (p.clMentioned ? 20 : null);
  const f  = Math.max(p.follMax!=null ? p.follMax : -1, p.dom!=null ? p.dom : -1); const fm = f>=0 ? f : null;
  const small = p.smallFoll, big = p.follBig||0;
  const noCL = cl==null;
  if(cl!=null && cl>=20){
    if(estrus && fm!=null && fm>=8) return [7,9];            // 큰 황체 + 난포 + 발정 비슷한 징후 → 1차 우성난포 E2(주기 중반)
    if(fm!=null && fm>=15) return [7,10];                    // 황체 25~30 + 1차 우성난포 15~18mm
    if(fm!=null && fm>=10 && big>=2) return [14,16];         // 10mm 넘는 난포 2개(폐쇄된 1차+2차) → 황체기 후반
    if(fm!=null && fm>=10) return [5,6];                     // 황체 20~25 + 1차 우성난포 12~14mm
    if(small || fm==null || fm<10) return [11,13];           // 큰 황체 + 소난포만 → 1차 폐쇄·2차 난포파 출현
  }
  if(cl!=null && cl>=15 && cl<20){
    if(fm!=null && fm>=14) return [19,20];                   // 퇴행 황체(<20) + 성숙 난포 15~18mm
    if(fm!=null && fm>=8)  return [3,4];                     // 형성 중 황체 15~18 + 1차 우성난포 8~10mm
    if(small || fm==null)  return [2,3];
  }
  if(cl!=null && cl>=10 && cl<15){
    if(fm!=null && fm>=14) return [20,21];                   // 퇴행 황체 + 배란 직전 난포
    return [2,3];                                            // 황체 10~15 + 소난포 → 배란 2~3일 후
  }
  if(cl!=null && cl<10){
    if(fm!=null && fm>=15) return [0,0];                     // 퇴행 황체(작음) + 배란 난포 → 발정일
    return [1,2];                                            // 적체·작은 황체 + 소난포
  }
  if(noCL){
    if(fm!=null && fm>=15) return [0,0];                     // 황체 안 보임 + 큰 난포 → 발정·배란 전 (낭종·난소정지 감별 필요)
    if(small || (fm!=null && fm<10)) return [1,2];           // 황체 안 보임 + 소난포 → 배란 직후
  }
  return null;
}
function estimateCycleToday(animal, recs){
  if(!recs || !recs.length) return null;
  if(animal && animal.fattening) return { fattenSkip:true };
  if(isCurrentlyPregnant(recs)) return { pregnantSkip:true };
  // 가장 최근 진료가 낭종(질환 또는 초음파)이면 추정 안 함
  if(recHasCyst(recs[0])) return { cystSkip:true };
  const cycleLen = parseInt(animal.cycleLength,10) || 21;
  const mode = animal.waveMode || '2';
  if(mode==='3'){
    const base = recs[0];
    const baseDate = dateOnly(base.examDate || base.aiDate || base.estrusDate || '');
    if(!baseDate) return null;
    const md = parseFloat(animal.manualCycleDay);
    if(isNaN(md)) return { needManual:true, cycleLen };
    const elapsed = daysBetween(baseDate, todayStr());
    let day = (md*(cycleLen/21) + elapsed) % cycleLen; if(day<0) day+=cycleLen;
    return { day: Math.round(day), cycleLen, elapsed, baseDate, basis:`수동 ${md}일`, mode };
  }
  // 2난포파: 낭종이 아닌, 초음파가 적힌 가장 최근 진료 기준
  const ultraRec = recs.find(r => !recHasCyst(r) && [r.ultraOvaryL,r.ultraOvaryR,r.ultraUterus,r.ultrasound].some(v=>v&&v.trim()));
  if(!ultraRec) return { undetermined:true, cycleLen };
  const baseDate = dateOnly(ultraRec.examDate || ultraRec.aiDate || ultraRec.estrusDate || '');
  if(!baseDate) return { undetermined:true, cycleLen };
  const ultra = [ultraRec.ultraOvaryL, ultraRec.ultraOvaryR, ultraRec.ultraUterus, ultraRec.ultrasound].filter(Boolean).join(' ');
  const p = parseUltra(ultra);
  const rng = cycleDayRange(p, hasEstrusSign(ultraRec));
  if(!rng) return { undetermined:true, cycleLen, baseDate };
  const elapsed = daysBetween(baseDate, todayStr());
  // 초음파가 21일 넘게 지났으면 그 사이 발정이 지났다는 가정이라, 주기 길이를 20~22일로 폭을 주고 추정(신뢰도 낮음 표시)
  const stale = elapsed > 21;
  const lens = stale ? [20,21,22] : [cycleLen];
  const set = new Set();
  lens.forEach(L => { const sc = L/21;
    for(let r=rng[0]; r<=rng[1]; r++){ let x = Math.round((r*sc + elapsed) % L); if(x<0) x+=L; set.add(Math.round(x*21/L) % 21); } });
  const days = [...set].sort((a,b)=>a-b);
  // 연속 구간(21일 순환)으로 lo~hi 표시
  let lo = days[0], hi = days[days.length-1];
  if(days.length>1 && hi-lo+1 > days.length){                   // 0 근처를 넘는 경우: 가장 큰 빈틈 뒤가 시작
    let gapAt=-1, gapMax=0; for(let i=0;i<days.length;i++){ const g=((days[(i+1)%days.length]-days[i])+21)%21; if(g>gapMax){gapMax=g;gapAt=i;} }
    lo = days[(gapAt+1)%days.length]; hi = days[gapAt];
  }
  const day = days[Math.floor(days.length/2)];
  return { day, lo, hi, days, stale, cycleLen, elapsed, baseDate, basis:`초음파 ${rng[0]}~${rng[1]}일${stale?' · 20~22일 주기 가정':''}`, mode, ultra };
}
function cycleTodayHtml(animal, recs){
  const r = estimateCycleToday(animal, recs);
  if(!r) return '—';
  if(r.fattenSkip) return `<span style="color:var(--ink-soft);">비육전환 — 추정 안 함</span>`;
  if(r.pregnantSkip) return `<span class="preg-badge">🍼 임신중</span> <span style="color:var(--ink-soft);font-size:12px;">발정주기 추정 안 함</span>`;
  if(r.cystSkip) return `<span style="color:var(--ink-soft);">낭종 — 추정 안 함</span>`;
  if(r.needManual) return `<span style="color:var(--ink-soft);">3난포파 · 주기일 입력 필요</span>`;
  if(r.undetermined) return `<span style="color:var(--ink-soft);">${r.cyst?'낭종 — 추정 제외':'초음파로 판정 불가'}</span>`;
  const dayTxt = (r.lo!=null && r.hi!=null && r.lo!==r.hi) ? `약 ${r.lo}~${r.hi}일째` : `약 ${r.day}일째`;
  return `<span class="cycle-today-main" style="color:var(--accent);${r.stale?'opacity:.55;':''}">${dayTxt}</span>${r.stale?' <span style="font-size:11px;color:var(--ink-soft);">(신뢰도 낮음)</span>':''}`
    + `<div class="cycle-today-sub" style="font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px;">`
    + `${r.mode==='3'?'3':'2'}난포파 · ${r.basis} · 진료후 ${r.elapsed}일</div>`;
}

function animalListData(){
  const q = UI.animalSearch.replace(/\s/g,'').trim();
  let animals = ownerAnimals().filter(a => a.animalId.replace(/\s/g,'').includes(q));
  // 각 개체 상태 계산
  const withStatus = animals.map(a => {
    const s = shareAnimalStatus(UI.owner, a);
    return { a, status: s.status, days: s.days, meta: animalStatusMeta(s.status) };
  });
  // 정렬: 상태별 또는 개체번호순
  if(UI.animalSort==='status'){
    withStatus.sort((x,y)=>{
      if(x.meta.order!==y.meta.order) return x.meta.order-y.meta.order;
      return animalSortGroup(x.a.animalId)-animalSortGroup(y.a.animalId);
    });
  } else {
    withStatus.sort((x,y)=>{
      const ka=animalSortGroup(x.a.animalId), kb=animalSortGroup(y.a.animalId);
      if(ka!==kb) return ka-kb;
      return String(x.a.animalId).localeCompare(String(y.a.animalId));
    });
  }
  animals = withStatus.map(w=>w.a);
  const listHtml = withStatus.map(({a, status, days, meta}) => {
    const last = lastRecordDate(a.animalId);
    const dayTxt = (days!=null && (status==='임신감정 필요'||status==='감정 대기'||status==='비임신')) ? ` ${days}일` : '';
    const badge = `<span class="pc-badge ${meta.cls} list-status">${esc(status)}${dayTxt}</span>`;
    return `
    <div class="animal-list-item ${a.animalId===UI.selectedAnimal?'active':''} ${a.fattening?'fattened':''}" data-action="selectAnimal" data-id="${esc(a.animalId)}">
      <span class="list-id-row"><span class="breed-emoji">${breedIcon(a.breed)}</span>${(()=>{ const f=animalFlags(UI.owner,a); return idChip(a,f,'sm'); })()}${badge}</span>
      <span class="animal-meta">
        <span>산차 ${esc(a.parity||'—')}</span>
        <span>${ageMonths(a.birth)}</span>
        <span>최근 ${last?fmtShort(last):'기록없음'}</span>
      </span>
    </div>`;
  }).join('') || `<div class="empty-state">검색 결과가 없어요.</div>`;
  return { animals, listHtml };
}

function estrusSummary(r){
  const parts = [];
  if(r.estrusVulvar) parts.push('외음부종창/충혈 '+r.estrusVulvar);
  if(r.estrusMucus) parts.push('점액 '+r.estrusMucus);
  if(r.estrusContraction) parts.push('자궁수축 '+r.estrusContraction);
  if(r.estrusMT) parts.push('MT '+r.estrusMT);
  if(r.estrusST) parts.push('ST '+r.estrusST);
  if(r.estrusOther) parts.push(r.estrusOther);
  if(parts.length) return parts.join(' · ');
  return r.estrusSign || '';
}
function rectalSummary(r){
  const parts = [];
  if(r.rectalUterus) parts.push('자궁 '+r.rectalUterus);
  if(r.rectalOvaryL) parts.push('좌난소 '+r.rectalOvaryL);
  if(r.rectalOvaryR) parts.push('우난소 '+r.rectalOvaryR);
  if(parts.length) return parts.join(' · ');
  return r.rectalExam || '';
}
function ultraSummary(r){
  const parts = [];
  if(r.ultraUterus) parts.push('자궁 '+r.ultraUterus);
  if(r.ultraOvaryL) parts.push('좌난소 '+r.ultraOvaryL);
  if(r.ultraOvaryR) parts.push('우난소 '+r.ultraOvaryR);
  if(parts.length) return parts.join(' · ');
  return r.ultrasound || '';
}

function dateNoteSummary(r){
  const parts = [];
  const preg = [];
  if((r.pregnant||'').trim())  preg.push('1차 '+r.pregnant.trim());
  if((r.pregnant2||'').trim()) preg.push('2차 '+r.pregnant2.trim());
  if((r.fetalSex||'').trim())  preg.push('성 '+r.fetalSex.trim());
  if(preg.length) parts.push('감정 '+preg.join('/'));
  if((r.calvingDate||'').trim()) parts.push('분만 '+dateOnly(r.calvingDate)+((r.calfSex||'').trim()?'('+r.calfSex.trim()+')':''));
  if((r.stillbirthDate||'').trim()) parts.push('사산 '+dateOnly(r.stillbirthDate));
  if((r.uterineDisease||'').trim()) parts.push('자궁: '+r.uterineDisease.trim());
  if((r.ovarianDisease||'').trim()) parts.push('난소: '+r.ovarianDisease.trim());
  // 구조화된 난소질환이 없어도 초음파 텍스트에 낭종이 있으면 우선 표시
  let extra = '';
  if(!(r.ovarianDisease||'').trim() && /낭종/.test(r.ultrasound||'')) extra = (ultraSummary(r) || r.ultrasound);
  else extra = estrusSummary(r) || ultraSummary(r) || rectalSummary(r) || r.notes || '';
  if(extra) parts.push(extra);
  return parts.join(' · ');
}

/* 진료기록 기반 자동 스케줄 계산 */
function buildAutoSchedule(owner){
  // { animalId: { date: [note, ...] } }
  const result = {};
  const add = (aid, date, note) => {
    if(!date) return;
    if(!result[aid]) result[aid] = {};
    if(!result[aid][date]) result[aid][date] = [];
    if(!result[aid][date].includes(note)) result[aid][date].push(note);
  };

  DATA.records.filter(r=>r.owner===owner).forEach(rec => {
    // 동기화 단계 자동 추가
    for(let i=1;i<=SYNC_STEPS;i++){
      const type = rec['sync'+i+'Type'];
      const date = dateOnly(rec['sync'+i+'Date']);
      const time = timeOnly(rec['sync'+i+'Date']);
      const dose = doseText(rec['sync'+i+'Dose']);
      if(type && date) add(rec.animalId, date, [type, dose, time?ampmTime(time):''].filter(Boolean).join(' '));
    }
  });

  return result;
}

function isMobileWidth(){
  return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width:768px)').matches;
}

function renderScheduleView(){
  ensureOwnerMeta(UI.owner);
  const mode = UI.schedMode || (isMobileWidth() ? 'list' : 'grid');
  const asc = (DATA.scheduleSortDir||'asc')!=='desc';

    <div class="seg sched-modetoggle">
      <button class="${mode==='list'?'active':''}" data-action="setSchedMode" data-mode="list">📋 목록</button>
      <button class="${mode==='grid'?'active':''}" data-action="setSchedMode" data-mode="grid">📊 표</button>
    </div>
    <button class="btn secondary small" data-action="toggleSchedSort" title="정렬 방식 전환">${(DATA.scheduleSortMode||'date')==='date'?'📅 일정순':'🔢 번호순'}</button>
    <button class="btn secondary small" data-action="openSchedImage" title="축주에게 보낼 일정 사진 만들기">📷 일정 사진</button>

/* 한 축주의 스케줄 항목들을 날짜순으로 모음 (표/목록 공통 데이터) */
function scheduleRowsForOwner(owner){
  ensureOwnerMeta(owner);
  const range = DATA.scheduleRange[owner];
  const dates = dateRangeArray(range.start, range.end).filter(d => d >= addDays(todayStr(),-2)); // 3일 이상 지난 일정 숨김
  const auto = buildAutoSchedule(owner);
  const ids = sortScheduleIds(Array.from(new Set([...(DATA.scheduleAnimals[owner] || []), ...Object.keys(auto).filter(aid => Object.keys(auto[aid]).some(d => !isCellDismissed(owner, aid, d)))])), owner, auto);
  const rows = [];
  ids.forEach(aid => {
    dates.forEach(d => {
      const manual = DATA.schedule.find(s=>s.owner===owner && s.animalId===aid && s.date===d);
      const autoEntries = (auto[aid]||{})[d] || [];
      // 자동 일정인데 사용자가 숨긴 칸이면 제외 (수동 일정은 유지)
      if(!manual && autoEntries.length && isCellDismissed(owner, aid, d)) return;
      // 수동 일정(예: 감정)과 자동 일정(예: 동기화 단계)이 같은 날 겹치면 둘 다 보여줌 (한쪽이 다른 쪽을 가리지 않게)
      const parts = [];
      if(manual && manual.note) parts.push(manual.note);
      autoEntries.forEach(e => { if(!parts.includes(e)) parts.push(e); });
      const note = parts.join(' / ');
      if(!note) return;
      rows.push({ aid, date:d, note, done:isCellDone(owner,aid,d), skipped:isCellSkipped(owner,aid,d), isAuto: !manual && !!autoEntries.length, manual: !!manual });
    });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date) || a.aid.localeCompare(b.aid));
  return rows;
}

/* 목록(날짜별) 보기 — 모바일 기본 */
function renderScheduleAgenda(){
  const range = DATA.scheduleRange[UI.owner];
  const rows = scheduleRowsForOwner(UI.owner);
  const today = todayStr();

  let body = '';
  if(!rows.length){
    body = `<div class="empty-state">이 기간에 표시할 일정이 없어요.${isAdmin()?'<br>아래 + 일정 버튼으로 추가할 수 있어요.':''}</div>`;
  } else {
    // 같은 날 · 같은 내용은 개체를 한 줄에 묶음 (수동 일정도 묶이고, 수정하면 묶인 개체 전부에 적용)
    const merged = [];
    rows.forEach(r => {
      const key = [r.date, r.note, r.done?1:0, r.skipped?1:0, r.isAuto?1:0, r.manual?1:0].join('|');
      const g = merged.find(x => x.key===key);
      if(g) g.aids.push(r.aid); else merged.push(Object.assign({ key, aids:[r.aid] }, r));
    });
    // 날짜별 카드 하나 → 안에 '내용' 줄(내용 라벨 + 두수 + 개체 칩)들. 단독/묶음 모두 같은 모양
    const byDate = [];
    merged.forEach(r => { let g = byDate.find(x=>x.date===r.date); if(!g){ g={date:r.date, items:[]}; byDate.push(g); } g.items.push(r); });
    byDate.forEach(g => {
      const lines = g.items.map(r => {
        const tappable = r.manual && isAdmin();
        return `<div class="ag-line ${r.done?'done':''} ${r.skipped?'skipped':''} ${r.isAuto?'auto':'manual'}" ${tappable?`data-action="editSchedItem" data-aid="${esc(r.aid)}" data-aids="${esc(r.aids.join('|'))}" data-date="${r.date}"`:''}>
          <div class="ag-head"><span class="ag-note">${esc(r.note)}</span><span class="ag-n">${r.aids.length}두</span>${tappable?'<span class="ag-edit">수정 ›</span>':''}</div>
          <div class="ag-chips">${r.aids.map(id=>`<span class="tag-chip sm" data-animal-id="${esc(id)}">${esc(id)}</span>`).join('')}</div>
        </div>`;
      }).join('');
      body += `<div class="ag-card ${g.date===today?'today':''}">
        <div class="ag-date">${fmtShort(g.date)} (${weekdayKr(g.date)})${g.date===today?' <span class="ag-today">오늘</span>':''}</div>
        ${lines}
      </div>`;
    });
  }

  return `
    <div class="sched-agenda-bar">
      <button class="btn secondary small" data-action="shiftRange" data-dir="-7">◀ 7일</button>
      <span style="font-size:12px;color:var(--ink-soft);font-weight:700;">${range.start.slice(5)} ~ ${range.end.slice(5)}</span>
      <button class="btn secondary small" data-action="shiftRange" data-dir="7">7일 ▶</button>
      <button class="btn secondary small" data-action="extendRange">+7일</button>
      ${isAdmin()?`<button class="btn small" data-action="addSchedItem" style="margin-left:auto;">+ 일정</button>`:''}
      ${(()=>{ const n=Object.keys(DATA.dismissedCells||{}).filter(k=>k.startsWith(UI.owner+'|')).length; return (isAdmin()&&n)?`<button class="btn secondary small" data-action="restoreDismissed" title="숨긴 자동 일정 모두 복원">${svgIcon('undo',14)} 숨김 ${n} 복원</button>`:''; })()}
    </div>
    <div class="sched-agenda">${body}</div>
  `;
}

function renderScheduleGrid(){
  const range = DATA.scheduleRange[UI.owner];

  //                      (2) 모든 셀이 동일한 개체들은 한 줄로 묶음 (칸 수정은 묶인 개체 전부에 적용)
  const rowsData = animalIds.map(aid => {
    const cells = dates.map(d => {
      const manual = DATA.schedule.find(s=>s.owner===UI.owner && s.animalId===aid && s.date===d);
      let autoEntries = (auto[aid]||{})[d] || [];
      if(!manual && autoEntries.length && isCellDismissed(UI.owner, aid, d)) autoEntries = [];  // 숨긴 자동 일정
      const autoText = autoEntries.join(' / ');

      const displayParts = [];
      if(manual && manual.note) displayParts.push(manual.note);

      const displayVal = displayParts.join(' / ');

      return { d, displayVal, autoText, isAuto, done, skipped, hasContent: !!displayVal };
    });

  rowsData.forEach(r => {

  });
  const bodyRows = groups.map(g => {
    const aid = g.aids[0];
    const safeId = aid.replace(/\s+/g,'_');
    const aidsAttr = g.aids.length>1 ? ` data-aids="${esc(g.aids.join('|'))}"` : '';
    const cells = g.cells.map(c => `<td class="sched-cell ${c.d===today?'today':''} ${c.isAuto?'auto':''} ${c.done&&c.hasContent?'done':''} ${c.skipped&&c.hasContent?'skipped':''}">

          <input type="text" id="sc_${safeId}_${c.d}" data-aid="${esc(aid)}"${aidsAttr} data-date="${c.d}" value="${esc(c.displayVal)}" ${c.isAuto?'placeholder="'+esc(c.autoText)+'"':''}>

    return `<tr class="${g.aids.length>1?'merged':''}">
      <td class="rowhead">
        <div class="rowhead-inner ${g.aids.length>1?'multi':''}">
          <div class="rowhead-chips">${g.aids.map(id=>`<span class="tag-chip sm" data-animal-id="${esc(id)}">${esc(id)}</span>`).join('')}</div>
          ${g.aids.length>1?`<span class="rowhead-n">${g.aids.length}두</span>`:`<button class="iconbtn" data-action="removeScheduleAnimal" data-id="${esc(aid)}">${svgIcon('x',14)}</button>`}
        </div>
      </td>
      ${cells}
    </tr>`;
  }).join('') || `<tr><td class="rowhead">—</td><td colspan="${dates.length}"><div class="empty-state" style="padding:14px;">이 기간에 일정이 있는 개체가 없어요. 개체를 추가하고 칸을 채워보세요.</div></td></tr>`;

  const existingIds = ownerAnimals().map(a=>a.animalId);

  return `
    <div class="chip-row">${QUICK_CODES.map(c=>`<button class="quick-chip" data-action="insertChip" data-code="${esc(c)}">${esc(c)}</button>`).join('')}</div>

        <button class="btn secondary small" data-action="extendRange">+ 7일 연장</button>

        <input class="search-input" id="scheduleAddInput" list="animalIdList" placeholder="개체번호 입력 후 추가" style="margin-bottom:0;width:200px;">
        <datalist id="animalIdList">${existingIds.map(id=>`<option value="${esc(id)}">`).join('')}</datalist>
        <button class="btn small" data-action="addScheduleAnimal">+ 개체 추가</button>
        <button class="btn danger small" data-action="clearAllSchedule">전체 삭제</button>
      </div>
    </div>
    <div class="sched-wrap">
      <table class="sched-table">
        <thead><tr>${header}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
