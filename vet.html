<li>일차 징후인 승가 허용은 승가를 받기 위해 도망 안 치고 가만히 서는 것임. 횟수 변동이 큼(3~140회). 평균 35회, 각 3~7초임. 일부 암소는 승가 허용을 안 보여 교배 관리의 난제임.</li>
<li>이차 징후는 안절부절·활동 증가, 꼬리 들기, 길고 맑은 점액, 붉고 부종된 외음부, 거칠어진 미근부·등의 진흙, 다른 소 따라다니기·울기, 외음부 냄새 맡기·플레멘·머리 얹기임. 승가하되 안 서고 핥기·비비기·박치기 같은 혼란스러운 행동도 있음.</li>
<li>발정 중 풍부한 맑은 분비물은 정상임. 혈성 분비물도 정상이나 발정이 1~3일 전 끝났음을 가리켜 수정엔 보통 너무 늦음. 19일 후 다음 발정을 면밀히 관찰함. 혼탁·우유빛·화농성이면 질·자궁경·자궁 감염 가능성이라 수태율이 떨어짐.</li>
<li>동시에 여러 소가 성적 행동을 보이면(특히 동기화 시) 누가 발정인지 가리기 어려움. 성적 활성 군에서 승가하는 소가 반드시 발정인 건 아니고 곧 들어올 수 있음. E2 상승이나 사회적 우위에서 비롯됨.</li>
<li>홀스타인 200두 관찰에서 승가 허용 기립 지속은 4.7±1.5시간, 첫~마지막 발정 행동 간은 14.0±1.9시간이었고, 가장 흔한 행동은 외음부 냄새 맡기·턱 얹기였음. 발정 중 사료 섭취·산유가 줄 수 있음. 육우는 우는 송아지로 산유 감소를 알아채기도 함.</li>
<li>발정 강도·발견 가능성은 품종·분만 후 기간·산차·산유량·건강·영양·날씨·스트레스·호르몬 치료·수소 존재·바닥·무리 크기 등의 영향을 받음.</li>
<li>Bos taurus(8~18시간)가 Bos indicus(6~12시간)보다 뚜렷하고 어두운 색 품종이 더 큼. 분만 후 초기 배란은 흔히 발정이 약하거나 없음(분만기 고E2의 불응 효과). 비유우 약 20%(7~41%)가 60일 VWP 종료 시 무발정·무배란임.</li>
<li>고생산우는 E2가 낮고 발정이 짧음(E2·P4 대사율 증가). 단 무관하다는 보고도 있음. 영양 부족·부실 BCS는 발정에 부정적이고, 고급 사료의 산유 증가가 오히려 발정 강도를 낮추기도 함.</li>
<li>승가 허용은 산차가 높을수록 길고 강해짐. 경산우가 더 정확하고 초산우는 보행·승가 활동이 더 큼. 파행·유방염은 발정 발현을 줄임(신체 활동 감소 또는 낮은 P4·LH).</li>
<li>열·폭우·고습은 발정을 억제함. 시원한 밤·이른 아침(저녁 7시~아침 7시)에 승가·기립이 많음. 흙바닥이 콘크리트보다 낫고 고무매트가 개선하며 계류식보다 자유우방, 방목우보다 축사우가 승가가 많음.</li>
<li>수소 존재는 페로몬으로 분만 후 주기 재개를 촉진하고 첫 발정을 단축함. 단 발정 지속·강도엔 영향 없다는 보고도 있음. 동시 발정이 많으면 강도·발견이 오르지만 과밀은 비발정우 오기립으로 오진을 부름.</li>
<li>시각 관찰은 가장 흔한 발견법임. 관찰자 경험·빈도·길이·시간대가 효율을 크게 좌우함. 아침 1시간·저녁 1시간 관찰하되 소가 수용·급이·방목 구역을 오가며 사회적 상호작용을 하는 정상 활동 중에 봄. 일차 징후를 식별하면서 이차 징후도 놓치지 않고, 일부는 짧은 발정을, 일부는 아무 징후도 안 보임을 인지함.</li>
<li>승가 허용 발견 효율은 무리마다 50% 미만~약 90%로 편차가 큼. 이른 아침+늦은 저녁 각 1시간 하루 2회면 94%, 하루 3회 각 30분이면 90%임. 미끄러운 콘크리트·고인 물 바닥은 항상 피함. 발견 담당자에 임신 암소당 재정 인센티브를 주면 효율에 즉각 효과가 있음.</li>
<li>발견 기반 AI는 AM-PM 규칙이 중심임. 아침에 발정이면 저녁에, 저녁에 발정이면 다음 날 아침에 수정함. 발정 시작 24~32시간 후 배란하므로 발견 8~12시간 후 AI하면 정자가 수정능 획득에 충분한 시간을 얻음.</li>
<li>밤새 발정을 보이는 소가 많아 특히 7·8월엔 저녁 늦게·아침 일찍 관찰·수정을 권함. 발견이 정확한 농장은 AM-PM으로, 임신율이 낮고 발견이 부실한 농장은 발견 직후 수정을 권함. 발정 중기~승가 완료 후 몇 시간까지가 최적 임신율 구간임.</li>
<li>발견 8~18시간 후 AI 임신율 66.2%가 30시간 초과 후엔 45.4%로 떨어짐. 조기 AI는 수정률이 낮고 배아질은 적절, 발정 후 24시간 AI는 수정률은 높으나 배아질이 떨어지며, 약 12시간(6~16시간)이 균형임.</li>
<li>늦은 AI(배란 10시간 전)는 수컷, 이른 AI(배란 20시간 전)는 암컷 자손을 선호하는 경향이 있음. 임신 진단된 소가 승가 허용을 보이면 각별히 주의함. 임신우 AI는 배아 사망·유산 위험임.</li>
<li>수정 위험은 번식 성적을 크게 좌우하고 수정되는 소 수는 발견 능력에 달렸음. 효율 평가의 전제는 발정·AI·임신 진단·분만일의 신뢰할 기록임. 발견 문제가 심한 농장은 임신 위험이 낮고 재수정이 많으며 분만~첫 수정·수태 간격이 김.</li>
<li>목표치는 VWP(분만 후 60일)까지 소의 80~85%가 발정 발견, 무발정 비율 15~20% 미만임. 적절한 농장은 분만–첫 수정 71~76일, 주기우 70% 이상이 발정 간 간격(IEI) 18~24일임. 정상 IEI(18~24일) 대 연장 IEI(36~48일) 비율이 4:1임.</li>
<li>부정확 농장은 너무 짧은(17일 미만)·긴(30일) IEI가 15%를 넘고, AI일 대표우 20두 유중 P4 측정 시 5% 초과가 1ng/ml 이상임(수정 시 발정 아님). 비효율 농장은 첫 수정 전 일상적으로 놓쳐 분만–첫 수정 90일, IEI가 21일의 2~3배(36~44·54~66일)임.</li>
<li>보조도구는 시각 관찰을 대체하지 않고 보완함. 행동을 지속 모니터링해 효율을 높임. 둔부 알림 패치는 미근부에 붙여 승가 허용을 식별함. 압력 감지형(Kamar, 승가 압력으로 색소가 터져 빨갛게)과 긁힘형(Estrotect, 승가당하면 밝은 신호층 노출)이 있음.</li>
<li>미근부 표지는 분필·왁스·크레용·페인트로 표시해 지워지거나 번지면 승가당한 것임. 패치보다 저렴함. 턱 볼 마커는 표지 동물 턱 아래 잉크 저장통(볼 베어링)으로 승가 시 암소 등·둔부에 표시함(약 25두분). 시정 수소·테스토스테론 처리 암소와 병용함.</li>
<li>시정 동물은 발정우를 식별·승가하나 자연 교배는 못 하게 외과 변형한 수소나 안드로겐 처리 암소임. 육우에선 분만 후 주기 재개를 자극해 분만–첫 발정 간격을 줄이는 이점도 있음. 특정 암소만 선호해 다른 발정우를 놓치거나 교배 못 함을 알고 성욕을 잃기도 함. AI 전 분리하므로 온순한 개체를 고름.</li>
<li>정관절제술은 정관 일부 제거로 고환·음경은 정상이고 정자 수송만 차단함. 삽입은 가능해 교미전파 질병을 통제 못 함. 부고환 미부 절제술은 정자가 정관·사정에 못 이르나 역시 삽입 가능해 같은 단점임. 음경 편위는 음경·포피를 옆구리로 전위해 발기는 되나 질 삽입이 안 됨(등인대 5cm 절제로 복측 편위시키는 대안도 있음). 음경절제술은 음경 2/3 제거·끝을 외부화해 성욕이 보통 줄고 감염 예방엔 도움이나 윤리·복지 우려가 있음.</li>
<li>안드로겐 처리는 도태 미임신우·프리마틴·거세우에 테스토스테론(200mg 근육 격일 3주)이나 임플란트를 씀. 비용이 낮고 질병 전파가 없으며 교배철 후 도축 판매가 가능함. 파행 없고 체격 크고 우위여야 적극 승가함.</li>
<li>무리 확대·집약화로 노동력이 부족해지며 전자 기술이 발전함. 자동 활동 모니터링 시스템(AAMS)은 3축 가속도계+무선원격측정으로 행동을 지속 모니터링함. 발정 시 활동 증가(겨울 400%·여름 175%)를 목걸이·귀표 태그로 기록해 최근 7일 같은 시간대 평균 대비 활동 지수를 계산함.</li>
<li>자유우방 3개 농장에서 약 70%가 활동 증가로 식별됐고, 시스템이 발정 기록한 소의 95%가 배란, 못 찾은 소의 35%도 배란함. SMARTBOW(귀표 3D 가속도계, 실내 경산우)는 민감도·특이도·양성/음성예측도·정확도·오류율이 97·98·96·94·96·2%임.</li>
<li>시각 관찰만 하면 배란우의 56%만 기립 관찰됨. 기기는 시각보다 15~35% 더 많이 발견함. 활동 증가 지속은 16.1±4.7시간(승가 허용 13.4시간과 유사)이고 이차 징후는 승가 허용 약 2시간 전부터 증가함. AI→배란 평균 간격 7.9시간으로 수정능 획득에 충분함.</li>
<li>한계는 무리 약 20%의 무발정–무배란은 활동으로 못 찾아 Ovsynch로 회부되어 P/TAI가 낮고, 밀집 수용은 완전한 발정 발현에 부적절함. 수정 시점은 초산우는 알림 후 0~8시간, 경산우는 24시간까지 AI해도 임신 위험 차이가 없음.</li>
<li>활동량 센서(만보계형)는 발정우의 최대 80%를 잡지만, 경산우·파행우·마른 소(저BCS)·농성 질 분비물이 있는 소는 움직임이 적어 놓치기 쉬움.</li>
<li>AAMS+TAI 결합이 현재 과제이자 유망 도구임. AAMS 기반 AI가 TAI에 준하는 성적을 낼 수 있다는 보고가 있음. 도입은 이점에 대한 주저, 기술 미숙, 과도한 정보, 높은 초기 투자, 기술 지원 가용성에 영향받음.</li>
<li>보수계는 발정우가 시간당 걸음이 황체기보다 2~4배 많은 것을 이용함. 다리 부착 기기가 걸음을 세 기준치 초과 시 신호함. 효율 49~90%이고 자유우방에 유리하며 계류식·과도 이동 농장엔 제한됨. HeatWatch는 미근부 압력 감지 송신기로 승가 식별·날짜·시간·지속을 컴퓨터로 보고함. 투자비가 높고 차양·나무·언덕에서 신호가 방해됨.</li>
<li>연구 단계 방법은 체온·우유 온도(발정일 0.3~0.4℃ 상승이나 변동·교란 큼), 적외선 열화상(0.2℃ 차·민감도 80%지만 위양성·위음성 높아 비권장), 질 점액 전기저항(전발정·발정기 감소, 무선 질 센서로 17건 중 16건 발견), 전자 코(회음부 페로몬·호흡 시료, 민감도·특이도 0.83·0.86)임. 대부분 아직 통상법으로 미정착임.</li>
<li>발정 발현·발견은 다요인적 형질임. 효율은 관찰자 경험·빈도·길이와 보조도구에 달렸고, 보조도구 선택은 무리 관리·비용·노동·효능·유용성에 달렸음. 핵심은 발정우를 발견해 행동 발정·배란 대비 적절한 시점에 수정하는 것임. 시각 관찰과 보조도구(특히 전자 기술) 통합이 효율을 높임. 어떤 방법을 쓰든 발견 절차를 자주 모니터링(인력 재교육)하고 체계적 자료 수집을 유지하며 전산에 일관되게 옮겨 유용한 번식 성적 보고를 얻음.</li>
<li>인공수정을 정성껏 하는 것은 수태율과 농장 번식 성적에 직접 영향을 줌. 적기의 바탕은 발정 시작 24~30시간 후 배란이라는 생리임. 배란 즈음에 수정능을 획득한 정자가 난관에 대기하도록 타이밍을 맞춤.</li>
<li>ST 개시 후 4~12시간이 적기이고 16시간 이내면 양호함. 전통 AM-PM법은 발정 발견 12시간 후인데 발견이 발정 중후반이면 늦음. 현대 고능력우는 발정이 짧아 발견 후 6시간 이내가 실용적임. 하루 1회만 관찰한다면 발견 즉시 가능한 한 빨리 수정함.</li>
<li>정자는 한랭·알코올·오염에 약함. 시술의 절반은 위생과 온도 관리임.</li>
<li>주입기·핀셋·스트로 커터는 매번 알코올 솜으로 닦고 건조함. 알코올이 남으면 정자가 죽음. 동결정액은 회사별 권장 온도를 지킴(예 35~37℃ 45초, 38℃ 15초). 캐니스터는 서리 라인에서 멈추고 15초 이내에 꺼내며 한 번에 한 개씩 융해함.</li>
<li>소를 보정하고 꼬리를 묶음. 외음부와 주변·꼬리 뒷면을 온수로 씻고 알코올 솜으로 닦음. 융해된 정액이 20℃ 밑으로 떨어지면 cold shock으로 정자가 상하므로 주입기 장전부를 종이타월 마찰열로 데워 둠.</li>
<li>외음부를 벌려 위 45도로 질에 삽입하고 10cm에서 아래 45도로 끝까지 넣음. 직장에 손을 넣어 자궁경관 앞 1/3을 잡고 경관을 주입기 쪽으로 회전시키며 끌어당겨 내자궁구 너머 자궁체부로 유도함. 정액은 자궁체부에 주입하고 체부가 매우 짧으니 위치에 주의함. 뺀 뒤 정액 배출·피·고름 여부를 확인함.</li>
<li>수정 전에 난소·자궁을 촉진해 정말 발정인지 확인함. 난포 있음이 발정은 아님. 황체기에도 15mm 난포는 흔함. 제1난포파 우성 난포는 배란 직후 황체가 덜 자라 P4가 낮은 시기에 빠르게 커져 15~20mm에 이르고, P4가 오르면 성장을 멈춰 폐쇄된 뒤에도 한동안 크기를 유지해 황체기에 제2난포파 우성 난포와 함께 난포 두 개로 만져지기도 함. 그래서 난포뿐 아니라 황체가 퇴행했는지를 반드시 봄.</li>
<li>리피트 브리더 우군 점검. 우군에 리피트가 많으면 개체 치료 전에 수정 타이밍부터 점검함. 발정 발견 감도가 올라 너무 일찍 수정하고 있지 않은지, 유량 증가로 발정 지속시간이 짧아지지 않았는지 봄. 수정 후 24시간 이내에 배란되면 수태율이 안정되므로 수정 시 난포를 확인하고 1일 후 직장검사로 배란 여부를 체크해, 난포가 남아 있으면 수정 타이밍을 6~12시간 늦춤. 자궁 수축·충혈은 있는데 난포가 팽팽하면 이른 것이라 반나절 뒤 재촉진하면 적기인 경우가 많음. 배란 6시간 이내면 배란 자리에 오목한 함몰이 촉지됨.</li>
<li>AI 수기 요령. 외자궁구 주위엔 질원개 포켓이 있어 주입기 끝이 거기 걸리면 경관으로 안 들어감. 경관 앞쪽 1/3~1/2을 잡으면 새끼손가락·약손가락이 외자궁구 주변에 닿으므로 그 손가락으로 감싸 쥐어 질원개를 펴 줌. 경관 내부는 윤상추벽이 돌출된 지그재그 구조라 똑바로 밀어선 안 들어가고, 경관 중간을 잡고 주입기 쪽으로 회전시키듯 당김. 정액은 꺼내자마자 온수에 넣고 직사광선을 피하며 한 번에 한 개씩 융해가 원칙이고, 5~6두 수정 시엔 온수를 2L 이상으로 크게 해 온도 저하를 막음.</li>
<li>수정 OK 조건은 한쪽에 15mm 이상 난포가 있고 황체가 20mm 미만(퇴행 중)인 것, 둘 다 충족임.</li>
<li>20mm 이상의 기능성 황체가 만져지면 발정이 아니라 수정 금지임. 직전 7~10일 전에 발정·수정 이력이 있으면 제1난포파 우성 난포의 E2로 발정 같은 징후가 나온 것일 수 있고 임신 중일 수도 있음. 임신 중 수정 시 약 50% 유산임. 자궁 내부를 확인함.</li>
<li>발정 확인 흐름은 외음부 종창·충혈, 점액 유무, 자궁 수축(배란 직전엔 약할 수 있음), 15mm 이상 난포, 20mm 미만 황체, 생식기를 조작해 점액이 추가로 나오지 않는지 순임.</li>
<li>인공수정은 가장 오래된 보조생식기술로 본래 위생적 이유로 개척됐지만 동결정액 공급과 함께 임성 개선·유전 진보 가속의 경제적 이점이 분명해짐. 정액 채취·가공·전달 어느 한 부분의 결함도 임성을 떨어뜨려 팀 접근이 필요함. AI 센터가 양질 정액을 유통해도 판매 후 임성은 정액을 올바르게 다루고 융해하며 적기에 수정하는 사람에게 달려 있음.</li>
<li>정액 취급의 일차 목표는 정자를 해로운 조건에 최소 노출해 수정 능력을 보존하는 것임. 동결보존·저장·융해 중 손상은 cold shock, 얼음 결정 형성, 산화 스트레스, 막 변성, 동결보호제 독성, 삼투 변화에서 비롯됨.</li>
<li>동결정액은 액체질소 통(견고한 외피+내부 칸, 사이는 극진공 단열)에 보관함. 통은 밀폐형이 아니라 온도 변동에 따라 기체를 방출함. 밀폐되면 폭발 위험임. 진공이 주 단열 요소라 목관에 과한 힘·흔들림이 가해지면 갈라져 진공이 손실되고 외피 천공·외부 용접도 진공을 깸. 통 상단 심한 서리 축적은 급속 증발·고장 신호임. −196℃에서 무기한 보관 가능하나 액체질소 최소 5cm 깊이를 유지하고 정기적으로 모니터·보충함.</li>
<li>통은 직사광선 피해 서늘·청결·건조·환기 좋은 곳에 두고 나무 팔레트 위에 올려 콘크리트 바닥에 직접 두지 않음(부식 방지). 통끼리 쌓지 않고 눕혀 굴리지 않으며 증발을 자주 관찰할 수 있는 곳에 둠. 차량 운반 시 손상·유출 막게 고정함.</li>
<li>대부분 정액은 0.25·0.5ml 스트로에 담김. 성판별 정액은 일관되게 0.25ml임. 같은 수소 스트로 5개를 고블릿에, 고블릿 2개를 케인에 담아 캐니스터에 저장함. 물이 얼면서 정자는 농축된 염·희석제 용액에 노출되고 얼음과 농축액의 불안정성이 정자에 해로움. 동결보호제와 최적 동결 프로그램이 손상을 최소화하지만 정액은 얼음 재결정화가 시작되는 임계 온도(−100~−80℃)보다 충분히 낮게 유지해야 함.</li>
<li>통 목 부위 온도는 상단 2.2~12.2℃, 2.54cm −15~−22.2℃, 5.08cm −40~−46℃, 7.62cm −75~−82℃, 10.16cm −100~−120℃(임계 온도대), 12.7cm −140~−160℃, 15.24cm −180~−192℃임.</li>
<li>스트로를 통 상단에서 5cm 위로 올리면 실온(22℃)·냉장(5℃) 어디서든 임계 재결정화 온도에 10~20초면 도달함. 열 손상은 영구적이라 액체질소로 되돌려도 교정되지 않음. 케인·캐니스터는 서리선 아래에서 5~8초만 유지하고 필요하면 통 안으로 다시 내려 냉각한 뒤 올림.</li>
<li>정액 재고 시스템을 통 근처 벽에 붙이고 한 수소 정액을 한 랙에 모으며 캐니스터·고블릿에 수소 번호를 표시해 불필요한 검색·고온 노출을 막음. 통 간 이동은 두 사람이 통을 나란히 놓고 가능하면 이동 전 질소를 채움. 융해 시 캐니스터를 목 하부까지 올려 고블릿을 잡고 더 내려 다른 스트로를 보호함(꺼내기 어려우면 고블릿 탭을 45도로 구부림). 핀셋으로 스트로를 꺼내는 즉시 랙·캐니스터를 통 본체로 빠르게 내림.</li>
<li>스트로당 정자 수는 가변적임. 높은 희석(0.25ml당 200만)과 낮은 희석(1500만)은 융해 직후 운동성·막/염색질 완전성·임신율에 차이가 없었으나 일부 수소는 임성 유지에 더 많은 정자가 필요함. 정자 수가 매우 적은 성판별 정액은 임성이 거의 필연적으로 감소함.</li>
<li>융해법은 수조·셔츠 주머니·공기·체내 등 여러 가지가 권장돼 왔으나 한 농장에선 모두 같은 방법을 쓰는 게 좋음. NAAB(전미동물육종협회) 권고는 30~35℃ 수조에 최소 30초(40초 권장)이고, 융해 정액은 15분 이내에 수정하며 융해 후 급격한 온도 저하를 피함.</li>
<li>셔츠 주머니 융해는 초기 30℃였다가 1분 뒤 약 19℃로 떨어져 악영향을 줄 수 있고 주변 온도·의복 두께에 따라 매우 가변적이며 수조보다 훨씬 느림. 빠른 융해가 융해 후 생존성은 높지만 최근 연구는 시험관 질이 개선돼도 생체 내 임성은 주머니 융해와 차이가 없다고도 봄. 여러 스트로 동시 융해도 가능한데(숙련 수정사는 20분 내 최대 4두 교배) 침지 직후 스트로를 흔들어 엉김을 막아야 함.</li>
<li>융해 후 물과 정액이 섞이면 비가역적 손상이 오므로 수조에서 꺼낸 스트로는 자르기 전 종이타월로 건조함. 천공 등 결함 스트로는 폐기함.</li>
<li>cold shock은 융해 후 차가운 환경에서 급격히 온도가 떨어지면 정자 형질막이 비가역적으로 변해 운동성·수정 능력을 잃는 것임. 데워도 회복 안 됨. 정자로 나트륨이 유입되고 칼륨·마그네슘이 유출됨.</li>
<li>35℃ 융해 후 주입기 준비 약 1분 동안 주변 21℃면 저하가 3~6℃뿐이라 봉을 데우면 효과적으로 대응됨. 16℃면 약 20℃, 4℃면 약 15℃ 떨어져 데워도 지연만 됨. 스트로는 표면 대 부피 비가 커 cold shock에 취약하므로 서늘한 환경에선 예방 조치가 필수임.</li>
<li>추운 날씨엔 교배 동물 가까이의 차폐·가온 공간에서 융해·주입기 장전하고, 장전 후 주입기를 의복 안이나 보온기에 끼워 단열한 채 보정틀로 이동하며, 차폐·가온 공간에서 주입기 준비·교배를 수행하고, 장전 주입기를 35℃로 유지하는 휴대 운반함을 활용함.</li>
<li>소 AI 수정법은 자궁체·양측 자궁각·심부 자궁각·난포내 수정이 있으나 가장 흔한 것은 직장질법으로 자궁경 내구 바로 앞쪽 자궁체에 주입하는 것임. 자궁경 통과 기술만이 목표가 되어선 안 되고 위생·정확한 주입 부위 식별·생식 해부 이해가 함께 가야 함.</li>
<li>장전 주입기를 위생 플라스틱 커버에 넣어 질 오염을 차단함. 암소를 스트레스 최소로 보정함. 코르티솔 상승이 LH surge를 억제함. 촉진 팔로 직장에서 자궁경을 찾아 단단히 잡음.</li>
<li>외음부를 종이타월로 닦고 주입기를 외음부에 30~40도 각도로 넣어 요도구 진입을 막고 자궁경 외구까지 통과함. 요도구·질 주름·질 천장을 피함. 봉이 자궁경 안에 있으면 끝이 만져지지 않음. 자궁경을 조작하며 약 3개의 어긋난 윤상주름을 일정 압력으로 통과함. 끝이 주름에 걸리지 않게 함.</li>
<li>주입기 끝을 내구에서 약 1cm 앞 자궁체에 두고 직장 내 집게손가락 끝으로 확인함. 자궁경을 소 장축과 평행하게 잡고 약 5초에 걸쳐 천천히 주입해 정액량을 최대화하고 한쪽 자궁각 편중을 최소화함. 주입 중 봉을 자궁경 뒤로 빼지 않고 소가 움직이거나 봉이 미끄러지면 재배치함.</li>
<li>표준은 자궁체 주입이지만 양측 자궁각 수정은 임성에 변화가 없거나 개선하기도 함. 동측 자궁각 저용량(200만)과 자궁체 정상 용량(1500만)의 임신율은 비슷했으나 자궁체·양측 자궁각에 저용량을 쓰면 임성이 감소함. 자궁난관접합부 부근 주입(Ghent 기기)도 정자 용량·주입 부위가 임신율에 영향을 주지 않았고, 난포내 수정(배란 전 난포에 0.06ml 직접)은 저임성 암소의 대안으로 제안됐으나 추가 연구가 필요함. 수정 시 PGF2α는 후보우에선 임성을 개선했으나 경산우에선 아니었고, 수정 후 음핵 마사지(5초)는 임신율을 개선하지 않았음.</li>
<li>승가허용 발정이 가장 신뢰할 지표이고 발정 암소는 하루 중 언제든 활동을 보여 하루 여러 번 관찰이 중요함. 시점의 제약은 짧음. 배란은 젖소에서 발정 시작 약 28~32시간 후, 난자 최적 임성은 배란 6~12시간 후, 생식기 내 정자 수명은 24~30시간이라 성공 수정의 기회 창이 매우 짧음.</li>
<li>전통 오전–오후 규칙은 오전 발정이면 오후, 오후 발정이면 다음 날 아침임. 단 대규모 현장에선 발견 빈도 감소가 영향을 줘 이 규칙으로 최대 수태율이 안 나올 수 있음. 젖소 최고 AI 수태율은 발정 시작 4~12시간 후임. 통에서 스트로를 꺼내 AI까지 15분을 넘기지 않음.</li>
<li>수정은 기술적 역량(집중·세심함·해부 이해·주입 부위와 봉 위치 식별)과 관리적 역량(정액 저장·통 관리)을 모두 요함. 면밀한 노력이면 농장 수정사도 성공할 수 있으나 성공은 위험·함정에 대한 지식에도 달려 있음. 수태당 수정 횟수·수태율 같은 지표를 주기적으로 평가하고 정기적으로 재교육받아 기법과 신지견을 갱신함.</li>
<li>동기화는 번식 진료에서 가장 판단이 요구되는 처치임. 제제의 특징만이 아니라 처치 시점 소의 호르몬 상태와 처치 후 변화까지 이해해야 효과를 냄. 모든 프로토콜은 결국 GnRH 30시간, PGF 3~5일, P4 제거 2~4일 세 타임라인의 조합임.</li>
<li>GnRH는 11mm 이상 우성 난포를 배란시켜 새 난포파를 만듦. 투여 후 26~30시간에 배란하고 36시간 지나도 배란 없으면 무효임. 난포가 없으면 효과 없음.</li>
<li>hCG는 LH 작용임. 수정 후 5일째 투여하면 제1난포파 우성 난포(13mm 이상)를 배란시켜 부황체를 만들어 혈중 P4를 올림(황체 기능 보강).</li>
<li>PGF2α는 황체 퇴행을 유도해 발정을 부름. 자궁축농증·내막염 치료도 함. 황체기 6일 이전엔 잘 안 듣고(어린 황체 저항성) 중증 자궁 질환 땐 황체가 안 죽을 수 있음.</li>
<li>E2는 발정 유도·자궁경관 확장·자궁 수축임. 주로 P4와 병용함. 배란 유발로 쓰면 투여 약 16~24시간 후 LH surge, 약 42~52시간 후 배란임. 질내 유치형 P4 제제(CIDR)는 혈중 P4를 높여 발정·배란을 억제함(황체 효과 모방). 동기화의 핵심 부품임.</li>
<li>모든 동기화는 두 손잡이를 인위로 돌리는 것임. 하나는 P4 두 박자로, P4를 한동안 깔았다가(priming) 뺌(탈억제). CIDR·P4 장치를 넣었다 빼는 것이 이 재현임. 다른 하나는 E2 되먹임으로, E2는 P4 배경에 따라 얼굴을 바꿈. 고P4면 음성(난포 폐쇄·억제), 저P4+priming이면 양성(LH surge)임.</li>
<li>GnRH는 이 되먹임 회로를 건너뛰고 뇌하수체를 직접 때려 surge를 만드는 지름길임. 각 프로토콜은 이 레버를 어떻게 돌리느냐의 차이일 뿐임.</li>
<li>PGF2α 단독은 황체 보유우에 투여해 황체를 퇴행시키고 P4를 낮춰 우성 난포 발육·발정을 유도함. 발정 발현이 투여 후 2~6일로 폭이 넓은데 투여 시점의 우성 난포 크기에 달렸음.</li>
<li>우성 난포 10mm 전후(주기 전반)면 P4 저하 후 발육·성숙이 필요해 발정까지 3~4일, 15mm 초과면 이미 커 성숙이 빠르고 E2도 많아 2일, 폐쇄 타이밍이면 새 우성 난포가 선발·성숙해야 해 5일 이후, 제2난포파 이후 10mm 전후(주기 후반)면 3~4일임.</li>
<li>홀스타인 622두 무작위 투여 시 발정은 3일째 49.8%, 4일째 14.1%로 3~4일에 몰림. 투여 3~4일째 집중 관찰함. 황체기 6일 이전(이전 발정 6일 이내, 발정 후 출혈 4일 이내) 투여는 권장하지 않음.</li>
<li>PGF가 황체를 녹여 P4를 빼는 것이 두 박자의 둘째 박자임. 주기 소는 이미 황체기 동안 P4를 겪어 priming돼 있으므로 P4만 빠지면 우성 난포의 E2가 양성 되먹임으로 돌아서 surge·배란이 일어남.</li>
<li>CIDR 단독은 질 점막으로 P4가 흡수돼 혈중 P4를 높게 유지함. 넣어두는 동안 LH pulse를 눌러 발정·배란을 억제하고, 빼면 P4가 뚝 떨어지면서 억눌렸던 소들이 한꺼번에 발정에 들어옴. 이게 발정 집중화임. 단독 사용 시 보통 10~14일 넣어 두고 제거 후 2~4일 발정을 관찰함. 7일 유치는 제거 시 황체가 남은 소가 많아 PGF2α를 반드시 같이 줘야 하고, 발정이 2~3일에 걸쳐 퍼짐. 길게 둘수록(14·21일) 유치 중 자기 황체가 퇴행해 제거 후 2일째에 발정이 몰림.</li>
<li>홀스타인 미경산우에서 7·14·21일 삽입을 비교하면 오래 넣어둘수록 발정이 더 좁게 모임(21일 삽입은 제거 2일째 96% 발정). 오래 넣어두는 동안 자기 황체가 자연히 퇴행해버린 소가 늘어 뺄 때 이미 황체가 없는 소가 많아지기 때문임. 그래서 14·21일 단독은 추가 호르몬 없이도 발정이 잘 모임.</li>
<li>그런데 발정이 잘 모이는 것과 수태율이 높은 것은 다름. 14·21일 단독은 7일 삽입+PGF2α보다 수태율이 떨어짐. 오래 넣어두는 동안 난포파를 통제하지 못해 우성 난포가 너무 오래 발육·노화한 상태로 수정을 맞기 때문임. 늙은 난포 속 난자는 수태력이 낮음.</li>
<li>그래서 7일 삽입+PGF2α를 씀. 7일은 짧아서 뺄 때 아직 황체를 가진 소가 많음. 이 황체가 P4를 계속 내면 제제만 빼도 발정이 오지 않으므로 제거와 동시에, 또는 제거 하루 전(6일째)에 PGF2α를 놓아 황체를 녹임. 하루 전에 주면 동기화가 더 잘 됨. 난포를 노화시키지 않고 적정 시점에 수정할 수 있어 수태율이 더 나음.</li>
<li>P4 제제 단독은 난포파를 통제하지 못해 제거 후 발정의 수태율이 불안정함. 최근엔 GnRH·PGF를 엮은 배란 동기화·정시 AI와 병용함. CIDR를 넣는 동안은 외부 P4가 첫 박자를 맡고(priming하면서 고P4로 E2를 음성 쪽에 묶어 발정 억제), 빼면 둘째 박자가 되어 E2가 양성으로 돌아서며 발정이 몰림. 자기 황체가 없는 소에서도 P4 장치가 두 박자를 대신 만들어 줌.</li>
<li>Select-Synch는 난포 나이를 맞추는 방법임. PGF2α 단독·CIDR 단독은 유기된 발정이 개체마다 들쭉날쭉하고 수정 대상 난포의 일령이 높아지면 난자가 노화해 수태율이 떨어짐. 난포 일령이 5~10일이면 수태율이 서서히 떨어지고 11일을 넘으면 급락함. 그래서 난포파 자체를 인위로 리셋해 적정 나이의 난포에 수정하자는 것임.</li>
<li>황체가 있는 소에서 GnRH(0일)를 놓으면 surge가 일어나 우성 난포가 배란되고(투여 약 30시간 후) 그 자리에서 새 난포파가 출발함. 난포 나이가 0으로 리셋됨. 7일째 새 우성 난포가 5.5일령일 때 PGF2α로 황체를 녹여 적정 일령 난포에서 발정·배란이 일어나게 함. 이후 7~10일에 발정을 관찰해 AI함.</li>
<li>0일 GnRH는 시상하부를 건너뛰고 뇌하수체를 직접 때려 surge를 만듦. 자연 주기에선 E2가 양성 되먹임으로 만들던 그 surge를 GnRH가 대신 일으켜 우성 난포를 배란시키고 난포파를 0으로 리셋함. 7일 PGF는 P4를 빼는 둘째 박자임.</li>
<li>오브싱크는 Select-Synch에 마지막 GnRH를 더해 배란까지 동기화하므로 발정 관찰 없이 정시 AI가 가능함. GnRH(0일) → PGF2α(7일) → GnRH(9일) → 정시 AI(2차 GnRH 약 16시간 후)임. 첫 GnRH가 우성 난포를 배란시켜 난포파를 리셋하고, 7일 기다려 새 우성 난포를 키운 뒤, PGF로 황체를 녹이고, 2차 GnRH로 배란을 유도해 시간을 맞춰 수정함.</li>
<li>주기 5일 이전 시작은 우성 난포가 작아 1차 GnRH로 배란이 안 돼 실패함. 주기 14일 이후 시작은 PGF 투여 전 황체가 이미 퇴행해 AI 전에 배란해 실패함. 결론은 주기 5~14일 사이 시작임. 14일 이후 시작해야 하면 1차 GnRH와 함께 P4 제제를 넣어 조기 배란을 막음.</li>
<li>오브싱크는 배란을 GnRH로 두 번 직접 일으킴. 1차 GnRH는 현재 우성 난포를 배란시켜 난포파를 0으로 리셋하고(반응할 우성 난포가 있어야 하므로 주기 5일 이전엔 실패), 7일 PGF로 P4를 빼고(둘째 박자), 2차 GnRH가 새로 자란 성숙 난포를 정시에 배란시킴. 자연 주기라면 E2의 양성 되먹임이 만들 surge를 두 번 다 GnRH가 뇌하수체를 직접 때려 대신 일으킴.</li>
<li>주기 14일 이후 시작이 위험한 건 PGF 전에 황체가 스스로 녹아 P4가 먼저 빠지면 자기 E2가 양성 되먹임으로 미리 surge를 터뜨려 AI 전에 배란해버리기 때문임. 이때 P4 제제를 넣어 그 조기 탈억제를 막음.</li>
<li>히트싱크는 오브싱크의 마지막 배란 유발제(2차 GnRH)를 E2로 바꾼 변법임. GnRH(0일) → PGF2α(7일) → E2(8일, PGF 24시간 후) → 정시 AI(9~9.5일, E2 후 24~36시간)임. 배란 유기 효과는 GnRH와 비슷한데 E2를 쓰면 AI 시점에 발정 징후가 나타나 시술자가 발정을 눈으로 보고 수정할 수 있어 안심됨. 관건은 E2 타이밍으로 투여 후 약 16~24시간에 surge 피크, 약 42~52시간 후 배란임.</li>
<li>마지막 E2는 양성 되먹임을 직접 당기는 것임. 7일 PGF로 이미 P4가 낮아져 있어(priming은 주기 소라 충족) 외부 고E2가 저P4+priming 조건에 맞아 시상하부를 통해 surge를 일으킴. GnRH(뇌하수체 직격)보다 배란이 느린(42~52시간) 것은 E2가 시상하부 양성 되먹임 회로를 한 바퀴 돌아 작동하기 때문임.</li>
<li>시더싱크는 오브싱크+CIDR임. 오브싱크는 황체 보유우라야 높은 수태율이 나옴. 시작 시 황체가 불명확하거나 주기 후반(14일 이후)에 시작해 처치 중 황체가 퇴행해버릴 우려가 있으면 CIDR를 함께 넣어 P4를 인위로 받쳐 줌. 골격은 오브싱크와 같고 황체가 불안한 소에서도 쓸 수 있게 해줌.</li>
<li>eCG 프로토콜은 난소가 잘 안 도는 무발정·생식력 저하 소에 씀. P4 장치로 P4를 높게 깔아(고P4=FSH·LH 억제·난포 성장 억제) 발정·배란을 일단 누르고 동기화한 뒤, 장치를 빼 P4가 빠진 자리에 eCG를 놓아 난포 발육·배란을 강하게 밀어 줌(저P4+E2=LH 자극·배란).</li>
<li>P4 장치 삽입(0일) → PGF2α(6일, 황체 퇴행) → 장치 제거+eCG 400~600IU(구 PMSG, 7일, 쌍태 방지 위해 용량 조절) → 정시 AI(8~10일, 가장 흔한 건 56시간 1회 AI이고 발정 확인 후 AI나 48·72시간 2회 AI도 가능)임. 대사 상태가 나쁘거나 분만 직후인 소에 쓰면 실패하기 쉬움.</li>
<li>대상이 무발정·생식력 저하 소인 게 핵심임. 이런 소는 P4를 겪은 적 없어 priming이 빠져 있고(낭종, 사춘기 전과 같은 상태) 자기 LH 드라이브도 약함. P4 장치(0일)가 빠진 priming을 깔아 주고(첫 박자), 장치 제거(둘째 박자) 자리에 eCG(FSH·LH 활성)를 부어 약한 엔진을 보충해 난포 발육·배란을 강하게 밂.</li>
<li>호르몬 처치는 효과적이지만 소의 난소·자궁·과거~현재 상태를 이해한 뒤 함. 오브싱크·시더싱크 모두 황체 보유가 수태율의 전제임을 잊지 않음.</li>
<li>E2+P4 프로그램은 오브싱크가 GnRH로 우성 난포를 배란시켜 난포파를 리셋하는 것과 달리 E2+P4로 뇌하수체의 FSH·LH 방출을 억눌러 우성 난포를 폐쇄시킨 뒤 새 난포파를 띄움. 가장 큰 이점은 황체·난포 상태에 덜 의존해 발정주기와 관계없이 아무 때나 시작할 수 있다는 것임. 시작 시기에 민감한 오브싱크와 대조됨.</li>
<li>0일에 E2와 P4 제제를 함께 넣으면 고E2+고P4가 만들어져 FSH·LH 방출이 억제되고 자라던 난포(우성 난포 포함)가 폐쇄됨. 이후 E2가 서서히 분해돼 고P4만 남고 우성 난포도 사라지면 FSH가 회복되며 새 난포파가 출발함(평균 4일째). 9일에 PGF2α와 P4 제거로 황체를 녹이고, 10일에 E2로 배란을 유도해(E2 후 16~24시간 surge, 42~52시간 후 배란) 11~11.5일에 정시 AI함.</li>
<li>E2 2.0mg+P4 제제 삽입(0일) → 고E2+고P4로 난포 폐쇄 → 새 난포파 출현(평균 4일, E2 분해·고P4만 남아 FSH 회복) → PGF2α+P4 제거(9일, 황체 퇴행, 난포 약 5일령) → E2(10일, 배란 유도, 난포 약 6일령) → 정시 AI(11~11.5일, 난포 약 7~7.5일령)임.</li>
<li>같은 E2를 앞에선 음성, 뒤에선 양성으로 시간차로 쓰는 프로그램임. 0일 E2는 P4를 함께 넣어 고P4 배경이라 양성이 차단되고 음성으로 작동해 FSH·LH를 눌러 우성 난포를 폐쇄시킴(리셋). 그동안 깔린 P4가 시상하부를 priming하고, 9일 P4 제거로 P4가 빠진 뒤 10일 E2는 저P4+priming 조건이라 양성 되먹임으로 surge를 일으킴. P4 장치 하나가 폐쇄(음성 배경)와 priming을 동시에 맡으니 난포·황체 상태와 무관하게 아무 때나 시작할 수 있음.</li>
<li>소 상태(육우/젖소·산유량)에 따라 E2 분해 속도가 달라 새 난포파 발현이 3~5일로 폭이 생기고 AI 때 난포 크기 편차가 커짐. 20mm 가까운 큰 난포+퇴행 황체/무황체는 우성 난포가 폐쇄되지 않아 노화한 난자를 배란해 수태율이 떨어짐. 15mm 미만 작은 난포(특히 한우·흑모와종)는 발육 개시가 늦거나 PGF까지 일수가 짧으면(흑모와종 8일 이내) AI 시점에 난포가 덜 커 있음.</li>
<li>AI 무리에서 분만 간 간격을 정하는 두 인자는 발정 발견(공시율)과 분만율임. 효과적인 동기화의 요건은 지정 간격 동안 예측 가능하고 높은 발정·배란 반응과, 정해진 시점의 단일 수정에 대한 높은 임신율임. 주기를 잘 통제하려면 새 난포파 출현 동기화, 황체기 보장, 황체기 종료, 배란 동기화 넷이 필요함.</li>
<li>난포 성장은 파동 양상으로 각 파는 출현→선택/폐쇄→우성→배란 또는 폐쇄를 거치며 7~10일(2파 18일 주기 vs 3파 24일 주기) 수명임. 새 파 출현은 일시적(1~2일) FSH 증가가 받치고 FSH 정점은 파 출현 직전임. 가장 큰 난포가 약 8.0mm에 이를 때 deviation이 시작돼(소에서 약 8시간 차) 단일 우성 난포와 종속 난포로 갈림. 우성 선택 무렵 FSH 의존에서 LH 의존으로 전환되며 우성 난포는 과립막에 LH 수용체를 발현함.</li>
<li>외인성 황체용해나 프로게스타겐 중단에서 발정까지 간격은 그 시점의 난포파 단계에 달렸음. 선택된 우성 난포가 있으면 2~3일 내, 선택 전이면 3~7일 후 발정함. 발정 동기성은 우성 지속이 4일 미만 또는 10~12일 초과일 때 최적이고, 특히 배란 난포의 우성 지속이 10일을 넘으면 조기 활성화된 노화 난자 때문에 임신율이 급락함. 그래서 새 파 출현을 정밀히 통제하는 것이 핵심임.</li>
<li>난포파 통제는 새 파 출현이 주로 FSH 의존, 에스트로겐 활성 우성 난포가 대체로 LH 의존이라는 두 원리에 근거함. 프로게스타겐·에스트로겐의 음성 되먹임으로 FSH·LH를 억제해 파 출현을 동기화함. 외인성 유도엔 기존 파의 일관된 종료, 새 파를 부를 FSH의 예측 가능한 일시 증가, 선택 후 우성 난포의 정상 성장이 필요함.</li>
<li>GnRH는 즉각 LH·FSH 급증을 일으키나(크기는 P4 농도·난포파 단계와 무관) 효과는 우성 난포 유무에 달렸음. 우성 선택 후 GnRH는 그것을 배란시켜 1.5~2.0일 후 새 파가 출현하지만, 선택 전 GnRH는 그 파에 영향이 없음(성장 난포 과립막에 LH 수용체가 없어서). 그래서 GnRH 동기화는 기능적 우성 난포가 있을 때만 작동하고 이후 유도된 황체를 퇴행시킬 PGF2α가 필수임. 소는 주기 5~12일에 GnRH를 줄 때 가장 일관되게 반응함.</li>
<li>에스트라디올은 우성 난포 성장기를 억제하고(P4 병용 시 더 깊게) 시상하부·뇌하수체 모두에 음성으로 FSH·LH를 누름. 프로게스틴 삽입 소에 E2-17β(2.5~5mg)나 EB·발레레이트(2mg)를 주면 약 4~4.5일 후 변동 거의 없이 새 파가 출현함(E2가 대사되며 FSH 급증→새 파). 가장 성공적인 난포파 동기화 호르몬이지만 금지국이 늘어 대안이 필요함.</li>
<li>황체용해는 배란 전 난포의 E2 → 뇌하수체 옥시토신 방출 → 소량 자궁 PGF2α 방출로 시작되고, PGF2α가 추가 황체·자궁 옥시토신과 PGF2α를 부르는 양성 되먹임 고리를 염(황체 PGF2α도 자가/측분비로 신호 증폭). PGF2α는 황체 혈류를 줄이고 큰 황체세포 세포자멸사를 촉진해 황체를 소멸시킴.</li>
<li>소에서 PGF2α는 주기 약 5일 이후 황체의 즉각 퇴행을 일으킴. P4가 24시간 내 기저로 급락하고 LH pulse가 늘어 발정·배란이 유도됨. 빠른 황체용해에도 치료–발정 간격은 난포파 단계에 따라 가변적임. 우성 난포가 있으면 2~3일 내, 우성 전·퇴행 단계면 4~6일 걸림.</li>
<li>PGF2α는 발정 후 처음 5~6일은 황체용해를 잘 못 시킴. 과거엔 미성숙 황체에 수용체가 없어서로 봤으나 최근 배란 후 2일이면 수용체 존재가 입증됨. 주기 5·6일 단일 투여는 반응이 가변적이고, 12시간 간격 두 번 투여하면 발정 후 2~5일에 95~100% 일관된 황체 퇴행임.</li>
<li>외인성 P4(PRID 1.55g, CIDR 1.38g 미국/1.9g 캐나다, Cue-Mate 1.56g)는 황체기를 모방·연장함. 모든 P4 기반 동기화에서 최대 85%가 제거 후 36~72시간에 발정하고, GnRH·E2로 배란을 유도해 제거 후 48~84시간 FTAI가 가능함.</li>
<li>P4 동기화의 첫째 이점은 LH surge·발정 행동 억제임. P4를 역치(1ng/ml 초과) 이상 유지함. 단 14·21일 장기 치료는 잔존 우성 난포(노화 난자)로 수태율이 단기보다 10~15% 낮아 7~9일 단기 프로토콜이 개발됨.</li>
<li>둘째는 무발정 암소 반응임. P4 보충은 처음엔 LH를 줄이나 이후 LH pulse를 높여 우성 난포 발달을 늘리고 시상하부를 발정·surge에 priming함. 육우 약 20%, 미국 젖소 초산우 28%·경산우 15%가 분만 후 60일까지 무배란임.</li>
<li>셋째는 낭종성 난소(미국 젖소 약 10%) 치료임. 높은 LH pulse·surge 부재가 특징인데 P4가 pulse를 낮춰 낭종 교체→새 우성 난포 정상 발달→중단 후 배란임.</li>
<li>단일 GnRH는 젖소 분만 후 약 10~18일, 육우 21~31일에 주면 surge·배란을 유도함(육우는 48시간 송아지 격리 결합도 효과). hCG 500~3000IU, 외인성 E2도 배란을 유도함. 단 분만 후 GnRH 유도 황체는 자발 황체보다 수명이 짧고, 자궁 복구 전 GnRH는 자궁축농증을 부를 수 있어 분만 후 초기 단일 GnRH는 실무 유용성이 낮음.</li>
<li>프로스타글란딘 프로토콜은 황체용해 기전이라 성숙 황체가 있는 주기 암소에만 적용됨. PGF2α 25mg 또는 클로프로스테놀 500μg으로 주기 무리의 55~65%에서 발정함. 11~14일 후 2차 주사로 동기 발정을 만듦(1차 반응우가 6~15일, 대다수 7~9일이 되므로). 단 모든 성숙 황체가 용해되진 않음. 6일째 약 25%, 7일째 약 33%, 8~16일째도 100% 미만 반응임.</li>
<li>프로게스테론 프로토콜의 14일 치료(IVPD/경구 MGA)는 배란을 14일 억제해 노화 난포 배란으로 임성이 낮아 제거 19일 후 PGF2α를 줌(잔존 난포 배란 후 황체 퇴행). 육우 후보우에 흔하고 MGA 0.5mg/일·14일 곡물 혼합 급여는 비용 효율적임. 7일 노출(IVPD)은 PGF2α 시 모든 주기우가 7일 이상 황체를 가져 제거 2~6일 후 발정함. 7일+GnRH는 P4만으로는 난포파 동기화가 안 되므로 시작 시 GnRH로 새 파를 개시해 잔존 난포를 줄이고, GnRH~PGF2α 사이 프로게스틴이 조기 발정을 차단함.</li>
<li>배란 동기화(FTAI)의 오브싱크는 GnRH → 7일 후 PGF2α → 48시간 후 2차 GnRH → 16시간(8~24) 후 정시수정임. 첫 GnRH가 우성 난포 배란/황체화로 약 3일 후 새 파를 개시하고 2차 GnRH가 배란 동기성을 높임. 후보우에선 효과가 덜함. CO-Synch는 2차 GnRH를 AI와 동시에 해 처치를 1회 줄임(육우에 이점).</li>
<li>Presynch-Ovsynch는 14일 간격 PGF2α 2회 전동기화 후 11·12·14일째 오브싱크를 시작해 주기 5~12일에 맞춤. 단 PGF2α 전동기화는 무배란우엔 무효임. G6G는 PGF2α→2일 후 GnRH로 새 주기 개시→6일 후 오브싱크임. Double-Ovsynch는 오브싱크로 전동기화·주기성 유도 후 교배용 오브싱크를 하며 무배란 젖소에 유리함.</li>
<li>오브싱크·코싱크에서 첫 GnRH~PGF2α 사이 7일(또는 5일) P4 보충은 발정·배란 동기성과 수태를 높이고 무발정·후보우·낭종우에 유리함. 5일 P4+전발정기 72시간 연장은 육우 AI 임신율을 최대 15% 높였음. 단 5일 프로토콜은 주기 5일 단일 PGF2α 황체용해가 가변적이라 CIDR 제거 시 6~12시간 뒤 2차 PGF2α가 필요함.</li>
<li>eCG는 난포 발달을 늘려 계절 분만 무발정 소에 유리함. P4 기구 제거 시 eCG 400IU가 49일 교배철 74% 임신, 무발정 젖소·육우에서 FTAI 임신율을 10~15% 높였음.</li>
<li>동기화 받은 암컷 일부는 FTAI 전 발정을 안 보이는데 이들에 일괄로 GnRH를 줘 배란을 유도해도 임신율이 평균 27% 낮음. 분할 정시수정(STAI)은 비발정 암컷의 수정을 예정 정시 AI보다 20~24시간 늦추는 방법임.</li>
<li>PGF2α 투여 시 발정 발견 패치로 발정 상태를 판정해 최적 시점에 수정함. 7일 CO-Synch+IVPD/14일 IVPD-PGF2α 후 성우 30~50%·후보우 20~40%가 PGF2α 후 66시간 전에 발정을 안 보이는데 그중 55%가 지연 시점까지 발정을 보였고, 수정을 20~24시간 늦춰 비발정 암컷 임신율이 16%p 개선됨. 활성화된 패치가 있는 소엔 GnRH가 불필요해 GnRH 사용도 줄임.</li>
<li>hCG는 LH와 약 85% 구조가 같은 성선자극호르몬으로 LH 유사 작용을 냄. 반감기는 약 24시간으로 LH의 20분보다 훨씬 김. 효능은 난포낭종·배란 장애·난포 발육 장애(난소 발육 부전·난소 정지·난소 위축)에 있고 기대하는 것은 배란과 황체 형성이라 기본적으로 GnRH와 비슷함. 현장에서 가장 많이 쓰는 맥락은 AI 후 혈중 P4를 끌어올려 수태율을 높이려는 것임.</li>
<li>보통 AI로부터 5일 전후에 투여함. 배란 뒤 새로 발육을 시작한 제1난포파 우성 난포가 10mm 이상이면 hCG에 반응하고, 5일째엔 보통 13mm 전후임. 이때 hCG를 놓으면 그 난포가 배란·황체화되어 부황체가 생김. 이 부황체가 황체 체적을 늘려 혈중 P4를 올림. LH 유사 작용으로 기존 황체 기능도 보강되지만 P4 상승의 주역은 부황체 형성임. 그래서 P4는 투여 2~3일이 지나서야 오르기 시작해 CIDR보다 상승이 느림.</li>
<li>1,000IU에서도 GnRH 100μg과 비슷한 배란율이 나오고, 2,000IU에서 90%에 육박, 2,500IU 이상에서 90%를 넘음(홀스타인 비유우 기준). 2,000IU 이상이면 높은 배란율을 기대할 수 있음.</li>
<li>AI 후 hCG 투여 시험 10건을 종합하면 무작위 투여 시 수태율 향상은 평균 +3.0%로 미미함. 개별적으로 유의했던 건 3,300IU를 쓴 2건뿐임. 초산우, 리피트 브리더(생식기에 이상이 없는데도 3회 AI로 수태되지 않는 소)처럼 원래 수태율이 낮은 소·우군에서 효과가 인정됨. 모든 소에 일괄로 놓기보다 수태율이 낮은 소를 골라 씀.</li>
<li>이제 발정 발견 시 또는 발견 없이 정시에 수정해 수용 가능한 임성을 얻는 프로토콜이 있고, 치료 시작 시 주기를 안 도는 암컷에서도 성공함. 특히 사춘기 전후 후보우·무주기 암소에서 임성 있는 배란을 개시하는 것이 동기화·정시 AI로 임성을 개선하는 일차 방법이며, 수정 전 질내 P4 기반 동기화가 다른 호르몬 개입보다 임성을 더 효과적으로 높임. 지역·목초·사료·품종·체형·분만 후 간격·기후가 성공에 영향을 주므로 염두에 둠.</li>
<li class="grp">스탠딩 지속은 16~21시간으로 알려졌지만 유량이 늘수록 짧아짐. 발정 시 E2가 유량과 함께 낮아지기 때문임. LH surge를 일으키는 E2 양은 발정 징후를 일으키는 양보다 적어, 고능력우는 E2 피크가 낮아져 발정 역치를 넘는 시간은 짧아지지만 surge 역치는 넘어 배란함. 이것이 무발정 배란의 논거임. 걸음 수는 E2 증가에 따라 늘다가 LH surge 피크부터 줄어듦.</li>
<li>발정 전기엔 냄새 맡기·턱 얹기·외음부 약한 종창·외자궁구 약간 개구·딱딱하고 약간 흰 점액이 보이고, 발정기엔 스탠딩·활동량 증가·강한 충혈·투명하고 잘 늘어나는 점액으로 바뀜. 질경으로 보면 황체기는 자궁경 주름이 조여 외자궁구가 닫히고 질벽이 약간 희고 건조함. 발정기는 주름이 이완돼 외자궁구가 열려 경관 안 주름이 보이고, 질벽이 균일한 진한 분홍으로 충혈되며 습윤함.</li>
<li>활동량 모니터링에서 수정일 활동량이 평소 3.00배 이상(강한 발정)인 소는 AI·ET 모두 수태율이 높고, 1.00배 미만(무발정)은 매우 낮음(AI 620두, ET 1,142두). 홀스타인 7,433두에서 AI일 발정이 보인 소는 7일 P4 고저와 무관하게 수태율이 높았음. AI는 발정 유무와 무관하게 7일 P4가 높으면 수태율이 올랐지만, ET는 7일 P4가 영향이 없었음. ET는 발정 징후가 뚜렷한 소에 해야 함.</li>
<li>발정 당일을 0일로 할 때 클로프로스테놀 500μg 투여 후 발정 발현율은 미경산우 3일 0%, 5일 40.7%, 7일 88.5%, 10일 100%임. 비비유 경산우는 5일 0%, 7일 이후 90% 이상임. 비유 경산우는 7일 65.8%로 낮고 8일 이후에야 90%를 넘음. 젖소는 PGF2α 반응 저하 기간이 더 긺. 5~7일이면 황체가 이미 커서 크기만으로 효과를 판단하기 어려움.</li>
<li>주기 5일 이내는 디노프로스트 25mg 1회, 12시간 간격 2회, 2배량 50mg 어느 것을 줘도 P4가 하루 뒤 잠깐 떨어졌다가 리바운드해 13~15일에 대조군과 같아짐. 용량·횟수를 바꿔도 황체를 완전히 퇴행시킬 수 없으므로 주기 5일 이내엔 주지 않는 것이 좋음.</li>
<li>AI 후 P4 보충이 듣는 조건은 메타분석상 자연발정 AI, AI 후 3~7일 처치, 무처치 수태율 45% 미만(특히 30% 미만)임. Friedman은 비유 피크기 BCS 2.25 이하에서 53% vs 27%, 후산정체·자궁염 이력 + 저BCS에서 58% vs 14%를 보였음. Izumi는 4회 이상 AI 리피트 브리더에 5~19일 P4로 66.7% vs 23.1%, Pugliesi는 4일 황체 단면적 0.9cm² 미만 소에 근주로 57.9% vs 40.4%를 보였음.</li>
<li>너무 이른 P4 투여는 황체 형성을 저해함. 미경산 육우에서 3.0~6.5일 CIDR군은 무처치보다 25일 수태율이 낮았고 4.5~8.0일군이 더 좋았음. PRID를 3~7일 유치하면 8일 이후 P4가 대조군보다 낮고 황체 중량이 유의하게 줄며, 3~5일도 황체 중량이 줆. 5~7일 유치는 영향이 없음. 3~7일·3~5일군은 7~14일 조기 발정 회귀가 25% 이상(대조 7.1~16.7%)이고 배아 회수율도 떨어짐. Beltman은 5·6일 P4와 16일 배아 크기가 양의 상관, 7·8일은 무상관이라 함. 결론은 AI 후 3일 이내 투여를 피하고 5일 전후에 시작하는 것임.</li>
<li>AI 후 P4 시험들. PRID 3~5일 3일 투여는 유의 향상, 15~17일은 향상 경향. CIDR 4~18일 +4%, 고온기 5~18일 +8%, 4일 근주 +3%는 유의차 없음. 후반부 투여는 한 시험에서 6.5% 유의 향상, 다른 시험은 무효. 14~21일 P4는 31~60일 배사멸률을 유의하게 낮췄음. 질내 P4 제제의 본래 적응은 발정주기 동기화·미약발정·난소정지이고, E2 캡슐이 든 제제를 AI 후 수태율 향상이나 임신우에 쓸 땐 E2를 뺌. 근주 P4 제제의 적응은 착상 장애·습관성 유산 방지임.</li>
<li class="grp">발정 지속시간은 보통 15시간(12~18)이지만 유량에 따라 짧아짐. 일일 유량 25~30kg 14.7시간, 40~45kg 4.8시간, 50~55kg 2.8시간이고 ST 횟수도 줌. 단 같은 유량이라도 개체 편차가 커(30kg에서 3~25시간) 유량만으로 발정 강약을 단정하지 않고 분만 후 질병·에너지 상태·사양·컨디션을 함께 봄.</li>
<li>미수정우는 발정일 기준 황체 퇴행 18.5일, 배란 23.1일로 발정이 평균 22.1일에 와 현대 착유우 주기는 21일보다 하루 긴 가능성이 있음. 수정 후 배가 없던 소는 황체 퇴행 22.4일·배란 25.7일로 재발정이 2~3일 늦으므로 수정 후 25~26일까지 재발정을 봄.</li>
<li>앞에서 올라타는 MT는 일반 MT보다 강한 발정이라 두 마리 모두 수정 가능성이 높음.</li>
<li>주입기를 뺀 뒤 정액 배출, 혈액, 농 부착을 확인함. 혈액은 늦은 수정(발정 종료 후·배란 직전)이나 내막 손상 때 묻고 수태율이 낮음. 농이면 자궁내막염이라 자궁 처치가 필요함.</li>
<li class="grp">수정 판단 사례 ①. 18mm 난포+15mm 황체에 반대쪽 20mm 넘는 난포(낭종 의심), 약한 자궁 수축·외음부 종창 → 수정함. 두 난포 중 하나만 배란돼도 추가 수정은 불필요함.</li>
<li>사례 ②. 18mm 난포+30mm 난포, 강한 수축·충혈, ST → 황체 조건이 없어도 수정함. 다음날 배란이 안 보이면 7~14일에 황체 형성을 확인하고 없으면 낭종임.</li>
<li>사례 ③. 8일 전 수정, 18mm 난포+28mm 황체, 약한 수축 → 수정 안 함. 1차 난포파 우성 난포의 E2로 생긴 발정 양상이고 고유량·마른 소에서 P4가 낮아 흔함.</li>
<li>사례 ④. 60일 전 수정, 20mm 황체+18mm 난포, 약한 수축 → 자궁을 보니 임신. 발정 감정 때 이전 수정일 확인이 필수임.</li>
<li class="grp">발정 시작 후 배란 시점은 계절의 영향을 받지 않음. 여름엔 승가 횟수가 줄고 간격이 늘 뿐이라 하계에도 AI 적기 산식은 같음. 미경산우는 발정 지속이 길어 발정 시작 24시간 후 AI를 권장함. 정자 수정능 획득엔 6~8시간 걸림.</li>
<li>자연 발정이 PGF2α 유발 발정보다 길다는 보고(15.3 vs 13.3시간)가 있고, 프로게스타겐 처치 후 발정 발견 빈도가 PGF2α보다 높다는 보고가 있음. 호르몬 처치 후엔 직원이 발정 징후를 더 의식함. 부정확 발견 농장은 마지막 기록보다 이른 수정에 임신 판정되는 소가 많고 분만 예정일 전 분만 비율이 높음. 비효율 농장은 진단 시 임신 위험이 85% 미만임(AI일~진단일 사이 발정을 놓침).</li>
<li>AAMS는 반추·섭식 시간 감소도 발정 예측에 쓸 수 있음. 발정 발현이 큰 소는 활동 알림→배란 간격이 길고 배란 실패가 적고 임신율이 높음. 활동 개시→배란 간격의 개체 변동이 커 수정 대상 목록을 8~12시간마다 두 개로 생성하도록 설정함. Presynch-Ovsynch 전동기화우를 활동 증가로 수정하고 TAI에서 빼도 전체 임신 위험은 개선되지 않았고, 후보우 관리에선 AAMS가 Kamar보다 유리하지 않았음.</li>
<li>정액통은 모델·개봉 빈도에 따라 6~12개월 보유하고 질소량을 정기 점검·보충함. 우유 냉각탱크·오븐 근처(증발↑), 젖은 바닥은 피하고, 서리·결로는 진공 손실 신호임. 융해조 온도계 정확도는 최소 6개월마다 점검함. 셔츠 주머니 융해는 약 3분 후 액화 시작, 5분에 융해 완료임. 동시 융해한 10개 스트로의 수정 순서가 종축에 따라 정시 AI 수태율에 다르게 영향함.</li>
<li>스트로 장전. 면 마개의 과량 액체질소를 털고, 압착부를 위로 들고 가볍게 두드려 공기 공간을 압착부에 모은 뒤, 깨끗한 가위로 장축에 수직, 압착 봉합부 바로 아래를 자르고 시스–스트로 밀봉을 확인함. 심부 수정은 황체 쪽 자궁각 안쪽에서 하고, 수정란 이식은 배란 자궁각 심부에 더 긴 이식총과 특수 시스를 씀.</li>
<li>AI 후엔 총 끝 감염 여부를 보고, 스트로·시스를 90도로 구부려 빼고, O링을 다시 조이고, 수소 ID를 확인하고, 시스·스트로·분변을 장갑 안에 넣고 공기를 빼 매듭 지어 버림.</li>
<li>자궁체가 짧으므로 주입기가 경관을 빠져나와 검지 절반 이상 자궁 안에서 만져지면 한쪽 자궁각으로 들어간 것임.</li>
<li class="grp">열스트레스. 직장 온도가 0.5℃ 오를 때마다 수태율이 6.9~12.8% 떨어지고, 더위철엔 발정 후 배란 실패가 12.4%(서늘할 때 3.4%)임. 난자는 배란 전 약 40일의 난포 성장기부터 손상되므로 더위가 끝나도 105일(개시 후 133일)까지 성적이 이월됨. 발정 지속·강도가 줄어 발견율이 떨어지니 정시수정으로 가되, 2일 이상 고체온(39℃ 초과)인 소는 GnRH 배란 유도보다 수정 전날 ECP가 수태율이 나음. PRID를 9일 대신 5일만 넣는 프로토콜은 계절 저하가 사라짐. 배반포는 열에 강해 7일 배아 이식은 계절차를 없앰. 수정 후 5~6일 hCG, AI+12일 GnRH, 저BCS 소의 CIDR 5~18일 보강은 유효하고, 항산화제는 결과가 엇갈림. 수정 시 비타민E 주사, 분만 전후 비타민E·셀레늄 반복 주사, 수정 −6·−3·0일 β-카로틴 주사는 수태율 개선이 없었고, 분만 후 약 15일부터 90일 이상 β-카로틴 급여는 분만 후 120일 임신 비율을 높였으며 여름철 멜라토닌 임플란트는 공태일수를 줄였음. 배란 전후 며칠만 냉각하는 건 부족하고 난포 성장기 내내 그늘·송풍·살수가 필요함.</li>
<li>열스트레스는 온습도지수(THI) 상승에 대한 생리 반응으로 수태율·임신율을 낮춘다.<span class="hang">열중성대 상한은 THI 72가 가장 흔히 쓰이고(연구에 따라 70~75) 비유 젖소는 보통 THI 70 부근에서 열스트레스가 시작된다. 시점 측정보다 일평균 THI를 적용하는 것이 정확하다.</span><span class="hang">온대 기후에서도 교배 21~1일 전 THI 73 노출 시 임신 가능성이 61% 낮았고, 효과는 수정 35일 전~6일 후까지 누적된다.</span><span class="hang">THI(temperature-humidity index): 기온과 습도를 합친 더위 지수.</span></li>
<li>열스트레스는 영양 대사를 통해서도 번식을 해친다.<span class="hang">소는 대사열 생산을 줄이려 섭취를 줄이며, 이 DMI(건물 섭취량) 저하와 특유의 대사 적응이 음에너지 균형(NEB)을 일으켜 분만 전후 NEB와 비슷하게 번식 성적을 떨어뜨린다. 유량 감소의 한 원인도 이 섭취 감소다.</span><span class="hang">섭취 감소로 호르몬 생성이 바뀌며 체온 상승 자체가 배아 생존성을 낮춘다.</span><span class="hang">극심한 습기·더위·가뭄은 영양 상태와 면역을 함께 떨어뜨린다.</span></li>
<li>육우는 비유 젖소보다 대사율이 낮고 교배기가 보통 가장 더운 시기에 놓이지 않으며 온난 지역 육우는 유전적으로 적응돼 있어 열스트레스 영향이 대개 젖소만큼 크지 않다.</li>
<li>사료 섬유 소화가 열스트레스를 악화시킨다. 건물 단위당 NDF(중성세제불용섬유)의 반추위 분해는 다량영양소 중 열 증가량(heat increment, 소화·대사 과정에서 생기는 열)이 가장 크고 조지방(EE)은 가장 낮다.</li>
<li>극심한 열스트레스 시기에는 비유 사료의 NDF를 낮추고 조지방을 높이는 것이 통상 관행이다.<span class="hang">체온 유지에 추가 에너지를 쓰는 시기에 사료의 열량 밀도를 높이고, 한계 섬유 소화로 생길 열 증가량을 줄이는 두 가지 효과가 있다.</span><span class="hang">단 섬유가 너무 낮으면 반추위 산증, 조지방이 너무 높으면 섬유 소화율·DMI 저하 위험이 있어 양극단을 피한다.</span><span class="hang">육우에서 연구된 '삼투 활성 원료 급여'도 체온 상승을 최소화하는 것으로 나타났으나 효과·실용성은 추가 연구가 필요하다.</span><span class="hang">그 밖의 고온 대책으로 환경 냉각, 중조(탄산수소나트륨, 완충제) 첨가, 급여 시간 변경을 든다.</span></li>
</ol></div>

  
<div class="modal-sub" style="margin:22px 0 6px;">육성우의 번식관리·인공수정·임신 진단·임신기간 (일본송아지 5-2)</div><div class="rb-block">
<div class="modal-sub" style="margin:18px 0 6px;">육성우의 번식관리</div>
<div class="modal-sub" style="margin:14px 0 6px;">발정 관찰</div>
<p class="rb-p">높은 수태 성적을 얻는 데 가장 중요한 것은 발정 관찰이다. 방목지나 운동장이 있는 우사에서 관리되는 육성우는 발정 행동이 뚜렷하여 관찰이 쉽다. 적기에 인공수정(AI)을 하려면 발정 개시 시기를 파악해야 한다. 프리스톨 우사 보급으로 육성우도 콘크리트 바닥 우사에서 상시 관리되는 경우가 많아져 발정 행동에 적지 않은 영향을 주고 있다. 일반적으로 콘크리트 위에서는 흙바닥에 비해 승가 허용(스탠딩) 행동과 승가(마운팅) 행동 횟수가 유의하게 줄고(그림 5-2-1) 발정 지속시간도 짧아진다.</p>
<p class="rb-p">소의 발정은 심야~이른 아침에 시작되는 경우가 많다고 알려져 왔으나, 최근 연구에서는 개시 시간대에 치우침이 없고 하루 종일 발정이 시작된다는 것이 밝혀졌다. 따라서 발정을 놓치지 않고 적기에 AI를 하려면 관찰 횟수를 최대한 늘려 1일 2~3회 발정 관찰을 해야 하며, 정확도를 높이기 위해 후술하는 발정 발견 보조기구(히트마운트 디텍터, 페인트 마커 등)의 활용도 필요하다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-1 사양관리 방식 차이가 홀스타인 착유우의 발정 시·비발정 시 보행수에 미치는 영향 — 타이스톨 우사(10두) vs 자동착유 우사(27두). 비발정 시 보행수 약 125 vs 75카운트, 발정 시 약 240 vs 140카운트, 보행수 변화율 약 215% vs 210%, 발정 행동 발현율 약 105 vs 60(a·b 간 P<0.01). 보행수는 왼쪽 앞다리 보수계(10보=1카운트)로 측정, 타이스톨은 오전 6시 30분 기준 24시간 차, 자동착유는 오후 6시 기준 24시간 차. 변화율(%)=발정 시 보행수/비발정 시 보행수×100. 발정 관찰은 타이스톨 오전 6:30부터 방목 종료까지 약 3시간 반, 자동착유는 오전 8시부터 20분과 오후 4시부터 약 2시간의 조석 2회. 아오키 하루스케, 2002년도 낙농학원대학 졸업논문에서 작성</p>
<div class="modal-sub" style="margin:14px 0 6px;">스탠딩 행동(발정)</div>
<p class="rb-p">스탠딩 행동은 발정우가 다른 소에게 올라타여도 움직이지 않는 상태(승가 허용)이며, 다른 소에 올라타는 행동을 마운팅 행동이라 한다(그림 5-2-2). 소는 암컷끼리도 서로 승가하므로 발정 관찰이 쉬운 동물이다. 일반적으로 최초 스탠딩 시점을 발정 시작, 마지막 스탠딩을 발정 종료로 보고 그 사이를 발정 지속시간으로 한다. 지속시간은 우군 구성과 우사 환경에 영향을 받으며, 4~24시간으로 개체차가 크지만 평균 7~16시간이다.</p>
<p class="rb-p">발정이 가까워져 스탠딩 직전인 소는 다른 소에 관심을 보이며 적극적으로 마운팅한다. 발정이 본격화되면 다른 소의 승가를 허용하여 스탠딩을 보이고, 올라타기보다 올라타이는 횟수가 많아진다. 가장 신뢰할 수 있는 발정 징후는 스탠딩 행동이다. 발정우가 여러 마리면 그룹을 이루어 활발히 승가하지만, 1두뿐인 경우 관리자가 관찰 중 타이밍 좋게 스탠딩을 발견하지 못할 수 있다. 관찰 시간이 짧으면 발견율이 떨어지므로 1회당 최소 15분 이상 관찰이 필요하다.</p>
<p class="rb-p">육성우의 스탠딩 행동은 경산우보다 활발하고 횟수도 많다. 반복 승가된 소는 미근부~십자부의 털이 앞쪽(머리 방향)으로 강하게 눌린 듯 거꾸로 서고, 승가한 소의 양 앞다리가 발정우 둔부 윗부분을 끼므로 그 부위가 발굽으로 더러워지며, 발정한 육성우는 격렬히 움직여 온몸에 땀을 흘리는 등 평소에 없는 특징적 변화가 나타난다.</p>
<p class="rb-p">관찰하지 않는 시간대의 스탠딩을 확인하는 방법으로 십자부·미근부 사이에 부착하는 디텍터나 테일페인트 등 보조기구가 효과적이다(그림 5-2-3). 디텍터에는 잉크 튜브가 들어 있어 승가 압박으로 잉크가 새어 나오는 방식과, 표층 스크래치 인쇄면이 벗겨져 안쪽 붉은 면이 드러나는 방식이 있으며 둘 다 스탠딩을 보인 소를 확인할 수 있다. 테일페인트는 전용 도료를 십자부·미근부 사이에 칠해 승가로 벗겨지는 것으로 발정우를 확인한다. 최근에는 소의 요부에 스프레이 접착제로 붙여 승가우의 접촉을 감지하면 발광하여 알리는 센서도 사용된다. 방목·운동장을 갖춘 우사에서는 발정 행동이 대체로 뚜렷해 관찰이 비교적 쉽다. 스탠딩 발현이 적을 경우 미끄러운 바닥 등 사양 환경이나 운동기 장애로 인한 통증이 방해하고 있을 가능성이 있으므로 확인이 필요하다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-2 패독에서 홀스타인 미경산우의 스탠딩 행동과 마운팅 행동</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-3 각종 발정 발견 보조기구 — 상단: 테일페인트(좌)와 도포 상황(우), 중단 좌: 스크래치식 디텍터, 중단 우: 접촉 감지 센서(외장 상자, FlashMate), 하단: 접촉 감지 센서와 디텍터, 센서 장착 상황</p>
<div class="modal-sub" style="margin:14px 0 6px;">발정 점액, 외음부의 종창·충혈</div>
<p class="rb-p">발정 시 외음부에서 부드럽고 점조성이 높은 자궁경관 점액이 흘러나온다. 발정기 점액을 슬라이드글라스에 도말·건조하면 양치상 결정이 형성된다(그림 5-2-4). 자궁경관 점액은 비발정기와 임신 중에는 자궁과 질 사이를 차단하지만, 발정기에는 수분과 염류 농도가 증가해 정자의 침입과 운동에 적합한 성상이 되어 정자 수용성이 높아진다.</p>
<p class="rb-p">발정 점액은 발정우가 다른 소에 승가했을 때 다량 흘러나오거나 횡와 시 바닥에 흐르는 경우가 많다. 따라서 관찰 시 외음부·꼬리·대퇴부에 점액이 묻어 있는지, 우상에 묻어 있는지도 주의 깊게 살펴야 한다.</p>
<p class="rb-p">발정우의 외음부는 주름이 사라지고 부은 상태(종창)가 된다(그림 5-2-5). 황체기에는 주름이 있고 쪼그라든 상태(수축)이다. 발정 1~2일 전부터 서서히 붓기 시작해 발정 당일 광택과 종창이 뚜렷해진다. 육성우의 발정 시 외음부 종창은 경산우보다 명료하며 내측은 충혈되고 발정 점액도 보인다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-4 발정우 자궁경관 점액의 양치상 결정상(컬러 구회 14쪽)</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-5 발정우의 외음부 — 주름이 없어지고 종창되어 있다(컬러 구회 14쪽)</p>
<div class="modal-sub" style="margin:14px 0 6px;">활동량</div>
<p class="rb-p">발정 시 스탠딩·마운팅 행동에 따라 활동량이 증가한다. 보수계를 장착해 보행수를 자동 측정하여 발정우를 발견·통지하는 시스템이 전국에 도입되어 있으며, 현재는 다리가 아닌 목에 장착하는 타입도 판매된다. 센서가 장착된 웨어러블 기기를 목에 달아 활동량 등 정보를 취득·클라우드 전송하고, 발정·질병 징후·활동량 저하 등 소의 상태를 인공지능으로 검지해 스마트폰 등 단말에서 확인하는 시스템도 클라우드 우군 관리 시스템과 함께 전국에 도입되어 있다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">번식관리 기록의 중요성</div>
<p class="rb-p">번식관리 기록을 정확히 기재·보존하고 끊임없이 번식 상황을 확인하며 우군을 관리하는 것이 중요하다. 임신하지 않은 육성 암소는 약 20일마다 발정이 회귀한다. 이전 발정·수정 기록을 바탕으로 발정 또는 수정 후 2주 경과 이후에는 보조기구를 활용하는 등 발정 징후에 주의하면 발정 발견율 향상을 기대할 수 있다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">인공수정</div>
<div class="modal-sub" style="margin:14px 0 6px;">인공수정 적기</div>
<p class="rb-p">AI로 높은 수태율을 얻으려면 수정 능력을 획득한 다수의 정자와 수정 능력이 높은 배란 직후의 난자가 타이밍 좋게 수정 부위에서 만나도록 AI를 해야 한다¹⁾. 수정된 정자는 자궁에서 난관 협부로 보내져 배란까지 머문다(저류). 저류에 필요한 시간은 7~10시간으로 여겨진다. 배란이 일어나면 정자는 난자가 기다리는 수정 부위로 이동하기 시작하며, 이때 최종적인 수정능을 획득한다.</p>
<p class="rb-p">소의 평균 배란 시간은 발정 개시 후 25~32시간이다. 난관 협부 저류에 필요한 시간을 고려하면 배란 10시간 전, 즉 발정 개시 후 17~18시간까지 AI를 해야 한다. 다만 너무 이르면 저류 중 정자가 노화해 활력과 수정 능력이 떨어진다. 기존 보고에 따르면 스탠딩 개시 후 4~16시간에 AI하면 수태율이 높고, 4시간 이내나 16시간 이후에 하면 낮다²⁾(표 5-2-1). 따라서 소의 AI 적기는 발정 개시 후 4~16시간으로 본다. 그러나 실제 사양관리에서는 발정 개시 시각을 정확히 알 수 없으므로 관찰 횟수를 최대한 늘려 적기에 AI해야 한다. 종래 방법으로는 오전 중 발정 발견 시 저녁에, 오후 발견 시 다음 날 아침에 AI하는 AM-PM법이 있다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 5-2-1 발정 개시부터 AI까지의 시간과 수태율의 관계</p>
<div style="overflow-x:auto"><table class="jp-tbl"><tr><th>발정 개시~AI 시간(시간)</th><th>AI 두수(두)</th><th>수태율(%)</th></tr><tr><td>0~4</td><td>327</td><td>43.1</td></tr><tr><td>4~8</td><td>735</td><td>50.9</td></tr><tr><td>8~12</td><td>677</td><td>51.1</td></tr><tr><td>12~16</td><td>459</td><td>46.2</td></tr><tr><td>16~20</td><td>317</td><td>28.1</td></tr><tr><td>20~24</td><td>139</td><td>31.7</td></tr></table></div>
<p class="rb-p"><span style="color:var(--ink-soft)">발정 개시는 스탠딩 행동 검지 시점으로 하였다. 문헌 2에서 인용·개변</span></p>
<div class="modal-sub" style="margin:14px 0 6px;">배란 동기화 처치와 정시 인공수정</div>
<p class="rb-p">초회 수정 지연이나 미약한 발정 징후를 놓쳐 수정·수태가 늦어지는 경우, 호르몬 제제로 발정을 동기화하고 이에 맞춘 정시 인공수정으로 인위적으로 수정 기회를 늘릴 수 있다. 오브싱크(Ovsynch)로 대표되는 배란 동기화 처치와 그 후 배란에 맞춰 정해진 시각에 AI하는 정시 인공수정은 여러 방법이 검토·개발되어 있다. 비용이 들므로 발정 발견의 효율화, 호르몬 처치 등의 비용 대비 효과를 고려해야 한다. 발정 발견이 가능하면 프로스타글란딘(PG)F2α 제제 투여법을 쓸 수 있고, 발견 효율이 낮거나 발견 노력을 줄이려면 질내 유치형 황체호르몬 제제(CIDR)를 병용한 정시 인공수정법을 쓸 수 있다. 육성우의 성성숙 정도를 현장에서 추정하는 지표로 생식기 스코어(RTS, 표 5-2-2)를 쓸 수 있으며, RTS 4~5인 소는 성성숙에 도달한 것으로 판단되고 3 이하에서는 호르몬 처치 후 수태율이 낮다³⁾⁴⁾.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 5-2-2 생식기 스코어(RTS)</p>
<div style="overflow-x:auto"><table class="jp-tbl"><tr><th>RTS</th><th>자궁각</th><th>난소 길이(mm)</th><th>난소 높이(mm)</th><th>난소 폭(mm)</th><th>난소 내 구조물</th></tr><tr><td>1</td><td>미성숙, 직경 20 mm 미만, 명료한 촉감 없음</td><td>15</td><td>10</td><td>8</td><td>촉진 가능한 구조물 없음</td></tr><tr><td>2</td><td>직경 20~25 mm, 명료한 촉감 없음</td><td>18</td><td>12</td><td>10</td><td>장경 8 mm 난포</td></tr><tr><td>3</td><td>장경 25~30 mm, 약간의 촉감 있음</td><td>22</td><td>15</td><td>10</td><td>장경 8~10 mm 난포</td></tr><tr><td>4</td><td>장경 30 mm, 명료한 촉감 있음</td><td>30</td><td>16</td><td>12</td><td>장경 >10 mm 난포, 황체 가능성 있음</td></tr><tr><td>5</td><td>장경 >30 mm, 명료한 촉감 있음, 수축</td><td>>32</td><td>20</td><td>15</td><td>장경 >10 mm 난포, 황체 존재</td></tr></table></div>
<div class="modal-sub" style="margin:14px 0 6px;">동결정액의 취급</div>
<p class="rb-p">소 AI에는 동결정액이 쓰인다. 일본에서 생산·유통되는 동결정액은 0.5 mL 스트로가 주류이고, 해외 수입 정액은 0.25 mL 스트로도 많다. 0.25 mL는 온도 변화 영향을 받기 쉬우므로 융해 후 온도관리에 주의한다. 융해는 액체질소에서 꺼낸 스트로를 재빨리 35~37℃ 온수에 40~45초 침지하여 한다. (일사)가축개량사업단이 취급하는 성선별 정액이나 신형 스트로 구조 정액(Sort90, FCMax)은 융해 조건이 지정(38℃, 15초)되어 있으므로 주의한다. 정액 주입기는 개별 멸균된 것이거나 꼭 짠 알코올 솜으로 닦고 전용 케이스 등으로 가온해 둔다. 융해 후 스트로는 수분을 완전히 닦은 뒤 주입기에 세팅한다. 스트로 커터는 날을 확인하고 잘 드는 것을 알코올 솜으로 닦아 쓴다. 융해 후 정액은 즉시 자궁에 주입해야 하지만, 주입까지의 온도 변화, 특히 한랭 자극을 피하기 위해 전용 보온 홀더 등에 보관한다(그림 5-2-6). 정액 온도관리의 핵심은 융해 온도·시간 엄수와, 액체질소 탱크에서 꺼낼 때 캐니스터를 공기 중으로 들어 올리지 않는 것이다. 수정 대상이 여러 마리여도 융해는 1개씩 하고, 융해기 온수 온도를 확인해 낮아지면 고온수로 조절한다. 캐니스터를 공기 중으로 들어 올리면 스트로 내 온도가 상승해 정자가 큰 손상을 입으므로 액체질소 용기 입구 위로 올려서는 안 된다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-6 정액 주입기의 보온기</p>
<div class="modal-sub" style="margin:14px 0 6px;">정액의 주입</div>
<p class="rb-p">일반 주입기를 쓸 경우 정액은 자궁체에 주입하도록 권장된다. 발정 시 다량의 점액이 분비되어 자궁경관 내에 주입하면 질내로 흘러나올 수 있으므로, 더 많은 정자를 자궁 내로 보내기 위해 자궁체 주입이 필요하다. 소의 자궁체 실질 길이는 2~3 cm 정도로 짧고 바로 좌우 자궁각으로 갈라지므로, 자궁경관을 통과한 직후 부위에 주입해야 한다. 가축개량사업단의 성선별 정액과 신형 스트로 구조 정액은 스트로 내에서 희석액과 정액이 분리된 2층 구조이므로 자궁체 또는 주석 난포(배란 난포)가 있는 쪽 자궁각에 주입해야 한다(양쪽 자궁각에 나누어 주입하면 한쪽에는 희석액만 들어간다). 이들 정액을 쓸 때 카테터식 주입기로 배란측 자궁각에 무리 없는 심부 주입을 하면 수태율 향상을 기대할 수 있다(그림 5-2-7).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-7 심부 주입기(아래)와 일반 주입기(위)의 구조 비교 — 일반형 418 mm; 심부형 본체 435 mm(금속제), 신장부 150 mm(PVC 튜브), PVC 튜브 내용량 0.7 mL. 심부 주입기는 카테터 선단에서 150 mm의 PVC 튜브가 연장되어 일반형보다 자궁각 심부에 주입할 수 있다. 「Sort90 심부 주입 수정 매뉴얼 모4호 AI 사용법」에서 인용</p>
<div class="modal-sub" style="margin:14px 0 6px;">인공수정 시 위생관리</div>
<p class="rb-p">AI 시 정액 취급과 주입의 일련 작업은 위생적으로 해야 한다. 멸균되지 않은 주입기, 스트로 커터, 융해 후 스트로는 꼭 짠 알코올 솜으로 닦는데, 이는 융해 온도를 적절히 유지하기 위해서이기도 하다. 융해기 온수는 1두 수정마다 확인하고 먼지·분변 등으로 오염되면 교체한다. 사용 후 기구는 세정하고 가능하면 멸균한다. 주입기 질 삽입 전 외음부를 닦되, 질 내로 물이 들어가면 오염 원인이 되므로 주의하고 여분의 수분도 닦아 낸다. 시스 커버 장착은 외음부 부근·질 입구의 세균이 질 심부·자궁 내로 유입되는 것을 막는 유효한 수단이다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">임신 진단</div>
<p class="rb-p">조기 수태를 위해 조기에 임신 진단을 하여 임신우 확정과 불수태우 선별을 하는 것이 중요하다. 조기에 불수태우를 선별하면 재수정을 위한 처치를 할 수 있다. 소의 발정주기는 약 21일이므로 AI 후 20일 전후에 발정 징후가 없으면 수태했을 가능성이 있고, 이들 개체에 적절한 시기에 확정 진단을 한다. 확정 진단에는 대체로 다음 두 방법이 쓰인다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">직장검사법</div>
<p class="rb-p">직장검사 임신 진단은 임상 현장에서 가장 많이 쓰이며 기기가 필요 없는 간편·실용적 방법이다. 임신 40일 이후 비임신각을 엄지·검지·중지로 집어 올려 태막(요막융모막)이 미끄러져 빠지는 감촉을 촉지하여 임신으로 진단한다. 적기는 임신 40~60일이며, 임신 일령이 진행되면 자궁이 하수하여 촉진이 어려워진다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">초음파검사</div>
<p class="rb-p">초음파 영상진단장치로 자궁 내부를 비침습적으로 영상화해 자궁 내 태아, 태아 심박 등을 확인하는 방법이다. 임신 22일경부터 자궁 내에 검게 비치는 영상으로 묘출되는 임신강이 관찰되고, 임신 30일에는 심박동을 동반한 태아상을 관찰할 수 있다(그림 5-2-8). 이른 태령에 정확한 진단이 가능하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">조기 임신 진단에 의한 불수태우 선별</div>
<p class="rb-p">조기 임신 진단으로 불수태우에 재수정 처치를 하는 것은 번식성 개선으로 이어진다. 초음파 장치로 AI 후 26일에 자궁을 관찰해 수태 산물에 기인한 임신강(검게 비치는 영상)이 확인되지 않으면 불수태로 판정하고, 호르몬 제제 투여로 다음 수정을 위한 처치를 하면 초회 분만 월령을 앞당길 수 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-8 초음파검사에 의한 임신 감정 — 좌: AI 후 26일 자궁의 임신강, 우: AI 후 32일 태아 확인(컬러 구회 14쪽)</p>
<div class="modal-sub" style="margin:18px 0 6px;">임신기간</div>
<p class="rb-p">소에서는 교배일부터 분만일까지를 임신기간으로 한다. 품종별로 차이가 있어 일반적으로 유용우가 육용우보다 짧다. 품종별 평균 임신일수는 홀스타인 281일, 저지 279일, 흑모화종 290일, 갈모화종 287일, 애버딘앵거스 279일, 헤리퍼드 285일이다⁵⁾. 또 계절, 개체, 산차, 태아 성별, 종모우에 따라서도 차이가 있다. 북미 연구에서는 봄·여름 분만 홀스타인이 가을·겨울 분만보다 짧았다. 개체차는 임신 중 영양 상태도 영향하며 265~309일의 범위가 있다. 산차 영향은 예컨대 홀스타인 초산우 평균 278일, 2산 이후 평균 280일로 초산우가 1~2일 짧다(6-1[282쪽] 참조). 수컷 태아는 암컷보다 1~2일 길고, 쌍태는 단태보다 3~6일 짧다. 종모우 차이도 보고되어 홀스타인에서 종모우에 따라 278~291일의 차가 보고되었다.</p>
<p class="rb-p">유용우에 육용우 수정란을 이식한 경우 임신기간은 태아 품종의 영향을 받는다. 즉 홀스타인에 흑모화종 수정란을 이식하면 흑모화종의 임신기간으로 태어난다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기간의 간이 계산법</div>
<p class="rb-p">교배한 월에서 3을 빼고, 교배일에 유용우는 6일, 흑모화종은 11일을 더하면 분만 예정일을 간단히 계산할 수 있다. 예를 들어 10월 1일 교배 시 유용우는 이듬해 7월 7일, 흑모화종은 이듬해 7월 12일이 분만 예정일이다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(堂地 修·大島一修)</span></p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 5-2 육성기의 사양과 번식관리, 堂地修·大島一修.</p>
</div>
`;

<li>공여우는 과배란 전 자궁 건강·난소 기능을 평가함. 난포 동원기 검사로 반응을 예측함. 파 시작 시 많은 난포 동원 소가 FSH 후 더 많이 생성함.</li>
<li>채란일 황체 수 세기는 초음파가 촉진보다 훨씬 유용함. 작은·공동성·깊이 박힌 황체도 봄. 얇은 벽 공동성 황체가 미배란 난포와 구별 어려워도 채란함. 예상보다 많은 배아 회수 가능함.</li>
<li>수란우는 동기화 전 자궁·난소를 평가하고 경산우가 후보우보다 중요함. 황체 식별이 결정적이고 초음파가 촉진보다 정확함(거의 100% vs 80%). 그래서 더 많은 동물을 씀.</li>
<li>수란우 임신 검사는 편한 단계에 함. 동결 배아는 하루 작게, IVF 배아는 하루 크게 보일 수 있음.</li>
<li>ET 쌍태는 드물지만 손실 위험이 높음. 배아 분할, 2배아 이식, ET 전 발정 시 수정이 원인임. 이상적 검사 시기는 이식 후 21일(배아 28일)이고, 높은 가치 때문에 60일 이후 재검을 항상 함.</li>
<li>OPU(IVF용 난자 채취)는 경질 변환기에 부착한 유도 바늘로 함. 보통 곡선형이고 특수 도입기로 선형 직장 변환기도 가능함.</li>
<li class="grp">경산 육우 777두 Cosynch에서 둘째 GnRH 시 혈중 E2가 높을수록 7일 ET 후 34일 수태 가능성이 유의하게 높았음(E2 Low·Medium·High 3군 중 High군이 유의하게 높음). 별도의 육우 1,164두 정시 ET 시험(Jinks 2013)에서는 둘째 GnRH 시 E2 8.4pg/ml 미만을 Low군으로 나눴고 수우의 E2가 높을수록 임신율이 높았음. 같은 모델 287두에서 3~4일 PGF2α로 P4를 낮춘 군과 무처치군을 E2 고저와 2×2로 비교하면 ET 수태율은 P4 조작보다 배란 직전 E2 고저가 결정했음. E2 Low군에서만 7일 P4가 높을수록 수태가 올랐고 High군은 P4와 무관했음. 유우 Ovsynch에서도 둘째 GnRH 시 E2가 높을수록 수태 가능성이 높음.</li>
<li>공우 E2 고저와 무관하게 수우가 E2 High군이면 수태율이 높았고 High군 수우는 P4도 높았음. 육우 600두에서 Cosynch 둘째 GnRH 전날 ECP 0.5mg 근주는 둘째 GnRH 시 난포 12.2mm 미만인 소에서만 수태율을 유의하게 높였음. 유우 867두 Ovsynch에서 둘째 GnRH 8시간 전 E2 1.0mg 근주는 난포 20mm 미만이면 수태성을 높이고 그 이상이면 떨어뜨렸음. Souza는 BCS 2.50 이하 소에서 E2 투여가 수태율을 올릴 가능성을 보였음. 수정 시 난포가 작은 소, 영양이 나쁜 소에 E2를 보충한다는 생각으로 씀.</li>
<li>유우 387두에서 AI군은 7일 P4가 높을수록 28일 수태 가능성이 올랐지만 신선 ET군은 영향이 없었음. AI와 ET는 수태에 관여하는 요인이 다름. 과배란용 FSH(또는 eCG)를 투여하면 혈중 P4 고저와 무관하게 LH pulse 빈도가 줄거나 사라짐. 그래서 FSH 투여 중 P4를 낮춰 난포 발육을 더 촉진하려는 시도는 성립하지 않고, 과배란 처치에서 LH pulse를 고려할 필요가 없음.</li>
<li class="grp">과배란 개시는 난포파 출현 시점이 최적이고 우성 난포 선택 후 개시는 열등하며 출현 1~2일 후보다 당일이 더 큼. 주기의 약 20%(4~5일)만 쓸 수 있어 현대 프로토콜은 난포파 출현 동기화를 포함함. 과배란 반응은 난포파 출현 시 3mm 이상 난포 수의 약 70%로 예측되고 개체 내 반복성이 높아 1회 초음파로 가늠함.</li>
<li>공여우 수정일 검사는 보통 불필요하나 희귀·고가 정액이면 배란 크기(8mm 이상) 난포 존재를 확인함. 난소 위를 조작·압력 없이 부드럽게 스캔함(거친 취급은 작은 난포 파열·난소낭 탈출 유발). 이식 후 21일 임신 검사에서 병리 없는 공태 수란우는 황체가 적절하면 즉시 재이식할 수 있고, 성우는 전형적 21일 주기가 아닌 경우가 많아 후보우에서 더 효과적임.</li>
<li>과배란 FSH 투여법. 점감법은 12시간마다 6·6·4·4·3·3·2·2 AU(총 30AU)를 4일간 근육 내 투여함. 서방제 병용법은 30AU를 수산화알루미늄 겔에 섞어 첫날 1회 투여함. 채란 성적(황체 11.7 vs 12.3개, 회수 수정란 9.3 vs 10.0, 이식 가능 배아 8.0 vs 8.6)은 두 방법이 같음. 단 저용량 겔(알루미늄 1.5mg)은 근육 내로는 효과가 없고(황체 2.7, 수정란 0) 피하 투여해야 함(황체 17.7, 수정란 11.0, 이식 가능 9.0).</li>
<li>공여우 선발 AMH. 홀스타인은 채란 시 황체 15개 초과 기대 컷오프 약 123.5pg/mL, 흑모와종은 회수 난자·수정란 5개/15개/25개 기준 215/264/342pg/mL임. 사양·영양·혈통에 따라 반응이 달라 AMH만으로 단정하진 않음.</li>
<li>공여우 초음파 요점. 발정 개시 12~18시간엔 퇴행 중인 황체가 아직 보이므로(가장자리 붕괴·약간 고에코) 황체가 보인다고 발정이 안 온다고 하면 안 됨. 회수 전 초음파로 황체 수를 세어 두고, 회수된 난자·배아 수가 황체 수에 못 미치면 황체 수에 가까워질 때까지 재세척함. 이 반복 세척으로 두당 평균 0.9개의 배아가 더 나옴.</li>
</ol></div>

<p class="rb-p">이식 후 60일 초음파에서 태아가 몸의 각 부위 없이 덩어리로만 보이면 이상 임신이며, 이런 예는 80일경 유산했다. 이상 임신을 임신으로 오진하면 유산율이 높아 보인다.</p>

<li>임신 중 어미 심혈관계는 동맥압·혈관 저항이 떨어지고 심박출량이 최대 30~40% 늚. 심박수는 15%만 늘고 나머지는 1회 박출량이 메움. 분만 후 자궁태반으로 가던 혈류가 유선으로 재분배되는 것이 분만 직후 최고 비유를 가능하게 함.</li>
<li>영양 면의 핵심은 임신 막바지임. 젖소의 임신 말 영양 요구는 같은 체중 비임신 소보다 약 75% 높음. 임신 7개월이면 태아가 출생체중의 40%에 이르고, 예상 분만 약 60일 전 건유로 비유와 태아 성장의 경쟁을 막음.</li>
<li>수소와 쌍태로 태어난 암송아지는 불임일 수 있음(프리마틴). 두 태아의 태반 혈관이 문합되어 피가 섞이면 성 분화 중인 암컷이 수컷 쌍태의 테스토스테론·AMH에 노출되기 때문임. 수컷 조혈줄기세포까지 넘어와 키메라가 되며 생식선이 간성으로 끝나기도 함. 수소와 쌍태로 난 암송아지를 번식우로 쓸지 판단할 때 반드시 떠올림.</li>
<li>임신 감정은 번식 성적 평가에서 가장 중요한 행위임. 초음파의 가장 큰 가치는 양성 확인이 아니라 비임신의 조기 발견에 있음. 비임신우를 빨리 가려내 다시 수정 사이클에 올려야 함. 단 임신 90일 이내 초기 배아사·태아사가 6~15% 발생할 수 있어 후속 확인이 필요함.</li>
<li>감정 가능 시기는 직장검사 AI 후 35일 이후(양막낭 촉지는 30~40일부터), 초음파 26일 이후, PAG 검사(혈액·유즙) 수정 후 28일 전후임. AI 후 60일에 재감정하고 쌍태우는 90일에도 추가 감정함.</li>
<li>직장검사 30~40일은 양막낭 촉지와 태막 슬립(자궁각을 끼워 올릴 때 드르륵 미끄러지는 감촉, 40일 이후 권장)임. 태자는 황체 있는 쪽 자궁각에 위치함. 60일 전후는 자궁각·양막낭이 커져 태막 슬립이 주 방법이고 좌우 자궁각 차이로 판정함. 연습은 이 시기 소로 함.</li>
<li>80일 전후는 태반소엽(자궁소구에서 발달)이 울퉁불퉁 만져짐. 90일 이후는 자궁이 복강으로 가라앉아 중자궁동맥 박동·진전음으로 확인함. 임신각 쪽 8~10mm 쏴쏴, 비임신각 5mm로 약함. 6개월 이후는 우측에서 압박하면 태자가 주먹에 부딪히는 타진법(부구법)임.</li>
<li>자궁 내강에 농·점액이 차도 자궁이 부풂. 양쪽 자궁각이 같게 부풀고 태막 슬립이 없으면 임신이 아니라 자궁 질환을 의심함.</li>
<li>초음파(B모드)는 반사 강도를 밝기로 바꿔 보여줌. 액체(난포액·태아액)는 초음파를 흡수해 검게(무에코), 근육·황체는 회색, 뼈·금속은 희게 보임. 그래서 난포는 검은 구체, 황체는 진한 회색~흰색 영역으로 나옴.</li>
<li>스캔은 횡종단면에서 방광 → 자궁경부 → 자궁체 → 자궁각 순으로 보며 프로브를 좌우로 움직여 난소를 확인함. 자궁체 위에서 시작해 자궁각을 따라 프로브를 옮기며 좌우 sweep하고 자궁각 분기부를 지나 난소까지 따라감. 직장 촉진으로 구조물을 먼저 찾는 연습이 선행되어야 함.</li>
<li>난포는 내부 과립세포층·외부 난포막세포층으로 둘러싸인 검은 무에코 원형임. 난모세포는 난구에 의해 난포강에 매달림. 황체는 강한 에코로 하얗고 배란 3~4일부터 커져 12~16일에 최대임. 2~3cm면 성숙(P4 최고)임.</li>
<li>출혈성 황체는 배란 직후~3일에 어둡게 보임. 퇴행기 황체와 둘 다 에코가 낮아 구분이 어려움. 공동성 황체는 내부에 액체 공동이 있고 황체기 전반부에 보이며 점차 닫히는 정상 변이라 황체 낭종과 혼동하면 안 됨.</li>
<li>태아 발육 이정표는 25일경 배아 심박동 확인(없으면 배아 사멸), 30일경 배아포, 35일부터 배아 10mm(30일)에서 20mm로 커져 진단이 쉬워짐, 45일 태반분엽·태아 움직임, 50일 배아포 약 42mm, 56일 배아 약 53mm(갈비뼈 석회화 시작)임.</li>
<li>25~45일 태아 나이는 두–미 길이(mm)+18=일령임. 15mm 33일, 20~25mm 40일, 40mm 50일, 80mm 60일임.</li>
<li>성별 판정은 55~60일부터 생식결절 위치로 함. 고에코 이중엽 구조물이고 수컷은 제대 바로 뒤, 암컷은 꼬리 아래·뒷다리 사이임.</li>
<li>황체가 2개면 50~60% 확률로 쌍태임. 양막강 2개·태아 2마리, 두 요막이 접하는 두꺼운 선(트윈 라인)이 보이면 쌍태 확률이 높음. 60~90일에도 배아 사멸이 단태보다 많아 90일 추가 감정함. 태아막 분리는 사망 징후이고 양막액·요막액의 양과 투명도도 함께 평가함.</li>
<li>이상적 임신감정은 최소 침습적이고 장비·시간 투자가 적으며 즉시 결과로 우방 판단을 돕고 높은 민감도·특이도를 갖춰야 함. 신뢰할 방법은 직장촉진·직장초음파·내분비검사 셋인데 직장촉진이 가장 흔히 쓰이고 가장 많은 기준을 충족함. 정상 해부·생리를 잘 이해하면 임신 30~35일에도 거의 100%에 근접하는 결과를 얻고 임신 단계까지 추정할 수 있음.</li>
<li>검사는 자궁경 식별에서 시작함. 자궁경은 섬유연골성으로 단단해(닭 목 같은 느낌) 기준점이 됨. 비임신·초기 임신엔 골반강·골반 입구에, 경산우·임신 진행 시 더 앞·복측으로 당겨짐. 자궁경을 잡아 자궁체·자궁각을 뒤로 견인하고 복측 자궁각간 인대로 자궁각을 골반 바닥에 눕혀 끝까지 촉진한 뒤 각 끝 너머에서 난소를 만짐. 임신이 진행되면 태아·태수 무게로 견인이 불가능해져 제자리에서 검사함.</li>
<li>임신 4대 주징후 중 막 슬립(융모요막 슬립)은 30~32일부터(숙련 시 후보우 28일) 자궁각을 손가락-엄지로 잡아 들면 막이 미끄러지며 톡 하는 것임. 32일 실, 45일 가는 끈, 60일 양쪽 각 굵은 끈, 75일 털실 느낌이고 90일까지 가장 흔히 씀.</li>
<li>양막낭은 배아를 둘러싼 팽팽한 액체 주머니로 32~35일 직경 6~7mm 매듭, 6주 1.5cm, 7주 3.5~5cm, 8주 6~7cm(팽팽함 소실)임.</li>
<li>태아는 약 55~60일 촉진됨(길이 5~6cm). 액체 속에 떠 있어 부구감이 있음. 3개월이면 복강으로 떨어지고 4~5개월엔 깊이 내려가 촉진이 어려우며 7개월에 다시 접근 가능함.</li>
<li>태반분엽은 75~80일 완두콩 종창, 90일 10센트 동전, 5개월 50센트 크기임. 난소 오인 방지 위해 최소 3개를 식별함. 중기에 태아 도달이 어려우면 확정 진단의 최선임.</li>
<li>확정 진단은 임신했을 때만 존재하는 4대 주징후 식별에 근거하고, 자궁체와 양쪽 자궁각을 완전히 촉진하기 전엔 미임신 진단을 내리지 않음. 보조 징후인 자궁경 견인 불가, 자궁 내 액체·파동감, 자궁각 직경 증가·비대칭, 중자궁동맥 비대·진동음은 임신을 뒷받침하나 단독으론 확정 지표가 아님.</li>
<li>임신 상태 오판은 대개 불완전한 검사·미숙 때문이고 서두름·피로가 악화시킴. 체계적 루틴을 만들고 충분한 시간을 배정함. 4대 주징후 중 하나가 없으면 확정하지 않고 보조 징후로 결정하려는 유혹에 저항함. 보조 징후는 다른 상태로도 생김.</li>
<li>자궁축농증·점액자궁증은 자궁 내 액체·파동감으로 견인이 어렵고 비대칭임. 단 자궁벽이 임신처럼 얇아지지 않아 더 긴장된 느낌임. 기종자궁증(자궁 내 공기)은 비대칭·비대임.</li>
<li>종양은 견인 어려움·비대칭, 중자궁동맥 비대·드물게 진동음임(분만 후 한동안 지속 가능). 자궁은 BLV 유발 종양 호발 부위임. 태아 부위(머리·다리)가 없고 태수에 안 떠 있으며 자궁내막과 밀착함. 미라화·침연 태아는 양수·요수 없이 자궁벽이 잔해 주위로 수축하고 침연 태아는 갈리는 염발음이 남.</li>
<li>비대한 자궁경은 소프트볼 크기·단단해 태아 머리/골반으로 오인됨. 분만 후 자궁은 비대·비대칭이나 벽이 두껍고 주징후가 없으며 표면 주름이 촉진됨. 자궁과 무관한 반추위 등쪽 주머니(태아보다 훨씬 반죽 같은 느낌, 특히 유압식 보정틀), 오른쪽 신장(부구감 비슷하나 더 등쪽), 방광(액체 충만 자궁으로 오인)도 오인됨. 주의·인내로 철저히 검사하면 생식기와 무관함을 판정할 수 있음.</li>
<li>임신 1분기는 태아 발달이 일관돼 며칠 이내로 정확히 단계를 판정할 수 있으나 중기부터·마지막 분기로 갈수록 변동이 커짐(출생체중 25~50kg 이상으로 다양해 추정 정확도 하락). 초기엔 양막낭 크기·막 슬립 정도·자궁각 직경으로, 60일경부터 태아 크기로, 75~80일부터 태반분엽으로, 그리고 자궁동맥 진동음으로 판정함.</li>
<li>30일 양막낭 0.6~0.7cm·임신각에 실·동맥 3~4mm, 40일 양막낭 1.2~1.5cm·가는 끈, 50일 양막낭 3.5~5cm, 60일 양막낭 6~7cm(팽팽함 소실)·태아 체장 5~6cm, 70일 양쪽 각 굵은 끈(태아 생쥐 크기), 80일 태반분엽 완두콩(쥐), 90일 태반분엽 10센트 동전·비단-두정 약 5.5cm임.</li>
<li>120일 태반분엽 5센트~25센트·동측 진동음 6mm(작은 고양이), 150일 태반분엽 50센트·동측 진동음 9mm(큰 고양이), 180일 양측 진동음 10~12mm(비글), 210일 스프링어 스패니얼, 240일 도베르만, 270일 저먼 셰퍼드 크기임. 동측 진동음은 약 4개월, 양측 진동음은 약 6개월임.</li>
<li>BLV 양성우 촉진 후 공용 소매로 음성우를 반복 촉진 시 혈청전환이 입증됨. 소매에 혈액이 묻으면 교체·세척을 신중히 함. BVD PI(지속감염)우 촉진 후 같은 소매로 촉진한 후보우 8/8이 혈청전환·5두 바이러스 분리됐고 소매에 혈액이 없었음. PI 보유 고위험 무리는 추가 예방함.</li>
<li>옛 연구는 45·50일 이전 촉진의 의원성 배아 손실을 시사했으나 최근 연구(막슬립·양막낭 촉진 vs 초음파)는 임신 손실·분만율·신생아 이상에 차이를 못 봤음. 정상 관리 내 일상적 직장촉진은 조기 배아·태아 폐사에 유의하게 기여하지 않을 가능성이 큼.</li>
<li>임신·비임신의 신속·정확한 진단은 수익성이 번식 효율에 좌우되는 낙농에 결정적임. 직장촉진·초음파는 특화 훈련이 필요하고 교배 직후 발정 전에는 진단할 수 없음. 대동물 수의사 부족과 가능한 한 이른 비임신 식별 욕구가 맞물려 생화학 검사가 매력적이 됨. 임신 관련 호르몬이나 임신 특이 분자를 검출하지만 그 자체로는 임신 단계를 정밀히 추정하진 못함.</li>
<li>직장촉진은 숙련 시 수정 후 30~35일, 초음파는 25일(최대 민감도 후보우 26일·경산우 29일, 그래서 표준으로 쓰임)에 진단 가능하나 둘 다 다음 예상 발정 전 비임신 진단은 못 함. 이상적 검사는 수정 후 짧은 시간에 정확히, 비침습·저비용·우방에서 되는 사람의 hCG 임신검사 같은 것임. 그러나 소는 hCG 같은 분자를 안 만들어 대신 P4·PAG·EPF·ISG를 봄.</li>
<li>P4·PAG·EPF·ISG 분석은 임신 식별보다 비임신 검출에 더 정확함(특이도 90% 초과, 민감도는 다소 낮음). 공태로 잘못 식별된 암컷은 흔히 프로스타글란딘을 받는데 임신 암컷에 유산을 유발함(미국 젖소 임신 손실 평균 $555). 또 자연 임신 손실이 교란 요인임. 수정률은 90% 넘게 높으나 배아·태아 사망이 주 손실원이고, 최초 검사 후 확인 검사 전 손실이 위양성으로 잘못 표시돼 자료를 왜곡함.</li>
<li>P4 검사는 임신이면 황체가 P4를 계속 생성해 다음 예상 발정 시점에도 상승 유지되고 공태면 황체 퇴행으로 기저로 감소하는 것을 봄. 보통 교배 후 21~24일에 유·혈청을 RIA/ELISA로 분석함. 수정 후 21일 혈중 P4 1ng/ml 미만이면 임신일 수 없어 비임신 검출 95~100%이나, 발정 주기 길이의 개체 변동 때문에 임신 양성 진단 신뢰도는 68~97%임. 단일 시료로 신뢰하려면 교배·수정일을 알아야 함.</li>
<li>PAG는 반추가축 영양막이 모체 인식의 일부로 방출하는 단백(아스파르트산 펩티드분해효소)임. 처음 발견된 것이 임신 특이 단백 B(PSPB)로 착상 무렵 영양막 이핵세포가 생성하고 착상부터 임신 내내 모체 순환에서 검출되며 분만 후까지 지속됨. 공태·미경산 후보우 혈청엔 없어 임신 특이적이고 hCG와 달리 소변엔 안 나옴. 수정 후 24일이면 RIA로 검출되고(1986 Sasser) 수정일이 필요 없는 게 P4 대비 이점임.</li>
<li>상용 ELISA는 BioPRYN, IDEXX 소 임신 분석, DG29임. 소·후보우 모두 수정 후 28일부터 쓰고 직장초음파만큼 정확하다고 광고함. 시료(혈액·우유)를 실험실에 보내 당일 결과 또는 농장 30분 키트임. 초음파 동시 검증 시 임신 검출 정확도 89~100%임.</li>
<li>PAG 단점은 긴 반감기로 PSPB가 분만 후 80~100일까지 검출돼 분만 후 초기 교배우에서 주의해야 하고, 임신 손실 후 위양성이 가능하며, 교배 후 첫 발정 전 비임신 진단은 못 한다는 것임.</li>
<li>EPF(조기 임신 인자)는 성공 수정 후 24~48시간에 처음 검출되는 면역억제 호르몬으로 항원적으로 이질적인 임신체를 모체 거부에서 보호함. 배반포에 이른 생존 임신체만 생성하고 임신체 사망·제거 후 빠르게 소실되며 PAG와 달리 분만 후엔 검출된 적 없음. 임신 판정과 배아 사망 인지에 잠재적으로 매우 유용하나 조기 배아 폐사 빈도가 높아 양성 암컷은 후일 재검해야 함. 유일한 신뢰 검사는 로제트 억제 검사(RIT)인데 시간이 많이 들고 유지가 어려워 농장 정기 사용엔 비실용적임. 과거 ECF 측방유동 검사가 있었으나 특이도 38~51%로 공태 식별이 부정확해 단종됨.</li>
<li>소 모체 임신 인식의 주역 IFN-τ는 영양외배엽이 분비해 자궁내막에 작용하고 PGF2α pulse를 억제해 황체용해를 막음. 단 모체 말초에 농도가 너무 낮아 직접 검사가 불가함. 대신 IFN-τ가 모체 백혈구에서 상향조절하는 ISG(Mx1·Mx2·ISG15)를 봄. ISG15 mRNA는 수태 후 약 14일 발현, 17~18일 정점, 21~26일 감소임. 비임신(특히 후보우) 식별에 유망하나 단일 채혈(18일) 비임신 검출 89%이고 최대 정확도엔 연속 검사가 필요하며, 실시간 PCR이 필요해 소비자 검사가 없고 바이러스 감염 시 ISG가 활성화돼 위양성이 가능함.</li>
<li>떠오르는 바이오마커 중 순환 핵산(무세포 DNA/RNA)은 소 태아 DNA의 경태반 누출이 입증됨. 임신 30일 이후 성별 판정이 정확하고(수컷 100%·암컷 91%) 임신 20일 임신/공태 간 조성 차이가 발견돼 교배 후 20일 식별 가능성이 있음. 마이크로RNA는 유전자 발현에 관여하는 짧은 비암호화 RNA로 거의 모든 체액에 있어 최소 침습 채취에 이상적임. 임신 고유 miRNA 식별 중이고 추가 연구가 필요함.</li>
<li>생화학 검사 비교는 P4(RIA/ELISA/LA, 생산자용 있음, 유효 21~285일, 교배일 알아야 신뢰), PAG(RIA/ELISA, 생산자용 있음, 28~285일, 긴 반감기로 분만 후 90일 이전 교배우 왜곡), EPF(RIT, 생산자용 없음, 2~140일), ISG15(RT-PCR, 생산자용 없음, 14~26일, 신뢰 생산자 검사 없음·바이러스 감염 위양성)임. 현재 EPF·ISG15만 수정 후 첫 발정 전 개입을 가능케 하나 RIT·실시간 PCR이 필요해 실용성이 제한됨.</li>
<li>태아 프로그래밍을 한 줄로 요약하면 태아기에 어미가 겪은 환경이 그 새끼의 평생 표현형을 바꿔놓고 그 효과는 출생 후 아무리 잘 관리해도 되돌리기 어렵다는 것임. 같은 유전형이라도 노출이 배아·태아·송아지 중 언제 일어났느냐로 영향이 크게 달라지며 발달 가소성이 가장 높은 태아기가 제일 취약함.</li>
<li>저체중 송아지는 이환·폐사 위험이 높고 성장이 느리며 지방은 많고 근육은 적은 나쁜 체성분에 대사·번식 기능까지 떨어짐. 다만 출생체중이 멀쩡해도 프로그래밍 효과가 숨어 있다 나중에 드러날 수 있음.</li>
<li>소는 양과 다름. 양은 태반이 임신 첫 2/3에 다 자라고 태아 성장의 90%가 마지막 1/3에 몰리지만, 소 태반은 임신 내내 계속 커지되 태아가 태반보다 훨씬 빨리 자람. 그래서 양 연구를 소에 그대로 적용하면 안 됨.</li>
<li>총 근섬유 수는 소에서 임신 180일에 확정되고 그 뒤로는 새 근섬유가 생기지 않음. 출생 후 성장은 전부 기존 근섬유가 굵고 길어지는 것뿐임. 그러니 수율 좋은 도체를 원하면 출생 후가 아니라 자궁 안에서 승부가 남.</li>
<li>자궁에서 영양이 부족하면 대사 성향이 지질 저장 쪽으로 굳어 나중에 잘 먹여도 따라잡기 성장의 상당 부분이 근육이 아니라 지방으로 감.</li>
<li>분만 전 100일 굶기면 송아지 출생체중 7% 감소, 폐사율 10% 증가임. 단 태아 체중당 혈류 효율은 오히려 좋아지는 보상이 있음. 임신 첫 1/3 제한은 딸의 동난포 수(AFC)를 60% 낮게 만들어 딸의 평생 가임성에 영향을 줌. 임신 후기 단백 보충은 딸이 14일 일찍 사춘기에 도달함.</li>
<li>임신 후반 어미에게 멜라토닌을 보충하면 자궁동맥 혈류가 늘고 출생체중은 그대로인데 이유 체중이 늚(육우 57파운드). 태아 근육에서 위성세포 활성·근생성이 오르고 지방 생성은 줄어 강화된 근육 성향이 이유까지 이어짐. 진짜 태아 프로그래밍 효과임.</li>
<li class="grp">Mann은 AI 후 5~9일 CIDR(Early)과 12~16일 CIDR(Late)을 비교해 16일째 배아 크기·IFN-τ가 Early군만 유의하게 높고 Late군은 대조와 차이가 없음을 보였음. Forde는 미경산 육우에서 주기 3~4일 PGF2α로 혈중 P4를 대조군보다 1.0~1.5ng/ml 낮게 유지하면 7일 ET 후 14일 배아가 길이·폭·면적 모두 작아짐을 보였음. 발정 0~3일 PRID 처치군은 자궁내막에서 지방 합성(DGAT2)·당 대사(MSTN) 유전자 발현이 높아 신장 배아 발육기의 자궁유 성분이 풍부해짐.</li>
<li>Lopez-Gatius는 36~42일 임신(+) 소에 PRID(E2 제거) 28일 유치로 배사멸률을 유의하게 낮췄음. 경산 유우 143두(고온기 70, 한랭기 73)에서 29일 수태율은 34% vs 33%로 차이가 없었고, 불수태우는 계절 무관 P4가 낮고 22일에 저점이었음. 배사멸우는 한랭기엔 15·29일, 고온기엔 29일 P4가 임신우보다 낮았음. 수정 후 30일 이내 조기 임신감정 때 P4가 배사멸을 예측할 가능성이 있음.</li>
<li class="grp">임신 중에도 3~4개월까지 우성 난포가 크게 자라 임신 발정이 약 10%(대부분 3개월 이내), ST까지 보이는 소가 3~7%임. 임신(+)우에 발정 징후·수정 의뢰가 오면 자궁까지 확인함. 임신 중 수정하면 50%가 유산함.</li>
<li>기관 형성이 끝나는 수정 후 42~45일까지를 배아, 이후를 태자라 부름.</li>
<li class="grp">배아기는 1~42일(기관 형성 완료, 임신 손실 최대 시기), 태아기는 42~280일임. 수태 후 분만까지 평균 282.5±18일. 분만 후 83일에 임신하면 282일을 더해 분만 간격 365일이고 이상적으로 분만 후 110일 이전 임신임. 건유 60일이면 비유 305일임.</li>
<li>IFN-τ 분비는 15~17일 최고이고 임신 28일까지 지속됨. IFN-τ에 대한 내막 반응 부족(PGF2α/PGE2 불균형)이 임신 실패의 주요 원인임. 자궁 내 E2·PGE2 주입은 황체 수명을 5~6일 늘림. PGE2는 LH처럼 황체세포 P4·cAMP를 직접 자극하고(황체영양) 임신각 혈류 증가가 PG 운반 방향을 바꿀 수 있음.</li>
<li>P4 0.5ng/ml 미만 소는 4.0ng/ml 넘는 휴지기 소보다 자궁근 수축성이 높음. 수태 후 저P4 소는 내막 영양소 수송체가 줄고 P4 수용체가 지속되며, 고P4는 수송체가 늘고 P4 수용체가 하향 조절됨(부착 수용성 확립에 필요). 요막은 21~25일에 두 자궁각으로 퍼지지만 융모막과의 융합은 60~70일까지 불완전하고 21일 배아 길이와 요막 너비는 강한 상관임.</li>
<li>임신 손실. 조기 배아 사망(17일 이전)+수정 실패가 손실의 20.5~43.6%, 후기 배아 사망(17~42일)은 젖소 12.8%·육우 약 6.5%이고 고생산 젖소는 수정~만삭 손실이 60%에 근접할 수 있음. 후기 배아 손실 보고치는 30일→260일 3.6%, 28~30일→40~54일 16%, 30일→80일 4.2%, 28일→98일 20.2%, 28일→84일 7.2%임.</li>
<li>자궁 혈류. 1분기 자궁동맥 직경은 일정하되 저항지수가 줄고, 2분기 1~2L/분→4~5L/분, 중기→후기 3~4배, 137→250일 동측 혈류 4.5배 증가임. 무거운 송아지 밴 소는 175일 자궁동맥 혈류가 많고 중기 영양 제한은 혈류·태아 성장을 줄임. 혈액량은 소에서 10~20%만 늘고(다태종 30~50%) 1회 박출량 최대 30~35% 증가가 심박출량 증가의 주역임. 심혈관 기능은 분만 후 2~5주 내 비임신 수준으로 돌아옴.</li>
<li>태반 락토겐은 160~200일 정점 후 만기까지 유지되고 젖소가 육우보다 높으며 이후 유생산과 양의 상관임. 에스트로겐은 70~110일 늘고 총 에스트로겐이 육우 출생체중·이유 전 성장률과 상관임. 마지막 2개월 태아의 포도당·아미노산 요구는 하루 약 5kg 유즙 상당임. 태아 성장은 70~100일 약 10g/일, 200~250일 200~300g/일, 만기 직전 100g/일로 줄어듦. 총 양수량은 태아 체중과 양의 상관이고 요막액은 무상관임.</li>
<li>성 분화. 원시생식세포는 23~25일 중장·후장에 있다가 27~31일 생식선에 정착함. 암컷은 AMH가 없어 뮐러관(난관·자궁·질)이 발달하고 테스토스테론이 없어 볼프관이 퇴행함. 프리마틴 기전의 배경임.</li>
<li>태반 효율은 출생체중÷태반 무게이고 자궁·제대 혈류가 가장 중요한 지표임. 침해 시기가 결과를 정함. 60~120일과 180~240일의 영양 결핍·열스트레스는 다른 효과를 냄. 50~180일 에너지 60% 제한은 180일 자궁 혈류·태아 체중을 줄이되 체중당 혈류 효율은 높이고 송아지 흉위가 늘어남(후기 과보상). 가축은 생애의 30~40%를 태반 영양으로 보내고, 분만 전 100일 제한 시 출생~이유 사이 설사로 추가 20%가 폐사함.</li>
<li>임신 후기 식이 멜라토닌 보충<span class="hang">임신 190~262일에 멜라토닌 20 mg/일을 보충한 홀스타인 미경산우: 자궁동맥 혈류 증가, 출생체중 차이 없음, 9주령 송아지 체중 증가.</span><span class="hang">육우 임신 마지막 1/3에 보충: 자궁동맥 혈류 증가, 이유 체중 57 lb(약 26 kg) 증가. 태아 근육 발달 관련 유전자(AMPK, PAX7, MyoD, IGF1·IGF2) 발현 증가, 신장주위 지방의 지방생성 유전자 발현 감소.</span></li>
</ol></div>

<div class="modal-sub" style="margin:22px 0 6px;">배사멸 (일본송아지 1-2 수태와 배사멸)</div><div class="rb-block">
<p class="rb-p">수정으로 싹튼 새 생명은 송아지로 모체 밖에 나오기까지 280~290일 전후를 모체 안에서 보낸다. 건강한 송아지를 기르는 첫걸음은 건강한 모체, 건강한 배, 건강한 태아를 기르는 것이다. 그러나 실제로는 많은 생명이 배사멸이라는 형태로 사라지고 있다. 그 현황과 원인을 알아 예방으로 이어가면 더 많은 송아지를 얻을 수 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">수정 후부터 착상·태막 형성까지</div>
<p class="rb-p">수정이 끝난 직후부터 접합자는 배가 되어 난관 안에서 난할을 반복한다. 배란 후 4~5일의 8~16세포기에 자궁으로 들어가고, 배란 후 7일에 배반포가 되며, 9일 전후에 투명대를 벗어나(해칭) 급속히 발육한다. 초기배는 상실배 이후 단계보다 더위에 대한 감수성이 높다. 그래서 최근 젖소의 여름철 수태율 대책으로 AI 대신 수정란이식(ET)을 적극 써서 번식성적을 올린 사례가 보고된다.</p>
<p class="rb-p">소의 착상은 배가 자궁에 접착하면서 시작된다. 배의 부동화와 신장은 교배 후 15~20일에 일어나며, 이때 전장 20cm 이상으로 늘어나 끈 모양이 된다. 모체 쪽과 태아 쪽 세포가 마주보고 작은 융모가 끼워 들어가는 것이 교배 후 20~22일, 착상 완료가 교배 후 35일경이다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">모체의 임신 인식</div>
<p class="rb-p">비임신 발정주기에서는 난포에서 나오는 E₂가 자궁내막의 E₂ 수용체와 결합해 옥시토신 수용체 발현을 유도한다. 황체에서 나오는 옥시토신은 자궁내막의 PGF₂α 합성을 자극한다. PGF₂α 생산은 발정주기의 특정 시기에 자궁내막 세포에 발현하는 옥시토신 수용체의 수에 달려 있다. 자궁내막에 옥시토신 수용체가 충분하면 황체의 옥시토신에 반응해 펄스 모양의 PGF₂α가 나와 황체가 퇴행한다. 따라서 교배 후 임신이 지속되려면 이 기전이 작동하지 않아야 한다.</p>
<p class="rb-p">모자 간 소통은 출생 후에만이 아니라 임신 극초기부터 시작된다. 모체의 임신 인식은 교배 후 16~19일에 일어난다. 착상 전의 배는 자기 존재를 알리기 위해 여러 단백질을 신호로 분비하고, 모체는 이 신호를 받아 임신을 인식하고 황체를 유지한다. 자궁강에 떠 있는 배반포가 내는 신호의 하나가 사이토카인이고, 반추류에서 중요한 것이 인터페론-τ(IFN-τ)다. I형 인터페론의 하나로, "타우"는 분비원인 영양막세포(Trophoblast)의 T에서 왔다. 수태산물에서 나온 IFN-τ는 자궁내막의 옥시토신 수용체 발현을 억제해 황체퇴행 인자인 PGF₂α 생산을 억제한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태막·태반 형성과 기능</div>
<p class="rb-p">태막은 양막과 요막융모막으로 이뤄진다. 반추류는 다태반(궁부성 태반)으로, 궁부(융모총)가 자궁소구와 함께 혈관·결합조직이 풍부한 태반절을 만든다.</p>
<p class="rb-p">요막융모막이 임신각과 비임신각 전면으로 퍼지는 시기가 교배 후 35일경이다. 40일경까지 태반절이 뚜렷해지고, 요막융모막의 혈관 형성은 교배 후 40~60일에 일어난다. 태반절을 통해 모체와 태아 사이의 영양·배설물 교환이 이뤄진다. 태반절은 임신이 지나며 현저히 발달해 임신 말기에는 직경 5~6cm에 이른다.</p>
<p class="rb-p">태반은 영양 공급과 대사산물 배설 외에, 난소기능 조절, 임신 유지, 태아 발육, 유선 발달, 분만 준비에 관여하는 중요한 내분비기관이다.</p>
<p class="rb-p">자궁내막 증식 작용이 있는 P₄는 배 발육에 꼭 필요한 호르몬이다. 임신기간 내내 황체에서 분비되지만 임신 7개월 이후는 태반에서도 분비된다. 그러나 임신 8개월까지는 임신 유지와 건전한 태아 발육에 황체가 꼭 필요하다. 에스트로젠도 태반에서 나오는 주요 호르몬으로 특히 임신 말기에 중요하다. 태반은 스테로이드 외에 태반성 락토젠이라는 폴리펩타이드 호르몬도 분비하며, 이는 태아 성장 촉진과 유선 자극 작용을 한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">배사멸</div>
<p class="rb-p">소의 배사멸은 보통 임신 42일 미만에 일어나는 배의 사멸로 정의하고, 42일 이후의 임신 중단은 태아 사망, 즉 유산으로 구별한다. 임신 16일까지의 배사멸을 조기 배사멸이라 부르고 그 뒤의 후기 배사멸과 나누기도 한다. AI 후 16~19일은 IFN-τ 분비가 최고가 되는 시기로 배에게 생존이 걸린 중요한 시기다. AI 후 15일 이전에 배가 죽으면 AI 후 21일 전후에 재발정이 오므로 농가는 일시적으로나마 수태했던 사실을 모르고 "불수태"로 인식한다. AI 후 16일 이후에 죽으면 재발정은 21일보다 늦어진다.</p>
<p class="rb-p">배사멸은 분만 전후 사고, 난산 폐사, 신생아기·이유기 설사·폐렴처럼 눈에 보이지 않아 손실 크기가 인식되지 않지만, 실제 발생률은 신생아기 사망률보다 배사멸률이 훨씬 높다. 특히 젖소는 모체의 임신 인식·태막 형성 시기의 배사멸이 송아지 손실의 큰 부분을 차지한다.</p>
<p class="rb-p">건강한 발정우에 정상 정액으로 적기에 AI하면 수정률은 85% 이상이다. 그런데 고비유우는 1회 AI로 분만까지 가는 비율이 30% 이하라는 보고가 있다. 이 차이가 임신 손실, 즉 배사멸과 유산이다. 실제로 비유우 수태율 저하의 가장 큰 요인 중 하나가 배사멸이고, 배사멸률은 40% 이상으로 보고된다. 수정 후 8~16일의 사멸이 많다고 본다(수정 후 0일 100% → 8일 93% → 16일 66% → 42일 58%). 배의 25%가 임신 21일까지 죽는다. 정시 AI 후 28일에 초음파로 임신 진단된 개체 중 약 1할은 그 뒤 2주 안에 죽고, 다른 약 1할은 100일까지 유산했다는 보고가 있다. 다른 보고에서는 임신 25~45일에 6.5%, 45~65일에 1.5%의 임신 손실이 있었다.</p>
<p class="rb-p">배사멸 원인은 P₄ 분비 이상, 모체의 임신 인식 이상, 더위 스트레스, 영양 문제, 인위적 요인, 기타로 나눠 기술한다. 감염증에 의한 배사멸·유산은 따로 다룬다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">P₄ 분비 이상</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">배란 전의 분비 이상</p>
<p class="rb-p">퇴행 전 황체의 P₄와 이어지는 발정기의 E₂는 발정 후 건강한 난자를 배란시키는 데 빠질 수 없다. 발정 전에 P₄가 없거나, 발정 전~발정기의 E₂ 분비가 부족하면 자궁내막 간질의 P₄ 수용체가 줄어 교배 후 4~9일에 과잉 PGF₂α가 나와 배에 악영향을 준다.</p>
<p class="rb-p">교배 전 주기의 황체기에 P₄가 낮게 지속되면 LH 펄스 빈도가 늘어난다. 그 결과 우성난포가 정상보다 오래 살아 자라다 배란하므로 난자가 노화한다. 즉 난자가 배란까지 난포 안의 고농도 E₂에 더 오래 노출된다. 이것이 배 품질을 떨어뜨리고 배사멸률을 올린다. 이때 배는 보통 16세포기 이전에 죽는다고 본다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">배란 후의 분비 이상</p>
<p class="rb-p">혈중 고P₄ 상태는 모체의 임신 인식 시기까지가 특히 중요하다. 배란 후 황체는 약 4일부터 P₄를 활발히 분비한다. 수태율이 낮은 소나 리피트브리더는 정상우보다 발정 후 6일간의 혈중 P₄ 상승이 늦거나 낮게 간다. AI 후 조기에 P₄ 제제를 주면 수태율이 오른다는 보고가 있다. 조기 배사멸 원인의 적어도 일부는 임신 초기 P₄ 부족, 또는 자궁 P₄ 수용체 감수성 저하(정상보다 많은 P₄가 필요한 상태)로 추정된다.</p>
<p class="rb-p">배란 난포가 작을수록 황체도 작고 P₄도 적다. 우성난포 직경 12mm 이하에서 배란 유기한 개체는 13mm 이상보다 교배 후 P₄ 상승이 늦고 수태율도 낮다. 기능성 황체가 순조롭게 형성되려면 정상 LH 분비가 필요하다.</p>
<p class="rb-p">※ 리피트브리더: 발정주기가 정상이고 난소·부생식기에 임상적 이상이 없는데도 소는 3회 이상, 돼지는 2회 이상 수정·교배해도 수태하지 않는 개체.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">P₄ 대사속도(배출률) 증가</p>
<p class="rb-p">말초혈 P₄가 낮은 것은 황체 분비 감소 외에 분비된 P₄의 대사가 빨라진 경우도 있다. 고비유우는 저비유우보다 혈중 P₄가 낮은데, 원인 중 하나가 간의 스테로이드 대사속도가 높은 것이다. 비유우에서 간 혈류량과 P₄ 대사율은 급이 후 2시간에 최대가 되고, 급이량이 많은 개체일수록 최대 대사율이 오래 간다. 이것이 고비유우 수태율이 낮은(배사멸이 많은) 이유 중 하나다. 건유우도 사료 섭취량이 많을수록 혈중 P₄가 낮다.</p>
<p class="rb-p">그래서 배사멸 예방으로 AI 후 황체기의 P₄를 높이는 방법이 검토된다. P₄ 제제를 직접 주는 것 외에 AI 후 5일에 hCG 또는 GnRH를 주는 방법도 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">모체의 임신 인식 이상</div>
<p class="rb-p">수정 후 15~17일의 말초혈 P₄가 높은 소의 배는 크고 IFN-τ 생산도 많다. PGF₂α 생산을 억제하려면 신장배가 황체 쪽 자궁각 거의 전역을 차지해야 한다. 그런데 이 시기 자궁 안 배를 관찰한 연구에서 길이는 15~250mm로 제각각이었다. 배가 있어도 충분한 크기가 아니면 황체퇴행이 진행돼 배가 죽는다는 뜻이다. 또 말초혈 P₄가 낮으면 자궁내막 유전자 발현이 최적이 되지 않고, 수태산물의 신장도 충분치 않게 된다. 그러면 IFN-τ 생산도 떨어지고 임신 인식이 제대로 작동하지 않아 수태성이 떨어진다.</p>
<p class="rb-p">배가 모체에 신호를 못 보내거나 모체가 못 받으면 황체가 퇴행해 임신이 끊긴다. 배가 항황체퇴행 신호를 제대로 보내지 않으면 자궁내막은 PGF₂α를 분비해 황체를 퇴행시키는 프로그램으로 간다. 따라서 PGF₂α 생산을 억제할 수 있으면 임신 유지 가능성이 커진다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">더위 스트레스</div>
<p class="rb-p">여름철 더위가 수태율을 떨어뜨리고 조기 배사멸을 일으키는 것은 예전부터 알려졌고, 온난화로 앞으로 더 중요한 과제가 된다.</p>
<p class="rb-p">더위의 영향은 배란 전 난자·난포막세포만이 아니라 초기배 발육, 황체 기능, 자궁내막, 뇌하수체 전엽까지 미친다. 더위가 만성화되면 P₄ 생산이 억제된다. 더위에서 소는 열을 내보내려 에너지를 쓰므로 유지 에너지가 더 필요한데 식욕 저하로 섭취는 줄어, 에너지 대부분이 모체 유지에 쓰이고 번식용 에너지가 부족해진다.</p>
<p class="rb-p">온도와 함께 중요한 것이 습도다. 습도가 오르면 체표 증산이 줄어 열 방산이 더 어렵다. 지표로 평균 온습도지수(Mean THI)와 최고 온습도지수(Max THI)를 쓴다.</p>
<p class="rb-p">Max THI = 0.8×최고온도 + 0.01×상대습도(%)×(최고온도 − 14.4) + 46.4</p>
<p class="rb-p">Max THI가 오를수록 임신 21~30일의 배사멸률도 올랐다(Max THI 55 미만 약 0%, 55~59 약 1.5%, 60~64 약 3%, 65~69 약 9%, 69 초과 약 13%). 우사 온습도를 매일 정해진 시각에 기록하면 불쾌지수를 추정해 대책을 세울 수 있다. 여름철 수태율을 올리려면 선풍기·자연풍, 미스트 살포, 우사 구조 재검토로 우체를 효과적으로 식혀야 한다. 환기로 공기 흐름을 만들어 증산을 돕는다.</p>
<p class="rb-p">더위가 배에 직접 미치는 영향으로 배의 열 감수성이 있다. 특히 배란일과 다음 날의 수정란·초기배(1·2세포기)는 열충격단백질이 없어 더위 영향을 받기 쉽다. 이 시기의 소를 충분히 시원한 곳에 두거나 우체를 냉각하는 것이 배사멸 예방에 유효하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">영양 문제</div>
<p class="rb-p">제1위 분해성 단백질이 많은 사료를 분만 후 9주 급여하면 보통 급여보다 난포 발육이 쇠퇴하고 분만 후 첫 배란이 늦어지며(25.2일 vs 38.6일), 황체 형성이 둔해지고 P₄가 낮아진다. 고단백 사료 소는 BUN이 높고 첫 AI 수태율이 낮다(31% vs 48%). 과잉 분해성 단백질은 혈중 암모니아를 올린다. 수정 직후 사료의 에너지가 적으면 고BUN을 초래해 P₄ 저하와 자궁 환경 변화로 조기 배사멸을 부른다. 또 난포는 1차 난포에서 배란까지 수십 일이 걸리는데, 초기 단계에서 모체가 에너지 부족이면 그 영향이 성숙 난포 단계까지 미쳐 배란해도 질 나쁜 난자가 될 수 있다. 그래서 건유기 사양관리, 특히 에너지 균형이 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">인위적 요인</div>
<p class="rb-p">조기 임신진단 직장검사가 배 생존에 영향을 주는지는 오래 논의됐다. 결론이 안 나는 이유 중 하나는 대조군 설정이 어렵기 때문이다. 그러나 초음파 덕에 객관적 검토가 가능해졌다.</p>
<p class="rb-p">AI 후 29~32일에 초음파로 임신 확인한 젖소 520두를, 숙련자 한 사람이 임신 34~41일에 직장검사하는 군(258두)과 안 하는 군(262두)으로 무작위로 나눈 시험이 있다. 직장검사는 임신각에서 양막낭을 피한 태막 슬립법을 썼다. 두 군 다 AI 후 45일·60일에 초음파로 태아 생사를 확인했다. 결과, 두 군 사이에 배사멸(태아사) 발생률 차이가 없었다. 즉 임신 초기 태막 슬립법은 임신각이라도 양막낭을 피하면 안전하다. 그러나 2만 두 가까이 모니터링한 다른 보고에서는 임신 28~35일이나 43일 이후 직장검사보다 임신 35~42일 사이 직장검사에서 배사멸률이 유의하게 높았다. 양막 촉진이나 태막 슬립을 잘못하면 배사멸 위험이 높아진다는 것은 인식해야 한다.</p>
<p class="rb-p">앞의 보고에서는 합계 14%에서 배사멸(태아사)이 확인됐는데, 태아사(4.5%)보다 배사멸(10%)이 많았다. 미경산우(8.8%)보다 경산우(16.4%)가, 단태(12.9%)보다 쌍태(25.5%)가 많았다. 쌍태 임신 비유우 연구에서는 211두 중 51두(24.2%)가 임신 90일까지 유산했다. 좌우 자궁각에 1두씩이면 유산 7두, 한쪽 자궁각에 2두면 44두로 유의하게 높았다. 13두(6.2%)는 쌍태 중 1두가 도중에 죽고 1두만 분만됐다.</p>
<p class="rb-p">쌍태 발생률은 유량과 산차가 올라갈수록 증가한다(젖소 산차별 쌍태율: 1산 약 1%, 2산 이후 3~7%).</p>
<div class="modal-sub" style="margin:14px 0 6px;">기타: 난자·난포·배 발육을 저해하는 요인</div>
<p class="rb-p">AI가 적기에·적절히 되지 않으면 수정 장애로 수태가 안 되는 한편 수정은 되는 경우도 있다. 그러나 난자·정자 노화, 수정능 저하로 유전자·염색체 이상, 난할 이상으로 배가 죽을 확률이 높아진다. 수정 후 8~10일은 배반포가 해칭하는 시기인데, 해칭에 관여하는 배 자신의 물리적 작용이나 효소가 정상 작동하지 않으면 해칭 못 하고 죽는다. 소 ET에서 투명대에 작은 흠집을 내 해칭을 돕는 어시스티드 해칭으로 동결융해 후 생존성과 수태율이 좋아진다는 보고가 있다.</p>
<p class="rb-p">그 밖에 어미소의 급속한 BCS 저하, 발열, 중증 파행, 태반정체, 대사병, 유방염 등도 정상 난자·난포 발육이나 배반포 발육을 저해한다.</p>
<p class="rb-p">번식성적 향상이 송아지 생산 증가로 이어지지만, 무사히 임신을 거쳐 분만하지 못하면 생산자의 이익이 안 된다. 수태율·분만율 저하의 한 원인으로서 배사멸의 중요성을 인식해야 한다. 생산자, 인공수정사, 수의사, 영양 컨설턴트, 행정기관이 연계해 배사멸 위험을 줄이는 노력을 계속해야 한다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 1-2 수태와 배사멸, 大澤健司. 원문 그대로 번역, 정리 전.</span></p>

<div class="modal-sub" style="margin:22px 0 6px;">태아의 생리 (일본송아지 1-3)</div><div class="rb-block">
<div class="modal-sub" style="margin:14px 0 6px;">임신기 발육의 특징</div>
<p class="rb-p">태아 발육을 이해할 때 임신기를 3기로 나눈다. 제1기는 수정 후 세포 수가 늘어나는 시기로, 각 기관의 세포 수 증가가 주체이고 세포비대는 적다. 첫 삼분기(3개월령까지)에 해당한다. 제2기는 세포 수 증가에서 세포비대로 넘어가는 이행기로 둘이 함께 간다(4~6개월령). 제3기는 세포비대가 주체인 시기다(7~9개월령). 체중 증가는 S자 곡선을 그리며 마지막 삼분기에 두 배가 되는데, 이는 세포비대에 의한 증가다.</p>
<p class="rb-p">태아 발육에 관련된 병인 인자는 유전·환경·영양 셋이다. 해부학적으로 보면 유전 인자는 태아에만, 환경 인자는 태아·태반-제대·모체 셋 모두에, 영양 인자는 모체에만 관계한다. 유전 인자 질병은 유전자 검사로 수정 전에 예방할 수 있는 것도 있다. 환경 인자 질병은 모체의 감염증(바이러스·세균), 유해물질(중독식물·마이코톡신·엔도톡신), 최기형성 강한 약제, 스트레스(더위·질환)를 피하면 예방할 수 있다. 환경 인자의 영향을 가장 받기 쉬운 시기는 첫 삼분기, 기관 형성이 이뤄지는 시기다. 이 시기에 치료가 필요하면 최기형성이 적은 제제를 골라야 한다. 영양 인자 부족 질병도 충분히 예방 가능하다. 임신기에 주는 보충제는 영향과 효과를 충분히 따져 줘야 한다. 특히 요오드는 태아 갑상선에 특이적으로 흡수돼 장기간 기능저하를 일으키므로 임신우에는 금기다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태반의 발달과 생리</div>
<p class="rb-p">소 배의 착상 시기는 수정 후 17~35일이고, 착상은 수정과 함께 배 소실이 가장 잘 일어나는 단계다. 수태율 40%일 때 수정 시와 착상 시의 배사멸률은 각각 약 25%다. 혈중 P₄는 8~10일간 작용하면 자궁내막의 P₄ 수용체를 줄이는 작용이 있다(다운레귤레이션). 이 현상으로 내막상피를 덮고 있는 뮤신 1이 줄어 배영양막과 자궁내막의 결합이 가능해진다. 소 수태율에 영향이 큰 인자가 수정 후 5~6일경의 P₄ 농도다. 예를 들어 배 이식 전날(6일) 혈중 P₄가 1.5ng/mL 이하면 수태율 25%, 1.5~2.5면 43.8%, 2.5~3.5면 54.8%, 3.5 이상이면 78.6%로 P₄와 수태율에 높은 상관이 보고돼 있다. 즉 황체 초기 P₄ 분비가 낮으면 P₄ 수용체의 정상 다운레귤레이션이 안 일어나 배와 자궁내막의 응답이나 배 신장에 지장이 생긴다고 본다. 그 증거로 자궁 내 IFN-τ 농도(임신 16일)와 수정 4~5일 혈중 P₄가 높은 상관을 보인다. 임신 인식 물질인 IFN-τ가 배에서 충분히 안 나오면 황체퇴행 임계기에 PGF₂α 방출을 충분히 억제하지 못해 임신을 유지할 수 없다. 배에서 IFN-τ를 충분히 만들게 하려면 임신 초기 발육 황체의 성장이 큰 열쇠이므로, 분만 후 되도록 이른 시기에 인슐린·IGF-1 같은 대사 호르몬을 억제하는 음의 에너지 균형을 풀어야 한다.</p>
<p class="rb-p">소 자궁내막의 P₄ 수용체는 황체 쪽 자궁각에 많아 대부분의 배는 배란 쪽에 착상하고, 태막은 급속히 비임신각까지 간다. 그 뒤 배영양막은 궁부(융모총) 부위의 자궁내막 상피를 녹여 결합조직까지 들어간다. 궁부가 없는 영역에는 자궁선이 많아 태반 형성 후에도 조직영양소인 자궁유의 공급원으로 임신기간 내내 작용한다.</p>
<p class="rb-p">태반은 태아에게 호흡기·순환기·소화기·비뇨기·내분비기 등 여러 역할을 한다. 따라서 성장에 맞는 태반 크기와 기능이 따라오지 않으면 태아 발육불량이나 배·태아 사망이 생긴다. 화우 배를 젖소에 이식하면 분만 후 젖소의 비유량이 주는 것이 알려져 있는데, 태반 크기가 분만 후 유량에 영향을 준 결과로 본다.</p>
<p class="rb-p">임신기 P₄의 작용은 자궁내막 분화(착상성 증식), 자궁근 수축 억제, 자궁경관 폐쇄, 임신자궁의 국소 면역관용 등이다. 에스트로겐의 작용은 영양막 분화, 태반 스테로이드 생산의 자기조절, 모체 심혈관계와 자궁-태반 혈류 조절, 유선 발육 등이고, 두 호르몬이 임신기간 내내 임신 유지와 태아 발육에 중요한 역할을 한다.</p>
<p class="rb-p">태반에서 P₄와 에스트로겐은 태아태반 쪽에서만 합성되며, 특히 P₄는 임신 7개월령부터 급증한다. 그러나 P₄는 생산 직후 태아 적혈구가 생물학적 작용이 없는 20α-하이드록시프로게스테론으로 대사하므로 모태반이나 태아혈로는 거의 안 넘어간다. 임신 7개월령을 지나 어미 난소를 적출하면 유산하는 비율은 적지만 신생자 발육이 불량해지는 경우가 많아, 충분한 발육에는 임신황체의 P₄가 꼭 필요하다고 본다. 에스트로겐은 임신 5개월령에 한 번 오르고 그 뒤 임신 말기에 걸쳐 다시 늘어난다.</p>
<p class="rb-p">이 임신 5개월령에 태반의 에스트로겐과 아로마타제 활성이 일시적으로 느는 의의는 전혀 알려져 있지 않았다. Masri 등은 임신 3~9개월 소 태아 30두를 CT로 분석해 제1·2위, 제3위, 제4위 중량이 임신 5개월령에 수십 배의 월증가율을 보인다고 보고했다. 이 반추위 중량 급증 시기가 태아태반 에스트로겐 합성 증가 시기와 일치했다는 점이 매우 흥미롭다. 제1·2위 용적 비율은 임신 5개월에 최대지만 제4위는 6개월 이후 말기까지 늘어, 태아 반추위의 발달·분화는 부위에 따라 다르다. 태아의 체장과 체중은 분만 전 1개월간 급격히 느는데, 임신 말기의 에스트로겐 증가가 이를 위한 대사를 촉진한다. 이 시기에는 자궁·태반·유선도 커진다.</p>
<p class="rb-p">에스트로겐이 느는 임신 후기~말기의 급격한 태아 발육은 대사단백질 요구량을 높인다. 임신 말기 28일간 DMI의 0.09% 메티오닌을 첨가한 군은 초유 성분은 차이가 없는데도 송아지 출생체중·체고, 9주령까지 체중·체고·DG가 유의하게 높았다는 보고가 있어, 에스트로겐 증가에 맞지 않는 대사단백질 공급은 태아·신생자 발육에 큰 영향을 준다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태아 부신피질의 발달과 생리</div>
<p class="rb-p">뇌하수체 이상을 동반하는 사람 무뇌아나 소 뇌기형아에서 임신기간이 길어지므로 뇌하수체와 분만의 관계가 예측돼 왔다. 태아 뇌하수체가 분만에 관여함을 실험으로 처음 증명한 것은 호주 산부인과 의사 Liggins다. 양 태아에 ACTH나 코르티솔을 주면 분만이 빨라지고, 뇌하수체를 파괴하면 분만이 늦어지는 것을 증명했다. 태아에 카뉼레를 달아 출생 전 혈중 코르티솔을 본 연구에서 양·돼지 태아는 출생 2주 이상 전부터 코르티솔이 오른다. 그러나 코르티솔 추이와 그것을 자극하는 ACTH 추이가 일치하지 않는다. 양에서 ACTH는 110일 이후, 코르티솔은 130일 이후에 오르기 시작한다. 소도 ACTH는 8개월령부터 먼저 올라 분만 시에는 떨어져 있는데, 코르티솔은 9개월령부터 올라 분만 시 최고다. 혈중 호르몬만 봐서는 이 시간차를 설명하기 어렵다.</p>
<p class="rb-p">그래서 津曲 등은 6~9개월령 소 태아 부신세포에 ACTH를 넣고 6일간 배양하며 코르티솔 생산량을 2일 간격으로 쟀다. 1~2일·3~4일 배양에서는 반응이 낮았으나 5~6일 배양에서 비약적으로 늘었다. ACTH에 대한 코르티솔 반응성은 6~7개월보다 8개월에서 약간, 9개월에서 급증했다. 즉 부신의 코르티솔 생산능은 일정 기간(적어도 며칠) ACTH 자극을 받아야 높아지고(ACTH 수용체 증가), 소 부신의 성숙은 9개월령에 가속된다. 이 결과로 임신 말기 ACTH와 코르티솔의 시간차도 설명된다.</p>
<p class="rb-p">Liggins가 제창한 태아 시상하부-뇌하수체-부신축 중심의 분만 개시 가설에서는 무엇이 태아 시상하부를 자극하는지 불분명했다. 제자 Thorburn 등은 그 인자가 태아태반에서 나오는 PGE₂임을, 양 자궁-난소정맥의 PGE₂가 출생 2주 전부터 늘어난다는 결과로 새 가설로 제안했다. 자연분만에서는 태아가 자라며 필요 혈류량이 비약적으로 늘고, 이 영양요구 급증이 태아태반의 PGE₂ 분비 신호가 된다. 태반 기능 저하나 손상 때도 태아태반에서 PGE₂가 나와 유산이 일어난다는 설명은 종래 가설보다 설득력이 훨씬 높다. 소·돼지도 기본적으로 이 흐름으로 분만이 유발되지만, 하나 고려할 것은 P₄ 생산원의 차이다. 분만이 가까우면 양 태반은 P₄ 생산에서 에스트로겐 생산으로 바뀌어 P₄ 저하와 에스트로겐 증가가 동시에 온다(혈중 에스트로겐이 분만 직전 급증). 소·돼지는 P₄ 생산원이 황체고 에스트로겐 생산원이 태반이라 같은 조직 안에서 대사경로가 바뀌는 게 아니다. 소·돼지는 태반 에스트로겐이 태아 부신 코르티솔보다 더 일찍 늘기 시작하는데, 양과 비교해 어떤 의미인지는 불분명하다. 최근 소 임신 후기 모태반 자궁내막 실질에서 부신피질호르몬 수용체 증가가 관찰돼, 태아 혈중 코르티솔 증가(모체에 코르티코이드 투여도 마찬가지)가 자궁내막 PGF₂α를 직접 자극해 단번에 황체퇴행을 진행시킬 가능성이 시사된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">순환기·혈액계의 발달과 생리</div>
<p class="rb-p">심혈관계는 가장 일찍 기능을 시작하는 기관이다. 소의 조기 임신진단 초음파에서 배의 심박동을 양성 소견으로 삼기도 한다(31~40일).</p>
<p class="rb-p">포유동물 태아는 태반의 제정맥에서 혈액을 받아 간을 거치지 않고 후대정맥에 합류하는 경로(정맥관)가 있다. 후대정맥 혈액은 분할즐(우심방으로 들어온 혈액을 우심실이 아닌 난원공으로 유도하는 홈)에 의해 대부분 난원공을 지나 좌심방으로 들어간다. 이 혈액이 좌심실에서 전대동맥으로 나가 심장과 뇌에 산소포화도 높은 혈액이 간다. 전대정맥에서 우심방으로 들어온 산소포화도가 다소 낮은 혈액은 우심실에서 폐동맥으로 가고 대부분 동맥관 우회로를 거쳐 후대동맥에 합류한다(폐동맥압이 대동맥압보다 수 mmHg 높다). 따라서 태아기 혈액은 동정맥혈이 완전히 분리되지 않지만, 심박출량은 우심실이 많고 산소포화도는 좌심실이 높다.</p>
<p class="rb-p">출생 후에는 말초순환 저항이 급격히 늘어 대동맥압이 오른다. 폐포가 펴지면 폐혈관 저항이 떨어져 폐동맥압과 우심방압이 낮아진다. 폐 혈류가 늘고 폐에서 돌아오는 혈액도 늘어 좌심방압이 오른 결과 난원공이 닫히고 유착한다. 동맥관이 위축·폐쇄돼 폐순환이 완성되면 신생자는 폐호흡을 얻는다. 동맥관 폐쇄는 만기 사람 신생아에서 24시간 이내 50%, 48시간까지 90%, 72시간까지 보통 완전히 닫힌다.</p>
<p class="rb-p">태아 혈관을 확장 유지하는 물질은 PG, 특히 PGE₂다. 혈관 안에서도 만들어지지만 태아 안을 도는 PGE₂의 다수는 태반 유래다. PG는 다른 물질과 달리 간이 아니라 폐에서 대사되므로, 폐 혈류가 적은 태아기에는 PG 대사가 낮아 태아 혈중 PGE₂가 높게 유지된다. 임신 말기 태반 혈류 급증이나 태반염 같은 자극은 태아태반에서 대량의 PGE₂를 만들어 분만 개시의 방아쇠가 된다. 즉 태아태반에서 적당한 PGE₂가 나오는 동안은 임신이 계속되지만 대량 방출되면 분만 개시 자극이 된다. 분만 후에는 PGE₂ 생산원인 태반과 분리되므로 신생자 혈중 PGE₂가 줄고 신생자·태반 혈관이 축소·폐쇄된다.</p>
<p class="rb-p">난산에 따른 출생 후 저산소혈증이나 저체온에 빠지면 노르아드레날린에 의한 폐동맥 수축, 태아 혈관의 PGE₂ 생산이 일어나 난원공·동맥관 폐쇄가 늦어지고 태아 순환이 남아 저산소혈증이 더 진행된다. 동맥관이 안 닫히면 대동맥혈이 동맥관을 거쳐 폐동맥으로 역류한다(대동맥압>폐동맥압). 혈액이 좌심방→좌심실→대동맥→동맥관→심장으로 돌아 전신을 못 돌고 심장에 큰 부담이 간다. 이 상태가 지속되면 생체에 위기 상황이라, 뇌·심근·부신 혈류를 우선하기 위해 피부·근육·장관 혈류가 선택적으로 억제된다(혈액 재분배). 이를 한시라도 빨리 풀려면 산소 흡입과 보온을 적극 해서 태아형 순환을 성체형으로 되돌려야 한다.</p>
<p class="rb-p">태아기 조혈 부위는 난황낭→간→골수로 바뀐다. 헤모글로빈은 배성·태아·성체 Hb 세 종류가 있다. 태아 Hb는 산소결합력이 높아 태반의 낮은 산소 혈액에서 많은 산소를 결합할 수 있다. 출생 직후 신생자의 털 없는 부위나 사람 신생아가 붉게 보이는 것은 태아 Hb의 영향이다. 출생 전부터 태아 Hb와 성체 Hb가 교체되기 시작하지만 출생 후 속도가 급격히 빨라져 신생자 황달의 원인이 되기도 한다.</p>
<p class="rb-p">태아 뇌혈류량은 성장에 따라 크게 변한다. 양 태아는 임신 중기 55mL/100g/분에서 말기 225mL/100g/분으로 급증한다. 신체 성장만으로는 설명이 어렵고 뇌의 기능적 증대(시냅스 증대)가 시사된다. 출생 후 뇌혈류량은 1/3 정도로 격감하지만 산소함량 증대로 보충된다고 본다. 그러나 출생 2시간은 물론 24시간이 지나도 산소함량 개체차가 크고, 이 차이가 이후 발육에 영향을 줄 수 있다. 뇌혈류량 변화는 뇌의 산소·글루코스 소비 추이를 반영한다. 저혈당 때 뇌혈류량이 급증하고, 글루코스만이 아니라 젖산도 이용한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">호흡기계의 발달과 생리</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">폐포의 발달</p>
<p class="rb-p">사람은 수정 후 4주부터 폐가 발달하고 20~24주경부터 폐상피가 I형·II형 폐포세포로 분화한다. 24주경부터 입방상피 다수가 편평해져 폐포가 완성된다. I형은 얇고 편평해 가스교환을 하지만 취약하다(폐포상피의 95%). II형은 I형이 손상되면 I형으로 바뀌어 수복한다. I형이 매우 얇아 폐모세혈관 누출액이 폐수로 고인다. II형은 폐 서팩턴트를 24주부터 조금씩 만들지만 일정 수준은 35주 이후다. 사람 태아는 12주에 양수 속에서 호흡양 운동을 시작하는데(호기·흡기 균형은 30주 이후) 출생 후 호흡 준비로 본다. 이 운동으로 양수에 폐수가 나오므로(말기 150mL/일) 양수에도 서팩턴트가 들어 있다. II형이 심하게 손상되면 폐포는 수복되지 못하고 섬유화해 폐기능이 크게 손상된다. 폐용량·폐포면적은 27주부터 급속히 발달해 출생 시 폐포 수 2,400만 개인데 이는 성인의 10% 이하다. 양·소도 기본적으로 사람과 같게 발달한다고 본다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">양수 중 폐 서팩턴트의 발달과 생리</p>
<p class="rb-p">양수의 서팩턴트에는 스핑고미엘린(뇌신경계에 많다)과 레시틴(폐포 유래)이 있고, 스핑고미엘린은 임신기간 내내 일정하지만 레시틴은 말기에 늘어난다. 그래서 L/S비로 폐 성숙도를 판정하는 방법이 사람 의학에서 쓰인다. 사람은 30주 이후 L/S비가 급증하고, 2 이상이 되는 35주 이후 거의 호흡 준비가 된다. 소 양수를 임신월령별로 재면 사람과 거의 같아, 레시틴이 8개월령 이후 늘고(L/S 약 2) 9개월령에 더 는다(약 3).</p>
<p class="rb-p">분만 개시에 관여하는 부신피질호르몬이 서팩턴트 생산을 촉진함이 양에서 증명됐다. 태아에 코르티솔을 주면 폐 세포분열을 억제하고 대신 서팩턴트를 분비시킨다. 津曲이 소 태아 폐세포를 배양하니 코르티솔에 대한 레시틴 생산은 임신 9개월에 현저히 늘었으나 스핑고미엘린은 늘지 않았다. 4~5개월령에서는 코르티솔의 세포 증식 억제가 없었으나 9개월령에서는 뚜렷이 억제됐다. 다만 이 억제는 생리적 농도가 아니라 고농도에서만 나타난다는 보고도 있다.</p>
<p class="rb-p">출생 후 자연 호흡 개시는 태반 박리·제대 폐쇄로 먼저 산소분압·pH 저하와 CO₂ 분압 상승이 오고, 이 자극이 횡격막 반사로 흉강 내 음압을 만들어 닫혀 있던 폐를 펴면서 일어난다. 분만이 정상이면 출생 후 60초 안에 자발 호흡이 시작된다. 횡격막 반사에는 피부 촉각이나 찬 외기 자극도 촉진 인자다. 첫 호흡으로 공기가 들어와 폐가 펴진다. 그러나 호흡 개시 전 폐포를 채운 폐수가 출생 직후 배출돼야 한다. 그러려면 동맥관·난원공 폐쇄가 순조롭게 진행돼 폐 순환 혈액량이 늘어야 한다.</p>
<p class="rb-p">미숙 신생자의 서팩턴트 저값, 난산 부종에 의한 체액 증가, 태변 배출로 서팩턴트 작용이 떨어지면 호흡곤란증후군(RDS)이 생길 수 있다. 출생 후 동맥관은 산소분압이 높아지면 닫히지만, RDS나 신생자 가사처럼 산소가 부족하면 폐쇄가 저해돼 동맥관개존증(PDA)이 생후에도 지속될 수 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">폐 서팩턴트 관련 단백질</p>
<p class="rb-p">SP-A·B·C·D 4종이 있고, SP-B·C는 소수성으로 서팩턴트와 강하게 결합해 표면활성에 꼭 필요하다. SP-A·D는 감염방어 기능에 관련된다. 이들은 서팩턴트와 함께 늘어 폐 성숙 지표로도 쓴다. 외계에 면한 점막에는 점액·IgA·락토페린 외에 여러 세균감염 방어 기능이 요구되므로 폐포 점막에서 SP-A·D의 역할 해명이 기대된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">소화기계의 발달과 생리</div>
<p class="rb-p">초식동물은 원래 동아프리카 삼림의 부드러운 풀을 먹었으나 3,400만 년 전쯤 한랭화로 삼림이 줄고 초원이 늘었다. 이 딱딱한 풀을 소화하게 된 것이 반추동물과 말과다. 섬유 분해능은 반추동물이 말보다 효율적이다. 반추동물은 발생 초기에 위 하나가 넷으로 분화한다. 처음엔 제1위≫제4위지만 임신 7개월에 거의 같아지고 그 뒤 제1위<제4위(출생 직후 1:2)가 된다. 생후 먹이를 먹으면 다시 제1위가 발달해 성체에서 10:1이 된다. 태반 형성 후 태아는 조직영양에서 혈액영양으로 넘어가지만, 상피융모성 태반(돼지·말)이나 결합조직융모 태반(반추동물)은 태반 형성 후에도 조직영양 보급이 임신기간 내내 계속된다. 임신이 진행되면 양수를 소화관에서 흡수하는 영양보급이 더해지는데, 출생 후 소화흡수 훈련 역할도 한다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">출생 시 소화기 상황과 포유 의욕</p>
<p class="rb-p">출생 시 제4위에는 양수가 많이 들어 있어, 이 양수가 소장으로 이동하거나 흡수되지 않는 한 초유 섭취는 어렵다. 특히 출생 후 저체온이나 난산 저산소혈증에서는 노르아드레날린에 의한 폐동맥 수축에 이어 난원공·동맥관 폐쇄부전이 와 저산소혈증이 더 진행된다. 저산소가 계속되면 혈액 재분배로 소화기 등 말초 혈류가 억제돼 제4위 양수 흡수가 진행되지 않고, 출생 후 이른 포유 의욕은 기대할 수 없다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 저영양이 태아·신생아에 미치는 영향</div>
<p class="rb-p">영국 환경역학자 David Barker는 1980년대에 "태아기 저영양이 성인기 심혈관장애의 위험 인자"라는 바커 가설을 발표했으나 당시엔 찬동을 못 얻었다. 태아가 저영양에 노출되면 적응하려는 결과 근육량 감소, 신장 네프론 수 감소, 췌장 β세포 감소가 일어나고, 이 변화가 출생 후에도 영속해 성인이 된 뒤 고혈압·당뇨·심근경색 위험을 높인다는 것이다. 지금은 많은 연구자가 지지한다.</p>
<p class="rb-p">태아는 혈액·단백질을 만들려고 철이 많이 필요한데 모체가 충분히 공급 못 하면 신생아 심실중격결손 등의 원인이 된다고 본다. 임신 초기 엽산 부족은 이분척추 같은 선천성 기형을 늘릴 수 있다. 사람 연구 성과지만 같은 포유류로서 소에도 들어맞을 가능성은 부정할 수 없다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 1-3 태아의 생리, 津曲茂久. 원문 그대로 번역, 정리 전.</span></p>
</div>
<div class="modal-sub" style="margin:22px 0 6px;">태아의 영양과 성장 (일본송아지 1-4)</div><div class="rb-block">
<p class="rb-p">임신 말기 경산우는 BCS를 조정해 앞 비유기에 소모된 소화기관과 유선을 회복시키면서 태아를 순조롭게 키워야 한다. 최근 초산 유량도 크게 늘어 임신 말기에는 모우·태아·유선 성장에 충분한 양분을 공급해야 한다. 태아 양분 대사를 깊이 이해하면 임신 말기의 정밀한 사양관리에 기여해 건강한 송아지를 얻고 모우의 비유·번식성적에도 좋은 영향을 준다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태아의 영양원</div>
<p class="rb-p">태아 성장 속도는 임신 초기엔 완만하지만 말기 약 3개월간 급격히 는다. 태아 성장과 에너지 대사에 필요한 영양소는 주로 글루코스와 아미노산으로 공급된다(표). 포식 상태 산양 태아의 글루코스·젖산 대사를 직접 잰 결과 이들이 태아 대사에서 차지하는 비율은 50~60%였다. 반추동물은 단쇄·장쇄 지방산과 케톤체가 태반을 잘 통과하지 못해 아세트산은 임신 말기 소 태아 에너지원의 약 10~15%로 본다. 나머지 30~40%는 아미노산이다. 소·면양 태아의 아미노산 순흡수량을 구한 보고는 아미노산이 에너지원의 50%였다고 한다. 표에서 임신 말기 소 태아는 흡수한 아미노산의 32%(12/38 g/일)만 조직에 축적된다. 즉 순요구량의 3배를 대사 아미노산으로 공급해야 한다.</p>
<p class="rb-p">임신 말기 태아의 지방 축적은 매우 적은데, 모체 혈중 장쇄 지방산이 태반을 통과하지 못하기 때문이고, 태아 지방세포의 지방산 합성 능력이 상당히 낮기 때문이기도 하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태반과 자궁의 대사</div>
<p class="rb-p">자궁·태반 조직(태반·자궁내막·자궁근층)은 임신 말기 임신자궁 전체 중량의 20% 정도에 불과하다. 그러나 소·면양에서 이 조직이 자궁에 흡수된 산소의 35~50%, 글루코스의 65%를 소비한다. 자궁에 흡수된 글루코스의 30~40%는 젖산으로 바뀌어 모체나 태아 혈액으로 방출된다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표. 임신 말기 소 태아의 에너지·질소원과 요구량 (임신 250일 홀스타인, 태아 35kg 기준)</p><style>.jp-tbl{border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}.jp-tbl th,.jp-tbl td{border:1px solid var(--line,#CFD4D8);padding:3px 8px;text-align:center}.jp-tbl td:first-child{text-align:left}.jp-tbl th{background:var(--surface-alt,#f2f3f5)}</style><div style="overflow-x:auto"><table class="jp-tbl"><tr><th></th><th>에너지 kcal/일</th><th>질소 g/일</th></tr><tr><td>기질: 글루코스·젖산</td><td>775</td><td>—</td></tr><tr><td>기질: 아미노산</td><td>1,306</td><td>38</td></tr><tr><td>기질: 아세트산</td><td>255</td><td>—</td></tr><tr><td><b>기질 합계</b></td><td><b>2,336</b></td><td><b>38</b></td></tr><tr><td>요구: 조직 축적</td><td>605</td><td>12</td></tr><tr><td>요구: 열 생산</td><td>1,605</td><td>—</td></tr><tr><td>요구: 요소</td><td>125</td><td>23</td></tr><tr><td><b>요구 합계</b></td><td><b>2,335</b></td><td><b>35</b></td></tr></table></div>
<p class="rb-p">태아태반에 흡수된 글루코스는 프럭토스로 바뀌어 태아 혈중으로 나온다. 반추동물 태아 혈중 프럭토스는 높고 태반에서 왕성하게 생성되지만 대사 회전이 느려 에너지원으로는 글루코스의 1/5 정도다.</p>
<p class="rb-p">소 태반은 임신 230일경까지 성장한다. 자궁태반에서 아미노산 대사가 활발하다고 보고되지만 기전은 소에서 아직 해명되지 않았다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태아의 양분 요구량</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">임신 시 에너지·단백질 요구량</p>
<p class="rb-p">Jakobsen 등이 1957년 소 태아·자궁·태반의 에너지 축적량을 직접 잰 임신일수별 합계 에너지 축적곡선은 그 뒤 많은 연구자가 인용한다. 홀스타인 임신 시 태아 단백질 축적량은 Bell 등의 1995년 결과가 참고가 된다. 흑모화종은 1983년 吉田 등이 임신일수를 변수로 한 식을 제시했다. 젖소 임신 시 대사에너지 요구량은 Moe와 Tyrrell의 1972년 97예 대사시험에서, 흑모화종 임신우는 岩崎 등의 1986년 대사시험에서 임신 말기 1일 대사에너지 요구량이 구해져 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">에너지 이용효율</p>
<p class="rb-p">모우가 섭취한 대사에너지가 태아에 이용되는 효율은 젖소 10.5%, 헤리퍼드 14%, 흑모화종 15%라는 보고가 있다. 유지 70~80%, 비유 60~70%, 발육·비육 40~60%와 비교하면 현저히 낮다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태아 성장에 영향을 미치는 요인</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">혈류량</p>
<p class="rb-p">태아로의 양분 공급을 제어하는 요인으로 자궁·제대 동정맥 혈류량이 있다. 소 임신자궁 혈류량은 임신 137일 대비 250일에 4.5배, 제대 혈류량은 21배가 된다. 임신 말기 면양의 급여를 제한하면 자궁 혈류량은 저영양에서 32% 줄고, 그 결과 자궁의 산소·글루코스 흡수량은 각각 63%·66% 떨어진다. 최근 면양 연구에서는 성장 중인 미경산 임신 면양은 분만 전 영양 과다여도 적절 영양관리군보다 자궁동맥 혈류량이 떨어지고 출생체중이 줄었다.</p>
<p class="rb-p">2001년 Nishida 등은 임신우 복부를 기립 상태로 절개해 자궁동맥에 초음파 혈류 센서를 달아 분만 전 젖소의 자궁동맥 혈류량을 장기간 연속 측정하는 방법을 개발했다. 임신 220·250·266일 홀스타인 경산 임신우의 중자궁동맥 혈류량은 각각 6.7·8.9·8.8 L/분이었다. 임신 226·248·269일(분만 전 8주)에 기립과 횡와 시를 비교하면 각각 8.0 vs 8.8, 9.9 vs 11.1, 8.1 vs 9.7 L/분으로 모두 횡와 시가 유의하게 많았다. 양측 자궁동맥에 혈류계를 단 4두에서 임신 약 226·248·269일의 임신각·비임신각 혈류량은 7.98 vs 2.36, 8.88 vs 2.88, 7.77 vs 3.21 L/분이었다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">환경온도(더위)</p>
<p class="rb-p">임신 중 열 스트레스는 태반 중량, 태반 호르몬 농도, 자궁·제대 혈류량을 줄인다. 임신 말기 열 스트레스는 임신기간을 단축시켜 출생체중을 줄인다. 임신 100일 소를 더위에서 기르면 180일에 태아 중량이 22% 줄었다. 이때 자궁·제대 혈류량은 각각 50%·30% 떨어졌다. 태아의 산소·글루코스 순흡수량은 22%·65% 떨어지고, 자궁태반 조직의 흡수량은 산소 49%·글루코스 42% 줄었다. 즉 열 스트레스는 태아보다 자궁태반 조직의 에너지 대사에 더 크게 영향을 준다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">품종</p>
<p class="rb-p">1991년 Ferrell은 샤롤레와 브라만으로 모체 품종이 태아 성장에 미치는 영향을 봤다. 샤롤레 태아의 임신 230일 태반 중량·자궁 혈류량은 모우가 브라만이면 4.7kg·4.7L/분, 샤롤레면 5.6kg·9.2L/분으로 샤롤레 모우가 컸다. 임신 230일에는 모우 품종이 태아 체중에 영향이 없었으나 270일의 샤롤레 태아 체중은 브라만 모우 33.9kg, 샤롤레 모우 46.9kg으로 크게 달라, 태아 성장에 모체 환경이 크게 영향을 준다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">모체의 영양상태</p>
<p class="rb-p">모체에서 태아로의 글루코스 수송은 반추동물에서 촉진확산(담체 단백질이 돕는 농도 기울기 확산, 에너지 불필요)으로 이뤄지므로 모체-태아 혈중 글루코스 농도 차이와 태반 수송능력이 매우 중요하다. 모체 혈당이 떨어지면 농도 차이가 줄어 임신자궁 흡수량이 떨어진다. 담체 양은 태반 크기에 비례하므로 태반 성장이 중요하다.</p>
<p class="rb-p">그런데 임신 말기 산양을 5일 절식시켜도 태아로의 아미노산 흡수량은 거의 영향이 없다. 아미노산 대부분이 능동수송으로 흡수돼 모체 혈중 농도에 영향받지 않기 때문으로 본다. 다만 에너지 부족이 오래가면 글루코스 부족을 메우려 아미노산을 에너지원으로 써서 단백질 합성·태아 조직 축적이 희생되고 태아 발육이 지연된다. 태아 골격근은 뇌·심장보다 영양 분배 우선순위가 낮아 특히 영양부족 영향을 받기 쉽다. 출생 후 근섬유 수는 늘지 않으므로 태아기 골격근 발달이 중요하다. 모우 단백질 보급이 송아지 출생체중을 늘리고 태아 근육 성장을 잠재적으로 바꿀 가능성이 제시돼 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">호르몬</p>
<p class="rb-p">태아 렙틴 농도는 임신 40~130일 면양에서 계속 오르지만 130일 태아 체중·태반 중량과는 관계가 없었다. 태아 렙틴 유전자는 뇌·간에서는 임신 전반에 보이지만 지방에서는 100일 이후에 보인다. 130일 이후 태아 신장 주위 지방세포의 렙틴 유전자량은 모체의 1/10 정도였다. 태반·자궁 조직에서는 전혀 없었다. 임신 122~135일 면양의 급여를 요구량의 55%로 줄이면 태아 혈중 렙틴은 변화 없지만 모체 렙틴은 급감한다. 임신 초기 태아 렙틴은 대부분 지방조직 이외 유래이며, 분만이 가까워지면 지방조직에서 분비된다. 태아 렙틴의 역할은 아직 모른다.</p>
<p class="rb-p">임신 말기 모체 IGF-1은 임신우가 비임신우보다 높고, 임신 15주 이후 차이가 뚜렷하다. 초기~중기에 오르다 말기에 서서히 감소하는데, 간에서 나오는 IGF-1은 사료 섭취량의 영향을 받기 때문으로 본다. 태아 혈중 IGF-1은 태아 체단백에서 아미노산 동원을 억제한다. 그러나 태아 간의 GH 수용체 발현과 태아 혈중 IGF-1이 낮은 점으로 보아 태아기에는 GH·IGF-1에 의한 대사 제어가 미발달이라고 본다. 양에서 임신 후기 모체 IGF-1을 늘리면 모체 인슐린·글루코스·유리지방산이 늘어 임신자궁의 영양소 흡수에 유리하게 모체 대사가 바뀌고, 태반 대사도 바뀌어 태아로의 글루코스·젖산 흡수가 촉진된다.</p>
<p class="rb-p">태반성 락토젠(PL)은 양·산양·사람 등에서 임신 중기부터 혈중에 나타나 분만까지 오르다 분만과 함께 사라진다. 유선 발육에 큰 역할을 한다고 보지만, 태아 발달을 위해 양분을 분배하는 데도 관여한다고 본다. 임신 양을 유지량 제한군과 자유채식군으로 나눈 실험에서 임신 말기 유지량군은 모체 증체·BCS는 낮았지만 PL·P₄ 농도는 높고 태반 중량과 새끼 출생체중이 컸다. Rasby 등은 BCS 낮은 임신우와 적절한 임신우의 혈장 영양소·PL을 봤는데 태아 성장에 유의차는 없었다. PL은 BCS 낮은 소가 높았다. BCS 낮은 소는 자궁 중량은 작았지만 요막·태반엽 중량은 적절군보다 컸다. PL이 BCS 낮은 소의 태아태반에 도달하는 영양소를 늘리는 기전을 갖고 있음을 시사한다.</p>
<p class="rb-p">이처럼 모체 영양상태와 태아 발육은 단순한 양의 상관이 아니라 여러 조절 기구가 작동해 저영양에 대비하고 있을 가능성이 있다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 1-4 태아의 영양과 성장, 西田武弘. 원문 그대로 번역, 정리 전.</span></p>
