<div class="modal-sub" style="margin:18px 0 6px;">쌍태 분만</div>
<p class="rb-p">소는 단태동물이지만 쌍태를 임신하는 경우도 있다. 쌍태 임신율은 육용우보다 유용우가 높다⁷⁾. 근년 홀스타인에서는 비유능력의 비약적인 향상에 따라 쌍태 임신이 많아지고 있다. 홀스타인에서 쌍태를 분만하는 비율은 3~8% 정도이며, 경산우 쪽이 초산우보다 쌍태를 임신하는 비율이 높다⁸⁾. 또한 쌍태를 임신하는 소는 비유량이 많고, 분만 후 체중 저하와 BCS 저하가 크며 그 회복이 늦어지는 경향이 있다⁹⁾. 쌍태 분만은 난산이 되기 쉽고, 태반 정체나 분만 후 수태가 늦어지는 일도 많다¹⁰⁾.</p>
<p class="rb-p">쌍태의 임신기간은 단태에 비해 3~6일 짧다(표 6-1-9). 소가 세쌍둥이 이상을 분만하는 일은 극히 드물지만, 그 임신기간은 쌍태보다 다시 2~10일 짧다. 따라서 분만 예정일보다 5~6일 일찍 뚜렷한 분만 징후가 나타난 경우에는 쌍태를 의심할 필요가 있다. 특히 홀스타인에서는 건유기간도 짧아지므로, 비유 개시에 대비한 건유 후기의 영양관리에 세심한 주의가 필요하다. 또한 쌍태를 임신한 소는 단태를 임신한 소에 비해 복위의 증대가 현저하다. 이러한 소에서 분만이 예정일보다 이르고 태아가 통상보다 작은 경우에는 쌍태를 의심하고, 첫째 산자의 만출 후에는 자궁 내에 둘째 산자가 남아 있지 않은지 확인할 필요가 있다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-1-9 홀스타인에서 단태와 쌍태의 임신기간, 출생 시 체중 및 산차</p>
<div style="overflow-x:auto"><table class="jp-tbl"><tr><th>항목</th><th>단태</th><th>쌍태</th></tr><tr><td>두수</td><td>1019</td><td>49</td></tr><tr><td>재태일수(일)</td><td>283.5±20.9ᵃ</td><td>276.1±20.8ᵇ</td></tr><tr><td>출생 시 체중(kg)</td><td>44.7±7.8ᵃ</td><td>36.0±5.5ᵇ</td></tr><tr><td>산차(산)</td><td>2.4±1.7</td><td>2.9±1.5</td></tr></table></div>

<p class="rb-p">쌍태의 출생 시 체중은 단태의 70~80%로 작기 때문에 만출은 쉽다¹¹⁾. 통상 첫째 산자 만출 30분~1시간 후에 둘째 산자가 만출된다. 그러나 태아가 산도에 동시에 진입하거나 한쪽 태아의 실위로 난산이 된 경우에는 사산이나 신생자 사망이 일어나는 일이 많다. 또한 쌍태 분만의 경우 태아가 작기 때문에 태막을 뒤집어쓴 채 만출되는 경우도 있다. 태아가 동시에 산도에 진입하여 두 마리의 다리가 동시에 나오는 경우에는, 다리 하나를 당기거나 밀어 그에 따라 움직이는 다리를 구별하면 태아를 구별할 수 있다. 또한 미위로 나오는 경우도 있으나 태아가 작기 때문에 그대로 견인해도 대부분의 경우 쉽게 태아를 꺼낼 수 있다. 쌍태의 경우 미리 쌍태임을 알고 있으면 난산을 피할 수 있다. 쌍태는 직장검사로도 어느 정도 판정할 수 있으나 그 정확도는 낮다. 초음파 영상진단장치를 이용하면 임신 35~60일에 높은 정확도로 판별할 수 있다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">출생 시 체중의 추정</div>
<p class="rb-p">분만 직후 송아지의 앞다리(중수골)와 뒷다리(중족골)의 폭과 출생 시 체중 사이에 일정한 관계가 있다는 것이 보고되어 있다. 또한 초음파 영상진단장치를 이용해 분만 전에 태아의 앞다리 폭을 측정함으로써 태아의 체중을 추정할 수 있다는 것도 보고되어 있다¹²⁾. 홀스타인의 분만 직후 산자에서는 중절골 폭이 5.2 cm 이상인 경우 출생 시 체중이 50 kg 이상일 가능성이 높다(그림 6-1-4). 분만이 예정일보다 늦고 복위가 큰 소의 앞다리(중수골) 폭을 측정하여 30 mm 이상인 경우에는 난산을 상정한 분만 개조 준비를 갖출 수 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-1-4 홀스타인 송아지의 우측 앞다리 중절골 폭과 출생 시 체중의 관계. 회귀식 y=0.033x+3.608, R²=0.710, P<0.0001. 가로축 출생 시 체중 20~70 kg, 세로축 우측 앞다리 중절골 폭 4.0~7.0 cm.</p>
<div class="modal-sub" style="margin:18px 0 6px;">노동 절감형 분만 관리</div>
<p class="rb-p">분만 관리는 가장 중요한 사양관리 작업의 하나이지만, 야간이나 바쁜 시기의 분만은 큰 부담이 되므로 분만 관리의 노동 절감은 중요한 과제이다. 최근 질 내에 유치할 수 있는 온도센서를 삽입하여, 제1파수와 동시에 온도센서가 체외로 배출되고 일정 이하의 온도(34℃)를 감지하면 휴대전화에 알리는 분만 관리 시스템이 시판되어 보급되고 있다.</p>

<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 6-1 초산우의 분만 생리, 堂地修·古山敬祐.</p>

<div class="modal-sub" style="margin:22px 0 6px;">초산우의 분만에 따르는 질병 (일본송아지 6-4)</div><div class="rb-block">
<p class="rb-p">초산우의 분만에 따르는 질병은 유용우와 육용종 번식우(번식우) 어느 쪽에서나 일어날 수 있는 질병이므로, 이 절에서는 구별하지 않고 기술한다. 이 가운데 「분만 직후에 유의해야 할 점」은 번식우에서, 「저유증·무유증」 「유방 부종」 「혈유증」은 유용우에서 일어나기 쉬운 질병(상황)으로 생각된다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">분만 시의 사고</div>
<p class="rb-p">유용우, 육용우를 불문하고 초산우에서는 경산우에 비해 아래와 같은 사고가 발생하기 쉽다. 발생 요인으로는 우선 어미소의 체격과 태아 크기의 불균형을 들 수 있으므로, 발육이 불충분한 단계의 육성우에 대한 인공수정(AI)을 피하는 것이나 홀스타인에 흑모화종을 교배하는 것을 포함하여, 교배할 종모우의 선별이 발생 방지책의 하나가 된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">골반 협착에 의한 난산</div>
<p class="rb-p">난산의 모체측 유인으로, 수정 적기에 이르지 못한 미숙한 육성기에 AI된 경우나 영양불량 등에 의해 분만기까지의 발육이 저해된 경우에 생기기 쉽다. 한편 골반의 크기가 정상이라도 태아가 과대하면 상대적으로 골반 협착이 되므로 난산이 될 가능성이 높다(태아측 유인)¹⁾. 어느 경우에나 경질 분만이 가능한지 여부의 판단과, 불가능하다고 진단되었을 때의 제왕절개술 적용은 모두 신속히 행하는 것이 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">산도 손상</div>
<p class="rb-p">자궁에서 외음부 및 회음부에 이르러 일어나는 손상으로, 자궁 파열도 포함된다. 자연 분만에서도 발생하지만, 부적절한 분만 개조 등에 의해 인위적으로 일어나는 경우도 있다²⁾. 태아의 실위 정복 시 자궁 천공이 일어날 수 있는 것 외에, 경질 분만 시에 자궁경관을 포함한 산도의 개구·이완이 불충분한 상태에서의 무리한 견인으로 생기는 경우가 많다. 출혈이 현저한 경우 그 부위에 따라서는 봉합 처치를 행한다²⁾. 분만 시에는 너무 이른 개입을 피하고, 필요에 따라 자궁이나 산도의 이완을 촉진하는 약제를 투여하는 등 무리한 분만 개조는 하지 않는 것이 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">폐쇄신경 마비</div>
<p class="rb-p">골반의 장골체 내측을 주행하는 폐쇄신경이 태아 통과에 따라 압박됨으로써 발생하는 경우가 있다³⁾. 골반 협착 또는 과대 태아인 경우 그 위험성은 높아진다. 일반적으로 양측성 마비에서는 양 뒷다리를 외전시켜 기립 불능이 된다. 편측성인 경우에는 환지를 정상 위치에 유지하면 기립이 가능하지만³⁾, 뒷다리가 외전하기 때문에 보행이나 체중 부하는 곤란해진다. 증상의 정도는 다양하며, 경도이면 비타민 B₁ 제제(푸르설티아민)가 유효한 경우가 많다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">분만 직후에 유의해야 할 질병</div>
<p class="rb-p">분만방에서 분만한 경우, 어미소는 만출된 송아지의 체표에 묻은 태수를 핥는 행동(Licking: 리킹)을 취한다(2-3 [109쪽] 참조). 송아지의 면역능 향상과 건강 유지에 빼놓을 수 없는 것이므로, 어미소가 이 행동을 보이지 않는 경우에는 관리자가 마른 천 등으로 송아지의 태수를 닦아 주어야 한다. 이 작업은 특히 한랭지의 동계 분만 시 송아지를 추위로부터 보호하기 위해서도 중요하다. 또한 일반적으로 흑모화종 번식농장에서는 분만 후에도 한동안 모자가 동거하는 경우가 많아 송아지는 모유를 스스로 포유하게 되는데, 드물게 초산 어미소가 송아지의 포유를 싫어하거나 송아지를 접근시키지 않고 공격하는 경우가 있다. 이런 경우에는 불의의 사고로부터 보호하기 위해, 어미소가 안정될 때까지 송아지를 일시적으로 격리하는 등의 대응이 필요하다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">자궁 탈출</div>
<p class="rb-p">태아가 만출된 직후에 자궁이 반전되어 음문 밖으로 탈출한 상태를 가리킨다. 주된 원인은 만출 후에 강한 진통이 지속되는 것이지만, 너무 이른 견인으로 적출하면 그 후부터 진통이 강해져 일어나는 경우도 있다. 자궁 전체가 탈출한 경우에는 배뇨 곤란이 된다. 탈출 후의 경과 시간이 예후에 크게 영향을 미치므로 신속한 환납·정복이 요구된다. 그러나 시간이 경과하여 자궁내막의 손상이나 순환장애가 중도가 되면 정복이 곤란해지는 것 외에, 정복할 수 있더라도 감염 등으로 예후 불량이 되는 경우도 많다²⁾. 발견 시에는 신속한 수의사에 의한 처치가 필요하다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">후산 정체</div>
<p class="rb-p">일반적으로 태반이 분만 후 12시간 이내에 배출되지 않는 경우를 가리킨다. 과비우에서 발생하기 쉬우나, 분만 유기를 행한 경우에도 발생하기 쉽다고 한다. 현재는 자궁 내에 손을 넣는 용수법에 의한 태반 박리는 출혈이나 감염을 초래하는 요인이라 하여 권장되지 않는다. 또한 자궁수축을 촉진하는 약제의 투여 효과도 확립되어 있지 않다. 무리하게 견인하는 것은 피해야 하지만, 수일 경과한 뒤에 가볍게 잡아당기면 배출되는 경우가 있다²⁾. 산욕열을 병발한 경우에는 수의사의 치료가 필요하다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">산욕열</div>
<p class="rb-p">분만 후 산도로부터의 세균 감염에 의해 발열하는 질환이다. 분만 개조 시의 오염이 최대 원인이며, 산도 손상이나 후산 정체에 속발하는 경우도 적지 않다²⁾. 조기에 항균제를 전신 투여함으로써 치유되는 경우가 많으나, 자궁염과 합병한 경우에는 국소 치료가 필요하여 조기 치유는 어렵다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">저유증·무유증</div>
<p class="rb-p">주로 유용우에서 발생한다. 저유증(惜乳症)은 비유량이 극단적으로 적은 상태이며, 무유증은 비유하지 않는 상태를 가리킨다. 초산우는 비유하는 것 자체가 처음이어서, 어떤 원인에 의해 그것이 시작되지 않는 일이 드물게 일어난다. 원인의 하나는 미경산 유방염으로, 유방조직에 기질적 이상이 생겨 있는 경우에는 비유가 이루어지지 않는다. 또한 선천적 이상(유선조직이나 호르몬 분비기능 이상 등)에서도 같은 일이 일어난다⁴⁾. 현장에서 자주 만나는 것은 최유 호르몬인 옥시토신이 제대로 분비되지 않는 사례로, 유방이 팽창해 있음에도 불구하고 사유(射乳)하지 않는 상황이다. 유방 내에 사유되지 않은 유즙이 충만하기 때문에 심한 동통이 생겨 뒷다리로 차는 동작을 보이는 경우도 많다. 이 경우에는 옥시토신 제제를 투여함으로써 사유가 일어나며, 1회 투여로 통상의 착유가 가능해지는 사례가 대부분이다. 한편 착유에 맞추어 수회 투여해야 하는 사례도 산견된다. 초산에서 발증한 개체가 그 후의 분만 때마다 발증하는 일은 거의 없다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">유방 부종</div>
<p class="rb-p">주로 유용우에서 발생한다. 초산우 외에 경산의 고비유우에서도 보인다. 분만 전(2~3주 정도)부터 서서히 뚜렷해지는 경우가 많다. 유방의 간질에 조직액이 저류한 병태를 가리키며, 대부분은 분만 후 자연히 소퇴하므로 생리적인 것으로 여겨진다⁴⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">원인</div>
<p class="rb-p">분만 전 2주간에 3배량으로 증가하는 유방 모세혈관의 혈압 상승과 림프액의 배설장애(조직액의 누출)가 직접적 원인이라고 한다⁴⁾. 급여사료와의 관련성은 명확하지 않으나, 분만 전의 농후사료 과급이나 단백질 과잉 섭취 외에, 사료에의 염류 첨가가 유인일 가능성이 지적되고 있다⁵⁾. 또한 초지에 대한 과도한 퇴비 살포로 사료작물의 칼륨 함량이 높아져 있는 것도 한 원인으로 여겨진다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">증상</div>
<p class="rb-p">부종은 유방 전체에 미치며, 중증례에서는 유방 전부의 하복부에서 흉수, 사지에까지 이르는 경우가 있다. 부종부를 손가락으로 압박하면 압흔이 남는다⁴⁾. 유두 부종을 병발하는 경우도 있어, 유방 전체의 종대와 맞물려 밀커 장착이 곤란해지는 경우가 있다. 증례에 따라서는 유방 중격 수종을 병발하여 유방 제인대의 손상을 초래해 유방 하수가 된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">치료</div>
<p class="rb-p">경도인 경우는 치료를 필요로 하지 않는다. 부종이 중도이거나 장기간 지속되는 경우 부신피질호르몬제나 이뇨제 투여가 유효하다. 유두 또는 유방 손상이 우려되는 경우에는 시판 유방 커버를 장착하면 예방에 도움이 된다⁴⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">예방</div>
<p class="rb-p">분만 전의 급여사료가 앞서 말한 것과 같은 설계로 되어 있다면 그 시정을 꾀한다. 특히 염류의 과잉 급여는 피해야 한다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">혈유증</div>
<p class="rb-p">주로 유용우에서 발생한다. 유즙 중에 혈액이 혼입된 병태를 가리키며, 다수는 분만 후 생리적으로 발생한다고 한다. 초산우에서의 발생률이 경산우에 비해 높은 것은 아니다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">원인</div>
<p class="rb-p">분만 후 비유가 개시되면 유방 내에 혈액이 급격히 유입되어 모세혈관이 확장되기 때문에, 혈관 투과성이 항진하여 혈구가 혈관 밖으로 누출되거나 모세혈관이 파탄함으로써 일어난다⁴,⁶⁾. 혈유 중에는 정상유에 비해 상피세포나 세포 잔사가 유의하게 많이 포함되어 있었던 점에서, 어떤 원인에 의한 유선상피세포 장애의 가능성을 시사하는 보고⁷⁾도 있다. 비생리적인 것은 유방의 타박이나 유방염에 의한 혈관 손상에 의한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">증상</div>
<p class="rb-p">혼입되는 혈구의 비율에 따라 유즙은 약간의 분홍색에서 적색, 암적색까지 다양한 색조를 보인다. 생리적인 것은 1주일 전후로 서서히 경감되어 정상유가 된다⁴⁾. 유방 내에 혈병이 형성되면 유두구를 막기 때문에 배유 장애가 일어나는 경우가 있다⁶⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">치료</div>
<p class="rb-p">지혈제로 트라넥삼산 제제(항플라스민 작용)나 비타민 K제(혈액응고계 인자 활성화 작용)가 사용된다⁶⁾.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(加藤敏英)</span></p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 6-4 초산우의 분만에 따르는 질병, 加藤敏英.</p>
</div>
`;

<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>분만으로 태아가 만출되면 생식기는 다시 임신 가능한 상태로 회복해 가는데 이 기간이 산욕기다. 자궁은 분만 직후부터 수축해 분만 후 약 5일이면 중량이 절반으로 준다. 오로(자궁 내 저류물)는 분만 후 2~3일에 가장 많고 10일까지 보이며, 처음 적갈색에서 점차 백색 점액으로 옅어지다 사라진다.</span></p><p class="bx-num"><span class="bxn">2.</span><span>자궁경관은 분만 1일이면 손이 안 들어가고 4일엔 손가락 2개 크기임.</span></p><p class="bx-num"><span class="bxn">3.</span><span>정상 회복 수치(목표)<span class="hang">오로 배출 완료: ~25일</span><span class="hang">좌우 자궁각 차이 소실: ~40~50일(고산차는 100일 넘기도 함)</span><span class="hang">자궁 내 농 소실: ~35일</span><span class="hang">자궁내막 염증 수습: ~40일</span><span class="hang">→ 정상 분만이면 30~40일경 수복 완료</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>자궁염·산욕열의 배경 : 점액 없이 적갈색 수양성 오로가 나오면 자궁염, 발열·식욕부진까지 있으면 산욕열로 보고 치료한다. 수복 지연 원인은 난산·태반정체·쌍태분만·유열·과비(BCS 3.75↑)다.</span></p><p class="bx-num"><span class="bxn">5.</span><span>수복의 초음파 수치. 자궁각 직경은 분만 7~10일 약 7cm, 15일 5cm, 20~25일 3cm로 줄어 20~25일이면 주발정기 자궁과 비슷해짐. 합병증 없는 수복 완료는 초산 평균 23일·경산 27일, 늦어도 42일. 첫 며칠은 소구가 고에코로 보이고 내강 액체(오로)·벽 비후·불균일 에코가 정상임.</span></p><p class="bx-num"><span class="bxn">6.</span><span>분만 후 검사 시점. 분만 1주 이내는 정상 자궁과 병적 자궁의 초음파상이 구별되지 않으므로 급성 산욕 자궁염은 식욕 저하·발열·악취 분비물로 진단함. 10~21일 검사에서는 자궁염(내막+근층 비후, 눈보라상)과 자궁내막염(내막만)을 구별해야 치료·재검 계획이 섬. 12일부터 첫 배란이 오는 소가 있고 거의 무발정이지만, 발정 후 자궁 상태가 좋아지므로 좋은 예후 지표임. 15일경부터 황체가 보이기 시작하고 황체가 있으면 PGF 치료 효과가 더 좋음. 발정 후 48시간까지 한쪽 자궁각에 액체가 남아 초기 임신으로 오인될 수 있으니 황체·수정 기록을 확인함.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">7.</span><span>태반 정체. 정상 배출 0.5~12시간(평균 8시간). 발생률 10% 넘으면 분만·건유기 영양 점검. 수기 제거는 권장하지 않음(내독소 흡수·내막 손상), 경관 확장 시도 금지, 72시간까지 발열·식욕부진 없으면 검사도 미룸. 전신 항생제는 39.5℃ 초과·식욕부진일 때만, 세프티오퍼 선호. 자궁 내 항생제 일괄 투여·에스트로겐은 근거 부족, PGF 효과 불확실, 옥시토신 소량 반복은 근거 있음.</span></p><p class="bx-num"><span class="bxn">8.</span><span>옥시토신 제제의 적응은 진통 미약, 자궁 탈출, 미라 변성 태아 배출, 사유 촉진, 태반 정체이고 소 용량은 1회 20~150IU(정맥·근육·피하)임. 태반은 보통 분만 후 3~8시간 내 배출되며 12시간이 지나도 안 나오면 태반 정체로 진단함. 유우 발병률 7~15%이고 이후 자궁 복구 지연·자궁염·케토시스·자궁내막염 위험이 오름.</span></p><p class="bx-num"><span class="bxn">9.</span><span>OT의 태반 정체 예방 효과는 보고마다 다름. Mollo(분만 직후 + 2~4시간 후 30IU 근주)는 발병률 저하와 번식 성적 향상을 보였지만 Miller(20IU)·Palomares(30IU 2회)는 효과가 없었음. 대조군 발병률이 24.6%, 12.0%, 3.1%로 달라 원래 발병률이 높은 우군에서만 효과가 나는 것으로 추측됨.</span></p><p class="bx-num"><span class="bxn">10.</span><span>Magata는 2산 이상 유우에서 분만 3시간 후 태반 미배출우에 OT 50IU를 근주했음. 대조군 발병률은 자연분만 17.9%, 분만보조 35.7%였고, OT는 분만 보조를 받은 소에서 태반 정체를 더 억제했으며 초회 수태율·공태일수·분만 후 120일 임신율도 개선했음. 우군 발병률이 높을 때, 분만 보조를 한 소에 OT가 효과적일 가능성이 높음.</span></p><p class="bx-num"><span class="bxn">11.</span><span>산욕성 자궁염 치료. 자궁염 평균 20%(젖소). 독성 산욕성 자궁염은 분만 1주 내 39.5℃ 초과·이완 비대 자궁·악취 적갈색 수양성 배출·독혈증. 전신 항생제: 세프티오퍼 1mg/kg 5일(HCl 2.2mg/kg), CCFA 6.6mg/kg 귓바퀴 1회는 단독 불충분해 72시간 후 반대 귀 2회차, 페니실린 22,000IU/kg 5일, 암피실린 11mg/kg 5일. 옥시테트라사이클린은 자궁 농도가 MIC의 1/3이라 비권장. 자궁 세척은 독소 흡수·파열 위험으로 비권장, 옥시토신·ECP·PGF 예방 효과 없음.</span></p><p class="bx-num"><span class="bxn">12.</span><span>자궁내막염·축농증. 자궁내막염은 21일 이전 진단하지 않음. 임상형은 21일 이후 PVD(농 50% 이상). 세포검사 역치는 28~35일 PMN 18%, 35일 이후 10%. 치료는 세파피린 640mg 자궁 내(28~42일 투여로 초회 수태율 8~15%p 상승), 황체기면 PGF 후 3일째 주입. PGF 단독은 메타분석에서 성적 개선 없음. 자궁축농증은 2% 미만, PGF 1회에 대부분 반응, 15~20%는 재치료, 14일 간격 2회가 실무, 치유 후 65% 수태(평균 2.2회).</span></p><p class="bx-num"><span class="bxn">13.</span><span>자궁 감염 진단법 민감도. 직장 촉진 22%(평가 불가), 질경·장갑 질검사·메트리체크 60~80%(전정에 액체 없으면 위음성), 세포검사 95%(현장 불가), 초음파 94%. 메트리체크는 질경·장갑보다 10~17% 더 찾아내고, 검사를 28~30일로 늦추면 위양성이 줆. 수기 검사는 잠재성 자궁내막염을 거의 못 잡고 축농증과 점액자궁증을 구별 못 함.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">14.</span><span>분만 후 난소는 4~5일경 첫 난포파를 시작해, 우성 난포가 평균 11.6일에 출현하고 첫 배란이 평균 27.4일에 일어난다(개체 차가 크다). 빠른 소는 분만 후 14일 전후 배란해 21일까지 황체를 만들고, 늦은 소는 우성 난포의 발육·폐쇄를 몇 차례 반복한 뒤에야 배란한다. 무엇이 이 차이를 만드나 — 배란하려면 난포가 충분한 E2를 내 LH 서지를 일으켜야 하고, 그러려면 에너지원인 혈당(글루코스), 호르몬 원료인 콜레스테롤, 간에서 나오는 IGF-1이 난포에 충분히 공급돼야 한다. 그런데 고산유우는 간 부하가 크고 글루코스가 유선으로 우선 배분돼 난포로 갈 몫이 줄어 배란·발정 재개가 늦어진다. 그래서 첫 배란이 빠른 소는 분만 전후 대사·간 기능이 좋고 유량이 낮은 경향을 보인다. (한 농장 데이터: 평균 일유량 38kg에서 분만 후 60일까지 68.8%가 배란·주기 재개.)</span></p><p class="bx-num"><span class="bxn">15.</span><span>뇌하수체 LH 비축분이 보충되면 정상 LH 박동성이 회복돼 더 많은 에스트라디올을 만드는 우성 난포가 성장·확립된다. 우성 난포의 높은 에스트라디올이 LH 급증을 유발해 첫 배란이 일어난다. 첫 배란이 주기성 재개를 알리지만, 모든 암소가 첫 배란 후 정상 주기를 재개하진 않고 일부는 무발정으로 돌아갈 수 있다.</span></p><p class="bx-num"><span class="bxn">16.</span><span>젖소 분만~첫 배란은 평균 21일이고 초산 31.8일 vs 경산 17.3일임. 첫 배란 후 다음 배란까지 간격은 젖소의 약 25%에서 짧고(평균 11.2일) 25%는 정상(20.6일), 50%는 오히려 김(30.0일). 짧은 주기는 짧은 황체기·작은 황체·낮은 P4와 연관되며, 내막 P4 수용체 감소·옥시토신 수용체 증가로 PGF2α가 조기 방출되는 탓임. 분만 후 첫 30일의 단명 황체기(저수준 P4 상승)가 시상하부–뇌하수체–난소–자궁 축 전체를 priming하는 양성 조절자 역할을 함.</span></p><p class="bx-num"><span class="bxn">17.</span><span>젖소 무발정 유병률은 무리마다 크게 다르나, 선택적 대기 기간 종료(분만 후 60~80일) 시 전형적으로 10~30%이며 개별 무리에선 최대 59%까지 보고됐다. 캐나다 23개 무리 연구(637두 유중 P4 주 2회)에서 배란을 시사하는 첫 P4 상승까지 분만 후 평균 간격은 32.0±0.7일이었다.</span></p><p class="bx-num"><span class="bxn">18.</span><span>첫 배란의 89%는 발정 없이 온다 : 난소 주기가 회복돼도 발정 징후가 안 보일 수 있다 — 첫 배란의 89%가 무발정 배란이다. 기전은 이렇다: 배란을 일으킬 만큼 LH는 나오지만, 발정 행동을 켜는 데 필요한 E2 농도엔 못 미쳐 "배란은 되는데 발정만 없는" 둔성 발정이 된다(고비유우는 E2의 발정 발현 작용이 더 약하다). 무발정 비율은 배란을 거듭하며 2회 ~35%, 3회 ~15%, 5회 이후 7%로 낮아진다. 또 첫 배란 뒤 다음 배란이 21일이 아니라 10일 전후로 짧게 올 수 있어(첫 황체가 작고 단명) 주기를 추적해야 한다.</span></p><p class="bx-num"><span class="bxn">19.</span><span>첫 배란은 조용하다 : 분만 후 첫 배란은 뚜렷한 발정이 선행하는 경우가 드물어 젖소의 단 10~13%만 첫 배란 전 승가허용 발정을 보인다 — 이 비율은 둘째·셋째 주기에서 유의하게 증가하고, 저생산 암소에서 첫 배란 시 발견 비율이 더 높다. 하루 3~4회 전담 관찰 + 이차 징후(턱 얹기·외음부 냄새·핥기·뒤따르기·부분 승가)를 보면 발견 확률이 오른다. '미관찰 발정으로 인한 무발정'과 '진성 무발정'을 구별하는 것이 매우 중요하다.</span></p><p class="bx-num"><span class="bxn">20.</span><span>분만 후 60일 함정 : 분만 1개월경 발정을 보이다 60일 이후 사라지는 경우가 있다. 유량이 급증하면서 에너지 밸런스가 가장 마이너스가 되는 시기가 분만 후 60일 무렵이라, 이때 발정 징후가 약해지기 때문이다. 음의 에너지 밸런스가 개선되면 발정이 다시 나타나지만, 에너지 부족이 더 심해지면 배란 자체가 멈추는 "발정 주기 정지"에 빠진다. 즉 발정이 사라진 게 아니라 에너지가 발목을 잡은 것 → 사양 관리 개선이 답이다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">21.</span><span>분만 후 무발정(postpartum anestrus)은 분만 후 수 주 동안, 흔히 자발적(선택적) 대기 기간이 끝날 때까지 발정이 관찰·보고되지 않은 상태다. 분만 직후의 짧은 난소 비활성기는 정상이지만, 젖소처럼 포유시키지 않는 소에서 무발정이 연장되면 적시 임신 재성립에 부정적이다. 소의 무발정은 1920년대에 번식 문제로 처음 보고됐고, 지금도 임상수의사·농가 모두에게 난제다.</span></p><p class="bx-num"><span class="bxn">22.</span><span>임성과 도태 : 현대 젖소의 최적 이하 임성은 전 세계 낙농의 문제이고, 번식 실패는 흔히 도태의 일차 이유다. 한 번도 수정되지 않은 암소의 도태 위험은 최소 한 번 수정된 경우보다 10배 높았다 — 과거 이력으로 교배하지 않기로 한 관리 결정도, 무발정 자체도 이 위험을 높일 수 있어, 발정 암소를 발견해 적시에 교배하는 것이 중요하다.</span></p><p class="bx-num"><span class="bxn">23.</span><span>황체 활동 개시 누적 비율 (Herd Navigator, 748두)<span class="hang">분만 후 4주: 27%</span><span class="hang">5주: 53%</span><span class="hang">6주: 68%</span><span class="hang">7주: 77%</span><span class="hang">8주: 84%</span><span class="hang">9주: 89% — 약 90%가 선택적 대기 종료 시점(9주)까지 주기 개시</span><span class="hang">단 분만 후 '초기'에 주기 개시한 암소가 첫 수정 P/AI가 더 높음</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>산차의 영향 : 분만 후 28일 이후 황체 활동을 개시한 비율은 경산우보다 초산우에서 높았고(79.1 vs 68.6%), 비유 후기에 63일을 넘겨 무주기로 남은 비율도 초산우에서 높았다(13.1 vs 8.3%). 무발정의 가장 큰 영향은 분만~수태 간격 연장 → 분만 간격 연장이다 — 장기 무주기로 수태가 지연되는 암소는 흔히 비수익적이라 도태 후보가 된다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">25.</span><span>임신 중 순환 P4·에스트로겐이 높게 유지돼 시상하부-뇌하수체 축을 억제한다. 임신 후기 말초 P4는 황체기 중기보다 크게 높지 않으나, 순환 에스트로겐은 임신 약 60일부터 점진 증가해 분만 직전 며칠에 50~1000배 높아진다. 고농도 에스트라디올에 장기 노출되면 시상하부 GnRH 분비가 억제돼 LH 합성에 부정적이고, 뇌하수체 LH 비축분이 점진적으로 고갈된다 — LH 방출 기전 자체는 온전하나 박동성 GnRH 분비가 없는 게 문제다.</span></p><p class="bx-num"><span class="bxn">26.</span><span>임신 후기 1/3의 태반 E2가 LH α·β 소단위 합성을 번역 후 수준에서 억제해 LH 저장을 고갈시킴. FSH 함량·저장은 분만 후 변화 없음. 사료 제한 실험에서 주당 체중 1% 손실 사료의 비비유 육우는 26주 후 무발정(초기 체중 24% 손실)이 됐고 유지 160% 사료 복귀 후 약 9주 만에 주기가 재개됐으며 LH 박동 빈도 감소가 동반됐음.</span></p><p class="bx-num"><span class="bxn">27.</span><span>FSH와 난포파 : LH와 달리 임신 후기 FSH 변화는 덜 두드러진다 — 평균 FSH는 분만 전후 차이가 없으나, 며칠마다 일어나던 FSH 급증·하강이 분만 직전 마지막 몇 주간 없거나 느려져 난포파 출현도 분만 전 마지막 30일간 없다. 저용량 GnRH를 잦은 간격(1~2시간)으로 주사하면 박동성 LH를 회복시킬 수 있으나 모든 암소가 반응하진 않아, GnRH 억제가 무발정의 유일한 기전은 아닌 것으로 본다.</span></p><p class="bx-num"><span class="bxn">28.</span><span>분만이 다가오면 P4가 점진 감소하고 에스트로겐은 분만 직전 24시간 정점에 이른다. 순환 에스트로겐은 거의 전부 태반 기원이라 수정란 배출 후 급락해 분만 후 하루 이내 기저에 이른다. P4·에스트라디올이 사라지면 시상하부-뇌하수체 축이 억제에서 '해방'돼 GnRH 박동 발생기가 회복되고, 박동성 GnRH가 정상 FSH 양상을 회복시킨다 — 정상 FSH 급증은 분만 후 3일 이내 재개돼 난포파 출현을 유발한다.</span></p><p class="bx-num"><span class="bxn">29.</span><span>난포 성장의 호르몬 의존성<span class="hang">초기 단계: 성선자극호르몬 비의존적</span><span class="hang">4~9mm 난포 성장: FSH 지지 필요</span><span class="hang">9mm 초과 지속 성장: LH 박동 필수</span><span class="hang">분만 후 초기 LH 박동은 매우 낮음(4시간당 1회 미만) → GnRH 박동성 증가로 시간당 1~2회로</span><span class="hang">뇌하수체 LH 재축적은 3주 이상 걸릴 수 있음</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>키스펩틴 : 분만 후 초기에 외인성 GnRH·에스트라디올을 줘도 LH 비축분 부족으로 방출이 줄고 생물활성도 낮다. 키스펩틴(kisspeptin)은 시상하부에서 GnRH 합성을 통제하고 LH 방출에 영향을 주는 신경내분비 조절자로, 무발정 암양에서 배란을 유도했고 GnRH·LH 반응이 주기 암양보다 컸다. 소의 분만 후 무발정 종료에서의 직접 역할은 거의 알려지지 않았으나, 임신 유발 무발정 후 주기성 재개에 핵심 역할을 시사하는 증거가 있다. (첫 우성 난포의 운명: ① 배란→CL 형성, ② 무배란→낭종성 난포, ③ 퇴행→새 우성 난포로 교체.)</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>출현(~4mm)·편차(deviation, ~9mm)·배란(10~20mm)의 세 직경에 근거해 무배란 상태를 I~IV형으로 분류한다(Peter 등).</span></p><p class="bx-num"><span class="bxn">32.</span><span>무발정 I~IV형<span class="hang">I형: 난포가 출현까지 자라나 편차 없음(우성 선택 안 됨) — 극심한 영양실조 추정, '비활성/매끈한 난소'(이스라엘 7751비유에서 8.5%). 잘 사양된 북미 젖소엔 드묾</span><span class="hang">II형: 편차·성장 후 우성 난포가 퇴행 → 2~3일 후 새 난포파(최대 9차례 보고). 결국 첫 배란 전 난포파가 순차 출현</span><span class="hang">III형: 우성 난포가 배란 실패 → 무배란 난포로 머물거나 낭종성 난포로 발달(낭종은 H-P축 되먹임 교란이 있어 무배란 난포와 구별; LH 박동·진폭·평균 농도·에스트라디올 모두 높음)</span><span class="hang">IV형: 배란해 CL 형성하나 적시 황체용해가 없어 황체기 연장(황체 잔존) — 황체용해 시점에 에스트로겐성 우성 난포가 없는 비정상 난포 양상이 원인</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>P4 프로파일 분류 (Opsomer, 334두)<span class="hang">정상 51%: 분만 후 50일 이전 첫 P4 상승·규칙적 주기</span><span class="hang">주기성 지연 21.5%: 분만 후 첫 50일 무발정, 일관되게 낮은 P4</span><span class="hang">황체기 연장 21.5%: 선행 수정 없이 P4가 20일 초과 상승 유지</span><span class="hang">주기 중단 4%: 정상 주기가 최소 14일 낮은 P4로 중단</span><span class="hang">짧은 황체기 0.5% / 불규칙 1.5%</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">34.</span><span>무발정 원인은 흔히 다요인적이고 생리·영양·관리·환경·병리로 분류된다. 수많은 요인 중 '포유'와 '영양(음에너지 균형)'이 가장 중요하다.</span></p><p class="bx-num"><span class="bxn">35.</span><span>포유·산차·산유 : 포유는 박동성 LH 분비를 억제해 배란을 지연시킨다 — 육우 무발정의 주요 요인이나 젖소는 출생 직후 분리해 일반적으로 원인으로 보지 않는다(단 실험적으로 포유 젖소는 첫 발정까지 5~9주 길었고 LH 박동 빈도 60%·진폭 40% 감소). 산차: 초산우는 첫 배란 지연으로, 4산 이상 경산우는 황체기 연장(자궁 복구 지연→자궁축농증·황체 잔존)으로 위험↑. 산유량: 고산유를 위험으로 본 연구도, 아닌 연구도 — 고산유 자체보다 음에너지 균형이 유력(305일 산유 5000~9500kg에서 100kg↑마다 무배란 2%↓, 9500 초과는 무변화).</span></p><p class="bx-num"><span class="bxn">36.</span><span>포유 억제. 무배란 기간을 줄이려면 포유를 하루 1회 이하로 줄여야 함. 좋은 BCS 성숙 육우의 포유 무배란은 평균 60~70일임. 포유는 pulse 수가 아니라 GnRH pulse 진폭을 둔화시켜 LH를 억제함. 유두 촉각 자극·프로락틴·코르티솔은 기전이 아니고, 어미가 시각·후각으로 송아지를 자기 것으로 인식해야 억제가 유지됨(남의 송아지 포유 시 2~6일 내 배란). 분만 후 30일까지 GnRH 자극 LH 방출은 포유우가 이유우보다 큼(이유우는 2주 내 pulse 급증으로 저장 소진). 분만 시 저BCS·산후 영양실조는 포유와 상호작용해 악화됨.</span></p><p class="bx-num"><span class="bxn">37.</span><span>사회적·화학적 신호·품종 : 육우에서 수소 존재는 분만~주기 재개 간격을 유의하게 줄이고, 분만 후 초기 수소 노출은 무발정 젖소 LH 방출에 급성 효과가 있었다. 발정 암소나 그 자궁경 점액 노출도 특히 무발정이 연장된 암소에서 무발정 기간을 단축할 수 있다. 분만~황체 활동 개시 간격에 품종·유형(유전) 차이도 보고됐다.</span></p><p class="bx-num"><span class="bxn">38.</span><span>음에너지 균형(NEB)을 부르는 부족한 건물(에너지) 섭취가 젖소 무발정의 중요 요인이다. 분만 직후 산유 요구로 에너지 수요가 급증해 암소를 이화대사로 내모는데, 반추위 물리적 충만이 분만 후 초기 최대 건물 섭취를 제한한다. 게다가 고산유로 선발된 암소(북미 홀스타인)는 가용 영양을 체형을 희생하며 산유에 선택적으로 쓴다 — 가용 포도당이 모두 우유 합성에 우선 쓰여 이화 상태에서 못 벗어난다. 그 결과 분만 후 10~12주까지 NEB가 이어진다.</span></p><p class="bx-num"><span class="bxn">39.</span><span>NEB의 내분비 사슬 : NEB 젖소는 인슐린·IGF-1이 낮다. 낮은 IGF-1 → GH 음성 되먹임 감소 → GH↑ → 간 포도당신생합성↑·지방분해↑(NEFA 방출). 높은 GH·NEFA는 인슐린 작용을 길항해 인슐린 저항을 만들어 비유방 조직 포도당 이용을 줄이고 우유용 포도당을 보존한다. NEB는 LH 박동 빈도 감소 + 낮은 혈당·인슐린·IGF-1을 통해 우성 난포의 에스트로겐 생성을 제한 → LH 급증에 필요한 에스트로겐을 줄여 배란을 지연시킨다.</span></p><p class="bx-num"><span class="bxn">40.</span><span>건물 섭취를 줄이는 간접 원인<span class="hang">높은 사육 밀도(사료 경쟁↑)</span><span class="hang">자주 일어나 먹기 꺼리게 하는 부실한 칸막이 설계</span><span class="hang">지속적 사료 접근을 막는 물리적 장벽</span><span class="hang">드문 사료 밀어주기</span><span class="hang">먼저 도달한 암소의 과도한 선별</span><span class="hang">부실한 발굽 관리로 인한 높은 파행 유병률</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>관리·환경 요인<span class="hang">이전 건유 기간: 77일보다 길면 무발정·배란 지연 위험 거의 3배(건유 없이 사양 시 분만~첫 배란 13.2일 vs 56일 건유 31.9일)</span><span class="hang">착유 빈도: 2→3·4회로 늘리면 첫 배란까지 1주 미만 길어짐(사소한 요인)</span><span class="hang">발정 발견 효율: 부실하면 미관찰 발정으로 무발정 악화</span><span class="hang">사료·급이 관리: 부족한 건물 섭취가 NEB 진입의 주요 이유 — 입자 크기·급이 빈도·그룹화·사료대 관리·과밀 회피</span><span class="hang">분만 계절: 겨울 분만이 여름보다 주기 재개 지연(광주기 역할)</span><span class="hang">날씨: 고온다습은 발정 발현↓ → 미약·무징후발정</span><span class="hang">사회 서열·밀도: 하위 암소가 선별 후 부실 사료 → NEB↑</span><span class="hang">수용 유형: 집약·계류식이 무발정 위험↑(활동 변화 못 나타냄)</span><span class="hang">누설 전류: 사료 섭취 저해</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>병리적 요인<span class="hang">자궁 염증: 급성 자궁염·세균 오염은 주기 재개 지연(PMN 높으면 첫 배란 45 vs 32일)</span><span class="hang">황체 잔존: 자궁 감염 시 황체기 연장으로 무발정 위험↑(감염 없어도 30일 초과 연장 보고)</span><span class="hang">낭종성 난포(COF): 흔히 무발정·무배란, LH 박동성 증가</span><span class="hang">분만 장애(난산·쌍태·후산정체), 대사 장애(케토시스·4위전위), 파행, 유방염</span><span class="hang">폐렴: 분만 후 첫 달 발생 시 난소 활동 재개 지연 위험 5.4배</span><span class="hang">파행+유방염, 파행+심한 스트레스 동반 시 위험 훨씬 큼</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>분만 후 21일 이내 질병이 있으면 그 유기 내내 번식 성적이 떨어짐(5,085두). 305일 도태율은 유방염·제병 등 비자궁 질환 45.2%, 자궁 질환 31.8%임. 다음 분만까지 이어지는 비율은 자궁 질환우 56.6%, 자궁+비자궁 질환우 47.6%임. 자궁염·태반정체는 치유돼도 그 유기 성적이 나쁠 가능성이 크고 발열 없이 이상 배출물만 있는 잠재 환자도 포함됨.</span></p><p class="bx-num"><span class="bxn">44.</span><span>분만 첫 주→산유 정점까지 산유 증가율이 무배란우에서 더 커 증가율 자체가 위험 인자임. 분만 25일 PMN 높은 자궁 염증우는 첫 배란 지연(45 vs 32일)뿐 아니라 분만 후 270일 누적 임신율도 낮은 경향임(58 vs 80%). 미근부 분필을 완전히 지우는 승가 허용 발정은 분만 후 9~12주 발정우의 50%만 보이므로 분필이 남아도 무발정 가능성일 뿐 확정이 아님. Herd Navigator 유중 P4로 수정 41일 후 임신 판정 시 95% 넘는 정확도가 가능함.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">45.</span><span>미관찰 발정은 흔히 무발정의 주요 기여 요인이다 — 무발정으로 간주된 많은 암소가 사실은 정상 주기를 돌면서도 발정으로 관찰·보고되지 않는다. 두 범주: '미약발정(subestrus)'은 발정 행동이 부실해(짧고 약함) 놓치는 경우, '무징후발정(silent estrus)'은 뚜렷한 징후를 전혀 안 보이는 경우다. 둘 다 자발 배란·CL 형성이 가능하나 관찰 안 돼 무발정으로 잘못 분류된다.</span></p><p class="bx-num"><span class="bxn">46.</span><span>임신을 먼저 배제 : 암소가 무발정인 일차적 생리 이유는 임신에 의한 주기성 중단이다. 교배 기록 갱신 시 숫자 전위 같은 입력 오류로 수정우를 미수정으로 잘못 식별해 '깜짝 임신'으로 인한 무발정이 가끔 생긴다 — 번식 검사 시 항상 임신을 먼저 배제한다.</span></p><p class="bx-num"><span class="bxn">47.</span><span>관리 방안을 짜기 전에 무리 수준 유병률을 평가한다. 무발정 육우는 치료하면 정상 임성으로 회복할 수 있으나, 무발정 젖소는 동반된 NEB 때문에 훨씬 낮은 임성을 보인다 — 첫 수정 전에 양에너지 균형으로 되돌리도록 모든 노력을 기울인다.</span></p><p class="bx-num"><span class="bxn">48.</span><span>진단·영향 최소화 전략<span class="hang">BCS 평가: 클로즈업 건유우(&gt;3.5는 대사장애·무발정 고위험)·신선우·교배군 주목. 비유 60일 넘긴 부실 체형(&lt;3.0) 과다도 문제 → 역치 도달까지 교배 보류. 급성 체형 손실이 절대 BCS보다 임성에 더 해로움</span><span class="hang">보행 점수: 파행 조기 식별, 정기 발굽 손질·족욕(파행 암소는 사료 접근 동기 약화 → NEB)</span><span class="hang">발정 발견 개선: 미근부 분필/페인트(3색으로 신선우·대기종료·기수정 구분), 대기 종료 30~40일 전 칠하고 매일 기록·주 1회 갱신</span><span class="hang">초음파: 분만 후 5~6주 검사가 P/AI 저하 위험 식별에 가치(7~14일 간격 2회 연속이 이상적, TAI 개시 시 1회로도 가능)</span><span class="hang">유중 P4 모니터링: Herd Navigator가 발정의 95%+ 검출(무징후 포함), 임신·낭종 발견에도 유용(단 DeLaval 전용·고가)</span><span class="hang">혈중 대사물: NEFA·BHBA(분만 첫 주 잠재성 케토시스)·낮은 혈당·IGF-1으로 조기 식별</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>발정 발견율 저하 원인은 발정은 정상인데 놓침, 미약 발정, 발견했으나 AI 못 함, AI 후 주기 연장으로 예측 시기 이탈임. 앞 둘은 관찰 시간·횟수 증가, 테일페인트·만보계, 고온·미끄러운 바닥 대책, 동기화로, 뒤 둘은 번식 개시기 영양·초회 수정 시기 재검토, 자궁내막염 평가, 분만 상황·유량·BCS 평가로 대응함.</span></p><p class="bx-num"><span class="bxn">50.</span><span>무리 전체 접근 : 개별 사례 관리도 의미 있으나 무리 전체 접근이 흔히 더 유익하다 — 칸막이 편안함·설계 평가를 위해 소를 방해하지 않고 축사를 둘러보고, 번식 관리 관행을 파악하며 발정 발견·AI 인력과 정기 대화한다. 전자 발정 발견 시스템은 위양성(정액·노동 낭비)·위음성(놓친 교배)을 최소화하도록 무리에 맞게 최적화하고, 특히 새로 설치된 무리에서 전적 의존은 지양한다.</span></p><p class="bx-num"><span class="bxn">51.</span><span><b class="rb-label">검진 대상우 5</b> ① 프레쉬 체크(분만 후 30~40일, 자궁 평가) ② 이상 분비물우(자궁내막염) ③ VWP 경과 무발정우(무배란/둔성발정/발견실패) ④ 리피트 브리더(150일↑ 미수태 or AI 3회 실패) ⑤ 임신 감정(AI 후 25일↑ 무발정 — 직장검사 35일·초음파 26일, 60일 재감정).</span></p><p class="bx-num"><span class="bxn">52.</span><span>방문별 검사 항목. 분만 후 15~30일 자궁 복구·자궁염 확인, 30~60일 자궁·난포파·비임신 확인(낭종 유형 구분), 28~30일부터 임신 진단, 60~80일 임신 확인·성별임. 전환기는 분만 전후 21일이고 분만 전 DMI가 좋을수록 분만 후 DMI도 좋음. DMI는 초산우와 BCS 4 이상 비만우에서 낮고 DMI 정점은 산유 정점 뒤에 와 그 사이가 NEB임. 번식 지연 비용 예로 100두 군에서 비유 175일 평균 32.4L/일 vs 210일 이후 30.5L/일, 소당 1.9L/일 차이가 순전히 번식 지연 비용임.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>영양-번식 상호작용은 복잡해 특정 영양소의 난소 효과를 정확히 연구하기 어렵다. 클로즈업 건유기의 과도한 에너지 섭취는 분만 직전 건물 섭취 감소·높은 NEFA에 취약하게 하므로 클로즈업 건유우 사료 섭취 모니터링이 중요하다.</span></p><p class="bx-num"><span class="bxn">54.</span><span>무발정을 줄이는 영양 개입<span class="hang">분만 후 고전분 사료 / 모노프로필렌글리콜 매일 경구</span><span class="hang">분만 전 전분 / 리놀레산·리놀렌산 풍부 유지종자 → 첫 배란까지 간격 단축</span><span class="hang">건유기 에너지 제한(요구량 80%)이 160% 급여보다 분만 후 NEFA↓·건물 섭취↑</span><span class="hang">단 결과는 가변적이고 상업 환경에서 항상 실용·경제적이진 않음</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>프로게스테론(IVPD) : 분만 후 짧은 고프로게스테론 노출은 발정 발현·정상 황체 기능 확립에 중요하다. 무발정 암소를 P4로 치료하면 배란 전 난포의 LH 박동·에스트라디올·LH 수용체가 증가한다. 요법: 질내 P4 기구(IVPD) 7~9일 삽입→제거→발정 시 수정. PRID(P4 1.55g) 7일 후 71%에서 주기 유도(대조 40%). 무리 치료엔 미약·미관찰 발정의 황체용해 보장 위해 제거 시 PGF2α 병용 권장. 미국 IVPD: CIDR 1380(1.38g)·PRID-Delta(1.55g), 우유 휴약 없음. (경구 프로게스타겐 MGA는 도축용 육우 후보우 외 미승인.)</span></p><p class="bx-num"><span class="bxn">56.</span><span>에스트라디올 : 에스트라디올 단독은 배란 반응이 가변적이라 권장 안 됨. P4 사전 노출이 없으면 발정·배란을 유도해도 황체기가 짧다. 7일 P4 후 에스트라디올 유도법(CIDR 6일→제거 24시간 후 EB 1mg → 87% 발정·P/AI 42%)은 뉴질랜드에서 널리 쓰였으나, 미국엔 소 승인 주사용 에스트라디올 제제가 없다. 식용동물 에스트로겐 우려를 감안하면 대안 제품이 현명하다.</span></p><p class="bx-num"><span class="bxn">57.</span><span>GnRH 단독 : 외인성 GnRH는 분만 후 첫 주에도 LH 방출을 유도하나 반응은 둘째 주에 유의하게 높다. 우성·LH 반응성 난포가 있고 그 난포가 P4에 노출 안 됐다면 배란 확률이 높다(분만 둘째 주 GnRH 100μg에 5두 중 4두 배란). 단 P4 사전 노출 없는 무발정 암소의 배란 유도는 짧은 황체기를 초래해 무발정 회귀를 높일 수 있다 — 한 연구에서 108두 중 93두(86%)가 배란했으나 그중 20%가 무발정으로 회귀. GnRH 단독의 단점이다.</span></p><p class="bx-num"><span class="bxn">58.</span><span>Ovsynch/TAI — 무발정 P/AI (표 34.2)<span class="hang">GnRH+PGF2α 병용 TAI는 무발정 관리에 효과적, P/AI는 주기 대조보다 낮으나 수용 가능</span><span class="hang">Moreira: 무발정 18.2%(24) vs 주기 39.0%(303)</span><span class="hang">Stevenson: 24.1%(116) vs 38.0%(799)</span><span class="hang">Öztürk: 23.1%(26) vs 32.8%(58)</span><span class="hang">첫 GnRH에 반응해 배란한 무발정 암소 P/AI는 배란 실패보다 크게 높음(46 vs 6%) → 초음파로 첫 GnRH 배란 반응 판정이 가치</span><span class="hang">돼지 LH로 둘째 GnRH 대체 시 P/AI 14%p↑(42 vs 28%), 첫 GnRH 대체 시 배란 반응↑(62 vs 44%)</span><span class="hang">더블-Ovsynch가 무주기 배란 유도에 매우 효과적 — 특히 초산우 P/AI 개선</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>Ovsynch + IVPD (표 34.3)<span class="hang">Ovsynch 첫 7일 IVPD 삽입 무발정 암소는 IVPD 없는 무발정보다 P/AI↑, IVPD 없는 주기 암소와 비슷</span><span class="hang">Stevenson: 무발정 IVPD없음 24.1% vs IVPD있음 32.3%</span><span class="hang">McDougall: 33.9% vs 45.7%</span><span class="hang">Colazo: 21.8% vs 34.6%</span><span class="hang">뉴질랜드 현장(12무리 1662두): Ovsynch+IVPD가 가장 비용 효율적, 두당 NZ$80.40 최고 순이익</span><span class="hang">메타분석(21연구 13,762두): CL 없는 암소에 P4 보충 시 32일 P/AI 14%↑·60일 16%↑</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>eCG·낭종·교배 후 : eCG: 프로게스테론 기반 프로토콜에 추가 시 유익 — GnRH+6~7일 IVPD 후 제거 시 PGF2α+eCG 400IU로 첫 수정 P/AI 5.4%p↑(36.0 vs 30.6%). eCG는 우성·배란 전 난포 발달·배란율을 개선해 CL 질·배아 생존에 긍정적. 낭종성 난포: Ovsynch/TAI가 성공적으로 쓰였으나 P4 기구를 더해도 임신은 개선 안 됨(표 34.4 — 첫 GnRH 후 새 난포 발달 93~100%, TAI 32일 임신 약 41%). 교배 후: AI 4.5일 후 7일 PRID는 임신 손실 감소 경향(5.6 vs 33.3%), TAI 5일 후 GnRH는 P/AI↑(45.5 vs 31.1%).</span></p><p class="bx-num"><span class="bxn">61.</span><span>발정 발견이 부실하고 미관찰 발정(미약·무징후)이 무발정의 주된 의심 원인인 무리에선 PGF2α 투여 후 집중 발정 발견이 꽤 효과적임. CIDR 6일→제거 24시간 후 EB 1mg 요법은 발정 발견우의 79%가 배란함. Ovsynch/TAI 무발정 vs 주기우 P/AI는 24.4 vs 30.8%, 21.8 vs 32.0%로 유의차가 없었고 무발정 단독 30.1% 보고도 있음. 12무리 1,906두 무발정 연구에서 IVPD 포함 프로토콜에 eCG를 더하면 P/AI 최대 7%p 오르고, 교배 시 분만 후 60일 넘으면 IVPD+eCG가 P/AI·28일 임신율을 모두 개선함.</span></p><p class="bx-num"><span class="bxn">62.</span><span>정상체온(&lt;39.1℃) 무발정 암소는 AI 전 PGF 보충 시 P/AI가 고체온(&gt;39.1℃)보다 높았다(38.8 vs 13.3%) — 보충 PGF로 LH 급증 지속·배란 전 난포 크기·난포내 에스트라디올이 더 컸다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>검진 빈도: 3주 간격 절대 금지 : 보통 2주 간격(대규모 1주, 소규모 4주). 3주(=21일=발정주기)는 매번 같은 주기 같은 타이밍의 소만 보게 돼 평가가 불가능해진다.</span></p><p class="bx-num"><span class="bxn">64.</span><span>세 가지 기본 전략<span class="hang">적기까지 초회 AI (VWP 후 21일 이내 모든 대상우 AI)</span><span class="hang">발정 발견율 올리기 (관찰 시간·테일페인트·만보계·동기화)</span><span class="hang">수태율 올리기 (적기 AI·정액 취급·환경 냉각·BCS)</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>농장 유형별 전략. I 자연발정 발견·AI 후 21일 내 미수정우에 동기화(발견율·수태율 높은 농장), II VWP 경과 미수정우에 발정 동기화 후 발견·AI(발견율 낮지만 유도 발정 수태율 높은 농장), III VWP 후 10일 내 미수정우에 배란 동기화(유도 발정 수태율 낮은 농장), IV VWP 전후부터 전두수 정시 AI(발견율 낮거나 노동력 절감 농장). 번식성·노동력·호르몬 비용의 균형점을 찾음.</span></p><p class="bx-num"><span class="bxn">66.</span><span><b class="rb-label">발정 발견율</b> 수정 대상우 대비 발정을 발견한 비율. 과거 21일 기준 평가. 못 찾으면 수정 자체 불가 → 가장 기본.</span></p><p class="bx-num"><span class="bxn">67.</span><span><b class="rb-label">수태율</b> 수정한 소 대비 수태된 비율. &lt;20%면 수정 기술·타이밍·사양 관리 재검토.</span></p><p class="bx-num"><span class="bxn">68.</span><span><b class="rb-label">공태 일수</b> 분만~수태 일수. 이해는 쉽지만 임신우만 반영 → 농장 전체 임신우 비율과 함께 본다. 평균 130일인 두 농장도 200일 이상 불수태우 비율이 20%와 50%면 성적이 다르다.</span></p><p class="bx-num"><span class="bxn">69.</span><span><b class="rb-label">임신율</b> 수정률 × 수태율. 실시간·실제적 지표. 목표 21%는 발정 발견율 70%·수태율 30%로 달성된다. 전체 임신율 외에 분만 후 20~30일 구간별 임신율도 봐 어느 시기가 걸림돌인지 찾는다.</span></p><p class="bx-num"><span class="bxn">70.</span><span><b class="rb-label">VWP</b> 분만 후 수정하지 않는 자발적 대기 기간. "이 기간이 지나면 21일 안에 반드시 발견·수정한다"는 농장 전략이다. 보통 60일(고능력우 70~80일, 회복 빠른 우군 50일). 분만 후 며칠부터 충분한 수태율이 나오는지 보고 농장별로 정한다.</span></p><p class="bx-num"><span class="bxn">71.</span><span>수태율 저하 요인은 적기 AI 실패, AI 기법 문제(동결정액 취급·위생), 고온·유방염·제병(유방염은 치료 후에도 수태율이 낮게 감. 고온 대책은 환경 냉각·중조 첨가·급여 시간 변경), 영양 장애(검유 성적·BCS·털 윤기·섭취 상황 평가)임.</span></p><p class="bx-num"><span class="bxn">72.</span><span>목표·BCS<span class="hang">임신율 목표 21% = 발정 발견율 70%↑ × 수태율 30%↑</span><span class="hang">분만 후 21일 BCS 변화 → 60일 수정 수태율: 감소군 22.8% / 유지군 36.0% / 증가군 78.3%</span><span class="hang">BCS 2.5 이하로 내려가면 가임 주기 회복이 크게 늦어짐</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>선순환 만들기 : 악순환의 고리는 이렇게 돈다 — 이전 유기에 수태가 늦으면 공태 일수가 길어지고, 유량 적은 후기·건유기가 길어져 소가 살찐다 → 과비 상태로 분만하면 분만 후 BCS가 급락하고 질병(태반정체·자궁염·유방염·제병 등)에 잘 걸린다 → 그 유기 내내 번식이 저하된다. 끊는 지점은 "분만 시 과비 예방"이고, 그 방법은 이전 유기에 적기 수태시켜 공태 일수를 줄이는 것이다. 연구에서 분만 후 130일 이내 수태가 다음 분만의 BCS 감소를 억제하고 번식 성적을 끌어올리는 핵심으로 꼽힌다. 즉 지금 유기의 적기 수태가 다음 유기까지 좋게 만든다.</span></p><p class="bx-num"><span class="bxn">74.</span><span>VWP 후 21일 이내 AI가 늦어지는 원인은 난산·주산기 질환·분만 전후 영양 관리 부실이고, 대책은 분만 관리 재검토, 질병 예방, 발정 발견 개선, 상태가 좋은 소에 한한 호르몬 처치임. BCS 2.75 이하거나 떨어지는 중인 소는 난소·자궁 기능이 떨어져 호르몬 효과가 충분치 않음.</span></p><p class="bx-num"><span class="bxn">75.</span><span>수익성 기준 : 개별 소는 분만 후 120일까지 수태가 수익성 플러스, 130~150일 넘기면 다음 분만 시 난산·주산기 질환이 증가한다.</span></p><p class="bx-num"><span class="bxn">76.</span><span>젖소 분만 후 무발정의 기저 원인은 흔히 다요인적이나 음에너지 균형이 주요 기여 요인이다. 번식 성공을 극대화하려면 무발정 고위험 암소를 조기 식별해 건물 섭취 증가로 관리하고, 발정 발견 효율을 개선해 미관찰 발정으로 인한 무발정을 줄이며, 초음파로 난소 상태를 평가한다. 치료를 택하면 프로게스테론 기반 Ovsynch, P4 기반 전동기화 후 Ovsynch/TAI, 또는 더블-Ovsynch/TAI가 권장되고, P4·GnRH를 쓴 AI 후 치료도 P/AI를 높인다. 무발정 암소를 TAI 프로그램에 넣어 치료하는 것이 무처리에 대한 비용 효율적 대안이다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">77.</span><span>난소 정지(난포가 10 mm 이상 발육하나 E2 불충분으로 배란 없이 폐쇄를 반복)<span class="hang">에너지 부족 → LH 펄스 빈도 감소 + 난포로의 호르몬·영양 공급 부족이 기전이다.</span><span class="hang">원인: 분만 후 대사성 질환(저칼슘혈증·케토시스·태반 정체·자궁염)에 따른 NEB 지속, 고산유량에 걸맞은 영양 요구 미충족, 급여량 부족.</span><span class="hang">NEB로 장기간 황체가 형성되지 않으면 컨디션 회복 후에도 성주기가 돌아오지 않을 수 있다. 다수 발생 시 분만 후 영양 관리를 재검토하고 급여량·에너지 섭취량을 높일 방법을 찾는다.</span><span class="hang">난소 정지·난포 낭종 패턴은 각각 약 10% 발생하며 정상 배란우보다 유량이 높다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>황체 유잔(황체기 연장)은 급격한 고온 스트레스로 유발될 수 있고, 태반 정체·자궁염 이력우와 분만 후 산유량이 많은 소에서 증가한다 — 대사 부하가 걸린 소가 위험군이다.</span></p></div>
</div>
`;
