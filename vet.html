</svg><p class="bx-num"><span class="bxn">2.</span><span>수태 → 임신 → 분만 → 비유 → 재수태 한 바퀴가 12개월이다. 분만과 이유는 영양 요구를 급격히, 임신과 비유는 서서히 바꾼다.</span></p><p class="bx-num"><span class="bxn">3.</span><span>영양 동원 우선순위<br>① 먹이 찾는 운동 ② 성장 ③ 최소 에너지 비축 ④ 현재 임신 유지 ⑤ 비유 ⑥ 2차 에너지 비축 ⑦ 수태를 포함한 번식 ⑧ 3차 에너지 비축</span></p><p class="bx-num"><span class="bxn">4.</span><span>교배를 앞둔 임신 후기~비유 초기에 영양이 모자라면 체내 비축분이 동원되고, 그 정도가 크면 수태가 늦어지거나 아예 안 된다. 감염병이 없다면 번식 성적을 가장 크게 좌우하는 건 영양 상태다. 특히 분만 전후 3주 전이기(젖 안 내는 임신 말기 → 분만 후 비유 개시)의 대사 스트레스 정도가 그 산차의 번식 성패를 미리 정한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>포유·비유가 난포 발육을 얼마나 억제하느냐는 주로 에너지 균형(영양·BCS·산유량·산차)과 분만 전후 질병(자궁염·내막염·유방염·파행)이 정한다. 포유우의 분만 후 무배란은 체형 좋은 성우에서 평균 60~70일이지만, 분만 시 마르거나 산후 영양이 부족하면 포유와 겹쳐 100일을 넘길 수 있다.</span></p><p class="bx-num"><span class="bxn">6.</span><span>교배기를 60일로 짧게 잡으면 분만도 60일 안에 몰림 → 다음 교배기 시작 시점에 가장 늦게 분만한 소도 분만 후 최소 60~80일은 지나 있음 → 거의 모든 소가 자궁 수복·발정 재개를 마친 상태로 교배기를 맞음.</span></p><p class="bx-num"><span class="bxn">7.</span><span>교배기 시작 63일 이후로 수태가 밀리거나 공태인 암소가 절반 가까우면, 특히 어린 소에서 그렇다면 영양 관리 부실을 의심하고, 교배 전·임신 진단 때 BCS를 봐서 원인을 가려낸다.</span></p><p class="bx-num"><span class="bxn">8.</span><span>과비의 악순환 : 수태가 늦어진 소는 이유 후 저요구 기간이 길어져 살찐 채 분만하게 되고, 분만 시 비만(BCS 3.75 이상)이면 대사 장애·난산 위험이 올라 에너지 부족 기간이 길어져 다음 수태도 늦어진다.</span></p><p class="bx-num"><span class="bxn">9.</span><span>개체별로는 산유량이 많을수록 공태 일수가 길지만, 농장별로는 평균 산유량이 높은 농장이 분만 간격도 짧다. 잘 먹이고 잘 관리하는 농장이 생산과 번식을 다 잡는다. 성적 좋은 농장의 공통점은 발정 관찰·기록, 우사 청결, 질 좋은 조사료 충분 급여.</span></p><p class="bx-num"><span class="bxn">10.</span><span>리피트 브리더가 우군 단위로 많으면 분만 전후 사양 관리(급여량·에너지 부족, 단백질 불균형 → 저칼슘혈증·케토시스·태반 정체, 비유 초기 체중 급락)가 주원인일 수 있다. 분만 후 트러블이 많은 농장은 사양 관리부터 재검토한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>분만 시 BCS가 산후 무발정 기간과 임신 성공을 가장 잘 예측한다(분만 전 체중 변화보다 정확).<span class="hang">분만 전 영양 제한 → 분만 시 저BCS → 무발정 연장, 교배기 발정 발현↓, 임신율↓, 분만–수태 간격↑</span><span class="hang">BCS가 높을수록 주기 재개율이 높음</span><span class="hang">분만 전 체형을 BCS 2.5 vs 3.5로 키워 비교하면 3.5군 송아지의 출생·이유 체중이 더 컸고, 그런데도 난산은 늘지 않았음</span><span class="hang">분만 시 체형이 좋으면 비유 초기 완만한 체중 손실이 발정을 늦추지 않는다. 산후 무발정의 주원인은 분만 시 저BCS거나, 체형이 좋았어도 비유 첫 2~3개월에 체중이 급격히 빠진 경우다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>요구량이 낮은 이유 후~임신 중기(젖도 안 내고 태아도 작은 시기)에 미리 체형을 쌓아 두고 임신 후기·비유기에 쓰게 하는 것이 사료비 아끼는 길. 그래서 관리 목적의 BCS 점검은 이유 직후가 가장 좋고, 이때 모자란 체형을 가장 싸고 쉽게 채워 분만 시 목표 BCS를 만든다. 분만 직후는 이미 최대로 먹는 시기라 이때 체형을 올리려는 시도는 대개 소용없다. 그 밖에 임신 진단 때·분만 60일 전·교배 전에도 평가하고, 마른 소는 따로 모아 증체 급여한다.</span></p><p class="bx-num"><span class="bxn">13.</span><span>영양 부족·저BCS는 발정 행동을 약화시킨다(에너지 부족 → E2 상승 억제). 반대로 고산유우도 대사가 빨라 E2 분해가 늘어 발정이 약하거나 짧을 수 있고(무관하다는 보고도 있음), 고온은 황체 퇴행 시 E2 상승을 막아 둔성 발정을 만든다. 둔성 발정 원인은 고산유·수척·통증 질환·여름 고온이며, 수척하거나 유량이 많으면 TAI해도 수태율이 낮을 수 있다.</span></p><p class="bx-num"><span class="bxn">14.</span><span>BCS 촉진 부위별 판정</span></p><table class="bxt"><tr><th>촉진 부위</th><th>판정</th></tr>
<tr><td>① 어깨 봉우리 바로 뒤 등뼈</td><td>안 눌러도 만져지면 마른 쪽, 눌러야 만져지면 중간 이상</td></tr>
<tr><td>② 어깨 뒤 30~40cm 갈비</td><td>안 눌러도 만져지면 마름, 피부를 집어 밀 때 스펀지처럼 미끄러지면 살찜</td></tr>
<tr><td>③ 미근부</td><td>평평·단단하면 중간, 양쪽에 물결 지방이 잡히면 비만</td></tr>
<tr><td>④ 미근부~비절 중간 허벅지 뒤</td><td>사과 크기 지방 덩이가 잡히면 심한 비만</td></tr></table><p class="bx-num"><span class="bxn">15.</span><span>한우 BCS 5점 척도(9단계와 표현 차이일 뿐 같음, 축산물품질평가원 기준). 번식우 정상 기준 3.0(농진청), 분만 시 3.0~3.5 권장. 1~2.5는 영양 부족, 4 이상은 과비로 난산·수태율 저하.</span></p><table class="bxt"><tr><th class="c">5점</th><th class="c">9단계</th><th>소견</th></tr><tr><td class="c">1</td><td class="c">1</td><td>뼈가 심하게 돌출, 병적으로 허약해 거동 불편</td></tr><tr><td class="c">1.5</td><td class="c">2</td><td>병적은 아니나 뼈 돌출 뚜렷</td></tr><tr><td class="c">2</td><td class="c">3</td><td>등줄기 뚜렷, 갈비·어깨 주위 지방 거의 없음, 사지 근육 약간</td></tr><tr><td class="c">2.5</td><td class="c">4</td><td>갈비·엉치뼈 쉽게 만져지나 사지에 근육 보임</td></tr><tr><td class="c">3</td><td class="c">5</td><td>끝쪽 2~3번 갈비는 쉽게 만져지고 엉치뼈 돌출부에 지방 느껴짐</td></tr><tr><td class="c">3.5</td><td class="c">6</td><td>지방이 약간 쌓여 갈비가 잘 안 만져지고 가슴에 약 1cm 지방</td></tr><tr><td class="c">4</td><td class="c">7</td><td>갈비·미근부·가슴에 약간 지방, 등이 넓적해 보임</td></tr><tr><td class="c">4.5</td><td class="c">8</td><td>가슴·미근부·엉치뼈 주변이 지방으로 부풀고 갈비 쪽도 상당한 지방</td></tr><tr><td class="c">5</td><td class="c">9</td><td>꼬리뼈·등줄기가 지방으로 두껍게 덮이고 행동 부자연</td></tr></table></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>영양이 번식축에 전해지는 신호는 포도당·지방산·아미노산 같은 영양소와 렙틴·인슐린·그렐린 같은 대사 호르몬이며, 저혈당은 LH를 낮춘다.</span></p><p class="bx-num"><span class="bxn">17.</span><span>렙틴 : 체지방이 늘면 오르지만, 절대량보다 에너지 균형이 좋아지는 중인지 나빠지는 중인지에 더 크게 반응한다. 같은 열량이라도 농후사료(프로피온산→포도당신생)가 조사료보다 렙틴을 빠르고 오래 올리고, 끊으면 급락한다. 체중·체지방 자체보다 변화 방향이 중요. 잘 먹는 소에 렙틴을 줘도 LH가 안 오르지만 48시간 이상 굶긴 소는 렙틴 과민 상태라 조금만 줘도 절식으로 줄어든 LH 박동이 회복된다(GnRH 펄스 진폭↑ + 뇌하수체 GnRH 감수성↑). 사춘기엔 체지방이 최소선을 넘어야 하지만 렙틴은 필요조건이지 충분조건은 아니다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">18.</span><span>수정 후 손실과 영양</span></p><table class="bxt"><tr><th class="c">시기</th><th class="c">손실</th><th>원인·위험 요인</th><th>비고</th></tr><tr><td class="c">수정~1주</td><td class="c">10~20%</td><td>정상 조건 수정 실패가 10~20%(AI 기술·자궁 염증·정액·열스트레스), 오래된 난포에서 퇴화 증가</td><td>동기화로 작고 신선한 난포 배란시켜 개선</td></tr><tr><td class="c">8~27일</td><td class="c">10~50%<br>(최대)</td><td>배아 성장·영양막 발달·임신 인식기 → 낮은 P4와 연관, 체형 손실도 P4에 영향 줄 수 있음. 배아 신장기 자궁에서 라이신·메티오닌·히스티딘 요구 최대. 열스트레스</td><td></td></tr><tr><td class="c">28~60일</td><td class="c">약 12%</td><td>체형 손실 큰 소, 대기기간 말 무배란, 수정 전 우성 난포 성장기 P4↓, 자궁·비자궁 질환(유방염), 비타민 E·Se 결핍</td><td>임신 진단(28~30일) 이후 손실이라 관리상 중요</td></tr><tr><td class="c">60~90일</td><td class="c">1~3%</td><td>최대 75%가 쌍태(특히 같은 자궁각)</td><td>모체 영양 지원 중요</td></tr></table></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>조사료와 보충사료 사이 '연합효과':같이 먹였을 때 에너지가 각각의 합과 다르게 나오는 것.<span class="hang">조사료 질이 좋거나(CP 10% 이상) 보충사료의 에너지가 섬유질 위주면 이런 효과가 없어 에너지가 그대로 더해진다.</span><span class="hang">조사료 질이 나쁠 때(CP 7% 미만) 단백질을 보충하면 조사료 자발 섭취가 최대 150%, 가소화 건물 섭취가 최대 180%까지 늘고, 보충사료 단백질 농도가 높을수록 섭취·소화율이 오른다. 반대로 전분 많고 단백질 적은 보충사료는 저질 조사료 섭취와 가소화 건물 섭취를 뚜렷이 떨어뜨려 에너지가 덜 나온다. 그래서 저질 조사료로 유지하는 번식우에는 전분은 적당하고 단백질이 비교적 높은 보충사료를 골라야 한다.</span><span class="hang">CP(조단백) : 사료 건물 중 단백질 비율. 볏짚 3~5%, 보통 건초 8~10%, 알팔파 15~20% 수준</span><span class="hang">가소화 건물 섭취 : 먹은 사료 중 실제로 소화돼 몸에 쓰이는 양(섭취량 × 소화율)</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>사료 단백질 과잉은 반추위 암모니아 → 간에서 요소로 해독되며 혈중 요소태질소(BUN, 젖소는 MUN)로 나타난다. 가용성 단백이 비섬유 탄수화물(전분·당)에 비해 많을수록 BUN이 오르고, 암모니아→요소 전환엔 에너지가 든다. 단백질 분해 속도를 탄수화물과 맞추면 미생물 단백질이 잘 만들어져 이 손실이 준다.</span></p><p class="bx-num"><span class="bxn">21.</span><span>BUN이 높으면 난자 발달·감수분열·배아 성숙이 교란되고 난관·자궁 pH가 떨어져 수태 능력이 떨어진다. 요소·고단백 사료는 유산·배아 사망과도 연관된다. 반추위 보호 라이신·메티오닌(제1·2 제한 아미노산)을 쓰면 조단백·BUN을 낮추면서 생산을 유지할 수 있다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>난자는 배란 전 약 60일부터 자라므로, 그동안의 대사 상태가 번식 성적에 나중까지 영향을 준다(난포 기억). 음에너지 균형 때 지방조직에서 풀려나오는 NEFA(올레·팔미트·스테아르산)의 혈중 농도가 오르면 과립막세포·난구-난자 복합체·난포막세포에 직접 해를 끼친다. 지방조직의 지방산 조성은 사료 지방과 반추위 생체수소화 정도에 따라 달라진다. 혈중 NEFA 상승은 염증 반응·인슐린 저항성과 맞물려 NEFA를 더 올리는 악순환을 만든다.</span></p><p class="bx-num"><span class="bxn">23.</span><span>오메가-3 지방산(α-리놀렌산·EPA·DHA) 급여는 이 과염증을 완화하며, EPA·DHA 보충으로 배아 손실 감소·산유량 증가가 보고됐다. 면역계가 쓰는 포도당을 아껴 음에너지 균형을 빨리 벗어나게 하는 것이 기전으로 추정된다.</span></p><p class="bx-num"><span class="bxn">24.</span><span>지방 보충 효과는 급원에 달렸다. 반추위에서 분해되지 않는 불포화지방산 위주로 보충하면 난자·배아 질이 개선되는데, 배반포의 영양외배엽(태반이 될 바깥 세포층) 세포가 늘기 때문으로 본다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">25.</span><span>비타민은 반추위 미생물이 대부분의 수용성 비타민을 합성하므로 보충이 불필요하다. 지용성은 A·D·K 요구량이 정의되어 있다(E는 미정의). D는 피부 UV로, K는 반추위·장 세균으로 생성하여 사료로 충족해야 하는 것은 A·E 뿐.</span></p><table class="bxt"><tr><th class="c">비타민</th><th>생성·공급</th><th>보충</th><th>결핍·과잉 시</th></tr><tr><td class="c">A</td><td>햇볕 건조·자라는 조사료</td><td>햇빛·청초 먹는 소는 보통 불필요</td><td>결핍: 기관 형성 교란·배아 성장 실패·흡수, 선천 수두증. 과잉(보충·주사): 착상 전 노출 시 신경·두개안면 기형(드묾), 단백·에너지 영양실조 겹치면 기형↑</td></tr><tr><td class="c">D</td><td>피부 UV</td><td>보통 불필요. 건유우 20,000~30,000 IU/일은 합리적(고위도·UV 부족)</td><td class="c">—</td></tr><tr><td class="c">E</td><td>사료</td><td>비스트레스 성우는 요구량 작아 정상 사료로 충족</td><td>결핍(A·Se와 함께): 임성 저하·심근 석회화·복수·사산·유산</td></tr><tr><td class="c">K</td><td>반추위·장 세균</td><td>불필요(혈액응고 막을 만큼 합성)</td><td class="c">—</td></tr><tr><td class="c">Se</td><td>—</td><td>—</td><td>과잉: 유산·허약 송아지, 간 축적. 결핍: E와 같음</td></tr></table><p class="bx-num"><span class="bxn">26.</span><span>비타민 E와 셀레늄은 서로 요구량을 절약(상승 관계) — Se는 세포 내외 활성, E는 세포막 보호</span></p><p class="bx-num"><span class="bxn">27.</span><span>열은 난자의 활성산소를 늘려 해치는데, 배양액에 항산화제(시스테인·아스타잔틴·멜라토닌·레티놀)를 넣으면 난자는 열충격에서 보호됐다. 그러나 배아는 달라서 디티오트레이톨·안토시아닌만 효과가 있었고 멜라토닌·비타민 E·글루타티온은 배아를 보호하지 못했다. 여름에 비타민 E 주사 같은 항산화제가 배아 손실을 못 막는 배경(체외 실험).</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>번식 부진을 미량 광물질 결핍 탓으로 돌리는 일이 흔하지만, 미량 광물질 결핍은 육우 번식 실패의 흔한 원인이 아니다. 결핍은 오히려 요구량이 큰 고생산 우군에서 잘 생기고, 어미의 체중·번식보다 송아지 건강에 영향을 줄 가능성이 크다.</span></p><p class="bx-num"><span class="bxn">29.</span><span>육우 영양에 의미 있는 광물 원소는 25종이고, 임신·비유로 요구량이 뚜렷이 바뀌는 건 Ca·P·Mg·K·Na뿐이다.</span></p><p class="bx-num"><span class="bxn">30.</span><span>체내 광물 비축은 필요 시 동원되고, 결핍은 나타나기까지 오래 걸린다. 미네랄에 대한 식욕이 필요량의 지표가 아니다. 따라서 미네랄 보충은 목표 일일 섭취량에 맞춰 공급해야 한다. 자유급여 미네랄을 과소비하면 목표 섭취량에 맞을 만큼 시간이 지날 때까지 추가 공급을 보류한다. 소가 미네랄을 많이 먹는 건 주로 그 안의 소금 때문이므로, 흰소금을 따로 자유급여하면 소금 욕구를 흰소금에서 채워 미네랄 과소비가 준다. 반대로 덜 먹으면 흰소금을 빼서 미네랄 쪽으로 끌리게 하거나 곡물·유박을 소량 섞어 섭취를 자극한다.</span></p><p class="bx-num"><span class="bxn">31.</span><span>미량광물질·비타민은 면역·세포 건강·호르몬 합성에 필수이고, 이는 분만 후 자궁 수복·생식기 건강·발정 주기 재개에 필수다. 후산정체·자궁염을 겪은 신선우가 번식 부진·비유일수 연장을 겪는 건 확립된 사실인데, 여기에 더해 분만 약 1개월 전 저장 미량광물(구리·망간·아연·셀레늄)이 어미에서 태아로 넘어가고, 분만 시 초유로 비타민 A·E도 전달된다. 송아지엔 필수지만, 분만 전 섭취량 감소·면역 부담 시기에 암소의 희생으로 일어난다.</span></p><p class="bx-num"><span class="bxn">32.</span><span>광물질 길항 : 황(주정박·당밀·물) 과다는 구리·셀레늄 흡수를 막고, 황+몰리브덴은 티오몰리브데이트를 만들어 구리 결핍을 일으킨다. 칼슘이 사료 건물 1%를 넘어도 셀레늄 흡수가 준다.</span></p><p class="bx-num"><span class="bxn">33.</span><span>아연·망간·셀레늄·구리 주사제를 건유기·비유 초기에 투여하면 자궁 건강 개선과 자궁염 유발 세균 감소가 보고됐다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">34.</span><span>임상형·잠재성 분만 전후 저칼슘혈증 소는 난산·자궁탈·후산정체·자궁염 같은 이차 장애 위험이 높다. 현재 예방법은 비유의 칼슘 요구와 정상 칼슘 회복 사이의 생리적 시차를 줄이려는 것이다. 기여 요인은 분만 전 과도한 사료 칼슘(건물 1.35%), 과도한 인, 낮은 마그네슘, 고령, 품종(저지 위험↑). 유열의 가장 흔한 양상은 분만 2기이며 와위·차가운 사지·약하고 빠른 맥박으로 진단한다. 혈청 총칼슘 8.0mg/dl 미만이 진단 기준이다.</span></p><p class="bx-num"><span class="bxn">35.</span><span>전통적 예방법은 분만 전 칼슘 섭취를 흡수 칼슘 20g/일 미만으로 제한해 PTH 분비·골흡수를 자극하는 것이었고, 이는 DCAD 사료로 대체됐다. DCAD = (Na+K)−(S+Cl)인데 분만 직전엔 유방부종 때문에 Na를 최소로 하고 황 과급은 해로우므로 실무상 (K−Cl)로 단순화한다. 음이온염(염화암모늄·염화칼슘·황산마그네슘)으로 보상성 대사성 산증을 만든다. 과도한 산성화는 호흡수 증가·DMI 감소를 부르므로 요 pH를 모니터해야 한다. 신제품 합성 제올라이트(X-Zelit)는 분만 전 Ca·P·Mg를 결합하는데 저자 경험상 산증 유도보다 저칼슘·저인산 예방에 더 효과적이었고, 쓸 때는 마그네슘(건물 0.45~0.50%)과 보호형 미량영양소를 추가해야 한다.<span class="hang">마그네슘은 칼슘 항상성에 필수라 부족하면 저칼슘혈증에 기여한다. 저마그네슘은 저칼슘에 대한 PTH 분비를 둔화시키고 PTH와 표적 조직의 상호작용을 방해한다. 고칼륨 사료는 반추위 마그네슘 흡수를 줄이고 음이온염 효과도 떨어뜨린다. 분만 전 사료 마그네슘은 건물 0.35~0.4%를 권장한다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>저칼슘혈증 → 면역억제·후산정체·자궁염↑·주기 재개 지연·공태기↑. 적절한 사료 배합, 사료대 접근 개선, 우방 이동 최소화, 과밀 감소로 섭취·광물질·에너지 균형 관리.</span></p><p class="bx-num"><span class="bxn">37.</span><span>유열: Ca 저하 → 자궁 수축 약화 → 오로 배출 능력↓ + 면역세포 기능↓ → 자궁 수복 지연.</span></p><p class="bx-num"><span class="bxn">38.</span><span>DCAD 단순화 근거: 유방부종 제한 위해 분만 직전 나트륨 섭취 최소 유지 + 과도한 황 급여는 부정적 → (K − Cl). 음이온염 대체로 산(염산·유기산) 처리 단백질 담체 상업 원료도 사용.</span></p><p class="bx-num"><span class="bxn">39.</span><span>저마그네슘혈증은 저칼슘에 대한 PTH 분비를 무디게 하고 PTH-표적조직 상호작용을 방해 → 저칼슘혈증 기여.</span></p><p class="bx-num"><span class="bxn">40.</span><span>springing heifer 사료의 나트륨·칼륨 농도는 분만 후 유방부종 원인이므로 주의.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>셀레늄·비타민 E : 셀레늄(Se)은 글루타티온 과산화효소의 보조인자로, 체액·장기와 정자·난소 세포 내의 중요한 항산화제다. 이 항산화 활성은 산화 스트레스에 맞서 세포·면역 기능을 지키고, 비타민 E와 함께 보충하면 수정을 개선하고 후산정체를 줄이며 낭종성 난소 질환 발생을 줄일 수 있다.</span></p><p class="bx-num"><span class="bxn">42.</span><span>요오드 결핍은 태아 과형성 갑상선종으로 나타나 허약·탈모·사산·유산 송아지와 연관된다. 소 갑상선기능저하 원인은 요오드 낮은 조사료·물, 셀레늄 결핍, 갑상선종 유발 식물 섭취, 유전(Afrikaner). 이런 경우 갑상선이 커져 30g을 넘기도 하며, 요오드 결핍 사료와 고칼슘 섭취가 모두 연루된다.</span></p><p class="bx-num"><span class="bxn">43.</span><span>셀레늄 중독은 고셀레늄 토양의 축적 식물, 잘못 배합된 사료, 주사 과량, 환경 오염에서 온다. 반추동물 독성 용량은 명확하지 않다(종간 2.2~20mg/kg 체중 이상). 만성형(알칼리병)은 침울·식욕부진·체중 감소·탈모·발굽 변형·파행이고, 사료 셀레늄 20~50mg/kg에서 소·양·말의 수태율 감소·태아 흡수 증가가 보고됐다.</span></p><p class="bx-num"><span class="bxn">44.</span><span>Se는 태반을 효율적으로 통과해 태아 간에 모체의 최대 8배 축적; 정상 태아 간 Se 0.3~1.2 ppm이나 건강한 송아지에서도 3.47~5.25 ppm이 관찰되어 3.0 ppm 초과가 곧 중독은 아님; 잠재성 Se 과잉이 면역·임신 결과에 영향 가능. 유효 킬레이트제 없음 → 급원 제거·지지요법.</span></p><p class="bx-num"><span class="bxn">45.</span><span>태아 간 지방이영양증은 셀레늄 결핍, 피롤리지딘 알칼로이드·아플라톡신 노출 등과 관련 가능; 간 철 침착은 허약 송아지 증후군(Se 결핍 추정)과 연관. 유산 진단 시 영양 결핍 검체는 간·심장·갑상선(갑상선 요오드, 간 Se, 모체 혈중 Se).</span></p><p class="bx-num"><span class="bxn">46.</span><span>유산 병력 조사 영양 항목: 급여 체계·조사료 종류·농후·광물·셀레늄, 관리/축사/목초 변화, 조사료 품질, 물 공급원·수질, 목초지 유독식물·지역 영양 결핍; 암소 건강 상태(영양 수준)도 원인 단서.</span></p><p class="bx-num"><span class="bxn">47.</span><span>카드뮴(배터리·인산 비료·하수 슬러지)은 철 결핍 시 장 흡수가 늘고 Ca·Zn·Fe·Cu·Se 대사와 상호작용; 고농도 사료 Cd는 섭취↓·증체 불량·빈혈·골 흡수 감소·유산.</span></p><p class="bx-num"><span class="bxn">48.</span><span>납(배터리·페인트·오염 목초): 아급성 증상에 유산 포함, 태반 통과·태아 CNS 축적, 칼슘 모방; 혈중 납 &gt;0.35 µg/ml; Ca-EDTA 110 mg/kg 2~3일 + 티아민 성우 250–2500 mg/일. 비소는 무기형이 태반 통과·태아 신경상피 축적, 소 유산은 산발적.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">49.</span><span>반추위 보호 메티오닌과 배아 생존<span class="hang">메티오닌은 필수 아미노산이자 단백질 합성의 개시 아미노산으로, 젖소에서 보충이 흔하고 여러 경로로 배아 생존(잔존) 증가가 보고된다.</span><span class="hang">경산우에 반추위 보호 메티오닌 21.2 g/일(비유 30~126일) 급여 시 임신 28~61일 손실 6.1% vs 무보충 19.6%. 임신 33일 배아 복부 직경 5.9 vs 5.3 mm, 배아 부피 209.3 vs 160.5 mm³로 더 컸다. 단 초산우에서는 유의차가 없었다.</span><span class="hang">분만 전 21일~후 30일 사료 건물의 0.08%로 급여하면 수정 6.5일 후 배아의 세포질 지질 농도가 높아져(7.02 vs 3.61 AU), 착상 전 배아 지질 축적 증가가 생존 증가를 설명하는 것으로 본다.</span><span class="hang">경산우는 초산우보다 자궁이 크고 임성이 낮으며, 자궁이 큰 수란우에서 번식 성적이 낮아지는 경향이 있다. 수정란을 품은 모축의 자궁 부피가 메티오닌 절대 요구량을 결정할 수 있는 것으로 보이며, 착상 전 자궁액의 필수·비필수 아미노산 농도 증가도 보고됐다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>반추위 보호 콜린과 간 지방 대사<span class="hang">콜린은 포스파티딜콜린 생성에 필수이며 지질 수송·지단백 합성에 결정적이다. 메티오닌과 함께 메틸 공여체로서 서로를 절약한다.</span><span class="hang">반추위 보호 콜린은 중성지방(TG)을 초저밀도지단백(VLDL)에 넣어 간 밖으로 내보내는 율속 단계를 다뤄, 간 부하(hepatic charge, 포만을 일으킨다고 이론화된 간 대사 부담)를 늘리지 않으면서 간 에너지 생산을 순증가시킨다. 급여 시 유방염 감소도 보고됐다(통계적 유의성에 근접).</span><span class="hang">나이아신은 GPR109A 수용체를 자극해 지방분해를 제한하나(반추위 보호 나이아신 12 g/일/두) 에너지 보정 산유량을 유의하게 떨궈 상업적으로 받아들이기 어렵다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">51.</span><span>이온운반체(이오노포어)의 작용과 번식 관련 효과<span class="hang">콕시듐 예방 외에 반추위 메탄 손실을 줄이고 프로피온산(간 포도당신생 기질) 생성을 늘려 사료효율을 높인다. 후보우에서는 사료효율·일당증체를 높이고 사춘기를 앞당긴다(모넨신 200 mg/일 개체 급여).</span><span class="hang">분만 전 모넨신 급여는 비유 초기 에너지 대사에 긍정적이며 잠재성 케토시스·분만 후 질병 감소와 연관된다. 메타분석에서 모넨신은 임상형 케토시스 발생과 잠재성 케토시스 중증도를 줄였다.</span><span class="hang">기전은 세균 선택을 통한 반추위 프로피온산 증가인데, 추가 프로피온산이 식후 급증보다 긴 시간에 분산되므로 간 산화(포만) 이론과도 양립한다.</span><span class="hang">비유 초기 산유 1 kg/일 증가 가능하나 유지방 저하가 올 수 있다(라살로시드에서 특히, 용량 의존). 두당 200 mg/일을 넘기지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>전이기(transition period)는 분만 전 3주~분만 후 3주로 본다. 이 기간의 장애(분만 전후 마비·후산정체·자궁염·지방간·케토시스·4위전위)는 난포 기억(follicular memory)·면역 기능·자궁내막 상태를 통해 번식 성적에 직간접 영향을 준다.<span class="hang">젖소 발생률: 유열 5~10%, 후산정체 5~10%, 임상형 케토시스 5~10%, 자궁염 8~40% 이상, 임상형 자궁내막염(분만 4~6주 후) 15~20%.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>음에너지 균형(NEB)은 대사 요구를 채울 열량을 충분히 먹지 못하는 상태로, 분만 직전·직후 젖소에서는 통례다. NEB는 분만 전부터 시작돼 분만 며칠 전 건물 섭취량(DMI)이 급락하며 진행되는데, 이 급락은 과도한 지방분해의 '원인'이 아니라 '결과'로 본다.</span></p><p class="bx-num"><span class="bxn">54.</span><span>동일 사료를 먹인 연령 일치 젖소와 육우 비교: 젖소가 유량이 많고 15주까지 체중이 줄었으며 NEFA·BHB가 높고 인슐린·포도당이 낮았다. 젖소 중 유량 35 l/일 초과가 자궁질환 위험과 연관됐다.</span></p><p class="bx-num"><span class="bxn">55.</span><span>체형과 NEB<span class="hang">5점 BCS 3.0 미만은 NEB 지표다. 주기 중인 저BCS 소도 수정당 임신율(P/AI)이 낮고 배아 손실이 많으며, 체형 손실 속도가 빠를수록 주기 재개·첫 수정까지 간격이 길어진다.</span><span class="hang">비유 젖소 911두에서 분만 10일 전→35일 후 BCS 손실이 0.75 이상인 군은 중등 손실군보다 임신 위험(hazard)이 0.65(약 35% 낮음)였고 250 DIM 임신율도 낮았다.</span><span class="hang">과비(BCS 3.75 이상)는 분만 전부터 식욕 저하가 심해 난산이 되기 쉽고, 분만 후 케토시스·지방간을 일으켜 세균 감염에 취약해져 자궁 수복 지연·리피트 브리더로 이어진다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>분만 전 면역억제를 완화하는 한 방법으로 십이지장의 n-6:n-3 지방산 비율 조정이 있다. 분만 전 경산우에서 이 비율을 높이면 단핵세포 기능이 개선될 수 있고, 사료 n-6:n-3을 15:1 이상으로 하면 이후 비유기 번식 성적에 이로울 수 있다고 제안된다.</span></p><p class="bx-num"><span class="bxn">57.</span><span>분만 시 흔한 대사 문제에는 단백-에너지 영양실조에 의한 근력 약화, 장시간 진통 피로, 저칼슘·저마그네슘혈증이 있다. 단기 대책에 분만 전후 운동과 균형 영양이 포함된다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">58.</span><span>케토시스의 생리<span class="hang">케토시스는 케톤체 BHB(β-하이드록시뷰티르산)의 혈중 상승으로 정의된다. 조직(주로 근육·신경)이 간이 만드는 것보다 적은 케톤을 쓸 때 생기며, BHB 증가는 비에스테르화 지방산(NEFA)의 과도한 동원의 결과다. 케토시스 자체는 생존 기전이나 경제 동물은 그 역치에 접근해선 안 된다.</span><span class="hang">간세포의 NEFA 흡수는 순환 NEFA 농도에 좌우된다. 세포 내 NEFA는 중성지방(TG)으로 저장되거나, VLDL로 재포장돼 배출되거나, 부분 산화로 케톤을, 완전 산화로 ATP를 만든다. 소의 간은 VLDL 생성 능력이 제한적이어서 과도한 지방분해 시 간세포가 TG에 압도돼 손상된다. 이 극단이 지방간(간지질증)으로, 보통 간 습중량의 5% 이상을 TG가 차지할 때 생긴다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>잠재성 케토시스(SCK)와 번식<span class="hang">SCK는 BHB 1.2~2.9 mmol/l. 비유 3~7일에 처음 양성인 소는 8일 이후 처음 양성인 소보다 첫 수정 수태 가능성이 0.7배였다 — 발생 여부뿐 아니라 시점도 영향을 준다.</span><span class="hang">분만 후 16일 이전 SCK 소는 첫 수정 수태율이 낮고 150 DIM까지 임신 확률도 낮다.</span><span class="hang">SCK 역치(분만 1주 BHBA 1.0, 2주 1.4 mmol/l) 초과 소의 임신까지 중앙값 130일 vs 무경험 108일. BHBA 0.1 mmol/l 증가마다 첫 수정 P/AI가 1주 케토시스 소 2%, 2주 소 3% 감소.</span><span class="hang">우군 경보 수준: 분만 전 소의 15% 이상이 NEFA 0.27 mEq/l 이상이면 우군 임신율 −1.2%, 분만 전 15%가 BHBA 12 mg/dl(≈1.2 mmol/l) 이상이면 −0.8%, 분만 후 15%가 BHBA 12 mg/dl 이상이면 −0.9%.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>케토시스·NEB와 자궁질환<span class="hang">케토시스는 자궁염·자궁내막염·유방염·면역억제·4위전위로 파급된다.</span><span class="hang">자궁염 위험(오즈비): 임상/잠재성 케토시스 1.75~1.91, NEB 1.51. 자궁내막염 위험: 케토시스 2.2~3.8. (정의: SCK = BHB &gt;1.4 mM, NEB = 분만 전 NEFA &gt;0.4 mM 또는 분만 후 &gt;1.0 mM)</span><span class="hang">전이기 면역억제 정도는 분만 스트레스, 분만 후 NEB의 정도, 호르몬 변화, 산화 스트레스 증가에 좌우된다. 분만 후 DMI 감소·NEFA 상승은 면역세포 기능 저하 및 잠재성 자궁내막염 증가와 연관된다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>케토시스는 임상형 유방염 위험을 2배로 올리고, 수정 후 30일 이내 유방염을 겪으면 첫 수정 수태가 16% 낮았다. 전신 염증의 전염증성 프로스타글란딘이 황체의 P4 생산을 방해하는 것으로 본다 — 케토시스가 염증성 질병을 거쳐 번식을 깎는 경로.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">62.</span><span>사춘기에 도달한 뒤 발정 주기를 멈추게 하려면 중등~중증의 영양 제한이 필요하다. 섭취를 유지 에너지(NEm) 요구량의 30%로 제한했을 때, BCS 5(5점 환산 ≈2.5)에서 시작한 후보우는 61일, BCS 7(≈3.5)에서 시작한 후보우는 148일 만에 주기가 멈췄다(둘 다 초기 체중의 16~18% 손실). 살이 있는 소일수록 주기가 오래 버틴다.</span></p><p class="bx-num"><span class="bxn">63.</span><span>이온운반체(모넨신·라살로시드 등)는 성장률을 높이고 체중과 무관하게 사춘기 연령을 낮추는 경향이 있다. 콕시듐 예방 외에 메탄 손실 감소·반추위 프로피온산 증가로 사료효율을 높인다. 모넨신 라벨 상한은 두당 200 mg/일이며, 유지방 저하가 생길 수 있다(라살로시드가 특히, 용량 의존).</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">64.</span><span>교배 30~60일 전 평가(체중·RTS(생식기 성숙도 점수)·골반·BCS·체형구조)는 가속 성장이 필요할 경우 사료를 바꿀 시간을 확보할 수 있도록 교배철보다 충분히 앞서 실시한다. 조기 임신 진단은 조사료가 부족한 해에 미임신·늦게 임신한 후보우의 도태를 앞당기는 데 쓸 수 있다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">65.</span><span>젖소 후보우는 사춘기 이전의 과도하거나 너무 가파른 증체가 첫 비유기 번식·생산에 직접 악영향을 준다고 알려져 있다. 체중은 사춘기·첫 비유 산유량과 직접 상관이 있으며, 성장률이 후보우 프로그램 성공의 단연 가장 큰 요인이다.<span class="hang">경험칙: 교배 개시 시 성숙체중의 약 55%, 분만 시 82%. 첫 발정 9~12개월령, 약 280~300 kg. 첫 분만 22~24개월령.</span><span class="hang">BCS(5점) 1점 = 체중 약 54 kg.</span><span class="hang">목표 BCS(5점): 후보우 6개월령 2.75, 교배 적령 3.0, 분만 3.5 (성우는 분만 3.5, 산유 정점 2.75, 비유 중기 3.0, 건유 3.5).</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>홀스타인/저지 후보우 성장 목표(체중 kg, 체고 cm)<span class="hang">6개월: 160/113 kg, 100/90 cm</span><span class="hang">12개월: 295/204 kg, 119/107 cm</span><span class="hang">18개월: 408/272 kg, 127/114 cm</span><span class="hang">24개월: 544/363 kg, 132/122 cm</span><span class="hang">ADG: 사춘기 전 0.7~0.8 kg/일, 사춘기 후 0.6~0.7 kg/일</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>NRC 권장 ADG 0.7~0.8 kg/일은 열중성 환경·건강한 개체가 전제다. 0.9 kg/일도 유선 발달에 영향 없이 달성 가능하다는 견해가 있다.<span class="hang">기온 15 ℃ 미만이면 DMI(건물 섭취량)를 늘려야 하며, 추가 에너지를 주지 못하면 ADG가 최대 0.2 kg/일 감소한다.</span><span class="hang">미량·다량 광물은 지역·계절별로 보충한다.</span><span class="hang">갓 이유한 후보우는 반추위가 덜 발달했으므로 고섬유 조사료를 피하고, 에너지·단백이 높고 섬유가 낮은 조기 수확 조사료를 준다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>이유 전 송아지 영양<span class="hang">45 kg 송아지의 유지 요구량은 1.75 Mcal/일로, 유고형분 325 g = 전유 2.5 l = 대용유 3 l(대용유는 전유보다 지방이 낮음)에 해당한다.</span><span class="hang">출생~이유 급여량 기준은 체중의 10%/일을 2회로 나누어 주고, 겨울에는 12%까지 늘린다. 대용유 총고형분은 15%를 넘기지 않는다.</span><span class="hang">전통 대용유는 단백 20%·지방 20%이고, 가속 프로그램은 단백 최대 28%·지방 약 15%를 쓴다. 겨울엔 저지방이 바람직하지 않다.</span><span class="hang">초유 섭취·이유 전 성장률·체조성이 젖소 후보우의 사춘기 연령에 영향을 준다. 0~42일 집중 대용유(CP 30.6%, 지방 16.1%, 건물 기준 체중의 2.1%) + 스타터(CP 24.3%)로 0.68 kg/일 증체시킨 군은 전통 대용유(CP 21.5%, 지방 21.5%, 체중의 1.2%) + 스타터(CP 19.9%)로 0.45 kg/일 증체시킨 군보다 첫 임신 15일, 첫 분만 14일 빨랐다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">69.</span><span>교배 예정 2~3개월 전에 교배군으로 옮겨 발정·문제를 확인하며, 이 시기 사료는 안정적 증체를 제공하는 수준으로 한다(과도한 성장은 낭비). 후보우를 성우보다 2~4주 먼저 교배 공시하면 둘째 교배철 전에 자궁 복구·발정 재개 시간을 더 주어 두 살 시기의 번식 실패를 완화한다.</span></p><p class="bx-num"><span class="bxn">70.</span><span>임신 확인 후부터 분만까지는 ADG 0.5 kg/일 정도로 성숙체중의 85%에 분만하도록 관리한다. 태아 성장의 70~75%가 임신 마지막 3분기에 일어나므로 이 시기 단백·에너지·미량광물을 맞춰 조정하며, 이는 분만 후 첫 3개월의 비유·성장·재교배를 위해 특히 중요하다.</span></p><p class="bx-num"><span class="bxn">71.</span><span>임신 후보우는 중등 체형 BCS 5.5~6.5(5점 환산 ≈2.75~3.25)로 분만시킨다. 난산이 적고 분만 후 간격이 짧으며 둘째 교배철 임신율이 높다. 초산우 송아지는 생후 24시간 혈청 면역글로불린이 낮은데, 초유 질보다 양이 적은 탓이며, 저체형 초산우 송아지는 활력도 낮다.</span></p><p class="bx-num"><span class="bxn">72.</span><span>분만 2개월 이내의 분만 임박 후보우는 비유군과 유사한 원료 + 양질 조사료 + 농후사료 제한(체중의 1~2%)으로 전환해 분만 직후 DMI와 산유 정점을 뒷받침한다. 사료의 Na·K 농도는 분만 후 유방 부종의 원인이 되므로 주의한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">73.</span><span>이유 후 증체율과 영양 수준이 수소의 사춘기 체중·연령을 좌우한다.<span class="hang">저영양으로 키운 어린 수소는 고환 성장·사정량·정자 생산·정낭 발달이 줄고, 심한 단백 제한도 정자 생산 능력을 떨어뜨린다. 반대로 에너지 과급은 음낭·덩굴정맥총(정소 혈관총)의 지방 침착으로 번식 성적을 떨어뜨린다.</span><span class="hang">영양 스트레스를 받은 성장 수소를 다시 잘 먹이면(재영양) 번식 성적이 개선된 시험도, 그렇지 않은 시험도 있다.</span><span class="hang">성숙 수소는 어린 수소보다 사료 스트레스에 더 저항적이지만, 과급여와 심한 단백 제한은 성욕을 낮춘다.</span><span class="hang">이유 전 영양 제한은 사춘기 지연과 1년령 고환 크기 감소를 일으켰으나 이유 후 에너지 수준 변경에서는 이 효과가 없었다. 즉 이유 전 영양이 이유 후 관리보다 사춘기 연령·고환 크기에 더 큰 영향을 준다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>사춘기 전(약 2~7개월령) 영양이 LH 분비 양상·사춘기 연령·고환 발달을 결정한다.<span class="hang">2~7개월령에만 고영양을 급여해도 LH 펄스 빈도 상승이 지속되고 테스토스테론이 올라 사춘기가 2~4주 빨라지며 16~19개월령 고환 중량이 커진다.</span><span class="hang">2~6개월령 저영양은 7개월령 이후 대조·고영양으로 바꿔도 사춘기 지연과 고환 중량 감소가 남는다.</span><span class="hang">홀스타인에서 요구량의 60~70% 저영양 수소는 운동 정자 첫 사출이 늦고 고환이 작았으며, 160% 고영양은 사춘기가 빠르고 고환이 컸다.</span><span class="hang">결론: (i) 영양 효과는 사춘기 전 기간에 가장 뚜렷하고, (ii) 사춘기 전 결손은 사춘기 기간의 영양 변경으로 보상되지 않으며, (iii) 사춘기 전후 최적 영양은 사춘기를 1~1.5개월 당기고 약 1.5세 고환 질량을 12~18% 늘린다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>사춘기 전 영양 수준별 수치(육우 교잡종, 10주령부터 저/중/고 영양)<span class="hang">10~70주 저/중/고: 사춘기 321 / 299 / 288일, 70주 쌍고환 중량 520 / 549 / 655 g.</span><span class="hang">10~30주만 고영양 후 중영양 vs 중영양 지속: 사춘기 314 vs 327일, 74주 쌍고환 610 vs 531 g.</span><span class="hang">10~26주 저영양 후 중영양 vs 중영양 지속: 사춘기 331 vs 293일, 70주 쌍고환 528 vs 600 g. 저영양 후 고영양은 중간(313일, 553 g).</span><span class="hang">6개월령 이전 영양별 사춘기 연령(월)/16~19개월 쌍고환 중량(g): Angus계 저 10.3~10.8/528~553 vs 대조 9.6/600; 저 10.5/520, 대조 9.8/549, 고 9.4/655. 홀스타인 저 12.1/562, 대조 10.7/611, 고 10.6/727.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>영양 효과의 기전은 시상하부–뇌하수체–고환축이 매개한다.<span class="hang">자유채식 사료의 영양소 농도만 낮추면 LH 펄스 빈도만 줄지만, 사료량 자체를 제한하면(배고픔) 펄스 빈도·평균·최고 농도·GnRH 반응이 모두 줄어 시상하부와 뇌하수체가 함께 억제된다. 같은 LH 반응에서도 GnRH 후 테스토스테론 차이로 Leydig 세포 기능 차이가 드러난다.</span><span class="hang">수소의 IGF-1은 12~14개월령 성 발달 완료 후 정점에 이르며, 영양 연구에서 IGF-1 상승과 조기 성선자극호르몬 상승·고환 크기·테스토스테론의 시간적 연관이 강해 IGF-1의 1차 역할이 시사된다. 반면 렙틴·인슐린 차이는 영양에 따른 LH 펄스 빈도 차이와 무관하고 렙틴은 시험관에서 GnRH를 자극하지 않아, 수소에서는 허용적 역할에 그친다.</span><span class="hang">IGF-1·렙틴은 고환 크기와 연관되지만 정세관 직경·상피 면적과는 무관해, 정세관 길이 증가와 총 고환 세포 수 증가(Leydig 세포 증식·Sertoli 세포 성숙·생식세포 증식)에 관여하는 것으로 추정된다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>어미 연령은 1년령 음낭둘레(SC)에 영향을 주지만 체중을 공변량으로 넣으면 효과가 줄어, 주로 어미의 유량(이유 전 영양)을 통한 효과로 해석된다. 경산우의 송아지는 3.5~6개월령 GnRH 투여 후 LH 반응이 더 높았다.</span></p><p class="bx-num"><span class="bxn">78.</span><span>사춘기 기간만의 저영양도 해롭다.<span class="hang">쌍둥이 대조군의 1/3만 급여한 수소는 체중·정낭 중량·정낭 과당/구연산·혈중 및 고환 내 테스토스테론이 줄고 안드로스텐디온은 늘었다.</span><span class="hang">8~12개월령 육우에 CP 8, 5, 1.5% 사료를 3~6개월 급여하면 CP 14% 대조군보다 고환·부고환·정낭 중량이 뚜렷히 줄고 정세관 직경·상피 두께가 감소한다.</span></span></p><p class="bx-num"><span class="bxn">79.</span><span>이유 후(6개월령 이후) 고영양의 이점은 의문이다.<span class="hang">Simmental·Hereford 7~14개월령 저/중/고 에너지(약 14/18/23 Mcal/일): 고에너지군이 더 무겁고 SC·테스토스테론은 높았으나 사춘기는 당겨지지 않았고, 영향받은 정액 형질은 정액량뿐이었다. 저에너지군은 운동성·정상 정자 비율이 낮은 경향을 보였다.</span><span class="hang">6.5개월령부터 12~24개월령까지 고영양(곡류 80% + 조사료 20%) vs 중영양(조사료만): 체중·등지방은 늘었지만 쌍고환 중량은 차이가 없고, 일일 정자 생산·부고환 정자 비축이 줄고 기형이 늘었다 — 음낭 지방이 피부 방열을 막아 고환 온도가 오른 탓이다. 다른 연구에서도 고영양군 SC·음낭 중량은 컸으나 고환 중량은 같았다. 6~16개월령 성장률은 성 발달에 영향이 없었다.</span><span class="hang">체중 증가는 사춘기 단축·고환 증대와 연관되지만 6개월령 이전에 공급할 때만 유익하다. ADG 1~1.6 kg/일은 음낭 지방 축적·온도 상승·정자 생산 감소를 일으키지 않아 성장 중 육우 수소의 '안전한' 목표로 볼 수 있다.</span><span class="hang">요약: 저영양은 연령 불문 해롭고, 고영양은 생후 6개월까지만 유익하다. 포유 중 송아지 영양에는 관심이 적은 편이지만 크립피딩(포유 중 보조 사료) 등으로 초기 증체를 최대화하면 사춘기 단축·성숙 후 정자 생산 능력 증가로 보답한다. 6개월 이후 고영양에 의한 SC 증가는 음낭 지방이며 정자 생산·정액 질·교미 능력이 모두 떨어지므로 사춘기 후 과비가 되지 않게 사료를 조정한다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>성장촉진 임플란트(제라놀, 출생·3·6개월령 투여)는 고환 발달을 저해한다. 고시폴이 많은 사료는 사춘기 전후 수소의 사춘기를 늦추고 성장을 줄인다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">81.</span><span>비교배기는 교배기 체중 손실을 회복하는 기간이다. BCS·체중을 측정해 사료를 조정하고 다음 교배기에 적정 체형으로 들어가게 한다. 성우 체형이 교배 성적에 미치는 영향은 자료가 적지만 과비를 피하면 승가 노력·뒷다리 부담이 줄 것으로 추정되며, 통상 교배기 전 BCS 6~7(5점 환산 ≈3~3.5)로 급여한다. 1년령 수소의 에너지 과잉은 음낭 지방 침착으로 정액 질을 떨어뜨린다.</span></p><p class="bx-num"><span class="bxn">82.</span><span>2세 미만 어린 수소는 사료 경쟁을 피하고 성장을 이어가도록 분리 사육하고, 교배기 말 체형이 떨어진 수소도 회복까지 분리 급여한다.</span></p><p class="bx-num"><span class="bxn">83.</span><span>젖소 농장 자연교배 수소의 파행은 사료·축사·바닥·싸움의 복합 결과다. 비유우 사료는 에너지·단백·칼슘이 수소 유지 요구량을 초과해 과잉 에너지는 제엽염, 과잉 칼슘은 골격 병변을 일으킨다. 교배기 중 휴식·교대를 권장한다.</span></p><p class="bx-num"><span class="bxn">84.</span><span>건사(dry lot)에서 고농후 사료로 육성된 어리고 과비된 수소를 방목 교배에 투입하면 교배 활동이 떨어져 임신이 교배철 후반으로 몰릴 우려가 있다. 극한 기온에 내생균 감염 페스큐 방목이 겹치면 수소 집단 전체의 정액 질·성욕이 떨어진다.</span></p><p class="bx-num"><span class="bxn">85.</span><span>정액 채취 센터 수소는 사료·물·조사료 품질 기준을 두고 배합·조사료 분석 자문을 받으며, 광물 보충을 빠뜨리지 않고 수의사가 사료와 보관 상태를 주기적으로 점검한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">86.</span><span>이유 후 168일 중등 vs 고에너지 급여 육우 수소: 음낭 표면 온도 경사 3.9 vs 3.4 ℃, 정상 형태 정자 68.8 vs 62.5%, 전진운동 정자 53.4 vs 44.5%. 고에너지가 열 손실을 줄여 고환·음낭 온도를 올린 것으로 추정된다. 음낭 경부에 지방이 많은 과비 수소 모델로 음낭 경부를 7일 단열했을 때 중편 결손 정자가 2배였다.</span></p><p class="bx-num"><span class="bxn">87.</span><span>AI용 홀스타인 수소의 고에너지 섭취는 3세 이후 다리 약화·반응 시간 증가와 연관된다. Hereford 수소 1.75 kg/일 초과 증체군은 약 1 kg/일 대조군보다 연령이 들수록 운동성이 낮고 결손이 많았으며, 사료를 바꿔 체중을 상당히 줄인 뒤에도 지속됐다. 덩굴정맥총 주위 지방 증가와 체온–고환 온도 차 감소가 감량 뒤에도 남아, 음낭 지방은 다른 체지방보다 빼기 어렵다.</span></p><p class="bx-num"><span class="bxn">88.</span><span>비만은 수소 고환변성의 주요 원인이다(전시·판매용 비육). 음낭 지방이 고환 온도를 만성적으로 올리는데, 체형을 줄여 음낭 지방이 빠지면 정세관 재생·정자 생산 정상화가 가능하다. 감량은 제한 급여 또는 방목으로 하며 충분한 감량과 상피 재생에 보통 3~4개월이 걸린다. 이동·관리 변화를 겪은 수소, 특히 비만 수소의 번식건전성검사(BSE)는 적응 후 재검한다.</span></p><p class="bx-num"><span class="bxn">89.</span><span>어린 수소에 반추위 산증·반추위염을 일으키는 고에너지 사료는 세균혈증을 거쳐 혈행성 정낭선염으로 이어질 수 있다. 영양·사료대 관리로 산증을 줄이면 발생을 낮출 수 있다.</span></p><p class="bx-num"><span class="bxn">90.</span><span>수소 비복근 파열의 소인: 과급여에 의한 과도 증체, 광물 보충 부족(품종별 요구 차이로 악화), 황 함량 높은 주정박류 급여, 골격이 성숙할 시간 부족. 과다 급여는 급속한 골격 성장(나선형 발톱)을 부른다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">91.</span><span>수소 번식 적성에 영향하는 광물은 Cu·Mn·Se·Zn이며, 잠재성 결핍도 정자형성·운동성·형태·고환 발달·조직 산화 손상·테스토스테론 생합성에 악영향을 준다.<span class="hang">Cu: 정액 Cu 농도가 높을수록 전진운동성·총 항산화능·사정 후 생존성·임성이 높다.</span><span class="hang">Mn: 결핍은 스테로이드 생성을 억제하고, 심하면 성욕 저하·정자수 감소·부고환/정세관 변성을 일으킨다. 미토콘드리아에만 있는 Mn-SOD(망간 초과산화물 제거효소) 활성이 사료 Mn 제한으로 떨어지면 산화 스트레스로 미토콘드리아 막전위가 낮아지고 정자 운동성이 떨어진다.</span><span class="hang">Se: 비타민 E와 독립적으로 정자형성·형태·운동성에 필수다. 중편의 셀레노단백 PHGPx(인지질 과산화물 글루타치온 과산화효소)가 정자 운동에 필요하며, 결핍 시 발현 저하·정자수 감소·운동성 저하·중편 기형이 생긴다. 수소 정액의 Se 농도는 혈액의 16배인데, 소 정자의 중편 미토콘드리아 부피가 사람·말·돼지·양보다 큰 것과 관련된다.</span><span class="hang">Zn: 결핍은 형질막 완전성 저하·꼬리 기형·운동성 저하와 연관되고, 결핍 중 저하된 고환 성장은 Zn 상태가 회복되면 정상으로 돌아온다. Zn 보충은 정자 형태·운동성을 개선하고, 테스토스테론 합성·정상 성욕에 필요하다.</span></span></p><p class="bx-num"><span class="bxn">92.</span><span>영양 결핍이 고환변성의 원인인 경우는 드물다.<span class="hang">자연 상태의 결핍은 복합적이며 단일 영양소 결핍이 수소 불임의 원인인 경우는 희귀하다. 조사료가 정상이면 비타민 결핍도 드물다.</span><span class="hang">사료 질·양 저하로 체중이 줄면 비타민·광물 결핍이 아니라 내분비 효과로 정자형성이 억제된다. 저질 조사료 급여 수소에 단백을 보충하면 DMI가 늘어 체중이 유지되지만, 미보충군은 체중 감소와 함께 SC·고환 g당 일일 정자 생산이 유의하게 줄었다(조직학적 정세관 활성은 차이 없음).</span><span class="hang">비타민 A 결핍은 실험동물에서 고환변성을 일으키지만 실제 급여 조건의 수소에서 장기 경계성 결핍이나 단기 결핍은 정자형성에 영향이 미미하다. B·C·D·E 결핍이 가축 불임을 일으킨다는 근거도 거의 없다.</span><span class="hang">Ca·Mn·Zn·I·K·Se 결핍이 고환변성을 일으킨다는 증명은 없다. P·Co·Fe·Zn·Cu 결핍은 빈혈·식욕부진·체중 감소로 번식에 간접 악영향을 주며 흔히 단백·비타민 A 부족과 동반된다.</span><span class="hang">고환 섬유화 병변 유병률은 결핍·정상·과잉 섭취 간 차이가 없었다.</span></span></p><p class="bx-num"><span class="bxn">93.</span><span>고시폴(목화씨 유래 사료)<span class="hang">시험관에서 수소 정자를 부동화한다. 미토콘드리아 구조·기능을 바꿔 정모세포·정자세포·성숙 정자 이상을 일으키며, 목화씨박 급여와 미토콘드리아 초(sheath) 결손 정자 다발 사이에 결정적 연관이 입증됐다. 다만 고환변성은 일으키지 않는 것으로 보인다.</span><span class="hang">전립 목화씨·목화씨박을 60일 미만 단기 급여하면 사춘기 후 수소의 정액 질·정자형성에는 영향이 적다.</span></span></p><p class="bx-num"><span class="bxn">94.</span><span>곰팡이독<span class="hang">제아랄레논(Fusarium): 에스트로겐 작용으로 정액 질 저하·고환변성을 일으킬 수 있다. 제아랄레논 20 mg/kg 옥수수를 72일 급여한 수소는 21일 후 정액 질이 불량했고, 생식상피 변성은 국소적이었으나 정자의 75% 초과가 변성이었다.</span><span class="hang">아플라톡신은 정자 생산 감소로 수컷 임성을 낮춘다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">95.</span><span>요석증은 비육 거세우만의 문제가 아니라 번식 수소의 건전성에도 중요하며, 사료·요 pH·체수분 균형이 얽힌 다요인 질환이다.<span class="hang">고농후 사료는 Ca:P 비가 낮아 인산염 결석(스트루바이트가 가장 흔함)을 만든다.</span><span class="hang">규소 함량이 높은 목초·귀리 곡물/짚은 규산 결석, 콩과 사료는 탄산염 결석, 옥살산 식물(클로버·할로게톤 등)은 옥살산염 결석과 관련된다.</span></span></p><p class="bx-num"><span class="bxn">96.</span><span>탈수는 요 용질 농도를 높이는 중요한 위험 요인이다. 여름의 물 기호성 저하·가뭄, 혹한 시 자발적 음수 감소가 해당하며, 음수 공급원이 극단적이면 집단 발생도 가능하다.</span></p><p class="bx-num"><span class="bxn">97.</span><span>예방의 핵심은 사료 수정이다.<span class="hang">인산염 결석: 과잉 P를 피하고 Ca:P를 1.5~2 : 1로, 사료 Mg는 0.2% 미만으로 맞춘다. 곡물·알팔파 급여를 줄이고 TMR의 조사료 비율을 점검한다. P는 주로 타액으로 배설되므로 조사료가 늘면 반추·타액 P 배설이 늘고 요 용질이 줄어든다.</span><span class="hang">규산 결석: 위험 목초지는 수소·거세우 대신 암소 방목에 쓴다.</span></span></p><p class="bx-num"><span class="bxn">98.</span><span>충분한 양질의 음수를 확보한다. NaCl 첨가는 음수량을 늘려 요를 희석하고 Mg·P를 결석 핵형성 중심에서 치환한다. 규산 결석은 이유 전 60일에 주로 형성되므로 송아지에 고염 크립사료를 권장한다. NaCl은 일일 건물 섭취량의 3~5%까지 쓸 수 있으며, 이 수준까지 점진적으로 늘린다.</span></p><p class="bx-num"><span class="bxn">99.</span><span>요 산성화에는 장기 염화암모늄 급여가 골감소증을 일으키므로, 대신 DCAD(양이온–음이온 차) 조절용 염화물 음이온 보충제 0.1~0.2 kg(0.25~0.5 lb)을 곡물에 섞어 급여하는 방법이 있다. 7개월령에 거세한 송아지는 1개월령 거세보다 직경 13%, 수소는 44% 큰 결석을 통과시킬 수 있으나 거세 지연의 복지 문제를 고려해 사료·음수 관리가 우선이다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">100.</span><span>발달(태아) 프로그래밍은 임신 중 어미 영양의 부족·과잉이 태아 발달과 자손의 평생 성적에 장기 영향을 준다는 개념이다.<span class="hang">임신우 영양 부족이 흔한 탓에 과잉보다 결핍 연구가 훨씬 많다.</span><span class="hang">태아 성장은 주로 임신 초기에 형성되는 태반이 조절하고, 자궁으로의 포도당·아미노산 공급이 적절한 자손 발달에 필수다.</span><span class="hang">가축이 특히 위험한 이유는 태아와 영양을 경쟁하는 어리고 성장 중인(사춘기 전후) 어미를 교배하고, 계절 교배가 부실한 목초·열스트레스 시기와 겹치기 때문이다.</span><span class="hang">표현형 변화는 출생체중과 독립적일 수 있어 출생체중이 정상이라도 프로그래밍 효과가 숨어 있을 수 있다.</span></span></p><p class="bx-num"><span class="bxn">101.</span><span>영양 제한의 시기별 효과<span class="hang">임신 초기 ME(대사에너지) 요구량의 약 75%로 제한 → 임신 125일 태아가 가볍고, 자손의 지방 축적이 늘고 포도당 대사가 바뀐다.</span><span class="hang">임신 첫 110일 영양 제한 → 동난포(AFC)가 적은 송아지. 임신우 영양 제한은 딸의 난소 습중량·황체 조직량도 줄인다.</span><span class="hang">임신 중기(50~180일) 에너지 제한 → 자궁동맥 혈류와 태아 체중 감소(품종 무관).</span><span class="hang">임신 3분기 에너지 제한 → 출생체중·이유(젖떼기) 체중 감소. 마지막 90일 유지에너지의 70%로 제한 → 자손 이환·폐사 증가(평균 이하 체중으로 태어난 송아지의 생존이 불리). 임신 후기 제한의 효과는 그 어미의 비유 초기까지 이어져 어느 시기의 결핍이 문제였는지 가려내기 어렵다.</span><span class="hang">자궁내 성장 지연(IUGR)의 가장 흔한 원인은 육우에서 영양 제한이며 특히 태아 성장 대부분이 일어나는 3분기다. IUGR 송아지는 출생체중이 낮고 머리:몸 비가 크며 대사 변형·허약·폐사가 많다.</span><span class="hang">임신 중 어미 영양 저하는 신생 송아지 폐사, 장·호흡기 기능장애, 대사 장애, 산후 성장률 감소, 육질 저하로 이어지며 마지막 3분기에 가장 심하다.</span></span></p><p class="bx-num"><span class="bxn">102.</span><span>효과는 미묘하고 자손의 출생 후 영양 수준에 좌우된다. 경미한 영양 제한은 번식우 농장에서 흔하지만 무리 전체 생산성 지표(임신율·이유체중·이유율)에 발달 프로그래밍이 미치는 영향을 기술한 자료는 아직 불확실하다.</span></p><p class="bx-num"><span class="bxn">103.</span><span>임신 중 대사 단백이 부족해지면 단백이 면역계 대신 생식기관으로 우선 분배되어 영양 제한 어미는 어느 정도 면역 저하 상태가 된다.</span></p><p class="bx-num"><span class="bxn">104.</span><span>임신 마지막 1/3 어미 단백 보충이 자손에 미치는 효과<span class="hang">단백 제한 어미의 송아지는 비육·번식 성적이 낮고, 암송아지는 이유·교배 전·임신 검사 시 체중이 낮다.</span><span class="hang">휴면 목초 방목 중 주 3회, 하루 1.0 lb(0.45 kg) 상당의 CP(조단백) 42% 또는 28% 큐브를 보충한 어미의 딸: 첫 교배철 임신율 80→93%, 83→90%; 이유체중 456→467 lb(207→212 kg), 492→511 lb(223→232 kg); 사춘기 연령은 한 시험에서 365→352일로 빨라졌고 다른 시험은 차이 없음(334 vs 339일).</span><span class="hang">그 결과 분만철 첫 21일 안에 분만하는 딸의 비율이 28% 늘었다. 거세 형제도 이유체중·비육장 DMI(건물 섭취량)·상위 육질등급 비율·마블링이 높았다.</span><span class="hang">주정박으로 에너지를 높인 다른 시험은 AFC·사춘기 연령 변화 없이 딸의 AI 수태율이 올랐다.</span><span class="hang">후보우 번식 성적이 나쁘면 어미 무리 전체의 영양 관리를 진단 항목에 포함한다.</span></span></p><p class="bx-num"><span class="bxn">105.</span><span>저투입 조사료 육성(교배 시 성숙체중 50~55%) 후보우는 임신 확인(30~45일)까지 저투입으로 관리해도 자궁 혈류·출생체중이 손상되지 않았고, 임신 후기 모체 체중당 자궁동맥 혈류는 오히려 높아 보상 기전으로 추정된다. 임신 50~180일 제한 후 재급여한 송아지의 흉위 증가도 자궁 내 과보상으로 본다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">106.</span><span>어미 영양 부족은 초유 질을 떨어뜨리고 송아지의 IgG 흡수를 손상시킨다. 마른(9점 BCS 3~4, 5점 환산 ≈1.5~2) 두 살 초산 후보우의 송아지는 활력이 낮고 생후 24시간 혈청 면역글로불린이 낮다.</span></p><p class="bx-num"><span class="bxn">107.</span><span>분만 전 영양 수준과 초유 IgG<span class="hang">임신 마지막 100일 단백·에너지 제한 육우: 초유 IgG가 낮고 송아지 수동면역 실패(FTPI) 위험이 높았다(한 자료군). 다른 두 연구에서는 마지막 90~100일 제한이 초유 IgG에는 영향이 없었으나 송아지 24시간 혈청 IgG는 낮았다.</span><span class="hang">분만 30일 전 저에너지 급여 → 초유 IgG 감소·FTPI 증가.</span><span class="hang">젖소에서는 분만 전 고/저 에너지 간 송아지 IgG 차이가 없거나, 에너지 요구량을 충족한 군이 초과 급여군보다 초유 IgG가 높았다 → 요구량 기준(NRC)에 맞춘 급여를 권한다.</span></span></p><p class="bx-num"><span class="bxn">108.</span><span>초유 성분(Zn·Se 등 미량원소 농도가 높다)은 영양·품종·계절·연령에 따라 변한다. 초유 섭취는 송아지 혈중 β-카로틴·비타민 A·E를 정상치로 올리는 데 중요하며 12시간 넘게 지연되면 지방산 합성 저하·세포막 펌프 실패가 생긴다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">109.</span><span>모체 요인은 체격·산차가 핵심이고, 영양은 양쪽으로 작용한다.<span class="hang">부적절한 사료·저BCS는 난산 소인이고, 저급여는 임신 중독증을 늘리고 송아지 활력을 낮춘다.</span><span class="hang">과급여는 출생체중을 늘리고 골반 내·질 주위 지방 침착을 일으켜 난산을 늘린다.</span><span class="hang">저칼슘혈증은 자궁 무력으로 난산에 기여한다.</span></span></p><p class="bx-num"><span class="bxn">110.</span><span>두 살 초산우에서 임신 1분기 고/저 증체 사료는 어미 체중 차이에도 난산·출생체중 차이가 없었다. 수정 전~임신 90일 사료 차이로 출생체중이 3~4 kg(8~15%) 감소한 시험이 있으나 난산 감소를 입증할 두수는 아니었다.</span></p><p class="bx-num"><span class="bxn">111.</span><span>분만 전 3주 관리<span class="hang">과비 경향이면 농후사료·에너지를 제한하고 과급여·저급여 양극단을 피해 지방 침착을 막는다.</span><span class="hang">전이기 광물(Mg·I·Se)을 보충한다.</span><span class="hang">하루 4~5회 관찰하고 운동 공간을 준다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">112.</span><span>공여우는 과급여와 고체형 유지가 일관되게 유해하다.<span class="hang">과급여·고체형은 과배란 반응을 낮추고 배아·난자 질과 임신율을 떨어뜨린다. 고체형은 난포 IGF-1을 낮춰 과립막세포의 FSH 감수성과 난자 성숙을 저해하고, 고인슐린혈증·인슐린 저항이 수정·배아 발달을 손상시킨다.</span><span class="hang">체형이 양호한 비비유 공여우·후보우에 고에너지를 먹이면 스테로이드 이화·고인슐린·유리지방산 증가 → 인슐린 저항·난포 자극 반응 저하로 과배란 반응이 줄어든다.</span><span class="hang">노령과 극단 체형(과비·수척)은 모두 난자·배아 질에 부정적이다.</span></span></p><p class="bx-num"><span class="bxn">113.</span><span>저체형·음에너지 균형(NEB) 공여우도 반응이 나쁘다.<span class="hang">산후 비유 젖소 공여우의 NEB는 IGF-1·인슐린 저하(GH-IGF 축 탈동조)와 LH 펄스 감소로 난포 성숙·배란을 저해한다. 과도한 체지방 동원은 난포액 NEFA·BHB를 높여 난자 세포자멸을 늘리고 초기 배아 발달을 저해한다.</span><span class="hang">저BCS는 렙틴 저하·NEFA 상승(난포액 포함)으로 성숙·수정·배아 발달을 저해한다. 반대로 비만 관련 고렙틴은 렙틴 저항을 만들고 고농도 렙틴은 난자 발달·체외 배아 수율을 저해한다.</span><span class="hang">저체형 비유 공여우는 유지 이상의 에너지 섭취로 인슐린·IGF-1을 올려 성선자극호르몬 효과를 높일 수 있고, 충분한 에너지 사료가 내분비 변화를 극복해 난포액 E2를 회복시킨다. 저체중 공여우는 ET보다 OPU(경질 난자 채취)가 나을 수 있다.</span></span></p><p class="bx-num"><span class="bxn">114.</span><span>공여우 사료 원칙: 균형 잡힌 에너지와 양호한 체형 유지. 지방산·광물 보충 효과는 급원에 좌우되고, 고단백의 악영향은 요소 농도와 관련된다.</span></p><p class="bx-num"><span class="bxn">115.</span><span>무발정 공여우의 두 주요 원인은 자궁 질환과 분만 전후 영양 불량이다.<span class="hang">산후 NEB 예방과 양호한 BCS가 자궁 복구와 GnRH 분비 재개를 돕는다. 산후 NEB와 연관된 지속 난소 구조(난포낭종·지속 황체)도 흔한 무발정 원인이다.</span><span class="hang">ET·OPU 최소 1개월 전부터 체형을 양호하게 유지하고 단백질·섭취량·광물·비타민·에너지 결핍을 교정한다.</span></span></p><p class="bx-num"><span class="bxn">116.</span><span>FSH 단회 피하주사는 체형이 좋은 소(5점 BCS 3 초과)에서는 효과적이나 지방이 적은 저BCS 홀스타인에서는 그렇지 않다. 홀스타인은 75%/25% 분할 투여로 개선되고, 2% 히알루로난에 희석한 단회 근주는 체형 영향을 피한다(총 난자 12.1 vs 11.2, 수정란 8.8 vs 8.3, 이식 가능 6.7 vs 6.4로 차이 없음).</span></p><p class="bx-num"><span class="bxn">117.</span><span>공여우 광물 보충은 간과되기 쉬운 도구다. 유기태 미량광물을 보충한 공여우의 난구-난자 복합체는 무기태군보다 체외 배아 생산이 좋았으나, 영양·체형이 양호한 공여우는 추가 이점이 없을 수 있다. 수란우도 지역별 광물 결핍 상황에 맞춘 보충이 필요하다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">118.</span><span>수란우 관리가 공여우보다 성공에 더 중요하다는 관점이 있다. 외모가 내부 상태를 반영한다 — 피모가 거칠고 진흙 사육장의 저체형 소는 부적합하다.<span class="hang">임성 최적 BCS는 9점 4~6(5점 환산 ≈2~3). 9점 BCS 3에서 갈비·척추가 두드러진 육우는 무발정 직전 상태로 황체가 작고 단단해 성적이 나쁘다.</span><span class="hang">'살찐 소 = 불임'은 항상 참이 아니다. 공태나 과급여로 살찐 소는 임성이 괜찮을 수 있다.</span><span class="hang">비유 중인 양호 체형 소는 분만 45~50일 이후 수란우로 쓸 수 있다.</span><span class="hang">이식 시 수란우 BCS의 임성 영향은 실무자들이 '중등' 수준으로 평가한다.</span></span></p><p class="bx-num"><span class="bxn">119.</span><span>공여우·수란우 모두 사료를 끊지 않는다. 분변을 줄이려 급여를 줄이는 것은 잘못이며, 가득 찬 반추위가 채란·이식을 더 쉽게 한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">120.</span><span>질산염 축적 조건과 노출원<span class="hang">과비(질소 시비)·가뭄·우박·서리·제초제 피해·일조 감소·토양 산성화, 황(S)·인(P)·몰리브덴(Mo) 결핍 토양에서 식물의 질산염이 축적된다. 뿌리와 줄기 아랫부분에 가장 많다.</span><span class="hang">축적 작물·잡초: 수단그라스, 사탕무, 옥수수, 대두, 진주조, 아마, 호밀, 귀리, 해바라기, 존슨그래스, 명아주류(pigweed), 흰독말풀, 엉겅퀴, 메꽃, 소리쟁이 등. 260여 종의 Astragalus(로코위드류)도 질소를 축적해 급성·만성 질산 중독을 일으킨다.</span><span class="hang">분뇨·비료 유출수로 오염된 물도 노출원이다.</span></span></p><p class="bx-num"><span class="bxn">121.</span><span>기전과 번식 영향<span class="hang">반추위에서 질산→아질산→암모니아 전환 능력이 과부하되면 아질산이 흡수되어 메트헤모글로빈을 만든다. 모체 메트헤모글로빈은 태반을 넘지 못하지만 질산·아질산은 태반을 넘어가 태아 메트헤모글로빈혈증·무산소증을 일으키며, 혈관 확장·저혈압도 동반된다.</span><span class="hang">모체 노출 약 3~7일 이후(또는 그 뒤)에 유산·사산·허약 송아지가 나타난다. 잠재성 독소 노출은 외견상 정상인 암소에서 태아 사망을 일으켜 일상 검사로는 진단이 어렵다.</span></span></p><p class="bx-num"><span class="bxn">122.</span><span>진단 기준<span class="hang">태아 또는 모체 안구액(眼球液) 질산염이 30 ppm 이상이면 강력히 시사한다. 사후 수 시간 내 채취해 냉장하며, 유산 부검 항목에 포함한다.</span><span class="hang">조사료 질산염 0.6~1.0%(건물 기준 6000~10 000 ppm) 초과가 번식 손실과 연관된다.</span><span class="hang">물 질산염은 440 mg/l 미만을 권장하며, 급성 독성은 보통 1300 mg/l을 넘을 때 나타난다.</span></span></p><p class="bx-num"><span class="bxn">123.</span><span>치료·예방<span class="hang">메틸렌블루 1~2% 수용액 1~2 mg/kg(중증 10 mg/kg) 정맥주사, 도축 휴약 180일. 집단 발생에는 비용상 비현실적이므로 문제 목초지에서 격리한다.</span><span class="hang">사료·물의 고질산염 노출이 불가피하면 Propionibacterium acidipropionici P5 균주(세균성 사료 첨가제)를 보충할 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">124.</span><span>노출원과 발생 양상<span class="hang">폰데로사 소나무(Pinus ponderosa, 바늘 18~28 cm·다발당 2~3개) 잎 섭취가 만삭 유산을 일으킨다. 추위·강설, 사료가 부족한 늦가을~초봄, 스트레스 시에 녹색·낙엽 바늘을 더 먹는다. 임신 후기에 솔잎을 매일 0.71~0.85 kg(건물) 급여하면 후산정체를 동반한 유산이 일어났다.</span><span class="hang">주 독성 효과는 유산·후산정체·자궁염이며 공태우·거세우·수소는 영향이 없다.</span><span class="hang">이소쿠프레스산(isocupressic acid)을 함유해 소의 후기 유산과 연관된 다른 식물: 잣나무(Pinus koraiensis), 로지폴소나무, 유럽노간주, 몬터레이사이프러스, 캘리포니아노간주. 유타·서부노간주 껍질은 아가트산이 많다.</span></span></p><p class="bx-num"><span class="bxn">125.</span><span>독성 기전과 원인 물질<span class="hang">유산 유발 물질은 이소쿠프레스산이다(아세틸·숙시닐 유도체가 반추위에서 가수분해되어 전환되고, 아가트산·임브리카톨산·디하이드로아가트산도 소량 관여). 임신 후기에 체중당 100 mg/kg을 1일 2회 급여한 것이 최소 유산 용량이었다.</span><span class="hang">솔잎 급여 암소의 혈장은 태반분엽 관류압을 높여 자궁 긴장도를 올리고 태아 혈류를 줄인다. 병리에서 태아에 혈액을 공급하는 자궁소구(caruncle) 동맥의 심한 협착이 확인된다 → 만성 혈관 수축으로 자궁 혈류가 감소한다.</span></span></p><p class="bx-num"><span class="bxn">126.</span><span>번식 영향과 임상 징후<span class="hang">주로 임신 마지막 3분기 섭취 시 후기 유산이 오지만 임신 3개월 유산도 보고됐다. 섭취 2~21일 후 조산(즉시 유산도 가능)이 오며, 2.2~2.7 kg/일을 3일 이상 급여하면 조산이 유도된다.</span><span class="hang">외음부 부종·점액성 질 분비 → 약한 진통·자궁 출혈·자궁경 불완전 개장·난산·허약 송아지·무유증·후산정체.</span></span></p><p class="bx-num"><span class="bxn">127.</span><span>섭취·유산 위험을 키우는 요인<span class="hang">고단백 사료 → 솔잎 섭취 증가(솔잎의 축합 탄닌이 높은 반추위 암모니아의 불쾌감을 덜어 식욕을 올리는 것으로 추정).</span><span class="hang">부실한 BCS → 솔잎을 더 먹는다. 고단백·저에너지 사료에서는 BCS가 낮은 암소가 일관되게 더 먹었고, 저단백·고에너지 사료에서는 처음엔 더 먹다가 BCS 간 차이가 시간이 지나며 줄었다.</span><span class="hang">보충 에너지 부족 → 위험 증가(옥수수 사일리지로 에너지를 채우면 유산이 일어나지 않았다).</span><span class="hang">채취 후 12개월 둔 솔잎, 분쇄·풍건으로 노화시킨 솔잎, 마그네슘 보충제, 사일리지 기반 사료, 벤토나이트, 솔잎에 혼합한 완전 광물질 보충제, 소금-황 블록은 모두 유산 유발 효과를 바꾸지 못했다.</span></span></p><p class="bx-num"><span class="bxn">128.</span><span>예방·치료<span class="hang">완전한 예방법은 없다. 마지막 3분기에 소나무 접근을 차단하고, 소나무 지대에 방목하는 임신우는 적정 BCS를 유지해 섭취를 줄이며, 충분한 사료·쉼터로 스트레스를 최소화하고 에너지 균형 + 보수적 단백 급여를 한다. 분만을 늦봄이나 가을로 옮기는 것도 방법이다.</span><span class="hang">특이 치료는 없다. 유산우는 항생제·자궁 주입 등 보조 치료, 조산 송아지는 초유·우유 보충이 필요하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">129.</span><span>노출원과 독성 물질<span class="hang">맥각 알칼로이드(80종 이상)는 맥각균(Claviceps purpurea; 밀·호밀·보리·귀리)과 톨 페스큐(Lolium arundinaceum) 내생균(Epichloë coenophiala = Neotyphodium coenophialum)이 만든다. 내생균은 식물에 방목 내성·질소/물 이용 효율을 주지만 독성 알칼로이드도 만든다.</span><span class="hang">주 독성 물질은 에르고발린(ergovaline)으로, α2 수용체 작용으로 혈관을 수축시키고 도파민 D2 수용체 작용으로 프로락틴을 떨어뜨린다.</span><span class="hang">알칼로이드는 종자머리(seedhead)에 농축되며 늦봄·여름~초가을에 가장 높다. 가뭄·강우, 질소·인 비료가 에르고발린을 높인다.</span></span></p><p class="bx-num"><span class="bxn">130.</span><span>페스큐 중독증의 임상 양상<span class="hang">서머 슬럼프(기온 &gt;31 ℃에서 악화): 거친 피모·섭취↓·유량↓·이유체중↓·수태율↓·불안·유연·호흡수↑. 그 밖에 페스큐 풋(사지 괴저)·지방 괴사. 극단적 기온에서 증상이 악화된다.</span><span class="hang">조사료 섭취 감소가 특징이라 영양 저하와 번식 실패가 혼동되지만, 섭취 감소와 무관하게 알칼로이드 자체가 혈관 수축을 늘려 사지·말단과 자궁·난소 혈류를 줄인다.</span><span class="hang">진단: 혈청 프로락틴 저하가 지표가 된다.</span></span></p><p class="bx-num"><span class="bxn">131.</span><span>번식 영향 — 암소<span class="hang">임신율·분만율 저하, 성장률 저하, 사춘기 개시 지연, 황체 기능 손상이 보고된다. 발정 주기 불규칙·호르몬 분비 억제·무유증을 유발한다.</span><span class="hang">프로락틴↓(반추동물은 분만 시 태반 락토겐이 보상하지만 섭취 감소와 겹쳐 유량이 떨어진다), LH·프로스타글란딘↓, 프로게스테론↓ → 초기 임신 유지가 어렵다.</span></span></p><p class="bx-num"><span class="bxn">132.</span><span>번식 영향 — 수소<span class="hang">내생균 감염(K31) 톨 페스큐를 방목한 수소는 정상 정자세포 수가 약 20% 감소해 번식 건전성 검사 불합격이 늘었다. 음낭둘레 감소·음낭 온도 상승이 더 우려되며, 에르고타민과 배양한 정자는 생존성이 떨어졌다.</span><span class="hang">극단적 환경 온도와 페스큐 방목에 따른 열 보유가 겹치면 수소 집단 전체의 정액 질·성욕이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">133.</span><span>관리 전략<span class="hang">종자머리 깎기, 사이갈이로 목초지 다양화, 무해 내생균·저알칼로이드 품종으로 전환, 오염 목초지 제거.</span><span class="hang">곡물·비페스큐 조사료로 전략적 희석, 분만·교배 시기를 알칼로이드 정점 회피로 조정. 단일 회피·희석 전략 하나로는 해결이 어려워 다면적 접근이 필요하다.</span><span class="hang">돔페리돈(D2 길항제)이 후보우에서 체중 감소 역전·프로게스테론 증가를 실험적으로 보여 임상 가치가 있을 수 있다. 페스큐 중독용 사료 첨가제는 많이 시험됐으나 자료 상당수가 독점 정보라 객관적 평가가 어렵다.</span><span class="hang">도파민 D2 수용체 유전자 SNP가 페스큐 방목우의 혈청 프로락틴과 연관돼 유전적 민감성 식별 가능성이 제기됐으나 검증되지 않았다.</span></span></p><p class="bx-num"><span class="bxn">134.</span><span>맥각중독(ergotism)의 4형: 괴저형(꼬리·사지), 고체온·생산 손실형, 번식 실패형, 드문 신경형. 곡물 제분·정선으로 드물며, 치료는 오염 곡물 제거다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">135.</span><span>아플라톡신(B1·B2·G1·G2; Aspergillus flavus/parasiticus)<span class="hang">노출원: 수분 14% 초과·20 ℃ 초과에서 저장되거나 건조가 부실한 곡물.</span><span class="hang">반추동물은 상대적으로 저항성이 있고 어린 송아지가 위험하다. 배아 손실·태아 사망·기형이 가능하며, 소 유산은 드물지만 산발적 집단 발생이 있다. 효과는 난자·배아에 대한 직접 작용이 아니라 모체 항상성 변화로 본다. 수컷은 정자 생산 감소로 임성이 떨어진다.</span><span class="hang">태아 간 지방이영양증은 아플라톡신·피롤리지딘 알칼로이드 노출(셀레늄 결핍과 함께)과 관련될 수 있다.</span><span class="hang">치료는 오염 사료 교체다.</span></span></p><p class="bx-num"><span class="bxn">136.</span><span>제아랄레논(Fusarium graminearum; 주로 옥수수)<span class="hang">에스트로겐 유사 작용으로 임성 저하·발정주기 이상·외음부 종창·질염·유량 감소·유선 비대를 일으킨다. 후보우가 성우보다 민감하다. 임신우에서는 배·태아 이상·태아 사망·유산·난산이 가능하다. 소의 주 대사물은 β-제아랄레놀이다.</span><span class="hang">오염 사료 제거 후 3~7주에 징후가 사라진다. 곡물 수분을 15~16%로 유지해 예방한다. (수소 영향은 수소 박스 참조)</span></span></p><p class="bx-num"><span class="bxn">137.</span><span>진균성 유산 예방: 곰팡이 핀 건초·사료와 저질 사일리지를 피하고, 어둡고 습한 유기물 환경을 제거하고 환기한다. 천연 제올라이트는 곰팡이독소 결합제로 쓰인다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">138.</span><span>노출원<span class="hang">알팔파, 대두, 레드·서브터레니언·화이트·알사이크 클로버, 버 메딕. 진균 감염·곤충 피해·냉습 조건에서 함량이 증가한다.</span><span class="hang">이소플라본(대두, 레드·화이트 클로버), 쿠메스트롤(알팔파, 화이트 클로버, 대두 싹), 리그난(아마씨). 사일리지·가금 깔짚의 에스트로겐도 유산 원인 표에 오른다.</span></span></p><p class="bx-num"><span class="bxn">139.</span><span>기전과 번식 영향<span class="hang">수용체 친화도는 약하지만 체내 농도가 100배까지 높아져 영향을 낼 수 있다. 어린 동물이 민감하고, 소는 양보다 덜 민감하다. 레드클로버 사일리지·알팔파 급여 우군의 불임이 보고됐다.</span><span class="hang">증상: 님포마니아(사모광), 난소낭종, 생식기 종창, 불임, 임신 유지 장애 또는 성선 저형성·무발정.</span><span class="hang">쿠메스트롤·다이제인·제니스테인이 난포·황체의 옥시토신 분비를 자극해 초기 황체 퇴행 또는 황체 지속 → 배아 사망을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">140.</span><span>관리: 조사료의 이소플라본·쿠메스트롤을 분석해 대체한다. 제거 후 4~6주 내 정상 주기로 회복된다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">141.</span><span>곰팡이 핀 스위트클로버(백·황) — 디쿠마롤<span class="hang">쿠마린이 Aspergillus·Penicillium·Mucor에 의해 디쿠마롤로 전환되어 비타민 K 의존 응고인자 II·VII·IX·X 합성을 저해한다. 건초 20~30 mg/kg 이상에서 임상 발병한다.</span><span class="hang">태반을 통과해 태아 출혈과 산발적 유산을 일으킨다.</span><span class="hang">치료: 오염 건초·사일리지 제거, 비타민 K1 1.1~3.3 mg/kg 12시간마다 5일(또는 PT/aPTT 정상화까지), PCV 12% 미만이면 전혈 2~4 l/450 kg 수혈.</span><span class="hang">다른 쿠마린 함유 식물: 향기풀(Anthoxanthum odoratum), Lespedeza stipulacea, 미나리과.</span></span></p><p class="bx-num"><span class="bxn">142.</span><span>기형 유발 식물(임신 시기 의존)<span class="hang">기형 유발 물질은 용량·시기 의존이다.</span><span class="hang">루핀(anagyrine·ammodendrine 등): 임신 40~70일 섭취 → 굽은 송아지병(앞다리 관절굽음증, 척추측만·사경·척추전만·후만, 구개열). 기전은 니코틴성 수용체 탈감작 → 태아 운동 감소. 꽃·꼬투리기(알칼로이드 최고)에 임신우 방목 금지, 루핀 유무 목초지 교대 방목. 경미한 앞다리 구축은 생후 1주 내 주관절 고정으로 회복 가능. 루피노시스는 별개로 Phomopsis 곰팡이독(phomopsin)에 의한 간·신장·근육 질환이다.</span><span class="hang">독미나리(Conium maculatum; γ-coniceine·coniine): 임신 40~70일 만성 섭취 → 사경·측만·구개열·관절굽음증(루핀·담배와 구별 불가). 급성 중독 생존 후 유산 가능. 7일 햇볕 건조로 알칼로이드가 크게 줄어든다.</span><span class="hang">담배(Nicotiana glauca 등; anabasine): 임신 30~60일 → 같은 골격 기형.</span><span class="hang">Veratrum californicum(cyclopamine; SHH 경로 교란): 임신 12~30일 → 구개열·토순·단하악·합지·꼬리뼈 감소, 30~36일 → 중수·중족골 성장 억제. 1분기에 격리한다.</span></span></p><p class="bx-num"><span class="bxn">143.</span><span>로코위드(Astragalus·Oxytropis)<span class="hang">스와인소닌(내생균 Undifilum oxytropis가 생산)이 α-만노시다제를 억제해 리소좀 축적병을 일으킨다.</span><span class="hang">번식 실패·배아 손실·유산·기형이 중증 신경 증상보다 먼저 나타난다. 태아 기형: 단하악, 관절 구축·과신전, 사지 회전, 골다공증·골 취약.</span><span class="hang">기호성이 낮지만 강제 방목 후 선호가 생긴다. 일부 종은 질산염·셀레늄도 축적한다.</span></span></p><p class="bx-num"><span class="bxn">144.</span><span>브룸 스네이크위드(Gutierrezia): 과방목·가뭄·화재 후 번성하며 사포닌·푸라노디테르펜산(이소쿠프레스산 유사)을 함유한다. 주로 3분기 방목 시 유산, 후산정체 → 자궁 감염. 저영양이 임성 문제를 악화시키고 보충 단백·에너지가 테르펜 분해·배출을 촉진하므로 영양·방목지 관리가 예방이다.</span></p><p class="bx-num"><span class="bxn">145.</span><span>좁은잎 섬프위드(Iva angustifolia): 어린 식물(2~8엽기) 섭취 → 조기 유선 발달·유즙 분비, 임신 4~8개월 유산·조산(독성 성분 불명).</span></p><p class="bx-num"><span class="bxn">146.</span><span>브라질 유산 식물: Ateleia glazioviana·Tetrapterys(6~9개월 유산, 태아 피하 부종·우심실벽 비후), Stryphnodendron obovatum 꼬투리(건기 섭취, 유산·미라 태아), Mimosa tenuiflora(기형).</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">147.</span><span>생식 독성 물질은 단독으로 또는 환경·영양·감염 스트레스와 상호작용하여 불임·배아 사망·기형·태아 사망·유산·사산을 일으킨다. 유산은 기아, 유독식물·식물독·곰팡이독 등 환경 원인에서도 관찰되며, 유산 원인 표의 영양·독성 항목에는 사료 에스트로겐, 아플라톡신·에르고타민·Fusarium(제아랄레논), 질산 비료, 유기인계, 솔잎·로코위드·섬프위드 중독이 든다.</span></p><p class="bx-num"><span class="bxn">148.</span><span>PCB·유기염소계: 하수 슬러지(PCB 고농도)로 시비한 목초지·사료 → PCB가 난자 성숙을 손상시키고 난소 옥시토신·자궁 PGF2α 분비를 늘려 황체 교란·착상 장애를 일으킨다. 유기염소(DDT 등)도 임신우 황체의 옥시토신 합성을 자극해 유산 위험을 높인다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">149.</span><span>적절한 사료 배합, 사료대 접근 개선, 우방 이동 최소화, 과밀 감소로 섭취·광물질·에너지 균형을 관리하면 체형이 유지되고 번식 효율이 최대가 된다.</span></p><p class="bx-num"><span class="bxn">150.</span><span>갓 젖을 뗀 후보우는 과밀을 피하고 5~10두의 작은 무리로 허치에서 옮긴다 — 사료 변화·병원체 도전에 적응할 기회를 준다. 검역 기간은 새 환경·사료에 순응하는 시간도 벌어준다.</span></p><p class="bx-num"><span class="bxn">151.</span><span>번식 성적과 체형 쌓기의 시기(육우)<span class="hang">분만 후 발정 재개와 수태는 대사적으로 우선순위가 낮아 유지·성장·비유·기초 에너지 비축이 채워진 뒤에야 일어난다. 분만 전 영양 공급과 그 결과인 분만·교배 시 BCS가 육우·후보우 번식 성적을 결정하는 가장 중요한 요인이다.</span><span class="hang">분만 후 유지 이상의 에너지 섭취도 도움이 되지만, 체형으로 에너지를 쌓는 데 비용이 가장 적게 드는 시기는 젖떼기와 임신 마지막 60~80일 사이다.</span><span class="hang">조기 젖떼기는 비유 중 체형 손실을 막아 이후 인공수정 수태율·임신율을 높인다.</span><span class="hang">목표는 암소가 임신 후기·산유 정점을 견디고 교배 시작 20~40일 전에 발정을 재개하도록 생산 주기 전체를 관리하는 것이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">152.</span><span>사료통·물통은 자주 비우고 청소한다(뚜껑·부표식 급수기 주의). 소 바이러스성 설사 바이러스(BVDV)는 수성 물질·점액 속에서 숙주 밖에서 오래 생존해 사료·물을 통해 전파될 수 있다.</span></p><p class="bx-num"><span class="bxn">153.</span><span>독성 조류 번성이 남아 있을 수 있는 고인 물이 많은 구역은 방목하지 않는다. 임신 후보우·임신우는 가장 깨끗한 물에 접근시키고 자연 하천·연못은 피한다(렙토스피라 소변 오염).</span></p><p class="bx-num"><span class="bxn">154.</span><span>사료·곡물은 밀폐된 보호 구역에 보관해 야생 갯과 동물(Neospora caninum 종숙주) 분변, 새·설치류(살모넬라)에 의한 오염을 막는다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">155.</span><span>임신 중 모체 영양·광주기·계절 효과(가을 분만 우군과 봄 분만 우군의 산후 무발정 간격·수태율·이유체중 차이)의 일부는 자궁 내 영양·폐기물 교환 변화로 프로그래밍될 수 있다.</span></p></div>
</div>

  `;
}
function reproExamHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('clipboard',16)} 직장검사 — 생식기 해부·직장검사</div>
<div class="rb-block"><ol class="rb-list">
<li class="grp">자궁은 짧은 자궁체에 긴 자궁각 두 개가 달린 구조임. 두 각이 갈라진 뒤에도 복막이 두 각을 한 덩어리로 싸매고 있어서 자궁체가 실제보다 길어 보임. 직장검사에서 자궁체를 잡았다고 느낀 자리가 사실은 두 각의 시작부일 때가 많음. 그래서 자궁체는 겉으로 10cm쯤 돼 보이지만 실제 길이는 2~3cm임.</li>
<li>자궁각은 앞으로 뻗다가 배쪽으로 꺾이고 다시 뒤로 휘어 난소 위쪽에서 끝남. 소의 난소는 다른 종보다 골반에 가깝고 난소간막이 짧아 자궁각을 배쪽·꼬리쪽으로 끌어당김. 그래서 난소와 자궁이 골반 바닥 쪽으로 휘어 매달려 있다는 게 직장검사의 전제임.</li>
<li class="grp">난소는 좌우 1개씩, 길이 2~3cm이고 난포·황체 유무에 따라 크기가 변함. 바깥 피질에 난포와 황체가 들어 있고 안쪽 수질은 결합조직·혈관·신경임. 고유난소인대는 2~3mm 오독오독한 감촉이고 난포·황체 위치를 기록하는 기준이 됨.</li>
<li>난관은 자궁각 끝에서 뻗은 20~25cm 가는 관임. 누두부는 복강 쪽으로 열려 있고, 팽대부는 가장 넓고, 협부는 가장 좁아 자궁과 연결됨. 배란된 난자는 난관채가 받아채 누두부 안쪽 팽대부로 들어감. 수정이 일어나는 곳은 자궁이 아니라 여기임. 수정란은 팽대부에서 만들어진 뒤 구불구불한 협부를 지나 자궁각으로 내려옴. 난관은 직장검사로는 보통 촉지하지 못함.</li>
<li class="grp">자궁벽은 장막·근층·내막 세 겹인데 임상에서 의미 있는 건 내막임. 내막에는 혈관이 빽빽한 소구(caruncle)가 약 100개 박혀 있고, 임신이 되면 태아쪽 융모엽(cotyledon)과 단추 채우듯 맞물려 태반분엽(placentome)을 이룸. 태반정체로 태반이 끈질기게 안 떨어지는 이유가 이 소구–융모엽 맞물림 구조임.</li>
<li class="grp">자궁경관은 단단하고 근육질이며, 내강으로 돌출된 3~4개의 원형주름이 서로 맞물려 자궁을 바깥과 차단함. 직장검사든 인공수정이든 먼저 경관을 찾으면 그 앞이 자궁이라는 위치 감각이 잡힘. 경관이 손끝의 기준점임.</li>
<li>자궁경관의 질쪽 끝은 질 안으로 돌출해 있는데 꼬리쪽·아래쪽으로 기울어 있어서, 그 둘레의 질원개가 위쪽은 깊고 아래쪽은 얕음. 인공수정 때 기구가 배쪽으로 미끄러지지 않도록 위쪽 45도로 넣는 이유임.</li>

<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('search',16)} 교배 — 교배 방식과 유전정보를 이용한 교배</div>
<div class="rb-block"><div class="modal-sub" style="margin:14px 0 6px;">교배 방식의 기본 분류</div><p class="rb-p">가축만이 아니라 포유류는 수컷과 암컷의 교배로 자손을 만든다. 가축은 사람이 그 교배에 관여하는데, 그 교배 방법을 「교배 방식」이라 한다. 교배 방식은 크게 임의교배(무작위 교배)와 비임의교배(작위 교배)로 나뉜다. 임의교배는 가축 집단에서 무작위로 뽑힌 암수끼리의 교배로, 집단의 유전적 다양성이 유지되는 랜덤한 교배라 할 수 있다. 비임의교배는 일정한 방침에 따라 선발한 암수를 교배시키는 방법이다.</p><p class="rb-p">비임의교배는 「표현형이 닮았는가」에 따른 교배와 「혈연이 가까운가」에 따른 교배로 나눌 수 있다. 표현형에 따른 교배에는, 표현형이 비슷한 것끼리—예를 들어 체격 큰 것끼리—붙이는 유사교배와, 표현형이 다른 암수를 붙이는 비유사교배가 있고, 이는 집단을 고르게 만들고 싶을 때 등에 쓴다. 혈연에 따른 교배는 혈연의 멀고 가까움을 따져서 하는 교배로, 가까운 혈연끼리의 극단적인 예가 근친교배다. 근친교배는 개체 유전자의 호모접합화가 진행되므로 계통을 만들 때 유용 유전자를 모으고 고정하는 데 유용하다. 한편 근친교배는 여러 유전적 능력이 떨어지는 근교퇴화라는 현상도 일으킨다. 이는 유해 유전자가 호모화되기 때문으로 본다. 먼 혈연끼리의 원연교배는 근친교배로 인한 유전적 폐해를 피하려고 많이 쓰며, 집단의 근교계수를 낮추는 목적 등에 쓴다.</p><div class="modal-sub" style="margin:14px 0 6px;">대표적인 교배 방식</div><p class="rb-p">품종 안에서 혈연적으로 가까운 집단을 「계통」이라 부르고, 이 계통이나 품종을 기준으로 한 교배 방식이 있다. 이 교배 이름들은 흔히 쓰이므로 아래에 설명한다.</p><p class="rb-p" style="font-weight:700;margin-top:10px;">계통교배(순계교배)</p><p class="rb-p">유전적으로 가까운 계통 안에서의 교배를 「계통교배(순계교배)」라 한다. 그중에서도 형제끼리, 조부와 손녀 같은 예는 「근친교배」라 부른다. 일본 흑모화종에서는 메이지 이전에 주고쿠 지방에서 하던 「쓰루우(つる牛)」 조성도 계통교배로 만든 것이며, 화우 개량에 크게 공헌했다. 계통교배도 근친교배만큼은 아니지만 유용 유전자의 고정에 공헌하는 한편 유해 유전자의 호모화도 진행된다. 따라서 집단 안의 유전적 다양성을 유지하기 위해서라도 공조계수 등을 고려하면서 교배할 필요가 있다.</p><p class="rb-p">※ 공조계수: 「근연계수」라고도 하며, 개체 간 혈연관계의 정도를 재는 지표의 하나. 두 개체에서 무작위로 뽑은 유전자가 같은 조상에서 유래했을(IBD) 확률로 정의한다. 양친 두 개체의 공조계수는 자식의 근교계수와 같다.</p><p class="rb-p" style="font-weight:700;margin-top:10px;">계통간교배</p><p class="rb-p">만들어진 계통끼리의 교배를 「계통간교배」라 한다. 계통마다 다른 유전적 배경과 유전적 분화를 기대할 수 있는 교배다. 그래서 유전자의 헤테로접합성이 높아지고, 자식의 능력이 양친 능력의 평균값보다 높아지는 효과도 기대된다. 이 현상을 「헤테로시스(잡종강세)」라 한다. 이로써 송아지의 출생체중, 생존성, 포육능력 등이 높아지고, 번식에 쓰면 수태율과 포육능력 등이 높아지는 것이 알려져 있다. 한편 유전율이 높은 체중, 유량, 지육형질 등에서는 헤테로시스가 별로 보이지 않고, 자식의 능력은 양친의 중간값을 보인다.</p><p class="rb-p" style="font-weight:700;margin-top:10px;">품종간교잡</p><p class="rb-p">유전적으로 먼 품종끼리의 교배를 「품종간교잡」이라 한다. 헤테로시스 효과를 기대하거나 소 생산 시스템상 편리해서 하는 경우가 많다. 일본에서는 홀스타인 번식우의 약 40%(2018년 기준)에 흑모화종 정액을 쓰는 품종간교잡을 한다. 호주에서는 앵거스와 흑모화종을 교잡해 일본·아시아용 비육 밑소로 쓰고 수출한다.</p><p class="rb-p">일본에서 홀스타인 암소에 흑모화종 정액을 자주 쓰는 이유는, 젖소인 홀스타인은 우유를 내려면 정기적으로 새끼를 낳아야 하지만 같은 품종끼리 붙일 필요는 없기 때문이다. 흑모화종과 교잡하면 홀스타인과 흑모화종의 중간쯤 되는 지육을 생산할 수 있어 비육우로 적합하다. 이 교잡우는 적당한 가격과 육질을 원하는 소비자 수요에 맞는다.</p><div class="modal-sub" style="margin:14px 0 6px;">유전정보를 이용한 교배</div><p class="rb-p">가축 육종에서는 어미로서 바람직한 형질을 가진 개체를 선발하는 것이 중요하다. 가축의 경제형질은 대부분 양적형질이다. 옛날 사람들은 오랜 세월 이 경제형질에 대해 겉모습(표현형)으로 동물을 골라 왔다. 18세기 영국의 Bakewell이 동물 육종 이론의 싹을 틔웠다. 그와 제자들은 개량 목표 설정, 개체 선발, 우량 형질 고정을 위한 근친교배, 해외 우량 개체 도입 같은 새 이론을 받아들여 지금도 남아 있는 가축 품종을 많이 만들었다.</p><p class="rb-p">20세기에 들어 멘델 유전법칙이 인정되고, 양적형질도 효과가 작은 많은 유전자를 가정하면 설명이 된다는 것을 알게 됐다. 유전자 개념이 뿌리내리자 1930년대에 집단유전학과 양적유전학의 기반이 세워졌다. 그 집대성이 Henderson이 개발한 BLUP법이다. 1950년대에 이미 이 발상은 있었지만 동물 육종 현장에서 쓰이게 된 것은 컴퓨터가 보급된 1970년대부터다. BLUP법은 개체가 가진 생산능력 기록을 바탕으로 가축 개체의 유전적 능력을 예측하고, 종축의 유전 효과를 구체적인 수치(육종가)로 추정하는 통계 기법이다.</p><p class="rb-p">일본 흑모화종에도 BLUP법은 1990년대 전반부터 시행되어, 화우 개량의 비장의 카드로 전국화우등록협회 주도로 이 방법에 의한 육종가 평가가 도입되어 지금에 이른다. BLUP법에서는 양친의 육종가를 평균하면 산자의 능력을 추정할 수 있다. 지금 육종가 이용은 우수한 산자를 만드는 데 강력한 교배 방법의 하나다.</p><p class="rb-p">20세기 이후 동물 육종에 큰 영향을 준 또 하나의 흐름이 분자유전학의 발전이다. 특히 1980년대 이후 가축의 DNA 해석이 활발해졌다. 그 성과로 개체 식별과 친자 감정, 유전병 원인 유전자의 특정과 배제, 경제형질 관련 유전자의 동정과 이용을 들 수 있다. 한편 지육형질이나 육질 같은 경제형질은 작은 효과를 가진 유전자가 많아서인지, 지금도 동정된 원인 유전자와 그 이용은 한정적이다.</p><p class="rb-p">21세기에 들어 사람의 전 게놈이 해명되면서 주요 동식물의 전 게놈 배열이 잇달아 밝혀졌다. 소도 2009년에 전 게놈이 완전히 해독됐고, 같은 시기에 수만 개 이상의 SNP를 해석할 수 있는 고밀도 SNP 어레이(DNA 칩)도 개발되어 여러 해석이 진행 중이다. 이 SNP 유전정보를 이용한 추정 육종가(게놈 육종가) 이론도 확립되어, 소 현장에서도 이를 이용한 교배 계획이 시작됐고 그 유용성이 기대된다.</p><div class="modal-sub" style="margin:14px 0 6px;">교배의 유의점</div><p class="rb-p">송아지의 출생체중은 아비소의 영향이 크다. 따라서 흑모화종이라도 체격이 작은 어미소에 체격이 큰 종모우를 교배하면 난산 발생률이 올라가고 어미와 새끼를 모두 위험에 빠뜨린다.</p><p class="rb-p">홀스타인 암소와 흑모화종 종모우의 품종간교잡은 기본적으로 홀스타인이 더 커서 거의 문제가 되지 않았다. 그러나 최근 흑모화종에서 산육량을 늘리는 개량이 진행돼 발육 좋은 종모우도 만들어졌다. 따라서 이런 품종간교잡이라도 종모우의 체격 등에는 주의할 필요가 있을 것이다.</p><p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 1-1 품종 「교배」, 万年英之. 원문 그대로 번역, 정리 전.</span></p></div>
<div class="modal-sub" style="margin:22px 0 6px;">유전성 질환 (일본송아지 1-6)</div><div class="rb-block">
<p class="rb-p">동결정액 AI로 고비유 젖소와 우수 육질 육우를 효율적으로 생산하게 됐지만, 우수 종모우의 집중 이용으로 유전성 질환도 급속하고 광범위하게 퍼졌다. 특히 상염색체 열성 질환은 표현형으로는 보인우와 정상우를 구별할 수 없는데 후대에 1/2 확률로 질환 유전자를 넘기므로, 종모우가 보인이면 빠르게 퍼진다. 최근 역학 연구로 보인우가 밝혀지고 교배 계획으로 컨트롤하고 있지만, 변이가 해명되지 않은 선천성 질환도 많다.</p>
<p class="rb-p" style="font-weight:600;font-size:13px">표. 소의 대표적 유전성 질환 (AR 상염색체 열성, AD 우성)</p><div style="overflow-x:auto"><table class="jp-tbl"><tr><th>품종</th><th>질환</th><th>유전</th></tr><tr><td>홀스타인</td><td style="text-align:left">소백혈구점착부전증(BLAD)</td><td>AR</td></tr><tr><td>홀스타인</td><td style="text-align:left">선천성 포르피린증</td><td>AR</td></tr><tr><td>홀스타인</td><td style="text-align:left">횡격막근증</td><td>AR</td></tr><tr><td>홀스타인</td><td style="text-align:left">복합척추형성부전(CVM)</td><td>AR</td></tr><tr><td>홀스타인</td><td style="text-align:left">브라키스파이나(BY)</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">밴드3 결손증(유전성 구상적혈구증)</td><td>AD</td></tr><tr><td>흑모화종</td><td style="text-align:left">제XI인자 결핍증</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">제VIII인자 결핍증(폰 빌레브란트병)</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">제XIII인자 결핍증</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">체디악-히가시 증후군</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">IARS 이상증</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">크산틴뇨증 II형</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">전지대근이상증(三枚肩)</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">요세관 이형성(클라우딘16 결손증)</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">다중성 안구형성이상(MOD)</td><td>AR</td></tr><tr><td>흑모화종</td><td style="text-align:left">마르판 증후군</td><td>AR</td></tr><tr><td>갈모화종</td><td style="text-align:left">연골이형성 왜소체구</td><td>AR</td></tr></table></div>
<div class="modal-sub" style="margin:14px 0 6px;">혈액 이상</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">소백혈구점착부전증(BLAD) — 홀스타인, AR</p>
<p class="rb-p">발열·설사 반복, 발육불량. 구강 점막 궤양·구내염·치은염, 만성 수양성 설사, 비강염·인후두염·폐렴, 상처 치유부전. 생후 수개월에 사망이 많다. 백혈구 점착분자(LFA-1, Mac-1, p150·95) 공통 β사슬 CD18 결손으로 백혈구가 병소에 붙지 못한다. CD18 유전자 383번 A→G(128번 Asp→Gly) 변이. 유세포분석으로 CD18 측정하거나 유전자 검사로 호모 확인.</p>
<div class="modal-sub" style="margin:14px 0 6px;">적혈구막 단백 이상</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">밴드3 결손증(유전성 구상적혈구증) — 흑모화종, 상염색체 우성</p>
<p class="rb-p">호모 발증우는 출생 직후부터 중증 용혈성 빈혈, 호흡촉박, 빈맥, 황달, 저체중, 비종, 허약을 보이고 대부분 생후 2주까지 죽는다. 2주를 넘기면 용혈은 사라지고 1세 이후 원기·식욕은 정상이지만 구상적혈구증 만성 빈혈과 경도 산증에 의한 발육불량이 남는다. 음이온 교환 수송체 밴드3 유전자 664번 Arg 코돈→종결 코돈(R664X). 적혈구 수·Hct·Hb 현저 저하, 도말에서 대소부동과 센트럴 페일러(정상 적혈구 중앙의 담명부)가 없는 구상 적혈구, 총담즙산·총빌리루빈 상승. 삼투압 취약성은 호모에서 현저, 헤테로에서 경도 항진. PCR로 헤테로까지 진단. 헤테로 종모우를 계통 육종에 안 쓰고 헤테로 암소와의 교배를 피하는 것이 유일한 예방.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">프로테인 4.2 이상증</p>
<p class="rb-p">신생 송아지 호흡기 증상·설사, 삼투압 취약성 경도 항진. Hb 타입 이상과 프로테인 4.2 분자량 이상으로 고도 빈혈, 성상·각형·아메바상·유극 적혈구.</p>

<div class="modal-sub" style="margin:14px 0 6px;">응고인자 이상</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">제XI인자 결핍증 — 흑모화종, AR</p>
<p class="rb-p">출혈 빈도 낮고 정도 다양. 관절 종창, 폐·장·대뇌·척수 출혈, 난포 발육부전에 의한 발정주기 이상·불임 보고도 있다. APTT 연장. 27번 염색체 F11 엑손 9의 15염기 삽입.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">제VIII인자 결핍증(폰 빌레브란트병) — 흑모화종, AR</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">체디악-히가시 증후군 — 흑모화종, AR</p>
<p class="rb-p">부분 백색증(은회색 모색), 제대 출혈, 거세 시 출혈, 피하 출혈이나 출혈은 경도라 사망은 드물다. 번식·비육에 쓰이기도 하나 비육 중 다발성 혈종 근손상, 발육불량으로 발견된다. 콜라겐에 대한 혈소판 응집 저하, 안저 색소 결손(적안). 출혈보다 이감염성(호흡기·피부염·중이염 반복)이 문제. 도말에서 호산구 세포질 내 거대 과립. 28번 염색체 CHS1(LYST) 변이. PCR 보인우 검출.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">IARS 이상증(허약 송아지 증후군) — 흑모화종, AR</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">크산틴뇨증 II형(몰리브덴 보조효소 결손증) — 흑모화종, AR</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">콜레스테롤 대사이상증(CD/HCD) — 홀스타인, AR</p>
<p class="rb-p">발열, 만성 설사, 폐렴, 부종, 발육부전, 혈중 콜레스테롤 현저 감소. APOB 엑손 5 염기 삽입. 호모는 정상 체격으로 태어나지만 대부분 3주~6개월령에 사망.</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">전지대근이상증(三枚肩) — 흑모화종, AR</p>

<p class="rb-p">생후 2~3개월령 이후 송아지에 난치성 설사·연변, 발육불량, 삭수, 과장제. 저비중뇨 대량 배설, 중증은 요독증 사망. 치료 효과 없고 다수 생후 수개월에 사망하나 수년 후 발증 예도 있다. 요세관 형성이상, 가령과 함께 신피질~수질 섬유화. 타이트 정션 단백 파라셀린-1/클라우딘16 결손. PCR로 결실 검출.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">복합척추형성부전(CVM) — 홀스타인, AR</p>
<p class="rb-p">2000년 덴마크에서 발견. 경부·흉부 척추 단축, 양 앞다리 완관절·비절 좌우대칭 수축·만곡, 심기형 동반. 주증상은 유산·사산, 약 80%가 임신 260일까지 사망. 3번 염색체 SLC35A3 변이. PCR 진단.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">브라키스파이나(BY) — 홀스타인, AR</p>
<p class="rb-p">FANCI 결실. 유사산으로 출생률 저하, 사산 태아 저체중(약 10kg), 하악이 짧아 혀 돌출, 척추 전장 극단 단축, 심실중격결손·심비대, 신장·난소·자궁·고환 무형성·저형성, 결장폐쇄. 보인율에 비해 사산 증례가 적어 다수는 배사멸·유산한다고 본다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">연골이형성 왜소체구 — 갈모화종, AR</p>
<p class="rb-p">사지 단축(뒷다리 현저), 장골 단축, 슬관절·비절 비대, O다리, 하이에나병 유사 체형, 뒷다리 착지 시 슬관절 외측 흔들림·둔부 좌우 흔듦. 골단판 두께 불균형, 연골기질 국소 괴사·융해, 골단판 폐쇄. 6번 염색체 LIMBIN 2종 변이.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">다중성 안구형성이상(MOD) — 흑모화종, AR</p>
<p class="rb-p">출생 시부터 수정체·홍채 없음, 소안구증, 완전 맹목. 치사성 낮고 맹목 외 특징 없음. 18번 염색체 WFCD1 변이.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">바터 증후군 1형 — AR</p>

function reproDopplerHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('search',16)} 도플러 — 발정주기 중 난소 혈류 변화</div>
<div class="rb-block"><ol class="rb-list">
<li>컬러 도플러 초음파는 난소 혈관 기능을 평가하는 비침습 기법임. 배란 직전 난포 벽의 정해진 영역이나 황체 내부의 혈류를 눈으로 볼 수 있음.</li>
<li class="grp">난포 성장. 편차(deviation) 전에는 나중에 우성이 될 난포와 두 번째 난포의 혈류 검출 비율이 같지만, 편차 후 두 번째 난포는 혈류가 사라짐. 편차 하루 전부터 혈류가 보이는 난포가 안 보이는 난포보다 큼. 즉 난포로 가는 혈류가 성장·선택·폐쇄를 따라감.</li>
<li class="grp">배란. 배란 직전 난포의 외난포막 혈류는 LH surge가 시작될 무렵 급격히 늘어 배란 전에 최대가 됨. 이 혈류 증가가 난포 벽이 터지는 구조·기능 변화와 맞물린 것으로 봄.</li>
<li class="grp">황체 발달. 황체는 몸에서 가장 혈관이 풍부한 기관 중 하나로, 조직 1g당 혈류량이 어떤 기관보다 많음. 황체가 발달하는 동안 초기 황체 주위 혈류는 황체 부피와 혈장 P4 농도 증가와 나란히 점차 증가함. 혈류가 P4를 생산·분비하는 능력과 밀접하게 관련됨.</li>
<li class="grp">황체 퇴행. 황체 단면 영상에서 색으로 표시된 면적 비율을 혈류 변화의 정량 지표로 본 연구들에서, 발정 후 17~18일에 황체 주위 혈류가 뚜렷이 늘고 하루 뒤 혈장 P4가 감소함.</li>
<li>이 황체 혈류 증가는 PGF2α의 대사산물인 PGFM의 혈장 농도 급증과 시기가 일치함. 주기 중반의 황체는 황체 퇴행 용량의 PGF2α를 주사한 뒤 30분 이내에 혈류가 급증해 주사 후 2시간까지 높게 유지됨. 즉 자궁 PGF2α가 일으키는 황체 혈류 급증이 황체 퇴행 개시의 핵심 현상임.</li>
<li class="grp">낭종. 난포낭종(얇은 벽)은 GnRH·hCG, 황체화 낭종(두꺼운 황체 벽)은 PGF2α로 치료하므로 유형 구분이 중요함. 컬러 도플러로 벽 두께와 혈류를 보면 구분이 쉬움. 낭종 자체는 COF 탭 참고.</li>
<li class="grp">배란 전 난포벽 혈류는 이상성임. LH 처치 3시간 내 1차 증가, 약 20시간 후 2차 증가가 옴.</li>
</ol></div>
`;
