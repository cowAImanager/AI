<p class="rb-p">전통적으로 임신율(임신 ÷ 공시 암컷)을 쓰지만, 단독으론 교배철 길이·수소:암컷 비·방목 조건·소 특성의 통찰을 못 준다. 더 완전한 분석은 &#x27;개별 소가 언제 임신했는지&#x27;와 발정 주기별 비율을 평가한다 — 분만일을 21일 간격으로 층화하는 데서 시작하고, 후보우 육성·영양·수소 특성도 함께 본다. 정확한 기록이 없는 경우가 흔해, 임상의가 쓰기 단순한 체계를 설계해 주는 게 책무다(잘 정리된 수기면 충분).</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">생산 평가 지표 (표 44.1) — 1년에 9개 수치만</span></div><ul><li>임신율 = (임신 소 ÷ 공시 암컷) × 100</li><li>분만율 = (만삭 분만 암컷 ÷ 분만 예정 수) × 100 — 역수가 만삭 유산율</li><li>분만철 폐사 = (분만철 폐사 ÷ 만삭 분만 암컷) × 100 (만삭만 셈)</li><li>포유 생존 = (이유 수 ÷ 방목 개시 수) × 100</li><li>이유율(산자율) = (이유 수 ÷ 공시 암컷) × 100</li><li>공시 암컷당 이유 체중 = 이유 총 체중 ÷ 공시 암컷</li></ul></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">중서부 권장 벤치마크 (표 44.2)</span></div><ul><li>임신율 90% / 분만율 97%</li><li>만삭 임신 손실 3% / 총 송아지 폐사율 5%</li><li>이유율 85% / 공시 암컷당 생산 체중 500 lb</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">지표 해석 주의</span></div><div class="rb-cc-b">임신율은 수태 시점·교배철 길이·임신 분포를 못 준다 — 이전 교배철 &#x27;전체 공시 암컷&#x27;에 근거해야 하고 분만·임신 분포와 결합해야 유용. 분만율은 임신 판정 후 태아 손실과 직접 관련(역수=만삭 유산율), 분만 예정 수는 분만철 시작 시 임신 재고 기준(공시 암컷 아님). 송아지 폐사는 분만철 vs 포유기로 나눠 &#x27;언제&#x27; 일어나는지 봐야 원인(연령·단계별)을 안다.</div></div>
<div class="rb-sub">임신 분포 — 정상·후방적재·수소 실패</div>
<p class="rb-p">임신·분만 기록으로 21일 구간별 히스토그램을 구성한다(임신 검사 시 태령 추정 필요). 전체 무리로 만든 뒤 품종·연령·체형·방목지별로 세분한다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">임신 분포 — 세 양상</span></div><ul><li>정상(그림 44.1): 제한 교배철(45~75일)의 성숙 소(4~8세) 목표 = 첫 21일 구간 최소 60% 수태·공태 10% 미만</li><li>후방적재(back loaded, 그림 44.2): 거의 절반이 63일 이후 수태 지연·공태 — 부실한 영양 관리(특히 어린 소)나 임신 초기 태아 손실 병원체. 송아지 이유 체중↓·고르지 않아 가치↓·후보우 육성 어려움</li><li>수소 실패(그림 44.3): 교배철 잘 시작됐으나 수태가 급작 종료 — 수소 부상(음경 혈종·포피 열상·파행)이나 우위 수소의 저임성. 극단 고온·곰팡이 페스큐(열 보유)·과비 어린 수소도 정액 질·성욕 저하</li></ul></div>
<p class="rb-p">교배철 평가의 목적은 생산 문제를 정의하고 관리 해결책을 자리 잡게 하는 것이다 — 손실 규모뿐 아니라 어느 관리 그룹이 영향받는지, 관리/질병 중 어느 병인인지 판정한 뒤 회복 전략을 시행하고 매년 모니터링을 계속한다. 번식 질병 의심 시 임신·분만 분포를 분만율·송아지 폐사 정보와 결합하면 손실 시점을 짚어 병원체 통찰·진단 프로토콜을 안내한다.</p>
<div class="rb-sub">요약</div>
<p class="rb-p">번식 무리의 번식 효율이 목장 수익성을 추동한다. 최적 번식 성적은 임신 소의 절대 수가 아니라 임신의 &#x27;시기·분포&#x27;도 포함한다 — 출하 이유 송아지가 주 수입원이므로 번식·이유율·이유 체중의 관계를 강조하는 게 결정적이다. 임상의는 문제 식별·추세 인지·비용 효율적 해결책 자문을 요청받고, 생산자가 정확한 기록을 제공하면 이 과정이 훨씬 쉬워지며, 그 기록은 무리 생산성 변화를 매년 평가하는 수단이 된다.</p></div>
<div class="grass-section-title"><span class="gst-wrap"><span class="gst-main">${svgIcon('bar-chart-2',15)} 25. 젖소 무리 기록 분석</span><span class="gst-sub">모니터링·벤치마킹·문제해결 / 번식 매트릭스(PR·CR·HDR) / VWP·FSED·FSTAI·SSED·SSTAI / 교배 간격·유산·결함 지표 / 후보우 번식</span></span></div>
<div class="rb-block"><div class="rb-sub">서론 — 모니터링·벤치마킹·문제 해결</div>
<p class="rb-p">번식 효율은 젖소 성적·수익성의 핵심 동인이다. 기록 분석 전 &#x27;어떤 질문에 답하려는지&#x27;를 명확히 해야 한다 — 분석 이유는 무리 성적 모니터링, 문제 해결(troubleshooting), 연구 자료 수집으로 나뉜다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">세 가지 분석 목적</span></div><ul><li>모니터링: 프로토콜 순응도 + 프로그램 작동을 주기 점검(예: 자궁염 월별 모니터, 15% 초과 시 위험요인 조사). 목표는 구체적·관련적·현실적</li><li>벤치마킹: 지표를 다른 농장·산업 평균과 비교 — 적절하면 목표 설정에 도움이나, 농장이 이미 웃돌거나 한참 밑돌 수 있어 주의(밑돌면 더 낮고 현실적 목표+기한)</li><li>문제 해결: 특정 우려를 철저히 조사 — 먼저 문제 존재 확인 → 무리 영향 정량화 → 더 좁게 정의(예: 수태율 저하가 첫 수정 TAI 시점 일탈에서 비롯)</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">자료 품질이 먼저</span></div><div class="rb-cc-b">분석 전 자료 품질 검토가 필수 — 입력 관행·완전성을 논의하고, 누락·오류를 해결할 때까지 분석을 미룬다. 세분 시 그룹 크기를 유념(표본 작을수록 우연이 차이를 냄), 기간 확대는 수를 채우나 관성(과거 자료 영향)을 더해 문제 식별을 지연시킬 수 있다. 자료 제한 시 중앙값·통계적 공정 관리·하한 신뢰구간을 고려. (DairyComp·PCDart, DHIA 보고서 DHI-202·DHI-350 활용; 지표 계산은 센터마다 달라 확인 필요.)</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">번식 지표 평균 (표 45.1, 7842개 무리)</span></div><ul><li>임신율(연평균): 평균 19.5%, 상위 20%는 26%</li><li>수태율(첫 수정, 지난 12개월): 평균 40.0%, 상위 50%</li><li>수태율(2차 이후): 평균 40.7%, 상위 50%</li><li>연간 관찰 발정 비율: 평균 48.2%, 상위 62%</li></ul></div>
<div class="rb-sub">번식 매트릭스 — PR·CR·HDR과 6구성요소</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">기본 지표 (예: 100두 자격, 50두 수정, 25두 임신)</span></div><ul><li>임신율 PR = 21일간 임신 수 ÷ 같은 21일간 교배 자격 수 = 25%</li><li>발정 발견율 HDR = 21일간 수정 수 ÷ 교배 자격 수 = 50%</li><li>수태율 CR(P/AI) = 수정군 임신 수 ÷ 수정 수 = 50%</li><li>PR = CR × HDR 관계</li></ul></div>
<p class="rb-p">이 지표의 추세를 아는 건 도움이 되나 관리에 쓸 구체성은 부족하다 — 번식 프로그램을 구성요소로 나눠 각각의 순응도(프로토콜 준수)·효능(작동)을 봐야 한다. 단 관리 교정이 가능한 곳에 한정하고, 필터링 편향에 주의한다. 초산우는 일반적으로 임성이 높아 그룹이 충분히 크면 별도 분석이 유익하다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">번식 프로그램 6구성요소</span></div><ul><li>VWP: 자발적 대기 기간</li><li>FSED: 첫 수정 발정 발견</li><li>FSTAI: 첫 수정 정시인공수정</li><li>SSED: 2차 이후 수정 발정 발견</li><li>SSTAI: 2차 이후 수정 정시인공수정</li><li>DNB: 비교배 정책</li><li>(100% FSTAI 농장은 FSED 없음, 전적 관찰 발정 농장은 FSTAI·SSTAI 임성 평가 불가)</li></ul></div>
<div class="rb-sub">구성요소별 분석 — VWP·FSED·FSTAI</div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">자발적 대기 기간(VWP)</span></div><div class="rb-cc-b">두 가지 VWP가 있다 — 명시 VWP(sVWP)는 관리자가 정한 교배 자격 최소 비유일수(DIM), 실제 VWP(aVWP)는 소가 실제 처음 교배되는 시점(약 5%가 처음 수정된 DIM로 추정). 둘이 다르면 첫 수정 프로토콜을 직원과 검토하고, aVWP를 알면 더 정확한 발정 발견·PR 계산이 가능하다.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">FSED·FSTAI 성적</span></div><ul><li>FSED(첫 수정 발정 발견): 잘 관리되는 무리는 FSTAI 전 50~80%를 수태율 30~45%로 교배</li><li>FSTAI(첫 수정 TAI): 프로토콜 임성 P/AI 24~60% — 단계가 올바른 날에 일어나는지 점검</li><li>연구 비교 시 설계 차이 고려(시작 DIM·호르몬 수/간격·발정 시 제외·임신 검사 시점)</li><li>관찰 발정으로 첫 수정 잘하는 무리는 100% TAI 무리보다 TAI 소 P/AI가 약간 낮은 경향(임성 소가 발정으로 빠져나가서)</li></ul></div>
<div class="rb-sub">구성요소별 분석 — SSED·SSTAI·DNB</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">SSED·SSTAI 성적</span></div><ul><li>SSED(2차 이후 발정 발견): 자격 소의 65~75%를 P/AI 30~41%로 교배 가능(넓은 범위는 이전 교배~다음 TAI 간격 등 변수 반영)</li><li>SSTAI(2차 이후 TAI, 재동기화): P/AI 22~43%, 재동기화 교배 비율은 발정 발견 안 쓰는 농장의 낮은 20%부터 100%까지</li><li>DNB·도태: 비유우가 더는 수익적이지 않은 시점 — 무리 제거 정책을 설정·검토하고 준수를 모니터</li></ul></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">TAI 프로토콜별 P/AI (표 45.3·45.4, FSTAI / SSTAI)</span></div><ul><li>GPG(Ovsynch 변형): 24~45 / 25~33</li><li>PPGPG(Presynch-Ovsynch): 31~59 / —</li><li>GGPG(preGnRH Ovsynch): 40~48 / 22~40</li><li>GPGGPG(더블-Ovsynch): 36~55 / 35~43</li><li>TAI+2차 PG(TAI 전 PGF 추가): 36~57 / 31~42</li><li>TAI+P4(프로게스테론 보충): 25~38 / 31~39</li></ul></div>
<div class="rb-sub">기타 번식 분석 — 교배 간격·수정사·계절</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">교배 간격 (표 45.5, 37무리)</span></div><ul><li>대다수 교배는 발정 주기 길이 18~24일에</li><li>4~17일 교배: 10% 미만 유지(임성 낮아 높으면 부정확한 발정 발견 지표) — 중앙값 9%</li><li>48일 초과 교배: 15% 넘으면 발정 발견 개선·공태 소 빨리 재등록 — 중앙값 10%</li><li>임신율(표준 50일 VWP) 중앙값 24%</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">수정사·계절·고급 기술</span></div><div class="rb-cc-b">수정사를 기록에 식별하되 임성 비교는 주의(흔히 다른 그룹 교배 — 주말 발정 소만 / 동기화 AI 전담 / &#x27;문제 소&#x27;만). 주·월·계절별 CR 추적으로 정액 저장·취급 문제나 열 스트레스 효과를 식별. ET/IVF/OPU를 많이 쓰는 농장은 효율 저하를 볼 수 있다(채란용 수란우 확보로 후보우 교배를 미루면 초교배 연령↑·HDR↓).</div></div>
<div class="rb-sub">건강과 번식 — 전이기·유방염·파행·유산</div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">전이기·유방염·파행</span></div><div class="rb-cc-b">신선우 질환(특히 자궁염·케토시스)이 부진한 번식으로 이어진다 — 증례 정의로 일관 기록하고 월별 발생률 계산(위험 집단=해당 월 분만 소). 분만성 자궁염은 비유 첫 14일에 일어나 15 DIM 이상으로 한정(위험창 완료 전 도태는 예외). 비유 초기 높은 SCC·임상형 유방염도 번식 위험 — 신규 잠재성 감염·만성·임상형률을 일상 평가. 파행은 신규 사건을 정기 손질·만성과 분리 기록(치료율 100두당 사례·병변·DIM 양상), 과소 보고되니 보행 점수와 교차 참조. 난산·DOA는 신선우 질병·부실 산유·조기 도태로.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">유산율 — 두 계산</span></div><ul><li>참 유산 발생률 = 위험창 내 유산 ÷ [(위험창 통과 임신 소) + (위험창 내 유산)]</li><li>조유산율(crude) = 기간 내 손실 임신 ÷ 같은 기간 생성 임신</li><li>임신을 더 일찍 진단할수록·최초~재확인 간격이 길수록 &#x27;정상&#x27; 손실 비율이 높아짐</li><li>28일 진단~분만까지 전체 25% 손실(표 45.6), 후기 배아(28~60일) 폐사 평균 12.8%(3.2~42.7%)</li></ul></div>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">결함 있는 지표 — 피하라</span></div><div class="rb-cc-b">다음 전통 지표는 의미 있는 정보를 못 줘 피한다 — 분만 간격(CI): 지연 정보이고 2회 분만 안 한 소(현재 공태 소)를 제외 / 공태기(DOPN): 임신 미확인 소 제외 / 수태당 수정 횟수(SPC): 임신 미확인 소를 모두 제외해 부정확. 모두 &#x27;임신 확인된 소만&#x27; 보는 생존자 편향이 문제.</div></div>
<div class="rb-sub">후보우 번식</div>
<p class="rb-p">후보우 번식 관리 이해는 성우만큼 중요하다 — 초교배·초산 연령, VWP(체중), HDR, PR, CR로 나눈다. 평균 초산 연령은 흔히 인용되나 관리에 둔감하고, &#x27;분포&#x27;를 보면 적시 수태 못 한 비율과 지연의 경제적 결과를 추정할 수 있다. 초교배 연령 분포는 목표를 놓친 동물(의도적 지연 vs 프로토콜 붕괴)을 식별.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">후보우 번식 목표</span></div><ul><li>VWP: 성숙 체중 55~60% 도달 + 초산까지 목표 성장률 유지 시 교배 시작</li><li>HDR: 후보우는 행동 발정을 잘 나타내 성우보다 높음 — 70~75% 달성, 교배방 진입 45일 내 90% 첫 수정(365일 VWP 기준 평가로 지연 발견→불필요 육성비↓)</li><li>PR: 후보우 교배 프로그램 효과의 최선 척도 — 40~50% 일관 달성</li><li>CR: 성우보다 임성 높아 통상 정액 60~65% 목표(발정 발견 불가 시 FTAI로 P/AI 50~65%)</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">성판별 정액·ADG</span></div><div class="rb-cc-b">성판별 정액은 주로 후보우에 써 유전 진보를 가속하고 가장 임성 높은 동물에 사용해 비용 최소화(기술 발전으로 임성이 통상 정액에 근접) — 성판별·통상 정액 임성을 추적. 많은 농장·위탁 육성업자가 후보우를 정기 칭량해 ADG를 모니터, 성장 장벽을 조기 교정해 목표 연령에 교배 체격에 이르게 한다(농장마다 다른 정확한 평균 성숙 체중을 알아야 함).</div></div>
<div class="rb-sub">결과 요약과 보고</div>
<p class="rb-p">분석 후 유의한 결과를 요약해 관리자에게 보고하고, 교정 조치 권고와 가능하면 재무 영향·교정 비용을 포함한다(부분 예산이 유용). 번식 경제는 복잡해 Wisconsin-Cornell Dairy Repro 같은 모델링 도구로 프로그램 비교·개선 추정을 한다. 일상 모니터링이면 무리 위생 방문에 보고를 포함하고, 문제 해결 분석은 더 상세히 문서화해 농장 기록에 포함·공유한다 — 진전 추적·향후 조사의 과거 기록으로 특히 유용하다.</p>
<p class="rb-p">젖소 번식 기록의 정확한 분석은 교배 프로그램 내 문제를 조기 식별·교정하고 목표를 추적해 개선을 동기화하게 한다. 농장 기록에서 통찰을 제공하는 자문가는 젖소 관리팀에서 결정적 역할을 한다.</p></div>
<div class="grass-section-title"><span class="gst-wrap"><span class="gst-main">${svgIcon('search',15)} 26. 무리 진단 검사 전략</span><span class="gst-sub">진단 검사 유용성·민감도/특이도(분석적 vs 진단적)·유병률·검사 후 예측도(PPV/NPV)·직렬/병렬 검사</span></span></div>
<div class="rb-block"><div class="rb-sub">서론 — 진단 검사란</div>
<p class="rb-p">임상수의사는 무리 번식 목표(임성 향상·불임 최소화, 감염성/대사성 질병 영향 최소화, 유전 가치 향상)를 돕는다. 개체·무리의 질병·생산 특성에 대한 &#x27;불확실성을 줄이는 모든 검사·절차&#x27;를 넓게 진단 검사라 한다 — 혈청학·면역조직화학·PCR·바이러스 분리·세균 배양 같은 감염원 실험실 검사뿐 아니라, 수소 번식 건전성 검사·후보우 생식기 점수·임신 진단·체형 점수·사료 평가도 포함된다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">검사를 쓸지 판정</span></div><div class="rb-cc-b">특정 상태에 가용 검사를 쓸지 결정하는 입력: 검사 사용·해석의 용이성, 상태의 유병률·확률, 진단 민감도·특이도, 질병 역학, 상태와 그 치료·예방의 경제적 비용. 문헌 리뷰·스프레드시트로 검사 후 예측도, 경제적 가치, 결정의 민감도를 계산한다.</div></div>
<div class="rb-sub">민감도와 특이도 — 분석적 vs 진단적</div>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">두 맥락을 구별하라</span></div><div class="rb-cc-b">&#x27;민감도&#x27;·&#x27;특이도&#x27;가 분석적(analytic)인지 진단적(diagnostic)인지 모르면 검사 결과에 오도될 수 있다 — 이 구별이 결정적이다.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">분석적 vs 진단적</span></div><ul><li>분석적 민감도: 실험실 특성 — 검출 가능한 물질의 최소량(농도, ng/ml·ppm). 높으면 매우 낮은 농도도 검출</li><li>진단적 민감도: 표준(gold standard) 대비 집단 특성 — &#x27;실제 그 상태인 동물 중&#x27; 검사가 양성으로 식별한 비율 = 진양성 ÷ (위음성+진양성)</li><li>분석적 특이도: 비표적 물질과의 교차반응성이 낮은 정도(실험실)</li><li>진단적 특이도: &#x27;실제 상태 없는 동물 중&#x27; 검사가 음성으로 식별한 비율 = 진음성 ÷ (위양성+진음성)</li></ul></div>
<p class="rb-p">수의학은 인의학과 달리 진단 검사 규제 감독이 면밀하지 않으므로, 수의사가 품질 보증·관리의 필요를 인식하고 실험실 검사뿐 아니라 수소 번식 건전성·생식기 점수·임신 진단·체형 점수·청진 등 &#x27;진료에서 쓰는 모든 검사&#x27;의 진단 민감도·특이도를 자주·엄격히 평가해야 한다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">컷오프는 절충이다</span></div><div class="rb-cc-b">검사는 두 집단(비정상/정상)을 분리하려 하나 대부분 상태에서 두 집단이 겹쳐, 양성·음성을 가르는 임의의 절단값(컷오프)을 써야 한다. 측정치가 겹치므로 진단 민감도와 특이도는 역관계 — 컷오프 설정은 항상 위음성·위양성 영향 간 절충이다. 예: 폐렴 송아지 빈호흡 컷오프 25(민감↑·위양성 많음) vs 40(특이도↑·위음성 많음).</div></div>
<div class="rb-sub">유병률과 검사 후 예측도</div>
<p class="rb-p">유병률은 특정 시점에 증례 정의를 충족하는 동물 비율 = 무작위 개체에 상태가 있을 확률이다. 수의학 대부분의 감염성·번식 상태는 발표된 유병률이 제한적이라, 병력·임상 검사에 근거한 임상의 판단이 흔히 확률을 설정할 유일한 수단이다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">유병률이 해석을 바꾼다</span></div><ul><li>특이도 불완전 검사: 유병률↓일수록 양성 중 위양성 비율↑ → 저위험 집단엔 정확한 검사도 낮은 양성예측도(PPV)</li><li>민감도 불완전 검사: 유병률↑일수록 음성 중 위음성 비율↑ → 고유병률 집단엔 낮은 음성예측도(NPV)</li><li>PPV(양성 중 실제 양성): 대부분 진단 특이도에 더 영향</li><li>NPV(음성 중 실제 음성): 대부분 진단 민감도에 더 영향</li><li>유병률↑ → PPV 증가·NPV 감소 / 유병률↓ → 반대</li></ul></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">공식</span></div><ul><li>PPV = (Se×P) ÷ [Se×P + (1−Sp)(1−P)]</li><li>NPV = [Sp×(1−P)] ÷ [Sp×(1−P) + (1−Se)×P]</li><li>Se=진단 민감도, Sp=진단 특이도, P=유병률</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">BVD-PI 예 — 같은 검사, 다른 PPV</span></div><div class="rb-cc-b">민감도 99.7%·특이도 99.3% BVD-PI 검사라도 집단에 따라 PPV가 달라진다. 최근 BVD 확진 무리에서 폐렴·설사로 죽은 송아지(검사 전 확률 약 70%): PPV 99.7% → 양성을 믿는다. 반면 엄격한 차단방역으로 모든 송아지를 일상 검사하는 종축 무리(확률 &lt;0.1%): 같은 검사 PPV 12.5% → 양성을 매우 회의한다.</div></div>
<div class="rb-sub">검사 전략 — 직렬과 병렬</div>
<p class="rb-p">단일 검사로 PPV·NPV가 모두 거의 완벽할 가능성은 매우 낮다 — 수의사는 한 방향(양성 또는 음성) 결과만 믿을 수 있는 상황에 놓이기 쉽다. 믿지 못하는 결과의 동물은 재검하거나, 추가 진단 비용과 위양성/위음성 개입 비용을 견줘 받아들인다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">직렬 검사(testing in series)</span></div><ul><li>초기 PPV가 낮을 때(낮은 특이도 또는 낮은 유병률) 양성 동물을 재검</li><li>두 검사 모두 양성이어야 양성으로 결론</li><li>순결과: 민감도 손실 + 특이도 이득 → PPV 개선·NPV 감소</li><li>쓰는 경우: 2차 검사가 비싸/어려워 고유병률에만 쓰고 싶을 때, 위양성의 해가 클 때</li><li>예: BVD 저확률 무리의 양성 송아지를 2차 검사해 둘 다 양성일 때만 진성 PI로 분류</li></ul></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">병렬 검사(testing in parallel)</span></div><ul><li>초기 NPV가 낮을 때(낮은 민감도 또는 매우 높은 유병률) 음성 동물을 재검</li><li>어느 검사든 양성이면 양성으로 결론</li><li>순결과: 민감도 이득 + 특이도 손실 → PPV 감소·NPV 개선</li><li>쓰는 경우: 검사가 쉽고 저렴하거나, 위양성 회피보다 모든 상태 동물 식별이 중요할 때</li><li>예: 트리코모나스(특이도 좋으나 민감도 53~77%) — 확률 75% 무리에서 단일 검사 NPV 약 50%라 음성 신뢰 낮아 병렬 필요</li></ul></div>
<div class="rb-sub">요약</div>
<p class="rb-p">진단 검사 해석은 임상 진료의 중요한 구성요소다. 검사 결과를 적절히 해석하려면 진단 민감도·특이도와 상태 유병률이 개별 결과 해석에 어떻게 영향을 주는지 이해해야 한다. 많은 진단 질문에서 직렬·병렬로 해석하는 둘 이상의 검사를 적절히 쓰면 진단 정확도와 검사 전략의 경제적 수익을 최적화할 수 있다.</p></div>
<div class="grass-section-title"><span class="gst-wrap"><span class="gst-main">${svgIcon('briefcase',15)} 27. 소 번식 진료의 마케팅</span><span class="gst-sub">마케팅 원리(4P+서비스 3P)·시스템 vs 계획·세 기둥(역량·자원·감내)·고객 확보/만족/유지·계획 평가</span></span></div>
<div class="rb-block"><div class="rb-sub">서론과 마케팅 원리</div>
<p class="rb-p">마케팅은 고객·의뢰인·파트너·사회에 가치 있는 제공물을 창출·소통·전달·교환하는 활동·제도·과정이다(미국마케팅협회 2007) — 달리 말해 &#x27;고객을 얻고, 만족시키고, 유지하는&#x27; 것이다. &#x27;마케팅&#x27;은 수익성에 직접 영향을 주지 않는 사업의 여러 측면도 함의한다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">마케팅 4P + 서비스 3P</span></div><ul><li>4P — 제품(Product): 제공 서비스나 약품·기구 / 가격(Price): 경쟁력 있는 합리적 수수료 / 판촉(Promotion): 판매 대상을 잠재 고객에 알림 / 유통(Place): 고객이 편리하게 얻도록 분배</li><li>서비스는 무형성(intangibility)이 있어 3P가 더 작용</li><li>사람(People): 사무직원~보조원~수의사 모두의 기술·외양·효율을 고객이 평가</li><li>물적 증거(Physical evidence): 증명서·청구서·유인물의 전문적 품질</li><li>과정(Process): 접수~수소 취급~기구 효율~결과 제시까지 전체</li></ul></div>
<p class="rb-p">수소 번식 건전성 검사(BBSE)를 받은 수소는 검사 후에도 거의 같아 보인다(픽업트럭과 달리 유형의 물건이 남지 않음) — 그래서 고객은 서비스가 &#x27;수행되는 동안&#x27;의 단서로 품질을 판단한다.</p>
<div class="rb-sub">시스템인가 계획인가 — 세 기둥</div>
<p class="rb-p">의식하든 안 하든 모든 활동 중인 사업에는 마케팅 &#x27;시스템&#x27;이 이미 존재한다(효율적이든 아니든 서비스 전달·판촉·가격·분배가 일어남). 한 측면만 개선하면 다른 측면에 해로울 수 있어 — 서비스를 탁월히 해 고객을 만족시켜도 판촉이 약하면 신규 확보가 안 되고, 확보·만족에 힘써도 경쟁자의 우월한 판촉에 기존 고객을 잃으면 진전이 없다. 마케팅 &#x27;계획&#x27;은 결함을 떠받치는 데 그치지 말고 시스템의 모든 측면을 다뤄야 한다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">계획의 세 기둥 (착수 전 전제)</span></div><ul><li>역량(Competence): 전념하려는 의지와 성공시킬 전문성은 별개 — 끊임없는 학습·세미나·동료 교류·새 기법 개방성(금전·시간이 비쌈)</li><li>자원의 투입(Dedication of resources): 충분한 자금+수의사의 시간(가치 산정 어렵지만 필요) — 예산화·문서화·준수</li><li>감내(Comfort/toleration): 계획은 &#x27;완전한 수용 부재&#x27;로 실패하는 경우가 많음 — 광고가 천박해 보이거나 발표가 두렵거나 자기 홍보가 오만으로 느껴져도, 불편을 감내하는 것이 개인 성장의 대가</li></ul></div>
<div class="rb-sub">고객 확보</div>
<p class="rb-p">가장 좋지만 얻기 어려운 판촉은 긍정적 입소문이다 — 다만 시작 단계나 수입을 더 높이려 할 때는 입소문만으로 부족할 수 있다(연 수입의 약 1%를 마케팅에 배정, 수의사 시간 가치도 산정). 네 범주는 중복될 수 있다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">고객 확보 네 범주</span></div><ul><li>서비스 영역 확장: 초음파 성별 판정·수정란이식 등 요청 충족 → 만족 + 같은 서비스 찾는 신규 고객</li><li>기존 서비스 판촉: 이미 있는 서비스를 고객이 모르는 경우가 많음 — 브로슈어 비치, 청구서에 세부, 접수실·실험실에 물적 증거 전시</li><li>관계 개발·발표: 지도 기관·제약사·품종 협회·축산 단체 발표 자원, 업계지 기고</li><li>광고: 비싸므로 예산·윤리 안에서 노출 극대화 — 지역 축산 간행물·품종 협회지가 적절</li></ul></div>
<div class="rb-sub">고객 만족 — 과정·물적 증거·유통·가격</div>

<div class="rb-sub">요약</div>

<p class="rb-p">다만 직종 밖 사람들이 소 번식에 침투하고 있어(공정·불공정 경쟁) — 직종은 합법적 권한을 주장하고 비수의사·미준수 수의사를 신고할 책임이 있으되, 직종 밖의 가치 있는 기여와 우호적 관계도 유념한다. 보상(금전·명성·만족)이 희생(노동·조건·위험)을 정당화해야 진료가 성공한다 — 양질의 수의사를 유치·보수하고 장비·안전을 제공하며 업무를 나눠 진료 밖의 삶을 갖게 해야 한다. 사업의 다른 부분에 쏟은 만큼의 사고·창의·용기를 마케팅에 적용하면, 충분한 수익성의 전문 진료를 확립하지 못할 이유가 없다.</p></div>

function namuify(root, doc){

  if(intro){ introHtml = intro.outerHTML; intro.remove(); }
  const stripIcon = s => s.replace(/^[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F\s]+/u,'').replace(/^\s*\d+\.\s*/,'').trim();
  const chev = '<span class="namu-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';
  const chapters = [...root.querySelectorAll('.grass-section-title')];

    const t = stripIcon(gm ? gm.textContent : ch.textContent);
    const subText = gs ? gs.textContent.trim() : '';
    const h = document.createElement('h2');
    h.className='namu-h2'; h.id='s-'+ci;
    h.dataset.vkey = tab+'::'+t;
    h.innerHTML = chev+'<span class="namu-num">'+ci+'.</span> <span class="namu-htext">'+t+'</span>'+(subText?'<div class="namu-hsub">'+subText+'</div>':'');
    ch.replaceWith(h);
    const tocCh={num:ci, text:t, id:'s-'+ci, subs:[]};
    toc.push(tocCh);
    const block = h.nextElementSibling;
    if(block && block.classList.contains('rb-block')){
      block.querySelectorAll('.rb-sub').forEach(rs=>{
        si++;
        const st = rs.textContent.trim();
        const h3 = document.createElement('h3');
        h3.className='namu-h3'; h3.id='s-'+ci+'-'+si;
        h3.dataset.vkey = tab+'::'+st;
        h3.innerHTML = chev+'<span class="namu-num">'+ci+'.'+si+'.</span> <span class="namu-htext">'+st+'</span>'+(admin?'<span class="namu-edit">[편집]</span>':'');
        rs.replaceWith(h3);
        tocCh.subs.push({num:ci+'.'+si, text:st, id:'s-'+ci+'-'+si});
      });
    }
    if(admin && si===0){
      const ht = h.querySelector('.namu-htext');
      if(ht) ht.insertAdjacentHTML('afterend','<span class="namu-edit">[편집]</span>');
    }
  });
  let header = '';
  root.insertAdjacentHTML('afterbegin', header + introHtml);
  vetApplyOverrides(root);
  vetApplyHighlights(root, tab);
  root.querySelectorAll('.namu-h2,.namu-h3').forEach(function(hh){
    hh.addEventListener('click', function(){ namuToggle(hh); });
  });
  root.querySelectorAll('.namu-edit').forEach(function(ed){
    ed.addEventListener('click', function(e){ e.stopPropagation(); const hh=ed.closest('.namu-h2,.namu-h3'); if(hh) vetEnterEdit(hh); });
  });
}
function namuToggle(h){
  var collapsed = h.classList.toggle('namu-collapsed');
  var stop = (h.tagName === 'H2') ? ['H2'] : ['H2','H3'];
  var n = h.nextElementSibling;
  while(n && stop.indexOf(n.tagName) === -1){
    n.style.display = collapsed ? 'none' : '';
    n = n.nextElementSibling;
  }
}
let VETEDITS = {}, _vetLoaded = false, _vetLoading = false;
async function vetEditsEnsure(){
  if(_vetLoaded || _vetLoading) return;
  if(typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length) return;
  _vetLoading = true;
  try{
    const db = firebase.firestore();
    const snap = await db.collection('library').doc('vetEdits').get();
    VETEDITS = (snap.exists && snap.data() && snap.data().data) ? (JSON.parse(snap.data().data)||{}) : {};
    _vetLoaded = true;
  }catch(e){ console.warn('vetEdits load 실패', e); }
  _vetLoading = false;
  if(typeof UI!=='undefined' && UI.vetMode){ try{ renderVet(); }catch(e){} }
}
async function vetEditsSave(){
  try{
    const db = firebase.firestore();
    await db.collection('library').doc('vetEdits').set({data:JSON.stringify(VETEDITS), updated:Date.now()}, {merge:true});
    if(typeof toast==='function') toast('수정 내용이 저장됐어요.');
    return true;
  }catch(e){ console.warn('vetEdits save 실패', e); if(typeof toast==='function') toast('저장 실패 — 주인 계정 로그인 상태를 확인해주세요.'); return false; }
}
function vetSecNodes(h){
  var stop = (h.tagName==='H2') ? ['H2'] : ['H2','H3'];
  var nodes=[], n=h.nextElementSibling;
  while(n && stop.indexOf(n.tagName)===-1){ nodes.push(n); n=n.nextElementSibling; }
  return nodes;
}
function vetApplyOverrides(root){
  if(!VETEDITS) return;
  root.querySelectorAll('.namu-h2,.namu-h3').forEach(function(h){
    var key=h.dataset.vkey; if(!key) return;
    var html=VETEDITS[key]; if(html==null) return;
    var nodes=vetSecNodes(h); if(!nodes.length) return;
    var parent=nodes[0].parentNode;
    var anchor=nodes[nodes.length-1].nextSibling;
    nodes.forEach(function(n){ n.remove(); });
    var tmp=document.createElement('div'); tmp.innerHTML=html;
    // Plain text must remain a section node so it can be edited again.
    Array.from(tmp.childNodes).forEach(function(n){
      if(n.nodeType===3 && n.textContent.trim()){
        var p=document.createElement('p'); p.className='rb-p'; p.textContent=n.textContent; n.replaceWith(p);
      }
    });
    while(tmp.firstChild){ parent.insertBefore(tmp.firstChild, anchor); }
  });
}
/* 강조(형광펜): 본문에서 드래그한 구절을 저장해 두었다가 다시 표시한다. 주인 로그인 상태에서만 추가·해제 가능 */
var HLSEL=null, _hlTimer=null;
var HL_BLOCK='p.rb-p, .rb-list li, .rb-key li, .rb-cc-b';
function vetHlList(tab, create){
  var all=VETEDITS && VETEDITS.__hl__;
  if(!all || typeof all!=='object'){ if(!create) return []; all=VETEDITS.__hl__={}; }
  if(!Array.isArray(all[tab])){ if(!create) return []; all[tab]=[]; }
  return all[tab];
}
function vetHlWrap(block, start, end, idx){
  var walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  var pos=0, nodes=[], n;
  while((n=walker.nextNode())){
    var s=pos, e=pos+n.nodeValue.length;
    if(e>start && s<end) nodes.push({n:n, from:Math.max(start,s)-s, to:Math.min(end,e)-s});
    pos=e; if(pos>=end) break;
  }
  nodes.forEach(function(o){
    var mid=o.from>0 ? o.n.splitText(o.from) : o.n;
    if(o.to-o.from < mid.nodeValue.length) mid.splitText(o.to-o.from);
    var m=document.createElement('mark'); m.className='hl'; m.dataset.hl=idx;
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  return nodes.length>0;
}
function vetHlApplyOne(root, it, idx){
  var blocks=Array.prototype.slice.call(root.querySelectorAll(HL_BLOCK));
  var pre=it.b||'', needle=pre+it.t+(it.a||'');
  for(var i=0;i<blocks.length;i++){
    var k=blocks[i].textContent.indexOf(needle);
    if(k>=0){ var st=k+pre.length; return vetHlWrap(blocks[i], st, st+it.t.length, idx); }
  }
  var hit=null, cnt=0;
  blocks.forEach(function(b){
    var tx=b.textContent, p=tx.indexOf(it.t);
    while(p>=0){ cnt++; hit={b:b,p:p}; p=tx.indexOf(it.t,p+1); }
  });
  if(cnt===1) return vetHlWrap(hit.b, hit.p, hit.p+it.t.length, idx);
  return false;
}
function vetApplyHighlights(root, tab){
  vetHlList(tab).forEach(function(it,i){ vetHlApplyOne(root,it,i); });
}
function vetHlRefresh(root, tab){
  root.querySelectorAll('mark.hl').forEach(function(m){
    var par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m);
    par.removeChild(m); par.normalize();
  });
  vetApplyHighlights(root, tab);
}
function vetHlSelInfo(){
  var main=document.querySelector('#main .namu-doc');
  if(!main) return null;
  if(!((typeof isAdmin==='function') && isAdmin())) return null;
  if(document.querySelector('.vet-edit-box')) return null;
  var sel=window.getSelection(); if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var s0=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  var e0=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer;
  var bs=(s0 && s0.closest) ? s0.closest(HL_BLOCK) : null, be=(e0 && e0.closest) ? e0.closest(HL_BLOCK) : null;
  if(!bs || bs!==be || !main.contains(bs)) return null;
  var pre=document.createRange(); pre.selectNodeContents(bs); pre.setEnd(r.startContainer, r.startOffset);
  var start=pre.toString().length, raw=r.toString();
  start+=raw.length-raw.replace(/^\s+/,'').length;
  var t=raw.trim(); if(!t || t.length>240) return null;
  var full=bs.textContent, marks=[];
  bs.querySelectorAll('mark.hl').forEach(function(m){ if(r.intersectsNode(m)) marks.push(+m.dataset.hl); });
  return {t:t, b:full.slice(Math.max(0,start-15),start), a:full.slice(start+t.length,start+t.length+15), marks:marks};
}
function vetHlBar(){
  var bar=document.getElementById('hlBar'); if(bar) return bar;
  bar=document.createElement('div'); bar.id='hlBar'; bar.className='hl-bar';
  bar.innerHTML='<button type="button" data-hl-act="add">강조</button><button type="button" data-hl-act="del">해제</button>';
  document.body.appendChild(bar);
  bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  bar.addEventListener('click', vetHlAct);
  return bar;
}
function vetHlShow(info){
  HLSEL=info; clearTimeout(_hlTimer);
  var bar=vetHlBar();
  bar.querySelector('[data-hl-act="add"]').disabled=!info.t;
  bar.querySelector('[data-hl-act="del"]').disabled=!(info.marks && info.marks.length);
  bar.style.display='flex';
}
function vetHlHideSoon(ms){
  clearTimeout(_hlTimer);
  _hlTimer=setTimeout(function(){ var b=document.getElementById('hlBar'); if(b) b.style.display='none'; HLSEL=null; }, ms);
}
async function vetHlAct(e){
  var btn=e.target.closest('[data-hl-act]'); if(!btn || btn.disabled || !HLSEL) return;
  if(!_vetLoaded){ if(typeof toast==='function') toast('저장된 내용을 불러오는 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  var tab=UI.vetTab, list=vetHlList(tab,true), snap=JSON.stringify(VETEDITS.__hl__||{}), info=HLSEL;
  if(btn.dataset.hlAct==='add'){
    list.push({t:info.t, b:info.b, a:info.a});
  } else {
    info.marks.slice().sort(function(x,y){return y-x;}).forEach(function(i){ list.splice(i,1); });
  }
  var ok=await vetEditsSave();
  if(!ok){ VETEDITS.__hl__=JSON.parse(snap); return; }
  vetHlRefresh(document.querySelector('#main .namu-doc'), tab);
  var s=window.getSelection(); if(s) s.removeAllRanges();
  HLSEL=null; var b=document.getElementById('hlBar'); if(b) b.style.display='none';
}
function vetHlInit(){
  document.addEventListener('selectionchange', function(){
    var info=vetHlSelInfo();
    if(info) vetHlShow(info); else if(HLSEL) vetHlHideSoon(1500);
  });
  document.addEventListener('click', function(e){
    var m=e.target.closest && e.target.closest('mark.hl'); if(!m) return;
    if(!((typeof isAdmin==='function') && isAdmin()) || document.querySelector('.vet-edit-box')) return;
    var s=window.getSelection(); if(s && !s.isCollapsed) return;
    vetHlShow({t:'', b:'', a:'', marks:[+m.dataset.hl]}); vetHlHideSoon(4000);
  });
}
function vetEnterEdit(h){
  if(!((typeof isAdmin==='function') && isAdmin())) return;
  if(document.querySelector('.vet-edit-box')) return;
  var nodes=vetSecNodes(h); if(!nodes.length) return;
  var parent=nodes[0].parentNode;
  var box=document.createElement('div');
  box.className='vet-edit-box'; box.setAttribute('contenteditable','true');
  parent.insertBefore(box, nodes[0]);
  nodes.forEach(function(n){ box.appendChild(n); });
  var bar=document.createElement('div');
  bar.className='vet-edit-bar';
  bar.innerHTML='<button type="button" class="vet-eb-save">저장</button><button type="button" class="vet-eb-cancel">취소</button>';
  box.insertAdjacentElement('afterend', bar);
  box.focus();
  bar.querySelector('.vet-eb-save').addEventListener('click', async function(){
    const oldHtml=VETEDITS[h.dataset.vkey];
    VETEDITS[h.dataset.vkey]=box.innerHTML;
    this.textContent='저장 중…'; this.disabled=true;
    const saved = await vetEditsSave();
    if(saved) renderVet();
    else { if(oldHtml===undefined) delete VETEDITS[h.dataset.vkey]; else VETEDITS[h.dataset.vkey]=oldHtml; this.textContent='저장'; this.disabled=false; }
  });
  bar.querySelector('.vet-eb-cancel').addEventListener('click', function(){ renderVet(); });
}

/* 풀정보: 섹션 제목 + 카드를 접이식(아코디언)으로 묶기 — 모바일에서 목차부터 보이게 */
function groupGrassSections(root){
  root = root || document.getElementById('main');
  if(!root) return;
  const titles = [...root.querySelectorAll('.grass-section-title')];
  titles.forEach(title => {
    const details = document.createElement('details');
    details.className = 'grass-acc';
    details.open = false;          // 기본 접힘 → 목차처럼 보임
    const summary = document.createElement('summary');
    summary.className = 'grass-acc-sum';
    summary.innerHTML = title.innerHTML;
    details.appendChild(summary);
    title.replaceWith(details);
    let node = details.nextElementSibling;
    while(node && !node.classList.contains('grass-section-title') && !node.classList.contains('modal-actions')){
      const next = node.nextElementSibling;
      details.appendChild(node);
      node = next;
    }
  });
}


const ENTRY_PASSWORD = '0523';
function showEntryGate(onPass){
  if(sessionStorage.getItem('app-entered')==='1'){ onPass(); return; }
  const ov = document.createElement('div');
  ov.id = 'entry-gate';
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0b1f1d;display:flex;align-items:center;justify-content:center;padding:24px;';
  ov.innerHTML = `
    <div style="width:100%;max-width:320px;text-align:center;font-family:'IBM Plex Sans KR',sans-serif;color:#eafaf7;">
      <div style="margin-bottom:8px;"><svg viewBox="0 0 32 32" width="44" height="44" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="30" height="30" rx="8" style="fill:var(--primary)"/><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6.5 L16 11 L21 6.5"/><line x1="16" y1="10.5" x2="16" y2="26.5"/><path d="M16 12.6c2.6 0 2.6 2.4 0 2.4s-2.6 2.4 0 2.4 2.6 2.4 0 2.4-2.6 2.4 0 2.4 2.6 2.4 0 2.4"/></g><circle cx="16" cy="26.6" r="1.3" fill="#fff"/></svg></div>
      <div style="font-size:18px;font-weight:800;margin-bottom:4px;">번식학</div>
      <div style="font-size:12.5px;color:#7fc8bf;margin-bottom:20px;">열람하려면 비밀번호를 입력하세요</div>
      <input id="entry-pw" type="password" inputmode="numeric" placeholder="비밀번호"
        style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;text-align:center;letter-spacing:.3em;
        border:1px solid #1f5249;border-radius:11px;background:#0f2a27;color:#fff;outline:none;">
      <div id="entry-err" style="height:16px;font-size:11.5px;color:#ff8f8f;margin:8px 0 4px;"></div>
      <button id="entry-btn" style="width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:11px;
        background:#00A69C;color:#fff;cursor:pointer;">입장</button>
    </div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector('#entry-pw');
  const err = ov.querySelector('#entry-err');
  const tryPass = ()=>{
    if(inp.value === ENTRY_PASSWORD){
      sessionStorage.setItem('app-entered','1');
      ov.remove();
      onPass();
    } else {
      err.textContent = '비밀번호가 맞지 않아요.';
      inp.value=''; inp.focus();
    }
  };
  ov.querySelector('#entry-btn').addEventListener('click', tryPass);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryPass(); });
  setTimeout(()=>inp.focus(), 50);
}
