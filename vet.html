<li>P4는 임신 유지 호르몬이자 주기의 브레이크임.</li>
<li>중추에서 P4는 LH pulse를 4~6시간에 한 번꼴로 눌러 둠. 평균 LH가 낮게 깔려 우성 난포가 끝까지 성숙하지 못하고 배란도 못 함.</li>
<li>동시에 E2의 양성 되먹임을 차단하므로 황체기에는 E2가 높아도 LH surge가 안 터짐.</li>
<li>이 억제는 용량 의존적임. P4가 어중간하게 낮으면 LH 억제가 풀려 우성 난포가 멈추지도 배란하지도 못한 채 계속 자라 낭종이 됨.</li>
<li>자궁에서 P4는 자궁근 수축을 억제해 임신 내내 자궁을 잠재워 둠. 분만이 다가와 P4가 떨어지면 브레이크가 풀림.</li>
<li>또 자궁내막 분비선을 자극해 자궁유를 내어 착상 전 배아를 먹임. 수정 후 초기 P4가 높을수록 영양막이 잘 자라고 인터페론 타우가 늘어 수태율이 오름.</li>
<li>소는 약 200일까지 황체가 P4를 책임지므로 초기 임신은 전적으로 황체에 달려 있음.</li>
<li>혈중 P4는 황체 크기와 잘 비례함. 직장검사·초음파에서 황체 크기로 P4를 가늠하는 근거임.</li>
<li class="grp">주기 16~17일경 자궁내막의 옥시토신 수용체가 늘어남. E2가 이 수용체 수를 미리 늘려 황체용해를 준비시킴.</li>
<li>옥시토신이 여기 결합하면 자궁내막에서 PGF2α가 pulse로 터짐.</li>
<li>PGF2α는 자궁정맥에서 난소동맥으로 직접 넘어가는 국소 역류 경로로 고농도가 되어 황체를 무너뜨림.</li>
<li>임신이 성립하려면 바로 이 PGF2α 분비를 막아야 함.</li>
<li class="grp">황체용해로 P4가 떨어지면 누르고 있던 뚜껑이 열림. LH pulse가 시간당 한 번 이상으로 잦아짐.</li>
<li>잦아진 pulse가 우성 난포를 성숙시켜 E2를 끌어올림. 이 pulse 빈도의 변화가 발정주기를 굴리는 핵심 스위치임.</li>
<li>E2가 낮거나 중간일 때는 음성 되먹임으로 GnRH·LH pulse를 눌러 둠. 이 억제는 궁상핵의 KNDy 회로에서 일어남.</li>
<li>우성 난포가 자라 E2가 역치를 넘고 그 고농도가 반나절 이상 지속되면 되먹임의 부호가 뒤집힘.</li>
<li>양성 되먹임은 전시각교차전핵(AVPV)의 키스펩틴 뉴런이 활성화되며 일어남. 같은 E2가 작용 부위에 따라 정반대 결과를 냄.</li>
<li>GnRH가 대량 방출되고 LH surge가 터짐. 단, 이 양성 되먹임은 P4가 낮게 깔려 있어야 작동함.</li>
<li class="grp">그런데 P4는 높을 때 surge를 막기만 하는 게 아님. 황체기 동안 P4에 한동안 노출돼 AVPV 회로가 미리 길들여져 있어야, 나중에 P4가 빠졌을 때 비로소 surge가 터짐. 이것이 priming임.</li>
<li>즉 surge에는 P4가 깔렸다가 빠지는 두 박자가 필요함.</li>
<li>사춘기 전 미경산우는 P4를 겪은 적이 없어 priming이 안 됨. E2를 만들어도 자발 배란을 못 함.</li>
<li>난포낭종은 황체가 안 생겨 P4가 쭉 낮으니 priming이 빠짐. E2가 있어도 surge가 불발되고 난포가 계속 커짐.</li>
<li>빠진 priming을 질내 P4 제제로 채우는 것이 사춘기 유도와 낭종 치료임.</li>
<li>동기화는 P4를 넣었다 빼며 이 두 박자를 인위로 재현하는 것임.</li>
<li class="grp">우성 난포의 E2가 발정 행동을 일으키며 발정 개시 시점에 최고조에 이름.</li>
<li>E2가 발정 12~18시간 전에 역치를 넘으면 GnRH surge가 터지고 LH surge가 따라옴. LH surge의 시작은 대개 발정 시작과 맞물림.</li>
<li>자연발정에서는 발정 시작 24~30시간 후, GnRH로 유도하면 약 30시간 후에 배란함. 인공수정 적기를 따질 때 이 30시간이 기준점임.</li>
<li>발정우는 저P4·고E2라 자궁의 옥시토신 감수성이 올라가 있음. 직장검사로 만지면 자궁이 꽉 수축하거나 milk let-down이 비치는 반면 황체우는 그렇지 않은 이유임.</li>
<li>배란이 끝나면 다시 황체기로 돌아감. 임신이 되면 PGF2α가 막혀 황체가 유지되고, 안 되면 16~17일에 다시 황체용해가 옴.</li>
<li>LH를 한 줄로 정리하면 pulse는 성장, surge는 배란임.</li>
<li>pulse 빈도는 P4가 쥐고 있음. P4 하강 → pulse 빈도 상승 → 우성 난포 성숙 → E2 상승 → 시상하부 감지 → surge → 배란.</li>
<li>거꾸로 황체기엔 P4 상승 → pulse 빈도 저하 → 우성 난포 성숙 차단 → surge 차단.</li>
<li>결국 P4가 LH pulse 빈도라는 손잡이로 언제 난포를 익히고 언제 배란시킬지를 조절하는 셈임.</li>
<li>21일은 평균값임. 미수정우는 18~24일, 미경산우는 19~20일로 짧고 고산차 경산우는 22~23일로 긴 경향이 있음. 같은 소도 매번 1~2일씩 달라짐.</li>
<li class="grp">현대 고능력 착유우는 평균보다 하루 정도 길어졌을 가능성이 있어 수정우는 25~26일까지 재발정을 확인함.</li>
<li>제제는 이 회로의 특정 지점을 건드리는 것임.</li>
<li>GnRH는 surge를 대신 터뜨림. 투여 24~32시간(평균 28~30시간) 후 배란하고, 동시에 난포 모집이 일어나 평균 2일 후(3~5일 내) 새 난포파가 뜸.</li>
<li>PGF2α는 황체용해를 앞당김. 투여 12~24시간 후 황체용해, 24시간 후 P4 최저점, 48~72시간 후 발정. 전체적으로 투여 후 3~5일에 발정이 옴.</li>
<li>질내 P4 제제는 황체기를 인위로 만듦. 넣어 두는 동안 LH pulse를 눌러 발정을 막고 priming을 채우며, 제거 2~4일 후 발정이 옴.</li>
<li class="grp">주기 흐름 바깥에 있는 호르몬 넷을 따로 봄.</li>
<li>옥시토신은 시상하부 실방핵·시삭상핵에서 만들어져 뇌하수체 후엽에 저장됐다가 유두 자극이나 자궁·자궁경관의 기계적 자극에 반응해 방출됨.</li>
<li>대표 작용은 평활근 수축임. 유선포를 감싼 근상피세포를 수축시켜 고인 유즙을 짜내는 milk let-down을 일으킴. 생산은 프로락틴, 내보내기는 옥시토신임.</li>
<li>자궁에서는 분만 진통·태아 만출·태반 배출을 돕고 교배 후 정자의 자궁→난관 수송도 거듦. 자궁 감수성은 E2가 높으면 오르고 P4가 높으면 내림.</li>
<li>인히빈은 우성 난포의 과립막세포에서 나와 FSH를 억제함. 난포파 초기엔 작은 난포들의 인히빈 A가, 이후엔 우성 난포의 E2가 FSH를 누름.</li>
<li class="grp">AMH는 전포상·초기 포상난포의 과립막세포에서 나오는 TGF-β 계열 호르몬임. 원래는 배아 발생기에 뮬러관 형성을 억제하는 호르몬임.</li>
<li>임상에서는 혈중 AMH가 난소의 포상난포 수를 그대로 반영한다는 점을 씀. 주기 단계에 거의 영향이 없어 아무 때나 한 번 채혈해도 난소 예비능을 안정적으로 가늠함.</li>
<li>AMH가 높을수록 과배란 반응이 좋아 회수 난자·수정란 수가 많음. 채란 시 황체 15개 초과 기대 컷오프가 약 123.5 pg/mL임. 공란우 선발에 씀.</li>
<li>생후 11~15개월에 AMH가 낮은 소는 초산 이후 도태율이 높고 산유량도 낮은 경향이 있어 선발 지표로도 검토됨.</li>
<li>다만 너무 높아도 마냥 좋지는 않고 사양·영양·혈통에 따라 반응이 달라 AMH 하나로 단정하긴 어려움.</li>
<li class="grp">프로락틴은 뇌하수체 전엽 락토트로프에서 나오고 도파민이 억제, TRH·VIP가 촉진함.</li>
<li>E2·P4·성장호르몬·갑상선·부신피질 호르몬과 협동해 유선을 발육시키고 유즙 생산을 자극함.</li>
<li>분만을 전후한 하루 동안 혈중 프로락틴이 한 번 크게 솟았다가 내려옴. 이 급등을 막아 버리면 그 뒤 젖이 잘 안 나오기 때문에, 이 급등이 젖 생산을 시작하라는 신호로 여겨짐.</li>
<li>개, 고양이, 설치류에서는 프로락틴이 황체를 유지해 주지만 소는 다름. 소에서 프로락틴을 억제해 봐도 LH, P4, 황체기 길이, 발정기 E2 어느 것도 변하지 않음. 소의 발정주기에 프로락틴은 관여하지 않는다고 봄.</li>
</ol></div>

  `;
}

<li>소의 난포는 물결치듯 무리지어 자라고, 한 발정주기에 난포파가 두 번(2파) 또는 세 번(3파) 침.</li>

<li class="grp">첫 난포파는 2파든 3파든 배란일(0일)에 출현함.</li>

<li>황체가 살아 있어 P4가 깔려 있는 동안에는 우성 난포가 배란하지 못하고 무배란으로 폐쇄됨.</li>
<li>황체용해가 시작될 때 마침 떠 있던 우성 난포가 배란 난포가 됨.</li>
<li>즉 어느 난포파의 우성 난포가 배란하느냐는 황체용해 타이밍과 난포파 타이밍이 맞물리는 운에 가까움.</li>
<li>임신 중에는 우성 난포가 황체 반대쪽 난소에 더 자주(75~80%) 생김.</li>
<li class="grp">흔히 말하는 21일 주기는 평균값일 뿐 실재하지 않음.</li>
<li>황체는 2파 주기에서 3파 주기보다 일찍 퇴행하기 시작함(약 16일 vs 19일). 그래서 주기 자체가 짧아짐(2파 약 20일, 3파 약 23일).</li>
<li>2파냐 3파냐를 가르는 핵심 변수는 1차 난포파 우성 난포가 얼마나 오래 우성을 유지하느냐임. 이 기간이 2파에서 더 김.</li>
<li>2파·3파 비율은 품종·연령보다 영양·열스트레스에 좌우됨. 상태가 나쁘면 3파가 늘어남.</li>

<li class="grp">작은 난포(6mm 미만)는 FSH에 의존하므로 FSH가 떨어지면 대부분 2~5일 내 퇴행함.</li>
<li>우성이 될 난포만은 FSH 수용체를 충분히 갖춰 FSH가 줄어도 버티고, 결정적으로 LH에 반응하는 능력을 얻어 FSH 없이도 자람.</li>
<li>이 전환은 우성 난포가 8mm를 넘을 때 일어남. 과립막에 LH 수용체가 발달하기 시작해 FSH 의존에서 LH 의존으로 바뀜.</li>
<li>가장 큰 두 난포의 성장 곡선이 갈라지는 deviation은 미래 우성 난포가 약 8.5mm일 때, 난포파 출현 2.5일 후에 뚜렷해짐.</li>
<li>우성 난포의 조건은 낮은 FSH에서 버티는 능력과 LH 반응 능력, 둘임.</li>
<li class="grp">제1난포파 우성 난포는 배란 직후, 황체가 아직 작아 P4가 낮은 시기에 자람.</li>
<li>P4가 낮으면 LH pulse 억제가 덜하므로 직경 15~20mm(고산차 소는 20mm 전후)까지 크게 발육함. 황체기 한복판의 높은 P4 아래에서 자라는 제2·제3난포파 우성 난포보다 큼.</li>
<li>다만 자라는 동안 P4가 올라가 LH pulse가 눌리므로, 제1난포파 우성 난포는 성숙·배란에 이르지 못하고 주기 중반(10~11일경)에 폐쇄됨.</li>

<li>원래 우성 난포를 없애거나 FSH를 넣어주면 종속 난포도 우성이 될 수 있음.</li>
<li>우성 난포가 둘 이상 생기는 공동우성은 이중 배란으로 이어짐.</li>
<li>비유 젖소에서 다배란이 흔하고(난포파의 21~36%) 고생산일수록 발생률이 높음. 쌍태 위험과 직결됨.</li>
<li class="grp">P4는 LH pulse를 눌러 우성 난포 성장을 용량 의존적으로 억제함.</li>
<li>P4가 높으면 우성 난포가 작고 단명하며 다음 난포파가 빨리 옴. 낮으면 우성 난포가 과도하게 오래 살아남음. 이게 난포낭종으로 이어짐.</li>
<li>황체용해로 P4가 떨어지면 음성 되먹임이 풀려 LH pulse가 잦고 강해짐.</li>
<li>이 LH가 우성 난포를 최종 성숙시키고 E2를 끌어올리며 발정 행동과 LH surge를 부름.</li>
<li>surge 이후 여러 단백분해효소가 난포벽을 허물어 평균 30시간 뒤 난포가 터짐.</li>
<li>난모세포는 surge 약 20시간 뒤 상당수가 성숙(제2감수분열 중기)에 도달함. 체외수정·수정란이식에서 성숙 시간을 잡는 근거임.</li>
<li class="grp">배란으로 빈 난포의 과립층·협막세포가 빠르게 혈관화·황체화하면서 부풀어 황체가 됨. 혈장 P4는 황체 크기와 잘 비례함.</li>
<li>현장에서 헷갈리기 쉬운 게 황체 중심의 공동(cavity)임. 정상 황체의 40~70%가 가운데에 액체 찬 공동을 가지며, 주로 발달 초기에 나타남.</li>
<li>초음파에서 무에코로 보이지만 P4 농도는 공동 유무와 무관함. 공동 있는 황체라고 기능이 떨어지는 게 아님. 황체 낭종과 혼동하면 안 됨.</li>
<li class="grp">발정 후 첫 5~6일 동안은 PGF를 줘도 황체용해가 잘 안 됨.</li>
<li>흔히 어린 황체엔 수용체가 없어서라고 하지만, 사실 배란 2일 후부터 수용체는 있음.</li>
<li>진짜 차이는 양성 되먹임 고리에 있음. 성숙 황체는 옥시토신·TNF를 끼고 내막 PGF 방출을 스스로 부르는 고리를 갖춰, PGF가 여러 번 터지며 황체용해를 끝까지 밀어붙임.</li>
<li>어린 황체엔 이 고리가 아직 없어 PGF 한 방에 저항함. 무너뜨리려면 반복 투여가 필요함.</li>
<li>결론적으로 PGF2α는 황체기 6일 이전(이전 발정 6일 이내, 발정 후 출혈 4일 이내)엔 권장하지 않음.</li>
<li class="grp">초음파로 세는 동난포 수(AFC)는 개체마다 크게 다르지만, 난포파 출현 시의 난포 수는 한 개체 안에서 매우 반복적임. 한 번 측정하면 그 소의 과배란 잠재력을 가늠할 수 있음.</li>
<li>AFC가 높은 분만 후 젖소는 수태율이 더 높고 분만–수태 간격이 짧음.</li>
<li>반대로 임신 첫 1/3에 영양이 제한된 어미의 송아지는 AFC가 60% 낮게 태어남. 딸의 평생 가임성에까지 영향이 감. 번식 상태에 따라 난소 동태가 다름.</li>
<li>사춘기 전 송아지도 생후 2주부터 이미 성체와 똑같이 난포파를 침. 부족한 건 난포파가 아니라 배란을 끌어낼 LH임.</li>
<li>분만 후 첫 배란 주기는 짧고(약 7.7일) 첫 황체가 작고 단명함. 사춘기 첫 주기와 똑 닮은 양상임.</li>
<li>임신 중에도 난포파는 계속 돌되 만기 직전 21일만 멈춤.</li>
<li>노령우(15세 이상)는 FSH가 오히려 높은데도 모집되는 난포가 적고, 결정적으로 난모세포 질이 떨어져 어린 딸의 절반밖에 수정란을 못 만듦. 수가 아니라 난자 자체의 능력이 떨어지는 것임.</li>
</ol></div>

  `;

function reproCofHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('noEntry',16)} COF — 낭종성 난포 정의·발생률·병태생리·진단·치료·위험요인</div>
<div class="rb-block"><ol class="rb-list">
<li>Roberts의 고전적 정의는 황체 없이 직경 2.5cm 초과, 최소 10일 지속된 무배란 구조물임. 그런데 소는 보통 1.6~1.9cm 우성 난포를 배란하므로 2.5cm 기준은 더 작은 낭종을 놓침. 낭종은 빈번히 교체·대체되는 동적 구조라 10일 지속 요건도 재고 대상임. 일부 낭종은 스테로이드를 안 만들어 황체와 공존하기도 하므로 황체 부재 요건도 보편적이지 않음.</li>
<li>현대적 정의(Vanholder)는 활성 황체 조직 없이 한쪽/양쪽 난소에 존재하는 직경 최소 20mm 난포로 정상 난소 주기성을 명확히 방해하는 것임. 난포낭종은 보통 얇은 벽이고 E2를 분비하되 양은 과립막세포층 두께에 따라 다르고 P4는 분비 안 함. 황체낭종은 난포막·과립막이 어느 정도 황체화해 P4를 생성함. 둘은 같은 질환의 다른 형태임. 두 유형을 구별하는 단일 보편 P4 역치는 없음.</li>
<li>COF 발생률은 용도·관리 체계에 크게 의존함. 육우·후보우보다 젖소에서 훨씬 높아 비유 젖소 평균 약 10~12%(연구에 따라 3~32%)임. COF 젖소의 60%는 분만 후 첫 배란 전에 자연 회복하므로 언제 검사하느냐에 따라 발생률이 크게 달라 보임. 난산·후산정체·분만 후 대사질환이 있었던 소는 COF 위험이 거의 2배임. 육우는 통상 관리 하에선 발생률이 훨씬 낮지만 번식을 집약적으로 관리·조작하면 높아짐. 과배란 후 수정란 공여에 쓰이는 육우는 발생률이 젖소에 근접할 수 있음.</li>
<li>발병 기전은 50년 넘게 연구됐으나 단일 결정적 원인은 밝혀지지 않음. 일반적 합의는 배란 실패를 부르는 시상하부–뇌하수체–생식선 축의 다요인적 기능장애·신경내분비 불균형임. 기여 요인은 유전·표현형·환경·대사/세포·관리 요인으로 묶임.</li>
<li class="grp">LH의 두 얼굴을 구분해야 함. 난포를 키우는 것은 LH pulse이고 P4가 이를 억제함. 배란을 일으키는 것은 LH surge이고, E2가 역치를 넘어 충분히 지속될 때 시상하부의 양성 되먹임으로 터짐.</li>
<li>우성 난포가 멈춰야 할 시점에 P4가 낮아 억제가 풀리면 LH pulse가 정상 황체기보다 높게 유지되고, 난포는 배란도 퇴행도 못 하고 계속 자람. 난포가 E2를 만들어 발정 비슷한 징후를 보이는 소도 있지만, E2에 대한 시상하부 반응성이 떨어져 있어 surge가 불발. 고비유 초기의 강한 음에너지 균형과 스트레스가 이 반응성 저하의 흔한 배경. 가장 널리 받아들여지는 가설은 LH surge가 없거나 작거나 시기가 틀리는 것임. 시상하부 GnRH 함량이나 뇌하수체 GnRH 수용체·LH 함량은 줄지 않고, 외인성 E2를 줘도 surge가 안 나오지만 GnRH를 주면 LH가 나옴. LH를 통제하는 양성 E2 되먹임 고리의 기능적 붕괴를 뒷받침함. 시상하부의 E2 반응성 교란이 배란 실패의 원인이 됨. 즉 근본 원인은 저P4, 과잉 LH pulse, 시상하부 E2 반응성 저하가 겹친 상황임. 그 결과 난포는 25mm 이상으로 커져 10일 넘게 유지되고, 오래 내는 E2·인히빈이 FSH를 눌러 우성이 길어짐. 낭종이 퇴행해 새 난포파가 나와도 되먹임 이상이 그대로면 새 우성 난포도 낭종이 되어 반복됨(COF 교체·대체).</li>
<li>시상하부의 E2 양성 되먹임 회로(AVPV 키스펩틴)는 그냥 켜지지 않고, 사전에 P4에 한 번 길들여지는 priming이 있어야 작동함. 낭종 소는 황체가 제대로 안 생겨 P4가 쭉 낮은 탓에 이 priming을 받지 못한 상태임. 사춘기 전 미경산우가 E2를 만들어도 자발 배란을 못 하는 것과 같은 원리임. 혈중 P4를 올려주면(질내 P4 제제 등) 빠졌던 priming이 채워져 반응성이 회복됨. 이것이 치료의 근거임.</li>
<li>축 바깥 요인도 있음. 스트레스와 COF 난소의 열충격단백질(HSP) 증가가 연관되며, HSP가 난포벽 세포자멸사를 줄여 낭종 퇴행을 지연시킨다는 추정임. 비유 초기 사료 섭취가 산유 수요를 못 채워 NEFA가 높아지면 난포막세포·스테로이드 생성에 세포독성을 보임. 자연 회복 실패·반복 발생의 잠재적 설명임.</li>
<li class="grp">증상은 대개 변화된 번식 행동임. 가장 흔한 것은 무발정 기간 연장으로 이환우의 80% 이상에서 나타나며 분만 후 초기에 COF가 생긴 소에서 가장 뚜렷함. 지속·빈번한 발정이 연장되는 사모광증은 약 10%에서 나타남. 이환우가 다른 발정우에 자주 승가하면서도 자신은 서기 행동을 안 하는 경우가 흔함. 수컷처럼 변한 외모(남성화)도 사모광이 오래된 COF에서 보이고 분만~진단 간격이 길수록 사모광 행동을 볼 가능성이 높음. 산발적·불규칙한 발정 주기도 주된 증상일 수 있음.</li>
<li>직장 촉진만으로는 낭종 유형을 정확히 식별하기 어려움. 촉진으로 낭종 진단된 암소의 10%가 초음파로 보니 정상 황체였음. 초음파에서 난포낭종은 얇은 벽(3mm 이하)에 균일 무에코 또는 저에코 난포액이고 P4 0.9ng/ml 미만임. 황체낭종(황체화 난포낭종)은 벽 3mm 이상(3~5mm)에 에코가 강하고 내부에 회색 입자나 거미줄 같은 강에코 가닥이 있으며 P4 0.9ng/ml 초과임. 벽이 두꺼워진 황체화 낭종은 생리적 공동성 황체와 혼동 주의임. 초음파 진단 정확도는 난포낭종 74%, 황체낭종 거의 90%임. P4 농도는 벽 두께와 잘 상관함(3mm가 흔한 경계). 초음파+촉진+혈중 P4를 종합하면 거의 100%에 근접함. 단 현재 권장 치료는 두 낭종을 모두 다루므로 치료 전 유형 구별이 필수는 아님.</li>
<li>난포낭종은 황체 테두리가 안 보이는 것으로 공동성 황체·황체낭종과 구별됨. 대부분 무해한 낭종(같은/반대쪽 난소에서 황체·난포파가 정상 발달)이라 여러 주기·임신까지 잔존 가능함. 초음파는 액체 구조 안 황체 조직이나 다른 자리의 작은 황체를 잘 잡아내 무해/병적 감별에 촉진보다 훨씬 우수함. 양쪽 난소 철저 검사가 필수임. 황체 조직이 있으면 무해한 낭종, 없으면 5~14일 후 2차 검사로 황체 발달을 판정함. 25mm 이상의 낭종 자체보다 그 이면에서 발육 중인 우성 난포의 배란을 노려 배란 유도제·동기화를 쓰고 1~2주 후 새 황체 형성을 확인함.</li>
<li class="grp">현재 효과적으로 쓰이는 치료는 모두 호르몬 요법으로, 우성 난포를 배란시키거나 E2 양성 되먹임에 대한 시상하부 반응성을 되살리는 것이 목표임. 난소절제·자궁 내 항생제 주입·압좌 같은 옛 요법은 권장하지 않음. 수기 압좌는 호르몬 요법 대비 이점이 없고 외상·유착·치명적 출혈이 보고됨.</li>
<li>GnRH가 보통 1차 선택임. LH surge를 일으키고 분자량이 작아 항체가 생길 가능성이 낮음. 표준 용량은 근육 100μg임. 주사 후 2시간 내 LH surge → 낭종 황체화(7일 후 두꺼운 황체 가장자리) → 18~20일에 자발 황체퇴행 → 정상 주기임. 대부분은 배란하지 않고 황체화되며 함께 있는 우성 난포의 배란을 일으키기도 함. 약 72~85%에서 정상 주기 재개(보통 3주 내 발정 복귀)이며, 한 연구에서 20일 내 재개 72% vs 대조 16%임. 다만 연구 간 결과 차이가 큼. 발정까지 간격은 치료 7~10일 후 PG를 줘 줄일 수 있음. 초음파는 GnRH에 황체 조직으로 반응 안 한 낭종에만 P4 보충을 한정하는 데 유용함.</li>
<li>hCG는 GnRH에 반응하지 않는 난치성 낭종에 쓰는 단백 호르몬임. 높은 LH 유사 특성으로 낭종·난포를 황체화시켜 P4 생성을 시작하게 하고, 이후 프로스타글란딘으로 황체 퇴행을 유도해 정상 주기를 재개함. 흔한 용량은 근육 10,000IU임. 항체가 생겨 다음부터 안 듣게 될 수 있고 아나필락시스 가능성이 있으며 GnRH보다 비싸 보통 GnRH·다른 요법이 실패했을 때만 씀.</li>
<li>CIDR은 LH 분비를 줄여 낭종을 퇴행시키고 제거 후 새 난포파를 개시해 정상 주기를 재개함. 기전(Todoroki)은 P4가 정상 황체기 수준으로 올라 LH pulse 빈도를 낮춰 낭종을 퇴행시키고, E2·인히빈 억제에서 벗어나 새 난포파가 출현하며, P4가 우성 난포 과성장을 막아 정상 교체가 되는 것임. 축 회복에 충분한 P4 기간은 3일만큼 짧을 수 있음. Ovsynch 후 AI한 군과, CIDR 7일 삽입 후 제거하며 PG 주사하고 발정 보고 AI한 군의 임신율이 비슷해 CIDR 단독으로도 효과적임. Todoroki는 난포낭종 과배란 공여우 28두를 CIDR 14일 치료해 모두 발정·배란했고 64%(18/28)는 반복 회수에도 재발 없음. 회수 후 동기화에 PG 대신 CIDR을 쓰자 공여우 COF가 크게 줄었음(1년차 61두 중 2두, 2년차 54두 중 0두).</li>
<li>프로스타글란딘은 황체 조직이 있어야 듣는 약이라 황체낭종에만 효과 있음. 난포낭종에는 안 듣고, 난포낭종이 황체화해 황체낭종이 된 뒤에야 반응함. 황체낭종에 PG를 주면 8일째까지 90%에서 발정이 옴. 난포낭종에 안 듣기 때문에 PG 단독으로 치료하려면 유형을 정확히 진단해야 함. 유형을 못 정할 땐 GnRH와 PG를 동시에 주는 것이 권장됨. 황체낭종이면 가장 효율적으로 듣고, 난포낭종도 적절히 치료됨.</li>
<li>Ovsynch는 낭종 유형을 가리지 않고 발정 발견 없이 수정 기회를 제공해 어느 경우에나 쓸 수 있음. 고전적 Ovsynch 후 COF 임신율은 17~25%로 다양함. 개시 시 GnRH+PG 동시 사용이 표준 Ovsynch보다 임신율을 개선함. Ovsynch+CIDR 결합이 매우 효과적임(임신율 37.5% vs Ovsynch 단독 16.7%).</li>
<li>오피오이드 길항제인 날록손도 시도됐음. 스트레스가 COF에 기여할 수 있는데, 스트레스 때 나오는 내인성 오피오이드가 시상하부 GnRH 방출과 E2에 의한 surge를 막는 것으로 보기 때문임. GnRH 작용제 부세렐린과 같이 쓰면 77.5%가 2주 내 낭종이 퇴행하고 정상 주기로 돌아옴. 다만 임신율 개선은 통계적으로 유의하지 않아 권장하려면 더 큰 연구가 필요함.</li>
<li class="grp">위험 요인. 한 번 COF가 생긴 소는 또 생김. 분만 후 초기에 COF가 있던 소는 수정 시점에도 COF일 위험이 36.6% 높고, 이것이 단일 최대 위험요인임. 분만 전 BCS가 1단위 높으면 8.4배, 산후 이상이 있었으면 1.9배, 쌍태 분만이면 2.0~2.7배임. 여름철 분만·고령에서도 흔함. 고산유는 연구에 따라 위험을 높이거나 무관하고, 낮춘다는 연구는 없음. 대사적으로는 과비만·인슐린/IGF-1 감소·NEFA 증가가 깔려 있음. 유전력은 낮으나(0.07~0.12) 특정 가계에 몰리며, 해당 종축을 빼서 발생률이 10%에서 3%로 준 보고가 있음.</li>
<li>분만 후 초기 경산우의 COF 치료는 이로울 수 있는 반면 어린 암소는 자발적 대기 기간 종료까지 자연 해소를 기다릴 수 있음.</li>
</ol></div>

  `;
}

function reproCystHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 번식질환 — 분류·난소 정지·황체 유존·자궁·질 질환·리피트 브리더·태아 기형</div>
<div class="rb-block"><ol class="rb-list dots">
<li class="hd">개요</li>
<li>번식 장애는 우군의 약 10~20%에서 발생하며 난소 관련이 50~60%, 자궁 관련이 20~30%임.</li>
<li>VWP를 넘겼는데 발정이 없는 소는 검진 시 난소 상태로 나누는 것이 출발점임. 무배란우는 황체가 없고 주기가 안 돌아온 소(난소 정지·난포낭종), 무발정 배란우(둔성 발정)는 배란과 황체는 있는데 겉으로 안 보이는 소, 발정 발견 실패는 관찰을 못 했거나 황체 유존으로 발정이 안 오는 소임.</li>
<li class="hd">배란 실패의 분류(Wiltbank)</li>
<li>Wiltbank는 배란 실패를 네 범주로 분류함. 초음파가 판정을 도움.</li>
<li>첫째, 출현 단계까지만 자람(난소 정지). 작은 난포만 여럿이고 어느 것도 4mm를 넘지 못하며 황체도 없음. 배란 직후 후발정기도 황체가 아직 안 보여 똑같이 보이므로, 며칠 뒤 다시 봐서 황체가 생기면 후발정기, 그대로면 난소 정지로 판정함. 극심한 영양실조 소가 아니면 드묾.</li>
<li>둘째, 선택 단계까지는 자라지만 배란 크기에는 못 미침. 분만 후 무발정우에서 전형적임. 황체가 없고 난소도 작지만 난포는 8.5mm 정도까지 자람. 우성 난포가 뽑히긴 하는데 더 못 크고 퇴행하고, 다음 난포파가 올라와 같은 일이 반복됨.</li>
<li>셋째, 배란 크기를 넘어섬(난포낭종). 직경 22mm가 넘는, 벽이 얇은 액체 구조로 보임.</li>
<li>넷째, 황체 조직이 있는 상태에서의 무배란(황체기능 연장). 남아 있는 황체가 정상 간격의 배란을 막음.</li>
<li class="hd">난소 정지</li>
<li>난소 정지는 황체 형성이 없고 주기가 미회복된, 진짜로 발정이 없는 상태임. 분만 후 회복이 순조로우면 보통 30~40일에 첫 발정이 오므로 이를 넘겼는데도 난소가 조용하면 의심함.</li>
<li>배경에 분만 전후 영양 부족, 난산·주산기 질환, 저BCS가 흔함. 배란 유도제(GnRH/hCG)나 동기화로 배란을 촉진하되 근본은 컨디션 회복임.</li>
<li class="hd">황체 유존</li>
<li>황체 유존(황체기능 연장)은 임신이 아닌데 황체가 오래(20mm 이상, 15일 이상) 남아 발정이 안 오는 상태임. 유중 P4 3ng/ml 초과가 19~30일 넘게 지속되면 황체 잔존으로 보며, 확인엔 다회 검사나 P4 검사가 필요함.</li>
<li>자궁 내 이물(미이라·농·점액)이나 내막염으로 PGF2α 생성이 막히는 것이 배경이고, PGF2α 투여로 퇴행시킴. 자궁 이상이 있으면 세척을 병행함. 황체가 있으면 Ovsynch가 잘 걸리므로, 유존 황체인지 따지는 것보다 황체가 있는지 아는 것이 실무상 더 중요함.</li>

<li>무발정 배란(둔성 발정)은 고비유우에서 E2의 발정 발현 효과가 약해 흔함. 분만 후 첫 배란의 약 94%가 발정을 동반하지 않는다는 보고와 맥을 같이함.</li>
<li>그 외 난소 병리는 드묾. 과립막세포종이 가끔 있는데 난소가 매우 크고, 안에 고에코 영역이 보임. 이 고에코는 종양 혈관과 치밀 조직 경계에서 생기는 경면반사임.</li>
<li class="hd">요질·질염</li>
<li>자궁·질 장애는 먼저 외음부에 점액 말고 다른 배출물(농, 소변)이 있는지 봄.</li>

<li>질염은 농과 질벽 충혈이고 발정기 충혈보다 붉은기가 강함. 난산·태반정체·자궁염에 속발함. 초음파에서는 질강 안 에코성 물질과 점막 비후로 보임. 역성비누 온수나 생리식염수로 반복 세척함. 질염이 있어도 수정 시 위생 시스를 씌워 질 내용물이 자궁에 안 들어가게 하면 예후는 보통~양호임.</li>
<li class="hd">자궁내막염</li>
<li>자궁내막염은 외자궁구로 농이 나오면 임상형, 농이 안 보이면 잠재형임(사이토브러시로 확인). 발정은 정상인데 3회 수정해도 불수태면 의심함. 자궁 내 주입(항생제·요드제)이 1선택이고 심하면 생리식염수 세척임. 발정 발현과 수태율을 떨어뜨리므로 번식 개시 전 평가·처치가 중요함.</li>
<li>자궁염·자궁내막염·자궁축농증은 임상형뿐 아니라 대부분의 잠재형도 초음파로 진단할 수 있음. 현장 초음파는 촉진으로 못 잡는 2mm 액체까지 보고 에코로 성질도 평가함. 대부분 자궁강에 에코성 농이 있고 밀도에 따라 연회색~밝은 백색임. 자궁내막염은 벽 비후와 액체가 함께 있고, 무에코 액체에 흰 반점이 섞이면 점액화농성임. 만성 잠재형은 소량의 고에코 액체임.</li>
<li>발정기 자궁강의 경면반사를 소량 농으로 오인하지 않게 주의함. 액체가 없을 땐 자궁내막·자궁경 두께 증가로 분만 후 자궁내막염을 평가함. 단 발정기에도 두꺼워지므로 양 난소와 자궁을 함께 봐야 함.</li>
<li class="hd">리피트 브리더</li>
<li>리피트 브리더는 발정주기·생식기가 정상인데 3회 이상 수정해도 수태되지 않는 소(또는 분만 후 150일 이후 미수태)임. 발생률 10~20%임. 원인이 다양해 단일 처치로 해결되지 않으므로 우군마다 유효한 방법을 찾음.</li>
<li>배란 지연형은 발정·배란은 되지만 발정 개시부터 배란까지가 보통 30시간인데 42시간 넘게 걸림. 수정과 동시에 GnRH/hCG를 근주해 배란을 돕고 부황체 형성을 유도함. 수태율 약 10% 상승임(무처치 32% vs 처치 42%).</li>
<li>잠재형 자궁내막염에 의한 리피트 브리더는 배란 지연이 아닌데도 3회 이상 불수태면 의심함. AI 1일 후 배란 확인 시점에 0.5% 포비돈 요드제를 자궁 내 주입함. 항생제나 고농도 요드제보다 수태율 개선 효과가 높음.</li>
<li>위 처치로도 안 되는 진성 리피트 브리더는 배 발육 저하나 수정 장애를 생각하고 네 가지를 씀. 첫째 황체 보강으로, 수정 5일 후 hCG를 주거나 질내 P4를 넣음(특히 4회 이상 수정우). 둘째 자궁내막 기능 회복으로, E2+P4 변법(시작 시 E2를 5.0mg으로 올리고 P4를 7~9일 유치)으로 정시 AI함.</li>
<li>셋째 수정란 이식이나 추가 이식(Hitch-hike)임. 수정 7일 후 수정란을 하나 더 넣어 배아 둘이 임신 신호를 함께 내게 하고, 자기 배아가 죽어도 이식 배아가 살 수 있게 함. 넷째 배사멸 방지로, 임신 30일경 배사멸이 반복되는 소는 임신 확인 후 질내 P4를 2주 유치함.</li>
<li class="hd">자궁축농증·기타 자궁 병리</li>
<li>자궁축농증은 자궁강에 농이 차 있고 난소에는 황체가 남아 있는 상태임. 농이 자궁내막의 PGF2α 분비를 막아 황체가 안 죽음. 초음파에서 액체 양이 많고 중간 에코이며, 압력 때문에 벽이 얇아져 있음. 임신 2~3개월과 감별해야 하는데, 태막 슬립이 없고 좌우가 대칭으로 부푼 점이 다름. PGF2α로 발정을 유도해 농을 배출시킨 뒤 자궁 내 주입함.</li>
<li>점액자궁증은 임신이 아닌데 자궁에 무균성 액체가 다량 찬 것임. 액체는 무에코~약에코이고, 자궁내막은 두꺼워지지 않으며 벽 두께도 정상이고 난소 소견과 무관함. 배아가 없는지 꼭 확인함. 후보우에서는 처녀막이나 난관 부위의 선천 폐쇄와 관련됨.</li>
<li>림프육종은 자궁벽이 국소 또는 전체적으로 매우 단단하게 두꺼워진 것으로, 림프절 조직처럼 보임.</li>
<li>농양은 자궁축농증과 달리 자궁강이 아니라 자궁벽·자궁경·질벽 조직 안에 농이 피막에 싸여 갇힌 것임. 피막 때문에 단순 염증과 구별되고, 내강으로 통하지 않아 호르몬으로 배출시킬 수 없음. 자궁벽 농양은 임신 예후가 나쁨. 자궁경 농양은 경관이 막혔는지에 따라 다름. 질 농양은 교배나 분만을 방해하지 않으면 보통 문제없음.</li>
<li>기질증(공기질증)은 질 안의 가스가 reverberation 아티팩트로 보임.</li>
</ol></div>

  `;
}
function reproPdiagHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('search',16)} 임신감정 — 초음파 임신감정·태령·생존성·쌍태·성별</div>
<div class="rb-block"><ol class="rb-list">
<li>임신은 21일 이전엔 휴지기와 비슷하고, 21~23일 소량 액체, 24일까지 배아 보기 어려움, 자궁내막은 발정기처럼 두꺼워지지 않고 경면반사가 적음.</li>
<li>초음파 임신감정은 이론적으로 교배 후 21일이면 가능하나 현장에선 비실용적임. 숙련 검사자 시험에서 성우 24일의 음성예측도는 89%였고(미임신 진단의 11%가 32일 재검 시 임신), 26일엔 공태의 99%를 올바로 식별함. 후보우는 24일에 같은 수준임.</li>
<li>26일 vs 28일의 차이가 큼. 26일 배아는 자궁벽 대비 보기 어렵고 28일 배아는 길이 1cm로 자궁액 안에서 쉽게 보임. 며칠만 기다려도 정확도·속도가 오름. 단 조기 검사가 즉각적 관리 결정으로 이어지지 않으면 가치가 없음.</li>
<li>황체의 유무·위치를 알면 검사가 빨라짐. 황체 두 개는 쌍태 가능성, 배아와 반대쪽 황체는 임신 손실 고위험, 작거나 질 나쁜 황체는 낮은 P4를 시사함. 공동성 황체는 공동이 너무 크고 가장자리가 너무 작아 전체 부피가 낮은 경우가 아니면 우려할 필요 없음. 질 나쁘거나 반대쪽 황체는 GnRH로 부황체를 만들어 P4를 개선할 수 있음.</li>
<li>60일 이전 임신 진단은 태반 형성 완료 후 재검해야 함. 비유 젖소는 태반 형성 전 60일 이전 손실이 임신 후보우의 약 3.6배이고 최초 진단일부터 90일까지 10~12%임. 가설은 고산유 P4 저하, 분만 후 질환, 특정 정액, 쌍태, 열 스트레스임.</li>
<li>초음파는 약 120일까지 태령 추정에서 직장촉진보다 훨씬 우수함. 액체량이 아니라 배아·태아 크기 자체를 재기 때문이고 크기는 기온·품종과 무관하게 일관됨. 구조물을 직접 재서 태령 차트에 대응하거나 발달을 시각 평가함.</li>
<li>측정 부위는 체간 직경(배꼽 높이 흉곽 최대폭), 뇌두 직경(눈 바로 뒤 두개골 최대), 머리 길이(두정~코끝), 두정-둔부 길이 CRL(미근부~두정)임. 약 50일까지는 배아·태아 길이(mm)+18=태령(일)이고, 그 이후나 다른 측정은 태령 차트·소프트웨어가 필요함.</li>
<li>120일 이후는 부정확함. 도달·측정이 어렵고 개체 변동이 시작됨. 안구·태반분엽·자궁동맥은 변동이 너무 커 부적합임.</li>
<li>구조물 출현 시기(평균/범위 일)는 배아 본체 20.3(19~24), 심박동 20.9(19~24), 요막 23.2, 척수·앞다리 싹 29.1, 양막 29.5, 안와 30.2, 뒷다리 싹 31.2, 태반분엽 35.2(33~38), 갈라진 발굽 44.6, 태동 44.8, 늑골 52.8임. 현장에선 범위 상단에서 가장 쉽게 보임.</li>
<li>태아 심박동은 약 24일부터 보이고 초기 최소 130bpm에서 60일까지 약 190bpm임. 심박동이 안 보이나 나머지가 정상이면 소·태아 움직임 탓일 수 있으니 재검함.</li>
<li>양수·융모요막액은 최소 70일까지 맑고 무에코임. 70일 이전 혼탁에 심박동 없음이면 배아·태아 사망임. 사망 시 분리된 융모요막이 임신액에 떠 보일 수 있음. 70일 이후엔 정상도 혼탁이 가능하나 태동으로 확인함.</li>
<li>사망 태아는 골격과 안 맞는 고에코 영역·복강 액체가 보임. 미라는 에코성 뼈 잔해, 자궁내액 결여, 태동·심박동 결여임.</li>
<li>PGF나 황체 퇴행이 없으면 사망 배아·태아는 수 주 잔존하고 막슬립·양막낭 같은 주징후가 여전히 촉진됨. 초음파로 빠르게 식별해 PGF로 치료하면 대부분 48시간 내 완전 배출됨.</li>
<li>사망 전 곤란 징후는 130bpm 미만 심박수(재평가), 살아있는 태아의 융모요막 경미 분리·비정상 액체(추적), 예상보다 작은 살아있는 태아(보통 교배일 오기), 반대쪽·질 나쁜 황체(재검)임.</li>
<li>고산유 젖소와 일부 육우 계통에서 쌍태율이 높고, 젖소는 낭종성 난소 이력 소에서 위험이 더 높음. 쌍태는 임신 손실, 난산, 분만 전후 질환, 번식 성적 저하, 프리마틴, 조기 도태 위험을 높임.</li>
<li>그래도 유산은 보통 권장하지 않음. 다른 임신 실패나 또 다른 쌍태 가능성 때문에 모니터·관리가 나음. 임신 손실 검사, 조기 건유, 고에너지 사료, 분만 모니터·조산, 대사 질환 경계임. 그래서 어느 소가 쌍태인지 아는 게 중요함.</li>
<li>직장촉진은 부정확하고 세심한 초음파가 대부분 식별함. 소 쌍태의 95% 이상이 이란성이라 난소에서 황체 2개를 확인함. 황체 두 개 임신우의 약 60%가 쌍태이고 셋 이상이면 세쌍둥이를 고려함. 전체 자궁을 체계적으로 따라가 단일 태아를 두 번 세지 않게 함. 유일한 주징후는 두 태아의 존재임.</li>
<li>쌍태선(twin line)은 두 융모요막이 합쳐지는 부위임. 태아를 안 둘러싸고 멀어져 양막낭과 구별되고, 45일 이전엔 안 보이며 제대와 혼동 주의임. 쌍태는 단태보다 액체가 많고 골반 입구를 더 일찍 넘음.</li>
<li>쌍태(특히 동측)는 첫 60일에 손실률이 단태의 3.1~6.9배임. 반대쪽은 임신 중기에 더 잘 일어날 수 있음. 자연 감소는 후기 배아·초기 태아 단계에 흔하고 쌍태의 8~24%가 단태로 감소함. 황체 감소는 흔히 배아 감소 자궁각과 동측 난소에서 일어남. 수기 감소는 미미하게만 성공함.</li>
<li>태아 성별은 생식결절(GT, 수컷은 음경, 암컷은 음핵)의 상대 위치로 55일부터 판정함. GT는 수컷에서 제대 바로 뒤, 암컷에서 꼬리 바로 아래임. 약 80일까지 고에코 이엽 구조로 보이고, 70일 이후 포피·외음부 피부가 덮기 시작해 80일이면 밝은 이엽 양상이 줄어듦.</li>
<li>이상적 시기는 60~80일임. 태아 도달이 쉽고, 구조 위치를 잡을 만큼 작고, GT가 피부에 안 가려짐. 90일 이후엔 자궁이 골반을 넘어 도달이 어려울 수 있음.</li>
<li>음낭(세 밝은 선)이나 유두(밝은 점)만으로 진단은 비권장임. GT·음경·외음부를 봐야 함. 유두가 음낭과 닮을 수 있음. 크고 구불구불한 제대 뒤가 수컷 GT 영역이고, 무에코 반추위·제4위도 그 영역이며, 흉곽 V자로 두미측을 식별함.</li>
<li>가장 흔한 오류는 생식 구조가 체벽에서 얼마나 돌출하는지 인식 못 해 생김. 너무 일찍 멈추지 말 것. 60일이면 제대~수컷 GT, 암컷 GT~미근부 사이 틈이 거의 없어 느리고 작은 움직임이 결정적임.</li>

<li>수정 위험은 번식 성적을 크게 좌우하고 수정되는 소 수는 발견 능력에 달렸음. 효율 평가의 전제는 발정·AI·임신 진단·분만일의 신뢰할 기록임. 발견 문제가 심한 농장은 임신 위험이 낮고 재수정이 많으며 분만~첫 수정·수태 간격이 김.</li>
<li>목표치는 VWP(분만 후 60일)까지 소의 80~85%가 발정 발견, 무발정 비율 15~20% 미만임. 적절한 농장은 분만–첫 수정 71~76일, 주기우 70% 이상이 발정 간 간격(IEI) 18~24일임. 정상 IEI(18~24일) 대 연장 IEI(36~48일) 비율이 4:1임.</li>
<li>부정확 농장은 너무 짧은(17일 미만)·긴(30일) IEI가 15%를 넘고, AI일 대표우 20두 유중 P4 측정 시 5% 초과가 1ng/ml 이상임(수정 시 발정 아님). 비효율 농장은 첫 수정 전 일상적으로 놓쳐 분만–첫 수정 90일, IEI가 21일의 2~3배(36~44·54~66일)임.</li>
<li>보조도구는 시각 관찰을 대체하지 않고 보완함. 행동을 지속 모니터링해 효율을 높임. 둔부 알림 패치는 미근부에 붙여 승가 허용을 식별함. 압력 감지형(Kamar, 승가 압력으로 색소가 터져 빨갛게)과 긁힘형(Estrotect, 승가당하면 밝은 신호층 노출)이 있음.</li>
<li>미근부 표지는 분필·왁스·크레용·페인트로 표시해 지워지거나 번지면 승가당한 것임. 패치보다 저렴함. 턱 볼 마커는 표지 동물 턱 아래 잉크 저장통(볼 베어링)으로 승가 시 암소 등·둔부에 표시함(약 25두분). 시정 수소·테스토스테론 처리 암소와 병용함.</li>
<li>시정 동물은 발정우를 식별·승가하나 자연 교배는 못 하게 외과 변형한 수소나 안드로겐 처리 암소임. 육우에선 분만 후 주기 재개를 자극해 분만–첫 발정 간격을 줄이는 이점도 있음. 특정 암소만 선호해 다른 발정우를 놓치거나 교배 못 함을 알고 성욕을 잃기도 함. AI 전 분리하므로 온순한 개체를 고름.</li>
<li>정관절제술은 정관 일부 제거로 고환·음경은 정상이고 정자 수송만 차단함. 삽입은 가능해 교미전파 질병을 통제 못 함. 부고환 미부 절제술은 정자가 정관·사정에 못 이르나 역시 삽입 가능해 같은 단점임. 음경 편위는 음경·포피를 옆구리로 전위해 발기는 되나 질 삽입이 안 됨(등인대 5cm 절제로 복측 편위시키는 대안도 있음). 음경절제술은 음경 2/3 제거·끝을 외부화해 성욕이 보통 줄고 감염 예방엔 도움이나 윤리·복지 우려가 있음.</li>
<li>안드로겐 처리는 도태 미임신우·프리마틴·거세우에 테스토스테론(200mg 근육 격일 3주)이나 임플란트를 씀. 비용이 낮고 질병 전파가 없으며 교배철 후 도축 판매가 가능함. 파행 없고 체격 크고 우위여야 적극 승가함.</li>
<li>무리 확대·집약화로 노동력이 부족해지며 전자 기술이 발전함. 자동 활동 모니터링 시스템(AAMS)은 3축 가속도계+무선원격측정으로 행동을 지속 모니터링함. 발정 시 활동 증가(겨울 400%·여름 175%)를 목걸이·귀표 태그로 기록해 최근 7일 같은 시간대 평균 대비 활동 지수를 계산함.</li>
<li>자유우방 3개 농장에서 약 70%가 활동 증가로 식별됐고, 시스템이 발정 기록한 소의 95%가 배란, 못 찾은 소의 35%도 배란함. SMARTBOW(귀표 3D 가속도계, 실내 경산우)는 민감도·특이도·양성/음성예측도·정확도·오류율이 97·98·96·94·96·2%임.</li>
<li>시각 관찰만 하면 배란우의 56%만 기립 관찰됨. 기기는 시각보다 15~35% 더 많이 발견함. 활동 증가 지속은 16.1±4.7시간(승가 허용 13.4시간과 유사)이고 이차 징후는 승가 허용 약 2시간 전부터 증가함. AI→배란 평균 간격 7.9시간으로 수정능 획득에 충분함.</li>
<li>한계는 무리 약 20%의 무발정–무배란은 활동으로 못 찾아 Ovsynch로 회부되어 P/TAI가 낮고, 밀집 수용은 완전한 발정 발현에 부적절함. 수정 시점은 초산우는 알림 후 0~8시간, 경산우는 24시간까지 AI해도 임신 위험 차이가 없음.</li>
<li>AAMS+TAI 결합이 현재 과제이자 유망 도구임. AAMS 기반 AI가 TAI에 준하는 성적을 낼 수 있다는 보고가 있음. 도입은 이점에 대한 주저, 기술 미숙, 과도한 정보, 높은 초기 투자, 기술 지원 가용성에 영향받음.</li>
<li>보수계는 발정우가 시간당 걸음이 황체기보다 2~4배 많은 것을 이용함. 다리 부착 기기가 걸음을 세 기준치 초과 시 신호함. 효율 49~90%이고 자유우방에 유리하며 계류식·과도 이동 농장엔 제한됨. HeatWatch는 미근부 압력 감지 송신기로 승가 식별·날짜·시간·지속을 컴퓨터로 보고함. 투자비가 높고 차양·나무·언덕에서 신호가 방해됨.</li>
<li>연구 단계 방법은 체온·우유 온도(발정일 0.3~0.4℃ 상승이나 변동·교란 큼), 적외선 열화상(0.2℃ 차·민감도 80%지만 위양성·위음성 높아 비권장), 질 점액 전기저항(전발정·발정기 감소, 무선 질 센서로 17건 중 16건 발견), 전자 코(회음부 페로몬·호흡 시료, 민감도·특이도 0.83·0.86)임. 대부분 아직 통상법으로 미정착임.</li>
<li>발정 발현·발견은 다요인적 형질임. 효율은 관찰자 경험·빈도·길이와 보조도구에 달렸고, 보조도구 선택은 무리 관리·비용·노동·효능·유용성에 달렸음. 핵심은 발정우를 발견해 행동 발정·배란 대비 적절한 시점에 수정하는 것임. 시각 관찰과 보조도구(특히 전자 기술) 통합이 효율을 높임. 어떤 방법을 쓰든 발견 절차를 자주 모니터링(인력 재교육)하고 체계적 자료 수집을 유지하며 전산에 일관되게 옮겨 유용한 번식 성적 보고를 얻음.</li>
<li>인공수정을 정성껏 하는 것은 수태율과 농장 번식 성적에 직접 영향을 줌. 적기의 바탕은 발정 시작 24~30시간 후 배란이라는 생리임. 배란 즈음에 수정능을 획득한 정자가 난관에 대기하도록 타이밍을 맞춤.</li>
<li>ST 개시 후 4~12시간이 적기이고 16시간 이내면 양호함. 전통 AM-PM법은 발정 발견 12시간 후인데 발견이 발정 중후반이면 늦음. 현대 고능력우는 발정이 짧아 발견 후 6시간 이내가 실용적임. 하루 1회만 관찰한다면 발견 즉시 가능한 한 빨리 수정함.</li>
<li>정자는 한랭·알코올·오염에 약함. 시술의 절반은 위생과 온도 관리임.</li>
<li>주입기·핀셋·스트로 커터는 매번 알코올 솜으로 닦고 건조함. 알코올이 남으면 정자가 죽음. 동결정액은 회사별 권장 온도를 지킴(예 35~37℃ 45초, 38℃ 15초). 캐니스터는 서리 라인에서 멈추고 15초 이내에 꺼내며 한 번에 한 개씩 융해함.</li>
<li>소를 보정하고 꼬리를 묶음. 외음부와 주변·꼬리 뒷면을 온수로 씻고 알코올 솜으로 닦음. 융해된 정액이 20℃ 밑으로 떨어지면 cold shock으로 정자가 상하므로 주입기 장전부를 종이타월 마찰열로 데워 둠.</li>
<li>외음부를 벌려 위 45도로 질에 삽입하고 10cm에서 아래 45도로 끝까지 넣음. 직장에 손을 넣어 자궁경관 앞 1/3을 잡고 경관을 주입기 쪽으로 회전시키며 끌어당겨 내자궁구 너머 자궁체부로 유도함. 정액은 자궁체부에 주입하고 체부가 매우 짧으니 위치에 주의함. 뺀 뒤 정액 배출·피·고름 여부를 확인함.</li>
<li>수정 전에 난소·자궁을 촉진해 정말 발정인지 확인함. 난포 있음이 발정은 아님. 황체기에도 15mm 난포는 흔함. 제1난포파 우성 난포가 저P4 시기에 15~20mm까지 자라고 폐쇄된 뒤에도 한동안 크기를 유지해 황체기에 제2난포파 우성 난포와 함께 난포 두 개로 만져지기도 함. 그래서 난포뿐 아니라 황체가 퇴행했는지를 반드시 봄.</li>
<li>수정 OK 조건은 한쪽에 15mm 이상 난포가 있고 황체가 20mm 미만(퇴행 중)인 것, 둘 다 충족임.</li>
<li>20mm 이상의 기능성 황체가 만져지면 발정이 아니라 수정 금지임. 직전 7~10일 전에 발정·수정 이력이 있으면 제1난포파 우성 난포의 E2로 발정 같은 징후가 나온 것일 수 있고 임신 중일 수도 있음. 임신 중 수정 시 약 50% 유산임. 자궁 내부를 확인함.</li>
<li>발정 확인 흐름은 외음부 종창·충혈, 점액 유무, 자궁 수축(배란 직전엔 약할 수 있음), 15mm 이상 난포, 20mm 미만 황체, 생식기를 조작해 점액이 추가로 나오지 않는지 순임.</li>
<li>인공수정은 가장 오래된 보조생식기술로 본래 위생적 이유로 개척됐지만 동결정액 공급과 함께 임성 개선·유전 진보 가속의 경제적 이점이 분명해짐. 정액 채취·가공·전달 어느 한 부분의 결함도 임성을 떨어뜨려 팀 접근이 필요함. AI 센터가 양질 정액을 유통해도 판매 후 임성은 정액을 올바르게 다루고 융해하며 적기에 수정하는 사람에게 달려 있음.</li>
<li>정액 취급의 일차 목표는 정자를 해로운 조건에 최소 노출해 수정 능력을 보존하는 것임. 동결보존·저장·융해 중 손상은 cold shock, 얼음 결정 형성, 산화 스트레스, 막 변성, 동결보호제 독성, 삼투 변화에서 비롯됨.</li>
<li>동결정액은 액체질소 통(견고한 외피+내부 칸, 사이는 극진공 단열)에 보관함. 통은 밀폐형이 아니라 온도 변동에 따라 기체를 방출함. 밀폐되면 폭발 위험임. 진공이 주 단열 요소라 목관에 과한 힘·흔들림이 가해지면 갈라져 진공이 손실되고 외피 천공·외부 용접도 진공을 깸. 통 상단 심한 서리 축적은 급속 증발·고장 신호임. −196℃에서 무기한 보관 가능하나 액체질소 최소 5cm 깊이를 유지하고 정기적으로 모니터·보충함.</li>
<li>통은 직사광선 피해 서늘·청결·건조·환기 좋은 곳에 두고 나무 팔레트 위에 올려 콘크리트 바닥에 직접 두지 않음(부식 방지). 통끼리 쌓지 않고 눕혀 굴리지 않으며 증발을 자주 관찰할 수 있는 곳에 둠. 차량 운반 시 손상·유출 막게 고정함.</li>
<li>대부분 정액은 0.25·0.5ml 스트로에 담김. 성판별 정액은 일관되게 0.25ml임. 같은 수소 스트로 5개를 고블릿에, 고블릿 2개를 케인에 담아 캐니스터에 저장함. 물이 얼면서 정자는 농축된 염·희석제 용액에 노출되고 얼음과 농축액의 불안정성이 정자에 해로움. 동결보호제와 최적 동결 프로그램이 손상을 최소화하지만 정액은 얼음 재결정화가 시작되는 임계 온도(−100~−80℃)보다 충분히 낮게 유지해야 함.</li>
<li>통 목 부위 온도는 상단 2.2~12.2℃, 2.54cm −15~−22.2℃, 5.08cm −40~−46℃, 7.62cm −75~−82℃, 10.16cm −100~−120℃(임계 온도대), 12.7cm −140~−160℃, 15.24cm −180~−192℃임.</li>
<li>스트로를 통 상단에서 5cm 위로 올리면 실온(22℃)·냉장(5℃) 어디서든 임계 재결정화 온도에 10~20초면 도달함. 열 손상은 영구적이라 액체질소로 되돌려도 교정되지 않음. 케인·캐니스터는 서리선 아래에서 5~8초만 유지하고 필요하면 통 안으로 다시 내려 냉각한 뒤 올림.</li>
<li>정액 재고 시스템을 통 근처 벽에 붙이고 한 수소 정액을 한 랙에 모으며 캐니스터·고블릿에 수소 번호를 표시해 불필요한 검색·고온 노출을 막음. 통 간 이동은 두 사람이 통을 나란히 놓고 가능하면 이동 전 질소를 채움. 융해 시 캐니스터를 목 하부까지 올려 고블릿을 잡고 더 내려 다른 스트로를 보호함(꺼내기 어려우면 고블릿 탭을 45도로 구부림). 핀셋으로 스트로를 꺼내는 즉시 랙·캐니스터를 통 본체로 빠르게 내림.</li>
<li>스트로당 정자 수는 가변적임. 높은 희석(0.25ml당 200만)과 낮은 희석(1500만)은 융해 직후 운동성·막/염색질 완전성·임신율에 차이가 없었으나 일부 수소는 임성 유지에 더 많은 정자가 필요함. 정자 수가 매우 적은 성판별 정액은 임성이 거의 필연적으로 감소함.</li>
<li>융해법은 수조·셔츠 주머니·공기·체내 등 여러 가지가 권장돼 왔으나 한 농장에선 모두 같은 방법을 쓰는 게 좋음. NAAB(전미동물육종협회) 권고는 30~35℃ 수조에 최소 30초(40초 권장)이고, 융해 정액은 15분 이내에 수정하며 융해 후 급격한 온도 저하를 피함.</li>
<li>셔츠 주머니 융해는 초기 30℃였다가 1분 뒤 약 19℃로 떨어져 악영향을 줄 수 있고 주변 온도·의복 두께에 따라 매우 가변적이며 수조보다 훨씬 느림. 빠른 융해가 융해 후 생존성은 높지만 최근 연구는 시험관 질이 개선돼도 생체 내 임성은 주머니 융해와 차이가 없다고도 봄. 여러 스트로 동시 융해도 가능한데(숙련 수정사는 20분 내 최대 4두 교배) 침지 직후 스트로를 흔들어 엉김을 막아야 함.</li>
<li>융해 후 물과 정액이 섞이면 비가역적 손상이 오므로 수조에서 꺼낸 스트로는 자르기 전 종이타월로 건조함. 천공 등 결함 스트로는 폐기함.</li>
<li>cold shock은 융해 후 차가운 환경에서 급격히 온도가 떨어지면 정자 형질막이 비가역적으로 변해 운동성·수정 능력을 잃는 것임. 데워도 회복 안 됨. 정자로 나트륨이 유입되고 칼륨·마그네슘이 유출됨.</li>
<li>35℃ 융해 후 주입기 준비 약 1분 동안 주변 21℃면 저하가 3~6℃뿐이라 봉을 데우면 효과적으로 대응됨. 16℃면 약 20℃, 4℃면 약 15℃ 떨어져 데워도 지연만 됨. 스트로는 표면 대 부피 비가 커 cold shock에 취약하므로 서늘한 환경에선 예방 조치가 필수임.</li>
<li>추운 날씨엔 교배 동물 가까이의 차폐·가온 공간에서 융해·주입기 장전하고, 장전 후 주입기를 의복 안이나 보온기에 끼워 단열한 채 보정틀로 이동하며, 차폐·가온 공간에서 주입기 준비·교배를 수행하고, 장전 주입기를 35℃로 유지하는 휴대 운반함을 활용함.</li>
<li>소 AI 수정법은 자궁체·양측 자궁각·심부 자궁각·난포내 수정이 있으나 가장 흔한 것은 직장질법으로 자궁경 내구 바로 앞쪽 자궁체에 주입하는 것임. 자궁경 통과 기술만이 목표가 되어선 안 되고 위생·정확한 주입 부위 식별·생식 해부 이해가 함께 가야 함.</li>
<li>장전 주입기를 위생 플라스틱 커버에 넣어 질 오염을 차단함. 암소를 스트레스 최소로 보정함. 코르티솔 상승이 LH surge를 억제함. 촉진 팔로 직장에서 자궁경을 찾아 단단히 잡음.</li>
<li>외음부를 종이타월로 닦고 주입기를 외음부에 30~40도 각도로 넣어 요도구 진입을 막고 자궁경 외구까지 통과함. 요도구·질 주름·질 천장을 피함. 봉이 자궁경 안에 있으면 끝이 만져지지 않음. 자궁경을 조작하며 약 3개의 어긋난 윤상주름을 일정 압력으로 통과함. 끝이 주름에 걸리지 않게 함.</li>
<li>주입기 끝을 내구에서 약 1cm 앞 자궁체에 두고 직장 내 집게손가락 끝으로 확인함. 자궁경을 소 장축과 평행하게 잡고 약 5초에 걸쳐 천천히 주입해 정액량을 최대화하고 한쪽 자궁각 편중을 최소화함. 주입 중 봉을 자궁경 뒤로 빼지 않고 소가 움직이거나 봉이 미끄러지면 재배치함.</li>
<li>표준은 자궁체 주입이지만 양측 자궁각 수정은 임성에 변화가 없거나 개선하기도 함. 동측 자궁각 저용량(200만)과 자궁체 정상 용량(1500만)의 임신율은 비슷했으나 자궁체·양측 자궁각에 저용량을 쓰면 임성이 감소함. 자궁난관접합부 부근 주입(Ghent 기기)도 정자 용량·주입 부위가 임신율에 영향을 주지 않았고, 난포내 수정(배란 전 난포에 0.06ml 직접)은 저임성 암소의 대안으로 제안됐으나 추가 연구가 필요함. 수정 시 PGF2α는 후보우에선 임성을 개선했으나 경산우에선 아니었고, 수정 후 음핵 마사지(5초)는 임신율을 개선하지 않았음.</li>
<li>승가허용 발정이 가장 신뢰할 지표이고 발정 암소는 하루 중 언제든 활동을 보여 하루 여러 번 관찰이 중요함. 시점의 제약은 짧음. 배란은 젖소에서 발정 시작 약 28~32시간 후, 난자 최적 임성은 배란 6~12시간 후, 생식기 내 정자 수명은 24~30시간이라 성공 수정의 기회 창이 매우 짧음.</li>
<li>전통 오전–오후 규칙은 오전 발정이면 오후, 오후 발정이면 다음 날 아침임. 단 대규모 현장에선 발견 빈도 감소가 영향을 줘 이 규칙으로 최대 수태율이 안 나올 수 있음. 젖소 최고 AI 수태율은 발정 시작 4~12시간 후임. 통에서 스트로를 꺼내 AI까지 15분을 넘기지 않음.</li>
<li>수정은 기술적 역량(집중·세심함·해부 이해·주입 부위와 봉 위치 식별)과 관리적 역량(정액 저장·통 관리)을 모두 요함. 면밀한 노력이면 농장 수정사도 성공할 수 있으나 성공은 위험·함정에 대한 지식에도 달려 있음. 수태당 수정 횟수·수태율 같은 지표를 주기적으로 평가하고 정기적으로 재교육받아 기법과 신지견을 갱신함.</li>
<li>동기화는 번식 진료에서 가장 판단이 요구되는 처치임. 제제의 특징만이 아니라 처치 시점 소의 호르몬 상태와 처치 후 변화까지 이해해야 효과를 냄. 모든 프로토콜은 결국 GnRH 30시간, PGF 3~5일, P4 제거 2~4일 세 타임라인의 조합임.</li>
<li>GnRH는 11mm 이상 우성 난포를 배란시켜 새 난포파를 만듦. 투여 후 26~30시간에 배란하고 36시간 지나도 배란 없으면 무효임. 난포가 없으면 효과 없음.</li>
<li>hCG는 LH 작용임. 수정 후 5일째 투여하면 제1난포파 우성 난포(13mm 이상)를 배란시켜 부황체를 만들어 혈중 P4를 올림(황체 기능 보강).</li>
<li>PGF2α는 황체 퇴행을 유도해 발정을 부름. 자궁축농증·내막염 치료도 함. 황체기 6일 이전엔 잘 안 듣고(어린 황체 저항성) 중증 자궁 질환 땐 황체가 안 죽을 수 있음.</li>
<li>E2는 발정 유도·자궁경관 확장·자궁 수축임. 주로 P4와 병용함. 배란 유발로 쓰면 투여 약 16~24시간 후 LH surge, 약 42~52시간 후 배란임. 질내 유치형 P4 제제(CIDR)는 혈중 P4를 높여 발정·배란을 억제함(황체 효과 모방). 동기화의 핵심 부품임.</li>
<li>모든 동기화는 두 손잡이를 인위로 돌리는 것임. 하나는 P4 두 박자로, P4를 한동안 깔았다가(priming) 뺌(탈억제). CIDR·P4 장치를 넣었다 빼는 것이 이 재현임. 다른 하나는 E2 되먹임으로, E2는 P4 배경에 따라 얼굴을 바꿈. 고P4면 음성(난포 폐쇄·억제), 저P4+priming이면 양성(LH surge)임.</li>
<li>GnRH는 이 되먹임 회로를 건너뛰고 뇌하수체를 직접 때려 surge를 만드는 지름길임. 각 프로토콜은 이 레버를 어떻게 돌리느냐의 차이일 뿐임.</li>
<li>PGF2α 단독은 황체 보유우에 투여해 황체를 퇴행시키고 P4를 낮춰 우성 난포 발육·발정을 유도함. 발정 발현이 투여 후 2~6일로 폭이 넓은데 투여 시점의 우성 난포 크기에 달렸음.</li>
<li>우성 난포 10mm 전후(주기 전반)면 P4 저하 후 발육·성숙이 필요해 발정까지 3~4일, 15mm 초과면 이미 커 성숙이 빠르고 E2도 많아 2일, 폐쇄 타이밍이면 새 우성 난포가 선발·성숙해야 해 5일 이후, 제2난포파 이후 10mm 전후(주기 후반)면 3~4일임.</li>
<li>홀스타인 622두 무작위 투여 시 발정은 3일째 49.8%, 4일째 14.1%로 3~4일에 몰림. 투여 3~4일째 집중 관찰함. 황체기 6일 이전(이전 발정 6일 이내, 발정 후 출혈 4일 이내) 투여는 권장하지 않음.</li>
<li>PGF가 황체를 녹여 P4를 빼는 것이 두 박자의 둘째 박자임. 주기 소는 이미 황체기 동안 P4를 겪어 priming돼 있으므로 P4만 빠지면 우성 난포의 E2가 양성 되먹임으로 돌아서 surge·배란이 일어남.</li>
<li>CIDR 단독은 질 점막으로 P4가 흡수돼 혈중 P4를 높게 유지함. 넣어두는 동안 LH pulse를 눌러 발정·배란을 억제하고, 빼면 P4가 뚝 떨어지면서 억눌렸던 소들이 한꺼번에 발정에 들어옴. 이게 발정 집중화임. 보통 7~14일 넣어 둠.</li>
<li>홀스타인 미경산우에서 7·14·21일 삽입을 비교하면 오래 넣어둘수록 발정이 더 좁게 모임(21일 삽입은 제거 2일째 96% 발정). 오래 넣어두는 동안 자기 황체가 자연히 퇴행해버린 소가 늘어 뺄 때 이미 황체가 없는 소가 많아지기 때문임. 그래서 14·21일 단독은 추가 호르몬 없이도 발정이 잘 모임.</li>
<li>그런데 발정이 잘 모이는 것과 수태율이 높은 것은 다름. 14·21일 단독은 7일 삽입+PGF2α보다 수태율이 떨어짐. 오래 넣어두는 동안 난포파를 통제하지 못해 우성 난포가 너무 오래 발육·노화한 상태로 수정을 맞기 때문임. 늙은 난포 속 난자는 수태력이 낮음.</li>
<li>그래서 7일 삽입+PGF2α를 씀. 7일은 짧아서 뺄 때 아직 황체를 가진 소가 많음. 이 황체가 P4를 계속 내면 제제만 빼도 발정이 오지 않으므로 제거와 동시에 PGF2α를 반드시 같이 놓아 황체를 녹임. 난포를 노화시키지 않고 적정 시점에 수정할 수 있어 수태율이 더 나음.</li>
<li>P4 제제 단독은 난포파를 통제하지 못해 제거 후 발정의 수태율이 불안정함. 최근엔 GnRH·PGF를 엮은 배란 동기화·정시 AI와 병용함. CIDR를 넣는 동안은 외부 P4가 첫 박자를 맡고(priming하면서 고P4로 E2를 음성 쪽에 묶어 발정 억제), 빼면 둘째 박자가 되어 E2가 양성으로 돌아서며 발정이 몰림. 자기 황체가 없는 소에서도 P4 장치가 두 박자를 대신 만들어 줌.</li>
<li>Select-Synch는 난포 나이를 맞추는 방법임. PGF2α 단독·CIDR 단독은 유기된 발정이 개체마다 들쭉날쭉하고 수정 대상 난포의 일령이 높아지면 난자가 노화해 수태율이 떨어짐. 난포 일령이 5~10일이면 수태율이 서서히 떨어지고 11일을 넘으면 급락함. 그래서 난포파 자체를 인위로 리셋해 적정 나이의 난포에 수정하자는 것임.</li>
<li>황체가 있는 소에서 GnRH(0일)를 놓으면 surge가 일어나 우성 난포가 배란되고(투여 약 30시간 후) 그 자리에서 새 난포파가 출발함. 난포 나이가 0으로 리셋됨. 7일째 새 우성 난포가 5.5일령일 때 PGF2α로 황체를 녹여 적정 일령 난포에서 발정·배란이 일어나게 함. 이후 7~10일에 발정을 관찰해 AI함.</li>
<li>0일 GnRH는 시상하부를 건너뛰고 뇌하수체를 직접 때려 surge를 만듦. 자연 주기에선 E2가 양성 되먹임으로 만들던 그 surge를 GnRH가 대신 일으켜 우성 난포를 배란시키고 난포파를 0으로 리셋함. 7일 PGF는 P4를 빼는 둘째 박자임.</li>
<li>오브싱크는 Select-Synch에 마지막 GnRH를 더해 배란까지 동기화하므로 발정 관찰 없이 정시 AI가 가능함. GnRH(0일) → PGF2α(7일) → GnRH(9일) → 정시 AI(2차 GnRH 약 16시간 후)임. 첫 GnRH가 우성 난포를 배란시켜 난포파를 리셋하고, 7일 기다려 새 우성 난포를 키운 뒤, PGF로 황체를 녹이고, 2차 GnRH로 배란을 유도해 시간을 맞춰 수정함.</li>
<li>주기 5일 이전 시작은 우성 난포가 작아 1차 GnRH로 배란이 안 돼 실패함. 주기 14일 이후 시작은 PGF 투여 전 황체가 이미 퇴행해 AI 전에 배란해 실패함. 결론은 주기 5~14일 사이 시작임. 14일 이후 시작해야 하면 1차 GnRH와 함께 P4 제제를 넣어 조기 배란을 막음.</li>
<li>오브싱크는 배란을 GnRH로 두 번 직접 일으킴. 1차 GnRH는 현재 우성 난포를 배란시켜 난포파를 0으로 리셋하고(반응할 우성 난포가 있어야 하므로 주기 5일 이전엔 실패), 7일 PGF로 P4를 빼고(둘째 박자), 2차 GnRH가 새로 자란 성숙 난포를 정시에 배란시킴. 자연 주기라면 E2의 양성 되먹임이 만들 surge를 두 번 다 GnRH가 뇌하수체를 직접 때려 대신 일으킴.</li>
<li>주기 14일 이후 시작이 위험한 건 PGF 전에 황체가 스스로 녹아 P4가 먼저 빠지면 자기 E2가 양성 되먹임으로 미리 surge를 터뜨려 AI 전에 배란해버리기 때문임. 이때 P4 제제를 넣어 그 조기 탈억제를 막음.</li>
<li>히트싱크는 오브싱크의 마지막 배란 유발제(2차 GnRH)를 E2로 바꾼 변법임. GnRH(0일) → PGF2α(7일) → E2(8일, PGF 24시간 후) → 정시 AI(9~9.5일, E2 후 24~36시간)임. 배란 유기 효과는 GnRH와 비슷한데 E2를 쓰면 AI 시점에 발정 징후가 나타나 시술자가 발정을 눈으로 보고 수정할 수 있어 안심됨. 관건은 E2 타이밍으로 투여 후 약 16~24시간에 surge 피크, 약 42~52시간 후 배란임.</li>
<li>마지막 E2는 양성 되먹임을 직접 당기는 것임. 7일 PGF로 이미 P4가 낮아져 있어(priming은 주기 소라 충족) 외부 고E2가 저P4+priming 조건에 맞아 시상하부를 통해 surge를 일으킴. GnRH(뇌하수체 직격)보다 배란이 느린(42~52시간) 것은 E2가 시상하부 양성 되먹임 회로를 한 바퀴 돌아 작동하기 때문임.</li>
<li>시더싱크는 오브싱크+CIDR임. 오브싱크는 황체 보유우라야 높은 수태율이 나옴. 시작 시 황체가 불명확하거나 주기 후반(14일 이후)에 시작해 처치 중 황체가 퇴행해버릴 우려가 있으면 CIDR를 함께 넣어 P4를 인위로 받쳐 줌. 골격은 오브싱크와 같고 황체가 불안한 소에서도 쓸 수 있게 해줌.</li>
<li>eCG 프로토콜은 난소가 잘 안 도는 무발정·생식력 저하 소에 씀. P4 장치로 P4를 높게 깔아(고P4=FSH·LH 억제·난포 성장 억제) 발정·배란을 일단 누르고 동기화한 뒤, 장치를 빼 P4가 빠진 자리에 eCG를 놓아 난포 발육·배란을 강하게 밀어 줌(저P4+E2=LH 자극·배란).</li>
<li>P4 장치 삽입(0일) → PGF2α(6일, 황체 퇴행) → 장치 제거+eCG 400~600IU(구 PMSG, 7일, 쌍태 방지 위해 용량 조절) → 정시 AI(8~10일, 가장 흔한 건 56시간 1회 AI이고 발정 확인 후 AI나 48·72시간 2회 AI도 가능)임. 대사 상태가 나쁘거나 분만 직후인 소에 쓰면 실패하기 쉬움.</li>
<li>대상이 무발정·생식력 저하 소인 게 핵심임. 이런 소는 P4를 겪은 적 없어 priming이 빠져 있고(낭종, 사춘기 전과 같은 상태) 자기 LH 드라이브도 약함. P4 장치(0일)가 빠진 priming을 깔아 주고(첫 박자), 장치 제거(둘째 박자) 자리에 eCG(FSH·LH 활성)를 부어 약한 엔진을 보충해 난포 발육·배란을 강하게 밂.</li>
<li>호르몬 처치는 효과적이지만 소의 난소·자궁·과거~현재 상태를 이해한 뒤 함. 오브싱크·시더싱크 모두 황체 보유가 수태율의 전제임을 잊지 않음.</li>
<li>E2+P4 프로그램은 오브싱크가 GnRH로 우성 난포를 배란시켜 난포파를 리셋하는 것과 달리 E2+P4로 뇌하수체의 FSH·LH 방출을 억눌러 우성 난포를 폐쇄시킨 뒤 새 난포파를 띄움. 가장 큰 이점은 황체·난포 상태에 덜 의존해 발정주기와 관계없이 아무 때나 시작할 수 있다는 것임. 시작 시기에 민감한 오브싱크와 대조됨.</li>
<li>0일에 E2와 P4 제제를 함께 넣으면 고E2+고P4가 만들어져 FSH·LH 방출이 억제되고 자라던 난포(우성 난포 포함)가 폐쇄됨. 이후 E2가 서서히 분해돼 고P4만 남고 우성 난포도 사라지면 FSH가 회복되며 새 난포파가 출발함(평균 4일째). 9일에 PGF2α와 P4 제거로 황체를 녹이고, 10일에 E2로 배란을 유도해(E2 후 16~24시간 surge, 42~52시간 후 배란) 11~11.5일에 정시 AI함.</li>
<li>E2 2.0mg+P4 제제 삽입(0일) → 고E2+고P4로 난포 폐쇄 → 새 난포파 출현(평균 4일, E2 분해·고P4만 남아 FSH 회복) → PGF2α+P4 제거(9일, 황체 퇴행, 난포 약 5일령) → E2(10일, 배란 유도, 난포 약 6일령) → 정시 AI(11~11.5일, 난포 약 7~7.5일령)임.</li>
<li>같은 E2를 앞에선 음성, 뒤에선 양성으로 시간차로 쓰는 프로그램임. 0일 E2는 P4를 함께 넣어 고P4 배경이라 양성이 차단되고 음성으로 작동해 FSH·LH를 눌러 우성 난포를 폐쇄시킴(리셋). 그동안 깔린 P4가 시상하부를 priming하고, 9일 P4 제거로 P4가 빠진 뒤 10일 E2는 저P4+priming 조건이라 양성 되먹임으로 surge를 일으킴. P4 장치 하나가 폐쇄(음성 배경)와 priming을 동시에 맡으니 난포·황체 상태와 무관하게 아무 때나 시작할 수 있음.</li>
<li>소 상태(육우/젖소·산유량)에 따라 E2 분해 속도가 달라 새 난포파 발현이 3~5일로 폭이 생기고 AI 때 난포 크기 편차가 커짐. 20mm 가까운 큰 난포+퇴행 황체/무황체는 우성 난포가 폐쇄되지 않아 노화한 난자를 배란해 수태율이 떨어짐. 15mm 미만 작은 난포(특히 한우·흑모와종)는 발육 개시가 늦거나 PGF까지 일수가 짧으면(흑모와종 8일 이내) AI 시점에 난포가 덜 커 있음.</li>
<li>AI 무리에서 분만 간 간격을 정하는 두 인자는 발정 발견(공시율)과 분만율임. 효과적인 동기화의 요건은 지정 간격 동안 예측 가능하고 높은 발정·배란 반응과, 정해진 시점의 단일 수정에 대한 높은 임신율임. 주기를 잘 통제하려면 새 난포파 출현 동기화, 황체기 보장, 황체기 종료, 배란 동기화 넷이 필요함.</li>
<li>난포 성장은 파동 양상으로 각 파는 출현→선택/폐쇄→우성→배란 또는 폐쇄를 거치며 7~10일(2파 18일 주기 vs 3파 24일 주기) 수명임. 새 파 출현은 일시적(1~2일) FSH 증가가 받치고 FSH 정점은 파 출현 직전임. 가장 큰 난포가 약 8.0mm에 이를 때 deviation이 시작돼(소에서 약 8시간 차) 단일 우성 난포와 종속 난포로 갈림. 우성 선택 무렵 FSH 의존에서 LH 의존으로 전환되며 우성 난포는 과립막에 LH 수용체를 발현함.</li>
<li>외인성 황체용해나 프로게스타겐 중단에서 발정까지 간격은 그 시점의 난포파 단계에 달렸음. 선택된 우성 난포가 있으면 2~3일 내, 선택 전이면 3~7일 후 발정함. 발정 동기성은 우성 지속이 4일 미만 또는 10~12일 초과일 때 최적이고, 특히 배란 난포의 우성 지속이 10일을 넘으면 조기 활성화된 노화 난자 때문에 임신율이 급락함. 그래서 새 파 출현을 정밀히 통제하는 것이 핵심임.</li>
<li>난포파 통제는 새 파 출현이 주로 FSH 의존, 에스트로겐 활성 우성 난포가 대체로 LH 의존이라는 두 원리에 근거함. 프로게스타겐·에스트로겐의 음성 되먹임으로 FSH·LH를 억제해 파 출현을 동기화함. 외인성 유도엔 기존 파의 일관된 종료, 새 파를 부를 FSH의 예측 가능한 일시 증가, 선택 후 우성 난포의 정상 성장이 필요함.</li>
<li>GnRH는 즉각 LH·FSH 급증을 일으키나(크기는 P4 농도·난포파 단계와 무관) 효과는 우성 난포 유무에 달렸음. 우성 선택 후 GnRH는 그것을 배란시켜 1.5~2.0일 후 새 파가 출현하지만, 선택 전 GnRH는 그 파에 영향이 없음(성장 난포 과립막에 LH 수용체가 없어서). 그래서 GnRH 동기화는 기능적 우성 난포가 있을 때만 작동하고 이후 유도된 황체를 퇴행시킬 PGF2α가 필수임. 소는 주기 5~12일에 GnRH를 줄 때 가장 일관되게 반응함.</li>
<li>에스트라디올은 우성 난포 성장기를 억제하고(P4 병용 시 더 깊게) 시상하부·뇌하수체 모두에 음성으로 FSH·LH를 누름. 프로게스틴 삽입 소에 E2-17β(2.5~5mg)나 EB·발레레이트(2mg)를 주면 약 4~4.5일 후 변동 거의 없이 새 파가 출현함(E2가 대사되며 FSH 급증→새 파). 가장 성공적인 난포파 동기화 호르몬이지만 금지국이 늘어 대안이 필요함.</li>
<li>황체용해는 배란 전 난포의 E2 → 뇌하수체 옥시토신 방출 → 소량 자궁 PGF2α 방출로 시작되고, PGF2α가 추가 황체·자궁 옥시토신과 PGF2α를 부르는 양성 되먹임 고리를 염(황체 PGF2α도 자가/측분비로 신호 증폭). PGF2α는 황체 혈류를 줄이고 큰 황체세포 세포자멸사를 촉진해 황체를 소멸시킴.</li>
<li>소에서 PGF2α는 주기 약 5일 이후 황체의 즉각 퇴행을 일으킴. P4가 24시간 내 기저로 급락하고 LH pulse가 늘어 발정·배란이 유도됨. 빠른 황체용해에도 치료–발정 간격은 난포파 단계에 따라 가변적임. 우성 난포가 있으면 2~3일 내, 우성 전·퇴행 단계면 4~6일 걸림.</li>
<li>PGF2α는 발정 후 처음 5~6일은 황체용해를 잘 못 시킴. 과거엔 미성숙 황체에 수용체가 없어서로 봤으나 최근 배란 후 2일이면 수용체 존재가 입증됨. 주기 5·6일 단일 투여는 반응이 가변적이고, 12시간 간격 두 번 투여하면 발정 후 2~5일에 95~100% 일관된 황체 퇴행임.</li>
<li>외인성 P4(PRID 1.55g, CIDR 1.38g 미국/1.9g 캐나다, Cue-Mate 1.56g)는 황체기를 모방·연장함. 모든 P4 기반 동기화에서 최대 85%가 제거 후 36~72시간에 발정하고, GnRH·E2로 배란을 유도해 제거 후 48~84시간 FTAI가 가능함.</li>
<li>P4 동기화의 첫째 이점은 LH surge·발정 행동 억제임. P4를 역치(1ng/ml 초과) 이상 유지함. 단 14·21일 장기 치료는 잔존 우성 난포(노화 난자)로 수태율이 단기보다 10~15% 낮아 7~9일 단기 프로토콜이 개발됨.</li>
<li>둘째는 무발정 암소 반응임. P4 보충은 처음엔 LH를 줄이나 이후 LH pulse를 높여 우성 난포 발달을 늘리고 시상하부를 발정·surge에 priming함. 육우 약 20%, 미국 젖소 초산우 28%·경산우 15%가 분만 후 60일까지 무배란임.</li>
<li>셋째는 낭종성 난소(미국 젖소 약 10%) 치료임. 높은 LH pulse·surge 부재가 특징인데 P4가 pulse를 낮춰 낭종 교체→새 우성 난포 정상 발달→중단 후 배란임.</li>
<li>단일 GnRH는 젖소 분만 후 약 10~18일, 육우 21~31일에 주면 surge·배란을 유도함(육우는 48시간 송아지 격리 결합도 효과). hCG 500~3000IU, 외인성 E2도 배란을 유도함. 단 분만 후 GnRH 유도 황체는 자발 황체보다 수명이 짧고, 자궁 복구 전 GnRH는 자궁축농증을 부를 수 있어 분만 후 초기 단일 GnRH는 실무 유용성이 낮음.</li>
<li>프로스타글란딘 프로토콜은 황체용해 기전이라 성숙 황체가 있는 주기 암소에만 적용됨. PGF2α 25mg 또는 클로프로스테놀 500μg으로 주기 무리의 55~65%에서 발정함. 11~14일 후 2차 주사로 동기 발정을 만듦(1차 반응우가 6~15일, 대다수 7~9일이 되므로). 단 모든 성숙 황체가 용해되진 않음. 6일째 약 25%, 7일째 약 33%, 8~16일째도 100% 미만 반응임.</li>
<li>프로게스테론 프로토콜의 14일 치료(IVPD/경구 MGA)는 배란을 14일 억제해 노화 난포 배란으로 임성이 낮아 제거 19일 후 PGF2α를 줌(잔존 난포 배란 후 황체 퇴행). 육우 후보우에 흔하고 MGA 0.5mg/일·14일 곡물 혼합 급여는 비용 효율적임. 7일 노출(IVPD)은 PGF2α 시 모든 주기우가 7일 이상 황체를 가져 제거 2~6일 후 발정함. 7일+GnRH는 P4만으로는 난포파 동기화가 안 되므로 시작 시 GnRH로 새 파를 개시해 잔존 난포를 줄이고, GnRH~PGF2α 사이 프로게스틴이 조기 발정을 차단함.</li>
<li>배란 동기화(FTAI)의 오브싱크는 GnRH → 7일 후 PGF2α → 48시간 후 2차 GnRH → 16시간(8~24) 후 정시수정임. 첫 GnRH가 우성 난포 배란/황체화로 약 3일 후 새 파를 개시하고 2차 GnRH가 배란 동기성을 높임. 후보우에선 효과가 덜함. CO-Synch는 2차 GnRH를 AI와 동시에 해 처치를 1회 줄임(육우에 이점).</li>
<li>Presynch-Ovsynch는 14일 간격 PGF2α 2회 전동기화 후 11·12·14일째 오브싱크를 시작해 주기 5~12일에 맞춤. 단 PGF2α 전동기화는 무배란우엔 무효임. G6G는 PGF2α→2일 후 GnRH로 새 주기 개시→6일 후 오브싱크임. Double-Ovsynch는 오브싱크로 전동기화·주기성 유도 후 교배용 오브싱크를 하며 무배란 젖소에 유리함.</li>
<li>오브싱크·코싱크에서 첫 GnRH~PGF2α 사이 7일(또는 5일) P4 보충은 발정·배란 동기성과 수태를 높이고 무발정·후보우·낭종우에 유리함. 5일 P4+전발정기 72시간 연장은 육우 AI 임신율을 최대 15% 높였음. 단 5일 프로토콜은 주기 5일 단일 PGF2α 황체용해가 가변적이라 CIDR 제거 시 6~12시간 뒤 2차 PGF2α가 필요함.</li>
<li>eCG는 난포 발달을 늘려 계절 분만 무발정 소에 유리함. P4 기구 제거 시 eCG 400IU가 49일 교배철 74% 임신, 무발정 젖소·육우에서 FTAI 임신율을 10~15% 높였음.</li>
<li>동기화 받은 암컷 일부는 FTAI 전 발정을 안 보이는데 이들에 일괄로 GnRH를 줘 배란을 유도해도 임신율이 평균 27% 낮음. 분할 정시수정(STAI)은 비발정 암컷의 수정을 예정 정시 AI보다 20~24시간 늦추는 방법임.</li>
<li>PGF2α 투여 시 발정 발견 패치로 발정 상태를 판정해 최적 시점에 수정함. 7일 CO-Synch+IVPD/14일 IVPD-PGF2α 후 성우 30~50%·후보우 20~40%가 PGF2α 후 66시간 전에 발정을 안 보이는데 그중 55%가 지연 시점까지 발정을 보였고, 수정을 20~24시간 늦춰 비발정 암컷 임신율이 16%p 개선됨. 활성화된 패치가 있는 소엔 GnRH가 불필요해 GnRH 사용도 줄임.</li>
<li>hCG는 LH와 약 85% 구조가 같은 성선자극호르몬으로 LH 유사 작용을 냄. 반감기는 약 24시간으로 LH의 20분보다 훨씬 김. 효능은 난포낭종·배란 장애·난포 발육 장애(난소 발육 부전·난소 정지·난소 위축)에 있고 기대하는 것은 배란과 황체 형성이라 기본적으로 GnRH와 비슷함. 현장에서 가장 많이 쓰는 맥락은 AI 후 혈중 P4를 끌어올려 수태율을 높이려는 것임.</li>
<li>보통 AI로부터 5일 전후에 투여함. 배란 뒤 새로 발육을 시작한 제1난포파 우성 난포가 10mm 이상으로 자랐을 때 hCG를 놓으면 그 난포가 배란·황체화되어 부황체가 생김. 이 부황체가 황체 체적을 늘려 혈중 P4를 올림. LH 유사 작용으로 기존 황체 기능도 보강되지만 P4 상승의 주역은 부황체 형성임. 그래서 P4는 투여 2~3일이 지나서야 오르기 시작해 CIDR보다 상승이 느림.</li>
<li>1,000IU에서도 GnRH 100μg과 비슷한 배란율이 나오고, 2,000IU에서 90%에 육박, 2,500IU 이상에서 90%를 넘음(홀스타인 비유우 기준). 2,000IU 이상이면 높은 배란율을 기대할 수 있음.</li>
<li>AI 후 hCG 투여 시험 10건을 종합하면 무작위 투여 시 수태율 향상은 평균 +3.0%로 미미함. 개별적으로 유의했던 건 3,300IU를 쓴 2건뿐임. 초산우, 리피트 브리더(생식기에 이상이 없는데도 3회 AI로 수태되지 않는 소)처럼 원래 수태율이 낮은 소·우군에서 효과가 인정됨. 모든 소에 일괄로 놓기보다 수태율이 낮은 소를 골라 씀.</li>
<li>이제 발정 발견 시 또는 발견 없이 정시에 수정해 수용 가능한 임성을 얻는 프로토콜이 있고, 치료 시작 시 주기를 안 도는 암컷에서도 성공함. 특히 사춘기 전후 후보우·무주기 암소에서 임성 있는 배란을 개시하는 것이 동기화·정시 AI로 임성을 개선하는 일차 방법이며, 수정 전 질내 P4 기반 동기화가 다른 호르몬 개입보다 임성을 더 효과적으로 높임. 지역·목초·사료·품종·체형·분만 후 간격·기후가 성공에 영향을 주므로 염두에 둠.</li>
</ol></div>

  `;
}

function reproPregHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('dna',16)} 임신 — 임신 인식·감정·태아 프로그래밍</div>
<div class="rb-block"><ol class="rb-list">
<li>배란된 난자는 난관채에 받아들여져 팽대부–협부 접합부에 머묾. 자궁에 주입된 정자는 자궁경관을 지나 난관협부에 도착해 상피와 결합해 일정 시간 저장되었다가 배란에 맞춰 결합이 풀리고 수정능을 획득하며 활발히 움직여 난자와 만남.</li>
<li>수정란은 약 1일에 한 번씩 분열하지만(난할) 크기는 커지지 않음. 1일 2세포, 2일 4세포, 3일 8세포, 4~5일 상실배이며 8~16세포기에 난관에서 자궁으로 내려옴. 6~7일 자궁각에서 배반포가 되고 투명대를 탈출함(부화).</li>
<li>임신이 성립하려면 가장 먼저 황체를 살려야 함. 황체는 가만 두면 주기 끝(16~17일)에 자궁이 뿜는 PGF2α에 녹는데 임신 유지에 필요한 P4는 그보다 더 오래 필요함. 그래서 임신한 소는 황체가 녹기 전에 새끼 들었다는 신호를 보내야 하고 이게 모체 임신 인식임.</li>
<li>신호를 보내는 건 영양막이 분비하는 IFN-τ임. 배반포는 13일경 3mm 구형이지만 14일부터 실처럼 길어지기 시작해 17일이면 25cm 신장배가 됨. 이 가늘고 길어진 영양막에서 IFN-τ가 나옴.</li>
<li>IFN-τ는 자궁의 프로스타글란딘 저울을 바꿈. PGF2α는 황체를 녹이는 쪽, PGE2는 황체를 지키는 쪽인데 IFN-τ가 이 저울을 PGE2 쪽으로 기울여 황체를 살림. 거꾸로 배아 발육이 늦어 IFN-τ가 부족하면 저울이 PGF2α 쪽으로 기울어 황체가 녹고 임신이 깨짐.</li>
<li>현대 유우에서 수정 후 불수태우의 약 30%는 황체 퇴행이 지연되어 재발정이 늦어짐. 어느 시기까지 배아가 IFN-τ를 분비해 황체용해를 막다가 도중에 사멸해 버린 경우임. 그래서 수정우는 25~26일까지 재발정을 확인해야 함.</li>
<li>P4는 임신 첫 200일을 황체에서 공급함. 태반은 3분기는 되어야 충분히 만듦. 그러니 초기 임신은 전적으로 황체에 달려 있음. P4는 황체를 유지시킬 뿐 아니라 자궁 환경 자체를 임신에 맞게 세팅함. 내막 분비를 자극해 배아에 먹이를 대고 자궁 평활근을 조용하고 이완된 상태로 묶음.</li>
<li>수정 후 5~9일 P4 보충은 영양막 길이를 4배, 자궁 IFN-τ를 6배 늘림. 초기 P4가 높을수록 배아가 잘 자라고 수태율이 오름. 낮으면 내막 영양소 수송체가 줄어 배아가 굶음.</li>
<li>배아는 9~10일 부화, 14일부터 신장, 19~20일 30cm를 넘기도 함. 20~33일에 자궁과 융모막이 접촉→부착으로 맞물리고 요막이 발달해 융모요막 태반을 만듦. 소의 착상은 임신 3주째 시작되는 표재성 부착이며 자궁벽 소구 약 100개가 태아쪽 융모엽과 맞물려 태반분엽을 이룸.</li>
<li>임신 중 어미 심혈관계는 동맥압·혈관 저항이 떨어지고 심박출량이 최대 30~40% 늚. 심박수는 15%만 늘고 나머지는 1회 박출량이 메움. 분만 후 자궁태반으로 가던 혈류가 유선으로 재분배되는 것이 분만 직후 최고 비유를 가능하게 함.</li>
<li>영양 면의 핵심은 임신 막바지임. 젖소의 임신 말 영양 요구는 같은 체중 비임신 소보다 약 75% 높음. 임신 7개월이면 태아가 출생체중의 40%에 이르고, 예상 분만 약 60일 전 건유로 비유와 태아 성장의 경쟁을 막음.</li>
<li>수소와 쌍태로 태어난 암송아지는 불임일 수 있음(프리마틴). 두 태아의 태반 혈관이 문합되어 피가 섞이면 성 분화 중인 암컷이 수컷 쌍태의 테스토스테론·AMH에 노출되기 때문임. 수컷 조혈줄기세포까지 넘어와 키메라가 되며 생식선이 간성으로 끝나기도 함. 수소와 쌍태로 난 암송아지를 번식우로 쓸지 판단할 때 반드시 떠올림.</li>
<li>임신 감정은 번식 성적 평가에서 가장 중요한 행위임. 초음파의 가장 큰 가치는 양성 확인이 아니라 비임신의 조기 발견에 있음. 비임신우를 빨리 가려내 다시 수정 사이클에 올려야 함. 단 임신 90일 이내 초기 배아사·태아사가 6~15% 발생할 수 있어 후속 확인이 필요함.</li>
<li>감정 가능 시기는 직장검사 AI 후 35일 이후(양막낭 촉지는 30~40일부터), 초음파 26일 이후, PAG 검사(혈액·유즙) 수정 후 28일 전후임. AI 후 60일에 재감정하고 쌍태우는 90일에도 추가 감정함.</li>
<li>직장검사 30~40일은 양막낭 촉지와 태막 슬립(자궁각을 끼워 올릴 때 드르륵 미끄러지는 감촉, 40일 이후 권장)임. 태자는 황체 있는 쪽 자궁각에 위치함. 60일 전후는 자궁각·양막낭이 커져 태막 슬립이 주 방법이고 좌우 자궁각 차이로 판정함. 연습은 이 시기 소로 함.</li>
<li>80일 전후는 태반소엽(자궁소구에서 발달)이 울퉁불퉁 만져짐. 90일 이후는 자궁이 복강으로 가라앉아 중자궁동맥 박동·진전음으로 확인함. 임신각 쪽 8~10mm 쏴쏴, 비임신각 5mm로 약함. 6개월 이후는 우측에서 압박하면 태자가 주먹에 부딪히는 타진법(부구법)임.</li>
<li>자궁 내강에 농·점액이 차도 자궁이 부풂. 양쪽 자궁각이 같게 부풀고 태막 슬립이 없으면 임신이 아니라 자궁 질환을 의심함.</li>
<li>초음파(B모드)는 반사 강도를 밝기로 바꿔 보여줌. 액체(난포액·태아액)는 초음파를 흡수해 검게(무에코), 근육·황체는 회색, 뼈·금속은 희게 보임. 그래서 난포는 검은 구체, 황체는 진한 회색~흰색 영역으로 나옴.</li>
<li>스캔은 횡종단면에서 방광 → 자궁경부 → 자궁체 → 자궁각 순으로 보며 프로브를 좌우로 움직여 난소를 확인함. 자궁체 위에서 시작해 자궁각을 따라 프로브를 옮기며 좌우 sweep하고 자궁각 분기부를 지나 난소까지 따라감. 직장 촉진으로 구조물을 먼저 찾는 연습이 선행되어야 함.</li>
<li>난포는 내부 과립세포층·외부 난포막세포층으로 둘러싸인 검은 무에코 원형임. 난모세포는 난구에 의해 난포강에 매달림. 황체는 강한 에코로 하얗고 배란 3~4일부터 커져 12~16일에 최대임. 2~3cm면 성숙(P4 최고)임.</li>
<li>출혈성 황체는 배란 직후~3일에 어둡게 보임. 퇴행기 황체와 둘 다 에코가 낮아 구분이 어려움. 공동성 황체는 내부에 액체 공동이 있고 황체기 전반부에 보이며 점차 닫히는 정상 변이라 황체 낭종과 혼동하면 안 됨.</li>
<li>태아 발육 이정표는 25일경 배아 심박동 확인(없으면 배아 사멸), 30일경 배아포, 35일부터 배아 10mm(30일)에서 20mm로 커져 진단이 쉬워짐, 45일 태반분엽·태아 움직임, 50일 배아포 약 42mm, 56일 배아 약 53mm(갈비뼈 석회화 시작)임.</li>
<li>25~45일 태아 나이는 두–미 길이(mm)+18=일령임. 15mm 33일, 20~25mm 40일, 40mm 50일, 80mm 60일임.</li>
<li>성별 판정은 55~60일부터 생식결절 위치로 함. 고에코 이중엽 구조물이고 수컷은 제대 바로 뒤, 암컷은 꼬리 아래·뒷다리 사이임.</li>
<li>황체가 2개면 50% 확률로 쌍태임. 양막강 2개·태아 2마리, 두 요막이 접하는 두꺼운 선(트윈 라인)이 보이면 쌍태 확률이 높음. 60~90일에도 배아 사멸이 단태보다 많아 90일 추가 감정함. 태아막 분리는 사망 징후이고 양막액·요막액의 양과 투명도도 함께 평가함.</li>
<li>이상적 임신감정은 최소 침습적이고 장비·시간 투자가 적으며 즉시 결과로 우방 판단을 돕고 높은 민감도·특이도를 갖춰야 함. 신뢰할 방법은 직장촉진·직장초음파·내분비검사 셋인데 직장촉진이 가장 흔히 쓰이고 가장 많은 기준을 충족함. 정상 해부·생리를 잘 이해하면 임신 30~35일에도 거의 100%에 근접하는 결과를 얻고 임신 단계까지 추정할 수 있음.</li>
<li>검사는 자궁경 식별에서 시작함. 자궁경은 섬유연골성으로 단단해(닭 목 같은 느낌) 기준점이 됨. 비임신·초기 임신엔 골반강·골반 입구에, 경산우·임신 진행 시 더 앞·복측으로 당겨짐. 자궁경을 잡아 자궁체·자궁각을 뒤로 견인하고 복측 자궁각간 인대로 자궁각을 골반 바닥에 눕혀 끝까지 촉진한 뒤 각 끝 너머에서 난소를 만짐. 임신이 진행되면 태아·태수 무게로 견인이 불가능해져 제자리에서 검사함.</li>
<li>임신 4대 주징후 중 막 슬립(융모요막 슬립)은 30~32일부터(숙련 시 후보우 28일) 자궁각을 손가락-엄지로 잡아 들면 막이 미끄러지며 톡 하는 것임. 32일 실, 45일 가는 끈, 60일 양쪽 각 굵은 끈, 75일 털실 느낌이고 90일까지 가장 흔히 씀.</li>
<li>양막낭은 배아를 둘러싼 팽팽한 액체 주머니로 32~35일 직경 6~7mm 매듭, 6주 1.5cm, 7주 3.5~5cm, 8주 6~7cm(팽팽함 소실)임.</li>
<li>태아는 약 55~60일 촉진됨(길이 5~6cm). 액체 속에 떠 있어 부구감이 있음. 3개월이면 복강으로 떨어지고 4~5개월엔 깊이 내려가 촉진이 어려우며 7개월에 다시 접근 가능함.</li>
<li>태반분엽은 75~80일 완두콩 종창, 90일 10센트 동전, 5개월 50센트 크기임. 난소 오인 방지 위해 최소 3개를 식별함. 중기에 태아 도달이 어려우면 확정 진단의 최선임.</li>
<li>확정 진단은 임신했을 때만 존재하는 4대 주징후 식별에 근거하고, 자궁체와 양쪽 자궁각을 완전히 촉진하기 전엔 미임신 진단을 내리지 않음. 보조 징후인 자궁경 견인 불가, 자궁 내 액체·파동감, 자궁각 직경 증가·비대칭, 중자궁동맥 비대·진동음은 임신을 뒷받침하나 단독으론 확정 지표가 아님.</li>
<li>임신 상태 오판은 대개 불완전한 검사·미숙 때문이고 서두름·피로가 악화시킴. 체계적 루틴을 만들고 충분한 시간을 배정함. 4대 주징후 중 하나가 없으면 확정하지 않고 보조 징후로 결정하려는 유혹에 저항함. 보조 징후는 다른 상태로도 생김.</li>
<li>자궁축농증·점액자궁증은 자궁 내 액체·파동감으로 견인이 어렵고 비대칭임. 단 자궁벽이 임신처럼 얇아지지 않아 더 긴장된 느낌임. 기종자궁증(자궁 내 공기)은 비대칭·비대임.</li>
<li>종양은 견인 어려움·비대칭, 중자궁동맥 비대·드물게 진동음임(분만 후 한동안 지속 가능). 자궁은 BLV 유발 종양 호발 부위임. 태아 부위(머리·다리)가 없고 태수에 안 떠 있으며 자궁내막과 밀착함. 미라화·침연 태아는 양수·요수 없이 자궁벽이 잔해 주위로 수축하고 침연 태아는 갈리는 염발음이 남.</li>
<li>비대한 자궁경은 소프트볼 크기·단단해 태아 머리/골반으로 오인됨. 분만 후 자궁은 비대·비대칭이나 벽이 두껍고 주징후가 없으며 표면 주름이 촉진됨. 자궁과 무관한 반추위 등쪽 주머니(태아보다 훨씬 반죽 같은 느낌, 특히 유압식 보정틀), 오른쪽 신장(부구감 비슷하나 더 등쪽), 방광(액체 충만 자궁으로 오인)도 오인됨. 주의·인내로 철저히 검사하면 생식기와 무관함을 판정할 수 있음.</li>
<li>임신 1분기는 태아 발달이 일관돼 며칠 이내로 정확히 단계를 판정할 수 있으나 중기부터·마지막 분기로 갈수록 변동이 커짐(출생체중 25~50kg 이상으로 다양해 추정 정확도 하락). 초기엔 양막낭 크기·막 슬립 정도·자궁각 직경으로, 60일경부터 태아 크기로, 75~80일부터 태반분엽으로, 그리고 자궁동맥 진동음으로 판정함.</li>
<li>30일 양막낭 0.6~0.7cm·임신각에 실·동맥 3~4mm, 40일 양막낭 1.2~1.5cm·가는 끈, 50일 양막낭 3.5~5cm, 60일 양막낭 6~7cm(팽팽함 소실)·태아 체장 5~6cm, 70일 양쪽 각 굵은 끈(태아 생쥐 크기), 80일 태반분엽 완두콩(쥐), 90일 태반분엽 10센트 동전·비단-두정 약 3.5cm임.</li>
<li>120일 태반분엽 5센트~25센트·동측 진동음 6mm(작은 고양이), 150일 태반분엽 50센트·동측 진동음 9mm(큰 고양이), 180일 양측 진동음 10~12mm(비글), 210일 스프링어 스패니얼, 240일 도베르만, 270일 저먼 셰퍼드 크기임. 동측 진동음은 약 4개월, 양측 진동음은 약 6개월임.</li>
<li>BLV 양성우 촉진 후 공용 소매로 음성우를 반복 촉진 시 혈청전환이 입증됨. 소매에 혈액이 묻으면 교체·세척을 신중히 함. BVD PI(지속감염)우 촉진 후 같은 소매로 촉진한 후보우 8/8이 혈청전환·5두 바이러스 분리됐고 소매에 혈액이 없었음. PI 보유 고위험 무리는 추가 예방함.</li>
<li>옛 연구는 45·50일 이전 촉진의 의원성 배아 손실을 시사했으나 최근 연구(막슬립·양막낭 촉진 vs 초음파)는 임신 손실·분만율·신생아 이상에 차이를 못 봤음. 정상 관리 내 일상적 직장촉진은 조기 배아·태아 폐사에 유의하게 기여하지 않을 가능성이 큼.</li>
<li>임신·비임신의 신속·정확한 진단은 수익성이 번식 효율에 좌우되는 낙농에 결정적임. 직장촉진·초음파는 특화 훈련이 필요하고 교배 직후 발정 전에는 진단할 수 없음. 대동물 수의사 부족과 가능한 한 이른 비임신 식별 욕구가 맞물려 생화학 검사가 매력적이 됨. 임신 관련 호르몬이나 임신 특이 분자를 검출하지만 그 자체로는 임신 단계를 정밀히 추정하진 못함.</li>
<li>직장촉진은 숙련 시 수정 후 30~35일, 초음파는 25일(최대 민감도 후보우 26일·경산우 29일, 그래서 표준으로 쓰임)에 진단 가능하나 둘 다 다음 예상 발정 전 비임신 진단은 못 함. 이상적 검사는 수정 후 짧은 시간에 정확히, 비침습·저비용·우방에서 되는 사람의 hCG 임신검사 같은 것임. 그러나 소는 hCG 같은 분자를 안 만들어 대신 P4·PAG·EPF·ISG를 봄.</li>
<li>P4·PAG·EPF·ISG 분석은 임신 식별보다 비임신 검출에 더 정확함(특이도 90% 초과, 민감도는 다소 낮음). 공태로 잘못 식별된 암컷은 흔히 프로스타글란딘을 받는데 임신 암컷에 유산을 유발함(미국 젖소 임신 손실 평균 $555). 또 자연 임신 손실이 교란 요인임. 수정률은 90% 넘게 높으나 배아·태아 사망이 주 손실원이고, 최초 검사 후 확인 검사 전 손실이 위양성으로 잘못 표시돼 자료를 왜곡함.</li>
<li>P4 검사는 임신이면 황체가 P4를 계속 생성해 다음 예상 발정 시점에도 상승 유지되고 공태면 황체 퇴행으로 기저로 감소하는 것을 봄. 보통 교배 후 21~24일에 유·혈청을 RIA/ELISA로 분석함. 수정 후 21일 혈중 P4 1ng/ml 미만이면 임신일 수 없어 비임신 검출 95~100%이나, 발정 주기 길이의 개체 변동 때문에 임신 양성 진단 신뢰도는 68~97%임. 단일 시료로 신뢰하려면 교배·수정일을 알아야 함.</li>
<li>PAG는 반추가축 영양막이 모체 인식의 일부로 방출하는 단백(아스파르트산 펩티드분해효소)임. 처음 발견된 것이 임신 특이 단백 B(PSPB)로 착상 무렵 영양막 이핵세포가 생성하고 착상부터 임신 내내 모체 순환에서 검출되며 분만 후까지 지속됨. 공태·미경산 후보우 혈청엔 없어 임신 특이적이고 hCG와 달리 소변엔 안 나옴. 수정 후 24일이면 RIA로 검출되고(1986 Sasser) 수정일이 필요 없는 게 P4 대비 이점임.</li>
<li>상용 ELISA는 BioPRYN, IDEXX 소 임신 분석, DG29임. 소·후보우 모두 수정 후 28일부터 쓰고 직장초음파만큼 정확하다고 광고함. 시료(혈액·우유)를 실험실에 보내 당일 결과 또는 농장 30분 키트임. 초음파 동시 검증 시 임신 검출 정확도 89~100%임.</li>
<li>PAG 단점은 긴 반감기로 PSPB가 분만 후 80~100일까지 검출돼 분만 후 초기 교배우에서 주의해야 하고, 임신 손실 후 위양성이 가능하며, 교배 후 첫 발정 전 비임신 진단은 못 한다는 것임.</li>
<li>EPF(조기 임신 인자)는 성공 수정 후 24~48시간에 처음 검출되는 면역억제 호르몬으로 항원적으로 이질적인 임신체를 모체 거부에서 보호함. 배반포에 이른 생존 임신체만 생성하고 임신체 사망·제거 후 빠르게 소실되며 PAG와 달리 분만 후엔 검출된 적 없음. 임신 판정과 배아 사망 인지에 잠재적으로 매우 유용하나 조기 배아 폐사 빈도가 높아 양성 암컷은 후일 재검해야 함. 유일한 신뢰 검사는 로제트 억제 검사(RIT)인데 시간이 많이 들고 유지가 어려워 농장 정기 사용엔 비실용적임. 과거 ECF 측방유동 검사가 있었으나 특이도 38~51%로 공태 식별이 부정확해 단종됨.</li>
<li>소 모체 임신 인식의 주역 IFN-τ는 영양외배엽이 분비해 자궁내막에 작용하고 PGF2α pulse를 억제해 황체용해를 막음. 단 모체 말초에 농도가 너무 낮아 직접 검사가 불가함. 대신 IFN-τ가 모체 백혈구에서 상향조절하는 ISG(Mx1·Mx2·ISG15)를 봄. ISG15 mRNA는 수태 후 약 14일 발현, 17~18일 정점, 21~26일 감소임. 비임신(특히 후보우) 식별에 유망하나 단일 채혈(18일) 비임신 검출 89%이고 최대 정확도엔 연속 검사가 필요하며, 실시간 PCR이 필요해 소비자 검사가 없고 바이러스 감염 시 ISG가 활성화돼 위양성이 가능함.</li>
<li>떠오르는 바이오마커 중 순환 핵산(무세포 DNA/RNA)은 소 태아 DNA의 경태반 누출이 입증됨. 임신 30일 이후 성별 판정이 정확하고(수컷 100%·암컷 91%) 임신 20일 임신/공태 간 조성 차이가 발견돼 교배 후 20일 식별 가능성이 있음. 마이크로RNA는 유전자 발현에 관여하는 짧은 비암호화 RNA로 거의 모든 체액에 있어 최소 침습 채취에 이상적임. 임신 고유 miRNA 식별 중이고 추가 연구가 필요함.</li>
<li>생화학 검사 비교는 P4(RIA/ELISA/LA, 생산자용 있음, 유효 21~28일부터, 교배일 알아야 신뢰), PAG(RIA/ELISA, 생산자용 있음, 28일부터, 긴 반감기로 분만 후 90일 이전 교배우 왜곡), EPF(RIT, 생산자용 없음, 2~14일), ISG15(RT-PCR, 생산자용 없음, 14~26일, 신뢰 생산자 검사 없음·바이러스 감염 위양성)임. 현재 EPF·ISG15만 수정 후 첫 발정 전 개입을 가능케 하나 RIT·실시간 PCR이 필요해 실용성이 제한됨.</li>
<li>태아 프로그래밍을 한 줄로 요약하면 태아기에 어미가 겪은 환경이 그 새끼의 평생 표현형을 바꿔놓고 그 효과는 출생 후 아무리 잘 관리해도 되돌리기 어렵다는 것임. 같은 유전형이라도 노출이 배아·태아·송아지 중 언제 일어났느냐로 영향이 크게 달라지며 발달 가소성이 가장 높은 태아기가 제일 취약함.</li>
<li>저체중 송아지는 이환·폐사 위험이 높고 성장이 느리며 지방은 많고 근육은 적은 나쁜 체성분에 대사·번식 기능까지 떨어짐. 다만 출생체중이 멀쩡해도 프로그래밍 효과가 숨어 있다 나중에 드러날 수 있음.</li>
<li>소는 양과 다름. 양은 태반이 임신 첫 2/3에 다 자라고 태아 성장의 90%가 마지막 1/3에 몰리지만, 소 태반은 임신 내내 계속 커지되 태아가 태반보다 훨씬 빨리 자람. 그래서 양 연구를 소에 그대로 적용하면 안 됨.</li>
<li>총 근섬유 수는 소에서 임신 180일에 확정되고 그 뒤로는 새 근섬유가 생기지 않음. 출생 후 성장은 전부 기존 근섬유가 굵고 길어지는 것뿐임. 그러니 수율 좋은 도체를 원하면 출생 후가 아니라 자궁 안에서 승부가 남.</li>
<li>자궁에서 영양이 부족하면 대사 성향이 지질 저장 쪽으로 굳어 나중에 잘 먹여도 따라잡기 성장의 상당 부분이 근육이 아니라 지방으로 감.</li>
<li>분만 전 100일 굶기면 송아지 출생체중 7% 감소, 폐사율 10% 증가임. 단 태아 체중당 혈류 효율은 오히려 좋아지는 보상이 있음. 임신 첫 1/3 제한은 딸의 동난포 수(AFC)를 60% 낮게 만들어 딸의 평생 가임성에 영향을 줌. 임신 후기 단백 보충은 딸이 14일 일찍 사춘기에 도달함.</li>
<li>임신 후반 어미에게 멜라토닌을 보충하면 자궁동맥 혈류가 늘고 출생체중은 그대로인데 이유 체중이 늚(육우 57파운드). 태아 근육에서 위성세포 활성·근생성이 오르고 지방 생성은 줄어 강화된 근육 성향이 이유까지 이어짐. 진짜 태아 프로그래밍 효과임.</li>
</ol></div>

  `;
}

<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">수익성 기준</span></div><div class="rb-cc-b">개별 소는 분만 후 120일까지 수태가 수익성 플러스, 130~150일 넘기면 다음 분만 시 난산·주산기 질환이 증가한다.</div></div>
<div class="rb-sub">번식 성적 지표와 선순환</div>
<ul class="rb-list"><li><b class="rb-label">발정 발견율</b> 수정 대상우 대비 발정을 발견한 비율. 과거 21일 기준 평가. 못 찾으면 수정 자체 불가 → 가장 기본.</li><li><b class="rb-label">수태율</b> 수정한 소 대비 수태된 비율. &lt;20%면 수정 기술·타이밍·사양 관리 재검토.</li><li><b class="rb-label">공태 일수</b> 분만~수태 일수. 이해는 쉽지만 임신우만 반영 → 농장 전체 임신우 비율과 함께 본다.</li><li><b class="rb-label">임신율</b> 수정률 × 수태율. 실시간·실제적 지표.</li><li><b class="rb-label">VWP</b> 분만 후 수정하지 않는 자발적 대기 기간. 보통 60일(고능력우 70~80일).</li></ul>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">목표·BCS</span></div><ul><li>임신율 목표 21% = 발정 발견율 70%↑ × 수태율 30%↑</li><li>분만 후 21일 BCS 변화 → 60일 수정 수태율: 감소군 22.8% / 유지군 36.0% / 증가군 78.3%</li><li>BCS 2.5 이하로 내려가면 가임 주기 회복이 크게 늦어짐</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">선순환 만들기</span></div><div class="rb-cc-b">악순환의 고리는 이렇게 돈다 — 이전 유기에 수태가 늦으면 공태 일수가 길어지고, 유량 적은 후기·건유기가 길어져 소가 살찐다 → 과비 상태로 분만하면 분만 후 BCS가 급락하고 질병(태반정체·자궁염·유방염·제병 등)에 잘 걸린다 → 그 유기 내내 번식이 저하된다. 끊는 지점은 &quot;분만 시 과비 예방&quot;이고, 그 방법은 이전 유기에 적기 수태시켜 공태 일수를 줄이는 것이다. 연구에서 분만 후 130일 이내 수태가 다음 분만의 BCS 감소를 억제하고 번식 성적을 끌어올리는 핵심으로 꼽힌다. 즉 지금 유기의 적기 수태가 다음 유기까지 좋게 만든다.</div></div></div>
<div class="grass-section-title"><span class="gst-wrap"><span class="gst-main">${svgIcon('pause',15)} 14. 분만 후 무발정</span><span class="gst-sub">유병률·생리(LH/FSH/키스펩틴)·분류(난포동태 I~IV형·P4 프로파일)·기여요인·진단·치료(P4·GnRH·Ovsynch·eCG)</span></span></div>
<div class="rb-block"><div class="rb-sub">정의와 의의</div>
<p class="rb-p">분만 후 무발정(postpartum anestrus)은 분만 후 수 주 동안, 흔히 자발적(선택적) 대기 기간이 끝날 때까지 발정이 관찰·보고되지 않은 상태다. 분만 직후의 짧은 난소 비활성기는 정상이지만, 젖소처럼 포유시키지 않는 소에서 무발정이 연장되면 적시 임신 재성립에 부정적이다. 소의 무발정은 1920년대에 번식 문제로 처음 보고됐고, 지금도 임상수의사·농가 모두에게 난제다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">임성과 도태</span></div><div class="rb-cc-b">현대 젖소의 최적 이하 임성은 전 세계 낙농의 문제이고, 번식 실패는 흔히 도태의 일차 이유다. 한 번도 수정되지 않은 암소의 도태 위험은 최소 한 번 수정된 경우보다 10배 높았다 — 과거 이력으로 교배하지 않기로 한 관리 결정도, 무발정 자체도 이 위험을 높일 수 있어, 발정 암소를 발견해 적시에 교배하는 것이 중요하다.</div></div>
<div class="rb-sub">유병률과 함의</div>
<p class="rb-p">젖소 무발정 유병률은 무리마다 크게 다르나, 선택적 대기 기간 종료(분만 후 60~80일) 시 전형적으로 10~30%이며 개별 무리에선 최대 59%까지 보고됐다. 캐나다 23개 무리 연구(637두 유중 P4 주 2회)에서 배란을 시사하는 첫 P4 상승까지 분만 후 평균 간격은 32.0±0.7일이었다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">황체 활동 개시 누적 비율 (Herd Navigator, 748두)</span></div><ul><li>분만 후 4주: 27%</li><li>5주: 53%</li><li>6주: 68%</li><li>7주: 77%</li><li>8주: 84%</li><li>9주: 89% — 약 90%가 선택적 대기 종료 시점(9주)까지 주기 개시</li><li>단 분만 후 &#x27;초기&#x27;에 주기 개시한 암소가 첫 수정 P/AI가 더 높음</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">산차의 영향</span></div><div class="rb-cc-b">분만 후 28일 이후 황체 활동을 개시한 비율은 경산우보다 초산우에서 높았고(79.1 vs 68.6%), 비유 후기에 63일을 넘겨 무주기로 남은 비율도 초산우에서 높았다(13.1 vs 8.3%). 무발정의 가장 큰 영향은 분만~수태 간격 연장 → 분만 간격 연장이다 — 장기 무주기로 수태가 지연되는 암소는 흔히 비수익적이라 도태 후보가 된다.</div></div>
<div class="rb-sub">생리 ① 무발정으로 이어지는 내분비 사건</div>
<p class="rb-p">임신 중 순환 P4·에스트로겐이 높게 유지돼 시상하부-뇌하수체 축을 억제한다. 임신 후기 말초 P4는 황체기 중기보다 크게 높지 않으나, 순환 에스트로겐은 임신 약 60일부터 점진 증가해 분만 직전 며칠에 50~1000배 높아진다. 고농도 에스트라디올에 장기 노출되면 시상하부 GnRH 분비가 억제돼 LH 합성에 부정적이고, 뇌하수체 LH 비축분이 점진적으로 고갈된다 — LH 방출 기전 자체는 온전하나 박동성 GnRH 분비가 없는 게 문제다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">FSH와 난포파</span></div><div class="rb-cc-b">LH와 달리 임신 후기 FSH 변화는 덜 두드러진다 — 평균 FSH는 분만 전후 차이가 없으나, 며칠마다 일어나던 FSH 급증·하강이 분만 직전 마지막 몇 주간 없거나 느려져 난포파 출현도 분만 전 마지막 30일간 없다. 저용량 GnRH를 잦은 간격(1~2시간)으로 주사하면 박동성 LH를 회복시킬 수 있으나 모든 암소가 반응하진 않아, GnRH 억제가 무발정의 유일한 기전은 아닌 것으로 본다.</div></div>
<div class="rb-sub">생리 ② 주기성 재개로 이어지는 내분비 사건</div>
<p class="rb-p">분만이 다가오면 P4가 점진 감소하고 에스트로겐은 분만 직전 24시간 정점에 이른다. 순환 에스트로겐은 거의 전부 태반 기원이라 수정란 배출 후 급락해 분만 후 하루 이내 기저에 이른다. P4·에스트라디올이 사라지면 시상하부-뇌하수체 축이 억제에서 &#x27;해방&#x27;돼 GnRH 박동 발생기가 회복되고, 박동성 GnRH가 정상 FSH 양상을 회복시킨다 — 정상 FSH 급증은 분만 후 3일 이내 재개돼 난포파 출현을 유발한다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">난포 성장의 호르몬 의존성</span></div><ul><li>초기 단계: 성선자극호르몬 비의존적</li><li>4~9mm 난포 성장: FSH 지지 필요</li><li>9mm 초과 지속 성장: LH 박동 필수</li><li>분만 후 초기 LH 박동은 매우 낮음(4시간당 1회 미만) → GnRH 박동성 증가로 시간당 1~2회로</li><li>뇌하수체 LH 재축적은 3주 이상 걸릴 수 있음</li></ul></div>
<p class="rb-p">뇌하수체 LH 비축분이 보충되면 정상 LH 박동성이 회복돼 더 많은 에스트라디올을 만드는 우성 난포가 성장·확립된다. 우성 난포의 높은 에스트라디올이 LH 급증을 유발해 첫 배란이 일어난다. 첫 배란이 주기성 재개를 알리지만, 모든 암소가 첫 배란 후 정상 주기를 재개하진 않고 일부는 무발정으로 돌아갈 수 있다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">키스펩틴</span></div><div class="rb-cc-b">분만 후 초기에 외인성 GnRH·에스트라디올을 줘도 LH 비축분 부족으로 방출이 줄고 생물활성도 낮다. 키스펩틴(kisspeptin)은 시상하부에서 GnRH 합성을 통제하고 LH 방출에 영향을 주는 신경내분비 조절자로, 무발정 암양에서 배란을 유도했고 GnRH·LH 반응이 주기 암양보다 컸다. 소의 분만 후 무발정 종료에서의 직접 역할은 거의 알려지지 않았으나, 임신 유발 무발정 후 주기성 재개에 핵심 역할을 시사하는 증거가 있다. (첫 우성 난포의 운명: ① 배란→CL 형성, ② 무배란→낭종성 난포, ③ 퇴행→새 우성 난포로 교체.)</div></div>
<div class="rb-sub">분류 ① 난포 동태 (I~IV형)</div>
<p class="rb-p">출현(~4mm)·편차(deviation, ~9mm)·배란(10~20mm)의 세 직경에 근거해 무배란 상태를 I~IV형으로 분류한다(Peter 등).</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">무발정 I~IV형</span></div><ul><li>I형: 난포가 출현까지 자라나 편차 없음(우성 선택 안 됨) — 극심한 영양실조 추정, &#x27;비활성/매끈한 난소&#x27;(이스라엘 7751비유에서 8.5%). 잘 사양된 북미 젖소엔 드묾</li><li>II형: 편차·성장 후 우성 난포가 퇴행 → 2~3일 후 새 난포파(최대 9차례 보고). 결국 첫 배란 전 난포파가 순차 출현</li><li>III형: 우성 난포가 배란 실패 → 무배란 난포로 머물거나 낭종성 난포로 발달(낭종은 H-P축 되먹임 교란이 있어 무배란 난포와 구별; LH 박동·진폭·평균 농도·에스트라디올 모두 높음)</li><li>IV형: 배란해 CL 형성하나 적시 황체용해가 없어 황체기 연장(황체 잔존) — 황체용해 시점에 에스트로겐성 우성 난포가 없는 비정상 난포 양상이 원인</li></ul></div>
<div class="rb-sub">분류 ② 프로게스테론 프로파일</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">P4 프로파일 분류 (Opsomer, 334두)</span></div><ul><li>정상 51%: 분만 후 50일 이전 첫 P4 상승·규칙적 주기</li><li>주기성 지연 21.5%: 분만 후 첫 50일 무발정, 일관되게 낮은 P4</li><li>황체기 연장 21.5%: 선행 수정 없이 P4가 20일 초과 상승 유지</li><li>주기 중단 4%: 정상 주기가 최소 14일 낮은 P4로 중단</li><li>짧은 황체기 0.5% / 불규칙 1.5%</li></ul></div>
<div class="rb-sub">기여 요인 ① 생리·산차·산유</div>
<p class="rb-p">무발정 원인은 흔히 다요인적이고 생리·영양·관리·환경·병리로 분류된다. 수많은 요인 중 &#x27;포유&#x27;와 &#x27;영양(음에너지 균형)&#x27;이 가장 중요하다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">포유·산차·산유</span></div><div class="rb-cc-b">포유는 박동성 LH 분비를 억제해 배란을 지연시킨다 — 육우 무발정의 주요 요인이나 젖소는 출생 직후 분리해 일반적으로 원인으로 보지 않는다(단 실험적으로 포유 젖소는 첫 발정까지 5~9주 길었고 LH 박동 빈도 60%·진폭 40% 감소). 산차: 초산우는 첫 배란 지연으로, 4산 이상 경산우는 황체기 연장(자궁 복구 지연→자궁축농증·황체 잔존)으로 위험↑. 산유량: 고산유를 위험으로 본 연구도, 아닌 연구도 — 고산유 자체보다 음에너지 균형이 유력(305일 산유 5000~9500kg에서 100kg↑마다 무배란 2%↓, 9500 초과는 무변화).</div></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">사회적·화학적 신호·품종</span></div><div class="rb-cc-b">육우에서 수소 존재는 분만~주기 재개 간격을 유의하게 줄이고, 분만 후 초기 수소 노출은 무발정 젖소 LH 방출에 급성 효과가 있었다. 발정 암소나 그 자궁경 점액 노출도 특히 무발정이 연장된 암소에서 무발정 기간을 단축할 수 있다. 분만~황체 활동 개시 간격에 품종·유형(유전) 차이도 보고됐다.</div></div>
<div class="rb-sub">기여 요인 ② 영양·음에너지 균형</div>
<p class="rb-p">음에너지 균형(NEB)을 부르는 부족한 건물(에너지) 섭취가 젖소 무발정의 중요 요인이다. 분만 직후 산유 요구로 에너지 수요가 급증해 암소를 이화대사로 내모는데, 반추위 물리적 충만이 분만 후 초기 최대 건물 섭취를 제한한다. 게다가 고산유로 선발된 암소(북미 홀스타인)는 가용 영양을 체형을 희생하며 산유에 선택적으로 쓴다 — 가용 포도당이 모두 우유 합성에 우선 쓰여 이화 상태에서 못 벗어난다. 그 결과 분만 후 10~12주까지 NEB가 이어진다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">NEB의 내분비 사슬</span></div><div class="rb-cc-b">NEB 젖소는 인슐린·IGF-1이 낮다. 낮은 IGF-1 → GH 음성 되먹임 감소 → GH↑ → 간 포도당신생합성↑·지방분해↑(NEFA 방출). 높은 GH·NEFA는 인슐린 작용을 길항해 인슐린 저항을 만들어 비유방 조직 포도당 이용을 줄이고 우유용 포도당을 보존한다. NEB는 LH 박동 빈도 감소 + 낮은 혈당·인슐린·IGF-1을 통해 우성 난포의 에스트로겐 생성을 제한 → LH 급증에 필요한 에스트로겐을 줄여 배란을 지연시킨다.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">건물 섭취를 줄이는 간접 원인</span></div><ul><li>높은 사육 밀도(사료 경쟁↑)</li><li>자주 일어나 먹기 꺼리게 하는 부실한 칸막이 설계</li><li>지속적 사료 접근을 막는 물리적 장벽</li><li>드문 사료 밀어주기</li><li>먼저 도달한 암소의 과도한 선별</li><li>부실한 발굽 관리로 인한 높은 파행 유병률</li></ul></div>
<div class="rb-sub">기여 요인 ③ 관리·환경·병리</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">관리·환경 요인</span></div><ul><li>이전 건유 기간: 77일보다 길면 무발정·배란 지연 위험 거의 3배(건유 없이 사양 시 분만~첫 배란 13.2일 vs 56일 건유 31.9일)</li><li>착유 빈도: 2→3·4회로 늘리면 첫 배란까지 1주 미만 길어짐(사소한 요인)</li><li>발정 발견 효율: 부실하면 미관찰 발정으로 무발정 악화</li><li>사료·급이 관리: 부족한 건물 섭취가 NEB 진입의 주요 이유 — 입자 크기·급이 빈도·그룹화·사료대 관리·과밀 회피</li><li>분만 계절: 겨울 분만이 여름보다 주기 재개 지연(광주기 역할)</li><li>날씨: 고온다습은 발정 발현↓ → 미약·무징후발정</li><li>사회 서열·밀도: 하위 암소가 선별 후 부실 사료 → NEB↑</li><li>수용 유형: 집약·계류식이 무발정 위험↑(활동 변화 못 나타냄)</li><li>누설 전류: 사료 섭취 저해</li></ul></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">병리적 요인</span></div><ul><li>자궁 염증: 급성 자궁염·세균 오염은 주기 재개 지연(PMN 높으면 첫 배란 45 vs 32일)</li><li>황체 잔존: 자궁 감염 시 황체기 연장으로 무발정 위험↑(감염 없어도 30일 초과 연장 보고)</li><li>낭종성 난포(COF): 흔히 무발정·무배란, LH 박동성 증가</li><li>분만 장애(난산·쌍태·후산정체), 대사 장애(케토시스·4위전위), 파행, 유방염</li><li>폐렴: 분만 후 첫 달 발생 시 난소 활동 재개 지연 위험 5.4배</li><li>파행+유방염, 파행+심한 스트레스 동반 시 위험 훨씬 큼</li></ul></div>
<div class="rb-sub">미관찰 발정과 임신 배제</div>
<p class="rb-p">미관찰 발정은 흔히 무발정의 주요 기여 요인이다 — 무발정으로 간주된 많은 암소가 사실은 정상 주기를 돌면서도 발정으로 관찰·보고되지 않는다. 두 범주: &#x27;미약발정(subestrus)&#x27;은 발정 행동이 부실해(짧고 약함) 놓치는 경우, &#x27;무징후발정(silent estrus)&#x27;은 뚜렷한 징후를 전혀 안 보이는 경우다. 둘 다 자발 배란·CL 형성이 가능하나 관찰 안 돼 무발정으로 잘못 분류된다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">첫 배란은 조용하다</span></div><div class="rb-cc-b">분만 후 첫 배란은 뚜렷한 발정이 선행하는 경우가 드물어 젖소의 단 10~13%만 첫 배란 전 승가허용 발정을 보인다 — 이 비율은 둘째·셋째 주기에서 유의하게 증가하고, 저생산 암소에서 첫 배란 시 발견 비율이 더 높다. 하루 3~4회 전담 관찰 + 이차 징후(턱 얹기·외음부 냄새·핥기·뒤따르기·부분 승가)를 보면 발견 확률이 오른다. &#x27;미관찰 발정으로 인한 무발정&#x27;과 &#x27;진성 무발정&#x27;을 구별하는 것이 매우 중요하다.</div></div>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">임신을 먼저 배제</span></div><div class="rb-cc-b">암소가 무발정인 일차적 생리 이유는 임신에 의한 주기성 중단이다. 교배 기록 갱신 시 숫자 전위 같은 입력 오류로 수정우를 미수정으로 잘못 식별해 &#x27;깜짝 임신&#x27;으로 인한 무발정이 가끔 생긴다 — 번식 검사 시 항상 임신을 먼저 배제한다.</div></div>
<div class="rb-sub">진단과 무리 관리 전략</div>
<p class="rb-p">관리 방안을 짜기 전에 무리 수준 유병률을 평가한다. 무발정 육우는 치료하면 정상 임성으로 회복할 수 있으나, 무발정 젖소는 동반된 NEB 때문에 훨씬 낮은 임성을 보인다 — 첫 수정 전에 양에너지 균형으로 되돌리도록 모든 노력을 기울인다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">진단·영향 최소화 전략</span></div><ul><li>BCS 평가: 클로즈업 건유우(&gt;3.5는 대사장애·무발정 고위험)·신선우·교배군 주목. 비유 60일 넘긴 부실 체형(&lt;3.0) 과다도 문제 → 역치 도달까지 교배 보류. 급성 체형 손실이 절대 BCS보다 임성에 더 해로움</li><li>보행 점수: 파행 조기 식별, 정기 발굽 손질·족욕(파행 암소는 사료 접근 동기 약화 → NEB)</li><li>발정 발견 개선: 미근부 분필/페인트(3색으로 신선우·대기종료·기수정 구분), 대기 종료 30~40일 전 칠하고 매일 기록·주 1회 갱신</li><li>초음파: 분만 후 5~6주 검사가 P/AI 저하 위험 식별에 가치(7~14일 간격 2회 연속이 이상적, TAI 개시 시 1회로도 가능)</li><li>유중 P4 모니터링: Herd Navigator가 발정의 95%+ 검출(무징후 포함), 임신·낭종 발견에도 유용(단 DeLaval 전용·고가)</li><li>혈중 대사물: NEFA·BHBA(분만 첫 주 잠재성 케토시스)·낮은 혈당·IGF-1으로 조기 식별</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">무리 전체 접근</span></div><div class="rb-cc-b">개별 사례 관리도 의미 있으나 무리 전체 접근이 흔히 더 유익하다 — 칸막이 편안함·설계 평가를 위해 소를 방해하지 않고 축사를 둘러보고, 번식 관리 관행을 파악하며 발정 발견·AI 인력과 정기 대화한다. 전자 발정 발견 시스템은 위양성(정액·노동 낭비)·위음성(놓친 교배)을 최소화하도록 무리에 맞게 최적화하고, 특히 새로 설치된 무리에서 전적 의존은 지양한다.</div></div>
<div class="rb-sub">치료 ① 영양적 개입</div>
<p class="rb-p">영양-번식 상호작용은 복잡해 특정 영양소의 난소 효과를 정확히 연구하기 어렵다. 클로즈업 건유기의 과도한 에너지 섭취는 분만 직전 건물 섭취 감소·높은 NEFA에 취약하게 하므로 클로즈업 건유우 사료 섭취 모니터링이 중요하다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">무발정을 줄이는 영양 개입</span></div><ul><li>분만 후 고전분 사료 / 모노프로필렌글리콜 매일 경구</li><li>분만 전 전분 / 리놀레산·리놀렌산 풍부 유지종자 → 첫 배란까지 간격 단축</li><li>건유기 에너지 제한(요구량 80%)이 160% 급여보다 분만 후 NEFA↓·건물 섭취↑</li><li>단 결과는 가변적이고 상업 환경에서 항상 실용·경제적이진 않음</li></ul></div>
<div class="rb-sub">치료 ② 프로게스테론·에스트라디올</div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">프로게스테론(IVPD)</span></div><div class="rb-cc-b">분만 후 짧은 고프로게스테론 노출은 발정 발현·정상 황체 기능 확립에 중요하다. 무발정 암소를 P4로 치료하면 배란 전 난포의 LH 박동·에스트라디올·LH 수용체가 증가한다. 요법: 질내 P4 기구(IVPD) 7~9일 삽입→제거→발정 시 수정. PRID(P4 1.55g) 7일 후 71%에서 주기 유도(대조 40%). 무리 치료엔 미약·미관찰 발정의 황체용해 보장 위해 제거 시 PGF2α 병용 권장. 미국 IVPD: CIDR 1380(1.38g)·PRID-Delta(1.55g), 우유 휴약 없음. (경구 프로게스타겐 MGA는 도축용 육우 후보우 외 미승인.)</div></div>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">에스트라디올</span></div><div class="rb-cc-b">에스트라디올 단독은 배란 반응이 가변적이라 권장 안 됨. P4 사전 노출이 없으면 발정·배란을 유도해도 황체기가 짧다. 7일 P4 후 에스트라디올 유도법(CIDR 6일→제거 24시간 후 EB 1mg → 87% 발정·P/AI 42%)은 뉴질랜드에서 널리 쓰였으나, 미국엔 소 승인 주사용 에스트라디올 제제가 없다. 식용동물 에스트로겐 우려를 감안하면 대안 제품이 현명하다.</div></div>
<div class="rb-sub">치료 ③ GnRH·Ovsynch</div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">GnRH 단독</span></div><div class="rb-cc-b">외인성 GnRH는 분만 후 첫 주에도 LH 방출을 유도하나 반응은 둘째 주에 유의하게 높다. 우성·LH 반응성 난포가 있고 그 난포가 P4에 노출 안 됐다면 배란 확률이 높다(분만 둘째 주 GnRH 100μg에 5두 중 4두 배란). 단 P4 사전 노출 없는 무발정 암소의 배란 유도는 짧은 황체기를 초래해 무발정 회귀를 높일 수 있다 — 한 연구에서 108두 중 93두(86%)가 배란했으나 그중 20%가 무발정으로 회귀. GnRH 단독의 단점이다.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">Ovsynch/TAI — 무발정 P/AI (표 34.2)</span></div><ul><li>GnRH+PGF2α 병용 TAI는 무발정 관리에 효과적, P/AI는 주기 대조보다 낮으나 수용 가능</li><li>Moreira: 무발정 18.2%(24) vs 주기 39.0%(303)</li><li>Stevenson: 24.1%(116) vs 38.0%(799)</li><li>Öztürk: 23.1%(26) vs 32.8%(58)</li><li>첫 GnRH에 반응해 배란한 무발정 암소 P/AI는 배란 실패보다 크게 높음(46 vs 6%) → 초음파로 첫 GnRH 배란 반응 판정이 가치</li><li>돼지 LH로 둘째 GnRH 대체 시 P/AI 14%p↑(42 vs 28%), 첫 GnRH 대체 시 배란 반응↑(62 vs 44%)</li><li>더블-Ovsynch가 무주기 배란 유도에 매우 효과적 — 특히 초산우 P/AI 개선</li></ul></div>
<div class="rb-sub">치료 ④ P4 병용·eCG·교배 후</div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">Ovsynch + IVPD (표 34.3)</span></div><ul><li>Ovsynch 첫 7일 IVPD 삽입 무발정 암소는 IVPD 없는 무발정보다 P/AI↑, IVPD 없는 주기 암소와 비슷</li><li>Stevenson: 무발정 IVPD없음 24.1% vs IVPD있음 32.3%</li><li>McDougall: 33.9% vs 45.7%</li><li>Colazo: 21.8% vs 34.6%</li><li>뉴질랜드 현장(12무리 1662두): Ovsynch+IVPD가 가장 비용 효율적, 두당 NZ$80.40 최고 순이익</li><li>메타분석(21연구 13,762두): CL 없는 암소에 P4 보충 시 32일 P/AI 14%↑·60일 16%↑</li></ul></div>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">eCG·낭종·교배 후</span></div><div class="rb-cc-b">eCG: 프로게스테론 기반 프로토콜에 추가 시 유익 — GnRH+6~7일 IVPD 후 제거 시 PGF2α+eCG 400IU로 첫 수정 P/AI 5.4%p↑(36.0 vs 30.6%). eCG는 우성·배란 전 난포 발달·배란율을 개선해 CL 질·배아 생존에 긍정적. 낭종성 난포: Ovsynch/TAI가 성공적으로 쓰였으나 P4 기구를 더해도 임신은 개선 안 됨(표 34.4 — 첫 GnRH 후 새 난포 발달 93~100%, TAI 32일 임신 약 41%). 교배 후: AI 4.5일 후 7일 PRID는 임신 손실 감소 경향(5.6 vs 33.3%), TAI 5일 후 GnRH는 P/AI↑(45.5 vs 31.1%).</div></div>
<p class="rb-p">정상체온(&lt;39.1℃) 무발정 암소는 AI 전 PGF 보충 시 P/AI가 고체온(&gt;39.1℃)보다 높았다(38.8 vs 13.3%) — 보충 PGF로 LH 급증 지속·배란 전 난포 크기·난포내 에스트라디올이 더 컸다.</p>
<div class="rb-sub">요약</div>
<p class="rb-p">젖소 분만 후 무발정의 기저 원인은 흔히 다요인적이나 음에너지 균형이 주요 기여 요인이다. 번식 성공을 극대화하려면 무발정 고위험 암소를 조기 식별해 건물 섭취 증가로 관리하고, 발정 발견 효율을 개선해 미관찰 발정으로 인한 무발정을 줄이며, 초음파로 난소 상태를 평가한다. 치료를 택하면 프로게스테론 기반 Ovsynch, P4 기반 전동기화 후 Ovsynch/TAI, 또는 더블-Ovsynch/TAI가 권장되고, P4·GnRH를 쓴 AI 후 치료도 P/AI를 높인다. 무발정 암소를 TAI 프로그램에 넣어 치료하는 것이 무처리에 대한 비용 효율적 대안이다.</p></div>
  `;
}
function husbandryContentHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 번식 사양·육성관리 — 후보우 육성·영양·생애주기</div>
<div class="grass-section-title"><span class="gst-wrap"><span class="gst-main">${svgIcon('star',15)} 17. 사춘기와 후보우 관리</span><span class="gst-sub">사춘기 기전·연령 결정 요인·교배 타이밍·생식기 점수(RTS)</span></span></div>
<div class="rb-block"><div class="rb-sub">사춘기의 정의와 기전</div>
<p class="rb-p">사춘기는 미경산우가 스스로 새끼를 밸 수 있게 되는 때다. 임상적으로는 첫 발정이 눈에 띄기 전에 이미 P4가 올라오기 시작하므로, 혈청 P4가 처음 1ng/ml를 넘는 날을 사춘기로 잡는다.</p>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">사춘기 ≠ 첫 배란</span></div><div class="rb-cc-b">대부분의 미경산우는 사춘기 전후에 겉으로 발정 징후 없이 배란하는 무발정 배란을 한 번 거치고, 그때 생긴 황체도 정상보다 짧게 가다 사라진다. &quot;발정을 안 보였으니 미성숙&quot;이라 단정하면 틀린다.</div></div>
<p class="rb-p">기전의 핵심은 음성 되먹임 민감도다. 어린 미경산우의 시상하부–뇌하수체는 E2 음성 되먹임에 지나치게 민감해 LH가 눌려 있다 — 배란 능력 자체는 일찍부터 있지만(생식선자극호르몬을 주사하면 1개월령에도 배란 유도 가능) 자발적으로는 못 한다. 사춘기가 가까워지며 이 민감도가 떨어지면 LH 펄스가 잦아지고(첫 배란 무렵 시간당 약 1회), 잦아진 LH가 난포를 성숙시켜 거기서 나온 E2가 거꾸로 GnRH 발생기를 가속해 배란성 LH 급증을 터뜨린다.</p>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">프로게스테론의 예비점화</span></div><div class="rb-cc-b">첫 배란 후 황체가 짧게 끝나는 것은 내막 옥시토신 수용체가 많아 PGF2α가 일찍 터지기 때문이며, P4에 12~14일 노출돼야 수용체가 하향 조절된다. 그리고 사춘기 직전 약하게 한두 번 오르는 P4가 시상하부를 E2 양성 되먹임에 길들여 이후 정상 주기를 확립한다 — 프로게스틴 처치가 사춘기를 앞당기고 동기화 수태율을 올리는 근거다. 성성숙한 소에서도 P4가 쭉 낮아 이 예비점화가 빠지면 같은 일이 벌어진다 — E2가 있어도 서지가 안 터지는 난포낭종이며(번식 생리 3장), 그 치료에 P4 제제를 쓰는 것도 빠진 예비점화를 채워주는 것이다.</div></div>
<div class="rb-sub">사춘기 연령을 좌우하는 것</div>
<p class="rb-p">사춘기는 보통 9~10개월이지만 6~24개월까지 폭이 넓고, 핵심 원리는 연령보다 체중의 영향을 더 받는다는 것이다. 잘 먹여 빨리 키운 미경산우는 더 어린 나이에 도달하고, 같은 골격이면 더 무거운 쪽이 더 일찍 온다. 품종 효과는 이를 압도해, 성숙 체격이 큰 품종일수록 사춘기가 늦고 더 무겁다.</p>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">영양·신호</span></div><ul><li>증체 예: 100kg부터 하루 1.1/0.8/0.5kg → 사춘기 9/11/16개월</li><li>영양–사춘기를 잇는 신호: 렙틴(체지방 역치)·키스펩틴</li><li>4~9개월령이 신경내분비 축을 프로그래밍하는 결정적 창</li></ul></div>
<ul class="rb-list"><li><b class="rb-label">어미·태아 영양</b> 처녀우(어린 어미)의 딸은 1년령 동난포 수가 적다(난소 비축 작음) → 성숙한 어미의 딸을 후보로. 임신 후기 단백 보충 어미의 딸은 14일 일찍 사춘기.</li><li><b class="rb-label">기질·수소 노출</b> 예민한(보정틀에서 빨리 튀는) 보스 인디쿠스는 코르티솔↑로 사춘기 늦음. 수소 노출은 소에선 사춘기를 앞당기지 않음(양·염소·돼지와 다름).</li></ul>
<div class="rb-sub">교배 타이밍과 사춘기 앞당기기</div>
<div class="rb-caution"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="rb-tag">주의</span><span class="rb-tt">첫 발정에 바로 교배 금지</span></div><div class="rb-cc-b">사춘기 첫 발정에 수태시키면 분만율이 3차 발정 교배보다 21% 낮다. 미경산우는 교배 예정 시점보다 1~3개월 앞서 사춘기에 도달해 있어야 한다. 또 3차 발정 교배는 첫 발정 교배보다 초회 수태율이 21~36% 높으므로, 목표체중에 시즌 시작 최소 3주 전 도달시켜 미리 주기를 돌게 한다.</div></div>
<div class="rb-key"><div class="rb-key-t"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="rb-tag">요약</span><span class="rb-tt">체중 목표</span></div><ul><li>사춘기 때 성숙 체중의 55~60%</li><li>교배 목표 ≈ 성숙 체중의 65% (품종마다 다름)</li><li>목표체중까지 ADG 0.5~0.8 kg/일 — 영국종 기준 총 약 91 kg 증체</li><li>2년령 분만이 3년령보다 생애 송아지 수↑ → 이득</li><li>실제론 56%까지만 키워도 65%와 최종 임신율·분만율 차이 없다는 연구도(사료비 두당 $22~45 절감). 단 50% 아래면 후반 수태·경량 송아지 위험</li></ul></div>
<ul class="rb-list"><li><b class="rb-label">광주기</b> 겨울은 사춘기를 늦추고, 멜라토닌·일장 연장은 앞당긴다</li><li><b class="rb-label">프로게스틴</b> MGA 8일 또는 CIDR — 예비점화를 가속하며, 조기 황체퇴행에 취약한 사춘기 전후 미경산우 동기화에 유효</li><li><b class="rb-label">영양</b> 조기 이유 + 고농후사료로 300일령 이전 조숙성 유도 가능</li><li><b class="rb-label">이오노포어</b> 모넨신 약 200 mg/일 — 사료효율·증체를 높이고 사춘기를 앞당긴다</li></ul>
<div class="rb-sub">생식기 점수(RTS)로 사춘기 가늠</div>
<p class="rb-p">직장검사로 난소 난포 발달과 자궁각 긴장도·크기를 보고 1~5로 매기는 주관적 지표다. 점수가 높을수록 인공수정 수태율과 양의 상관을 보인다.</p>
<ul class="rb-list"><li><b class="rb-label">RTS 1</b> 긴장도 없는 작은 자궁각 + 구조물 없는 작은 난소(유아형). 사춘기에서 가장 멀다.</li><li><b class="rb-label">RTS 2</b> 자궁각·난소가 더 커진 단계.</li><li><b class="rb-label">RTS 3</b> 자궁 긴장도와 난포가 만져져 주기 직전.</li><li><b class="rb-label">RTS 4</b> 자궁각이 꼬이고 배란전 크기 난포 존재(주기 도는 것으로 보되 황체는 잘 구별 안 됨).</li><li><b class="rb-label">RTS 5</b> 거기에 황체까지 만져지는 단계.</li></ul>
<div class="rb-clinical"><div class="rb-cc-h"><svg class="rb-bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6M6 9v4a6 6 0 0 0 12 0V9"/><path d="M6 9H4M18 9h2"/><circle cx="12" cy="19" r="2"/></svg><span class="rb-tag">임상</span><span class="rb-tt">난포 수 계측(AFC)</span></div><div class="rb-cc-b">RTS를 보완하는 선발 도구. 초음파로 양쪽 난소의 동난포를 합산하면 난소 비축(원시난포 수)을 반영하며, 유전·크기·나이·발정 단계가 달라도 재현성이 높다. AFC가 낮은 개체(총 &lt;15)는 작은 난소·낮은 임신율을 보였고(높은 군 &gt;25 대비), 리피트 브리더 소도 동난포가 적다 — 번식 전 가임성·수명 예측에 활용한다.</div></div></div>
