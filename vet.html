function reproUsHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('search',16)} 초음파검사 — 난포·황체 크기 기준·주기별 소견·아티팩트</div>
<div class="rb-block"><ol class="rb-list">
<li>직장촉진처럼 프로브 삽입 전 자궁을 끌어올려 두는 게 가장 완전한 검사에 유리함.</li>
<li>주파수 선택. 3MHz는 0~20cm(후기 임신·산후 자궁), 5MHz는 0~12cm(통상 임신감정·성감별), 7.5MHz는 0~7cm(난포·황체·조기 임신). 초점거리는 3.5/5.0/7.5MHz에서 7.0/3.5/2.0cm이고 그 약 2배 깊이까지 양질 영상임. 게인은 전체·근·원거리 셋을 따로 맞추고, 초점점은 관심 깊이나 그보다 약간 아래에 둠.</li>
<li>체계적 스캔. 한쪽 난소 → 그쪽 자궁각 끝 → 각 전체 → 자궁체 → 반대쪽 각 → 반대 난소 순으로 매번 같은 순서로 보고, 경관·질은 프로브를 빼면서 봄. 단면 각도보다 전체를 다 봤는지가 중요하고, 애매하면 처음부터 한 번 더 훑음.</li>
<li>화질 원칙. 프로브 면에서 8cm 넘는 대상은 세부가 흐려지므로 대상이 화면 위쪽에 오게 프로브를 붙임. 영상은 약 2mm 두께 단면이라 대상이 화면에서 사라질 때까지 양방향으로 훑어야 함(성감별에서 생식결절을 놓치는 주원인). 난소 같은 작은 구조는 프로브를 옮기지 말고 제자리에서 좌우로 흔들어 봄.</li>
<li>흔한 오류. 분변·가스·손가락 간섭(조기 임신감정·성감별은 삽입 전 분변 제거), 불완전 스캔(어린 소는 자궁각 끝이 경관 옆이나 아래, 노령우는 복강 깊이 뻗음), 게인·초점 설정 오류, 모니터 차광 부족(실외는 흐린 날도 가림). 비닐 슬리브는 안쪽에도 젤을 넣어야 가스 반향이 안 생김.</li>
<li>난소 찾기와 혈관 구별. 난소는 정중선에서 약 10cm 외측, 골반연 또는 자궁 분기부에서 약 5cm 앞. 안 잡히면 광인대 앞 가장자리를 손끝으로 잡아 찾음. 혈관 횡단면은 소난포와 똑같이 보이므로 프로브를 돌려 종단면으로 가면 혈관은 길어지고 난포는 작아지다 사라짐. 큰 혈관은 난소 문에 2~5mm 2~3개로 들어오고 황체 주위에 많음.</li>
<li>배란 예측 한계. 8mm 넘는 난포는 주기 첫 며칠 빼면 항상 있으므로 가장 큰 난포 크기만으로 배란 시기를 예측하면 틀림. 자궁벽 에코·자궁 긴장·내강 분비물·경관 점액·행동을 함께 봄. 배란 전 우성 난포 내경은 평균 13mm(11~16mm).</li>
<li class="grp">초음파 기준으로 배란 가능성 높은 우성 난포는 13~16mm(최소 10mm)임. 17mm 이상은 과성숙이라 난자 노화·신선도 저하임.</li>
<li>정상적으로 자라는 난포는 난포강이 검고 균일하며 벽이 약간 두껍고 안쪽이 매끄러움. 퇴행 중인 폐쇄 난포는 강이 일그러지고 벽 안쪽이 거칠고 두께가 불균일하며 벽이 더 흼. 단 배란 6시간 전 난포도 강이 일그러지고 벽이 두꺼워지며 거칠어지는데, 폐쇄 난포와는 벽이 두껍다는 점으로 구별함. 배란 직전 난포강 안 에코성 입자는 떨어진 과립층 세포라 이상이 아님.</li>
<li>임신을 떠받칠 황체는 15~25mm가 이상적이고 20~25mm가 가장 좋음. 15mm 미만은 부적합임. 공동성 황체는 공동이 18mm 이하이거나 전체 면적의 40% 미만이면 정상임.</li>
<li>위 황체 크기는 임신 유지 기준임. 발정우를 수정할지 볼 때는 반대로 황체가 20mm 미만으로 작아야 퇴행 중이라 수정 가능으로 보고, 크고 탱탱하면 아직 황체기라 수정하지 않음. 같은 황체 크기가 상황에 따라 반대로 읽히니 혼동하면 안 됨.</li>
<li class="grp">기능성 황체는 20mm 이상(흑모화종 18mm 이상)이고 혈류가 풍부해 난소 실질보다 검은빛이 강한 회색의 균일한 구조물임. 퇴행 황체는 20mm 미만, 백색(고에코)이 강해지고 실질과 경계가 불분명하며 거칠고 불균일함. 색조를 보면 20mm 미만 발육 중 황체도 회색이 강하면 기능성으로 볼 수 있음.</li>
<li>주기 17일 전후 황체가 일시적으로 검어지는 건 퇴행 개시에 따른 일시적 혈류 증가임(16~18일 흑색화). 1일 내 사라지고 3~4일 뒤 발정이 옴.</li>
<li>공동성 황체(hollow CL) 내강은 5~30mm까지 다양하고 P4가 오히려 높다는 보고가 있음. 내강에 고에코 그물망 구조가 보이면 벽이 얇아도 공동성 황체로 판단함(천자하면 혈장 양상 액체와 응고혈). 난포낭종·황체낭종 강 안은 균일 무에코임. 내강의 계란 프라이 모양 고에코 원형 구조물은 응고혈로 무해하고 OPU 천자 부위에도 생김.</li>
<li>자궁 횡단면은 혈관층 무에코 라인을 경계로 안쪽 자궁내막·바깥 자궁근층의 이중원이고 정상이면 내강이 안 보임. 자궁내막 위 고휘도 선상 에코(에코제닉 라인)는 염증을 시사함. 종단상에서 라인이 없거나 내막 길이의 50% 미만이면 정상에 가깝고, 50% 이상이면 자궁내막염일 가능성이 높음(생리식염수 50ml 관류액에 농·응고혈이 나옴). 무에코 저류는 점액, 에코제닉 저류는 다량 농임. 라인이 미비하거나 휘도가 약하면 이상이 없을 수 있음.</li>
<li class="grp">난포기엔 자궁각 만곡이 심해져 한 화면에 자궁각 단면이 여러 개 잡히고, 발정 전후엔 근층·내막 에코 차로 벽이 층으로 구분되며 혈관층(검은 소혈관)이 뚜렷하고 자궁내막 주름도 보임.</li>
<li class="grp">전발정기는 혈류 증가로 자궁 에코가 더 얼룩덜룩해지고, 배란 3일 전부터 무에코 점액이 축적되며, 큰 난포(16~20mm)가 있고, 황체는 보이나 작아짐.</li>
<li>발정기는 자궁 에코가 가장 얼룩덜룩하고 자궁강에 무에코 점액(경면반사 흔함)이 있음. 자궁내막이 정상의 약 2.5배(휴지기 6.9mm→발정기 9.4mm)이고 승가허용 종료 약 12시간 후 배란임.</li>
<li>후발정기는 새 난포파의 8mm 미만 작은 난포들이 보이고, 1~2일엔 작은 난포만, 2~3일에 무에코 공동이 있고 에코가 고르지 않은 작은 황체가 출현함.</li>
<li>발정휴지기는 자궁이 균질·중간 회색·액체 거의 없음, 황체는 균질하나 약 80%가 어느 단계엔 공동(맑은 액체나 응고혈)을 가짐, 2~20mm 난포임.</li>
<li>수정 후 26일 요막강이 1.0cm쯤 보이고 0.5cm 태아가 벽에 붙어 있어 심박으로 확인함. 35~40일에 머리 방향·양막 구별과 작은 자궁소구가 보이기 시작하고, 60~65일엔 자궁소구 크기로도 태령을 추정할 수 있음.</li>
<li>태아막 초음파상. 양막은 태아 주변 검은 액체, 요막은 양막 다음 검은 공간, 융모막은 밝은 선, 소구(카룬클)는 자궁벽의 하얀 단추, 태반분엽(플라센톰)은 융모엽(코틸레돈)과 소구가 붙은 밝은 단추로 태아 쪽으로 융기함.</li>
<li class="grp">아티팩트를 정상·병리로 오진하지 않으려면 알아둬야 함. Reflection·refraction shadowing은 액체가 빔을 반사·굴절해 액체 구조 측면 가장자리 아래가 안 보이는 것임.</li>
<li>Beam width artifact는 한 빔이 같은 깊이 두 조직을 지나 측벽이 실제보다 밝게 보이는 것임. 난포 가장자리가 황체로 오인될 수 있음.</li>
<li>Reverberation은 두 강한 경계면(직장벽/변환기 ↔ 가스/뼈) 사이 반복 반향임. 등간격으로 작아지는 평행선이고 기질증(질 내 공기)에서 보임.</li>
<li>Specular reflection(경면반사)은 밀도 다른 두 면이 정렬할 때 생기는 가는 밝은 수평선임. 액체-치밀 조직 경계에서 생김.</li>
<li>Mirror image는 reverberation의 일종으로 골반골 아래 거짓 쌍태를 만듦. 하나를 둘로 오인 주의임.</li>
<li>Acoustic shadowing은 뼈의 감옥 창살이고 분변도 어두운 저화질을 만듦.</li>
<li>Enhancement는 액체가 빔을 거의 깎아먹지 않아 그 뒤 조직이 실제보다 밝게 보이는 것임. 게인 조정으로 줄임.</li>
<li>Crystal defect는 변환기 면에서 수직으로 뻗는 검은 선임. 깨진 크리스털·끊긴 배선이고 항상 같은 위치임.</li>
<li class="grp">3D 초음파(태아 기형·태령)도 적용되고 있음. 컬러 도플러는 도플러 탭 참고.</li>
</ol></div>

  `;
}
function reproCofHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('noEntry',16)} COF — 낭종성 난포 정의·발생률·병태생리·진단·치료·위험요인</div>
<div class="rb-block"><ol class="rb-list">
<li>Roberts의 고전적 정의는 황체 없이 직경 2.5cm 초과, 최소 10일 지속된 무배란 구조물임. 그런데 소는 보통 1.6~1.9cm 우성 난포를 배란하므로 2.5cm 기준은 더 작은 낭종을 놓침. 낭종은 빈번히 교체·대체되는 동적 구조라 10일 지속 요건도 재고 대상임. 일부 낭종은 스테로이드를 안 만들어 황체와 공존하기도 하므로 황체 부재 요건도 보편적이지 않음.</li>
<li>현대적 정의(Vanholder)는 활성 황체 조직 없이 한쪽/양쪽 난소에 존재하는 직경 최소 20mm 난포로 정상 난소 주기성을 명확히 방해하는 것임. 난포낭종은 보통 얇은 벽이고 E2를 분비하되 양은 과립막세포층 두께에 따라 다르고 P4는 분비 안 함. 황체낭종은 난포막·과립막이 어느 정도 황체화해 P4를 생성함. 둘은 같은 질환의 다른 형태임. 두 유형을 구별하는 단일 보편 P4 역치는 없음.</li>
<li>COF 발생률은 용도·관리 체계에 크게 의존함. 육우·후보우보다 젖소에서 훨씬 높아 비유 젖소 평균 약 10~12%(연구에 따라 3~32%)임. COF 젖소의 60%는 분만 후 첫 배란 전에 자연 회복하므로 언제 검사하느냐에 따라 발생률이 크게 달라 보임. 난산·후산정체·분만 후 대사질환이 있었던 소는 COF 위험이 거의 2배임. 육우는 통상 관리 하에선 발생률이 훨씬 낮지만 번식을 집약적으로 관리·조작하면 높아짐. 과배란 후 수정란 공여에 쓰이는 육우는 발생률이 젖소에 근접할 수 있음.</li>
<li>발병 기전은 50년 넘게 연구됐으나 단일 결정적 원인은 밝혀지지 않음. 일반적 합의는 배란 실패를 부르는 시상하부–뇌하수체–생식선 축의 다요인적 기능장애·신경내분비 불균형임. 기여 요인은 유전·표현형·환경·대사/세포·관리 요인으로 묶임.</li>
<li class="grp">LH의 두 얼굴을 구분해야 함. 난포를 키우는 것은 LH pulse이고 P4가 이를 억제함. 배란을 일으키는 것은 LH surge이고, E2가 역치를 넘어 충분히 지속될 때 시상하부의 양성 되먹임으로 터짐.</li>
<li>우성 난포가 멈춰야 할 시점에 P4가 낮아 억제가 풀리면 LH pulse가 정상 황체기보다 높게 유지되고, 난포는 배란도 퇴행도 못 하고 계속 자람. 난포가 E2를 만들어 발정 비슷한 징후를 보이는 소도 있지만, E2에 대한 시상하부 반응성이 떨어져 있어 surge가 불발. 고비유 초기의 음에너지 균형·산화 스트레스·저인슐린/IGF-1 같은 대사 스트레스가 COF 소에서 흔히 동반되지만, 원인 관계는 명확하지 않음. 가장 널리 받아들여지는 가설은 LH surge가 없거나 작거나 시기가 틀리는 것임. 시상하부 GnRH 함량이나 뇌하수체 GnRH 수용체·LH 함량은 줄지 않고, 외인성 E2를 줘도 surge가 안 나오지만 GnRH를 주면 LH가 나옴. LH를 통제하는 양성 E2 되먹임 고리의 기능적 붕괴를 뒷받침함. 시상하부의 E2 반응성 교란이 배란 실패의 원인이 됨. 즉 근본 원인은 저P4, 과잉 LH pulse, 시상하부 E2 반응성 저하가 겹친 상황임. 그 결과 난포는 25mm 이상으로 커져 10일 넘게 유지되고, 오래 내는 E2·인히빈이 FSH를 눌러 우성이 길어짐. 낭종이 퇴행해 새 난포파가 나와도 되먹임 이상이 그대로면 새 우성 난포도 낭종이 되어 반복됨(COF 교체·대체).</li>
<li>시상하부의 E2 양성 되먹임 회로(AVPV 키스펩틴)는 그냥 켜지지 않고, 사전에 P4에 한 번 길들여지는 priming이 있어야 작동함. 낭종 소는 황체가 제대로 안 생겨 P4가 쭉 낮은 탓에 이 priming을 받지 못한 상태임. 사춘기 전 미경산우가 E2를 만들어도 자발 배란을 못 하는 것과 같은 원리임. 혈중 P4를 올려주면(질내 P4 제제 등) 빠졌던 priming이 채워져 반응성이 회복됨. 이것이 치료의 근거임.</li>
<li>축 바깥 요인도 있음. 스트레스와 COF 난소의 열충격단백질(HSP) 증가가 연관되며, HSP가 난포벽 세포자멸사를 줄여 낭종 퇴행을 지연시킨다는 추정임. 비유 초기 사료 섭취가 산유 수요를 못 채워 NEFA가 높아지면 난포막세포·스테로이드 생성에 세포독성을 보임. 자연 회복 실패·반복 발생의 잠재적 설명임.</li>
<li class="grp">증상은 대개 변화된 번식 행동임. 가장 흔한 것은 무발정 기간 연장으로 이환우의 80% 이상에서 나타나며 분만 후 초기에 COF가 생긴 소에서 가장 뚜렷함. 지속·빈번한 발정이 연장되는 사모광증은 약 10%에서 나타남. 이환우가 다른 발정우에 자주 승가하면서도 자신은 서기 행동을 안 하는 경우가 흔함. 수컷처럼 변한 외모(남성화)도 사모광이 오래된 COF에서 보이고 분만~진단 간격이 길수록 사모광 행동을 볼 가능성이 높음. 산발적·불규칙한 발정 주기도 주된 증상일 수 있음.</li>
<li>직장 촉진만으로는 낭종 유형을 정확히 식별하기 어려움. 촉진으로 낭종 진단된 암소의 10%가 초음파로 보니 정상 황체였음. 초음파에서 난포낭종은 얇은 벽(3mm 이하)에 균일 무에코 또는 저에코 난포액이고 P4 0.9ng/ml 미만임. 황체낭종(황체화 난포낭종)은 벽 3mm 이상(3~5mm)에 에코가 강하고 내부에 회색 입자나 거미줄 같은 강에코 가닥이 있으며 P4 0.9ng/ml 초과임. 벽이 두꺼워진 황체화 낭종은 생리적 공동성 황체와 혼동 주의임. 초음파 진단 정확도는 난포낭종 74%, 황체낭종 거의 90%임. P4 농도는 벽 두께와 잘 상관함(3mm가 흔한 경계). 초음파+촉진+혈중 P4를 종합하면 거의 100%에 근접함. 단 현재 권장 치료는 두 낭종을 모두 다루므로 치료 전 유형 구별이 필수는 아님.</li>
<li>난포낭종은 황체 테두리가 안 보이는 것으로 공동성 황체·황체낭종과 구별됨. 대부분 무해한 낭종(같은/반대쪽 난소에서 황체·난포파가 정상 발달)이라 여러 주기·임신까지 잔존 가능함. 초음파는 액체 구조 안 황체 조직이나 다른 자리의 작은 황체를 잘 잡아내 무해/병적 감별에 촉진보다 훨씬 우수함. 양쪽 난소 철저 검사가 필수임. 황체 조직이 있으면 무해한 낭종, 없으면 5~14일 후 2차 검사로 황체 발달을 판정함. 25mm 이상의 낭종 자체보다 그 이면에서 발육 중인 우성 난포의 배란을 노려 배란 유도제·동기화를 쓰고 1~2주 후 새 황체 형성을 확인함. 초음파 기준 정의는 전통적 25mm 이상 대신 16~17mm 초과를 쓰는 연구가 늘었음. 낭종은 동적 구조라 E2를 내는 난포낭종이 자발 배란해 30mm 공동에 섬유소 가닥이 있는 대형 공동성 황체가 되기도 하고 이는 황체낭종과 형태로 구별되지 않지만 조치는 같음(황체 조직이 있으면 PGF로 2~7일 후 발정, Ovsynch도 가능).</li>
<li class="grp">현재 효과적으로 쓰이는 치료는 모두 호르몬 요법으로, 우성 난포를 배란시키거나 E2 양성 되먹임에 대한 시상하부 반응성을 되살리는 것이 목표임. 난소절제·자궁 내 항생제 주입·압좌 같은 옛 요법은 권장하지 않음. 수기 압좌는 호르몬 요법 대비 이점이 없고 외상·유착·치명적 출혈이 보고됨.</li>
<li>GnRH가 보통 1차 선택임. LH surge를 일으키고 분자량이 작아 항체가 생길 가능성이 낮음. 표준 용량은 근육 100μg임. 주사 후 2시간 내 LH surge → 낭종 황체화(7일 후 두꺼운 황체 가장자리) → 18~20일에 자발 황체퇴행 → 정상 주기임. 대부분은 배란하지 않고 황체화되며 함께 있는 우성 난포의 배란을 일으키기도 함. 약 72~85%에서 정상 주기 재개(보통 3주 내 발정 복귀)이며, 한 연구에서 20일 내 재개 72% vs 대조 16%임. 다만 연구 간 결과 차이가 큼. 발정까지 간격은 치료 7~10일 후 PG를 줘 줄일 수 있음. 초음파는 GnRH에 황체 조직으로 반응 안 한 낭종에만 P4 보충을 한정하는 데 유용함.</li>
<li>hCG는 GnRH에 반응하지 않는 난치성 낭종에 쓰는 단백 호르몬임. 높은 LH 유사 특성으로 낭종·난포를 황체화시켜 P4 생성을 시작하게 하고, 이후 프로스타글란딘으로 황체 퇴행을 유도해 정상 주기를 재개함. 흔한 용량은 근육 10,000IU임. 항체가 생겨 다음부터 안 듣게 될 수 있고 아나필락시스 가능성이 있으며 GnRH보다 비싸 보통 GnRH·다른 요법이 실패했을 때만 씀.</li>
<li>CIDR은 LH 분비를 줄여 낭종을 퇴행시키고 제거 후 새 난포파를 개시해 정상 주기를 재개함. 기전(Todoroki)은 P4가 정상 황체기 수준으로 올라 LH pulse 빈도를 낮춰 낭종을 퇴행시키고, E2·인히빈 억제에서 벗어나 새 난포파가 출현하며, P4가 우성 난포 과성장을 막아 정상 교체가 되는 것임. 축 회복에 충분한 P4 기간은 3일만큼 짧을 수 있음. Ovsynch 후 AI한 군과, CIDR 7일 삽입 후 제거하며 PG 주사하고 발정 보고 AI한 군의 임신율이 비슷해 CIDR 단독으로도 효과적임. Todoroki는 난포낭종 과배란 공여우 28두를 CIDR 14일 치료해 모두 발정·배란했고 64%(18/28)는 반복 회수에도 재발 없음. 회수 후 동기화에 PG 대신 CIDR을 쓰자 공여우 COF가 크게 줄었음(1년차 61두 중 2두, 2년차 54두 중 0두).</li>
<li>프로스타글란딘은 황체 조직이 있어야 듣는 약이라 황체낭종에만 효과 있음. 난포낭종에는 안 듣고, 난포낭종이 황체화해 황체낭종이 된 뒤에야 반응함. 황체낭종에 PG를 주면 8일째까지 90%에서 발정이 옴. 난포낭종에 안 듣기 때문에 PG 단독으로 치료하려면 유형을 정확히 진단해야 함. 유형을 못 정할 땐 GnRH와 PG를 동시에 주는 것이 권장됨. 황체낭종이면 가장 효율적으로 듣고, 난포낭종도 적절히 치료됨.</li>
<li>Ovsynch는 낭종 유형을 가리지 않고 발정 발견 없이 수정 기회를 제공해 어느 경우에나 쓸 수 있음. 고전적 Ovsynch 후 COF 임신율은 17~25%로 다양함. 개시 시 GnRH+PG 동시 사용이 표준 Ovsynch보다 임신율을 개선함. Ovsynch+CIDR 결합이 매우 효과적임(임신율 37.5% vs Ovsynch 단독 16.7%).</li>
<li>오피오이드 길항제인 날록손도 시도됐음. 스트레스가 COF에 기여할 수 있는데, 스트레스 때 나오는 내인성 오피오이드가 시상하부 GnRH 방출과 E2에 의한 surge를 막는 것으로 보기 때문임. GnRH 작용제 부세렐린과 같이 쓰면 77.5%가 2주 내 낭종이 퇴행하고 정상 주기로 돌아옴. 다만 임신율 개선은 통계적으로 유의하지 않아 권장하려면 더 큰 연구가 필요함.</li>
<li class="grp">위험 요인. 한 번 COF가 생긴 소는 또 생김. 분만 후 초기에 COF가 있던 소는 수정 시점에도 COF일 위험이 36.6% 높고, 이것이 단일 최대 위험요인임. 분만 전 BCS가 1단위 높으면 8.4배, 산후 이상이 있었으면 1.9배, 쌍태 분만이면 2.0~2.7배임. 여름철 분만·고령에서도 흔함. 고산유는 연구에 따라 위험을 높이거나 무관하고, 낮춘다는 연구는 없음. 대사적으로는 과비만·인슐린/IGF-1 감소·NEFA 증가가 깔려 있음. 유전력은 낮으나(0.07~0.12) 특정 가계에 몰리며, 해당 종축을 빼서 발생률이 10%에서 3%로 준 보고가 있음.</li>
<li>분만 후 초기 경산우의 COF 치료는 이로울 수 있는 반면 어린 암소는 자발적 대기 기간 종료까지 자연 해소를 기다릴 수 있음.</li>
<li class="grp">COF 젖소는 대조보다 첫 수정까지 6~11일, 수태까지 20~30일 더 걸림. 분만 후 7~35일 주 2회 초음파 추적에서 8두 중 7두가 1차 난포파 우성 난포, 1두가 2차 난포파 우성 난포가 낭종이 됐고, 낭종 교체 전까지 양 난소에 5~6mm 넘는 다른 난포가 없었음.</li>
<li>낭종우 Ovsynch 반응(낭종 평균 33.9mm). 첫 GnRH에 낭종 자체 배란은 0~11%(배란한 건 25~30mm 작은 낭종만), 기존 난포 배란 44~62%, 새 난포 발달 94~100%, 둘째 GnRH에 새 난포 배란 83%, TAI 32일 임신 약 41%임.</li>
<li>GnRH 후 황체화 낭종의 P4 상승은 15~18일 지속되며 이 기간이 축을 재설정(E2 양성 되먹임 재개)하는 창임. 단일 GnRH 5일 후 P4가 오르므로 Ovsynch 적용의 근거가 되고, GnRH+PG 동시 투여는 14일 후 PG에 제대로 반응하는 COF 소를 늘림. 합성 GnRH와 유사체, 용량 차이 간 치료 성적 차이는 없음(어느 상업 제품이든 100μg 근주로 비슷).</li>
<li>bST 사용은 COF 발생률과 무관함. 인과는 불명이지만 열스트레스, 지방·단백 유전능력 높은 수소 활용, 축사 고밀도, 육우 후보우 MGA 사용, 대사물 불균형(인슐린·렙틴·아디포넥틴·포도당·NEFA·아미노산)이 연관됨. 유전 선발로 COF를 줄일 수 있으나 산유량이 함께 부선발될 수 있어 저울질이 필요함.</li>
</ol></div>

  `;
}
function reproSyncHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('calendar',16)} 동기화 — 호르몬·발정 동기화·배란 동기화·사전·재동기화·미경산우·육우</div>
<div class="rb-block"><ol class="rb-list dots">
<li>동기화에는 발정 동기화와 배란 동기화가 있음. 발정 동기화는 호르몬으로 발정을 특정 기간에 모은 뒤 발정을 보고 수정하는 방법이라 발정 관찰이 전제임. 배란 동기화는 황체 퇴행과 배란까지 유도해 발정 관찰 없이 정해진 시간에 수정(정시 AI)하는 방법임.</li>
<li class="hd">1. 호르몬 제제</li>
<li>GnRH는 11mm 이상 우성 난포를 배란시키려고 줌. LH surge를 일으키며 배란은 투여 후 28~32시간에 몰림. 산차·분만 후 일수·유량에 영향받지 않음. 36시간이 지나도 배란이 없으면 GnRH 효과가 없었던 것임. 기대할 효과는 배란뿐이고 난포가 없을 때 줘도 난포를 키우는 효과는 없음. 11mm 미만이면 줘도 배란이 불확실하므로 난소를 충분히 보고 적절한 때 줘야 함.</li>
<li>10mm 넘는 우성 난포가 없는 난소 위축 같은 상태에선 GnRH를 줘도 난포를 키우는 효과가 없음.</li>
<li>우성 난포는 난포파 출현 2~3일에 8.5~9.1mm에서 선발되고 5일에 11~13mm가 됨. 8.5mm부터 LH 수용체가 생기지만 그 크기에서 GnRH를 준다고 확실히 배란하는 건 아님. 2~3일째 10mm에 달해도 배란 안 되는 경우가 많고, 모든 난포가 배란된 것은 난포파 출현 5일째 평균 13.6mm였음(홀스타인). 우성 난포가 된 뒤 시간을 두지 않으면 배란 유도 효과가 떨어짐.</li>
<li>투여량은 고나도렐린 100μg이 기본임. P4가 낮으면(기능성 황체 없음) 100μg으로 배란율 90% 이상임. P4가 높은 황체기에 주면 LH 피크가 낮아지는데, 배란율은 100μg 75.0%, 200μg 90.9%로 크게 떨어지진 않음(유의차 없음). 같은 양을 줘도 개체 편차가 있으므로 반응이 나쁜 개체는 200μg으로 올림.</li>
<li>산차는 영향이 적음. 경산우는 자연 LH 피크가 10ng/ml에 못 미치지만 그래도 배란하고, GnRH를 주면 충분히 높은 피크에 도달함. 체중이 크면 같은 양으로 LH 피크가 낮아질 수 있어 반응이 나쁘면 증량함. 고온 스트레스는 GnRH 후 LH·FSH를 낮춰 배란 유도율을 떨어뜨리므로, 여름엔 증량하거나 다른 처치를 고려함.</li>
<li>hCG는 소에서 LH 작용을 내 배란 유도와 황체 기능 향상에 씀. 가장 많이 쓰는 건 수정 5일째 투여임. 이때 1차 난포파 우성 난포가 13mm 이상이라 이를 배란시켜 부황체를 만들고 P4를 올림.</li>
<li>hCG는 사람 태반 합포체영양막에서 분비되는 당단백질임. eCG(PMSG)는 임신 초기 암말 자궁내막배에서 나오는 당단백질로, 당쇄가 많아 신장으로 배설되지 않아 반감기가 2~7일로 hCG보다 긺. 암소에서 FSH 유사 작용과 약한 LH 유사 작용으로 난포 발육을 촉진함. 수소에선 hCG를 테스토스테론 분비 증가 목적으로 씀.</li>
<li>Nascimento는 AI 5일째 홀스타인 비유우 2,979두에 hCG 2,000 또는 3,300IU를 근주해 초산우에서만 수태율 향상을 보였음. Alnimer는 리피트 브리더 406두에 AI 4 또는 6일째 1,500IU를 근주해 6일째 투여에서 수태율이 올랐고 초산우에서 효과가 컸음.</li>
<li>PGF2α는 황체 퇴행용으로 발정 유도와 자궁 질환(자궁축농증·내막염)에 씀. 투여된 PGF2α가 황체에 닿으면 황체에서 옥시토신이 나오고, 옥시토신이 자궁내막의 PGF2α 생성·방출을 촉진하며, 그 PGF2α가 다시 황체를 퇴행시키고 옥시토신을 내게 함. 이 황체–자궁내막 순환이 반복돼야 황체가 완전히 퇴행함. 투여는 계기일 뿐이라 자궁내막에 이상(중증 자궁내막염·자궁축농증)이 있으면 황체가 안 죽을 수 있고, 주기 6일경까지는 줘도 퇴행 안 하는 경우가 있음. 이전 발정 6일 이내, 발정 후 출혈 4일 이내 투여는 권하지 않음.</li>
<li>E2는 난포에서 나오는 발정 호르몬으로 자궁 수축도 촉진함. 발정 유도, 자궁경관 확장, 자궁 내 이물 처치에 쓰지만 가장 많이 쓰는 건 P4와 병용한 동기화임. 발정 유도로 쓰면 약 16~24시간에 LH surge, 약 42~52시간(2일)에 배란함.</li>
<li>P4는 혈중 P4를 높여 난포 성숙을 억제하고 발정 발현을 조절함. 최근엔 P4를 섞은 실리콘을 질에 넣어 점막으로 흡수시키는 질내 유치형이 주류임. 넣으면 혈중 P4가 안정적으로 유지되고, 빼면 빠르게 떨어져 보통 3~4일 뒤 발정이 옴. 단독이면 10~14일 유치 후 2~4일 발정 관찰하지만 대부분 E2 또는 GnRH와 PGF2α를 조합함.</li>
<li class="hd">2. 발정 동기화 (발정 관찰 전제)</li>
<li class="hd2">PGF2α 단독</li>
<li>PGF2α 발정 동기화는 번식 관리에서 가장 많이 쓰는 방법 중 하나임. 황체가 있는 소에 근주해 황체를 퇴행시키고 P4를 떨어뜨려 우성 난포의 발육·성숙을 촉진해 발정을 유도함. 발정 발현이 투여 후 2~6일로 폭이 넓은데, 투여 시점의 우성 난포 크기와 주기 단계 때문임.</li>
<li>주기 전반에 1차 우성 난포가 10mm 전후면 그 난포가 성숙해 E2를 낼 때까지 3~4일 걸림. 15mm 이상이면 이미 커서 2일 정도면 발정이 옴. 1차 우성 난포가 폐쇄된 시점(2차 난포파 출현기)이면 새 우성 난포가 선발돼 E2를 낼 때까지 걸려 5일 이후에 옴. 주기 후반에 2차 이후 우성 난포가 10mm 전후면 3~4일 걸림.</li>
<li>홀스타인 622두에서 주기 불명이지만 황체가 있는 소에 투여한 자료에서 발정은 3일째 49.8%, 4일째 14.1%로 3~4일에 몰렸고 수태율도 4일째를 중심으로 높았음. 투여 3~4일째에 특히 발정 관찰을 권함.</li>
<li class="hd2">GnRH + PG</li>
<li>0일 GnRH, 6일 PG임. GnRH는 LH surge를 일으켜 큰 난포를 배란 또는 황체화시키고 3~4일 내 새 난포파가 출현하게 해 난포파의 동원과 발달을 동기화함.</li>
<li>발정 시작 시점과 수태율의 정확성은 PG로 황체가 퇴행한 뒤 배란할 난포에 달림. 황체 퇴행이 완전하면(P4 1.0ng/ml 미만) 우성 난포가 배란하고 발정이 나타나며 이후 E2가 떨어짐. 대부분이 이 경우임.</li>
<li>황체 퇴행이 불완전하면(P4 2.0ng/ml 초과) E2가 낮게 유지돼 발정이 안 오고 우성 난포가 지속 난포가 됨. 10~20%의 소에서 생김. 장기간 낮은 P4는 LH 분비 패턴 변화, 배란 전 LH surge 억제, 지속 난포 증가와 관련됨.</li>
<li>그래서 이 프로토콜의 실패는 GnRH 후 난포 발달 부족보다 PG 후 황체 퇴행 불완전에서 더 자주 생김. 정상 주기 소의 약 70~80%에서 4일 간격으로 주기를 동기화하며 수태율에는 영향을 주지 않음.</li>
<li class="hd2">질내 P4 단독</li>
<li>질내 P4를 넣어 발정을 억제하다가 빼서 발정을 한곳에 모으는 방법임. 보통 10~14일 유치함. 간편하고 유효하지만 최근엔 배란 동기화·정시 AI와 병용하는 것이 일반적임. 단독으로는 난포파 발현을 조절하기 어려워 제거 후 돌아온 발정의 수태율이 떨어질 수 있기 때문임.</li>
<li>홀스타인 미경산우에서 CIDR 7일 유치 + 제거 시 PGF2α(7d P4+PG), 14일 유치 후 그냥 제거(14d), 21일 유치 후 그냥 제거(21d)를 비교한 시험이 있음. 7d P4+PG는 제거 후 2·3일째에 나뉘어 나타났고, 14d·21d는 2일째에 몰렸으며 특히 21d는 2일째 96.0%로 집중됨. 유치 기간이 길수록 그 사이 자기 황체가 퇴행하는 소가 늘어 제거 후 발정이 모이기 때문임. 7일 유치는 제거 시점에 황체가 남은 소가 많아 PGF2α를 반드시 줘야 함.</li>
<li>추가 호르몬이 필요 없고 발정이 더 집중된다는 점에선 14d·21d가 유효하지만 수태율은 7d P4+PG보다 떨어짐. P4 단독 장기 유치는 난포파를 조절하지 못해 오래 자라 노화된 난포에 수정하게 되기 때문임. 간편성·발정 집중 효과와 수태성의 균형을 보고 선택함.</li>
<li class="hd2">Fastback</li>
<li>Fastback은 수정한 소 중 비수태우의 재발정을 집중시키는 방법임. 젖소 수태율이 40% 정도라 절반 넘는 수정우가 비수태이므로 재발정 발견이 중요함. 수정 후 14~21일 또는 12~19일에 P4를 유치하고 제거 후 2~4일 발정 관찰함. 수태우는 발정이 안 오고 비수태우는 제거 후 2~3일에 발정이 몰려 수정율이 올라감. 14~21일 유치가 발정 발현율·집중도는 높고, 재발정 수태율은 12~19일 쪽이 높다는 결과도 있음.</li>
<li>Modified Fastback은 수정 후 5~19일에 P4를 유치해 재발정 집중과 첫 수정 수태율 향상을 함께 노림. 5일부터 유치해 수정 초기 P4를 올림. 수정 4회 이상 리피트 브리더에 효과가 높음. 비수태우 재발정은 제거 후 2~3일에 몰리고 재발정 수태율도 떨어지지 않음.</li>
<li class="hd2">Select-Synch (GnRH–PG + 발정 관찰)</li>
<li>PGF2α 단독과 P4 단독은 유도되는 발정이 개체마다 다르고 난포 일령이 높아지면 수태율이 떨어질 수 있음. Select-Synch는 GnRH로 난포파를 띄워 난포 일령을 맞춰 발정 편차를 줄이고 수태율을 안정시키려는 방법임. 시작 시 황체가 있는 것이 기본임.</li>
<li>0일 GnRH로 우성 난포를 배란시켜 새 난포파를 띄움. 반응할 우성 난포가 있으면 28~32시간 후 배란해 새 난포파가 약 1.5일 후 출현함. 7일엔 새 우성 난포가 5.5일령이 되고 이때 PGF2α로 황체(0일 배란으로 생긴 부황체 포함)를 퇴행시킴. 7~10일 발정 관찰 후 발정이 보이면 AI하고, 10일까지 뚜렷한 발정이 없으면 그냥 AI함(난포 8.5일령).</li>
<li>주의점은 둘임. 주기 전반에 시작하면 GnRH로 배란이 안 돼 새 난포파를 띄우지 못하고, 주기 후반에 시작하면 PGF2α 전에 이미 발정이 와 버리기도 함. 이 둘을 염두에 두고 쓰면 매우 유효함.</li>
<li class="hd">3. 배란 동기화·정시 AI</li>
<li class="hd2">원리</li>
<li>정시 AI는 발정 발견 없이, 사람이 원하는 때 수정하려고 개발된 것임. 수정율을 높이고 노동력을 보충하는 게 목적이지 수태율을 높이거나 반드시 수태시키는 방법이 아님.</li>
<li>정시 AI는 난포파 유도, 우성 난포 발육, 황체 퇴행 유도, 배란 유도, AI의 다섯 과정으로 이루어짐. 난포파는 우성 난포의 소실(폐쇄 또는 배란)로 시작되고, 2~3일에 우성 난포가 선발되며 5일에 배란 가능 크기에 이름.</li>
<li>수정시킬 난자는 새로 자란 건강한 난포에서 나와야 함. 난포파 출현부터 발정까지의 일수(난포 일령)가 5~10일에 걸쳐 수태율이 서서히 떨어지고 10일을 넘으면 급락함. 그래서 난포파를 확실히 띄워 적정 일령의 난포에 수정하는 것이 수태율 안정의 핵심임.</li>
<li>우성 난포를 충분히 키워야 배란 유도가 확실하고, 황체 퇴행부터 배란 유도 사이에 난포가 내는 E2가 충분히 오름.</li>
<li>황체 퇴행은 원하는 시점에 유도해야 하며, 그 전에 자연 퇴행하면 조기 발정이나 AI 전 배란이 생김. 퇴행 유도 때 기능성 황체가 있거나 P4가 1.0ng/ml 넘게 유지돼야 함.</li>
<li>배란 유도는 내인성 LH surge 전에 해야 하고, 황체 퇴행 유도부터 배란 유도까지 최소 36시간을 비워야 함(짧으면 수태율 저하). 이때 P4는 0.5ng/ml 미만으로 떨어져 있는 것이 바람직함. 배란 8~24시간 전 AI가 수태율이 높고, AI 시각은 예측 배란 시각에서 역산함.</li>
<li>현장에서 쓰는 배란 동기화는 Ovsynch와 E2+P4 프로그램 둘이 기본임. 새 난포파를 띄우는 원리가 완전히 다르고, 많은 프로그램이 이 둘에서 발전했으므로 둘만 익혀도 현장에서 충분함.</li>
<li class="hd2">Ovsynch</li>
<li>0일 GnRH, 7일 PG, 9일 GnRH, 10일 AI임. 0일 GnRH로 LH surge를 일으켜 우성 난포를 배란시킴. 반응할 우성 난포가 있으면 28~32시간 후 배란하고 새 난포파가 약 1.5일 후 출현함. 배란만 되면 품종·연령·체중에 관계없이 난포파 출현 시점에 차이가 거의 없음.</li>
<li>7일 동안 기다리면 새 우성 난포가 5.5일령, 13mm 전후가 됨. 7일 PG로 원래 황체와 0일 배란으로 생긴 부황체를 퇴행시킴. 9일(PG 48~56시간 후) 우성 난포는 7.5일령, 16~18mm가 되고 GnRH로 배란을 유도함. GnRH 후 28~32시간에 배란하므로 8~24시간 후인 10일에 8.5일령 난포에 AI함. 발정이 안 보여도 수정해도 됨.</li>
<li>장점은 첫 GnRH로 배란만 되면 1.5일 후 어김없이 난포파가 뜨는 것임. 단점은 GnRH 시점에 반응할 우성 난포가 없으면(폐쇄됐거나 너무 작으면) 새 난포파 유도가 실패하는 것임. 난포파 출현 5일 이후, 직경 11mm 이상 우성 난포면 확실히 배란시킬 수 있으므로 그런 난포가 있을 때 시작하면 잘 작동함.</li>
<li>Ovsynch 수태율은 자연 발정 수정과 비슷함. G1과 PG 사이 최소 7일 기능을 유지하는 활성 황체와 G1 후 배란할 우성 난포가 있어야 함. 처치우의 약 30%는 동기화 안 돼 임신 못 함. 난포파 2개 소에서 가장 잘 들어 젖소·물소에 적합하고, 난포파 3개인 육우·제부엔 덜 맞음.</li>
<li class="hd2">Ovsynch 시작 시점</li>
<li>발정 종료 직후 1차 난포파가 시작돼 주기 5일에 우성 난포가 11mm를 넘고 10일 전후까지 활동함. 그래서 주기 5~10일(발정 후 약 6일)이 시작 적기임. 황체 나이별 첫 GnRH 배란 반응(Pursley)은 1~4일 23%, 5~10일 96%, 11~16일 54%, 17~21일 77%임.</li>
<li>주기 0~4일은 우성 난포 없이 동원만 일어나고 8mm 미만 난포만 있어 과립막세포에 LH 수용체가 부족해 첫 GnRH에 반응하지 못함. 노화 난포에 수정하게 되거나, PG 전에 우성 난포가 폐쇄돼 새 난포파가 떠 버려 배란 유도 타이밍을 놓침.</li>
<li>11~16일은 우성 난포가 폐쇄를 시작했을 수 있어 GnRH 반응이 들쭉날쭉함(54%). 황체는 최대 직경이라 촉진으로 쉽게 잡히지만, 큰 황체 때문에 8~13mm 난포는 촉진으로 찾기 어려움. 초음파로 8mm 이상 난포 크기를 재서 배란 가능성을 추정함. 우성 난포 대부분이 폐쇄돼 성적이 떨어지는 시기고, PG 한 번에 발정이 빨리 안 오는 이유이기도 함.</li>
<li>16일 이후엔 다시 GnRH에 반응하는 우성 난포가 생기지만(77%) 배란 반응은 5~10일보다 떨어짐. P4 하강 때문으로 보임. 14일 이후에 시작하면 PG 전에 기능성 황체가 자연 퇴행해 AI 전에 배란돼 실패할 수 있음. 즉 5일 이전과 14일 이후는 부적절함.</li>
<li>첫 GnRH 배란, PG 황체 퇴행, 둘째 GnRH 배란 중 어느 하나라도 제대로 안 되면 수태율이 크게 떨어짐. 주기 후기에 시작해 첫 GnRH에 배란이 안 되면 기존 황체가 사라질 때 LH surge를 억제하지 못하고, 배란이 되더라도 새 황체의 P4 분비가 낮음.</li>
<li class="hd2">황체 유무가 핵심</li>
<li>G1 때 황체·배란 여부별 38일 수태율(Galvão): 황체 있고 배란 42.2%, 황체 있고 배란 없음 37.7%, 황체 없고 배란 27.6%, 둘 다 없음 15.4%. 기능적 황체 존재가 G1 배란보다 중요함. 초음파로 G1 당일 8mm 넘는 난포를 볼 수는 있지만 실제 배란을 정확히 예측하진 못하므로, 황체 유무만으로 프로토콜을 고르는 것이 더 간단하고 빠름. 건강하고 체형은 좋은데 황체가 없는 소는 질내 P4 기구를 넣으면 이득이고, 황체가 있는 소는 넣어도 이득이 없음.</li>
<li>초음파는 갓 생긴 황체나 퇴행 중인 황체까지 잡아낼 만큼 민감한데, 그런 황체는 Ovsynch에 필요한 P4를 못 낼 수 있음. Bicalho는 황체 직경 2.2cm를 기준으로 하면 초음파가 혈중 P4 1ng/ml 초과 황체 식별에 약 90% 민감·특이(촉진은 민감도 33~60%)라 함. 단 Ovsynch가 가장 잘 듣는 주기 5~10일엔 황체가 2.2cm 미만일 수 있으므로, 전형적 초기 황체로 보이면 최소 1.5cm를 쓰고, 전발정기 퇴행 중으로 보이면 배란 후 5~10일까지 기다려 시작함.</li>
<li class="hd2">FTAI 시점·Cosynch·Heatsynch</li>
<li>둘째 GnRH 후 FTAI 시점에 따라 수태율이 달라지는가가 Ovsynch 초기부터의 질문이었고 그래서 변형이 여럿 생김. 둘째 GnRH 후 8·16·24·32시간을 비교한 초기 연구에선 16시간이 가장 높았음. 최근 자료로는 16시간과 24시간 사이에 큰 차이가 없음.</li>
<li>Cosynch는 소 취급 횟수를 줄이려고 둘째 GnRH와 FTAI를 동시에 함. Cosynch 48h는 PG 48시간 후, Cosynch 72h는 PG 72시간 후에 둘째 GnRH와 FTAI를 함께 함. 두 방식의 수태율 차이는 크지 않음(Sterry 2007). 보통은 16~24시간 후 수정하는 전통적 Ovsynch보다 수태율이 낮음.</li>
<li>"AI 때 발정 징후가 없으면 불안하다"면 배란 유발제로 GnRH 대신 E2를 쓰는 Heatsynch가 있음. 배란 유도 효과는 비슷하고 AI 때 발정 징후를 볼 수 있음. E2는 16~24시간에 LH surge 피크, 42~52시간 후 배란이므로 PG 24시간 후(8일) E2, 그 24~36시간 후(9~9.5일) AI함.</li>
<li class="hd2">Ovsynch + 질내 P4 (CIDRsynch)</li>
<li>Ovsynch 첫 GnRH와 PG 사이에 P4 기구를 넣으면 무배란 소에서도 발정을 유도할 수 있고 전반적으로 Ovsynch 단독보다 수태율이 좋음. 기구의 P4는 삽입 7일 동안 조기 발정·조기 배란을 막고, 첫 GnRH에 반응하지 않은 우성 난포를 가진 소에서 황체가 일찍 퇴행하는 것을 막아줌. 14일 이후에 시작해야 할 때도 PG 전 황체가 자연 퇴행해도 조기 발정·배란을 막아 실패를 줄임.</li>
<li>PG 전에 황체가 없던 소(주기가 안 돌던 소)는 P4 기구를 쓰면 수태율이 더 높음(Stevenson 2006). 그래서 주기가 아직 회복되지 않은 소에서 특히 차이가 큼.</li>
<li>단계는 0일 기구 삽입 + GnRH, 7일 기구 제거 + PG, 9일 GnRH, 10일 FTAI임. 추가 비용이 들므로 Ovsynch 결과가 만족스럽지 않을 때 개선용으로 고르는 것이 좋고, 무발정이 의심되는 소나 시작 때 황체가 뚜렷하지 않은 소에 씀. 기구의 P4가 처치 완료 전 발정을 막아주기 때문에 Ovsynch의 오류 일부가 교정되지만, 경우에 따라 이 효과가 충분하지 않을 수도 있음.</li>
<li class="hd2">E2+P4 프로그램</li>
<li>0일에 E2(보통 2.0mg) 근주와 동시에 P4 제제를 넣어 고E2+고P4 조건을 만듦. 이 조건에서 뇌하수체의 FSH·LH 방출이 억제돼 소난포와 우성 난포가 폐쇄됨. 근주한 E2는 서서히 분해돼 고P4 조건만 남고, 우성 난포가 없으니 FSH 방출이 회복돼 새 난포파가 출현함. 시기는 E2 투여 후 3~5일(평균 4일)임.</li>
<li>9일(P4 9일 유치 예시)에 난포는 약 5일령이고 PGF2α 투여와 동시에 P4를 제거함. 10일(PG 약 24시간 후) 난포는 약 6일령이고 배란 유도용 E2(1.0~2.0mg)를 근주함. E2 후 약 16~24시간에 LH surge 피크, 약 42~52시간 후 배란이므로 E2 후 24~36시간(11~11.5일)에 7~7.5일령 난포에 AI함.</li>
<li>Ovsynch처럼 우성 난포를 배란시켜 난포파를 띄우는 게 아니라, FSH·LH 방출을 눌러 우성 난포를 폐쇄시켜 새 난포파를 띄우는 방법임. 가장 큰 장점은 발정 주기와 관계없이, 발정일이나 배란일이라도 시작할 수 있다는 것임. 다만 E2 용량이나 소의 상태(육우·젖소, 산유량, 체중)에 따라 E2가 떨어지는 속도가 달라 난포파 출현이 3~5일로 퍼지고, AI 때 난포 크기 편차가 Ovsynch보다 커질 수 있음. 난포파 출현이 Ovsynch보다 최소 1.5일 늦으므로 PGF2α까지(유치 기간)를 길게 잡는 것이 좋음.</li>
<li>수태율이 떨어지는 상황은 둘임. 첫째, 20mm 가까운 난포가 있고 퇴행 황체가 하나 있거나 없는 경우. 드물지만 우성 난포 폐쇄가 안 돼 시작 때 난포가 그대로 AI까지 자란 것으로, 노화 난자가 나와 수태율이 떨어짐. 둘째, 15mm 미만 난포가 있고 퇴행 황체가 하나 있거나 없는 경우. 흔한 패턴이고 특히 흑모화종에서 늘어남. 난포파 시작이 늦어졌거나 시작부터 PG까지가 짧아서(흑모화종 8일 이내) AI 때 우성 난포가 충분히 못 큰 것임.</li>
<li>둘째 패턴에선 AI 실시자가 수정할 만한 성숙 난포가 없다고 판단해 AI를 안 하는 것이 문제고, 예정대로 AI해도 24~36시간 내 배란이 안 되기도 해 수태율이 떨어짐. "AI 3~4일 후 발정이 다시 왔다"는 현상이 생기기 쉬운데, 우성 난포가 너무 작아 2회차 E2로 배란이 안 됐지만 그대로 계속 자라 스스로 E2를 충분히 낼 만큼 컸기 때문임. 이때 발정이 오면 그 타이밍에 AI를 권함. 이 패턴이 우군에 많으면 PG 투여(CIDR 제거)까지를 1~2일 늘려 해결하는 경우가 많음.</li>
<li class="hd">4. 사전 동기화</li>
<li>Ovsynch는 주기 6일 전후(5~9일)에 시작하면 결과가 더 좋음(Vasconcelos 1999). 그래서 GnRH, PG, GnRH+PG, hCG로 소를 주기 6일에 맞추는 사전 동기화를 함. 새 프로토콜이 아니라 Ovsynch 결과를 개선하기 위한 앞 단계임. 사전 동기화를 한 쪽이 안 한 쪽보다 결과가 낫고(Bello 2006), Ovsynch는 첫 GnRH에 배란하고 PG에 황체가 퇴행하고 마지막 GnRH에 배란하는 소에서 훨씬 좋음.</li>
<li class="hd2">Presynch-Ovsynch</li>
<li>PG를 14일 간격으로 두 번 주고, 둘째 PG 12~14일 후 Ovsynch를 시작함(Moreira 2001). 0일 PG로 황체가 있으면 퇴행시켜 새 주기를 시작하고, 14일 PG로 그 새 주기의 황체를 퇴행시킴. 첫 PG가 실패했어도(기능성 황체가 없었어도) 14일엔 황체가 있어 퇴행시킬 수 있음. 소가 PG 후 2~5일 내 배란해 Ovsynch 시작 때 주기 5~9일이 되게 하는 것임.</li>
<li>주기가 도는 소에 쓰고 보통 분만 후 25~28일 이후 시작해, 분만 후 63일경 Ovsynch로 수정함. PG 2회로 Ovsynch를 5~10일령 황체 상태에서 시작하게 돼 전체 임신율이 올라감. Ovsynch 10일 전 PG 1회만으로는 성적이 안 좋아짐. 35~38일 안에 발정이 세 번 오므로 자궁내막염 소의 치료 목적으로도 적합함.</li>
<li>Presynch를 거치면 주기가 도는 소는 거의 다 G1 때 황체가 있어야 하므로, 난소 검사로 전동기화 성공과 무배란우 비율을 바로 알 수 있음. 황체 없는 소가 많으면 프로토콜 실패이고 순응도·건강·저BCS·영양 등 우군 관리 문제가 있다는 뜻임.</li>
<li>비유 초기 음에너지 균형에서 벗어나 에너지 균형 0에 도달하지 못한 소는 호르몬만으로 성공 가능성이 낮음. BCS 2.5 미만 소에게 호르몬은 해결책이 아니고 영양 전략을 다시 봐야 함. 주기가 안 도는 소는 PG에 반응하지 않고, 모든 소가 PG에 똑같이 반응하지 않아 동기화가 일관되지 않을 수 있음.</li>
<li class="hd2">G6G</li>
<li>0일 PG(황체가 있으면 퇴행), 2일 GnRH(배란 유도, 새 황체 형성), 8일 Ovsynch 시작임. Ovsynch 결과를 개선하거나 시작을 앞당기고 싶을 때 쓰며, 첫 PG에 반응할 기능성 황체가 있는지 확인하고 시작함. Ovsynch 첫 GnRH 후 배란을 최대화해 배란 전 난포 크기의 편차를 줄이고 동기화율을 높임. 기능성 황체가 없는데 첫 PG를 주면 실패함.</li>
<li class="hd2">Double Ovsynch</li>
<li>Ovsynch를 한 번 돌리되 수정은 하지 않고, PG 후 둘째 GnRH를 2일이 아니라 3일 뒤에 줌. 둘째 GnRH 때 새 난포파가 시작돼야 하고, 셋째 GnRH(본 Ovsynch 첫 GnRH)를 배란 후 5~9일의 최적 시점에 주는 것이 목적임. 0일 GnRH, 7일 PG, 10일 GnRH, 17일 GnRH, 24일 PG, 26일 GnRH, 16~20시간 후 AI임.</li>
<li>목표는 분만 후 첫 수정의 수태율 향상임. 소를 더 많이 다뤄야 하므로 관리가 잘 되는 농장에서 써야 함. Presynch-Ovsynch의 문제인 비주기 소에서 PG가 안 듣는 문제를 해결할 수 있고, 본 Ovsynch 첫 GnRH 때 저P4 소 비율이 Presynch보다 낮아 무발정 소가 섞여 있을 땐 Double Ovsynch가 더 적합함. 실패 원인은 분만 후 무발정으로 주기 유도가 안 되는 경우임.</li>
<li class="hd2">7&7 Synch</li>
<li>0일 PG + CIDR 삽입, 7일 GnRH, 14일 PG + CIDR 제거임. 0일 PG로 기존 황체를 녹이고 CIDR로 P4를 공급해 배란을 막으면서 우성 난포가 지속 난포로 자라게 둠. 7일엔 모든 소가 반응성 좋은 큰 난포를 갖게 되므로 GnRH로 한꺼번에 배란시켜 새 난포파를 시작함. 14일 PG로 7일에 생긴 황체를 녹이고 CIDR을 빼면 새 우성 난포가 준비된 상태라 모두 배란으로 감.</li>
<li class="hd">5. 재동기화</li>
<li>재동기화는 임신 음성 결과를 기다렸다가 새로 동기화를 시작하는 게 아니라, 음성일 경우를 미리 대비해 "음성이면 어떻게 할 것인가"에 답해 두는 것임. 방법은 여러 가지지만 거의 다 앞의 프로토콜을 활용하며, 핵심 원리를 이해해 농장 상황에 맞게 응용하는 것이 중요함. 조기 임신 검사로 공태우를 빨리 번식 대상으로 되돌리며, 위스콘신 자료로는 수정 후 약 32일이 재동기화 최적 시점임.</li>
<li>Resynch는 임신 진단 7일 전(0일) GnRH, 7일 임신 진단 후 비임신 소에 PG, 9일 GnRH, 10일 FTAI임. 비임신으로 확인된 소의 수정 간격을 줄이려는 공격적인 방법임. 비임신으로 잘못 진단된 소에 쓰면 유산을 일으킬 수 있음.</li>
<li>비임신으로 진단된 뒤에는 황체가 있으면 PG 후 발정 보고 수정, 질내 기구나 CIDRsynch로 재동기화, 병리적 문제가 있으면 그에 맞춘 치료를 함. 질내 P4로 재발정을 모으는 Fastback은 2절 참고.</li>
<li class="hd">6. 미경산우·육우</li>
<li class="hd2">미경산우</li>
<li>미경산우는 경산우와 달라 따로 봄. 수태율은 경산우보다 높지만, 미경산우는 사춘기 후 가임 주기 시작, 경산우는 분만 후 생식 기능 회복이라는 기간을 거쳐야 해서 첫 수정이나 수태 가능한 수정이 늦어질 수 있음.</li>
<li>미경산우는 난포 성장이 더 빠르고 주기당 난포파 3개가 더 잦아 동기화가 잘 안 됨. 난포파 3개면 주기의 약 57%가 첫 GnRH에 반응하지 않는 난포 단계임. 대신 발정을 더 자주, 더 오래 보여 발정 발견은 더 쉬움. 다만 별도 사육·인력 부족으로 관찰 시간이 충분치 않은 경우가 많음.</li>
<li>Ovsynch는 미경산우에서 경산우보다 결과가 나쁨. 프로토콜이 잘 들을 최적 시점을 맞추기 어렵기 때문임. Ovsynch에 P4 기구를 넣어 Cosynch 식으로 변형하면 발정 발견이 제한적일 때도 동기화 정도가 좋아짐.</li>
<li>미경산우용으로 처음 제안된 것 중 하나가 5일 Cosynch-72h임(Rabaglino 2010). 0일 P4 기구 삽입 + GnRH, 5일 기구 제거 + PG, 8일(72시간 후) GnRH + FTAI임.</li>
<li>젖소는 자연 교배보다 인공수정이 적합하고, 유전 개량을 최대화하려면 가장 좋은 유전자를 가진 미경산우에 최고 정액을 써야 함. 그래서 자연 발정을 보일 때 수정하는 것이 수태 가능성도 가장 높고 좋은 정액을 쓸 수 있어 가장 효과적임. 동기화는 이론상 최선은 아니지만 발정 발견이 어려우면 어쩔 수 없이 쓰게 됨.</li>
<li>미경산우는 난포 성장이 빠르고 난포파가 잦아 임의의 주기에 프로토콜을 시작하면 실패할 가능성이 높음. 어떤 미경산우를 동기화할지 고르는 수의사의 판단이 중요함(Baldor 2015). 프로토콜을 쓴 소와 안 쓴 소의 번식 결과를 비교하면 미경산우에서 프로토콜 사용이 옳은 결정이었는지 판단할 수 있음.</li>
<li class="hd2">육우</li>
<li>육우 동기화는 고려할 것이 많음. 품종 구성이 균일하지 않아 반응이 다를 수 있고, 영양·건강 상태(BCS)가 고르지 않을 수 있으며, 시설이 맞지 않아 취급을 최소화해야 하고, 일부 품종은 성질 때문에 다루기 어려움. 분만 후 경과 일수가 주기 중인 소의 비율과 동기화 난이도를 좌우하고, 포유 중인 송아지가 발정 회복을 늦추며(포유 무발정), 일부 품종은 계절 무발정이 강함.</li>
<li>주기가 안 도는 소의 동기화는 매우 어려우므로 시작 전에 반드시 알고 있어야 함. 육우 동기화 문헌은 젖소보다 적지만, 수태율 45~60%는 목표로 해야 동기화를 쓸 만함. 첫 단계는 위 사항을 모두 따져 우군이 동기화에 적합한지 평가하는 것이고, 그다음 가장 흔히 쓰는 프로토콜 몇 가지를 고름.</li>
<li>5일 Cosynch+P4는 미경산우 프로토콜과 비슷하되 작은 차이가 있음. 기구 제거 때 PG를 주고 12시간 후 PG를 한 번 더 줘야 함. 수정은 경산우 72±2시간, 미경산우 60±4시간임.</li>
<li>7일 Cosynch+P4는 기구 제거일에 두 번 주사할 필요가 없어 취급이 쉽고, 7일이라 삽입·제거를 같은 요일에 할 수 있음. 경산우·미경산우 모두 쓸 수 있고 수정은 경산우 60~66시간, 미경산우 54±2시간임.</li>
<li>두 프로토콜의 실패 원인은 예상보다 무발정 소가 많은 경우, 경산우용 프로토콜을 미경산우에 쓴 경우, 육우는 취급이 적어 프로토콜 모니터링이 어려운 경우임.</li>
<li class="hd">7. 시작 전 검진</li>
<li>초음파는 촉진보다 자궁·난소 건강을 정확히 평가함. 생식기 병변이 있는 소는 어떤 동기화를 쓰든 수태가 안 되므로 시작 전 가려내면 약값과 수정 비용을 아낌. Colloton·DesCôteaux는 건강·관리·기록이 좋은 농장이면 분만 후 검진을 난산·후산정체·자궁염·대사질환 병력우에 한정해도 된다고 보고, Gnemmi는 모든 소를 분만 후 10일부터 초음파로 봐서 자궁 상태와 난소 활동 재개를 확인해야 한다고 봄. 분만 후 25일 이후 황체 식별은 초음파가 촉진보다 정밀해 Presynch 성공률이 올라가고, 우성 난포 유무는 초음파 없이는 알 수 없음.</li>
<li>난소를 정밀 평가하지 않으면 이미 P4가 높은 주기우에 P4 기구가 너무 많이 쓰임. 서방형 P4 기구는 진성 무발정이나 낭종 소에서 높은 수태율을 보장하는 가장 좋은 수단 중 하나지만 비용, 삽입 부위 자극·감염이 한계임. 동기화에 초음파를 쓰면 호르몬을 꼭 필요한 소에만 쓸 수 있음.</li>
<li class="grp">사춘기 발정에 교배하면 3차 발정 교배보다 분만율이 21% 낮음. 미경산우는 교배 예정 1~3개월 전에 사춘기에 도달해야 함. 프로게스틴으로 사춘기를 유도할 수 있음. MGA 8일 급여 후 중단하면 LH pulse가 자극되고 배란 전 난포가 자람. 사춘기 전후 미경산우 동기화엔 프로게스틴 병용이 수태율을 개선하고, 질내 P4 5일이 경구 MGA보다 GnRH 유도 배란 후 조기 황체퇴행을 덜 일으킴.</li>
<li>PGF 처치 후 발정은 6일에 걸쳐 분포하며, 발정휴지기 초반(7~8일)·후반(15일) 처치가 중반(10~13일)보다 반응이 일관됨. 단회로 발정이 안 오면 7·11·14일 간격으로 재투여하고 14일 간격이 가장 반응이 좋음. PGF2α는 질 점막하에 표준 용량의 절반, 또는 좌골직장와에 단일 용량을 줘도 근주만큼 효과적임.</li>
<li>첫 GnRH 배란율은 60%대이고 그때 난포는 8~12mm임. 어린 난포는 배란 없이 황체화만 될 수 있음. 사전동기화를 해도 황체가 부실하거나 황체화 상태면 P4가 부족함. CIDR는 최소 5~7일 넣어야 난포 노화를 막고 수정까지 끌고 갈 수 있음.</li>
<li>5일 프로토콜의 double PG 간격은 24시간을 권장하고, CIDR 포함 프로토콜은 CIDR 제거로 P4가 빨리 떨어지므로 8~12시간 간격도 가능함. CIDR+Cosynch에서 PG 후 72시간에 GnRH+FTAI를 하는 건 CIDR 제거 후 72시간은 줘야 E2가 충분히 분비되기 때문이고, GnRH가 먼저 들어가면 E2 노출이 부족함. 5일 Cosynch+CIDR 변형으로 외인성 GnRH 반응 배란이 늦어 정자 생존이 위태로우면 PG 후 76~80시간에 GnRH+AI, 또는 CIDR 제거 60시간 후(7일) GnRH 주고 16~20시간 후 AI함.</li>
<li>프로토콜 예. GnRH+PG(0일 GnRH, 6일 PG, 80시간 후 AI). 0567(0일 GnRH+CIDR, 5일 PG1+CIDR 제거, 6일 PG2, 7일 GnRH, 16~20시간 후 AI). GPPG(0일 GnRH, 5일 PG1, 6일 PG2, 7일 GnRH(PG2 32시간 후), 16~20시간 후 AI). 7&amp;7 Synch는 14일 PG+CIDR 제거 60시간 후 AI임. GPG/P4 프로토콜 6·7일에 eCG를 넣으면 28일 교배 임신율이 오르고(58.6 vs 52.3%) 무발정 젖소의 수태까지 중앙값 일수가 줄어듦.</li>
<li>수정 후 4~7일 GnRH를 더 주면 부황체가 생김. 부황체는 P4를 높여 조기 황체퇴행을 막음. 제제 특성. GnRH는 고나도렐린(자연형)·부세렐린(강력·빠름)·레시렐린(강함), PG는 디노프로스트(자연형)·클로프로스테놀(반감기 길고 강력)임.</li>
<li>E2·P4를 난포파 출현 전 단기 투여하면 난포파 출현 FSH 상승 기간이 약 10시간 짧아지고, 병용 시 LH 박동 빈도·진폭이 모두 줄어 난포파 출현이 약 1.5일, 첫 우성 난포 선택이 약 2.5일 늦어짐. E2+P4 프로그램이 난포파를 지연시키는 기전임.</li>
</ol></div>

  `;
}
function reproCystHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 번식질환 — 분류·난소 정지·황체 유존·자궁·질 질환·리피트 브리더·태아 기형</div>
<div class="rb-block"><ol class="rb-list dots">
<li class="hd">개요</li>
<li>번식 장애는 우군의 약 10~20%에서 발생하며 난소 관련이 50~60%, 자궁 관련이 20~30%임.</li>
<li>VWP를 넘겼는데 발정이 없는 소는 검진 시 난소 상태로 나누는 것이 출발점임. 무배란우는 황체가 없고 주기가 안 돌아온 소(난소 정지·난포낭종), 무발정 배란우(둔성 발정)는 배란과 황체는 있는데 겉으로 안 보이는 소, 발정 발견 실패는 관찰을 못 했거나 황체 유존으로 발정이 안 오는 소임.</li>
<li>번식 장애는 불임증(생식기 이상·질환으로 수정 성립이 방해받는 상태)과 불육증(수정은 되나 배·태아 사멸·유산으로 분만에 이르지 못하는 상태)으로 나누고, 리피트 브리더는 둘이 섞일 수 있음. 원인은 생식기 형태 이상, 호르몬 분비 이상, 사양 관리, 미생물 감염, 인위적 요인이며 현장은 사양 관리·호르몬 이상이 대부분임. 주기가 도는지 확인하려면 7~10일 후 난소를 다시 봄.</li>
<li>황체 없음은 난소 위축·난소 정지·난포낭종(정지와 낭종의 차이는 난포 크기)으로, 황체 있음은 발정 불명료(둔성 발정·황체 유존), 주기 불규칙(황체 발육 불전), 발정 지속 과다(배란 지연)로 나눔.</li>
<li class="hd">배란 실패의 분류(Wiltbank)</li>
<li>Wiltbank는 배란 실패를 네 범주로 분류함. 초음파가 판정을 도움.</li>
<li>첫째, 출현 단계까지만 자람(난소 정지). 작은 난포만 여럿이고 어느 것도 4mm를 넘지 못하며 황체도 없음. 배란 직후 후발정기도 황체가 아직 안 보여 똑같이 보이므로, 며칠 뒤 다시 봐서 황체가 생기면 후발정기, 그대로면 난소 정지로 판정함. 극심한 영양실조 소가 아니면 드묾.</li>
<li>둘째, 선택 단계까지는 자라지만 배란 크기에는 못 미침. 분만 후 무발정우에서 전형적임. 황체가 없고 난소도 작지만 난포는 8.5mm 정도까지 자람. 우성 난포가 뽑히긴 하는데 더 못 크고 퇴행하고, 다음 난포파가 올라와 같은 일이 반복됨.</li>
<li>셋째, 배란 크기를 넘어섬(난포낭종). 직경 22mm가 넘는, 벽이 얇은 액체 구조로 보임.</li>
<li>넷째, 황체 조직이 있는 상태에서의 무배란(황체기능 연장). 남아 있는 황체가 정상 간격의 배란을 막음.</li>
<li class="hd">난소 정지</li>
<li>난소 정지는 황체 형성이 없고 주기가 미회복된, 진짜로 발정이 없는 상태임. 분만 후 회복이 순조로우면 보통 30~40일에 첫 발정이 오므로 이를 넘겼는데도 난소가 조용하면 의심함.</li>
<li>배경에 분만 전후 영양 부족, 난산·주산기 질환, 저BCS가 흔함. 배란 유도제(GnRH/hCG)나 동기화로 배란을 촉진하되 근본은 컨디션 회복임.</li>
<li>난소 위축은 난포가 10mm 미만에 머물고 난소가 작고 실질 위주라 딱딱함. GnRH 분비 부족으로 LH pulse가 모자란 것이 배경이며 산욕열·유방염·케토시스·제4위 전위 후 회복 불량, 수척, 만성 통증(파행) 소에 많고 털 윤기가 나쁨. 호르몬 효과를 기대하기 어려워 컨디션 회복·사양 재검토가 우선이지만, 살집이 좋고 파행이 없으면 E2+P4 프로그램으로 주기가 돌아오는 경우가 있음.</li>
<li>난소 정지는 난포가 10mm 이상 자라지만 E2를 충분히 못 내 배란 없이 폐쇄·재발육을 반복함. NEB가 길면 컨디션이 돌아와도 주기가 안 돌아올 수 있음. 배란 유발제(GnRH/hCG)를 주면 25% 전후에서 8~10일에 황체가 퇴행해 10일 전후 조기 발정이 옴(낭종도 같음). 그래서 동기화는 Ovsynch+P4나 E2+P4를 기본으로 해 수정 전 P4를 올려 조기 황체 퇴행을 막음.</li>
<li>난포낭종은 산유량이 높은 분만 후 1~4개월에 많지만 150일 이후 발병도 있음. 조기 발병은 자연 치유가 많고 150일 이후는 치료해도 느림. 고용량 ACTH·에스트로겐 처치도 원인으로 꼽힘. 배란 유발제는 낭종 난포(25mm 이상)보다 뒤에서 자라는 우성 난포의 배란을 노리는 것이라, 1~2주 후 "낭종이 그대로니 효과 없다"가 아니라 황체가 생겼는지를 봄. E2+P4를 낭종에 쓸 땐 P4 제거까지를 난소 정지보다 늘림. 황체낭종(P4 1.0 초과)은 어디선가 난포가 자라므로 배란 동기화로 치료되며, 큰 난포강을 가진 소는 유형 구별 없이 Ovsynch+P4로 대응함.</li>
<li class="hd">황체 유존</li>
<li>황체 유존(황체기능 연장)은 임신이 아닌데 황체가 오래(20mm 이상, 15일 이상) 남아 발정이 안 오는 상태임. 유중 P4 3ng/ml 초과가 19~30일 넘게 지속되면 황체 잔존으로 보며, 확인엔 다회 검사나 P4 검사가 필요함.</li>
<li>자궁 내 이물(미이라·농·점액)이나 내막염으로 PGF2α 생성이 막히는 것이 배경이고, PGF2α 투여로 퇴행시킴. 자궁 이상이 있으면 세척을 병행함. 황체가 있으면 Ovsynch가 잘 걸리므로, 유존 황체인지 따지는 것보다 황체가 있는지 아는 것이 실무상 더 중요함.</li>
<li>황체 유존은 급격한 고온 스트레스로도 유발되고, 후산정체·자궁염 이력우와 고산유우에서 황체기 연장이 늘어남. 자궁 이상이 의심되면 PGF2α와 함께 자궁 내 주입이나 세척을 함.</li>
<li>황체 발육 불전은 크기는 정상이어도 P4 생산이 부족한 황체로, 조기 퇴행해 이전 발정 10±2일에 발정이 돌아옴. 배란 난포 발육 불량, FSH·LH 부족, LH 수용체 부족, 자궁내막 PGF2α 조기 생산이 원인임. 반복하는 소는 발정 시 hCG 근주, 또는 발정·AI 후 5일째 hCG로 부황체를 만들어 개선함.</li>
<li>배란 지연은 발정 개시 후 42시간 넘어 배란하는 것으로, 특정 소에서 반복되는 경우와 고온기에 늘어나는 경우가 있음. 고온 스트레스로 난포 E2 생산이 줄어 LH surge까지 시간이 걸리는 것으로 봄. 발정 지속이 2~3회 이어지면 다음 발정 때 배란 전 난포를 확인하고 GnRH/hCG를 동시 근주함.</li>
<li class="hd">둔성 발정·기타 난소 병리</li>
<li>무발정 배란(둔성 발정)은 고비유우에서 E2의 발정 발현 효과가 약해 흔함. 분만 후 첫 배란의 약 94%가 발정을 동반하지 않는다는 보고와 맥을 같이함.</li>
<li>둔성 발정 원인은 고산유(대사 항진으로 E2 분해 촉진), 수척, 관절염·제병 등 통증, 고온 스트레스임. 둔성 발정우는 황체 퇴행 시 P4 저하가 완만함. 분만 후 첫 배란에서 높은 확률로 나타남. 황체가 있으면 PGF2α지만 다시 발정이 안 올 수 있어 배란 동기화 후 TAI가 가장 유효함. 수척하거나 유량이 많으면 TAI를 해도 수태율이 낮을 수 있음.</li>
<li>그 외 난소 병리는 드묾. 과립막세포종이 가끔 있는데 한쪽 난소가 10cm 넘게 커지고 안에 고에코 영역이 보임. 이 고에코는 종양 혈관과 치밀 조직 경계에서 생기는 경면반사임. 증상은 무발정부터 사모광까지 다양하고 미경산우에서 유방 발달·비유가 생길 수 있음.</li>
<li class="hd">요질·질염</li>
<li>자궁·질 장애는 먼저 외음부에 점액 말고 다른 배출물(농, 소변)이 있는지 봄.</li>
<li>요질은 소변이 질 내로 역류·저류하는 것임(황색·요취). 노령우·수척우에 많고, 외자궁구를 덮을 정도면 발정 시 소변이 자궁으로 역류해 번식이 곤란함. 초음파에서 소변은 농보다 에코가 약하지만 섞여 있을 수 있고, 방광염이 같이 있을 수 있음.</li>
<li>요질은 경증이면 외자궁구 하단에 수 ml, 중증이면 외자궁구를 덮음. 자궁 주변 근육·인대가 느슨해져 생식기가 복강 쪽으로 처지는 것이 원인이고, 경증은 분만 후 근육량 회복으로 자연 치유되기도 함. 액면이 외자궁구보다 아래면 경과 관찰 가능하고, 요량이 많으면 번식에 쓰기 어려움. 이상 배출물은 질경이나 메트리체크로 실제로 보고 악취를 확인함.</li>
<li>질염은 농과 질벽 충혈이고 발정기 충혈보다 붉은기가 강함. 난산·태반정체·자궁염에 속발함. 초음파에서는 질강 안 에코성 물질과 점막 비후로 보임. 역성비누 온수나 생리식염수로 반복 세척함. 질염이 있어도 수정 시 위생 시스를 씌워 질 내용물이 자궁에 안 들어가게 하면 예후는 보통~양호임.</li>
<li>분만 시 질 내 손상이 있으면 중증 질염으로 가는 경향이 있음. 질 내 농이 반드시 자궁내막염을 뜻하진 않지만 염증이 자궁까지 번질 수 있음. 세척은 수일 간격으로 몇 차례 반복하고 중증이면 자궁내막염 처치를 병행함.</li>
<li class="hd">자궁내막염</li>
<li>자궁내막염은 외자궁구로 농이 나오면 임상형, 농이 안 보이면 잠재형임(사이토브러시로 확인). 발정은 정상인데 3회 수정해도 불수태면 의심함. 자궁 내 주입(항생제·요드제)이 1선택이고 심하면 생리식염수 세척임. 발정 발현과 수태율을 떨어뜨리므로 번식 개시 전 평가·처치가 중요함.</li>
<li>질에서 농이 보인 소 중 실제 자궁내막염은 36~38%였음. 확진은 사이토브러시 도말에서 PMN 5% 이상임. 분만 전후 BCS 2.75 이하와 고BHBA가 중요 위험 인자임. 자궁 내 주입은 항생제 또는 2.0% 요오드제 50~100ml를 자궁체부에 넣고 문질러 퍼뜨리고, 중증이거나 반복 주입에도 안 나으면 생리식염수 1~2L로 세척함.</li>
<li>자궁염·자궁내막염·자궁축농증은 임상형뿐 아니라 대부분의 잠재형도 초음파로 진단할 수 있음. 현장 초음파는 촉진으로 못 잡는 2mm 액체까지 보고 에코로 성질도 평가함. 대부분 자궁강에 에코성 농이 있고 밀도에 따라 연회색~밝은 백색임. 자궁내막염은 벽 비후와 액체가 함께 있고, 무에코 액체에 흰 반점이 섞이면 점액화농성임. 만성 잠재형은 소량의 고에코 액체임.</li>
<li>발정기 자궁강의 경면반사를 소량 농으로 오인하지 않게 주의함. 액체가 없을 땐 자궁내막·자궁경 두께 증가로 분만 후 자궁내막염을 평가함. 단 발정기에도 두꺼워지므로 양 난소와 자궁을 함께 봐야 함.</li>
<li class="hd">리피트 브리더</li>
<li>리피트 브리더는 발정주기·생식기가 정상인데 3회 이상 수정해도 수태되지 않는 소(또는 분만 후 150일 이후 미수태)임. 발생률 10~20%임. 원인이 다양해 단일 처치로 해결되지 않으므로 우군마다 유효한 방법을 찾음.</li>
<li>배란 지연형은 발정·배란은 되지만 발정 개시부터 배란까지가 보통 30시간인데 42시간 넘게 걸림. 발정이 1~2일 길게 이어지는 소에서 의심함. 수정 시 배란 전 난포를 확인하고 수정과 동시에 GnRH/hCG를 근주해 배란을 도움. 수태율 약 10% 상승임(무처치 32.1% vs GnRH 41.6%).</li>
<li>잠재형 자궁내막염에 의한 리피트 브리더는 배란 지연이 아닌데도 3회 이상 불수태면 의심함. AI 1일 후 배란 확인 시점에 0.5% 포비돈 요드제를 자궁 내 주입함. 항생제나 고농도 요드제보다 수태율 개선 효과가 높음.</li>
<li>위 처치로도 안 되는 진성 리피트 브리더는 배 발육 저하나 수정 장애를 생각하고 네 가지를 씀. 첫째 황체 보강으로, 수정 5일 후 hCG를 주거나 질내 P4를 넣음(특히 4회 이상 수정우). 둘째 자궁내막 기능 회복으로, E2+P4 변법(시작 시 E2를 5.0mg으로 올리고 P4를 7~9일 유치)으로 정시 AI함.</li>
<li>셋째 수정란 이식이나 추가 이식(Hitch-hike)임. 수정 7일 후 수정란을 하나 더 넣음. 넷째 배사멸 방지로, 임신 30일경 배사멸이 반복되는 소는 임신 확인 후 질내 P4를 2주 유치함.</li>
<li class="hd">자궁축농증·기타 자궁 병리</li>
<li>자궁축농증은 자궁강에 농이 차 있고 난소에는 황체가 남아 있는 상태임. 농이 자궁내막의 PGF2α 분비를 막아 황체가 안 죽음. 직장검사에서는 팽만된 자궁이 만져지고 벽이 얇게 느껴짐. 초음파에서는 불균일한 고에코 액체가 자궁 전체에 다량 보이고 자궁벽은 두꺼우며, 두드리면 입자가 떠올라 눈송이처럼 움직임. 임신 2~3개월과 감별해야 하는데, 태막 슬립이 없고 좌우가 대칭으로 부푼 점이 다름. PGF2α로 발정을 유도해 농을 배출시키는 것이 1선택이고, 잔류 농으로 재발하기 쉬워 배출 후 자궁 내 주입(항생제·요오드제)을 병행함. PGF2α에 반응 없으면 자궁 세척함.</li>
<li>농 양은 50ml~수십 L이고 외자궁구에서 농이 안 보이는 경우가 많음. 프로브로 누르면 저류물이 움직임. 농 배출 후 자궁 내 주입을 하면 치유가 빠르고, PGF2α에 반응하지 않으면 자궁 세척을 함. 재발이 잦아 끈기 있게 치료함.</li>
<li>점액자궁증은 임신이 아닌데 자궁에 무균성 액체가 다량 찬 것임. 액체는 무에코~약에코이고, 자궁내막은 두꺼워지지 않으며 벽 두께도 정상이고 난소 소견과 무관함. 배아가 없는지 꼭 확인함. 후보우에서는 처녀막이나 난관 부위의 선천 폐쇄와 관련됨.</li>
<li>림프육종은 자궁벽이 국소 또는 전체적으로 매우 단단하게 두꺼워진 것으로, 림프절 조직처럼 보임.</li>
<li>농양은 자궁축농증과 달리 자궁강이 아니라 자궁벽·자궁경·질벽 조직 안에 농이 피막에 싸여 갇힌 것임. 피막 때문에 단순 염증과 구별되고, 내강으로 통하지 않아 호르몬으로 배출시킬 수 없음. 자궁벽 농양은 임신 예후가 나쁨. 자궁경 농양은 경관이 막혔는지에 따라 다름. 질 농양은 교배나 분만을 방해하지 않으면 보통 문제없음.</li>
<li>기질증(공기질증)은 질 안의 가스가 reverberation 아티팩트로 보임.</li>
<li class="grp">자궁내막염 에코 3단계. 무에코 바탕에 흰 반점(cloudy)은 점액+고름 알갱이, 균일 회색은 점액화농성 삼출물, 벽과 비슷한 균일 고에코는 농밀한 고름임.</li>
<li>낭종 유형별 발정 양상. 난포낭종은 불규칙·사모광증, 황체화 난포낭종은 무발정 또는 약한 발정, 황체낭종·지속성 황체는 무발정, 공동성 황체는 정상 발정임. 황체낭종은 벽 3mm 초과·P4 1ng/ml 초과·거미줄 trabeculae이고 PGF2α로 치료함. 양쪽 난소에 다수 공동성 낭종이 있는 다낭성 난소는 예후를 보수적으로 봄.</li>
</ol></div>

<div class="modal-sub" style="margin:14px 0 6px;">진단 유의점</div>
<p class="rb-p">임상 증상만으로 원인을 특정하기 어려우므로 확진은 유산 태아나 선천 이상 송아지에서 병원체 또는 특이항체 검출로 한다. 병원체 분리·유전자 검출에는 되도록 신선한 재료를 쓰고, 바이러스 분리용 재료는 −80℃ 이하 보관, 동결·융해 반복을 피한다. 환경이나 다른 장기의 미생물 혼입을 막도록 신중히 채취한다.</p>
<p class="rb-p">선천 이상 송아지의 혈청 진단은 이행항체 영향을 피하려고 초유(초유제제 포함) 섭취 전 혈청이나 뇌척수액을 써야 한다. 초유를 먹은 개체는 항체로 확진할 수 없다. 모우·동거우 혈청 항체검사로 우군 내 만연 상황을 본다.</p>
<p class="rb-p">기록할 것: 임신 월령과 유산 태아 상태, 발생 연월일, 모우 연령·산력·백신 접종력, 사양관리, 농장 내 백신 접종 상황, 질병 발생 이력, 이동력과 도입원의 발생 상황. 사료·음수·분변·사육환경의 병원체 검출도 원인 규명과 방제에 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">아카바네·아이노·츄잔</div>

<p class="rb-p">아이노: 아카바네와 비슷하나 소뇌형성부전이 많다 → AH·CH 증후군. 태반 통과능이 낮아 유행이 작다. 중화시험에서 아카바네와 교차 없음.</p>

<div class="modal-sub" style="margin:14px 0 6px;">BVD</div>
<p class="rb-p">항체 없는 임신우가 감염되면 수직 감염으로 유사산·선천 이상(수초 형성부전, 소뇌형성부전, 내수두증, 공뇌증, 백내장·망막위축, 체형 이상 없음). 면역 기능이 성숙하는 태령 100일 정도 이전 감염은 면역관용으로 지속감염우(PI우)가 되어 평생 배출한다.</p>

<div class="modal-sub" style="margin:14px 0 6px;">네오스포라</div>

<p class="rb-p">캄필로박터(C. fetus subsp. fetus 태반 친화성 강함): 임신 중기(태령 4~7개월). 태반, 태아 제4위·소장·맹장 내용물 배양, 형광항체, PCR. 백신 없음, 종모우 세균검사·도태, 암소는 항균제·자궁 세정.</p>

<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('search',16)} 임신감정 — 초음파 임신감정·태령·생존성·쌍태·성별</div>
<div class="rb-block"><ol class="rb-list">
<li>임신은 21일 이전엔 휴지기와 비슷하고, 21~23일 소량 액체, 24일까지 배아 보기 어려움, 자궁내막은 발정기처럼 두꺼워지지 않고 경면반사가 적음.</li>
<li>초음파 임신감정은 이론적으로 교배 후 21일이면 가능하나 현장에선 비실용적임. 숙련 검사자 시험에서 성우 24일의 음성예측도는 89%였고(미임신 진단의 11%가 32일 재검 시 임신), 26일엔 공태의 99%를 올바로 식별함. 후보우는 24일에 같은 수준임.</li>
<li>26일 vs 28일의 차이가 큼. 26일 배아는 자궁벽 대비 보기 어렵고 28일 배아는 길이 1cm로 자궁액 안에서 쉽게 보임. 며칠만 기다려도 정확도·속도가 오름. 단 조기 검사가 즉각적 관리 결정으로 이어지지 않으면 가치가 없음.</li>
<li>황체의 유무·위치를 알면 검사가 빨라짐. 황체 두 개는 쌍태 가능성, 배아와 반대쪽 황체는 임신 손실 고위험, 작거나 질 나쁜 황체는 낮은 P4를 시사함. 공동성 황체는 공동이 너무 크고 가장자리가 너무 작아 전체 부피가 낮은 경우가 아니면 우려할 필요 없음. 질 나쁘거나 반대쪽 황체는 GnRH로 부황체를 만들어 P4를 개선할 수 있음.</li>
<li>60일 이전 임신 진단은 태반 형성 완료 후 재검해야 함. 비유 젖소는 태반 형성 전 60일 이전 손실이 임신 후보우의 약 3.6배이고 최초 진단일부터 90일까지 10~12%임. 가설은 고산유 P4 저하, 분만 후 질환, 특정 정액, 쌍태, 열 스트레스임.</li>
<li>초음파는 약 120일까지 태령 추정에서 직장촉진보다 훨씬 우수함. 액체량이 아니라 배아·태아 크기 자체를 재기 때문이고 크기는 기온·품종과 무관하게 일관됨. 구조물을 직접 재서 태령 차트에 대응하거나 발달을 시각 평가함.</li>
<li>측정 부위는 체간 직경(배꼽 높이 흉곽 최대폭), 뇌두 직경(눈 바로 뒤 두개골 최대), 머리 길이(두정~코끝), 두정-둔부 길이 CRL(미근부~두정)임. 약 50일까지는 배아·태아 길이(mm)+18=태령(일)이고, 그 이후나 다른 측정은 태령 차트·소프트웨어가 필요함.</li>
<li>120일 이후는 부정확함. 도달·측정이 어렵고 개체 변동이 시작됨. 안구·태반분엽·자궁동맥은 변동이 너무 커 부적합임.</li>
<li>구조물 출현 시기(평균/범위 일)는 배아 본체 20.3(19~24), 심박동 20.9(19~24), 요막 23.2, 척수·앞다리 싹 29.1, 양막 29.5, 안와 30.2, 뒷다리 싹 31.2, 태반분엽 35.2(33~38), 갈라진 발굽 44.6, 태동 44.8, 늑골 52.8임. 현장에선 범위 상단에서 가장 쉽게 보임.</li>
<li>태아 심박동은 약 24일부터 보이고 초기 최소 130bpm에서 60일까지 약 190bpm임. 심박동이 안 보이나 나머지가 정상이면 소·태아 움직임 탓일 수 있으니 재검함.</li>
<li>양수·융모요막액은 최소 70일까지 맑고 무에코임. 70일 이전 혼탁에 심박동 없음이면 배아·태아 사망임. 사망 시 분리된 융모요막이 임신액에 떠 보일 수 있음. 70일 이후엔 정상도 혼탁이 가능하나 태동으로 확인함.</li>
<li>사망 태아는 골격과 안 맞는 고에코 영역·복강 액체가 보임. 미라는 에코성 뼈 잔해, 자궁내액 결여, 태동·심박동 결여임.</li>
<li>PGF나 황체 퇴행이 없으면 사망 배아·태아는 수 주 잔존하고 막슬립·양막낭 같은 주징후가 여전히 촉진됨. 초음파로 빠르게 식별해 PGF로 치료하면 대부분 48시간 내 완전 배출됨.</li>
<li>사망 전 곤란 징후는 130bpm 미만 심박수(재평가), 살아있는 태아의 융모요막 경미 분리·비정상 액체(추적), 예상보다 작은 살아있는 태아(보통 교배일 오기), 반대쪽·질 나쁜 황체(재검)임.</li>
<li>고산유 젖소와 일부 육우 계통에서 쌍태율이 높고, 젖소는 낭종성 난소 이력 소에서 위험이 더 높음. 쌍태는 임신 손실, 난산, 분만 전후 질환, 번식 성적 저하, 프리마틴, 조기 도태 위험을 높임.</li>
<li>그래도 유산은 보통 권장하지 않음. 다른 임신 실패나 또 다른 쌍태 가능성 때문에 모니터·관리가 나음. 임신 손실 검사, 조기 건유, 고에너지 사료, 분만 모니터·조산, 대사 질환 경계임. 그래서 어느 소가 쌍태인지 아는 게 중요함.</li>
<li>직장촉진은 부정확하고 세심한 초음파가 대부분 식별함. 소 쌍태의 95% 이상이 이란성이라 난소에서 황체 2개를 확인함. 황체 두 개 임신우의 50~60%가 쌍태이고 셋 이상이면 세쌍둥이를 고려함. 전체 자궁을 체계적으로 따라가 단일 태아를 두 번 세지 않게 함. 유일한 주징후는 두 태아의 존재임.</li>
<li>쌍태선(twin line)은 두 융모요막이 합쳐지는 부위임. 태아를 안 둘러싸고 멀어져 양막낭과 구별되고, 45일 이전엔 안 보이며 제대와 혼동 주의임. 쌍태는 단태보다 액체가 많고 골반 입구를 더 일찍 넘음.</li>
<li>쌍태(특히 동측)는 첫 60일에 손실률이 단태의 3.1~6.9배임. 반대쪽은 임신 중기에 더 잘 일어날 수 있음. 자연 감소는 후기 배아·초기 태아 단계에 흔하고 쌍태의 8~24%가 단태로 감소함. 황체 감소는 흔히 배아 감소 자궁각과 동측 난소에서 일어남. 수기 감소는 미미하게만 성공함.</li>
<li>태아 성별은 생식결절(GT, 수컷은 음경, 암컷은 음핵)의 상대 위치로 55일부터 판정함. GT는 수컷에서 제대 바로 뒤, 암컷에서 꼬리 바로 아래임. 약 80일까지 고에코 이엽 구조로 보이고, 70일 이후 포피·외음부 피부가 덮기 시작해 80일이면 밝은 이엽 양상이 줄어듦.</li>
<li>이상적 시기는 60~80일임. 태아 도달이 쉽고, 구조 위치를 잡을 만큼 작고, GT가 피부에 안 가려짐. 90일 이후엔 자궁이 골반을 넘어 도달이 어려울 수 있음.</li>
<li>음낭(세 밝은 선)이나 유두(밝은 점)만으로 진단은 비권장임. GT·음경·외음부를 봐야 함. 유두가 음낭과 닮을 수 있음. 크고 구불구불한 제대 뒤가 수컷 GT 영역이고, 무에코 반추위·제4위도 그 영역이며, 흉곽 V자로 두미측을 식별함.</li>
<li>가장 흔한 오류는 생식 구조가 체벽에서 얼마나 돌출하는지 인식 못 해 생김. 너무 일찍 멈추지 말 것. 60일이면 제대~수컷 GT, 암컷 GT~미근부 사이 틈이 거의 없어 느리고 작은 움직임이 결정적임.</li>
<li>오인 사례는 다리가 제대를 가림, 횡단면 뼈가 GT를 닮음, 제대 경면반사가 수컷 GT로, 꼬리 횡단면이 암컷 GT로 보이는 것임. 의심되면 제대·회음부 양쪽을 다 검사함.</li>
<li>배아·태아 기형은 드물지만 중요함. 모니터링·유산·분만 대비가 바람직할 수 있음. 대부분 약 50~90일에 가장 잘 보임.</li>
<li>무배아 낭종은 양막낭 밖 35일 배아임. 심박동 있어도 거의 생존 못 함. 내반체는 체강 밖 액체 충만 태아 위, 척주가 심히 굽어 V자임. 태아 복수는 복강 내 액체이고 액체 고인 사망 태아와 감별함. 전신부종은 피부 아래 액체임.</li>
