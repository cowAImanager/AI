<div class="bx"><p class="bx-num"><span class="bxn">2.</span><span>되먹임 회로</span></p><svg class="rb-cyc" viewBox="0 0 380 236" width="380" height="236" style="max-width:100%;height:auto;display:block;margin:2px auto 0"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><path d="M209.8,48.8 A72,72 0 0 1 249.7,77.7" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><path d="M262.0,115.5 A72,72 0 0 1 246.7,162.3" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><path d="M214.6,185.7 A72,72 0 0 1 165.4,185.7" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><path d="M133.3,162.3 A72,72 0 0 1 118.0,115.5" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><path d="M130.3,77.7 A72,72 0 0 1 170.2,48.8" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/><text x="190.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-size="12.5" fill="currentColor">시상하부 KNDy 뉴런</text><text x="273.7" y="90.8" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="currentColor">GnRH pulse</text><text x="241.7" y="189.2" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="currentColor">뇌하수체 전엽 LH·FSH</text><text x="138.3" y="189.2" text-anchor="end" dominant-baseline="middle" font-size="12.5" fill="currentColor">난포 성장·배란</text><text x="106.3" y="90.8" text-anchor="end" dominant-baseline="middle" font-size="12.5" fill="currentColor">E2·P4</text></svg><p class="bx-num"><span class="bxn">3.</span><span>KNDy 뉴런 = 시상하부 궁상핵의 키스펩틴 신경세포, GnRH pulse의 pacemaker<br>키스펩틴 · 뉴로키닌B · 다이노르핀을 같이 분비<br>이 회로를 통해 영양·대사 신호가 GnRH 분비에 반영됨(렙틴 → 영양·관리 탭)</span></p><p class="bx-num"><span class="bxn">4.</span><span>저영양 신호(포도당 부족·케톤체)를 제4뇌실 주위에서 감지 → 다이노르핀 뉴런 활성화 → 키스펩틴 ↓ → GnRH pulse ↓ → 번식 정지<br>성숙 암소 : 2~3일 절식에도 LH pulse 빈도 변하지 않음<br>사춘기 전 미경산우 : 48~72시간 절식에 pulse 감소<br>만성 사료 제한 : GnRH pulse 빈도·진폭 모두 감소, 뇌하수체 LH·GnRH 수용체 합성 감소<br>→ 사춘기 시점과 분만 후 발정 재개가 영양 상태에 좌우되는 이유</span></p><p class="bx-num"><span class="bxn">5.</span><span>시상하부를 흔드는 외부 요인 : 광주기 이탈, 열스트레스(최적 3~24℃ 벗어남), 배고픔·갈증·이동·운송, 착유 시간·서열·사료 시간 같은 사육 관리 변화</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">6.</span><span>발정 당일 = 0일. 주기 평균 21일, 실제 범위 17~24일이고 난포파가 2개인 소는 19~20일, 3개인 소는 22~23일에 발정이 옴. 같은 소도 매번 1~2일씩 달라짐.</span></p>
<p class="bx-num"><span class="bxn">7.</span><span>현대 고능력 착유우는 평균보다 하루 정도 길어졌을 가능성이 있어 수정우는 25~26일까지 재발정을 확인함.</span></p><p class="bx-num"><span class="bxn">8.</span><span>FSH가 일시적으로 오르면 작은 난포 여러 개가 함께 자라기 시작함. 이것이 난포파의 출현. LH surge에 딸려 나오는 FSH surge는 난포파를 못 띄우고, 발정 24시간 후부터 다시 오르는 두 번째 FSH 상승이 1차 난포파(발정 후 1.8일)를 띄움</span></p><p class="bx-num"><span class="bxn">9.</span><span>난포 안에서는 두 세포가 일을 나눔.<br>내협막세포(바깥) : LH 자극 → 콜레스테롤에서 안드로겐 합성<br>과립막세포(안쪽) : FSH 자극 → 안드로겐을 E2로 전환, FSH가 LH 수용체 발현도 유도<br>→ E2를 충분히 만들려면 LH와 FSH가 협력해야 함</span></p><p class="bx-num"><span class="bxn">10.</span><span>자라는 난포들이 분비하는 E2와 인히빈이 FSH를 낮춤. 첫 이틀은 작은 난포들의 인히빈 A가, 그 뒤로는 우성 난포의 E2가 낮춤. FSH는 난포파 출현 4일 뒤 최저를 찍음. 낮아진 FSH에서도 버티는 난포 하나가 우성 난포로 선발되고 나머지는 퇴화. 성장 속도가 갈라지는 이 현상이 deviation.</span></p>
<p class="bx-num"><span class="bxn">11.</span><span>우성 난포는 자라면서 FSH 의존성이 줄고 LH 의존성이 커짐. 8mm 무렵 과립막에 LH 수용체를 갖추게 되는데 LH 수용체를 얻은 우성 난포만 FSH가 낮아져도 LH로 계속 자라며 E2를 분비.</span></p><p class="bx-num"><span class="bxn">12.</span><span>우성 난포의 우성 기간이 끝날 무렵(배란하거나 성장이 멈춘 뒤) FSH가 다시 올라와 다음 난포파 12~24시간 전에 정점에 이름. 기존 우성 난포를 GnRH로 배란시켜 없애면 FSH가 다시 올라 투여 1.5~2일 후 새 난포파가 나옴. 오브싱크 첫 GnRH의 원리임.</span></p>
</div>
<div class="bx"><p class="bx-num"><span class="bxn">13.</span><span>배란이 끝나면 E2가 뚝 떨어지고, 빈 난포의 세포가 황체로 바뀌어 P4를 만들기 시작함. 배란 8일쯤 뒤 최고에 이름.</span></p><p class="bx-num"><span class="bxn">14.</span><span>황체 형성엔 LH pulse가 필수임. 주기 전반(7일 이전)의 고빈도 pulse가 황체를 키우고, P4가 오르면 pulse가 줄며 황체가 유지됨. 주기 1~3일은 P4가 낮아 자궁 수축이 남아 있을 수 있음.</span></p><p class="bx-num"><span class="bxn">15.</span><span>P4는 LH pulse를 4~6시간에 한 번으로 억제 → 우성 난포 성숙과 배란 억제<br>P4는 GnRH 양이 아니라 pulse 빈도를 조절<br>E2 음성 되먹임은 P4에 부가적이며 황체기에는 P4 억제를 강화함</span></p><p class="bx-num"><span class="bxn">16.</span><span>P4는 E2 양성 되먹임도 차단 → 황체기엔 E2가 높아도 LH surge 없음<br>이 억제는 용량 의존적이라 P4가 어중간하게 낮으면 LH 억제가 풀려 우성 난포가 멈추지도 배란하지도 못한 채 계속 자라 낭종화</span></p><p class="bx-num"><span class="bxn">17.</span><span>P4는 높을 때 surge를 막기만 하는 게 아님. 황체기 동안 P4에 한동안 노출돼 시상하부·뇌하수체가 미리 길들여져 있어야, 나중에 P4가 빠졌을 때 surge가 크게 터지고 발정 행동이 나오며 그 뒤 황체기가 정상 길이가 됨. 이것이 priming. P4 전처치가 E2에 대한 중추·뇌하수체 반응성을 높여 두는 것으로 봄. 즉 surge에는 P4가 깔렸다가 빠지는 두 박자가 필요함.</span></p><p class="bx-num"><span class="bxn">18.</span><span>난포낭종은 황체가 안 생겨 P4가 쭉 낮으니 priming이 빠짐. E2가 있어도 surge가 불발되고 난포가 계속 커짐. 빠진 priming을 질내 P4 제제로 채우는 것이 사춘기 유도와 낭종 치료. 동기화는 P4를 넣었다 빼며 이 두 박자를 인위로 재현하는 것.</span></p><p class="bx-num"><span class="bxn">19.</span><span>혈중 P4는 황체 크기와 비례. 직장검사·초음파에서 황체 크기로 P4를 가늠.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">20.</span><span>P4는 자궁근 수축을 억제해 임신 내내 자궁을 정지시키는데 분만 전 P4가 떨어지면 해제됨.<br>자궁내막 분비선을 자극해 자궁유를 내어 착상 전 배아에 영양을 공급.<br>수정 후 초기 P4가 높을수록 영양막이 잘 자라고 인터페론 타우가 늘어 수태율이 오름.<br>소는 약 200일까지 황체가 P4를 책임지므로 초기 임신은 전적으로 황체에 달려 있음. 그 뒤 태반 P4가 보태지지만 마지막 4~6주는 태반 P4가 줄어 다시 황체 의존이라 임신 내내 황체가 필요함.</span></p><p class="bx-num"><span class="bxn">21.</span><span>P4는 자궁경관 점액을 끈끈하게 해 이물이 들어오는 것을 막음. E2는 반대로 경관을 이완.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>자궁내막이 P4에 10~12일쯤 노출되면 내막의 P4 수용체가 줄어 P4에 대한 민감도가 떨어지고 억제가 풀림. 그제서야 E2가 옥시토신 수용체를 늘릴 수 있어 주기 후반이 되면 PGF2α를 충분히 냄. 1차 난포파의 E2는 수용체를 준비만 시키고, 2차 난포파의 E2에서 수용체가 급증함.</span></p><p class="bx-num"><span class="bxn">23.</span><span>주기 16~17일경 늘어난 자궁내막의 옥시토신 수용체에 옥시토신이 결합하면 자궁내막에서 PGF2α가 pulse로 터짐. PGF2α는 자궁정맥에서 난소동맥으로 직접 넘어가는 국소 역류 경로로 고농도가 되어 황체를 무너뜨림.</span></p><p class="bx-num"><span class="bxn">24.</span><span>황체 퇴행 스위치가 켜지면 P4는 12시간 전후로 1.0ng/ml까지 떨어지지만 황체 크기 축소는 1~2일 뒤에야 뚜렷해짐. 기능적 퇴행이 형태적 퇴행보다 빠름.</span></p><p class="bx-num"><span class="bxn">25.</span><span>황체용해로 P4가 떨어지면 LH pulse가 시간당 한 번 이상으로 잦아지고 우성 난포를 성숙시켜 E2를 끌어올림. 이 pulse 빈도의 변화가 발정주기를 굴리는 핵심 스위치.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">26.</span><span>E2가 낮거나 중간 → 음성 되먹임 → GnRH·LH pulse 억제(궁상핵의 KNDy 회로에서 일어남)<br>우성 난포가 자라 E2가 역치를 넘어 유지 → 되먹임의 부호가 뒤집힘. 양성 되먹임(시삭전야·뇌실주위 키스펩틴 뉴런이 활성화되며 일어남) → GnRH 대량 방출 → LH surge, 단 이 양성 되먹임은 P4가 낮게 깔려 있어야 작동함.</span></p>
<p class="bx-num"><span class="bxn">27.</span><span>E2는 뇌하수체 GnRH 수용체 발현도 높여 난포기 후반 반응성을 올림. 자연 LH surge는 완만하고 충분히 오래 작용하지만 GnRH 유도 surge는 지속·강도가 부족할 수 있어 LH 수용체가 부족한 어린 난포에선 배란 대신 황체화만 일어날 수 있음.</span></p><p class="bx-num"><span class="bxn">28.</span><span>E2가 발정 12~18시간 전에 역치를 넘으면 GnRH surge → LH surge. LH surge의 시작 = 대개 발정 시작과 맞물리고 = E2는 발정 개시 시점에 최고조 → 발정 행동</span></p><p class="bx-num"><span class="bxn">29.</span><span>E2는 자궁 내 pH를 바꿈. 발정 12시간 전 7.0, 발정 개시 6.7, 배란 직전 다시 7.0이며 이 저하가 정자 생존을 연장한다고 봄.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">30.</span><span>자연발정에서는 발정 시작 24~30시간 후, GnRH로 유도하면 약 30시간 후(경산 28~30, 미경산 26~28)에 배란함. 인공수정 적기를 따질 때 이 30시간이 기준점임.</span></p><p class="bx-num"><span class="bxn">31.</span><span>LH surge 피크는 배란 약 24시간 전, E2 피크는 surge 피크 3~9시간 전임. surge 후 E2는 빠르게 떨어져서 배란 직전엔 외음부 종창·충혈과 자궁 수축이 약해지는 소가 있음. 이때 AI 의뢰로 직장검사를 하면 징후가 약해 망설이게 되지만, 배란 직전이라 징후가 약해도 수정 적기임.</span></p><p class="bx-num"><span class="bxn">32.</span><span>발정우는 저P4·고E2라 자궁의 옥시토신 감수성이 올라가 있음. 직장검사로 만지면 자궁이 꽉 수축하거나 milk let-down이 비치는 반면 황체우는 그렇지 않은 이유.</span></p><p class="bx-num"><span class="bxn">33.</span><span>배란이 끝나면 다시 황체기가 됨. 임신이 되면 PGF2α가 막혀 황체가 유지되고, 안 되면 16~17일에 다시 황체용해.</span></p><p class="bx-num"><span class="bxn">34.</span><span>LH를 한 줄로 정리하면 pulse는 성장, surge는 배란. pulse 빈도는 P4가 좌지우지.<br>P4 하강 → pulse 빈도 상승 → 우성 난포 성숙 → E2 상승 → 시상하부 감지 → surge → 배란.<br>P4 상승 → pulse 빈도 저하 → 우성 난포 성숙 차단 → surge 차단.</span></p></div>
<div class="bx"><div class="ibx"><p class="bx-num"><span class="bxn">35.</span><span>GnRH 제제<span class="hang">surge를 대신 터뜨림. 투여량·성분에 관계없이 투여 2시간에 LH 피크, 5~6시간에 기저치.</span><span class="hang">배란은 투여 약 30시간 후(경산 28~30, 미경산 26~28). 산차·분만 후 일수·유량에 영향 없음. 36시간 지나도 배란 없으면 배란 가능한 난포가 없거나 surge 부족.</span><span class="hang">동시에 난포 모집이 일어나 투여 1.5~2일 후 새 난포파.</span><span class="hang">LH 피크를 낮추는 조건에서는 증량</span><span class="hang hang3">혈중 P4가 높을 때(황체기 투여) — 고나도렐린 100μg이면 피크가 뚜렷이 낮고 배란율 75%, 200μg이면 91%(P4 낮으면 용량 무관 90% 이상). 기본 100μg, 반응 나쁜 개체는 200μg.</span><span class="hang hang3">체중이 클 때 — 같은 용량에 피크 낮아질 수 있어 증량 고려.</span><span class="hang hang3">고온 스트레스 — LH·FSH 피크 모두 저하, 여름엔 증량이나 별도 처치.</span><span class="hang">경산우는 자연 발정 LH 피크가 미경산우보다 낮지만(10ng/ml 미만) GnRH를 주면 충분히 높아져 산차 영향은 적음.</span></span></p></div>
<div class="ibx"><p class="bx-num"><span class="bxn">36.</span><span>PGF2α 제제<span class="hang">발정 후 첫 5~6일은 PGF를 줘도 황체용해가 잘 안 됨. 수용체 부족 때문이라고 여겨졌으나 배란 2일 후부터 수용체는 있음. 이유는 불명확하나, 성숙 황체는 황체 옥시토신·TNF로 자궁내막 PGF 방출을 스스로 부르는 양성 되먹임 고리를 갖춰 PGF pulse가 반복되며 LH의 황체 유지 효과를 눌러 용해를 끝내는데, 어린 황체엔 이 고리가 없어 한 번 투여로는 안 무너진다고 봄. 실제 발정 4~5일째 아침·저녁 2회 투여로 93%(56/60)에서 용해·배란됨</span><span class="hang">현장 원칙은 이전 발정 6일 이내(발정 후 출혈 4일 이내) PGF 투여는 권장하지 않음</span><span class="hang">투여 12~24시간 후 황체용해, 24시간 후 P4 최저점, 48~72시간 후 발정.</span><span class="hang">발정까지 시간은 투여 시 우성 난포 크기에 좌우</span><span class="brg"><span class="brl">· 1차 난포파 우성 난포</span><span class="brb">{</span><span class="brr">15mm 이상 → 2일<br>10mm 전후 → 3~4일<br>폐쇄 직후(2차 난포파 출현기) → 5일 이후</span></span><span class="hang hang3">2차 난포파 우성 난포 10mm 전후 → 3~4일</span><span class="hang">황체 보유우에 무작위 투여하면 3일째 발정 49.8%, 4일째 14.1%.</span></span></p></div>
<div class="ibx"><p class="bx-num"><span class="bxn">37.</span><span>질내 P4 제제<span class="hang">황체기를 인위로 만듦. 넣어 두는 동안 LH pulse를 눌러 발정을 막고 priming을 채움.</span><span class="hang">제거 2~4일 후 발정이 옴.</span></span></p></div>
</div>
<div class="bx"><div class="ibx"><p class="bx-num"><span class="bxn">38.</span><span>옥시토신 : 시상하부에서 생성, 뇌하수체 후엽에 저장<span class="hang">유두 자극, 자궁·자궁경관의 기계적 자극 → 방출</span><span class="hang">평활근 수축이 주된 작용 : 유선포를 감싼 근상피세포를 수축시켜 고인 유즙을 짜내는 milk let-down을 일으킴. 생산은 프로락틴, 내보내기는 옥시토신. 자궁에서는 분만 진통·태아 만출·태반 배출을 돕고 교배 후 정자의 자궁→난관 수송도 거듦.</span><span class="hang">자궁 감수성은 E2가 높으면 오르고 P4가 높으면 내림</span></span></p></div>
<div class="ibx"><p class="bx-num"><span class="bxn">39.</span><span>인히빈 : 우성 난포의 과립막세포에서 나옴<span class="hang">FSH 억제 : 난포파 초기엔 작은 난포들의 인히빈 A가, 이후엔 우성 난포의 E2가 FSH를 누름. 인히빈은 소에서 A형이 주이고 B는 1/10이라 소는 인히빈 A를 주로 봄. 인히빈 합성·방출은 FSH가 촉진함</span></span></p></div>
<div class="ibx"><p class="bx-num"><span class="bxn">40.</span><span>AMH : 전포상·초기 포상난포의 과립막세포에서 나오는 TGF-β 계열 호르몬<span class="hang">배아 발생기에 뮬러관 형성을 억제하는 호르몬</span><span class="hang">임상에서는 혈중 AMH가 난소의 포상난포 수를 그대로 반영한다는 점을 이용. AFC(3mm 이상 난포 수) 15 이하/16~24/25 이상에 따라 AMH도 낮음/중간/높음이고, 주기 단계에 거의 영향이 없어 아무 때나 한 번 채혈해도 난소 예비능을 가늠할 수 있음. AMH가 높을수록 과배란 반응이 좋아 회수 난자·수정란 수가 많음.</span><span class="hang">사양·영양·혈통에 따라 과배란 반응이 달라 AMH 하나로 단정하긴 어려움.</span></span></p></div>
<div class="ibx"><p class="bx-num"><span class="bxn">41.</span><span>프로락틴 : 뇌하수체 전엽 락토트로프에서 분비, 도파민이 억제, TRH·VIP가 촉진<span class="hang">E2·P4·성장호르몬·갑상선·부신피질 호르몬과 협동해 유선 발육, 유즙 생산 자극.</span><span class="hang">분만을 전후한 하루 동안 혈중 프로락틴이 한 번 크게 솟았다가 내려옴(GH는 분만 2일 전부터 올라 분만 후에도 유지됨). 이 급등을 막아 버리면 그 뒤 젖이 잘 안 나오기 때문에, 이 급등이 젖 생산을 시작하라는 신호로 여겨짐.</span><span class="hang">개, 고양이, 설치류에서는 프로락틴이 황체를 유지해 주지만 소는 프로락틴을 억제해 봐도 LH, P4, 황체기 길이, 발정기 E2 어느 것도 변하지 않음. 소의 발정주기에 프로락틴은 관여하지 않는다고 봄.</span></span></p></div>
</div>
<div class="bx"><p class="bx-num"><span class="bxn">42.</span><span>영양이 사춘기를 여는 신호<span class="hang">사춘기 개시는 박동성 LH(황체형성호르몬) 분비 빈도 증가와 관련되며, 에너지 섭취 증가는 박동성 LH를 자극하고 감소는 억제한다.</span><span class="hang">사춘기 지연은 낮은 IGF-1(인슐린유사성장인자) 농도와 동반된다. 난포막세포·과립막세포의 스테로이드 생성 능력은 각각 소마토트로핀·IGF-1 농도 증가와 관련되며, 성장호르몬방출인자에 면역시킨 후보우(3·6개월령)는 14개월령에 22%만 사춘기에 도달했다(대조 75%).</span><span class="hang">렙틴은 영양 신호 매개자다. 사춘기 전후 단기 절식은 렙틴 발현을 낮추고 인슐린·IGF-1·LH 박동을 함께 떨어뜨려 사춘기를 늦췄고, 반대로 혈청 렙틴은 사춘기 전 체중 증가와 양의 상관을 보였다.</span><span class="hang">다만 체지방이 최소 역치 이상이면 렙틴은 사료 변화에 크게 반응하지 않는다. 즉 사춘기에는 일정한 최소 체형이 필요하다.</span><span class="hang">사춘기는 체지방 비율과 양의 상관, 도체 수분 비율과 음의 상관을 보이며, 같은 골격이면 더 무거운 후보우가 먼저 사춘기에 든다. 사춘기 체중의 유전력은 0.40이다.</span></span></p></div>
</div>
</div>`;
}
function reproPubertyHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('leaf',16)} 사춘기 — 기전·연령·후보우</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>사춘기는 미경산우가 스스로 새끼를 밸 수 있게 되는 때다. 임상적으로는 첫 발정이 눈에 띄기 전에 이미 P4가 올라오기 시작하므로, 혈청 P4가 처음 1ng/ml를 넘는 날을 사춘기로 잡는다.<span class="hang">사춘기 전은 생후~사춘기 전후기 전까지, E2 음성 되먹임에 눌려 LH pulse가 낮은 시기</span><span class="hang">사춘기 전후기는 첫 배란 약 50일 전부터 첫 배란까지로 LH pulse가 늘어나는 시기</span><span class="hang">사춘기는 정상 황체기가 처음 확인되는 시점</span><span class="hang">사춘기는 보통 9~10개월이지만 6~24개월까지 폭이 넓고, 핵심 원리는 연령보다 체중의 영향을 더 받는다. 잘 먹여 빨리 키운 미경산우는 더 어린 나이에 도달하고, 같은 골격이면 더 무거운 쪽이 더 일찍 온다. 품종 효과는 이를 압도해, 성숙 체격이 큰 품종일수록 사춘기가 더 늦게 오고 그 시점 체중도 더 무겁다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>시기별 호르몬 변화<span class="hang">생후~3개월 : LH 일시 상승 → 난소 각성·난포 발달 시작. 이 상승이 빠를수록 사춘기도 빠름(생후 4~8주 GnRH 1일 2회로 앞당기면 6주 단축)</span><span class="hang">3개월~첫 배란 약 50일 전 : 시상하부–뇌하수체가 E2 음성 되먹임에 지나치게 민감해 난포가 낸 소량 E2에도 LH가 눌림 — 몸이 자랄 때까지 번식을 막는 장치</span><span class="hang">첫 배란 50일 전~첫 배란 : 성숙 체중의 55~60%에 이르면 시상하부가 E2에 둔감해져 LH pulse가 점점 늘어 첫 배란 무렵 시간당 약 1회 → 우성 난포 성숙 → E2 상승 → 첫 배란 직전 P4 두 차례 소폭 상승(약 300pg/ml)으로 priming → LH surge → 첫 배란</span><span class="hang">surge 능력 자체는 3~5개월령부터 있음. 사춘기를 막는 건 고빈도 LH pulse의 부재이고 그 부재는 E2 음성 되먹임이 만듦. FSH는 LH만큼 변하지 않아 허용적 역할, 프로락틴은 변화 없음</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>우성 난포 성장 속도는 2~8주령과 24~40주령에 가장 빠른데, 앞은 3개월령 LH 일시 상승, 뒤는 사춘기 전후기 LH pulse 증가와 맞물림. 난포파 간격은 2·8주령 8~9일에서 14주령 6.8일로 짧아졌다가 사춘기까지 다시 길어짐. LH가 낮은 시기엔 우성 난포가 오래 못 버텨 다음 파가 빨리 뜨고, LH가 늘면 우성 난포가 오래 살아 간격이 길어지는 것.</span></p><p class="bx-num"><span class="bxn">4.</span><span>첫 배란은 사춘기와 동의어가 아니며 첫 황체기는 보통 정상보다 짧다. 첫 배란은 대개 발정 없이 오고, 그때 생긴 황체는 며칠 만에 무너짐. 내막 옥시토신 수용체가 많아 PGF2α가 일찍 나옴, 수용체는 P4 12~14일 노출로 감소. 첫 황체가 P4를 며칠이라도 낸 뒤의 두 번째 배란부터 정상 주기(분만 후 첫 황체 단명과 같은 기전). 사춘기 직전의 P4 소폭 상승이 시상하부를 priming하므로 프로게스틴 처치가 사춘기를 앞당기고 동기화 수태율을 올림. "발정을 안 보였으니 미성숙"이라 단정하면 틀림.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>사춘기 연령에 영향하는 요인<span class="hang">영양 : 일당 증체가 클수록 사춘기가 빨라짐. 영양을 사춘기에 잇는 신호는 렙틴·키스펩틴. 생후 4~9개월의 영양이 시상하부-뇌하수체 축을 프로그래밍해 사춘기 시점을 결정하므로, 이 시기를 놓치면 나중에 잘 먹여도 그만큼 안 당겨짐 → 이유 전후 영양을 깎지 말 것</span><span class="hang">어미 : 어린 어미(처녀우)가 낳은 딸은 1년령 때 난포 수가 적어 난소 비축이 작으므로 후보우는 성숙한 어미의 딸이 유리. 임신 후기에 단백질을 보충받은 어미의 딸은 사춘기가 14일 빠름 — 태아기 영양이 딸의 번식에 영향</span><span class="hang">광주기 : 겨울은 늦추고 멜라토닌·일장 연장은 앞당김. 가을생이 봄생보다 빠름</span><span class="hang">수소 노출 : 양·염소·돼지와 달리 소는 영향이 없음</span><span class="hang">기질 : 예민한(보정틀에서 빨리 튀는) 소는 코르티솔이 높아 성장·사춘기 지연</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>사춘기를 앞당기는 방법<span class="hang">프로게스틴 : MGA 8일 또는 CIDR — priming을 가속하며, 조기 황체퇴행에 취약한 사춘기 전후 미경산우 동기화에 유효</span><span class="hang">영양 : 조기 이유 + 고농후사료로 300일령 이전 조숙성 유도 가능</span><span class="hang">이오노포어 : 모넨신 약 200mg/일 — 사료효율·증체를 높이고 사춘기를 앞당김</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>생식기 발달 : 난소는 체성장보다 2.7배 빠르게 자라고 난포 수는 4개월령 최대 후 8개월까지 감소. 관상 생식기는 7개월부터 급성장해 10개월령경 끝남.</span></p><p class="bx-num"><span class="bxn">8.</span><span>체중 목표 : 사춘기는 성숙 체중의 55~60%, 교배 목표는 약 65%(품종마다 다름). 목표체중까지 일당 증체 0.5~0.8kg. 56%까지만 키워도 65%와 최종 임신율·분만율 차이 없다는 연구도 있으나, 50% 아래면 후반 수태·경량 송아지 위험.</span></p><p class="bx-num"><span class="bxn">9.</span><span>교배 타이밍 : 사춘기 첫 발정에 수태하면 3차 발정 교배보다 분만율은 21% 낮고, 초회 수태율은 21~36% 낮다. 따라서 미경산우는 교배 예정보다 1~3개월 앞서 사춘기에 도달해 있어야 하고, 목표체중에는 시즌 시작 최소 3주 전 도달시켜 미리 주기를 돌게 한다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">10.</span><span>RTS(생식기 성숙도 점수) : 직장검사로 난소 난포 발달과 자궁각 긴장도·크기를 보고 1~5로 매기는 주관적 지표. 점수가 높을수록 인공수정 수태율과 양의 상관.<span class="hang">1 : 긴장도 없는 작은 자궁각 + 구조물 없는 작은 난소(유아형). 사춘기에서 가장 멀다</span><span class="hang">2 : 자궁각·난소가 더 커진 단계</span><span class="hang">3 : 자궁 긴장도와 난포가 만져져 주기 직전</span><span class="hang">4 : 자궁각이 꼬이고 배란전 크기 난포 존재(주기 도는 것으로 보되 황체는 잘 구별 안 됨)</span><span class="hang">5 : 거기에 황체까지 만져지는 단계</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>AFC(동난포 수) : RTS를 보완하는 선발 도구.<span class="hang">초음파로 양쪽 난소의 동난포를 합산하며 난소 비축(원시난포 수)을 반영한다.</span><span class="hang">유전·크기·나이·발정 단계 달라도 난포파 출현 시 한 개체 안에서 재현성이 높다.</span><span class="hang">AFC가 낮은 개체(총 &lt;15)는 작은 난소·낮은 임신율을 보였고(&gt;25 대비), 리피트 브리더 소도 동난포가 적다. 번식 전 가임성·수명 예측에 활용한다.</span><span class="hang">AFC가 높은 분만 후 젖소는 수태율이 더 높고 분만–수태 간격이 짧다.</span><span class="hang">반대로 임신 첫 1/3에 영양이 제한된 어미의 송아지는 AFC가 60% 낮게 태어나 딸의 평생 가임성에까지 영향이 간다.</span><span class="hang">미경산우(초산)의 암송은 경산우의 암송보다 1년령 AFC가 적어 성숙 어미의 암소 선발이 유리.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>사춘기 연령은 품종·계절·영양 수준의 영향을 받는데, 이유 전·후 성장률은 사춘기 연령과 역상관이고 이유 후 성장률은 영양 수준에 비례한다. 첫 분만을 23~24개월령에 맞추려면 12~13개월령까지 사춘기에 도달시켜 14개월령 교배 전 한두 번의 정상 발정 주기를 거치게 한다.<span class="hang">홀스타인 후보우를 체중 100 kg부터 하루 1.1 / 0.8 / 0.5 kg 증체로 급여했을 때 사춘기 연령은 각각 9 / 11 / 16개월이었다.</span><span class="hang">사춘기 전후 후보우에 영양 수준을 급격히 올리면 배란이 유도될 수 있다.</span><span class="hang">조기 이유 + 고농후사료로 조숙 사춘기를 유도한 후보우는 사춘기 시 체중이 유의하게 가볍다. 112일령 이유 후 126~196일령 동안만 고농후사료를 급여해도 연속 고농후 급여만큼 효과적이다.</span><span class="hang">높은 이유 전 성장률과 무거운 이유 체중은 이른 사춘기·사춘기 체중 증가와 연관된다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>사춘기 전 성장을 떨어뜨리는 모든 요인은 사춘기를 늦춘다.<span class="hang">단백-에너지 영양실조, 설사, 폐렴, 기생충, 혹독한 기후가 대표적이다.</span><span class="hang">내부 기생충은 위장관의 영양소 대사·흡수 능력을 떨어뜨려 증체율을 낮추므로 후보우 육성에 직접 영향을 준다.</span><span class="hang">내생균 감염 톨 페스큐를 먹은 소는 성장률·분만율이 낮고 사춘기가 늦어지며 황체 기능이 손상된다.</span><span class="hang">가을 출생 후보우가 봄 출생보다 사춘기가 빠른 계절 효과는 광주기 매개이며 영양 가용성 개선의 직접 결과가 아니다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>성장촉진 임플란트(E2·제라놀·TBA)를 포유 중 후보우에 투여하면 사춘기가 늦어진다. 출생 시 제라놀 투여는 사춘기 지연·자궁각 직경 감소·임신율 저하·유산 증가를 일으킨다. 3개월령 투여한 에스트라디올·프로게스테론 복합 임플란트는 4분만철까지 악영향이 없었다는 보고가 있지만, 후보우로 조기 선발된 개체는 임플란트하지 않는다.</span></p><p class="bx-num"><span class="bxn">15.</span><span>잔여 사료 섭취량(RFI, 예상 섭취량 대비 실제 섭취량 차이)이 높은 후보우는 체지방이 많고, RFI 1단위 증가마다 Bos taurus 후보우의 사춘기가 7.54일 단축됐다(Bos indicus 혈통은 무영향). 저RFI(사료효율 우수) 선발은 더 마르고 사춘기가 늦은 후보우 선발로 이어져 어느 지점부터 역효과를 낸다. 번식은 성장·산유보다 경제적으로 5배 중요하다.</span></p><p class="bx-num"><span class="bxn">16.</span><span>교배 전 목표체중의 근거<span class="hang">전통 권고는 첫 교배 시 예상 성숙체중의 60~65%다. 유전·성숙체중에 따라 목표체중을 정하고, 이유 체중·목표체중·교배까지 남은 일수로 필요한 증체율을 맞춘다. 보통 ADG(일당 증체) 0.5~0.8 kg/일, 영국계 품종은 총 약 91 kg 증체에 해당한다.</span><span class="hang">교배 전 318 kg(성숙체중 약 60%) vs 272 kg(약 50%): 사춘기가 빨랐고 교배 20일 임신율 39 vs 9%, 교배철 말 임신율 82 vs 66%.</span><span class="hang">55% vs 60%: 60%군이 교배 시 더 무겁고 BCS가 높았으며(6.0 vs 5.6, 5점 환산 ≈3.0 vs 2.8) 교배 전 주기율도 높았다(85 vs 74%). 그러나 45일 교배 최종 임신율은 차이가 없었고(88 vs 92%), 이후 3년간 유일한 차이는 55%군 송아지의 205일 보정체중이 더 컸다는 점이다.</span><span class="hang">즉 교배 전 목표체중에는 어느 정도 탄력이 있으나, 첫 분만 시에는 성숙체중의 80~85%에 도달해야 한다.</span><span class="hang">육우 후보우 육성비는 이유 시 기회비용 다음으로 큰 비용이며 대부분이 사료·노동·사육관리비다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>성숙체중 56% vs 65% 육성 비교(저질 조사료 + 단백 보충 방목 vs 사육장 집중 육성)<span class="hang">56%군: 옥수수 수확 잔사·휴면 겨울 목초 방목에 31% CP(조단백) 큐브를 주 3회, 0.45 kg/일 상당 보충.</span><span class="hang">AI 시점 사춘기 도달률 46 vs 88%로 크게 낮았지만, 첫 교배철 AI 수태율 58 vs 69%, 첫 교배철 임신율 92 vs 94%, 둘째 교배철 최종 임신율 84 vs 93%는 통계적으로 차이가 없었고 첫 21일 분만율도 같았다.</span><span class="hang">다만 50%까지만 키우면 교배철 후반 수태·가벼운 송아지 이유 위험이 커진다.</span></span></p></div>
</div>


<div class="modal-sub" style="margin:22px 0 6px;">번식기능의 발달 (일본송아지 5-1)</div><div class="rb-block">
<div class="modal-sub" style="margin:18px 0 6px;">번식기능의 발달</div>
<p class="rb-p">암송아지가 태어나서 임신할 수 있게 되기까지는, 생식이 가능한 생식기관으로 발달하고, 호르몬 분비가 순조롭게 이루어지는 생리적 상태에 도달하며, 임신을 지속하여 정상적으로 분만할 수 있는 체격이 되어야 한다. 육성 암소의 번식관리에서는 초산 월령을 의식하면서 소의 성성숙 시기나 체격에 유의하여 번식공용 시기를 평가하는 것이 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">춘기발동과 성성숙</div>
<p class="rb-p">동물은 일정한 월령으로 성장하면 시상하부·뇌하수체·성선 축이 기능하기 시작하여 이윽고 완성된다. 생식기능의 일부가 분명히 인정되게 되는 것을 춘기발동(puberty)이라 한다. 수컷에서는 정세관 내에 정자가 출현하는 시기를, 암컷에서는 초회 배란 시기를 춘기발동이라 한다. 암컷에서 춘기발동 시기를 정확히 포착하는 것은 어렵지만, 일반적으로는 황체의 형성이나 처음 나타나는 발정징후의 발현을 지표로 하는 경우가 많다. 동물은 어느 월령에 도달하면 번식활동기를 맞이한다. 암컷에서는 수컷과 교미하여 임신할 수 있게 되고, 수컷은 암컷과 교미하여 임신시킬 수 있게 된다. 이처럼 번식활동기를 맞이하는 것을 「성성숙(sexual maturation)에 도달한다」고 한다. 암컷에서는 춘기발동에 도달해도 발정주기는 안정되지 않으며, 성성숙에 도달한 뒤에 안정된 발정주기를 영위하게 된다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">성성숙에 영향을 미치는 요인</p>
<p class="rb-p">소의 성성숙은 다른 동물과 마찬가지로 체격의 성숙보다 먼저 일어나며, 성성숙에 도달하는 연령(월령)은 품종, 계통, 기후조건, 영양, 사양관리 등의 요인에 영향을 받는다. 특히 육성 중의 영양상태가 성성숙에 미치는 영향은 커서, 고에너지 사료로 사육한 소는 저에너지 사료로 사육한 소보다 빨리 성성숙에 도달한다. 일반적으로 젖소는 육우보다 성성숙에 도달하는 것이 빠르다고 한다. 암소의 성성숙 월령은 홀스타인이 9~11개월, 저지가 8개월, 헤리퍼드가 13개월 무렵, 흑모화종이 10~14개월로 되어 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">발정주기</div>
<p class="rb-p">소는 다발정동물로, 연중 발정주기를 반복한다. 발정주기는 발정기와 황체기, 혹은 난포기와 황체기로 크게 나뉜다. 황체기는 황체 초기, 황체 개화기, 황체 후기로 구분되는 경우도 있다. 발정부터 발정까지의 간격을 성주기 또는 발정주기라 하며, 발정일 혹은 배란일을 0일로 하여 센다. 소의 발정주기 길이는 품종, 연령, 계절, 사양환경에 따라 차이가 보이지만 18~23일로 평균 21일이다. 일반적으로 영양상태가 좋은 것은 길고, 불량한 것은 짧아지는 경향이 있다. 또한 미경산우(20.2일)의 발정주기는 경산우(21.3일)보다 1~2일 짧고, 젖소의 발정주기는 육우보다 긴 경향이 있다. 나아가 성성숙에 도달한 육성우와 경산우의 분만 후 초회 배란부터 다음 배란까지의 일수는 8~15일로 짧지만, 다음 발정주기는 정상적인 길이로 반복되게 된다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">난소, 난포 발육</p>
<p class="rb-p">소에서는 발정주기 중에 난포의 발육·퇴행이 2회 또는 3회 일어난다. 이 난포의 발육 및 퇴행은 파상적으로 일어나기 때문에 「난포파(난포발육파: follicular wave)」라고 불린다(그림 5-1-6). 하나의 난포파는 배란 직전에 직경 4 mm 정도의 여러 개의 새로운 소난포의 발육에서 시작된다. 한 무리의 난포 중에서 가장 발육이 진행된 난포의 직경이 약 8.5 mm에 도달하면 다른 난포의 발육은 정지하고, 이 최대 직경의 난포만이 발육을 계속한다. 이 선발된 난포는 「주석난포(dominant follicle)」라 불리며, 소난포의 발육을 촉진하는 난포자극호르몬(FSH)의 분비를 억제하는 인히빈을 분비함으로써 다른 난포의 발육을 억제한다. 선발된 주석난포는 난포벽에 황체형성호르몬(LH)의 수용체를 가지고 있어, LH의 일과성 대량 방출(LH 서지)에 의해 배란한다. 배란 후에 발육하는 주석난포는 발정주기 8~11일 무렵까지 발육을 계속하지만, 이 시기는 난소 내에 황체가 존재하는 황체기에 해당하며, 황체의 존재 하에서는 LH 서지가 일어나지 않기 때문에 이 주석난포는 배란에 이르지 못하고 폐쇄된다. 주석난포의 폐쇄에 따라 다시 여러 개의 새로운 소난포의 발육이 시작되어 새로운 난포파의 발현이 개시된다. 하나의 발정주기 내에 2회의 난포파(2난포파형)를 가진 소에서는 최초의 난포파(제1 난포파)는 배란 직전에 시작되고, 2회째 난포파(제2 난포파)는 발정주기 10일 전후부터 시작된다. 3난포파형의 소에서는 제1 난포파는 배란 직전에 시작되고, 제2 난포파는 발정주기 9일 전후부터, 제3 난포파는 발정주기 16일 전후부터 시작된다. 어느 난포파형에서도 최종 난포파의 주석난포가 황체 퇴행에 의한 황체호르몬 농도의 저하에 따라 발육·성숙하여 배란난포가 된다. 성숙한 배란난포는 발정기가 되면 급격히 발육하여 직경 12~24 mm에 도달하고 난소 표면에 융기한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-1-6 2웨이브 소에서의 난포의 발육·퇴행 및 배란. 가로축 발정주기(발정→발정), 세로축 난포의 크기. 발정 직후 소난포군에서 제1파가 발육해 주석난포가 되었다가 폐쇄·퇴행하고, 주기 중반에 제2파가 시작되어 그 주석난포가 다음 발정 시에 배란하는 모식도</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">난소예비능의 평가(동난포수 계측과 항뮐러관호르몬 측정)</p>
<p class="rb-p">난소예비능(ovarian reserve)은 난소가 가진 잠재적인 난소기능의 용량을 나타내는 지표이다. 난소의 기능은 수정 가능한 상태로의 난자 성숙과 성스테로이드호르몬의 생산으로 크게 집약할 수 있으며, 여기에는 난자, 과립막세포, 협막세포가 관여한다. 수태율 저하에는 여러 요인을 생각할 수 있지만, 난자의 양적·질적 저하도 한 원인이 된다⁹⁾. 난소예비능의 평가는 소의 장래 번식능력의 예측을 가능하게 한다¹⁰⁾.</p>
<p class="rb-p">항뮐러관호르몬(anti-Müllerian hormone: AMH)은 발육난포의 과립막세포에서 생산되는 당단백질로, 소에서 발육난포의 크기 마커로서의 가능성이 시사되고 있다. AMH의 혈중농도와 번식성적을 포함한 번식성, 과배란처치에 대한 난소의 반응성과의 관계가 보고되어 있다. 보고에 따라 기준치는 다르지만, 혈중농도가 높으면 번식성이나 과배란처치에 대한 반응성이 높은 결과로 나타나고 있다. 흑모화종에서는 기준치를 0.21 ng/mL(측정값의 평균값)로 하여, 혈중농도가 높은 군에서 과배란처치에 대한 반응성이 높다는 것이 보고되어 있다. AMH 농도 측정은 ELISA 키트로 이루어지기 때문에 농가에서 실시간으로 AMH 혈중농도를 측정하는 것은 곤란하다¹¹⁻¹⁴⁾.</p>
<p class="rb-p">동난포수(antral follicle count: AFC)는 초음파검사로 결정되며, 모든 발육단계의 난포 총수와 정의 관계가 있고, 직경 3 mm 이상의 난포수로 정의된다. AFC는 AMH와 마찬가지로 번식성적을 포함한 번식성, 과배란처치에 대한 난포의 반응성, 생체 난자 흡인에서의 흡인 난자수, 황체기능과 관련되어 있다. AFC는 발정주기의 어느 단계에서도 평가 가능하며, 농가에서 실시간으로 측정할 수 있다. AFC는 개체 내에서의 재현성이 높고, 개체차가 크다. 보고에 따라 기준치(동난포수)는 다르지만, 난소 중의 동난포수가 많으면 과배란처치에 대한 반응성이나 번식성이 높은 결과로 나타나고 있다. 육용 품종(외국 품종)에서는 AFC가 15개 이하인 군을 저AFC군, 25개 이상인 군을 고AFC군으로 한 경우, 고AFC군에서 과배란처치에 대한 난소의 반응성이 높은 결과가 얻어지고 있다. 또한 일본의 홀스타인에서는 11개 미만을 저AFC군(Low), 11개 이상 15개 미만을 중AFC군(Intermediate), 15개 이상을 고AFC군(High)으로 한 경우, 저AFC군과 비교해 고AFC군에서 분만부터 수태까지의 기간 중앙값이 작은 등 번식성적이 양호하다는 것이 보고되어 있다(표 5-1-1)¹⁵⁻¹⁹⁾.</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">황체 형성과 퇴행</p>
<p class="rb-p">배란 후의 배란 부위에는 황체가 형성된다. 황체는 황체세포와 모세혈관으로 채워진 실질성 조직으로, 배란 후 약 7일 정도에 성장을 완료하여 장경 20 mm 이상의 크기가 된다. 그 후 8~9일간 존속하며 황체호르몬을 분비한다. 수태한 경우에는 황체가 그대로 존속하여 기능하지만, 불수태인 경우에는 발정주기 16~18일 무렵부터 퇴행하기 시작한다. 퇴행 개시 후 황체의 크기는 서서히 작아지고, 혈중 황체호르몬 농도는 신속히 저하한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-1-7 운동장(숲속)에서의 스탠딩 행동(왼쪽)과 방목지(산림)에서의 발정행동(오른쪽). 흑모화종 사진</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">자궁</p>
<p class="rb-p">자궁은 성스테로이드호르몬(에스트로겐, 프로게스테론〈P₄〉)의 작용을 받는다. 발정기에는 에스트로겐의 작용에 의해 자궁내막의 충혈, 부종이 관찰된다. 또한 자궁 평활근은 수축운동성이 항진되기 때문에 직장검사 시의 촉진에 반응하여 강하게 수축한다. 황체기에는 P₄의 작용에 의해 자궁내막의 비후나 자궁선의 증식 등 착상을 향한 변화가 보인다. 황체기의 자궁은 부드럽고 이완된 상태로 촉지된다. 발정기에는 외자궁구가 충혈, 이완되고, 자궁경관부는 투명하고 부드러우며 견사성이 높은 경관점액을 다량으로 분비한다. 발정기의 경관점액을 슬라이드글라스에 도포하여 건조시키면 양치상 결정구조가 형성되며, 이 확인은 발정기 판정의 보조수단도 된다. 황체기에는 P₄의 작용에 의해 자궁경관은 가늘게 조여진 상태가 되고, 외자궁구는 점조하고 농후한 점액으로 봉쇄된다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">발정</p>
<p class="rb-p">교배를 위해 암컷이 수컷을 성적으로 허용하는 상태가 발정이며, 그때 보이는 특징적인 행동이나 외견의 변화가 발정징후이다. 발정기의 암소는 안절부절못하여 보행수나 발구르기 횟수 등의 상승, 식욕 감퇴, 채식의 산만, 포효 등의 특징적인 행동이 보인다. 또한 다른 소와 서로 음부의 냄새를 맡거나 허리 부위에 턱을 올려놓는 등의 동작도 보인다. 발정 암소는 다른 암소에 대한 승가(마운팅)나 다른 암소의 승가를 허용하는(스탠딩) 등의 특징적인 행동을 보인다(그림 5-1-7). 스탠딩 행동은 강한 발정상태를 나타내는 지표가 되므로 이 확인은 중요하다. 발정의 지속시간은 5~20여 시간으로 광범위에 걸치며, 개체차가 크고 연령이나 우군 규모에 따라서도 다르다. 외모의 변화로는 발정점액의 외음부로부터의 누출, 외음부의 종창, 충혈 등을 들 수 있다. 발정점액의 누출에서는 투명하고 부드러우며 견사성이 높은 점액이 외음부에서 길게 늘어져 있는 모습을 관찰할 수 있다. 황체기의 외음부는 표면에 잔주름이 보이고 긴축되어 있지만, 발정 1~2일 전부터 주름이 사라지고 종창하기 시작한다. 발정 시에는 종창의 정도가 항진되고, 질 점막이 충혈, 습윤해 있는 모습이 관찰된다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">배란</p>
<p class="rb-p">소의 배란은 발정 개시부터 약 28시간 후에 일어나는 것으로 되어 있지만, 그 범위는 20~45시간으로 큰 폭이 있어 개체에 따른 차이가 크다. 배란은 LH가 일과성으로 대량 방출되는 LH 서지에 의해 유발된다. LH 서지는 성숙한 배란난포에서 분비되는 다량의 에스트로겐에 의해 유도된다. 배란은 LH 서지의 약 25시간 후에 일어나며, 이 시간에는 개체차가 그다지 보이지 않는다. 이것은 성선자극호르몬 방출호르몬(GnRH) 제제를 이용하여 인위적으로 LH 서지를 유도하고 배란 유기를 꾀하는 경우에, GnRH 제제 투여부터 배란까지의 시간에 편차가 적다는 것, 호르몬 처치에 의해 배란 타이밍을 제어할 수 있다는 것을 나타낸다. 배란에 이르는 난포의 크기는 직경 15~24 mm로, 통상 1개의 난포가 배란하지만 2개 배란하는 소도 있다. 젖소는 육우에 비해 2개 배란의 비율이 높다. 특히 젖소의 경산우로 유량이 많은 소는 2개 배란의 비율이 높아 8~10%의 소가 2개 배란한다. 그 결과 쌍둥이를 임신하는 비율도 높아진다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">수정</div>
<p class="rb-p">정자와 난자가 만나 접합자(zygote)를 형성하기까지의 과정을 「수정(fertilization)」이라 한다. 수정은 난관팽대부에서 일어나기 때문에 정자는 난관까지 이동해야 한다. 자연교배로 질 내에 사정된 정자는 암컷 생식도(질, 자궁경관, 자궁, 난관)의 수축운동 등에 의한 수송과 정자 자신의 운동성에 의해 난관협부에 도달하여 배란까지 저류된다. 정자가 난관협부에 도달하기까지의 시간은 자연교배로 질 내에 사정된 경우는 6~8시간, 인공수정(AI)으로 자궁 내에 주입된 경우는 2~3시간을 요한다. 정자는 난관협부에서 18~20시간 저류된다. 정자는 암컷의 생식도 내를 통과하는 동안 4~8시간에 걸쳐 생리적, 기능적으로 변화하여 수정 가능한 능력을 획득한다. 이 변화를 「수정능 획득(capacitation)」이라 한다. 소 정자의 수정능력 보유시간은 24~48시간이다. 배란된 난자는 난관채에 부착하여 난관채의 융모운동에 의해 난관 내로 들어간다. 난관에 들어간 난자는 난관 내에서 난관상피의 융모운동이나 난관의 수축, 이완 등의 운동에 의해 난관팽대부로 이송된다. 배란된 소 난자의 수정능 보유시간은 10~12시간이다. 난관협부에 저류되어 있던 정자는 배란이 일어나면 난관팽대부로 이동한다. 난관팽대부에서 난자와 만난 정자는 난자를 둘러싸고 있는 투명대에 결합한다. 정자가 투명대에 결합하면 정자의 세포막과 첨체외막이 부분적으로 융합하여 포상화되고, 첨체 내의 효소가 방출된다. 이것은 「첨체반응(acrosome reaction)」이라 한다. 정자는 이들 효소의 작용으로 투명대에 작은 구멍을 뚫고 투명대를 통과하여 위란강 내로 진입한다. 정자가 난세포질에 침입하면 난자는 제2극체를 방출하고 감수분열을 완료하여 자성전핵을 형성한다. 난자에 침입한 정자는 두부가 팽창하여 웅성전핵을 형성한다. 자웅의 전핵이 융합하여 수정이 완료된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">수태</div>
<p class="rb-p">수정 후, 수정배는 세포분열을 반복하면서 자궁을 향해 난관을 하강한다. 소에서는 배란 후 3~4일째에 8~16세포기의 수정란이 자궁으로 하강한다. 수정배가 난관에 존재하는 16세포기에 극미량의 인터페론(IFN)-τ가 수정배에서 분비되는 것이 세포배양계에서 확인되어 있어, 이 시기부터 수정배와 모체 측의 크로스토크가 시작되고 수태를 향해 면역계가 조절되는 것이 시사되고 있다²⁰⁾. 자궁 내의 수정배는 배란 후 6~7일에 배반포라 불리는 단계로 발육한다. 수정배와 자궁내막 사이에도 수태를 향해 여러 물질을 매개로 한 복잡한 크로스토크가 관여한다. 임신 성립 시기의 자궁내막 기능 조절은 P₄가 주체가 된다. P₄는 난소의 황체 유래이며, 자궁내막에서의 옥시토신, 프로스타글란딘(PG)F₂α의 조절을 통해 난소기능을 제어하고 있다. 이 상호조절이나 P₄ 분비, 유지 조절의 불비는 조기 배 사멸의 한 원인이 된다. 배반포는 분할을 진행하여 크기를 늘리고, 투명대에서 탈출하여(탈출 배반포) 급속히 발육을 진행해 수정 후 13일 무렵에는 길이 30 mm 정도의 타원구상으로 발육한다. 그 후 수정배는 급속히 신장을 계속하여 수정 16~18일째에는 길이 17~25 cm 정도의 가는 끈 모양으로 신장한다(그림 5-1-8). 이 시기에 수정배의 영양막세포로부터의 IFN-τ 생산·분비가 정점에 달하여 모체 측에 임신 정보를 전달(모체의 임신 인식)함과 동시에 수정배의 발육·신장 조절을 행한다. 또한 IFN-τ는 자궁내막에서의 옥시토신 수용체 발현을 억제함으로써 PGF₂α 생산을 억제하고 황체 퇴행을 저지하고 있다. 나아가 IFN-τ와 P₄는 협조하여 자궁내막에서의 자궁유상액단백질(uterine milk protein: UTMP) 생산, 매트릭스메탈로프로테아제(matrix metalloproteinase: MMP), 세포외매트릭스메탈로프로테아제유도인자(extracellular matrix metalloproteinase inducer: EMMPRIN)의 활성화를 통해 세포외매트릭스(extracellular matrix: ECM)를 개변하고, 자궁내막의 수태(수정배의 착상)를 향한 기능을 부활화한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-1-8 임신 초기 수정배의 발달. 가로축 수정 후 일수(4, 8, 12, 16, 20일). 위: 난관·자궁 내에서의 이동(누두〈난관〉→난관→자궁난관접합부→자궁각; 배가 자궁에 침입, 투명대 탈출, 배의 신장, 자궁내막과의 대면·접촉, 자궁내막에의 접착; 이 구간에 IFN-τ 분비; 황체, 비임신각측 난소). 아래: 배의 성장과 발달(150 μm 분할배→상실배→205 μm 배반포→340 μm 탈출 배반포→30 mm 신장배→190 mm; 영양외배엽, 내부세포괴). 문헌 21에서 인용·개변</p>
<p class="rb-p">수정배는 신장을 계속하여 수정 후 22일째에는 배란측과 반대측 자궁강 내에도 신장하고, 수정 후 28~32일 무렵에는 자궁강 전체로 확장하여 자궁내막에 접착한다. 배세포와 자궁내막세포의 접착과 그 후 침윤 시기에는 자궁 측에는 렉틴, 케모카인, 카텝신 등의 관련 분자가, 배 측에는 프로락틴이나 프로락틴 관련 단백질, 케모카인 수용체 등 세포의 접착, 침윤을 촉진하는 분자가 발현한다. 수정 후 25일 이후에 태자 근방의 자궁소구부 내막에 대응하는 부분의 영양막(융모막)에서 융모총 형성이 시작되어, 자궁소구부 내막과 융합하여 태반절이 형성(최초의 태반 형성)된다.</p>
<p class="rb-p">태반절 형성 시기에는 영양막의 이핵세포(binucleate cell: BNC) 유래의 내재성 레트로바이러스 분자(endogenous retrovirus: ERV)에 의해 BNC와 자궁내막 상피세포의 세포융합이 진행되어 다핵세포가 형성된다. 나아가 프로락틴, 프로락틴 관련 단백, 임신관련당단백질(pregnancy-associated glycoprotein: PAG), 카텝신이나 트랜스포밍증식인자(TGF)-β 슈퍼패밀리 등 각종 사이토카인이 공동으로 혈관신생을 행하여 융모총을 형성하고, 자궁내막 소구부의 내막 상피층이 재구축되어 태반절이 형성된다. 이 밖에 후성유전학에 의한 유전자 발현 조절이나 IFN-τ에 반응한 면역계 분자(ISG15, MX1, MX2, OAS1), 세포내 신호전달계 분자 등의 발현 조절도 더해져, 많은 분자가 통합적으로 기능하여 착상이 완료되고 수태가 성립한다²¹˒²²⁾(그림 5-1-8).</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(堂地 修·大島一修)</span></p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 5-1 육성기의 발육과 생리적 변화 — 번식기능의 발달, 堂地修·大島一修.</p>
</div>
`;

<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>3~4mm짜리 작은 난포 8~41개가 2~3일 동안 같이 자라기 시작함. 2~3일은 비슷한 속도로 크다가 그중 하나가 계속 자라도록 선택되고(우성 난포), 나머지는 폐쇄·퇴행함(종속 난포).</span></p><p class="bx-num"><span class="bxn">2.</span><span>우성 난포 선발<span class="hang">출현 직후 작은 난포(6mm 미만)는 FSH 의존 → 난포파 첫 3일간 FSH가 떨어지면 대부분 2~5일 안에 퇴행</span><span class="hang">우성이 될 난포만 FSH 수용체가 많아 낮은 FSH에서도 버티고, 8mm를 넘으면서 과립막에 LH 수용체가 생겨 FSH 없이 LH로 자람</span><span class="hang">가장 큰 두 난포의 성장이 갈라지는 시점은 미래 우성 난포가 약 8.5mm일 때, 출현 2.5일 후</span><span class="hang">우성 난포의 억제는 인히빈·E2로 FSH를 떨어뜨리는 전신 작용이라 양쪽 난소에 똑같이 걸림 → 다음 우성 난포가 어느 난소에서 나올지는 무작위, 위치 예측 불가. 우성 난포가 있는 난소를 떼면 반대쪽 난소에서 바로 새 우성 난포가 자라는 것이 그 증거</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>난포파 출현은 보통 우성 난포가 4mm로 처음 보이는 날로 잡지만, 1mm까지 보이는 스캐너로 보면 그보다 1~2일 전에 이미 1~3mm 난포가 가장 많이 모여 있음. 즉 난포파는 4mm로 세기 시작하는 날보다 1~2일 먼저 시작돼 있음. 미래 우성 난포는 1mm 때부터 첫 종속 난포보다 6~12시간 먼저 나타나고, FSH 상승에 6시간 안에 반응함.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">4.</span><span>첫 난포파는 2파든 3파든 배란일(0일)에 출현함. 두 번째 난포파는 2파 주기 9~10일, 3파 주기 8~9일 / 세 번째 난포파는(3파 주기) 15~16일에 나옴.</span></p><p class="bx-num"><span class="bxn">5.</span><span>흔히 말하는 21일 주기는 평균값일 뿐 실재하지 않음. 황체는 2파 주기에서 3파 주기보다 일찍 퇴행하기 시작함(약 16일 vs 19일). 그래서 주기 자체가 짧아짐(2파 약 20일, 3파 약 22~23일).</span></p><p class="bx-num"><span class="bxn">6.</span><span>2파냐 3파냐를 가르는 핵심 변수는 1차 난포파 우성 난포가 얼마나 오래 우성을 유지하느냐임. 이 기간이 2파에서 더 김. 2파·3파 비율은 품종·연령보다 영양·열스트레스에 좌우됨. 상태가 나쁘면 3파가 늘어남. 한 마리가 한 양상을 보이면 다음 주기에도 같을 확률이 70%임.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">7.</span><span>배란 직후 황체가 작아 P4가 낮고 LH pulse 억제가 덜함 → 7일 전후까지 하루 1~2mm씩 자라 15~20mm(고산차 20mm 전후)로, 황체기 높은 P4 아래서 자라는 2·3차 우성 난포보다 큼</span></p><p class="bx-num"><span class="bxn">8.</span><span>4~6일 혈중 E2가 잠깐 올라(5일 난포액 E2가 8일보다 높음) 7일 전후 자궁 수축감이나 약한 발정 징후가 보일 수 있음</span></p><p class="bx-num"><span class="bxn">9.</span><span>자라는 동안 P4가 올라 LH pulse가 눌리므로 성숙·배란에 못 이르고 10~11일경 폐쇄. 폐쇄 후에도 약 5일간 10mm 이상을 유지하다 발정일까지 10mm 미만으로 줄며, 드물게 다음 주기까지 크기 유지</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">10.</span><span>1차 우성 난포가 폐쇄돼 인히빈이 사라지면 FSH가 다시 올라 2차 난포파가 뜸. 난포파가 주기 중 2~3번 반복되는 이유</span></p><p class="bx-num"><span class="bxn">11.</span><span>2차 우성 난포도 황체기 P4로 LH pulse가 낮아 15mm(고산차 20mm)까지 크지만 성숙하지 못함. 황체가 살아 있는 동안은 어느 우성 난포도 배란 못 하고 폐쇄됨.</span></p><p class="bx-num"><span class="bxn">12.</span><span>황체용해가 시작될 때 마침 떠 있던 우성 난포가 배란 난포가 됨 → 2차 우성 난포가 폐쇄되기 전에 황체 퇴행이 오면 그것이 배란하고, 먼저 폐쇄되면 3차 난포파가 떠서 그 우성 난포가 배란함. 어느 난포파가 배란하느냐는 황체용해 타이밍과 난포파 타이밍이 맞물리는 운임.</span></p><p class="bx-num"><span class="bxn">13.</span><span>surge 이후 여러 단백분해효소가 난포벽을 허물어 평균 30시간 뒤 난포가 터짐. 난모세포는 surge 약 20시간 뒤 상당수가 성숙(제2감수분열 중기)에 도달함. 체외수정·수정란이식에서 성숙 시간을 잡는 근거.</span></p><p class="bx-num"><span class="bxn">14.</span><span>황체 퇴행부터 발정까지 걸리는 시간은 퇴행 시 난포 크기에 달림. 15mm 이상이면 2일 전후, 10mm면 3~4일, 8mm 미만이면 5~6일임.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">15.</span><span>배란으로 빈 난포의 과립층·협막세포가 빠르게 혈관화·황체화하면서 부풀어 황체가 됨.</span></p><p class="bx-num"><span class="bxn">16.</span><span>황체 중심의 공동(cavity)은 정상 황체의 40~70%(Atlas는 주기 첫 10일에 30~50%)에서 보이며, 주로 발달 초기에 나타나 10~15일에 대부분 사라짐. 임신 30일 이후엔 드묾. 초음파에서 무에코로 보이지만 P4는 공동 유무가 아니라 황체 조직 부피에 비례하므로 기능 황체로 봄. 황체낭종과 혼동 금지.</span></p><p class="bx-num"><span class="bxn">17.</span><span>P4는 LH pulse를 눌러 우성 난포 성장을 용량 의존적으로 억제. P4가 높으면 우성 난포가 작고 단명하며 다음 난포파가 빨리 옴. 낮으면 우성 난포가 과도하게 오래 살아남아 난포낭종이 될 수 있음.</span></p><p class="bx-num"><span class="bxn">18.</span><span>공동우성·2구 배란<span class="hang">우성 난포를 없애거나 FSH를 넣어주면 종속 난포도 우성이 됨. 우성 난포가 둘 이상 선발되면(공동우성) 2구 배란 → 쌍태</span><span class="hang">가장 큰 종속 난포도 LH 수용체를 조금 갖고 있어, P4가 낮아 LH pulse가 잦아지면 그 종속 난포까지 살아남음</span><span class="hang">공동우성 소는 선발 전 FSH가 높고 인히빈이 낮고 LH도 높게 유지됨. 난포 활력 저하(IGF-I·인슐린·포도당 부족)로 인히빈이 떨어진 것이 배경이라는 추측. 고유량·스트레스·간 기능 저하·저영양·고령이 깔려 있음</span><span class="hang">젖소에서 다배란은 고생산·저P4·3산 이상·분만 후 90~150일에 많음(초산 약 7%, 3산 이상 25%)</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>노령 암소(≥15세)는 어린 딸(≤5세)보다 평균 순환 FSH 농도가 일관되게 높았으나, FSH 급증·난포파 출현 양상은 유지되었다. FSH 상승에도 노령 암소는 각 난포파에 모집되는 4~5mm 난포가 더 적었다. 2파 양상 노령 암소의 배란 난포는 배란 시 어린 암소보다 작았고, 황체 직경이 더 작고 프로게스테론 농도가 더 낮은 경향이 있었다. 과배란 처치에서 노령 암소는 어린 딸보다 모든 크기 난포가 더 적게 발달했고, 평균적으로 어린 딸이 어미보다 마리당 배란이 8개 더 많았다. 노령 암소의 난모세포는 현저히 덜 유능하여 딸의 절반에 불과한 수정란을 생산했다.</span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">20.</span><span>난포 낭종(COF)의 대사 배경<span class="hang">인슐린·IGF-1은 난포세포의 스테로이드 생성·증식을 자극하고 우성난포 성장은 IGF-1 의존적이다. COF 소는 산화 스트레스, NEB, 사료 제한, 간 기능 저하, 저인슐린·저IGF-1에 노출된 경우가 많다.</span><span class="hang">비유 초기 고NEFA는 난포막세포에 세포독성을 보이고 스테로이드 생성을 저해해 COF에 기여하며, 자연 회복 실패·반복 발생을 설명할 수 있다.</span></span></p></div>
</div>


  `;
}
