<div class="modal-sub" style="margin:14px 0 6px;">바커 가설의 진화와 DOHaD</div>
<p class="rb-p">이 책의 전신에 해당하는 『송아지의 과학』에서도 "바커 가설의 소에의 응용"이라는 항목에서 조금 소개된 바 있으나, 근년 사람의 태아기 및 동물의 태아기, 초기 성장기의 영양이 생후의 신생아 및 신생자에 미치는 영향에 관한 연구가 축적되고 있다. 영국 환경역학의 권위자인 David Barker 박사는 1980년대에 "사람 태아기에 저영양 상태인 것이 성인기 심혈관 장애의 위험인자가 된다"는 "바커 가설(Barker hypothesis)"을 발표하였다. 당시에는 전혀 찬동을 얻지 못했으나, 이후 많은 기초연구에 의해 그 가설이 실증되어 왔다¹⁾. "그 가설"이란, 저영양 상태에 노출된 태아가 그 환경에 적응하려 한 결과 전체적으로 절약적인 체질이 되고, 또 근육량 감소, 신장의 네프론 수 감소, 췌장의 β세포 감소 등이 일어난다는 것이다. 이러한 변화는 일시적인 것이 아니라 영속적으로 남아, 태어난 아이가 성인이 된 뒤의 질병, 특히 고혈압, 당뇨병, 심근경색 등의 발증 위험을 증대시킨다²⁾.</p>
<p class="rb-p">근년 이 가설은 학문 체계로 정리되어 왔다. 즉 생물과학, 특히 의학 분야에서는 태아기나 신생아기, 특히 이유기까지 받은 영양 자극에 의해 그 후 동물체의 대사 시스템, 체질 및 형태가, 나아가 최근 연구에서는 특히 간, 골격근 및 지방조직의 대사에 커다란 영향을 미친다는 것이 밝혀지고 있다. 실험동물을 이용한 연구가 특히 의학 분야를 중심으로 진행되고 있으나, 가축을 이용한 실험도 증가하고 있다. 사람의 모델로 삼은 면양이나 돼지의 실험이나, 가축의 생산성에까지 파고든 연구도 증가하고 있다. 이 가설은 DOHaD(Developmental Origins of Health and Disease: 성장 과정의 영양 상태나 환경인자의 작용에 기인하는 질환의 발생)라는 개념으로 의학 분야에서 받아들여져³⁾, 후성유전학(epigenetics) 연구 분야와 관련하여 연구가 진행되고 있다⁴⁾⁵⁾. 이 DOHaD 가설은, 동물 생산 시스템의 고도화를 지향하는 축산 분야에서는 임신기나 신생자기의 영양 제어에 의해 가축 생산성이 바뀐다고 받아들일 수 있어, 생산 기술에 응용할 수 있는 가능성이 있다(그림 1-10-1).</p>
<p class="rb-p">이 DOHaD 가설과 관련하여 "네덜란드의 기근(Dutch famine)"이라는 유명한 역학조사가 있다. 이 조사는 네덜란드에 심장질환이 매우 많은 지역이 있어, 왜 그러한 질병의 발생이 편향되어 있는지에 대해 그들의 생애를 상세히 역학조사한 것이다. 그 결과, 그들이 태아기에 있던 1944~1945년에 그들의 어머니가 살고 있던 지역이 전화(戰火)를 입어 독일군에 의해 식량 봉쇄를 받았던 것이 판명되었다. 그 때문에 그들을 임신하고 있던 어머니는 (추정) 하루 약 700 kcal밖에 먹을 수 없었다. 이 조사 결과를 바탕으로 한 최근 연구에서, 태아기 어머니의 영양이 적고 출생 시 체중이 작은 것은, 특히 임신기의 저영양과 그 결과로서의 신생아 저체중, 성숙 후의 비만, 심장질환, 당뇨병이나 고혈압의 발증과 밀접하게 관련되어 있음이 밝혀졌다⁶⁾⁻⁸⁾. 이처럼 태아는 출생 후 자신이 살아갈 환경을 특히 어머니의 영양 상태로부터 모니터링하고, 그 환경에 맞추어 몸의 크기나 대사를 설정해 간다는 가설이 제창되게 되었다. 이 가설로부터, 이 개념은 "Predictive Adaptive Response(예측적응반응)"라고도 불린다⁹⁾. 특히 사람은 야생동물과 달리 출생 후의 영양 환경에서 "Mismatch"가 일어날 수 있다. 사람 임산부의 경우, 임신 중의 체형 변화 등을 신경 써서 식사량을 줄이거나, 혹은 편식 등에 의해 태아에게 저영양 상태가 되는 일이 있다. 이에 따라 생후 환경은 태아에게 저영양이라고 판단되어, 그러한 환경에서 살아남을 수 있는 몸으로 만들기 위해 몸을 소형화한다. 그것은 결과적으로 저체중아를 출산하게 된다. 그러나 그 후 어머니는 저체중이며 절약적인 체질을 준비해 온 신생아에게 (건강과 높은 성장을 바라며) 고영양을 주는 일이 있다. 이 "Mismatch"가 다양한 질병의 원인이 되고 있음이 밝혀졌다. 네덜란드 기근의 역학조사에서도, 식량 봉쇄를 받았던 지역의 어머니에게서 출생한 신생아는 종전 후 영양 환경이 개선되었다. 그것은 태아기의 영양 모니터링에 의해 준비해 두었던 몸의 크기나 대사 수준과 출생 후의 영양 수준 사이에 "Mismatch"를 낳아, 성인 후의 질병 발증에 크게 영향을 미쳤음이 밝혀졌다. 이 DOHaD 가설을 바탕으로, 인의학 분야에서는 태아기나 신생아기의 영양을 변화시켜 그 자손이 어떠한 표현형이나 체질을 갖는지에 관해 다양한 연구가 이루어지고 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 1-10-1 DOHaD 가설과 소 사양에의 응용</p>
<div class="modal-sub" style="margin:14px 0 6px;">DOHaD 가설과 후성유전학</div>
<p class="rb-p">이 DOHaD 개념은 주로 다음 4가지 요인에 의해 평가된다¹⁰⁾. 즉, ①태아기 및 신생아기의 한정된 기간의 가소성 시기 혹은 감수성 시기(Critical window)의 현상일 것, ②Critical window에서의 영양 자극 등에서 한 번 변화한 대사 시스템은 그 후 일관되게 변하지 않을 것, ③기관의 형태 변화 등도 동반할 것, ④Critical window에서의 영양 자극의 양적 차이가 그 후의 표현형 변화에 반영될 것, 이다. 이 개념은 앞으로 동물 생산 시스템의 고도화를 연구하고 있는 축산 분야에서는, 임신기 모축의 영양을 통한 태아 영양 혹은 신생자기의 영양이 동물 생산 기술이나 가축의 면역, 건강에도 크게 영향을 미친다는 것으로, 매우 흥미로운 것이라 할 수 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 1-10-2 CpG 섬과 DNA 메틸화에 의한 전사 조절</p>
<p class="rb-p">이 개념의 기반이 되는 "후성유전학(epigenetics)"이라는 말은 Conrad Waddington 박사에 의해 명명되었다³⁾. "에피(epi)"는 "후천적"을 의미하고, "제네틱스(genetics)"는 "유전, 유전자나 유전학"을 나타낸다. 이것은 유전자(게놈)에 쓰인 유전정보를 "변경하지 않고", 개체의 발생이나 세포분화에서 후천적으로 "유전자 발현을 변화"시키거나 제어하는 현상의 총칭으로 사용된다. 후성유전학은 DNA 서열의 변화를 동반하는 것이 아니라, DNA 수식(修飾)에 관한 변화이다. 후성유전학적 수식에는 주로 3가지 패턴이 있다. 하나는 DNA 메틸화, 히스톤 수식, 그리고 noncoding micro RNA이다³⁾⁶⁾¹¹⁾. 이들 중 특히 DNA 메틸화 및 히스톤 수식은 영양 환경에 의해 강하게 영향을 받는다. 따라서 이 수식 기구를 영양 자극에 의해 제어할 수 있다면, 긍정적으로 가축 사양에 응용할 수 있는 가능성이 있다. 이들 수식의 영향은 세포분화 시의 유전자 발현의 강도와 발현 타이밍에 영향을 미치고 있다. 많은 포유류에서 엑손과 트랜스포존(전이하는 DNA)을 포함한 DNA는 메틸화된다. 메틸화는 시토신(C) 다음에 구아닌(G)이 나타나는 유형의 2염기 서열인 CpG 부위에서 일어난다(그림 1-10-2). CpG의 "p"라는 문자는 시토신과 구아닌 사이의 포스포디에스테르 결합(Phosphodiester bond)을 나타낸다. CpG 섬(CpG island)은 CpG 부위의 출현 빈도가 게놈 중 다른 영역에 비해 높고, 많은 CpG 부위가 메틸화되는 영역이다. 포유류 유전자 중 40% 이상이 프로모터 내부 혹은 그 근방에 CpG 섬을 포함하고 있는 경우가 많다. CpG 섬의 메틸화 패턴은 조직에 따라 다르며, 이 변이는 전사 스위치의 ON과 OFF를 관장하여 여러 조직에서 유전자 발현을 변화시킨다(그림 1-10-2). 히스톤 수식도 중요한 후성유전학적 수식이며, 히스톤은 DNA와 유사하게 메틸화에 의해 수식된다. 그러나 DNA와 달리 히스톤은 N말단의 아세틸화, 인산화, 비오틴화, 유비퀴틴화와 ADP리보스화를 포함하는 수식 패턴에 의해 수식되어 유전자 발현 제어를 수행하고 있다. 이들 후성유전학적 수식은 영양이나 환경 자극에 의해 제어되어 많은 대사 관련 유전자의 발현을 변화시키고, 결과적으로 대사 표현형에 강하게 영향을 미친다.</p>
<p class="rb-p">후성유전학적 수식은 유전자형 안에서 표현형의 가소성을 가능하게 하는 열쇠가 되는 기구이며, 환경으로부터의 자극에 최적으로 대응하도록 태아의 유전자 발현 변화를 가능하게 한다. 모체의 유지와 태아의 에너지 수요 사이의 영양 분배에 영향을 미치는 주요 요인은, 어미소의 연령, 태아 수, 젖소 등에서는 유생산과 자궁 내 태아에 관련된 영양 균형과 환경 스트레스이다.</p>
<p class="rb-p">현재 태아기 프로그래밍에 관해 많은 기반 연구가 있다. 특히 태아기의 빈영양, 혹은 자궁내 발육지연(Intrauterine growth retardation: IUGR)이 자축에 미치는 영향을 보는 연구가 활발하다⁷⁾. 이들 연구에서는 자축의 출생 시 체중은 작지만, 그 후의 성장에 의해 태아기에 통상의 영양 환경이었던 자축을 따라잡는다(Catch-up-growth). 그러나 특히 지방이 많은 식사에 의해 지방 축적 항진, 글루코스 내성 이상, 인슐린 내성이 일어난다. 이것은 태아기나 신생자기의 렙틴 서지(주1)에 의한 에너지 대사 변화가 관련되어 있다고 보고되어 있다¹²⁾. 또 태아기의 발육지연은 신장의 네프론 수 감소나, 골격근 내 미토콘드리아의 기능부전도 일으킨다고 보고되어 있다¹³⁾. 또한 출생 시 체중과 밀접하게 관련된 성장호르몬(GH)-인슐린유사성장인자(IGF-I) 축(GH-IGF-I)도 태아기의 영양에 의해 조절을 받는다¹⁴⁾¹⁵⁾. 한편, 어머니의 임신기 BMI(Body mass index) 값의 크기는 그 아이의 비만 정도의 지표라고 보고되어 있다¹⁶⁾. 어머니가 임신기에 섭취하는 단백질과 엽산의 비율은, 자축의 이유 후 간에서의 DNA 메틸화 동태나 글루코코르티코이드 수용체, PPARγ(Peroxisomal proliferator-activated receptor γ)(주2)의 발현에 영향을 미친다는 것도 보고되어 있다¹⁷⁾.</p>
<p class="rb-p">축산에서 식육 생산이라는 관점에서 태아기의 골격근 형성을 생각할 때, 태아기의 영양은 우선 우선적으로 중요한 기관, 예컨대 뇌, 심장, 간 등 주요 기관의 형성에 사용되며, 골격근의 우선도는 낮아진다¹⁸⁾¹⁹⁾. 그 때문에 골격근에 대한 영양 신호가 감소하면 Wnt(Wingless and int) 신호(주3)에 작용하여 β카테닌을 통해 근세포의 분화가 억제되고, 반대로 지방세포의 분화 억제 수준도 저감된다⁸⁾²⁰⁾. 한편, 반대로 모축의 과잉 영양 섭취 혹은 비만은 염증이라는 현상에 의해 NF-κB(Nuclear factor-κB) 및 JNK(c-Jun N-terminal kinase) 신호를 통해 근세포 분화를 억제하고 지방세포 분화를 항진시킨다⁴⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주1) 렙틴 서지: 지방세포에서 생산되는 호르몬인 렙틴의 혈중 농도의 일과성 상승을 말한다. 태아기 저영양 마우스에서는 신생자기의 렙틴 서지가 조기에, 그리고 증강되어 나타나며, 이 변화가 성수기(成獸期)의 대사 이상 발증에 매우 중요한 역할을 한다고 보고되어 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주2) PPARγ(Peroxisomal proliferator-activated receptor γ): 지방 합성의 주요 인자.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주3) Wnt(Wingless and int) 신호: 배(胚) 발생과 암에 관련된 단백질 네트워크로 발견된 경로. 이 경로는 많은 생물종에 보존되어 있다. 세포 표면의 수용체 등에 결합하는 등의 방식으로 β카테닌을 안정화시켜 핵에 들어가, 다른 전사인자와 상호작용하여 근세포 분화를 억제하는 등 여러 특이적 유전자 발현을 촉진시키며, 발생이나 세포분화 등에 관여하고 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 태아의 골격근 형성</div>
<p class="rb-p">소의 식육 생산이라는 관점에서 임신기는 골격근 형성에 중요한 시기이다. 원래 골격근세포(Skeletal muscle cells)는 지방세포나 골세포와 같은 간엽계 줄기세포에서 유래한다. 즉 육질에 중요한 골격근세포와 지방세포는 같은 세포에서 유래하는 셈이다. 수태 후 배기(胚期)에 간엽계 줄기세포의 일부가 근세포의 조상에 해당하는 전구세포(Myogenic progenitor)가 된다. 이것은 아직 근세포는 아니지만, 근세포가 되도록 운명지어진 세포이다. 배기의 근형성은 Wnt, Paired box gene인 Pax3와 Pax7, 근형성 유전자군인 MRFs 같은 유전자군에 의해 매우 정교한 시스템으로 통제되고 있다. Wnt가 간엽계 줄기세포로부터 근전구세포로의 분화에 가장 중요한 인자이며, 이어서 근전구세포에서 발현하는 Pax3와 Pax7에 의해 추가적인 근세포로의 분화를 촉진하는 MRFs의 발현을 유도한다²¹⁾²²⁾. MRFs는 MyoD, Myf5, Myogenin 및 MRF4로 구성된다. MRF4가 근형성 초기에 단시간 발현하고, 이어서 MyoD와 Myf5가 발현한다. Myogenin은 근형성 후반에 발현하여 태아기까지 유지된다. MyoD와 Myf5의 발현에 의해 다능성을 가진 근전구세포로부터 근아세포로의 분화가 촉진된다. 그 후 Myogenin의 발현이 근아세포의 융합에 의한 근관 형성을 촉진한다. 먼저 초기의 근형성에 의해 1차 근섬유(Primary muscle fibers)가 형성된다. 배기에 형성되는 1차 근섬유를 구성하는 근세포(근섬유) 수는 한정된 것이며, 다음 형성에 이어지는 2차 근섬유(Secondary muscle fibers)의 기반이 된다²³⁾(그림 1-10-3). 이 배기에 형성되는 1차 근섬유의 기반적 증식을 높이는 것은 그 후의 근 발달에 영향을 미칠 것으로 예상되나, 그 수는 한정된 것이다.</p>
<p class="rb-p">배로부터 세포분화가 진행되어 태아기에 들어가면 다수의 근섬유가 형성된다. 태아기는 근형성에 매우 중요한 시기이다. 이 시기는 배기에 형성되는 1차 근섬유에 이어지는 2차 근섬유의 형성 시기이다. 이 시기에도 여전히 많은 전구세포가 존재하지만, 우선 미분화 상태로 증식하고 그 후 근아세포나 근섬유로 분화한다. 이 시기에는 1차 근섬유 쪽이 2차 근섬유보다 크다. 2차 근섬유의 형성은 지방 형성(Adipogenesis)과 동시에 일어난다. 2차 근섬유의 형성은 소나 면양에서는 임신 중기에 일어나지만, 돼지나 설치류에서는 임신 후기에 일어난다. 이 시기는 동시에 섬유 형성(Fibrogenesis)의 시기이기도 하다. 이 시기의 섬유 형성은 말하자면 결합조직의 초기 합성 시기이며, 다음 임신 후기에 근주막이나 근외막을 형성한다. 근세포, 지방세포 및 섬유아세포는 모두 간엽계 세포 기원이다. 소나 면양의 골격근 형성에서 태아기는 매우 중요한 시기라 할 수 있다. 한편 설치류나 돼지에서는 이 시기에 소나 면양의 발달 수준에 비하면 여전히 미숙하며, 생후 신생자기까지 2차 근섬유 형성이 계속된다²⁴⁾²⁵⁾. 지금까지의 연구는 어느 쪽인가 하면 1차 근섬유의 형성, 이른바 초대(初代)의 근형성 사건에 초점을 맞춘 보고가 많고, 기관으로서의 골격근 형성에 중요한 2차 근섬유 형성, 근내지방 형성 및 그것들을 지탱하는 결합조직 등의 섬유 형성에 관한 연구는 적다. 식육 생산에서 이러한 것들은 육량과 육질의 형성에 매우 중요하며, 태아기에서의 이러한 현상에 관한 앞으로의 연구가 요망된다²⁶⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 1-10-3 근형성과 관련된 유전자 발현에 관한 모식도 (문헌 23에서 인용·개변)</p>
<p class="rb-p">한편 근 발달에서 생후 단계에는 세포 수의 증가라기보다 세포의 비대라는 현상이 주된 변화가 된다. 앞서 기술한 대로 소 및 면양에서는 설치류나 돼지와 비교하여 신생자기 골격근의 성숙도가 다르다²⁷⁾. 소나 면양에서는 골격근 형성이 임신 후기에 성숙하므로, 설치류나 돼지의 데이터를 골격근 형성의 각종 지표로 안이하게 이용하는 것은 위험하다. 근위성세포(Satellite cells)에 관한 연구에서도, 임신 후기의 소나 면양, 사람의 골격근은 설치류나 돼지와 달리 이미 정지기에 들어가 있다²⁷⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 영양이 태아 골격근의 크기, 수 및 근섬유형에 미치는 영향</div>
<p class="rb-p">임신기의 영양은 태아의 발육, 특히 골격근의 발달을 프로그래밍하고 있다. 또 이 시기의 영양은 뇌나 심장, 간 같은 주요 기관으로의 배분이 우선되기 때문에, 영양 배분이 이차적이 되는 골격근 형성은 영향을 받기 쉽다²⁸⁾. 배기는 비교적 한정된 수의 근섬유 형성이 주이므로, 영양이 근형성에 미치는 영향은 그다지 크지 않다고 여겨진다. Du 등은 소의 임신 30일부터 120일(이른바 임신 전기)의 영양 요구량을 70%와 100%로 처리하여 태아 체중과 지육 중량을 조사하였으나, 양 구에서 차이는 없었다²⁹⁾. 한편 Quigley 등은 면양의 수태 전후 24일간을 영양 요구량 50%와 100%로 비교하였는데, 태아 체중에서는 양 구에 차이가 인정되지 않았으나, 영양 요구량 50%의 면양에서 근섬유 수가 감소하였음을 보고하였다³⁰⁾. 또 1차 근섬유에 대한 2차 근섬유의 수가 감소하였다. 즉 근섬유 수의 감소는 주로 2차 근섬유 수에 의한 것으로 생각된다.</p>
<p class="rb-p">소에서는 임신 200일 전후에, 면양에서는 105일 전후에 태아의 골격근 형성, 이른바 개체로서의 기반적 근섬유 수의 형성이 성숙 단계가 된다. 그 때문에 임신 말기의 영양 제한은 근섬유 크기의 감소를 초래하지만, 근섬유 수의 감소는 일어나지 않는다³¹⁾. 소에게 임신 중기는 특히 골격근 형성에 중요한 시기라 할 수 있다(그림 1-10-4). 신생자기에는 근섬유 수가 대체로 고정되어 버려, 그 후의 골격근 발달 잠재력이 규정된다. 그러한 의미에서 골격근 발달의 한계치에 영향을 미치는 태아기의 골격근 형성 정체는 되돌릴 수 없는 현상이 되어 그 후의 건강이나 산육성에 영향을 미칠 가능성이 있다³²⁾³³⁾. 근년 골격근은 운동기관일 뿐 아니라 각종 생리활성물질을 분비하여 면역에도 관여하고 있다고 보고되어 있다³⁴⁾. 또 근육량은 각종 대사성 질환에서의 영향을 완화하는 흡수재 같은 역할도 하고 있다고 보고되어 있다³⁵⁾. 이러한 점들로부터, 무엇보다 굵은 근섬유를 많이 가진, 골격근이 더 발달한 신생자를 생산하는 것이 신생자의 면역에서도 그 후의 비육이나 산육성에서도 중요하다고 생각된다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 1-10-4 소에서 태아기 및 생후 영양에 따른 후성유전학을 기반으로 한 근형성 및 지방형성 잠재력의 크기에 관한 개관도 (문헌 4에서 인용·개변)</p>
<p class="rb-p">면양에서는 임신 전기부터 중기에 걸친 영양 제한(영양 요구량 50%)이 태아 골격근의 근섬유 수를 감소시키고, 그 내용으로서 1차 근섬유에 대한 2차 근섬유의 비율도 감소시켰다. 나아가 그것들로부터 생산된 자축의 8개월령 시 골격근을 조사하니 역시 근섬유 수의 감소가 관찰되었다. 또 속근섬유의 일종인 IIX 근섬유 비율의 증가, 근내 트리글리세리드량의 증가, 그리고 골격근에 대한 지방 비율의 증가가 인정되었다²⁸⁾³⁵⁾. 이러한 점들로부터 임신 전기부터 중기에 걸친 영양 제한은 골격근의 형태학적 견지에서는 그 후 자축의 산육성에 지속적으로 크게 영향을 미친다고 생각된다. 소의 실험에서는 임신 31일부터 125일째까지의 영양 제한이 태령 125일 태아 골격근의 1차 근속(筋束) 내 근섬유 수를 감소시켰다. 또 태령 250일 태아 골격근의 근섬유 횡단면적을 증가시켰으나, 결과적으로 단위면적당 근섬유 수를 감소시켰다. 이러한 점들로부터 임신 전기의 영양 제한은 근 발달에 영향을 미친다는 것이 시사되었다²⁶⁾.</p>
<p class="rb-p">골격근량에 더하여 그 내용, 즉 근섬유형 구성의 변화도 생산되는 자축의 골격근 발달 잠재력을 좌우한다. 지근섬유인 I형 근섬유는 에너지 대사와 관련하여 이화작용이 크고, 성장에서의 에너지 효율이 나쁘다. 한편 속근섬유인 II형 근섬유는 이화작용이 작고 높은 성장 효율을 가진다. 임신기의 영양 제한에서는 그 자축의 골격근에서 근섬유 수는 감소하지만 II형 근섬유의 비율이 커지므로, 효율적인 골격근 성장, 즉 II형 근섬유의 크기 증대에 의한 성장을 촉진한다²⁸⁾.</p>
<p class="rb-p">임신기의 영양 제한은 내장지방이나 피하지방의 축적을 촉진한다. 이것은 면양이나 돼지의 실험에서도 보고되어 있다²⁸⁾³⁶⁾. 한편 임신기의 과잉 영양도 태아 골격근의 발달에 영향을 미친다. 면양의 실험에서 임신 초기부터 임신 75일까지를 영양 요구량 150%의 영양으로 사양한 경우, 그 태아의 반건양근 중량은 무거워지고 근세포 수의 변화는 인정되지 않았으나, 근섬유 밀도의 감소가 관찰되었다⁵⁾. 돼지에서는 수태부터 임신 50일째까지의 과도한 영양에 의한 신생자기 자축의 지방 비율 증가나 근섬유형 구성의 변화가 관찰되고 있다. 한편 고영양 중에서도 고지방식, 즉 고칼로리식을 급여한 임신 래트의 실험에서는 근 횡단면적의 25% 감소, 근섬유 수의 20% 감소가 관찰되고 있다³⁷⁾³⁸⁾. 이처럼 임신기의 영양은 동물종에 관계없이 자축 골격근의 근섬유 수나 근섬유형 구성을 변화시킨다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 영양이 태아 골격근 내 지방교잡에 미치는 영향</div>
<p class="rb-p">골격근 내 지방, 이른바 지방교잡(마블링)은 문자 그대로 골격근 내의 지방세포로부터 형성되며, 그것을 지탱하는 것이 결합조직, 이른바 세포외 기질(Extra cellular matrix)이다. 지방세포와 결합조직 양쪽 모두 육질 형성에 중요하다. 지금까지 기술한 대로 골격근세포도 지방세포도 간엽계 세포를 기원으로 한다. 임신 중기에도 태아의 골격근에는 많은 다능성 세포가 존재하며, 그 시점에서는 그것들이 골격근세포로도 지방세포로도 분화할 수 있다(그림 1-10-4). 즉 간엽계 세포로부터 형성되는 지방세포는 임신 중기부터 시작된다³⁹⁾⁻⁴¹⁾. 그러나 수의 증가라는 의미에서 새로운 지방 형성은 출생 후에도 내장지방이나 골반강 내 지방, 피하지방 내에서 계속 일어난다. 극히 미미하지만 근내지방도 (수의 증가라는 의미에서) 생후에도 형성이 계속된다고 보고되어 있다³⁹⁾⁴²⁾. 태아기의 근내지방 형성은 골격근 내 지방세포 수의 증가에 영향을 미친다. 임신기의 과도한 영양이 태아기의 지방 형성에 미치는 영향은, 골격근 내 지방세포 수를 증가시키고 그 지방세포가 비대해짐으로써 골격근 내에 지방을 축적시킨다. 그러나 in vivo 실험은 적고, 대부분은 세포 배양에 의한 in vitro 실험 결과이다⁴³⁾. 면양을 수태 전부터 임신 75일까지 영양 요구량 150%로 사양하면, 태아의 골격근 내 지방과 세포외 공간이 증가한다고 보고되어 있다. 이것은 임신기의 과잉 영양이 근내 지방 형성과 섬유 형성을 촉진함을 보여준다. 물론 이 시기에는 성숙한 지방세포는 없으나, 이것은 나중에 중성지방(TG)이 축적됨으로써 성숙한 지방세포, 이른바 비만세포가 된다. 지방 형성에서는 PPARγ가 중요한 역할을 하며, 이 유전자의 발현이 다능성 세포로부터 전구지방세포, 지방세포로의 분화를 유도하는 것으로 알려져 있다⁴⁴⁾. 임신기에 과잉 영양이었던 모축의 태아 골격근에서는 많은 전구지방세포의 마커인 pref-1의 발현도 높으며, 이것은 많은 세포가 지방세포로의 분화를 운명지어져 있음을 보여준다⁴⁵⁾. 소에서는 임신 초기부터 중기에 영양 요구량을 70%로 하고 거기에 바이패스 단백질을 보조사료로 급여한 경우, 그 자축의 근내지방과 피하지방이 감소하였다. 이것은 단백질 보조사료가 태아기의 지방 형성을 정체시킴을 보여준다²⁶⁾.</p>
<p class="rb-p">태아기부터 생후에 걸친, 골격근 내 지방세포 분화라는 의미에서의 지방 형성은 이유 시기, 소에서는 250일령 전후까지가 왕성하며, 그 후에는 영양에 의한 (수의 증가라는 의미에서의) 지방 형성은 거의 일어나지 않고, 그때 존재하는 지방세포 수 안에서 영양의 영향에 의한 크기 변화가 주요한 변화로 일어날 뿐이라고 생각되고 있다⁴⁶⁾⁻⁴⁸⁾. 실제로 출생 후의 실험에서, 조기에 이유하여 농후사료 급여를 일찍 시작한 경우 지방교잡도가 향상된다고 보고되어 있다⁴⁸⁾⁻⁵⁰⁾. 즉 이유까지 지방 형성이 계속된다고 하면, 그 전에 농후사료를 다급(多給)함으로써(고영양으로 함으로써) 지방 형성을 갱신하여 지방세포 수를 증가시키는 동시에 거기에 TG를 축적시켜 가는 것이다. 결과적으로 모자 방목 같은 종래의 구미식 cow-calf 방식에서 이유 시기까지의 영양이 부족한 경우에 비해 출하 시의 지방교잡도는 향상된다. 현재 일본에서는 와규(和牛) 사양에서 조기 이유가 통상 관리로 채택되어 있으며, 이것이 와규의 유전적 능력과 함께 지방교잡도를 높이는 요인이 되고 있을 가능성이 있다. 흑모화종에서도 신생자기부터 육성기까지 고영양으로 한 경우와 조사료만으로 사양한 경우에서, 11개월령 이후 똑같이 조사료만으로 비육하더라도 지방교잡도나 육량에 큰 차이를 가져온다고 보고되어 있어(지방교잡도는 전자에서 약 40% 증가하고, 지육 중량은 약 10% 증가하였다)⁵¹⁾, 상술한 현상을 뒷받침하는 결과가 되고 있다.</p>
<p class="rb-p">근년 in vivo에서의 소 후성유전학에 관한 연구도 진행되고 있다. Paradis 등은 교잡종 소에서 대사에너지의 100%와 85%의 2개 영양 처리구로 임신 중기부터 후기에 걸친 수태 후 147일부터 247일까지 사양하고, 어미소를 도축 후 태아를 적출하여 각종 조사를 실시하였다⁵²⁾. 이들 어미소는 영양 처리의 영향을 받아 85%구의 소 무리에서 체중이 유의하게 작아졌다. 적출한 태아의 체중이나 심장, 간, 신장, 태반의 중량에는 양 구에서 차이가 인정되지 않았으나, 간, 심장, 흉최장근, 반건양근 및 태반에서 성장인자 관련 유전자군의 발현에 유의한 차이가 인정되었다. 흉최장근의 micro RNA 발현에도 유의한 차이가 인정되었다. 나아가 흉최장근이나 반건양근에서 IGF-2의 DNA 메틸화 수준을 조사하여, 특히 흉최장근에서 DNA 메틸화 수준에 양 구간 유의한 차이가 인정되었다. 이러한 점들은 체중이나 장기, 골격근 중량에 양 구에서 유의한 차이는 인정되지 않았으나, 골격근 유전자 발현의 차이나 DNA 메틸화 수준의 차이로부터 기관의 대사 수준이 다를 가능성을 시사하고 있다. 대사에너지의 85% 정도의 제한에서는 어미소의 태반에서의 영양 공급 조정 등도 고려되어 장기 중량 등에도 영향이 나타나기 어려운 것인지도 모른다.</p>
<p class="rb-p">반추 가축에서 임신 초기와 중기의 지금까지의 실험 수준에서의 영양 제한은 태아의 골격근세포나 지방세포 수에는 영향을 미치지만, 임신 후기의 영양 혹은 신생자기의 영양에 의해 세포 비대라는 형태로 표현형을 개선할 수 있다. 육질에 관해서는 골격근세포나 지방세포의 수나 크기의 차이가 생기고 있어 영향을 미칠 가능성이 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 영양이 자축 비육 후의 산육성에 미치는 영향</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">면양에서의 연구</p>
<p class="rb-p">지금까지는 임신기 영양이 태아기의 골격근 형성에 어떻게 영향을 미치는지를 보아 왔으나, 여기서부터는 비육한 경우 어떠한 영향이 있는지를 생각하고자 한다. 근년 가축, 특히 면양을 중심으로 한 태아기 프로그래밍 연구가 다수 이루어지고 있다. 영양 변동이나 환경 요인 등에 의한 태아기의 성장 제한은 생후 성장에 영향을 미친다. 면양에서 임신 초기의 영양 제한은 자축의 생후 성장 비율을 높이지만, 골격근량을 감소시키고 글루코스 대사를 변화시킨다⁵³⁾. 면양에서 임신 110일부터 147일까지의 영양 제한은 자축의 글루코스 저항성을 변화시키고 지방조직의 글루코스 수송체를 감소시킨다⁵⁴⁾. 면양에서 교배 30일 전부터 수태 후 100일까지를 영양 요구량 70%로 사양한 경우, 같은 시기에 100%로 사양된 자축보다 신생자기의 사망률이 높아지고, 출생 시 체중이 작으며, 생후 성장이 더 완만해진다고 보고되어 있다⁵⁵⁾.</p>
<p class="rb-p">영양 상황은 체중에 반영된다는 가정 하에 체중을 지표로 한 면양의 대규모 조사에서는, 교배 "시"의 모축 체중과 자축의 63개월령까지의 체중에는 정(正)의 상관관계가 있었고, 교배 "후" 분만까지의 모축 체중은 자축의 39개월령까지 정의 상관관계가 있었으나 그 후에는 상관관계가 사라졌다⁵⁶⁾. 면양을 이용하여 임신 초기와 중기의 영양 제한 영향을 본 많은 실험에서는, 생산되는 자축의 출생 시 체중은 작아지지만 생후의 인공적인 영양 보급에 의해 개선의 여지는 충분히 있으며, 자연적인 모자 사양으로 두면 자축의 성숙 크기를 작게 만들어 버릴 가능성이 있는 것으로 보인다.</p>
<p class="rb-p">Lan 등은 면양에서 임신 중기(임신 67일째)부터 임신 후기(임신 130일)에 헤일리지 급여구, 옥수수 급여구 및 옥수수 주정박(蒸留産物) 급여구의 영양 질이 다른 3개 사료 급여구로 나누어 사양하고, 임신 130일에 태아를 적출하여 게놈 각인(Genome imprinting)(주4)에 관여하는 유전자나 DNA 메틸화 효소 생성에 관여하는 유전자군의 발현, 그리고 그들 유전자의 프로모터 영역의 DNA 메틸화 동태를 조사하였다⁵⁷⁾. 그 결과, 우선 이들 유전자군의 발현에서 3구 간에 유의한 차이가 발견되었다. 또 배최장근의 IGF-2R과 반건양근의 H19의 엑손부 CpG 메틸화 수준은 옥수수 급여구보다 헤일리지 및 주정박 급여구가 높다는 것도 발견되었다. 옥수수 급여구에서는 사료 중 DNA 메틸화 반응 경로에 메틸기를 제공하는(메틸기 공여체인) 메티오닌, 콜린, 엽산 등의 성분이 적었다. DNA 메틸화 수준, 특히 프로모터 영역의 메틸화 수준의 높이와 유전자 발현은 통상 부(負)의 상관관계에 있으나, 이 연구에서는 정의 관계였다. 최근 유전자 구조 내부(Gene body)의 메틸화 수준이 유전자 발현과 정의 상관관계에 있다는 보고도 있어⁵⁸⁾, 이들 유전자 발현과 DNA 메틸화 수준의 관계는 앞으로 추가 연구가 필요하다. 그러나 Lan 등의 연구에서는 임신기 영양의 질의 영향이 태아 DNA의 후성유전학적 변화에 강하게 영향을 미치고 있음을 증명하고 있다. 면양은 반추동물로서 다루기 쉬운 점에서, 실용적인 면뿐 아니라 대가축에의 응용을 염두에 둔 기초적인 연구도 실시되고 있다⁵⁷⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주4) 게놈 각인(Genome imprinting): 유전적 각인을 말한다. 일반적으로 포유류는 아버지와 어머니로부터 같은 유전자를 2개(성염색체의 경우는 1개) 물려받는다. 자식이 물려받은 많은 유전자는 원칙적으로 아버지 유래와 어머니 유래의 대립유전자가 양쪽 모두 작동하거나 혹은 작동하지 않도록 제어된다. 게놈 각인은 유전자에 주로 메틸화로서 붙은 표지(게노믹 임프린트)로, 한쪽 부모로부터 물려받은 유전자만이 발현하는 것으로 알려져 있다. 이처럼 포유류의 몇몇 유전자에서는 그 유전자를 양친 중 어느 쪽으로부터 받았는지를 기억하고, 그것이 발현하고 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">소에서 출생 시 체중이 산육성에 미치는 영향</p>
<p class="rb-p">DOHaD에서는 출생 시 저체중자는 성숙 후 비만을 통해 많은 질병의 원인이 되는 경우가 많다고 한다. 소에서 출생 시 체중은 그 후의 산육성에 어떻게 영향을 미칠까. 출생 시 체중은 임신기의 영양 상태를 반영하고 있을 가능성이 높다. 그래서 출생 시 체중이 그 후의 성장이나 육질에 어떠한 영향을 미치는지에 대해 몇몇 대규모 연구가 이루어져 있다. 호주 팀의 연구에서는, 기본적으로 출생 시 체중이 작은 소는 이유 시 체중도 작고, 피드롯 방식으로 비육한 경우 출하 시 체중도 작아지는 경향이 있었다⁵⁹⁾⁶⁰⁾. Greenwood 등은 출생 시 체중은 사료 효율에 대한 영향에 관해 명확한 차이는 없다고 보고하였다⁶¹⁾. 또 출생 시 체중의 크기는 출하 시 둔부의 피하지방 두께에는 영향을 미쳤으나, 그 밖의 지방교잡, 산육량, 등심 단면적 등의 지육 특성에는 영향을 미치지 않았다고 한다. 나아가 출생 시 체중은 흉최장근과 반건양근의 쿠킹로스(주5)나 경도(かたさ)에도 영향을 미치지 않았다고 보고하고 있다⁶⁰⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주5) 쿠킹로스(cooking loss): 고기를 가열했을 때 증발이나 단백질 변성 등에 의해 보수력이 저하하여 육즙이 배출된다. 그 손실량을 "쿠킹로스"라 부르며, 이를 측정하여 식육의 보수력 등을 평가한다. 조지방 함량이 높은 쇠고기는 가열에 의한 육즙 손실이 적은 경향이 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">임신 전기 영양이 자축의 산육성에 미치는 영향</p>
<p class="rb-p">Long 등은 앵거스와 헤리퍼드의 교잡우에서 임신 전기(수정 후 32~115일)의 영양을 영양 요구율 55%로 제한한 경우와 100%로 설정한 경우에, 그 자축을 피드롯 방식으로 비육하여 출생 시 체중 및 송아지의 성장이나 출하 시 체중에 양 구간 차이가 인정되지 않음을 보고하였다⁶²⁾⁶³⁾. 출하 후에 주요 장기를 조사한 결과, 임신 전기에 영양 제한함으로써 폐와 기관(氣管)의 중량에만 차이가 인정되었다. 또 흉최장근의 근내 DNA량과 골격근섬유의 횡단면적은 이 영양 제한으로 커졌다. 이것은 임신 전기의 영양 제한에 의해 근섬유 수가 적어지고, 그것을 보충하기 위해 근섬유의 비대가 일어나고 있는 것으로 추찰되었다. 또 그들은 이 소 무리에 글루코스 부하시험을 실시하였으나 그 반응성은 차이를 보이지 않았다. 이어서 Long 등은 앵거스 교잡종을 이용하여 임신 전기부터 중기에 해당하는 임신 후 45~185일에 영양 요구량의 100%를 급여한 대조구(CON), 70%구(NR), 70%에 단백질을 보조사료로 급여한 구(NRP)의 3구로 나누어 사양하였다⁶⁴⁾. 이렇게 생산된 자축을 비육한 결과, 수율 등급(주6)은 NR에서 유의하게 높고 지육 중량에 대한 반건양근의 중량 비율은 낮았으나, 체중이나 반건양근, 심장, 폐, 신장, 췌장 중량에는 3구 간에 유의한 차이가 인정되지 않았다. 또 피하지방, 신주위지방, 내장 및 대망지방의 지방세포 직경은 NR에서 CON에 비해 유의하게 커졌다. 피하지방에서 Fatty acid transporter 1 유전자의 발현이 높아져 있었으나, Glut4, FATP4, LPL의 발현에는 차이가 인정되지 않았다. 임신 중기의 영양 제한에 의해 지방세포로의 분화 수준이 낮고, 결과적으로 지방세포 수가 적으며, 그것을 보충하듯 지방세포의 비대가 일어나고 있을 가능성이 있다.</p>
<p class="rb-p">이상과 같이 근년의 연구에서는 임신 초기의 강한 영양 제한이나, 중기에 걸쳐 영양 요구 70%로 제한을 가하더라도 그 자축의 피드롯 방식 비육 후 출하 시 지육 중량 등에는 큰 영향이 인정되지 않는다는 것을 알 수 있다. 그 한편으로 조직 내에서는 근섬유 수나 세포 크기 등의 차이가 생기고 있을 가능성이 시사되고 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주6) 수율 등급(Yield grade): 지육에서 쇠고기가 얻어지는 비율의 지표. 일본이나 미국 등에서 각각 소 지육의 데이터를 이용하여 지표를 도출하는 계산식이 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">임신 중기·후기 영양이 자축의 산육성에 미치는 영향</p>
<p class="rb-p">태아기 프로그래밍에 관한 소의 실험도 근년 많아지고 있다. 근년의 연구에서는, 소에서 어미소의 방목지 초지 개량에 의해 임신 중기부터 후기의 영양을 높이면, 그 자축의 성장, 비육 후 출하 시 체중이나 흉최장근의 연도(やわらかさ), 지방 축적이 개량되지 않은 방목지에서 사양한 어미소 무리의 자축에 비해 향상되는 경향이 나타나고 있다⁶⁵⁾.</p>
<p class="rb-p">Webb 등은 앵거스와 시멘탈의 교잡종을 이용하여 임신 중기와 후기의 대사단백질(Metabolizable protein: MP) 제한에 대한 자축의 산육성에의 영향을 조사하였다⁶⁶⁾. MP 102%와 MP 85%의 2군을 설정하여 실험을 행한 결과, 임신기 요구량 85%라는 가벼운 MP 제한은 그 자축의 비육에서의 산육성에서 대조구(요구량 102% 충족)에 비해 지육 구성, 고기의 전단력가(주7)나 지방산 구성을 조금 변화시킨다. 즉 임신 후기에 MP가 제한되면 식육의 전단력가가 늘어 단단해진다. 또 육질로서 지방산 구성에서는 팔미트산(C16:0)이나 올레산(C18:1 n9 cis), 아라키돈산(C20:4 n6)의 비율을 유의하게 감소시켰다. 그러나 Webb 등은 그것은 미량이며, 비육 방법으로 극복할 수 있는 정도일 것이라고 결론지었다. 한편 좀 더 극단적으로 영양을 변화시킨 경우의 연구도 있다. Maresca 등은 앵거스 번식우의 임신 중기부터 후기의 영양을 정미에너지(Net Energy: NE) 요구량의 121%(사료 중 단백질 약 12%)와 64%(사료 중 단백질 약 6%)의 2군으로 나누어, 그 송아지의 비육 후 산육성에 대해 비교하였다⁶⁷⁾. 비육 후의 지육 중량이나 골격근 내 지방 비율, 피하지방 비율은 양 구간 차이가 인정되지 않았으나, 등심 단면적(ロース芯面積)이 64%구에서 유의하게 작아졌고, 근섬유 직경에 차이는 없었으나 근섬유 수가 감소하였다.</p>
<p class="rb-p">다음으로 임신 중기부터 후기의 영양을 양이 아니라 질을 변화시킨 경우, 그 어미소로부터 생산된 송아지의 산육성이 어떠한 영향을 받는지에 대해 몇몇 연구를 소개한다. Radunz 등은 앵거스 교잡종의 임신 후기에 해당하는 임신 167일부터 건초(섬유질 사료), 옥수수(전분 사료) 및 주정박(蒸留穀物; 섬유질+단백질+지질) 급여구의 영양 질이 다른 3구로 나누어 사양하였다(모든 구에서 건초의 에너지 섭취량과 동일하게 급여)⁶⁸⁾⁶⁹⁾. 우선 어미소를 보면, 어미소의 급여 후 혈중 인슐린 농도나 BUN은 주정박구에서 가장 높아졌으나, 비유량이나 그 유질에는 구간 차이가 인정되지 않았다. 다음으로 생산된 송아지에 대해서는, 옥수수구와 주정박 급여구에서 사양된 어미소에게서 태어난 송아지의 체중이 건초구보다 컸다. 어미소의 섭취 영양의 질에 의한 대사 변화가 태아로의 에너지 분배에 영향을 미쳤다고 고찰되었고, 출생 시 체중에도 영향을 미치고 있음이 나타났다. 생산된 송아지의 이유 시 체중은 옥수수구와 주정박구에서 건초구보다 컸으나, 비육 종료 시 체중과 지육 중량에는 3구 간에 차이가 인정되지 않았다. 공복 시 글루코스 농도는 옥수수구에서 가장 높고 주정박구에서 가장 낮았다. 송아지의 비육 후 지방교잡도는 건초구에서 가장 높고 옥수수구에서 가장 낮은 경향이 인정되었다. 주정박구는 그 중간이었다. 한편 같은 그룹의 연구에서 Wang 등은 앵거스 교잡종 암소의 임신 중기부터 후기에 저전분질 사료인 헤일리지와 고전분질 사료인 옥수수 사일리지의 2구로 나누어 급여하고, 그 어미소에게서 생산된 신생 송아지로부터 생검으로 골격근 샘플을 채취하여 게놈 각인에 관여하는 유전자나 DNA 메틸화 효소 생성에 관여하는 유전자군의 발현을 조사하였다⁷⁰⁾. 결과, 유전자 발현에서 2구 간에 다름이 발견되었다. 즉 이들 유전자군은 특히 옥수수 사일리지구에서 헤일리지구보다 높은 발현이 관찰되었다. 이러한 점들은 임신 중 어미소의 사료가 태아 프로그래밍에 관여하여, 기반적 성장에 관여하는 인자나 그 유전자의 메틸화에 영향을 미치고 있을 가능성을 보여주었다. 그러나 상기 Radunz 등의 연구⁶⁸⁾⁶⁹⁾를 보면, 같은 처리에서 자축의 비육 후 산육성의 표현형에는 큰 차이가 인정되지 않고 있다.</p>
<p class="rb-p">後藤 등 연구 그룹의 예비 실험에서는, 와규에서 임신 후기의 영양 요구량을 60%로 한 영양 제한에 의해, 그 송아지는 영양 요구량 100%의 어미소에게서 태어난 송아지에 비해 흉최장근 내 지방 형성과 관련된 유전자 발현이 유의하게 변화함을 확인하고 있다. 앞으로 추시(追試)가 필요하지만, 와규에서 태아기 대사 프로그래밍의 가능성이 시사되고 있다(미발표 데이터).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주7) 전단력가(shear force): 식육의 연도(부드러움)의 세계적 지표. 근섬유에 대해 수직 방향으로 물리적 압력을 가하여 절단될 때의 최대 저항을 측정하여 얻는 값.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신기 영양이 자축의 번식성 등에 미치는 영향</div>
<p class="rb-p">그 밖에 소에서 육용 번식우나 그 번식성에 대한 영향에 관해서도 근년 데이터가 축적되고 있다⁶⁾. 젊은 번식우의 임신 초기 영양 제한은 125일령 태아의 체중을 감소시킨다⁷¹⁾. 한편 임신 말기에 영양 섭취가 부족했던 어미소에서는 태반 중량이 증가해 있었다⁷²⁾. 또 태아기 성장이 정체되어 있던 번식우 무리에서는 난소 중량과 난포 크기가 작다고 보고되어 있다⁷³⁾. 나아가 임신 후기에 단백질을 보충받은 어미소에게서 태어난 암송아지는 성숙 후의 번식성이 향상될 가능성이 있다고 보고되어 있다⁷⁴⁾.</p>
<p class="rb-p">지금까지의 연구를 개관하면, 태아기에는 임신 전기의 55%까지의 영양 제한이나 전기·중기의 70% 정도의 영양 제한으로 태아의 골격근 수나 근섬유형, 지방세포 수 등에 대한 영향이 인정되며, 그것은 출생 시 체중에도 반영된다고 생각된다. 그러나 지금까지의 임신기 영양 제한 연구에서, 현실적으로는 피드롯 방식이나 그 밖의 사양 혹은 비육에 의해 차이가 명확히 나타나지 않은 보고도 많다. 동물은 출생 후의 영양 섭취에 의해 가능한 부분에서 세포를 비대시켜 보충하려 한다. 실험으로서는 적지만, 반대로 수정 전부터 임신 중기까지를 과도한 영양 상태로 한 경우, 태아의 체중, 체장, 혈중 글루코스 농도, 혈중 IGF-I 농도, 인슐린 농도, 반건양근은 현저히 커진다고 한다. 이로부터 임신기에 과도한 영양 상태에 놓인 어미소에게서 생산된 송아지의 산육성은 상당히 향상될지도 모른다⁵⁾. 면양에서는 신생자기에 모축에 의한 자연 포유인지 혹은 인공 포유인지 등에 따라 그 후의 성장에 명확한 차이가 나타나는 것으로 보인다. 앞으로 이 대사 프로그래밍이라는 개념을 축산 분야에 적극적으로 응용해 갈 경우, 태아기·신생자기의 사양과 비육을 조합하여 고려할 필요가 있다. 최근 골격근은 간이나 지방조직과 네트워크를 구축하고 있어, 운동기관일 뿐 아니라 마이오카인 등의 생리활성물질을 분비하여 면역에도 관여하고 있다고 보고되어 있다³⁴⁾. 또 골격근량은 각종 대사성 질환에서 흡수재 같은 역할도 하고 있다고 보고되어 있다. 이러한 점들은 무엇보다 임신기의 영양 상태가 태아의 성장을 촉진하여, 굵은 근섬유가 풍부한, 이른바 골격근이 더 발달한 신생자를 생산하는 것이 면역을 높이고 사료 섭취량을 향상시킨다는 것을 의미한다. 나아가 비육과 그 후의 산육성에서도 중요하다고 추찰된다. 더하여 지방세포를 골격근 내에 많이 분화시켜 두는 것은 생후의 육질 조절에서 유리해질 것으로 예상된다.</p>
<p class="rb-p">이상, 태아기의 영양 환경과 영양의 질이 생산된 자축의 기반적 체질에 현저한 영향을 미친다는 것이 시사되고 있다. 소 생산에서 이 메커니즘을 긍정적으로 활용할 수 있다면, 소의 능력을 더욱 항진시켜 지금까지 없던 저비용으로 고품질 쇠고기를 생산하는 사양 시스템을 창출할 가능성이 있다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 1-10, 後藤貴文. 원문 그대로 번역, 정리 전.</span></p></div>
  
<div class="modal-sub" style="margin:22px 0 6px;">안산을 위한 초회 임신기의 영양관리 (일본송아지 6-2)</div><div class="rb-block">
<div class="modal-sub" style="margin:18px 0 6px;">유용우</div>
<p class="rb-p">송아지 육성의 최종 목표는 안전한 분만과 분만 후 생산성의 확보이다¹⁾. 초산우에서는 모체의 체격에 대한 태아의 비율이 크기 때문에, 분만 시 체중(분만한 뒤의 체중)이 목표에 이르지 못한 경우 난산이 되기 쉽고, 또한 분만 후 유생산성의 저하를 초래한다¹⁾. 유용우의 평균 임신기간은 홀스타인 279일(262~309일), 저지 279일(270~285일), 브라운스위스 290일(270~306일), 에어셔 278일, 건지 284일로 기재되어 있어²⁾, 품종에 따라 다소 차이는 있으나 대략 10개월이다. 따라서 이 10개월간의 영양관리에 대해, 안전한 분만과 분만 후 생산성을 확보할 수 있는 초회 종부 시 및 초산 분만 시의 목표 체중, 사육 기준이 되는 일당증체량(DG), 그때의 건물섭취량(DMI)과 양분요구량, 아울러 사육환경에 대해서도 파악하는 것이 중요하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">초회 발정과 월령 및 체중의 관계</div>
<p class="rb-p">초회 발정(춘기발동)은 유전적으로 결정된 월령과 체중이 관여하며, 홀스타인의 초회 발정 월령은 양호하게 발육한 경우 8개월령, 체중은 260 kg 전후, 체고는 115 cm 전후로, 체중과 체고는 월령과 관계없이 거의 일정하다¹˒³⁾. 일본사양표준(2017년판)에서는 초회 종부 개시 기준은 14~15개월령 이후, 목표 체중은 성숙 시 체중의 약 55%로 350 kg 정도, 체고 125 cm 정도로 되어 있다¹⁾. 그러나 근년에는 초산차의 유량이 증가하고 있어, 분만 후 유생산성의 관점에서 375 kg 정도에서의 수태가 권장되고 있다¹⁾. 또한 송아지의 출생 시 체중이 모우의 분만 전 체중의 9% 이하일 때 난산 발생률이 저하되므로, 예상되는 출생 송아지 체중의 적어도 11배의 체중으로 발육시킬 필요가 있다고 여겨지며, 초산 분만 시의 체중은 성숙 시 체중의 82~90% 정도를 적정으로 하고 있다¹⁾. 한편 NRC 사양표준(2001)의 목표 체중은 절식 후 체중(사료나 물을 섭취시키지 않고 하룻밤 절식한 뒤의 체중: 통상 체중의 96%)을 기준으로 생각되고 있다. 초회 종부 및 초산 분만 시의 목표 체중은 일본사양표준(2017년판)과 거의 같아 성숙 시의 각각 55%와 82%이며, 기보고된 성숙 시 체중 641 kg으로부터 각각 352 kg과 526 kg이 기준으로 되어 있다³⁾. 또한 캐나다의 1995~2012년 데이터에 기초한 조사에서는 15개월령, 24개월령 및 성숙 시 체중에 해당하는 3산 이상 경산우의 분만 시 체중이 각각 홀스타인 425 kg, 627 kg, 710 kg, 에어셔 334 kg, 482 kg, 625 kg, 저지 297 kg, 429 kg, 470 kg, 브라운스위스 379 kg, 560 kg, 670 kg이며, 각 유용우의 최적 수태 월령은 13.6개월령, 15.5개월령, 12.6개월령, 14.5개월령이었다고 제시하고 있다⁴⁾. 이 조사로부터 성장이 느린 에어셔 이외의 유용우는 24개월령에서의 초회 분만이 가능하며, 또한 일본사양표준(2017년판)에서도 초산 분만이 22~24개월령 정도에서 초산 시 유생산량이 높아진다고 하고 있다¹⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">초회 분만과 유량의 관계</div>
<p class="rb-p">영국의 대규모 조사에서는 21개월령 분만이 그 이후 월령에서의 분만에 비해 초산 시 305일 유량이 낮아지는 것으로 나타났으나, 생애 유량은 가장 많은 22개월령에 이어 두 번째였다⁵⁾. 또한 일본 조사에서는 육성우의 종부까지의 DG를 0.9~1.0 kg 정도로 높이고, 나아가 급여 사료 중 조단백질(CP) 함량도 높임으로써 11~12개월령에 수태시켜 21개월령에 초회 분만을 맞아도 초산 시 유생산성에 악영향이 없는 것으로 나타났다⁶⁾. 이 조사에서 수태 시 체중은 345 kg, 임신기간의 DG는 0.67 kg, 초산 분만 후 체중은 531 kg이었으므로⁶⁾, 종부 전 발육이 양호한 개체는 이들 수치를 목표로 사육함으로써 21개월령에서도 안전한 분만이 가능하다고 할 수 있다. 생산 현장에서 체중 측정이 곤란한 경우도 있으므로 흉위에 의한 체중 추정이 유효하다(표 6-2-1). 한편 초회 종부까지의 DG가 1.03 kg을 넘으면 유선 발달에 악영향을 미쳐 초산차의 유량이 저하된다고 보고되어 있다¹⁾. 또한 분만 시의 과비는 분만 후 케토시스나 지방간 등 대사병 발병 위험을 높이므로⁷˒⁸⁾, 체중뿐 아니라 BCS도 모니터링하면서 사육해야 한다.</p>

<div class="modal-sub" style="margin:14px 0 6px;">DG와 양분요구량의 관계</div>
<p class="rb-p">목표로 하는 DG를 달성시키기 위한, 임신요구량을 제외한 초임우 육성에 필요한 1일당 양분요구량을 표 6-2-2에 나타냈다. 나아가 일본사양표준(2017년판)에서는 태아 발육에 필요한 양분도 고려해야 한다고 제시하고, 분만 전 9~4주와 분만 전 3주~분만의 각 기간에 가산해야 할 양이 설정되어 있다¹⁾. 더불어 난산 회피와 육용 밑소 확보를 위해 유용우, 특히 홀스타인 미경산우에 흑모화종의 수정란 이식 또는 인공수정(AI)도 일상적으로 이루어지고 있으므로, 태아 품종별 발육에 필요한 1일당 양분요구량을 표 6-2-3에 나타냈다. 이들 기준치를 참고로 육성 암소의 월령과 임신 일령, 태아 품종을 고려한 사료 설계가 요망된다. 또한 양분요구량을 충족하기 위한 완전혼합사료(TMR) 급여 사료 중 양분 함량의 기준을 표 6-2-4에 나타냈다. 사료 중 CP 함량이 12% 이하가 되면 소화율이 저하되는 경향이 있으므로 TMR 급여 사료 중 CP는 12%로 하는 것이 바람직하다¹⁾. 이상의 영양관리에 의해 분만 예정일 8~6주 전에는 BCS⁹⁾가 3.25~3.50, 체중 약 580 kg(흉위 193 cm)에 도달해 있을 것, 거기서 분만까지의 BCS 증가는 0.25 이내로 억제하고 분만 시에는 3.50 정도로 할 것을 권장하고 있다¹˒¹⁰⁾. 나아가 임신 말기 21일간은 태아의 급성장에 더해 분만을 향한 호르몬의 혈중 농도 변화가 극적으로 일어나므로 채식량이 저하된다¹˒³⁾. NRC 사양표준(2001)에서는 이 기간의 DMI 추정식을 「DMI(체중 대비 %) = 1.71 − 0.69e^0.35t (t = 임신일수 − 280)」로 제시하고 있다³⁾. 더불어 이 기간은 유선의 성장도 고려하여 급여 사료 중 CP 함량을 15%(일본사양표준(2017년판)에서는 14% 정도), 건물 중 에너지 함량을 1.62 Mcal NE_L/kg(TDN 환산 70%)으로 할 것을 권장하고 있다¹˒³⁾.</p>

<div class="modal-sub" style="margin:14px 0 6px;">기온과 수분요구량</div>
<p class="rb-p">물도 중요한 영양소이다. 수분 섭취, 물의 체내 이동 및 방산은 체액과 태수의 항상성 유지, 사료의 소화관 내 이동과 소화·흡수, 세포 내 물질대사와 대사산물의 운반·배설 및 체온조절 등에 관여한다¹⁾. 육성우의 수분요구량은 몸의 유지와 성장, 태아의 성장, 분뇨, 땀, 폐와 피부로부터의 불감증산에 필요한 양이며, 기온 13℃ 이하에서는 DMI 1 kg당 3.5~3.6 kg이고, 기온이 이보다 높아지면 요구량은 기온이 1℃ 오를 때마다 0.1 kg 증가한다¹⁾. 육성우의 자유음수량은 사료의 건물 함량과 음의 상관관계에 있으나, 건물 함량이 33~48% 범위에서는 그 영향이 없다¹⁾. 또한 방목 시의 음수량은 체중 100 kg당 하절기 16 kg, 추절기 12 kg 정도가 기준이 된다¹⁾.</p>
<p class="rb-p">서열이나 한랭 같은 외기온의 영향과 방목 사양에 대해서도 고려할 필요가 있다. 육성우에서 서열의 영향은 종부 전 육성 전기보다 임신기인 육성 후기에 더 현저하며, 서열 환경에서는 증체가 억제되지만, 육성 전기에 서열 환경에서는 체단백질이 아닌 체지방의 축적 배분이 높아진다고 제시되어 있다¹⁾. 육성기의 여분의 지방 부착은 분만 후 대사병 발병의 요인이 된다⁷˒⁸⁾. 그 때문에 육성우에서도 비유우와 같은 대응이 필요하며, 기온이 떨어지기 시작하는 저녁 이후의 급이나, 발한과 유연에 의한 칼륨 및 나트륨 손실을 고려하여 환경온도가 26℃를 넘는 경우에는 미네랄 급여를 10% 증가시킬 것이 권장되고 있다¹⁾. 한편 한랭 시에 대해서는 서열 시에 비해 연구 보고가 적으나, 유량이 많을수록 발열량이 많기 때문에 비유하지 않는 육성우에서는 한랭 대책이 필요하다¹⁾. 한랭하에서 체온을 유지하기 위해 필요한 에너지는 표면적과 열생산량에 더해 풍속과 피모의 길이 및 상태가 관여한다³⁾. 피모의 단열 효과는 오염이 없고 건조한 상태에 비해 몸 아랫부분이 약간 오염된 경우 0.8배, 젖어서 엉킨 경우 0.5배, 젖은 눈이나 진흙으로 덮인 경우 0.2배로 저하된다는 점을 고려해야 한다³⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">목표 체중과 에너지요구량</div>
<p class="rb-p">방목 시에는 사사 시에 비해 채초나 보행 이동에 의한 에너지 소비량이 증가하는 것도 고려해야 하는데, 표 6-2-5에 나타낸 것처럼 유지에너지 증가량은 방목 조건에 따라 크게 다르다¹⁾. 가장 가까운 방목 조건의 초질을 기준으로, 표 6-2-6에서 채식 초량과 TDN 섭취량을 확인함과 아울러 유지요구량의 증가 비율로부터 표 6-2-7에 제시한 에너지요구량을 참조하여, 목표 체중 및 DG에 따른 영양관리가 필요하다.</p>

<div class="modal-sub" style="margin:14px 0 6px;">초종과 계절에 따른 변화</div>
<p class="rb-p">초종의 차이나 계절에 따른 성분 변화에도 유의해야 한다. 일반적인 한지형 목초의 건물 중 TDN 함량 및 CP 함량은 오차드그라스와 티머시에서 봄 75%와 20~25%, 여름 65%와 18%, 가을 70%와 17%, 페레니얼라이그라스에서 봄 80%와 23%, 여름 70%와 22%, 가을 75%와 30%, 메도우페스큐에서 봄 75%와 20%, 여름과 가을 67%와 30%이다¹⁾. 또한 잔디(시바)의 TDN 함량은 봄·여름·가을 모두 52% 정도이고 CP 함량은 10~12%로 매우 낮다¹⁾. 나아가 방목 시 초고와 초량, 식생에 따른 방목초의 영양 변화나, 자교성 곤충에 대한 행동 변화도 방목 시 채식량과 에너지 소비량에 영향을 미친다는 점에 유의해야 한다¹⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">사사 시의 주의점</div>
<p class="rb-p">시설의 제한이 없는 방목 시에는 소의 하루 행동의 약 80%를 채초 행동, 반추 행동, 횡와 행동이 차지한다¹¹⁾. 그 때문에 사사 시에는 소의 행동에 지장이 없는 휴식 장소와 채식 장소, 음수 설비를 설계해야 한다. 표 6-2-8에 육성우사에서 횡와와 기립 시 행동에 지장이 없는 설계치를 나타냈다¹¹⁾. 우상 폭은 소가 회전하지 않도록 요각폭의 75퍼센타일 값의 2배 정도로 해야 한다¹¹⁾. 또한 채식 장소가 부적절한 경우에는 몰아먹기나 골라먹기, 사조를 둘러싼 과도한 투쟁 행동 등이 일어나며, 특히 서열이 낮은 소에서는 채식 행동이 현저히 제한되므로, 임신 말기에 육성우와 경산우를 한 무리로 사양하는 경우에는 특히 배려가 필요하다¹¹⁻¹³⁾. 사조 폭은 우군 두수 × 요각폭의 1.5배로 하고, 통로 폭은 16개월령 미만에서 3,000 mm, 16개월령 이상에서 3,600 mm가 필요하다¹¹⁾. 급수기의 적절한 높이와 폭은 월령에 따라 다르며, 높이는 12~16개월령 75 cm, 16~20개월령 78 cm, 20개월령~분만 1개월 전 80 cm이고, 1두당 폭은 각각 50 cm, 55 cm, 60 cm로 하고 있다¹¹⁾.</p>

<div class="modal-sub" style="margin:18px 0 6px;">육용 번식우(흑모화종)</div>
<p class="rb-p">육용우 번식경영(흑모화종)에서는 송아지가 거의 유일한 생산물이며, 유산 또는 난산에 의한 사산은 경영상 큰 손실이 된다. 또한 송아지가 생산되어도 면역력이 떨어지고 각종 질병에 저항력이 없으면 발육도 떨어져 시장 가치가 낮아진다. 따라서 안산으로 튼튼한 송아지를 생산하는 것이 중요하다. 한편 미경산우는 앞으로 많은 산자를 낳을 것으로 기대되지만, 발육과 임신이 동시에 진행되는 시기이며 큰 스트레스를 받고 있는 상황에 있다. 특히 초산 시의 난산은 자궁 손상 등을 고려하면 향후 번식에 큰 악영향을 줄 가능성이 있다. 또한 분만 후 비유량도 성숙한 소에 비해 적을 것으로 생각되어 송아지 발육에 미치는 영향도 유의해야 한다. 이를 바탕으로 미경산우의 관리에 대해서는 충분히 신경 쓰고 정성껏 할 필요가 있다. 다만 육용 미경산우 관리에 관한 보고는 극히 적으므로, 여기서는 일반적인 경산우에 관한 지견도 바탕으로 미경산우의 임신기에 대해 해설한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">영양관리로 조절할 수 없는 부분</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">초회 종부 시 미경산우의 체격, 성숙도</p>
<p class="rb-p">흑모화종은 8개월령 전후에 성성숙을 맞고 13개월령 전후에 초회 교배를 하는 것이 일반적이다¹⁴⁾. 교배 시 체중은 300 kg, 체고는 116 cm로 되어 있으나¹⁵⁾, 흑모화종은 각 지역에서 개량된 품종이므로 계통에 따라 체형에 차이가 보인다. 계통도 고려하여 발육의 양부를 판단하고 교배에 공시할 필요가 있다¹⁵⁾.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">초회 종부 시 주의사항</p>
<p class="rb-p">미경산우는 경산우에 비해 체격이 작기 때문에, 정상적으로 분만 기전이 일어났다 하더라도 태아가 큰 경우에는 난산 위험이 높아진다고 생각된다. 흑모화종의 임신기간과 송아지의 출생 시 체중은 태아(송아지)의 유전자형의 영향을 받는다고 보고되어 있으므로¹⁶⁾, 미경산우의 교배 시 사용하는 정액의 선택은 중요하다. 근년에는 육종개량이 진행되어 증체 형질이 우수한 종모우가 많아졌는데, 증체 형질이 우수하다는 것은 출생 후뿐 아니라 태내에서도 우수하다고 생각할 수 있다. 또한 임신기간이 길어짐으로써 출생 시 체중도 커질 수 있다. 이로부터 안산을 최우선으로 생각한다면, 종모우의 후대검정 시 임신기간이나 산자의 출생 시 체중을 조사하는 등, 적어도 미경산우의 교배 종모우 정액은 극단적인 증체계 종모우의 이용을 피하는 등 신중하게 선택할 필요가 있다.</p>

<div class="modal-sub" style="margin:14px 0 6px;">사양관리</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">초회 임신기(수정 시)의 영양관리(기본 개념)</p>
<p class="rb-p">일반적으로 미경산우는 경산우보다 수태하기 쉽다고 하지만, 적정한 사양관리를 게을리하면 수태율 저하를 초래하게 된다. 미경산우는 발육 도중에 있어 섭취해야 할 영양량이 나날이 증가하기 때문에, 섭취 양분량의 부족은 발육 저하를 가져오고 초회 발정이 늦어지는 경향이 있다¹⁷⁾. 한편 과잉 양분 섭취는 과비에 의한 번식성 저하를 초래한다고 생각된다. 또한 경산우에서는 CP의 과잉 섭취가 번식성 저하를 일으킨다는 보고가 있으며¹⁸⁾, 이는 미경산우에서도 마찬가지라고 생각된다. 과잉 CP 섭취는 제1위에서 과잉 암모니아 발생을 가져오고, 이 과잉 암모니아는 간에서 분해(해독)되게 된다. 이 시기의 미경산우는 간기능이 경산우만큼 높지 않다고 생각되므로, 암모니아 분해는 간의 부담을 증대시켜 간기능 저하 등을 일으킬 수 있다. 한편 CP 부족도 번식성을 저하시킬 가능성이 있다¹⁹⁾. 이로부터 미경산우에서는 경산우 이상으로 TDN, CP 섭취량의 과부족에 유의할 필요가 있다. 육용 미경산우의 필요 양분량을 표 6-2-9에 나타냈다.</p>
<p class="rb-p">또한 흑모화종은 다른 품종에 비해 자연 쌍태 발생률이 낮다고 여겨지지만, 지속적으로 영양상태가 나쁜 우군에서는 흑모화종에서도 이란성 쌍태 발생률이 높아지는 것이 의심되는 사례가 보고되어 있다²⁰⁾. 쌍태는 단태에 비해 난산이 될 가능성이 높으므로, 과거에 자연 쌍태 발생이 인정된 농장에서는 미경산우에 한하지 않고 초음파검사 등으로 쌍태 여부를 확인함과 아울러 사료 설계의 재확인이 필요하다. 또한 쌍태 임신의 경우 임신기간은 짧아지는 경향이 있다.</p>
<p class="rb-p">이처럼 초회 임신에서 미경산우의 사양관리는 자신의 발육에 필요한 양분을 섭취하면서 과잉 양분 섭취를 막는 것이 중요하다. 과비가 된 미경산우의 사료 급여량을 줄이는 것은 발육 정체도 초래할 수 있으므로 그 후의 사료 설계는 어려워진다. 이 때문에 사료 설계와 섭취 영양량의 확인 및 영양상태 모니터링으로서 체중과 영양도, BCS의 확인을 수시로 해 나갈 필요가 있다. 대사 프로파일 테스트 등을 이용해 영양상태를 모니터링하는 수법도 있으나, 미경산우는 발육에 맞추어 혈액검사치가 변동하므로(그림 6-2-1)²¹⁾, 경산우의 적정치²²⁾를 이용한 안이한 혈액진단은 피해야 한다고 생각된다(표 6-2-10).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-2-1 흑모화종 미경산우의 혈액생화학검사치와 월령의 관계(문헌 21의 보고에서 월령에 따른 변화가 보인 항목을 발췌하여 작도). 12~21개월령에 걸쳐 Glu(혈당)는 약 85→60 mg/dL로 저하, FFA(유리지방산)는 약 80~130에서 110~225 μEq/L로 상승, T-cho(총콜레스테롤)는 약 115~140에서 75~115 mg/dL로 저하, Ca(칼슘)는 9.7~10.5 mg/dL로 거의 일정.</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">초회 임신기(분만 전)의 영양관리, 군 관리</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">(임신 말기) 분만 2개월 전 이전의 관리(영양상태)</p>
<p class="rb-p">미경산우는 임신기간 중에도 자신이 발육하고 있으므로, 모체 발육에 필요한 양분량은 조금씩이지만 서서히 늘어나게 된다. 이 때문에 임신 말기에는 성우보다 체격이 작음에도 불구하고 필요한 양분량은 성우보다 많아질 가능성이 있다. 예를 들어 13개월령 전후에 초회 교배를 한 경우 분만은 23개월령 전후가 되는데, 이 월령의 평균 체중은 428.9 kg¹⁴⁾이 된다. 체중 400 kg의 미경산우라도 발육하고 있는 경우에는 체중 450 kg의 성우보다 필요한 양분량이 많아진다(표 6-2-11). 이 시기가 분만 전 2개월이 되는 경우에도 필요한 양분량이 성우보다 많아진다는 점을 유의해 둘 필요가 있다(표 6-2-11). 이로부터 미경산우의 임신 후기는 체중과 BCS, 임신 월령을 지표로 한 사료 설계가 중요하다. 더불어 미경산우의 임신 말기는 체중에 대해 DMI가 많아지는 시기이기도 하므로, 사료 설계대로의 사료량을 섭취하고 있는지 항상 확인할 필요가 있다.</p>

<p class="rb-p" style="font-weight:700;margin-top:10px;">초회 임신기(분만 전)의 영양관리의 영향</p>
<p class="rb-p">임신 말기의 영양상태 저하는 태아(송아지)의 면역에 악영향을 미친다는 보고가 많이 나와 있다²³⁻²⁶⁾. 이 때문에 미경산우에서도 임신 말기에는 적절한 증사를 할 필요가 있다. 그러나 과비 상태라면 난산 위험이 높아질 가능성이 있으므로 증사를 주저하지 않을 수 없다. 임신 말기의 증사는 적정한 BCS가 전제이며, 증사 전인 임신 후기에 과비로 만들지 않는 것이 중요하다. 난산 발생 예방으로 분만 전 모우의 사료 급여량을 줄이는 행위는 모우의 영양 부족을 초래하여 분만 지연을 일으키는 요인의 하나로 생각된다²⁷⁾. 소의 분만은 태아에서 분비되는 부신피질호르몬이 방아쇠가 된다고 여겨지므로²⁸⁾, 태아의 영양상태 저하로 장기의 성숙이 늦어지면²⁹⁾ 분만 개시 신호가 늦어져 임신기간이 길어질 가능성이 있다. 이러한 상태에서 임신기간이 길어지면 분만 유기를 하게 되는데, 성숙하지 않은 송아지가 허약하다는 것은 쉽게 상상이 간다. 태아도 태어난 송아지도 동일한 개체이므로, 태아기에 영양불량이나 스트레스 부하에 노출되면 출생 송아지에도 영향이 나오는 것은 당연하다고 생각된다. 또한 미경산우는 경산우에 비해 저영양의 영향을 받기 쉽다고 여겨지며, 분만 후 비유성이나 번식성이 저하될 가능성이 있다¹⁴⁾.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">분만 유기</p>
<p class="rb-p">분만 유기에 대해서는 태반 정체 발생이 많아지는 경향이 있을 뿐 아니라, 분만 유기로 태어난 송아지는 면역능이 낮아질 가능성이 지적되고 있다²⁹⁾. 임신기간이 길어져 부득이 분만 유기를 하는 경우에는 송아지가 허약할 가능성을 고려하면서, 장기 재태가 다발하는 경우에는 교배 종모우나 모우의 영양관리를 재점검할 필요가 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">영양관리의 정확도를 높이기 위한 사양관리</p>
<p class="rb-p">미경산우는 경산우에 비해 체격이 작고 군 사육 경험이 얕기도 하여, 경산우 무리에 섞어 사양하면 사회적 순위가 낮아지는 경향이 있다. 그 결과 충분히 사료를 섭취하지 못하거나 스트레스 부하가 커져 영양상태가 악화될 수 있다. 원래 미경산우는 경산우와 필요한 양분량이 다르다는 점과, 이러한 사회적 순위에 의한 영양상태 악화를 고려하면, 군 사육의 경우에는 경산우와의 혼사를 가급적 피해야 한다. 다만 미경산우만의 관리에서도 영양섭취량의 균일화는 중요하므로, 군 관리에서는 사료 섭취 중의 연동 스탠천 이용이 유효하다(그림 6-2-2).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-2-2 사료 섭취량의 균일화에 대하여(문헌 31에서 인용·개변). 군 사육의 경우 사료 섭취 중에는 연동 스탠천 등을 이용해 사료 섭취량을 균일화한다. 동일 군은 가급적 같은 체격의 소로 구성하고 사료 급여량을 평등하게 한다.</p>
<p class="rb-p">또한 분만 전에는 소독을 실시한 분만방을 준비하고 깔짚 등을 충분히 깔아 둔다. 1두만 있게 되는 고립 스트레스를 피하기 위해, 가능하면 분만방은 우군이 보이는 장소에 설치한다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">미경산우의 방목</p>
<p class="rb-p">미경산우를 방목 이용하는 경우, 방목 순치가 충분히 되어 있지 않은 상황에서는 섭취 사료의 감소에 따라 영양 부족이 될 가능성이 있다. 또한 방목 순치가 되어 있는 경우에도 경사지 보행이나 서열, 한랭 등으로 양분요구량이 증가할 뿐 아니라, 방목초의 사료 성분이나 기호성에 따라 섭취 양분량의 과부족이 생길 가능성이 있다. 이처럼 방목 이용에서는 필요한 양분량이나 섭취 양분량의 파악이 곤란하므로 체중과 BCS 등을 정기적으로 확인하는 것이 중요하다. 섭취 양분량이 부족한 경우에는 필요에 따라 배합사료 등의 추가 급여가 필요하다. 한편 방목은 포식 상태가 되므로 방목초의 영양가가 높은 경우에는 과비나 CP의 과잉 섭취로 이어진다. CP의 과잉 섭취는 번식성 저하뿐 아니라 유산의 가능성도 지적되고 있으므로³⁰⁾, 방목초의 사료 성분과 초량은 사전에 확인해 둘 필요가 있다. 또한 미경산우는 방목 경험이 적기 때문에 다양한 초종을 입에 댈 가능성이 있으므로, 방목지에 소에게 해가 되는 풀이 없는지 등 방목 전에 방목지의 식생을 확인할 필요가 있다. 임신우를 방목 이용하는 경우에는 분만 예정일 2개월 전까지 방목을 종료하고 임신 말기의 사양관리로 전환하는 것이 이상적이다. 방목 중에 과비나 삭수 등이 보인 경우에는 분만 2개월 전보다 일찍 방목을 끝내고 BCS를 조정할 필요가 있다. 이처럼 미경산우의 방목은 경산우보다 면밀한 관리가 중요하다.</p>

<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 6-2 안산을 위한 초회 임신기의 영양관리, 川島知之·渡邊貴之.</p>

<p class="rb-p">Jakobsen 등은 소의 태아, 자궁 및 태반 등의 에너지 축적량을 직접 측정한 결과, 임신일수에 대한 이들의 합계 에너지 축적곡선을 다음과 같이 제시하였다¹⁾. 이 식은 많은 연구자에게 인용되고 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">Y = 416.2e^0.0174t</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ Y(kcal): 에너지 함유량, t: 임신일수, R = 0.976</p>
<p class="rb-p">홀스타인의 임신 시 태아로의 단백질 축적량에 대해서는 Bell 등의 관찰 결과²⁾로부터 다음 식이 제시되어 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">Y = 0.461X² − 138.8X + 10,895</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ Y(g): 단백질 축적량, X: 임신일수, R = 0.95</p>
<p class="rb-p">흑모화종의 임신 시 에너지 축적량은 吉田(요시다) 등에 의해 임신일수를 변수로 한 다음 식이 제시되어 있다³⁾.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">Y = 757.551 + 132.115X − 181,484X² + 0.0070812X³</p>

<p class="rb-p">흑모화종의 임신 시 태아로의 질소 축적량에 관해서도 吉田 등의 관찰 결과³⁾로부터 다음 관계가 얻어져 있다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">Y = −0.32843 + 3.17318X − 0.042474X² + 0.00014862X³</p>

<p class="rb-p">젖소의 임신 시 대사에너지 요구량은 Moe와 Tyrrell이 97례의 대사시험 결과로부터 다음 식을 구하였다⁴⁾.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">Y = 100.8 + 0.567e^0.0174t</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ Y(kcal/kg^0.75/일): 대사에너지 요구량, t: 임신일수</p>

<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ ME(Mcal/일): 대사에너지 요구량, W: 체중(kg), t: 임신일수</p>
<div class="modal-sub" style="margin:14px 0 6px;">에너지 이용효율</div>
<p class="rb-p">모체가 섭취한 대사에너지가 태아에 의해 이용되는 효율은 젖소에서 10.5%, 헤리퍼드에서 14%, 흑모화종에서 15%라는 보고가 있다. 이러한 태아 축적에 대한 대사에너지 이용효율의 값은 각각 유지의 이용효율이 70~80%, 비유가 60~70%, 발육이나 비육이 40~60%라고 알려진 것과 비교하면 현저히 낮다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">임신 말기에 유지에 더하는 양분량</div>
<p class="rb-p">일본사양표준 육용우(2008년판)에서는 임신 말기 2개월간 태아 발육에 필요한 양분으로서 더하는 1일당 양분량을 조단백질 212 g, 가소화양분총량 0.83 kg, 가소화에너지 3.67 Mcal, 대사에너지 3.01 Mcal(12.58 MJ), 칼슘 14 g, 인 4 g으로 하고 있다⁶⁾. 또한 비타민 A 요구량은 체중 1 kg당 33.6 IU를 유지량에 더한다. 나아가 이 기간에 더하는 1일당 건물량은 1.0 kg을 기준으로 제시할 수 있다고 하고 있다.</p>

<div class="rb-block"><div class="rb-sub">질·자궁 탈출</div><ol class="rb-list">
<li>질·자궁경 탈출은 대부분 분만 전에, 자궁 탈출은 분만 후에 생기며 두 질환 사이에 연관은 없음. 질 탈출은 유우보다 육우에서 유전적 소인이 뚜렷하고 Hereford, Charolais, Limousin, Shorthorn 및 Bos indicus 계통에 많음. 기여 요인은 임신 말기 복압 증가, 혹한, 질 주위 지방 과다, 과거 질 주위 손상, 소화 안 되는 거친 조사료 다량 섭취, 임신 말기·발정기의 에스트로겐 상승에 따른 골반 인대 이완·부종, 외음 괄약근 기능 부전, 과배란 처리 받는 수정란 공란우 등임. 저칼슘혈증과의 연관은 칼슘 치료 반응에 근거한 추정이며 임상 징후로 확인된 것은 아님.</li>
<li>질 탈출은 중증도·손상 범위·자궁경 노출 여부로 1~4등급으로 나눔. 1등급은 누울 때만 질 점막이 간헐적으로 외음 밖으로 소량 나오는 것으로, 조직이 건조·손상되면 2등급으로 진행함. 2등급은 질 점막이 지속적으로 돌출하고 방광이 끼일 수 있으며 방치하면 빨리 3등급이 됨. 3등급은 질 전체와 자궁경이 지속 돌출하고 방광 함입과 자궁경 점액 마개 노출이 동반되며, 점액 마개가 액화되면 자궁 내 세균 오염으로 태반염·태아 사망이 오고 태아는 기종화되며 자궁경 개장이 불충분해 경질 분만이 어려움. 이것은 정확히 자궁경질 탈출이라 부르며, Bos indicus에서 자궁경만 유경성 덩이로 나오는 자궁경 단독 탈출과 구별함. 4등급은 오래 지속되어 질 점막 전체가 괴사·섬유화된 것으로 감염이 방광까지 침범하고 복막염이 올 수 있음.</li>
<li>임신우 치료 목표는 질·자궁경을 골반강 내로 정복·유지하고 살아 있는 송아지를 분만·이유시키는 것임. 치료법은 영구 정복용과 일시 정복용으로 나뉘며 한 방법이 모든 등급에 맞지는 않음. 선택은 탈출 중증도, 분만 예정일까지 남은 시간, 술자 선호, 치료 후 농가의 관리 능력에 따르고, 특히 노책이 문제가 되면 초기 선택을 바꿔야 함. 분만이 가까우면 분만 전 재발을 막기 위해 분만 유도를 권함. 오염·열상·패혈증·섬유화·괴사가 생기기 전에 즉시 정복·유지해야 분만 시 자궁경·질 이완이 방해받지 않으며, 농가의 자가 교정 시도는 불필요한 통증과 손상을 일으키므로 농가 교육이 최우선임. 원인이 제거되지 않으면 재발률이 높고, 산도를 좁히거나 유착을 만드는 치료는 분만 시 손상을 초래할 수 있으며 다음 임신에서도 흔히 재발하므로 송아지 이유 후 도태를 고려해야 함.</li>
<li>Caslick 봉합은 자극 없는 1등급, 분만이 가까우며 노책이 예상되지 않는 경우에만 쓰고, 단순 Caslick은 많은 경우 불충분함. 복압이 올라 노책이 시작되면 봉합이 찢어지거나 봉합 아래로 질이 다시 나오고, 분만이 가까울수록 외음이 연화·신장되어 더 그러함. 비임신우가 발정기에 1등급 탈출을 보이는 경우, 특히 과배란 처리 공란우에는 Caslick으로 충분한 경우가 많음.</li>
<li>Buhner 봉합은 진행된 등급과 만성 예에 효과적이며, 성공의 핵심은 자입 절개를 깊게 하여 유지선이 외음 입술보다 가능한 한 전방에 놓이게 하는 것임. 경막외마취 후 외음을 세척하고 외음 아래 정중선에서 가능한 한 전방에 1cm 자입 절개, 항문과 외음 상연 사이 중간에 두 번째 절개를 넣음. Buhner 침을 복측 절개에서 한쪽 외음을 따라 깊게 올려 배측 절개로 빼고 비흡수성 Buhner 테이프를 침 눈에 걸어 복측으로 되돌리며, 반대쪽도 반복한 뒤 두 끝을 묶어 복측 외음에 배뇨용 두 손가락 폭 개구를 남김. 매듭은 나비매듭 후 두 고리를 한 번 더 사각매듭으로 묶으면 풀어서 재정복·재조임이 가능하고 야간 관찰이 어려울 때 저녁에 풀어둘 수도 있음. 제대로 시술되면 배측 절개부에서 테이프가 보이지 않아야 분변이 침로를 따라 들어가는 것을 막음. 단점은 융통성이 없어 분만 개시 때 사람이 없으면 외음 중증 손상, 태아 자궁 내 사망, 자궁 파열·치명적 출혈이 올 수 있으므로 농가에 분만 시 입회가 필수임을 강조해야 함. 관찰이 어려우면 중간 굵기 장선을 두 겹으로 써서 분만 시 끊어지게 하며, 이는 분만 10일 이내 개체에 유용함.</li>
<li>부트레이스법은 외음 양측 유모·무모 경계에 배측에서 복측으로 제대 테이프나 돈용 비환으로 4~5개 고리를 만들고 테이프로 신발끈처럼 조이는 방법으로, Caslick보다 강하지만 외음이 안으로 말리고 시술이 번거로워 선호되지 않으며 분만 전 반드시 풀어야 함. 수평 매트리스(Halstead)법은 우측 외음 입술에서 둔부 피부 접합부 깊이에서 시작해 반대쪽 같은 깊이로 통과시키고 2~3cm 아래에서 되돌아오는 봉합을 배뇨용 두 손가락 폭이 남을 때까지 반복함. 단점은 세게 조이지 않아도 외음 부종이 심해지는 것으로, 직경 1.3cm PVC 관에 2~3cm 간격으로 구멍을 뚫은 스텐트나 나무 봉·라텍스 관을 양측에 대고 매트리스 봉합을 통과시키면 압력이 분산되고 깊은 유지력도 좋음. 깊은 수직 매트리스법도 스텐트를 권하며, 역시 분만 시 입회가 없으면 심각한 결과를 낳을 수 있음.</li>
<li>Minchev 질고정술은 질 점막하와 주위 근막 사이 유착으로 질을 골반 내 정상 위치에 유지하는 우수한 분만 전 영구법임. 원법은 경막외마취 후 둔부를 제모·소독하고 0.95cm 제대 테이프를 꿴 큰 S형 침을 질 내로 넣어 질 배외측벽에서 소좌골공을 찾아 음부신경을 피해 공의 배측으로 찔러 둔부 피부로 빼낸 뒤 너무 세지 않게 당겨 단추·판·거즈에 묶고 반대쪽도 반복함. 변법은 소좌골공 전방, 정중선에서 5cm 외측, 장골체 바로 뒤에서 천좌골 인대를 천골 외측 4~5cm 지점으로 통과시켜 더 전방에 고정하며, 좌골신경·음부동맥·직장을 피해야 함. Gerlach 침 변법은 침 끝을 손가락으로 가린 채 자궁경 근처 질벽 10시 또는 2시 방향으로 넣어 천좌골 인대를 뚫고 밖으로 내고, #8 폴리아미드 봉합사나 제대 테이프를 60cc 주사기 뚜껑·500ml 수액병 바닥 등으로 만든 플라스틱 원판 구멍에 꿰어 둔부에서 거즈 위에 묶음. 정복 후 노책이 드물고 무조력 분만이 가능하며 봉합은 2~4주 후 제거를 권함. 상용 키트는 15cm 투관침을 7.5cm 단추에 통과시켜 질 내로 가져가 소좌골공 배측·전방에서 직장을 피해 배외측으로 찔러 천좌골 인대와 대퇴이두근을 지나 피부로 내고 6cm 단추를 끼워 코터핀으로 고정 후 2.5cm 위에서 절단함. 질 배측만 고정되므로 재발 가능하고, 내측 고정이 너무 뒤쪽이면 부분 탈출이 노책을 유발해 전탈출로 이어질 수 있음.</li>
<li>Winkler 자궁경고정술은 자궁경을 치골전건에 봉합 고정하여 질 탈출을 막는 효과적 방법임. 접근은 좌측 요방 절개(시간이 걸리나 안전) 또는 경질(빠르나 침이 부러질 수 있음)이며, 경질법은 자궁경 하반부를 포함하거나 한쪽 외자궁구만 포함함. 경막외마취와 질 소독 후 골반연에서 치골전건을 촉지하고 정중선 양측 5cm 지점에서 건이 없는 작은 삼각 부위를 찾아, 약 150cm 비흡수사를 단 큰 곡침을 U자로 구부려 외자궁구 내강에서 바깥으로 통과시킨 뒤 치골전건을 내측에서 외측으로 지나 삼각 부위로 올려 다시 외자궁구를 바깥에서 중심으로 통과시켜 질 밖으로 빼냄. 묶을 때 요도에 카테터를 넣어 요도가 끼이지 않게 하고 매듭은 외음 밖에서 시작해 앞으로 밀어 자궁경의 후방 이동을 막을 만큼만 조임. Knowles 자궁경 겸자로 자궁경을 고정하면 침 통과가 쉬우며, 내강을 뚫지 않고 자궁경 측면만 거는 변법도 있음. 자력 분만 가능, 노책 드묾, 경질 검사 가능이 장점이고 자궁경 봉합사 파손 시 재발함. 호르몬성으로 추정되는 공란우 같은 만성 예에 권하며 유전성이 의심되면 도태함.</li>
<li>자궁 탈출은 대부분 분만 후 24시간 이내, 다수가 분만 직후 발생하며 분만의 1% 미만이지만 진정한 응급임. 탈출 자궁은 오염·외상·부종·출혈을 겪고 자궁 혈관 파열로 급속한 쇼크·사망에 이를 수 있으므로, 농가에는 운반하지 말고 비닐봉지로 덮어 오염을 줄이게 지시함. 많은 소가 저칼슘·부분 마비·탈진으로 서지 못하지만 일어나 뒷다리 사이로 자궁을 치며 난폭해지는 경우 혈관 파열로 급사할 수 있어 매우 조심스럽게 접근함. 원인은 원발성(저칼슘, 프로스타글란딘·옥시토신 수용체 감소, 과신장 자궁근 결함) 또는 이차성(탈진, 난산) 자궁 무력, 난산·견인·후산 정체·자궁경 퇴축 지연·산도 열상에 따른 지속 노책, 마비·저칼슘에 의한 장기 횡와로 인한 복압 증가, 과비, 혹한, 초지 에스트로겐 등 다인성임.</li>
<li>정복은 기립 또는 횡와 어느 자세로도 가능하며, 횡와 시에는 흉와 자세로 양 뒷다리를 뒤로 쭉 뻗게 하고 머리를 내리막 쪽으로 두는 "Okie 자세"가 골반을 앞으로 기울여 술자가 자궁을 무릎에 받친 채 넣기 좋음. 기립 시에는 보정과 보조자가 필요하며 타월·침대 시트로 자궁을 들어 올리게 함. 순서는 경막외마취 → 태막을 최대한 제거 → 자궁내막 세정(찬물을 담은 비닐봉지에 넣으면 세정과 부종 감소에 도움) → 윤활제 다량 도포 → 원위부부터 몸쪽으로 10~15분 압박 붕대. 설탕은 소량만 쓰며, 고장액은 부종을 더 줄이지만 건조·마찰로 자궁내막 손상을 늘리므로 50% 포도당이 기계적 자극 없이 삼투 효과를 냄. 비임신각(작은 태반절 고리로 둘러싸인 타원·틈새 모양 개구로 식별, 강한 각간 인대 때문에 탈출 안 됨)을 먼저 정복하고, 자궁경·자궁체부에서 양손 주먹으로 꾸준히 밀어 질 내로 넣은 뒤 자궁각을 점진적으로 밀어 넣음(손가락 천공 방지로 오븐 장갑을 쓰는 임상가도 있음). 팔이 짧으면 1L 음료병 바닥, 위플 배트, 프로방으로 자궁각 끝까지 완전히 뒤집어 넣음.</li>
<li>자궁각을 완전히 펴지 않으면 재탈출이나 자궁각 일부의 허혈성 괴사가 옴. 정복 후 옥시토신 20~30 IU를 주사하고 30분 간격으로 두 번 더 반복하며, 필요 시 칼슘 요법을 시행함(옥시토신은 정복 전에는 주지 않음). NSAID와 비경구 항생제를 투여하며, 항생제는 중증 손상·오염 자궁에서는 필요하나 신선하고 깨끗하게 정복된 경우 불필요할 수 있음. 외음 봉합은 논란이 있으며 자궁이 옥시토신에 반응하고 소가 설 수 있으면 재탈출 가능성이 매우 낮아 불필요하지만, 서지 못하고 노책이 재개되면 24~48시간 외음 봉합이 적응됨. 전체 사망률은 18~20%이고 발생에서 치료까지의 시간이 예후를 좌우함. 정확히 정복되어 생존하면 향후 번식 예후는 수용 가능하며, 방광 탈출·장 함입 동반 예는 예후 불량임. 질 탈출과 달리 유전성이 기록되지 않아 다음 분만에서 재발 확률 증가가 뚜렷하지 않으므로 도태를 서두를 필요는 없고, 자궁 손상 정도와 정복 소요 시간이 도태 결정의 주 요인임.</li>
<li>자궁 절단은 개방법과 폐쇄법이 있음. 개방법은 자궁체부를 자궁경 전방에서 자궁각 분기부까지 절개해 내부 장기를 복강으로 되돌리고 광인대를 펼쳐 주요 혈관을 긴장 없는 상태에서 이중 결찰·절단한 뒤 광인대를 절개해 복강으로 되돌리고, 자궁경 바로 앞 자궁체부에 서로 약간 겹치는 매트리스 봉합을 연속 배치하고 그 2~3cm 아래에서 절단하며 단단부는 단순 연속 봉합함. 술후 파상풍 톡소이드, NSAID, 항생제를 줌. 폐쇄법은 전체를 결찰해 10~14일에 탈락시키는 구제 수술로 중증 허혈 괴사·열상 예에 쓰며, 내부 장기가 끼인 채 결찰되면 치명적임. 결찰은 외과용 튜브·번지 코드 또는 대형 황소 거세용 무혈 거세기로 함.</li>
</ol></div>
<div class="rb-block"><div class="rb-sub">분만·유산 유도</div><ol class="rb-list">
<li>소에서 황체는 임신 전기간 프로게스테론의 주 공급원이며 황체 퇴행이 분만에 필수임. 태반(태반절 이핵세포)의 프로게스테론 생산은 임신 약 120일에 시작되고, 120~150일부터 약 240일까지는 태반 프로게스테론만으로 임신 유지가 가능하며 마지막 4~6주에 태반 프로게스테론이 점감하면서 다시 황체 의존이 됨. 따라서 5~8개월에 황체가 퇴행해도 당분간 임신은 유지되나 태반 프로게스테론이 감소하는 시점에 예정일보다 수 주 앞서 분만이 올 수 있음. 분만 개시의 방아쇠는 성숙한 태아 부신의 코르티솔 급증이며, 코르티솔이 태반의 17α-수산화효소와 17,20-데스몰라제를 유도해 프로게스테론을 안드로겐→에스트로겐으로 전환시키고, 프로게스테론 저하·에스트로겐 상승이 자궁근 탈분극·갭결합 형성·옥시토신 수용체 증가·프로스타글란딘 분비·자궁경 성숙을 일으킴.</li>
<li>분만 유도의 최대 제약은 비생존 미숙 송아지와 후산 정체를 피하기 위해 정확한 교배일을 알아야 한다는 점임. 2주 이내 조산 송아지는 활력이 좋고 초유 면역도 양호함. 태반 완전 성숙은 분만 3~5일 전에 일어나며 후산 정체 발생률은 유도 시점의 태반 미숙도에 비례해, 1~2주 조기 유도 시 75% 이상, 예정일 수일 이내 또는 만기 유도 시 10~50%임. 유도 후 후산 정체 자체는 대개 임신율을 떨어뜨리지 않으나, 후산 정체가 있었던 개체는 첫 수정 임신율이 유의하게 낮음. 예정일 22일 전까지 유도하면 초유 IgG 농도는 같아도 양이 4~9% 줄고, 10~15일 이상 조기 분만 송아지는 흡수 장애와 허약으로 초유 면역 수준이 낮음. 속효성 코르티코스테로이드로 만기 근처에 유도하면 초유 면역글로불린 농도는 자연 분만과 같고 흡수 능력도 유지됨.</li>
<li>적응증은 노동력 집중, 주간 분만 유도, 임신 기간 연장에 따른 태아 과대 방지 등이며, 교배일·AI일·ET일이 정확한 종축·전시우 농장에서 요청이 많음. 임신 285일에 유도하면 임신 연장을 막을 수 있는데, 태아는 마지막 수 주에 하루 0.45~0.68kg, 1~2주 지연된 유럽 대형종에서는 하루 최대 1kg까지 증체해 정상 분만이 불가능한 체중이 될 수 있고 IVM/IVF 유래 대형 산자 증후군도 같은 문제를 가짐. 유럽 대형종 처녀우에서 속효성 글루코코르티코이드로 지연 임신을 종결했을 때 산도 이완 불량과 무력 분만으로 난산이 보고되었으나 너무 이른 개입이 일부 원인이었을 수 있으며, 대부분은 분만 단계와 골반 이완이 정상임. 또 하나의 이점은 다음 번식기까지 10~14일의 재발정 여유를 주는 것이나 유도 후 후산 정체→자궁염·자궁내막염이 첫 발정을 지연시켜 이점을 상쇄할 수 있음. 교배일을 모르는 일반 비육·번식우에서는 자궁 수종, 심부전 등 모체나 태아 구제가 필요한 건강 문제에 국한됨.</li>
<li>속효성 코르티코스테로이드는 덱사메타손 20~30mg 또는 플루메타손 8~10mg 1회 근육주사이며, 만기 2주 이내 투여 시 80~90%에서 유도되고 주사~분만 간격은 24~72시간(평균 48시간)임. 72시간까지 분만하지 않으면 실패로 보고 재투여하면 대개 성공함. 골반 인대 이완·자궁경 개장·유방 충만이 빠르게 오고 분만 과정은 정상이며 난산 점수도 자연 분만과 다르지 않음. 2주 이내 조산 송아지는 활력이 있고 사망률이 늘지 않으며 초유 면역·총 유량도 정상에 가까움. 다만 단독 사용 시 후산 정체가 흔하고, 예정일 1주 이내 개체는 더 먼 개체보다 적음.</li>
<li>지속성 코르티코스테로이드(덱사메타손 트리메틸아세테이트 25mg 또는 트리암시놀론 아세토나이드 4~8mg)는 예정일 2~12주 전에 1회 근육주사하며 분만은 4~26일의 넓은 범위에 걸쳐 일어나고 예정일에서 멀수록 반응이 늦음. 송아지 생존이 최우선이 아닌 경우에 쓰며, 잠재 감염 악화와 모체 사망률 증가 가능성이 있음. 주사 약 1주 후 유방이 충만되지만 실제 분만은 1주 이상 더 걸릴 수 있어 분비 조직 퇴행 방지를 위해 분만 전 착유를 권하며 전체 유량은 4~9% 감소함. 후산 정체는 9~22%로 속효성보다 훨씬 낮은 대신(태반 성숙 유도), 송아지 사망률은 미숙·태반 조기 박리·자궁 무력 때문에 7~45%로 높음. 지속성 투여 약 1주 후 속효성 코르티코스테로이드나 프로스타글란딘을 추가하면 대부분 2~3일 내 분만해 변동이 줄고, 프로스타글란딘이 간격이 더 짧고 예측 가능하며 재투여가 적으나 송아지 사망률은 줄지 않음.</li>
<li>프로스타글란딘 근육주사 단독은 속효성 코르티코스테로이드와 매우 비슷해 24~72시간(평균 44.9시간)에 분만하고, 만기 2주 이내 투여 시 후산 정체가 많으며 10~20%의 유도 실패가 있고 임신 후기일수록 1회 주사 효과가 높음. 2주 이상 조기 유도 시 자궁 무력이나 태위 이상으로 난산이 많다는 보고가 있으나 1~2주 조기 유도에서는 차이가 없다는 보고도 있음. 클로프로스테놀 단독군은 태막 출현(2기 개시)에서 태아 만출까지가 더 길고 분만 시 프로게스테론이 높았는데, 덱사메타손이 제거하는 태반 프로게스테론이 남아 자궁 수축을 억제한 것으로 해석됨.</li>
<li>코르티코스테로이드는 태반 프로게스테론을, 프로스타글란딘은 난소(황체) 프로게스테론을 제거하므로 각각 단독으로는 남은 쪽 때문에 실패할 수 있고 병용이 두 공급원을 모두 제거해 실패가 적고 간격 변동이 작음. 덱사메타손+클로프로스테놀 병용은 25~42시간에 분만하고 실패가 없었으며, 덱사메타손 단독(29~65시간)과 클로프로스테놀 단독(37~57시간)은 10.5~16.6% 실패함. 병용 시 분만 과정은 정상이며, 모든 유도법에서 후산 정체는 대조군보다 높은데 예정일 전 분만으로 태반 성숙이 끝나지 않았기 때문임.</li>
<li>주간 분만과 낮은 후산 정체를 동시에 얻는 프로토콜은 지속성 코르티코스테로이드 전처치 후 덱사메타손+클로프로스테놀 유도임. Hereford계 소에서 임신 270일에 덱사메타손 트리메틸아세테이트(Opticortenol) 25mg을 주고 277일에 덱사메타손 25mg+클로프로스테놀 500μg을 주면 유도 후 28±0.8시간의 매우 짧은 범위에 분만하고 후산 정체는 대조군과 차이가 없었음(13% 대 6%). 분만 시간, 생시 체중, 난산 점수, 미숙 송아지 수는 차이가 없었음. 2차 시험에서 270일에 고용량(1mg/25kg) Opticortenol을 주고 276일 오전 9시에 DEX+CLO로 유도한 군이 후산 정체 29%로 가장 낮았고(대조군 5%), 모든 처치군이 약 30시간 후 오전 7시~오후 11시 사이에 분만함. 48시간령 송아지 IgG, 신생 질병, 다음 번식기 첫 수정 수태율·임신율은 대조군과 같았으나 후산 정체 개체는 첫 수정 수태율·임신율이 낮았음.</li>
<li>트리암시놀론(TRI) 전처치 변법은 임신 270일에 TRI 1mg/60kg을 주고 277일에 DEX+CLO로 유도하는 것이 최적이었으며 후산 정체 0%(대조군 5%), 모든 개체가 DEX+CLO 후 24~48시간에 분만하고 94%가 오전 7시~오후 7시에 분만 개시함(대조군 58%). 2기 분만 길이, 생시 체중, 난산, 송아지 활력은 차이가 없었음. 결론적으로 유도 전 코르티코스테로이드 노출이 후산 정체를 낮추며, 이 방식이 분만 시각 조절과 후산 정체 감소에 가장 유망하지만 시간이 더 걸리고 소를 여러 번 다뤄야 함. 교배일 확인은 송아지 생존이 중요하면 필수이고 후산 정체·자궁염 위험을 농가와 사전 상의해야 함.</li>
<li>유산 유도는 수술적 태아 제거를 제외하면 모두 프로게스테론 공급원을 직·간접적으로 제거해야 함. 황체는 임신 첫 120~150일과 마지막 1개월에 필수이고 120~150일부터 약 240일까지는 태반만으로 유지되므로 이 기간 황체 용해만으로는 유산되지 않음. 프로스타글란딘은 어느 시기든 황체를 용해하나 불완전하면 프로게스테론이 남아 자궁경이 부분 개장되고 노책만 보인 뒤 임신이 지속되며 새 황체가 형성될 수 있음. 글루코코르티코이드는 5개월부터 태반 프로게스테론을 줄이지만 단독으로는 마지막 수 개월에야 유산(조산)을 일으키고, 태아태반 단위가 기능해야 하므로 미라·침지 태아에는 무효임. 정리하면 처음 4~5개월은 프로스타글란딘 단독, 5~8개월은 프로스타글란딘 또는 덱사메타손 단독으로는 실패하므로 병용이 매우 신뢰할 만함.</li>
<li>오교배 시 선택 치료는 황체 용해이며, 황체가 배란 5~7일 후부터 프로스타글란딘에 반응하므로 오교배 7일 후부터 용해량을 투여할 수 있고 약 3일 후 발정이 와서 그 발정에 재교배 가능함. 60일까지의 임신에서는 유산과 동반된 발정의 첫 수정 임신율이 정상임. 비육 처녀우는 입식 시 모두 직장검사 또는 초음파로 임신 진단하고 그 자리에서 유산 유도 가능하나, 덱사메타손 사용 시 면역 억제로 질병 위험이 커지므로 건강하고 적응된 개체에 시행하며 통상 21일 적응 기간을 권함. 프로게스틴 함유 성장촉진제는 유산을 방해하므로 유산 후까지 보류함. 150일 이하는 프로스타글란딘 용해량 1회로 약 90% 유산되고, 150일 초과는 프로스타글란딘+덱사메타손 25mg 병용으로 95%가 3~9일 내 유산함. 유산 개체의 75~80%만 발정 징후를 보이고 유산이 눈에 띄지 않을 수 있으므로 10~14일 후 전 개체를 재검사하며, 실패 원인은 대개 황체 용해 실패로 재투여하면 됨. 유산 후 미라화가 2~4%에서 일어나고, 4개월 초과 임신의 유산은 80% 이상 후산 정체가 오나 대개 1주 내 배출되어 치료가 거의 필요 없으며 자궁내막염·화농성 분비는 대부분 자연 소실함.</li>
<li>수종(hydrops)은 요막수종이 흔하고 대량 축적 액으로 생명을 위협하며 향후 번식 예후가 불량~보류라 구제 도축이 권고될 수 있음. 치료를 택하면 복부 카테터로 배액하면서 경구·정맥 수액을 수일간 대량 병행하는 것이 첫 단계임. 프로스타글란딘 용해량+덱사메타손 25mg 투여 후 30시간쯤 자궁경 부분 개장과 태수 소실이 오지만 분만은 자궁경 불완전 개장·원발성 자궁 무력·복압 부족으로 비정상임. 대부분 7~9개월에 발생하고 태아가 작아 정복·견인으로 만출이 보통 성공하나 산후 자궁염으로 사망이 잦고, 제왕절개도 자궁이 무력·취약하고 태막이 거의 항상 잔류해 예후가 똑같이 나쁨. 태아 미라·침지는 황체 용해와 자궁경 개장 없이 태아가 죽은 결과로, 기능 황체가 흔히 있어 첫 치료는 프로스타글란딘 용해량이며 2~4일 내 배출이 시작되고 2차 투여는 보통 불필요함. 에스트로겐(디에틸스틸베스트롤 50~80mg 또는 에스트라디올 5~10mg 근육주사)도 24~72시간에 배출시키며 2차, 드물게 48시간 간격 3~4회가 필요하나 미국에서는 식용동물 사용이 금지됨. 어느 약제든 자궁경 개장 불량과 산도 건조로 배출이 불완전할 수 있어 윤활과 수조 만출, 산후 치료가 흔히 필요함. 유산 유도 시 태아 연령 산정이 필수이며 120일 이상 임신은 덱사메타손+프로스타글란딘이 필요함.</li>
</ol></div>
<div class="rb-block"><div class="rb-sub">난산과 임신 사고</div><ol class="rb-list">
<li>소에서 배 발달이 태아기(42일)에 이르기 전에 실패하는 것이 배사(embryonic death)이고, 42일 초과 태아의 임신 손실로 자궁 외 생존 가능 시점 이전의 것이 유산임. 배사 후 황체가 퇴행하고 수태 산물은 대개 관찰되지 않은 채 배출되며, 배사가 전체 임신 손실 중 가장 큰 부분을 차지함. 유산은 세균·바이러스·진균 감염, 독소, 유전 결함, 영양 불균형, 내분비 이상, 스트레스, 부적절한 약물 투여에 의하며, 광범위 검사에도 진단율은 50%를 넘기 어렵고 태아·태반·모체 혈청의 적시 채취와 정확한 군 병력, 복수 예 제출 시 진단율이 오름.</li>
<li>태아 미라화는 태아 사망 후 황체 용해가 없고 세균 오염이 없어 자궁경이 닫힌 채 태아·태반 액이 무균적으로 흡수·건조되는 것으로, 유산 중 소수에서만 일어나고 대부분 임신 3~6개월 사이에 발생함. 외부 징후는 황체 잔류에 따른 무발정뿐이고 자궁경이 열리기 전까지 질 분비물도 없어 임신 감정이나 분만 지연 검사에서 발견됨. 직장검사에서 두꺼운 자궁벽이 태아 잔존물을 꼭 감싸고 태반절이 촉지되지 않으며 태아 윤곽이 침지와 달리 매끈하고, 초음파가 진단에 유용함. 황체가 자연 용해되면 미라가 질로 밀려나오는 것이 임신 손실의 첫 징후일 수 있고 노책이 관찰되며 수조 회수가 필요할 수 있음. 치료는 프로스타글란딘 F2α에 의한 황체 용해가 가장 흔하며, 매일 완전 배출을 확인하고 필요 시 보조하며 반복 투여가 필요한 예도 있고 자연·유도 배출 후 재수태는 흔함. 용해 치료에 반응하지 않거나 태아가 큰 경우 자궁 절개로 수술 제거하며, 수술 회수가 경자궁경 보조 적출보다 번식 보존에 유리할 수 있고 접근은 요방 개복, 복측 정중, 질 절개(colpotomy) 중 술자 경험과 미라 크기로 정함.</li>
<li>태아 침지는 기능 황체 없이 사망한 태아가 자궁경 개장 부족으로 잔류하면서 자가융해되고, 열린 자궁경으로 들어온 세균이 체온에서 급증해 연부조직이 분해·액화되어 악취 조직 조각, 골 잔존물, 염증 삼출물만 남는 상태임. 모체는 중증 자궁염·독혈증의 전신 질환에서 간헐적 노책과 악취 질 분비물만 보이는 경우까지 다양하며, 전신 징후가 사라진 뒤에도 자궁경은 적어도 부분 개장되고 악취 분비가 지속됨. 촉진에서 골격이 붕괴된 날카로운 골편의 염발음이 "자갈 주머니" 같음. 전신 질환이 없으면 구제 도축을 권하고 그 외 많은 예는 안락사를 고려함. 자궁경 수조 개장 후 조각 제거는 가능하나 어렵고 시간이 걸리며 골편이 수축·염증된 자궁벽에 박혀 있고, 수축된 자궁과 패혈성 내용물 때문에 수술 접근도 제한됨. 제거에 성공해도 재수태는 드묾.</li>
<li>질·자궁경질 탈출은 임신 중후기에 가장 흔하며 임신 자궁에 의한 복압, 임신 후기 에스트로겐 상승, 노책을 일으키는 질·자궁경 이상, 과거 분만·난산 손상, 저질 조사료에 의한 복부 충만이 기여함. Hereford·Shorthorn에서 가족성 양상이 있고, Bos indicus와 교잡종은 후방 자궁경 고리가 넓고 외자궁구가 커서 분만을 거듭하며 전방 고리까지 뒤집혀 자궁경질 탈출이 됨. 임신 관련 질 탈출은 다음 임신에서 재발하기 쉬워 재번식을 권하지 않으나, 반복 과배란 공란우의 탈출은 유전성으로 보지 않음. 처음에는 흉와 시에만 보이다가 자극→노책→부종의 악순환으로 지속 돌출하며, 치료는 손상 조직 변연 절제와 정복이고 기법 선택 시 분만까지의 시간과 유지법이 분만을 방해할 가능성을 반드시 고려함.</li>
<li>자궁 염전은 드문 임신 사고로 특정 산과 처치나 제왕절개가 필요한 난산을 일으키며, 염전 각도와 지속 시간이 분만 진행·예후·관리를 결정함. 대형 심흉종·유우종이 위험이 높고 Brown Swiss에 과다 발생하며 Bos indicus는 낮고, 경산과 큰 태아가 소인이며 쌍태는 덜 걸림. 광인대가 자궁각 복측·소만곡에 붙어 있고 임신 후기 자궁각 대부분이 광인대 부착부 전방 복강에 놓여 있어, 소가 뒷다리를 먼저 일으키고 앞다리를 먼저 접어 눕는 습성상 하루 수 차례 자궁이 광인대에 매달리며, 이때 미끄러짐·넘어짐·태아 운동으로 회전이 생기고 반추위 충만 부족과 복근 긴장 저하도 기여함. 대부분 임신 말기에 분만 진행 실패로 처음 인지되며, 임신 감정 중 발견되는 45~90° 염전은 자연 해소되기도 함. 180°까지는 혈관 장애가 없어 분만 개시 전까지 징후가 없고, 180°를 넘으면 혈류 장애→정맥 울혈→자궁·태반 부종→태아 사망, 자궁벽 허혈 괴사→파열·모체 사망으로 진행함.</li>
<li>염전 교정은 방향 판정이 선행됨. 만기 산과 검사에서 질 바닥·벽의 나선 주름이 촉지되어 염전 존재와 방향을 알 수 있고, 질 침범이 없거나 분만 전 염전처럼 질 검사로 불분명하면 직장검사로 광인대의 긴장 방향으로 방향과 정도를 판정함. 자궁경이 열려 태아에 손이 닿으면 태아 머리나 어깨를 잡고 염전 반대 방향으로 점점 큰 호를 그리며 반복 흔들어 임신각 무게 중심이 균형점을 넘으면 자궁이 제자리로 내려앉는데, 상당한 체력과 체격이 필요함. 손으로 어려우면 염전 교정봉에 산과 체인을 가능한 한 근위에 걸어 양 끝 고리에 통과·고정한 뒤 염전 반대로 봉을 비틀어 태아와 자궁을 배측으로 균형점 너머로 회전시키며, 숙련되면 힘이 덜 들지만 염전으로 좁아진 질·자궁체 내강 때문에 체인 설치가 어렵고 사지·체인을 감시해 자궁 점막 손상을 막아야 함.</li>
<li>회전법(plank in the flank)은 많은 수의사가 선호함. 방향을 판정한 뒤 소를 염전 방향과 같은 쪽으로 횡와시키고 후복부에 긴 판자를 올려 체격 큰 사람이 올라서 자궁을 고정한 채 소를 배와 자세를 거쳐 반대쪽 횡와로 굴리며, 실패하면 수 회 반복함(판자 위 체중 약 150~200파운드). 보조 인력이 필요한 것이 제약임. 교정 후 자궁경이 충분히 열리면 경질 분만, 열리지 않으면 제왕절개나 절태가 필요하고, 다른 방법이 모두 실패하면 기립 요방 개복으로 교정하며 수술 교정 후에도 자궁 절개가 흔히 필요함.</li>
<li>자궁 수종은 태아 수분 과잉 생산 또는 태반 제거 부전으로 생기며 요막수종이 90% 초과를 차지하고 양막수종은 드묾. 요막수종은 태반 기능 결함으로 태반절 수 감소와 부속 태반을 흔히 동반하고, 자연교배·AI 임신 7500건 중 1건이지만 IVF·SCNT 임신에서는 200건 중 1건까지 높으며 일본 흑우에서 SLC12A1 상염색체 열성 돌연변이에 의한 가족성 발생이 보고됨. 임신 중기 이후 진행하며 농가는 수일 만의 복부 팽대를 보고하지만 축적은 수 주 전부터 시작됨. 양측 대칭 복부 팽만과 복부 타진 시 복부를 가로지르는 액체 파동이 특징이고 진단 시 흔히 수척함. 직장검사에서 팽만된 자궁벽은 만져지나 태반절 식별이 어렵고 태아는 대개 촉지 불가임. 태아는 거의 생존하지 못하고 모체를 살리려면 약물 종결이나 제왕절개가 필요하며, 경질 분만은 자궁 수축 부족으로 반드시 보조가 필요함. 집중 관리해도 분만 시 수분 소실에 따른 저혈량 쇼크와 산후 자궁염 위험으로 생명 예후가 보류이고 번식 예후는 불량해 안락사나 구제 도축이 흔히 적응됨.</li>
<li>양막수종은 드물며 두개안면 기형이나 신경근 장애로 태아가 양수를 삼킬 수 없을 때 생기고 임신 중기부터 만기까지 서서히 축적되어 정상 2~3L가 20L 이상이 됨. 복부 팽대는 임신 마지막 1개월~6주에야 나타나거나 분만 때까지 눈치채지 못할 수 있음. 원인은 유전 결함, 기형 유발 독소, 바이러스 감염에 의한 두개안면 결함이며 아메리칸 바이슨 수컷과 가축 소의 교잡 임신에서 흔함.</li>
<li>치골전건 파열은 복직근·내외복사근·치골근·박근의 치골 전연 부착 건이 끊어지는 것으로 거의 임신 말기에만 생기며 정상 임신, 쌍태 이상의 다태, 요막수종, 임신 연장에 의한 태아 거대증과 관련됨. 파열 후 후복측 복벽이 진행성으로 처지고 배꼽 앞까지 번지는 심한 부종이 동반되며 통증과 식욕 부진을 보임. 송아지와 모체 생명·번식 예후가 불량하고, 분만 유도 후 보조 경질 분만 또는 수술 분만으로 모체를 살리고 임신이 충분히 진행됐으면 산자를 얻을 수 있으나, 모체가 복압을 쓰지 못하므로 분만 시 산과 개입이 필수임. 임신 연장은 태아 시상하부-뇌하수체-부신 축의 발달 결함(유전 돌연변이, 기형 유발 독소, 감염)으로 자발 분만이 개시되지 않는 것임. Holstein의 상염색체 열성형은 태아 다모증, 과성장 발굽, 작고 무기능 부신을 가진 대형 송아지를, Guernsey의 뇌하수체 무형성형은 중증 두개안면 기형의 소형 송아지를 낳으며 임신 500일 초과가 보고됨. 이형접합 부모는 정상 표현형임.</li>
<li>난산은 분만이 지연·곤란한 것으로 분만 전후 송아지 손실과 신생 질병·사망을 늘리고, 산후 발정 재개 지연과 수태율 저하로 모체 번식도 떨어뜨림. 가장 흔한 원인은 태아-골반 불균형이며 그 외 태향·태위·태세 이상, 다태 동시 진입, 모체 대사병(저칼슘 등), 태아 기형이 있음. 초산에 많아 한 보고에서는 초산 처녀우의 최대 51.2%가 분만 보조를 받았고, 교배 전·임신 중 적정 성장 프로그램과 저~중 생시 체중 종모우 선발이 초산 난산 감소의 필수 요소임. 머리·사지 중복(dicephalus, polymelia), schistosomus reflexus, perosomus elumbis 같은 중증 기형 태아는 산도 한계에 맞지 않아 절태나 제왕절개가 필요함.</li>
<li>자궁 탈출은 분만 후 출혈·쇼크 위험으로 진정한 응급이며 조기 발견·신속 정복 시 생명 예후는 대개 양호하고 재번식 가능성은 중~양호, 다음 분만의 재발 위험 증가는 없다고 봄. 자궁 열상, 방광·장 함입, 노출 조직의 심한 건조, 저혈량 쇼크가 예후를 악화시키고 정복 불가·광범위 손상 예는 절단이 필요함. 진단은 점막면과 태반절(caruncle)의 존재로 하며 임신각만 또는 양측 각이 나올 수 있고, 소인은 난산(보조 유무 무관), 저칼슘, 앞부분을 높인 횡와·흉와임. 자궁 동맥 파열에 의한 실혈사를 막기 위해 조심스럽게 다루고, 경막외마취로 노책을 줄인 뒤 열상을 정복 전에 봉합하고 자궁각 끝까지 완전히 펴 재발을 막음. 저칼슘 동반 시 칼슘 투여를 정복 후로 미루면 골반 통과 중 복압을 줄일 수 있음. 자궁각 끝이 제대로 놓이면 Buhner 봉합은 불필요하지만 해는 적고 골반 외상으로 노책이 지속될 때 추가 안전장치가 되며, 술후 항생제와 신중한 자궁 수축제가 퇴축을 돕음.</li>
</ol></div>
<div class="rb-block"><div class="rb-sub">정복·견인·절태</div><ol class="rb-list">
<li>태향(presentation)은 태아 척추축과 모체의 관계로 종(앞 또는 뒤)·횡(배 또는 복)으로 나누며 앞종태향이 정상이고 횡태향은 소에서 매우 드묾. 태위(position)는 태아 등과 모체 골반 사분역(천골, 좌·우 장골, 치골)의 관계로 배천위가 정상이지만, 배천위와 좌우 배장골위 중간까지 약간 회전시키면 분만이 쉬워지며 이는 정상 분만에서 소가 횡와에서 흉와로 바꿀 때 자연히 일어남. 태세(posture)는 사지와 몸통의 관계로 구절·수근·견관절 굴곡 등으로 표현함. 정복(mutation)은 반전(repulsion, 태아를 골반 밖으로 밀어내기), 회전(rotation, 장축 회전), 전위(version, 횡축 회전), 사지 신전으로 태아를 정상 태향·태위·태세로 되돌리는 것이고, 강제 견인은 수동·기계 견인 분만, 절태는 태아를 분할·제거하는 것으로 경피 절태(피부를 통해 와이어로 절단하는 고전법)와 피하 절태(피부 절개로 사지 덩이만 빼는 부분 절태)가 있음.</li>
<li>기본 산과 장비는 산과 체인 2개 이상, 손잡이 2개, 견인기, Krey 갈고리, 기본 수술 세트임. 체인은 53, 76, 114, 152cm 길이가 있으며 세척이 쉽고 외견과 달리 태아·모체 손상이 적어 스트랩보다 선호되고, Muir 손잡이는 무거운 모델이 좋음. Krey 갈고리는 기형 태아나 사산 태아의 부분 절태에 자주 쓰여 기본에 넣고, 수술 세트는 회음 절개·사지 1개 절단·제왕절개용임. 추가 장비로 체인보다 머리에 걸기 쉬운 calf-saver 두부 스네어, 염전 교정봉(과 토크용 나무 봉), 쌍 둔 안구 갈고리가 있음. 고전 절태에는 절태기, 톱 와이어, 와이어 가이드, 절태 나이프, Krey 갈고리가 필요함. 보정은 술자와 소 모두에게 안전해야 하며, 농장 난산우는 횡와가 많지만 정복 등 대부분의 산과 처치는 잘 보정된 기립우에서 쉬움. 경막외마취 후 진통이 줄어 서지 않던 소가 서는 경우가 많음. 보정틀은 검사·준비·경막외마취에는 적당하나 처치 중 소가 쓰러질 때 측면을 열어 빼낼 수 있어야 하고, 전용 난산 틀이 아니라면 축사 구석에 두락을 걸어 묶는 것이 거의 항상 나음.</li>
<li>병력은 분만 지속 시간부터 묻되 농가가 말하는 시간은 분만 단계와 무관하게 소를 처음 본 시점부터인 경우가 대부분임. 1기는 조기 분만으로 4~12시간이며 요막 파수로 끝나고, 2기(진정 분만)는 송아지 만출로 30분~4시간이 전형적이나 송아지는 8~10시간 생존할 수 있으며, 3기는 태막 배출임. 따라서 "태막이나 다리가 보이는가", "파수가 되었는가"를 물어 2기 진입 여부를 확인하면 계속 관찰할지 즉시 출동할지 판단할 수 있고, 2기 진입과 후태향은 즉각 조치를 요함. 산차, 과거 분만 이력, 종모우도 묻되 긴 문진은 농가가 꺼리므로 처치 중에 얻는 것이 현명하며, 모체 대 송아지의 상대 가치도 관리 방향에 영향을 줌.</li>
<li>검사는 접근·보정 중 기질과 신체 상태 평가로 시작하고, 꼬리를 목에 묶거나 보조자가 잡게 한 뒤 회음을 비누·물로 씻음. 경막외마취 전후 어느 때든 하되 신속하게 태아 생존, 태향·태위·태세, 태아-모체 불균형 정도를 평가하여 관리 방향을 정함. 태아 생존 여부와 사망 경과 시간이 관리의 핵심 결정 요인으로, 태향·태위가 정상이고 사지만 이상이면 반전 후 교정·견인, 처녀우나 작은 소의 매우 큰 생존 태아는 제왕절개, 큰 사산 태아는 절태로 이어짐. 머리나 꼬리·미근을 확인하면 태향이 쉽게 판정되고, 사지만으로 판정할 때는 앞다리의 구절과 수근은 같은 방향으로, 뒷다리의 구절과 비절은 반대 방향으로 굴곡됨을 기억함. 10~15분 동안 진전이 없으면 기법을 재평가하고 생존 태아라면 제왕절개로 전환함.</li>
<li>정상 태세의 앞태향에서 견인 시 어깨가 골반에 걸리면서 앞다리가 즉시 심하게 교차되면 송아지가 너무 커 경질 분만이 불가하므로 제왕절개나 절태로 넘어감. 크기상 경질 분만이 가능하면 자궁경 개장 충분 여부, 탈진·자궁 무력, 저칼슘 등 동반 문제, 외음 개장 부족을 점검한 뒤 견인함. 머리·사지 방향이나 질·직장검사에서 태위 회전이 있으면 염전을 의심함. 머리 측방 굴곡은 반전 후 안와를 잡아 머리를 골반으로 당기며, 손힘이 부족하면 쌍 둔 안구 갈고리를 쓰고 머리가 닿지 않으면 먼저 목을 당겨 가까이 오게 한 뒤 반전과 교대함. calf-saver 스네어나 체인은 양 귀 뒤와 입을 통과하도록 걸고 체인 고리는 견인 시 조여지지 않게 하며, 머리 견인은 위치 교정용으로만 쓰고 분만 완료용으로는 쓰지 않음. 앞다리 굴곡은 반전 후 심한 정도에 따라 어깨 아래 상지→수근→구절 순으로 단계적으로 당기며 구절에 체인을 걸고 견인과 반전을 교대하고, 팔꿈치 굴곡만 있으면 선택적 견인으로 교정함. 견인 중 흉곽이 골반을 통과하면 잠시 멈추고 코·입의 태막을 제거하고 필요하면 머리를 치거나 혀를 당겨 자극한 뒤, 견인 재개 전 송아지를 30~45° 회전시켜 고관절이 골반에 걸리는 hip-lock을 예방함. hip-lock이 생기면 기립우에서는 견인 방향을 거의 수직 아래로 바꾸고, 횡와우에서도 먼저 같은 방향 전환을 시도하되 견인기를 쓰고 있으면 먼 쪽 끝을 소의 뒷다리 사이로 향하게 하며, 안 되면 소를 등으로 넘겨 뒷발을 잡고 반대쪽 횡와로 굴림. 방향을 바꾸지 않은 채 계속 당기면 송아지·모체 손상이 흔함.</li>
<li>후태향에서 뒷다리가 굴곡되어 뒤로 간 것이 고전적 breech이며, 반전 후 비절 굴곡·후인→구절→발을 순서대로 끌어와 분만 위치에 둠. 횡와우에서는 극히 어려우므로 기립 보정을 최대한 시도하고 반전 시에는 항상 경막외마취를 쓰며 자궁 파열에 주의함. 오랜 진통으로 태수가 소진되고 자궁이 수축되어 정복이 어려우면 비위관으로 윤활제나 물 또는 혼합액을 자궁 내로 주입해 자궁과 태아를 분리하고, 자궁 이완을 위해 1:1000 에피네프린 10ml 정맥주사를 쓸 수 있으나 부작용으로 사망할 수 있어 임상가 판단으로 개별 적용함(이속수프린·클렌부테롤도 자궁이완제이나 미국에서는 식용동물 사용 불가). 뒷다리 교정 후 또는 정상 후태향 견인 시 송아지 꼬리를 아래로 유지해야 하며, 꼬리가 위로 고정되면 날카로운 복측 미추 돌기가 모체 질 배측을 찢거나 더 흔히 꼬리가 부러져 보행은 가능해도 고유감각과 방광 긴장이 없는 신경 결손이 남음.</li>
<li>강제 견인에서 손 견인은 손상이 드물어 논점은 견인기 사용이며 신중하게 쓰면 안전함. 손상으로는 폐쇄신경보다 좌골신경 손상에 의한 분만 마비(장기 난산에도 오지만 과도 견인이 가장 흔한 원인), 자궁·자궁경·질 파열, 체인 위치 불량과 과도 견인에 의한 중수·중족골 골절이 있음. 충분한 윤활과 신중한 견인으로 거의 항상 예방 가능하며 메틸셀룰로스계 윤활제를 자궁 내와 태아 주위에 주입하고 견인 중 추가함. J-Lube는 소 복강에 노출되면 사망을 일으켰으므로 제왕절개로 갈 가능성이 있는 예에서는 금기임. 견인은 천천히, 모체 진통에 맞춰서만 하고 진전이 없으면 멈춤. 견인기 힘은 "장정 두 명 이상의 힘은 쓰지 않는다"는 옛 원칙대로 과하지 않아야 하며, 양 앞다리 교대 견인 모델이 있으나 실험에서는 동시 견인이 최적이었음. 안전한 기계 견인의 핵심은 윤활, 올바른 체인 장착, 견인 중 30~45° 회전, 진통에 맞춘 견인임.</li>
<li>절태는 자궁·질 내에서 태아를 둘 이상으로 분할하는 것으로, 경피 절태는 꼰 와이어 톱으로 피부·근육·골을 절단함. 표준 Utrecht법(앞태향)은 머리, 한쪽 앞다리, 반대 앞다리, 몸통(최대 2절), 골반 양분으로 총 5~6절이며 태아-골반 불균형의 완전 절태임. 1~2절의 부분 절태로 충분한 경우가 많음. 절태기에는 길이의 5배 이상 톱 와이어를 꿰어 머리를 넘길 고리와 양 관 끝 손잡이 고정 여유를 둠. 와이어가 관 입구 직전에 교차되면 조기 파손되므로 확인하고 절태기를 장축으로 돌려 풀며, 보조자는 와이어가 조직에 완전히 물릴 때까지 짧고 부드럽게 교대 당기다가 스트로크와 장력을 늘리고 저항이 급감하면 절단 완료임.</li>
<li>앞태향 절태 1절(두부)은 와이어 고리를 손으로 머리에 걸고 절태기 머리를 귀 뒤쪽으로 밀어 넣고 장력을 줘 목 둘레 위치를 확인함. Utrecht 표준은 하악지 뒤(복측 포함) 위치지만 저자는 기갑부 또는 양 견갑 전내측 등쪽까지 전진시켜 머리와 한쪽 어깨를 한 번에 제거하는 변법을 선호함. 절단 중 절태기 머리 위에 손을 얹어 자궁을 보호하고, 절단된 머리는 손 또는 두부 스네어·체인으로 견인함. 이 절은 목의 걸림을 없애고 어깨의 내측 이동을 늘림. 2·3절(앞다리)은 고리를 다리에 걸고 절태기를 다리 외측을 따라 견갑 후연의 배후측까지 전진시키며 와이어는 액와에서 등·배측으로 상지를 지나 견갑 배후측에서 관으로 들어가야 함. 체인을 구절에 걸어 장력을 준 뒤 절태기 손잡이 잠금판에 고정해 다리를 완전 신전 상태로 유지하고 절단하며, 절단 후 견갑 골편이 남았는지 촉진해 수조 둔적 박리로 제거함. 반복 삽입으로 윤활제 추가가 필요함.</li>
<li>머리·앞다리 제거 후 남은 몸통은 흉곽 입구를 통해 손으로 흉강을 적출하고, 기종 태아는 횡격막을 뚫어 복강 내용물까지 가능한 한 적출해 부피를 줄인 뒤 Krey 갈고리를 척추 전단에 걸어 견인점으로 씀. 몸통 절단은 와이어 고리를 흉곽 전단에서 몸통을 따라 마지막 늑골 뒤·장골익 앞 요추부로 옮기고 절태기 머리를 몸통 배외측에 두며, 와이어 이동이 어려우면 와이어 통과기를 등 쪽으로 넘겨 복측에서 회수함. Krey 갈고리 체인에 장력을 줘 잠금판에 고정하고 절단함. 흉곽이 너무 크면 와이어를 흉곽 입구에서 넣어 복부 절단면으로 빼내 늑골-흉추 부착부 가까이서 종절하면 흉강이 무너져 작아지며, 날카로운 골단에 주의함. 골반 양분은 Krey 갈고리를 요추에 걸어 골반 입구에 유지한 채 반꿴 절태기의 와이어 통과기를 골반 등쪽에서 서혜부까지 넘겨 모체 치골 전연과 태아 골반 사이로 손을 넣어 양 뒷다리 사이에서 회수하고, 절태기 머리를 요추 절단면에 미근 고랑 선택 쪽 척추 약간 외측에 두어 비대칭으로 양분하며, 와이어는 미근-좌골결절 사이 고랑을 지나 서혜부·복측으로 돌아 반대 관에 들어가야 함.</li>
<li>후태향 절태는 와이어 고리를 선택한 뒷발 발톱에 걸고 다리 외측을 따라 절태기 머리를 대전자 부위 골반 등쪽에 두고, 체인을 걸어 장력 후 잠금판 고정 뒤 절단해 다리를 제거함. 남은 뒷다리에 체인을 걸고 당겨 분만 가능 여부를 보고, 불가하면 반대 뒷다리 절단 또는 요추 횡단을 선택함. 요추 횡단 와이어 설치는 두 방법으로, 완전히 꿴 절태기를 발톱에서 다리를 따라 마지막 늑골 바로 뒤까지 올려 절태기 머리를 전요추 배외측에 두거나, 반꿴 절태기의 와이어 통과기를 요추부에서 한쪽 복측으로 내려놓고 등 쪽으로 손을 빼 반대쪽 복측에서 회수함. 체인을 다리에 걸어 완전 신전으로 잠금판 고정 후 절단하고 골반과 다리를 제거함. 이후 손으로 복강을 적출하고 Krey 갈고리를 척추에 걸어 골반 입구에 유지한 채 견갑 후연 바로 뒤에서 흉곽을 절단하며(체인을 와이어 고리에 통과시켜 전진), 흉곽이 크면 앞태향과 같이 늑골 부착부를 따라 종절함. 남은 전부는 양 앞다리 제거 또는 대각 종분할로 처리하며 저자는 대각 분할을 택해 와이어 통과기를 등 쪽에서 목과 한 앞다리 사이로 내려놓고 복측에서 회수해 반대 팔꿈치 내측을 지나게 하고, 절태기 머리는 와이어 통과 반대쪽 척추 외측, Krey 갈고리는 절태기 반대쪽에 두어 부등분으로 절단함.</li>
<li>피하 절태는 특수 기구 없이 가능하며 주로 앞다리, 때로 뒷다리 제거에 쓰임. 머리를 제거하거나 태아를 자궁체로 반전시켜 태아 머리가 자궁경 앞에 있게 하면 골반강 접근이 좋음. 다리를 신전시키고 중수골 수준 또는 그 근위(구절 근위가 외음 밖으로 나올 수 있어 적합)에 피부 환상 절개를 넣고, 견관절 수준에서 다리 전면을 따라 환상 절개까지 직선 절개함(손가락·손바닥 절태 나이프, 수술칼, 주머니칼, 커터 등 사용 가능하며 커터는 날 출입이 가능해 안전). 다리에 견인을 걸면 직선 절개가 쉽고, 견갑에서 시작하기 어려우면 환상 절개 가장자리에서 시작함. 두 절개가 만나는 모서리를 뒤쪽으로 벗기고 작은 절개를 넣어 손가락 걸이로 쓰다가 나중에 체인 견인점으로 씀. 피부를 견관절까지 둔적 박리하며 절태 치즐이나 염전 교정봉을 쓸 수 있고 부패 정도에 따라 박리가 불필요할 수도 있음. 박리 완료 후 원위 다리에 체인을 걸어 견인으로 분리하며 손 힘만으로는 추가 박리가 필요하고, 제거한 다리의 피부는 나머지 태아 견인 시 기구 부착점으로 활용함. 다양한 태세 이상에서 정복 조작이 모체 산도에 위험하다고 판단되면 맞춤 절태로 태세 이상을 해소함. 기형 태아는 크기·변형·유연성이 다양해 절태를 우선 고려해야 하며 태아 크기 축소라는 같은 원리를 적용함. 난산 관리의 목표는 항상 모체, 그다음 송아지의 손상 회피이며 장시간 산과 처치는 결과가 좋지 않음.</li>
</ol></div>

<div class="modal-sub" style="margin:22px 0 6px;">분만 시 사고와 관리 (일본송아지 2-1)</div><div class="rb-block">
<div class="modal-sub" style="margin:14px 0 6px;">분만과 신생 송아지 사망</div>
<p class="rb-p">산업동물인 소에게 분만은 필수불가결한 생애 사건이다. 분만 시 마주치는 큰 문제는 난산(Dystocia)과 신생 송아지 사망(Perinatal mortality)이며, 소의 생산을 저해하는 중요한 장벽이 된다. 미국의 보고에서는 젖소의 난산 발생률이 약 9%, 신생 송아지 사망 발생률이 약 7%이며, 신생 송아지 사망의 2/3는 분만 시에 일어난다¹·²⁾. 이러한 문제를 극복하기 위해서는 주산기에 일어나는 다양한 변화를 올바르게 이해하고, 적절한 관리와 대응을 하는 것이 요구된다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">분만 징후와 예측</div>
<p class="rb-p">분만의 진행 상황을 파악하는 것은 난산이나 사산을 예방하기 위해서도 매우 중요한 관리의 하나다²⁾. 이를 위해서는 분만 직전 소에서 보이는 다양한 신체적 혹은 행동의 변화를 이해하고, "언제 소가 분만할 것인가"를 예측할 필요가 있다. 임신 말기에는 태아와 어미소의 내분비학적 변화에 의해 어미소에 다양한 변화가 일어난다. 골반 주변의 인대, 특히 천좌인대(Sacrosciatic ligament)는 서서히 이완되지만 분만 직전에는 급격히 이완되는 것으로 보고되어 있어³·⁴⁾ 분만을 예지하는 데 유용한 지표가 된다. 또 유방이 서서히 종대하고, 분만이 가까워지면 유두 안에 초유가 가득 찬다³⁾. Streyl 등은 천좌인대의 이완과 유두 내 초유를 함께 평가하는 것이 12시간 이내에 분만이 일어날지 여부를 판정하는 데 유용한 지표가 된다고 보고하였고⁵⁾, Burfeind 등은 체온을 지속적으로 측정하면 질 내 및 직장 내 온도가 분만 2일 전쯤부터 저하되기 시작한다고 보고하였다⁶⁾. 또 분만 직전에 일어나는 체온 저하는 육용 품종에서도 보고되어 있다⁷⁻⁹⁾. 나아가 분만이 가까워지면 안절부절못함(Restlessness), 발 구르기(Stepping)¹⁰⁾, 꼬리 들기(Tail raising)¹¹⁾, 복부를 돌아보는 자세(Turning the head toward the abdomen)¹²⁾, 외음부로부터의 점액 누출(Vaginal discharge)³·¹³⁾ 등이 인정된다. 이러한 신체적 변화나 특징적 행동은 모든 임신우에서 인정되는 것은 아니며, 또 확실히 분만을 예지할 수 있는 것도 아니므로, 몇 가지 지표를 조합하여 종합적으로 판단할 필요가 있다. 최근 행동이나 체온의 변화, 분만 개시를 감지하는 분만 감시 장치가 시판되고 있다. Palombi 등은 질 내 유치형 분만 감시 장치를 이용하여 분만 관리를 한 경우의 분만 사고와 그 후의 번식 성적에 대한 영향을 조사하였다. 대조군(감시 장치를 사용하지 않은 우군)에 비해 감시 장치를 이용하여 분만 관리를 한 군에서는 사산, 태반 정체 및 자궁 감염증의 발생률이 유의하게 낮았고, 공태일수도 짧았다고 보고하고 있다¹⁴⁾. 한편, 항상 분만을 관찰하는 사람이 소 곁에 있음으로써 분만 개조율의 상승이나 불필요한 개입에 의해 분만에 문제가 생길 위험이 높아지는 것도 우려된다. 대략 3~6시간마다의 순회로 분만의 개시나 이상 분만을 발견할 수 있다고 보고되어 있다¹⁵⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">분만방으로의 이동</div>
<p class="rb-p">분만 예정일이나 분만 전의 신체적 징후에 근거하여 어미소를 분만방(Maternity unit)으로 이동시킬 필요가 있다. 프리스톨에서 사육되는 소는 분만 전 36시간 이내가 되면 다른 소에서 떨어진 구역에 누워 혼자 있기를 선호하게 된다. 따라서 이 시기에 분만방으로 이동시켜 격리하는 것은 분만 예정우의 자연스러운 욕구를 충족시키는 것이 된다. 그러나 분만방으로의 이동이 너무 이르면 분만방의 위생 상태를 유지할 수 없게 되므로, 가능하다면 분만 1~2일 전에 이동시키는 것이 이상적이다²⁾. 신경질적인 소나 초임우의 경우는 분만방으로의 이동 후 새로운 환경에 익숙해지기까지 시간이 걸리므로, 불필요한 개입을 하지 않고 조용히 두는 것이 좋다. 자세한 내용은 2-3 「분만방의 관리(102페이지)」를 참조하기 바란다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">정상 분만의 과정</div>
<p class="rb-p">분만은 3개의 단계(제1~3기)로 분류된다¹⁶⁾. 제1기는 자궁 수축(Uterine contraction)이 시작되고 자궁경관 확장(Cervical dilation)이 일어나는 시기다. 이 시기의 어미소는 안절부절못하며, 꼬리 들기나 산통 유사 증상(그림 2-1-1), 기립과 횡와를 반복하는 행동을 보인다. 제1기의 시작을 정확히 파악하기는 어렵고, 또 개체차도 크다³⁾. 10~20%의 소, 특히 초임우는 제1기 특유의 행동을 보이지 않고 제2기가 시작되는 경우가 있다. 만약 분만방이 아니라 건유우나 초임우의 사육 시설에서 분만 제2기가 시작되어 버렸다면, 익숙한 환경에서 그대로 분만시키는 것이 좋다²⁾. 제1기의 징후가 경산우에서 6시간, 초임우에서 12시간 지속되고 제2기가 시작된 모습(양막의 출현 등)이 인정되지 않는 경우는 시험적인 내진^주1)을 할 필요가 있다. 이를 통해 과대 태아, 사망 태아, 태위·태세 이상, 쌍태, 자궁근 무력증, 자궁경관 확장 부전 및 자궁 염전 등의 이상을 조기에 발견할 수 있다²⁾. 자궁경관의 확장이 시작되어 있고 그 밖의 이상이 없으면 1시간마다 관찰하면 된다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-1 산통 유사 증상을 보이는 분만 제1기의 소 (원도: 滄木孝弘, 이하 동일)</p>
<p class="rb-p">요막융모막(Allantochorion)의 대부분은 질 내에서 파열(파수)하여 다갈색 액체를 다량 배출한다(그림 2-1-2). 요막융모막의 파열에 이어 흰 양막(Amnion)이 출현하는데(그림 2-1-3), 요막의 파열부터 양막의 출현까지 시간이 걸리는 경우는 과대 태아나 태위·태세 이상 등의 이상이 고려된다. 양막 속에 태아의 발굽이 보이기 때문에 "족포(足胞)"라고 불리기도 한다. 요막이나 양막 속에 있는 태수는 자궁경관의 확장을 촉진하고, 자궁 수축을 촉진하는 퍼거슨 반사(Ferguson reflex)의 자극이 된다. 또 산도를 통과할 때 태아의 머리를 보호하는 데 도움이 되므로, 요막이나 양막은 인위적으로 터뜨려서는 안 된다. 약 20%의 송아지는 양막이 터지지 않은 채 만출된다²⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-2 위 그림이 파수(요막융모막의 파열) 직전의 외음부, 아래 그림이 파수의 순간</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-3 흰 양막의 출현으로 제2기가 시작된다</p>
<p class="rb-p">제2기는 자궁경관의 완전 개대부터 태아가 만출되기까지의 사이이며, 양막의 노출이나 태아 발굽의 출현에 의해 그 시작이 인식되는 경우가 많다¹⁷⁾. 양막 혹은 태아의 발굽이 보이고 나서 자연히 만출되기까지의 시간은 초임우에서 약 90분, 경산우에서 약 45분이지만, 10분에서 6시간까지 큰 편차가 있다²·¹⁸⁾(그림 2-1-4).</p>
<p class="rb-p">제3기는 "후산기"라고도 불리며, 태아가 만출되고 나서 태아 태반이 배출되기까지의 기간이다. Van Werven 등의 연구에서는 66%의 소가 태아 만출 후 6시간 이내에 태반을 배출했다고 보고하고 있다¹⁹⁾. 일정 시간 이내에 태반이 배출되지 않는 상태를 "태반 정체(Retained fetal membranes)"라고 부르지만, 그 정의에 대해서는 태아 만출 후 8~48시간으로 다양한 보고가 있다¹⁹⁻²³⁾. 일반적으로는 12시간이 경과해도 태아 태반이 배출되지 않는 경우를 태반 정체로 정의하고 있다(그림 2-1-5). 태반 정체는 자궁 수복 및 첫 수정일수의 지연, 수태율 저하, 공태일수 연장을 초래하기 때문에²⁴⁻²⁶⁾ 소의 생산성에 악영향을 주는 것으로 알려져 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-4 제2기의 경과를 잘 관찰하는 것이 신생 송아지 사망을 막기 위해 중요하다</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-5 태아 만출 후 12시간 이내에 태반이 배출되지 않는 경우를 태반 정체라고 부른다</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주1) 내진: 질로 손을 넣어 산도 내 태아의 상태를 촉진하는 것.</p>
<div class="modal-sub" style="margin:14px 0 6px;">난산</div>
<p class="rb-p">난산(Dystocia)은 오래 끈 자연 분만(Prolonged spontaneous calving), 혹은 만출을 위해 중증도의 보조가 필요했던 분만(Prolonged or severe assisted extraction)으로 정의된다²⁾. 분만 난이도(출생 난이도)는 일반적으로 5단계의 점수가 매겨지며, 점수 3 이상이 난산으로 정의된다. ①문제 없었음(No problem), ②약간의 문제가 있었음(Slight problem), ③보조를 필요로 함(Needed assistance), ④강한 힘을 필요로 함(considerable force), ⑤극히 곤란했음(Extreme difficulty)²⁷⁾. 난산 발생률은 경산우(6%)에 비해 초임우(19%)에서 높다²⁸⁾. 초임우에서 난산의 주요 원인은 태아-골반 불균형^주2)(Feto-pelvic incompatibility), 태아의 태위·태세 이상(Abnormal fetal disposition) 및 외음부와 자궁경관의 확장 부전(Incomplete dilatation of the vulva and cervix)이다. 그 밖에 쌍태나 자궁근 무력증, 기형, 자궁 염전 등이 난산의 원인이 된다²⁾. 난산이 될 위험이 높은 분만을 가려내어 적절히 대처하기 위해서는 "분만 개조할 것인가 아닌가", "언제 분만 개조할 것인가", "어떻게 분만 개조할 것인가", "언제 수의사에게 지원을 요청할 것인가"가 중요한 포인트가 된다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주2) 태아-골반 불균형(Feto-pelvic incompatibility): 태아의 크기와 어미소 골반의 크기가 맞지 않아 경질 분만이 불가능한 상태에 있는 것.</p>
<div class="modal-sub" style="margin:14px 0 6px;">분만 개조의 타이밍</div>
<p class="rb-p">태아-골반 불균형, 태위·태세 이상, 쌍태, 자궁근 무력증, 외음부 또는 자궁경관의 확장 부전의 경우는 개입이 필요하게 된다. 자궁근 무력증은 제1기에, 태위·태세 이상나 쌍태는 제2기의 초기에, 태아-골반 불균형이나 산도의 확장 부전은 제2기의 후기에 개입하는 것이 권장되고 있다²⁾. 보통 제2기의 개시 시각은 불명확한 경우가 많으므로, 시간보다 분만의 진행 상황을 가려내는 것이 중요하다. 발견 시 제2기가 이미 시작되어 있었던 경우는 시험적인 내진으로 양막의 상태(터져 있는가?), 양수의 색, 태위·태세 이상의 유무, 태아의 활력, 태아의 크기, 질이나 외음부의 확장 정도 등을 확인할 필요가 있다. 정상적인 양수는 백색 반투명이며, 다갈색은 태변, 적색은 태반 출혈이나 태아 사망, 악취가 있는 경우는 조기의 태아 사망이 추정된다. 양수가 태변으로 물들어 있는 경우 자궁 내에서의 저산소증과의 관련이 보고되어 있다. 활력이 높은 태아는 다양한 부위(발가락 사이, 안구, 혀, 항문 등)에 대한 자극에 반응을 보인다. 만약 발견 시 양막이나 태아의 사지가 말라 있고 차가웠다면, 적어도 제2기 개시 후 30~60분은 경과했다고 생각해도 된다. 순조롭게 제2기가 진행되고 있는 경우, 어미소는 횡와하여 단속적으로 힘을 주고, 일어나서는 쉬고, 다시 횡와하여 힘을 주는 것을 반복한다. 그리고 외음부에서 태아의 사지나 머리가 서서히 보이게 된다. 정상 분만이라도 태아의 코끝이 외음부 밖에 나타나고 나서 눈이 나타나기까지는 시간이 걸린다. 분만의 진행이 정상이라면 쓸데없는 개입을 하지 않고 30분마다 둘러보거나, 혹은 조용히 지켜보는 것이 권장된다. 원칙적으로 송아지의 구절(球節)이나 코끝이 외음부 밖에 나타나기까지는 분만 개조을 시작해서는 안 된다. 이 시점에서는 질 안에 있는 (눈으로 보이지 않는) 사지에 로프를 거는 것은 너무 이르다고 생각되고 있다²⁾. 진행이 30분 이상 인정되지 않는 경우나 태아의 활력이 저하된 경우(각종 자극에 대한 반응성 저하 등)는 개입할 필요가 있다. 태아가 살아 있어도 산도에 강하게 끼어 있는 경우는 자극에 대한 반응을 보이지 않는 경우가 있으므로 주의가 필요하다²⁹⁾.</p>
<p class="rb-p">앞서 말했지만, 양막 혹은 태아의 발굽이 보이고 나서 자연히 만출되기까지의 시간은 초임우에서 약 90분, 경산우에서 약 45분이지만, 10분에서 6시간까지 큰 편차가 있기 때문에²·¹⁸⁾ 분만에 개입해야 할 시기에 관한 주장이 저자에 따라 다양한 것은 이상하지 않다. 양막 혹은 발굽이 보이면 바로 개입하고 있다는 보고도 있다³⁰·³¹⁾. 현저히 오래 끈 분만은 신생 송아지의 활력 저하나 사망 위험을 증대시키지만, 불필요한 조기 개입 또한 송아지의 사고로 이어지는 경우가 있다²⁾. 권장되고 있는 개입 타이밍의 다수는 제2기 개시(양막 혹은 발굽의 출현) 후 2~3시간이다³²·³³⁾. 어떤 연구에서는²⁾ 제2기 개시 후 2시간 기다리고 나서 분만 개조한 경우, 15분 만에 분만 개조한 경우에 비해 분만 난이도, 분만 개조에 소요된 시간, 회음 열상이 생긴 어미소의 비율이 낮았고, 자연히 분만한 소의 비율 및 분만 후 1시간 안에 송아지가 일어선 비율이 높았다. 분만 개입을 제2기 개시 후 2시간에서 3시간으로 변경해도 분만 개조을 필요로 한 소의 비율은 변화하지 않았던 점에서, 2시간을 넘겨 개입을 기다리는 이점은 그다지 없다고 생각된다. 또 태아의 발굽이 보이고 나서 개입하기까지 2시간 기다리는 농가에 비해 1시간 이내에 개입하는 농가(45%의 농가)에서는 견인기(Calf puller)의 사용률이 높고, 어미소가 산후 기립 불능증에 빠지는 비율이 높았다³⁴⁾. 이러한 보고로부터 Mee는 "two feet–two hours"(2개의 발굽이 보이고 나서 2시간은 기다린다) 규칙을 권장하고 있다²⁾. 권장되고 있는 이러한 방법은 분만에 관한 연구가 진행됨에 따라 앞으로 갱신되어 갈 것이다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">분만 개조의 방법</div>
<p class="rb-p">분만 개조(Obstetric assistance)을 하는 경우는 처치 중에 어미소가 질식 등을 하지 않도록 바로 풀 수 있는 안전한 보정을 할 필요가 있다. 또 중증 난산이 발생한 경우에 대비하여 2명 이상의 작업자, 혹은 전용 견인기를 준비해야 한다. 분만 개조에 필요한 산도 내 조작은 최소한으로 하고, 가능한 한 위생적으로 하는 것이 그 후의 자궁내막염 등의 위험을 줄인다. 질 내나 태아가 말라 있는 경우나 태아가 사망한 경우는 견인을 시작하기 전에 외음부를 확장시키고, 충분한 양의 윤활제(Lubricant)를 산도 내에 주입해야 한다. 산도의 확장이 불충분한 경우는 술자의 전완이나 팔꿈치 등을 이용하여 내부에서 외음부를 지속적으로 넓힘으로써 서서히 확장시킬 수 있다²⁾. 어미소를 세울 수 있다면 윤활제의 삽입은 쉬울 것이다.</p>
<p class="rb-p">분만 개조의 원칙은 자연 분만의 과정을 보조하는 것이다. 가능하다면 힘주기에 의한 만출력을 이용하고, 태아가 지나는 산도의 면적을 늘리기 위해 어미소는 횡와 상태인 것이 바람직하다³⁵⁾. 태아의 견인에 사용하는 로프나 체인은 태아의 구절 위에 걸어야 한다. 구절 아래(계부)에 거는 것보다 위에 거는 편이 골절이나 탈구의 위험이 경감된다. 견인의 방향과 강도는 어미소 및 송아지의 예후에 중대한 영향을 미친다. 원칙적으로 어미소가 힘을 주고 있을 때만 견인한다(그림 2-1-6). 힘을 주고 있지 않을 때 지속적으로 견인하면 태아의 순환을 저해한다²⁾. 송아지의 머리 옆에 있는 산도의 공간에 술자의 한 손을 두어 둠으로써 산도가 어느 정도 조여지고 있는지를 분만 개조 중에 신속히 평가할 수 있다. 태아를 견인할 때 처음에는 태아의 양쪽 사지에 균등하게 힘이 걸리도록 견인한다. 태아의 머리가 나타나기까지는 어미소의 등뼈 선보다 약간 위쪽을 향해 견인한다. 머리가 나타나고 나서 어깨가 보이기까지는 어미소의 등뼈와 평행이 되도록 견인한다. 흉부가 나타나면 자연 분만 시에 보이는 호(弧)와 같은 궤적(그림 2-1-7)을 따르도록 어미소의 비절을 향해 견인하는 방향을 45도 아래쪽으로 기울일 필요가 있다. 견인하는 방향을 바꾸는 타이밍을 잘못하면 골절 등의 원인이 된다. 어미소와 송아지의 상대적 크기 관계에서 힙록(Hip lock)^주3)이 발생할 가능성이 있는 경우는 태아의 허리가 어미소의 골반과 맞물리기 전에 태아를 일찍 회전시킬 필요가 있다. 흉곽이 나타나면 태아의 아래쪽이 된 사지를 어미소의 옆구리 방향으로 위쪽을 향해 견인함으로써 태아를 회전시킬 수 있다²⁾. 한쪽 사지에 견인력이 집중되면 골절의 위험이 늘어나므로 과도한 힘을 사용해서는 안 된다. 힙록이 일어나 버린 경우는 견인을 중지하고, 가능하다면 어미소를 세운다. 어미소가 일어섬으로써 자연히 태아가 복강 내로 돌아가는 경우도 있고, 또 송아지를 되밀어 넣는 것을 쉽게 한다. 충분한 양의 윤활제를 질의 가능한 한 안쪽에 주입하고, 태아를 회전시키면서 다시 견인을 시도한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-6 왼쪽 그림이 쉬고 있을 때, 오른쪽 그림이 노책(힘주기)하고 있을 때</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-7 자연 분만 시에 보이는 호와 같은 궤적</p>
<p class="rb-p">개체차는 크겠지만, 횡와한 어미소는 태아에 대해 약 75 kg의 힘을 태아에 가하여 만출시킨다. 어미소가 기립 상태라면 만출력은 최대 30% 저하된다³⁶⁾. 유압식 견인 동력계를 이용하여 분만 개조 시의 견인력을 조사한 연구에서는 사람에 의한 견인으로 생기는 힘은 남성 1명으로 75 kg, 2명으로 125 kg, 3명으로 175 kg이며, 분만 개조 시에 사용할 수 있는 최대 견인력은 약 300 kg이라고 보고되어 있다³⁶⁾. 골절을 막기 위해서는 양쪽 사지에 대한 부하가 균등해지도록 동시에 견인할 필요가 있으며, 또 태아와 산도의 마찰 저항을 줄이기 위해 충분한 양의 윤활제를 사용해야 한다. 도르래 등의 태아 견인기는 견인력이 400 kg을 넘는 것도 있으므로, 사용할 때는 경험자의 지도 아래 사전에 충분한 훈련을 받을 필요가 있다.</p>
<p class="rb-p">농장 직원의 기술이나 난산의 상황에 따라 다르지만, 시험적인 내진으로 단순한 견인으로는 만출할 수 없다고 판단한 경우는 바로 수의사를 불러야 한다. 예를 들어 자궁 염전, 기형, 쌍태 및 중증 태위·태세 이상 등이 포함된다. 정상 자세로 산도를 향하고 있는 경우라도 태아의 눈보다 뒤를 끌어낼 수 없는 경우, 태위·태세 이상의 정복을 15~30분 시도해도 정복할 수 없는 경우도 수의사를 부르는 편이 좋다²⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주3) 힙록(Hip lock): 태아의 골반이 소의 골반에 걸려 버린 상태.</p>
<div class="modal-sub" style="margin:14px 0 6px;">태위·태세 이상의 정복</div>
<p class="rb-p">머리만 외음부에서 보인다면 양측성 앞다리 굴절(견갑 굴절), 앞다리만이라면 머리 굴절(측두위나 흉두위), 발굽이 상하 반대라면 역아(미위 상태향, 그림 2-1-8)를 의심한다. 정상적인 태아의 자세와 대표적인 태위·태세 이상를 그림 2-1-9에 나타냈다. 태아의 태위·태세 이상를 정복하기 위해서는 산도 내에 술자가 손을 삽입하여 태아를 조작하기 때문에 넓은 공간이 필요하게 된다. 가능하다면 어미소를 세운 상태에서(세우기 어려운 경우는 뒷다리를 매달아 올리는 것으로) 태아를 골반보다 머리 쪽의 복강 내로 되밀어 넣기가 쉬워진다. 또 외음부 밖에 사지가 나타난 후보다 나타나기 전이 태위·태세 이상를 정복하기 쉽다. 그 때문에 태위·태세 이상를 조기에 발견하기 위해서는 제2기의 초기 단계에서 내진으로 태아의 자세를 확인하는 것이 중요하다. 사지 굴곡 등의 태위·태세 이상를 정복할 때 발굽으로 자궁에 열상을 주지 않기 위해 경막외마취로 노책이나 자궁 수축을 조절할 수도 있다. 태위·태세 이상의 정복 후 태아에 활력이 있고 산도의 확장이 불충분한 경우는 너무 이른 견인에 의한 중증 난산을 일으키지 않도록 조금 기다릴 필요가 있다. 다만 태아가 쇠약해져 있는 경우나 태위·태세 이상가 재발할 가능성이 높은 경우는 바로 분만 개조해야 한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-8 발굽이 상하 반대(발굽 바닥이 위를 향하고 있는 경우)라면 역아를 의심한다</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 2-1-9 정상 태아와 산도의 관계, 및 대표적인 태위·태세 이상의 모식도 (정상 두위 / 종복위 / 측두위 / 정상 미위 / 둔위(고관절 굴절) / 횡복위) — 문헌 32에서 인용·개변</p>
<div class="modal-sub" style="margin:14px 0 6px;">역아</div>
<p class="rb-p">대략 3%의 확률로 역아(미위, Posterior presentation)가 생긴다. 역아의 태아는 정상 분만에 비해 난산 및 신생 송아지 사망의 위험이 5배 높아진다²⁾. 외음부 밖에 태아의 비절이 보이기 전에 견인하면 자궁경관이나 외음부가 찢어질 수 있다. 이는 요막이나 양막이 두위의 출산에 비해 일찍 파열됨으로써 자궁경관을 확장시키는 요인이 결여되기 때문이다. 시험적인 견인으로 태아를 만출할 수 있다고 판단한 경우는 바로 견인을 시작해야 한다. 산도의 확장이 불충분한 경우는 술자의 팔을 사용하여 산도를 확장시킨다. 처음에 견인하는 각도는 어미소의 등뼈와 평행이거나 약간 위쪽이다. 태아의 비절이 보이면 아래쪽이 된 뒷다리를 어미소의 옆구리 쪽을 향해 위쪽으로 회전시킨다. 등뼈의 골절을 일으킬 가능성이 있으므로 태아의 뒷무릎이 외음부 밖에 나타나기까지는 어미소의 비절 방향으로 견인해서는 안 된다. 역아의 경우 태아의 머리가 밖으로 나오기 전에 제대가 끊어지는 경우가 많으므로, 견인 개시부터 만출까지는 신속히 끝낼 필요가 있다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">쌍태</div>
<p class="rb-p">쌍태 분만(Twin calving)의 경우 단태 분만에 비해 역아의 발생은 4배가 되고, 신생 송아지 사망의 위험은 2배가 된다³⁷⁾. 2마리의 태아가 동시에 산도에 들어가 버리거나 태아의 태위·태세 이상나 자궁 수축이 불충분한 경우가 있기 때문에 신생 송아지 사망의 위험이 높아진다³⁷·³⁸⁾. 그 때문에 임신 진단 시에 쌍태 임신이 의심되는 경우는 분만 개시를 인식한 시점에서 바로 내진해야 한다. 쌍태는 단태 임신의 경우에 비해 20~30% 체중이 가볍기 때문에 태위·태세 이상 정복 등의 산도 내 조작은 비교적 쉽다²⁾. 한쪽이 역아인 경우 역아의 태아를 먼저 만출시킨다. 제대가 절단되지 않았다는 보장이 없으므로 역아의 태아를 만출하면 바로 다른 한쪽을 만출시킨다. 자연 분만에서는 처음 1마리가 만출되고 나서 다음 태아가 만출되기까지 5분~1시간 걸린다²⁾. 산도의 확장이 불충분한 경우는 조금 기다릴 필요가 있다. 임신 기간이 짧고 산자가 작은 등 쌍태가 의심되는 경우는 특히 주의해야 하지만, 분만을 해제할 때는 송아지의 만출 후에 또 1마리가 자궁 내에 있지 않은지 항상 확인해야 한다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">외과적 산과 처치</div>
<p class="rb-p">외과적 산과 처치의 주요 적응증은 태아의 상대적 과대다³⁹⁾. 계획적인 제왕절개라도 출생 후 송아지의 호흡이나 대사의 적응을 촉진하기 위해 자궁경관의 확장을 기다리는 것이 권장되고 있다²⁾. 제2기가 2시간 이상 경과하였고 견인으로 태아의 코끝을 외음부에서 노출시킬 수 없는 경우는 즉시 수술을 고려해야 한다²⁾. 또 술자의 경험에 따르지만, 15~30분의 처치로 태위·태세 이상를 정복할 수 없는 경우는 제왕절개를 검토할 필요가 있다. 롤링으로 정복할 수 없는 자궁 염전이나 기형, 자궁경관의 확장 부전, 횡배위나 횡복위 등 정복이 곤란한 태위·태세 이상도 제왕절개의 적응이 된다. 태아가 사망한 경우는 절태가 곤란한 경우를 제외하고 제왕절개를 해서는 안 된다. 태아가 사망한 경우는 절태를 선택한다²⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">난산의 영향</div>
<p class="rb-p">난산 후에 생기는 어미와 송아지에 대한 영향으로서 좋은 것은 아무것도 없다. 난산은 유생산 감소⁴⁰⁾, 번식 성적 악화, 어미소와 송아지의 이환율이나 사망률, 도태율의 상승을 초래한다⁴¹⁾. 번식 성적 저하에 대해서는 자궁 수복의 지연, 분만부터 첫 발정까지의 일수 연장, 비정상적인 발정 주기, 수태율 저하, 공태일수 연장 등이 보고되어 있다²¹·⁴²⁾. 난산으로 태어난 송아지는 소화기병이나 호흡기병의 이환율이 높고, 그 후의 사망률이 높다⁴³⁾. 또 난산을 경험한 어미소는 그 후의 분만에서 난산이 될 가능성이 높아지는 것도 보고되어 있다⁴⁴⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">신생 송아지의 평가</div>
<p class="rb-p">태아의 폐포는 폐포 상피세포에서 분비되는 폐액(Lung fluid)으로 채워져 있다. 산도를 통과하면 태아 체내에서 카테콜아민이 분비되어 폐액의 분비가 억제되고 흡수가 촉진된다. 또 폐포의 표면장력을 완화하고 폐포가 넓어지기 쉽게 하기 위해 필요한 폐 서팩턴트(Pulmonary surfactant)의 분비가 촉진되어 폐호흡의 개시를 향한 준비가 시작된다⁴⁵⁾. 모든 송아지는 출생 시에 경도의 호흡성 및 대사성 산증에 빠지지만²⁹⁾, 자연 분만으로 출생한 송아지에 비해 강하고 긴 견인이 이루어진 송아지에서는 호흡성 및 대사성 산증이 악화되어 출생 후 생존성이 저하된다⁴⁶⁾.</p>
<p class="rb-p">송아지의 활력은 반사나 머리의 움직임, 자세(횡와인지 흉골 좌위인지), 기립을 시도하는 동작, 기립까지의 시간 등으로 평가할 수 있다⁴⁵⁾. 송아지의 호흡이 얕고 복식호흡이 지속되는 경우나 반사가 약한 경우, 또는 흉골 좌위가 되기까지 15분 이상 걸리는 경우는 예후 불량이 될 가능성이 높아진다⁴⁵·⁴⁶⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">송아지의 소생</div>
<p class="rb-p">난산을 포함한 대부분의 분만은 보통 농장 직원에 의해 관리된다. 고위험 분만에서는 미리 송아지 소생에 필요한 절차의 확인이나 기자재의 준비가 필요하다. 고위험 분만에는 다음과 같은 경우가 포함된다. ①과거에 난산 이력이 있는 경산우, ②체격이 작거나 혹은 비만인 초임우, ③분만 중에 태아가 크고 만출을 위해 강한 견인이 필요할 것으로 예상된 경우, ④내진으로 태아의 활력이 저하되어 있음을 알아차린 경우, ⑤제2기가 오래 끈 경우, ⑥역아나 제왕절개로 태어난 경우, ⑦출산 후에 송아지의 활력이 낮은 경우(무호흡, 호흡 곤란, 횡와위가 지속됨, 근긴장이나 반사의 저하나 소실 등). 소생은 바이털 사인(자세, 활동, 호흡 기능, 직장온 등)이 정상화될 때까지, 혹은 청진기로 심박을 검출할 수 없게 될 때까지 계속해야 한다.</p>
<p class="rb-p">출생 직후에 송아지를 거꾸로 짧은 시간 매다는 것은 폐액의 배출을 촉진하고, 폐의 가스 교환, 산증의 교정 및 그 후의 초유 면역글로불린의 흡수에 좋은 영향을 준다고 보고되어 있다⁴⁷⁾. 또 전용 흡인 펌프를 사용하여 기도에 남은 액체를 제거하는 것은 폐의 가스 교환이나 산염기 평형의 교정에 좋은 효과가 있다⁴⁸⁾.</p>
<p class="rb-p">저온 자극(Hypothermal stimulation)은 송아지를 소생시키기 위해 적용되는 가장 일반적인 수법이다. 냉수를 송아지의 머리나 전신에 끼얹으면 헐떡임 반사(Gasp reflex)를 일으킬 수 있다. 폐에서의 가스 교환이나 산염기 균형에 유익한 효과가 있는 것도 보고되어 있다⁴⁸⁾. 또 흡기 반사를 촉진하기 위해 윗입술 고랑(인중)을 바늘로 자극하는 것이나 비중격을 세게 꼬집는 것도 유용하다⁴⁵⁾.</p>
<p class="rb-p">기도가 확보되면 옆에서 보조해서라도 흉골 좌위 혹은 개 앉은 자세(Dog sitting posture)로 해야 한다. 이 자세는 지속적인 횡와위에 의한 폐의 울혈을 막고, 신생 송아지의 생리적 적응 기전을 뒷받침하는 작용이 있다⁴⁷⁾.</p>
<p class="rb-p">산소 흡입은 현장에서 준비하기 어려운 상황이 많지만, 송아지의 폐호흡을 보조하는 데 유용하다. 송아지의 소생에서 호흡 자극 작용을 가진 약제 투여의 명확한 효과는 실증되어 있지 않다⁴⁵⁾.</p>
<p class="rb-p">소생이 성공한 후에도 고위험 분만으로 태어난 송아지는 중증의 대사성 및 호흡성 산증을 속발하는 경우가 있어 사망 위험이 높다⁴⁵⁾. 소생 후에 시작하여 필요에 따라 반복하는 중탄산나트륨의 정맥 내 투여는 대사성 산증의 교정을 효율적으로 뒷받침할 수 있다⁴⁹⁾.</p>
<div class="modal-sub" style="margin:14px 0 6px;">배꼽의 관리</div>
<p class="rb-p">제대(Umbilical cord)는 제동맥(Umbilical artery), 제정맥(Umbilical vein) 및 요막관(Urachus)으로 이루어지며, 태반과 함께 태아기의 가스 교환이나 영양 성분의 운반, 노폐물의 배설을 담당하지만, 출생 후에는 단순한 유잔 구조물이 된다. 자연 분만의 경우 신생 송아지의 움직임이나 어미소가 일어서는 것에 의해 제대는 송아지의 복벽에서 몇 cm 부위에서 단열되지만, 어미와 송아지의 활력이 낮은 경우나 태반의 조기 배출 등으로 제대가 단열되지 않는 경우는 손으로 절단할 필요가 있다. 견인을 동반한 보조 분만으로 출생한 송아지에서는 제대가 만출 후 바로 단열되는 경향이 있다. 어떤 연구에서는 제대가 자연히 단열된 송아지와 비교하여 출생 후 조기에 사람이 제대를 절단한 송아지에서 폐의 가스 교환 효율이 장기적으로 저하되었다고 보고되어 있다⁴⁵⁾. 제대는 자연히 단열되는 것이 바람직하지만, 자연히 단열되지 않는 경우는 제동맥의 박동이 촉지되지 않게 될 때까지 기다렸다가, 제대의 밑동을 한 손으로 누르고 다른 한 손으로 잡아 뜯듯이 절단함으로써 자연 단열을 모방할 수 있을 것이다.</p>
<p class="rb-p">배꼽 감염증의 발생률은 일반적으로 높고, 성장률 저하나 그 밖의 감염성 질환을 속발할 가능성이 있다⁵⁰⁾. 배꼽 감염증의 예방은 분만방 및 송아지 거주 공간의 위생 관리, 초유의 적절한 섭취, 및 배꼽의 소독에 근거하여 이루어진다. 배꼽 소독은 일반적으로 널리 행해지고 있음에도 불구하고 배꼽 감염증의 예방에 유용했다는 보고는 적다. 배꼽 소독은 배꼽 감염증의 예방에 무익했다고 하는 보고도 있다⁴⁵⁾. 아마도 배꼽 소독에 사용하는 약제의 종류, 처치 방법이나 빈도, 사육되고 있는 환경의 위생 상태 등이 결과에 영향을 주어 소독의 효과를 불명확한 것으로 만들고 있다고 추측된다. 배꼽에 대한 소독약의 효과를 비교하는 연구는 거의 없지만, 어떤 역학 연구에서는 배꼽 소독을 하지 않은 경우나 요오드를 이용하여 배꼽을 소독한 경우에 비해 클로르헥시딘으로 소독한 경우에 송아지의 사망 위험이 낮았다는 보고도 있다⁵¹⁾. 나아가 in vitro 연구에서는 포비돈 요오드는 섬유아세포의 성장을 억제하고 세포 독성을 보였다고 보고되어 있다⁵²⁾. 배꼽에 관련된 문제가 적은 농장에서는 관리자가 아마도 배꼽 소독보다 분만방의 위생 관리나 송아지의 면역력 강화(초유 섭취)를 중시하고 있다는 견해도 있다⁴⁵⁾. 배꼽 관리에 대해서는 앞으로 더욱 연구가 필요할 것이다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">출처: 일본송아지(新しい子牛の科学) 2-1, 滄木孝弘. 원문 그대로 번역, 정리 전. 책의 助産은 분만 개조(견인 보조)로 옮겼다.</span></p></div>
<div class="modal-sub" style="margin:22px 0 6px;">초산우의 분만 생리 (일본송아지 6-1)</div><div class="rb-block">
<p class="rb-p">초산우는 분만에 관련된 몇 가지 항목(임신기간, 분만 경과, 분만의 난이도, 산자의 출생 시 체중 등)에서 2산차 이상의 소(경산우)와 차이가 있다. 그 때문에 이러한 차이에 유의한 분만 관리가 필요하다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">임신기간</div>
<p class="rb-p">일반적으로 초산우의 임신기간은 경산우보다 약 2일 짧다. 홀스타인 1,594두(초산우 540두, 경산우 1,054두)의 데이터에서 임신기간은 초산우 278일, 경산우 280일이었다¹⁾. 흑모화종의 임신기간은 지금까지 285일로 여겨져 왔으나, 최근에는 289~290일이 일반적이며, 홀스타인과 마찬가지로 초산우는 경산우에 비해 짧은 경향이 있다(표 6-1-1). 그 차이를 가져오는 원인은 임신 말기 복강 내에서 임신 자궁(태아)이 차지할 수 있는 공간의 넓이²⁾나 혈중 프로게스테론(P₄) 농도³⁾의 차이에 있다고 여겨진다. 또한 일본단각종의 임신기간은 271~293일로 평균 282일이다(라쿠노가쿠엔대학 필드교육연구센터 육축스테이션 육우농장의 39두 데이터).</p>

<div class="modal-sub" style="margin:18px 0 6px;">분만의 난이도</div>
<p class="rb-p">난산은 유생산과 번식성적에 영향을 미치므로 이에 따른 경제적 손실이 크다. 분만의 난이도는 난산 스코어로 5단계로 분류되며(표 6-1-2), 홀스타인에서 초산우의 난산 스코어는 경산우보다 유의하게 높다(표 6-1-3). 유용우(주로 홀스타인) 15만 2,641두의 데이터에서 난산율(난산 스코어 3 이상)은 초산우 9.3%, 경산우 5.8%였다⁴⁾. 초산우의 사산율은 분만 월령이 어릴수록 높아진다⁵⁾(그림 6-1-1). 이들의 원인은 골반강 크기에 있다. 즉 초산우(특히 어린 소)의 골반강은 태아가 통과하기에 불충분한 크기인 경우가 많다. 골반 전구의 넓이는 월령이 진행됨에 따라 커지지만, 2세령(많은 소에서 첫 분만을 맞는 시기)에서는 태아 크기에 비해 골반 전구가 좁은 개체가 많다⁶⁾(그림 6-1-2). 일반적으로 출생 시 체중이 무거운 큰 산자가 태어나기를 바라는 생산자가 많으나, 지나치게 큰 산자는 난산이 될 가능성이 높고, 출생 후 자립에 시간이 걸린 경우에는 앞다리가 O자 다리가 되는 일도 있다(O자 다리의 대부분은 생후 1주 이내에 정상으로 돌아온다).</p>

<div class="modal-sub" style="margin:18px 0 6px;">산자의 출생 시 체중</div>
<p class="rb-p">산자의 출생 시 체중은 산차, 성별, 모체의 영양, 종모우 및 계통에 따라 차이가 있다. 초산우에서 태어난 산자의 출생 시 체중은 경산우의 산자보다 작다. 홀스타인 산자 1,594두(초산우의 산자 540두, 경산우의 산자 1,054두)의 데이터를 보아도 출생 시 체중은 초산우의 산자가 평균 41 kg, 경산우는 평균 45 kg이며, 체고·체장·흉위도 초산우의 산자 쪽이 작다¹⁾(표 6-1-4). 도치 등의 조사에서도 홀스타인 초산우의 산자는 경산우의 산자보다 평균 3~8 kg 작았다(표 6-1-5). 또한 모우의 산차에 따른 산자 출생 시 체중의 차이는 산자의 성별과 관계없이 나타나며⁶⁾(그림 6-1-3), 도치 등의 조사에서도 홀스타인의 평균 출생 시 체중은 수송아지 47 kg(21~74 kg), 암송아지 44 kg(20~63 kg)으로, 산자의 성별과 관계없이 초산우의 산자가 가벼웠다(표 6-1-5). 이는 육용 번식우에서도 마찬가지이며, 흑모화종의 평균 출생 시 체중은 수송아지 35 kg(27~46 kg), 암송아지 32 kg(23~44 kg)이고(표 6-1-6), 일본단각종에서는 수송아지 40 kg(23~53 kg), 암송아지 평균 38 kg(28~47 kg)이었다(표 6-1-7). 그 차이를 가져오는 원인으로 두 가지 이유가 생각된다. 하나는 초산우의 임신기간이 짧기 때문에 태아 발육 기간이 짧아지는 것이다. 다른 하나는 초산우는 임신 중에 자신도 발육하고 있어 모우 자신의 성장에도 영양을 써야 하므로 태아 성장에 쓰이는 영양에 제한이 걸리는 것이다. 또한 종모우에 따라 산자의 체중에 차이가 있는 것이 알려져 있으며, 흑모화종에서는 특정 계통 종모우의 산자는 작고 또 다른 계통의 산자는 크다는 것이 널리 알려져 있다.</p>

<p class="rb-p">한편 분만 후에 배출되는 후산의 중량은 산자의 크기에 비례하여 무거워지는 경향이 있다. 도치 등이 조사한 흑모화종 47두의 후산 중량은 2.75~7.4 kg으로 평균 4.3 kg이었다. 그 내역은 4 kg 미만이 약 40%, 4~5 kg 미만이 36.2%, 5 kg 이상이 23.4%였다.</p>
<p class="rb-p">나아가 송아지가 커지면 난산 발생도 많아진다. 홀스타인에서는 송아지의 출생 시 체중이 45 kg 이상이 되면 난산이 많아지고, 수송아지는 암송아지보다 크기 때문에 초산우가 수송아지를 낳는 경우의 난산 발생률이 가장 높아진다. 흑모화종에서는 홀스타인처럼 난산 발생이 많아지는 송아지 출생 시 체중 수준이 제시되어 오지 않았으나, 산자의 출생 시 체중이 40 kg 이상이 되면 난산 발생이 많아진다는 것이 근년 제시되었다. 이 출생 시 체중 40 kg 이상인 산자의 비율은 도치 등의 데이터에서는 약 14%이며, 홀스타인(암)과 흑모화종(수)의 1대 교잡종을 수란우로 하여 태어난 산자에서는 40 kg 이상의 출생 시 체중을 가진 산자 비율이 약 24%이다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">분만 관리</div>
<p class="rb-p">분만 시에는 다양한 문제가 생기는 일이 많으므로, 사고 없이 정상적으로 분만이 이루어지려면 분만 경과 상황을 정확히 판별할 필요가 있다. 분만 경과에 이상이 인정되었을 때는 적절히 대응해야 한다(표 6-1-8). 분만 예정일이 지나도 분만 징후가 나타나지 않을 때는 우선 교배 월일(인공수정 월일 또는 수정란 이식 시의 발정 월일)에 오류가 없는지 확인해야 한다. 교배 월일에 오류가 없으면 다시 2~3일 상태를 지켜보고, 그래도 분만 징후가 보이지 않는 경우에는 수의사에게 태아의 생사 등 이상이 없는지 진단을 의뢰하는 것이 바람직하다. 특히 유용우에서는 태아가 크고 난산이 일어날 가능성이 높아지므로 유기분만의 필요성에 대해 수의사의 진단을 받을 필요가 있다. 한편 근년 홀스타인에 흑모화종의 수정란을 이식하는 일이 많아졌는데, 다른 품종의 태아를 임신한 경우의 임신기간은 그 태아 품종의 임신기간이라는 점을 알아 두어야 한다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-1-8 분만 시 이상에 대한 대응</p>
