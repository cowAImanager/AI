<div class="modal-sub" style="margin:18px 0 6px;">육용 번식우</div>
<div class="modal-sub" style="margin:14px 0 6px;">흑모화종 암소의 발육과 교배 개시 기준</div>
<p class="rb-p">흑모화종 암소의 초회 발정 발현 시기는 8~18개월령으로 개체차가 있으나, 체격 지표로는 체중이 220~240 kg에 도달할 무렵 초회 발정이 발현한다(그림 5-2-10).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-10 흑모화종 암소의 발육곡선(체중, 체고) — 0~36개월령, 하한·표준·상한 3곡선. 체중: 표준 약 14개월 300 kg, 24개월 약 420 kg, 36개월 약 460 kg(상한 약 550, 하한 약 370). 체고: 표준 약 12개월 110 cm, 36개월 약 130 cm(상한 약 137, 하한 약 125). 전국화우등록협회 2004</p>
<p class="rb-p">육성 암소는 체중이 300 kg을 넘을 무렵, 즉 춘기발동 후 주기적으로 발정이 회귀하기 시작하는 9~10개월령경부터 지방이 붙기 쉬운 체질이 된다. 특히 이 시기 이후에 과잉 사료 급여를 하면 과비가 되므로 주의가 필요하다⁷⁾⁸⁾(그림 5-2-11). 발육 속도도 육성 암소의 지방조직 증가와 관계가 있다. 이유 후 높은 발육 속도로 사양관리를 하면 지방 축적이 증가하여, 체중이 360 kg이 되는 15개월령경에는 발육 속도가 중·저 정도인 사양관리 개체보다 지방 축적이 현저히 커진다⁸⁾(그림 5-2-12). 육성기의 발육 속도는 골격 발달에도 영향을 준다. 체격 크기의 기본 요소인 체고, 십자부고 등을 결정하는 사지 장골의 성장은 발육 속도(DG)를 높이면 촉진되지만, 근육 성장과 지방 부착을 포함한 전체적인 체중 증가와의 균형에 주의할 필요가 있다⁹⁾(표 5-2-4). 유선조직의 발달도 발육 속도의 영향을 받는다. 유선조직의 발달은 난소·하수체·부신피질 유래의 전신성 호르몬과 유선조직 국소의 여러 성장인자·사이토카인의 제어를 받는다. 과잉 영양으로 과비가 되면 이 제어 기구가 무너져 유선조직의 정상 발달이 저해되는 것으로 생각된다¹⁰⁾⁻¹²⁾(그림 5-2-13).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-11 뼈·근육·지방의 발육 패턴 — 가로축 냉반도체 중량(kg, 0~160), 세로축 근육·뼈·지방 중량(kg, 0~100). 암·거세·수 3구분. 근육은 직선적으로 증가(160 kg에서 약 95 kg), 뼈는 완만(약 10~20 kg), 지방은 냉반도체 100 kg 초과 시 급증(암 약 130 kg에서 50 kg). 냉반도체 중량의 약 3배가 생체중이며, 암소는 근육·뼈는 거세·수와 같은 증가를 보이나 지방은 냉반도체 중량 100 kg을 넘으면 현저히 증가한다. 생체로 환산하면 암소는 체중 300 kg을 넘으면 지방조직 중량 증가가 뚜렷해짐을 뜻한다. 암소는 성성숙을 완료하고 주기적 발정이 반복되는 시기가 되면 체지방을 축적하기 쉬운 체질이 되므로 농후사료 과잉 급여에 의한 과비에 주의가 필요하다. 문헌 8에서 인용·개변</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-12 흑모화종 암소의 육성기 발육 속도와 뼈·근육·지방의 발육 패턴 — 가로축 체중(kg, 100~600), 세로축 조직 중량(kg, 0~250). 발육 속도 0.8·0.6·0.4 kg/일 3구분, ●는 성우 시 체중(약 530 kg: 근육 약 205, 지방 약 115, 뼈 약 55 kg). 체중 360 kg에서 근육 약 140, 지방 0.8 kg/일 약 95·0.6 약 75·0.4 약 65, 뼈 약 45 kg. 뼈·근육의 발육은 발육 속도의 영향을 별로 받지 않으나 지방조직의 발달은 발육 속도가 빠르면 커진다. 체중 300 kg을 넘는 육성기 중기~후기에는 발육 속도를 중간 정도로 유지하여 과비를 피할 필요가 있다. 문헌 8에서 인용·개변</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 5-2-4 육성기의 발육 속도와 사지 장골의 성장</p>

<p class="rb-p">전지대·후지대를 구성하는 뼈의 성장은 모두 성장 속도를 0.8 kg/일로 했을 때 최소가 된다. 상완골·중지골·대퇴골·경골의 성장은 발육 속도 0.6 kg/일에서, 견갑골·척골·중족골의 성장은 0.4 kg/일에서 최대가 된다. 발육 속도를 올리면 뼈의 발육도 촉진되지만, 지나치게 올리면 체중 발육에 뼈의 발육이 따라가지 못해 체형의 균형이 무너진다. 문헌 9에서 인용·개변</p>
<p class="rb-p">성성숙에 도달한 육성 암소는 생식이 가능해지지만, 임신 유지와 정상 분만이 가능한 체격의 성숙은 성성숙보다 늦으므로 번식 공용 개시에는 개체의 발육 상황을 평가할 필요가 있다. 번식 공용을 개시한 육성우의 수태율은 정상적인 발정주기가 반복되고 있는지, 그것을 정확히 발견할 수 있는지에 크게 좌우된다. 질병 이환이나 저영양으로 사육된 발육 불량 육성우는 춘기발동과 성성숙이 늦어지고 번식 공용 개시도 지연된다. 육성기의 영양 수준은 발정 징후의 출현에 영향을 미쳐, 과도한 저영양에 의한 삭수(削瘦)나 고영양에 의한 비만이 되면 발정 징후가 불명료해지고 수태율도 저하한다. 발정 징후 확인에는 각종 발정 발견 보조기구의 이용이 효과적이다. 앞서 말했듯이 일반적으로 경산우와 비교해 육성우는 분만이나 비유에 의한 스트레스, 난소·자궁 이상이 적으므로 AI 등에 의한 높은 수태율을 기대할 수 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-13 육성기의 성장 패턴과 비유 — 가로축 주령(1~13), 세로축 1일 유량(kg, 0~9). 범례 H-H, M-M, L-L, H-L, L-H. 사양관리에 의한 영양 수준을 3단계로 나누어 TDN 130%를 고영양(H), 100%를 표준(M), 70%를 저영양(L)으로 하고, 급여 기간을 4~8개월령 전기와 9~16개월령 후기로 나누었다(전기 고영양·후기 저영양이면 「H-L」로 표기). H-H는 2주령 약 4 kg 피크 후 13주령 0 kg까지 급감, M-M은 2~3주령 약 8 kg 피크 후 약 3.5 kg, L-L은 약 6.5 kg에서 약 5 kg으로 가장 완만, H-L·L-H는 그 중간. 유선 발달은 춘기발동기부터 시작되어 주로 유관이 신장·분기한다. 이 시기의 유선은 대부분 지방세포이며 유관은 신장하나 지방조직에 묻힌 상태로 존재한다. 육성기의 고영양 사양은 춘기발동을 앞당기지만 과도한 고영양 사양은 유선조직의 정상 발달을 저해한다. 문헌 10에서 인용·개변</p>
<div class="modal-sub" style="margin:14px 0 6px;">교배 개시의 기준</div>
<p class="rb-p">육용우의 번식 공용 개시 월령은 품종, 계통, 사양 환경(영양 상태)에 따라 다르지만 일반적으로 체고 116 cm 이상, 체중 300 kg 이상이 기준으로 여겨진다. 가축증식목표에 맞추어 생각하면 초산 월령은 24개월 이하를 목표로 하게 되므로, 늦어도 13~14개월령에는 수태해 있어야 한다. 전국화우등록협회의 흑모화종 번식 암소 발육 추정치에서는 13개월령의 체중 평균이 334.6 kg, 체고 평균이 118.3 cm이므로(그림 5-2-10), 보통으로 사양하면 13개월령부터 번식 공용이 가능한 발육을 얻을 수 있다(그림 5-2-14).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-2-14 교배 적기의 육성우 — 13개월령, 체중 319 kg, 체고 116 cm이며 초회 발정도 확인되었다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(大島一修)</span></p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 5-2 육성기의 사양과 번식관리, 堂地修·大島一修.</p>
</div>

<div class="modal-sub" style="margin:22px 0 6px;">육용 번식우의 번식관리·모자 방목 번식 관리 (일본송아지 5-4)</div><div class="rb-block">
<div class="modal-sub" style="margin:18px 0 6px;">육용 번식우의 번식관리</div>
<p class="rb-p">번식관리의 기본은 발정을 발견하여 적기에 수정하고 조기 수태를 도모하는 것이다. 육성우의 경우는 10개월령경부터 시작되는 초회 발정 발현을 놓치지 않는 것이 중요하다. 또한 초회 발정에 따른 발정주기는 짧은 주기인 경우도 있으므로, 다음 이후 발정의 간격이나 발정주기의 길이 등 개체의 리듬을 이른 시기에 파악하는 것도 중요하다. 발정 발견을 위한 보조 기구의 사용이나 검지 시스템의 도입은 비용과 비용 대비 효과를 고려하여 행한다면 유효한 수단이라고 생각된다. 인공수정(AI) 시의 동결 정액이나 기구의 취급에도 충분히 신경 쓸 필요가 있으며, 특정 융해 조건이 지정되어 있는 동결 정액은 지정 조건을 준수하지 않으면 활성이 저하되어 수태율이 현저히 저하됨에 유의해야 한다. 번식관리 기록을 남기는 것은 가장 중요하며, 소의 관리에 종사하는 전원이 공유할 수 있는 형태로 번식관리, 사양관리의 기록이 정리되어 언제든 확인할 수 있는 시스템이 구축되어 있는 것이 바람직하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">목표와 현황</div>
<p class="rb-p">2015년 제정된 가축증식목표에서는 육우의 번식 능력 목표로서 제정 시 24.4개월의 초산 월령을 10년 후인 2025년에는 23.5개월로 단축하는 것이 목표 수치로 제시되어 있다<sup>17)</sup>. 2017년 전국와규등록협회의 데이터 해석 결과에서는 초산 월령의 평균치는 24.9개월, 중앙치는 24.0개월로, 대체로 소가 2세에 초산을 맞이하는 상황이 되어 있다<sup>18)</sup>. 또한 분만 간격에 대해서는 제정 시의 405일을 2025년에는 380일로 단축하는 목표 수치가 제시되어 있으며, 2018년에는 전 기록에 대한 분만 간격의 평균치는 398.6일, 중앙치는 380.0일로 대체로 달성되고 있는 듯한 상황이다. 분만 간격에 대해서는, 전회 분만 월의 분만 간격에 대한 효과로서 12~3월에 분만한 개체는 다음 분만 간격이 길고, 6~9월에 분만한 개체에서는 다음 분만 간격이 단축되는 경향이 있다. 분만 후 번식우 관리의 난이도를 시사한다고 생각되며, AI 적기에 사람, 소 모두 계절적 스트레스의 크기나 다른 농작업 등의 번망기와의 중복도 관계되어 있다고 생각된다.</p>
<p class="rb-p">육우의 영양 상태 평가는 주로 등록 심사 시에 사용되는 영양도 판정에 의해 이루어지고 있다. 영양도 판정은 기갑, 등뼈, 늑골, 요각, 둔부, 미근부의 6부위 촉진에 의해 피하지방의 부착 정도를 평가한다. 초산 월령에 대한 영양도의 효과로서, 영양도 7~8인 개체에서는 초산 월령이 지연되는 영향이 있다<sup>18)</sup>(그림 5-4-19). 후천적으로 획득한 비유전적인 암소 자신의 능력을 나타내는 영속적 환경효과는 후대에 전해질 수는 없지만, 해당 소가 현역으로 활약하는 동안 반복적으로 영향을 주는 개체 특유의 효과를 나타낸다. 이 영속적 환경효과에 대한 영양도(등록 심사 시)의 영향으로는 영양도 6인 개체가 최량이며, 등록 심사 시 영양도 6(인 개체)이 그 후의 분만 간격에 대하여 가장 좋은 효과라는 것(그림 5-4-20), 이 시기에 말라 있는 것, 사료 부족 기미인 것이 그 후의 번식 성적에 영향을 미친다는 것이 시사되어 있다<sup>18)</sup>(그림 5-4-21).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-4-19 초산 월령에 대한 영양도의 효과(영양도 3~8, 초산 월령 편차 월). 영양도 3~6은 −0.1~−0.13개월, 7은 +0.06개월, 8은 +0.37개월; 영양도 7, 8은 초산 월령을 지연시킨다. 문헌 18에서 인용·개변</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-4-20 임신 말기의 미경산우(영양도 6)(측면 사진 2장).</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-4-21 등록 심사 시 영양도별 영속적 환경효과(분만 간격)의 평균치(일). 영양도 3 약 +0.9일, 4 약 +0.35일, 5 약 −0.02일, 6 약 −0.15일(최량), 7 약 −0.08일, 8 약 +0.15일. 등록 심사 시 영양도가 낮으면 그 후의 번식성(분만 간격)에 악영향을 미친다. 영양도 6이 효과는 미미하지만 해당 소의 번식성에 좋은 영향을 준다. 문헌 18에서 인용·개변</p>
<div class="modal-sub" style="margin:14px 0 6px;">게노믹 육종가</div>
<p class="rb-p">육질, 번식성 등의 경제 형질은 양적 형질로서 소수의 유전자로 결정되지 않고 복수 유전자 효과의 총합에 의해 결정된다. 게놈상에 수만 개로 다수 존재하는 DNA 염기서열의 1개소 염기가 다른 염기로 바뀌어 있는 단일염기다형(Single nucleotide polymorphism: SNP) 정보를 이용하여 경제 형질에 관한 양적 형질 유전자좌(Quantitative trait locus: QTL)를 포착하고 개체의 유전적 능력을 예측·추정하는 기법이 게놈 선발이다<sup>19)</sup>. 게놈 선발의 흑모화종에서의 활용으로서, 종래의 육종가를 계산하는 정보에 SNP 정보를 더하여 계산된 게노믹 육종가가 이용되고 있다. 게노믹 육종가의 특징, 종래 육종가에 대한 우위점은, 같은 부모 유래의 전형제 산자의 능력 차이를 구별할 수 있는 것과, 후대가 없는 상황에서도 어느 정도의 신뢰도를 가지고 해당 소의 유전적 능력을 판정할 수 있는 것이다<sup>20)</sup>(그림 5-4-22). 게노믹 육종가의 이용에 의해 미경산우 단계에서 후계우 생산 대상우를 어느 정도 압축할 수 있으므로, 우군의 개량 속도 향상이 기대된다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 5-4-22 게노믹 평가의 신뢰도(평가 형질: 지육 중량). 종래 육종가(DNA 정보 없음, BLUP법): 혈통 정보 없음 0% → 미경산우(혈통 정보) 28% → 경산우(산자 1~3두) 40% → 산자 수 증가 99%. 게노믹 육종가(DNA 정보 있음, ssGBLUP법): 미경산우(혈통 정보+DNA 정보) 74% → 경산우(산자 1~3두+DNA 정보) 77% → 산자 수 증가 99%. 게노믹 육종가를 이용하면(해당 소의 SNP 정보를 알면) 후대가 없는 상태(육성우, 미경산우)에서도 개체의 능력을 판정할 수 있다(신뢰도 74%). 문헌 20에서 인용·개변</p>
<div class="modal-sub" style="margin:18px 0 6px;">모자 방목에서의 번식 관리</div>
<p class="rb-p">이유를 거치지 않고 모자 방목을 계속하면 송아지의 발육은 안정적으로 높은 수준에서 유지할 수 있다. 다만 송아지의 포유 자극이 계속되면 어미소의 발정 회귀가 지연될 위험이 있다<sup>30,40)</sup>. 포유 동물에서는 포유 자극이 원인이 되어 성선자극호르몬 방출호르몬(LH-RH) 분비가 억제되고, 이어서 뇌하수체에서 황체형성호르몬(LH)과 난포자극호르몬(FSH) 분비 억제 및 프로락틴 분비 항진이 유도된 결과, 난소에서는 난포 발육이 억제된다<sup>41)</sup>. 그러나 인위적으로 LH 또는 FSH를 투여하면 난포 발육이 촉진되는 것<sup>42)</sup>이 알려져 있고, 이를 번식 프로그램에 활용한 예가 있다<sup>43)</sup>. 합성 성선자극호르몬 방출호르몬(초산 페르틸레린, GnRH)과 프로스타글란딘(PG) F2α(클로프로스테놀)에 질내 유치형 프로제스테론 제제(CIDR)를 병용한 배란 동기화와 조기 임신진단을 조합하여 번식 관리를 하는 방법인데, 이를 통해 모자 방목 중인 번식우도 송아지가 포유하지 않는 번식우와 차이 없이 수태시킬 수 있다<sup>44)</sup>. 방목우에서는 발정 발견과 번식 관리에 따르는 소 모으기 작업이 부담이지만, 방목우 번식 관리 프로그램은 이러한 작업의 노동 경감을 도모하는 점에서도 유효하다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 5-4 송아지 사양관리 방식의 실제, 大島一修·木戸恭子.</p>
</div>

<div class="modal-sub" style="margin:22px 0 6px;">유방의 발달 (일본송아지 6-3)</div><div class="rb-block">
<p class="rb-p">성장(Growth)에는 물리적인 중량의 증가뿐 아니라 조직의 발달(Development)도 포함된다. 동물은 여러 기관을 발달시키면서 성장하지만, 발달 시기는 기관에 따라 각각 다르다. 반추동물의 경우 출생 후 가장 이른 시기에, 그리고 짧은 기간에 발달하는 것이 제1위이며, 송아지의 제1위가 성우와 같은 기능을 갖게 되는 것은 2~3개월령 무렵이다. 또한 번식기관이 급속히 발달하는 시기는 6개월령 무렵부터로 생각되며, 이르면 8개월령 무렵, 통상 10개월령 정도에 첫 발정이 관찰된다. 이처럼 출생 후 1년 이내에 제1위는 발달을 마치고 번식능력을 획득한다. 한편 유방은 분만이 가까워짐에 따라 커지기 때문에 임신기간의 발달만이 강조되지만, 이 변화는 극히 일부에 지나지 않으며, 태아기부터 비유할 때까지 장기간에 걸쳐 발달을 계속한다. 또한 유선 발달(Mammary development)은 영양상태나 호르몬의 영향을 크게 받는다. 그래서 본 절에서는 홀스타인의 단계별 유선 발달, 그리고 유선 발달과 사료·영양수준 및 호르몬의 관련을 중심으로 개설한다.</p>
<div class="modal-sub" style="margin:18px 0 6px;">단계별 유방 발달</div>
<div class="modal-sub" style="margin:14px 0 6px;">태아기의 유방 발달</div>
<p class="rb-p">홀스타인의 태아기는 약 280일간이지만, 유방 조직의 큰 변화는 태아기의 처음 2/3(약 180일간)에 일어난다¹⁾(표 6-3-1). 태령 30일 무렵에 태아 양측의 겨드랑이에서 하복부에 걸쳐 선상으로 피부가 비후하기 시작하여, 유선제(乳腺堤, Milk band), 유선조(乳腺縞, Milk streak), 유선(乳線, Milk line)을 거친 뒤 분절되어 징검돌 모양의 유점(乳点, Milk point)이 된다. 1개의 유점은 장래의 유방 1개에 해당하며, 소에서는 2쌍(4유점)을 남기고 나머지는 퇴행한다. 이 유점이 다시 유릉(乳稜, Milk crest), 유구(乳塚, Milk hillock)의 과정을 거쳐 융기하여 유선아(乳腺芽, Milk bud)가 된다. 유선제에서 유선아까지 소요되는 일수는 10일 전후이며, 이 기간에 두부에서 둔부까지의 길이(Crown-rump length)는 14 mm에서 25 mm 정도로 성장한다. 태령 65일 무렵부터 유두가, 110일까지는 유두조와 유선조(乳腺槽) 및 유관의 원기가 형성되고, 수태 180일의 두부에서 둔부까지의 길이는 480 mm 정도가 되며, 이때까지는 유두층, 유방 내의 지방층(Fat pad) 및 유방을 복벽에서 매달아 지탱하는 중앙제인대(Median suspensory ligament)가 형성된다. 이후로는 중량과 체적이 증가해 가며, 조직학적으로 큰 변화는 없지만 부수되는 기본구조(혈관, 신경, 림프관)가 나타난다. 출생 시에는 유방 내부가 지방층으로 차 있다. 유관은 유두의 기부(작은 유선조)에 약간 인정될 뿐이다(그림 6-3-1).</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-3-1 소의 태아기에 있어서 유방의 분화와 태아의 크기</p>

<div class="modal-sub" style="margin:14px 0 6px;">출생 후~수태까지의 유방 발달</div>
<p class="rb-p">유방의 발달 정도는 어느 시점의 체중(X)에 대한 유방의 성장속도(Y)로 평가한다. 이를 「상대성장」이라 하며, 일차식으로 log Y = log b + α log X로 나타낸다. α는 「성장계수」 또는 「성장비」라 하며, α < 1인 경우 Y는 X보다 느린 성장속도, α ≒ 1.0인 경우 Y는 X와 같은 성장속도, α > 1인 경우 Y는 X보다 빠른 성장속도가 되며, 각각 「열상대성장(Negative allometric growth)」 「등성장(Isometric growth)」 「우상대성장(Positive allometric growth)」이라 한다. 이 기간의 유방은 우상대성장을 하고 있으나, 특히 체중 100 kg(3개월령) 정도에서 250 kg(10개월령) 정도가 될 때까지의 기간에 발달이 현저하다(α = 3.5)²⁾(그림 6-3-2). 우상대성장 기간에 유두에서 유관이 지방층 방향으로 서로 교차하지 않고 수상(樹狀)으로 신장하는 동시에 유선실질이 형성되고, 지방조직은 주변부로 밀려나 결합·지지조직이 된다(그림 6-3-3). 유방 발달은 수태할 때까지 이보다 앞선 단계(유선포의 형성)로는 진행하지 않는다. 등성장으로 돌아가면 유방의 체적은 증가하지만, 이는 세포의 증식(Hyperplasia)이 아니라 세포가 비대화(Hypertrophy)하기 때문이다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-2 육성우에 있어서 유선조직의 DNA량과 체중의 관계. 세로축 유선조직 DNA량(mg, 1~10,000 대수눈금), 가로축 체중(kg, 50~400). 체중 약 100 kg까지 α=1.6, 100~250 kg 구간 α=3.5, 그 이후 α=1.5. Log Y = Log b + α Log X. 문헌 2에서 인용·개변</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-3 6개월령의 유방(홀스타인). 전·후 방향, 유선실질·지방·유관·유두 표시. 컬러 화보 15쪽</p>
<div class="modal-sub" style="margin:14px 0 6px;">수태 후의 유방 발달</div>
<p class="rb-p">임신기의 유방 발달은 임신 초기에는 큰 변화가 보이지 않으나, 임신 110~140일 이후부터 급속히 발달한다. 지방층 내의 지방조직은 유관, 유선포, 혈관, 림프관, 콜라겐이나 엘라스틴 등의 지지결합조직으로 치환된다. 임신기간 중 유관은 지방층 전역에 걸쳐 신장을 계속하지만, 선단 부위(Bud)가 유선포로 분화하여 지수함수적으로 증식한다. 유선포 내의 하나하나의 세포를 「유선상피세포」, 각 유선포가 소유관으로 연결되어 포도송이처럼 된 형상을 「유선소엽」, 여러 유선소엽의 집합을 「유선엽」이라 한다(그림 6-3-4). 비유 시에는 모세혈관에서 유선포로 영양을 받아들여 포 내부에 유즙을 분비한다. 분비된 유즙은 세유관에서 더 굵은 유관으로 이행하여 최종적으로는 유선조로 이어진다. 그림 6-3-4는 분만 시의 유방이지만 임신 후기의 유방과 거의 같다. 그림 6-3-4는 유방 내에 유즙이 가득 차 있기 때문에 전체가 희지만, 적어도 분만 30일 전까지는 유당 합성이 없고 지방 합성도 거의 이루어지지 않기 때문에 실제로는 연한 분홍색을 띤다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-4 분만 시의 유방(홀스타인). 전·후 방향, 유선엽·유선소엽·유선상피세포·유선포·소유관·유관·유선조·유두조의 위치를 모식도와 함께 표시. 컬러 화보 15쪽</p>
<div class="modal-sub" style="margin:18px 0 6px;">영양과 유선 발달의 관련</div>
<div class="modal-sub" style="margin:14px 0 6px;">출생~수태까지의 유선 발달</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">출생~2개월령</p>
<p class="rb-p">지금까지 포유기는 등성장기이며 우상대성장기가 될 때까지 유선실질의 발달은 최소한이라는 것이 공통된 견해였다. 생산현장에 널리 보급된 제한포유법은 포유 횟수가 적다는 노동력 절감, 포유기간 중 인공유(스타터) 섭취량이 높아짐에 따른 제1위 발달 촉진 효과에 더하여, 송아지의 유방 중에 포함되는 지방 축적이 적어지므로 이유 후의 우상대성장기에 유선 발달을 저해하지 않고 장래의 우유 생산을 향상시키는 방법이라고 믿어져 왔다. 그러나 포유기간에 단백질 함량이 높은 대용유(건물 중 CP 28~29%)를 써서 포유량을 높인 고증체 송아지는 유방 중량이 많아지지만 유선 발달을 저해하지 않으며³⁾, 오히려 유선세포 증식에 의한 유선실질량 및 지방층량의 증가(그림 6-3-5)가 인정되고 있다⁴⁻⁶⁾. 이처럼 유선 발달이 촉진됨으로써 초산 유량의 향상도 시사되고 있다⁷,⁸⁾. 또한 포유량의 증가는 mRNA 발현에 변화를 주어 형태적·생리적으로 유선조직의 발달에 영향을 준다고도 한다⁹⁾. 이러한 사실로부터, 포유량을 높여 영양조건을 좋게 하면 우상대성장은 포유기부터 시작되고, 체적이 증가한 지방층 내에서 일어나는 유관의 신장이나 유선실질로의 치환도 많아져 장래의 우유 생산 향상으로 이어진다고 생각되고 있다. 또한 송아지기의 사회적·물리적 제한이나 변화(개체 사육에서 군 사육으로 등) 같은 환경요인도 장래의 생산성(우유 생산, 번식)에 영향을 준다는 것이 제시되어 있다¹⁰⁾.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-5 지방층량(좌) 및 유선실질량(우)의 비교. 제한포유 vs 강화포유: 지방층량 약 30 g vs 약 175 g, 유선실질량 약 1.5 g vs 약 10 g, \*P<0.01. 문헌 5에서 인용·개변</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">3개월령~수태</p>
<p class="rb-p">우상대성장기에 성장 촉진을 목적으로 과잉 에너지를 섭취시키면 일당증체량(DG)은 증가한다. 그러나 잉여 에너지를 지방으로 지방층 내에 축적함으로써 세포가 비대화하여 유관의 신장이 방해된다(그림 6-3-6). 그 때문에 우상대성장기의 DG는 0.7 kg 이하로 제한하는 것이 권장되어 왔다. 그러나 급속히 프레임 사이즈가 커지는 이 시기에는 단백질 요구량이 높아진다. 에너지에 대한 단백질 비율의 검토에서는, 에너지와 함께 단백질 비율을 높인 사료를 급여하면 DG가 1.1 kg 정도라도 지방 축적에 의한 과비가 되지 않고 체격이 커지며¹¹⁾, 초산 유량이 저하하지 않는 것이 보고되어 있다¹²⁾. 다만 그 상한에 대해서는 아직 검토의 여지가 있으므로, 일본사양표준(2017)¹³⁾에서는 안전을 감안하여 상한을 0.95 kg 정도로 하고 있다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-6 농후사료 다급 시의 유방(흑모화종). 지방·유선실질·유관·유두 표시, 전·후 방향</p>
<p class="rb-p">이상, 출생부터 수태까지 유선을 충분히 발달시키기 위해 영양 면에서 공통되는 것은 사료의 단백질량을 높이는 것, 에너지와 균형을 맞추는 것, 섭취량을 높이는 것이다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">수태 후의 영양수준과 유선 발달</div>
<p class="rb-p">수태 후의 고에너지 사료는 유선 발달에 영향을 미치지 않는다. 이 시기는 주로 유선포가 비약적으로 증식하는 시기로, 유관도 충분히 신장해 있기 때문에 영향을 받지 않는다. 반대로 체중이 증가하면 유량도 증가하는 경향이 있다. 표 6-3-2에 임신기의 체중 증가량 차이에 따른 우유 생산에의 영향을 나타냈다. 임신기의 증체량을 높이면 초산차의 4% 지방보정유량(Fat correct milk: FCM)이 약 1,000 kg 증가하였다. 이는 유선 발달에 대한 영양의 효과라기보다, 분만 후의 체지방 동원량의 차이나 체격도 커져 있었기 때문에 비유기에 섭취한 영양분의 성장과 우유 생산으로의 배분 비율이 변화한 결과로 생각된다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-3-2 임신기간의 DG 차이와 체격 및 초산차 우유 생산</p>

<div class="modal-sub" style="margin:18px 0 6px;">호르몬과 유선 발달의 관련</div>
<p class="rb-p">유선의 발달에는 많은 호르몬이 복잡하게 관여하고 있다. 임신하지 않은 육성우의 난소를 절제하면 혈중 에스트로겐(E₂) 농도가 극히 낮은 농도가 되어¹⁴⁾ 유선조직의 발달이 현저히 방해된다¹⁵⁾. 이유 후에 E₂를 투여하면 지방층이나 유선실질량이 많아지고, 포유기에 영양수준을 높임으로써 그 효과는 현저하다(그림 6-3-7)는 것⁵⁾이나, 유선포 증식이 현저한 임신 후기에 E₂가 증가한다(그림 6-3-8)는 것¹⁶⁾으로부터, E₂는 육성기 전반의 유선 발달에 영향을 준다. 한편 프로게스테론은 그러한 효과가 작다. 뇌하수체 전엽 호르몬의 하나인 프로락틴은 래트, 마우스 등에서 유선의 분화에 필요하다고 되어 있으나 소에 대한 효과는 작다. 또한 성장호르몬(GH)은 그 자극을 통해 인슐린양 성장인자(IGF)-1이나 그 밖의 성장·증식인자가 유선 발달에 영향을 준다고 한다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-7 이유 후 2주간의 E₂ 임플란트 유무와 지방층량(좌) 및 유선실질량(우)의 비교. 제한포유 / 제한포유+E₂ / 강화포유 / 강화포유+E₂: 지방층량 약 38(a) / 60(ab) / 88(b) / 128(c) g, 유선실질량 약 2(a) / 5(a) / 15.5(b) / 27.5(c) g. abc: 다른 부호 간 유의차 있음, P<0.05. 문헌 5에서 인용</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-3-8 임신기간 중의 스테로이드 호르몬 농도. 가로축 임신기간(일, 50~250, 배란~분만), 세로축 혈장 중 스테로이드 호르몬 농도(대수눈금, 10 pg~100 ng). 프로게스테론은 배란 직후 급상승하여 약 100 ng 수준에서 임신기간 내내 유지되다 분만 직전 급감. 포합형 에스트로겐, 포합형 17α 에스트라디올, 포합형 17β 에스트라디올, 17α 에스트라디올, 에스트론, E₂, 에스트리올은 임신 100~150일 이후 점증하여 분만 직전 급격히 상승. 문헌 16에서 인용·개변</p>

<div class="modal-sub" style="margin:18px 0 6px;">유용우 — 수지에 영향을 미치는 기술 항목(발췌)</div>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-5-3 경영 수지에 영향을 미치는 항목과 시산액</p>
<div style="overflow-x:auto"><table class="jp-tbl"><tr><th></th><th>경산우 두수</th><th>분만 후 종부 개시 일수</th><th>305일 유량 평균</th><th>초산 분만 월령</th></tr><tr><td>경산우 70두에서의 시산액(엔)</td><td>1두 증가하면 +16만 2,000</td><td>1주 늦어지면 −196만</td><td>100 kg 증가하면 +17만 8,900</td><td>1개월 늦어지면 −180만</td></tr></table></div>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">※ 주) 문헌 4에서 인용·개변.</p>
<p class="rb-p">2007년 홋카이도 곤센 지구에서 관내 농가의 수지 데이터와 유검 데이터를 이용하여 중회귀로 기술 지표와 수지의 상관을 본 결과, 수지와 관계가 큰 항목으로 경산우 두수, 분만 후 종부 개시 일수, 유량 평균, 초산 분만 월령의 4항목이 꼽혔다⁴⁾(표 6-5-3). 또 경산우 70두를 사양하는 경영에서의 수지 변동 시산값에서는 분만 후 종부 개시와 초산 분만의 지연이 전체적으로 큰 수지 감소로 이어지는 것으로 시사되었다. 이처럼 경산우 두수나 개체 유량과 같이 원유 생산에 직접 관계되는 지표 이외에도, 분만 후 종부나 초산 분만이 빠른 정도가 수지와 관계되어 있음을 알 수 있다. 자기 경영을 점검할 때는 이러한 시산값을 참고로 하면서 자기 경영에서 취약한 기술을 정확히 파악한 뒤 우선적으로 개선해야 할 점을 특정하는 것이 효율적인 경영 개선으로 이어진다고 할 수 있다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(日向貴久)</span></p>
<div class="modal-sub" style="margin:18px 0 6px;">육용 번식우</div>
<div class="modal-sub" style="margin:14px 0 6px;">육용우 번식 경영의 발전 과정과 동향</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">육용우 번식 경영 발전의 과정</p>
<p class="rb-p">육용우 번식 경영은 육용 번식 암소를 사양하여 육전용 품종의 송아지를 판매하는 경영이다. 쇠고기 생산이라는 관점에서 송아지는 중간 생산물이며, 어디까지나 육용우 비육 경영에서 생산되는 비육우 또는 그것을 도축한 지육이 육용우 부문의 최종 판매물이라 할 수 있다.</p>
<p class="rb-p">소와 말은 예로부터 농용 가축으로서 구비(厩肥) 생산을 포함하여 역축으로서 중요한 역할을 해 왔다. 이 상황은 1955년경부터 시험적으로 동력 경운기가 도입되고 1960년경부터 급속히 보급되기 시작하면서 크게 전환되어, 그 후의 농경 작업은 동력 경운기가 중심이 되었다. 또 운반 작업도 동력 경운기에 이어 도입된 농용 자동차로 대체되었다.</p>
<p class="rb-p">1955년경에 들어서자 급속한 경제 발전에 따라 농업과 타 산업 사이에 생산성과 취업자의 생활 수준 격차가 확대되었다. 한편 농산물의 소비 구조에도 변화가 생기고, 노동력의 도시 이동도 나타나게 되었다. 이 격차를 시정하고 농업의 근대화를 꾀하여 타 산업과의 균형을 이룰 목적으로 1961년에 농업기본법이 제정되었다. 농업기본법에 의해 수요 확대에 걸맞은 선택적 확대 정책이 제시되었고, 그 선두에 자리매김된 것이 축산이었다. 축산물가격안정법이 제정되어 가격 유지에 국가가 크게 관여하게 되었다.</p>
<p class="rb-p">이 시기에는 급속한 고도 경제 성장과 농업 노동력의 급감, 동력 경운기 및 화학비료의 급속한 보급, 식료 소비에서의 단백질 섭취 증대 등의 변동이 일어났다. 이러한 구조 변화 속에서 농경에 이용되지 않게 된 와규를 어떻게 이용할 것인가 하는 문제가 생겼고, 국민에게 동물성 단백질을 공급한다는 목적으로 귀중한 토지이용형 가축을 「육전용 품종」으로 자리매김하고 그것을 지향한 소 만들기를 진흥한다는 혁신적인 전환이 이루어졌다.</p>
<p class="rb-p">와규의 사양 상황을 보면 1956년에 232만 호, 272만 두로 와규 사양의 정점을 찍었으나 그 후 감소가 이어져, 1965년에는 호수 144만 호(56년 대비 62%), 두수 189만 두(동 69%)까지 감소하였다. 한편 경운기의 개발·이용은 급속히 진행되어, 경운기 이용이 축력을 웃돈 것은 논농사에서 1961년, 밭농사에서 1962년이다. 이 때문에 농경에 이용되지 않는 와규를 사육하여 경영을 새롭게 전망하려면 전문적인 관리 기술이 필요하게 되었고, 번식(송아지 생산) 경영은 조사료 기반과 생산 조직화가 서둘러졌으며 비육 경영도 전업화의 길에 들어섰다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">육용우 번식 경영의 동향</p>
<p class="rb-p">이상과 같이 역축에서 용축으로의 전환이라는 과정을 거쳐 오늘날의 육용우 번식 경영은 발전해 왔다. 그리고 근래에는 농가 경영주의 고령화 등으로 그 사양 호수가 급속히 감소하고 있다. 즉 영세 경영의 고령화된 많은 농가가 후계자도 없이 은퇴하고 있는 상황이다. 이들 다수는 역축의 흔적을 남긴 농가로, 경영으로서 송아지의 생산성 향상에 대한 의식도 그다지 높지 않았던 것으로 생각된다.</p>
<p class="rb-p">2009~2017년 사이에 육용우 번식 농가는 6만 5,760호에서 4만 3,035호로 약 35%나 감소하였고, 사양두수도 68만 2,100두에서 59만 7,300두까지 감소하였다. 그리고 2009년에는 번식 암소 10두 미만 농가가 74.5%였고 50두 이상 층은 불과 2.5%였다. 그러나 2017년에는 10두 미만 층이 66.9%까지 점유율을 줄였고 50두 이상 층은 4.3%까지 늘었다. 확실히 영세층이 감소하고 대규모층이 늘어 왔다. 그러나 이 사양 규모는 육용우 비육 경영, 낙농 경영, 양돈 경영 등의 규모와 비교하면 현저히 영세하며, 그 영세 구조가 노동집약적인 사양 구조를 가져오고 있다고 생각된다.</p>

<div class="modal-sub" style="margin:14px 0 6px;">생산성 지표와 수익성 지표</div>
<p class="rb-p" style="font-weight:700;margin-top:10px;">생산력 지표로서의 분만 간격</p>
<p class="rb-p">육용우 번식 경영에서 생산력이라는 관점에서 말하면, 1두의 번식 암소로부터 얼마나 짧은 분만 간격으로 송아지를 낳게 하느냐가 최대의 포인트가 된다. 즉 「1년 1산」을 목표로 한다는 것이다. 그리고 태어난 송아지를 질병이나 사고사 등을 일으키지 않고 9~10개월 정도 사양하여 높은 값에 판매하는 것이 다음의 높은 생산력을 올리는 포인트가 된다.</p>
<p class="rb-p">번식 성적을 개선하고자 한다면 먼저 분만 간격 등의 목표 계획을 설정하는 것이 중요하다. 막연히 발정이 오기를 기다려 인공수정(AI)을 하는 것이 아니라, 어떻게 하면 수태율을 높이고 분만 간격을 12개월에 가깝게 할 수 있는지 항상 주의를 기울일 필요가 있다.</p>
<p class="rb-p">일반적으로는 목표 계획 아래 주의 깊은 관찰을 계속하면서 발정 발견 및 AI를 적기에 행하고, 정확한 기록을 남기고, 결과 분석을 할 필요가 있다. 번식 성적의 개선 목표에서 크게 벗어난 경우에는 왜 벗어났는지, 제대로 발정을 발견하여 적기에 AI하고 있는지, 수정은 괜찮은지, 사육 관리에 문제는 없는지, 바로 계획(Plan)·실천(Do)·기록(Check)·분석(Analysis)이 필요해진다.</p>
<p class="rb-p">여기서 (공사)중앙축산회가 실시하는 축산 경영 진단의 2017년 데이터⁵⁾에 근거하여 경영 규모 또는 수익성별로 본 번식 성적을 검토해 보자(표 6-5-4). 번식 암소의 두수 규모별 데이터에 따르면, 당연한 일이지만 암소 두수가 늘어남에 따라 노동력, 사료 생산을 위한 농용지 면적(경지 + 초지), 송아지 판매 두수도 증대하여 농장 규모가 크다는 것을 보여 준다.</p>
<p class="rb-p">평균 분만 간격은 전체 평균이 12.8개월이지만, 10~20두 규모는 13.1개월, 20~30두 규모는 12.9개월, 30~40두는 13.3개월로 다소 길다. 이에 비해 40~50두, 50두 이상 규모에서는 모두 12.5개월로 짧다. 또 수태에 소요된 평균 AI 횟수도 평균이 1.7회인 데 비해 10두 미만은 2.0회, 10~20두 규모는 1.9회로 많지만, 40~50두 규모 1.6회, 50~80두 1.7회, 80두 이상 1.6회로 적다. 이처럼 대규모 농장에서 생산력이 높아지고 있다는 점에 주목해 둘 필요가 있다. 한편 수익성을 보면 암소 1두당 송아지 판매 수입은 규모 간에 큰 차이가 없고, 암소 1두당 경상소득도 규모 간에 큰 차이는 보이지 않는다. 그러나 성 암소 1두당 연간 노동시간은 노동집약적인 소규모 농장 쪽이 길고, 성 암소 1두당 영업이익은 대규모가 될수록 증대하고 있다.</p>
<p class="rb-p">다음으로 성 암소 1두당 소득 계층별로 보면, 3계층 간에 노동력, 농용지 등의 투입재 및 암소 1두당 노동시간에서 차이를 찾아낼 수 없다. 오히려 송아지 판매 두수는 중위 그룹의 두수가 많은 상황이다. 그러나 한편으로 상위 20% 경영에서는 평균 분만 간격, 수태에 소요된 평균 AI 횟수 모두 중위 60%, 하위 20%에 비해 성적이 좋음을 알 수 있다. 상위 그룹에서는 생산력이 높은 데 더해 송아지 판매 수입이 많은 것도 있어 영업이익, 경상소득도 높은 결과가 되었다.</p>
<p class="rb-p">이상과 같이 번식 성적이 좋은(생산력이 높은) 경영은 대체로 수익성도 높은 것으로 보인다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">생산력 지표로서의 생산 비용</p>
<p class="rb-p">당연히 번식 암소의 사양 관리와 송아지 사육에는 비용이 든다. 송아지 1두당 생산 비용은 생산성에서 중요한 지표가 된다. 이 생산 비용을 보다 낮게 억제할 수 있다면 높은 생산력을 실현할 수 있다.</p>
<p class="rb-p">한편 높은 생산력이 반드시 높은 수익을 가져오는 것은 아니다. 이는 수익성이 송아지의 판매 가격에 규정되기 때문이다. 송아지 가격은 송아지에 대한 수요의 크기에 규정되고, 시장으로의 송아지 출하 두수에 규정된다. 근년 송아지 가격 급등의 요인 중 하나로, 고령 경영주의 육용우 번식 농가가 잇따라 폐업하여 송아지 공급이 감소한 것은 전형적인 사례이다. 시장 가격에 따라 수익성은 높아지기도 낮아지기도 하지만, 수익성을 뒷받침하는 생산력을 높여 두는 것이 기본적으로 중요한 방책이 된다.</p>
<p class="rb-p">수익성의 지표로는 소득, 가족노동보수 및 이들을 1일당으로 환산한 1일당 소득, 1일당 가족노동보수가 있다.</p>
<p class="rb-p">소득은 생산비 총액에서 가족노동비, 자기자본이자 및 자작지 지대를 공제한 액을 조수익에서 뺀 것으로, 가족 경영에 귀속되는 가족노동비, 자기자본이자, 자작지 지대의 합계이다. 3가지 요소에 대한 보수이지만 내역은 불명확하여 혼합소득이라 불리는 까닭이 있다.</p>
<p class="rb-p">이에 비해 가족노동보수는 생산비 총액에서 가족노동비를 공제한 액을 조수익에서 뺀 액으로, 이른바 가족노동에 대한 가치액(평가액)이라 할 수 있다.</p>
<p class="rb-p">1일당 소득이나 1일당 가족노동보수는 각각의 수익성 지표를 가족노동시간으로 나눈 뒤, 1일로 환산하기 위해 8(시간)을 곱하여 구한 것이다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">생산비의 구조 ~생산력 향상을 위한 방책~</div>
<p class="rb-p">먼저 생산비의 구조를 파악해 둘 필요가 있다. 생산비는 물재비와 노동비, 자본이자, 지대로 이루어진다. 이하 물재비 가운데 생산력과 관련된 중요한 비목과 노동비에 대해 그 비용의 의미를 검토한다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">인공수정료</p>
<p class="rb-p">번식 암소에 대해 계산 기간 중 AI에 소요된 정액 대금, 요금 등이 해당한다. 당연히 수태성이 높아 1회의 AI로 수태하는 경우에는 1두당 인공수정료는 낮아진다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">사료비</p>
<p class="rb-p">사료비에는 유통 사료비와 목초·방목·채초비가 있다. 유통 사료비는 구입 사료비와, 자급 사료작물 이외의 생산물을 사료로 급여한 경우의 자급 사료비가 있다. 한편 목초·방목·채초비는 목초 등 사료작물의 생산에 소요된 비용 및 야생초, 야건초, 방목장, 채초지에 소요된 비용이다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">수의사료 및 의약품비(진료비)</p>
<p class="rb-p">수의사에게 지불한 요금 및 사용한 의약품, 방충제, 살충제, 소독제 등의 비용 외에 가축공제 납입금 중 질병·장해분이 해당한다. 이환 정도가 높아지면 비용을 끌어올리는 요인이 된다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">번식 암소 상각비</p>
<p class="rb-p">번식 암소의 취득에 소요된 비용을 대상으로 감가상각 계산을 하여 계상한다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">노동비</p>
<p class="rb-p">노동비는 가족노동비와 고용노동비가 해당한다. 사육 전반의 노동, 생산 관리 노동 및 사료작물의 생산 노동, 자재 등의 구입 부대 노동, 건물과 같은 고정자본의 수선 등 간접 노동을 포함한다.</p>
<p class="rb-p">그런데 이들 생산 비목은 생산량 증대와 함께 투입량이 많아지는 변동비(variable cost)와 생산량 증가에 관계없이 일정 정도 투입되는 고정비(fixed cost)로 분류된다. 인공수정료, 사료비, 깔짚비, 기타 제재료비, 수의사료 등은 전형적인 변동비이고, 건물비, 자동차비, 농기구비 등의 고정자본비는 전형적인 고정비이다. 고정비는 생산량의 많고 적음(이 경우에는 번식 암소 사양두수의 많고 적음)에 관계없이 투입이 일정하므로, 송아지 1두당으로 환산하면 비용은 저감되는 것으로 생각된다. 이처럼 단위당 비용이 저감되는 현상을 규모의 경제성(scale merit)이라 부른다.</p>

<p class="rb-p">표 6-5-5는 2017년도 송아지 생산비 조사의 조사 결과에 의한 송아지 1두당 생산 비용을 사양두수 규모별로 집계한 것이다⁶⁾. 표에 따르면 전체적으로 사양두수가 영세한 번식 경영에서는 건물비, 자동차비, 농기구비 등의 고정자본비에 1두당 뚜렷한 비용 저하가 인정되지 않는다.</p>
<p class="rb-p">한편 1두당 노동비를 보면, 최소 규모층인 2~5두 미만이면 31만 3,796엔인 데 비해 사양 규모가 증대함에 따라 노동비는 저감되어 최대 규모인 50두 이상 층에서는 12만 2,534엔으로 감소한다. 이처럼 변동비적 요소인 노동비에 규모의 경제가 나타난다. 이는 가족노동력이 주체인 번식 경영에서 대규모 경영이 될수록 효율적으로 가족노동력이 투입되고 있음을 보여 준다.</p>
<p class="rb-p">또 수의사료 및 의약품비를 보면 대규모층의 비용이 저감되어 있음을 알 수 있다. 수의사료 및 의약품비는 본래 두수가 늘면 비용도 느는 변동비적 요소를 갖지만, 여기서의 숫자가 보여 주는 것은 대규모층일수록 AI나 송아지의 질병 예방에 대해 적절한 관리를 하고 있어 과대한 비용을 들이지 않고 있다는 점이다.</p>
<p class="rb-p">그리고 비용 합계를 보면 최소 규모층이 73만 8,186엔인 데 비해 최대 규모층은 그 약 64%인 47만 3,642엔으로 송아지를 공급하고 있다. 같은 연도 평균 송아지 가격은 75만 4,495엔으로, 최소 규모층은 근소한 흑자인 데 비해 최대 규모층은 28만 엔 정도의 충분한 순익이 나오고 있다. 가령 가격 변동이 생겨 수익성이 떨어지더라도 최대 규모층에서는 충분히 흑자 경영이 가능하다.</p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">그림 6-5-4 송아지 생산비에서 차지하는 사료비·노동비 비율의 장기 추이(1960~2014년, %). 두 비목 합계 80% 조금 못 미침~70%; 사료비 비율은 1960년대 약 50% → 1970년 전후 약 25%로 급락 → 1980년대 약 45% → 1990년대 중반 이후 30~40%; 노동비 비율은 1970년대 이후 약 25~40%</p>
<p class="rb-p">그런데 생산비 합계와 주요 비목인 사료비·노동비의 비율의 장기 추이를 나타낸 것이 그림 6-5-4이다. 비용 합계에서 차지하는 두 비목의 비율을 나타낸 것이므로 물가 변동은 고려하지 않았지만, 두 비목을 합친 비율은 80% 조금 못 미치는 수준에서 70%라는 장기적으로 높은 점유율을 보이고 있다. 사료비 비율은 한때 50% 정도였으나 40%에서 30%의 비율로 변동하고 있다. 사료비는 사료 곡물이나 환율, 해상 운임 등의 변동에 따라 변동을 거듭하고 있음도 이 그림에서 엿볼 수 있다. 즉 이 변동을 감안한 뒤 사료 조달을 하지 않으면 안 된다. 가축의 사양은 경영 외부의 변동 요인에 의해 경영이 크게 좌우되므로 사료비 절감에 더욱 유의할 필요가 있다.</p>
<p class="rb-p">한편 노동비 비율의 높음이 번식 경영의 특징 중 하나이다. 영세 경영이 가족노동을 고정비적으로 투입하고 있기 때문에 노동비에는 규모의 경제가 명확히 나타나고 있다. 앞으로도 규모 확대가 진행되면 현재처럼 전체적으로 규모의 경제가 더욱 뚜렷해지고, 다른 가축과 마찬가지로 노동비의 비율은 낮고 사료비가 비용 합계의 과반을 차지하는 구조로 전환해 갈 것으로 생각된다.</p>
<p class="rb-p" style="font-weight:600;margin-top:8px;font-size:13px">표 6-5-6 번식 암소 사양두수 규모별로 본 수익성</p>

<div class="modal-sub" style="margin:14px 0 6px;">육용우 번식 암소 경영의 수익성</div>
<p class="rb-p">번식 암소 1두당 수익성을 나타낸 것이 표 6-5-6이다⁶⁾. 먼저 1두당 소득을 보면 2~5두 미만의 최소 규모층에서 42만 450엔으로 가장 높고, 최대 규모층인 50두 이상 층이 그 뒤를 이어 39만 4,948엔이다. 번식 암소 1두당 가족노동보수도 거의 마찬가지로, 최소 규모층에서 35만 4,090엔으로 가장 높고 최대 규모층의 33만 4,395엔이 그 뒤를 잇는다. 생산비 총액으로 보면 사양 규모가 커짐에 따라 비용이 낮아지므로 규모의 경제성이 인정되었지만, 1두당 수익성에서는 최소 규모층의 수익성이 가장 높다. 이는 송아지 판매 가격에 의한 주산물 조수익, 퇴비 등의 부산물 조수익이 모두 최소 규모층에서 가장 높아 합계 조수익이 85만 7,872엔이 되기 때문이다. 최대 규모층에서는 76만 6,182엔으로 최소 규모층에 비해 10만 엔 정도나 낮음을 알 수 있다. 이것이 생산력과 수익성의 괴리이다. 앞서 보였듯이 송아지 가격의 변동은 극히 크고 근년에는 시장 가격의 극단적인 급등이 나타나고 있다. 최소 규모층의 송아지 판매 가격이 높은 요인은 특정할 수 없지만, 모든 경영에서 고가격의 이유를 추구할 수 있는 것은 아니다. 평균적인 판매 가격을 상정한 뒤 생산력 = 생산 비용의 실현을 향한 노력을 계속하지 않으면 경영체로서의 지속성이 문제시될 것이다.</p>
<p class="rb-p">다만 여기서 주목해야 할 것은 1일당 수익성이다. 1일당 소득과 가족노동보수를 보면 양상이 달라진다. 즉 1일당 소득에서는 최대 규모층이 4만 3,017엔을 획득하고 있는 데 비해 최소 규모층에서는 1만 4,681엔으로 가장 낮다. 1일당 가족노동보수에 대해서도 마찬가지로 최대 규모층이 3만 6,422엔, 최소 규모층이 1만 2,364엔으로, 규모가 커짐에 따라 수익성이 높아지고 있다. 이는 영세 경영에서는 노동력을 집약적으로 투입하여 소득이나 가족노동보수를 벌고 있지만, 1일당 수익으로 보면 효율이 나쁜 경영이 되어 있음을 보여 준다. 가족노동보수는 순수하게 노동에 대한 보수이며 노동의 평가를 나타낸다. 이 지표를 사회적으로 보아 다른 축산 경영이나 타 산업과 비교한 뒤 번식 경영의 평가를 해야 할 것이다.</p>
<p class="rb-p" style="font-weight:700;margin-top:10px;">수익성 향상의 방책</p>
<p class="rb-p">기본적으로 사양두수 규모가 증대함에 따라 생산비는 낮아지고 있다. 따라서 생산력이라는 관점에서 보면 어느 정도의 규모에서 1두당 생산비가 체증(遞增)하기 시작하는지를 가늠하는 것이 중요하다. 이 점에 관해서는 이른바 가족노동력을 주체로 한 경영인지, 고용노동력에 의한 경영 내 분업 시스템을 도입한 고용형 경영인지에 따라 다를 것으로 생각된다.</p>
<p class="rb-p">법인 경영에 의한 대규모 고용형 경영에서는 이미 30명 정도의 고용노동력으로 3,000두 규모의 번식 암소를 사양하는 사례가 있다. 이는 번식 암소의 수태, 분만, 송아지의 포유, 육성 등 개체 관리에 관련된 작업을 분업화하여 시스템화함으로써 실현되는 것이다. 그러므로 가족 경영에서는 가족노동력을 주체로 한 경영에서의 한계 규모를 감안한 수익성 추구가 바람직하다.</p>
<div class="modal-sub" style="margin:14px 0 6px;">분업화와 외부화</div>
<p class="rb-p">오늘날의 축산 경영에서는 가축뿐 아니라 축사, 사료 생산을 위한 기계 등 다양한 자본 장비를 필요로 하는 것이 큰 제약이 되고 있다. 또 생산 자본인 번식우의 사양 관리뿐 아니라 생산물인 송아지의 관리 등에 관련된 노동에 대해서도 다두화가 진행될수록 새로운 제약 요인이 된다. 따라서 오늘날의 번식 경영에서는 자기 완결형 경영이 아니라 부분적으로 작업을 외부화한 분업형 경영을 전개하는 것도 검토하지 않으면 안 된다.</p>
<p class="rb-p">캐틀 센터는 번식 농가가 위탁한 출생 송아지를 육성함으로써 번식 암소의 사양 관리에 경영 내 노동을 투하하는 것을 목적으로 한다. 나아가 분만 후에 번식 암소와 송아지를 세트로 대규모 캐틀 브리딩 스테이션에 위탁하고, 센터가 송아지 육성을 담당하여 지역 내 비육 농가에 비육 밑소로 공급하는 동시에 번식 암소의 AI를 행하고 임신을 확인하여 번식 농가로 돌려보내는 지역 내 분업 시스템도 전개되기 시작하고 있다. 이에 따라 노동이 경감됨으로써 증축 없이 번식 암소의 증두가 가능해지고, 집중 관리 방식에 의한 지역 분만 회전율의 향상, 지역 내 일관 체제의 확립, 번식 장애우의 유효 활용이 가능해지는 등의 효과가 나타난다.</p>
<p class="rb-p">생산력과 수익성을 높이는 데 있어 번식 암소의 분만 간격 단축이나 송아지의 사고율 저감, 노동 부담의 경감을 꾀하는 것이 중요하다. IoT나 AI(인공지능) 등의 신기술을 활용한 발정 발견 장치(발정 징후가 나타나면 자동으로 PC나 스마트폰에 통지되어 감시 업무가 경감되고 수태율 향상이 기대된다)나, 분만이 시작되면 자동으로 연락이 오는 기기 등에 의해 장시간의 감시 업무가 경감되어 사고율 저감 및 노동 부담 감소로 이어지고 있다. 또 송아지가 원할 때 자동으로 포유할 수 있는 포유 로봇의 도입으로 확실한 생산력 향상이 기대된다.</p>
<p class="rb-p">그 밖에도 자급사료 생산에 의한 비용 절감 방책으로서 사료 생산을 외부 컨트랙터에 위탁하는 외부화·분업화가 진행되어 왔다. 사료 생산 기계를 한 벌 갖추어 자급하기보다 자작지를 유효하게 활용하여 사료 생산을 외주하는 시도는 어느 정도 큰 규모의 농가에게 유효하다.</p>
<p class="rb-p"><span style="color:var(--ink-soft)">(福田晋)</span></p>
<p class="rb-p" style="color:var(--ink-soft);font-size:13px">일본송아지 6-5 생산성과 경영, 日向貴久·福田晋 (유용우 낙농 경영 부분은 표 6-5-3만 발췌).</p>

/* 박스 2열 배치: 순서대로 앞 절반(높이 기준)은 왼쪽, 나머지는 오른쪽 */
function vetBoxLayout(root){
  root.querySelectorAll('.rb-boxes').forEach(function(wrap){
    var boxes=[].slice.call(wrap.querySelectorAll(':scope > .bx, :scope > .col > .bx'));
    if(!boxes.length) return;
    wrap.innerHTML='';
    boxes.forEach(function(b){ wrap.appendChild(b); }); return;
    var left=document.createElement('div'), right=document.createElement('div');
    left.className='col'; right.className='col';
    wrap.appendChild(left); wrap.appendChild(right);
    boxes.forEach(function(b){ left.appendChild(b); });
    var hs=boxes.map(function(b){ return b.offsetHeight+6; });
    var total=hs.reduce(function(a,c){ return a+c; },0), acc=0, best=1, bestDiff=Infinity;
    for(var k=1;k<boxes.length;k++){ acc+=hs[k-1]; var d=Math.abs(acc-(total-acc)); if(d<bestDiff){ bestDiff=d; best=k; } }
    boxes.forEach(function(b,k){ if(k>=best) right.appendChild(b); });
  });
}

window.addEventListener('resize', function(){ clearTimeout(_vetRelayoutT); _vetRelayoutT=setTimeout(function(){ var r=document.querySelector('#main .namu-doc'); if(r) vetBoxLayout(r); }, 150); });

}

function vetApplyOverrides(root){

    var html=VETEDITS[key]; if(html==null) return;

/* 강조(형광펜): 본문에서 드래그한 구절을 저장해 두었다가 다시 표시한다. 주인 로그인 상태에서만 추가·해제 가능 */
var HLSEL=null, _hlTimer=null;

function vetHlWrap(block, start, end, idx){
  var walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  var pos=0, nodes=[], n;
  while((n=walker.nextNode())){
    var s=pos, e=pos+n.nodeValue.length;
    if(e>start && s<end) nodes.push({n:n, from:Math.max(start,s)-s, to:Math.min(end,e)-s});
    pos=e; if(pos>=end) break;
  }
  nodes.forEach(function(o){
    var mid=o.from>0 ? o.n.splitText(o.from) : o.n;
    if(o.to-o.from < mid.nodeValue.length) mid.splitText(o.to-o.from);
    var m=document.createElement('mark'); m.className='hl'; m.dataset.hl=idx;
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  return nodes.length>0;
}
function vetHlApplyOne(root, it, idx){
  var blocks=Array.prototype.slice.call(root.querySelectorAll(HL_BLOCK));
  var pre=it.b||'', needle=pre+it.t+(it.a||'');
  for(var i=0;i<blocks.length;i++){
    var k=blocks[i].textContent.indexOf(needle);
    if(k>=0){ var st=k+pre.length; return vetHlWrap(blocks[i], st, st+it.t.length, idx); }
  }
  var hit=null, cnt=0;
  blocks.forEach(function(b){
    var tx=b.textContent, p=tx.indexOf(it.t);
    while(p>=0){ cnt++; hit={b:b,p:p}; p=tx.indexOf(it.t,p+1); }
  });
  if(cnt===1) return vetHlWrap(hit.b, hit.p, hit.p+it.t.length, idx);

}

  vetHlList(tab).forEach(function(it,i){ vetHlApplyOne(root,it,i); });

function vetHlSelInfo(){

  var s0=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  var e0=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer;
  var bs=(s0 && s0.closest) ? s0.closest(HL_BLOCK) : null, be=(e0 && e0.closest) ? e0.closest(HL_BLOCK) : null;

  vetHlRefresh(document.querySelector('#main .namu-doc'), tab);

  HLSEL=null; var b=document.getElementById('hlBar'); if(b) b.style.display='none';
}
function vetHlInit(){
  document.addEventListener('selectionchange', function(){
    var info=vetHlSelInfo();
    if(info) vetHlShow(info); else if(HLSEL) vetHlHideSoon(1500);
  });
  document.addEventListener('click', function(e){
    var m=e.target.closest && e.target.closest('mark.hl'); if(!m) return;
    if(!((typeof isAdmin==='function') && isAdmin()) || document.querySelector('.vet-edit-box')) return;
    var s=window.getSelection(); if(s && !s.isCollapsed) return;
    vetHlShow({t:'', b:'', a:'', marks:[+m.dataset.hl]}); vetHlHideSoon(4000);
  });
}
function vetEnterEdit(h){
  if(!((typeof isAdmin==='function') && isAdmin())) return;
  if(document.querySelector('.vet-edit-box')) return;
  var nodes=vetSecNodes(h); if(!nodes.length) return;
  var parent=nodes[0].parentNode;
  var box=document.createElement('div');
  box.className='vet-edit-box'; box.setAttribute('contenteditable','true');
  parent.insertBefore(box, nodes[0]);
  nodes.forEach(function(n){ box.appendChild(n); });
  var bar=document.createElement('div');
  bar.className='vet-edit-bar';
  bar.innerHTML='<button type="button" class="vet-eb-save">저장</button><button type="button" class="vet-eb-cancel">취소</button>';
  box.insertAdjacentElement('afterend', bar);
  box.focus();
  bar.querySelector('.vet-eb-save').addEventListener('click', async function(){
    const oldHtml=VETEDITS[h.dataset.vkey];
    VETEDITS[h.dataset.vkey]=box.innerHTML;
    this.textContent='저장 중…'; this.disabled=true;
    const saved = await vetEditsSave();
    if(saved) renderVet();
    else { if(oldHtml===undefined) delete VETEDITS[h.dataset.vkey]; else VETEDITS[h.dataset.vkey]=oldHtml; this.textContent='저장'; this.disabled=false; }
  });
  bar.querySelector('.vet-eb-cancel').addEventListener('click', function(){ renderVet(); });
}

/* 풀정보: 섹션 제목 + 카드를 접이식(아코디언)으로 묶기 — 모바일에서 목차부터 보이게 */
function groupGrassSections(root){
  root = root || document.getElementById('main');
  if(!root) return;
  const titles = [...root.querySelectorAll('.grass-section-title')];
  titles.forEach(title => {
    const details = document.createElement('details');
    details.className = 'grass-acc';
    details.open = false;          // 기본 접힘 → 목차처럼 보임
    const summary = document.createElement('summary');
    summary.className = 'grass-acc-sum';
    summary.innerHTML = title.innerHTML;
    details.appendChild(summary);
    title.replaceWith(details);
    let node = details.nextElementSibling;
    while(node && !node.classList.contains('grass-section-title') && !node.classList.contains('modal-actions')){
      const next = node.nextElementSibling;
      details.appendChild(node);
      node = next;
    }
  });
}


const ENTRY_PASSWORD = '0523';

  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0b1f1d;display:flex;align-items:center;justify-content:center;padding:24px;';
  ov.innerHTML = `

      <div style="margin-bottom:8px;"><svg viewBox="0 0 32 32" width="44" height="44" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="30" height="30" rx="8" style="fill:var(--primary)"/><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6.5 L16 11 L21 6.5"/><line x1="16" y1="10.5" x2="16" y2="26.5"/><path d="M16 12.6c2.6 0 2.6 2.4 0 2.4s-2.6 2.4 0 2.4 2.6 2.4 0 2.4-2.6 2.4 0 2.4 2.6 2.4 0 2.4"/></g><circle cx="16" cy="26.6" r="1.3" fill="#fff"/></svg></div>
      <div style="font-size:18px;font-weight:800;margin-bottom:4px;">번식학</div>
      <div style="font-size:12.5px;color:#7fc8bf;margin-bottom:20px;">열람하려면 비밀번호를 입력하세요</div>
      <input id="entry-pw" type="password" inputmode="numeric" placeholder="비밀번호"
        style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;text-align:center;letter-spacing:.3em;
        border:1px solid #1f5249;border-radius:11px;background:#0f2a27;color:#fff;outline:none;">
      <div id="entry-err" style="height:16px;font-size:11.5px;color:#ff8f8f;margin:8px 0 4px;"></div>
      <button id="entry-btn" style="width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:11px;
        background:#00A69C;color:#fff;cursor:pointer;">입장</button>
    </div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector('#entry-pw');
  const err = ov.querySelector('#entry-err');
  const tryPass = ()=>{
    if(inp.value === ENTRY_PASSWORD){
      sessionStorage.setItem('app-entered','1');
      ov.remove();
      onPass();
    } else {
      err.textContent = '비밀번호가 맞지 않아요.';
      inp.value=''; inp.focus();
    }
  };
  ov.querySelector('#entry-btn').addEventListener('click', tryPass);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryPass(); });
  setTimeout(()=>inp.focus(), 50);
}
</script>
