<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>전이기 대사 개요 — 개념<span class="hang">대사병(생산병)은 사료로 들어오는 양분과 생산으로 나가는 양의 불균형으로 생긴다. 유열·저칼륨혈증·저마그네슘혈증·케토시스·지방간이 여기에 속한다.</span><span class="hang">젖소에서 전체 질병 발생은 분만 직전부터 급증해 분만 당일 정점을 찍고 비유 7일째까지 빠르게 줄어든다. 분만 후 7일이 이후 생산·번식·폐사를 좌우하는 결정적 시기다.</span><span class="hang">전이기는 대개 분만 전 3주부터 분만 후 3주까지로 본다. 분만 후 첫 달에 젖소 질병의 약 75%가 생긴다는 기술이 있다(Periparturient).</span><span class="hang">분만 전후 질병은 대부분 건유기 사양·관리에서 비롯된다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>건물섭취량과 음의 에너지 균형(NEB)<span class="hang">건물섭취량은 임신 말기부터 줄기 시작해 분만 당일 최저가 되고, 분만 후 다시 늘지만 최대 섭취량은 분만 후 8~10주(넓게 8~22주)에야 도달한다. 반면 유량은 5~7주에 정점이다.</span><span class="hang">분만 전 마지막 14일 동안 섭취량이 초산·2산우는 25%, 3산 이상은 52%까지 줄 수 있다.</span><span class="hang">섭취량 감소와 내분비 변화로 혈중 NEFA가 오르고, NEFA가 간에 과도하게 들어가면 케토시스·지방간이 생긴다. 분만 전 마지막 7일의 NEFA 상승은 케토시스·제4위 변위·후산정체 증가와 관련되지만 유열과는 관련이 없다.</span><span class="hang">분만 시점에 포도당 수요는 약 3배, 아미노산 2배, 지방산 약 5배, 칼슘 요구량은 분만 당일 약 4배로 늘어난다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>전이기 면역억제와 비타민E<span class="hang">분만 전 약 3주부터 분만 후 3주까지 호중구 이동·부착 기능이 떨어지는 면역억제가 있다. 코르티솔 상승, NEFA·BHB 상승이 관여한다.</span><span class="hang">분만 1주 전 혈청 알파토코페롤이 낮은 소(한계 상태)에서만 비타민E 3000 IU 피하주사가 후산정체를 줄였고, 충분한 소에서는 효과가 없었다. 초산우가 가장 이득을 봤다.</span><span class="hang">분만 전 마지막 주 알파토코페롤 1 µg/mL 증가마다 후산정체 위험이 20% 줄고, NEFA 0.5 mEq/L 이상이면 후산정체 위험이 80% 늘었다. 혈청 레티놀 100 ng/mL 증가는 비유 초기 임상형 유방염 위험 60% 감소와 관련됐다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>전이기 관리의 일반 원칙<span class="hang">분만 임박우 사조 폭 75 cm 확보, 분만 예정 8~10일 전 또는 분만 임박 시 새 우방으로 이동, 군 편입은 최소 주 1회 단위(새 서열 확립에 최대 1.5일)로 한다.</span><span class="hang">분만 전 2~3주 동안 잦은 우방 이동을 피하고, 분만 전 우방에 최소 10일 머물게 하며, 초산우는 경산우와 따로 두고 사육밀도를 85% 미만으로 유지하라는 권고가 있다(Rebhun).</span><span class="hang">건유 초기에는 에너지 밀도를 낮추고(볏짚 2~4 kg/일 추가) 섭취를 늘리는 방식과, 분만 전 에너지 밀도를 높이는 방식 두 가지가 있다. 건유 전 기간 저에너지·고조사료 사료가 분만 후 NEFA·BHB를 낮춘다는 기술도 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>대사 프로파일 검사 — 표본 군과 시기<span class="hang">Constable(영국 DHHPS 기준): 건유군 분만 예정 7~10일 전, 비유 초기군 분만 후 3~14일, 비유 중기군 50~120일. 개체 하나만 검사하지 않고 군당 최소 5두, 무작위가 아니라 해당 단계의 전형적인 소를 고른다. 생산이 극단적인 소, 병든 소는 뺀다.</span><span class="hang">비유 초기군을 3일 이전에 채혈하면 분만 시 고코르티솔혈증 영향이 남고, 14일이 지나면 이미 적응해 수치가 정상으로 돌아온 마르고 생산 낮은 소를 놓친다. 28일에 채혈하면 이상을 못 찾을 수 있다.</span><span class="hang">Periparturient 책의 Compton 프로파일은 건유(분만 30일 전)·비유 초기(10~20일)·비유 중기(50~120일) 세 군에서 최소 7두를 표본으로 든다. 두 책의 시기가 다르다.</span><span class="hang">군 크기 권고는 미국 12두(75% 신뢰구간, 10% 초과 검출 기준), 영국 7~10두로 서로 다르고 아직 조정되지 않았다. 분만 4~14일 사이 12두를 꾸준히 표본하려면 착유우 428두 이상이 필요하다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>채혈 시기와 사료<span class="hang">큰 사료 변경 후 2주(조사료 종류 변경, 방목 시작, 사일리지·농후사료 도입), 기존 사료 증량 같은 작은 변경 후 7~10일이 지난 뒤 채혈한다.</span><span class="hang">착유 때 농후사료를 몰아 주는 경우 착유 후 2시간 지나 채혈한다. TMR을 하루 종일 먹는 경우는 덜 중요하다.</span><span class="hang">TMR 1회 급여 후 5시간 채혈 권고가 있으나, 옥수수 사일리지 위주 사료에서는 이때 BHB가 높아 논리적이지 않다. 일관성을 위해 아침 급여 직전 또는 급여 시점 채혈을 권한다(이때 NEFA는 하루 중 최고다).</span><span class="hang">새 분만철 시작 때, 새 사료 도입 직후에 검사를 계획한다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>에너지 지표 — NEFA·BHB·포도당<span class="hang">분만 전 마지막 주에는 혈장 NEFA, 분만 후 1~2주에는 혈청 BHB와 뇨 아세토아세트산을 재는 것이 전략적이다.</span><span class="hang">NEFA는 분만 3일 전부터 올라 비유 9일까지 높다. 분만 2~14일 전 NEFA 0.4 mEq/L 초과는 제4위 변위 4배, 잠재성 케토시스 2~3배, 후산정체 1.5배 위험이다. 분만 0~6일 NEFA 0.5 mEq/L 이상이면 좌측 변위 3.6배, 분만 3~35일 전 0.3 mEq/L 초과는 2배다.</span><span class="hang">BHB는 분만 후 급상승해 비유 9일 전후 정점이다. 혈장 BHB 1.0·1.2·1.4 mmol/L(9.7·11.7·14.4 mg/dL)가 흔한 절단값이다. 초과 시 제4위 변위 4~8배, 임상형 케토시스 3배, 60일 무발정 50% 증가, 첫 수정 임신율 50% 감소다. 분만 1주 BHB 1.2 이상·1.4 이상은 좌측 변위 위험이 각각 3배·4배다.</span><span class="hang">경보 수준: BHB 1.4 mmol/L 초과 비율 10% 초과, NEFA 0.4 mmol/L 초과 비율 10% 초과(Constable). Bovine Medicine은 분만 전 2주 NEFA 0.400 mEq/L 초과가 10%, 분만 후 30일 내 BHB 1000 µmol/L 초과가 10%이면 조치하라고 하며 최소 12두를 표본으로 든다.</span><span class="hang">포도당은 엄격히 조절되어 민감도는 낮지만, 낮으면 음의 에너지 균형의 확실하고 특이적인 지표다. 비유 2주째 혈당 45 mg/dL(2.4 mmol/L) 미만이면 잠재성 케토시스를 시사한다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>단백·간·광물질 지표<span class="hang">혈장 요소질소 19 mg/dL 초과는 단백 과잉, 10 mg/dL 미만은 단백 부족을 시사한다. MUN 목표는 8.5~11.5 mg/dL(과거 12~16 mg/dL)이며 아침에 가장 높다. 단일 MUN 측정은 수태 예측 가치가 낮다.</span><span class="hang">알부민 최소 평균치: 건유우 2.9~3.1, 분만 직후 2.7~2.9, 비유 후기 3.0~3.2 g/dL. 분만 후 첫 4주에 임상적 유용성이 가장 크다.</span><span class="hang">AST 162 U/L 초과는 간지방증을 시사하지만 분만 전후 근육 손상으로도 오르므로 분만 시점에는 특이적이지 않다. 혈장 NEFA:콜레스테롤 몰비가 간지방 정도의 유용한 지표다. 담즙산은 쓸모없다.</span><span class="hang">칼슘은 엄격히 조절되어 섭취 균형 지표로는 둔하지만, 분만 후 24시간 이내 경산우 혈중 칼슘은 유열 예방 프로그램 평가에 쓴다. 나트륨 135 mmol/L까지 낮으면 이식증·다음다뇨가 올 수 있다. 혈청 칼륨은 결핍을 잘 반영하지 않는다.</span><span class="hang">적혈구용적은 건유우에서 가장 높고 비유 정점에서 가장 낮으므로 비유 단계별로 묶어 해석한다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>대사 프로파일 최적치(영국 DHHPS)<table class="bxt"><tr><th>항목</th><th class="c">최적 범위</th></tr><tr><td>BHB 착유우</td><td class="c">1.0 mmol/L 미만</td></tr><tr><td>BHB 건유우</td><td class="c">0.6 mmol/L 미만</td></tr><tr><td>혈장 포도당</td><td class="c">3.0 mmol/L 초과</td></tr><tr><td>NEFA 착유우</td><td class="c">0.7 mmol/L 미만</td></tr><tr><td>NEFA 건유우</td><td class="c">0.4 mmol/L 미만</td></tr><tr><td>요소질소</td><td class="c">1.7~5.0 mmol/L</td></tr><tr><td>알부민</td><td class="c">30 g/L 초과</td></tr><tr><td>글로불린</td><td class="c">50 g/L 미만</td></tr><tr><td>마그네슘</td><td class="c">0.8~1.3 mmol/L</td></tr><tr><td>무기인</td><td class="c">1.4~2.5 mmol/L</td></tr><tr><td>구리</td><td class="c">9.4~19.0 µmol/L</td></tr><tr><td>T4(요오드)</td><td class="c">20 nmol/L 초과</td></tr><tr><td>GSH-Px(셀레늄)</td><td class="c">50 U/g Hb 초과</td></tr></table><span class="hang">본문에는 건유우 NEFA 0.5 미만, 마그네슘 0.7 초과, 인 1.3 초과, 구리 9.2 초과로 표와 조금 다르게 적혀 있다.</span><span class="hang">이 프로그램 자료에서 비유 초기(10~20일)군은 65~78%가 에너지 지표 하나 이상이 최적 범위를 벗어났고, 가장 흔한 소견은 같은 소에서 BHB 상승과 포도당 저하였다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>소변 검사와 실시간 감시<span class="hang">회음부 자극으로 소변 채취는 75~90% 성공한다. 앉아 있던 소를 일으키면 성공률이 높고, 꼬리를 잡지 않는다.</span><span class="hang">소변 pH 6.3~7.6 범위에서는 시험지로 잰 pH가 순산배설량 변화를 정확히 반영해 산염기 평가에 쓸 만하다.</span><span class="hang">일일 유량(이전 성적·동료 대비)이 건물섭취량과 건강의 가장 민감한 저비용 지표이고, 활동량계·반추 감시기도 쓰인다.</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>전이기 건강 지표 목표(Bovine Medicine, 분만 14일 내 발생률)<table class="bxt"><tr><th>지표</th><th class="c">목표</th><th class="c">경보</th></tr><tr><td>유열</td><td class="c">1%(5세 이상 2%)</td><td class="c">3%</td></tr><tr><td>임상형 케토시스</td><td class="c">1% 미만</td><td class="c">2%</td></tr><tr><td>임신독혈증</td><td class="c">0%</td><td class="c">1두</td></tr><tr><td>제4위 변위</td><td class="c">1% 미만</td><td class="c">2%</td></tr><tr><td>저마그네슘혈증</td><td class="c">0%</td><td class="c">1두</td></tr><tr><td>후산정체(12시간 초과)</td><td class="c">3% 미만</td><td class="c">6% 초과</td></tr><tr><td>21일 후 자궁감염</td><td class="c">5% 미만</td><td class="c">10% 초과</td></tr></table><span class="hang">임신독혈증 1두 발생은 전이기 사료·관리 전면 재검토의 신호다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>유열(milk fever, 분만성 부전마비) — 원인과 기전<span class="hang">기본 장애는 세포외액 이온화 칼슘 저하다. 비유 개시로 유선 칼슘 유출이 장 흡수·골 동원을 앞지르며 생긴다. 초유 kg당 약 2.3 g, 우유 2 g의 칼슘이 나가므로 10 kg만 짜도 성우 세포외액 칼슘 전량에 해당한다.</span><span class="hang">임신 말기 칼슘 요구량은 약 30 g/일이지만 분만 후에는 30 g 이상이 추가로 필요하다. 대부분의 소는 PTH와 1,25(OH)2D 증가로 48시간 안에 적응한다.</span><span class="hang">대사성 알칼리증(고칼륨 사료)은 PTH 수용체 반응을 떨어뜨려 골 흡수와 신장의 1,25(OH)2D 생산을 방해한다. 저마그네슘혈증은 PTH 분비와 조직 감수성을 모두 낮춘다.</span><span class="hang">유열우 대부분은 PTH·1,25(OH)2D 분비가 정상이다. 다만 치료 후 재발하는 약 20%는 1,25(OH)2D 생산이 비재발우의 절반 수준이다.</span><span class="hang">이온화 칼슘 1.0 mmol/L에서 이미 반추 운동이 줄고, 0.9 mmol/L 미만에서 섭취량이 줄며, 0.6 mmol/L에서 섭취가 거의 0이 된다(실험).</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>역학과 위험요인<span class="hang">고능력 경산 젖소, 3~7산에 많고 초산·2산은 드물다. 임상형 발생률 미국 약 5%, 보고상 4~9% 또는 5~10%, 개별 농장에서 고위험우의 25~30%까지 오른다.</span><span class="hang">대부분 분만 후 48시간 안에 생기고 위험 기간은 분만 후 10일까지다. 분만 직전·분만 중 자궁무력으로 2기 진통이 멈추기도 하고, 8일 이후 발생도 20%까지 있다. 비유 중기 발생은 저마그네슘혈증이 주원인으로 본다.</span><span class="hang">저지(Jersey)·스웨덴 적백종·노르웨이 적색종이 홀스타인보다 많다. 같은 소에서 반복되며, 유전율은 무시할 수준(0~12.8%)이다.</span><span class="hang">BCS 4/5 초과는 위험비 4.3이다. 아미노글리코사이드 정맥주사, 발정, 48시간 섭취 감소도 유발 요인이다. 육우는 겨울철 저질 조사료 급여 시 개별 또는 집단 발생한다.</span><span class="hang">사료 요인: 건유기 칼슘 100 g/일 초과, 칼륨 건물 2% 초과, 마그네슘 결핍, 인 80 g/일 초과(또는 건물 0.5% 초과)가 위험을 높인다. 메타분석에서는 사료 황 함량과 DCAD가 가장 강한 관련 인자였다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>잠재성 저칼슘혈증<span class="hang">총칼슘 1.4~2.0 mmol/L(5.5~8.0 mg/dL)를 잠재성으로 정의한다. 경산 분만우의 약 50%, 보고 범위 33~50%다. NAHMS 조사에서는 초산 25%, 경산 41~54%였다.</span><span class="hang">반추위 운동·식욕을 떨어뜨리고 음의 에너지 균형을 악화시키며, 난산·자궁탈·후산정체·유방염·케토시스·제4위 변위·면역억제의 관문 질환으로 본다. 좌측 변위 위험비 2.3~3.4, 유방염 위험비 8.1(대장균성 9.0), 케토시스 1.3~8.9다.</span><span class="hang">군 단위 평가는 분만 후 12~24시간 전 산차 소를 채혈해 임상+잠재성 합계 30%를 경보 수준으로 삼는다(Rebhun). Bovine Medicine은 분만 12~24시간 총칼슘 1.8 mmol/L 미만 또는 이온화 칼슘 0.9 mmol/L 미만이 20% 넘으면 우려로 본다.</span><span class="hang">분만 시 칼슘을 일률적으로 투여하는 농장에서는 실제 발생률이 가려진다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>임상증상 — 3단계<span class="hang">1기(기립): 짧은 흥분·과민·떨림, 머리 흔들기, 혀 내밀기, 이갈이, 경직된 보행, 쉽게 넘어짐. 체온 정상~약간 상승, 피부 차가움, 반추 정지, 변 적음.</span><span class="hang">2기(흉골 와위): 의식 저하, 목을 옆으로 굽히거나 머리를 옆구리에 붙인다. 체온 36~38℃, 심음 약화·심박 약 80회, 경정맥 충만 어려움, 반추 정지·고창, 변비, 항문 반사 소실, 동공 반사 불완전.</span><span class="hang">3기(횡와): 혼수, 완전 이완, 심음 거의 들리지 않고 심박 120회까지, 맥 촉지 불가, 고창. 치료하지 않으면 몇 시간 안에 쇼크로 죽는다.</span><span class="hang">분만 중 발생하면 자궁경관은 완전히 열려 있고 칼슘 정맥주사로 정상 분만한다. 자궁탈은 유열의 흔한 합병증이므로 자궁탈 소는 관례적으로 칼슘 정맥주사를 한다.</span><span class="hang">1기 이후에도 경직·과민이 계속되고 심음이 크고 빠르면 저마그네슘혈증 병발을 의심한다. 젖소 유열에서 진짜 강직은 대개 없다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>진단 — 혈액 소견<span class="hang">정상 혈장 칼슘 2.1~2.6 mmol/L(8.4~10.4 mg/dL). 임상형은 2.0 mmol/L 미만, 대개 1.2 mmol/L(5 mg/dL) 미만, 0.5 mmol/L(2 mg/dL)까지 떨어진다. 유열우 평균 1.30 ± 0.30 mmol/L다.</span><span class="hang">Rebhun: 6~7 mg/dL면 서 있으나 쇠약·고창·식욕부진, 5 mg/dL 이하면 대부분 눕고, 4 mg/dL 미만이면 대부분 혼수다. 이온화 칼슘 0.7~0.8 mmol/L 미만이면 대개 기립 불능이다.</span><table class="bxt"><tr><th>정맥 전혈 이온화 칼슘</th><th class="c">mmol/L</th></tr><tr><td>정상</td><td class="c">1.06~1.26</td></tr><tr><td>경도</td><td class="c">0.80~1.05</td></tr><tr><td>중등도</td><td class="c">0.50~0.79</td></tr><tr><td>중증</td><td class="c">0.50 미만</td></tr></table><span class="hang">혈청 마그네슘은 대개 1.65~2.06 mmol/L로 약간 높고, 무기인은 0.48~0.97 mmol/L(1.5~3.0 mg/dL)로 낮다. 장기 경과 시 고혈당이 온다. 와위가 길어지면 CK·AST가 오른다.</span><span class="hang">알부민이 낮으면 총칼슘이 가성으로 낮게 나온다. 알부민 4 g/dL 기준 1 g/dL 낮을 때마다 0.8 mg/dL를 더해 보정하라는 기술이 있다(Periparturient).</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>감별진단<span class="hang">저마그네슘혈증: 과민·강직·빈맥·경련, 혈청 마그네슘 1.2 mg/dL(0.5 mmol/L) 미만, 치료 반응이 칼슘보다 느리다(약 30분).</span><span class="hang">급성 저칼륨혈증: 이소플루프레돈 치료 후, 칼륨 2.5 mEq/L 미만, 머리를 가슴이 아니라 바닥에 둔 이완성 마비로 보툴리눔증과 닮았다.</span><span class="hang">독혈증(대장균성 유방염, 패혈성 자궁염, 위·자궁 천공 복막염, 곡류 과식, 자궁 파열): 심박 100회 이상, 칼슘 7~8 mg/dL까지 낮을 수 있으나 칼슘 투여 반응이 나쁘고 정맥주사 중 급사할 수 있다.</span><span class="hang">흡인성 폐렴: 3기 유열이나 잘못된 강제투약 후. 이상 폐음은 이튿날에야 들릴 수 있다.</span><span class="hang">골반·후지 손상(분만마비, 고관절 탈구, 비복근 파열), 허혈성 근괴사, 기립불능우 증후군, 지방간(비만우, 케톤뇨).</span><span class="hang">분만 후 와위우의 약 25%는 저칼슘혈증이 아닌 독혈증·외상이 주원인이었다(Constable 경험).</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>치료 — 칼슘 정맥주사<span class="hang">1기 서 있을 때 치료하는 것이 이상적이다. 흉골 와위 4시간 넘으면 합병증이 생긴다. 와위 상태로 처음 치료한 소의 기립불능 13%·폐사 2%, 횡와 상태는 기립불능 37%·폐사 12%, 서 있던 소는 0%였다.</span><span class="hang">대부분 칼슘 8~10 g으로 치료된다. 표준은 23% 칼슘보로글루코네이트 500 mL(칼슘 10.7 g)를 심장 청진하며 천천히 정맥주사한다. 계산상 결손은 4 g이지만 우유 손실 때문에 더 준다.</span><table class="bxt"><tr><th>항목</th><th class="c">값</th></tr><tr><td>칼슘보로글루코네이트 칼슘 함량</td><td class="c">8.3%</td></tr><tr><td>표준 투여 시간</td><td class="c">약 15분(최소 12~15분)</td></tr><tr><td>최대 안전 속도</td><td class="c">이온화 Ca 0.07 mEq/kg/분</td></tr><tr><td>= 23% 보로글루코네이트</td><td class="c">0.065 mL/kg/분</td></tr><tr><td>600 kg 소</td><td class="c">39 mL/분</td></tr><tr><td>Goff(LAIM) 권고</td><td class="c">체중 100 lb당 Ca 1 g, 1 g/분</td></tr></table><span class="hang">처방 요약(Constable): 칼슘글루코네이트·보로글루코네이트 칼슘 8~12 g 1회 정맥 또는 피하, 염화칼슘 8~12 g 정맥.</span><span class="hang">투여 직후 혈중 칼슘은 최대 6 mmol/L(24 mg/dL)까지 올랐다가 수 시간에 걸쳐 내려가며 직접 효과는 6~8시간이다. 이 사이 위장 운동·섭취가 회복되어 장 흡수로 유지된다. 혈중 칼슘이 28 mg/dL(7 mM)을 넘으면 심장이 수축기에 멎는다(LAIM).</span><span class="hang">서맥은 정상 반응이다. 부정맥이나 뚜렷한 빈맥이 나타나면 중단하고 나머지는 피하로 준다. 용액은 체온으로 데워 쓴다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>정맥주사 반응과 독성<span class="hang">좋은 반응: 트림, 옆구리부터 전신 근육떨림, 맥이 느려지고 강해짐, 심음 증강, 코 발한, 단단하고 점액 덮인 변 배출. 배뇨는 대개 기립 후다.</span><span class="hang">약 75%가 2시간 안에 회복, 10%는 다른 병으로 회복이 복잡해지고, 15%는 죽거나 도태된다. 1회 치료로 회복한 소의 25~30%가 재발한다.</span><span class="hang">과량·과속 투여, 반복 투여, 감수성 증가(대장균성 유방염·독성 자궁염, 중증 케토시스·지방간, 저칼륨혈증)에서 독성이 온다. 독혈증 소에서는 심박이 160회까지 오르고 호흡곤란·떨림 후 몇 분 안에 죽는다. 이런 소는 피하 또는 아주 천천히 정맥 투여한다.</span><span class="hang">농가가 피하주사를 여러 번 한 뒤 정맥주사하면 순환 회복으로 피하 칼슘이 한꺼번에 흡수되어 독성이 온다. 흥분·공포, 열사병 병발도 위험하며 체온을 39.5℃ 아래로 낮춘 뒤 투여한다. 아트로핀이 부정맥을 없앨 수 있다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>피하·경구 칼슘<span class="hang">피하: 순환 저하 시 흡수가 예측 불가하고, 중증 저칼슘혈증·탈수에서는 효과가 늦다. 와위우에 피하 단독은 부적절하다. 부위당 칼슘 1~1.5 g(용액 50~75 mL)으로 제한하고(LAIM은 부위당 약 50 mL), 염화칼슘과 포도당 함유 용액은 피하 금지다. 500 mL를 10곳에 나눠 주면 30분 안에 15% 이상 오르고 6시간 안에 기저치로 돌아온다.</span><span class="hang">경구: 염화칼슘(50 g Ca, 30분 안에 상승, 6시간 이상 유지, 부식성·반복 시 대사성 산증)과 칼슘프로피오네이트(부피 크고 느리지만 덜 자극적, 산염기 영향 없음)가 생체이용성이 충분하다. 처방: 칼슘 50 g 상당을 12시간마다 48시간 경구.</span><span class="hang">경구제는 삼킴이 정상인 소에만 쓴다. 기립불능우에게 강제투약하면 흡인성 폐렴으로 죽을 수 있다. 염화칼슘 50 g 경구는 칼슘 정맥 4 g과 비슷하다(LAIM). 칼슘 가용성 경구 LD50은 약 200 g이다.</span><span class="hang">Rebhun: 칼슘프로피오네이트 50~90 g을 단독 또는 정맥 치료 보조로 쓰며, 경구 치료의 재발률·반응은 정맥 치료와 견줄 만하다는 근거가 있다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>재발과 불응<span class="hang">재발은 대개 이전 치료 후 48시간 안에(LAIM은 흔히 약 24시간 뒤) 생긴다. 노령우에서 불완전 반응이 많다.</span><span class="hang">정맥 500 mL에 피하 500 mL를 추가하면 재발률이 뚜렷이 줄었다는 기술(Constable)과, 정맥 직후 피하 1병은 치료 창을 늘리지 못하고 재발을 막지 못하므로 피하·경구 칼슘은 정맥 치료 12~24시간 뒤 줘야 효과적이라는 기술(LAIM)이 상반된다. 정맥 치료 후 1~2일 경구 칼슘 보충을 권한다(Constable).</span><span class="hang">반응이 없으면 6~12시간 간격으로 재방문해 진단을 확인하고, 다른 원인이 없으면 최대 3회까지 반복한다. 그 이상은 효과가 드물다.</span><span class="hang">재발성 유열(노령 고능력우, 지방간 병발 많음): 가치 있는 소는 칼슘 지속 점적과 경구 칼슘으로 이온화 칼슘을 1.2~1.5 mmol/L로 유지하고, 비타민D 1회 근육주사를 권한다. 혈중 마그네슘이 낮으면 마그네슘도 보충한다(Rebhun).</span><span class="hang">인 투여는 혈중 인이 낮아도 도움이 된 근거가 드물고, 과량은 칼슘인산 복합체를 만들어 저칼슘혈증을 악화시킨다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>와위우 간호<span class="hang">횡와 상태로 발견된 소는 치료 전까지 흉골 와위로 세워 트림을 돕고 흡인을 막는다. 미끄러운 바닥에서는 매트나 풀밭으로 옮긴다.</span><span class="hang">몇 시간마다 좌우로 굴리고, 48시간 넘게 누워 있으면 보조 기구로 가끔 들어 올린다. 과격한 기립 유도는 피하고, 일어나려 할 때 꼬리 기부를 받쳐 준다.</span><span class="hang">부분 착유(초기 며칠 젖을 덜 짜기)는 유선 칼슘 손실을 줄이지만 혈중 칼슘 개선 효과는 확인되지 않았다.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>예방 — 개관<span class="hang">고위험우(3산 이상)에서 발생이 10%를 넘으면 별도 예방 프로그램이 필요하다. 낮으면 분만 전후 48시간 면밀히 관찰해 1기에 치료한다. 군 문제 기준을 성우 15% 초과로 보고, 잘 관리된 농장은 4% 이하(우수 농장 약 2%)라는 기술도 있다(Rebhun).</span><span class="hang">방법: 건유기 흡수 가능 칼슘 감소, 임신 말기 경중등도 대사성 산증 유도(DCAD), 비타민D 보충, 분만 전후 경구 칼슘, 분만 전후 비경구 칼슘, 부분 착유.</span><span class="hang">건유기를 전기(far-off)와 분만 전 2~3주(close-up)로 나누고, 분만 전 우군의 광물질을 정확한 양으로 TMR이나 곡류 혼합물에 넣어 급여한다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>예방 — 저칼슘 사료와 칼슘 결합제<span class="hang">분만 전 2~3주 칼슘 20 g/두/일 미만(흡수 가능 칼슘 약 12 g 미만)으로 음의 칼슘 균형을 만들어 PTH·1,25(OH)2D를 미리 활성화한다. 최소 14일 급여해야 한다. 알팔파 위주 농장에서는 달성이 어렵고, 목초 건초로 바꾸면 칼륨을 확인해야 한다.</span><span class="hang">제올라이트A(규산알루미늄나트륨): 펠릿 1.4 kg(순수 700 g)/일을 분만 전 2주 급여하면 칼슘이 오르지만 건물섭취의 10% 이상에 해당하고 섭취량이 20% 넘게 줄어 분만 후 BHB가 오른다. 순수 250 g으로 줄이면 섭취 감소가 덜하다. 처방: 250~500 g/두/일, 분만 전 최소 2주. 인·마그네슘도 결합한다.</span><span class="hang">DCAD 사료는 저칼슘 사료나 칼슘 결합제와 함께 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>예방 — DCAD(사료 양이온-음이온 차)<span class="hang">DCAD = (Na + K) − (Cl + S), mEq/kg 건물. 백분율로는 mEq/100 g = (%Na ÷ 0.023 + %K ÷ 0.039) − (%Cl ÷ 0.0355 + %S ÷ 0.016).</span><table class="bxt"><tr><th>원소</th><th class="c">건물 %→mEq/kg 곱수</th></tr><tr><td>나트륨</td><td class="c">434.98</td></tr><tr><td>칼륨</td><td class="c">255.74</td></tr><tr><td>염소</td><td class="c">282.06</td></tr><tr><td>황</td><td class="c">623.75</td></tr><tr><td>칼슘</td><td class="c">499.00</td></tr><tr><td>마그네슘</td><td class="c">822.64</td></tr></table><span class="hang">목표는 −100~−150 mEq/kg 건물(−10~−15 mEq/100 g), 분만 전 2~3주 이상(최소 2주, 최대 효과에 5일 섭취 필요). 일반 건유 사료는 +100~+250이다. 0 mEq/100 g까지만 낮추면 섭취량은 유지되지만 효과가 덜하다.</span><span class="hang">한 연구에서 +330.5 mEq/kg 사료는 유열 47%, −128.5 mEq/kg 사료는 0%였다.</span><span class="hang">DCAD가 +250을 넘으면 우선 저칼륨 조사료로 바꿔 양이온을 줄인 뒤 음이온을 더한다. Bovine Medicine 경험칙: DCAD 0 미만, Ca 0.4~0.6%, P 0.4% 미만, Mg 0.4% 초과, K 1.1~1.6%, Na 0.12%, S 0.4% 미만, Cl은 K보다 약 0.5% 낮게, 노출 기간 21~28일.</span><span class="hang">LAIM은 DCAD = (Na + K) − (Cl + 0.6 S)가 소변 pH·유열과 가장 잘 맞는다고 하고, DCAD +50이면 소변 pH 약 7.5, 0이면 약 7.0, −75~−125면 약 6.3이라고 한다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>음이온염과 급여 실무<span class="hang">산성화력 순서(2 Eq/일): 염산 &gt; 염화암모늄 &gt; 염화칼슘 &gt; 황산칼슘 &gt; 황산마그네슘 &gt; 황. 염화물은 황산염의 약 1.6배 산성화력이다. 황산마그네슘이 가장 기호성이 좋고 염화칼슘이 가장 나쁘다. TMR에 섞어 준다.</span><span class="hang">산성화는 급여 후 약 36시간 안에 일어나고 중단 후 36시간 안에 알칼리로 돌아온다. 음이온 300 mEq/kg 건물을 넘게 넣으면 섭취량이 준다.</span><span class="hang">염화암모늄·황산암모늄 각 100 g/두/일을 분만 21일 전부터 주자 유열이 17%에서 4%로 줄었다. 초산우는 발생이 낮아 음이온염이 필요 없다는 기술(Constable)과 초산우에게도 음이온 사료를 권하는 기술(Periparturient)이 있다.</span><span class="hang">음이온 사료에 칼슘을 늘려야 하는지는 논란이다. Constable은 사료 칼슘 0.5~1.5%가 효과를 바꾸지 않았다고 하고, Rebhun은 NRC 기준 흡수 가능 칼슘 최소 95 g/일(0.98%), 경우에 따라 150 g/일 이상이 필요하다고 한다. Goff(LAIM)는 분만 전 사료 칼슘을 비유 사료와 같은 0.8~1.1%로 맞추는 것을 선호한다.</span><span class="hang">과산성화로 섭취량이 급감하면 케토시스가 겹친다. 분만 후 음이온염 중단 며칠 뒤 지연성 반동 저칼슘혈증이 올 수 있으나 대개 임상 문제는 없다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>소변 pH 감시<span class="hang">음이온 사료 1주 후(Bovine Medicine은 3일 이상, Rebhun은 5일 후) 분만 전 우군 최소 6두의 소변 pH를 평균해 6.0~7.0이 되도록 음이온 양을 조정한다. 저지는 조금 더 낮게 잡는다.</span><span class="hang">미급여 소는 소변 pH 8~8.5, 과도하게 급여하면 5.5까지 내려간다. 7.0을 넘으면 섭취 부족, TMR 혼합 불량, 자유 급여 광물질·조사료 미보정을 의심한다.</span><span class="hang">LAIM: 소변 pH 5.3 미만은 비보상성 대사성 산증으로 섭취량이 심하게 줄어 케토시스·제4위 변위·면역억제를 부른다. pH가 7.5 아래로 내려가지 않으면 칼슘 상태 개선이 없다. 5.7과 6.3 사이에는 차이 근거가 적다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>마그네슘·인·칼륨 기준과 방목 사료 체계<span class="hang">분만 전 사료 마그네슘은 건물 약 0.4%(0.35~0.4%)로 맞추고, 염화마그네슘·황산마그네슘으로 보충한다. 칼륨 4 g당 마그네슘 1 g(최대 65 g/일)을 산화마그네슘으로 주어 농장 유열 문제를 관리한 경험이 있다(Rebhun).</span><span class="hang">분만 전 인은 0.35% 이하(Rebhun), 40 g/일 넘는 보충 금지(Constable 방목 체계 요약). 음이온 사료에서 인 0.21%가 0.44%보다 저칼슘혈증이 적었다(LAIM).</span><span class="hang">분만 전 칼륨은 1% 정도로 낮게 유지하라는 기술(Rebhun)과 1.1~1.6%(Bovine Medicine) 기술이 있다. 건유기 칼륨 150 g/일 초과는 칼슘 수준과 관계없이 유열을 늘린다.</span><span class="hang">호주·뉴질랜드 방목 체계에서는 목초 칼륨이 4% 넘고 DCAD가 +500 넘는데도 유열이 다른 나라보다 높지 않으며, 분만 전 황이 칼륨·염소보다 중요하다는 연구가 있다. 분만 전 21일 MgCl2 150 g·MgSO4 200 g·MgO 35 g/두/일과 분만 후 CaCO3 150 g/일 4일이 저칼슘혈증을 줄였다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>예방 — 비타민D와 대사물<span class="hang">비타민D3 1천만 IU 1회 근육주사를 분만 2~8일 전에 준다(처방은 3~7일 전). 체중 기준 45 kg당 1백만 IU가 더 일관된 결과를 냈다. 10일 안에 분만하지 않으면 1천만 IU를 다시 줘야 할 수 있다. Rebhun은 결정형 비타민D 1천만 IU를 분만 8일 전 정맥 또는 피하로 주고 예정일에 분만하지 않으면 반복한다고 한다.</span><span class="hang">1천만 IU 미만은 효과가 크게 떨어지고, 1700만 IU는 75%를 죽였다. 반복 투여는 연부조직 석회화를 일으키며 임신우가 더 민감하다. 주사한 소는 임상형 유열은 줄지만 분만 후 3~14일 혈중 칼슘이 더 낮아 잠재성 저칼슘혈증 위험이 늘 수 있다.</span><span class="hang">경구 비타민D2 2천만 IU/일을 분만 직전 5일(처방은 1천만~2천만 IU를 최소 7일) 준다. 분만 4일 전까지 중단되면 오히려 발생이 높아진다. 3천만 IU를 7일에 걸쳐 줘도 독성이 없었으나 2천만 IU/일 10일로 전이성 석회화가 났다.</span><span class="hang">25(OH)D3 보충이 분만 전후 건강·성적을 개선했다는 기술(Periparturient)과, 25(OH)D 투여가 저칼슘혈증 발생을 줄이지 못했다는 기술(LAIM)이 있다. 1,25(OH)2D와 유사체는 효과적이지만 비용·투여 시기·승인 문제로 실용적이지 않다.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>예방 — 분만 전후 경구·비경구 칼슘<span class="hang">염화칼슘 또는 칼슘프로피오네이트로 칼슘 40~50 g을 볼루스·겔·페이스트·액으로 분만 12~24시간 전부터 분만 후 24시간까지, 6~12시간 간격으로 준다. 처방: 칼슘 50 g 상당 12시간마다 48시간, 분만 시점부터. LAIM은 45~90 g/회를 분만 시와 12~24시간 뒤 준다고 한다.</span><span class="hang">지방 코팅 염화칼슘·황산칼슘 볼루스는 분만 2시간 이내와 다음 날 투여를 권하며, 파행우나 전 비유기 유량이 평균보다 높은 소에서 임상·경제적 이득이 있었다(Rebhun).</span><span class="hang">분만 시 칼슘 정맥·피하 예방 투여는 일시적 고칼슘혈증으로 PTH 분비를 끊어 12시간 안에 투여 전보다 낮아지고, 24~48시간에는 경구 투여군·무처치군보다 낮았다. 비경구 칼슘은 임상형 치료용으로만 쓰고 분만 시 일상 처치로 쓰지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>분만후기립불능증(downer cow) — 원인과 분류<span class="hang">유열 치료를 반복해도 일어나지 못하는 상태다. 대개 24시간 이상 원인 불명으로 누워 있는 소를 말한다. 주원인은 장기 와위로 생긴 후지 대근육 허혈성 근병증과 폐쇄신경·좌골신경 압박 손상이다.</span><span class="hang">유열 와위우를 4시간 넘게 방치하면 위험하다. 유열우의 3.8~28.2%가 기립불능우가 되고 치명률은 20~67%다.</span><span class="hang">의식 정상 기립불능우(alert): 흉골 와위, 활력징후·소화관 정상, 식욕 거의 정상. 좋은 간호로 대부분 며칠 안에 일어난다. 앞다리로 기어다니는 소를 creeper라고 한다.</span><span class="hang">의식 저하 기립불능우(nonalert): 흉골 와위 유지 불능, 다리 자세 이상, 신음, 식욕부진, 며칠 안에 죽는다.</span><span class="hang">한우컨설팅지침서: 미끄러운 바닥에서 넘어짐, 난산, 무리한 견인으로 골반 주위 근육·신경이 손상되거나 유열 치료 지연으로 뒷다리 혈류가 막혀 생긴다. 분만 직후부터 72시간 안에 기립 불능이 되어 칼슘을 줘도 일어나지 못하며, 체온·맥박·식욕은 정상이고 일어나려 애쓰며 기어다닌다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>진단과 예후<span class="hang">CK·AST 상승, 단백뇨(18~24시간 후), 미오글로빈뇨. 실험적 와위에서 CK는 6시간까지 정상, 12시간 평균 12,000 U/L, 24시간 40,000 U/L이었다.</span><span class="hang">와위 직후 CK가 크게 올랐다가 24~48시간에 뚝 떨어지면 급성 근육 외상(파열), 중등도로 오른 채 유지·상승하면 지속적 압박 손상이다. AST는 반감기가 길어 며칠 높게 남는다.</span><span class="hang">262두 연구의 회복 실패 예측 절단값: CK 2330, LDH 2225, AST 171 U/L. 24시간 미만 와위는 32%, 그보다 길면 8.2%가 회복했다. BCS 4.0/5 초과는 기립불능 위험 4.3배다.</span><span class="hang">7일 넘게 누워 있으면 예후가 나쁘다(Constable, 한우컨설팅 모두). 다만 10~14일 뒤 일어난 예도 있다. 장기 와위우는 혈청 인이 오히려 높은데 근손상으로 세포내 인이 나오기 때문이다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>치료와 예방<span class="hang">콘크리트에서 모래·흙 같은 푹신한 바닥으로 옮긴다. 4~8시간마다(한우컨설팅은 깔짚 약 30 cm에 2~3시간 간격) 좌우로 굴린다. 탈수·식욕부진우에 경구 수액, NSAID(표시 용량), 덱사메타손 0.2~0.3 mg/kg 1회 정맥, 일어나려 애쓰는 소는 기립 보조기로 들어 준다. LAIM은 부양 수조가 근육·신경 회복에 가장 성공적이라고 한다.</span><span class="hang">한우컨설팅: 칼슘제를 먼저 써 보고 차도가 없으면 칼륨이 든 수액을 쓴다. 미끄러운 바닥에서 고관절이 탈구되면 치료가 매우 어렵다.</span><span class="hang">예방: 유열 고위험우는 분만 전후 12~24시간 서 있을 때부터 관찰하고 눕게 되면 1시간 이상 치료를 미루지 않는다. 임신 말기 BCS 3.5 내외 유지, 분만실 바닥 미끄럼 방지와 깔짚, 경운기 견인 같은 무리한 견인 금지(한우컨설팅).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">34.</span><span>저마그네슘혈증(목초 테타니, grass tetany) — 원인<span class="hang">마그네슘은 반추위 상피에서 나트륨 연계 능동수송으로 흡수된다. 반추위 Na:K 비가 5:1에서 흡수가 최대, 3:1 미만이면 크게 떨어진다. 사료 칼륨 건물 22 g/kg 초과에서 흡수가 줄기 시작한다.</span><span class="hang">질소 비료를 준 어린 목초의 높은 단백→반추위 암모니아 급증도 흡수를 막는다. 반추위 pH 6.5 초과에서 용해도가 크게 떨어진다. 이분해성 탄수화물은 흡수를 돕는다.</span><span class="hang">목초 필요 마그네슘: 임신우 1.0~1.3, 비유우 1.8~2.2 g/kg 건물. 안전 최소치 2 g/kg, 바람직 2.5 g/kg. 칼륨 30 g/kg 초과·질소 40 g/kg 초과 목초, 또는 K/(Ca + Mg) 당량비 2.2 초과 목초가 위험하다.</span><span class="hang">뼈의 마그네슘은 결핍 때 거의 동원되지 않아 혈중 농도는 매일의 섭취·흡수에 거의 전적으로 의존한다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>역학과 위험요인<span class="hang">겨울 사사 후 봄 방목 첫 2주에 가장 많고, 질소·칼리 비료를 많이 준 화본과 목초가 가장 위험하다. 가을 목초 급성장기에도 생긴다. 비유 첫 2개월, 4~7세 소가 가장 감수성이다. 육우는 흔히 건초 부족으로 영양·체형이 나빠진 뒤 발생한다.</span><span class="hang">맥류 목초 중독(wheat pasture poisoning): 어린 맥류 목초 섭취 시 저마그네슘·저칼슘·고칼륨혈증, 위험 순서는 밀 &gt; 귀리 &gt; 보리 &gt; 호밀이다.</span><span class="hang">겨울 저마그네슘혈증: 보조 사료 없이 겨울 방목하는 소, 춥고 습하고 바람 부는 날씨, 피난처 없는 목장.</span><span class="hang">유발 요인: 일시적 절식(악천후, 가두기, 수송, 이동), 설사, 흥분(에피네프린으로 혈중 마그네슘 급감). 발생률은 개별 농장 12%까지, 치명률은 젖소 약 30%, 육우는 그보다 높다. 북아일랜드에서는 육우 돌연사의 20%가 저마그네슘혈증이었다.</span><span class="hang">만성 잠재성 저마그네슘혈증은 PTH 분비·작용을 떨어뜨려 비유 정점기 유열·기립불능우를 부른다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>임상증상<span class="hang">급성: 갑자기 풀 뜯기를 멈추고 경계하며 근육·귀 경련, 심한 과민. 작은 자극에 계속 울고 미친 듯 달리거나 공격하며, 비틀대다 넘어져 사지 강직 후 약 1분의 간대성 경련. 후궁반장, 안진, 턱 씹기, 거품, 귀 쫑긋, 눈꺼풀 후퇴. 경련 후 체온 40.0~40.5℃, 심음이 멀리서도 들린다. 5~60분 안에 죽는다.</span><span class="hang">아급성: 3~4일에 걸쳐 식욕 감소, 거친 얼굴 표정, 과장된 보행, 빈번한 배뇨·배변, 뒷다리·꼬리 경직, 개구장애. 보정·주사 자극으로 격렬한 경련이 온다. 치료가 잘 듣지만 재발이 많다.</span><span class="hang">만성: 증상 없이 혈중 농도만 낮거나 돌연사. 둔함·발육부진·유량 감소, 칼슘에 잘 반응하지 않는 유열 유사 마비.</span><span class="hang">대개 혈청 마그네슘이 PTH 분비·작용을 막아 이차적 급성 저칼슘혈증이 겹칠 때 강직이 나타난다(LAIM).</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>진단 기준<table class="bxt"><tr><th>시료</th><th class="c">기준</th></tr><tr><td>혈청 정상</td><td class="c">1.7~3.0 mg/dL(0.70~1.23 mmol/L)</td></tr><tr><td>계절성 잠재성</td><td class="c">1~2 mg/dL(0.41~0.82)</td></tr><tr><td>테타니 위험 시작</td><td class="c">1.2 mg/dL(0.49) 미만</td></tr><tr><td>증상 평균 농도</td><td class="c">약 0.5 mg/dL(0.21)</td></tr><tr><td>뇨 마그네슘 위험</td><td class="c">1.0 mg/dL(0.4 mmol/L) 미만</td></tr><tr><td>뇨 Mg:크레아티닌(10두)</td><td class="c">1.0 mmol/L 미만이면 보충 반응 기대</td></tr><tr><td>뇌척수액(테타니우)</td><td class="c">1.25 mg/dL(0.51)</td></tr><tr><td>유리체액(폐사 48시간 내)</td><td class="c">0.55 mmol/L 미만</td></tr></table><span class="hang">혈중 칼슘은 흔히 5~8 mg/dL로 낮고, 맥류 목초 중독에서는 칼륨이 위험하게 높다. 강직·경련 직후에는 근육에서 마그네슘이 새어 혈중 농도가 정상에 가깝게 나올 수 있다.</span><span class="hang">책마다 기준이 조금 다르다. Rebhun은 증상우 혈청 0.8 mg/dL 미만·CSF 1.0 mg/dL 미만, 유리체액 1.8 mg/dL 미만을 든다. LAIM은 정상 혈장 1.8~2.4 mg/dL, 신역치 1.8 mg/dL, 1.1~1.8 mg/dL 중등도(섭취·유지방·유량 감소), 유리체액 0.4 mmol/L(1 mg/dL) 미만(23℃ 이하에서 24~48시간 신뢰), 뇨 1 mM 미만 결핍·4.4 mM 초과 정상이라 한다.</span><span class="hang">유리체액은 14(또는 16) 게이지 바늘로 각막윤부 뒤쪽에서 수직으로 찔러 채취하고 방수는 쓰지 않는다. 23℃ 이하, 세균 오염이 없으면 사후 72시간까지 쓸 수 있고 4% 포르말린(유리체액 부피의 3%)을 넣으면 72시간 보존된다. 뇌실 CSF가 요추 CSF보다 낫다.</span><span class="hang">분만 12~24시간 안에 대부분의 소가 2.0 mg/dL 미만이면 전이기 사료 마그네슘 문제로 본다(Rebhun). 분만 후 24시간 안에 1.9 mg/dL 이상이 아니면 사료 마그네슘 부족을 시사한다(LAIM).</span><span class="hang">감별: 급성 납중독, 광견병, 신경형 케토시스, BSE.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>치료<span class="hang">가장 안전한 일반 권고는 칼슘·마그네슘 복합제 정맥주사 후 진한 마그네슘염 피하주사다. 예: 25% 칼슘보로글루코네이트+5% 차아인산마그네슘 500 mL 정맥, 이어 50% 황산마그네슘 200 mL 피하.</span><span class="hang">대안: 15% 글루콘산마그네슘 200~400 mL 정맥, 20% 황산마그네슘 200~300 mL 정맥(3~6시간 안에 원래 수준으로 돌아온다). 12% 아디프산마그네슘+5% 글루콘산칼슘 500 mL도 쓴다.</span><span class="hang">LAIM: 성우에 마그네슘 1.5~2.25 g 정맥, 대개 칼슘 정맥도 필요하다. 치료 후 최소 30분은 일으키지 않는다. 회복은 약 1시간 뒤(CSF 정상화 시간), 12시간 안에 재발이 많다. Rebhun: 혈청을 정상으로 올리는 데 마그네슘 2~3 g 필요, 최소 5~10분에 걸쳐 주고, 10~20% 황산마그네슘 250 mL를 4곳 이상 나눠 피하주사해 재발을 막는다. 복합 용액은 대개 마그네슘 2 g 미만이므로 함량을 확인한다.</span><span class="hang">마그네슘 정맥주사는 부정맥·연수 억제로 호흡 정지를 일으킬 수 있다. 호흡곤란이나 심박 이상 시 즉시 중단하고 필요하면 칼슘을 준다. 경련이 심하면 클로랄하이드레이트 정맥 또는 자일라진으로 진정 후 투여한다.</span><span class="hang">직장 투여: 염화마그네슘 30 g을 100 mL에 녹여 주면 10분 안에 정상이 된다. 염화마그네슘 60 g을 물 200 mL에 녹여 관장하자 20분에 0.65에서 2.22 mg/dL로 올랐다는 보고도 있다(Periparturient).</span><span class="hang">회복 후 경구 마그네슘: 산화마그네슘 100 g 현탁액(마그네슘 약 52 g) 또는 50% 황산마그네슘 200~400 mL 투여(LAIM), 황산마그네슘 100~200 g(Rebhun). 삼킴 반사가 돌아온 뒤에만 준다. 같은 위험이 군 전체에 있으므로 나머지 소의 마그네슘 섭취를 즉시 늘린다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>예방<span class="hang">고위험우를 위험 시기에 저위험 목초지로 옮기고, 위험 목초는 거세우·육성우가 쓴다. 봄 목초 비유우는 사료 마그네슘 3.0 g/kg 건물까지 필요할 수 있다.</span><span class="hang">산화마그네슘을 최소 60 g/일 강제투여 또는 사료에 넣는다. 120 g/일은 안전하고 효과적이며 180 g/일은 설사를 일으킬 수 있다. 보호 효과는 며칠 안에 생기고 중단하면 바로 끝난다. 인산마그네슘 53 g/일도 쓴다. 뉴질랜드에서는 착유 후 마그네슘 10 g/두/일을 강제투여한다.</span><span class="hang">발생 농장에서 추가 마그네슘: 임신우 10~15 g, 비유 육우 20 g, 비유 젖소 30 g/두/일(LAIM). Periparturient는 17~20 g/일, 15% 마그네슘 광물질 4온스/일을 든다.</span><span class="hang">기호성이 나빠 당밀과 1:1로 섞거나 건초에 뿌린다. 마그네슘 블록·염 블록만으로는 보장되지 않는다. 송아지는 산화마그네슘 사료 2~4%에서 중독·설사가 오므로 접근을 막는다.</span><span class="hang">반추위 마그네슘 탄환은 약 1 g/일을 방출하며 위험 상황에서 4개까지 투여한다. 목초 표면 살포: 미세 산화마그네슘 30 kg/ha(20~50 kg/ha로 최대 3주 보호), 2% 황산마그네슘 2주마다 분무. 음수 투여: 황산마그네슘 500 g/100 L 또는 염화마그네슘 6수화물 420 g/100 L.</span><span class="hang">위험 시기 직전 칼리 비료 자제, 충분한 소금 제공, 피난처, 절식 회피, 이오노포어(마그네슘 흡수 효율 약 10% 증가). 분만 후 비유 사료 마그네슘은 0.2% 이상(Bovine Medicine), 분만 전·초기 사료 0.35~0.4%(LAIM). 산화마그네슘은 원료마다 이용률 차이가 커서 식초 반응 시험으로 비교할 수 있다(LAIM).</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>송아지 저마그네슘혈증 테타니와 수송 테타니<span class="hang">송아지: 우유만 먹거나 조사료가 부족한 2~4개월령, 설사와 깔짚 씹기가 악화 요인이다. 우유는 체중 약 50 kg까지만 필요량을 충족하고, 장 흡수 효율이 87%에서 3개월령 약 30%로 떨어진다. 혈청 0.8 mg/dL 미만에서 테타니, 0.6 mg/dL 미만에서 심하다. 뼈 Ca:Mg 비 90:1 초과(정상 70:1). 근이영양증이 흔히 병발한다.</span><span class="hang">치료는 10% 황산마그네슘 100 mL 천천히 정맥(골 저장 고갈로 효과는 일시적, 하루 필요량 정도), 또는 미온수 관장(황산마그네슘 15 g). 생후 10일 안에 보충을 시작해 최소 10주까지 하고, 2개월에 건초·사일리지를 넣으면 예방된다.</span><span class="hang">수송 테타니(수송 와위): 임신 말기 소가 장거리 수송 후 와위·소화관 정지·혼수에 빠지고 치명률이 높다. 위험요인은 수송 전 과식, 24시간 넘는 절식·절수, 도착 후 무제한 음수, 하차 직후 운동, 더운 날씨. 하차 후 48시간 안에도 생긴다. 소에서는 중등도 저칼슘·저인산혈증이 있을 수 있고 3~4일 안에 죽는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>저인산혈증 — 분만기 저인산혈증과 기립불능<span class="hang">정상 혈장 무기인은 성우 약 5.6~6.5 mg/dL(Rebhun), 4~8 mg/dL(LAIM)로 책마다 범위가 다르다. 경정맥 혈은 미정맥 혈보다 최대 0.8 mg/dL 낮게 나온다.</span><span class="hang">유열우 대부분은 저인산혈증이다(칼슘 5 mg/dL 미만이면 인은 대개 2 mg/dL 미만). PTH 증가로 소변·침 손실이 늘기 때문이며, 칼슘 정맥 치료만으로 몇 시간 안에 정상화된다.</span><span class="hang">경도(2~4 mg/dL)는 다른 장애가 없으면 증상이 없다. 1 mg/dL 미만은 기립 불능일 수 있지만 대개 저칼슘·저혈당·저마그네슘이 겹쳐 있어 단독 원인으로 보기 어렵다. 와위 원인으로서의 인 결핍과 인 보충 효과에 대한 확실한 근거는 아직 없다(Constable).</span><span class="hang">LAIM은 칼슘 교정 후에도 인이 1 mg/dL 미만으로 남는 저인산혈증성 기립불능우가 있고, 근육·신경 손상 전에 인산 용액으로 치료하면 회복되는 예가 있다고 한다. 저인 사료로 생기지 않으며 유열 예방이 최선이다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>인 보충 방법<span class="hang">생체이용 가능한 형태는 무기 인산이다. 부타포스판·톨딤포스 같은 유기인, 아인산·차아인산 염은 이용되지 않아 인 보충에 부적합하다.</span><span class="hang">경구: 인산일나트륨 200~500 g(무기 인산 약 50~100 g)을 칼슘·에너지·마그네슘과 함께 강제투여(Rebhun). LAIM은 인산일나트륨 200 g(인 50 g)을 든다. 경구는 느리지만 효과가 오래간다.</span><span class="hang">정맥: 인 6 g(인산일나트륨 23 g)을 생리식염수 1 L에 녹여 준다(LAIM). 멸균 플리트 용액(20~30 g 점적 정맥 또는 피하)도 쓴다(Rebhun). 고칼슘·고마그네슘 수액과 섞으면 침전한다. 혈장 인이 너무 높으면 칼슘·마그네슘과 침전하고 이온화 칼슘이 떨어진다.</span><span class="hang">만성 인 결핍 반추동물에 경구 인 보충은 강한 근거가, 급성 저인산혈증 치료는 중등도 근거만 있다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>만성 인 결핍<span class="hang">인 함량이 낮은 건조 지역 토양, 성숙한 마른 풀(건물 0.15% 미만), 옥수수대 같은 작물 잔사 방목에서 생긴다. 소가 양보다 감수성이 높다.</span><span class="hang">섭취량 감소·식욕부진이 가장 흔한 증상이다. 어린 소는 구루병, 성우는 골연화증, 체중 감소, 보행 꺼림, 골절, 유량·성장·번식 저하가 온다.</span><span class="hang">분만 전 인은 건물 0.2~0.4%, 분만 후 0.4%가 적정 목표다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>산후 혈색소뇨증(postparturient hemoglobinuria) — 원인과 임상<span class="hang">원인은 확실하지 않다. 사료 인 결핍, 십자화과 식물·사탕무 부산물, 고몰리브덴, 구리 결핍이 거론된다. 뉴질랜드에서는 구리·셀레늄 결핍, 북미에서는 인 결핍이 관련된다고 본다. 찬물 섭취, 혹한이 유발할 수 있다.</span><span class="hang">3~6산 고능력 젖소의 분만 후 2~4주에 산발적으로 생기고 육우에는 드물다. 치명률은 50%까지(Periparturient는 10~50%)다. 장기 사사 기간에 많다.</span><span class="hang">갑작스러운 혈색소뇨(적갈색~흑색, 적혈구 없음), 식욕부진, 쇠약, 유량 급감, 빠른 탈수, 창백, 심박·경정맥 박동 증가, 체온 약 40℃, 호흡곤란. 말기에 황달. 경과 3~5일, 회복기 약 3주에 이식증이 흔하다. 케토시스가 흔히 겹친다.</span><span class="hang">인 결핍만으로는 적혈구 인 감소나 삼투압 저항 저하가 생기지 않았다는 연구(Grünberg 2015)가 있어 인 결핍 단독 원인설은 의문이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>산후 혈색소뇨증 — 진단·치료·예방<span class="hang">혈장 용혈, PCV·적혈구·혈색소 감소, 뚜렷한 저인산혈증, 진행 시 고빌리루빈혈증. 뉴질랜드형은 하인즈 소체. 혈색소뇨 시작 4~9일 뒤 PCV가 최저(약 16%)다. 급성기 혈청 인 0.5~1.5 mg/dL, 증상우 1.6~3.0 mg/dL 보고가 있다(Periparturient).</span><span class="hang">중증 용혈성 빈혈은 전혈 수혈을 한다. 12시간 늦으면 회복 불능이 되는 경우가 많다. 성우에 최소 5~6 L가 필요하고 48시간까지 유지되며, 필요하면 다시 수혈한다. 이후 혈색소뇨성 신증 예방을 위해 수액을 준다.</span><span class="hang">인산이수소나트륨 30 g을 탈이온수 300 mL에 녹여 정맥주사하고, 효과가 짧으므로 경구 인산염 150~200 g을 물에 녹여 강제투여(12~24시간 간격 반복)한다. 산성이라 피하주사는 하지 않는다. 인산이칼슘은 용해도가 낮아 신속 교정에 부적합하다(Constable).</span><span class="hang">Periparturient는 인산이수소나트륨 60 g을 5% 포도당에 섞어 정맥 후 같은 용량 경구 하루 2회 3일, 또는 20% 용액 60~80 g 정맥 매일 2~4일, 구리 결핍 의심 시 인산염 60 g 정맥 후 구리글리시네이트 1.5 mg/kg을 생리식염수 500 mL에 1회 정맥 투여하는 방법을 든다.</span><span class="hang">예방: 비유 초기 유지·유량에 맞는 인 섭취를 보장한다. 구리 결핍 지역에서는 구리 보충으로 발생이 줄었다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">46.</span><span>급성 저칼륨혈증 — 원인<span class="hang">비유 젖소에서 주로 생긴다. 유방염·후산정체로 인한 식욕부진(2일 넘는 식욕부진), 제4위 좌·우 변위·염전·식체, 우유 칼륨 손실(1.4 g/L), 고혈당에 따른 고인슐린혈증으로 세포내 이동, 교감신경 활성, 탈수에 따른 알도스테론, 낮은 근육량이 원인이다.</span><span class="hang">이소플루프레돈 아세트산염은 광물코르티코이드 작용이 강해 신장·침·결장 칼륨 손실을 늘린다. 10 mg 2회 투여 후 72시간에 정상의 약 60~70% 수준으로 떨어지고, 현장에서는 반복 투여로 혈장 칼륨이 70~80% 감소했다. 덱사메타손은 광물코르티코이드 작용이 거의 없다.</span><span class="hang">50% 포도당 정맥주사, 프로필렌글리콜, 코르티코스테로이드를 반복하면 고혈당·고인슐린으로 칼륨이 세포 안으로 들어가고, 장기 식욕부진에 따른 대사성 알칼리증이 이를 악화시킨다. 이소플루프레돈을 쓰지 않아도 생길 수 있다.</span><span class="hang">알칼리혈증은 혈청 칼륨을 낮추고 산혈증은 높인다. 칼륨은 24~48시간이 지나야 신장이 섭취 감소에 적응한다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>임상과 진단<span class="hang">전신 근육 쇠약, 위장 운동 저하, 침울. 2.0 mEq/L 미만이면 대개 누워 있고 몹시 이완되어 머리를 들지 못하고 옆구리에 붙인다. 측경부 근육 쇠약. 부정맥, 특히 심방세동이 흔하다.</span><span class="hang">혈청 칼륨 2.5 mEq/L 미만은 중증으로 대부분 쇠약·와위, 2.5~3.5 mEq/L는 중등도다. 정상 혈장 칼륨 3.8~5.6 mEq/L(Rebhun). 나트륨·염소·칼슘·인과 CK·AST도 함께 잰다.</span><span class="hang">전신 칼륨 고갈 평가 민감도는 골격근 &gt; 혈청·혈장 &gt; 우유 &gt; 적혈구·전혈 &gt; 소변 &gt; 침 순이다. 혈청 칼륨은 혈소판에서 나와 혈장보다 조금 높다.</span><span class="hang">부검에서 후지 근괴사, 체중을 받지 않는 근육에도 다발성 근괴사·근섬유 공포화가 보이는 저칼륨성 근병증이다.</span><span class="hang">만성 칼륨 고갈 징후: 식욕부진, 털·바닥 핥기와 나무 씹기 같은 이식증, 거친 털, 근쇠약, 과민, 마비, 강직.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>치료와 예방<span class="hang">제4위 변위 수술 교정, 섭취량 증가, 경구 염화칼륨, 저염소혈증·알칼리혈증·탈수 교정에 집중한다.</span><span class="hang">경구 염화칼륨이 1차 선택이다. 식욕부진 성우에 KCl 120 g 경구, 12시간 뒤 120 g 추가, 24시간 총 240 g(0.4 g/kg). 그 이상은 설사·유연·다리 떨림·흥분을 일으킨다.</span><span class="hang">Rebhun은 확진된 중증(2.5 mEq/L 미만) 쇠약우에 처음 1.0 lb, 이후 0.5 lb를 하루 2회 경구로 주며 혈청 칼륨을 감시한다고 한다. 수액을 대량 경구투여할 때는 KCl 60~125 g이 안전하다.</span><span class="hang">정맥은 반추위 정지가 있는 중증 와위우의 초기 치료에만 쓴다. 1.15% 등장 KCl을 3.2 mL/kg/시간 미만(칼륨 최대 0.5 mEq/kg/시간)으로 준다. 이보다 빠르면 심실조기수축·세동으로 죽을 수 있다.</span><span class="hang">14두 증례에서 KCl 평균 0.42 g/kg/일(경구 26 g+정맥 16 g)로 평균 5일 치료해 11두가 평균 3일 만에 회복했다. 24~48시간 안에 일어서지 못하면 예후가 나쁘다(Rebhun). 칼륨이 정상이 될 때까지 슬링·부양 수조를 쓰지 않는다.</span><span class="hang">예방: 충분한 건물섭취 유지, 식욕부진 비유우 수액에 경구 칼륨 필수 포함, 제4위 질환 조기 교정, 이소플루프레돈은 1회만 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">49.</span><span>케토시스(ketosis) — 기전과 분류<span class="hang">반추동물은 포도당을 거의 흡수하지 않고 프로피온산·아미노산으로 간에서 포도당을 만든다. 저혈당·저인슐린, 낮은 인슐린:글루카곤 비로 체지방이 동원되고, 옥살로아세트산이 부족하면 아세틸CoA가 TCA 회로로 가지 못해 아세토아세트산·BHB가 만들어진다. 반추위 부티르산도 BHB로 흡수된다.</span><span class="hang">1형(자연발생형): 포도당신생 경로가 최대로 자극되었으나 전구체 공급이 부족한 경우다. NEFA가 빠르게 미토콘드리아로 들어가 케톤 생성이 많고 간 지방 축적은 적다.</span><span class="hang">2형: 지방간을 동반하며 포도당신생이 최대로 자극되지 않아 NEFA가 중성지방으로 에스테르화되어 간에 쌓인다. 건유기 과비가 소인이다.</span><span class="hang">3형(사료성): 부티르산이 많은 사일리지(옥수수 위주 사료 등)에 의한 것이다.</span><span class="hang">발생 양상으로는 원발성(생산형, 영양 좋은 고능력우의 음의 에너지 균형), 속발성(제4위 변위·창상성 제2위염·자궁염·유방염 등으로 섭취 감소), 사료성, 기아성(마른 소에 저질 사료), 특정 영양 결핍성(코발트, 인)으로 나눈다. 속발성의 비중이 상당하다.</span><span class="hang">Periparturient 책은 1형을 분만 후 3~6주 생기는 원발성(과소 급여, 인간 1형 당뇨에 대응), 2형을 분만 직후 생기는 속발성(장기 섭취 감소, 비만, 고혈당·인슐린저항)으로 설명해 Constable의 분류와 용어 대응이 다르다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>역학과 위험요인<span class="hang">비유 첫 60일에 90%가 생기며 첫 달에 가장 많다. 분만 후 발병 중앙값은 10~28일로 보고되고, 잠재성은 분만 후 첫 2주에 정점이다. 대규모 프리스톨 농장 연구에서 잠재성 발생 정점은 비유 5일이었다. 개별 사육·분리 급여 농장에서는 6주까지 늦게 생기기도 한다.</span><span class="hang">임상형 비유기 발생률 0.2~10.0%, 초산 1.5%·경산 9%. 잠재성은 절단값에 따라 다르며 40%에 이른다. 잠재성 발생률은 유병률의 약 1.8배(Constable), 2.2배(Rebhun)다. 북미 평균 유병률은 약 20%다.</span><span class="hang">위험요인: 4산까지 증가, 분만 시 과비(BCS 3.25 초과 후 첫 2개월에 0.75점 감소), 건유기 체형 감소, 긴 건유기·분만간격(수정란 공여우), 유열·후산정체·파행·저마그네슘혈증, 쌍태(임신 말기), 수소 분만, 난산, 사산, 분만 전 NEFA 상승. TMR 자유 급여가 분리 급여보다 낮다.</span><span class="hang">분만 첫 2주 BHB 1.4 mmol/L 초과 소는 1~3주 뒤 제4위 변위 확률이 4:1이다. 잠재성 1두 손실은 117달러, 변위·자궁염까지 넣으면 289달러로 추정되었다(2015).</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>임상증상<span class="hang">소모형(가장 흔함): 2~4일에 걸쳐 식욕·유량이 서서히 준다. 분리 급여 시 곡류를 먼저 거부하고 다음 사일리지, 건초는 계속 먹는다. 체중이 섭취 감소보다 빠르게 줄어 피하지방이 빠진 나무 같은 외모가 된다. 변은 단단하고 건조하다.</span><span class="hang">체온·맥박·호흡은 정상이고(중증 단순형은 약간 저체온), 반추 운동은 줄지만 정상 범위다. 호기·우유에서 케톤 냄새가 나지만 맡는 능력은 사람마다 달라 민감도는 약 50%다. 유량 감소는 25%에 이르고 완전히 회복되지 않는다. 치료하지 않아도 약 한 달에 걸쳐 저절로 회복되는 경우가 많다.</span><span class="hang">신경형: 갑자기 섬망 같은 증상, 선회, 다리 꼬기, 머리 밀기, 실명 같은 모습, 피부·물체를 세게 핥기, 이식, 씹기·유연, 과민, 떨림, 비틀거림. 1~2시간 지속되고 8~12시간 간격으로 반복된다. 원발성 케토시스의 약 10%에서 신경 증상이 나타난다(Periparturient). 반추위에서 아세톤이 이소프로판올로 바뀌는 것이 원인으로 거론된다.</span><span class="hang">신경형 증상이 있는 제4위 변위 소는 에너지 상태를 평가·치료한 뒤 수술한다. 중증 대사성 산증(중탄산 12 mEq/L까지)이 일부 소에서 온다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>진단 기준<table class="bxt"><tr><th>구분</th><th class="c">혈청·혈장 BHB</th></tr><tr><td>정상</td><td class="c">1.0 mmol/L 미만</td></tr><tr><td>잠재성(Constable 합의 경향)</td><td class="c">1.0 mmol/L 초과</td></tr><tr><td>잠재성(Rebhun)</td><td class="c">1.2 mmol/L(12.5 mg/dL) 초과</td></tr><tr><td>잠재성(Periparturient)</td><td class="c">1.4 mmol/L 이상(1.2~1.4 보고 있음)</td></tr><tr><td>분만 1주 / 2주 절단값 제안</td><td class="c">1.0 / 1.4 mmol/L</td></tr><tr><td>임상형</td><td class="c">대개 2.5 mmol/L 초과(Rebhun 다수 3.0 초과)</td></tr></table><span class="hang">Rebhun 경험상 BHB 1.2~3.0 mmol/L로 경도인데 증상이 있는 소도, 3.0 초과인데 증상이 없는 소도 있다. 휴대용 측정기 기준 절단값은 1.1~1.4 mmol/L로 검증되었다.</span><span class="hang">혈장 포도당은 정상 약 50~65 mg/dL에서 20~40 mg/dL로 떨어진다. 속발성 케토시스는 대개 50 mg/dL 이상이다. NEFA·총빌리루빈 상승, 콜레스테롤 저하, 칼슘 약간 저하(약 9 mg/dL), 간 효소 상승, 일부는 혈장 코르티솔이 낮다.</span><span class="hang">BHB는 하루 2회 급여 소에서 급여 약 4시간 뒤 정점이고 오전이 높다. TMR 자유 급여에서는 일내 변동이 작다. 환산: BHB mg/dL × 0.0961 = mmol/L, 아세토아세트산 0.0980, 아세톤 0.1722.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>현장 검사<span class="hang">현장에서는 뇨 아세토아세트산(니트로프루시드)과 혈액 BHB 측정기(약 2달러/검사)가 선호된다. 니트로프루시드는 아세톤보다 아세토아세트산에 훨씬 민감하다. 색 등급: 미량 0.5, 소량 1.0, 중등도 2.0, 다량 5 mmol/L 이상.</span><span class="hang">우유 분말 검사는 민감도가 낮고(잠재성 위음성 많음, 민감도 28~90%·특이도 96~100%), 뇨 검사는 특이도가 낮다(정제형 민감도 100%·특이도 59%, 시험지 소량 기준 78%·96%). 우유 BHB 시험지는 민감도 58~96%·특이도 69~99%다. 체세포 100만/mL 초과는 우유 검사 수치를 올린다.</span><span class="hang">뇨 케톤이 우유보다 혈장 케톤과 더 잘 맞는다. 첫 검정일 유지방:유단백 비 1.5 초과도 에너지 부족·케토시스 위험 지표로 우유 BHB와 비슷한 민감도(0.63 대 0.58)를 보인다.</span><span class="hang">감별: 소모형은 제4위 변위, 창상성 제2위염, 원발성 소화불량, 방광염·신우신염, 신경형은 광견병, 저마그네슘혈증, BSE, 리스테리아증, 납중독.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>치료 — 포도당과 프로필렌글리콜<span class="hang">50% 포도당 500 mL 1회 정맥주사로 일시적 고혈당(3~4시간), 인슐린 증가·글루카곤 감소, NEFA 감소가 온다. 반복하지 않으면 재발이 흔하다. 소변으로 잃는 양은 10% 미만이다. 포도당 정맥주사는 내인성 인슐린 분비를 동반하므로 포도당·인슐린 이중 치료로 본다. 피하 고장성 포도당과 복강 20% 포도당은 권하지 않는다(Constable).</span><span class="hang">프로필렌글리콜 강제투여: 전통 용량 225 mL 하루 2회 2일, 이어 110 mL 하루 1회 2일. 북미 흔한 방법은 300 mL 하루 1회 5일. 처방 요약은 300~500 mL/일 5일. Rebhun은 250 mL 하루 2회~300 mL 하루 1회, 최대 5일을 든다.</span><span class="hang">사료 혼합(200~700 g/일)도 쓰지만 강제투여의 볼루스 효과가 더 낫다. Rebhun은 사료에 섞지 말고 강제투여하라고 한다. 포도당 정맥주사 후 프로필렌글리콜을 이어 주면 가장 좋고, 두 가지 병용이 BHB를 가장 효과적으로 낮췄다(Rebhun).</span><span class="hang">500 mL 넘게 주면 얕고 빠른 호흡, 운동실조, 유연, 졸림이 올 수 있어 강제투여 최대 500 mL/일이 권고된다.</span><span class="hang">기타 전구물질: 프로피온산나트륨 110~225 g/일(반응 느림), 젖산칼슘·나트륨 1 kg 후 0.5 kg 7일, 젖산암모늄 200 g 5일(좋은 결과), 아세트산나트륨 110~500 g/일. 칼슘프로피오네이트 1~1.5 lb를 물 5~10갤런에 탄 강제투여제는 잠재성 케토시스와 저칼슘혈증을 함께 다룬다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>치료 — 코르티코스테로이드<span class="hang">당질코르티코이드는 24시간 안에 고혈당을 만든다. 일부 케토시스우는 코르티솔이 낮아 투여 근거가 된다. 덱사메타손 21-이소니코티네이트 10 mg은 4~6일 고혈당을 유지하고, 덱사메타손인산나트륨 40 mg, 플루메타손 5 mg은 작용이 짧다. Constable 저칼륨 항목은 덱사메타손 10~20 mg 1회 근육주사, 필요하면 12~24시간 뒤 반복을 권한다. 미국 승인 용량은 5~20 mg 근육 또는 정맥이다(Rebhun).</span><span class="hang">원발성 케토시스는 코르티코스테로이드+포도당 정맥 병용이 단독보다 낫고 재발이 적다.</span><span class="hang">이소플루프레돈은 반복 투여 시 치명적 저칼륨혈증을 일으키므로 1회만 쓴다. 건강한 초기 비유우에 예방 목적으로 1회(20 mg) 주면 오히려 잠재성 케토시스가 늘었다.</span><span class="hang">Rebhun 저자 중 한 명(JM)은 일상적 당질코르티코이드 사용을 권하지 않는다. 다른 저자(SP)는 식욕이 괜찮고 유량 감소를 감수할 수 있는 고능력 경산우의 중증(BHB 3.0 초과), 포도당 지속 점적에 불응한 경우에만 덱사메타손 10~15 mg 1회를 포도당과 함께 쓴다. 호중구 기능 저하가 주의 이유다.</span><span class="hang">신경형 케토시스에는 코르티코스테로이드를 쓰지 말라는 기술이 있다(Periparturient). 신경형은 포도당 정맥과 경구 클로랄하이드레이트 40 g/일로 치료할 수 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>치료 — 인슐린과 기타<span class="hang">인슐린은 포도당이나 당질코르티코이드와 함께, 포도당·코르티코스테로이드에 반응하지 않는 조기 발병 증례에 쓴다. 프로타민아연인슐린 200~300 IU/두 24~48시간마다 피하(Constable), 처방 요약은 렌테 인슐린 200 IU 피하 매일 3일. Rebhun은 장시간형 200 IU를 24~36시간마다 피하로 포도당 지속 점적과 함께 주며, 포도당 없이 주면 저혈당 위험이 커 권하지 않는다.</span><span class="hang">시아노코발라민(비타민B12) 1~4 mg 정맥 매일 2~6회(부타포스판 복합제), Rebhun은 1.25~2.5 mg/일. 코발트 결핍 지역에서는 B12·코발트가 적응증이다.</span><span class="hang">시스테아민 750 mg 정맥 1~3일 간격 3회, 푸마르산나트륨도 쓰였으나 널리 채택되지 않았다. 트렌볼론 60·120 mg 실험 보고가 있으나 대부분 국가에서 식용동물 금지다. 글루카곤은 반감기가 짧아 지속 투여 장치가 필요하다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>만성·난치성 케토시스와 간지방증 관리(Rebhun)<span class="hang">1~7주 지속되는 케토시스는 대개 간지방증이 있다. 흔히 농장 최고 능력우로, 1~3주 여러 번 치료받은 뒤 의뢰된다.</span><span class="hang">5~10% 포도당 지속 점적에 KCl을 최종 40 mEq/L로 넣은 균형 전해질액을 쓴다. 혈중 BHB 1.2 mmol/L 미만, 혈당 150 mg/dL 미만을 목표로 칼륨·칼슘과 함께 감시한다. 정맥 지원을 끊으면 1~3일 안에 재발하는 경우가 많다.</span><span class="hang">50% 포도당 250 mL를 하루 여러 번 주는 방법은 반복 고혈당으로 제4위 변위·당뇨·패혈증·수분 손실 위험을 높인다. 나이아신 12 g/일 경구, 비타민B12 매일 투여.</span><span class="hang">가장 중요한 치료는 강제급여다. 알팔파 가루, KCl 4온스, 건강한 소의 반추위액을 하루 2회 준다. 3~5일 효과가 없으면 CMT 음성 소에 한해 하루 2회 1분씩만 착유해 음의 에너지 균형 고리를 끊으며 대개 4~7일 필요하다. 대부분 비유 6~8주에 회복하고 예후는 매우 좋다. 가장 흔한 합병증은 카테터 없이 반복 정맥주사한 데 따른 혈전정맥염이다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>군 모니터링<span class="hang">검사 최적 시기는 비유 3~9일이다. 북미·유럽 833농장 모델링에서 잠재성 발생률 15~50%일 때 3~9일 주 2회 검사가 가장 비용효과적이었고, 15% 미만이면 검사가 비경제적, 50% 초과면 검사 없이 전 두수 치료가 낫다.</span><span class="hang">Oetzel 방식: 최소 12두(대규모 농장 20두)의 혈액 BHB를 1.2 mmol/L 기준으로 재서 3두 이상이면 문제다. 표본을 늘리면 경보 수준 15%, 최상위 농장 목표 10% 이하. 표본은 그 시점 건강한 소로 고른다. 병든 소는 이미 유량이 줄어 케톤이 낮을 수 있다.</span><span class="hang">혈액 BHB 1.2 mmol/L 초과 소는 거슬러 올라가면 분만 전 주 건물섭취 12 kg 이하, NEFA 상승인 경우가 많다. 분만 전 14일~3일 NEFA는 0.3 mmol/L 이하가 이상적이다(Rebhun).</span><span class="hang">에너지 균형 감시에 실용적인 지표 6가지: 뇨 아세토아세트산, 혈액 BHB, 혈당, BCS, 초음파 등지방 두께, 유지방:유단백 비.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>예방 — 사양과 첨가제<span class="hang">분만 시 과비나 절식 상태가 아니어야 한다. 낙농 건유우는 전기와 분만 전기로 나눠 사양한다. 버터산이 많은 젖은 사일리지, 곰팡이 핀 건초, 농후사료 원료의 급변경을 피한다. 코발트·인·요오드를 충분히 넣는다. 사일리지 급여가 많은 농장에서 발생이 높으면 시험적으로 사일리지를 줄인다.</span><span class="hang">모넨신: 미국 승인 사료 내 11~22 g/ton(건물 100% 기준 TMR), 비유우 185~660 mg/두/일, 건유우 115~410 mg/두/일. 서방형 캡슐은 모넨신 32 g으로 분만 2~4주 전 투여해 95일간 335 mg/일을 방출한다. 에너지 관련 질병·잠재성 케토시스·좌측 변위를 40%, 후산정체를 25% 줄였다. 섭취량이 줄면 사료 내 농도가 부족해질 수 있어 캡슐이 더 효과적이라는 기술이 있다(Rebhun).</span><span class="hang">프로필렌글리콜 예방: 분만 후 350~1000 mL/일 10일, 또는 분만 전 9일 1 L/일. 잠재성 발생률 25% 이상 농장에서는 모든 신선우에 5일 투여가 경제적이었다(Rebhun). 고위험우에 분만 후 7~10일 250 mL/일 투여 예도 있다(Periparturient).</span><span class="hang">보호 콜린 15 g/일을 분만 25일 전부터 분만 후 80일까지 주면 임상형 케토시스가 줄었다. 시아노코발라민+부타포스판을 분만 전후 2~6회 투여하면 에너지 상태가 개선되며 노령우·과비우·난산·자궁염 소에서 가장 이득이다.</span><span class="hang">나이아신은 분만 2주 전부터 분만 후 12주까지 권고되나 근거가 엇갈린다. 6 g/일(분만 전)·12 g/일(분만 후) 투여에서 혈당 상승·BHB 감소를 보였고 3 g/일은 효과가 없었다. 글리세롤은 강제투여로만 쓰고 사료에 지속 혼합하면 오히려 케톤 생성적일 수 있다.</span><span class="hang">요소 실험적 첨가 후 여러 비유 단계에 걸친 케토시스 집단 발생이 있었고 요소를 빼자 저절로 회복했다. 분만 전 3주 대사단백 부족도 소인이다. 분만 전·후 대사단백 최소 요구량은 각각 1300 g/일, 약 3000 g/일이다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">60.</span><span>지방간(fatty liver, 비만우 증후군) — 원인과 역학<span class="hang">간의 지방 흡수가 산화·분비를 넘어설 때 생긴다. 체지방, 특히 피하지방이 동원되어 간과 근육·신장에 쌓인다. 진짜 비만 여부보다 비유 초기 음의 에너지 균형 정도가 결정적이다.</span><span class="hang">소의 간세포는 VLDL 수출 능력이 낮고, 비유 초기에는 아포지단백 B100 부족으로 더 떨어진다. 분만 전 에스트로겐 증가도 에스테르화를 늘린다.</span><span class="hang">젖소는 분만 후 첫 4주에 주로 생기며 50%까지 어느 정도 중성지방 축적이 있다. 분만 1주 간 지방 20% 미만은 정상, 20% 이상이 지방간이다. 영국 고능력우 약 30%가 분만 1주에 지방간이다. 간 지방은 분만 수주 전부터 늘어 분만 1주에 평균 약 20%, 26주에 5% 미만으로 돌아온다.</span><span class="hang">경도·중등도·중증 소의 폐사·도태율은 15·31·42%였다. 일부 농장에서 25%가 걸리고 치명률 90%인 집단 발생이 있었다. 사육 군 급여, 건유기 과다 급여·긴 건유기, 비만우를 줄이려는 임신 말기 절식이 위험요인이다.</span><span class="hang">육우는 영양이 좋던 임신 말기 소가 사료 부족을 겪을 때, 특히 쌍태에서 생긴다(임신독혈증 항목 참조).</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>임상과 진단<span class="hang">젖소는 대개 분만 후 며칠 안에 유열·제4위 변위·소화불량·후산정체·난산 같은 식욕 저하 질병을 계기로 시작한다. BCS 4/5 이상, 치료에 반응하지 않고 식욕을 잃으며 반추 약화·변 감소, 장기 와위, 일반 치료에 불응하는 심한 케토시스와 현저한 케톤뇨. 7~10일에 걸쳐 쇠약해져 죽는다. 일부는 응시·머리 쳐들기·두경부 떨림 같은 신경 증상, 말기 혼수·빈맥·고혈당을 보인다. 중증 치명률 50% 이상이다.</span><span class="hang">중등도는 건초라도 조금씩 계속 먹으면 며칠 안에 회복한다. 잠재성 지방간은 발정 재귀 지연·수태율 저하로 분만-수태 간격을 늘린다.</span><span class="hang">NEFA·아세토아세트산·BHB·총빌리루빈 상승, 프룩토사민 감소(213 µmol/L 미만이면 간지방증 예측), AST·OCT 상승. ALT·SDH·GLDH·ALP·GGT는 관련성이 약하다. 혈장 NEFA:콜레스테롤 비가 가장 관련 깊은 지표다. 혈장 암모니아 29 µmol/L 초과는 중증 간부전을 뜻한다. 분만 2주 간 지방 20% 초과 소에서 백혈구감소가 관찰된다.</span><span class="hang">간생검이 가장 믿을 만하다(가장 정확한 시기는 분만 후 8~14일이라는 기술이 있다, Periparturient). 생검 위치는 우측 10~11 늑간 등쪽이다(Rebhun).</span><table class="bxt"><tr><th>생검 조직 부유 시험</th><th class="c">간 지질</th></tr><tr><td>물·비중 1.025·1.055 모두 뜸</td><td class="c">34% 초과(중증)</td></tr><tr><td>물에 가라앉고 1.025·1.055에 뜸</td><td class="c">25~34%(중등도)</td></tr><tr><td>1.055에만 뜸</td><td class="c">13~25%(경도)</td></tr><tr><td>모두 가라앉음</td><td class="c">13% 미만</td></tr></table><span class="hang">Rebhun은 같은 시험을 35% 초과·25~35%·15~25%로 적고, 이 구간으로 예후를 확실히 판단할 수는 없다고 한다. 임상적 간 기능부전은 간 지질 35~45% 이상에서야 일관되게 나타난다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>치료와 예방<span class="hang">중증은 예후가 나쁘다. 3일 이상 완전 식욕부진이면 집중 치료에도 대개 죽고, 신경 증상이 있으면 매우 나쁘다. 식욕 회복 여부가 가장 중요한 예후 인자다. 양질 건초와 물을 넉넉히 준다.</span><span class="hang">전략은 지방 동원 감소(프로필렌글리콜), NEFA 완전 산화 촉진, VLDL 수출 증가(콜린)다. 프로필렌글리콜과 보호 콜린 병용이 이론적으로 유리하다.</span><span class="hang">처방(Constable): 프로필렌글리콜 300 mL/일 5일 경구, 50% 포도당 500 mL 1회 정맥, 덱사메타손·덱사메타손-21-이소니코티네이트·플루메타손 근육, 시아노코발라민 1~4 mg 정맥 매일 2~3회. 5% 포도당·다중 전해질 지속 정맥점적, 반추위액 5~10 L 투여, 물·전해질 10~30 L 반추위 내 투여. 덱사메타손-21-이소니코티네이트 20~25 mg 근육은 좌측 변위 교정 후 간 지질을 줄였다.</span><span class="hang">글루카곤 15 mg/일 피하 14일(분만 8일째부터)은 3.5세 초과 소의 간 중성지방을 줄였다. 프로타민아연인슐린 200~300(IU) 하루 2회 피하는 결과가 엇갈렸다.</span><span class="hang">Periparturient는 프로필렌글리콜 0.5~1 g/kg/일 강제급여, 50% 염화콜린 50 g 하루 1회 경구, 프레드니솔론 200 mg 근육 5일을 든다. Rebhun은 콜린·메티오닌 같은 지방친화제의 치료 가치는 크지 않다고 보며, 쓴다면 보호 콜린을 권한다.</span><span class="hang">예방: 비유 후기·건유기 과비 방지, 분만 시 섭취를 떨어뜨리는 상황 회피, 분만 전후 질병 조기 치료. 건유 시 BCS를 전통적 3.5 대신 약 3.0으로 관리하는 것을 권한다(Constable). NRC는 건유 초기 NEL 약 1.25 Mcal/kg, 분만 전 3주 1.54~1.62 Mcal/kg 사료를 권한다. BCS는 분만, 21~40일, 90~110일, 건유 100~60일 전에 평가한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>임신독혈증(소, 육우 분만 전 케토시스) — 원인과 역학<span class="hang">임신 말기 4~6주에 태아·태반 단위의 포도당 수요(모체 포도당 생산의 최대 40%)를 모체가 감당하지 못해 생긴다. 저혈당·고케톤혈증이 특징이며 고케톤혈증이 간 포도당 생산을 더 억제한다.</span><span class="hang">북미 육우에서는 분만 전 마지막 6주, 쌍태를 밴 비만우에서 가장 흔하다. 임신 말기까지 잘 먹다 갑자기 사료가 부족해지거나, 너무 살쪄 저에너지 사료를 충분히 먹지 못할 때 생긴다. 산발적으로 이환율 약 1%, 폐사율은 대개 100%다. 호주에서는 가을 분만 전환과 늦여름 사료 부족이 겹쳐 이환율 1~3%(최대 10%)였고 초임우가 더 많았다.</span><span class="hang">처음부터 마른 소는 굶어 쇠약해지고 죽지만 임신독혈증은 생기지 않는다. 사일리지에서 볏짚으로 바꿔 체중을 줄이려다 집단 발생한 예가 있다.</span><span class="hang">Blackwell은 원발성(심한 사료 부족·저질)과 비만우형(BCS 4/5 초과, 2형 케토시스) 두 가지로 나누고, 대개 분만 7~10일 전 발생하며 폐사율 90% 이상이라 한다. 기생충, 치아 불량, 파행, 한랭·수송 스트레스도 소인이다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>임상과 진단<span class="hang">분만 직전 비만 육우는 공격적·불안·흥분, 협조 불능, 비틀거림, 기립 곤란, 단단하고 적은 변, 빈맥을 보인다. 분만 2개월 전 발생하면 10~14일 침울하고 먹지 않다가 흉골 와위, 빠른 호흡·호기성 신음, 코 상피 박리, 말기에 악취 나는 황색 설사와 혼수로 조용히 죽는다. 경과 10~14일이다.</span><span class="hang">약 10%에서 핥기·머리 밀기·선회·실명·떨림 같은 신경 증상이 나타난다(Blackwell). 소는 양과 달리 흔히 실명하지 않으며, 진행하면 심한 변비, 와위, 신부전, 사망에 이른다(Rebhun).</span><span class="hang">혈청 NEFA 0.4 mEq/L 초과, BHB 15 mg/dL 초과(잠재성·중등도)·25 mg/dL 초과(임상형). 저혈당 또는 정상혈당, 저칼슘, 간 효소 상승, 저콜레스테롤혈증. 말기에는 태아 사망에 따른 고혈당, 저칼륨, 크레아티닌·BUN 상승. 케톤뇨가 케톤혈증보다 먼저 검출된다.</span><span class="hang">한우번식우 사양관리 자료: 임신 말기 영양 부족으로 생기며 쌍태에서 많다. 초기 둔하고 벽에 기대며 저혈당 증상, 비틀거림, 무리 이탈, 시각 장애를 보이고 말기 신부전·요독증·순환·호흡장애로 폐사한다.</span><span class="hang">감별: 제4위 식체, 미주신경성 소화불량, 만성 복막염, 저칼슘혈증, 리스테리아증, 대뇌피질괴사, 저마그네슘혈증, 구리 중독.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>치료와 예방<span class="hang">원칙은 에너지 공급과 에너지 요구 원인 제거다. 초기(식욕부진·와위 전)에는 사료 조정과 포도당 전구물질(프로필렌글리콜, 글리세롤, 칼슘·나트륨 프로피오네이트, 당밀)로 충분할 수 있다. 진행하면 산염기·탈수·전해질·신기능을 평가해 수액을 준다.</span><span class="hang">분만 유도나 제왕절개로 태아를 제거한다. 덱사메타손 25~30 mg 근육, PGF2α(디노프로스트 25 mg 또는 클로프로스테놀 500 µg 근육) 후 24~72시간에 분만한다. 72시간 안에 분만하지 않거나 상태가 나쁘면 제왕절개한다. 이후 광범위 항생제·NSAID·옥시토신을 준다. 비타민B 복합제로 식욕을 돋운다.</span><span class="hang">치료 성과는 흔히 나쁘고 비경제적이다. 장기 와위면 예후가 나쁘다. 살아남은 소는 난산·후산정체·비유 초기 대사 합병증이 흔하다.</span><span class="hang">한 두라도 발생하면 군 전체가 위험하므로 에너지 보충을 군 단위로 한다. 소를 크기·체형별로 나눠 급여하고, 비만우에게 최상 건초와 보충사료를 주며 바닥 급여로 걷게 한다.</span><span class="hang">예방의 핵심은 임신 마지막 3분의 1 동안 살찌지 않게 하면서 임신 말기 총양분 섭취를 계속 늘리는 것이다. 한우번식우 자료는 임신 초·중기 과비를 막고 임신 말기 사료를 약 25% 늘리라고 한다. 혈중 BHB·NEFA를 재서 높은 소를 분리 감시한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>구리 결핍 — 원인<span class="hang">원발성은 사료 구리 부족(모래 토양, 풍화 토양)이다. 속발성(조건성)은 섭취는 충분하나 흡수·이용이 방해받는 경우로, 몰리브덴·황이 반추위에서 티오몰리브덴산염을 만들어 구리와 결합하는 것이 핵심이다. 철도 반추위에서 구리와 복합체를 만들어 악화시킨다. 아연·납·탄산칼슘·망간도 조건 인자다.</span><span class="hang">이탄·흑니 토양의 고몰리브덴 목초(teart, 이탄 설사)가 대표적이다. 황산염이 많은 음수도 흡수를 떨어뜨린다. 봄·여름 방목하는 어린 반추동물의 군 문제이고, 시멘탈이 더 감수성일 수 있다.</span><span class="hang">목초 정상 구리 10 mg/kg 건물(몰리브덴 1.5 mg/kg 미만일 때), 한계 6~8, 결핍 4~6 mg/kg. 구리:몰리브덴 비는 육우 성장에 2.0 초과가 필요하다. Rebhun은 목초 구리 3 mg/kg 건물 미만을 결핍 기준으로 든다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>임상증상<span class="hang">잠재성 구리결핍: 증상 없이 혈장 구리가 한계치이고 보충 반응이 들쭉날쭉하다. 같은 지역 육우 약 50%, 젖소 약 10%가 혈중 구리가 낮다는 조사가 있다.</span><span class="hang">원발성: 발육부진, 유량 감소, 빈혈, 거친 털과 털색 변화(검은·붉은 소가 녹슨 붉은색으로 바램, 검은 소 눈 주위 회색 반점). 중증이면 송아지 성장 불량과 사지·견갑골 골절, 운동 후 뒷다리 조절 상실, 가려움·털 핥기, 관절 비대·굴건 구축으로 발끝으로 섬. 지속성 설사는 원발성의 특징이 아니므로 몰리브덴증이나 기생충을 의심한다.</span><span class="hang">속발성: 빈혈은 덜하고 설사 경향이 있다. 이탄 설사는 방목 8~10일 만에 냄새 적은 황록~흑색 수양성 설사가 시작되고 꼬리를 들지 않고 배변하며, 식욕은 유지된다. 구리 투여 며칠 만에 회복한다.</span><span class="hang">송아지 발육부진(pine): 경직 보행, 중수·중족골 원위 골단 비대와 통증, 직립 계부, 진행성 쇠약, 4~5개월에 죽을 수 있다. 낙상병(falling disease, 성우 심근변성): 갑자기 머리를 쳐들고 울며 쓰러져 대개 즉사하며 지금은 드물다.</span><span class="hang">털색 변화는 빠르게 크는 어린 소에서 구리 결핍만 일으킨다. 뉴질랜드에서는 산후 혈색소뇨증 증가와 관련된다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>진단 기준치<table class="bxt"><tr><th>소 시료</th><th class="c">정상</th><th class="c">한계</th><th class="c">결핍</th></tr><tr><td>혈장 구리(µmol/L)</td><td class="c">10~20</td><td class="c">3~9</td><td class="c">8 미만(흔히 1.6~3.2)</td></tr><tr><td>성우 간(µmol/kg 건조)</td><td class="c">380~1600</td><td class="c">160~380</td><td class="c">160 미만</td></tr><tr><td>우유(mg/L)</td><td class="c">0.05~0.20</td><td class="c">0.02~0.05</td><td class="c">0.01~0.02</td></tr><tr><td>털(mg/kg)</td><td class="c">6.6~10.4</td><td class="c">4~8</td><td class="c">1.8~3.4</td></tr></table><span class="hang">µmol/L를 15.7로 나누면 µg/mL, 간 건조중량에 4를 곱하면(나누면) 생중량 환산이다. 국제 결핍 역치는 혈장 9.4 µmol/L이고, 3.0~9.0 µmol/L(19~57 µg/dL)는 한계, 3 미만은 기능적 결핍이다. 혈장 7.9 µmol/L 미만은 간 구리 저하와 관련된다.</span><span class="hang">정상 성우 간 1570 µmol/kg 건조(100 mg/kg), 160~380(11~24 mg/kg) 한계, 160(10 mg/kg) 미만 저하. 군 평가에 간 시료 10~12개가 필요하다. 신생 송아지 간은 3000~6000 µmol/kg 건조로 높다. 신피질 정상 200~300 µmol/kg 건조.</span><span class="hang">Rebhun: 혈장 19~57 µg/dL 한계, 19 µg/dL 미만 저하, 간 100 mg/kg 건조 초과 정상, 30 mg/kg 미만 저하. 혈중·간 값은 겹침이 커서 보충 반응으로 확진한다.</span><span class="hang">소는 응고 덩어리로 구리가 빠져 혈청이 혈장보다 낮으므로 혈장이 바람직하다. 셀룰로플라스민 정상 15~35 IU/L, 적혈구 SOD 2~5 U/mg Hb 한계·2 미만 기능적 결핍. 진행하면 혈색소 50~80 g/L, 하인즈 소체 빈혈. 기준치가 너무 높게 잡히는 경우가 많다는 네덜란드 연구가 있다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>치료와 보충<span class="hang">치료: 황산구리 경구 2~6개월령 송아지 4 g, 성우 8~10 g을 주 1회 3~5주(Constable). Rebhun은 송아지 4 g/일, 소 8~10 g/일 3~5주로 적어 투여 간격이 다르다. 신경·심근 병변이 이미 있으면 완전 회복하지 않는다.</span><span class="hang">광물질 혼합물에 황산구리 3~5%(예: 칼슘·인 보충제 50%, 코발트요오드 소금 45%, 황산구리 3~5%)를 자유 급여하거나 전체 사료의 1%로 넣는다. 자유 급여 소금·광물질은 소 2%, 사료 구리는 최소 10 mg/kg 건물로 맞춘다. 고몰리브덴에 의한 속발성은 농후사료에 구리 최대 1200 mg(황산구리 약 5 g)/일을 더한다.</span><span class="hang">주사: 구리글리시네이트 1회로 약 60~90일 유지되며 소 120 mg·송아지 60 mg Cu(Constable). 이들 제제의 통상 용량은 소 400 mg이라는 문장도 있고, Blackwell은 성우 400 mg·송아지 100~200 mg 피하로 적어 책마다 다르다. 구리 이나트륨 에데테이트는 송아지에서 간괴사로 죽은 예가 있다. 구리 칼슘 에데테이트는 흡수가 빨라 과량 시 독성, 국소 반응, 소에서 기종저 유발 위험이 조금 있다.</span><span class="hang">서방형: 산화구리 침상 캡슐(산화구리 39%)은 성우 20 g·송아지 10 g, 현재 육우 권고는 200 kg 미만 10 g, 초과 20 g으로 최소 6개월 보호한다(Constable). Blackwell은 송아지 Cu 12.5 g, 500 lb 이상 25 g이다. 유리 볼루스(구리 13.4%·코발트 0.5%·셀레늄 0.3%)는 100 kg 초과 소에 2개(100 g), 최대 8개월 방출한다.</span><span class="hang">목초에 황산구리 5~10 kg/ha 살포하면 3주 또는 첫 큰비까지 방목을 쉬어야 한다. 갓 태어난 송아지는 간 저장이 있어 6주령까지 대개 필요 없고, 임신우는 임신 마지막 3분의 1에 맞춰 보충한다. 젖소는 과잉 보충으로 구리 중독·잠재성 간병증이 늘고 있으므로 결핍이 확인되지 않으면 보충하지 않는다. 상세 중독은 중독 탭 몫이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">70.</span><span>셀레늄·비타민E 결핍 — 질환과 원인<span class="hang">셀레늄은 30여 셀레늄단백질(글루타티온과산화효소 등)의 구성 요소로 항산화, 갑상선 호르몬 T4→T3 전환, 번식, 면역에 관여한다. 비타민E는 지용성 막 항산화제다. 다불포화지방산이 많은 사료는 조건성 비타민E 결핍을 만든다.</span><span class="hang">송아지 영양성 근이영양증(백근병, 익숙하지 않은 운동으로 촉발), 소의 분만 문제·후산정체·자궁염, 난소낭종, 초기 배아사망, 유방염 저항성 저하와 관련된다. 셀레늄 반응성 질환(발육부진·번식 저하)은 근거가 덜 확실하다. 백근병 상세는 근골격·주산기 탭에서 다룬다.</span><span class="hang">Bovine Medicine: 잠재성으로 발육부진, 설사·폐렴·사산·후산정체·유산·번식 저하 증가. 감별은 구리·코발트 결핍, 영양불량, 만성 기생충증이다.</span><span class="hang">한우컨설팅 후산정체 예방 시험: 대조 30%, 비타민E 500 IU 27%, 셀레늄 40 mg 20%, 병용 13.3%. 한우번식우 자료는 분만 2~3주 전 셀레늄 보충급여나 주사로 후산정체를 예방할 수 있다고 한다.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>진단 기준치<table class="bxt"><tr><th>소</th><th class="c">적혈구 GSH-Px(µmol/분/g Hb)</th><th class="c">혈청 Se(µg/mL)</th><th class="c">간 Se(µg/g 건조)</th></tr><tr><td>정상</td><td class="c">19.0~36.0</td><td class="c">0.08~0.30</td><td class="c">0.90~1.75</td></tr><tr><td>한계</td><td class="c">10.0~19.0</td><td class="c">0.03~0.077</td><td class="c">0.45~0.90</td></tr><tr><td>결핍</td><td class="c">0.2~10.0</td><td class="c">0.002~0.025</td><td class="c">0.07~0.60</td></tr></table><span class="hang">전혈 셀레늄 50 ng/mL 미만 결핍, 50~100 한계, 100 초과 적정. 전혈 GSH-Px 30 mU/mg Hb 미만 결핍, 30~60 한계, 60 초과 적정. 정상 성우 혈청 70~100 ng/mL, 신생 송아지 50~80 ng/mL. 신피질 3.5~5.3 µg/g 건조 적정, 0.6~1.4 결핍.</span><span class="hang">Rebhun: 전혈 셀레늄 5.0 µg/dL 미만과 GSH-Px 20 U/g Hb 미만이 백근병과 관련되며, CK는 1000~10,000 IU/L 초과로 오른다.</span><span class="hang">GSH-Px는 적혈구 생성 때만 셀레늄이 들어가므로 투여 후 4~6주 지나야 오른다. 혈청 셀레늄이 더 빨리 반응한다. 집합유 셀레늄은 군 상태를 저비용으로 반영한다. 사료 0.1 mg/kg 건물이 적정, 토양 0.5 mg/kg 미만은 부족 작물을 낸다.</span><span class="hang">비타민E: 혈청 토코페롤 2 mg/L 미만이 임계치, 간 5 mg/kg 생중량 미만이 소의 임계치다. 분만 전후 혈장 알파토코페롤은 약 3 µg/mL를 목표로 한다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>보충<span class="hang">사료 셀레늄 요구량은 0.1 mg/kg 건물이다. 미국 낙농 완전사료 법정 상한은 0.1에서 0.3 mg/kg 건물로 올랐고, 비유·임신 젖소는 5~7 mg/일 섭취로 혈청 70~100 ng/mL를 목표로 한다. 셀레늄 보충 농후사료를 먹이면 추가 주사는 필요 없다. 셀레늄 효모가 아셀렌산나트륨보다 혈중·조직 농도를 더 높인다.</span><span class="hang">임신 중 어미에게 셀레늄 0.1 mg/kg 건물과 알파토코페롤 1 g/두/일을 주면 송아지 근이영양증을 대개 예방한다. 어린 육우에는 셀레늄 0.1 mg/kg 건물과 알파토코페롤 150 mg/두/일. 소금·광물질 혼합물에 셀레늄 14.8 mg/kg·비타민E 2700 IU/kg을 임신 후반 3분의 2와 비유 첫 달에 자유 급여하거나, 90 mg/kg 혼합물을 연중 주면 효과가 있었다(30 mg/kg은 부족).</span><span class="hang">주사: 표시 용량 0.055 mg Se/kg은 근이영양증 치료에는 충분하지만 결핍 사료를 먹는 소의 장기 보충에는 부족하다. 아셀렌산나트륨 근육주사 후 송아지 간 농도는 23일에 원래대로 돌아온다. 셀렌산바륨 1 mg Se/kg 피하는 4주 안에 GSH-Px를 올려 최대 5개월 유지한다. 시판 셀레늄·비타민E 주사제는 대개 비타민E가 부족하다. 경구 아셀렌산나트륨은 약 0.044 mg/kg이다.</span><span class="hang">비타민E: 건유 60일 저장 조사료 급여 소는 보충 비타민E 약 1.6 IU/kg 체중(약 80 IU/kg 건물섭취), 비유우는 0.8 IU/kg(약 20 IU/kg)이다. 셀레늄이 충분할 때 건유우에 1000 IU/일 급여가 후산정체를 줄였다. 분만 1주 전 3000 IU 피하주사는 비타민E가 낮은 소에서만 후산정체를 줄였다.</span><span class="hang">소의 셀레늄 중독량은 0.25~0.5 mg/kg 체중이다. 상세 중독은 중독 탭에서 다룬다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">73.</span><span>요오드 결핍과 갑상선종 — 원인<span class="hang">원발성 섭취 부족(바다 요오드가 보충되지 않는 내륙, 비가 많아 씻겨 나가는 토양, 부식질 적은 석회 토양)과 조건성(고칼슘 섭취, 배추속 식물 위주 사료, 사료·음수의 심한 세균 오염)이 있다. 요오드는 주로 흙 섭취로 들어오므로 목초가 무성하면 오히려 부족해질 수 있다.</span><span class="hang">배추속(케일, 순무, 스웨덴순무, 유채)의 글루코시놀레이트가 반추위에서 티오시아네이트를 만들어 갑상선 요오드 섭취를 막는다. 백클로버의 시안배당체, 아마박의 리나마린, 대두 부산물도 갑상선종 유발성이다. 일본에서는 Rorippa indica를 먹은 육우의 송아지에서 미만성 증식성 갑상선종이 생겼다.</span><span class="hang">요오드 과다 섭취도 신생자와 성축에서 갑상선종을 일으킬 수 있다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>임상과 진단<span class="hang">가장 흔한 표현은 사산과 허약 신생 송아지다. 소에서는 성우 갑상선 비대가 드물고, 신생 송아지의 현저한 갑상선 비대와 허약이 주증이다. 며칠 포유를 도와주면 대개 회복하지만 궂은 날씨에 방목지에서 태어나면 많이 죽는다. 갑상선이 커서 호흡을 막기도 한다. 부분 탈모는 드물다.</span><span class="hang">요오드 결핍성 사산에서는 임신 기간이 정상보다 길어지는 경향이 있다. 수소 성욕 저하, 암소 발정 미약, 유산·사산·허약 송아지가 갑상선기능저하 표현으로 제시된다. Bovine Medicine은 성우의 유량·번식 저하, 후산정체 증가, 수소 정액 품질 저하도 든다.</span><span class="hang">혈청 요오드·T4·T3로 상태를 정확히 판단하기 어렵다. 갑상선종 송아지는 TSH가 높고 T4/T3 비가 낮아, TSH 측정이 안 되면 T4/T3 비로 신생 송아지 갑상선기능저하를 진단한다. Blackwell은 T4 50 nmol/L 초과 정상, 20 nmol/L 미만 이상으로 두며 비유 초기에는 훨씬 낮다고 한다. 집합유 요오드는 300 µg/L를 넘어야 한다.</span><span class="hang">부검 갑상선 무게: 만삭 정상 송아지 평균 6.5 g, 심한 비대는 20 g 초과. 출생 시 갑상선 요오드 0.03%(생중량, 건조 0.1%)가 임계치다. 감별은 감염성 유산, 허약 송아지 증후군, 선천 기형, 셀레늄·코발트 결핍, BVD다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>요구량과 보충<span class="hang">권장 섭취량: 비유·임신우 0.8~1.2 mg/kg 건물, 비임신우·송아지 0.1~0.3 mg/kg 건물(Constable). Rebhun은 비유·건유우 0.6~0.8 mg/kg 건물을 든다. 갑상선종 유발 사료가 25% 이상이면 1.0 ppm으로 올린다(Blackwell).</span><span class="hang">소금에 요오드산칼륨 200 mg/kg 소금으로 넣는다. 요오드화칼륨 단독은 불안정해 부적합하고 스테아르산칼슘을 섞어야 한다. 요오드산칼슘, 에틸렌디아민 디하이드로요오다이드는 안정하다.</span><span class="hang">개체 예방: 요오드팅크 옆구리 안쪽 주 1회 도포(소 4 mL), 요오드화 기름 근육주사. 착유우에 요오드 2370 mg/회를 비유 시작과 100일 간격으로 근육주사하자 우유 요오드가 올랐으나 갑상선 호르몬과 유량에는 영향이 없었다. 78% 에티오다이즈드 오일 1 mL 주사는 70일 넘게 결핍을 막았다. 반추위 서방형 볼루스는 6개월 방출한다.</span><span class="hang">발생 시 치료의 중심은 임신 어미에게 요오드를 추가하는 것이다. 갑상선종 송아지에게는 젖꼭지에 요오드팅크를 바르는 방법이 있다(Blackwell).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">76.</span><span>코발트 결핍<span class="hang">코발트 결핍은 반추위 미생물의 비타민B12 합성을 막아 프로피온산 대사(메틸말로닐CoA 경로)를 방해한다. 코발트 결핍 토양에서 보충 없이 방목하는 소·양에 생기고, 양과 어린 동물이 더 감수성이다. 목초 0.04 mg/kg 건물 미만에서 소에 임상 질병이 온다. 망간이 많은 토양과 과도한 석회 살포가 식물 이용률을 떨어뜨린다.</span><span class="hang">진행성 식욕부진, 서서히 체중 감소, 이식, 점막 창백(정구성 정색소성 빈혈), 유루, 유량·번식 저하. 케토시스 발생 증가와도 관련된다. 감별은 단백·에너지 결핍, 장내 기생충, 구리 결핍, 요네병이다.</span><span class="hang">진단: 소 혈청 B12 0.2 µg/L 초과면 정상이지만 실험실 차이가 커서 간 B12가 낫다. 방목우 간 B12 75~250 nmol/kg 생중량은 한계다. 혈청 메틸말로닐산 2 µmol/L 미만 정상, 2~4 한계, 4 초과 결핍(Constable). Rebhun은 간 B12 0.3 mg/kg 초과 정상, 0.1 mg/kg 미만 결핍, Blackwell은 간 B12 0.3 µg/g 생중량 이하, 혈청 B12 0.1 ng/mL 미만, 메틸말로닐산 4 µmol/L 초과면 보충 이득 가능, 13 초과면 이득 기대로 본다. 지방간은 간 B12를 낮게 보이게 한다.</span><span class="hang">치료: 경구 코발트 또는 B12 근육주사. 소 치료 용량은 정확한 자료가 없으나 예방량의 10배면 효과적일 것이라고 한다. Blackwell은 코발라민 3000 µg 근육(필요 시 주 1회 반복), 황산코발트 1 mg/kg 경구를 든다. Rebhun은 B12 근육·피하 또는 코발트 1 mg 경구 하루 1회를 든다.</span><span class="hang">예방: 사료 코발트 약 100 µg/kg 건물, 최대 B12를 위해서는 소 250 µg/kg 건물. 소에 0.3~1.0 mg/일을 소금·광물질로 준다. 산화코발트 90% 펠릿(소 20 g)은 제2위에 머물며 1~3년 방출하고, 반추위가 발달하지 않은 2개월 미만 송아지에게는 주지 않는다. 송아지는 코발트 원소 약 40~45 mg/50 kg/일에서 중독 증상이 온다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">77.</span><span>아연 결핍<span class="hang">아연이 적은 토양, pH 6.5 초과 토양, 질소·인 다비, 미성숙 목초·늦게 벤 건초, 과잉 황, 사일리지 흙 오염이 원인이다. 고구리·고철도 이용을 떨어뜨린다(Bovine Medicine). 쇼트혼 유전성 부전각화증, 홀스타인·흑백 덴마크종 유전성 아연 결핍이 있다.</span><span class="hang">주둥이·귀·꼬리 기부·뒷다리·옆구리·목·외음부·항문 주위의 부전각화증과 탈모(심하면 피부 40%), 경직 보행, 관굽 부종, 발육부진. 치료 후 1주에 호전, 3주에 완치된다. Bovine Medicine은 번식 저하, 분만 후 출혈 지연, 정액 품질 저하, 감염·파행 증가, 상처 치유 지연도 든다.</span><span class="hang">혈청 아연 정상 80~120 µg/dL(12.2~18.2 µmol/L), 결핍 송아지는 18 µg/dL(3.0 µmol/L)까지 낮다. 젖소 혈청 아연 9.7 µmol/L 미만은 유방염 소인 변화 위험이 높다. 피부 생검으로 부전각화증을 확인하며 감별은 개선충증이다.</span><span class="hang">송아지는 40 mg/kg 아연 사료에서 건강했고, 아연 20~80 mg/kg(정상 93)·칼슘 0.6% 목초에서 부전각화증이 생겼다. Rebhun은 최소 요구량 40 ppm(건물)을 든다. 치료·예방은 사료에 아연을 더한다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>망간 결핍<span class="hang">원발성(지질적 결핍)과 고칼슘·고인 사료, 과도한 석회 살포에 따른 이용률 저하가 있다. 토양 망간 3 mg/kg 미만이면 정상 번식을 지탱하기 어렵다. 목초 80 mg/kg 미만은 정상 번식 불가, 50 mg/kg 미만은 흔히 불임·무발정과 관련된다는 기술이 있고, 사료 20 mg/kg 건물 미만은 무발정·수태율 저하·수소 정액 불량을 일으킬 수 있다. ARC는 40 mg/kg 건물이면 적정할 것으로 본다. 우유는 망간이 매우 적다.</span><span class="hang">소에서는 불임(발정 지연·미약, 수태율 저하), 사산, 주산기 손실, 선천성 사지 기형(구절 굴곡, 관절 비대, 다리 꼬임, 단지성 왜소증, 위턱 단축), 발육부진·털 건조·탈색이 보인다. 임신 중 16 mg/kg 건물 사료를 먹은 육성우의 송아지는 50 mg/kg군보다 출생체중이 낮고 기형이 있었다. 겨울 사사 봄 분만 육우에 망간 무보충 사일리지를 제한 급여한 뒤 기형 송아지가 났다(Bovine Medicine).</span><span class="hang">정상 소 혈액 망간 18~19 µg/dL, 간 12 mg/kg, 털 약 12 mg/kg(8 mg/kg 미만은 불임과 관련). 털 망간은 임신 중 떨어진다. 이 수치들은 진단 기준으로 쓰기에 아직 검증이 부족하다.</span><span class="hang">NRC 기준 700 kg 건유 말기 소는 약 14 mg/kg 건물 사료로 요구량을 충족한다. Rebhun은 사료 40 ppm을 든다. 치료·예방은 경구 보충이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>비타민A 결핍<span class="hang">비타민A나 전구체 카로틴이 부족한 사료를 장기간(3~6개월) 먹을 때 생긴다. 가뭄 때 마른 목초지 방목 육우, 녹색 조사료가 거의 없는 사료(사탕무 펄프·농후사료·저질 건초)를 먹는 사사 비육우에 생긴다.</span><span class="hang">야맹증, 비반응성 산동, 안구건조, 시신경 수축·변성에 따른 실명, 뇌척수액 압력 상승에 따른 경련, 운동실조, 성장 지연, 털 불량과 비듬, 번식 저하·사산, 선천성 결핍 송아지의 이마 돌출·수두증. 한우컨설팅도 비타민A 결핍에 의한 시신경 수축·변성, 안구건조증, 맹목을 들고 임신우 사료에 비타민제를 섞어 예방한다고 한다.</span><span class="hang">혈장 비타민A 20 µg/dL가 적정 최소치, 18 µg/dL 미만에서 유두부종, 소 정상 25~60 µg/dL, 5 µg/dL에서 임상 증상이 예상된다. 비육우 집단 발생에서 8.89~18.05 µg/dL는 체중 감소만, 4.87~8.88은 운동실조·실명, 4.88 미만은 경련·시신경 수축이었다.</span><span class="hang">치료는 유지 요구량의 10~20배, 대개 440 IU/kg 체중을 수용성 제제로 주사한다. 경련형 송아지는 48시간 안에 정상화되지만 시신경 손상으로 실명한 소는 회복하지 않는다. 비타민A·D 제제는 출하 2개월 안에 주지 않는다(Blackwell). 한우번식우 자료는 녹엽 건초·황색 옥수수로 비타민A를 급여하면 번식 간격이 단축된다고 한다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>비타민D 결핍과 구루병·골연화증<span class="hang">자외선 노출 부족과 사료 비타민D 부족이 겹칠 때 생긴다. 사료 보충으로 드물어졌지만 장기 사사 동물, 겨울철 어린 방목 동물에 생긴다.</span><span class="hang">식욕·증체 저하, 번식 저하, 어린 소의 구루병, 성우의 골연화증. 혈청 칼슘·인, 혈장 비타민D, 뼈 병리로 진단하며, 비타민D 비경구 투여와 경구 칼슘·인산을 준다.</span><span class="hang">비타민D 중독은 고칼슘혈증이 특징이며 혈청 비타민D 80 ng/mL 초과(Blackwell)를 기준으로 든다. 유열 예방용 고용량 비타민D3의 전이성 석회화 위험은 유열 항목 참조.</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>비타민B1(티아민) 결핍과 비타민B12<span class="hang">반추동물의 티아민 부족성 대뇌피질괴사는 곡류 위주 사료를 먹는 영양 좋은 어린 소, 티아미나아제 섭취, 과잉 황산염과 관련된다. 상세는 신경 탭 몫이다.</span><span class="hang">치료는 염산티아민 10 mg/kg을 천천히 정맥주사하고 3시간마다 같은 용량으로 총 5회(Constable). Blackwell은 10 mg/kg 1회 정맥 후 6~12시간마다 1일, 이후 12~24시간마다 3일 근육·피하로 준다. 정맥 일시 투여는 허탈을 일으킬 수 있다. 소의 황 섭취는 0.4% 이하로 유지한다.</span><span class="hang">B1 결핍 지표: 티아민이인산 첨가 후 적혈구 트랜스케톨라아제 활성 증가율, 혈중 티아민 50 nmol/L 미만, 반추위 내용물 티아미나아제 활성(Blackwell).</span><span class="hang">비타민B12 결핍은 코발트 결핍 항목을 따른다. B12 결핍 시 대구성~정구성 정색소성 빈혈, AST·GGT 상승이 올 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">82.</span><span>소의 내분비 질환 — 갑상선<span class="hang">선천성 갑상선기능저하증: 티로글로불린 생산 결함에 의한 유전성 갑상선종이 아프리칸더 소에서 상염색체 열성으로 유전된다. 요오드 티로신을 너무 빨리 탈요오드화하는 효소 활성 증가가 원인이다. 성장 불량, 성긴 털, 점액수종, 쇠약을 보이며 대부분 생후 곧 죽는다. 선택 교배로 예방한다.</span><span class="hang">요오드 결핍성 갑상선종은 요오드 항목 참조. 성우 갑상선 호르몬 참고치: 혈장 T4 육우 64(31~97) nmol/L, 젖소 56(25~91) nmol/L, TSH 1.3~15.5 µU/mL(육우)·1.3~9.2(젖소). 송아지 T4 241(84~283) nmol/L이다.</span><span class="hang">저T3 증후군: 젖소에서 낮은 T3가 난소 기능과 케토시스·유방염·자궁내막염 같은 분만 후 질병에 관여할 수 있다(Blackwell). 갑상선 호르몬 해석은 어렵다.</span><span class="hang">수소의 갑상선 C세포 선종·암종은 고칼시토닌혈증과 골경화증을 일으키며 사료의 과잉 칼슘·비타민D와 관련된다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">83.</span><span>당뇨병과 기타 내분비 질환<span class="hang">소의 당뇨병은 드물다. 췌장 병변에 의한 인슐린 분비 부족이 기술되어 있고 무열성 쇠약, 다음, 케톤뇨, 당뇨, 고혈당을 보인다(Constable). 대개 1형이고 원인이 밝혀지지 않으며 조직학적으로 췌도 베타세포가 없다. 구제역 회복 후 당뇨병이 보고되었다(LAIM).</span><span class="hang">고혈당 감별: 포도당 투여, 내독소혈증 초기, 근위 십이지장 폐색, 자일라진·데토미딘, 의인성 부신피질 기능항진, 유열 장기 경과(인슐린 분비에 칼슘 필요), 지방간 말기.</span><span class="hang">뇌하수체 전엽 무형성: 건지·저지의 유전 결함으로 태아 부신피질 형성부전, 임신 7개월 이후 태아 발육 정지, 최대 11개월 장기 재태가 온다. PGF2α와 덱사메타손으로 처치한다(Blackwell). 뇌하수체 농양은 산발적이며 수막염·뇌염에 따른 신경 증상을 일으킨다.</span><span class="hang">에스트로겐성 식물(클로버, 알팔파) 섭취에 의한 고에스트로겐증은 불임·자궁경관 확장 실패와 관련이 의심된다. 고능력 젖소는 간 대사 증가로 에스트라디올·프로게스테론이 생리 수준 아래로 떨어져 발정 발현 저하와 초기 임신 손실이 늘어난다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">84.</span><span>비만·저BCS 관리 — BCS 평가<span class="hang">체중만으로는 체 저장을 알 수 없다. 같은 체중에서도 에너지 저장이 40%까지 다르고, 비유 초기 소화관 충만이 조직 감소를 가린다. BCS와 해부한 체지방 비율의 상관(R2)은 0.86이다.</span><span class="hang">미국·캐나다·아일랜드는 5점, 호주 8점, 뉴질랜드 10점 척도를 쓴다. 5점 척도에서 1은 꼬리 기부에 구멍이 있고 지방이 만져지지 않으며 횡돌기 끝이 날카롭다. 3은 꼬리 기부 전체에 지방이 쉽게 만져지고 횡돌기는 눌러야 만져지며 요부에 약간 함몰이 있다. 5는 꼬리 기부가 지방에 묻히고 골반이 단단히 눌러도 만져지지 않는다.</span><span class="hang">한우번식우 자료도 5단계(체지방 축적 정도)로 평가하며 갈비뼈·요각골·관골·좌골·등심·흉수와 허벅지 살집을 본다. 낮은 BCS(2.0 미만)는 난소 기능 위축, 3.5 이상은 난소 기능 정지와 관련된다고 정리되어 있다(OCR 표).</span></span></p><p class="bx-num"><span class="bxn">85.</span><span>BCS 목표와 체형 변화<span class="hang">분만~첫 수정 BCS 0.5~1.0점 감소 소는 첫 수정 임신율 53%, 1.0점 초과 감소는 17%였다. 분만에서 첫 수정까지 감소를 0.5점으로 제한하라고 한다. 계절 방목 홀스타인은 번식기 BCS 2.75 이상을 유지한다.</span><span class="hang">건유 시 BCS 약 3.0(전통적 3.5 대신)을 권한다(Constable). 분만 시 최적 BCS는 5점 척도 3~4 범위로 제시되나 확정되지 않았다. Bovine Medicine은 BCS 3.5 초과(과비)나 3.25 미만(저체형)을 조치 기준으로 두고 비유 정점, 150일, 건유, 분만에 평가한다.</span><span class="hang">Periparturient 케토시스 장은 분만 전 BCS 2.5~3.0이 이상적이고 3.25 초과는 지방 동원·케토시스 위험을 높인다고 하는 반면, 같은 책 지방간 장은 비유 후기 3.0~3.5, 건유 3.5~4.0, 분만 3.5~4.0, 비유 정점 2.5~3.0을 권해 장마다 다르다.</span><span class="hang">한우: 초종부 시 BCS 2.5~3.0, 임신 초·중기 2.5~3.0, 말기 3.0~3.5(농후사료 급여량으로 조정), 임신 말기 사료 25% 증량(한우번식우 자료). 임신 말기 BCS 3.5 내외 유지(한우컨설팅, 기립불능 예방).</span><span class="hang">과비는 유열(BCS 4/5 초과 위험비 4.3)·케토시스·지방간·기립불능우 위험을 높이고, 저체형은 발정 재귀 지연과 번식 저하를 부른다. 건유기 체형 감소도 케토시스·후산정체·자궁염 위험을 높인다.</span></span></p><p class="bx-num"><span class="bxn">86.</span><span>에너지·단백 결핍(영양불량)<span class="hang">에너지 결핍은 가장 흔한 생산 제한 영양 결핍이다. 사료 부족(과방목, 가뭄, 적설)이나 저질 사료가 원인이다. 어린 소는 성장·춘기발동 지연, 성우는 유량 감소, 체중 감소, 장기 무발정이 오고, 임신 말기 결핍은 초유 생산 부족과 허약 송아지를 낳는다. 혹한기 저질 조사료 섭취는 제4위 식체를 일으킨다.</span><span class="hang">단백 결핍은 대개 에너지 결핍과 함께 오며 혈색소·PCV·총단백·알부민 저하, 말기 부종이 생긴다.</span><span class="hang">임신 말기 육우의 단백·에너지 영양불량: 쇠약, 와위, 현저한 체중 감소, 정상 의식과 식욕. 저칼슘혈증이 겹치면 식욕을 잃는다. 분만 시 초유가 없어 송아지가 어미를 세게 빨고 오줌을 마시며 계속 운다. 7~10일 안에 어미·송아지가 죽을 수 있다.</span><span class="hang">치료는 비용·회복 기간 때문에 잘 하지 않으며, 양질 사료 공급이 가장 비용효과적이다. 나이·임신·생산 단계·기온에 맞춘 급여, BCS 감시, 정기 사료 분석으로 예방한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">87.</span><span>저칼슘·DCAD·요오드 — 번식학 영양 탭에서 옮긴 보충 · 저칼슘혈증 기여 요인<span class="hang">분만 전 과도한 사료 칼슘(건물 1.35%), 과도한 인, 낮은 마그네슘, 고령, 품종(저지 위험↑).</span></span></p><p class="bx-num"><span class="bxn">88.</span><span>합성 제올라이트(X-Zelit)<span class="hang">분만 전 Ca·P·Mg를 결합하는데 저자 경험상 산증 유도보다 저칼슘·저인산 예방에 더 효과적이었고, 쓸 때는 마그네슘(건물 0.45~0.50%)과 보호형 미량영양소를 추가해야 한다.</span></span></p><p class="bx-num"><span class="bxn">89.</span><span>음이온염 대체 원료<span class="hang">산(염산·유기산) 처리 단백질 담체 상업 원료도 쓴다.</span><span class="hang">springing heifer 사료의 나트륨·칼륨 농도는 분만 후 유방부종 원인이므로 주의한다.</span></span></p><p class="bx-num"><span class="bxn">90.</span><span>갑상선기능저하 원인<span class="hang">요오드 낮은 조사료·물, 셀레늄 결핍, 갑상선종 유발 식물 섭취, 유전(Afrikaner). 갑상선이 커져 30g을 넘기도 하며, 요오드 결핍 사료와 고칼슘 섭취가 모두 연루된다.</span><span class="hang">요오드 결핍은 태아 과형성 갑상선종으로 나타나 허약·탈모·사산·유산 송아지와 연관된다.</span></span></p></div>
</div>
`;
}
function med_mammHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 유방</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>유방염 총론 — 정의<span class="hang">원인과 관계없이 유선 실질에 생긴 염증이다. 우유의 변색·응괴·다량의 백혈구가 대표적 변화이고, 임상형은 종창·열감·통증·부종을 동반한다.</span><span class="hang">상당수가 촉진이나 스트립컵으로 알 수 없는 준임상형이어서 진단은 체세포수나 전해질 농도에 근거한 간접검사에 의존한다. 증가한 체세포는 거의 모두 호중구다.</span><span class="hang">임상형은 "이 우유를 마시겠는가"에 아니라고 답하는 상태로 정의하며, 새 증례는 최소 14일 간격으로 구분한다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>병원체 분류<table class="bxt"><tr><th>분류</th><th>주요 병원체</th><th>감염원·전파</th></tr><tr><td>전염성</td><td>황색포도상구균, Streptococcus agalactiae, Corynebacterium bovis, 마이코플라즈마</td><td>감염 분방 → 착유 시 손·공용 수건·라이너</td></tr><tr><td>유두 피부 기회성</td><td>코아굴라제 음성 포도상구균(CNS)</td><td>유두 피부 상재균의 상행 감염</td></tr><tr><td>환경성</td><td>S. uberis, S. dysgalactiae, 대장균, 클렙시엘라, 엔테로박터, Trueperella pyogenes</td><td>깔짚·분변 등 환경, 주로 착유 사이</td></tr><tr><td>드문 병원체</td><td>노카르디아, 파스튜렐라, 슈도모나스, 세라티아, 바실루스, 마이코박테리아, 진균·효모, 프로토테카</td><td>대개 산발, 오염된 주입제·물</td></tr></table><span class="hang">S. dysgalactiae는 전염성과 환경성 성질을 모두 가지며, Rebhun은 S. uberis도 두 성질을 보일 수 있다고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>역학·위험요인<span class="hang">임상형 연간 발생률은 대부분 목장에서 100두당 10~12건(16~65건인 곳도 있음), 유방내 감염 유병률은 소의 약 50%, 분방의 10~25%다. 전염성 병원체 유병률은 소의 7~40%이고, 환경성은 대장균형이 분방의 1~2%, 연쇄상구균이 5% 미만이다.</span><span class="hang">전염성 병원체를 관리한 목장에서는 임상형의 약 65%가 환경성이다.</span><span class="hang">개체 요인: 나이(7세 정점), 건유 초기와 비유 첫 2개월, 고능력, 유두 형태·상태 불량, 셀레늄·비타민 E 결핍, 분만 전후 질병. 체세포수가 낮은 목장일수록 임상형이 많다. 환경 요인: 축사·깔짚 관리 불량, 젖은 유두 착유, 착유기 진공 변동.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>경제적 손실<span class="hang">손실의 약 70%는 준임상형에 의한 유량 감소이고 나머지는 임상형의 치료비·폐기유·도태다. 임상형 1건 손실의 80% 이상은 폐기유와 유량 감소다.</span><span class="hang">SCS가 3을 넘어 1단위 오를 때마다 유량이 3~6%(경험칙 5%) 줄고 초산우 손실이 더 크다. 원유 SCC가 15만을 기준으로 10만 오를 때마다 목장 유량이 1.5~3.0% 준다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>유방염 임상 분류 — 세 범주와 등급<span class="hang">비정상 분비물(마실 수 없는 우유), 비정상 유방(다른 분방보다 크고 단단함), 비정상 개체(발열, 침울, 식욕·유량 감소)의 세 범주로 나누며 치료 방침의 기초가 된다.</span><span class="hang">중증도: 최급성(심한 염증과 현저한 전신 반응), 급성(심한 염증, 전신 반응 경미), 아급성(가벼운 염증, 우유 이상 지속). 경과: 단기형(대장균, 클렙시엘라), 재발형(황색포도상구균, S. dysgalactiae), 지속형(S. agalactiae, M. bovis).</span><span class="hang">Rebhun의 3단계는 경증(우유 이상만), 중등도(+분방 통증·종창), 중증(+39℃ 이상 발열, 식욕부진, 반추 저하, 탈수)이며 중증은 전체의 10~15%다.</span><span class="hang">Bovine Medicine의 4등급: 1등급 앞젖 응괴 5개 미만, 유방·개체 정상 / 2등급 응괴 5개 이상 또는 다음 착유까지 지속 / 3등급 우유 전체에 응괴, 유방 열감·경결·통증 / 4등급 여기에 침울·기립불능, 체온 상승 또는 저하.</span><span class="hang">임상 소견으로 원인균을 맞히는 정확도는 약 70%에 그쳐 원인별 치료에는 배양이 필요하다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>분비물 검사와 유방 촉진<span class="hang">검은 판 스트립컵으로 분방끼리 비교하며, 두 분방 우유가 섞이지 않고 줄무늬처럼 갈라지면 한쪽 감염을 시사한다. 묽음이 2~3줄기 이상 지속되면 이상이고 응괴·박편은 작아도 항상 의미가 있다. 혈액 응괴와 분만 직후 밀랍 마개는 의미가 적다.</span><span class="hang">건유 중 정상 분비물은 우유 → 맑은 액 → 꿀 같은 액 → 초유로 바뀌며 분방 간 차이가 크면 감염을 의심한다.</span><span class="hang">촉진은 착유 직후가 가장 좋고 쌍을 이루는 분방을 동시에 비교한다. 만성형은 미만성 또는 국소 섬유화(완두콩~주먹 크기) 뒤 위축되는데, 위축 분방이 정상으로, 정상 분방이 비대한 것으로 보일 수 있다. 유두 끝과 유방상 림프절도 확인한다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>전신 반응<span class="hang">독혈증, 발열, 빈맥, 빈호흡, 반추위 운동 저하, 침울, 기립불능이며 주로 대장균, 클렙시엘라, T. pyogenes, 때로 연쇄상구균·포도상구균에서 보인다. 통증으로 양 비절 간격이 넓어지고 진단 5일 전부터 채식량이 하루 약 1.2 kg 준다.</span><span class="hang">유량 감소는 T. pyogenes가 가장 크고 환경성 연쇄상구균과 CNS가 가장 작다. 도태 위험은 황색포도상구균이 가장 높다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">8.</span><span>체세포수(SCC) — 해석<span class="hang">건강 분방은 10만 cells/mL 미만이며 분방 단위 감염 판정 기준으로 쓴다. 세균 음성, 소병원체, 주병원체 감염 분방 평균은 6.8만, 13만, 35만 이상이다.</span><span class="hang">합유 시료는 희석되므로 20만 미만을 비염증 기준으로 잡는다. Bovine Medicine 고특이도 목표는 경산우 15만, 초산우 10만 미만이다.</span><span class="hang">영향 요인: 감염 분방 수, 병원체(S. agalactiae가 황색포도상구균보다 반응이 강함), 나이, 비유 단계(분만 직후 며칠·비유 말기에 높음), 유량. 분만 직후 값은 신뢰할 수 없고 비감염우는 2주 안에 낮아진다.</span><span class="hang">SCS = log2(SCC/100,000) + 3이며 1단위마다 SCC가 두 배가 된다(SCS 2 = 5만, 3 = 10만, 4 = 20만, 5 = 40만, 6 = 80만, 7 = 160만, 9 = 640만).</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>원유(집유조) 체세포수<table class="bxt"><tr><th>원유 SCC(cells/mL)</th><th class="c">감염 분방(%)</th><th class="c">생산 손실(%)</th></tr><tr><td>200,000</td><td class="c">6</td><td class="c">0</td></tr><tr><td>500,000</td><td class="c">16</td><td class="c">6</td></tr><tr><td>1,000,000</td><td class="c">32</td><td class="c">18</td></tr><tr><td>1,500,000</td><td class="c">48</td><td class="c">29</td></tr></table><span class="hang">감염 두수는 알 수 없지만 감염 분방 비율은 꽤 정확히 추정된다. 30만을 넘으면 개체 검사가 필요하다. EU 기준은 3개월 기하평균 40만 이하, Bovine Medicine 목표는 10~15만이다.</span><span class="hang">탱크를 5~10분 교반 후 위쪽에서 채취하고, 3개월 이동평균으로 판단한다.</span><span class="hang">황색포도상구균은 목장의 50%가 감염될 때까지 원유 SCC가 크게 오르지 않을 수 있으나, S. agalactiae는 소수 감염우로도 SCC와 세균수가 급등한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>캘리포니아 유방염 검사(CMT)<span class="hang">가장 신뢰할 만하고 저렴한 우측 검사다. 세제가 세포핵 DNA와 겔을 만들고 지시약이 pH 상승(정상 약 6.6, 유방염 6.8 이상)을 나타낸다. 섞은 뒤 15초 안에 판정하며 분만 첫 주와 비유 말기에는 강양성일 수 있다.</span><table class="bxt"><tr><th>판정</th><th>반응</th><th class="c">해당 SCC</th></tr><tr><td>음성</td><td>걸쭉해지지 않음</td><td class="c">0~20만</td></tr><tr><td>미량</td><td>기울이면 약한 점액</td><td class="c">15만~50만</td></tr><tr><td>1+</td><td>뚜렷한 점액, 가장자리 덩어리 없음</td><td class="c">40만~150만</td></tr><tr><td>2+</td><td>가장자리로 모여 바닥이 드러남</td><td class="c">80만~500만</td></tr><tr><td>3+</td><td>표면이 볼록하게 솟음</td><td class="c">500만 초과</td></tr></table><span class="hang">민감도를 원하면 미량 이상, 도태 결정처럼 특이도를 원하면 1 이상을 양성으로 읽는다. 초유에도 쓸 수 있다.</span><span class="hang">기타 간접검사로 NAGase(SCC만큼 정확), 전기전도도(CMT보다 부정확)가 있다. 간접검사는 감염이 아니라 염증을 검출한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>배양 진단 — 채취와 해석<span class="hang">더러운 유두는 씻어 완전히 말리고, 70% 알코올 솜으로 유두 끝을 문지른 뒤 첫 2~3줄기를 버리고 받는다. 용기는 비스듬히 들고, 지연되면 냉장·냉동한다. 냉동은 T. pyogenes·대장균 수를 줄이고 CNS는 늘린다.</span><span class="hang">10 µL 접종에 1 CFU 이상이면 감염으로 정의하는 것이 합리적이며, 3종 이상 분리되면 오염 시료다. 이 기준의 민감도/특이도는 황색포도상구균 90/99.8%, 대장균 77/99.9%, CNS 61/84%, 연쇄상구균 29/95%다.</span><span class="hang">치유는 처음 균이 14, 21, 28일 뒤 모두 음성인 것, 신규 감염은 이때 양성이 되거나 다른 균으로 바뀐 것이다.</span><span class="hang">바이플레이트·트라이플레이트·페트리필름 등 선택배지로 그람양성·음성·무성장을 구분해 치료를 정한다. PCR은 민감하나 생균 여부와 감수성을 모른다.</span><span class="hang">임상형의 15~40%는 무성장이며 대부분 그람음성균의 경미한 감염으로 본다. 원유 배양은 S. agalactiae·황색포도상구균에 특이도가 높고 민감도가 낮다(1회 S. agalactiae 21~77%, 황색포도상구균 9~58%, M. bovis 33%).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>황색포도상구균 유방염 — 원인·역학<span class="hang">대표적 전염성 병원체로 목장의 50~100%가 감염되어 있을 수 있다. 저SCC 목장은 소의 1~10%, 고SCC 목장은 50%까지, 분방 10~25%가 감염되며 대부분 준임상형이다.</span><span class="hang">주 감염원은 감염 분방이고 착유자 손과 라이너로 퍼진다. 뿔파리는 유두 끝 딱지가 있는 미경산우에 전파하고, 송아지는 유방염 우유를 먹은 뒤 교차흡유로 감염될 수 있다(Rebhun).</span><span class="hang">유두 끝 찰과·튼살, 산차 증가, 분만 전후 질병이 위험요인이며 CNS나 C. bovis 감염 분방은 덜 걸린다.</span><span class="hang">기전: 상피 내재화, 미세농양, 세포내 생존, L형 전환, 바이오필름이 낮은 치유율의 원인이다. 세균 배출과 SCC가 반대 주기로 오르내리는 주기적 배출이 특징이다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>임상증상<span class="hang">만성·준임상형이 가장 흔하고 손실이 크다. 서서히 경결·위축이 진행하고 가끔 응괴나 묽은 앞젖이 보이며 SCC·CMT가 높다.</span><span class="hang">급성형은 드물고 비유 초기에 생기며 화농성 우유와 심한 섬유화를 남긴다.</span><span class="hang">최급성(괴저)형은 대개 분만 후 며칠 안이며 치명적이다. 41~42℃, 심박 100~120회/분, 완전 식욕부진, 반추 정지, 기립불능, 같은 쪽 파행. 분방이 푸르게 변해 24시간 안에 검어지고 장액·피하기종·물집이 생기며 경계선이 뚜렷하다. 분비물은 냄새·응괴 없는 소량의 혈양액이다. 살아도 분방은 잃고 6~7일 뒤 분리되기 시작한다.</span><span class="hang">정맥 혈전과 α독소가 괴사를 일으키며 대장균·클로스트리듐 2차 감염이 가스와 악화에 관여한다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>진단·감별<span class="hang">주기적 배출 때문에 반복 배양이 필요하다. 단일 분방 시료로 약 75%, 2회 94%, 3회 98%가 검출된다(Rebhun). 합유 시료 민감도는 53%까지 낮다. 이중 용혈 또는 튜브 코아굴라제 양성으로 확인한다.</span><span class="hang">SCC(합유 민감도 31~54%)와 CMT는 선별에 부족하나 linear score 4.5 이상인 소가 분방 배양 1순위다(Rebhun).</span><span class="hang">최급성형은 유열과 혼동되지만 유열은 유방이 정상이고 칼슘에 빨리 반응한다. 대장균형 최급성 유방염이 훨씬 흔하고 괴저는 드물다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>치료 — 비유기<span class="hang">세균학적 치유율은 50%를 넘기 어렵다. 준임상형의 비유기 치료는 대개 비경제적이어서 건유기로 미루되, 비유 초기에 감염된 미경산우는 치료를 시도한다.</span><span class="hang">치유율이 높은 경우: 감염 2주 미만(최대 70%), 48개월령 미만(81%, 96개월령 초과 55%), 1분방 감염(다분방의 2배), 앞 분방, 낮은 SCC, β-락타마제 비생성 균주, 긴 치료 기간(Rebhun).</span><span class="hang">권장은 유방내+전신 병용 또는 4~8일 연장 유방내 치료다. 페니실린 감수성 균주에는 페니실린 G, β-락타마제 생성이 흔하므로 초기 치료로 클록사실린+암피실린이 선호된다(Constable).</span><table class="bxt"><tr><th>유방내(24시간 간격, 별도 표기 없으면 3회)</th><th class="c">용량</th></tr><tr><td>클록사실린 나트륨</td><td class="c">200~600 mg</td></tr><tr><td>페니실린+스트렙토마이신</td><td class="c">100,000 U + 250 mg</td></tr><tr><td>노보비오신</td><td class="c">250 mg</td></tr><tr><td>세프퀴놈</td><td class="c">75 mg</td></tr><tr><td>피를리마이신 연장요법</td><td class="c">50 mg, 8일</td></tr></table><span class="hang">기대 임상 치유율은 27~60%다. 아목시실린 62.5 mg 유방내 + 프로카인 페니실린 G 900만 U 근육주사는 준임상 감염 치유율을 약 50%로 높였다. 페니실린 감수성 균주의 전신+유방내 페니실린 G 치유율 76%, β-락타마제 생성 균주의 아목시실린-클라불란산 29%였다.</span><span class="hang">Rebhun은 유방내 약을 12시간 간격 최소 4회 쓰고, 세프티오퍼+피를리마이신 병용이 단독보다 낫다고 쓴다. 치료우는 마지막에 착유하거나 착유컵을 200 ppm 요오드로 소독한다.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>치료 — 최급성·괴저형<span class="hang">조기에 트리메토프림-설폰아마이드나 페니실린을 충분히 전신 투여한다. 페니실린은 첫 근육주사와 함께 결정 페니실린 정맥주사 후 4~6일간 높은 혈중농도를 유지한다(Constable). 유방내 주입은 확산되지 않아 가치가 낮다. Rebhun은 세프티오퍼나 테트라사이클린, 수액, 플루닉신을 쓴다.</span><span class="hang">대량 수액, 온습포 마사지, 짜내기를 한다. 옥시토신은 심한 염증 분방에 효과가 적다.</span><span class="hang">유두가 보랏빛이면 거세기로 유두를 절단해 배액하고, 유선만 괴사했으면 유선을 절개한다(Rebhun). Bovine Medicine은 안락사가 최선일 수 있다고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>건유기 치료·관리<span class="hang">건유기 치유율은 Constable에서 40~70%(평균 약 50%), 뉴질랜드 연구(LAIM)에서 85%(무처치 31%)이고, Rebhun은 80~85% 추정치가 지나치게 높을 수 있다고 본다.</span><span class="hang">치유 저하 요인: SCC 25만 초과(100만 초과 시 특히), 고령, 다분방 감염(0.6배), 뒤 분방, 건유 전 양성 비율 높음. 8세·3분방·SCC 230만이면 치유 확률 36%, 3세·1분방·SCC 70만이면 92%다. 낮은 소는 도태 대상으로 한다.</span><span class="hang">페니실린 내성 균주 목장은 다른 계열에서도 치유율이 낮아 도태가 낫다(Rebhun).</span><span class="hang">관리: 유두 끝 상태 개선, 착유 전 세척·건조, 장갑, 착유기 점검, 후침지(1% 요오드나 0.5% 클로르헥시딘, 5~10% 글리세린 함유, 신규 감염 50~65% 감소), 전두 건유 치료, 만성우 도태, 감염우 마지막 착유. 분방 감염률을 30%에서 10% 이하로 줄일 수 있다.</span><span class="hang">감염 분방을 포비돈 요오드로 영구 건유하는 방법도 있다. 백신은 현장 효과가 불만족스러워 일상 사용을 권하지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">18.</span><span>Streptococcus agalactiae 유방염 — 원인·임상<span class="hang">유선에만 사는 절대기생 전염성 병원체다. 관리 목장에서 소의 10% 미만, 미관리 목장은 50%까지 감염된다. 원유 SCC가 높은 목장의 가장 유력한 원인균이다.</span><span class="hang">감염 유방, 유두 상처, 손, 라이너, 공용 수건이 전파 경로이며 털·피부에서 3주까지 생존한다. 후침지와 건유 치료를 하지 않는 것이 핵심 위험요인이다. 감염 비유기 유량이 약 25% 준다.</span><span class="hang">소엽 단위 염증 위기가 반복되며 계단식으로 섬유화·기능 상실이 진행한다. 응괴가 보일 때는 이미 주요 손상이 끝난 뒤다.</span><span class="hang">반복되는 아급성~급성 발작이 전형이며 붓고 따뜻한 분방, 묽은 우유와 응괴를 보인다. 다분방 감염과 수백만의 SCC가 흔하다. 감염 초기에는 mL당 1억 마리까지 배출해 원유 세균수가 2만~10만 CFU/mL로 오를 수 있다.</span><span class="hang">CAMP 반응이나 라텍스 응집검사로 동정한다. 합유 시료로 충분하고 단일 배양 민감도·특이도는 95~100%다.</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>치료<span class="hang">유방내 치료에 매우 잘 들어 치유율 80~100%이며 전신 치료는 이점이 없다. 임상형·준임상형 모두 발견 즉시 치료하며 Rebhun은 네 분방 모두 치료한다. 무처치 자연 치유율은 25% 이하다.</span><span class="hang">프로카인 페니실린 G 100,000 U 유방내가 표준이며 장기작용 기제가 낫다(96% 대 83%). 페니실린 100,000 U + 노보비오신 150 mg은 89~98%다.</span><span class="hang">우유 내 농도를 72시간 유지해야 하므로 24시간 간격 3회를 권한다. 임상형은 3회, 검사로 찾은 준임상형은 1회로 한다. 에리스로마이신 300 mg 1회로 100% 치유가 보고되었다.</span><span class="hang">젠타마이신·네오마이신·폴리믹신 B는 효과가 낮고, 세프티오퍼 근육주사나 페네타메이트 5 g 근육주사는 유방내 치료만 못하다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>블리츠 요법·박멸<span class="hang">박멸이 가능하다. 전두 검사 후 양성우를 동시에 치료하고 반응 없는 소는 재치료나 도태한 뒤 위생 관리를 이어 간다.</span><span class="hang">수정 방식: 합유 SCC 50만 이상 군에 에리스로마이신 300 mg 유방내, 착유 두수가 가장 적을 때 전두 치료, 건유 때 클록사실린 500 mg + 암피실린 250 mg.</span><span class="hang">Rebhun: 유병률이 낮으면 도태가 가장 경제적이다. 아니면 감염우를 마지막에 착유하고 3주마다 전두 검사·치료를 반복하며, 두 번 치료해도 양성이면 도태한다. 원유는 매주 배양한다.</span><span class="hang">재유입은 감염우(분만 전 미경산우 포함) 도입이나 외부 착유자로 일어나므로 신규 도입우는 음성 확인 전까지 마지막에 착유한다.</span></span></p></div>
