d>20 mg/kg IM 단회 또는 반복</td></tr><tr><td>틸미코신</td><td>20 mg/kg SC 단회(Rebhun 10 mg/kg SC)</td></tr><tr><td>툴라트로마이신</td><td>2.5 mg/kg SC 단회</td></tr><tr><td>타일로신</td><td>18 mg/kg 24시간마다 3~5일</td></tr><tr><td>에리스로마이신</td><td>8 mg/kg IM 24시간마다 5일</td></tr><tr><td>세프티오푸르 나트륨(Rebhun)</td><td>2.2 또는 5 mg/kg IM 1일 1회 5일, 또는 20 mg/kg 1일 1회 3일</td></tr><tr><td>아목시실린(Rebhun)</td><td>15 mg/kg IM 48시간 간격 2회</td></tr></table><span class="hang">배뇨 배균을 없애려면 양성우 전체에 디하이드로스트렙토마이신 25 mg/kg IM 단회(또는 장기지속성 옥시테트라사이클린, 틸미코신, 툴라트로마이신 단회)를 준다. 용혈이 심하면 전혈 수혈과 정맥수액을 보탠다. 스트렙토마이신은 잔류가 길다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>예방<span class="hang">혈청형 특이 전균 백신이어야 보호된다. 5가 백신(Pomona, Canicola, Icterohaemorrhagiae, Grippotyphosa, Hardjo)은 모체항체가 줄어드는 4~6개월령에 2회 기초접종하고 4~6개월 간격으로 추가한다. 가장 흔한 실수는 1회만 맞히고 6~12개월 뒤에야 추가해 기초면역이 안 되는 것이다.</span><span class="hang">Hardjo-bovis에는 5가 백신의 효과 근거가 적고 1가 Hardjo-bovis 백신이 감염과 배뇨 배균을 막는다. 모체항체가 있어도 4주령부터 안전·유효하다는 연구가 있다. 백신은 기존 감염을 없애지 못하므로 항생제 치료를 함께 한다.</span><span class="hang">환축, 유산태아, 태반, 보균동물, 야생동물, 개·고양이, 물 같은 감염원을 찾아 차단한다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>큐열(콕시엘라증)<span class="hang">Coxiella burnetii는 환경에서 오래 사는 절대 세포내 그람음성균이다. 소·양·염소가 주 보유숙주로, 미국 집유 PCR에서 90% 넘게 양성이었고 하루 착유우의 20~25%가 배출한다.</span><span class="hang">분만·유산 때 양수, 태반, 태막에 대량으로 나오고 우유, 오줌, 분변으로도 배출된다. 정상 분만우와 자궁염 소도 수개월 배출한다. 오염 분비물의 에어로졸 흡입이 사람 감염 경로이며 1~2% 염소 표백제가 유효하다.</span><span class="hang">소는 대개 불현성이고 번식 성적에 미치는 영향은 분명하지 않다. ELISA나 전혈·우유·태아조직·질분비물 PCR로 진단하며 소는 치료하지 않는다.</span><span class="hang">사람은 잠복기 10~28일 뒤 오한, 발열, 두통, 근육통을 보이고 폐렴, 간염, 심내막염이 올 수 있다. 저온살균(62.8℃ 30분 또는 71.7℃ 15초)으로 죽으므로 생우유를 피한다. 산과 처치가 많은 소 임상수의사는 고위험군이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">67.</span><span>클로스트리듐 근염 — 기종저·악성수종<span class="hang">기종저는 C. chauvoei, 악성수종은 주로 C. septicum이 일으키고 C. novyi, C. sordellii, C. perfringens도 근염을 일으킨다. 임상으로 종을 구별하기 어렵다. 근골격 탭과 겹치므로 요점만 둔다.</span><span class="hang">기종저는 섭취된 아포가 근육·간에 잠복하다가 타박이나 셀레늄 결핍 괴사로 혐기 환경이 생기면 증식한다. 잘 자라는 영양 좋은 6개월~2세 소에 많고 따뜻하고 습한 계절에 여러 마리가 걸린다. 다른 종은 주사(특히 프로스타글란딘 뒷다리 근육주사), 단미, 분만 뒤 질 열상 같은 외인성 경로가 많다.</span><span class="hang">발열, 침울, 독혈증과 점점 커지는 근육 종창, 심한 파행이 있다. 피부는 처음에 따뜻하고 부드럽다가 검고 차게 괴사하며 염발음이 만져진다. 24~48시간에 진행해 치료 없이는 3일을 넘기는 소가 드물고 급사로 보일 수 있다. 흡인액 그람염색(큰 그람양성 간균)과 형광항체가 빠른 진단법이다. CK·AST는 혈류 차단으로 조금만 오를 수 있다.</span><span class="hang">치료: 페니실린 G 나트륨·칼륨 44,000 IU/kg IV 6~8시간마다로 시작해 장기 제제로 잇는다(Rebhun 44,000 U/kg IM·SC 1일 2회). 근육을 절개해 산소를 공급하고 희석 과산화수소로 세척하며, NSAID와 중증 쇼크 시 수용성 코르티코스테로이드 1회를 쓴다. 항생제는 1~4주 필요하다.</span><span class="hang">예방: 상재 농가는 3~6개월령에 4주 간격 2회 접종 뒤 매년 위험기(봄·여름) 직전에 추가접종한다. 모체이행면역이 최소 3개월 가서 그 전 접종을 방해하므로, 4개월령 전에 맞혔으면 4개월령 이후 다시 접종한다. 발생하면 남은 소에 즉시 백신과 페니실린(44,000 IU/kg IM 24시간마다 3일)을 주고 목초지를 옮긴다. 항생제를 주지 않으면 면역이 생길 때까지 14일간 새 증례가 나올 수 있다. C. chauvoei, C. septicum, C. novyi를 포함한 다가 백신을 쓴다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>세균성 혈색소뇨증(red water)<span class="hang">C. novyi D형(C. haemolyticum)이 원인이다. 간에 잠복한 아포가 간질 이동, 간농양, 간생검 같은 간 손상으로 혐기 상태가 되면 증식해 포스포리파아제 C(β-독소)를 만들고 간경색, 혈관내 용혈, 독혈증을 일으킨다. 알칼리성(pH 약 8.0) 습지·관개 방목지의 여름·가을에 많다. 비상재지 소를 감염 농장에 들이면 7~10일 뒤 발병한다.</span><span class="hang">젊은 성우~성우에서 심급성으로 39.5~41℃ 고열, 반추·섭식·비유·배변 정지, 등을 구부린 복통, 얕은 호흡, 흉수부종, 암적색 오줌(혈색소뇨), 황달, 혈점액 설사가 있고 죽기 전 체온이 정상 이하로 떨어진다. 임신 말기 착유우는 12시간, 건유우는 4일 경과하고 유산하기도 한다. 방목 중 급사 감별에 넣는다.</span><span class="hang">오줌의 적색은 혈색소로 적혈구가 없다. 빈혈, AST·GGT 증가, 빌리루빈 경중등도 증가가 있다. 부검의 5~20 cm 창백한 허혈성 간경색(충혈대로 둘러싸임)과 검게 변색된 신장이 거의 특징적이며, 경색 가장자리 형광항체 검사로 확인한다.</span><span class="hang">치료는 고용량 페니실린(Rebhun: 44,000 U/kg IV 1일 4회)이나 테트라사이클린, 항독소혈청, 수혈, 수액이다. 흥분이나 운동으로 급사할 수 있다. 회복 수소는 간 파열 위험 때문에 최소 3주 교배를 쉰다.</span><span class="hang">예방: 위험기 4~6주 전 피하 접종하고 상재지는 6개월령 이상 전 두수를 매년 재접종하며 고위험지는 방목기 중 2차 접종한다. Rebhun은 모체항체 소실 뒤 3~4주 간격 2회, 이후 위험우에 연 2회 추가를 권한다. 간질 구제와 반추위염 예방 급여를 함께 한다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>클로스트리듐 장독혈증(C. perfringens)<span class="hang">성우의 산발적 급사 원인으로 관찰되며 단백질·에너지가 매우 많은 사료와 관련된다고 여겨진다. C형 β-독소, E형 ι-독소가 성우 출혈성 장염·제4위염에서 확인되었으나 어느 형이 원인인지는 분명하지 않다(Rebhun). A형은 정상 장내세균이어서 병인적 역할이 불확실하다(Constable).</span><span class="hang">대부분 기립불능, 빈사, 폐사 상태로 발견된다. 설사, 복부 팽만, 복통, 침울을 보이거나, 발열·식욕부진·소량 설사 뒤 죽고 부검에서 심한 제4위 부종을 보인다.</span><span class="hang">신선한 부검 시료가 필요하다. 소장 액체 팽만, 장막 출혈, 장간막 부종이 있을 수 있다. 분변·소장 내용물을 배양하고 독소를 검사하며 시료는 냉장(비동결)으로 보낸다. 심급성 살모넬라증 같은 다른 급사 원인을 배제해야 한다.</span><span class="hang">치료는 거의 불가능하다. 특정 형과 독소가 확인되면 해당 톡소이드를 접종하고, 몰아 먹기(slug feeding)를 막는 급여 관리를 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">70.</span><span>출혈성 패혈증(파스튜렐라) — 원인과 증상<span class="hang">Pasteurella multocida 특정 혈청형(아시아 B:2, 아프리카 E:2)이 일으키는 급성 패혈증으로 물소와 소에 주로 생긴다. 동남아시아에서 가장 많고 이환율·치명률 모두 50~100%다. 상재지 물소와 소의 5%까지 보균하며 6개월~2세가 가장 감수성이다. 우기, 밀집, 사료 부족·피로 같은 스트레스가 유인이다.</span><span class="hang">구강 섭취나 흡입으로 감염되고 편도가 침입문이다. 41~42℃ 갑작스러운 발열, 다량의 유연, 점막하 점상출혈, 심한 침울 뒤 약 24시간(8~24시간)에 죽는다. 목·하악·흉전부·회음부에 뜨겁고 아픈 부종이 생기면 호흡곤란이 온다.</span><span class="hang">사후 수 시간 안에 혈액이나 비강 면봉으로 배양하고, 오래된 사체는 장골 골수를 쓴다. 생존 동거우의 간접혈구응집 1:160 이상은 시사적이다. 부검에서 전신 장막하 점상출혈, 폐·림프절 부종, 피하 젤라틴 부종이 보인다. 감별: 기종저, 탄저, 우역, 낙뢰, 급성 살모넬라증, 폐렴성 파스튜렐라증.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>출혈성 패혈증 — 치료와 방제<span class="hang">증상이 나타나면 치료 효과가 적고, 어느 약이든 정맥 부하용량이 필요하다.</span><table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>트리메토프림+설파독신</td><td>2.66+13.33 mg/kg 처음 IV, 이후 IM 12시간마다</td></tr><tr><td>엔로플록사신</td><td>2.5~5 mg/kg SC 24시간마다</td></tr><tr><td>세프티오푸르 나트륨</td><td>1.2~2.2 mg/kg IV 24시간마다</td></tr><tr><td>동거우 예방 투여</td><td>툴라트로마이신 2.5 mg/kg SC, 플로르페니콜 40 mg/kg SC, 틸미코신 10 mg/kg SC, 장기지속성 옥시테트라사이클린 20 mg/kg IM, 각 단회</td></tr></table><span class="hang">생존 동물의 20%까지 불현성 배균우가 된다. 비상재지는 이동통제, 격리, 동거 추적, 도태, 소독으로 근절하고 상재지는 불활화 백신으로 방제한다. 백신 접종 어미 송아지의 초유 면역은 8~16주령에 최고였다가 떨어진다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">72.</span><span>살모넬라증(성우) — 원인과 역학<span class="hang">소에서는 S. Typhimurium, S. Dublin, S. Newport가 중요하다. 통성 세포내 기생균으로 대식세포를 타고 퍼져 장 침입 뒤 균혈증을 일으키기도 한다. 분변-구강 감염이 주 경로다.</span><span class="hang">발병은 혈청형 병원성, 감염량, 면역, 스트레스에 좌우된다. 대형 농가, 밀집 사육, 자유우사, 오염된 사료 원료, 미경운 농지 분뇨 살포, 보균 조류, 병우와 분만우의 혼합 관리가 유행을 키운다. 보균우가 들어와 퍼뜨리기도 한다.</span><span class="hang">중요한 인수공통병이자 식품매개 질병이다. 발생 때 농장 종사자와 가족의 설사가 흔하므로 공중보건 위험을 알린다.</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>임상증상과 진단<span class="hang">발열과 설사가 일관된 소견이다. 39.4~41.7℃ 발열이 설사보다 24~48시간 앞설 수 있고 중증도와 상관이 낮다. 유행 중 겉보기 건강우의 체온을 재면 곧 설사할 소를 찾을 수 있다. 설사는 묽은 변부터 수양변, 혈괴 섞인 변, 이질까지 다양하고 B·C군은 악취와 혈액·점액이 많다. E군은 가벼운 설사와 1~7일 발열로 겨울설사와 비슷하다.</span><span class="hang">갓 분만한 소가 특히 감수성이다. 입식 뒤 BVD와 동시 감염되면 폐사가 매우 높다(130두 중 35두가 7일 안에 폐사한 예). S. Typhimurium 집단 발생 폐사율은 약 5~10%다. B·C·D군은 임신 어느 시기든 유산을 일으키고, S. Dublin은 만성 무증상 유방염을 일으킨다.</span><span class="hang">분변 배양이 금본위이며 초기 여러 두의 시료를 보내 혈청형과 감수성을 확인한다. 심급성은 퇴행성 좌방이동을 동반한 호중구감소와 Na·K·Cl 저하 대사성 산증을 보이고, 알부민은 단백소실성 장병증으로 빨리 떨어진다. 담낭의 섬유소 원주는 특징적으로 보는 병리학자가 있고 담즙 배양이 유용하다.</span><span class="hang">감별: 열과 설사는 BVD와 겨울설사가 주이고, 만성 설사는 아급성 반추위산증, 내부기생충, 존씨병, 호산구성 장염, 림프육종, 만성 복막염, 구리결핍을 생각한다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>치료<span class="hang">식욕부진·침울·탈수가 뚜렷하면 젖산링거 같은 균형 전해질 정맥수액을 준다. 600 kg 소가 10% 탈수면 60 L가 필요하다. 탈수 10% 초과 급성 설사는 대사성 산증 가능성이 높고, 재수화로 교정되지 않으면 중탄산을 보탠다(600 kg, BE -5 mEq/L이면 0.3×600×5=1,000 mEq).</span><span class="hang">7.5% 고장식염수 3~5 mL/kg IV 뒤 경구 전해질 10~20갤런이 현장에서 실용적이다. 고장식염수 뒤 스스로 물을 마시지 않으면 예후를 신중히 보고 대량 경구 투여를 한다.</span><span class="hang">항생제는 논란이 있다. 미열·설사·경미한 탈수 정도면 쓰지 않고, 발열·탈수·심한 설사·이질과 함께 내독소혈증·패혈증 양상을 보이는 중증에 배양·감수성 결과에 따라 4~7일 쓴다.</span><span class="hang">플루닉신 메글루민은 1.1 mg/kg IV 24시간마다로 시작해 0.5 mg/kg으로 줄이거나 1~2일 뒤 끊는다. 과량·반복은 제4위·신장 병변과 장 회복 저해를 일으킨다. 코르티코스테로이드는 쇼크 상태 중증우의 1회(프레드니솔론 숙신산나트륨) 외에는 금기다.</span><span class="hang">방제: 역학조사로 감염원(사료 원료·운반, 급수, 분뇨 처리, 입식우, 병우·분만우 관리)을 찾고, 환축을 격리하며, 중증우를 치료하고, 종사자에게 분변에 의한 기계적 전파와 인수공통 위험을 교육한다. Constable은 보균우 확인, 이동 제한, 깨끗한 물, 위생과 축사 소독을 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">75.</span><span>존씨병(요네병, 파라결핵) — 원인과 전파<span class="hang">Mycobacterium avium subsp. paratuberculosis(MAP)가 원인인 만성 장 감염이다. 항산성 세포내 기생균으로 토양·물에서 1년 이상 산다. 소화기 탭과 겹치므로 검사와 근절 위주로 둔다.</span><span class="hang">분변-구강이 주 경로이고 나이가 들수록 저항성이 커지므로 분만장, 어미 유방, 초유(특히 합동 초유), 포유 기구, 송아지 사육장이 핵심 노출 지점이다. 우유로도 배출되고 무증상 임신우의 20%, 임상 증례의 40%까지 태반감염이 있다.</span><span class="hang">잠복기는 최소 2~3년, 길게는 10년이고 임상증상은 주로 2~5세에 나온다. 대부분 증상 없이 도태되며 감염률 20~100% 농가도 해마다 임상 증례는 성우의 5~10%를 넘지 않는다. 무증상 다량배균우(분변 1 g당 1~5백만 CFU)가 가장 큰 오염원이며, 이런 소가 있으면 미감염우가 오염 사료를 먹고 수동 배균해 배양 양성이 될 수 있다.</span><span class="hang">지침서는 요네병(가성결핵)을 필요할 때 성우를 검사해 도태하는 정기검사 대상으로 두고 2세 이상에서 발생이 많다고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>임상증상<span class="hang">열이 없고 식욕이 유지되며 이급후중 없이 혈액·점액 없는 완두수프 같은 수양성 분출성 설사가 특징이다. 유량 감소와 빠른 체중 감소가 있고 단백소실성 장병증으로 하악·흉전부 부종(bottle jaw)이 생긴다. 말기에야 식욕이 떨어져 악액질로 죽는다.</span><span class="hang">2세 육성우 여러 마리에 증상이 나면 어려서 많이 노출된 것이고, 5~7세에 나면 적게 또는 늦게 노출된 것이다.</span><span class="hang">혈청에서 저알부민혈증, 저단백혈증, 때로 고인산혈증(7 mg/dL 초과)이 있다. 감별: 만성 위장관 기생충, 만성 살모넬라증, 중독, 장 종양, 구리결핍, 심부전, 사구체병증, 신아밀로이드증, 호산구성 장염, 만성 BVD.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>검사<table class="bxt"><tr><th>검사</th><th>특징</th></tr><tr><td>분변 배양(고체·액체 배지)</td><td>4~16주 소요. 배균량을 정량해 도태 우선순위 결정. 항체보다 조기 검출</td></tr><tr><td>분변 PCR</td><td>신속. 임상 증례에서 민감도·특이도 높음</td></tr><tr><td>혈청·우유 ELISA</td><td>저렴. 무증상 배균우 민감도 약 15%, 임상 증례 90~100%. 정량값(OD, S/P)이 높을수록 다량배균우일 가능성이 큼</td></tr><tr><td>회장·회맹림프절 생검</td><td>우측 겸부 개복으로 회장 1 cm 쐐기와 림프절 채취. 압인도말 항산성 염색으로 대개 확진</td></tr></table><span class="hang">3세 미만 무증상 소는 잠복(eclipse)기여서 감염되어 있어도 어떤 검사에서나 음성이므로 대체우나 수란우 선별에는 쓸모가 없다.</span><span class="hang">임상 의심우는 ELISA나 분변 PCR로 빨리 판정한다. 감염 농가 무증상우 선별에는 병원체 검출 검사가 더 민감하지만 비용과 수동 배균 위양성 문제가 있다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>치료와 근절<span class="hang">임상 증례는 거의 치료하지 않는다. 치료해도 평생 매일 투약해야 하고 배균이 계속되며 끊으면 재발하고 식품으로 쓸 수 없다. 클로파지민 2 mg/kg 경구 24시간마다, 또는 이소니아지드 10~20 mg/kg과 리팜핀 10 mg/kg 경구 24시간마다 병용이 쓰였다. 감염 임신우의 태아를 살리려는 치료는 자궁내 감염 가능성이 높아 하지 않는다.</span><span class="hang">청정 농가는 폐쇄 사육이 최선이고 입식우는 청정 인증 농가(미국 자율 프로그램 4단계 이상)에서 산다.</span><span class="hang">감염 농가: 소독한 분만장에서 낳게 하고 즉시 어미와 떼어 성우와 완전히 분리해 기른다. 초유는 ELISA 음성(가능하면 분변배양 음성) 소에서 받고 합동 초유를 피한다. 60℃ 60분 가열 초유는 MAP를 줄이지만 완전히 없애지는 못한다. 전유는 살균한다. 분뇨 장비와 급여 기구를 분리하고 사료·물·목초지의 분변 오염을 막는다.</span><span class="hang">근절에는 수년간 24개월령 이상 전 두수의 반복 분변 배양이 필요하다. 억제 단계에서는 ELISA로 찾은 다량배균우와 임상우를 즉시 팔고 중등도 배균우는 비유 끝에 도태한다.</span><span class="hang">미국의 유일한 허가 백신은 열사균 오일 보조제 백신으로 임상병을 거의 막지만 감염과 배균은 막지 못한다. 흉전부 피하 접종 부위에 농양이 생기고 미근부 결핵검사 위양성과 존씨병 혈청 양성을 일으키므로 주정부 허가와 전 두수 결핵검사가 필요하다. 사람이 실수로 맞으면 심한 육아종성 염증이 생긴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>위장관 선충 — 종류와 병원성<span class="hang">제4위의 Ostertagia ostertagi(갈색위충), Trichostrongylus axei, Haemonchus placei가 주요하고, 오스터타기아는 L4가 위샘에서 발육정지(hypobiosis)할 수 있어 가장 중요하다. 소장에는 Cooperia, Nematodirus helvetianus, Bunostomum phlebotomum, Toxocara vitulorum, 대장에는 Oesophagostomum radiatum(결절충)과 Trichuris가 있다.</span><span class="hang">오스터타기아증 I형은 방목 성수기에 먹은 유충이 약 3주에 성충이 되어 설사, 체중 감소, 저단백혈증, 증체 저하를 일으킨다. II형은 정지 L4가 한꺼번에 나오면서(북부 늦겨울~봄, 남부 늦여름~가을) 급성 식욕부진, 체중 감소, 저단백혈증, 심한 설사를 일으키며 폐사율이 높고 제4위벽이 '모로코 가죽'처럼 두꺼워진다. 정지 유충은 많은 구충제에 저항한다.</span><span class="hang">흡혈성인 Haemonchus, Bunostomum, Cooperia가 우세하면 빈혈이 주증상이다. 결절충은 맹장·결장 염증과 결절을 만들고 장중첩 부위가 되기도 한다.</span><span class="hang">첫 방목 시즌이 가장 위험하다. 쿠페리아는 노출 8~12개월에 면역이 생기지만 오스터타기아 면역에는 두 방목 시즌 노출이 필요하다. 성우는 대개 부분·완전 면역이 있으나 어려서 방목한 적 없는 소, 초산우, 입식우는 감수성이다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>위장관 선충 — 진단과 관리<span class="hang">실혈성 빈혈과 저알부민혈증이 주 이상이며 제4위 pH 상승으로 혈장 펩시노겐이 늘 수 있다. 호산구증가는 일정하지 않다. 분변 부유법과 유충 배양이 확진 도구이고, 설사가 주증상이면 살모넬라증, BVD, 콕시듐증, 중독을 배제한다.</span><span class="hang">분변 충란수(FEC)는 나이 든 소에서 면역으로 산란이 줄고 겨울 정지충이 많아도 0일 수 있어 충체 부담을 정확히 반영하지 못하지만, 구충 시기와 필요성 판단에 쓴다. 유충 배양은 7~10일 더 걸린다. 오스터타기아 우유·집유 ELISA로 성우 감염을 평가하기도 한다.</span><span class="hang">육성우 방목 프로그램: 방목 직전, 방목 3주와 6주 뒤(이버멕틴이면 3주와 8주 뒤) 구충해 목초지 오염을 줄인다(Rebhun). 이버멕틴 제품은 방목 초 3-8-13주, 도라멕틴은 0-8주 전략이 권장된다(Bovine Medicine).</span><span class="hang">성우 구충의 경제성은 논란이며, 방목을 오래 하거나 초산우·입식우 비율이 높으면 정당화되고 완전 사사 농가는 근거가 부족하다.</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>구충제 계열과 범위<table class="bxt"><tr><th>계열</th><th>약물</th><th>선충</th><th>폐충</th><th>조충</th><th>간질</th></tr><tr><td>벤즈이미다졸</td><td>알벤다졸, 네토비민</td><td>+</td><td>+</td><td>+</td><td>+(10주 넘은 충, 용량 50% 증량)</td></tr><tr><td>벤즈이미다졸</td><td>펜벤다졸, 옥스펜다졸</td><td>+</td><td>+</td><td>일부</td><td>-</td></tr><tr><td>벤즈이미다졸</td><td>트리클라벤다졸</td><td>-</td><td>-</td><td>-</td><td>+(어린 충 포함)</td></tr><tr><td>이미다조티아졸</td><td>레바미솔</td><td>+</td><td>+</td><td>-</td><td>-</td></tr><tr><td>거대고리락톤</td><td>이버멕틴, 도라멕틴, 에프리노멕틴, 목시덱틴</td><td>+</td><td>+</td><td>-</td><td>-</td></tr></table><span class="hang">거대고리락톤은 지용성으로 지방에 저장되었다 천천히 방출되어 지속 효과가 있고 이, 옴, 쇠파리유충에도 듣는 내외부구충제(endectocide)다. 에프리노멕틴은 푸어온만 있고 장기지속성 목시덱틴 주사는 90~150일 간다. 푸어온은 흡혈이와 뿔파리에 주사보다 효과적이다. 레바미솔은 정지 L4에 불완전하다.</span><span class="hang">소 선충의 구충제 내성 보고는 드문 편이고 주로 쿠페리아의 ML 내성이다. 푸어온 흡수 불량이 원인일 가능성이 크나 장기적으로 내성을 선택할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>구충제 용량과 휴약(Rebhun, 미국 표시사항)<table class="bxt"><tr><th>약물</th><th>용량</th><th class="c">도축 휴약(일)</th><th>비고</th></tr><tr><td>알벤다졸</td><td>10 mg/kg PO</td><td class="c">27</td><td>간질 성충 포함. 번식 연령 암소 금지(임신 초기 기형 우려)</td></tr><tr><td>도라멕틴 주사</td><td>200 µg/kg SC</td><td class="c">35</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>도라멕틴 푸어온</td><td>500 µg/kg</td><td class="c">45</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>에프리노멕틴 푸어온</td><td>500 µg/kg</td><td class="c">0</td><td>우유 휴약 0. 젖은 소에도 유효</td></tr><tr><td>에프리노멕틴 주사</td><td>1 mg/kg SC</td><td class="c">8~13</td><td>20개월령 이상 젖소 암소 금지</td></tr><tr><td>펜벤다졸</td><td>10~15 mg/kg PO(착유우 5 mg/kg)</td><td class="c">8~13</td><td>착유우 우유 휴약 0</td></tr><tr><td>이버멕틴 주사</td><td>200 µg/kg SC</td><td class="c">35</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>이버멕틴 푸어온</td><td>500 µg/kg</td><td class="c">48</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>레바미솔</td><td>제형별</td><td class="c">7</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>목시덱틴 주사</td><td>200 µg/kg SC</td><td class="c">21</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>목시덱틴 푸어온</td><td>500 µg/kg</td><td class="c">0</td><td>우유 휴약 0</td></tr><tr><td>모란텔 타르트레이트</td><td>0.44 g/100 lb PO</td><td class="c">14</td><td>우유 휴약 0. 성충만</td></tr><tr><td>옥스펜다졸</td><td>4.5 mg/kg PO</td><td class="c">7</td><td>번식 연령 젖소 암소 금지</td></tr><tr><td>클로르술론</td><td>7 mg/kg</td><td class="c">8</td><td>간질 성충과 후기 미성숙충</td></tr><tr><td>클로르술론+이버멕틴</td><td>1 mL/110 lb SC</td><td class="c">49</td><td>간질과 선충</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">83.</span><span>간질(간흡충증)<span class="hang">소에서는 Fasciola hepatica가 주로 문제이고 림네아과 물달팽이가 중간숙주다. 피낭유충을 먹으면 미성숙충이 장을 뚫고 간 실질을 이동한 뒤 담관에 자리 잡는다. 소는 양보다 병원성이 낮고 주로 만성형이다.</span><span class="hang">만성형: 체중 감소, 유량 감소, 창백, 하악 부종, 대구성 저색소성 빈혈, 저알부민혈증, 고글로불린혈증, GGT 증가가 있다. 간 이동은 세균성 혈색소뇨증과 흑색병(C. novyi)을 유발한다. 부검에서 두꺼워지고 석회화된 담관이 간 표면에 튀어나온다(파이프줄기 간).</span><span class="hang">진단: 노란 갈색의 덮개 있는 충란을 침전법(또는 비중 1.36 황산아연 부유)으로 찾으며 반추위흡충(Paramphistomum) 알과 혼동하기 쉽다. 위험군 10~15두 분변을 검사한다. 혈청·우유 ELISA는 감염 2주 뒤 항체가 오르기 시작해 6주까지 오르고 트리클라벤다졸 치료 뒤 7개월까지 남는다. 분변 항원 ELISA도 있다. 만성형 감별: 구리·코발트 결핍, 오스터타기아증, 존씨병.</span><table class="bxt"><tr><th>약물(소)</th><th>용량</th><th>비고</th></tr><tr><td>트리클라벤다졸</td><td>12 mg/kg PO</td><td>소에서 2주령 이상 모든 단계. 급성 발생의 선택약, 방제 시 8~10주 간격. 내성 보고</td></tr><tr><td>클로르술론+니트록시닐</td><td>2+10.2 mg/kg SC</td><td>미성숙충 효과 99%까지</td></tr><tr><td>알벤다졸</td><td>10 mg/kg PO</td><td>성충. 충란도 죽인다</td></tr><tr><td>클로르술론</td><td>13.2 mg/kg SC(치료표), 2 mg/kg SC(본문, 이버멕틴 합제)</td><td>성충과 12~14주 미성숙충. 8주충은 불확실</td></tr><tr><td>니트록시닐</td><td>10 mg/kg SC</td><td>성충. 급성에는 50%까지 증량. 경구 불가</td></tr><tr><td>옥시클로자니드</td><td>10 mg/kg PO</td><td>성충만. 우유 휴약이 짧음. 일시적 연변</td></tr><tr><td>클로산텔</td><td>10 mg/kg PO</td><td>4주 넘은 충(양 기준)</td></tr></table><span class="hang">방제: 달팽이 서식지를 피하거나 배수·울타리로 막고, 감염 위험기 직후 미성숙충에 듣는 약을 주고 몇 주 뒤 성충약을 추가하며, 봄·초여름에 전 두수 성충을 구제해 달팽이 감염을 줄인다. 상재지에서는 세균성 혈색소뇨증·흑색병 백신이 신중하다.</span></span></p><p class="bx-num"><span class="bxn">84.</span><span>콕시듐증(성우 관점)<span class="hang">소에는 최소 13종 Eimeria가 있고 E. zuernii와 E. bovis가 주 병원종이다. 주로 3주~6개월령 송아지 병이지만 1세 이상에서도 보고되며 수송, 밀집, 사료 변화, 악천후, 동시 감염 같은 스트레스와 관련된다. 콕시듐은 모든 연령의 소에 있고 지속 노출로 면역이 유지된다. BVD나 미량원소 결핍은 면역 형성을 방해한다.</span><span class="hang">건강한 소도 분변 1 g당 10^7 넘는 난포낭을 배출할 수 있고 병든 소가 0일 수도 있어 난포낭 수 해석이 어렵다. 종 동정이 중요하다.</span><table class="bxt"><tr><th>약물</th><th>용도</th><th>용량</th></tr><tr><td>암프롤리움</td><td>예방 / 치료</td><td>5 mg/kg 21일 / 10 mg/kg 5일</td></tr><tr><td>모넨신</td><td>예방</td><td>사료 톤당 16.5~33.0 g 연속 또는 1.0 mg/kg 28일</td></tr><tr><td>라살로시드</td><td>예방</td><td>1 mg/kg 연속</td></tr><tr><td>데코퀴네이트</td><td>예방</td><td>0.5 mg/kg 30일(Bovine Medicine 0.5~1.0 mg/kg/일, 최소 28일)</td></tr><tr><td>설파메타진</td><td>치료</td><td>140 mg/kg 부하 후 70 mg/kg 5~7일</td></tr><tr><td>설파디메톡신</td><td>치료</td><td>55 mg/kg 부하 후 27.5 mg/kg 5~7일</td></tr><tr><td>설파퀴녹살린</td><td>치료</td><td>13.2 mg/kg 경구 1일 1회 3~5일</td></tr><tr><td>디클라주릴</td><td>치료·예방</td><td>1 mg/kg 단회</td></tr><tr><td>톨트라주릴</td><td>치료·예방</td><td>15 mg/kg 단회</td></tr></table></span></p><p class="bx-num"><span class="bxn">85.</span><span>기생충·파리 구제(한우컨설팅지침서)<table class="bxt"><tr><th>구분</th><th>대상</th><th>시기</th><th>방법</th></tr><tr><td>내부기생충</td><td>송아지</td><td>생후 1개월 이내</td><td>광범위 구충제를 주사하거나 먹인다</td></tr><tr><td>내부기생충</td><td>외부 구입우</td><td>구입 후 1~2주일</td><td>광범위 구충제를 주사하거나 먹인다</td></tr><tr><td>내부기생충</td><td>성우</td><td>매년 2회(봄, 가을)</td><td>광범위 구충제를 주사하거나 먹인다</td></tr><tr><td>외부기생충</td><td>파리·모기</td><td>여름철</td><td>우사·퇴비장에 약제 살포 또는 살충등 설치</td></tr><tr><td>외부기생충</td><td>진드기</td><td>방목 시</td><td>7~15일 간격 약제 살포. 방목우는 방목 전후 실시</td></tr><tr><td>외부기생충</td><td>옴·이·벼룩</td><td>연중(특히 겨울철)</td><td>발생 우군 전체 소 몸과 우사(천장·벽 포함)에 10일 간격 2회 살포</td></tr></table><span class="hang">구더기: 청소·건조·밀폐·살충제가 기본이다. 배설 후 24시간 지난 분변을 좋아하므로 하루 1회 이상 분변을 치우는 것이 가장 중요하다. 45℃ 이상이면 알·구더기·번데기가 죽으므로 퇴비에 비닐을 덮어 온도를 올리고 분뇨 수분을 50% 이하로 말린다. 구더기 구제제를 사료에 섞어 먹이거나 퇴비 표면 5~10 cm 아래까지 스며들게 살충제를 뿌리고, 퇴비가 5~10 cm 쌓일 때마다 생석회를 뿌린다.</span><span class="hang">성충: 사료급여기 밑과 분뇨구 구석을 철저히 청소한다. 살충제는 알을 죽이지 못하므로 10일쯤 간격으로 반복하고, 내성을 막으려고 봄·초여름과 가을에 성분이 다른 약을 번갈아 쓴다. 분무·연막제는 비 오거나 흐린 날 낮, 맑은 날은 파리가 쉬는 저녁에 뿌리고 사료통·물통을 덮는다. 먹이용 살충제는 파리가 좋아하는 인공유·사료에 섞어 가축 입이 닿지 않는 곳에 두고, 도포용 지속성 살충제는 입이 닿지 않고 비와 청소에 씻기지 않는 벽·천장·기둥에 바른다.</span><span class="hang">합성 피레스로이드(사이퍼메트린, 델타메트린, 플루메트린, 퍼메트린)는 붓기·점적·분무제와 귀표 형태로 파리와 이에 쓰고 축사 환경 분무에도 쓴다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">86.</span><span>소의 예방접종 프로그램(한우컨설팅지침서)<table class="bxt"><tr><th>백신</th><th>대상</th><th>기초접종</th><th>추가접종</th><th>용량·방법</th><th>비고</th></tr><tr><td>송아지설사병 혼합(로타·코로나·대장균)</td><td>분만 전 어미소</td><td>1차 분만 8주 전, 2차 1차 4주 후</td><td>매 분만 4주 전 1회</td><td>2 mL 근육 또는 피하</td><td>초유 급여 시 어미소 유방 소독 후 포유</td></tr><tr><td>탄저·기종저 혼합</td><td>6개월령 이상 전 두수</td><td>매년 2~4월 1회</td><td>매년 방목 전 1회</td><td>2 mL 피하</td><td>발생 우려 지역 실시</td></tr><tr><td>호흡기질병 혼합(IBR·BVD·유행성감기·RS·헤모필루스)</td><td>1개월령 이상 송아지</td><td>1차 생후 30~40일, 2차 1차 1개월 후</td><td>2차 후 6개월~1년 간격(약제에 따라)</td><td>1~5 mL 피하(약제에 따라)</td><td>환절기 일교차가 10℃ 이내가 되도록 환경 조절</td></tr><tr><td>호흡기질병 혼합</td><td>구입우 전 두수</td><td>1차 구입 즉시, 2차 1차 1개월 후</td><td>송아지와 동일</td><td>위와 같음</td><td>-</td></tr><tr><td>호흡기질병 혼합</td><td>어미소</td><td>1개월 간격 2회</td><td>송아지와 동일</td><td>위와 같음</td><td>-</td></tr><tr><td>세균성폐렴</td><td>구입우</td><td>구입 후 2일째 1회</td><td>-</td><td>2 mL 근육</td><td>수송열 예방</td></tr><tr><td>세균성폐렴</td><td>이유 송아지</td><td>이유 10일 전 1회</td><td>-</td><td>2 mL 근육</td><td>호흡기 예방</td></tr><tr><td>아까바네병</td><td>가임 암소</td><td>매년 4~6월 1회</td><td>-</td><td>5 mL 근육</td><td>모기 발생 1개월 전까지 접종 완료</td></tr><tr><td>유행열</td><td>6개월령 이상 전 두수</td><td>매년 4~6월 1회</td><td>-</td><td>3 mL 근육</td><td>아까바네와 2주 간격 접종</td></tr></table><span class="hang">백신 실패는 부적절한 보관·사용에서 흔히 온다. 수의사가 농가별 접종 프로그램을 문서로 정리하고 언제, 어떤 소에, 어떤 백신을 접종했는지 기록을 남기는 것이 중요하다(Constable).</span><span class="hang">클로스트리듐 박테린-톡소이드는 C. chauvoei를 빼면 대개 2~4주 간격 2회 기초접종이 필요했고, 모체항체가 줄어든 뒤 주는 것이 좋으며 4개월령 전에 맞혔으면 4개월령 이후 반복한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">87.</span><span>정기적으로 검사할 질병(한우컨설팅지침서)<table class="bxt"><tr><th>질병</th><th>검진시기</th><th>대상</th><th>검진기관</th><th>양성축 처리</th><th>비고</th></tr><tr><td>우결핵, 브루셀라</td><td>연중</td><td>성우, 송아지</td><td>축산위생연구소</td><td>살처분 매몰</td><td>살처분 시 보상금 지급</td></tr><tr><td>요네병(가성결핵)</td><td>필요시</td><td>성우</td><td>축산위생연구소</td><td>도태</td><td>2세 이상에서 발생 많음</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">88.</span><span>사료통·물통 위생 · BVDV 전파<span class="hang">사료통·물통은 자주 비우고 청소한다(뚜껑·부표식 급수기 주의). BVDV는 수성 물질·점액 속에서 숙주 밖에서 오래 생존해 사료·물을 통해 전파될 수 있다.</span></span></p></div>
</div>
`;

function med_neonatHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 주산기·송아지</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>신생송아지 검사 — 정상치와 활력<span class="hang">출생 직후 심박 100~150회/분, 위험 송아지는 150 초과 빈맥 뒤 서맥으로 간다. 직장 체온은 출생 직후 39~40℃로 높다가 3~5시간에 정상이 된다(Large Animal IM).</span><span class="hang">한우송아지핸드북 점검 기준: 체온 38.5~39.5℃, 호흡 20~50회/분, 맥박 100~200회/분(사양 표에는 1세 이하 체온 38.5~40.5℃).</span><span class="hang">정상 송아지는 2~4분에 흉와, 15~30분에 기립을 시도한다. 15분 안에 흉와하지 못하면 활력 저하·폐사 위험을 84% 예측한다. 기립·포유 평균은 육우 35분·81분, 젖소는 약 두 배다.</span><span class="hang">심박·호흡수·점막색은 산혈증을 예측하지 못하고 혀 당김 약화와 흡인반사 약화가 산혈증과 상관한다(Large Animal IM). Constable은 근긴장 평가가 가장 좋다고 적는다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>활력 평가표(Large Animal IM)<table class="bxt"><tr><th>항목</th><th>양호</th><th>불량</th></tr><tr><td>호흡</td><td>50~75회/분 흉식</td><td>헐떡임, 무호흡, 불규칙 복식</td></tr><tr><td>피모·부종</td><td>양수에 젖음, 부종 없음</td><td>태변 착색, 머리·혀·다리 부종</td></tr><tr><td>점막</td><td>분홍</td><td>청색·창백, 재충만 지연</td></tr><tr><td>반사·근긴장</td><td>머리 흔들기, 흡인·각막·발가락 반사 강함</td><td>약함·없음, 축 늘어짐</td></tr><tr><td>심박</td><td>100~150 규칙</td><td>150 초과 뒤 80 미만</td></tr><tr><td>흉와·기립</td><td>흉와 5분, 기립 시도 15분, 기립 1시간</td><td>장시간 횡와, 시도 없음</td></tr><tr><td>포유</td><td class="c">2시간 이내</td><td>지연·없음</td></tr></table></span></p><p class="bx-num"><span class="bxn">3.</span><span>아프가 점수<table class="bxt"><tr><th>항목</th><th>0점</th><th>1점</th><th>2점</th></tr><tr><td>피부색</td><td>몸 전체 청색</td><td>사지 끝 청색</td><td>분홍(정상)</td></tr><tr><td>심박</td><td>없음</td><td>100 이하</td><td>100 이상</td></tr><tr><td>콧구멍 자극</td><td>반응 없음</td><td>찡그림·약한 비명</td><td>재채기·기침</td></tr><tr><td>근력</td><td>기립 불능</td><td>약간 구부림</td><td>활발</td></tr><tr><td>호흡</td><td>없음</td><td>약함·불규칙</td><td>강함(20~50회)</td></tr></table><span class="hang">판정(한우송아지핸드북): 3점 이하 매우 위험, 4~7점 상당히 위험(폐사율 5% 이상), 8점 이상 정상.</span><span class="hang">변형 아프가(Bovine Medicine): 머리에 찬물 반응, 발가락 사이 반사, 점막색(흰색·연분홍/청색·분홍), 호흡 규칙성을 각 0~2점. 기립 목표: 머리 들기 3분, 흉와 5분, 기립 시도 20분, 기립 60~90분.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>분만 중 태아 생존 확인<span class="hang">앞다리 태위는 발가락 사이·안구·삼킴 반사, 뒷다리 태위는 발가락 사이·항문 반사와 탯줄 박동을 본다. 반사가 없던 태아의 6%가 정상으로 태어났다(Large Animal IM).</span><span class="hang">핸드북의 자궁 내 가사 판정: 발굽을 벌려도 통증 없음, 눈을 눌러도 무반응, 입에 손을 넣어도 빨지 않음, 미입 난산 때 항문 반사 없음, 심박·배꼽동맥 박동 미약.</span><span class="hang">분만 2기는 경산우 약 30분, 초산우 약 60분이다. 경산우는 30~60분, 초산우는 60~90분 넘으면 조산하는 것이 태아 생존에 좋다(Large Animal IM).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>분만 후 저산소증·산증(가사 송아지) — 원인<span class="hang">주원인은 난산, 탯줄 혈류 차단, 태반 조기 박리다. 분만 2기 자궁 수축 때 탯줄 혈류가 줄고 머리가 음문에 보이면 멎는다. 정상 송아지도 분만 중 산혈증·저산소·고탄산 상태이고 2기가 길면 악화된다. 출생 후 가벼운 혼합 산증은 1~4시간에 교정된다(Constable).</span><span class="hang">탯줄을 4분 막으면 대개 살고 6~8분이면 대부분 죽는다. 살아난 송아지는 침울, 기립불능, 흡인·삼킴 약화, 저체온으로 지지요법에 반응이 나쁘다. 태변 착색은 저산소 표지다.</span><span class="hang">과도한 견인은 갈비뼈·척추 골절의 주원인이고, 미입 태위와 엉덩이 걸림에서 척추 골절이 생긴다. 분만이 길면 머리·혀 부종으로 포유가 방해된다.</span><table class="bxt"><tr><th>구분(핸드북)</th><th>원인·유인</th></tr><tr><td>자궁 내 가사</td><td>작은 골반(조기 종부·초산), 과대 태아(종모우, 분만 지연), 태위 이상, 자궁무력(쌍태·스트레스·7산 이상), 자궁 염전, 옥시토신·자일라진 과다</td></tr><tr><td>자궁 외 가사</td><td>혈액 산도 저하, 무리한 견인, 5분 넘는 견인. 증상은 기립불능·노력성 호흡·청색증</td></tr><tr><td>지발성 가사</td><td>폐포 미성숙, 예정일보다 15일 이상 조산. 양수 L/S 비 2.0 미만</td></tr></table><span class="hang">저산소 송아지는 처음 밝아 보이다가 흉와를 유지하지 못하고 수 시간 안에 침울해진다. 떨기·갈색지방 열생산이 줄어 추위에 약하고 초유를 적게 먹는다. 한우컨설팅지침서: 체중은 정상이어도 기립불능·포유불능·호흡 촉박으로 2~3일 안에 대부분 폐사한다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>소생술 — 기도·자극·환기<span class="hang">주산기 폐사의 2/3가 생후 1시간 안에, 그중 95%가 5분 안에 일어난다(Large Animal IM).</span><span class="hang">기도: 흡인으로 인두·비강을 비우고, 기관을 살짝 눌러 기침을 유발하거나 뒷다리를 잡고 90초 미만 거꾸로 든다. 숨 쉬면 흉와 자세로 둔다. 핸드북은 거꾸로 들고 목을 마사지해 양수를 뺀다.</span><span class="hang">자극: 콧구멍에 손가락·짚 넣기, 비중격 꼬집기, 몸 문지르기, 귀·머리에 찬물. 독사프람 1~2 mg/kg IV는 호흡중추를 자극하나 반복하면 경련으로 산소 요구가 는다(Large Animal IM). Constable은 효능 미입증이라 적는다.</span><span class="hang">양압 환기: 폐포액은 35~40 cmH2O에서 가장 잘 흡수된다. 압력 밸브 42 cmH2O 소생백을 쓰고 식도를 눌러 제4위로 공기가 가지 않게 한다. 환기 확보 뒤 8.4% 중탄산나트륨 50~100 mL IV로 대사성 산증을 교정하고 보온한다(Large Animal IM).</span><span class="hang">입 인공호흡은 책마다 다르다. 핸드북은 목구멍에 1분 이상 입김을 넣으면 CO2가 호흡을 촉진한다며 흉골 위 자세에서 등을 누르며 20초 간격으로 입김을 넣으라고 한다. Constable은 인수공통전염병 때문에 강하게 말리고, Large Animal IM은 공기가 제4위로 가 효과가 없고 렙토스피라·브루셀라·Q열 위험이 있다고 적는다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>가사 후 관리와 예방<span class="hang">지침서: 초유를 짜서 먹이며 강심제를 지속 투여하고, 산소포화도 95% 이상이어야 회복을 기대한다.</span><span class="hang">핸드북 예방: 분만 입회, 예정일 14일 이상 경과 시 유도분만, 분만 3주 전부터 야간 급여로 주간 분만 유도. Constable: 감시는 초산우에 집중하고 2기 진행이 멈추면 조산한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">8.</span><span>허약 송아지 증후군 — 형태와 원인<span class="hang">Constable(사산/주산기 허약송아지 증후군): 다인성. 정상으로 태어나 섰다가 저체온으로 쓰러져 수 시간 안에 죽거나, 허약하게 태어나 10~20분 안에 죽는데 부검 병변이 거의 없다. 북아일랜드 낙농우에서 출생의 10~20%, 분만 1·2기가 24시간까지 길었다.</span><span class="hang">더미 송아지: 의식은 있으나 젖 찾기·빠는 본능이 없다. 4~5시간 안에 젖꼭지를 못 찾으면 흡인반사를 잃어 병 포유 훈련이 필요하고 저체온·저혈당·감염이 생긴다.</span><span class="hang">원인 후보: 만삭 직전 태아 감염(허약 송아지 293두 중 25% 렙토스피라, BVD, 아데노), 어미 영양 부족(말기 3개월 CP 7%는 생시체중 11.4% 감소·열생산 저하·IgG 흡수 저하), 태반 기능부전, 셀레늄·비타민E 결핍, 요오드 결핍성 갑상선기능저하(갑상선 30 g 초과 비정상), 난산 외상, 분만 지연 저산소. 셀레늄·요오드 어미 주사는 발생률에 차이가 없었다(7.9% 대 7.4%). 흑모화종에서는 태아-태반 기능부전 발육지연과 흉선 저형성이 보고되었다(Constable).</span><span class="hang">핸드북: 표준 발육의 70~80%로 뒤처진 송아지, 피모 불량·배 처짐·무기력, 만성 설사 후, 악액질, 선천 허약을 허약 송아지로 본다. 임신 중 저영양은 착상 불량, 송아지 체중 감소, 면역 저하를 부른다. 한우 산차별 생시체중은 1~2산 21.3, 3~6산 24.5, 6~9산 24.1, 9산 이후 23.5 kg, 폐사율 4.5, 0.7, 1.6, 1.8%.</span><span class="hang">지침서: 생시체중 17 kg 이하(평균 25 kg)나 백근병도 굽은 발굽·허약·기립불능을 일으킨다. 이들은 포유 욕구는 왕성하나 사지 힘이 약하다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>허약 송아지 — 치료와 예방<span class="hang">초유 강제 급여, 보온, 어미 젖 빨기 보조, 스스로 빨 때까지 며칠 병 포유(Constable).</span><span class="hang">핸드북의 포유 거부 시 조치: 홍치(잇몸이 이를 덮음)는 손톱 등으로 벗긴다. 손가락으로 태변을 확인해 검은 변이면 관장, 누런 설사액이면 양수 과다 섭취로 보고 양수를 뺀다. 5% 포도당 + 비타민B + 비타민C + 대사촉진제 수액에 기립·포유 반응을 보이면 허약자우증후군이 많으니 초유를 먹이고 3~4일 영양요법. 체온 40~41℃면 태내 감염을 생각해 항생제·해열제.</span><span class="hang">설탕 요법(핸드북): 발육 부진 송아지에 체중 kg당 1 g, 주 2~3회, 약 8주. 만성 식이성 설사는 1.5~2 g/kg/회/일 7~8일. 약 91.5%가 회복했고 건강 송아지에는 이점이 없다.</span><span class="hang">지침서: 생시체중 미달우는 젖을 짜 먹이며 깨끗한 곳에 격리, 백근병에는 셀레늄제제. 예방(Constable): 어미 영양, 분만 감시와 적시 조산, 유행 시 더 일찍 조산.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">10.</span><span>저체온 — 원인·처치·예방<span class="hang">신생송아지 하한 임계온도는 약 13℃(Constable), 약 15℃·1개월령 0℃(Bovine Medicine). 열중립대는 신생 15~25℃, 1개월령 0~28℃. 핸드북은 유지 영양 시 임계온도 7℃, 고영양 시 −7℃까지 증체 유지, 선호 기온 15~25℃, 임계 상한 30℃로 적는다.</span><span class="hang">핸드북: 한우는 소형 품종으로 복부 지방세포가 적게 태어나 온도 충격에 민감하고 기온차가 크면 설사가 늘어 보온시설이 필수다. 초산우의 20~40%가 송아지를 돌보지 않아 초유·건조가 늦으면 체온 저하 → 저항력 저하 → 설사로 이어진다.</span><span class="hang">조산·난산·저산소 송아지는 체온조절이 약하고 초유를 적게 먹는다. 21일령 미만 40 kg 송아지의 유지 에너지는 20℃ 1.59, 0℃ 2.45, −20℃ 3.31 Mcal/일로 추울수록 더 먹여야 한다(Large Animal IM).</span><span class="hang">재가온은 복사열보다 따뜻한 물에 담그는 쪽이 빠르다(Constable). 핸드북은 드라이기 건조·마사지, 높이 조절 보온등을 쓰고 정맥 수액은 40℃ 이상으로 데워 수액줄을 더운물에 담그라고 한다. Constable은 수액줄을 물통에 담그는 방법은 평가되지 않았고 카테터 가까이 둔 수액줄 가온기가 효과적이라고 적는다.</span><span class="hang">예방: 생후 며칠은 비바람 피난처, 분만사나 들판 송아지 쉼터, 송아지 옷(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>갓 태어난 송아지 관리 — 분만 직후 처치<span class="hang">탯줄은 배꼽에서 5~6 cm(핸드북), 6~7 cm(지침서)로 잘라 강옥도나 베타딘으로 소독한다. Constable은 2% 요오드 팅크나 클로르헥시딘을 든다.</span><span class="hang">초유 전 어미 유방·유두를 세척하고 1% 베타딘으로 소독하면 설사가 10.3%에서 3.1%로 줄었다(핸드북). 지침서는 베타딘 10배 희석 1회.</span><span class="hang">연한 발굽을 제거하면 더 잘 일어선다. 후산은 매몰하고(어미가 먹으면 기도 폐색·고창·식체), 8시간 넘게 안 나오면 수의사에 의뢰한다(핸드북).</span><span class="hang">핸드북 출생 직후 면역 증강: 면역증강제(BSK, 울트라콘) 2 mL, 셀레늄·비타민E 제제 2 mL, 항생제 2 mL(페니실린·부신피질호르몬 제외) 피하주사, 생균제 경구. 지침서는 패혈증형 급사 예방에 출생 시 항생제 투여를 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>초유와 수동면역 — 구성과 흡수<span class="hang">반추동물 신생아는 무감마글로불린으로 태어나 초유 IgG를 수 시간 안에 흡수해야 한다. 자체 항체는 1개월에 방어 수준, 2~3개월에 최고치(Constable). 주 면역글로불린은 IgG1(약 81%)이고 임신 마지막 4~6주에 모체 혈청에서 옮겨온다. 초유는 1 mL당 100만 개 넘는 세포, IGF-1, 트립신 억제인자, 지용성 비타민을 함유한다.</span><table class="bxt"><tr><th>초유 성분(핸드북)</th><th class="c">1일</th><th class="c">2일</th><th class="c">3~4일</th></tr><tr><td>고형분(%)</td><td class="c">23.9</td><td class="c">17.9</td><td class="c">12.9</td></tr><tr><td>단백질(%)</td><td class="c">14.0</td><td class="c">8.4</td><td class="c">3.1</td></tr><tr><td>면역단백질(mg/mL)</td><td class="c">48.0</td><td class="c">25.0</td><td class="c">0.6</td></tr><tr><td>지방(%)</td><td class="c">6.7</td><td class="c">5.4</td><td class="c">3.7</td></tr><tr><td>유당(%)</td><td class="c">2.7</td><td class="c">3.9</td><td class="c">5.0</td></tr></table><span class="hang">흡수는 비선택적 음세포작용이고 혈청 최고치는 12~24시간. 흡수 능력은 8~12시간에 크게(50%까지) 줄고 24~36시간에 멎는다(장 폐쇄). 효율은 6~12시간에 가장 높다. 먹지 않아도 떨어진다. 핸드북은 장 폐쇄가 보통 24시간, 개체에 따라 12시간이라 적는다.</span><span class="hang">흡수를 떨어뜨리는 요인: 세균 오염 초유, 식도관으로 준 1~2 L 소량(일부가 전위에 머묾), 장기 작용 부신피질호르몬 유도 분만, 첫 24시간의 비면역글로불린 거대분자(Blackwell), 양수 섭취(핸드북, 제4위 응유 억제로 포유 거부 유발).</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>초유 급여 — 양과 시기<span class="hang">45 kg 송아지가 혈청 IgG 1,000 mg/dL에 이르려면 IgG 150 g이 필요하다. 좋은 초유는 50 g/L 이상이고 3 L를 가능한 빨리, 늦어도 생후 2시간 안에 먹인다(Constable).</span><span class="hang">젖소: 식도관으로 45 kg당 3.5~4.0 L 1회 급여가 FTPI를 가장 줄인다(Constable). Rebhun은 생후 12시간 안에 4 L(첫 2 L는 1~2시간, 나머지는 12시간 전), Blackwell은 6시간 안에 최소 3 L, Bovine Medicine은 6시간 안에 4 L(체중 10% 이상). Large Animal IM은 첫 급여에 IgG 150 g을 4시간 안에, 1회 최대 체중 7.5%, 12시간까지 5~7.5% 추가를 권한다.</span><span class="hang">육우: 활력과 초유 IgG가 높아 자연 포유로 충분하고, 2시간 안에 빨지 않으면 젖병·식도관으로 먹이며 가능하면 1시간 안에 배부르게 빨게 돕는다(Constable).</span><span class="hang">핸드북: 첫 급여 분만 후 2시간 안, 포유 거부 송아지도 늦어도 6시간 안. 1일 체중의 4~5%(25 kg에 1.0 L)를 24시간에 3~5회 분할. 사양 표는 첫날 3회(직후, 6~8시간 간격), 2일부터 1일 2회, 회당 1~1.5 L, 40℃.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>초유 품질 — 영향 요인과 측정<span class="hang">IgG는 분만 후 착유가 늦어질수록 시간당 3.7% 떨어지고, 착유하지 않아도 떨어진다. 분만 전 유즙 유출·전착유, 건유 30일 미만(Rebhun 최적 40~90일), 대량 초유(홀스타인 8.5 kg 넘으면 낮음), 임신 말기 열 스트레스에서 낮다. 육우가 젖소보다 높다. 초산 초유를 버릴 근거는 없다(Constable).</span><span class="hang">핸드북: 분만이 쉬울수록, 어미 체형이 충실할수록 송아지 IgG가 높다(조산 없음 2,401, 쉽게 조산 2,191, 어렵게 조산 1,918.5 mg/dL; 어미 아주 여윔 1,998.1, 정상 2,309.8, 약간 과비 2,348.9 mg/dL).</span><span class="hang">브릭스 21~22% 이상이면 약 50 g/L로 합격, 미만은 버린다(Constable). Rebhun은 21~23%가 50 g/L, 18% 미만 불량. 저지는 18%가 50 g/L(Large Animal IM).</span><span class="hang">비중계 1.050 이상이 약 50 g/L이나 온도 영향(실온 20~25℃ 측정)이 크고 불합격 초유 3개 중 2개를 통과시킨다.</span><span class="hang">세균 기준: 총세균 10만 cfu/mL 미만, 대장균군 1만 미만(Constable). Rebhun은 기타 그람음성균·연쇄구균·응고효소음성포도구균 각 5만 미만을 더한다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>초유 보관·해동·살균·대체<span class="hang">냉장 약 1주(2일이면 세균 10만 cfu/mL 초과 가능), 소르브산칼륨 0.5%로 며칠 억제, −20℃ 냉동 1년 이상, 1회분씩 납작한 봉지(Constable).</span><span class="hang">해동은 55℃ 미만. 전자레인지는 Constable은 변성을 일으킨다고, Rebhun은 짧게 끊어 녹은 부분을 따라내면 가능하다고 적는다. 핸드북 표에서는 강·약 전자레인지와 온수 해동 IgG가 25,590·26,026·26,088 mg/dL로 비슷했다.</span><span class="hang">살균: 60℃ 60분은 IgG를 지키며 요네균·M. bovis·대장균·살모넬라를 줄인다. 63℃ 30분이나 72℃ 15초는 IgG를 30% 이상 낮춘다(Constable). 핸드북은 63℃ 30분이 면역물질에 유효하고 마이코플라스마·요네균을 멸균한다고, Bovine Medicine은 60℃ 30분을 적는다. 살균 초유 냉장 8~10일.</span><span class="hang">풀링은 저농도 초유가 희석해 홀스타인 풀은 늘 낮고 질병 전파 위험이 있다. 한 마리 기여 9 kg 이하(Constable), Blackwell은 풀링 금지.</span><span class="hang">보충제는 1회분 IgG 100 g 미만(시판 1봉 25~45 g), 대체제는 1회로 IgG 10 mg/mL 이상이어야 한다. 보충제는 초유와 섞지 말고 뒤에 준다. 대체제 2봉(IgG 200 g)은 4 L 모초유와 비슷한 항체가를 냈다(Rebhun).</span><span class="hang">핸드북: 젖소 초유를 냉동 저장해 15℃~체온으로 데워 쓰고, 대용초유가 없으면 어미 혈액 200~500 mL 피하주사. 초유 대용물로 우유 0.6 L + 보릿차 0.3 L + 계란 흰자 1개 + 피마자유 2 g + 분말항생제를 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>면역전달 실패(FPT) — 정의<span class="hang">생후 24시간~7일 혈청 IgG 1,000 mg/dL(10 mg/mL) 미만(Constable), 생후 48시간 IgG1 10 mg/mL(Blackwell). Rebhun: 500 미만은 패혈증에 매우 취약, 500~1,000 부분 FPT, 1,000 이상 가능하면 1,600 이상이면 패혈증 예방. 캐나다 육우 연구는 800 미만 FTPI(6%), 800~1,600 경계(10%).</span><span class="hang">FPT는 질병이 아니라 패혈증·장염·제대염·관절염·호흡기병 소인이고, FPT 송아지의 약 70%는 살지만 생산성이 떨어진다(Blackwell). 자연 포유 젖소 송아지 FTPI는 40~60%, 비교 연구에서 어미 포유 61.4%, 젖병 19.3%, 식도관 10.8%였다.</span><span class="hang">포유를 줄이는 요인: 어미 모성 불량·유열, 처진 유방(45 cm 미만)·굵은 유두(35 mm), 주산기 질식, 허약·외상, 요오드 결핍·추위.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>FPT 검사법<table class="bxt"><tr><th>검사</th><th>기준</th></tr><tr><td>RID</td><td>IgG 직접 측정 표준, 24시간 이상</td></tr><tr><td>혈청 총단백</td><td>5.5 g/dL 이상 적정. 민감도 5.5, 특이도 5.0에서 최대. 군 선별용. Large Animal IM: 5.0 미만 FPT, 5.0~5.5 경계</td></tr><tr><td>혈청 브릭스</td><td>8.4% 이상, 가능하면 10% 가까이(Rebhun), 8.3%(Large Animal IM)</td></tr><tr><td>GGT</td><td>IgG 10 mg/mL 상당 1일령 200, 4일령 100 IU/L. 50 미만 FTPI</td></tr><tr><td>아황산나트륨</td><td>18% 용액에서 혼탁이면 적정</td></tr><tr><td>황산아연 혼탁</td><td>특이도 낮음, 용혈 시 과대. 10단위 미만 고위험·20 이상 저위험(Bovine Medicine)</td></tr><tr><td>측방유동</td><td>현장 20분, 10 mg/mL 합격·불합격</td></tr></table><span class="hang">Bovine Medicine 위험 구분: 총단백 50 g/L 미만 고위험·60 초과 저위험, IgG1 8 g/L 미만·20 초과. 탈수 송아지와 대체제 급여 송아지는 굴절계 총단백이 맞지 않는다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>군 모니터링과 FPT 교정<span class="hang">Constable: 24시간~7일 송아지 최소 12두 중 80% 이상이 총단백 5.5 초과면 만족. Rebhun: 2~7일 12두 중 9두 이상. Bovine Medicine: 2~8일 12두에서 20% 넘게 FPT면 원인 조사.</span><span class="hang">이행 항체 반감기는 IgG 약 20일, IgM 4일, IgA 2일, IgG 최저치는 약 60일.</span><span class="hang">교정: 장 폐쇄 전(18시간 이내)이면 경구, 이후에는 혈장·전혈 정맥. 혈장 20~40 mL/kg, 처음 30분 5 mL/kg/시간으로 떨림·두드러기·부종·호흡 변화를 보고 이상 없으면 10~20 mL/kg/시간. 좌측 겸부 복강 투여도 가능(Large Animal IM). Rebhun은 FPT 송아지에 혈장·전혈 40 mL/kg, 소는 첫 수혈 부작용이 드물다.</span><span class="hang">수혈 IgG 반감기는 4.4일로 초유 유래 17.1일보다 짧고 수혈한 FPT 송아지 폐사가 5배 높았다. 장 폐쇄 뒤에도 초유를 먹이면 장관 국소 방어가 되고, 환경이 나쁘면 FPT 송아지에 광범위 항생제 예방을 고려한다(Large Animal IM).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>송아지 설사 총론 — 기전과 원인<span class="hang">비감염성(식이성) 설사는 흡수·소화불량성으로 분변량이 적고, 감염성 설사는 몸속 수분이 장관으로 나오는 분비성으로 수양성·다량이며 탈수가 심하다(지침서). 사육 중 폐사의 80~90%가 송아지 설사와 호흡기병이고 대부분 1개월령 이하다.</span><span class="hang">직접 원인: 유질 불량·대용유 급변·과잉 급여·온도차·중독(비감염성), 로타·코로나·BVD 등 바이러스, 대장균·살모넬라 등 세균, 콕시듐·크립토 등 기생충(감염성). 간접 원인: 허약, 초유 부족, 유량 부족, 축사 오염, 환기 불량, 틈새바람, 밀사, 수송, 추위·폭염(핸드북·지침서).</span><span class="hang">Constable: 30일령 미만의 급성 미분화 설사는 임상으로 원인체를 구별할 수 없고 혼합 감염이 더 흔하다. 로타·크립토·코로나·ETEC가 75~95%, 30%까지는 병원체 미검출. 원인과 무관하게 소장 대장균이 5~10,000배 과증식해 흡수장애와 균혈증 위험을 키운다.</span><span class="hang">위험요인: 초산우, 저체중, 난산, FPT, 분만장 24시간 초과 체류, 군사, 과밀, 날씨, 열처리 탈지분유 대용유, 관리자, 초유 충분 송아지에 예방적 항생 대용유(오히려 설사 증가). 대용유 송아지는 겨울에 전유보다 폐사가 높았다(21.0% 대 2.8%)(Constable).</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>원인체별 발병 일령<table class="bxt"><tr><th>원인체</th><th>Constable</th><th>Bovine Medicine</th></tr><tr><td>ETEC</td><td>3일 미만</td><td>5일 미만, 드물게 2주</td></tr><tr><td>부착·탈락 대장균</td><td>20~30일</td><td>—</td></tr><tr><td>로타</td><td>5~15일</td><td>5~7일~3주</td></tr><tr><td>코로나</td><td>5~21일</td><td>5~20일</td></tr><tr><td>크립토</td><td>5~15일</td><td>1~3주</td></tr><tr><td>살모넬라</td><td>—</td><td>10~14일 이후</td></tr><tr><td>콕시듐</td><td>3주 이후(수개월령 흔함)</td><td>3주 이후</td></tr><tr><td>기타 바이러스(Breda, BVD)</td><td>14~30일 이상</td><td>—</td></tr></table></span></p><p class="bx-num"><span class="bxn">21.</span><span>원인별 설사 양상(핸드북·지침서)<table class="bxt"><tr><th>원인</th><th>분변·혈변</th><th>일령</th><th>탈수</th><th>체온</th><th>색·양</th></tr><tr><td>로타</td><td>심한 물설사, 중간중간 혈변</td><td>2~30일</td><td>심함</td><td>저하</td><td>황회색, 많음</td></tr><tr><td>코로나</td><td>심한 물설사, 전반적 혈변</td><td>2~30일</td><td>심함</td><td>상승 후 저하</td><td>황적색, 많음</td></tr><tr><td>BVD</td><td>묽은 변, 점액 혈변</td><td>30일 이후</td><td>약함</td><td>저하</td><td>녹황색, 적음</td></tr><tr><td>대장균</td><td>밀가루 반죽, 거품</td><td>10일 전후</td><td>약함</td><td>상승</td><td>황회색, 많음</td></tr><tr><td>살모넬라</td><td>물설사, 전반적 혈변</td><td>20일 전후</td><td>심함</td><td>상승</td><td>녹황색, 중간</td></tr><tr><td>콕시듐</td><td>물설사, 심한 혈변</td><td>30일 이후</td><td>심함</td><td>—</td><td>적색, 중간</td></tr><tr><td>크립토</td><td>물설사, 혈변</td><td>30일 이내</td><td>심함</td><td>—</td><td>적색, 많음</td></tr><tr><td>식이성</td><td>다양, 혈변 없음</td><td>30일 이내</td><td>약함</td><td>—</td><td>황회색, 중간</td></tr><tr><td>분석증</td><td>묽은 변</td><td>30일 이후</td><td>없음</td><td>저하</td><td>흑갈색, 소량</td></tr></table><span class="hang">지침서 간접 원인 점검: 13개월령·250 kg 이상 수정, 분만 전후 어미 영양(분만 직후 배합사료 과다는 과식성 설사), 설사 백신, 분만 입회와 청결 분만실, 즉시 제대 소독, 2시간 안 초유, 초유 전 유두 소독(오염 유두는 10일령 이내 설사), 송아지 전용 공간의 청결·건조, 대용유·인공유·조사료·물 적정 급여.</span><span class="hang">유행 시: 농장 역학 조사, 이환 송아지 격리·즉시 수액, 전신 증상 송아지에만 항생제, 설사 초기와 정상 송아지 분변 30~50 g 검사, 분만 임박 소를 새 분만 장소로 이동(Constable). Bovine Medicine은 미처치 이환 6두·건강 6두 분변과 BVD 지속감염우 혈액검사를 권한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>설사 송아지 평가 — 탈수<span class="hang">목 피부를 집어 1초 비틀었다 놓는다. 정상 2초 미만, 8% 6초, 12% 8초 초과. 안구 함몰은 4·8·12% 탈수에 2·4·7 mm(Constable).</span><table class="bxt"><tr><th class="c">탈수(%)</th><th class="c">안구 함몰(mm)</th><th class="c">피부 텐트(초)</th><th>점막·사지</th></tr><tr><td class="c">0</td><td class="c">없음</td><td class="c">2 미만</td><td>촉촉</td></tr><tr><td class="c">2~6</td><td class="c">1~3</td><td class="c">3~5</td><td>건조</td></tr><tr><td class="c">8</td><td class="c">4</td><td class="c">6</td><td>사지 참</td></tr><tr><td class="c">10</td><td class="c">6</td><td class="c">7</td><td>사지 참</td></tr><tr><td class="c">12</td><td class="c">7</td><td class="c">8 초과</td><td>사지 참</td></tr><tr><td class="c">14 초과</td><td class="c">8 초과</td><td class="c">10 초과</td><td>점막 흰색</td></tr></table><span class="hang">설사 첫 24~48시간에 체중의 10~16%를 잃을 수 있다. 8일 미만은 주로 급속 탈수로, 8일 이상은 D-젖산이 큰 몫을 하는 산증으로 처진다(Constable).</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>설사 송아지 평가 — 염기 결핍<table class="bxt"><tr><th>상태(Constable)</th><th class="c">8일 미만</th><th class="c">8일 이상</th></tr><tr><td>근긴장 좋음, 기립, 흡인 강함, 입안 따뜻</td><td class="c">0</td><td class="c">5 이하</td></tr><tr><td>기립 가능, 입안 약간 서늘, 흡인 약함</td><td class="c">5</td><td class="c">10</td></tr><tr><td>흉와, 입안 서늘, 흡인 없음</td><td class="c">10</td><td class="c">15</td></tr><tr><td>횡와, 흡인 없음, 입안 차가움</td><td class="c">10</td><td class="c">20</td></tr></table><span class="hang">단위 mEq/L. Rebhun 경험칙: 기립 가능 탈수 5~8%·결핍 5~10, 약함 8~12%·10~15, 횡와 12~15%·15~20. 탈수 없이도 만성 중탄산 손실이나 D-젖산으로 산증이 심할 수 있다.</span><span class="hang">신경 증상(운동실조·기면·혼수)은 산혈증보다 D-젖산 상승으로 더 잘 설명되고 안검반사 저하가 가장 좋은 지표다. 10~20일령에 설사 회복 뒤 탈수 없이 산증만 남은 침울·운동실조 송아지는 정맥 중탄산에 빨리 반응한다(Constable).</span><span class="hang">고칼륨혈증은 심한 탈수·산혈증 송아지의 대표 이상(34%)으로 서맥·심방 정지를 일으키며 탈수 정도와 더 밀접하다. 몸 전체 칼륨은 부족하지만 칼륨 수액을 첫 수액으로 주면 위험하고, 처음 1~3 L의 중탄산·포도당으로 교정한 뒤 준다(Rebhun). ETEC 예: Na 127, K 8.1, HCO3 12, pH 7.09. 정맥혈 pH 7.0 미만은 즉시 비경구 산증 치료.</span><span class="hang">고나트륨혈증은 대개 경구 전해질 혼합 오류 때문이다(Constable). 핸드북: 대용유를 1.4~4.4배로 진하게 타고 물을 안 주면 고나트륨혈증(염중독)으로 발열·설사·신경 증상 후 폐사.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">24.</span><span>송아지 설사 — 치료 순서도<span class="hang">1단계 분변: 정상변·약간 무름은 경과 관찰. 무르며 깔짚 위에 퍼지거나 수양성이면 치료한다.</span><span class="hang">2단계 체온: 39.4℃ 이하이고 똘똘하면 항생제 불필요. 39.4℃ 이상, 식욕 없고 처지면 수의사 상담, 항생제 필요.</span><span class="hang">3단계 평가: 탈수(눈알 함몰), 빨기 반응, 입안 온도, 기립 여부.</span><span class="hang hang3">눈알 함몰 없음, 빨기 반응 있음, 입안 따뜻, 기립 가능 → 경구수액(무른 변 하루 2리터, 수양성 하루 4리터), 우유 정상 급여, 소염제 주사.</span><span class="hang hang3">눈알 함몰 1 mm 이상, 빨기 반응 없음, 입안 차가움, 기립 불능 → 수의사 왕진 수액 처치.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">25.</span><span>수액요법 — 치료군과 결정 기준<span class="hang">Constable 현장 분류: ① 탈수 7% 미만, 흡인 좋음, 기립, 입안 따뜻 → 경구 수액. ② 탈수 7~9%, 흡인 약함, 근긴장 좋음 → 7.5% 고장식염수 3~4 mL/kg 5분 정맥 + 경구 수액 40~60 mL/kg, 6~8시간 뒤 재평가. ③ 탈수 9% 초과, 점막 서늘, 횡와, 흡인 없음 → 알칼리화제 포함 정맥 수액 6~8시간(필요하면 24~36시간).</span><span class="hang">21일령 미만은 설사 초기부터 경구 전해질을 주고, 안구 함몰 4 mm 이상이거나 일어서지 못하면 정맥 수액을 더한다(Constable). 지침서: 먹는 양보다 분변이 많으면 수액하고, 식욕이 있으면 경구 전해질이 정맥과 효과가 같다.</span><span class="hang">결정나무(Trefz 등): 흡인 세기, 안구 함몰, 기립 능력, 밀었을 때 자세 교정·안검반사로 경구 수액(고SID)과 등장 중탄산나트륨 250·500·750 mmol 정맥(필요 시 포도당)을 고르고, 안구 함몰 송아지에는 0.9% 식염수 5~10 L 지속 점적(7 mm 이상이면 10 L).</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>경구 전해질 용액의 조건<span class="hang">삼투압 300~700 mOsm/kg. 우유를 끊으면 고장(약 600), 우유를 먹이면 등장. 나트륨 90~130 mmol/L(우유는 평균 28). 포도당과 아세트산·프로피온산·글리신으로 나트륨 공동수송을 돕는다. 알칼리화제 40~80 mmol/L, 유효 SID 40~80(SID 0은 금지)(Constable). Rebhun은 알칼리화 능력 70~80 mEq/L, 거의 등장, 하루 4~6 L.</span><span class="hang">아세트산·프로피온산은 응유를 막지 않아 우유와 함께 줄 수 있고 살모넬라 증식을 억제한다. 중탄산 용액을 우유 없이 주면 제4위를 알칼리화해 ETEC를 도울 수 있으나 심한 산혈증은 더 빨리 교정한다. 체중 kg당 포도당 2.4 g 초과는 재수화를 늦출 수 있다.</span><span class="hang">설탕을 넣은 가정용 전해질은 송아지가 소화하지 못해 설사를 악화시키고, 전해질만 1~2일 넘게 먹이면 굶어 죽는다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>정맥 수액 — 양·속도·조성<span class="hang">수화 첫 4~6시간 100~150 mL/kg, 유지 60~80 mL/kg/24시간, 심한 설사는 150 mL/kg/24시간. 50 kg 송아지 8% 탈수 재수화 4 L, 12% 6 L, 유지 2.5~5 L. 등장액은 시간당 1~3 L. 30~60분 안 배뇨와 태도 개선이 좋은 반응, 호흡곤란·무뇨·강직은 나쁜 반응(Constable).</span><span class="hang">권장 조성: 나트륨 150, 칼륨 5, 중탄산·전구체 약 50 mmol/L. 산혈증이 없으면 중탄산 불필요. 등장 식염수와 등장 중탄산을 같은 양 섞고 5% 포도당을 더한 처방이 제시된다(Constable).</span><span class="hang">Whitlock 처방(Rebhun): 5% 포도당 1 L + NaHCO3 150 mEq를 처음 1~3 L, 이후 유산링거 등. ETEC는 2~4 L 뒤 6시간 안에 일어서고 6~24시간에 빨기 시작해, 이런 반응이 패혈증 배제에 도움이 된다.</span><span class="hang">정맥로: 경정맥 10~14 G 카테터 또는 귀정맥(22 G 나비침, 귀 밑동 지혈대).</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>중탄산 계산과 고장 용액<span class="hang">결핍량(mEq) = (정상 − 측정) × 체중 × 분포 공간(신생아 0.5, 성축 0.3)(Constable). 예: 40 kg, HCO3 10 → 목표와 차 15 × 20 L = 300 mEq(Rebhun). 핸드북 제4위 고창 항목은 분포 공간을 0.6으로 쓴다.</span><span class="hang">8.4% 중탄산은 1 mL = 1 mEq, 1 mL/kg/분 이하. 5%는 2 mL/kg/분 이하. 등장 1.3%는 pH 7.20 미만에 쓴다. 칼슘 글루콘산과 섞으면 침전.</span><span class="hang">고장식염수 7.2~7.5% 4~5 mL/kg을 4~5분(1 mL/kg/분)에 경정맥 투여. 빠르면 순환 허탈, 느리면 이점 없음. 직전에 경구 전해질 3 L를 식도관으로 주면 재수화가 가장 빠르다. 같은 나트륨량이면 등장 중탄산이 재수화에, 고장 중탄산(8.4% 10 mL/kg)이 빠른 산증 교정에 낫다(Constable).</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>한우 현장 탈수·수액표(50 kg, 핸드북·지침서)<table class="bxt"><tr><th class="c">탈수(%)</th><th>증상</th><th class="c">피부 복귀(초)</th><th class="c">수액량(L)</th><th>방법</th></tr><tr><td class="c">4~6</td><td>안구 함몰 거의 없음, 먹고 갈증 없음</td><td class="c">—</td><td class="c">2.4~2.8</td><td>경구</td></tr><tr><td class="c">6~8</td><td>식욕 감퇴, 구강 건조</td><td class="c">2~4</td><td class="c">2.7~3.3</td><td>경구</td></tr><tr><td class="c">8~10</td><td>기립 곤란, 체온 하강</td><td class="c">6~10</td><td class="c">3.0~3.8</td><td>경구+정맥</td></tr><tr><td class="c">10~12</td><td>쇼크, 기립 불능, 혼수</td><td class="c">20~45</td><td class="c">3.3~4.3</td><td>정맥</td></tr></table><span class="hang">수액량 = 유지량(체중 3%) + 탈수량 × 1/3~1/2(WHO). 전해질과 5% 포도당 교대(오전 전해질, 오후 포도당). 지침서 정맥 운용: 배뇨까지 1,000~2,000 mL, 이후 6시간마다 1,000 mL를 안구가 정상 위치로 올 때까지, 39.5℃보다 높게 데워(약 45℃ 물통에 수액 세트) 주고 보온한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">30.</span><span>송아지 설사 — 우유 급여·항생제·소염제<span class="hang">Constable: 일시 절식의 근거는 없고 우유를 계속 먹인 송아지는 폐사·이환이 늘지 않고 증체가 좋았다. 소량씩 자주, 물로 희석하지 말고(응유 방해), 식도관으로 강제 급여하지 않는다(제1위 발효). 일반적으로 24시간 넘게 끊지 않고, 경구 전해질을 우유에 타 주어도 되며 이때 물을 항상 준다.</span><span class="hang">Rebhun: 우유는 24~36시간 이내로만 끊고 그 사이 전해질을 4~6회, 알칼리화 전해질은 우유 30분 전후로 따로 준다.</span><span class="hang">핸드북은 대장균 설사에 우유·사료 24시간 절식과 수액·보온을, 지침서는 비감염성 설사에 절식 또는 제한 급여를 적는다. 핸드북 저지방혈증 항목은 설사 치료 중 어미와 떼지 말고 포유시키라고 한다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>항생제 사용 기준과 용량<span class="hang">Constable: 전신 증상 없는(식욕 정상, 무열) 설사 송아지는 항생제를 주지 않는다. 전신 증상이 있으면 약 30%를 균혈증으로 보고 소장·혈액 대장균을 겨냥한다(적정 수동면역도 8~18% 균혈증). 분변 대장균 감수성 검사는 소장·혈액 균총을 반영하지 않아 권하지 않는다. Rebhun: 전신 증상이나 혈액·점막 원주가 있으면 사용을 지지한다.</span><span class="hang">지침서: 20일령 이전은 경구 항생제, 20일령 이후는 장내 세균총 보호를 위해 주사 항생제와 생균제 든 정장 지사제.</span><table class="bxt"><tr><th>목적</th><th>약물·용량</th></tr><tr><td>소장 대장균(경구)</td><td>아목시실린 10 mg/kg 12시간마다 3일 이상, 아목시실린·클라불란산 10+2.5 mg/kg(Rebhun 12.5 mg/kg) 12시간마다</td></tr><tr><td>균혈증(비경구)</td><td>세프티오퍼 2.2 mg/kg IM·SC 12시간마다 3일 이상, 아목시실린·암피실린 10 mg/kg IM 12시간마다, 설파디아진 20 + 트리메토프림 5 mg/kg 24시간마다 5일</td></tr><tr><td>기타</td><td>콜리스틴 10만 IU/kg PO 24시간마다(패혈증에는 부적합), 엔로플록사신 2.5~5 mg/kg 24시간마다, 네오마이신 10 mg/kg PO 12시간마다</td></tr></table><span class="hang">테트라사이클린은 우유와 주면 생체이용률이 떨어지고, 플로르페니콜은 대장균 MIC90에 못 미치며, 아미노글리코사이드는 신독성과 15~18개월 휴약으로 권하지 않는다. 3·4세대 세팔로스포린과 플루오로퀴놀론은 일차 치료로 쓰지 않는다(OIE)(Constable).</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>소염제·지사제·생균제<span class="hang">NSAID는 수액과 함께 주면 통증·회복·증체가 좋다. 멜록시캄 0.5 mg/kg IV·SC 1회, 케토프로펜 6 mg/kg(IM 1회 또는 IV 4시간 간격 2회), 플루닉신 2.2 mg/kg IV 1회(혈변 송아지에서만 회복 촉진). 탈수 시 신손상 위험이 있어 수액을 확보하고 최대 3회로 제한한다(제4위 궤양). 부신피질호르몬은 권하지 않는다(Constable).</span><span class="hang">장운동 억제제는 장액을 가두고 D-젖산 축적을 키울 수 있어 권하지 않는다(Constable). Rebhun은 과량 시 고창·장마비로 금기라 하고, 핸드북은 베르베린산·아트로핀·몰핀을 장운동 억제에 든다. 카올린·펙틴은 병인에 영향이 없고, 생균제는 동물 임상 근거가 없어 권하지 않는다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">33.</span><span>장독성 대장균(ETEC, K99) — 원인<span class="hang">섬모 F5(K99, 흔히 F41 동반)로 소장 상피에 붙어 내열성 장독소(STa)를 내 조직 손상 없이 수분·전해질을 과분비시킨다. F5 발현과 독소 생산이 pH 의존적이라 pH가 가장 높은 회장에서 시작한다(Constable).</span><span class="hang">F5 임상례의 80% 넘게가 4일령 미만이고 3일령 미만 설사 송아지 유병률 50~60%, 8일령 5~10%. 3일령 넘은 ETEC 감염은 대부분 바이러스를 동반한다(Constable). Rebhun: 감수성은 생후 48시간에 최대, 로타 동반 시 약 10일령까지.</span><span class="hang">설사 송아지는 12시간에 10^10/g 균을 함유한 변 1 L 이상을 내는 증폭기이고 회복 후 수개월 배출한다. 이환 보통 30%(집약 젖소 75%까지), 치명률 10~50%.</span><span class="hang">핸드북: 1일령은 제4위 산도가 낮고 췌장 단백분해효소가 없어 균이 쉽게 증식하고, 일령이 늘면 제4위 pH 4.0~5.5로 대부분 막힌다. 우유가 소화되지 않아 흰~회백색 설사(송아지 백리).</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>ETEC — 임상·진단·치료<span class="hang">장독혈증형: 설사 없이 심한 허약, 혼수, 저체온, 차고 끈끈한 피부, 서맥·부정맥, 배 출렁임 소리, 2~6시간 내 폐사. 흔한 형: 연노랑~흰색 수양~죽 모양 악취 설사(건물 10% 미만), 15~20%는 3~5일에 걸쳐 악화(Constable). 잠복 6~18시간(핸드북).</span><span class="hang">Rebhun: 서맥은 저혈당·고칼륨혈증 때문이고, 국소 감염(전방축농·관절염)은 ETEC답지 않다. 정맥 수액에 극적으로 반응하면 ETEC를 강하게 시사한다.</span><span class="hang">진단: 5일령 넘은 송아지 분변 ETEC는 존재 의미뿐이다. 치사 예 회장을 묶어 냉장 배양하고, 2~3 cm로 갈라 포르말린에 흔들어 고정해(묶지 않음) 융모 부착 간균을 본다. F 항원 형별을 요청한다(Rebhun). 핸드북: 직장변 10^9, 장 내용물 10^6 cfu/g 이상이면 의심.</span><span class="hang">치료는 수액이 중심이고 순수 ETEC는 경구 아목시실린으로 장내 균을 줄일 수 있다. 분변은 2~4일 무르고 더 길면 다른 병원체를 의심한다(Rebhun). 핸드북은 효과 높은 항균제를 회복 뒤 2~3일 더 쓰고, 어미 혈액 수혈·감마글로불린·대장균 난황항체를 든다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>ETEC — 예방<span class="hang">원칙: 병원체 노출 감소, 충분한 초유, 어미 백신(Constable). 백신은 관리를 대신하지 않는다.</span><span class="hang">어미 F5 백신: 첫해 분만 6·2주 전(Constable), 6·3주 전(Rebhun), 핸드북 6·4주 전, 이후 매년 1회. 백신 효과 전 3~4주에 태어난 송아지에는 F5 단클론항체를 초유 전 출생 직후 경구로 준다(실험 폐사 29% 대 대조 82%).</span><span class="hang">핸드북: 초유 직후 유산균 경구, 분만사 분변 수시 제거·소독, 송아지방 사용.</span><span class="hang">기타 병원성 대장균(AEEC·STEC): 장독소 없이 대장 미세융모를 없애 2~5주령(Rebhun 4~28일)에 선홍색 혈변·이급후증·발열. 핸드북은 VTEC·AEEC가 10~30일령에 신 냄새 회백~황색 수양변이나 점액 혈변을 낸다고 적는다. 심한 혈변에는 전혈 1~2 L, 부신피질호르몬·프로스타글란딘 억제제는 금기, F5 백신은 무효이고 살모넬라를 반드시 감별한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">36.</span><span>대장균성 패혈증 — 원인·임상<span class="hang">패혈증형 대장균(O78 등)이 장관·비인두·편도·제대혈관으로 침입해 내독소 쇼크를 일으키고 주요 소인은 FPT다. 생후 첫 4일에 많고 경과 24~96시간, 생존율 12% 미만(Constable). Rebhun은 1~14일령, 분만방에서 많이 노출되면 더 일찍, 증상 전부터 분비물로 대량 배출한다고 적는다. 핸드북: 1~3일령에 증상 없이 24~72시간 만에 급사, 뇌수막염 동반.</span><span class="hang">임상: 허약, 횡와, 탈수, 빈맥, 처음 고열이 곧 저체온, 흡인 소실, 서늘한 점막, 차가운 사지, 공막 충혈. 설사는 흔하지 않다. 귓바퀴 점상출혈, 전방축농·포도막염, 후궁반장(뇌수막염), 관절 파행, 제대정맥염(Rebhun). 살아남으면 약 1주 뒤 관절염·뇌수막염·전안구염으로 국소화하고 뇌수막염 치명률 100%(Constable).</span><span class="hang">예측 인자: 크레아티닌 상승, 호중구 독성 변화, FPT(IgG 800 이하, 총단백 5 g/dL 이하), 5일령 미만, 국소 감염, 횡와, 약한 흡인(Constable).</span><span class="hang">검사: 좌방이동·독성 호중구, 저혈당. 14일령 미만 누운 탈수 설사 송아지에서 심한 산증이 없으면 대개 패혈증이다. ETEC는 생후 48~96시간, 탈수·수양변이 더 심하고 수액에 극적 반응, 패혈증은 설사가 말기에 생기고 반응이 없다(Rebhun). 혈액배양은 몇 시간 뒤 한 번 더 채취한다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>대장균성 패혈증 — 치료와 예방<span class="hang">항생제는 인지 후 1시간 안에 정맥으로(1시간 지연마다 생존 10% 감소, 사람 의학). Constable 처방 예: 아목시실린·클라불란산 25 mg/kg IV·IM 6~8시간마다, 암피실린 나트륨 10 mg/kg 8시간마다, 세프퀴놈 2 mg/kg IM 24시간마다, 세프티오퍼 2.2 mg/kg 12시간마다, 엔로플록사신 5 mg/kg 24시간마다, 플로르페니콜 20 mg/kg IM 24시간마다, 트리메토프림-설파 25 mg/kg IV 8~12시간마다.</span><span class="hang">Rebhun: 균형 전해질에 포도당 2.5~10%, HCO3 10 미만이면 중탄산 20~50 mEq/L. 아미노글리코사이드는 신독성과 최소 18개월 휴약. 안정 후 BLV·BVDV 음성 전혈 1~2 L(20~40 mL/kg) 또는 혈장. 경련에는 디아제팜 5 mg씩 증량. 패혈성 관절은 세척.</span><span class="hang">예방: 고품질 초유를 충분히 제때, 분만방은 소마다 청소·소독, 송아지를 빨리 분만 구역에서 빼 개별 송아지방으로(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>로타바이러스 설사 — 원인·임상·치료·예방<span class="hang">원인·역학: 레오바이러스과, 송아지는 대부분 A군. 성우는 거의 100% 항체가 있고 무증상 배출한다. 초유 장관 항체가 분만 3일째까지 급감하고 잠복 18~24시간이 더해져 정점은 5~7일령(Constable). 핸드북: 1~2주령 다발, 송아지 설사의 30~50%, 폐사 0~50%(복합 감염·초유 부족 시 90%), 4~5일령부터 발병, 잠복 12~36시간.</span><span class="hang">분변 1 g에 10^10개(Constable), 10^8~10^9개(핸드북), 분변 속 6개월 이상 생존. 차아염소산나트륨·에탄올·포르말린·글루타알데히드·페놀·요오드가 유효(핸드북). ETEC·BVDV 동시 감염은 악화시킨다.</span><span class="hang">병인·임상: 소장 융모 끝 상피 탈락, 미성숙 세포로 대체되어 이당분해효소 부족, 흡수불량과 D-젖산. 융모는 4~6일에 재생, 성장 회복은 10~21일(Constable). 갑자기 연노랑 점액성 수양변, 며칠에 회복, 5~14일령 50%까지 폭발적. 5일령 미만에서 탈수·쇼크가 심하다(Rebhun).</span><span class="hang">진단: 설사 첫 24시간 분변 PCR(표준), ELISA·면역크로마토. 건강 송아지도 배출하고 경구 생백신 후 최소 3일 PCR 위양성(Rebhun).</span><span class="hang">치료: ETEC에 준한 수액, 융모 손상에도 하루 4~6 L 경구, 우유는 소량씩 자주 계속(가능하면 락타제). 우유를 24시간 넘게 끊으면 악액질 위험이 크다(Rebhun). 이차 감염에 항생제.</span><span class="hang">예방: 중화항체가 1:1,024 이상 초유를 14~30일 계속 먹이면 대개 막고, 우유에 초유 10%를 30일까지 섞어 발생을 줄였다(Rebhun). 어미 사독 백신 분만 6·3주 전, 이후 매년 분만 4주 전 이상. 송아지 경구 생백신은 초유 항체에 중화되고 14일 전 감염을 못 막아 효과가 의문이다(핸드북, Constable). 유기물 제거 후 소독제 10분 이상 접촉, 송아지방 바닥은 수일~수주 햇볕 건조(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>코로나바이러스 설사 — 원인·임상·치료<span class="hang">송아지 설사·호흡기병, 성우 겨울 이질과 관련된 단일 혈청형. 1일~3개월령, 대부분 1~2주령, 겨울에 흔하고 성우 70%까지 배출(Constable). 핸드북 4~5일령~3주령, Rebhun 평균 7~10일령.</span><span class="hang">소장 융모와 대장 융기·음와까지 파괴해 재생이 늦고 혈액 반점이 생기며, 혼합 감염 시 폐사 50% 초과(Rebhun).</span><span class="hang">핸드북: 잠복 20~72시간, 3~30일령에 심한 설사 3~6일. 1일 묽은 설사·체온 상승 → 2일 수양성 분출 → 3일 혈변·탈수. 콧물·기침 같은 가벼운 호흡기 증상 동반.</span><span class="hang">진단: 첫 24시간 분변 PCR, 부검은 나선결장이 최선. 치료는 로타와 같고 설사가 1주 갈 수 있어 이차 감염에 전신 항생제. 외피 바이러스라 환경 저항성이 로타보다 훨씬 낮다. 어미 사독 백신, 송아지 비강 생백신(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">40.</span><span>크립토스포리디움 — 원인·임상<span class="hang">3주령 미만 송아지 설사는 사실상 C. parvum(인수공통)이고, C. andersoni(제4위)·C. bovis는 이유 후 소에 많고 거의 무해하다. 오시스트는 배출 즉시 감염성, 감염량은 1~100개, 자가감염이 있다. 잠복 2~7일(Rebhun 3~4일), 배출 3~12일.</span><span class="hang">핸드북: 6일령부터 검출, 10일령 이후 감염률 50% 초과, 설사변 10^4~10^6/g. 오시스트는 냉습 환경에서 18개월 이상 살고 염소계 등 대부분 소독제에 강하다. 건조, 60℃ 초과, 자외선, 암모니아, 과산화수소, 이산화염소, 10% 포르몰에 약하다(Constable). 핸드북은 70℃ 이상, 상온 1~4주 건조, 45℃ 6시간을 든다.</span><span class="hang">임상: 5~15일령(Rebhun 5~28일)에 노랗고 창백한 수양변이 다른 원인보다 며칠 길게 간다. 심한 탈수는 드물고 대부분 빠는 의욕을 유지한다. 3주령 미만 이환 50% 초과, 폐사는 낮다. 우유를 끊고 전해질만 주면 3~4주령에 기아로 죽는다(Constable).</span><span class="hang">진단: 오시스트 4~6 μm로 작다. 설탕 부유법, 변형 Ziehl-Neelsen·키니욘 염색, 형광항체, ELISA, PCR. 배출이 설사 뒤까지 이어져 로타·코로나보다 검출이 잘 된다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>크립토스포리디움 — 치료·예방<span class="hang">지지요법: 수액과 함께 전유를 하루 여러 번 소량씩 필요량 전부(Constable). 전해질만 24시간 넘게 쓰지 말고 우유 하루 2회 이상, 한겨울엔 3회 이상(Rebhun).</span><span class="hang">할로푸지논 락테이트 60~125 μg/kg 7일(Constable), 100 μg/kg 7일(Rebhun). 증상·배출을 줄이나 배출을 늦출 뿐이고 설사를 못 줄였다는 보고도 있다. 안전역이 좁아 용량을 지키고 심한 탈수 송아지에는 금지. 니타족사니드는 배출 기간과 분변을 개선했다(Rebhun).</span><span class="hang">라살로시드: 핸드북·지침서는 라살로시드와 생균제가 증상을 완화한다는 보고를 들고, Rebhun은 송아지에 독성인 고용량에서만 효과가 있다고 적는다.</span><span class="hang">예방: 깨끗한 분만, 이른 초유, 생후 2주 이상 개별 사육, 설사 송아지 격리, 어린→큰, 건강→아픈 순서 작업. 송아지방은 새 땅이나 콘크리트로 옮기고 비누·뜨거운 물로 문질러 오시스트를 떼어내며 20% 여분을 두어 햇볕 건조, 과산화물 소독제, 경사 5~10%(Rebhun). 분뇨는 퇴비화(핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">42.</span><span>콕시듐증 — 원인·임상·진단<span class="hang">E. zuernii·E. bovis가 회장 끝·맹장·결장 점막을 탈락시켜 출혈성 장염을 낸다. 정점일 때 오시스트가 아직 적을 수 있다. 개방기 15~17일, 18~21일. 오시스트는 12~32℃·산소·습기에서 포자 형성하고 35℃ 초과·습도 25% 미만·햇볕 4시간에 죽는다(Constable).</span><span class="hang">핸드북: 1~18개월령에 감염, 주로 30~60일령 발병. Constable: 21일령 이후, 수개월령에 흔하고 이유·과밀·바닥 급여·첫 방목·한파 후. 발병 대개 5~10%, 유행 시 80%. 부신피질호르몬은 급성화시킨다.</span><span class="hang">임상: 악취 수양변에 점액·혈액(검은 타르 착색, 혈괴), 회음부 혈변, 심한 이급후증·직장 탈출, 경과 5~6일. 핸드북 3형: 급성 혈변형(소장 감염 검은 타르 피덩어리, 대장 감염 붉은 피, 후기 위막, 체온 38℃ 이하 예후 불량, 7~10일 넘기면 회복 가능성), 만성 설사형, 돌연사형(C. perfringens 이차 감염).</span><span class="hang">신경형: 떨림, 과민, 간대-강직 경련, 안진. 혹한 중·후에 많고 사망률 80~90%. 부신피질호르몬 금기(Constable).</span><span class="hang">진단: 분변 g당 5,000개 초과를 의미 있게 본다. 이질 2~4일 뒤 여러 두 검사, 없으면 메로조이트 도말. 부검: 맹장·결장 점막 비후·출혈, 회장 끝 흰 낭포.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>콕시듐증 — 치료·예방<table class="bxt"><tr><th>약물</th><th>치료</th><th>예방</th></tr><tr><td>설파디미딘</td><td>140 mg/kg PO 3일</td><td>사료 35 mg/kg 15일</td></tr><tr><td>암프롤리움</td><td>10 mg/kg 5일 또는 65 mg/kg 1회</td><td>사료 5 mg/kg 21일</td></tr><tr><td>모넨신</td><td>—</td><td>16.5~33 g/톤</td></tr><tr><td>라살로시드</td><td>—</td><td>1 mg/kg BW, 인공유 40 mg/kg(3일령~12주령)</td></tr><tr><td>데코퀴네이트</td><td>—</td><td>0.5 mg/kg BW 연속</td></tr><tr><td>톨트라주릴</td><td>20 mg/kg 1회 경구</td><td>방목 10일 뒤 20 mg/kg 1회</td></tr></table><span class="hang">대부분 약은 초기 분열체만 억제하고 생식 단계에는 무효다. 감수성 단계는 감염 후 13~15일 이전이라 사료 투약 뒤에도 12~15일 새 환자가 나올 수 있다. 모넨신을 끊으면 면역이 없어 치명적 발병이 생길 수 있다(Constable).</span><span class="hang">핸드북: 복합 설파제 주사나 설파제·암프롤리움 경구(50~30 mg/kg 3~5일), 심한 탈수에 수액·수혈·비타민K. 상시 발생 우사는 생후 10·30·60일령 전후 설파제 20 mg/kg 3일(지침서 동일, 톨트라주릴도 활용). 1~2% 크레졸 유효, 퇴비 발효열 1일로 사멸.</span><span class="hang">관리: 면역이 생기는 동안 과밀 회피, 사료·급수조를 바닥에서 띄움, 분만장 건조(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">44.</span><span>살모넬라증(송아지) — 원인·임상·치료<span class="hang">Typhimurium은 2개월령 미만 장염·패혈증, Dublin(SD)은 2개월 넘은 송아지와 성우에 비슷하게 나온다. SD는 성우 보균우를 만들고 송아지는 거의 보균되지 않는다. 송아지 발생 시 이환 50% 이상, 12주령 미만 폐사 최고, 환경에서 평균 14개월 생존(Constable). 잠재 배출우가 분만 때 배출하고 SD는 무증상 어미의 초유·우유로도 옮는다(Rebhun). 핸드북: 잠복 2~7일, 1~4주령 집단 발병. Rebhun: 2주~2개월령 흔함.</span><span class="hang">임상: 패혈증형(수주령 미만) 고열 40.5~42℃, 침울, 호흡곤란, 운동실조·안진, 24~48시간 폐사, 설사 드묾. 급성 장염(1주령 이상) 40~41℃, 악취 수양변에 점액·혈액·섬유소 원주, 생존 시 다발관절염·폐렴. 만성은 간헐 설사·39℃ 발열·수척. SD는 사지·귀·꼬리 말단 건성 괴저(Constable). 호중구감소·좌방이동이 ETEC보다 흔하다(Rebhun).</span><span class="hang">핸드북 부검: 제4위~대장 점막 출혈, 장간막 림프절 종대, 간 괴사 백반, 지라 종대. 혈청형 확정에 약 2주.</span><span class="hang">치료: 균혈증 의심 급성 예에는 항생제를 쓰고 감수성 검사로 고른다. Constable: 트리메토프림-설파 20 mg/kg 12~24시간마다, 아목시실린 10 mg/kg IM 12시간마다, 아목시실린·클라불란산 12 mg/kg, 암피실린 10 mg/kg, 엔로플록사신 2.5~5 mg/kg·세프티오퍼 1.1~2.2 mg/kg 24시간마다(뒤 둘은 일차 사용 지양), 플루닉신 2.2 mg/kg 또는 멜록시캄 0.5 mg/kg 1회. 대사성 산증에 중탄산 용액, 혈변에 전혈, 저단백혈증에 콜로이드, 설사는 ETEC보다 길다(Rebhun).</span><span class="hang">예방(핸드북): 격리 치료, 정기 보균우 검사, 세척·소독·건조, 쥐·야생조류 차단, Typhimurium·Dublin 백신.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">45.</span><span>클로스트리듐 퍼프린젠스 장독혈증 — 원인·임상·치료<span class="hang">B·C형의 트립신 민감 베타 독소가 출혈성 장염·궤양을 일으키고 잘 자라는 어린 개체가 걸린다. 송아지에서는 드물게 7~10일령(10주령까지)에 심한 이질 유행으로 나타난다(Constable).</span><span class="hang">임상: 설사, 이질, 급성 복통, 격렬한 울부짖음·질주, 강직·후궁반장. 심급성은 설사 없이 수 시간 내 폐사, 덜 심하면 약 4일 앓고 회복 10~14일. 부검: B형은 회장 깊은 궤양(2.5 cm까지), C형은 분절 전체 괴사. 장 내용물 냉동·점막 도말·PCR.</span><span class="hang">치료: 수액, 고면역혈청, 페니실린(Constable). Rebhun: 혈장·헤타스타치 5~10 mL/kg, 칼륨·나트륨 페니실린 44,000 U/kg IV 6시간마다 24~48시간 후 프로카인 페니실린 44,000 U/kg IM 12시간마다.</span><span class="hang">예방: 어미 톡소이드 1개월 간격 2회(두 번째 분만 2~3주 전), 이후 매년 분만 직전 1회. 백신 효과 전(2주) 출생 송아지에는 항혈청이나 지속형 페니실린. B·C형은 교차 방어된다(Constable). A형은 정상 세균이라 병원성 판단이 어렵고 제4위 고창·궤양과의 관련이 거론된다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">46.</span><span>노로·토로바이러스 — 기타 설사 원인 포함<span class="hang">노로(칼리시바이러스과, 유전자군 III): 유럽 소 90% 이상 항체, 신생~2개월령 지속 물 같은 설사, 소장 상피만 감염, 특이 치료·백신 없음(핸드북).</span><span class="hang">토로(Breda): 일본 90%, 미국 88.5% 이상 항체. 잠복 24~72시간, 3~5일 수양 설사·탈수, 5~6개월령도 걸림, 심하면 48~96시간에 폐사, PCR 진단(핸드북). 노로·토로 등은 정상 송아지에서도 나오고 실험 재현이 안 되었다(Rebhun).</span><span class="hang">지아르디아: 크립토는 1개월령 미만, 지아르디아는 더 큰 송아지에서 중요하고 만성화할 수 있다(Constable). 젖소 송아지는 비인수공통 E형이 흔하다(Rebhun).</span><span class="hang">유두분선충(핸드북): 고온다습 톱밥 깔짚의 감염 자충이 경피 감염. 돌발사형은 2~3개월령이 여름~초가을에 괴성을 지르며 수 분 만에 심장 돌연사(부검 소견 없음). 비돌연사형은 출혈성 장염·점액 혈변·수척. 이버멕틴·티아벤다졸, 여름철 깔짚 교환과 일제 구충.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>BVD — 송아지 설사 관점<span class="hang">출생 후 감염은 대부분 불현성이고 면역관용우에서 설사, 잇몸·입속 궤양, 장점막 탈락, 치료 무반응 폐사, 파스튜렐라 이차 폐렴(핸드북). 임신 42~125일 감염 시 면역관용우가 되어 평생 배출하고, 증상이 나면 치료되지 않아 즉시 도태한다(지침서).</span><span class="hang">Constable: 3~6주령 송아지 설사의 원인인지는 알 수 없고 인과관계 증거가 없다. 로타와 동시 감염하면 장 질환이 심해졌다.</span><span class="hang">예방(핸드북): 백신은 이유 30일 전 완료, 임신 120일 미만 임신우는 생독 백신 회피, 구입우는 접종 후 합사, 정기 혈청검사로 면역관용우 도태.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>송아지 설사 — 예방접종(한우송아지핸드북)<span class="hang">어미와 송아지 중 한 방법만 쓰고 분만 전 어미 백신이 초유 전달에 가장 좋다. 어미 근육주사: 1차 분만 5~6주 전(제품에 따라 7~8주 전), 2차 2~3주 또는 4주 전, 이후 매 분만 4주 전 1회. 혼합 제품은 분만 45·15일 전 등 제품별로 다르다.</span><span class="hang">송아지 경구 백신(로타·코로나): 초유 전 3 mL 점적, 3~4시간 젖을 물리지 않음, 백신 후 14일령 이내 설사는 못 막는다. 송아지 경구 항체 제품(퍼스트디펜스 1캡슐, 아이지드링크 50 mL 등)은 출생 후 가급적 빨리 준다.</span><span class="hang">BVD는 호흡기 혼합 백신, 콕시듐 발생 농장은 10·30·60일령 각 3일 설파제. 지침서: 10% 암모니아수 바닥 소독이 안전하고 효과적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">49.</span><span>제대염·제대정맥염·요막관염 — 원인과 임상<span class="hang">배꼽은 출생 직후 봉인이 없어 흔한 침입로이고 FPT 송아지에서 특히 흔하다. 요막관 감염이 가장 흔하고 제정맥이 제동맥보다 자주 감염된다. 만성 제정맥 감염은 간농양, 제동맥 감염은 방광 감염으로 간다(Rebhun). 원인균은 T. pyogenes, 대장균, 프로테우스, 연쇄구균, 포도구균(Blackwell). 핸드북: 수컷 다발, 탯줄이 닫히는 약 1주 동안 위험, 불결한 분만·설사·비타민A 결핍·조산·서로 배꼽 빨기가 유인.</span><span class="hang">제대염: 생후 2~5일, 배꼽 비대·통증·누공 배농, 크면 아급성 독혈증·발열. 제대정맥염: 대개 1~3개월령, 간까지 농양, 만성 독혈증과 발육 부진, 겉 배꼽이 정상일 수도 있어 등을 대고 눕혀 간 방향으로 깊이 촉진한다. 제대동맥염은 드물고 항생제에 반응이 없다. 요막관염은 배꼽 뒤 위쪽 종괴와 방광염·농뇨(Constable).</span><span class="hang">핸드북: 생후 1주(때로 2~3주)에 고열 40℃, 식욕 감퇴, 설사, 기립불능으로 백리로 오인할 수 있다. 배꼽이 축축하고 악취·부기·압통. 제대정맥염 송아지는 설사 경향이 많고 간농양·다발관절염·방광염으로 악화되며, 독혈증이 급하면 무증상 폐사나 2~3일 급성 경과로 죽는다.</span><span class="hang">초음파 정상치(Rebhun, 7.5~10 MHz): 겉 배꼽 밑동 2.4·끝 1.8 cm 이하, 복벽 안 제정맥 1일령 1.7·1주령 1.2 cm 미만, 간 근처 제정맥 2주령까지 0.2 cm 미만, 제동맥 1주령 1.0 cm 미만이고 2주 이후 거의 안 보임, 요막관은 1주 뒤 안 보임. 송아지는 제대 줄기 안에 제정맥이 2개다. 깊은 잔존 농양은 방광·간 쪽에서 거슬러 추적한다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>제대 감염 — 치료<table class="bxt"><tr><th>상황</th><th>처치(Rebhun)</th></tr><tr><td>신생, 봉와직염·혈관 비후만</td><td>딱지 제거 배농, 페니실린 22,000 U/kg 또는 암피실린 11 mg/kg 1일 1~2회</td></tr><tr><td>신생, 발열·패혈증</td><td>수동면역 평가, 배양, 페니실린 22,000 U/kg 1일 2회 + 아미카신 15~20 mg/kg 1일 1회 또는 세프티오퍼 2.2 mg/kg 1일 1회, 관절 세척, 안정 후 1~3일에 제대 절제</td></tr><tr><td>2주령 이상, 요로감염</td><td>요배양, 초음파, 제대·요막관(제동맥) 절제, 항생제 7~14일</td></tr><tr><td>2주령 이상, 패혈성 관절염</td><td>혈액·관절 배양, 감염 잔존물 절제, 관절 세척, 항생제 7~21일</td></tr><tr><td>1~8개월령 복벽 밖 농양</td><td>천자로 확인 후 배농·매일 세척</td></tr></table><span class="hang">Constable: 제대정맥염은 비경구 항생제가 늘 듣지 않아 장기 투여나 개복 절제가 흔히 필요하고, 절제가 안 되면 배농관과 매일 세척, 큰 간농양은 절제하지 않으면 대개 낫지 않는다. 요막관염은 절제가 선택이고 회복이 순조롭다.</span><span class="hang">핸드북: 제대를 절개해 고름을 짜고 소독(수의사 수술), 네가산트 살포, 항생제(타도콤프Ⅲ 등)·해열제, 병변 제거 후 항생제와 비스테로이드 소염제. 간농양·방광염으로 번지면 예후 불량.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>제대 감염 — 예방<span class="hang">분만방 위생, 분만방 체류 단축, 충분한 초유, 탯줄 소독. 출생 때와 5일 안에 부기·습기·통증을 다시 보고 송아지마다 장갑을 바꾼다(Rebhun).</span><span class="hang">소독제는 책마다 다르다. Constable은 화학 소독의 근거가 제한적이고 클로르헥시딘이 2% 요오드·1% 포비돈요오드보다 낫고 7% 요오드는 조직 손상으로 쓰지 말라고 한다. Rebhun이 인용한 시험에서는 Navel Guard, 7% 요오드, 클로르헥시딘의 효능이 비슷했다. Blackwell은 고농도 요오드 과용이 괴사로 감염을 늘린다고 적는다. Large Animal IM은 제대염 1~14%, 조산 송아지에서 클로르헥시딘 침지가 이로웠다고 적는다.</span><span class="hang">핸드북 소독법: 소독한 손으로 탯줄 기시부에서 아래로 짜 혈액을 빼고, 기시부 1 cm 아래를 실로 단단히 묶고 끝을 강옥도로 소독한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>배꼽 탈장 — 진단과 치료<span class="hang">태어날 때 탯줄 구멍이 넓어 생기고 소의 가장 흔한 선천 결손이며 홀스타인에 많다(Blackwell). 서 있으면 불룩하고 손가락으로 동그란 구멍이 만져지며 대부분 환납된다. 유착되면 환납되지 않고 자라면서 늦게 생기기도 한다(핸드북). 단순 탈장은 1~10 cm, 그물막·제4위가 만져지고, 감염 잔존물이 원인인 탈장도 있다(Rebhun). 만성은 제4위-배꼽 누공으로 염소 손실을 일으킬 수 있다. 농양은 덥고 아프며 환납되지 않아 초음파·천자로 구별한다.</span><span class="hang">자연 폐쇄는 책마다 다르다. Rebhun은 4 cm 미만이 3~4개월령까지 흔히 닫힌다고, Blackwell은 소에서는 드물어 4~5 cm 넘으면 수술을 고려하라고, 핸드북은 수술이 유일한 치료이고 조기 수술이 바람직하다고 적는다.</span><span class="hang">손가락 3개 너비 미만은 환납 후 신축성 테이프를 배에 수주 감는다(1~2주마다 교체)(Rebhun). Blackwell은 4 cm 미만에 클램프나 고무링과 교차 핀을 든다. 수술은 자일라진 0.22 mg/kg 이하 IV와 국소마취, 큰 탈장은 far-near-near-far 봉합, 큰 송아지 48시간 절식, 파상풍 예방. 탈장 이력 수송아지는 종모우 회사가 받지 않는다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>화농성 관절염 — 원인·임상<span class="hang">어린 송아지는 제대 감염·신생기 패혈증에서 오고 FPT가 위험 요인이다. 대장균, 살모넬라, T. pyogenes(만성일수록, 걸쭉해 14 G로도 흡인 어려움). 3주령 넘으면 외상이나 살모넬라·히스토필루스·마이코플라스마 혈행성, 마이코플라스마는 3~6개월령·폐렴 동반·슬관절 호발(Rebhun).</span><span class="hang">핸드북: 분변 세균(특히 대장균), 연쇄구균, 코리네박테리움. 송아지는 앞무릎을 대고 일어나 거친 바닥에 긁힌 무릎 상처가 오염되어 흔히 생긴다. 무릎에 다발하고 파행·통증·발열·종창·화농, 늦으면 터진다. 관절수종은 혈행성으로 2개 이상 관절에 생긴다.</span><span class="hang">관절 팽만·열감·굴신통과 39.4~40.0℃ 미열. 양 완관절이면 파행이 덜 뚜렷하다. 관절액 백혈구 30,000/μL 초과·총고형분 3.0 g/dL 초과, 마이코플라스마 고름은 치즈 모양·무취, T. pyogenes는 악취. 방사선은 만성 예후 판정에 쓴다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>화농성 관절염 — 치료와 예방<span class="hang">Rebhun: 급성은 14 G 바늘 2개로 유산링거·생리식염수 1~2 L 관통 세척이 핵심이고 1~2주에 3~7회 반복, 전신 항생제가 관절 주입보다 효과적이며 최소 2주. 플로르페니콜·세프티오퍼 경험적 사용, 마이코플라스마 의심 시 베타락탐 단독 금지. 플로르페니콜 2.2 mg/kg 국소관류, 플로르페니콜 40 mg/kg·툴라트로마이신 2.5 mg/kg·가미스로마이신 6 mg/kg은 관절 농도가 충분하다. 만성은 관절 절개·배농관.</span><span class="hang">핸드북은 다르게 적는다: 상처성 관절염은 페니실린계와 단백분해 소염제 1주 이상, 화농 없이 붓기만 하면 관절강에 바늘을 절대 찌르지 말고 약물로 치료(악화 우려), 화농되면 절개 배농. 관절수종은 광범위 항생제·소염제·강옥도, 화농은 배농 후 항생제 주입.</span><span class="hang">제대정맥염성 다발관절염은 제대를 먼저 치료하고 예후가 나쁘다(핸드북). FPT 신생송아지 다발관절염 예후는 신중~불량(Rebhun). 예방은 충분한 깔짚, 제대 소독, 우사 소독(핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">55.</span><span>제4위 고창증 — 원인과 임상<span class="hang">대용유 송아지에서 고염분·고삼투압 유청 대용유, 드문 다량 급여, 15℃ 이상 둔 대용유가 제4위 배출을 늦추고 C. perfringens A형·Sarcina 등 가스 생성균이 증식해 생긴다. 차갑게 냉장한 대용유 자유 급여는 거의 문제가 없다(Constable). 핸드북: 1회 포유량이 많고 온도가 높을 때, 2개월 이상 인공포유하는 5~11주령에 다발, 급여 수시간 안에 발생. Rebhun: 2~6주령, 양동이 급여에 많고 1~3일령에서 고전분 초유 보충제 혼합이 소인으로 추정.</span><span class="hang">급식 후 1시간 안에 심하게 부풀어 몇 분 만에 죽는다. 뒷다리 뻗기, 꼬리 들기, 배변 시도, 식욕 절폐(Constable). 양쪽 복부 팽만, 핑음과 출렁이는 액체, 초음파상 부종성 제4위 벽, 고젖산 대사성 산증·저염소혈증·질소혈증, pH 7.0 이하 가능(Rebhun). 핸드북: 우측 하복부 박수음, 안구 함몰, 배변 정지, Ht 상승, BUN 50 mg/100 mL 이상, GOT 상승, Cl·K·Ca 저하.</span><span class="hang">감별: 제4위 변위, 천공성 궤양 복막염, 제1위 고창(덜 아프고 출렁이는 액체가 적음)(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>제4위 고창증 — 치료와 예방<span class="hang">등을 대고 눕혀 14 G 바늘로 제4위 가스를 뺀다(선 채로는 효과 적고 누출 위험). 프로카인 페니실린 22,000 U/kg IM 매일(Constable). Rebhun: 콜로이드·결정질 수액·전신 항생제, 위관으로 악취 액체 역류 시 호전, 경구 페니실린, 반응이 없으면 우측 개복으로 제4위를 비우고 궤양 봉합, 천공이 없으면 예후 보통~양호.</span><span class="hang">핸드북: BUN 50 이하면 18 G 바늘 가스 제거, 클로람페니콜 0.5~1.0 g 제4위 주입, 염산세토락사이드 1~2 g/일/50 kg 경구, 5% 포도당 + KCl 생리식염수 5 mL/kg/시간. BUN이 50 아래로 안 떨어지면 수술 후 7~14일 위궤양약. Constable은 클로람페니콜이 여러 나라에서 식용동물 금지라고 적는다.</span><span class="hang">예방: 급여 기구 위생, 분변 섭취 방지, 적은 양을 자주(Constable). 체온 정도 대용유, 젖병 급여, 반복 농장은 경구·비경구 페니실린 예방, C. perfringens A형 톡소이드(Rebhun). 1회 대용유 2.5 L 이하, 어린 송아지 사료 조기 급여, 우유에 0.1% 포르말린(핸드북). 이유 전 고창 목표 2% 미만(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">57.</span><span>제4위 궤양(송아지) — 역학·임상·약물<span class="hang">손으로 키운 송아지는 이유기에 흔하고, 2주령 미만에 급성 출혈성 천공 궤양으로 급사하기도 한다. 천공은 6개월령까지, 대부분 6~12주령. 포유 육우는 2~4개월령 방목 중, 캐나다 조사 86%가 2개월령 미만, 대부분 증상 없이 폐사, 천공의 약 90%가 제4위 체부 대만곡(Constable).</span><span class="hang">털뭉치는 1개월령 미만 궤양 폐사에서 약 4배 많았으나 30일령 넘으면 사인과 무관하게 약 60%에 있고 천공 궤양의 57%만 털뭉치가 있어 필수 요인은 아니다. 굶거나 드물게 먹어 제4위 pH가 낮게 유지되는 것이 거론된다.</span><span class="hang">천공 시 갑작스런 허약, 허탈, 복부 팽만, 쇼크, 급사. 수술 교정 가능. 시메티딘 50~100 mg/kg·라니티딘 10~50 mg/kg 8시간마다 경구가 pH를 올렸고 시메티딘 10 mg/kg 30일이 치유를 도울 수 있다(송아지 효능 미입증). NSAID 장기 사용은 위험 요인이다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">58.</span><span>제1위 부패증(ruminal drinking) — 원인·진단·치료<span class="hang">식도구가 덜 닫혀 우유가 제1위로 들어가 이상 발효한다. 양동이 급여 약 6주 송아지에 흔하다. 제1위 pH가 4~5로 떨어지고 D-젖산혈증으로 침울, 안검반사 저하가 최선의 지표. 제1위 과각화, 공장 융모 위축(Constable).</span><span class="hang">핸드북 원인: 카테터 강제 급여, 식도구 폐쇄 부전, 제4위 역류, 설사·불규칙 포유·찬 우유·양동이·수송 스트레스. 신생송아지는 제4위가 작아 많이 빨면 제1위로 역류한다.</span><span class="hang">임상: 반복 고창, 식욕 저하, 발육 불량, 점토 같은 분변, 왼쪽 아래 복부 팽만과 출렁임, 회백색 신 냄새 제1위액과 카제인 응괴(Constable). 핸드북: 체온 39.7℃, 심박 72~88, 호흡 30, 귀 처짐, 제1위액 pH 6.0·원충 소실, 혈액농축·백혈구 증가·혈당·콜레스테롤·혈청철·필수아미노산 저하. 카테터 강제 급여는 식욕 절폐로 악화시킨다.</span><span class="hang">진단: 아세트아미노펜 20~50 mg/kg을 우유 2 L에 타 흡수 곡선이 평탄하면 양성, 2 L 포유 전후 초음파로 제4위 부피(길이×너비×깊이×π/6)가 2 L 늘었는지 확인(Constable).</span><span class="hang">치료: 위관으로 제1위를 비우고 필요하면 따뜻한 물 1~2 L로 사이펀, 작은 구멍 젖꼭지·손가락 빨기 재훈련, 소량 자주, 큰 송아지는 건초·농후사료로 이유(1~2주에 반추 정상화)(Constable). 핸드북: 1차 질병 치료 우선, 생리식염수 1~3 L 제1위 세척, 첫날 비타민E·셀레늄 2 mL IM, 6일간 제1위액 이식 0.5~1.0 L/일, 4일 간격 5회 비타민ADE 10~20 mL 경구, 10일간 매일 수액(5% 포도당 초산링거 1 L + 아미노산 200 mL + B1 5 mL + 세파메친 + 플루닉신). 지침서: 바닥 그릇 대신 유방 높이 우유병 거치대.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">59.</span><span>분석증(헤어볼) — 원인·증상·치료<span class="hang">원인(핸드북): 어미 젖 부족과 저질 대용유(조섬유 0.25% 미만이 기준)로 배고픈 송아지가 볏짚·건초를 다량 먹음, 봄 털갈이, 심한 설사 후, 비닐 끈 섭취, 어미 털 핥기. 반추 기능이 없어 털이 제4위에서 공처럼 뭉친다.</span><span class="hang">증상: 타르 같은 검고 끈적이는 악취 소량 변, 체온 저하, 식욕 저하. 제1위 분석은 고창과 비슷, 제4위 분석은 유문 부분 폐쇄로 식욕 부진·만성 설사·허약, 완전 폐쇄 시 식욕 전무·체온 저하. 눕히거나 양쪽 복부를 누르면 만져진다(핸드북).</span><span class="hang">Constable: 포유 육우 제4위 털뭉치는 30일령 이후 약 60%에 있고 궤양과의 인과는 불확실하다. Rebhun: 제4위 절개로 털뭉치와 부패 우유를 제거할 수 있다.</span><span class="hang">치료·예방(핸드북): 수술 외 방법이 없고 수술 후 제1위액·소화제. 조기 수정과 어미 과비 예방, 양질 대용유, 설사 시 영양 유지, 비닐 끈 제거. 생후 4주까지 하루 30~50 g 건초가 털·볏짚 잔류를 막는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">60.</span><span>송아지 저지방혈증 — 원인·증상·치료(한우송아지핸드북)<span class="hang">설사로 포유를 못 하거나 젖량·유질이 부족해 필수지방산(리놀레산, 리놀렌산, 아라키돈산)이 모자라 생긴다.</span><span class="hang">성장 부진, 부분·전신 탈모와 각질화 피부병, 만성 허약우가 되어 성성숙 지연·번식장애.</span><span class="hang">설사 치료 중 어미와 떼지 말고 포유, 정상 포유 중 탈모가 생기면 식물성 기름 급여. 치료는 인체용 인트라리포즈 체중 kg당 3 mL 정맥주사, 옥수수·콩·땅콩기름 경구.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">61.</span><span>송아지 물중독 — 원인·증상·치료<span class="hang">물을 제한받던 목마른 송아지가 갑자기 많이 마시면 식도구가 닫혀 물이 제4위를 거쳐 소장에서 급히 흡수되고 혈장 삼투압이 급락해 적혈구가 터진다. 2~4개월령, 대용유만 먹거나 물 제한 이유 송아지를 물이 자유로운 곳에 낼 때 흔하고 수 분~수 시간에 발병한다. 체중 12% 물 위관 투여로 재현(Constable). 핸드북: 겨울 음수통 동결 뒤 한꺼번에 마실 때.</span><span class="hang">증상: 혈색소뇨(물 접근 직후 검붉은 오줌), 용혈성 빈혈, 찬물이면 빈맥·저체온, 저나트륨·저염소혈증. 부검 시 창백, 혈색소뇨성 신피질 괴사(Constable). 핸드북: 심하면 복부 팽대, 호흡 촉박, 수양성 설사, 폐수종 폐사.</span><span class="hang">치료: Constable은 증상 시 이미 용혈이 끝나 흔히 치료하지 않고, 고장식염수 7.2% 5 mL/kg을 5분 정맥으로 교정하며 가벼우면 불필요, 치명률 낮고 혈색소뇨는 몇 시간이면 사라진다고 한다. 핸드북은 중증에 10% 식염수 300 mL 서서히 정맥주사와 강심이뇨제, 경증은 설파제와 강심이뇨제를 든다.</span><span class="hang">예방: 송아지는 태어날 때부터 물을 자유롭게(Constable), 겨울 열선 보온 음수통(핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">62.</span><span>아까바네병 — 원인과 역학<span class="hang">Simbu 혈청군 오르토부냐바이러스. 등에모기(쿨리코이데스)와 모기가 옮기고 접촉 감염은 없다. 어미는 무증상, 바이러스혈증 1~9일, 지속 보균 없음(Constable, 핸드북).</span><span class="hang">상재 지역 암소는 첫 임신 전 면역이 생겨 발병하지 않는다. 가뭄 뒤 습한 해, 매개체의 바람 확산, 비면역 임신우 반입 때 유행하고 5~10년 사라졌다 나타난다. 감염 임신우의 30~40%에서 태아가 감염된다(Constable, Blackwell).</span><span class="hang">유행 초기 유산·사산·조산, 중기 관절만곡+수두무뇌증, 말기 수두무뇌증만(Constable). 핸드북: 10월~3월 유산·조산·사산, 태수과다, 기형 태아 복부 돌출, 난산.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>아까바네병 — 감염 시기별 기형<table class="bxt"><tr><th>감염 시기(핸드북)</th><th>결과</th></tr><tr><td>1개월 미만</td><td>태아 흡수(2~3개월 뒤 재발정)</td></tr><tr><td>임신 2~4개월</td><td>뇌수두증</td></tr><tr><td>임신 4~6개월</td><td>척추·목·다리 관절만곡증</td></tr><tr><td>임신 6~7개월</td><td>근육 위축·신경 증상</td></tr><tr><td>8개월 이후</td><td>거의 정상, 눈 먼 송아지</td></tr></table><span class="hang">Constable: 수두무뇌증 76~104일, 관절만곡증 105~174일. Blackwell: 79~104일, 103~174일, 후기는 뇌척수염.</span><span class="hang">관절만곡증 송아지는 난산으로 태어나고 작지만 이빨·털·발굽은 성숙, 기립 불능, 다리 굴곡 고정(건을 자르면 움직임), 근위축, 척추 만곡. 수두무뇌증 송아지는 걷지만 지능이 없고 눈이 멀어 젖꼭지에 대 주면 빨지만 어미를 찾지 않는다(Constable).</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>아까바네병 — 진단·치료·예방<span class="hang">진단: 태아 혈청이나 초유 전 혈청의 특이 항체(여러 두 검사), 태아 조직 RT-PCR·면역조직화학. 감별: 루핀 중독, 망간 결핍, 유전성 관절만곡, 블루텅·BVD(Constable).</span><span class="hang">치료: 생존 능력이 없어 치료하지 않는다(Constable). 핸드북·지침서: 발굽이 조금 굽었으면 석고붕대·부목으로 회복되기도 하고, 허약 송아지는 초유와 셀레늄. 어미는 다음 해 정상 분만하므로 도태할 필요가 없다.</span><span class="hang">예방: Constable은 사독 백신 임신 전 2회와 매년 1회, 송아지 이행 항체 4~5개월. 핸드북은 모기 발생 전(3~4월) 생독 1회, 전 두수(분만 1개월 전 임신우 제외)라 적고, 같은 책 예방접종 표는 가임 암소 매년 4~6월 5 mL 근육주사(모기 발생 1개월 전까지)다. 지침서는 매년 3~4월. 물웅덩이 제거, 연막 소독, 방충망.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>츄잔병 — 원인·임상·감별<span class="hang">Palyam 혈청군 오르비바이러스, Culicoides oxystoma 매개(Constable). 임신 중 감염 시 누워 있고 후궁반장을 보이며 젖을 빨지 못하는 수두무뇌증 송아지를 낳는다(Constable).</span><span class="hang">핸드북: 유사산·조산이 적고 기형이 없으며 체중이 정상이어도 기립불능·포유불능·호흡 촉박으로 2~3일에 폐사. 지침서: 임신 2~4개월 감염 시 허약, 기립 곤란, 가끔 다리 O자.</span><span class="hang">핸드북 비교: 아까바네는 늦여름~봄, 여러 품종, 유사산·체형 이상 많음, 비화농성 뇌염·관절만곡·척수 병변. 츄잔은 가을~봄, 주로 육용우, 유사산 적고 체형 이상 없음, 신경 증상·포유 불능 많음, 수두무뇌증·소뇌 형성부전.</span><span class="hang">치료법은 없고 분만 입회·어미 영양·백근증 대책·모기 차단(핸드북). 지침서는 국내 발생에도 백신이 상품화되지 않았다고 적는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>BVD 태내 감염 — 기형과 소뇌형성부전<table class="bxt"><tr><th>감염 시기(핸드북)</th><th>결과</th></tr><tr><td>수정 후 1주 이내</td><td>태아 흡수, 저수태</td></tr><tr><td>임신 124일 이내</td><td>50% 유산·미이라, 생존 시 면역관용우(발육 불량, 폐사율 50%)</td></tr><tr><td>임신 125~150일</td><td>유산·미이라, 망막 형성부전(봉사), 사지 기형, 짧은 턱, 뇌수두증, 소뇌 발육 불량</td></tr><tr><td>150일 이후</td><td>정상 분만</td></tr></table><span class="hang">Constable의 BVDV 선천 결손: 소뇌형성부전, 소뇌증, 수두증, 수두무뇌증, 공뇌증, 백내장, 소안구증, 망막 변성, 흉선 저형성, 탈모, 하악 단소, 발육 지연. Blackwell은 기형 시기를 79~150일로 적는다.</span><span class="hang">소뇌형성부전 송아지는 출생 시 운동실조, 넓은 자세, 비틀거림, 뒤로 넘어짐을 보인다. 가벼우면 손으로 먹여 키울 수 있고 눈 결손으로 실명하며 곱슬털이 있을 수 있다(Constable).</span><span class="hang">유전성 소뇌형성부전(헤어포드·홀스타인 등, 열성 추정): 목 떨림, 머리를 과도하게 젖히며 일어남, 과장된 부조화 보행, 젖꼭지를 빗나감, 의식 장애 없음. 바이러스성 소뇌 결손과 감별한다(Constable).</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>맹목 송아지 — 원인·예방(한우컨설팅지침서)<span class="hang">원인: 태내 BVD·아까바네·츄잔 바이러스, 네오스포라, 비타민A·B1 결핍, 유전형질 불량.</span><span class="hang">BVD는 소뇌·망막 형성부전, 아까바네는 관절만곡·대뇌 결손·맹목, 네오스포라는 유사산·기립불능·맹목, 비타민A 결핍은 시신경 변성·안구건조증, 비타민B1 결핍은 뇌부종으로 맹목이 된다. Blackwell: 어미 비타민A 결핍은 신생송아지 시신경공 기형·폐쇄로 시신경을 압박한다.</span><span class="hang">예방: BVD는 IBR·BVD·PI3 백신 2~4주 간격 2회 후 6개월마다, 아까바네는 3~4월 생독 1회, 네오스포라는 감염우 검진·도태, 임신우 비타민 급여. 치료법은 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">68.</span><span>송아지 비타민 결핍 — A·D·E·셀레늄<span class="hang">핸드북: 사양 환경이 열악한 한우 번식우 송아지에 많고, A·E 결핍이 자주 보고되며 D 결핍은 드물다. 배합사료 위주보다 자가 TMR에서 생긴다.</span><span class="hang">비타민A: 사료 카로틴이 질산염 때문에 전환되지 못하면 생긴다. 결핍 어미 송아지는 유사산·허약, 기립불능·부종·안구건조증, 폐렴·장염 합병 폐사. 수용성 비타민A 1,000,000 IU 근육주사 후 1개월 뒤 재주사, 사양이 좋은 암소 초유 급여(핸드북). Blackwell: 첫 증상은 흔히 야맹증, 눈물 과다·각막 혼탁, 간 저장량이 6개월 간다.</span><span class="hang">비타민D(구루병): 극히 드물고 3~10개월령, 사지 만곡·관절 종창. 1일 500,000 IU 1주 후 사료 첨가, 하루 1~2시간 햇볕(핸드북).</span><span class="hang">비타민E·셀레늄(백근병): 생후 1개월 전유 급여 중 큰소리 지르며 강직 경련 돌연사, 무리에서 뒤처짐, 포유 거부로 어미 젖 불어남, 근육통. 복합제 피하·근육주사, 어미에 분만 2~3개월 전, 송아지 출생 직후 주사(핸드북). 지침서는 한우 송아지에서 거의 없지만 예방 투여를 권한다. 상세는 근골격 탭.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">69.</span><span>포유기 사양 — 대용유·물과 설사 예방<span class="hang">대용유는 제2위구로 제4위에, 인공유는 제1위로 간다. 대용유는 단백질 20%·지방 10% 이상, 조섬유 0.25% 미만, 생후 3~21일 1일 2회 150~200 g을 40℃ 물에 7~8배 희석, 22~35일 2회 250 g, 36~40일 1회 250 g(핸드북). 같은 시간·사람·방법으로 먹인다. 알칼리성 정장제·경구 포액제를 대용유와 함께 주면 제4위 소화를 방해한다.</span><span class="hang">물: 4주간 물을 못 먹은 송아지는 증체가 60%까지 떨어지고 자유 급수는 인공유 섭취를 45% 늘린다. 포유 직후 5~10분은 식도구 반사가 남아 물을 주면 응유 불량 설사가 생기므로 제한 급수 시 20분 뒤에 준다. 수돗물이 최선, 계곡물 부적합, 세균 많은 물은 설사 원인(핸드북).</span><span class="hang">Rebhun: 대용유 총고형분 18% 이하, 급여마다 변동 1% 미만.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">70.</span><span>이유 관리 — 시기·조건·방법<span class="hang">핸드북: 어미 젖은 약 90일령에 요구량의 79%가 부족하고 반추위는 약 85일령에 성우와 비슷해져 한우 적정 이유는 75~85일령이다. 조건은 인공유 최소 500 g(사양 표에는 700 g, 미달이면 1일 1회 포유하며 증량), 신선한 물, 강건한 상태. 이유 후 일당증체 유전력 40~60%.</span><span class="hang">Bovine Medicine(젖소): 6주령 이상, 농후사료 1.5 kg/일 이상, 체중, 반추, 무질병 중 2가지 이상, 며칠에 걸쳐 서서히. 농후사료 7일령부터, 제각은 이유와 10일 넘게 떨어뜨림, 이유 후 문제 목표 5% 미만.</span><span class="hang">인공유는 CP 17%·TDN 70% 이상, 7~10일령부터 건초와 입붙이기, 2개월까지 약 1.0 kg. 사일리지·청초는 3개월 전 금지(핸드북). PDG = (일령 체중 − 이유 체중) ÷ (일령 − 이유 일령), 예 (140−90)/(150−85) = 0.77.</span><span class="hang">방법: 송아지 2~3일, 어미 4~5일 서로 찾으므로 멀리 떨어진 우사로 한 번에 과감히 뗀다(30~50 m도 울음 스트레스). 조기 이유는 어미 번식 간격 단축과 사료 30~50% 절감 효과. 이유·수송·거세 14일 전 파스튜렐라 백신, 호흡기 백신은 이유 30일 전 완료(핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">71.</span><span>입식 송아지 — 질병 예방 프로그램(한우송아지핸드북)<span class="hang">이유·수송·환경 스트레스에 제1위 미생물도 영향을 받아 대책이 없으면 1주 뒤 호흡기병이 생긴다. 우사를 청소·소독하고 격리 우사에서 1주 관찰 후 합사, 도착 즉시 몸 소독과 콧속 항생제·소독약 분무.</span><span class="hang">사료: 농후사료는 첫날 주지 않고 다음 날부터 체중 2%의 1/5씩 증량, 조사료 자유 채식, 제1위 추출물 소화제 20 g 5일, 물 자유. 섭취 목표(120 kg): 1~3일 1.0 kg, 4~7일 1.5, 8~14일 2.0, 15~30일 2.5 kg. 전해질 7일(2~4일은 병으로 강제 투약), 복합 비타민(특히 ADE) 7일.</span><span class="hang">항생제는 부신피질호르몬·페니실린·테라마이신 제외, 1일 지속형 3일 매일 또는 3일 지속형 당일·3일째, 경구 항생제 금지. 구충은 경구 1주 간격 2회 또는 이버멕틴 주사·푸어온 입식 1주 뒤 1회.</span><span class="hang">호흡기 혼합 백신은 입식 14일 전까지 2차 완료가 최선, 미접종 소는 도착 다음 날부터 1개월 간격 2회, 만하이미아 백신 도착 다음 날 1회 2 mL 근육. 송아지 기초 접종은 30일령 1차, 3~4주 뒤 2차.</span><span class="hang">Bovine Medicine: 구입은 질병·백신 이력을 아는 단일 농장에서 직접, 같은 나이끼리, 연령군별 공기 공간 분리, 올인올아웃과 7일 청소·소독·건조.</span></span></p></div>
</div>
`;
}
function med_toxHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 중독</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>중독 진단 접근 — 중독을 의심하는 기준<span class="hang">특정 중독을 시사하는 임상증상, 감염병의 종 모양 유행곡선과 달리 군 전체에서 갑자기 동시에 발병하는 양상, 화재·홍수·사고 등 환경 내 화학물질 유출이 알려진 경우, 사료·물·깔짚·공기 오염이 의심되는 경우에 중독을 의심한다.</span><span class="hang">새 사료·보충제·약물·새 목초지나 환경으로 바꾼 뒤의 이상, 감염병으로 설명되지 않는 반복 발생, 분리된 병원체만으로 소견이 다 설명되지 않는 경우, 진단이 끝내 나오지 않는 경우도 포함한다(Bovine Medicine).</span><span class="hang">급성 노출 중독은 갑자기 시작되고 노출원을 끊으면 갑자기 멎는다. 만성·지연성 중독은 동시 발병·동시 회복이 없어 찾기 어렵다. 기형 유발은 어미에게 다른 영향이 없는 용량에서도 생겨 송아지가 태어나거나 유산될 때에야 드러난다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>병력과 환경 조사<span class="hang">사료 조성·공급처 변경, 독물 노출, 독성 가능 제제 투여 여부를 묻는다. 환경에서는 쓰레기 더미, 맥각 낀 풀이나 호밀, 납 페인트를 칠한 벽을 씹은 흔적, 사료 구역의 독물 취급 부주의, 인근 공장·도로에 의한 목초 오염을 살핀다(Constable).</span><span class="hang">흔한 점오염원: 납 페인트·배터리·폐유·모닥불 재, 재활용 목재 깔짚(납·비소), 비료(질산염·요소·불소), 살서제·민달팽이 미끼, 정원 폐기물(주목·진달래류·월계수), 도랑 정비 시 드러난 독미나리 뿌리(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>돌연사 집단 발생 조사 절차<span class="hang">상세한 기록을 남기고, 사료 변경·독물 노출·투약 병력을 묻고, 환경을 살핀다.</span><span class="hang">사체에서 몸부림 흔적, 거품 섞인 비즙, 자연공에서 응고되지 않은 혈액, 고창, 점막 색, 특히 발굽의 화상 흔적, 외상·보정 흔적을 본다. 전두골을 촉진해 둔기 골절을 확인한다.</span><span class="hang">대표 사체는 가능하면 독립 검사기관 병리 전문가가 부검하게 한다. 의심 물질은 두 벌 채취해 한 벌은 분석, 한 벌은 사료회사 등에 제공할 수 있게 둔다(Constable).</span><span class="hang">전구증상 없이 돌연사를 일으키는 독물은 드물다. 시안화물이 대표적이고, 과량 모넨신은 심부전으로, 고용해성 납염은 어린 동물을 빠르게 죽인다. 유기인은 대개 증상이 먼저 보인다. 목초지 돌연사 원인으로 고창, 저마그네슘혈증, 시안화물·아질산염, 플루오로아세테이트, 남조류 마이크로시스틴을 고려한다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>증후군으로 보는 주요 중독<table class="bxt"><tr><th>증후군</th><th>대표 원인</th></tr><tr><td>돌연사</td><td>황화수소·시안화물(사이토크롬 산화효소 억제), 납·독미나리(경련), 이오노포어·주목(심장), 질산염·구리(혈색소 산화·용혈), 항응고제(출혈), 보툴리즘</td></tr><tr><td>소화기</td><td>비소·납, 식염·요소, 참나무·가지과·배추과, 질산염·황·불소 비료, 산·알칼리, 디젤</td></tr><tr><td>혈액</td><td>항응고제(쥐약·스위트클로버), 일산화탄소, 시안화물, 산화제(구리·질산염·양파·배추과), 고사리</td></tr><tr><td>신경</td><td>회백질연화증(티아미나제·황·식염·납), 요소·암모니아, 유기인·카바메이트·유기염소, 진전성 곰팡이독, 남조류, 보툴리즘</td></tr><tr><td>신장</td><td>참나무 타닌, 옥살산, 남조류, 중금속, 아미노글리코사이드·설폰아마이드</td></tr><tr><td>간</td><td>피롤리지딘 알칼로이드, 아플라톡신, 구리, 남조류</td></tr><tr><td>번식</td><td>제아랄레논, 루핀·독당근(기형), 질산염(유산)</td></tr><tr><td>면역억제</td><td>일부 곰팡이독, 고사리</td></tr></table><span class="hang">같은 증후군이 여러 장기에서 비롯될 수 있다. 예컨대 신경증상은 뇌병증, 케토시스, 간·신장병증에서 모두 나온다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>중독 진단 검체 — 채취와 보관<table class="bxt"><tr><th>검체</th><th class="c">양</th><th>보관·용도</th></tr><tr><td>간</td><td class="c">100 g</td><td>-30℃ 동결, 화학분석(납·구리·비소·셀레늄·항응고제 등)</td></tr><tr><td>신장</td><td class="c">100 g</td><td>-30℃ 동결, 화학분석(납·수은·구리)</td></tr><tr><td>반추위 내용물</td><td class="c">500 g~1 kg</td><td>동결, 신선할 때 pH 측정(요소 중독 시 pH 상승)</td></tr><tr><td>장 내용물(결장)</td><td class="c">100~200 g</td><td>동결</td></tr><tr><td>지방(대망·복강)</td><td class="c">100 g</td><td>동결, 지용성 독물(유기염소·PCB)</td></tr><tr><td>뇌</td><td class="c">반쪽</td><td>반은 동결(나트륨·수은), 반은 포르말린</td></tr><tr><td>안구액(방수·유리체)</td><td class="c">2 mL</td><td>동결, 질산염·암모니아·나트륨·마그네슘</td></tr><tr><td>혈액</td><td class="c">5 mL씩</td><td>EDTA·헤파린 전혈과 분리 혈장, 혈청, 출혈 의심 시 구연산 혈액, 광물 분석용 전용관</td></tr><tr><td>병리조직</td><td class="c">5 mm 절편</td><td>간·신장·폐·병변·뇌·척수·골격근 10% 완충 포르말린</td></tr><tr><td>사료·물</td><td class="c">-</td><td>한 벌 냉장, 한 벌 밀폐 동결</td></tr></table><span class="hang">살아 있는 개체는 CBC·생화학·응고검사·소변도 보낸다(Rebhun).</span><span class="hang">독물이 사료·물에 고르게 섞여 있지 않으므로 여러 곳에서 채취한다(Blackwell). 소송 가능성이 있으면 재검용 검체를 보존한다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>검체별 핵심 포인트<span class="hang">안구액: 사후 질산염 진단에 가장 좋은 체액이다. 혈액·안구액 질산염은 23℃에서 24시간, 4℃에서 1주, -20℃에서 1개월 안정하다(Constable). 암모니아(요소 중독), 나트륨(식염 중독)도 안구액으로 본다.</span><span class="hang">반추위·제2위: 납 입자·페인트 조각은 제2위에 가라앉는다. 식물 조각(주목·독미나리 뿌리·도토리)은 반추위·식도홈에서 찾는다. 시안화물 검체는 밀폐 용기에 즉시 동결한다.</span><span class="hang">신장: 납·수은은 신장 농도가 가장 높아 신장이 간보다 신뢰도가 높다. 구리 단회 대량 섭취 직후에는 간보다 신장이 먼저 오른다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>일반 치료 원칙<span class="hang">독물 공급원 즉시 제거가 최우선이다. 노출된 무증상 개체도 함께 격리한다.</span><span class="hang">흡수 차단: 활성탄 1~5 g/kg을 슬러리로 경구 또는 위관 투여하고, 황산나트륨·황산마그네슘 250~500 mg/kg을 활성탄 슬러리에 섞는다(Blackwell). 피부 노출은 비누와 물로 씻는다.</span><span class="hang">특이 해독제는 소수다(납 CaEDTA, 질산염 메틸렌블루, 시안화물 티오황산나트륨, 유기인 아트로핀·2-PAM, 항응고제 비타민 K1, 구리 몰리브덴산염·티오몰리브덴산염). 대부분은 대증·보존 치료(흥분 조절, 수액)에 의존한다.</span><span class="hang">해독제 상당수가 식용동물 허가 외 사용이다. 무허가 해독제는 휴약이 매우 길거나 사실상 영구적일 수 있다. 예컨대 영국에서 테트라티오몰리브덴산암모늄은 MRL이 없어 치료한 소는 식품 사슬에 들어갈 수 없다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>식품안전과 사후 관리<span class="hang">조직·우유로 잔류가 이행할 수 있으며, 잔류 축적은 납처럼 완전히 무증상일 수 있다. 중독이 확인되거나 의심되면 식품안전 당국과 즉시 상의해 출하 보류와 휴약을 정한다.</span><span class="hang">우유처럼 매일 출하되는 산물은 오염이 없음을 빨리 입증해야 한다. 회복 개체의 도태·장기 보유는 회복 기간과 사육 비용을 대체 개체 구입비와 비교해 정한다.</span></span></p></div>
