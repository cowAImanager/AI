40 g/일을 준다. 전혀 안 나오면 수술로 꺼내고 재발 방지로 염화암모늄을 준다. 수술 뒤 정상 성장을 못 하는 예가 많다.</span><span class="hang">한우 자료는 염화암모늄이 산증을 개선하고 오줌 pH를 증가시키며 결석을 분해한다고 기술하는 반면, Constable·LAIM은 염화암모늄을 요 산성화제(목표 pH 6.0~6.5)로 쓴다. 한우 자료는 장기 급여 시 암모니아 축적으로 간기능이 떨어질 수 있다고 덧붙인다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>요석증 — 수술 개요<table class="bxt"><tr><th>술식</th><th>적응·특징</th></tr><tr><td>회음 요도루 설치술</td><td>구제 목적, 회복 후 도축. 85례 중 35%만 만족스럽게 회복. 협착·재폐색 흔함</td></tr><tr><td>좌골 요도루 설치술 + 폴리 카테터</td><td>무거운 비육 거세우·수소. 요도 손상이 크지 않으면 번식능 유지 가능</td></tr><tr><td>요도절개술</td><td>결석 제거 후 봉합. 협착, 유착에 의한 포경, 재폐색 위험</td></tr><tr><td>음경 절단</td><td>도축 예정우</td></tr><tr><td>튜브 방광루 설치술</td><td>번식 기능 보존에 최선. 요도가 낫고 결석이 배출되기를 수주 기다림. 가장 비쌈</td></tr><tr><td>방광 조대술</td><td>재폐색이 가장 적으나 평생 누공 관리, 번식능 불확실</td></tr><tr><td>개복 + 방광 폴리 카테터</td><td>고가 종모우. 결석이 7~10일에 부서져 개통되면 번식능 보존(Bovine Medicine)</td></tr></table><span class="hang">Blackwell은 소는 포피 종창이 생긴 뒤에야 발견되는 경우가 많고 회음 요도루를 구제 수술로 든다.</span><span class="hang">결석은 흔히 여러 개라 재폐색이 흔하므로 어떤 술식이든 소유주에게 미리 알린다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>요석증 — 방광 파열 처치와 용해 요법<span class="hang">복강의 요를 천천히 빼면서 동시에 정맥수액을 준다. 7% 고장식염수 뒤 생리식염수로 저나트륨·저염소를 교정하고, 고칼륨혈증 가능성이 있으므로 칼륨을 경험적으로 넣지 않는다.</span><span class="hang">비육우는 요도루나 카테터로 요를 돌려 파열이 저절로 낫게 한다. 등쪽 파열은 잘 아물며, Rebhun은 풍선 45 mL 폴리 카테터 유치로 계속 배액하는 보존 치료가 대부분 성공할 것이라고 한다.</span><span class="hang">왈폴 완충액(pH 4.3~4.8, 아세트산나트륨 1.16%, 빙초산 1.09%, 증류수 97.75%)이나 헤미아시드린 30~200 mL를 방광 요를 대부분 뺀 뒤 넣고 30분~2시간 막아 두면 결석이 녹았다는 보고가 있다. 목표 pH는 5.0 미만이다. 불투과성 결석(탄산칼슘, 수산칼슘, 규산)은 잘 녹지 않는다.</span><span class="hang">술후에는 수액으로 이뇨를 유도하고 요에 농축되는 항균제를 준다. 유치 카테터 배양에서 42%가 2가지 이상 항생제에 내성이었으므로 감수성 검사를 한다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>요석증 예방 — 칼슘·인 비율<span class="hang">첫 단계는 칼슘·인 균형으로 요중 과잉 인 침전을 막는 것이다. 비육 사료는 곡류 위주라 인이 많아 이것이 가장 어렵다.</span><table class="bxt"><tr><th>출처</th><th class="c">권장 Ca:P</th></tr><tr><td>Constable</td><td class="c">1.2:1, 1.5~2.0:1도 권장</td></tr><tr><td>Rebhun</td><td class="c">2:1</td></tr><tr><td>LAIM</td><td class="c">2:1 초과(곡류 감량, 알팔파·두과로 칼슘 보강)</td></tr><tr><td>한우컨설팅지침서·송아지핸드북</td><td class="c">1.5:1 또는 2:1 이상, 밀기울·쌀겨 다급 금지</td></tr></table><span class="hang">칼슘·인 비가 2.8:1 이상이면 요가 알칼리가 되어 양에서 규산 결석이 늘었다. 스트루바이트를 막는 비율이 규산에는 소인이 될 수 있어 사료와 결석을 함께 분석한다.</span><span class="hang">저수산·저규산·저마그네슘 사료를 짜고 긴 조사료를 늘려 침을 통한 인 배설을 늘린다. 펠렛 급여는 인산염 결석을 조장할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>요석증 예방 — 소금과 음수<span class="hang">소금은 음수를 늘려 요를 희석한다. 사료의 4%가 실험적으로 효과가 있었고 실제로는 3~5%로 주며 더 높으면 식욕이 준다. Rebhun은 4~5%를 권한다.</span><span class="hang">규산 결석: 300 kg 거세우가 소금을 하루 50 g 먹으면 막지 못하고 200 g이면 유의하게 줄며 300 g이면 거의 없어진다. 방목 송아지는 보충사료의 소금을 몇 주에 걸쳐 12%까지 올리면 효과적이다. 규산 결석은 이유 전 마지막 60일에 생긴다.</span><span class="hang">비육장에 갓 들어온 거세우는 음수를 늘리는 데 모든 노력을 한다. 얼지 않은 물을 늘 주고 겨울에는 가온기를 쓴다. 염분이 많은 물은 의심한다.</span><span class="hang">한우 자료: 겨울에 물을 따뜻하게 주고, 다즙질 조사료를 급여하며, 미네랄블록이나 소금을 자유 채식시킨다. 미네랄블록은 98%가 소금이라 따로 소금을 줄 필요가 없다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>요석증 예방 — 요 산성화·DCAD<span class="hang">알칼리 요(pH 7.0 초과)는 인산염과 탄산칼슘 결석을 조장하므로 요 pH를 6.0~6.5로 낮추면 이들을 막는다. 산성 요는 규산 결석을 조장하므로 규산 위험 동물에는 요 산성화가 적응이 아니다.</span><table class="bxt"><tr><th>출처</th><th class="c">염화암모늄 용량</th><th>비고</th></tr><tr><td>Constable</td><td class="c">건물섭취의 0.5~2.0%, 거세우 약 45 g/일</td><td>방목우는 약 3분의 2 용량</td></tr><tr><td>Rebhun</td><td class="c">50~80 g/두/일(240 kg 거세우)</td><td>스트루바이트 예방</td></tr><tr><td>한우 자료(예방)</td><td class="c">5~20 g/일 음용수, 비육 후기 1개월 간격 1주일씩</td><td>또는 중조 50~100 g, 황산암모늄 건물당 1~3%</td></tr><tr><td>한우 자료(치료)</td><td class="c">20~40 g/일</td><td>산증 개선, 결석 침전 억제</td></tr></table><span class="hang">산성화 정도는 사료 전체의 양이온·음이온 조성에 따라 크게 다르고, 요 pH는 2~5일에 걸쳐 내려간다. 요 pH를 꼭 감시한다. 과량이면 산혈증, 침울, 식욕부진이 오고, 장기 급여 시 고칼슘뇨로 골 탈회가 이론적으로 가능하다.</span><span class="hang">사료 양이온·음이온차(DCAD) = [Na] + [K] − [Cl] − [S](건물 kg당 mEq). 염소에서 DCAD 0 mEq/kg 사료가 실용적 예방법으로 기술되고, Rebhun은 DCAD를 낮춘 고염소 완전배합사료로 스트루바이트를 예방한다고 한다. 사료 칼륨이 높으면 위험이 커진다.</span><span class="hang">비타민 A를 충분히 공급한다(한우 자료: 양질 건초나 첨가제·주사제). 초지성 요석증이면 암소에게 위험 초지를 뜯게 하고 거세우는 제한한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">71.</span><span>요막관 이상 — 요막관 개존<span class="hang">출생 후 요막관이 닫히지 않아 배꼽에서 오줌이 떨어지거나 늘 젖어 있다. 망아지보다 송아지에서 드물고(Constable은 극히 드물다고 기술) 복제 송아지가 소인이 있다. 패혈증 소인이 된다.</span><span class="hang">Rebhun: 생후 24시간까지 닫히지 않으면 처치한다. 수술이 어려우면 전신 광범위 항생제와 함께 질산은, 7% 요오드, 루골 요오드로 소작하고 소독·건조 배꼽 침지제를 쓴다. Constable(망아지)은 소작이 괴사·감염 감수성을 높일 이론적 위험이 있다고 기술한다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>요막관 농양·유착<span class="hang">대개 4주령 넘은 송아지에서 발열, 발육 부진과 함께 배뇨곤란, 빈뇨, 복통을 보인다. 외부 배꼽 이상이 없을 수도 있고, 방광으로 퍼지면 혈뇨·농뇨가 생긴다.</span><span class="hang">감염이 사라진 뒤에도 방광과 복벽의 섬유성 유착이 남아 불완전 배뇨를 일으킨다. 6개월령 육성우가 요막관 농양 유착으로 꼬리를 들고 배뇨곤란을 보였으나 소변검사는 정상이었던 예가 있다.</span><span class="hang">7.5~10 MHz 탐촉자로 외부 배꼽에서 방광까지 따라간다. 요막관은 생후 1주 이후 정상이면 보이지 않고, 방광 근처 제동맥은 1주령에 1.0 cm 미만이어야 한다. 깊은 농양은 방광 쪽에서 추적하는 것이 낫다.</span><span class="hang">2주령 이상 요로감염 송아지는 소변 배양, 초음파, 배꼽·요막관(또는 제동맥) 절제, 7~14일 항생제로 치료한다. 성우에서 요막관 잔존물이 저절로 터져 요복증이 되기도 한다.</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>성 암소의 방광 파열<span class="hang">드물다. 난산 중 태아가 요도를 막아 방광이 팽만한 상태에서 골반 내 조작으로 터지는 것으로 추정한다. 요막관·수술 후 유착이 있는 육성우, 급성 신우신염의 큰 응혈에 의한 요도 폐쇄 뒤에도 생긴다.</span><span class="hang">복부 팽만, 침울, 촉진 파동이 있고 직장으로 방광이 만져지지 않으며 초음파상 복강 무에코 자유액이 많다. 복강액 크레아티닌이 혈청의 2배를 훨씬 넘으면 확진이고, 소는 고칼륨혈증이 믿을 만하지 않다.</span><span class="hang">수술 전 정맥수액과 복강 배액으로 천천히 요를 뺀다. 성 젖소는 유방이 복부 정중 접근을 가리므로 겸부 뒤쪽 높은 절개를 쓸 수 있다. 등쪽 열상은 풍선 45 mL 폴리 카테터 유치 배액과 항생제로 수술 없이 아물 수 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>방광 외번·탈출<span class="hang">외번은 방광이 요도를 통해 뒤집혀 점막이 보이는 것이고, 탈출은 분만 중 질 바닥 열상으로 장막면이 보이는 것이다. 분만 무렵 심한 노책 뒤에 생기며 암소는 저칼슘혈증이 관여한다. 자궁·질 탈출과 세척 후 질검사로 구분한다.</span><span class="hang">외번은 경막외마취, 무균 세척, 괴사 확인, 윤활제 도포 후 밀어 넣으며, 요도가 좁으면 요도 등쪽을 절개한다. 탈출은 카테터로 요를 빼고 복강으로 되돌린 뒤 질 열상을 봉합한다. 괴사·복막염 위험으로 예후는 신중하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">75.</span><span>효소성 혈뇨 — 원인과 역학<span class="hang">고사리(Pteridium aquilinum)를 오래 먹어 생기는 만성 프타킬로사이드 중독으로, 소유두종바이러스 2형(BPV-2) 잠복 감염과 강하게 연관된다. 다른 양치류도 관여한다.</span><span class="hang">3세 넘은 소가 주로 걸린다. LAIM은 대략 체중만큼을 1~3개월에 걸쳐 먹은 뒤, Bovine Medicine은 사료의 20% 넘게 오래 먹었을 때라고 기술한다. 생초·건초 모두 유독하고 척박하거나 새로 개간한 땅에서 많다.</span><span class="hang">급성 고사리 중독(골수 억제, 출혈, 패혈)과는 다른 병이다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>효소성 혈뇨 — 기전과 증상<span class="hang">요로 배설된 프타킬로사이드가 높은 요 pH에서 발암물질로 바뀌어 BPV-2와 상승 작용해 방광 종양을 만든다. 방광벽 병변의 간헐 출혈로 실혈성 빈혈이 와서 죽는다.</span><span class="hang">중증은 응혈 섞인 다량의 피오줌으로 1~2주 만에 죽고, 가벼우면 간헐·무증상 혈뇨로 수개월에 걸쳐 살이 빠진다. 발열이 없다.</span><span class="hang">직장검사에서 방광벽 비후와 종괴가 촉지되고(정상 벽은 초음파상 2 mm 미만), 방광내시경에서 백색~적색 결절이 보인다. 이차 감염으로 방광염·신우신염이 생길 수 있다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>효소성 혈뇨 — 진단과 관리<span class="hang">시험지 잠혈 강도가 병변의 수·중증도와 비례한다. 응고검사와 혈소판 수는 대개 정상이다. 고사리 방목 이력과 방광 병변 조직검사로 확진한다.</span><span class="hang">감별: 방광염·신우신염(발열, 농뇨, 세균 배양 양성, 빈혈은 경미), 용혈성 질환(혈청 용혈·황달, 침사 적혈구 없음), 방광 유두종(방광내시경).</span><span class="hang">부검상 방광 점막하 혈관종이 전형적이고 혈관육종, 이행상피암종 등이 섞이며 전이도 있다. 작은 병변으로도 출혈사할 수 있다.</span><span class="hang">치료하지 말고 처분한다(Constable). 중증은 수혈, 그 밖에는 조혈제를 줄 수 있다. 방목지에서 빼는 것이 최선의 예방이나 진행례는 되돌리지 못한다. 석고 헥타르당 225~335 kg 시비가 발병을 늦춘다고 한다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>방광·신장 종양<span class="hang">방광 종양은 주로 고사리 중독과 관련되며 혈관종, 이행상피암종, 유두종(BPV-1·2)이 있다. 고사리 노출이 적은 미국 북부에서는 성우 방광·요도·요관 종양의 대부분이 림프종이다(Rebhun).</span><span class="hang">원발성 신장 종양은 드물고 다중심성 림프종 침윤이 가장 흔하다. 좌신 모양이 이상하게 촉지되며 대개 편측이라 신부전은 없다. 림프종은 요관 압박으로 수신증을 일으킬 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>렙토스피라증 — 신장 관점<span class="hang">용혈소 생산 혈청형은 패혈기에 혈색소뇨를 일으키며 성우보다 어린 송아지에서 흔하다. 용혈이 심하면 혈색소뇨성 신증이 온다.</span><span class="hang">이후 감염이 신실질에 정착해 간질성 신염과 장기간 렙토스피라뇨를 낸다. 급성기에는 패혈증·용혈로, 그 뒤에는 간질성 신염에 의한 요독증으로 죽을 수 있다. 보균우에서 신질환이 임상 문제가 되는 일은 흔하지 않다.</span><span class="hang">도축우에 흔한 국소성 간질성 신염(백반신)은 렙토스피라나 활동성 세균 감염과 관련이 없다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>렙토스피라증 — 소변 검사와 치료<span class="hang">소변에서 균을 찾는 것이 가장 좋은 방법이나 간헐 배출이 흔하다. 주 1회 3회 연속 음성이면 보균우가 아니라는 좋은 근거다. 푸로세미드 투여 후 소변이 검출률을 높이고, 최근 항생제는 낮춘다.</span><span class="hang">소변 반은 포르말린(20~30 mL당 1방울)을 넣고 반은 신선하게 보낸다. 배양은 최소 16주, 가능하면 26주 걸린다.</span><table class="bxt"><tr><th>약물</th><th class="c">용량</th><th>비고</th></tr><tr><td>디하이드로스트렙토마이신</td><td class="c">25 mg/kg 근육 1회</td><td>렙토스피라뇨 제거</td></tr><tr><td>디하이드로스트렙토마이신</td><td class="c">25 mg/kg 근육 24시간마다 3~5일</td><td>치료</td></tr><tr><td>옥시테트라사이클린</td><td class="c">20 mg/kg 근육 24시간마다 3~5일</td><td>장기지속형은 20 mg/kg 1회</td></tr><tr><td>틸미코신 / 툴라트로마이신</td><td class="c">20 mg/kg 피하 1회 / 2.5 mg/kg 피하 1회</td><td></td></tr></table><span class="hang">Hardjo 감염 소에서는 항균 치료 효과가 높지 않다. 우군 대책으로 전 두수 백신과 임신우 디하이드로스트렙토마이신 1회 투여가 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">81.</span><span>수신증<span class="hang">요로 폐색으로 신우가 늘고 실질이 압박 위축된 것으로, 만성·편측·불완전 폐색이 잘 일으킨다. 빨리 해결된 급성 요도 폐색은 큰 신손상을 남기지 않아, 반추류 요석증의 주된 후유증은 신부전보다 재폐색이다.</span><span class="hang">편측이면 반대쪽이 보상해 신부전이 없고 크게 늘어난 신장이 직장으로 촉지될 수 있다. 만성 양측 폐색은 드물지만 만성 신부전을 일으킨다.</span><span class="hang">원인 예: 결석에 의한 음경 요도 만성 부분 폐색(거세우), 방광 유두종의 요관 폐색, 성우형 림프종의 압박, 신우신염의 진한 고름. 초음파가 진단에 도움이 된다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>신결석·요관결석<span class="hang">소에서 요관결석은 드물다. 보이면 흔히 양측이고 만성 감염(신우신염)과 관련되며 간헐 폐색을 일으킨다. 감염 없는 양측 결석은 NSAID 관련 신유두 석회화일 수 있다(Rebhun).</span><span class="hang">체중을 자주 옮기고 배를 차며 톱질대 자세를 취하는 복통을 보인다. 양측이면 고질소혈증, 체중 감소, 식욕부진이 있다. 질·직장 요관 촉진과 초음파로 확인한다.</span><span class="hang">항생제·수액으로 흔히 호전되며 결석이 신우로 되돌아가 통증이 줄기도 한다. 요관절개술이나 편측 신적출을 할 수 있고, 신적출 전에는 남는 신장을 평가한다.</span></span></p><p class="bx-num"><span class="bxn">83.</span><span>이소성 요관과 선천성 신질환<span class="hang">이소성 요관은 요관이 자궁경관·요도·질로 열려 출생 때부터 요실금을 일으킨다. 젖소 송아지 1예가 해당 쪽 신적출로 회복했다.</span><span class="hang">양측 신무형성과 광범위 양측 다낭신은 출생 직후 죽는다. 편측은 증상이 없고 다낭신 성우에서 아주 큰 신장이 촉지되기도 한다.</span><span class="hang">흑모화우(Japanese Black)의 신세뇨관 이형성: 클라우딘-16 유전자 결실에 의한 상염색체 열성 유전병으로, 출생 시 작고 신생기 설사를 반복하며 2~5개월령부터 식욕은 정상인데 성장이 지연되고 발굽이 길다. 고질소혈증, 고인혈증, 핍뇨가 있고 DNA 검사법이 있다.</span><span class="hang">흑모화우의 미만성 대상 섬유화 만성 간질성 신염(CINF)도 상염색체 열성으로 3~5개월령 성장 지연 후 사춘기 전에 죽는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">84.</span><span>요석증 — 번식학 영양 탭에서 옮긴 보충 · 결석 종류와 사료<span class="hang">요석증은 비육 거세우만의 문제가 아니라 번식 수소의 건전성에도 중요하다.</span><span class="hang">콩과 사료는 탄산염 결석, 옥살산 식물(클로버·할로게톤 등)은 옥살산염 결석과 관련된다.</span></span></p><p class="bx-num"><span class="bxn">85.</span><span>사료 조정 보충<span class="hang">인산염 결석은 사료 Mg를 0.2% 미만으로 맞춘다. P는 주로 타액으로 배설되므로 조사료가 늘면 반추·타액 P 배설이 늘고 요 용질이 줄어든다.</span><span class="hang">규산 결석 위험 목초지는 수소·거세우 대신 암소 방목에 쓴다.</span><span class="hang">규산 결석은 이유 전 60일에 주로 형성되므로 송아지에 고염 크립사료를 권장한다. NaCl은 이 수준까지 점진적으로 늘린다.</span></span></p><p class="bx-num"><span class="bxn">86.</span><span>요 산성화 대안<span class="hang">장기 염화암모늄 급여는 골감소증을 일으키므로, 대신 DCAD 조절용 염화물 음이온 보충제 0.1~0.2 kg(0.25~0.5 lb)을 곡물에 섞어 급여하는 방법이 있다.</span></span></p></div>
</div>
`;
}
function med_neuroHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 신경</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>신경학적 검사 — 목적과 순서<span class="hang">목적은 신경 이상이 있는지 확인하고 병변의 해부학적 위치를 정하는 것이다. 위치 진단이 있어야 감별 목록과 치료 가능성을 판단할 수 있다.</span><span class="hang">구성은 의식, 보행, 자세 반응, 척수반사(근긴장·근육 크기), 뇌신경 다섯 가지다(Rebhun). 멀리서 자세와 의식을 먼저 보고 보정틀에서 가까이 검사하는 순서가 다루기 어려운 육우에도 맞다(Constable).</span><span class="hang">병력: 발병 양상(급성 후 안정, 서서히 진행), 경과, 간헐 증상, 군 발생을 묻는다. 여러 두가 짧은 기간에 동시 발병하면 중독, 갑자기 시작해 안정·호전되면 외상, 서서히 진행하면 종양을 생각한다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>의식, 보행, 자세 반응<span class="hang">상행망상활성계(ARAS) 장애는 침울, 기면, 둔감, 반혼수, 혼수 순으로 심해진다. 둔감~혼수는 간뇌 장애(예: 뇌하수체 농양)에서 흔하다. 변연계 장애는 추진성 보행, 선회, 머리 밀기, 과도한 핥기, 돌진, 광폭을 일으킨다. 복통에 의한 머리 밀기는 간헐적이고 주의를 돌리면 의식이 정상이다.</span><span class="hang">척수 질환으로 누운 소는 합병증이 없으면 의식이 명료하다.</span><span class="hang">하위운동신경원(LMN) 장애는 체중 지지가 어렵고 보폭이 짧으며 떨리고 옆으로 쉽게 끌려간다. 상위운동신경원(UMN)·일반고유감각(GP) 장애는 내딛기가 늦고 과도하게 뻗으며 착지가 부정확하고(실조), 당기면 다리를 뻗어 버틴다.</span><span class="hang">네 다리가 모두 심하게 약한데 실조와 경직이 없으면 신경근 질환, 한 다리만 약하면 그 다리의 말초신경·근육 병변이다. 마비 없는 과대보행은 소뇌·척수소뇌 질환의 특징이다.</span><span class="hang">송아지 깡충뛰기에서 체중을 못 버티면 신경근 질환, 반응이 늦으면 뇌간·척수 장애다. 경수·뇌간 압박 병변은 대개 뒷다리가 더 심하고, 대뇌 병변만으로는 보행이 변하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>척수반사, 근긴장, 꼬리와 항문<span class="hang">척수반사는 누운 소에서만 의미가 있고 오래 깔고 누운 다리는 긴장도가 낮게 나온다.</span><span class="hang">믿을 만한 건반사는 슬개반사(대퇴신경, L4~L5)뿐이며 신생 가축은 항진되어 있다. 굴곡반사는 앞다리 C6~T2, 뒷다리 좌골신경·L5~S3를 거친다. 반사가 있어도 대뇌 인지는 없을 수 있다.</span><span class="hang">피간근반사(C8~T1, 외측흉신경)는 병변 뒤쪽에서 소실되어 흉요추 골절이나 척추체 농양 위치를 찾는 데 쓴다. 회음반사(S1~S3, 음부신경)가 없고 꼬리·항문이 늘어지면 천미부 LMN 병변이다.</span><span class="hang">굽힐 때 저항이 끝까지 남으면 납관 경직으로 파상풍에서, 갑자기 풀리면 접이칼 이완으로 UMN 병변(경련성 부전마비)에서 본다. 이완은 반사궁이 끊긴 LMN 병변이다.</span><span class="hang">신경성 위축은 며칠 안에 뚜렷해지고 폐용성보다 훨씬 심하다. 누운 소의 통각 유무는 예후상 중요하다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>뇌신경 검사<span class="hang">손대지 않고 위협반응(눈-II-중추시각로-VII), 동공과 대광반사(II-중뇌-III), 사시, 안정 시 안진, 눈꺼풀 틈, 귀 위치(VII)를 본다. 이어서 생리적·체위성 안진, 안검반사(V-VII), 입술 긴장, 비중격 자극 반응, 저작근과 턱 긴장(V 운동), 혀(XII), 삼킴(IX, X)을 확인한다.</span><span class="hang">안면신경 마비는 같은 쪽 귀·윗눈꺼풀·입술 처짐, 인중이 건강한 쪽으로 당겨짐, 침 흘림, 볼에 사료 고임이다. 침울·허약·머리 기울임이 함께 있으면 중추성(리스테리아증)이다. 진자 안진은 홀스타인에서 0.51% 관찰되는 양성 소견이다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>실명의 위치 감별<table class="bxt"><tr><th>구분</th><th>위협반응</th><th>동공·대광반사</th><th>예</th></tr><tr><td>중추성(대뇌피질)</td><td>소실</td><td>정상</td><td>PEM, 납중독, 식염중독, 수막염, 신경형 케토시스</td></tr><tr><td>말초성(시신경)</td><td>소실</td><td>산동, 소실</td><td>비타민A 결핍(안구형), 뇌하수체 농양</td></tr><tr><td>안면신경 마비</td><td>소실(시력 있음)</td><td>정상</td><td>리스테리아증</td></tr><tr><td>동안신경 운동로</td><td>정상</td><td>산동, 소실</td><td>저칼슘혈증, 아트로핀</td></tr></table><span class="hang">한쪽 대뇌반구 병변은 반대쪽 눈 실명(반맹)을 일으키며 동공 기능은 정상이다. PEM으로 누운 소는 진행하면서 동안신경 압박으로 대광반사가 소실될 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">6.</span><span>병변 위치 결정 — 뇌<span class="hang">전뇌: 발작, 행동 변화, 추진성 보행, 선회, 머리 밀기, 의식 저하. 한쪽 전뇌 병변은 반대쪽에 세 가지가 나타난다. 보행은 정상인데 자세 반응 결손(큰 소는 미끄러운 바닥에서 한쪽 다리가 미끄러지거나 턱을 넘을 때 발굽을 끎), 위협반응 소실, 피부·비점막 감각 저하다. 대뇌 병변은 머리와 목이 휘어지고(편위), 전정 병변은 머리가 장축으로 회전(기울임)한다.</span><span class="hang">뇌간: 뇌신경 결손이 위치를 알려 준다. II 간뇌, III·IV 중뇌, V 교뇌, VI~XII 연수다. 간뇌보다 뒤쪽 병변은 보행 이상을 일으키며 한쪽 병변이면 같은 쪽이다. ARAS 침범은 침울~둔감, 심한 중뇌·교뇌 병변은 혼수를 일으킨다.</span><span class="hang">전정 말초성(중이·내이염): 명랑하고 힘이 있으며 깡충뛰기 정상, 머리는 병변 쪽으로 기울고 안진 급속상은 반대쪽, 같은 쪽 안면마비 동반이 흔하다. 중추성(리스테리아증, 뇌간 농양): 침울, 다른 뇌신경 결손, 같은 쪽 부전마비·실조, 안진 방향 일정치 않음. 양측성은 기울임 없이 머리를 양쪽으로 크게 흔들고 눈을 가리면 심해진다.</span><span class="hang">소뇌: 내딛기가 늦은 뒤 방향이 맞지 않는 과도한 굴곡이 터져 나오는 측정이상 보행, 근력 유지, 평형 소실, 넓은 기저 자세, 의도진전. 심한 앞쪽 소뇌 병변은 후궁반장을 일으키나 후궁반장은 대뇌·소뇌 질환 여럿에서 나타나 이것만으로 위치를 정하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>병변 위치 결정 — 척수와 말초<span class="hang">팽대부(C6~T2, L4~S2) 회백질 병변은 해당 다리에 LMN형 부전마비를, 백질만 침범하면 UMN형 부전마비와 GP형 실조를 일으킨다.</span><table class="bxt"><tr><th>구역</th><th>앞다리</th><th>뒷다리</th><th>기타</th></tr><tr><td>C1~C5</td><td>UMN·실조</td><td>UMN·실조</td><td>심하면 머리만 들고 목은 못 듦</td></tr><tr><td>C6~T2</td><td>LMN</td><td>UMN·실조, 반사 정상~항진</td><td>흉골와위 유지 곤란</td></tr><tr><td>T3~L3</td><td>정상</td><td>UMN·실조, 반사 정상~항진</td><td>개처럼 앉기, 병변 뒤 피간근반사 소실</td></tr><tr><td>L4~L6</td><td>정상</td><td>체중 지지 곤란, 슬개반사 감소</td><td>대퇴신경, L6은 비골 성분</td></tr><tr><td>S1~S2</td><td>정상</td><td>비절 과굴곡, 구절 배측 꺾임</td><td>요실금, 직장 정체</td></tr><tr><td>천미부</td><td>정상</td><td>정상</td><td>꼬리·항문 긴장, 반사, 통각 소실</td></tr></table><span class="hang">개처럼 앉으면 T2보다 뒤, 못 앉으면 경수 병변일 수 있다. 다만 저칼슘혈증 기립불능 소도 네 다리를 못 쓸 수 있다. 소는 심한 흉요부 손상에서도 Schiff-Sherrington 증후군을 거의 보이지 않는다.</span><span class="hang">신경근접합부(보툴리즘)와 대사성 장애(저칼슘·저칼륨혈증)는 실조 없는 전신 이완을 일으킨다.</span><span class="hang">호너증후군(같은 쪽 안검하수, 축동, 얼굴·귀 온도 상승, 콧등 건조)은 경정맥 천자 때 미주교감신경간 손상이나 약물 혈관 주위 유출로 생기며 대개 며칠 안에 회복한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">8.</span><span>뇌척수액 검사 — 채취와 처리<span class="hang">뇌척수액(CSF) 분석은 신경 질환에서 혈액학이나 생화학보다 가치가 크다. 원칙은 병변 가까이에서 채취하는 것이다.</span><span class="hang">요천추부: 마취 없이 서거나 누운 상태에서 가능해 선호한다. 마지막 요추 극돌기(L6)와 첫 천추 극돌기(대개 S2) 사이 정중 함몰부, 또는 양 요각 뒤끝을 잇는 선의 중점이다. 국소마취 후 탐침 척수침을 척추면에 수직으로 넣으면 황색인대를 뚫을 때 저항이 툭 사라지고 2~3초 안에 CSF가 올라온다. 2~3 mL면 충분하다. 침은 송아지 4~5 cm, 200 kg 넘는 소 10~15 cm 18G다.</span><span class="hang">대후두공은 두개 내 병변에 이상적이나 뇌간 천자 위험으로 드물게 쓰고 두개내압 상승이 의심되면 금한다(자일라진 0.20 mg/kg 근육 진정). 척추체 농양이나 경막외 림프종으로 막히면 요천추부에서 잘 안 나온다.</span><span class="hang">멸균관에 받고 항응고제는 필요 없다. 세포 검사는 15분 안에 하고, 늦어지면 자가 혈청을 넣어 약 11% 용액으로 만들면 4°C 24시간 보관된다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>뇌척수액 — 정상치와 해석<table class="bxt"><tr><th>항목</th><th>정상</th></tr><tr><td>백혈구</td><td>&lt;5개/μL(Constable), ≤6개/μL(Rebhun), 단핵구 위주</td></tr><tr><td>단백질</td><td>23~60 mg/dL(Constable), ≤40 mg/dL(Rebhun)</td></tr><tr><td>포도당</td><td>37~51 mg/dL, 혈청의 60~80%</td></tr><tr><td>Na / K / Mg</td><td>132~144 / 2.7~3.2 mmol/L / 1.8~2.1 mEq/L</td></tr><tr><td>대후두공 압력</td><td>12~16 cmH2O(PEM 20~35)</td></tr></table><span class="hang">세포 증가: 경도 6~49, 중등도 50~200, 고도 &gt;200개/μL. 호중구성 증가는 중추신경 염증을 95~100% 시사한다. 세균 감염은 단백 증가와 백혈구 최대 2000개/μL, 호중구 70% 이상이다. 탁하면 대개 500개/μL 이상이다. 호산구가 하나라도 있으면 기생충 이행이나 진균성 뇌염이다. 황색변색은 이전 출혈이나 단백 증가다.</span><span class="hang">CSF 압력은 PEM, 세균성 수막염, 비타민A 결핍에서 높다. 신생 송아지는 생후 48시간 단백이 가장 높고 2주령에 성우 수준이 된다.</span><span class="hang">농장 간이검사: 판디 검사(10% 석탄산 1 mL에 CSF 한 방울, 경계면 혼탁이면 대개 총단백 약 50 mg/dL 이상). 요 시험지 단백도 참고한다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>질병별 뇌척수액 소견<table class="bxt"><tr><th>질병(두수)</th><th class="c">단백(mg/dL)</th><th class="c">유핵세포(/μL)</th><th>우세 세포(%)</th></tr><tr><td>리스테리아증(23)</td><td class="c">72(16~371)</td><td class="c">25(2~328)</td><td>단핵구 78, 림프구 20</td></tr><tr><td>신생 송아지 수막염(11)</td><td class="c">414(61~1236)</td><td class="c">2900(425~30,000)</td><td>호중구 83</td></tr><tr><td>큰 송아지 수막염(4)</td><td class="c">255(46~971)</td><td class="c">1225(405~12,800)</td><td>혼합</td></tr><tr><td>중이염 동반 수막염(4)</td><td class="c">118(17~565)</td><td class="c">329(2~1200)</td><td>단핵구 60</td></tr><tr><td>TEME(3)</td><td class="c">156~818</td><td class="c">90~462</td><td>호중구 0~94</td></tr><tr><td>농양(12)</td><td class="c">85(34~425)</td><td class="c">13(2~5100)</td><td>단핵구 85</td></tr><tr><td>광견병(2)</td><td class="c">68~97</td><td class="c">7~14</td><td>림프구 약 50, 단핵구 약 50</td></tr><tr><td>악성카타르열(2)</td><td class="c">36~98</td><td class="c">17~40</td><td>단핵구 48~77</td></tr></table><span class="hang">감염성 중추신경 질환 소 66두 성적이다(Rebhun). PEM과 납중독은 급성기 정상, 3일 넘으면 단백과 대식세포가 약간 오른다. 신경형 케토시스와 BSE는 정상이다. 뇌하수체 농양은 단백 70~502 mg/dL, 유핵세포 6~12,640개/μL(호중구 6~84%)다(Large Animal IM).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>대뇌피질 증상 감별 — 공통 양상<span class="hang">회백질연화증(PEM, 티아민 부족·유황), 납중독, 식염중독·물부족, 비타민A 결핍, 간성뇌증은 모두 침울, 실명, 머리 밀기, 이갈기, 발작, 후궁반장을 보여 비슷하다. 대개 열이 없고 급성기 CSF에 염증이 없다. 수막염과 H. somni는 열과 염증성 CSF가 있다.</span><span class="hang">감염성 뇌염은 대부분 시력이 남는다. 광견병은 항상 감별에 넣지만 실명은 흔하지 않다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>대뇌피질 증상 감별표<table class="bxt"><tr><th>항목</th><th>PEM</th><th>납중독</th><th>식염중독·물부족</th><th>비타민A 결핍</th><th>간성뇌증</th></tr><tr><td>호발</td><td>2~8개월령, 고곡물, 고유황 사료·물</td><td>송아지, 봄 방목 직후</td><td>대용유 송아지, 물 제한 성우</td><td>6~8개월령(경련형), 12~18개월령(안구형)</td><td>송아지 문맥단락, 성우 피롤리지딘</td></tr><tr><td>실명</td><td>중추성</td><td>중추성</td><td>중추성</td><td>말초성, 산동, 대광반사 소실</td><td>있을 수 있음</td></tr><tr><td>특징</td><td>배내측 사시, 반추 유지</td><td>발작·울음·과민 더 흔함, 반추 정지, 위장 증상</td><td>설사, 탈수, 질소혈증, 물 먹은 뒤 악화</td><td>시신경유두 부종, 실신성 경련</td><td>증상이 오르내림, 힘주기</td></tr><tr><td>CSF</td><td>급성 정상, 압력 상승</td><td>급성 정상</td><td>Na가 혈청보다 높음</td><td>압력 상승</td><td>정상</td></tr><tr><td>확진</td><td>티아민 반응, UV 형광</td><td>혈중 납 &gt;0.30~0.35 ppm, 간·신장 &gt;10 ppm</td><td>혈청·CSF Na &gt;160 mEq/L</td><td>혈청 &lt;20 μg/dL</td><td>암모니아 상승</td></tr><tr><td>치료</td><td>티아민</td><td>CaNa2-EDTA + 티아민</td><td>Na 서서히 교정</td><td>비타민A 440 IU/kg</td><td>원인 관리</td></tr></table><span class="hang">PEM과 납중독은 한 두만으로 구별하기 어렵고 군 발생에서 양상 차이가 더 잘 드러난다. 엔진오일 냄새는 납중독 진단에 크게 도움이 되고, 어린 소의 금속 납은 복부 방사선으로 보인다. 시신경유두 부종이 여러 두에 있으면 비타민A 결핍이 가장 유력하다.</span><span class="hang">그 밖의 감별: 신경형 케토시스, 수막염·H. somni, 신경형 콕시듐증, 송아지의 D-젖산 산증과 클로스트리듐 D형 장독혈증, 암모니아 처리 사료에 의한 소 히스테리.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">13.</span><span>회백질연화증 — 원인과 기전<span class="hang">회백질연화증(polioencephalomalacia, PEM)은 대뇌피질 괴사(CCN)라는 병변 이름이며 티아민 부족, 유황 과다, 납중독, 식염·물 불균형, 저산소증이 모두 같은 병변을 만든다. 임상에서는 흔히 티아민 반응성 질환을 가리킨다.</span><span class="hang">티아민 부족형: 고곡물·저섬유 사료가 반추위 세균총을 바꿔 티아민분해효소 2형을 만드는 것이 가장 흔한 배경이다. 고사리·쇠뜨기의 1형 효소, 레바미솔·티아벤다졸 구충, 아세프로마진도 관련되며, 급격한 사료 변경이 흔한 계기다. 암프롤리움은 실험에서 매우 많은 양을 먹여야 재현되었다.</span><span class="hang">활성형 티아민피로인산(TPP)은 트랜스케톨라제, 피루브산·α-케토글루타르산 탈수소효소의 보조효소다. 유산소 대사에 의존하는 뇌, 특히 신피질, 외측슬상핵, 후구가 취약하다. 세포독성 부종 단계를 거쳐 괴사로 진행하므로 부종 단계에서 치료해야 한다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>회백질연화증 — 유황 유발형<span class="hang">황산염이 반추위에서 황화수소로 바뀌어 독성을 낸다. 세균은 고황산염 사료에 10~12일 적응한 뒤 독성 농도를 만들고, pH가 낮을수록 가스층 황화수소가 높다(pH 6.8에서 47%, 5.2에서 97%).</span><span class="hang">비육장에서는 고유황 사료 도입 15~30일 뒤, 6~18개월령에서 발생한다. 32°C에서는 물을 훨씬 많이 마셔 유황 섭취가 는다. 석고, 황산암모늄, 십자화과 식물, 맥아 뿌리가 원인으로 보고되었다.</span><table class="bxt"><tr><th>기준</th><th>값</th></tr><tr><td>사료 유황 요구량</td><td>1500~2000 ppm(0.15~0.20%)</td></tr><tr><td>사료 유황 최대 허용</td><td>4000 ppm(0.4%)</td></tr><tr><td>음수 황산염 바람직 / 최대 안전</td><td>&lt;500 ppm / 1000 ppm</td></tr><tr><td>맛 구별 역치, 비육 성적 저하</td><td>2000 ppm</td></tr></table><span class="hang">황산염 1000 ppm 넘는 물을 먹은 소는 200 ppm 미만보다 혈중 티아민이 낮았다. 사료와 물을 합한 총 유황 섭취량으로 평가한다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>회백질연화증 — 역학과 임상증상<span class="hang">젖소 송아지는 대개 산발적이며 2~8개월령에 흔하고 3주령 미만은 드물다. 육성우 군에서 이환율 10~25%(Rebhun), 집단 발생에서 최대 25%(Constable). 성우는 급성 반추위 산증과 함께가 아니면 드물지만 고황산염 물을 마시는 방목 성우 발생이 있다. 방목 육우는 폐사한 채 발견되기도 한다.</span><span class="hang">좌우 대칭 피질 증상: 짧은 침울과 식욕부진 뒤 대광반사가 정상인 실명이 초기에 온다. 목적 없는 보행, 실조, 머리와 귀의 떨림, 턱 씹기와 거품 침, 머리 밀기(벽에 막힌 강박적 전진), 이갈기, 두통 자세, 끄는 보행. 손으로 건초를 먹이면 삼키기 어려워할 수 있다.</span><span class="hang">배내측 사시는 송아지와 육성우에서 흔하고 성우에서는 덜하다. 다른 뇌신경 결손은 대개 없다. 누우면 후궁반장, 안진, 발작, 혼수로 진행하고 치료하지 않으면 24~96시간(Rebhun), 24~48시간(Constable) 안에 죽는다.</span><span class="hang">시신경유두 부종은 보고되나 Rebhun 저자들은 본 적이 없으며 실명은 피질성이라고 본다. 유황형은 반추 가스에서 썩은 달걀 냄새가 날 수 있다.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>회백질연화증 — 진단<span class="hang">급성기에는 임상증상과 CSF(맑고 세포 증가 없음, 단백 정상~약간 높음)로 진단한다. 3일 넘으면 단백과 대식세포가 늘 수 있다. CSF 단백 15~540 mg/dL(평균 90) 기록이 있다.</span><span class="hang">혈액 티아민 정상 75~185 nmol/L, &lt;50이면 결핍 시사. 적혈구 트랜스케톨라제 감소, TPP 효과가 정상 30~50%에서 70~80% 이상으로 상승. 식욕부진만으로도 변하므로 같은 우리 건강우와 비교한다. 검사는 구하기 어렵고 비싸다.</span><span class="hang">현장에서는 티아민 반응이 가장 실용적 확진이다. 수 시간 안에 회복하면 티아민 부족형, 반응이 없으면 유황형을 의심한다. 유황형은 총 유황 섭취 계산, 반추위 가스층 황화수소(좌측 겸부에 12~18G 침과 검지관, 대조군의 최대 100배, 같은 우리 건강우에서 더 정확), 요 티오황산염으로 확인한다.</span><span class="hang">부검: 대뇌 부종, 피질 황색 변색, 소뇌 탈출, 365 nm 자외선 형광.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>회백질연화증 — 치료와 예후<table class="bxt"><tr><th>출처</th><th>티아민 염산염 용법</th></tr><tr><td>Rebhun</td><td>10~20 mg/kg 정맥 천천히 초회, 이후 10 mg/kg 근육·피하 하루 2~4회, 3~10일</td></tr><tr><td>Constable</td><td>10 mg/kg 천천히 정맥 또는 근육, 3시간마다 총 5회 이상</td></tr><tr><td>Blackwell</td><td>10 mg/kg 6~8시간마다, 첫 회 정맥 천천히, 이후 근육 3~5일</td></tr></table><span class="hang">정맥 일시 주사로 쓰러질 수 있다. 뇌부종에 20% 만니톨 0.5~2.0 g/kg을 20~30분에 정맥(효과 미입증, Rebhun), 또는 20% 만니톨 0.25~1 g/kg이나 7.2~7.5% 고장식염수 4~5 mL/kg, 덱사메타손 1 mg/kg 정맥 1회(Constable). Rebhun은 코르티코스테로이드를 대개 쓰지 않는다.</span><span class="hang">소화관 티아민분해효소가 의심되면 송아지에 티아민 5 g 경구. 오래 먹지 않으면 반추액 이식. 유황형은 특이 치료가 없고 티아민을 일찍 쓰면 일부 효과가 있으나 반응이 대개 나쁘다.</span><span class="hang">일찍 치료하면 1~6시간 안에 반응하고 24시간 안에 회복할 수 있으며, 아급성은 24~96시간에 걸쳐 좋아진다. 시력이 가장 늦게 돌아오고(9일째 회복한 예) 드물게 영구 실명이 남는다. 대개 48시간 안에 정상이 되며, 3일째 끝까지 둔하고 먹지 않으면 도태를 고려한다. 최소 2회 치료 후 6~8시간 반응이 없으면 긴급 도축을 고려한다(Constable).</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>회백질연화증 — 예방<span class="hang">발생하면 사료를 평가한다. 곡물 위주면 긴 건초를 두당 하루 5~10 lb(약 2.3~4.5 kg) 넣거나(Rebhun), 조사료 50% 이상 또는 체중 100 kg당 1.5 kg 이상으로 바꾼다(Constable).</span><span class="hang">티아민 첨가: 5~10 mg/kg 사료(Rebhun). 집단 발생 시 50 mg/kg 사료 2~3주, 위험 사료를 계속 먹이면 20~30 mg/kg, 상시 예방은 3 mg/kg 건물(Constable). 송아지 집단 발생 때 동거우에 티아민 10 mg/kg 근육을 매주 반복할 수 있다.</span><span class="hang">유황형은 사료와 물의 총 유황을 줄이고 고유황 십자화과 방목을 제한한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>납중독 — 원인과 기전<span class="hang">가축의 가장 흔한 중독 중 하나다. 폐배터리, 사용한 엔진오일(100 mL당 500 mg 넘는 납 가능), 납·알루미늄 페인트, 지붕재, 리놀륨, 오일필터, 땜납, 산탄, 비소산납 살포제, 산업 오염, 소각 재가 원인이다. 대개 한 공급원의 산발 발생이고 사료 오염이면 집단 발생한다. 봄 방목 직후 어린 송아지에 많다.</span><span class="hang">한 번에 1 g/kg이면 급성 치사, 매일 2~3 mg/kg이면 1개월 넘게 지나야 증상이 날 수 있다. 용량이 클수록 잠복기가 짧고 폐사율이 높다.</span><span class="hang">금속 납은 흡수가 가장 적고 전위에 수개월 남는다. 성우는 1~3%, 포유 송아지는 50%까지 흡수한다(Rebhun). 형태와 무관하게 2~10%만 흡수된다는 기술도 있다(Constable). 칼슘·철·아연 결핍은 흡수를 늘린다. 흡수된 납은 뼈에 저장되고 주로 담즙과 젖으로 배설된다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>납중독 — 임상증상<span class="hang">급성형(송아지·어린 소): 갑자기 시작해 12~24시간 지속되며 방목 중이면 폐사한 채 발견되기 쉽다. 비틀거림, 머리와 목의 떨림, 턱 씹기(껌 씹기 발작)와 거품 침, 눈꺼풀 깜박임, 안구 굴림, 울음, 실명, 얼굴·귀 실룩임, 이어서 강직간대 경련. 경련 사이에도 산동, 후궁반장, 떨림이 지속되고 소리와 촉각에 과민하다. 성우는 선 채로 광폭해져 돌진하기도 한다.</span><span class="hang">아급성형(성우에 흔함): 3~4일 산다. 반추위 무력, 변비 후 악취 나는 검은 설사, 이갈기, 침 흘림, 둔함, 실명, 방향이 일정치 않은 간헐적 선회, 약한 떨림과 과민, 복통.</span><span class="hang">저농도 초기에는 침 흘림, 이갈기, 떨림, 혀 놀림, 채식 곤란, 과민이 나타난다. 만성에서 빈혈, 호염기성 반점, 경미한 질소혈증이 있을 수 있으나 진단할 만큼 흔하지 않다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>납중독 — 진단<span class="hang">증상과 축사·방목지 정밀 수색이 기본이며 실험실 확인이 대개 필수다.</span><table class="bxt"><tr><th>시료</th><th>기준</th></tr><tr><td>혈액(헤파린)</td><td>정상 0.05~0.25 ppm, &gt;0.30 ppm 이상(Rebhun). &gt;0.35 ppm 중독, &lt;0.1 ppm 정상 노출(Constable)</td></tr><tr><td>신장·간(습중량)</td><td>&gt;10 ppm 독성. 중독우 평균 간 93, 신장 438 μg/g</td></tr></table><span class="hang">저농도 만성 노출은 혈중 납이 크게 안 오를 수 있다. 혈중 델타아미노레불린산 탈수효소 감소, 요 델타아미노레불린산 증가, 적혈구 아연 프로토포르피린 증가도 지표다. CSF는 급성기 정상, 아급성은 약간 올라 PEM과 구별되지 않는다.</span><span class="hang">확진 시료: 간, 신장, 제2위 내용물 각 50 g, 포르말린 고정 대뇌피질과 신장(신세뇨관 항산성 핵내 봉입체).</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>납중독 — 치료와 식품 안전<span class="hang">추가 노출 차단이 최우선이다. 의심 사료를 치우고 방목을 중단하며 사료를 독성 검사에 보낸다.</span><table class="bxt"><tr><th>출처</th><th>CaNa2-EDTA 용법</th></tr><tr><td>Rebhun</td><td>60~110 mg/kg/일 정맥(피하 가능), 하루 2회로 나눠 3~5일, 3~5일 쉬고 반복</td></tr><tr><td>Constable</td><td>73.3 mg/kg/일을 하루 2~3회 나눠 천천히 정맥 3~5일, 필요하면 2일 쉬고 3~5일 추가</td></tr></table><span class="hang">EDTA는 뼈의 납을 킬레이트하므로 간헐 투여한다. 빨리 넣으면 심박·호흡 증가, 떨림이 온다. 소화관에 납이 많이 남은 채 킬레이트하면 흡수가 늘 수 있고 동원된 납이 증상을 일시 악화시킬 수 있다.</span><span class="hang">티아민 10 mg/kg 이상(Rebhun), 또는 2 mg/kg 근육을 EDTA와 함께, 하루 8 mg/kg 이하(Constable). EDTA 단독은 증상을 악화시킬 수 있으나 티아민 병용은 개선한다.</span><span class="hang">최근 섭취면 반추위 절개로 제거·세척, 황산마그네슘 하제로 황화납 배출. 송아지 경련에 디아제팜 5~10 mg 정맥.</span><span class="hang">경증이나 위장 증상만이면 예후가 좋고 경련, 후궁반장, 실명, 치매가 있으면 나쁘다. 회복우 유즙 납은 여러 번 검사하며 수개월 높을 수 있고, 노출 비유우가 있으면 집유 탱크를 감시한다. 최소 6개월 도축을 보류한다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">23.</span><span>식염중독·물부족 — 원인과 기전<span class="hang">고나트륨혈증은 송아지 신경 증상의 흔한 원인이고 성우에서는 드물다. 송아지는 물 미급여가 가장 흔하고, 전해질액·대용유 희석 오류, 라살로시드 등 나트륨 첨가제, 짠 물로 대용유 조제가 원인이다.</span><span class="hang">성우는 사고나 가뭄에 의한 물 부족, 얼어붙은 급수, 결빙 통로의 소금물, 짠 유청, 바닷물, 배합·수액 조제 실수가 원인이다. 물이 충분하면 사료 염분은 대개 문제가 안 된다. 음수 염분 0.25%로도 고능력우 유량이 줄고, 비유 초기 젖소가 특히 취약하다.</span><span class="hang">뇌세포는 고나트륨에 삼투물질을 쌓아 적응하므로, 나트륨을 빨리 낮추거나 물을 많이 마시면 세포독성 뇌부종이 생긴다. 물 제한 뒤 급수 재개(예: 동파 후)나 수액 후 악화되는 이유다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>식염중독·물부족 — 임상증상과 진단<span class="hang">송아지: 침울, 설사, 허약이 주이고 진행하면 발작한다. 증상은 나트륨 상승에 비례하며 발작은 저절로 또는 정맥 수액 후에 온다.</span><span class="hang">성우: 식욕부진, 설사, 이어서 침울, 실명, 발작, 심하면 전정·소뇌성 실조. 급성 다량 섭취는 1~2일 뒤 후궁반장, 안진, 떨림, 실명, 구절 너클링 후 경련하고 24시간 안에 죽는다. 짠 물을 먹는 소의 아급성형은 갈증, 송아지의 계속 울기, 체중 감소, 탈수, 저체온을 보이며 억지로 움직이면 경련한다.</span><span class="hang">혈청 고나트륨혈증 확인이 확진이다. 혈청과 CSF Na가 대개 160 mEq/L 넘고(정상 135~145) CSF가 혈청보다 높다. 대부분 질소혈증이 있다. 죽은 송아지는 CSF나 방수 Na(정상 약 130)를 잰다. 뇌 Na가 2000 ppm 넘으면 식염중독 시사(Rebhun), 1800 ppm 넘으면 진단적(Constable).</span><span class="hang">송아지는 희석 비율과 물 접근을 조사하고 대용유는 Brix 굴절계로 선별한다. 성우는 사료와 물 염분을 분석한다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>식염중독·물부족 — 치료와 예방<span class="hang">원칙은 혈청과 CSF 삼투압을 천천히 낮추는 것이다. 물을 자유롭게 주는 것은 예방이지 치료가 아니다. 성우는 소량의 물을 일정 간격으로 준다.</span><span class="hang">교정 속도: 시간당 1 mEq/L 미만(Rebhun). 12~24시간 이내 급성은 시간당 1 mmol/L, 기간이 길거나 모르면 0.5 mmol/L 이하(Constable).</span><span class="hang">자유수 결핍(L) = 0.6 × 체중(kg) × (현재 Na / 정상 Na − 1). 첫 24시간에 50% 이하, 나머지는 24~48시간에 채운다(Constable).</span><span class="hang">수화 양호면 5% 포도당이나 0.45% 식염수, 순환량 부족이면 0.9% 식염수(Constable). 설사·탈수 송아지는 탈수·산염기를 먼저 교정한 뒤 반생리~생리식염수 함유 저농도 포도당을 천천히 점적한다(Rebhun). 수화가 충분한 급성 중독에는 푸로세미드 0.5 mg/kg, Na 정상화 후 반응이 없으면 만니톨, 티아민 보조는 해가 없다.</span><span class="hang">Na 201 mEq/L 송아지도 완전 회복한 예가 있고, 고나트륨 전해질액에 의한 급성이 대용유와 물 부족에 의한 만성보다 예후가 좋다. 예방은 소금과 물의 상시 자유 급여, 음수 염분 0.5% 이하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">26.</span><span>비타민A 결핍 — 원인과 임상형<span class="hang">녹색 조사료나 비타민A 첨가 없는 오래된 사료, 무첨가 곡물 위주 사료, 가뭄기 건조 방목에서 생기며 주로 육성·비육 육우다. 수막 비후로 CSF 흡수가 막혀 두개내압이 오르고, 뼈 재흡수 결함으로 시신경관이 좁아져 시신경이 압박된다. 야맹이 가장 이른 징후다.</span><span class="hang">경련형: 건조한 여름 방목지에서 이유한 6~8개월령 송아지. 저절로 또는 취급 후 쓰러져(실신) 10~30초 강직간대 경련을 한다. 대개 실명하지 않는다. 치명률이 25%에 이를 수 있으나 치료하면 48시간 안에 낫는다.</span><span class="hang">안구형: 수개월 경계 결핍 사료를 먹은 12~18개월령(최대 2~3세). 낮에 양안 실명, 동공이 크게 열려 고정, 시신경유두 부종, 망막 출혈, 위협반응 소실, 안검·각막반사 유지. 익숙한 곳에서는 잘 먹는다. 억지로 걷거나 차에 실으면 경련한다. 시신경 변성으로 치료에 반응하지 않는다.</span><span class="hang">마비형은 뒷다리부터 허약과 실조가 온다. 그 밖에 유산, 약자 출산, 태반 정체, 선천 안구 기형이 있다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>비타민A 결핍 — 진단, 치료, 예방<span class="hang">실명과 비정상 대광반사, 신경 증상을 보이는 무리에서 시신경유두 부종이 보이면 비타민A 결핍의 특징적 소견이다. 시신경유두 부종은 야맹보다 먼저, 혈장 18 μg/dL 미만에서 생긴다.</span><table class="bxt"><tr><th>지표</th><th>값</th></tr><tr><td>혈청 비타민A 정상 / 적정 최소</td><td>25~60 / 20 μg/dL</td></tr><tr><td>8.9~18 / 4.9~8.9 / &lt;4.9 μg/dL</td><td>체중 감소만 / 실조·실명 / 경련·시신경 협착</td></tr><tr><td>혈장 카로틴</td><td>최적 150 μg/dL, 9 μg/dL에서 증상</td></tr><tr><td>간 비타민A / 카로틴</td><td>적정 60 / 4.0, 위험 2 / 0.5 μg/g</td></tr></table><span class="hang">혈장 농도는 간 저장분이 고갈된 뒤에야 떨어지고 분만과 급성 감염 때 일시적으로 떨어진다.</span><span class="hang">무리 전체에 비타민A 440 IU/kg 주사(수용성 선호), 반복 가능, 즉시 사료로 하루 40 IU/kg을 공급한다. 하루 최소 요구량은 40 IU/kg이고 임신·비유·급성장기에는 50~75% 더 준다. 결핍 송아지에 수용성 비타민A 1,000,000 IU 근육주사 후 1개월 뒤 재주사하는 방법도 있다(한우송아지질병관리핸드북). 실명한 안구형은 도태한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>간성뇌증<span class="hang">미만성 간 질환의 고암모니아혈증과 순환 독성 인자에 의한 대사성 뇌병증이다. 소에서는 말보다 훨씬 드물며 증상은 대부분 전뇌성(행동 변화, 발작)이다.</span><span class="hang">송아지: 대개 문맥전신단락(PSS)이다. 2주쯤 정상이다가 반추위가 기능하면서 대뇌·척수 증상이 오르내린다. 2~3개월령, 발육 불량, 간헐적 실조, 허약, 침울, 이갈기, 힘주기. 암모니아만 높고 간효소, 빌리루빈, 응고검사는 정상이며 초음파, 조영 방사선, CT·MRI로 진단한다. 복수는 없다.</span><span class="hang">성우: 피롤리지딘 식물(Crotalaria, Senecio) 장기 섭취. 침울, 머리 밀기, 공격성, 발작, 힘주기, 황달은 드물고 여러 두가 이환된다. 간효소 상승, 고빌리루빈혈증, 응고 이상, 간 생검의 섬유화·거대간세포·담관 증식 세 가지. 대개 치명적이다.</span><span class="hang">동맥혈 암모니아 정상은 성우 29 μmol/L 미만이다. PSS 내과 관리는 티아민·수액, 식초 경구, 저단백 사료 지속이며 사료를 끊으면 암모니아가 더 오를 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">29.</span><span>신경형 케토시스 — 증상과 진단<span class="hang">비유 첫 8주 사이의 케토시스 뇌병증형이다. 저혈당, 아세토아세트산·아세톤 독성, 반추위의 이소프로필알코올이 원인으로 거론된다.</span><span class="hang">한 곳을 계속 핥고 물통을 물어뜯으며, 계류우는 스탠천에 몸을 계속 민다. 배회, 선회, 실조, 머리 밀기, 과민이 있고 보정 시도 뒤 공격, 질주, 울음이 나타난다. 누운 소의 계속 핥기나 이기는 신경형 케토시스를 시사한다. 과비 분만우는 분만 며칠 안에 생겨 저칼슘·저마그네슘혈증으로 오인된다. 실명은 가끔이며 드물게 피질성 실명이 영구히 남는다.</span><span class="hang">비유 초기, 강한 케톤 양성, 신경 증상의 세 가지로 진단한다. 물을 많이 마시면 희석되고, 시약 다수는 아세토아세트산만 검출한다. 스탠천을 미는 소는 리스테리아증과 감별하는데 뇌신경 결손이 없고 CSF가 정상이다. 리스테리아증 소도 이차 케토시스가 오지만 신경 증상이 며칠 먼저 있었다. 공격성은 광견병, 실명은 PEM·납중독을 감별한다.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>신경형 케토시스 — 치료<span class="hang">50% 포도당 300~500 mL 정맥, 공격적이면 자일라진 20 mg 근육·정맥으로 먼저 진정한다. 6~12시간 뒤 반복하고, 가능하면 5% 포도당 20 L를 24시간 지속 투여, 아니면 12시간 간격 최소 3회. 한 번으로는 대개 부족하다.</span><span class="hang">덱사메타손 10~20 mg 초회 후 10 mg 3~4일, 프로필렌글리콜 6~8 oz 하루 2회 경구, 몹시 흥분하면 포수클로랄 30 g 경구.</span><span class="hang">분만 전후 소는 예후 보통, 그 외는 좋다. 대개 수 시간 안에 풀리고 유지 치료를 소홀히 하면 재발한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>리스테리아증(뇌간형) — 원인과 역학<span class="hang">Listeria monocytogenes는 흙, 식물, 분변에 널리 있는 그람양성 소간균이며 성우 수막뇌염의 가장 흔한 원인이다(선회병). 소에서는 4b형이 가장 흔하다. 사람도 감염되므로 장갑을 낀다.</span><span class="hang">옥수수 사일리지가 주 공급원이다. pH 5.0 미만으로 발효되면 균이 증식하지 못하지만, 너무 건조하거나 발효가 덜 되면 증식한다. 오염된 곤포 건초도 원인이다. 4°C 저온에서도 잘 자란다.</span><span class="hang">대개 한 두만 걸리는 산발성이며, 몇 달에 걸쳐 10%에 이르는 집단 발생도 있으나 양보다 드물다. 12개월령 미만은 드물고 중앙 연령은 4세다. 태아·신생우 패혈형은 임신 말기 유산, 사산, 드물게 신생 수막뇌염을 일으킨다.</span><span class="hang">구강, 비강, 결막 점막 손상 뒤 주로 삼차신경을 따라 축삭 내로 거슬러 올라 교뇌와 연수에 이른다. 잠복기는 수주일 수 있다. 한국 자료는 잠복기 1~7일(약 48시간), 발병부터 폐사까지 10일 이상으로 적는다(한우송아지질병관리핸드북). 병변은 미세농양과 단핵구성 혈관주위 침윤이며 전뇌·척수 병변은 매우 드물다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>리스테리아증 — 임상증상<span class="hang">초기 39.4~40.5°C 열이 있을 수 있으나 없다고 배제하지 않는다. 침울과 다양한 뇌신경 결손의 조합이 핵심이며 조합은 소마다 다르다.</span><span class="hang">선회(계류우는 스탠천을 계속 민다), V 운동 결손(양측이면 턱 처짐과 혀끝 노출), 드물게 VI 결손(내측 사시).</span><span class="hang">VII: 매우 흔하며 대개 한쪽 귀 처짐, 안검하수, 입술 이완. 초기나 회복기에는 자극에 경련성 움찔임이 있다. 미묘하거나 양측일 수 있다. 노출각막염이 깊은 궤양, 포도막염, 천공으로 빨리 진행한다.</span><span class="hang">VIII: 머리 기울임, 선회, 몸통이 병변 쪽으로 기울어 오목해짐, 안진 방향 다양. 인접 경로 침범으로 같은 쪽 부전마비, 양측이면 경련성 사지마비로 기립불능.</span><span class="hang">IX·X: 연하곤란과 침 흘림(초기에 구토나 고창증). XII: 혀 돌출·약화. 식욕부진은 실제로는 먹지 못하는 것일 수 있다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>리스테리아증 — 진단과 감별<span class="hang">뇌간 질환과 뇌신경 결손을 확인하는 신중한 신경학적 검사가 필수다. CSF가 가장 가치 있다. 거의 예외 없이 세포와 단백이 오르고(57두 중 44두 백혈구 증가) 50% 이상이 단핵세포, 대식세포가 림프구보다 약간 많다. 급성기 호중구 30~40%, 만성으로 갈수록 대식세포 증가. 대개 맑다. 소는 말초 단핵구 증가를 잘 보이지 않는다.</span><span class="hang">침 손실로 대사성 산증과 저중탄산, 비유우는 케토시스가 올 수 있다. 생전 배양은 어렵고(저온 증균, 위음성) PCR이 더 민감하다. 사후에는 광견병 FA 음성과 뇌간 미세농양에 흔히 의존한다.</span><span class="hang">광견병: 공중보건상 가장 중요하다. 광견병 CSF는 세포와 단백이 더 낮고 작은 림프구가 우세하다. 안면·전정 증상 없이 연하곤란만 있는 비전형 리스테리아증이 가장 혼동된다.</span><span class="hang">중이·내이염은 더 명랑하고 잘 먹으며 수주~수개월령 송아지에 흔하다. PEM·납중독은 양측 피질성 실명이 있고 뇌신경 증상이 없다. H. somni는 CSF 세포가 크게 늘고 호중구 위주다. 신경형 케토시스, 공간점유 병변도 감별한다. 결손이 미미한데 먹지 못하면 반추위가 말라 통증을 보여 창상성 제2위염으로 오진하기 쉽다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>리스테리아증 — 항생제 치료<span class="hang">세포내 기생균이고 혈액뇌장벽이 투과를 막아 높은 용량이 필요하다.</span><table class="bxt"><tr><th>약물</th><th>용법</th><th>출처</th></tr><tr><td>페니실린</td><td>44,000 U/kg 하루 2회 근육·피하, 최소 7일 후 하루 1회 또는 22,000 U/kg 하루 2회로 감량. 정맥은 22,000 U/kg 하루 4회</td><td>Rebhun</td></tr><tr><td>암피실린</td><td>10 mg/kg 정맥 하루 3회, 또는 11 mg/kg 근육</td><td>Rebhun</td></tr><tr><td>옥시테트라사이클린</td><td>10 mg/kg 하루 2회 정맥·피하(수액 없으면 신독성)</td><td>Rebhun</td></tr><tr><td>프로카인 페니실린 G</td><td>초회 200,000 IU/kg 정맥 후 22,000 IU/kg 12시간 또는 44,000 IU/kg 24시간마다 근육, 10~14일</td><td>Constable</td></tr><tr><td>옥시테트라사이클린</td><td>10 mg/kg 12시간 또는 20 mg/kg 24시간마다 정맥, 10~14일</td><td>Constable</td></tr><tr><td>페니실린</td><td>20,000~40,000 IU/kg 정맥 6~8시간마다 7일, 이후 24시간마다 14~21일</td><td>Blackwell</td></tr></table><span class="hang">세팔로스포린은 듣지 않는다. 유방염 분리주 절반 이상이 페니실린·테트라사이클린 내성, 암피실린 내성은 적다는 보고(Rebhun)와 낙농장 분리주 90% 이상 암피실린 내성, 40% 페니실린 내성 보고(Constable)가 상충한다.</span><span class="hang">먹고 마시는 능력이 돌아오는 뚜렷한 호전과 함께만 감량하고 호전 후 최소 1주 더 준다. 대부분 7~21일 걸리며 일찍 끊으면 재발한다. 회복할 소도 처음 7~9일 호전이 없을 수 있다.</span><span class="hang">보조로 티아민 10 mg/kg 정맥 24시간마다, 플루닉신 1 mg/kg, 덱사메타손 1 mg/kg 1회가 제시되나(Constable) 덱사메타손 후 유즙 배균 증가 우려가 있다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>리스테리아증 — 보조요법과 예후<span class="hang">마시지 못하지만 침 손실이 적으면 위관으로 물과 전해질(Na, K)을 주어 탈수와 딱딱한 반추위를 푼다. 침을 많이 잃으면 중탄산 보충이 필요하며 하루 4~16 oz가 들 수 있다. 예: 염기 결핍 10 mEq/L 성우는 베이킹소다 약 125 g. 심한 산증의 침울을 병 진행으로 오인하지 않는다.</span><span class="hang">안면마비 쪽 눈에 연고를 자주 넣는다. 깔짚이 충분하고 미끄럽지 않은 우방이 필수다.</span><span class="hang">진단 시 걸으면 예후 보통~좋음, 누워 있으면 매우 나쁘다. 증상은 나타난 역순으로 풀린다. 2~3일 치료에 호전이 없으면 안락사를 고려한다(Blackwell).</span><span class="hang">유즙으로 균이 나올 수 있어 생우유를 먹지 않게 하고 이환우 젖은 버린다. 임신우는 유산할 수 있다.</span><span class="hang">예방: 사일리지 pH 5.0 미만, 흙·분변 오염 방지, 상한 부분 미급여, 사일리지 급여량을 서서히 늘림. 일부 국가는 백신을 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">36.</span><span>혈전색전성 수막뇌염(TEME) — 원인과 증상<span class="hang">Histophilus somni(구 Haemophilus somnus)는 혈관내피를 공격해 혈전성 패혈성 혈관염을 일으킨다. 경색은 중추신경 어디에나 생기고 폐, 심장, 근육, 관절에도 같은 병변이 생긴다.</span><span class="hang">여러 곳에서 모인 비육우, 전통적으로 6~12개월령의 가을·겨울 질병이며 입식 약 4주 뒤(1주~7개월)에 많았다. 최근에는 흉막폐렴과 심근염이 더 흔하다. 젖소는 드물게 4개월령 넘는 육성우에서 보며, 성우 무리에 급성 수막염이 여러 두 생기면 H. somni를 의심한다.</span><span class="hang">증상 없이 폐사한 채 발견되는 것이 첫 징후일 수 있다. 41~42°C 고열(정상일 수도), 침울, 눈을 반쯤 감음(sleeper syndrome), 한쪽 또는 양쪽 실명, 실조와 허약, 구절 너클링 후 쓰러짐. 누우면 후궁반장, 안진, 떨림, 경련이 있으나 자극 증상보다 허약과 마비가 두드러진다.</span><span class="hang">망막 출혈과 솜뭉치 삼출물은 모든 예에 있지는 않으나 진단에 귀중하다. 다발성 병변으로 뇌신경 증상도 가능하다. 활막염, 중이염 동반, 결막염도 생긴다. H. somni 수막염 성우는 몇 시간 만에 극심한 침울과 41.1°C까지 열이 오르고 치료하지 않으면 24~48시간 안에 죽는다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>TEME — 진단, 치료, 예방<span class="hang">CSF 세포가 크게 늘고 호중구가 우세하며 판디 강양성, 탁하거나 변색될 수 있다. 혈액은 중증이면 백혈구 감소, 덜하면 좌방이동 호중구증가. 배양은 민감도가 낮아 PCR을 쓴다. 부검에서 뇌와 척수에 0.5~3 cm 출혈성 경색이 여러 개다.</span><span class="hang">증상이 보이는 즉시 치료한다. 눕기 전에 치료하면 6~12시간 안에 흔히 회복하고, 치료하지 않으면 8~12시간 안에 죽는다. 누워 신경 증상이 뚜렷하면 대개 죽는다. 3일 치료에 반응이 없으면 비가역 병변이다.</span><span class="hang">옥시테트라사이클린 20 mg/kg 정맥 24시간마다 최소 3일, 플로르페니콜 20 mg/kg 근육 48시간마다(Constable). 암피실린 5 mg/kg 하루 2회 근육 또는 10~20 mg/kg 정맥 하루 3회, 육성우 플로르페니콜 20 mg/kg(Rebhun).</span><span class="hang">동거우는 7~10일 관찰해 초기에 치료한다. 백신(2~3주 간격 2회)은 효과가 불확실하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>세균성 수막염(송아지) — 원인과 증상<span class="hang">초유를 충분히 먹지 못한 신생 송아지의 그람음성 패혈증이 가장 흔한 원인이다. 대장균이 가장 많고(패혈증 연구 4건 모두 50% 이상) 클렙시엘라, 살모넬라, 초유 결핍 송아지의 연쇄상구균이 있다. 배꼽보다 경구 감염이 더 흔한 출발점이다.</span><span class="hang">성우는 드물고 산발적이며 대장균성 유방염, 자궁염, 제2위염 농양의 패혈성 전파나 뇌하수체 농양·전두동염의 직접 확장으로 생긴다.</span><span class="hang">송아지는 대개 2~14일령(평균 6일). 발열, 기면, 간헐적 발작, 머리 밀기, 실명(대광반사 정상), 과민, 두통 모습(눈을 반쯤 감고 머리와 목을 뻗음), 뻣뻣한 걸음, 일부 후궁반장. 압도적 패혈증은 쇼크에 가려 징후가 잘 안 보인다. 포도막염, 관절염, 제정맥염이 함께 있으면 의심한다.</span><span class="hang">성우는 발열, 심한 침울, 뻣뻣한 보행, 하늘 보기나 머리 밀기가 흔하고 발작은 덜하다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>세균성 수막염 — 진단, 치료, 예방<span class="hang">임상증상과 CSF로 확진한다. 단백과 백혈구가 오르고 급성은 호중구, 아급성은 대식세포가 우세하다. CSF와 혈액을 배양하고, 신생우는 혈청 단백과 면역글로불린으로 수동면역을 평가한다.</span><span class="hang">광범위 항생제가 주 치료다. 염증으로 혈액뇌장벽이 손상되어 CSF 투과가 늘어난다. 신생우는 그람음성을 예상해 세프티오푸르, 플로르페니콜, 엔로플록사신이 적절하다(라벨 용량은 CSF 농도가 부족할 수 있음). 내성균이나 고가 송아지에는 아미카신 20 mg/kg 하루 1회(수액 병행, 휴약 준수). 암피실린 5 mg/kg 근육 하루 2회 또는 10~20 mg/kg 정맥 하루 3회, 트리메토프림·설파 30 mg/kg 경구 하루 2회는 연쇄상구균에도 맞다.</span><span class="hang">덱사메타손 5~10 mg 1회와 만니톨 천천히 정맥으로 염증과 부종을 줄일 수 있다(NSAID로 대신하기도 함). 경련에 디아제팜 5~10 mg.</span><span class="hang">조기 치료가 아니면 예후는 매우 나쁘다. 예방의 핵심은 초유 관리와 배꼽 소독이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">40.</span><span>뇌농양 — 원인과 증상<span class="hang">대개 먼 감염 부위에서 색전으로 퍼진다. 송아지는 배꼽 감염, 폐렴, 중이·내이염 확장, 성우는 창상성 제2위염, 만성 근골격 농양, 반추위염, 전두동염 직접 확장, 코뚜레 등 머리 감염이다. Trueperella pyogenes가 가장 흔하다. 송아지는 2~8개월령에 많다. 수막염보다 천천히 시작하고 비대칭인 경우가 많다.</span><span class="hang">초기 증상은 놓치기 쉽고, 커지면 시각 장애, 부전마비, 실조, 심한 침울, 뇌신경 증상, 머리 밀기, 하늘 보기, 안구 돌출이 나타난다.</span><span class="hang">한쪽 대뇌반구 농양은 반대쪽 반맹(동공 정상), 반대쪽 자세 반응 결손(보행 정상), 추진 경향을 일으킨다. 큰 농양이 있어도 계속 먹는 소가 있다.</span><span class="hang">송아지 중이염에서 번진 뒤쪽 뇌간 농양은 안검반사 소실, 머리 기울임, 평형 소실, 안진에 더해 처음엔 같은 쪽, 나중엔 네 다리의 UMN 부전마비와 실조로 진행한다. 중이염 병력 송아지의 중추 증상 악화는 예후가 매우 나쁘다. 소염제·항생제로 잠시 안정되어도 끊으면 다시 나빠진다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>뇌하수체 농양<span class="hang">뇌하수체를 둘러싼 원더그물(rete mirabile)이 비강 정맥 혈류를 받는 구조 때문에 소에 잘 생긴다. 55%가 다른 장기, 부비동, 치아, 얼굴에 화농 병소가 있었다. 코뚜레 삽입 후 수소에서 보고되며 무균 조작과 페니실린 예방 투여로 줄인다. 대개 2~5세이며 T. pyogenes가 가장 흔하다.</span><span class="hang">갑자기 시작해 7~10일 진행 후 죽는다. 실조, 머리와 목을 뻗음, 넓은 기저 자세, 식욕부진, 침울, 머리 밀기, 기립불능에 비대칭 뇌신경 결손(연하곤란, 실명, 동공부동, 대광반사 소실, 혀 이완, 턱 처짐, 안면마비, 머리 기울임)이 대부분 있다. 약 절반이 서맥(분당 60회 미만)이다.</span><span class="hang">서맥, 실명, 반응 없는 동공과 화농성 CSF로 생전 진단한다. 사망률이 높아 대개 치료하지 않지만 22개월령 수소의 내과 치료 성공 보고가 있다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>뇌농양 — 진단과 치료<span class="hang">성우는 혈청 글로불린이 흔히 높으나 송아지는 일정하지 않고 혈구상은 정상인 경우가 많다.</span><span class="hang">CSF는 초기 정상일 수 있고 진행하면 단백과 세포(대개 단핵)가 크게 오르며, 농양이 터지면 호중구가 는다. 큰 농양은 두개 방사선에서 가스-액체 경계가 보이기도 하며 CT·MRI가 가장 믿을 만하다.</span><span class="hang">장기 항생제와 배농 외에는 치료가 제한적이고 대부분 죽는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">43.</span><span>광견병 — 원인과 임상증상<span class="hang">리사바이러스이며 예외 없이 치명적이다. 감염 동물의 교상으로 침 속 바이러스가 들어가 말초신경을 거슬러 뇌에 이르고 다시 침샘으로 나간다. 잠복기는 최소 1주, 흔히 1~3주에서 3개월, 드물게 6개월이며 머리·목 교상이 짧다. 실험 감염 소는 평균 잠복기 15일, 경과 4일이었다.</span><span class="hang">증상이 진행한다. 대부분 4~5일이면 눕고 대개 10일 안에(평균 약 5일) 죽는다. 상재 지역에서는 신경 증상을 보이는 거의 모든 소의 감별에 넣는다. 특이 증상은 없다.</span><span class="hang">마비형: 뒷다리 파행이나 구절 너클링, 엉덩이 흔들림, 꼬리 휘거나 늘어짐이 이른 징후이고 뒷부분 감각 저하가 좋은 단서다. 힘주기, 항문 마비, 음경 탈출, 요적하가 따른다.</span><span class="hang">대뇌형: 침울형과 공격형. 과민, 성욕 과잉, 소양감과 자해, 발작, 울음. 실명은 흔하지 않다.</span><span class="hang">침 흘림이 가장 일관되며 연하곤란, 혀 약화, 인두마비로 마시지 못한다. 하품 같은 동작은 소리 없는 울음 시도다. 소리는 낮고 쉰 소리(Rebhun), 평소보다 높은 소리(Constable)로 기술된다. 실험 감염 소는 침 흘림·행동 변화 100%, 주둥이 떨림 80%, 울음 70%, 공격·과민 70%, 인두마비 60%, 광폭형 70%였다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>광견병 — 감별, 진단, 취급<span class="hang">척수형은 요천추부 손상, 척추관 림프종·농양과, 공격성은 신경형 케토시스, 저마그네슘혈증과 감별한다.</span><span class="hang">CSF는 정상이거나 단백만 높거나 세포와 단백이 함께 오르며 대부분 림프구다. 다른 생전 검사는 쓸모없다. 확진은 뇌 형광항체검사(FAT)이며 시상, 교뇌, 연수가 해마·소뇌보다 낫다는 보고가 있다. 면역조직화학, RT-PCR도 쓴다. 네그리 소체는 소뇌 푸르키니에 세포에 많다.</span><span class="hang">치료는 불가능하다. 물린 상처는 철저히 씻고 소독한다. 의심우는 장갑을 끼고 최소 인원이 다루며 젖은 버리고 CSF는 각별히 조심한다. 확진되면 노출자 예방에 대해 보건 당국과 상의한다.</span><span class="hang">상재 지역에서는 소에 허가된 백신만 써서(일부 생백신은 초식동물에 부적합) 3개월령 기초 접종 후 매년 추가한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">45.</span><span>오제스키병(가성광견병)<span class="hang">돼지 허피스바이러스가 원인이며 소는 치명률이 높다. 감염 돼지 분비물이 사료, 상처, 코 접촉으로 전파되고 잠복기는 2~7일이다.</span><span class="hang">국소 또는 전신의 심한 소양감으로 핥고 비비며 자해하고(mad itch), 열과 함께 광견병과 비슷한 여러 신경 증상을 보이다 2~3일 만에 대부분 죽는다.</span><span class="hang">돼지와의 근접 이력이 핵심이다. 혈청검사, 소양 부위 척수 분절의 바이러스 분리, FA로 진단하고 광견병을 배제한다. 치료는 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">46.</span><span>소해면상뇌증(BSE)<span class="hang">프리온에 의한 치명적 신경 퇴행성 질환으로 해면상 변성을 일으키며 염증은 없다. 1986년 영국에서 나타났고 오염 육골분을 통한 되먹임으로 대유행했다. 반추동물 육골분 급여 금지 후 크게 줄었다. 비정형 H형, L형이 매우 낮은 비율로 있다.</span><span class="hang">고전형은 3~6세 이상에서 열 없이 서서히 시작해 수주(1~6개월) 진행한다. 불안, 흥분, 통로·착유실 진입 거부, 무리 이탈, 굴레 씌울 때 머리 흔들기, 소리·접촉 과민, 얼굴과 귀 실룩임, 반복적 발차기, 과대보행성 실조와 부전마비로 넘어지다 눕는다. 공격성은 일부만 보인다. 체중과 유량이 준다. 행동, 감각, 운동 이상이 함께 있으면 강하게 의심한다.</span><span class="hang">생전 검사는 없고 CSF와 혈청 항체는 정상이다. 신경세포·신경망의 공포 변화와 뇌간 프리온 면역검출로 확진하며 치료는 없다. 특정위험물질(뇌, 척수, 눈, 편도, 흉선, 비장, 장) 제거가 공중보건상 가장 중요하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">47.</span><span>악성카타르열의 신경 증상과 기타 바이러스성 뇌염<span class="hang">악성카타르열(MCF)은 면양 허피스바이러스 2형에 의한 혈관염으로 산발적 치명적 수막뇌척수염을 일으킨다. 양과의 접촉이 대부분이고 1~2세에 많다. 두부·안구형은 고열, 윤부에서 시작하는 각막 혼탁, 림프절 종대, 혈뇨와 미만성 신경 증상을 보인다. CSF는 두드러진 단핵세포 증가와 기묘한 단핵세포를 보이며 EDTA 전혈 PCR로 진단한다.</span><span class="hang">소 허피스바이러스 5형(남미), 드물게 1형은 발열과 전뇌 증상을 일으키며 대부분 시력이 남고 CSF는 림프구 증가다. 비화농성 뇌염에서는 광견병을 반드시 고려한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>파상풍 — 원인과 기전<span class="hang">Clostridium tetani 아포가 괴사 조직, 저산소 환경에서 증식형으로 바뀌어 독소를 만든다. 소는 말보다 감수성이 낮다. 균은 감염 부위에서만 자라고, 독소가 신경과 림프를 통해 척수와 뇌로 간다.</span><span class="hang">감염 부위: 신생 송아지 배꼽, 제각, 거세(고무링 포함), 코뚜레, 꽉 끼는 목줄, 고무링 단미, 발굽 농양, 귀표, 만성 부비동염, 깊은 괴사 상처, 난산 후 외음부·질 괴사, 분만 후 중증 자궁염. 못·쇠붙이 찔림, 제2위 창상도 원인이다(한우컨설팅지침서). 부위를 못 찾는 경우도 있다.</span><span class="hang">테타노스파스민은 운동신경을 거슬러 척수 복각의 렌쇼 세포 글리신 분비와 뇌간 GABA 분비를 막아 신전근을 지속 수축시킨다. 구조적 병변은 없다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>파상풍 — 임상증상과 진단<span class="hang">잠복기 3일~4주, 드물게 수개월(Constable). 보통 5~10일, 범위 1~3주(한우컨설팅지침서).</span><span class="hang">뻣뻣한 보행과 톱질대 자세, 고창증, 귀를 뒤로 젖히고 눈을 크게 뜨며 머리를 뻗고 콧구멍을 벌린 불안한 표정이 전형이다. 체온을 잴 때 꼬리가 들린 채 내려오지 않는다. 개구장애. 제3안검 돌출은 대부분 보이며 주둥이를 들거나 눈 아래를 두드리면 심해진다. 자극이 모든 증상을 악화시킨다.</span><span class="hang">씹으려 하면 강직이 와서 침을 흘리고 볼과 이 사이에 사료가 낀다. 마시지 못해 탈수가 온다. 고창증은 트림 장애 때문이며 어린 소의 이른 증상이다. 진행하면 쓰러져 후궁반장과 사지 강직, 경련, 체온 42°C까지, 호흡근 강직으로 질식한다. 치명적 경과는 5~10일이다.</span><span class="hang">체온이 41°C 내외로 해열제에 내렸다 다시 오르고 콧등이 마르며 눈이 충혈되며, 강직으로 쓰러진 개체는 24시간~3~4일 안에 모두 죽는다(한우컨설팅지침서).</span><span class="hang">증상과 상처 이력으로 진단하며 확진 검사나 특징적 부검 소견은 없다. 경증은 고창증만 보고 제2위염이나 소화불량으로 오진하기 쉬우므로 계류우는 풀어 걷게 하고 얼굴을 보며 입을 벌려 본다. 감별: 저마그네슘혈증, 백근병, PEM, 장독혈증, 스트리크닌, 수막염, 경련성 부전마비, 납중독, 제엽염.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>파상풍 — 치료<span class="hang">상처를 찾으면 진정·진통 후 세척, 괴사 제거, 배액하고 공기에 노출한다. 과산화수소가 더 효과적이다(한우컨설팅지침서). 괴사 제거는 항독소를 먼저 준 뒤 하라는 권고가 있다(Constable).</span><span class="hang">항독소: 결합한 독소는 중화 못 하며 용량 근거는 경험적(1500~300,000 U)이다. 15,000 U 1~2회(Rebhun), 10,000~50,000 IU 근육·정맥 1회 또는 반복(Constable). 말 유래 항독소를 척수강 내로 주지 않는다.</span><span class="hang">항생제: 프로카인 페니실린 22,000~33,000 U/kg 하루 2회(Rebhun), 44,000 IU/kg 근육 12~24시간마다 또는 페니실린 G 30,000 IU/kg 12~24시간마다, 옥시테트라사이클린 15 mg/kg 정맥 24시간마다(Constable). 3일 지속형 페니실린 3일 간격 3회(한우컨설팅지침서).</span><span class="hang">귀를 솜으로 막고 어둡고 조용한 우방, 미끄럽지 않은 바닥. 아세프로마진 성우 20~40 mg 하루 2~4회 정맥 또는 근육.</span><span class="hang">반복 고창증에는 좌측 겸부에 직경 2.5~5.0 cm 반추위 누관을 만든다.</span><span class="hang">강직이 심하면 20% 황산마그네슘 200 mL 정맥. 목만 경직된 개체는 일부 풀리나 전신 경직은 효과가 거의 없다. 가벼운 개체는 페니실린, 해열제, 영양제를 약 2주 주면 회복한다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>파상풍 — 예후와 예방<span class="hang">진단 후 14일은 위중하다. 24~48시간 안에 안정되면 희망이 있고, 3~5일째 다시 마시면 가장 고무적이다. 5~10일째 합병증으로 죽을 수 있으며 14일을 넘기면 대개 완전히 회복한다. 옆으로 누운 소는 강직, 통증, 공포, 탈진의 악순환으로 스스로 망가지며 슬링은 쓸모없다.</span><span class="hang">위험 지역은 생후 첫해 톡소이드 2회, 이후 매년. 이환우는 면역이 생기지 않으므로 2~4주 간격 2회 접종한다. 항독소 1500 IU는 10~14일 단기 예방을 준다.</span><span class="hang">거세 기구 소독, 수술 후 3일 지속형 페니실린과 1주간 상처 관찰, 바닥의 녹슨 못·철사 제거(한우컨설팅지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>보툴리즘 — 원인과 증상<span class="hang">Clostridium botulinum 신경독소가 콜린성 말단의 아세틸콜린 분비를 막는다. 소는 B, C, D형이 주이고 B형은 미국 동부, A형은 서부에 많다. 대개 사료 속 기성 독소를 먹어 생긴다. pH 4.5에 못 미친 사일리지, 비닐·원형 곤포, 발효 불량 헤일리지, 맥주박(B형), 사료·물 속 사체, 계분 뿌린 목초지(C·D형), 인 결핍 이식증이 원인이다.</span><span class="hang">증상은 섭취 1~3일 뒤(Rebhun), 3~17일, 드물게 1일째(Constable) 나타난다. 열 없는 대칭성 진행성 이완 마비가 뒷부분에서 시작해 앞다리, 머리, 목으로 진행하며 초기에 근육 떨림이 뚜렷하다.</span><span class="hang">식욕부진, 허약, 비틀거림, 머리 늘어뜨림, 침 흘림, 인두마비, 혀 약화로 같은 한 입을 계속 씹는다. 혀 긴장은 말보다 잘 유지되나 심하면 늘어진다. 한 집단 발생 안에서는 모두 혀 마비가 있거나 모두 없는 경향이 있다. 누우면 머리를 옆구리에 붙인 유열 같은 자세, 반추 약화, 요적하, 꼬리 긴장 소실, 안검하수와 경도 산동, 말기 복식 호흡. 감각과 의식은 끝까지 남는다.</span><span class="hang">증상은 독소 양에 비례하며 눕고 일어나지 못하면 예후가 나쁘고 중증은 1~3일 안에 죽는다. 일어나고 먹고 마시면 생존 가능성이 높으며 30일 가까이 누웠다 회복한 예도 있다.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>보툴리즘 — 진단, 치료, 예방<span class="hang">위 내용물, 분변, 상처, 사료·물에서 독소를 확인하는 것만이 확진이며 검출이 어렵다. 마우스 접종이 표준이고 B형 독소 유전자 PCR이 민감·특이하다. 부검 소견은 없다.</span><span class="hang">감별: 저칼슘혈증, 기립불능우, 독성 유방염·자궁염, 셀레늄 결핍(연하곤란과 연구개 변위로 비슷할 수 있음), 심한 저칼륨혈증(혈청 K &lt;2.2 mEq/L, 용혈 전에 측정).</span><span class="hang">결합한 독소는 비가역적이라 치료는 보조적이다. 다가 말 항독소는 결합 전 독소를 중화하나 비싸고 독소형을 모르면 효과가 보장되지 않는다. 천천히 진행하는 예에서 반응을 기대한다.</span><span class="hang">광유와 대량 식염 하제를 위관 투여한다. 마그네슘 제제, 프로카인 페니실린, 테트라사이클린, 아미노글리코사이드는 신경근 약화를 키워 피하고, 콜린성 약물은 거의 쓸모없다. 의심 사료와 물을 끊는다. 상처형은 결정 페니실린과 배액. 먹지 못하면 위관으로 물, 알팔파 펠릿 죽, 반추액을 준다.</span><span class="hang">독소형을 알고 위험이 계속되면 톡소이드 2주 간격 2~3회, 이후 매년. 회복우도 접종한다. 이환우 분변은 최소 8주간 조사료 밭에 쓰지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">54.</span><span>저마그네슘혈증 테타니 — 신경 증상 관점<span class="hang">악천후나 녹색 맥류·풀 위주 목초지의 비유 노령우에 많고 젖소에서는 원인 불명의 산발 발생이 있다.</span><span class="hang">급성형: 풀을 뜯다 멈추고 이상하게 경계하며 근육과 귀가 실룩인다. 심한 과민으로 계속 울고 질주하며 가끔 공격한다. 비틀거리다 사지 강직으로 쓰러져 약 1분간 간대성 경련(후궁반장, 안진, 턱 씹기, 거품 침, 귀 세움, 눈꺼풀 젖힘, 제3안검 깜박임)을 하고, 사이에 소리나 접촉으로 다시 발작한다. 심음이 멀리서도 들리고 40.0~40.5°C까지 오르며 5~60분 안에 죽을 수 있다.</span><span class="hang">아급성형은 3~4일에 걸쳐 사나운 표정, 뒷다리 강직, 개구장애를 보이고 보정이나 주사에 격렬히 경련하며 재발이 많다. 분만 직후 유열 소가 처짐 대신 과민과 강직을 보이면 저마그네슘혈증 동반이다.</span><span class="hang">혈청 마그네슘 정상 1.7~3.0 mg/dL, 1.2 미만에서 테타니 위험, 증상 평균 약 0.5 mg/dL(Rebhun은 대개 0.4 미만). 칼슘도 흔히 5~8 mg/dL. CSF 마그네슘은 테타니 소 1.25, 정상 2.0 mg/dL 이상이며 사후 12시간까지 쓸 수 있다. 소변에 마그네슘이 거의 없다.</span><span class="hang">칼슘·마그네슘 복합액(예: 25% 칼슘보로글루코네이트와 5% 차아인산마그네슘 500 mL) 정맥 후 50% 황산마그네슘 200 mL 피하. 정맥 마그네슘은 부정맥과 호흡부전을 일으킬 수 있어 이상 시 즉시 멈추고 칼슘을 준다. 이후 경구 마그네슘으로 재발을 막는다(상세는 대사 탭).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">55.</span><span>대사성 경련·신경근 증상 감별<table class="bxt"><tr><th>질병</th><th>주 대상</th><th>특징</th><th>확인</th><th>응급 처치</th></tr><tr><td>저마그네슘혈증</td><td>비유 성우, 녹색 목초</td><td>과민, 강직, 간대성 경련</td><td>혈청 Mg &lt;1.2, CSF·요 Mg</td><td>Ca·Mg 정맥 후 Mg 피하</td></tr><tr><td>저칼슘혈증</td><td>분만 직후 성우</td><td>이완 마비, 산동, 경련 드묾</td><td>혈청 Ca</td><td>칼슘 정맥</td></tr><tr><td>저혈당</td><td>어린 송아지, 패혈증·케토시스 성우</td><td>침울·허약 위주, 경련 드묾</td><td>2시간 이내 측정 혈당</td><td>50% 포도당 후 5~10% 지속</td></tr><tr><td>신경형 케토시스</td><td>분만 후 8주 이내</td><td>핥기, 물어뜯기, 공격</td><td>강한 케톤</td><td>50% 포도당 300~500 mL</td></tr><tr><td>고나트륨혈증</td><td>대용유 송아지, 물 제한 성우</td><td>설사, 탈수, 물·수액 후 발작</td><td>Na &gt;160</td><td>Na 서서히 교정</td></tr><tr><td>D-젖산 산증</td><td>7일령 넘는 포유 송아지</td><td>침울, 안검반사 소실, 실조</td><td>심한 산증, 높은 음이온차, L-젖산 정상~약간</td><td>중탄산나트륨</td></tr><tr><td>간성뇌증</td><td>PSS 송아지, 피롤리지딘 성우</td><td>오르내리는 전뇌 증상, 힘주기</td><td>암모니아</td><td>원인 관리</td></tr><tr><td>신경형 콕시듐증</td><td>혹한기 육우 송아지</td><td>경련, 과민, 설사, 실명 없음</td><td>분변 콕시듐</td><td>항콕시듐제</td></tr><tr><td>저칼륨혈증</td><td>코르티코이드 과용 소</td><td>심한 이완 마비</td><td>혈청 K &lt;2.2</td><td>KCl 0.5~1 lb 위관</td></tr></table><span class="hang">D-젖산 산증 중탄산 필요량(mEq) = 염기 결핍 × 체중(kg) × 0.6, 염기 결핍 10 mEq/L 넘으면 대개 정맥 수액이 필요하다. 7일령 미만 설사 송아지의 산증은 주로 L-젖산이다.</span><span class="hang">리도카인 과량 송아지는 발작할 수 있으며 주입 중단과 디아제팜 1회로 수 시간 안에 회복한다. 성우의 영양성 발작은 대부분 저마그네슘혈증과 저칼슘혈증의 조합이다. 대사 검사로 설명되지 않는 경련은 PEM, 납중독, 수막염, 광견병, 장독혈증을 다시 검토한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">56.</span><span>말초신경 손상 — 개요<span class="hang">젖소에서 매우 흔하며 누운 소의 근육병증, 미끄러운 바닥에서의 반복 기립 시도와 자주 동반되고 파행과 혼동되기 쉽다. 척추 손상에 의한 신경근 손상도 같은 증상을 내므로 신경 기원부터 전체 경로를 생각한다. 좌골신경은 L6, S1, S2에서 나와 비골(L6, S1)과 경골(S1, S2) 성분으로 나뉜다.</span><span class="hang">기본 치료는 급성기 덱사메타손과 NSAID, 수치료, 좋은 바닥, 기립 보조이며 누워 있던 시간에 비례해 예후가 나빠진다.</span><span class="hang">덱사메타손 10~40 mg 근육(견갑상·비골), 20~50 mg 정맥·근육 대개 1회(요골), 20~40 mg(분만마비). 플루닉신 0.5~1.1 mg/kg 24시간마다 또는 아스피린 240~480 grain 경구 하루 2회(Rebhun). 임신 등 금기를 확인한다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>앞다리 — 견갑상신경, 요골신경, 상완신경총<span class="hang">견갑상신경(C6~C7): 보정틀 충돌이나 자극성 주사 후 체중을 실을 때 어깨가 바깥으로 벌어지고 근위축으로 어깨가 튀어나온다.</span><span class="hang">요골신경: 수술대·삭제대에 눕힌 뒤 압박이나 구획증후군이 가장 흔하고 상완골 골절, 보정틀 손상도 원인이다. 삼두근 분지 위쪽 손상은 주관절을 못 펴 다리가 꺾이고 완관절·구절·발가락을 못 펴 발등을 끈다. 주관절 높이 부분 손상은 체중은 버티나 발가락을 끈다.</span><span class="hang">수술대에서 내린 뒤 마비가 5분 넘게 남으면 치료한다(소염제 2~3일). 상완골 골절 때문이면 예후가 나쁘고 심한 예는 3~6개월 걸린다. 눕힐 때 소 8인치, 수소 12인치 두께 패드를 깔고 아래쪽 앞다리를 앞으로 당겨 둔다.</span><span class="hang">상완신경총: 드물며 겨드랑이 열상, 난산 시 앞다리 과도한 견인, 심한 외전으로 생긴다. 다리를 내딛지도 버티지도 못하고 발등을 끌며 주관절이 흉골 아래로 처지고 주두 이하 통각이 넓게 소실된다. 예후는 신중하며 주두·상완골 골절과 감별한다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>뒷다리 — 대퇴신경<span class="hang">송아지: 엉덩이 걸림(hip lock)으로 강제 견인한 난산 후 한쪽 또는 양쪽에 생긴다. 고관절 과신전으로 신경이 찢어지며 L4·L5 신경근이 뜯겨 나간 예도 있다. 성우: 미끄러운 바닥에서 뒷다리를 뒤로 뻗은 채 계속 일어나려 할 때(저칼슘혈증 creeper 소), 흔히 양측성이다.</span><span class="hang">슬관절을 펴지 못해 체중을 지지하지 못하고 슬관절 이하 모든 관절이 굽는다. 장요근 덕분에 다리를 내딛을 수는 있다. 부분 마비는 대퇴사두근이 떨리고, 양측 부분 마비는 쪼그린 자세로 발등을 딛는다. 하퇴 내측(복재신경) 통각 소실은 예후 불량이며 슬개반사가 감소한다.</span><span class="hang">송아지는 10일 안에 대퇴사두근이 위축되어 슬개골이 헐거워지며(슬개골 탈구로 오진), 그러면 예후는 매우 나쁘다.</span><span class="hang">덱사메타손과 NSAID, 미끄럽지 않은 우방, 다리를 바로 놓고 반대쪽으로 굴려 줌, 온찜질, 비타민E·셀레늄, 꼬리 들기나 패드 고관절 리프터. 한쪽은 예후 보통, 성우 양측은 신중~나쁨이나 2~3주 보조로 회복하기도 한다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>뒷다리 — 좌골, 경골, 비골신경<span class="hang">좌골신경: 다리 기능에 영향을 주는 말초신경 손상 중 가장 흔하다. 둔부나 대전자와 좌골결절 사이 자극성 주사가 주원인이고 골반·대퇴골 골절, 장기 난산에 의한 L6 압박(비골 성분)도 있다. 성우는 완전·영구 마비가 드물지만 송아지는 그럴 수 있다. 완전 마비는 엉덩이와 비절이 처지고 발등과 구절로 서며 발가락을 끌고, 내측을 제외한 슬관절 이하 감각이 소실된다. 부분 마비는 구절 배측 꺾임과 약간 처진 비절이다. 둔부 부종이나 주사 흔적을 찾는다. 젖소 둔부 주사를 피하고, 구절이 꺾이면 부목을 댄다.</span><span class="hang">경골신경(S1, S2): 대퇴 뒤쪽 원위부 주사, 농양·혈종, 기립불능우의 구획증후군, 천골 골절. 구절이 배측으로 꺾이고 비절 굴곡이 늘지만 발등으로 서거나 발가락을 끌지는 않으며 보행 중 체중을 완전히 싣는다. 비복근·천지굴건 부분 파열과 감별한다.</span><span class="hang">비골신경: 유열 등 기립불능우에서 흔하다. 비복근 외측두와 비골 외측을 지나는 얕은 위치라 오래 누우면 압박되며, 슬관절 바로 아래 외측 찰과상이 위치를 보여 준다. 비절이 곧게 펴지고(과신전) 구절과 발가락이 굽어 발등으로 선다. 배측 중족부·발가락 감각이 소실될 수 있다. 깔짚을 두껍게 하고 2~4시간마다 굴려 준다. 급성 편측은 예후 보통~좋음, 누워 있거나 양측이면 고관절 탈구, 대퇴골 골절, 운동성 근병증 위험으로 신중하다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>폐쇄신경 마비(분만마비)<span class="hang">초산우나 과대 태아의 난산, 특히 엉덩이 걸림 후 흔하다. 폐쇄신경은 장골 내측에서, 제6요신경은 천골 융기 아래에서 압박된다. 양측 폐쇄신경 절제만으로는 지속적 기립불능이 생기지 않아, 분만마비는 폐쇄신경과 좌골신경 L6 성분의 동시 손상으로 본다.</span><span class="hang">폐쇄신경만 손상되면 좋은 바닥에서는 서고 체중을 지지하나 다리가 벌어지는 경향이 있다. 진성 분만마비 편측은 다리를 모으지 못하고 발등으로 서며 보조로 일어설 수 있다. 양측은 일어서지 못하고 개구리 자세로 엎드리며 최악은 뒷다리가 직각으로 벌어진다. 소는 명랑하다.</span><span class="hang">내전근 근병증(유방과 대퇴 내측 사이가 부어 차오름)이 흔히 겹치고 고관절 탈구와 대퇴골 골절 위험이 매우 높다. 직장검사로 골반 골절과 고관절 탈구를 배제한다.</span><span class="hang">즉시 덱사메타손 20~40 mg(1~2일)과 NSAID(수일 이상). 중족부에 61~76 cm 간격 족쇄를 채우고 흙·퇴비 바닥이나 울타리 친 풀밭에 둔다. 서면 착유한다. 못 서면 슬링이나 고관절 리프터를 8~12시간 간격 2~3번 시도하고 부유 탱크를 고려한다. 자주 굴려 주고 비타민E·셀레늄을 준다.</span><span class="hang">편측은 예후 보통, 기립불능 양측은 나쁨~신중, 초산우가 다산우보다 낫다. 다시 서도 착유 시설로 옮기기까지 최소 10~14일 걸린다. 예방은 엉덩이 걸림 회피와 과도한 견인 금지다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>뒷다리 말초신경 마비 자세 요약<table class="bxt"><tr><th>신경</th><th>슬관절</th><th>비절</th><th>구절·발가락</th><th>감각 소실</th></tr><tr><td>대퇴</td><td>굽음, 체중 지지 못함</td><td>굽음</td><td>굽음(쪼그림)</td><td>하퇴 내측</td></tr><tr><td>좌골(완전)</td><td>정상</td><td>처짐</td><td>발등으로 섬, 끎</td><td>내측 제외 슬관절 이하</td></tr><tr><td>경골</td><td>정상</td><td>굴곡 증가</td><td>구절 배측 꺾임, 끌지 않음</td><td>척측 중족부</td></tr><tr><td>비골</td><td>정상</td><td>과신전</td><td>발등으로 섬</td><td>배측 중족부</td></tr><tr><td>폐쇄</td><td>정상</td><td>정상</td><td>정상</td><td>없음, 다리 벌어짐</td></tr></table><span class="hang">천골·천미부 척수 손상(승가 손상, 난산)도 양측 경골 성분 마비와 꼬리·방광 마비를 일으키므로 구별한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">62.</span><span>척추·경막외 농양 — 원인과 증상<span class="hang">송아지에 많고 성우에서도 생긴다. 배꼽 감염에 의한 패혈증 송아지가 위험하며 다발성 관절염, 수막염, 포도막염, 폐렴이 함께 있을 수 있다. 성우는 폐 농양 등에서 퍼진다. T. pyogenes가 가장 흔하다. 요천추부 외상, 단미 후 클로스트리듐성 마미 신경염, 비위생적 반복 경막외 마취 후 상행성 척수염도 있다.</span><span class="hang">발열(미열이거나 없을 수 있음), 통증성 자세, 뻣뻣한 보행이 초기 증상이다. 경추면 목을 바람개비처럼 고정하고 바닥 사료를 먹지 않으려 하며, 흉요추면 등을 굽힌다. 병소를 누르면 아파한다.</span><span class="hang">척수 압박으로 부전마비, 실조, 마비가 진행한다. 흉요부는 개처럼 앉고, 경부는 사지마비, 송아지에 흔한 요천추부·천골 농양은 배뇨·배변 곤란, 꼬리 마비, 양측성 진행성 좌골신경 장애를 일으킨다. 감염 척추체가 골절되면 초급성 척수 증상이 온다. 단미 후 마미 신경염은 꼬리·항문·방광 이완에서 뒷다리 LMN 마비로 빠르게 진행하고 둔부가 크게 붓는다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>척추·경막외 농양 — 진단과 치료<span class="hang">방사선이 가장 확실하며 송아지에서 쉽다. CSF는 정상이거나 단백만 약간 높고 지주막하강으로 퍼지면 세포와 단백이 크게 오른다(5예 중 1예 이상이라는 보고와 6예 모두 이상이라는 보고가 있다). 성우는 글로불린 상승이 뒷받침하나 송아지는 아닐 수 있다. 백근병(CK, AST, 셀레늄), 외상, 종양, 골절과 감별한다.</span><span class="hang">테트라사이클린 8~11 mg/kg 하루 2회가 뼈 침투가 좋아 좋은 선택이며 최소 2~4주 쓰고 신기능을 살핀다. 페니실린, 세팔로스포린도 쓴다. 영상으로 위치를 확인한 소수 예에서 감압, 배농, 소파술이 성공했다. NSAID로 운동과 식욕을 돕는다.</span><span class="hang">예후는 나쁘며 패혈증과 다른 감염 부위가 없는 급성 예가 가장 낫다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>척추 골절<span class="hang">성우는 외상이 가장 흔하다. 승가나 미끄러짐, 칸막이 아래 몸부림(흉요추), 머리가 고정된 채 넘어짐(경추), 강직성 척추증 수소의 승가가 원인이다. 천미추는 승가, 난산, 꼬리 보정 시 과도한 힘으로, 신생 송아지 흉요추는 과도한 회전 견인으로 골절된다.</span><span class="hang">송아지·육성우 무리에서 몇 주 사이 장골이나 척추 골절이 여러 두 생기면 비타민D 결핍이나 칼슘 부족 사료(오래된 풀 건초, 수단그라스, 고인·저칼슘)에 의한 영양성 이차 부갑상선기능항진증을 생각한다.</span><span class="hang">갑자기 시작하고 진행하지 않는 것이 진행성인 농양·종양과 다르다. 경추 골절 소는 옆으로 누워 흉골와위로 몸을 세우지 못한다. 극돌기 편위, 골절 뒤쪽 통각과 피간근반사 감소, 뚜렷한 통증(식욕부진, 심박·호흡 증가)이 있다. 천미부 골절은 부종, 극심한 통증, 꼬리뿌리 함몰, 회음 감각 소실, 천골 골절은 좌골신경 장애, 방광 무력, 꼬리 마비, 직장 내 공기 유입을 보인다.</span><span class="hang">CSF는 대개 정상이고 출혈이 있으면 황색변색과 적혈구 증가. 방사선이 진단적이다.</span><span class="hang">덱사메타손 0.10 mg/kg과 보조 간호. 고용량 코르티코스테로이드는 효과가 없다고 보며 임신우나 감염 위험 소에 쓰지 않는다. 비변위 경추 골절에는 목 보조대. 예후는 신중~나쁨이고 비변위 골절의 젊은 소가 가장 낫다. 꼬리뿌리 함몰은 빨리 정형하면 결손을 줄일 수 있다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>척수 압박 — 감별할 기타 질환<span class="hang">경막외 림프종은 척수 압박 종양 중 가장 흔하고 요천미부가 많다. 명랑하고 잘 먹는 소에서 통증과 열 없이 대칭성 척수 증상이 수일~수주 진행하며 글로불린이 대개 정상이다. CSF 단백은 10예 중 5예에서 40 mg/dL를 넘었다. 코르티코스테로이드로 잠시 나아지나 며칠 안에 재발한다.</span><span class="hang">우피저 유충 구충제 투여 2~3일 안에 여러 두가 뒷다리 부전마비를 보일 수 있다. 급성 뒷다리 부전마비 소는 직장검사로 천미부 손상과 발정 직후 여부(승가 손상)를 확인한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>소뇌 형성부전(BVD)<span class="hang">가장 흔한 뇌 기형이며 대개 임신 100~200일 사이 BVDV 태내 감염이 원인이다. 염증은 감염 약 14일 뒤 최고이고 출생 전에 가라앉는다. 분화한 소뇌 실질의 위축과 외과립층 전구세포 파괴에 의한 형성부전이 겹쳐 대부분 소엽 흔적만 남는다.</span><span class="hang">일부는 서지 못하고 버둥거리며 후궁반장과 안진을 보이고, 서는 송아지는 넓은 기저 자세, 비틀거림, 과대보행, 평형 소실, 머리 의도진전을 보인다. 근력과 고유감각은 있고 마비는 없다. 망막·시신경로 침범으로 실명, 백내장, 망막 반흔, 소안구증이 있을 수 있다. 한국 자료도 BVD 태내 감염으로 소뇌 형성부전, 망막 형성부전, 맹목이 생긴다고 적는다(한우컨설팅지침서).</span><span class="hang">초유 전 항체나 바이러스 검사, 농장의 BVDV 이력이 시사하고 부검에서 작은 소뇌를 확인한다. 유전성 소뇌 기형(앵거스, 스코티시 하이랜드)과 임상적으로 구별되지 않아 부검이 중요하다. 블루텅, 아까바네, 웨셀스브론 바이러스도 원인이 된다(Bovine Medicine).</span><span class="hang">유전성 소뇌 무형성(홀스타인)은 3~8개월령에 시작해 진행한다. BVDV 90일 미만 감염은 수초형성부전으로 신생우 떨림을 일으킨다.</span><span class="hang">치료는 없고 일부는 실조에 적응한다. 백신, 차단방역, 반복 발생 개체 도태로 예방한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">67.</span><span>아까바네병 등 태내 감염의 신경 양상<span class="hang">아까바네, 블루텅 바이러스의 태내 감염(약 125일령)은 대뇌가 파괴되어 얇은 막만 남고 CSF가 채우는 수두무뇌증을 일으킨다. CSF 순환이 막히지 않아 두개 모양은 정상이다. 아이노, 츄잔 바이러스도 관련된다. 대뇌에 국한되면 걸을 수 있으나 둔하고 실명한다(Rebhun).</span><span class="hang">한국 자료는 아까바네 감염 시기에 따라 1개월 미만 태아 흡수, 2~4개월 뇌수두증(대뇌 결손), 4~6개월 관절만곡증, 6~7개월 발목 근육 위축, 8개월 이후 거의 정상으로 적는다. 뇌수두증 송아지는 살아 나와도 2~3일 안에 죽는다(한우컨설팅지침서).</span><span class="hang">츄잔병은 임신 2~4개월 감염으로 기형 없이 허약 송아지를 낳으며 일부는 간헐적 발작, 사지 굴절, 머리를 들고 선회하고 대부분 시력 장애가 있다. 신경 증상 송아지는 대뇌가 결손되어 있다.</span><span class="hang">초유 전 혈액으로 바이러스 분리와 혈청검사를 한다. 치료는 없고 매년 3~4월 모기 발생 전 생독백신으로 예방한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">68.</span><span>중이·내이염 — 원인과 증상<span class="hang">3주~6개월령 젖소 송아지에 흔하며 대부분 비인두에서 이관을 거쳐 오르는 내인성 감염이다. 현재 주원인은 Mycoplasma bovis이며 마이코플라스마 유방염 농장에 많다. P. multocida, H. somni도 분리되고 만성에서는 T. pyogenes가 가세한다. 폐렴이 흔히 함께 있다. 더러운 환경이나 귀 빨기에 의한 외인성 감염은 악취 나는 외이염을 보인다.</span><span class="hang">편측이면 병변 쪽 머리 기울임, 같은 쪽 귀 처짐, 안검반사 감소, 입술 이완. 39.4~40.6°C 미열이 있을 수 있으나 명랑하고 힘이 있으며 깡충뛰기가 정상이다. 안진 급속상은 반대쪽이다. 염증이 IX·X에 미치면 연하곤란과 침울이 온다.</span><span class="hang">양측성은 기울임이 없어 어렵다. 눈을 가리면 머리를 양쪽으로 크게 흔들고, 청각 소실, 낮은 머리, 양측 안면마비가 있으며 그냥 시름시름한 송아지로 여겨져 치료가 늦어진다. 만성은 뚜렷한 기울임, 완전 안면마비, 노출각막염, 고막 파열에 의한 외이염을 보인다.</span><span class="hang">대개 증상과 농장 이력으로 진단한다. CT는 액체가 찬 고실포와 뼈 파괴를 항상 보여 주고, 고실포 초음파는 민감도가 낮을 수 있다. CSF는 두개 내로 번지지 않으면 정상이다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>중이·내이염 — 치료<span class="hang">수막염과 뇌농양으로 번지지 않게 적극 치료한다. 테트라사이클린 11 mg/kg 정맥·근육 하루 1~2회(수화 양호 시)가 초기 선택이나 마이코플라스마 내성이 많다. 거의 모든 균주가 엔로플록사신에 감수성이고(미국은 폐렴 동반 시만 허가) 툴라트로마이신도 효과적이다. 마이코플라스마 가능성이 있으면 베타락탐은 맞지 않다. P. multocida와 T. pyogenes는 테트라사이클린, 세팔로스포린, 페니실린(22,000 U/kg 하루 2회)에 대개 감수성이다.</span><span class="hang">급성은 5~7일 안에 반응하므로 장기지속형도 1회 이상 필요할 수 있다. 플루닉신 1~2일, 안면마비 쪽 각막에 연고. 만성은 페니실린 장기 투여, 반응이 없으면 외과적 배액. 급성은 예후 좋고 만성은 보통~나쁨이다.</span><span class="hang">마이코플라스마를 배출하는 소를 제거하거나 그 젖을 송아지에게 먹이지 않으며, 폐유는 살균해 먹인다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>안면신경 손상(말초성)<span class="hang">꽉 끼는 굴레나 목줄, 수술대의 고리 굴레, 옆으로 누워 몸부림, 경유돌공 부근 농양·종양이 원인이다. 안검하수, 안검반사 소실, 같은 쪽 입술 이완이 뚜렷하고 경유돌공 부위의 깊은 손상은 귀 처짐도 일으킨다.</span><span class="hang">스탠천 마비: 놀란 소가 스탠천에서 빠지려다 안와 뒤 관골궁에 걸려 갇히면 양측 이개안검신경이 다쳐 양측 안검하수, 눈물, 안검반사 소실, 때로 귀 처짐이 생긴다. 관골궁 부종과 턱관절 통증으로 약간 덜 먹는다. 전정 증상이 없고 보행과 근력이 정상이며 먹을 수 있어 양측 중이염이나 뇌간 질환과 구별된다.</span><span class="hang">냉찜질 후 온찜질, 국소·전신 소염제, 신경이 돌아올 때까지 하루 3~4회 각막 연고. 금기가 없으면 덱사메타손 20~30 mg 근육 1회가 회복을 앞당길 수 있으나 먼저 각막 궤양을 확인한다. 외상은 예후가 좋고 종양은 나쁘다.</span></span></p></div>
</div>
`;
}
function med_mskHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 근골격</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>파행 — 개요와 분류<span class="hang">파행은 국소 통증으로 한 다리에 체중을 온전히 싣지 못하는 보행 이상이다. 협조 장애인 운동실조, 근육 병변이나 저칼슘혈증·저칼륨혈증 같은 대사 이상으로 자세를 유지하지 못하는 쇠약과 구별한다.</span><span class="hang">근골격 질환은 퇴행성(근병증·골이영양증·관절병증)과 염증성(근염·골수염·관절염)으로 나눈다. 임상적으로는 상부 다리 파행(외상, 발굽검사기 통증 없음), 발굽 각질 병변(백선병·제저궤양), 감염성 피부 질환(부제병·지피염)으로 나눈다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>역학<span class="hang">젖소 파행의 90%가 발굽이고 그중 90%가 뒷다리 외측 발톱이다. 비육장 소는 약 70%가 발굽, 번식 육우는 대부분 상부 다리 문제다.</span><span class="hang">젖소에서 다리 질환은 분만 무렵~비유 50일, 발굽 질환은 비유 50~150일에 가장 많다. 연간 발생률은 대개 15~30%이고, 농가 추정 유병률(평균 5.7%)은 실측(22.1%)보다 크게 낮았다.</span><span class="hang">집단 파행 요인은 바닥에 의한 손상, 늘 젖은 비위생적 바닥, 수송·취급 중 밀집, 영양 결함, 나쁜 골격 형태, 정기 삭제 미실시다.</span><span class="hang">병변 대부분은 치료 없이 낫지 않는다. 초산우에서 치료 지연과 부적절한 치료가 중증 파행의 가장 큰 위험요인이었고, 조기 치료 시 장기 치유율이 크게 높다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">3.</span><span>파행 검사 — 보행 관찰과 이동성 점수<span class="hang">단단한 바닥에서 걷게 하고 보폭 단축, 걸을 때 등 굽음, 머리 끄덕임, 부하 거부를 본다. 정기 평가는 최소 연 4회, 파행우 선별 목적이면 최소 2주 간격이다.</span><table class="bxt"><tr><th>점수</th><th>서 있을 때 등</th><th>걸을 때 등</th><th>보행</th></tr><tr><td>1 정상</td><td>평평</td><td>평평</td><td>정상</td></tr><tr><td>2 경도</td><td>평평</td><td>굽음</td><td>정상</td></tr><tr><td>3 중등도</td><td>굽음</td><td>굽음</td><td>보폭 단축</td></tr><tr><td>4 파행</td><td>굽음</td><td>굽음</td><td>한 다리를 아끼나 부하는 함</td></tr><tr><td>5 중증</td><td>굽음</td><td>굽음</td><td>부하 거부</td></tr></table><span class="hang">변형 Sprecher 5점법에서 3점 이상이 파행이다. 건물섭취량은 3·4·5점에서 3·7·16%, 유량은 5·17·36% 준다. 개입 기준은 3+4+5점 10% 초과, 4+5점 5% 초과다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>근접 검사<span class="hang">각 다리의 근육·뼈·관절·발굽을 촉진하고 수동 굴곡·신전으로 골절·탈구·통증을 본다. 발굽검사기로 바닥 전체를 누르되 외축 백선(백선병)과 굴근돌기 부위(제저궤양)를 특히 살핀다.</span><span class="hang">지간 피부, 뒤꿈치 피부, 제관을 본다. 심부 감염은 반대쪽 발보다 심한 종창이 핵심이며, 부제병은 대칭성, 제저궤양·백선병 합병증은 한 발톱에 국한된 비대칭 종창이다.</span><span class="hang">발굽인지 상부 다리인지 애매하면 정맥 국소마취 후 보행이 좋아지는지 본다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>영상·활액·혈청 검사<span class="hang">방사선은 뼈·관절과 연부조직 종창 평가에 쓴다. 임신진단용 5.0~7.5MHz 선형 탐촉자로 근육·건·관절을 볼 수 있다. 관절 삼출은 패혈성 관절염의 가장 이른 소견이고, 정상 활액은 무에코, 흐리면 대개 고름이다. 초음파는 관절천자 전에 한다.</span><span class="hang">크레아틴키나아제(CK)와 아스파르테이트아미노전이효소(AST)는 민감한 근손상 지표이며 CK는 특이적이다. 혈청 칼슘·인·알칼리성 포스파타아제는 골이영양증에 둔감하다. 골이영양증·근병증은 대개 영양성이므로 사료 분석을 포함한 영양 이력을 받는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">6.</span><span>발굽 해부와 생체역학 — 각질<span class="hang">벽 각질은 각질관 밀도가 가장 높아 단단하고, 바닥은 관이 적어 유연하며, 뒤꿈치는 가장 부드럽다. 엽판 말단에서 만들어지는 유일한 비관상 각질인 캡 각질이 바닥과 벽을 붙이며 이것이 백선이다. 백선은 가장 약하고 제엽염 영향을 특히 받는다.</span><span class="hang">각질은 젖을수록 부드러워진다. 건조하면 바닥이 벗겨져 얇게 유지되지만 분뇨로 늘 젖은 소는 바닥이 벗겨지지 않아 닳거나 깎아야 한다. 벽은 월 약 6mm 자라며 마모는 바닥과 보행 거리에 따라 크게 다르다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>제3지골 지지와 외측 발톱<span class="hang">제3지골은 엽판(말보다 접촉 면적이 작다), 뒤쪽 현수 인대, 심지굴건 장력, 바닥 진피와 뼈 사이 지방 쿠션(뒤꿈치에서 가장 두껍다)으로 지지된다. 체형점수가 높으면 쿠션이 두껍고 제저궤양 위험이 낮다.</span><span class="hang">뒷다리는 유방 무게까지 받고 몸통과 뼈로 직결되어 충격 흡수가 어려우며 분뇨에 더 노출된다. 외측 발톱은 내측보다 약 10% 빨리 자라고 8% 더 닳으며 태아 때부터 커서 하중을 더 받아 계속 과성장한다. 앞다리는 내측 발톱이 하중을 더 받는다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>제엽염성 병변의 기전<span class="hang">혈관 장애로 진피가 붓고 저산소가 되면 인장강도가 떨어져 제3지골이 각질 캡슐 안에서 과도하게 움직인다. 내려앉은 제3지골이 바닥 진피를 누르면 가벼우면 바닥 출혈, 심하면 괴사해 제저궤양이 된다(사육 소는 굴근돌기, 방목 소는 제3지골 원위부 아래).</span><span class="hang">엽판에 대한 비정상 움직임은 혈관 파열로 백선 출혈, 혈종, 농양을 만들고, 거친 바닥의 급회전은 백선 병변을 늘린다.</span><span class="hang">이 손상은 체중 부하가 있어야 생기며 가만히 서 있는 것이 걷는 것보다 나쁘다. 누워 있을 때는 거의 생기지 않으므로 횡와 시간 확보가 곧 예방이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">9.</span><span>발굽 손질 — 기능적 삭제(네덜란드 5단계법)<table class="bxt"><tr><th>단계</th><th>내용</th></tr><tr><td>1</td><td>발끝 길이를 맞추고(뒷발 내측, 앞발 외측 발톱부터) 발끝 두께를 5~7mm로 줄이며 뒤꿈치는 아낀다.</td></tr><tr><td>2</td><td>내외측 발톱 부하를 맞추되 무리하지 않는다.</td></tr><tr><td>3</td><td>바닥 중앙을 오목하게 파서 지간 배수를 돕고 하중을 벽으로 옮긴다.</td></tr><tr><td>4</td><td>통증 병변이 있으면 건전 발톱에 블록을 붙이거나 병든 발톱 뒤쪽 2/3를 낮춘다.</td></tr><tr><td>5</td><td>들뜬 각질, 각질 능선, 뒤꿈치 미란 균열을 제거한다.</td></tr></table><span class="hang">발끝은 벽이 단단해지는 제관 부근에서 등쪽 벽을 따라 75mm로 자르고 750kg 초과 시 75kg마다 3mm 늘리며 발끝 두께 5mm를 남긴다(Rebhun). 홀스타인 22~24개월 7cm, 성우 7.5~8cm라는 기준도 있다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>삭제 시기와 치료 일반 원칙<span class="hang">흔한 점검 시점은 첫 분만 4~8주 전, 첫 분만 후 60~80일(경산우 80~180일), 건유 2주 전~4주 후다. 과성장이 없고 파행이 적으면 삭제가 오히려 해로울 수 있고, 과삭제가 흔한 실수다.</span><span class="hang">통증 제거가 먼저다. 들뜬 각질은 제거하고 노출 진피 주변 각질을 얇게 한다. 붕대는 치유를 촉진하지 않으며 며칠 안에 떼고, 탄력 붕대를 방치해 허혈 괴사가 생긴 예가 있다.</span><span class="hang">발굽 블록은 일상적으로 쓰며 30일 안에 떼거나 재점검한다. 심한 각질 질환과 발가락 수술 후 비스테로이드소염제(NSAID: 플루닉신·케토프로펜·멜록시캄)를 더 쓰도록 권한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>제엽염(laminitis) — 원인과 역학<span class="hang">발굽 엽판의 급성 변성으로 원인은 불명이다. 올리고프럭토스 17g/kg 경구로 미경산우에 유발되며 30시간 뒤 증상, 3~5일에 최고조다.</span><span class="hang">고능력 젖소와 비육장 소에서 집단 발생하며 고능력 농장 유병률이 78%까지 보고된다. 젖소는 미경산우에 가장 많고 50% 이상이 분만 전후 30일 안에 생긴다. 무리 합류 시 괴롭힘, 거친 바닥, 분뇨 속 기립, 습한 발효 사일리지, 자궁염·후산정체 뒤에도 생긴다.</span><span class="hang">과산증으로 생긴 히스타민이 발굽 모세혈관 확장과 혈액 농축으로 울혈·부종을 일으키며 여름철 뜨거운 운동장에서 더 는다(한우컨설팅지침서).</span><span class="hang">진피 손상에서 발굽 변화까지 2개월 이상 걸릴 수 있다(Blackwell). 단일 가시 병변이 아닌 병리 과정이라 국제 표준 병변 목록에 없고 소에서 실제로 흔한지 불확실하다는 견해도 있다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>임상증상<span class="hang">4~6개월 송아지와 미경산우의 급성형은 오래 눕고 일어날 때 무릎 꿇은 채 머문다. 네 발을 모으고 등을 굽혀 서며 체중을 자주 옮기고 발을 누르면 아파한다. 나중에 발굽이 납작·넓어져 슬리퍼 모양이 되고 제3지골이 회전한다.</span><span class="hang">성우는 제저궤양, 각질 연화, 밀랍 같은 황색 변색, 적갈색 출혈 반점 같은 국소 병변과 만성 파행이 흔하다. 어린 수소는 경직 보행과 구절 굴곡으로 오진하기 쉽다.</span><span class="hang">만성형은 앞벽-바닥 각도가 55°에서 35°로 줄고 앞벽이 오목해지며 수평 성장정지선이 생긴다. 외측 발톱 이중 바닥, 넓어지고 갈라진 백선이 보이며, 방사선상 제3지골 발끝 희박화와 골증식체가 있다.</span><span class="hang">발굽-피부 경계부와 발바닥이 충혈·부종되고 네 발에 동시에 오므로 서 있기를 싫어한다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>진단·치료<span class="hang">특징적 임상병리 소견은 없다. 백근병, 골단염, 부제병, 제저궤양, 백선 농양, 제3지골 골절과 감별한다.</span><table class="bxt"><tr><th>약물</th><th class="c">용량</th></tr><tr><td>아스피린(aspirin)</td><td class="c">20mg/kg 경구 12시간마다</td></tr><tr><td>페닐부타존(phenylbutazone)</td><td class="c">4.4mg/kg 경구 48시간마다</td></tr><tr><td>플루닉신메글루민(flunixin)</td><td class="c">1.0mg/kg 정맥 12시간마다; 1.1~2.2mg/kg 1일 1회(Blackwell)</td></tr><tr><td>멜록시캄(meloxicam)</td><td class="c">0.5mg/kg 경구 1일 1회(Blackwell)</td></tr></table><span class="hang">자궁염·과산증 같은 유발 원인을 치료하고, 기능적 삭제와 병변 처치 후 건전 발톱에 블록을 붙인다. 대개 1주에 호전, 3주에 정상 보행이 된다. 제3지골 위치 변화나 기저막 반흔이 남으면 재발이 잦다.</span><span class="hang">메티오닌 10g/일 1주, 아연·비오틴, 온수욕(Bovine Medicine), 냉수에 발 담그기, 항히스타민제·항생제, 항생 연고·강옥도 도포(한우컨설팅지침서)도 기술된다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>예방<span class="hang">비육장 입식 소는 곡류에 서서히 적응시키고, 송아지는 14개월령 전에 곡류를 집중 급여하지 않는다. 비오틴 20mg/두/일은 초산우 발굽 건강을 개선하고, 아연메티오닌과 비오틴은 관련 병변을 줄인다.</span><span class="hang">편한 칸막이와 깔짚, 분만 전후 운동, 하루 10시간 이상 누울 수 있는 밀도, 통로 고무매트가 도움이 된다. 분만 4주 전~4주 후 급격한 사료 변경을 피하고 중탄산나트륨 1%를 넣으라는 권고도 있다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">15.</span><span>제저궤양(sole ulcer) — 부위와 기전<span class="hang">뒷다리 외측 발톱과 앞다리 내측 발톱에 많고 대칭으로도 생긴다. 전형 부위는 굴근돌기 위 진피(발끝에서 뒤로 약 2/3, 축측)다. 발끝 궤양은 과삭제·과마모로 생기며 남반구 방목 젖소에서는 가장 흔하다.</span><span class="hang">내려앉은 제3지골의 굴근돌기와 바닥 사이에서 진피가 눌려 먼저 바닥 출혈이 생기고, 압박 괴사로 각질 생성이 멈춰 안에서 밖으로 자라는 결손이 된다. 만성 지간 피부염으로 축측 뒤꿈치 각질이 과생성되는 자리가 바로 궤양 호발 부위다.</span><span class="hang">체형점수 낮은 소, 높은 스톨 턱, 긴 착유 대기, 자동 스크레이퍼, 마모성·결함 바닥이 위험하다.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>임상증상과 진단<span class="hang">낮은 등급 파행으로 시작해 점점 심해진다. 발굽검사기로 통증 부위를 찾아 깎으면 오래된 출혈 각질, 이어 육아조직이 솟은 전층 결손이 나온다. 바닥이 앞·외축으로 들뜨는 경우가 많다.</span><span class="hang">바닥 천공, 백선병, 바닥 타박, 급성 제엽염, 이물, 골절과 감별한다. 괴사가 진피를 넘은 합병성 궤양은 주상골 활액낭, 심지굴건, 원위지간관절을 위협한다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>치료와 예후<span class="hang">내외측 부하를 맞추고 들뜬 바닥을 진피를 다치지 않게 걷어낸 뒤, 그 발톱 뒤꿈치를 반대쪽보다 깊게 낮추고 건전 발톱에 블록을 붙인다.</span><span class="hang">건전 발톱 뒤꿈치가 충분히 높으면 병든 발톱 뒤쪽 절반을 얇은 바닥층만 남기고 걷어내는 '뒤꿈치 없는' 삭제(Manabe법)로 블록 없이 처치할 수 있다. 서 있을 때 병변과 바닥 사이에 손가락이 들어가야 한다.</span><span class="hang">붕대는 권하지 않고, 단순 궤양에 항생제는 필요 없다. 약 4주 뒤 재검하며 전층 궤양 치유에 약 2개월(4~6주라는 기술도 있다) 걸리고 다음 비유기 재발이 흔하다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>발끝 궤양과 발끝 괴사<span class="hang">얇아진 발끝이 돌에 눌려 혈종이 생기면 무혈성 괴사가 되고, 열리면 제3지골 끝 골수염이나 병적 골절이 된다.</span><span class="hang">블록과 세척만으로는 만성 감염이 남으므로 건전 발톱에 블록을 붙이고 산과 철선이나 니퍼로 건강 조직이 나올 때까지 발끝을 잘라낸다. 꽉 조인 붕대로 지혈해 며칠 뒤 떼며 전신 항생제는 필요 없다. 약 1개월이면 각질이 덮이고 예후는 매우 좋다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>백선병(white line disease) — 원인<span class="hang">바닥과 벽 각질 사이가 벌어져 감염이 들어가는 병이다. 성우는 뒷다리 외측 발톱 백선 뒤쪽 1/3, 앞다리는 내측 발톱 뒤쪽 1/4이 호발 부위다. 초산우는 앞다리 내측 병변(도주 동작), 경산우는 뒷발 병변(밀치고 나가는 동작)이 많다.</span><span class="hang">분만 스트레스, 제엽염, 긴 보행, 개 사용, 불량한 통로, 급회전이 소인이다. 이물이 진피에 닿으면 농양이 되고 압력 때문에 극심하게 아프며, 농양은 제관으로 올라가 터지거나 바닥 밑 뒤쪽으로 퍼져 뒤꿈치로 나온다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>임상증상과 진단<span class="hang">대개 급성의 심한 파행이다. 뒤꿈치 쪽 병변은 그 발톱 뒤꿈치를 손가락으로 눌러, 발끝 근처는 발굽검사기로 찾는다. 얇게 깎으면 백선 일부가 검게 변해 있고, 분변이 박혔으면 청소해야 보인다.</span><span class="hang">바닥 천공, 바닥 타박, 제저궤양, 제엽염, 제관 열창, 제3지골 골절과 감별한다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>치료와 예후<span class="hang">벽 각질을 깎아 진피까지 따라가 배농하면 즉시 통증이 준다. 탐침으로 범위를 확인해 들뜬 각질을 모두 걷어내고 들쭉날쭉한 가장자리를 남기지 않는다. 큰 농양과 발끝 농양은 건전 발톱에 블록을 붙이고 약 4주 뒤 뗀다. 붕대는 권하지 않으며 단순 농양은 4~6주에 낫는다.</span><span class="hang">단순 농양에 항생제는 필요 없고 심부로 퍼졌을 때만 쓴다(Blackwell). 항생제를 고려하라는 기술도 있다(Bovine Medicine).</span><table class="bxt"><tr><th>병변</th><th class="c">발생률(100두/년, 영국 보고들)</th></tr><tr><td>제저궤양</td><td class="c">6.2~15</td></tr><tr><td>백선병</td><td class="c">3.8~12.7</td></tr><tr><td>지피염</td><td class="c">2.8~12.0</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>기타 발굽 병변 — 과마모와 벽 이상<span class="hang">긴 보행이나 마모성 모래 깔짚으로 마모가 성장을 넘으면 바닥 밑 타박과 백선 진피 노출로 심하게 아프다. 개체는 블록을 붙이고, 집단이면 대기장과 통로에 고무를 깐다. 새 콘크리트가 너무 거칠면 입식 전에 블록을 끌어 다듬는다.</span><span class="hang">골무형 벽 분리(thimbling)는 제관 진피 손상으로 벽 각질관이 단절된 것으로 단절선이 약 5cm 내려와야 드러나며, 발끝을 짧게, 발끝 바닥을 얇게 해 주면 합병증 없이 낫는다.</span><span class="hang">수직 벽 열창은 방목 육우에 많다. 이물·육아조직을 제거하고 아크릴로 벽을 고정해 건전 발톱에 블록을 붙인다. 축측 벽 열창은 테트라사이클린 가루 위 꽉 조인 붕대를 1주 간격으로 반복한다.</span><span class="hang">유전성 나선 발톱(corkscrew claw)은 3세 이후 드러나며 진피가 겉에 가까우므로 발끝을 약 1cm 두께로 남기고 외축벽 과성장을 걷어낸다.</span><span class="hang">바닥 틈에 끼어 각질 캡슐이 빠졌어도 진피 손상이 적으면 응급 처치(세척·붕대, 건전 발톱 블록, 전신 항생제 7~10일)로 캡슐이 다시 자란다.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>제3지골 골절<span class="hang">건조한 발굽, 바닥 틈 외상, 승가 후 착지, 불소 중독이 소인이다. 급성 중증 비부하 파행, 열감, 굴곡·타진 통증이 있고 종창은 없다. 양쪽 앞다리 내측 골절이면 앞다리를 교차해 서거나 무릎을 꿇는다.</span><span class="hang">발굽 병변이 없을 때 가장 중요한 감별은 급성 제엽염이며 두 방향 이상 방사선으로 확진한다. 건전 발톱 블록과 우방 안정으로 4~8주(Rebhun) 또는 2~3개월(Bovine Medicine)에 낫는다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>송아지 발굽 궤양<span class="hang">축축한 분변이 쌓인 불량 바닥에서 제관 부위 연부조직이 약해지고 세균 감염으로 궤양이 생기며, 방치하면 발굽이 빠지고 사료 섭취가 급감한다(한우송아지질병관리핸드북).</span><span class="hang">양호한 바닥으로 격리해 병변을 수술적으로 제거하고 매일 소독, 항생제·소염제, 거즈 보호, 반추위 미생물제를 주며 2주 이상 치료한다. 바닥을 자주 청소·소독하고 깔짚을 자주 간다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">25.</span><span>발가락 심부 패혈증<span class="hang">방치된 부제병, 합병성 제저궤양, 관절 뒤로 퍼진 백선 농양, 천공창이 심부 구조의 괴사·감염을 일으키며 블록이나 진통제로 낫지 않는 심한 통증이 공통이다. 탐침이나 14~16G 바늘로 관절·건초를 확인한다.</span><span class="hang">처음 인지할 때 안락사, 도태, 수술 중 하나를 정해야 하며 전신 항생제만 주고 기다리는 것은 비인도적이다. 원위지간관절이 패혈성이면 제관 뒤쪽 1/3 외축이 아프게 붓고 관절낭이 제관 위로 부푼다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>발가락 수술<span class="hang">중족·중수에 지혈대를 감고 에피네프린 없는 리도카인 20~30mL를 나비 카테터로 아무 정맥에나 넣으면 두 발가락이 마취된다. 블록은 마른 발굽에 수술 전 붙인다.</span><span class="hang">단지 절단은 근위지간관절이나 바로 위에서 산과 철선으로 제1지골 원위단을 자른다. 절단면에 괴사가 남으면 결과가 나쁘다. 붕대는 약 1주 뒤 갈고 전신 항생제는 대개 5일이다. 심지굴건을 따라 퍼졌으면 부제 위 절개로 건을 절제하고 배액관을 2주 둔다.</span><span class="hang">원위지간관절 패혈증은 제저궤양 부위에서 7~12mm 드릴로 제관 등쪽까지 관통해 배액하고 블록, 항생제 5일, 배액 2주로 유도 강직시킨다. 1개월이면 블록 없이 걷고, 12례 성공률 100%였다(Constable).</span><span class="hang">단지 절단 후 젖소 기대 수명은 1년 미만이라는 연구가 있다(Blackwell). 3일 간격 관절 내 세프티오푸르 주사를 선호하는 이도 있다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">27.</span><span>지간 플레그몬(부제병, foot rot) — 원인과 역학<span class="hang">괴간균(Fusobacterium necrophorum) 생물형 A와 AB가 주원인이며 백혈구독소를 만든다. Porphyromonas levii, Prevotella가 상승작용하고, Bacteroides melaninogenicus와 둘 다 있어야 발병한다는 기술도 있다(Rebhun). 지간 피부 손상이나 지속적 습윤이 침입을 허용한다.</span><span class="hang">젖소 파행의 5~15%이며 대개 산발성이나 한 무리의 25%가 동시에 걸리기도 한다. 감염 발굽 분비물, 오염 족욕조, 외부 소 도입이 감염원이다.</span><span class="hang">습하고 더운 계절, 젖은 바닥, 돌밭, 날카로운 자갈, 거친 그루터기가 위험하고 강우 4~8주 뒤 늘며, 성우 특히 비유 첫 달에 가장 많다. 인도소(Bos indicus)가 더 저항성이고 유전율은 0.14다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>임상증상과 진단<span class="hang">대개 한 다리에 갑자기 심한 파행이 오고 39~40℃ 열, 일시적 유량 감소가 따르며 수소는 일시적으로 불임이 된다. 제관이 대칭으로 붓고 발톱이 벌어지며, 지간열 위쪽에 가장자리가 부푼 균열과 괴사물, 특유의 악취가 있다.</span><span class="hang">외부 병변 없이 파행과 제관 종창만 있는 '맹목 부제'는 전신 치료에 잘 듣는다. 초급성으로 깊게 괴사하고 통상 치료에 반응하지 않는 '초부제(super foul)'도 있으며, 지피염이 악화 요인이라는 기술이 있다(Bovine Medicine).</span><span class="hang">치료가 늦으면 건초·관절낭·뼈로 퍼져 다리를 들고 다니고 종창이 위로 올라가며 수술 배액이 필요하다.</span><span class="hang">패혈성 관절염, 골수염, 뒤꿈치 심부 패혈증, 백선병은 한 발톱의 비대칭 종창이다. 구제역도 감별한다. 반응이 없으면 진단을 다시 보며, 제저궤양이었다면 항생제를 바꿔도 소용없다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>치료<table class="bxt"><tr><th>약물</th><th class="c">용량</th></tr><tr><td>옥시테트라사이클린 지속형</td><td class="c">20mg/kg 근육·피하 1회</td></tr><tr><td>옥시테트라사이클린</td><td class="c">10mg/kg 정맥 매일; 6.6mg/kg 근육 매일 3일</td></tr><tr><td>세프티오푸르 결정 현탁 지속형</td><td class="c">6.6mg/kg 1회</td></tr><tr><td>세프티오푸르 나트륨</td><td class="c">1.1~2.2mg/kg 근육 매일 3일</td></tr><tr><td>툴라스로마이신</td><td class="c">2.5mg/kg 피하 1회</td></tr><tr><td>플로르페니콜</td><td class="c">40mg/kg 피하 1회; 20mg/kg 근육 48시간 뒤 반복</td></tr><tr><td>프로카인페니실린G</td><td class="c">22,000IU/kg 근육 1일 1~2회, 최소 3일</td></tr><tr><td>설파디미딘나트륨</td><td class="c">150~200mg/kg 정맥</td></tr></table><span class="hang">24시간 안에 치료하면 2~4일에 낫고 지연하면 10일 이상 늦어진다. 72시간 안에 호전이 없으면 다른 계열로 바꾼다. 다제내성 균주는 표지 용량 타일로신에 반응했다(Rebhun).</span><span class="hang">발을 씻어 괴사 조직을 긁어내고 5% 황산구리 습포 등을 대어 붕대할 수 있다(Constable). 반면 공기가 닿도록 붕대를 말리고(Rebhun), 국소 항생제는 소용없으니 붕대하지 말라는 기술도 있다(Blackwell). NSAID를 보조로 쓴다.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>예방<span class="hang">진흙·돌밭을 메우고 통로와 깔짚을 건조하게 한다. 비오틴은 백선 병변은 줄이나 부제병에는 효과가 없다.</span><span class="hang">5~10% 포르말린 또는 황산구리 족욕을 하루 2번 지나가게 하면 젖소 농장에서 거의 없앨 수 있고, 100~300두 통과마다 갈아준다(Blackwell). 비육장에서는 클로르테트라사이클린 500mg/두/일 28일 후 75mg/일, 유기 요오드 EDDI 200~400mg/일을 쓴다. 황산아연 사료 첨가는 효과가 없다.</span><span class="hang">괴간균 백신은 실험 감염에 약 60% 방어를 보였으나 대조 시험 근거가 부족하다. 효과가 그다지 좋지 않다는 기술도 있다(한우컨설팅지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>지간 피부염·뒤꿈치 각질 미란<span class="hang">Dichelobacter nodosus에 의한 지간 피부의 만성 표재성 감염으로 습한 환경의 사육우 대부분에 병변이 있기도 하다('축사 부제'). 이 균의 단백분해효소가 발굽 케라틴을 녹이며, 지피염 정착을 돕는다.</span><span class="hang">뒤꿈치 융기 피부-각질 경계에 피지성 삼출, 지독한 냄새, 촉통이 있으나 종창과 전신 반응은 없고 여러 발이 걸린다. 만성 자극으로 지간 섬유종이나 축측 각질 과생성이 생기고, 뒤꿈치 각질이 불규칙하게 침식되거나 가로 균열이 생긴다.</span><span class="hang">대개 심하게 절지 않지만 뒤꿈치를 도랑이나 스톨 턱 끝에 걸치고 서며 양쪽 대칭이다.</span><span class="hang">교정 삭제로 과잉 각질을 걷어내고 지간을 열어 공기가 통하게 한다. 요오드·구리·아연 국소 소독제가 효과적이며 부제병용 전신 치료에는 잘 반응하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>사마귀형 피부염(verrucose dermatitis)<span class="hang">진흙 많은 과밀 비육장에서 뒤꿈치 융기부터 구절까지 발바닥 쪽에 생기는 증식성 피부염으로 네 발 모두 아프다. 도말에 괴간균이 많다. 소독 비누로 씻고 5% 황산구리를 매일 바르거나 족욕을 매일 지나가게 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">33.</span><span>지피염(digital dermatitis) — 원인과 역학<span class="hang">1974년 이탈리아에서 Mortellaro병으로 처음 기술되었다. 혐기성 나선균 트레포네마(Treponema)가 일차 역할을 하는 것으로 보며 17개 이상 계통형이 확인되었고, 분변·슬러리·반추위에서도 같은 균이 나와 장관이 저장소로 여겨진다.</span><span class="hang">주로 젖소 질환이다. 캘리포니아 농장의 25~75%가 경험했고 감염 농장에서 몇 달 사이 최대 75%가 걸리기도 한다. 초산우가 가장 위험하고 산차가 늘수록 준다.</span><span class="hang">개방 사육, 깔판 바닥, 습하고 비위생적 환경, 진흙 운동장(약 20배), 미경산우 구입(4.7배; 외부 구입 8배라는 조사도 있다), 삭제사와 도구 미소독이 위험요인이다. 깔짚 운동장은 깔판보다 3.2배 덜 걸린다.</span><span class="hang">뒷발이 슬러리에 더 잠겨 뒷발에 많다. 지간 피부염과 뒤꿈치 미란이 소인이고, 상재 농장에는 잘 낫지 않는 백선병과 제저궤양이 더 많다. 파행은 305일 유량을 평균 360kg 줄이고 공태를 늘린다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>임상증상<span class="hang">병변 크기에 비해 통증과 파행이 심하다. 아픈 다리를 반쯤 굽혀 떨면서 들거나 발끝으로 서서 걸어 발끝이 닳는다.</span><span class="hang">뒷발 뒤꿈치 융기 사이 지간 바로 위 피부가 전형 부위이고 부제 위로는 생기지 않는다. 대부분 2~4cm 원형~타원형 융기 병변이다.</span><span class="hang">초기에는 경계가 뚜렷한 붉은 과립상(딸기 모양) 병변으로 매우 아프고 쉽게 피가 나며 주변 털이 길고 곤두서며 하얀 과각화 테두리가 있다. 진행하면 10~15mm 길이의 검은 사마귀형 돌기(hairy wart)가 된다. 피부에 국한되나 뒤꿈치부터 바닥이 들뜰 수 있다.</span><table class="bxt"><tr><th>M 단계</th><th>소견</th></tr><tr><td>M0</td><td>정상 피부</td></tr><tr><td>M1</td><td>0.5~2cm 작은 병변, 대개 통증 없음</td></tr><tr><td>M2</td><td>2cm 초과 미란성 충혈 병변, 촉통</td></tr><tr><td>M3</td><td>M2의 치유 단계, 딱지, 통증 적음</td></tr><tr><td>M4</td><td>과각화 병변, 대개 통증 없음</td></tr></table><span class="hang">M0→M1→M2→M3→M4로 진행한다고 보며 M2가 감염력이 가장 높아 빨리 찾아 치료하는 것이 중요하다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>진단<span class="hang">임상 소견으로 충분하다. 착유실에서 호스로 발을 씻고 손전등으로 보는 선별법의 민감도 0.72, 특이도 0.99다. 물줄기에 발을 들지 않으면 0, 2초 안에 내리면 1, 2초 넘게 들면 2점이다.</span><span class="hang">지간 피부염은 회색 비후와 얕은 궤양으로 덜 아프고, 뒤꿈치 미란은 깊은 검은 균열이다. 부제병은 지간의 깊은 종창과 악취 균열이 있다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>치료<span class="hang">표준은 지속형 옥시테트라사이클린(200mg/mL 오일 기제) 10mL를 솜이나 거즈에 적셔 대고 붕대하는 것(1회 2g)이며 우유 잔류가 검출되지 않는다. 붕대 없는 대안으로 프로필렌글리콜 175mL, 식초 175mL, 테트라사이클린염산염 150g 반죽을 붓으로 바른다.</span><span class="hang">옥시테트라사이클린 25mg/mL(20% 글리세린) 1일 1회 5일 분무도 쓰며 병변에 직접 닿아야 한다. 10% 옥시테트라사이클린 주사액 5~15mL를 솜에 적셔 얇게 감으면 2~5일에 통증이 사라지므로 붕대를 최소화한다(Rebhun).</span><span class="hang">비항생 대안으로 구리·과산화물·양이온제 복합 제제, 살리실산 붕대가 있다. 약 전에 소독 비누로 병변을 씻어야 하며 실패는 대개 세척 부족 때문이다. 72시간 뒤에도 절면 다른 원인을 찾는다.</span><span class="hang">프로카인페니실린 18,000U/kg 근육 1일 2회 3일, 세프티오푸르나트륨 2mg/kg 근육 3일도 효과적이었으나 휴약·비용이 문제이고 재발률 18%였다.</span><span class="hang">재발률은 7~12개월 뒤 40~52%이며 일부 트레포네마가 낭포형으로 바뀌어 치료에 저항한다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>족욕과 관리<span class="hang">5% 황산구리를 주 4회 착유 때 쓴 연구에서 병변은 나았으나 신규 감염률은 변하지 않았다. 산성화 이온화 황산구리가 4% 포르말린보다 신규 발생을 잘 막았다. EU는 5% 황산구리를 허용하지 않는다.</span><span class="hang">족욕조는 길이 3.0~3.7m, 폭 0.5~0.6m, 깊이 최소 10cm가 적정하다. 항생제 족욕은 잔류·내성 문제로 권하지 않으며 분뇨에 빨리 중화된다.</span><span class="hang">건조한 바닥과 깔짚, 밀도 완화, 삭제 도구 소독이 기본이고, 청정 농장은 대체우 외부 구입을 피하는 것이 가장 중요하다. 백신 효과는 입증되지 않았다.</span></span></p></div>
