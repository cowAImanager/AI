"><tr><th>구분</th><th>패혈성(창상성)</th><th>심장 림프육종</th><th>특발성 출혈성</th></tr><tr><td>발열</td><td>대개 있음</td><td>대개 없음</td><td>없거나 경미</td></tr><tr><td>섬유소원·글로불린</td><td>증가</td><td>대개 정상</td><td>정상</td></tr><tr><td>초음파</td><td>불균질, 가스 음영</td><td>무에코, 우심방 종괴·벽 비후</td><td>무에코, 깊이 5~25 cm, 심외막 해초 모양 조직</td></tr><tr><td>심낭액</td><td>호중구, 세균</td><td>림프모구</td><td>혈성, PCV 10~15%, 소림프구 위주</td></tr></table><span class="hang">심내막염은 대개 자궁·유방 등의 화농 과정이 있고 이상음이 마찰음이 아닌 잡음이다. 폐성심, 심근병증, 선천성 기형과도 감별한다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>창상성 심낭염 — 치료와 예후<span class="hang">항생제와 배액만으로는 거의 완치되지 않는다. 늑골 분할 개흉과 심낭절제 9두 중 5두 회복 보고와, Cornell의 개흉 7두 중 1두 생존 보고가 있다. 수술은 심한 부종과 심부전 전에 일찍 한다. 급성기에 이물이 아직 제2위에 있으면 제1위절개와 살균성 항생제로 충분할 때가 있다.</span><span class="hang">심낭천자와 배액은 분만 같은 단기 목표까지 수명을 연장한다. 도태 전 심낭천자로 진단을 확인할 가치가 있다(특발성 출혈성은 예후가 훨씬 좋음).</span><span class="hang">번식 연령 미경산우와 2세 전 수소에게 자석을 일상 투여해 예방한다.</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>그 밖의 심낭질환<span class="hang">패혈증 송아지나 심한 세균성 기관지폐렴(Mannheimia haemolytica 등)에서 섬유소성 심낭염이 생기지만 심부전까지 가는 일은 드물다.</span><span class="hang">특발성 출혈성 심낭삼출: 북미 젖소에서 늘어 Wisconsin 대학에서 가장 흔한 심장질환이 되었다. 2세 미만에서는 보지 못했고 125예의 중앙 연령 47개월, 비유일수 262일이었다. 경정맥 확장, 하악간·앞가슴 부종, 24~72시간의 식욕·유량 급감이 있고 열은 없거나 낮으며 심음 감약이 늘 들리지는 않는다. 심외막의 혈관성 섬유탄성 조직이 출혈원으로 생각되고, 상당수가 수개월~3년 이상 뒤 심외막형 림프육종으로 진행한다. 거의 모두 BLV 양성이다.</span><span class="hang">치료: 심낭 배액과 덱사메타손 0.1 mg/kg 3일이 가장 좋은 장기 성적을 냈다. 임신우는 이소플루프레돈을 표시 용량으로 쓴다. 스테로이드만으로도 수개월~1년 생존한다. 배액 시 세프티오퍼나 암피실린을 병용한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">20.</span><span>세균성 심내막염 — 원인과 역학<span class="hang">성우의 가장 흔한 판막 질환이며 치료 가능한 몇 안 되는 심장병이다. Trueperella pyogenes가 가장 흔하고 연쇄상구균, 포도상구균, 그람음성균도 있다. Helcococcus ovis가 유럽 연구에서 병변의 최대 1/3에서 나왔고 대개 T. pyogenes와 혼합감염이었다.</span><span class="hang">지속 균혈증이 핵심이다. 패혈성 근골격 질환, 창상성 위염, 농양, 제1위염(유산성 소화불량), 만성 폐렴, 자궁염, 유방염, 혈전정맥염, 장기 유치 카테터가 위험요인이다.</span><span class="hang">병력: 반복 발열, 체중감소, 일시적이고 극적인 유량 저하의 반복, 낮은 체형점수, 다른 원인 없는 이동성 파행.</span><span class="hang">판막: 삼첨판 49.5%, 승모판 29.7%, 폐동맥판 13.7%, 대동맥판 7.5%(Buczinski 2012 고찰). 98% 이상이 판막 병변이다. 감염성 색전이 폐(속립성 농양), 심근, 신장, 관절에 병변을 만든다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>세균성 심내막염 — 임상증상<span class="hang">지속·간헐적 발열, 빈맥, 수축기 잡음이 가장 흔하다. 460예 메타분석 민감도: 혈액배양 양성 87%, 심초음파 병변 84%, 지속 빈맥 80%, 잡음 60%, 발열 46%, 파행 44%, 심부전 37%.</span><span class="hang">잡음은 특히 우측 병변에서 없을 수 있어 지속 빈맥을 가장 일관된 소견으로 본다. 두근거리는 심음이 흔하고, 심장 부위 압박 통증이 있을 수 있다. 부정맥은 약 10%에서 발작성이다. 경직과 이동성 파행, 관절 압통이 있다. 진행하면 정맥 확장·박동과 호흡곤란이 온다.</span><span class="hang">폐렴이나 창상성 제2위복막염으로 오진되기 쉽다. 경과는 수주~수개월이며 급사도 한다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>세균성 심내막염 — 진단<span class="hang">검사: 비재생성 빈혈, 호중구증가(31예 중 24예), 고섬유소원혈증, 고글로불린혈증(23예 중 19예가 5.0 g/dL 초과)이 흔하며 고감마글로불린혈증이 가장 일관된 소견이다. 만성 반흔 예는 혈액 소견이 정상일 수 있다.</span><span class="hang">혈액배양: 가능하면 24~48시간 항생제를 끊는다. 경정맥을 깎고 70% 알코올 후 1% 포비돈요오드를 2분 이상 둔다. 혈액:배지 1:10~1:20. 1시간 동안 다른 부위에서 3회(Constable), 발열우는 30분 간격 3회, 무열우는 몇 시간 간격(Rebhun) 채혈한다. 성우의 최대 50%가 음성이다. H. ovis는 혈액한천에 S. aureus를 교차 도말해야 자라며 판막 배양은 최소 3일 한다.</span><span class="hang">확진은 심초음파다. 불규칙하게 두꺼워진 불균질하고 덥수룩한 판막, 대개 1 cm 이상 두께를 보인다. 민감도는 부위에 따라 75~100%다.</span><span class="hang">감별: 심낭·흉막 마찰음, 단락성 기형, 심낭염, 고산병, 심장 림프육종.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>세균성 심내막염 — 치료와 예후<table class="bxt"><tr><th>약물</th><th>용량·기간</th></tr><tr><td>페니실린</td><td>22,000~33,000 U/kg 1일 2회, 최소 3주</td></tr><tr><td>암피실린</td><td>10~20 mg/kg 1일 2회, 최소 3주</td></tr><tr><td>리팜핀(병용)</td><td>5 mg/kg 경구 1일 2회, 단독 사용 금지</td></tr><tr><td>푸로세미드</td><td>0.5 mg/kg 1일 1~2회 필요 시</td></tr><tr><td>아스피린</td><td>240~480 grain 경구 1일 2회</td></tr><tr><td>케토프로펜</td><td>3 mg/kg IM</td></tr></table><span class="hang">배양이 안 되면 페니실린(±겐타마이신)이나 강화 설폰아마이드(Constable). 그람음성균·내성균은 감수성에 따라 살균성 약물로 바꾼다. 모두 허가 외 용량이다.</span><span class="hang">리팜핀은 미국에서 투여우를 식용으로 쓸 수 없다. 식욕이 나쁜 소에서 푸로세미드 과용은 K, Ca 소실과 탈수를 부른다. 아스피린은 소에서 혈소판 응집을 막지 못하고, 케토프로펜은 트롬복산 A2를 줄인다. 염분을 제한한다.</span><span class="hang">한 젖소에서 4개월 연속 후 14개월까지 간헐 치료한 기록이 있다. 재발이 흔하다. 잡음은 남을 수 있으며 감염이 해소되고 심부전이 없으면 문제 되지 않는다. Cornell 31두 중 9두가 장기 항생제에 반응했다. 조기 진단이 중요하다. 심부전이 있으면 치사율이 높지만 경중등도 심부전이 곧 절망적이지는 않다(Rebhun). 심한 파행이 있으면 예후가 나쁘다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">24.</span><span>심근질환·심근염 — 원인<span class="hang">세균: 신생 패혈증, Histophilus somni, T. pyogenes 만성 감염, Clostridium chauvoei, 심낭·심내막염 파급. 바이러스: 구제역. 기생충: Sarcocystis(흔하나 대개 무증상), 낭미충, 신생 송아지의 Neospora.</span><span class="hang">영양: 비타민 E·셀레늄 결핍, 만성 구리 결핍(falling disease). 독성: 이오노포어(모넨신, 라살로시드, 살리노마이신, 가금분의 마두라미신), 고시폴, 유독식물·주목, 아픈 송아지의 독시사이클린 과량. 종양: 지방병성 백혈병. 색전: 심내막염.</span><span class="hang">유전: 홀스타인 계통 확장성 심근병증, 곱슬 털 헤리퍼드와 흑모화우(Japanese Black) 송아지의 선천성 심근병증, 당원축적병.</span><span class="hang">심근 병변은 안정 시 증상이 거의 없다가 운동·흥분 때 치명적 전도장애를 일으킬 수 있어, 안정 시 부정맥이 뚜렷하면 흥분을 피한다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>심근염 — 진단과 치료<span class="hang">심한 유방염, 자궁염, 폐렴, H. somni, 지간 농양 같은 감염 중 지속 빈맥이나 부정맥이 생기면 의심한다. 심전도로 조기탈분극을 확인하고 전해질·산염기로 대사성 심방세동을 배제한다. cTnI 상승이 도움 된다. 심초음파는 국소 병변엔 약하나 심근병증, 림프육종, 심근 농양에는 쓸모 있다.</span><span class="hang">치료는 원발병 치료다. 작은 병변은 섬유화되고 큰 병변은 심부전, 지속 부정맥, 돌연사를 일으킨다. 급성 대량 출혈 후 허혈성 심근 손상도 드물게 있다. 독성 심근염은 특이 치료 없이 독소 제거, 하제·흡착제, 비타민 E·셀레늄을 쓰지만 심부전 증상이 있으면 예후가 매우 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>백근병 심근형과 이오노포어 중독<span class="hang">백근병 심근 병변은 3개월 미만 송아지에 많다. 부정맥, 지속 빈맥(120회/분 초과), 잡음, 운동불내성, 호흡곤란, 심부전, 급사가 있고 보정만으로도 급사할 수 있다. 혈중 셀레늄, 요 미오글로빈, CK·AST로 진단하며 셀레늄 투여 뒤에도 글루타티온 과산화효소로 결핍을 확인한다.</span><span class="hang">치료: 비타민 E·셀레늄을 제조사 용량으로 IM 또는 SC(정맥은 아나필락시스 위험), 72시간 간격 총 3~4회. 폐부종이면 푸로세미드 0.5~1.0 mg/kg 1일 1~2회. 좁은 우리에 둔다. 진단 후 3일 생존하면 예후가 좋다.</span><span class="hang">이오노포어 중독은 주로 사료 배합 오류다. 소는 말보다 내성이 크나 어린 송아지는 안전역이 좁다. 치료 용량 25~50배 실험에서 48~120시간에 단축률·박출률이 떨어졌다. 부검에서 심근병증, 폐부종, 간·심장 비대, 심낭수, 흉수, 복수가 보인다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>유전성 확장성 심근병증<span class="hang">홀스타인-프리지안과 플렉비·레드 홀스타인의 상염색체 열성병이며 적색 인자를 가진 한 홀스타인 종모우로 거슬러 올라간다. 19~78개월에 발병하고 대부분 4세 안에 나타난다. 복측 부종, 운동불내성, 호흡곤란, 빈맥, 심음 감약, 경정맥·유정맥 확장과 박동, 간비대가 있다.</span><span class="hang">심초음파로 확진하며 장기 예후는 절망적이다. 단기적으로 디곡신 0.86 µg/kg/시간 지속주입 또는 3.4 µg/kg IV 4시간마다(변동과 독성 위험 더 큼), 폐부종 시 푸로세미드 0.5~1.0 mg/kg 1일 2회, 식욕 없는 소는 KCl 50~100 g 경구를 쓰고 전해질을 매일~격일 확인한다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>심장 림프육종<span class="hang">성우에서 흔한 표적이며 우심방이 가장 흔하고 심근, 심낭, 심외막 어디든 생긴다. 부정맥(흔히 심방세동), 잡음, 정맥 확장·박동, 심음 감약이 있고 열은 대개 없다. 2세 이상 소가 대사·소화기·독성 원인 없이 빈맥성 부정맥을 보이면 고려한다.</span><span class="hang">심초음파에서 심낭삼출, 우심방벽 종괴·비후가 보인다(벽측 심내막염과 감별). 흉수와 심낭수가 모두 있으면 심낭천자 세포검사가 종양세포를 찾을 가능성이 더 높다. BLV 양성 단독은 진단이 아니다.</span><span class="hang">대부분 수주~수개월에 죽는다. 간헐적 심낭 배액으로 최대 6개월 연장하거나 말기 임신우에서 심낭을 흉강으로 열어 송아지를 받은 예가 있으나, 태아 발육부전과 BLV 수직감염 위험이 있다. 신경섬유종도 부정맥과 척수 마비를 일으키며 부검으로 확진한다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>송아지 고칼륨혈증과 부정맥<span class="hang">주로 장독소성 대장균 설사의 대사성 산증 신생 송아지에서, 그 밖에 미만성 백근병, 요복막, 신부전에서 생긴다. 7.0 mEq/L를 넘으면 심정지 위험이 있다. 심전도는 T파 첨예화, P파 편평·소실, PR 연장, QRS 확대 순으로 변하고 심방정지(서맥, P파 없음)를 거쳐 심실세동, 심정지로 간다.</span><span class="hang">2주 미만, 급성 설사, 기립불능, 탈수에 상태에 비해 낮은 심박이면 의심한다(저혈당과 감별). 150~300 mEq NaHCO3/L를 넣은 5% 포도당 1~3 L를 정맥 투여하고, 위기 후 칼륨 함유 전해질액으로 바꾼다. 인슐린은 필요 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">30.</span><span>선천성 심기형 — 빈도와 일반 소견<span class="hang">소 심장의 약 0.2%에서 발견되며 대부분 산발적이고 일부는 유전이 관여한다. 신생 송아지 36두 부검에서 심실중격결손 14%, 이소성 심장 13%, 우심실 형성부전 13%, 좌심실 형성부전 13%, 대동맥 우측변위 10%, 판막 혈종 9%, 동맥관개존 6%, 난원공개존 6%였다. 전체적으로 심실중격결손이 가장 흔하다.</span><span class="hang">대부분 출생 시 정상으로 보이다가 호흡곤란이나 발육부진으로 발견된다. 반복 치료받은 기침·호흡곤란·발열은 폐부종이나 이에 겹친 세균성 폐렴이다. 대개 한 두만 걸려 집단 폐렴과 구별되고, 빈맥과 잡음이 단서다. 송아지는 성우만큼 복측 부종이 뚜렷하지 않다.</span><span class="hang">호흡기 증상이 없어도 6개월쯤 무리보다 작아진다. 첫 임신 같은 부하에서 2~3세에 처음 증상이 나올 수도 있다. 우좌단락은 청색증과 호흡곤란이 뚜렷하고 감염이 없으면 열이 없다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>심실중격결손(VSD)<span class="hang">거의 항상 대동맥판 바로 아래 막성부에 생기며 좌우단락으로 좌심에 용적부하를 준다. 건지·홀스타인에서 소안구증, 꼬리 결손과 연관된다.</span><span class="hang">양쪽 흉벽에서 크고 넓게 들리는 전수축기 취명음이 특징이며 좌 제4늑간과 우 제3늑간에서 가장 크고 오른쪽이 더 크다. 대개 양쪽에서 진전이 만져진다. 다만 큰 결손은 잡음이 없을 수 있다(Bovine Medicine).</span><span class="hang">큰 결손은 출생 직후~수개월에 무기력, 발육부진, 운동 시 호흡곤란을 보인다. 작으면 성숙 후 심부전이 오거나 평생 문제없을 수 있으나 대부분 2세 전에 죽거나 도태된다. 폐혈관저항이 올라 단락이 역전되면 청색증이 생긴다(아이젠멩거 증후군, 1~3세에 갑작스런 청색증과 운동불내성). 결손 부근 난류로 삼첨판 중격첨판에 심내막염이 잘 생긴다.</span><span class="hang">우측 LVOT 단면에서 대동맥판 바로 아래 결손을 확인한다. 교정법이 없다. 작은 결손도 청진 소견이 요란하므로 심기능부전이 없으면 번식우 예후를 성급히 판정하지 않는다. 비육용은 조기 출하한다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>그 밖의 선천성 기형<span class="hang">팔로4징: 심실중격결손, 폐동맥 협착, 대동맥 기승, 우심실 비대. 포유 같은 가벼운 운동에도 호흡곤란과 청색증, 좌 제3~4늑간 잡음, 이차 적혈구증가증이 있고 예후가 매우 나쁘다.</span><span class="hang">동맥관개존: 송아지는 출생 후 수분 안에 닫히며 단독은 드물다. 연속성 기계음과 큰 맥압이 특징이다.</span><span class="hang">난원공개존·심방중격결손: 비교적 흔하고 단독으로는 대개 무증상이다.</span><span class="hang">이소성 심장: 소에서 가장 흔하며 대개 하경부 피하에서 박동한다. 흉골 결손을 통한 변위는 며칠을 넘기지 못한다.</span><span class="hang">우대동맥궁 잔존: 식도가 눌려 포유 후 젖을 입·코로 역류하고 첫 늑골 뒤에서 위관 저항이 있다. 바륨 조영으로 확진하고 교정은 수술이다.</span><span class="hang">대혈관 전위, 양대혈관 우심실 기시, 총동맥간, 대동맥 축착, 심내막 섬유탄성증도 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">33.</span><span>고산병(브리스킷병) — 원인과 역학<span class="hang">고지대 폐포 저산소가 폐혈관 수축과 폐고혈압을 일으켜 폐성심, 우심부전으로 진행한다. Bos taurus는 저산소에 대한 폐동맥압 반응이 특히 크다. 심근변성, 빈혈, 폐질환, 저단백혈증이 악화요인이다.</span><span class="hang">해발 1500 m 이상 소가 소인이 있고 2200 m 이상에서 연간 0.5~2%가 발생하며 1600 m에서도 생긴다. Blackwell은 2000 m 초과를 기준으로 하고 농장별 유병률이 5%까지 이른다고 한다. 송아지, 1세우, 말기 임신우, 새로 도입된 소에 많고, 토착우는 1%를 넘지 않는다. 저지대로 옮기지 않으면 치사율이 높다.</span><span class="hang">로코초(Oxytropis, Astragalus) 섭취는 발생을 크게 늘려 100%에 가까워질 수 있다. 추위, 폐렴, 고탄수화물 사료도 촉진한다.</span><span class="hang">앵거스에서 EPAS1 기능획득 변이(HIF2α 안정화)가 관련되며 두 변이를 모두 가지면 위험이 가장 크다. 저지대 앵거스의 41%가 변이를 가졌다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>고산병 — 임상증상과 진단<span class="hang">침울, 빠른 체중감소, 거친 털, 팔꿈치를 벌린 자세, 경정맥 확장 뒤 앞가슴 부종이 목을 따라 하악간까지 번진다. 복수와 설사, 안정 시 과호흡, 가벼운 운동에도 호흡곤란, 운동 후 청색증이 있다. 빈맥, 심장 확대, 수축기 잡음이 흔하고 경정맥 위에서 권총 소리(pistol shot)가 들린다. 식욕은 말기까지 정상이고 폐렴이 없으면 열이 없다.</span><span class="hang">폐동맥압은 정상 22~26 mmHg에서 고지대에서 감수성에 따라 37~55 mmHg로 오른다. 실험에서 1100 m에서 3000 m로 옮기자 27 → 45 → 100 mmHg 초과까지 올랐다. 혈액학·혈액가스로 대신할 수 없다. 평균 폐동맥압(mPAP) 49 mmHg 이상은 어떤 고도에서도 고위험이며 검사는 고도가 높을수록 민감하다.</span><span class="hang">부검: 우심실 자유벽/(우심실 자유벽+좌심실 자유벽+심실중격) 무게비가 정상 0.25, 브리스킷병 0.30 초과, 말기 0.40~0.50이다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>고산병 — 치료와 예방<span class="hang">유일한 효과적 치료는 저지대로 옮기는 것이며 그때까지 운동·흥분·장거리 이동을 피한다. 산소, 푸로세미드(±디곡신), 흉강천자, 비타민 B 복합제가 쓰이나 경제성이 낮다.</span><span class="hang">고지대 폐동맥압 검사로 압력이 낮은 종모우·번식우를 선발한다. Blackwell은 mPAP 42 mmHg 미만 종모우를 권한다. 로코초 섭취 방지, 증상우 방목 제한과 고단백 손급여, 폐질환 신속 치료를 권한다. 저항성 선발은 저지대 증체 저하와 연관된다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>폐성심(고산병 외)<span class="hang">젖소에서는 드물고 대부분 만성 폐렴, 기관지확장증, 폐농양, 굳은 전복측 폐엽, 만성 폐충증, 드물게 미만성 간질성 폐섬유증이나 폐혈전색전증에서 생긴다. 저지대 송아지 집단 발생에서 피롤리지딘 알칼로이드(monocrotaline)가 의심되었다.</span><span class="hang">호흡곤란, 빈맥, 복측 부종, 정맥 확장·박동으로 심근병증, 심내막염, 림프육종, 심낭염과 감별한다. 심음은 정상~증강이다. 폐를 집중 평가한다(초음파, 방사선, 기관세척, 폐충 의심 시 Baermann법). 로코초 중독은 림프구 세포질 공포가 보일 수 있다. 심초음파에서 우심실 비대와 대동맥만큼 굵은 폐동맥이 보인다.</span><span class="hang">원발 폐질환 치료와 푸로세미드 0.5~1.0 mg/kg 1일 2회. 디곡신(0.86 µg/kg/시간)은 입원이 필요해 거의 쓰지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">37.</span><span>부정맥 — 원인 개요<span class="hang">동성서맥·동성부정맥은 절식 소, 고칼슘혈증 성우, 저혈당·고칼륨혈증 송아지에서 생긴다. 동성빈맥은 흥분, 통증, 저칼슘혈증, 내독소혈증, 쇼크에서 온다. 근골격 통증 소는 누워 있으면 정상이다가 일으키면 빈맥이 된다.</span><span class="hang">정맥 칼슘제가 소 부정맥의 가장 큰 약물 원인이다. 프로필렌글리콜 기제 옥시테트라사이클린은 저혈압과 심정지를 일으킬 수 있어 천천히, 식염수나 포도당에 희석해 준다. 정맥 항생제, 칼륨이 많은 수액, 네오스티그민도 부정맥을 일으킨다.</span><span class="hang">그 밖에 심근 림프육종(우심방, 흔히 심방세동), 패혈성·독성 심근염, 송아지의 고칼륨혈증·저혈당·백근병이 있다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>심방세동 — 원인과 임상<span class="hang">성우 젖소에서 가장 흔한 부정맥이며 대부분 원발 심장병 없는 기능성이다. 소화기·복통성·대사성 질환(장염, 좌방전위, 자궁염전 등)에 동반되고 저칼슘·저칼륨혈증, 대사성 알칼리증, 미주신경 긴장 변화, 네오스티그민 투여가 촉발한다. 겉보기 건강한 착유우의 18개월 유병률은 2.5%였다. 1세 미만은 극히 드물다.</span><span class="hang">불규칙적으로 불규칙한 리듬, 심음 강도의 심한 변동, 정상~증가한 심박(88~140회/분)이 특징이다. 빠르면(특히 120회 초과) 맥결손이 있고 S4와 경정맥 a파가 없다. 심부전 증상은 진행예가 아니면 없다.</span><span class="hang">심전도: P파가 없고 300~600회/분의 f파, 정상 QRS와 불규칙한 RR 간격.</span><span class="hang">심방조기수축(APC)은 소화기 질환 소에서 심방세동만큼 흔할 수 있고 저칼슘·저칼륨혈증과 관련된다. 조기 P파(P′)와 정상 QRS, 청진상 산발적 불규칙과 S1 강도 변화를 보이며 심방세동 전후에 나타난다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>심방세동 — 치료<span class="hang">대부분 원발병 교정과 산염기·전해질 교정으로 동율동이 된다. 경구·피하 칼슘과 KCl 50~100 g 경구 1일 2회 3~5일이 좋은 보조 치료다(Rebhun).</span><span class="hang">기다리는 기간은 원발병 교정과 건강 회복 후 최소 1주(Constable), 호전 중인 소는 최소 14일(Rebhun)이다.</span><table class="bxt"><tr><th>상황</th><th>처방</th></tr><tr><td>원발병 해소 후 지속(Rebhun)</td><td>퀴니딘 48 mg/kg을 식염수나 젖산링거 4 L에 타서 1 L/시간 IV</td></tr><tr><td>Constable 보고</td><td>황산퀴니딘 49 mg/kg을 0.20 mg/kg/분 IV, 9두 중 7두 전환</td></tr><tr><td>심한 빈맥 또는 퀴니딘 무반응</td><td>디곡신 0.86 µg/kg/시간 또는 11.0 µg/kg 1일 3회 IV 4~5일 후 퀴니딘</td></tr><tr><td>디곡신 부하 방식</td><td>22.0 µg/kg 1회 후 0.86 µg/kg/시간 2~4일, 이어 퀴니딘</td></tr></table><span class="hang">경구 퀴니딘은 반추동물에서 효과가 없다. 부작용은 침울, 운동실조, 안검경련, 설사, 제1위 운동 증가, 빈맥이며, 다른 부정맥, QRS 연장, 허탈은 독성 징후다. 뚜렷한 빈맥이 오면 주입을 늦추거나 멈추고 중탄산나트륨을 줄 수 있다.</span><span class="hang">원발병 해소 후 30일 넘게 지속되면 예후는 신중하다. 오래 지속되면 심방 확장과 방실판 역류, 심근병증 변화로 갈 수 있다. 심장 림프육종의 심방세동에 심부전이 있으면 수주~수개월을 넘기기 어렵다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">40.</span><span>경정맥 혈전정맥염 — 원인<span class="hang">대부분 의원성이다. 외상성 정맥천자와 자극성 약물의 혈관 주위 누출이 주원인이며 포도당과 포도당 함유 칼슘제가 가장 문제다. 테트라사이클린, 페닐부타존, 요오드화나트륨, 고장성 칼슘제, 7.2% 고장 식염수도 원인이다.</span><span class="hang">보정 불량, 미숙한 천자, 부적절한 바늘이 위험을 키운다. 일회용 14 G 바늘(3.75 cm)은 성우에게 너무 짧고 날카로워 내막을 찢는다. 장기 유치 카테터도 위험하며 폴리우레탄·항균 코팅 카테터가 덜 혈전성이다. 정맥염은 삽입 24~72시간 뒤 나타난다.</span><span class="hang">탈수·내독소혈증 소는 천자 직후 젤리 같은 응혈이 생기고 반복 천자로 혈전이 번진다. 반복 정맥 항생제를 맞은 비육우에서 흔하며 혈전색전성 호흡기 질환으로 이어진다.</span><span class="hang">유정맥 천자는 긴급 시나 양쪽 경정맥이 막힌 경우가 아니면 금기이며 같은 쪽 유방에 지속 부종을 남긴다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>혈전정맥염 — 증상과 진단<span class="hang">단순 혈전: 정맥 안에 응혈이 만져지고, 아래를 막아도 피의 파동이 없다. 하류 부종(경정맥이면 얼굴)이 생길 수 있고 통증은 가볍다.</span><span class="hang">혈전정맥염: 정맥 주위 부종, 열감, 통증이 뚜렷하고 패혈성이면 발열·식욕부진이 더 흔하다. 목을 움직이기를 꺼리고 일부는 같은 쪽 호너 증후군을 보인다. 자극성 약물은 탈락, 봉와직염, 무균 농양을 만든다. 꼬리정맥 염증은 꼬리 탈락을 일으킨다.</span><span class="hang">패혈성 혈전정맥염은 세균성 심내막염의 주요 위험요인이므로 항상 심장을 청진한다.</span><span class="hang">초음파: 확장되고 눌리지 않는 정맥, 벽 비후, 내강 에코성 혈전. 혈전 내 공동은 패혈성을 시사한다. 초음파 변화는 임상증상보다 24시간 먼저 나타난다. 카테터 끝을 배양한다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>혈전정맥염 — 치료와 예후<span class="hang">단순 혈전은 추가 손상만 피한다. 자극성 약물이 새면 주위 피하에 생리식염수를 주사해 희석하고 하루 여러 번 온찜질한다.</span><span class="hang">무균 혈전정맥염: 온찜질, 아스피린 240~480 grain 경구 1일 2회, 국소 50% DMSO(Constable).</span><span class="hang">패혈성: 온찜질, 아스피린, 프로카인 페니실린 20,000~30,000 U/kg IM 또는 SC 1일 2회(T. pyogenes 겨냥). 카테터는 즉시 뽑는다. 수주간 치료하며 일찍 끊으면 재발한다. 만성예는 정맥 절제가 도움 될 수 있다. 이후 정맥 처치를 피하고 꼭 필요하면 철저히 무균 조작한다.</span><span class="hang">단순 혈전은 예후가 양호하고 일부 재개통된다. 혈전정맥염은 대부분 재개통되지 않고 하류 부종이 오래간다.</span><span class="hang">유정맥 열상: 심박 120회 초과, 호흡수 60회 초과, 극심한 창백이면 신선 전혈 최소 4 L를 수혈한 뒤 봉합·결찰하고 페니실린이나 세프티오퍼를 5~7일 준다. 급성 실혈 직후 PCV는 정상일 수 있어 판단에 쓰지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">43.</span><span>빈혈 — 분류와 재생성 판정<span class="hang">실혈성, 용혈성, 생성 감소로 나누고 다시 재생성(실혈·용혈)과 비재생성(생성 감소)으로 나눈다. 건강한 착유우의 PCV는 다른 종보다 낮다. 소에서 Hb(g/dL) = 0.3 × PCV(%) + 3이다.</span><span class="hang">재생 소견: MCV 증가, MCHC 감소, 대소부동, 다염성, 망상적혈구, 호염기성 반점, 하웰-졸리 소체, 심한 빈혈의 유핵적혈구. 건강한 소는 말초에 미성숙 적혈구가 거의 없다. 재생 반응은 2~4일 뒤 보이고 4일 안에 없으면 비재생성으로 본다(Bovine Medicine). 골수 반응은 3일부터, 약 9일에 정점이다(Constable).</span><span class="hang">수시간 이상 지난 출혈은 PCV와 혈장단백이 함께, 용혈은 PCV만 떨어진다. 탈수는 빈혈을 가린다. 급성 대량 실혈은 12~24시간 동안 PCV가 떨어지지 않으므로 심박, 호흡수, 기립·보행, 점막 창백으로 판단한다.</span><table class="bxt"><tr><th>항목</th><th>실혈(만성)</th><th>용혈</th><th>만성염증</th><th>철 결핍</th><th>골수 저형성</th></tr><tr><td>혈장단백</td><td>저하</td><td>정상</td><td>정상~증가</td><td>정상</td><td>정상</td></tr><tr><td>망상적혈구</td><td>있음</td><td>있음</td><td>드묾</td><td>드묾</td><td>없음</td></tr><tr><td>MCV</td><td>증가</td><td>증가</td><td>정상~저하</td><td>저하</td><td>정상</td></tr><tr><td>혈청 철</td><td>정상(장기 시 저하)</td><td>정상~증가</td><td>저하</td><td>저하</td><td>정상~증가</td></tr><tr><td>페리틴</td><td>낮음~정상</td><td>정상~증가</td><td>정상~증가</td><td>낮음</td><td>정상~증가</td></tr></table></span></p><p class="bx-num"><span class="bxn">44.</span><span>빈혈 — 임상증상과 보조검사<span class="hang">점막 창백, 빈맥, 큰 맥, 심음 증강, 혈액성 잡음이 있고 말기에는 심한 빈맥, 약한 심음과 맥박으로 바뀐다. 심한 빈혈은 심실성 부정맥을 일으킨다. 호흡은 빨라지기보다 깊어진다. 비보상 징후는 불안, 반추 정지, 장폐색, 복통, 무뇨, 공격성이다. 천천히 생긴 빈혈은 같은 PCV에서 증상이 훨씬 적다. 체온 1°C 상승마다 산소 요구가 12% 늘어 열이 보상을 깨뜨릴 수 있다. 용혈은 대부분 황달을 동반한다.</span><span class="hang">대변 기생충·잠혈(직장검사 직후 채취 금지), 오줌 색소뇨 감별, 응고검사, 혈액 기생충, 혈청·독성 검사를 한다. 골수는 흉골(제2~3흉골분절)에서 채취하며 M:E비가 낮으면 재생, 높으면 골수로나 순적혈구무형성이다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>실혈성 빈혈의 원인<span class="hang">출혈성 제4위 궤양(흑색변; 건유우·수소·미경산우의 만성 제4위변위에 동반되기도), 제4위 림프육종, 림프육종 비장 파열, 후대정맥 혈전증(객혈·비출혈), 이·진드기, 내부기생충, 이유~1세의 Eimeria bovis, 신우신염, 2형 BVDV 혈소판감소증, 지혈 이상, 자궁동맥 파열(난산, 자궁탈), 질 출혈, 겨울설사의 대장 출혈, 직장으로 황체를 짜내는 시술, 방광 종양(지방병성 혈뇨).</span><span class="hang">급사성 대량 출혈은 외부 출혈(유정맥 열상, 후대정맥 혈전증의 입·코 출혈, 제4위 출혈), 내부 출혈(황체 압출, 비장 파열, 자궁·장간막 혈관 파열(구리 결핍 고려, 장간막 파열은 농장 풍토병일 수 있음), 질동맥 파열, 흑색변 없는 초급성 제4위 출혈), 스위트클로버 건초 같은 응고장애를 생각한다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>비재생성 빈혈의 원인<span class="hang">만성 감염과 종양이 가장 흔하다(화농성 폐렴, 신우신염, 다발성 농양, 심내막염). 간의 헵시딘이 철을 대식세포에 격리하고 흡수를 막는다. 혈청 철, 총철결합능, 트랜스페린이 감소하며 PCV는 대개 18% 아래로 가지 않는다(Rebhun).</span><span class="hang">철 결핍: 우유만 먹는 송아지에서 소세포·저색소성으로 생기고 혈청 철이 매우 낮다. PCV 14% 미만에서 심한 허약이 오며 수혈이 대개 치료가 된다. 대용유 철 20 mg/kg은 경한 빈혈을 일으켰고 50 mg/kg은 그렇지 않았다.</span><span class="hang">만성 신질환(에리트로포이에틴 감소), 단백소실성 신병, 림프육종(골수로 포함), 고사리, 드물게 만성 BVDV, 코발트·구리 결핍, 기아도 원인이다. 만성 빈혈 소는 PCV 9~10%에서도 위기 없이 지낼 수 있다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>용혈성 빈혈 — 혈관내와 혈관외<span class="hang">혈관내 용혈은 혈색소혈증과 혈색소뇨를, 혈관외 용혈은 대개 더 뚜렷한 황달을 일으킨다.</span><span class="hang">혈관내: 바베시아병, 렙토스피라병(Pomona, 송아지), 세균성 혈색소뇨증, 산후 혈색소뇨증, 물중독·저장성 수액, 십자화과(유채, 케일, 순무)·양파의 하인츠소체 빈혈, 만성 구리 중독(반추 전 송아지가 매우 민감), 셀레늄 결핍, 일부 타일레리아, 장기지속형 옥시테트라사이클린, 수혈 반응.</span><span class="hang">혈관외: 아나플라즈마병(혈색소뇨 없음), Mycoplasma wenyonii(드물게 면역매개성 빈혈), 유전성 적혈구생성 포르피린증.</span><span class="hang">물중독: 간헐적으로 물을 먹던 송아지가 한꺼번에 많이 마셔 생긴다. 성우에게 멸균 증류수 20 L 같은 저장성 수액도 마찬가지다. 발열, 떨림, 털 세움, 혈색소뇨가 네 징후다. 냉수 용혈은 마신 지 1시간 안에 시작한다.</span><span class="hang">신생 송아지 동종면역 용혈은 소 혈액 유래 아나플라즈마·바베시아 백신을 맞은 어미의 초유로만 생긴다. 소의 자가면역성 용혈은 드물다.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>적색뇨의 감별<table class="bxt"><tr><th>질병</th><th>역학</th><th>핵심 소견</th></tr><tr><td>바베시아병</td><td>진드기 지역·성수기</td><td>고열, 황달, 혈색소뇨, 도말 원충</td></tr><tr><td>아나플라즈마병</td><td>1세 이상, 흡혈곤충·의원성</td><td>황달·발열, 혈색소뇨 없음</td></tr><tr><td>타일레리아병</td><td>진드기(Haemaphysalis 등)</td><td>발열, 림프절 비대, 빈혈, 일부 혈색소뇨</td></tr><tr><td>산후 혈색소뇨증</td><td>분만 2~4주 고능력 경산우</td><td>무열~경미, 혈청 무기인 1.5 mg/dL 미만</td></tr><tr><td>세균성 혈색소뇨증</td><td>여름 관개·습지 방목, 간질</td><td>41°C 고열, 복통, 급사, 간 경색</td></tr><tr><td>렙토스피라병(Pomona)</td><td>송아지 치사율 50%, 성우 5% 미만</td><td>패혈증, 혈색소뇨, 성우는 주황색 진한 우유·유산</td></tr><tr><td>만성 구리 중독</td><td>구리 첨가 사료</td><td>심한 황달, 무열</td></tr><tr><td>유채·케일 중독</td><td>가을 사료작물 방목</td><td>초급성 용혈, 무열</td></tr><tr><td>지방병성 혈뇨</td><td>1세 이상, 고사리 지역</td><td>지속·간헐적 혈뇨(적혈구 있음)</td></tr><tr><td>신우신염</td><td>성우 산발</td><td>혈뇨·농뇨, C. renale</td></tr></table><span class="hang">오줌을 원심하면 혈뇨(적혈구 침전)와 혈색소뇨를 구별한다. 어린 소의 근이영양증 미오글로빈뇨와 혼동하지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">49.</span><span>출혈성 질환 — 지혈 검사<span class="hang">소의 정상 혈소판은 100,000~800,000/µL, 수명 7~10일이다. 임상 출혈은 50,000 미만에서 시작해 대개 20,000 미만에서 나타난다(Rebhun). Constable은 40,000 미만으로 기술한다. 20,000 미만이어도 출혈이 없다가 스트레스, 외상, 반복 주사·직장검사로 출혈하기 시작한다.</span><span class="hang">EDTA 관의 혈소판 응집(가성 혈소판감소증)은 도말로 확인하고 구연산 관으로 다시 잰다. 응고검사는 3.8% 구연산나트륨 1:혈액 9로 채취한다.</span><span class="hang">혈소판 이상은 점막 점상출혈, 주사·곤충 물린 부위 출혈, 비출혈, 전방출혈, 흑색변을, 응고인자 이상은 반상출혈, 압박점 혈종, 관절혈증, 체강 출혈을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>혈소판감소증 — 원인<span class="hang">생성 감소(범혈구감소증의 첫 징후): 고사리, 트리클로로에틸렌 추출 대두박, 송아지의 장기 푸라졸리돈, Stachybotrys 진균독, 방사선, 골수로. 혈소판과 과립구가 적혈구보다 먼저 줄어 빈혈은 늦다.</span><span class="hang">파괴·소비 증가(더 흔함): 특정 2형 BVDV 균주의 감수성 개체 급성감염(감염 3~4일부터 감소, 약 14일에 최저, 항체 상승과 함께 회복; 지속감염이나 점막병의 특징이 아님; 급성 BVD 성우의 약 10%에서 출혈 경향), 패혈성 유방염·자궁염과 신생 패혈증의 DIC, 급성 사르코시스티스, 럼피스킨, Theileria annulata, BLV, 살모넬라증. 특발성(면역매개성)은 매우 드물다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>혈소판감소증 — 진단과 치료<span class="hang">혈소판 수(대개 50,000/µL 미만)와 DIC 배제(PT, APTT, 트롬빈시간, 섬유소원, FDP 정상)로 진단한다. 원인 불명, 과립구감소 동반, 만성·재발성이면 골수 검사를 한다.</span><span class="hang">임상 출혈이 있으면 신선 전혈을 수혈하고 원발병을 치료한다. 최소 송아지 1 L, 성우 4 L이며 공혈우는 BLV·지속감염 BVDV 음성이어야 한다. 패혈증, 외상, 급성 BVDV는 대개 1회로 충분하다.</span><span class="hang">과립구감소가 함께 있으면 범혈구감소증으로 예후가 매우 나쁘며 대증 치료, 전혈(플라스틱 백 채혈)이나 혈소판풍부혈장(150 × g 20~30분 원심, 유리·15°C 미만 보관 금지, 수시간 내 투여), 항생제를 쓴다.</span><span class="hang">특발성으로 25,000/µL 미만이 지속·재발하고 출혈이 있으며 골수가 정상이면 덱사메타손 0.05 mg/kg 1일 1회, 5일 뒤 0.02 mg/kg로 줄인다. 대부분 30일 안에 끊고 재발이 적다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>고사리 중독 — 혈액 양상<span class="hang">ptaquiloside가 모든 혈구계열을 억제하는 방사선 유사 골수억제를 일으킨다. 생초·건초 모두 독성이 있고 새순과 뿌리줄기가 가장 독하다. 사료의 최대 20%를 30일 이상 먹으면 발병하고 섭취 중단 후 6주까지 새 환축이 나온다. 젖으로 독소가 나와 포유 송아지도 걸린다.</span><span class="hang">혈소판감소와 호중구감소가 먼저 오고 빈혈은 실혈이나 나중에 생긴다. 혈성 비즙, 점상·반상출혈, 허약, 전방출혈, 출혈성 설사, 흑색변, 혈뇨가 있고 호중구감소로 세균 침입, 간 경색, 폐렴, 발열이 겹친다. 출혈시간은 길고 PT는 정상이다. 골수는 범혈구감소다.</span><span class="hang">특이 치료는 없다. 격리, 광범위 항생제, 수혈, 간호를 하나 골수억제 개체는 거의 회복하지 못한다. 한우번식우 사양관리 자료는 여름 목초 고갈기에 고사리만 무성할 때 장기 섭식으로 생기며 급성은 거의 폐사하고 만성은 반복 수혈로 일부 구제된다고 기술한다. 감별은 탄저, BVDV, 푸라졸리돈 중독, 스위트클로버 중독, 방사선 장해다.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>소 신생 범혈구감소증(BNP)<span class="hang">2006년 독일에서 처음 관찰된 4주령 이하 송아지 병이다. 특정 BVD 백신(Pregsure BVD) 접종 어미가 백신 생산 세포주(MDBK) 단백에 대한 동종항체를 만들고, 초유로 넘어가 송아지 혈소판·백혈구의 MHC I 항원과 반응한다.</span><span class="hang">외상·주사·이표 부위 출혈, 점상출혈, 흑색변, 흔히 41.0°C를 넘는 지속 발열이 있고 처음엔 활발하다가 빈혈, 출혈, 이차감염으로 죽는다. 치사율 80~90%, 흔히 24~48시간에 죽는다. 혈소판·백혈구 감소, 비재생성 빈혈, 삼계열 골수 저형성이 특징이다. 특이 치료는 없고 BNP 송아지를 낳은 어미의 초유를 먹이지 않는다. 해당 백신은 회수되었다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>쿠마린·디쿠마롤 중독<span class="hang">곰팡이 핀 스위트클로버(Melilotus)·스위트버널그라스 건초의 디쿠마롤이나 와파린·브로디파쿰 살서제로 비타민 K 의존 인자 II, VII, IX, X가 줄어 생긴다. 사료는 농장 풍토성, 살서제는 산발적이며 섭취 후 1주 안에 증상이 나온다.</span><span class="hang">반상출혈, 관절혈증, 압박점 혈종, 비출혈, 흑색변, 혈뇨, 주사·파리 물린 곳의 지속 출혈, 제각 후 출혈, 심한 빈혈이 있다. 인자 VII 반감기가 가장 짧아 PT가 먼저 늘고 이어 APTT가 는다. 혈소판은 정상이다. 여러 두가 동시에 장간막 출혈·동맥류를 보이면 의심한다.</span><span class="hang">치료: 비타민 K1 1.0 mg/kg SC 또는 IM 1일 2회 최소 5일, 심한 빈혈은 신선 전혈 2~6 L. 비타민 K3는 대체제가 아니며 독성이 있다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>파종성 혈관내 응고(DIC)<span class="hang">패혈증, 내독소혈증, 클로스트리듐 외독소혈증에 합병하며 성우는 패혈성 유방염·자궁염, 송아지는 신생 패혈증·심한 장염이 흔한 원인이다. 원발병 소가 갑자기 악화되며 출혈, 혈종, 흑색변, 혈뇨, 주사 부위 출혈과 천자 직후 정맥 혈전이 생기고 신부전이 흔하다.</span><span class="hang">교과서 기준(혈소판 감소, PT·APTT·트롬빈시간 연장, FDP 증가, 출혈시간 연장, 항트롬빈 III 감소) 중 소는 2~3가지만 맞는 경우가 많다. 대부분 혈소판감소와 중간 범위 FDP(10~40 µg/mL), 약간의 PT·APTT 연장을 보인다. 섬유소원 감소는 소 DIC의 전형이 아니며 간질환을 시사한다.</span><span class="hang">치료: 원발병 집중 치료, 정맥수액, 플루닉신 0.5 mg/kg 1일 2회, 출혈이 계속되면 신선 혈장이나 전혈. 헤파린과 스테로이드는 근거가 없고 해로울 수 있다. 확진우는 대부분 죽는다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>유전성 출혈 질환<span class="hang">인자 XI 결핍: 홀스타인(열성)과 흑모화우(Japanese Black)에서 기술된다. 손상, 거세, 제각 후 과도·반복 출혈과 채혈 부위 혈종을 보이고 신생아기에 죽기도 하며 재귀발정이 늘었다. 이형접합체는 응고 이상이 안 나타날 수 있다.</span><span class="hang">혈우병 A(인자 VIII 결핍): 일본 갈색화우 수컷의 X연관 유전병이다.</span><span class="hang">체디악-히가시 증후군: 헤리퍼드, 흑모화우, 브랑거스의 상염색체 열성병이다. 불완전 백색증(옅은 회색 털, 눈부심, 눈물), 빈혈, 림프절 비대, 백혈구 살균능 저하로 패혈증에 잘 걸리고 평균 수명은 약 1년이다. 혈소판 치밀과립 결핍으로 출혈 경향이 있다. 백혈구의 거대 과립으로 진단하고 흑모화우는 LYST 변이 PCR로 진단한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">57.</span><span>수혈 — 적응증과 판단 기준<span class="hang">극심한 빈혈, 급성 실혈, 출혈성 혈소판감소증·응고장애, 수동면역 실패 신생 송아지가 적응증이다.</span><span class="hang">일차 판단은 신체검사, PCV는 이차다(Rebhun). 급성·아급성(24~72시간) 실혈은 대개 PCV 12~14%에서 수혈한다. 아급성·만성 출혈이나 용혈에서 수화가 정상이면 PCV 14% 초과는 즉시 수혈이 거의 필요 없다. 심박 120 초과의 두근거림, 호흡수 60 초과, 뚜렷한 창백이면 PCV와 관계없이 수혈한다. 혈중 젖산 증가가 지표가 된다.</span><span class="hang">Constable: PCV 20% 미만이면 고려하되 단일 수치로 정하지 않는다. 심박이 정상 상한보다 30~50% 높거나 계속 오름, 반추 정지·복통, 부정맥, 무뇨, 정맥혈 산소분압 20 mmHg 미만(25 미만은 의미 있음), 정맥혈 pH·염기과잉 저하, 젖산 2~4 mmol/L는 주의·4 초과는 즉시 수혈, 크레아티닌·트로포닌 상승을 종합한다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>수혈 — 공혈우 선정과 교차시험<span class="hang">크고 건강한 소, 가능하면 BLV 음성·지속감염 BVDV 음성 소를 쓰며 이번 비유 뒤 도태할 비임신우가 이상적이다(Rebhun). 바베시아·타일레리아·혈액 마이코플라스마가 없고, 동종항체를 만드는 백신(일부 BVD 백신, 아나플라즈마 백신)을 맞지 않았으며, PCV·백혈구·혈장단백이 정상이어야 한다(Constable).</span><span class="hang">소는 혈액형이 11계 70여 인자로 많아 첫 수혈은 교차시험이 필요 없다. 의미 있는 반응 위험은 1% 미만이다(Rebhun). 두 번째 수혈부터 위험이 커진다. 교차시험은 주시험과 부시험을 모두 하고 응집과 용혈을 보며, 신선 검체를 쓴다.</span><span class="hang">첫 수혈 1주 이상 뒤 같은 공혈우 혈액을 다시 쓰면 갑작스런 호흡곤란, 딸꾹질, 떨림이 오며 아드레날린에 반응한다(Constable).</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>수혈 — 채혈과 혈장<span class="hang">Rebhun: 700 kg 이상 소에서 6 L를 안전하게 뽑는다. 자일라진 15~25 mg IV, 경정맥 소독, 머리 고정, 목 뒤 1/3에 압박 로프, 15 cm 8 G 투관침을 넣고 20% 구연산나트륨 35 mL/L가 든 입 넓은 1~2 L 병에 자연 낙하로 받으며 돌려 섞는다. 15분 안에 6 L를 받고, 로프를 풀어 2분 누른다. 무균 채혈이면 한 공혈우를 매달 수년간 쓴다.</span><span class="hang">Constable: 혈액량의 20%까지, 500 kg 소에서 8 L까지 30~60분에 걸쳐 받고 같은 양의 등장 수액을 공혈우에게 준다. 2~3시간 안에 쓸 혈액은 3.2% 구연산나트륨 100 mL/L, 보관 혈액은 ACD나 CPDA 100 mL/L를 쓴다.</span><span class="hang">혈장은 원심으로 전혈의 약 2/3를 얻고, 원심 전 12~18시간 냉장하면 수율이 오른다. -80°C 동결혈장은 1년까지 응고인자가 유지되며 체온 이하에서 천천히 해동한다. 비빈혈성 출혈에는 혈장이 낫고 용량은 2~10 mL/kg IV(검증 부족)다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>수혈 — 수혈량, 속도, 반응<span class="hang">수혈량(mL) = 체중(kg) × 80 mL/kg × (목표 PCV - 현재 PCV) / 공혈 PCV. 농축적혈구는 공혈 PCV를 100%로 놓는다. 경험적으로 송아지 최소 1 L, 성우 4 L(Rebhun), 산후 혈색소뇨증 성우 최소 5~6 L(Constable)다.</span><span class="hang">급성 실혈은 등장 수액과 함께 주되 PCV를 출혈 전까지 올릴 필요는 없다. 정상 혈액량 빈혈(용혈, 만성)은 과팽창을 피하려 농축적혈구가 바람직하다.</span><span class="hang">14 G 카테터와 인라인 필터 수혈 세트로 30~120분에 걸쳐 준다. 너무 빠르면 빈맥, 빈호흡, 허탈이 온다. 처음 몇 분은 천천히 주며 심박, 체온, 호흡을 보고 이상이 없으면 속도를 올린다.</span><span class="hang">두드러기, 점막피부 경계부 부종, 빈맥, 빈호흡, 아나필락시스가 보이면 즉시 멈추고 항히스타민제 등으로 치료한 뒤 교차시험이나 다른 공혈우를 고른다. 효과는 심박·호흡 정상화와 젖산 감소로 거의 즉시 나타난다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">61.</span><span>아나플라즈마병 — 원인과 전파<span class="hang">적혈구 내 리케치아 Anaplasma marginale가 원인이며 A. centrale는 가벼운 병을 일으켜 생백신으로 쓴다. 세계적으로 가장 흔한 진드기 매개 소 질병이다.</span><span class="hang">생물학적 매개는 참진드기(Rhipicephalus(Boophilus), Dermacentor 등)이고 경란 전파가 거의 없어 소의 지속감염이 병원체 유지에 필수다. 기계적 전파는 등에(흡혈 후 2시간까지), 흡혈파리, 모기, 이, 그리고 피 묻은 주사침, 제각·거세·이표 기구, 직장 장갑, 수정·수정란이식 기구, 수혈이다. 바늘 하나로 연속 주사한 거세우 10두 중 6두가 감염되었다. 진드기 전파가 파리보다 100배 이상 효율적이다.</span><span class="hang">태반 전파는 만성감염 육우에서 10.5%였고 주로 임신 말기 신규 감염에서 생긴다. 동결정액 위험은 무시할 만하다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>아나플라즈마병 — 역학과 기전<span class="hang">1세 미만은 증상이 없거나 가볍고 1~2세도 대개 가볍다. 2세 이상은 급성 중증으로 치사율 30~50%이고 3세 이후 첫 감염은 흔히 초급성 치사형이다. 미국 발생에서 환축의 81%가 2~4세였다.</span><span class="hang">풍토 지역은 송아지가 평균 11주에 감염되어 임상병이 드물고, 감수성 소 도입이나 매개체 확산 경계지역에서 발생한다. 비육장 입식 2~3주 뒤 발생이 흔하다. 수송, 기아, 극한 기후, 병발병이 저항성을 무너뜨린다.</span><span class="hang">감염 2~6주 뒤 현성이 되며 급성기에 적혈구 10~90%가 감염되고 최소 15%가 감염되어야 증상이 나온다. 감염 적혈구가 망내계에서 탐식되어 혈색소뇨 없는 빈혈과 황달이 온다. 회복우는 평생 보균하며 MSP2·MSP3 항원 변이로 10~14일 주기로 균혈증이 오르내리고 임상 재발에는 저항한다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>아나플라즈마병 — 임상증상과 진단<span class="hang">잠복기는 진드기 감염 수주, 혈액 접종 1~5주(Constable), 7~60일(Rebhun)이다. 발열은 40.5°C를 넘는 일이 드물고 오르내린다는 기술(Constable)과 40.0~41.7°C의 뚜렷한 발열이라는 기술(Rebhun)이 있다.</span><span class="hang">침울, 식욕부진, 위장 정체, 탈수, 유량 정지, 빈혈에 비례한 호흡곤란이 있다. 황달은 2일 이상 살아야 나타나고 혈색소뇨는 없다. 유산이 흔하고 회복 수소는 수개월간 정소 기능이 떨어진다. 성우 젖소의 초급성형은 24시간 안에 죽으며 직전에 흥분해 사람을 공격하기도 한다. 회복우는 수척하고 회복이 길다.</span><span class="hang">혈액: 적혈구 150만/µL까지 감소, 대구성으로 진행, 망상적혈구·호염기성 반점. 적혈구 가장자리의 점 모양 균체가 아급성 10%까지, 초급성 50% 이상 보이며 호염기성 반점·하웰-졸리 소체와 구별한다. Diff-Quik 염색은 15초로 김자만큼 정확하다.</span><span class="hang">MSP5 경쟁 ELISA가 가장 정확하며 감염 9일부터, 16일에 민감도 100%다. 카드응집검사는 군 검사용이다. 백신 접종우는 1년 넘게 양성일 수 있다. PCR이 가장 민감하다. 보균우도 양성이므로 임상상과 함께 해석한다. 부검에서 묽은 혈액, 오렌지색 종대 간, 비장 종대가 보이며 귀 절단면 혈액 도말이 낫다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>아나플라즈마병 — 치료<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>옥시테트라사이클린</td><td>6~10 mg/kg IM 1일 1회 3일, 또는 장기지속형 20 mg/kg IM 1회</td></tr><tr><td>이미도카브(imidocarb)</td><td>5 mg/kg IM 2회, 7일 간격(Constable) / 14일 간격(Rebhun)</td></tr><tr><td>엔로플록사신</td><td>12.5 mg/kg SC 2회, 48시간 간격</td></tr></table><span class="hang">모두 임상 치료는 되지만 지속감염을 없애지 못한다(Rebhun은 이미도카브 2회가 멸균한다고 기술). 엔로플록사신 7.5 mg/kg는 장기지속형 옥시테트라사이클린보다 회복이 빨랐다. 이미도카브는 발암 의심으로 미국·유럽에서 승인되지 않았다. 에스트라디올 사이피오네이트 14.3 mg/kg IM 병용이 회복을 돕는다는 기술이 있다(Constable).</span><span class="hang">PCV 15% 미만이면 수혈하고 거친 취급을 피한다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>아나플라즈마병 — 보균 제거와 예방<span class="hang">화학적 멸균: 경구 클로르테트라사이클린 4.4~22 mg/kg/일 80일로 49일 안에 PCR 음성, 이후 49~88일에 cELISA 음성이 되었다(Constable). Rebhun은 클로르테트라사이클린 4.4 mg/kg/일 60일 경구 또는 옥시테트라사이클린 22 mg/kg 5일 간격 5~6회를 권한다. 성공하면 약 2주 뒤 PCR 음성, cELISA 음전은 3개월 이상 더 걸린다. 제거된 소는 다시 감수성이 된다.</span><span class="hang">무리 보호: 장기지속형 테트라사이클린 20 mg/kg IM 1회로 일시 보호(직전 14일 내 노출은 효과 떨어짐), 28일마다 반복하거나 사료 클로르테트라사이클린 1.1 mg/kg/일.</span><span class="hang">도입우 사전 검사, 매개체 구제, 1두 1침, 기구 소독, 발생 시 동거우 백신·테트라사이클린 후 혈청검사와 양성우 치료·도태. 풍토지로는 2세 미만을 곤충이 적은 시기에 들인다.</span><span class="hang">불활화 백신은 4주 간격 2회, 매개 계절 최소 2주 전 완료, 매년 추가 접종하며 중증도를 줄일 뿐 감염은 막지 못한다(면역 최소 5개월). 적혈구 유래라 신생 송아지 동종면역 용혈 위험이 있어 공태우에 접종하고 임신 말기 추가 접종을 피한다. A. centrale 생백신은 1회 접종으로 진드기 지역에서 평생 면역이 유지되나 지역에 따라 방어가 불충분하고, 접종 전 3주간 테트라사이클린을 쓰지 않는다. 혈액 유래 생백신은 BLV 같은 병원체 오염 위험이 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>바베시아병 — 원인과 역학<span class="hang">소의 주요 종은 Babesia bovis(소형), B. bigemina(대형, 쌍을 이룬 서양배 모양), B. divergens(유럽)이며 동아시아에는 Haemaphysalis longicornis가 옮기는 B. ovata가 있다. Rhipicephalus(Boophilus)에서 경란 전파되며 B. bovis는 유충이, B. bigemina는 약충과 성충이 옮긴다.</span><span class="hang">송아지는 약 6개월까지 선천 저항성이 있고(비장 적출로 소실) 초유 항체가 3~4개월 지속된다. 감수성은 나이가 들수록 줄지만 중증도는 커진다. 6~9개월령까지 송아지의 75% 이상이 노출되면 풍토적 안정 상태가 된다. 불완전한 진드기 구제는 오히려 불안정을 만든다. Bos indicus는 저항성이 크다. 도입우, 수송우, 분만·기아·병발병(특히 아나플라즈마) 스트레스 소에 많다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>바베시아병 — 기전과 임상증상<span class="hang">잠복기 7~20일 뒤 용혈성 빈혈, 황달, 혈색소뇨가 오고 빈혈성 무산소증으로 죽는다. B. bovis는 저혈압, 쇼크, DIC, 폐혈전, 뇌 모세혈관 내 감염 적혈구 정체(뇌형)를 일으키고 B. bigemina는 단순 용혈만 일으킨다.</span><span class="hang">B. bovis: 경과 3~7일, 다른 증상 전 수일간 40°C 초과 발열, 식욕부진, 빈호흡, 허약, 거품이 안정적인 적갈색 오줌, 빈혈과 황달, 설사, 떨림, 와상. 많은 중증우가 24시간 만에 급사한다. 유산하고 수소는 6~8주 불임이 될 수 있다. 뇌형은 운동실조, 마비나 광조, 경련, 혼수로 치료에도 치사율이 높다.</span><span class="hang">B. bigemina: 혈색소뇨가 더 일찍, 일관되게 나타나고 발열은 덜하며 뇌 침범이 없고 회복이 빠르다. 진드기 감염력은 4~7주로 B. bovis(1년)보다 짧다. B. divergens는 항문 괄약근 경련으로 가늘고 긴 변을 세게 내보낸다. 치사율은 50%를 넘을 수 있으나 조기 치료로 5%까지 낮춘다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>바베시아병 — 진단<span class="hang">적혈구 200만/µL, Hb 3 g/dL까지 떨어지며 빈혈은 감염 9~16일에 정점이다. 혈소판과 섬유소원이 감소한다.</span><span class="hang">도말은 꼬리 끝이나 귀 가장자리 모세혈관 혈액으로 만든다. B. bovis는 정맥혈에 20배 적어 위음성이 나고 후층 도말이 10배 민감하다. PCR이 가장 민감해 보균우 검출에 쓰며 이미도카브 투여 전 채혈한다. 혈청검사는 과거·현재 감염을 구별하지 못한다.</span><span class="hang">부검: 황달, 묽은 혈액, 연한 비장 종대, 암갈색 종대 간, 걸쭉한 담즙, 검은 신장, 적갈색 오줌, 심외막 반상출혈. B. bovis는 대뇌 회백질 분홍색 변색이 거의 특징적이며 뇌 압착 도말로 확진한다. 장기 도말은 사후 8시간, 뇌는 28시간 안에 만든다.</span><span class="hang">진드기 존재나 1개월 내 풍토지 이동을 확인한다. 아나플라즈마병은 혈색소뇨가 없다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>바베시아병 — 치료와 예방<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>이미도카브 디프로피오네이트</td><td>치료 1 mg/kg; 2 mg/kg는 원충 제거와 약 1개월 예방(Constable); 1~3 mg/kg(Rebhun)</td></tr><tr><td>디미나젠(diminazene)</td><td>3~5 mg/kg(Rebhun)</td></tr><tr><td>아미카발리드(amicarbalide)</td><td>5~10 mg/kg(Rebhun)</td></tr></table><span class="hang">이미도카브는 정맥 투여 시 독성이 커서 IM 또는 SC로 준다. 고용량에서 기침, 근육 떨림, 유연, 복통, 주사 부위 자극이 있다. 원충을 일관되게 제거하는 유일한 약이며 치료우도 동종 균주에 수년간 저항성을 가진다. 3~6주간 발병을 막으며 면역이 생길 만큼의 감염은 허용한다. 잔류 문제로 일부 유럽 국가에서 철수되었다.</span><span class="hang">치료가 늦으면 빈혈로 죽는다. 중증우는 수혈과 항쇼크 처치, 회복기에는 조혈제를 준다.</span><span class="hang">예방은 진드기 구제와, 풍토지로 옮길 소의 사전 백신 접종이다. 약독화 생백신은 1세 미만에 접종하면 평생 95% 이상 방어한다. 동결 백신은 해동 후 8시간(DMSO 동결보호제는 30분) 안에 쓴다. 백신이 곤란하거나 노출이 짧으면 이미도카브로 일시 보호한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">70.</span><span>타일레리아병 — 원인과 전파<span class="hang">진드기 침의 포자소체가 백혈구에서 분열체, 이어 적혈구에서 피로플라스마가 된다. 분열체를 많이 만드는 T. parva(동해안열, 아프리카)와 T. annulata(열대 타일레리아병, 지중해·아시아, Hyalomma 매개)는 병원성이 매우 높다.</span><span class="hang">Theileria orientalis 군(T. sergenti, T. buffeli, T. orientalis를 한 종으로 보기도 함)은 분열체를 거의 만들지 않고 적혈구 내 원충이 많을 때 빈혈을 일으킨다. 유전형 ikeda, chitose, buffeli, type 5 중 ikeda가 가장 병원성이 높다. Haemaphysalis 진드기가 옮기며 아시아, 호주, 뉴질랜드에서 발생이 늘고 있다. 한우송아지질병관리핸드북은 원인체를 Theileria sergenti로 기술한다.</span><span class="hang">진드기 경란 전파는 없다. 흡혈파리와 공용 주사침도 옮기며 감염우는 평생 감염이다(Rebhun). 태반 수직 전파가 보고되어 있다. 한우송아지질병관리핸드북: 임신우가 감염되면 태반으로 송아지가 감염되고 설사·호흡기병이나 스트레스 때 증식해 방목하지 않은 송아지에서도 발생한다.</span><span class="hang">유럽 품종과 교잡종, 풍토지로 옮겨진 미감작우가 더 감수성이고 제부는 저항성이 크다. 분만 직후 소와 어린 송아지가 감수성이 높다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>타일레리아병 — 임상증상과 진단<span class="hang">대부분 무증상이다. 호주 육우의 감염률은 도말 28.1%, PCR 70.8%였다.</span><span class="hang">중증 발생은 고열, 눈물, 콧물, 림프절 종대, 심한 빈혈과 다수 원충, 혈색소뇨, 유산, 유량 손실, 폐사를 보인다(Constable). 혈관내 용혈로 빈맥, 빈호흡, 설사, 황달, 짙은 오줌, 뚜렷한 림프절 비대가 있고 같은 무리에 무증상우가 섞여 있다(Rebhun). 한우송아지질병관리핸드북: 잠복기 10~14일, 40~42°C 고열이 1주일 지속되며 빈혈이 진행하고, 성장이 더디며 심하면 전신 황달로 폐사한다.</span><span class="hang">재생성 빈혈, 백혈구 감소 또는 증가, 림프구증가, 고빌리루빈혈증, AST·GLDH 상승이 보고된다. Bovine Medicine 증례(T. orientalis ikeda)는 빌리루빈 101 µmol/L, AST 310 U/L, GLDH 57 U/L, 글로불린 48 g/L, 중탄산 14 mmol/L였다.</span><span class="hang">혈액 도말의 가늘고 작은 적혈구 내 원충으로 진단하지만 바베시아와 늘 구별되지는 않아 특이 PCR이나 염기서열로 확인한다. 부검에서 제4위 궤양, 비장 종대, 심한 폐부종이 보인다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>타일레리아병 — 치료와 예방<span class="hang">테트라사이클린과 이미도카브는 효과가 없었다(Rebhun). 할로푸지논, 파르바쿠온, 부파르바쿠온이 성공적으로 쓰였으나 비용과 식용동물 승인 문제가 있다. Bovine Medicine은 조심스러운 취급, 양질 사료, 수혈, 파르바쿠온 계열 항원충제를 권한다.</span><span class="hang">한우송아지질병관리핸드북: 부타렉스, 유성프리마킹, 디미날 같은 치료제를 투여하고 방목 중인 송아지는 철수시킨다. 한우번식우 사양관리 자료는 타일레리아·아나플라즈마 혼합감염에 부파르바쿠온(부타렉스)과 지속성 옥시테트라사이클린을 함께 쓰고, 발병우는 방목을 금해 서늘한 곳에 격리하며 수액, 강심제, 영양제, 빈혈 시 수혈, 위점막 보호제·소화제를 준다고 기술한다.</span><span class="hang">호주에서는 생백신 생산용 송아지의 T. orientalis 제거에 프리마퀸 인산염과 할로푸지논 젖산염 병용이 효과적이다.</span><span class="hang">예방: 방목 중 주기적 예찰과 진드기 구제, 임신우 방목지 철수 시 예방적 일괄 투약(한우송아지질병관리핸드북), 방목 중 15~30일 간격 약욕(한우번식우 사양관리). 희귀 지역에서는 양성우 도태를 고려한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">73.</span><span>렙토스피라병 — 용혈 양상<span class="hang">용혈소를 만드는 혈청형(주로 L. interrogans Pomona)만 혈관내 용혈을 일으키고 Hardjo는 용혈과 간질성 신염을 일으키지 않는다. 1개월령까지 송아지가 가장 감수성이며 40.5~41.5°C 고열, 점막 점상출혈, 혈색소뇨, 황달, 창백, 빈맥, 호흡곤란으로 치사율이 높다. 성우는 용혈이 드물고 유산과 전 분방의 걸쭉한 적색 우유를 보인다. 심한 용혈은 혈색소뇨성 신증을 일으키고, 살아남으면 간질성 신염과 장기 배균이 남는다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>세균성 혈색소뇨증 — 원인과 역학<span class="hang">토양 혐기균 Clostridium novyi D형(C. haemolyticum)이 건강한 소의 간에 있다가 간질 유충 이동, 괴사간염, 간농양, 간생검으로 간이 손상되어 혐기 환경이 되면 증식해 포스포리파아제 C(β독소)를 낸다. 독소가 용혈, 간세포 괴사, 내피 손상을 일으키고 문맥 분지 혈전으로 큰 빈혈성 경색이 생긴다.</span><span class="hang">여름·가을, 관개되거나 배수 나쁜 알칼리성(pH 약 8) 방목지, 간질 목초지와 연관되며 오염 건초로 비육장에서도 생긴다. 비오염 지역 소를 들이면 7~10일 뒤 발생한다. 영양 상태 좋은 소가 감수성이다. 손실은 대개 5% 미만, 최대 25%다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>세균성 혈색소뇨증 — 임상, 진단, 치료<span class="hang">방목 중 급사로 발견되기도 한다. 반추·채식·비유·배변이 갑자기 멈추고 등을 굽히고 걸을 때 신음한다. 얕고 빠른 호흡, 우측 전복부 통증, 39.5~41°C 발열(죽기 전 저체온), 앞가슴 부종, 점액·혈액 섞인 설사, 암적색 오줌, 황달이 있다. 경과는 12시간~4일이며 임신우는 유산한다.</span><span class="hang">오줌에 적혈구가 없다. 빈혈, 백혈구 변화, AST·GGT·빌리루빈 상승이 있다. 부검에서 빠른 사후강직, 가스 찬 젤라틴성 피하부종, 체강 혈성 삼출, 간의 직경 5~20 cm 창백한 경색과 충혈대, 검은 신장이 보인다. 경색 가장자리 조직(최소 약 2 cm3)을 밀폐해 혐기배양과 형광항체검사를 한다.</span><span class="hang">치료: 고용량 페니실린(Rebhun: 나트륨·칼륨 페니실린 44,000 U/kg IV 1일 4회)이나 테트라사이클린, 항독소혈청, 수혈, 수액. 흥분·운동은 급사를 부른다. 회복 수소는 간 파열 위험으로 3주간 교배하지 않는다.</span><span class="hang">예방: 간질 구제와 위험 목초지 차단. 불활화 백신을 위험기 4~6주 전 피하 접종하고 6개월령 이상을 매년 재접종(Constable), 또는 이행항체 소실 후 3~4주 간격 2회와 위험우 연 2회 추가(Rebhun). 근육·피내 주사는 심한 반응을 일으킨다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">76.</span><span>산후 혈색소뇨증 — 원인과 논쟁<span class="hang">원인은 불확실하다. 많은 환축의 저인혈증 때문에 인 결핍(비유 개시의 유선 손실, 사료 부족, 고몰리브덴)이 일차 원인으로 지목되었고, 적혈구 해당·ATP 감소로 변형능이 떨어지고 삼투 취약성이 커져 용혈된다고 설명한다.</span><span class="hang">반론: 건강한 분만우도 심한 저인혈증이 흔한데 이 병은 드물고 실험 재현이 거의 안 된다. Grünberg 등(2015)은 사료 인 결핍으로 심한 저인혈증을 유도해도 적혈구 내 인과 삼투 저항성이 떨어지지 않아 인 결핍 단독으로는 용혈이 일어나기 어렵다고 보았다.</span><span class="hang">십자화과와 사포닌 함유 사료(알팔파, 사탕무 부산물), 뉴질랜드의 구리·셀레늄 결핍(하인츠소체형)도 거론되며 찬물 섭취나 혹한이 촉발할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>산후 혈색소뇨증 — 임상과 진단<span class="hang">분만 2~4주(Constable) 또는 비유 첫 달(Rebhun)의 3~6산 고능력 젖소에 산발하며 특정 농장에 반복된다. 치사율은 50%에 이를 수 있다.</span><span class="hang">혈색소뇨, 식욕부진, 허약, 유량 급감이 갑자기 온다. 탈수, 창백, 심첨박동·경정맥 박동 증강, 빈맥, 호흡곤란, 중등도 발열(40°C), 단단한 변이 있고 황달은 후기에 나타난다. 3~5일에 눕고 죽을 수 있으며 회복에 약 3주가 걸리고 이식증을 보인다. 케토시스가 흔히 겹친다.</span><span class="hang">오줌은 적갈색~검은색이며 적혈구가 없다. 혈장 용혈, 재생성 빈혈, 혈청 무기인 1.5 mg/dL 미만(0.1까지)이다. 경정맥혈 인은 미추정맥보다 최대 0.8 mg/dL 낮다.</span><span class="hang">감별: 바베시아병, 렙토스피라병, 물중독·냉수 용혈, 만성 구리 중독, 유채·케일 중독, 대량 정맥 옥시테트라사이클린, 세균성 혈색소뇨증, 지방병성 혈뇨.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>산후 혈색소뇨증 — 치료와 예방<span class="hang">전혈 수혈이 우선이며 12시간 지연되면 되돌릴 수 없는 경우가 많다. 최소 5~6 L가 필요하고 대개 48시간 유지되며 이후에도 창백하면 다시 수혈한다. 혈색소뇨성 신증 예방을 위해 수액을 준다.</span><table class="bxt"><tr><th>인 보충</th><th>방법</th></tr><tr><td>정맥</td><td>NaH2PO4 30 g을 탈이온수 300 mL에 녹여 IV(산성이라 피하 금지)</td></tr><tr><td>경구(Constable)</td><td>NaH2PO4 150~200 g, 또는 250~300 g을 12~24시간마다 5일</td></tr><tr><td>경구(Rebhun)</td><td>인산일나트륨 200~500 g(무기인산 약 50~100 g)을 드렌치에 섞어</td></tr><tr><td>비경구(Rebhun)</td><td>멸균 Fleet 용액 20~30 g 정맥 점적 또는 피하, 고칼슘·고마그네슘 수액과 혼합 금지</td></tr></table><span class="hang">정맥 인산염 효과는 짧아 경구를 병행한다. 부타포스판, 톨딤포스 같은 유기인 주사제는 이용되지 않아 부적합하고, 인산이칼슘은 잘 녹지 않아 빠른 교정에 맞지 않는다. 케토시스도 치료한다. 예방은 비유 초기 인 요구량 충족과 결핍 지역의 구리 보충이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>소 백혈병(BLV) — 원인과 전파<span class="hang">BLV는 델타레트로바이러스로 B 림프구에 프로바이러스로 통합되어 평생 감염과 항체를 만든다. 세포 결합성이라 감염 림프구가 든 혈액이 옮겨져야 전파되며 림프구 1000개로도 감염될 수 있다.</span><span class="hang">수평 전파는 흔히 의원성이다: 주사침·주사기 재사용, 제각기, 이표·문신기, 거세 기구, 채혈침, 수혈, 코뚜레, 공용 직장 장갑(결과 상충). 기구는 염소계 표백제나 클로르헥시딘으로 소독한다. 흡혈곤충의 역할은 논란이다. 밀집 사육과 성우·어린 소 합사가 전파를 늘린다.</span><span class="hang">자궁 내 감염은 10% 미만(Rebhun), 4~8%(Constable)이고 바이러스 부하가 높은 어미는 40%에 이를 수 있다. 투명대가 온전한 수정란은 감염되지 않아 음성 수란우를 쓰면 양성 공란우에서 음성 송아지를 얻는다. 상업 정액의 위험은 낮다.</span><span class="hang">초유·우유는 감염 림프구와 항체를 함께 담아 역할이 불분명하며 생후 0~3일이 가장 감수성이다. pH 4.4 미만 산패 후 18.3°C 24시간, 동결 후 해동, 저온살균으로 BLV가 죽는다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>BLV 감염의 경과<span class="hang">대부분 무백혈성 무증상 감염이다. 약 30%(Constable) 또는 약 1/3(Rebhun)이 지속성 림프구증가증(PL)을 보이고 5% 미만만 림프육종이 된다. 임상 림프육종은 감염 지역에서 연간 1000두당 1두 정도다.</span><span class="hang">PL은 같은 품종·나이 비감염군 평균보다 3 표준편차 이상 높은 림프구 수가 3개월 이상 지속되는 양성 다클론 B세포 증식이다. 림프구가 6000에서 15,000/µL까지, 백분율이 50%에서 65%로 오르면 양성으로 본다. Rebhun은 PL 소의 림프구를 30,000~150,000/µL로 기술한다. PL은 스테로이드에 잘 반응하지 않고 바이러스량이 많아 주된 전파원이다. 림프육종의 약 2/3에서 PL이 선행하지만 수년간 안정적일 수도 있다. PL과 종양 발생에 유전 소인이 관여한다.</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>지방병성 림프육종 — 임상증상<span class="hang">2세 전에는 드물고 3~6세(Rebhun), 4~8세(Constable)에 많으며 잠복기는 4~5년이다. 5~10%는 부신 침범, 제4위 궤양이나 비장 파열의 내출혈로 급사한다. 대부분 체중·식욕 감소, 창백, 허약으로 시작해 증상이 뚜렷해지면 2~3주 안에 죽는다. 심근 침범이 없으면 심박은 정상이고 빠른 종양 성장 시 39.5~40°C 발열이 있다.</span><span class="hang">표재 림프절 비대: 임상예의 75~90%(Constable), 종양우의 약 25%(Rebhun). 인두후·종격 림프절 비대는 호흡곤란과 고창증을, 직장검사로 장골하·심서혜 림프절을 확인한다. 옆구리·회음의 1 cm 피하 결절은 대개 혈림프절로 의미가 없다.</span><span class="hang">표적 장기: 제4위(흑색변, 미주신경성 소화불량), 심장(우심방, 부정맥, 심낭삼출), 자궁(소구에 비슷한 단단한 결절, 직장검사로 조기 발견), 안와 뒤(진행성 안구돌출), 척수 경막외(2~7일에 마비, 체형 좋은 소에서 대사병·외상과 혼동), 신장·요관, 비장(파열·급사), 유방 림프절.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>BLV 감염과 림프육종의 진단<span class="hang">ELISA(gp51)가 AGID보다 10~100배 민감해 표준이며 혈청과 개체·집합 우유로 검사한다. 집합유 ELISA는 음성 농장 확인에 쓰고 미경산우, 수소, 건유우, 1세 이상 육성우는 따로 검사한다. AGID는 특이도가 높고 일부 수출 검사에 요구된다. 항체 양전은 감염 3~16주(Constable), AGID 3~12주, ELISA 2주(대개 6주 이내)(Rebhun)다.</span><span class="hang">이행항체가 6~7개월까지 남아 그 전 양성은 PCR로 확인하거나 9개월령에 재검사한다. 분만 전후에는 항체가 유방으로 빠져 위음성이 날 수 있으며, 그 기간을 Constable은 분만 2~6주 전부터 분만 2주 후까지, Rebhun은 분만 2주 전부터 6주 후까지로 기술한다.</span><span class="hang">림프육종은 조직검사로만 확진한다. 림프절 흡인은 반응성으로 판독되기 쉬워 생검이 낫다. 흉수·심낭수·복수 세포검사, 질을 통한 생검, 요천추 뇌척수액, 필요하면 개복을 한다. 백혈병성 혈액상은 10% 미만이다. BLV 양성이나 이중선 AGID는 림프육종 진단이 아니다.</span><span class="hang">감별: 산발성 백혈병, 창상성 심낭염, 결핵·방선균증 림프절염, 척수압박, 지방괴사.</span></span></p><p class="bx-num"><span class="bxn">83.</span><span>BLV — 치료와 관리<span class="hang">치료법은 없다. 말기 임신우는 프레드니손 1 mg/kg/일이나 이소플루프레돈으로 분만까지 완화하기도 하나, 이화 상태가 심하면 미숙한 자궁 내 감염 송아지가 나온다. 임신 150일 전에는 덱사메타손의 유산 위험이 낮아 난자·수정란 채취 목적에 쓸 수 있으나 과배란 반응이 떨어진다.</span><span class="hang">유병률이 낮으면 전두 검사 후 6개월 이상 양성우 도태, 6개월 미만 양성 송아지는 격리 후 9개월령 재검사나 PCR, 첫 전두 음성 후 3~6개월에 재검사한다. 유병률이 높으면 양성·음성 분리 사육, 그것도 어려우면 관리 개선으로 점차 줄인다. PL 소와 림프육종 소는 빨리 없앤다.</span><span class="hang">1두 1침, 전기 제각, 기구 소독, 개체별 직장 장갑, 곤충 구제, 외부 도입 자제, 음성우 초유나 처리 초유와 대용유, 음성 수란우 사용. 상업 백신은 없다.</span></span></p><p class="bx-num"><span class="bxn">84.</span><span>산발성 소 백혈병(SBL)<span class="hang">원인 불명이며 정의상 BLV 혈청·PCR 음성이다. B 또는 T세포 기원이고 대부분 2세 미만에서 생긴다.</span><span class="hang">송아지(소년)형: 2주~6개월(2세까지)에 체중감소와 여러 또는 전신 림프절의 급격한 비대, 허약, 호흡곤란, 반복 고창증. 재생불량성 빈혈과 미성숙 림프구가 흔하고 4~7개월에 골수 침범·백혈병이 많으며 2~8주에 죽는다.</span><span class="hang">흉선형: 6개월~2세에 하경부 종창이나 흉강 종괴로 고창증, 호흡곤란, 경정맥 확장, 심음 감약, 흔한 발열을 보인다. 물렁하거나 부종성이라 농양, 봉와직염, 경정맥 혈종과 혼동되며 세포검사·생검으로 확진한다.</span><span class="hang">피부형: 1~3세(Rebhun은 30개월 미만)에 결절·판이 수십 개 생겨 커지고 6~12개월 뒤 전신 종양으로 죽는다. 초기에는 백선, 피부사상균증, 피부결핵, 두드러기와 감별한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">85.</span><span>면역결핍 — 선천성과 후천성<span class="hang">소 백혈구 부착 결핍증(BLAD): 홀스타인의 상염색체 열성병으로 CD18 점돌연변이 때문에 호중구 β2 인테그린(Mac-1)이 부족해 조직으로 나가지 못한다. 2주~8개월에 반복 감염(발열, 설사, 폐렴), 상처 치유 지연, 치은염·치아 탈락, 지속 백선, 발육부진을 보이고 대부분 1~2세 전에 죽는다. 좌방이동 없는 지속적 성숙 호중구증가(30,000/µL 초과, 때로 100,000 초과)가 특징이다. 지속감염 BVDV와 내장 농양을 배제하고 PCR로 확진·보인우를 가린다. 종모우 검사로 지금은 거의 없다.</span><span class="hang">그 밖에 체디악-히가시 증후군(56번 항), 치사형질 A46(유전성 부전각화증, T세포 성숙 장애), 레드 데니시의 선택적 IgG2 결핍(괴저성 유방염 감수성)이 있다.</span><span class="hang">후천성: 초유 수동면역 전달 실패가 가장 흔하다. BVDV(호중구·림프구 수와 기능 저하), Mycoplasma, 요네병균, 분만 스트레스, 고사리·진균독 같은 독소, 아연·셀레늄·구리·비타민 E·A 결핍과 열량 부족, 수주간의 한랭·고온도 원인이다. 소는 글루코코르티코이드에 매우 민감하여 덱사메타손 20 mg 이상 1회로 24시간 안에 스트레스 백혈구상(호중구증가, 림프구·호산구감소)이 생긴다. 다만 케토시스 용량 0.02 mg/kg 1회는 의미 있는 면역 손상이 없다. 후산정체, 케토시스, 지방간 소도 호중구 기능이 떨어진다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">86.</span><span>림프절 비대 — 감별<span class="hang">염증성: 배액 부위 감염에 반응하며 급성은 열감과 통증이 있다. Trueperella pyogenes, 방선균증, 결핵, C. pseudotuberculosis 궤양성 림프관염, Prototheca(인두후 림프절이 3~4배, 밝은 녹색), 악성카타르열, 산발성 소뇌척수염, 타일레리아병, 심내막염이 원인이다. Mycoplasma wenyonii는 첫 비유 초~중기 미경산우에 발열, 슬전 림프절 비대, 하지·유두·유방 오목부종을 일으키고 7~10일에 사라지며 옥시테트라사이클린 1회에 반응한다.</span><span class="hang">종양성: 성우의 지방병성 림프육종(다발성 표재·내장 림프절, 표적 장기 병변, BLV 양성, PL), 2세 미만의 산발성 백혈병(송아지형 전신 림프절 비대, 흉선형).</span><span class="hang">옆구리 혈림프절 비대는 대개 양성 소견이다. 비대 림프절은 인두후(흡기성 호흡곤란), 종격(고창증), 기관 압박을 일으킨다.</span><span class="hang">세침흡인·배양으로 염증과 종양을 구별하되 흡인이 반응성으로 나오면 생검한다. 초음파, CBC(PL, 미성숙 림프구), BLV 혈청을 함께 본다.</span></span></p></div>
</div>
`;
}
function med_uroHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 비뇨기</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>비뇨기 검사 — 기본 원칙<span class="hang">소변검사와 혈청 요소질소·크레아티닌 측정은 비뇨기 검사에 반드시 포함한다. 가장 단순하고 중요한 기능검사는 소변을 보는지 확인하는 것이다.</span><span class="hang">농장동물에서는 방광·요도 질환이 신장 질환보다 흔하고 중요하다. 신부전은 신우신염, 색전성 신염, 아밀로이드증, 신증의 후유증으로 가끔 생긴다.</span><span class="hang">시험지(딥스틱)와 굴절계는 저비용 현장검사로 우수하며 원심 침사의 현미경 검사를 함께 한다. 원주는 쉽게 부서지므로 채취 직후 본다.</span><span class="hang">케톤 검사용으로 받은 소변으로 pH·잠혈·비중·백혈구를 함께 선별하면 신우신염 등 요로 질환을 잘 찾아낸다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>채뇨 방법<span class="hang">암소는 꼬리를 건드리지 않고 회음부와 음순 아래끝을 위로 부드럽게 문지르면 배뇨한다. 누워 있던 소를 조용히 일으킨 직후 하면 성공률이 100%에 가깝다. 수소·거세우는 포피구를 문지르고 따뜻한 물을 끼얹는다.</span><span class="hang">푸로세미드(furosemide) 0.5~1.0 mg/kg 정맥주사 후 약 20분이면 대부분 배뇨한다. 배양에는 쓸 수 있으나 성분이 크게 변하고, 탈수 동물에는 극히 조심한다.</span><span class="hang">자연배뇨와 도뇨 시료는 일상 검사에 동등하게 유용하고, 배양에는 무균 도뇨 시료가 낫다. 도뇨 시료는 처음 20 mL 정도를 버린다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>암소 도뇨 요령<span class="hang">외요도구 복측에 요도하게실(suburethral diverticulum)이 있다. 손가락을 게실에 넣어 카테터 끝을 게실 위로 넘겨 외요도구로 유도한다. 지름 0.5 cm의 단단한 관(인공수정 피펫)이 쓰기 좋다. Bovine Medicine은 18 G 개용 카테터와 광원 달린 질경을 기술한다.</span><span class="hang">장기 유치(3일)에는 24~28 Fr 폴리 카테터에 인공수정 피펫을 심지로 넣어 삽입하고 풍선을 60~75 mL로 채운다. 작으면 요도로 밀려 빈뇨·배뇨곤란·탈출이 생긴다. 유치 1일당 요로감염 발생률이 3%이므로 소변을 주기적으로 본다.</span><span class="hang">회음부를 희석 포비돈요오드나 클로르헥시딘으로 닦고 멸균 장갑을 쓴다. 수소·어린 송아지는 요도게실과 가는 요도 때문에 투시 없이는 도뇨가 거의 안 된다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>직장·질 촉진<span class="hang">좌신의 뒤쪽이 직장으로 촉지되고, 크게 비대하면 오른쪽 겸부 위쪽에서도 만져진다. 우신은 아주 커지지 않으면 닿지 않는다.</span><span class="hang">좌신의 크기, 분엽 소실, 통증, 물렁함, 동맥 박동을 본다. 분엽이 유지된 채 커지면 아밀로이드증·사구체신염, 분엽이 소실되면 신우신염·림프종·수신증을 생각한다(Rebhun).</span><span class="hang">요관은 정상에서 촉지되지 않으며, 굵어지면 요관염·수요관이다. 질을 통해 골반 앞끝 위로 요관을 굴리듯 만지면 직장보다 미세한 비대를 찾는다.</span><span class="hang">방광은 팽만, 벽 비후, 결석, 파열 후 수축을 본다. 수소 폐색성 요석증에서는 골반 요도가 커지고 아프며 박동한다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>초음파·신생검·내시경<span class="hang">경피는 2.5~3.5 MHz, 경직장은 5~10 MHz 탐촉자를 쓴다. 우신은 오른쪽 겸부·12번 늑간에서 경피로, 좌신·요관·방광은 경직장으로 가장 잘 보인다. 정상 방광벽은 2 mm 미만이다. 내시경은 방광에 공기를 넣으므로 초음파를 먼저 한다.</span><span class="hang">신생검: 좌신을 직장으로 오른쪽 겸부까지 밀어 고정하고 뒤극에 생검침을 넣는다(깊이 우신 약 3 cm, 좌신 약 7 cm). 초음파 유도로 오른쪽에서 하는 것이 낫다(Rebhun). 신우신염은 신주위 농양 위험으로 금기이고, 응고장애 의심 시 응고검사를 먼저 한다.</span><span class="hang">생검 합병증은 신주위 출혈과 장 천공이며, 소의 치사율은 복강경 2.1%, 비유도·초음파 유도 0%로 보고되었다. 원인이 불확실하고 결과가 치료나 예후 판정을 바꿀 때만 한다.</span><span class="hang">암소는 방광내시경이 쉽고, 10시·2시 방향의 양쪽 요관구에서 소변을 따로 받아 좌우 신장을 평가할 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">6.</span><span>소변검사 해석 — 요비중<span class="hang">정상 범위는 1.015~1.035이고, 고질소혈증이 신전성이면 1.020을 넘어야 한다(Constable).</span><span class="hang">만성 신질환은 1.008~1.012(혈장 비중, 등장뇨)로 고정되어 24시간 절수나 대량 급수에도 거의 변하지 않는다. 1.008 미만(저장뇨)은 희석 능력이 남았다는 뜻으로 등장뇨보다 신기능이 좋다는 징후다.</span><span class="hang">Rebhun: 탈수·고질소혈증 소의 등장뇨(1.006~1.014)는 신기능 장애다. 급성 신부전은 등장 범위를 벗어날 수 있으나 탈수가 있어도 1.022를 넘지 않는다. 편측 신질환만으로는 대개 등장뇨가 되지 않는다.</span><span class="hang">건강한 비유우와 우유 먹는 송아지는 원래 비중이 낮다(1.004~1.015). 1.025를 넘으면 탈수를 고려한다.</span><span class="hang">수액은 비중을 직접 바꾸므로 탈수 동물은 치료 전에 반드시 잰다. 단백·포도당이 많으면 굴절계 비중이 부정확하다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>요 pH<span class="hang">생리 범위 4.5~9.0, 초식동물은 보통 7.0~8.5다. 고곡물 사료는 6.0~7.0, 산성화 사료는 5.0까지 내려간다.</span><span class="hang">반추류 요 pH는 요중 강이온차로 정해진다. 칼륨(가장 큰 효과)·나트륨·마그네슘·칼슘이 많으면 오르고 염소·황산이 많으면 내린다. 산성뇨는 항상 요중 칼슘 배설 증가를 동반한다.</span><span class="hang">Rebhun: pH 8 초과는 칼륨(조사료) 섭취가 많다는 뜻이다. 분만 전 음이온 사료를 먹는 홀스타인은 평균 6.2~6.8, 저지는 5.8~6.3이 목표이고, 5.0~5.5면 비보상성 대사성 산증으로 건물섭취가 준다. 고능력 비유우 여러 두가 7 이하면 아급성 반추위산증을 의심한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">8.</span><span>소변검사 해석 — 단백뇨<span class="hang">초식동물의 알칼리 요는 시험지 단백에 항상 위양성(trace~1+)을 낸다. 설포살리실산 검사나 요단백/요크레아티닌비(UP:UC)로 확인한다.</span><span class="hang">초유를 먹은 송아지는 생후 40시간(Rebhun은 2일)까지 생리적 단백뇨가 있다. 분만 직후 암소의 자연배뇨 시료는 자궁액·질 잔류물로 대개 단백 양성이다.</span><span class="hang">대량·지속성 단백뇨는 진행된 신아밀로이드증과 사구체신염의 특징이고, 근위세뇨관 손상만 있으면 경미하다.</span><span class="hang">UP:UC 2 초과를 대부분 종에서 사구체 누출로 보나 소의 정상치는 없다. Rebhun은 급성 세뇨관 괴사 소도 3을 넘은 예가 있어 이것만으로 사구체·세뇨관 질환을 나누지 말라고 하고, Constable은 대량 단백뇨에서 13 미만이면 세뇨관성 쪽이라고 기술한다.</span><span class="hang">원주가 있거나 신장 형태 이상이 있으면 신성 단백뇨로 판단하기 쉽다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>당뇨·케톤뇨<span class="hang">포도당 신역치는 약 150 mg/dL다. 혈당이 정상인데 당뇨가 있으면 근위세뇨관 이상이다. 아미노글리코사이드 신독성 초기에 나타나 고혈당 없는 동물에서 싸고 실용적인 선별검사가 된다.</span><span class="hang">제4위 염전·소장 폐색 같은 중증 질환, 포도당 정맥주사, 부신피질호르몬, 스트레스에서도 나온다. Rebhun은 페니실린·테트라사이클린 같은 환원물질의 위양성도 기술한다. 다뇨와 당뇨가 함께 있으면 대개 신증이다.</span><span class="hang">요 케톤 시험지는 아세토아세트산에 반응하며 케토시스에 대해 민감도 약 78%, 특이도 98%다. 혈중 BHBA 1.2 mmol/L 이상이면 케토시스다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>침사 — 백혈구·원주·세균·결정·GGT<span class="hang">고배율 시야당 백혈구 1~5개는 정상이다. 육안적 농뇨는 신우신염·방광염에서 가장 흔하고, 분만 후 자연배뇨 시료는 오로 오염이 흔하다. 송아지 농뇨는 흔히 배꼽 잔존물 감염과 관련된다.</span><span class="hang">원주는 신장 병변이 있을 때만 생긴다. 초자원주는 중증 신증, 과립원주는 손상된 세뇨관 상피에서 유래하며 알칼리 요에서 쉽게 녹는다.</span><span class="hang">세균뇨 기준: 자연배뇨 3만 cfu/mL 초과, 도뇨 1,000 cfu/mL 초과(Constable). Rebhun은 도뇨 1,000/mL, 중간뇨 1만/mL 초과를 쓴다. 도축우 방광 소변 13%에서 병변 없이 세균이 나와 정량이 중요하다.</span><span class="hang">탄산칼슘·삼중인산염 결정은 정상 요에도 흔하다. 아주 많고 자극 증상이 있을 때만 의미가 있다.</span><span class="hang">요 GGT는 근위세뇨관 상피 파괴를 신기능 저하 전에 찾는 가장 이른 지표이고, 아미노글리코사이드 투여 동물에서 가장 민감하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>적색뇨 감별 — 혈뇨<span class="hang">시험지 잠혈 칸은 혈뇨·혈색소뇨·근색소뇨를 구분하지 못하므로 요 색, 적혈구 침전, 침사로 가린다. 희석 요에서는 적혈구가 녹으므로 반드시 현미경으로 확인한다.</span><span class="hang">원인은 신전성(신장 외상, 패혈증), 신성(사구체신염, 신경색, 독성 세뇨관 손상, 신우신염), 신후성(요석증, 방광염)이다. 소에서 흔한 것은 C. renale 신우신염·방광염, 비특이적 방광염, 효소성 혈뇨다.</span><span class="hang">신장·방광·근위요도 병변은 배뇨 끝 무렵에, 요도 중간·원위부 병변은 배뇨 시작 때 출혈한다.</span><span class="hang">암소 자연배뇨 시료는 생식기 출혈로 오염될 수 있어 필요하면 도뇨한다. 송아지는 요막관 잔존물 감염을 미세혈뇨 원인으로 고려하고, 악성 카타르열은 신혈관염·출혈성 방광염으로 혈뇨를 낸다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>혈색소뇨<span class="hang">혈관내 용혈로 혈장 혈색소가 신역치를 넘을 때만 나오므로 혈색소뇨가 보이면 혈장은 이미 분홍색이다(오래되면 황달). 침사에 적혈구가 없다.</span><span class="hang">원인(Rebhun): 송아지 수중독, 저장성 수액, 양파·라이그라스 중독, 세균성 혈색소뇨, 송아지 렙토스피라증, 바베시아·타일레리아, 산후 혈색소뇨, 식물·중금속 중독. 질산염·염소산염 중독은 메트헤모글로빈뇨도 낸다.</span><span class="hang">용혈성 빈혈의 요독증은 혈색소 원주보다 신혈관 수축에 의한 허혈성 세뇨관 신증이 주원인이다.</span><span class="hang">정상 색 요가 깔짚에서 몇 분 뒤 붉게 변하면 유채박 같은 사료 유래 색소다(잠혈 음성).</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>근색소뇨<span class="hang">근색소(분자량 16,500)는 혈색소(64,000)보다 작아 쉽게 여과되므로 혈장은 변색되지 않고 요만 진갈색이 된다.</span><span class="hang">기립불능우 근병증, 커피위드(Cassia occidentalis) 중독, 셀레늄 결핍 백근증에서 보인다(Rebhun). Constable은 어린 동물 근이영양증에서는 흔하지 않다고 기술한다.</span><span class="hang">잠혈 양성, 침사 적혈구 없음, 혈장 정상 색, 혈청 CK 상승이면 근색소뇨다. 저혈압이 겹친 중증 근병증에서 급성 신손상을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>적색뇨 감별 요약<table class="bxt"><tr><th>소견</th><th>혈뇨</th><th>혈색소뇨</th><th>근색소뇨</th></tr><tr><td>시험지 잠혈</td><td>양성</td><td>양성</td><td>양성</td></tr><tr><td>침사 적혈구</td><td>있음</td><td>없음</td><td>없음</td></tr><tr><td>혈장 색</td><td>정상</td><td>분홍~적색, 후에 황달</td><td>정상</td></tr><tr><td>동반 소견</td><td>요로 병변 소견</td><td>빈혈·용혈</td><td>CK 상승, 근병증</td></tr></table></span></p><p class="bx-num"><span class="bxn">15.</span><span>소의 급성 용혈성 질환 감별<table class="bxt"><tr><th>질병</th><th>역학</th><th>핵심 소견</th></tr><tr><td>렙토스피라증</td><td>전 연령, 방목</td><td>발열, 적색 유즙, 유산, 24~48시간 내 폐사</td></tr><tr><td>산후 혈색소뇨</td><td>분만 후 4~6주 고능력우</td><td>무열, 유즙 정상, 12~48시간 내 폐사, 저인산혈증</td></tr><tr><td>세균성 혈색소뇨</td><td>여름 방목 성우</td><td>발열, 복통, 2~4일 내 폐사</td></tr><tr><td>바베시아증</td><td>진드기, 상재지</td><td>발열, 황달, 2~3주 경과, 혈액도말</td></tr><tr><td>아나플라즈마증</td><td>여름, 곤충 매개</td><td>혈색소뇨 없음, 황달·발열</td></tr><tr><td>만성 구리중독</td><td>장기 구리 투여</td><td>심한 황달, 무열</td></tr><tr><td>냉수 용혈</td><td>음수 제한 뒤 냉수 다량 송아지</td><td>섭취 1시간 내 급발, 무열</td></tr><tr><td>유채·케일 중독</td><td>가을 유채 방목</td><td>초급성, 무열</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>혈청 검사 — 요소질소(BUN)<span class="hang">사구체 여과율의 간단한 추정치지만 사료 단백, 수화 상태, 위장관 요소 대사의 영향을 받는다. 반추류는 요소를 침으로 분비해 반추위에서 재이용하므로 GFR 지표로 신뢰성이 떨어진다(Bovine Medicine).</span><span class="hang">탈수는 헨레고리 요소 재흡수를 늘려 GFR과 별개로 요소를 올린다. 소는 신전성 상승이 신질환보다 더 높을 수 있는데, 만성 질환에서는 침 분비·반추위 대사·섭식 감소로 요소가 낮아지기 때문이다.</span><span class="hang">환산: 요소질소 1 mg/dL = 0.357 mmol/L, 요소질소 = 요소 × 2.14. 낮은 BUN은 간부전, 저단백 사료, 반추위 에너지·단백 불균형에서 나온다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>크레아티닌<span class="hang">근육 크레아틴인산의 분해 산물로 거의 전부 신장으로 배설되어 반추류에서는 요소보다 나은 GFR 지표다. GFR이 절반으로 줄면 크레아티닌은 두 배가 된다.</span><span class="hang">요소·크레아티닌은 네프론의 60~75%가 파괴될 때까지 정상 범위를 크게 넘지 않는다.</span><span class="hang">근육량을 반영해 수소가 가장 높고 신생우·악액질 동물이 가장 낮다. 근육이 많은 황소는 정상 신기능에서도 기준치를 넘을 수 있다. 낮은 값은 과수화·기아에서 나온다.</span><span class="hang">기저치보다 0.3 mg/dL 이상 오르면 의미가 있으며, 신독성 약물을 쓰는 정상 수화 동물의 신독성 판정 기준이다(Constable, Rebhun). 이때는 재수화하고 신독성 약물을 피한다.</span><span class="hang">환산: 1 mg/dL = 88.4 µmol/L. 야페 반응은 혈청 크레아티닌을 다소 과대평가한다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>소의 기준치<table class="bxt"><tr><th>항목</th><th class="c">기준치</th><th>출처</th></tr><tr><td>BUN</td><td class="c">10~20 mg/dL</td><td>Rebhun(Divers 1982)</td></tr><tr><td>크레아티닌</td><td class="c">0.5~2.0 mg/dL</td><td>Rebhun(Divers 1982)</td></tr><tr><td>크레아티닌(젖소)</td><td class="c">1.1~1.5 mg/dL</td><td>Rebhun(대부분 검사실)</td></tr><tr><td>요소 / 크레아티닌</td><td class="c">2.1~9.6 mmol/L / 90~120 µmol/L</td><td>Bovine Medicine</td></tr><tr><td>염소 / 나트륨 / 칼륨</td><td class="c">97~111 / 132~152 / 3.9~5.8 mEq/L</td><td>Rebhun(Divers 1982)</td></tr><tr><td>칼슘 / 인</td><td class="c">9.4~12.2 / 2.3~9.6 mg/dL</td><td>Rebhun(Divers 1982)</td></tr><tr><td>GFR(요오딕사놀)</td><td class="c">성우 2.8, 송아지 2.3 mL/kg/분</td><td>Rebhun</td></tr><tr><td>나트륨 분획배설</td><td class="c">1% 미만(흔히 0.2% 미만)</td><td>Constable</td></tr><tr><td>나트륨 분획배설</td><td class="c">대개 1% 이하, 비유 최성기 3%까지</td><td>Rebhun</td></tr><tr><td>나트륨 분획배설</td><td class="c">0~4%</td><td>LAIM</td></tr></table></span></p><p class="bx-num"><span class="bxn">19.</span><span>고질소혈증 — 신전성·신성·신후성 감별<span class="hang">요소·크레아티닌 상승만으로는 구분할 수 없고, 치료 전 요비중을 함께 보는 것이 가장 실용적이다.</span><span class="hang">신전성: 농축뇨(비중 1.020 초과 Constable, 1.022 초과 Rebhun)를 내고 수액에 반응한다. 정맥수액 중 저장뇨(대개 1.006 미만)를 내도 희석 능력이 있으므로 신전성이다(Rebhun).</span><span class="hang">신성: 탈수에도 농축되지 않는다(등장뇨, 1.022 이하). 신후성: 요도 폐색·방광 파열로 대개 신체·직장검사에서 명백하다.</span><span class="hang">요소/크레아티닌 비가 높으면 신전성을 시사하나 반추류에서는 민감하지 않다.</span><span class="hang">분획배설(FE) = (요중 X ÷ 혈청 X) ÷ (요중 크레아티닌 ÷ 혈청 크레아티닌) × 100. 나트륨 FE가 세뇨관 기능의 가장 유용한 지표이나 연령·사료·비유 단계 영향이 커서 비슷한 상태의 동거우와 비교하고, 수액 중에는 해석하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>기타 신기능 검사<span class="hang">요오헥솔 150 mg/kg 정맥주사 후 3·4시간 또는 4·6시간 채혈로 혈장 청소율을 구한다. 송아지는 요오딕사놀 40 mg/kg 후 1·2·3시간 채혈한다.</span><span class="hang">절수시험은 고질소혈증 없는 등장뇨 동물에서만 하고, 비중 1.015~1.020 초과, 크레아티닌 0.3 mg/dL 이상 상승, 체중 5% 이상 감소 시 중단한다.</span><span class="hang">복수 크레아티닌이 혈청의 2배 이상이면 요로 확정이다. 1% 메틸렌블루 30 mL를 방광에 넣은 뒤 복수가 푸르지 않으면 요관·신장 파열을 시사한다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>요독증의 임상상<span class="hang">고질소혈증은 증상 없이 수치만 오른 상태이고, 요독증은 신부전 말기의 임상 상태다.</span><span class="hang">침울, 식욕부진, 근무력·떨림, 호흡수·깊이 증가, 말기 탈수에 의한 빈맥을 보이며 체온은 정상이다. 소는 흔히 누워 있고 중증 말기에는 출혈 경향이 있다. 암모니아 구취는 실제로 드물게 감지된다.</span><span class="hang">말기에는 혼수, 체온 저하 후 조용히 폐사한다. 요독성 뇌증은 일부에서 발작·떨림·이상행동을 일으키며, Rebhun은 치료한 소가 모두 폐사했다고 기술한다.</span><span class="hang">실험적 양측 신적출 소에서 요소는 하루 평균 53 mg/dL, 크레아티닌은 약 3.5 mg/dL씩 올랐고, 침 분비 덕분에 인·칼륨은 대체로 변하지 않았다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>급성 신손상 — 개념과 허혈성 원인<span class="hang">패혈·저혈압·탈수 소에서 흔하지만 대개 발견되지 않는다. 신관류 감소, 더 흔하게는 염증 매개물질에 의한 신내 혈류역학 변화와 세뇨관 상피 기능장애로 생긴다(Rebhun). 패혈증과 탈수가 겹칠 때 신부전이 더 흔하다.</span><span class="hang">평균 동맥압이 60 mmHg(신혈류 자동조절 하한) 아래면 GFR이 줄고 요소가 오른다(신전성). 초기에는 가역적이지만 심하고 길면 영구 손상이 된다. 근위세뇨관이 허혈에 가장 민감하다.</span><span class="hang">원인: 쇼크, 탈수, 급성 출혈, 급성 심부전, 송아지 설사, 극심한 반추위 팽창. 혈색소뇨성 신증도 주로 신혈관 수축에 의한다.</span><span class="hang">위장관 폐색·설사로 심하게 탈수된 소는 신경색·신유두 괴사가 흔하지만, 원발병을 치료하고 탈수를 교정하면 비교적 양성이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>허혈성 신증 — 증상과 진단<span class="hang">원발병 증상에 가려진다. 수액·수혈 반응이 나쁘거나 설명되지 않는 침울이 있으면 신장 관여를 조사한다.</span><span class="hang">순환을 교정한 뒤 소변검사와 요소·크레아티닌을 연속 측정한다. 단백뇨가 실질 손상의 초기 지표이고, 핍뇨기 뒤 저비중 요가 다량 나오면 대개 회복 징후다.</span><span class="hang">탈수 환자의 요가 농축되지 않으면 허혈성 손상을 시사한다. 비가역 변화 뒤에는 다른 신질환과 임상적으로 구분할 수 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">24.</span><span>독성 신증 — 원인<span class="hang">신장은 심박출량의 약 20%를 받고 배설 물질을 농축해 독소에 취약하다.</span><span class="hang">금속(수은, 비소, 카드뮴, 셀레늄, 유기구리, 납), 항균제(아미노글리코사이드, 테트라사이클린, 설폰아마이드), NSAID, 일부 벤즈이미다졸, 모넨신, 비타민 C·D 과다, 칼슘제 과용.</span><span class="hang">식물·곰팡이: 참나무 잎·도토리(탄닌), 수산염(식물·곰팡이·에틸렌글리콜), 비름(Amaranthus), 사탕무, 오크라톡신·시트리닌. 내인성으로 혈색소·근색소.</span><span class="hang">대부분의 독혈증·패혈증도 일시적 신증을 일으키며 손상이 작으면 완전히 회복된다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>아미노글리코사이드 신독성<span class="hang">근위세뇨관 인지질 막에 축적되어 솔가장자리 효소 소실, 단백뇨, GFR 감소, 고질소혈증을 일으키며 대개 10일 넘는 장기 투여 때 생긴다. 송아지에서 네오마이신·겐타마이신 과량 투여로 신증이 생긴다.</span><span class="hang">위험인자: 고용량, 장기 투여, 탈수·기존 신장애, 푸로세미드 등 신독성 약물 병용, 높은 트로프 농도, 아주 어리거나 늙은 개체, 대사성 산증·저나트륨·저칼륨. 세뇨관 재생으로 대체로 가역적이다.</span><span class="hang">초기 지표는 당뇨와 요 GGT 상승이다. 휴약기간이 매우 길어 소에는 드물게 쓰며, 미국 소 임상수의사회는 자발적 사용 금지를 시행하고 있다.</span><span class="hang">불가피하면 크레아티닌에 맞춰 간격을 늘린다. 젖소 기준 1.1~1.5인데 1.8 mg/dL이면 GFR이 약 30% 줄었다고 보고 간격을 30% 이상 늘리며 수액을 함께 준다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>옥시테트라사이클린 신독성<span class="hang">사용 빈도 때문에 소에서 약물성 급성 신부전의 가장 흔한 원인으로 보인다(Rebhun). 비정상 고용량, 또는 권장 용량이라도 탈수된 소에 줄 때 가장 흔하다.</span><span class="hang">프로필렌글리콜·폴리비닐피롤리돈 용매가 신관류를 줄여 독성을 가중시킬 수 있다. 희석하지 않은 프로필렌글리콜 제제를 빠르게 정맥주사하면 용혈·혈색소뇨가 생긴다.</span><span class="hang">유효기간이 지난 테트라사이클린은 분해되어 판코니 증후군과 당뇨를 일으킨다. 장기지속형 제제의 매일 반복 투여도 독성을 낸다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>NSAID와 신장<span class="hang">신장 프로스타글란딘은 저혈압·탈수 때 관류를 유지하는 보호 작용을 하며, 플루닉신 같은 NSAID는 이를 억제한다. 신유두 괴사가 대표적이고 경색·세뇨관 신증도 생긴다.</span><span class="hang">탈수와 저알부민혈증(비결합 약물 증가)이 위험을 키운다. 수액으로 관류가 회복되지 않는 한 중증 탈수 소에는 감량하거나 쓰지 않되, 중증 그람음성 유방염·자궁염 같은 패혈증에서는 이득이 더 클 것이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>기타 독성 원인<span class="hang">설파제는 세뇨관을 손상하고 그 안에 침착한다. 저칼슘혈증 소(특히 저지)에 칼슘 용액을 과도하게 주면 드물게 세뇨관 신증과 혈관·심근 석회화가 생긴다.</span><span class="hang">참나무 중독: 미국 소의 식물성 신부전 원인 1위로, 방목 육성우가 가을 도토리나 봄 새싹·잎을 먹고 걸리며 사료 부족 시 독성이 커진다. 신주위 부종이 흔하다. 크레아티닌 21 mg/dL였던 소가 수액으로 회복한 예가 있다.</span><span class="hang">비소 중독 156례에서 모든 소가 고질소혈증과 혈뇨를 보였다. 항생제·NSAID 사용력 없이 여러 두가 동시에 걸리면 독성 원인을 의심한다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>독성 신증 — 임상증상<span class="hang">침울, 식욕부진, 탈수, 기립불능 같은 비특이 증상이며, 패혈성 유방염·자궁염, 제4위 질환, 설사, 폐렴 같은 동반 병변에 가려진다.</span><span class="hang">급성은 핍뇨·단백뇨, 말기에는 요독증이다. 심한 설사가 있을 수 있다. 소는 지속적 경도 저칼슘혈증을 보이며 칼슘에 제한적으로만 반응하고, 중증은 출혈 경향(공막·질 출혈, 파종성 혈관내응고)을 보인다.</span><span class="hang">일부는 다뇨를 보이는데, 탈수된 소가 희석뇨를 자주 본다면 신기능 이상의 단서다.</span><span class="hang">직장검사에서 좌신 비대와 신주위 부종(예후 불량 소견)을 촉지할 수 있다. 초음파는 대개 특이 소견이 없다.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>독성 신증 — 임상병리<span class="hang">소변 이상이 요소·크레아티닌 상승보다 먼저 온다. 초기에는 단백뇨, 당뇨, 효소뇨, 혈뇨가 나오고 가장 이른 것은 요 GGT다.</span><span class="hang">탈수에도 요비중이 등장 범위(대부분 1.006~1.014, 항상 1.022 이하)이고 적혈구·백혈구·과립원주·단백뇨가 있다.</span><span class="hang">저염소혈증이 흔하고 장폐색보다 심할 수 있다(혈청 염소 50 mEq/L인 예). 저칼륨·저나트륨·저칼슘·고인산·고마그네슘혈증과 고섬유소원혈증도 흔하다. Blackwell은 대사성 알칼리증을 든다.</span><span class="hang">Rebhun이 인용한 급성 신질환 소 22례에서 BUN 14~466 mg/dL, 크레아티닌 2.2~33.0 mg/dL였고, 요비중은 1례(1.029)를 빼면 모두 1.021 이하였다.</span><span class="hang">신생검이 가장 확정적이다. 부검에서 신장은 붓고 절단면이 축축하며 신주위 부종이 뚜렷하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>급성 신부전 치료 — 원칙<span class="hang">신독성 약물을 끊고 다른 신독성 약물을 피하며 원발병을 함께 치료한다. 핵심은 적극적 수액으로 신관류를 확보하고 이뇨를 일으키는 것이다.</span><span class="hang">저염소·저칼륨·저나트륨이 흔하므로 생리식염수에 KCl 20~40 mEq/L를 더해 많이 쓴다(Rebhun). 500 kg 소가 10% 탈수면 탈수 교정에만 50 L, 첫 24시간 총 80~100 L가 필요할 수 있다.</span><span class="hang">고장식염수 2 L를 먼저 주어 신관류를 빨리 개선할 수 있다. 정맥수액을 계속하기 어려우면 그 뒤 전해질 용액을 대량 반복 위관 투여한다.</span><span class="hang">수액 후 수 시간 안의 다뇨는 좋은 징후지만 GFR 회복을 보장하지 않는다. 직장검사·초음파로 방광을 반복 확인해 요 생산을 감시한다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>이뇨제·혈관작용약<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th>비고</th></tr><tr><td>푸로세미드</td><td class="c">성우 250~500 mg 정맥, 15~30분 간격 반복</td><td>수액 20~40 L 뒤에도 무뇨·핍뇨(Rebhun)</td></tr><tr><td>푸로세미드</td><td class="c">1~2 mg/kg 정맥·근육, 2~6시간마다</td><td>탈수 교정 뒤(Constable)</td></tr><tr><td>만니톨</td><td class="c">0.25~2.0 g/kg, 20% 용액 15~20분 정맥</td><td>사람에서는 효과 미입증</td></tr><tr><td>도파민</td><td class="c">3~5 µg/kg/분 지속 정맥</td><td>수액·이뇨제 무반응 시, Blackwell 2 µg/kg/분</td></tr><tr><td>도부타민</td><td class="c">2~5 µg/kg/분(5% 포도당)</td><td>도파민과 병용 가능(Rebhun)</td></tr></table><span class="hang">이뇨제는 탈수 교정 전에는 쓰지 않는다. 아미노글리코사이드 신독성에서는 푸로세미드가 독성을 키울 수 있다. 도파민 투여 중에는 혈압·심전도를 감시한다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>보조 치료<span class="hang">저칼슘혈증이면 칼슘을 신중히 주되, 고인산혈증이 심하면 저칼슘 증상이 있을 때만 준다. 수액 20 L당 50% 포도당 1 L를 더할 수 있다.</span><span class="hang">성우는 고칼륨혈증이 드물지만 설사·산증 송아지는 고칼륨혈증일 수 있으므로 반농도 생리식염수와 2.5% 포도당을 동량 섞어 중탄산나트륨을 더한다.</span><span class="hang">Blackwell: 칼슘·칼륨을 더한 등장 수액을 유지량(60 mL/kg/일)의 2배로 주고 크레아티닌이 정상화될 때까지(대개 2~3주) 유지하며 과수화를 감시한다.</span><span class="hang">비타민 B군을 자주(느린 정맥) 주고 반추위액 이식과 알팔파 가루 같은 기질 급여를 권한다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>경과와 예후<span class="hang">요소·크레아티닌을 매일 재며 이뇨 수액은 며칠에서 2주 한다. 독성 세뇨관 신증이 가장 잘 반응하지만 크레아티닌이 떨어지기까지 2~3일 걸릴 수 있다.</span><span class="hang">허혈성은 대개 예후 불량, 독성은 상대적으로 낫다(Blackwell). 대량 수액·이뇨제에도 요가 없으면 예후 불량이다.</span><span class="hang">고질소혈증이 오래갈수록 만성 신부전으로 이행하기 쉽다. 치료 반응과 신생검이 예후 판정의 최선이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">35.</span><span>만성 신부전 — 기전<span class="hang">남은 네프론의 여과가 늘어 재흡수 능력을 넘으면 일정 비중의 다량 요(용질 이뇨)가 나온다. 농축 불능에 따른 다뇨가 특징이다.</span><span class="hang">나트륨·염소가 계속 소실되어 결국 저나트륨·저염소혈증이 된다. 물 공급이 끊기거나 설사가 겹치면 쉽게 탈수되고 급성 신부전이 겹친다.</span><span class="hang">인 저류는 이차성 저칼슘혈증에, 황산 저류는 대사성 산증에 기여한다. 반추류는 칼륨을 침·분변으로 배설해 고칼륨혈증이 심각하지 않다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>만성 신부전 — 증상과 관리<span class="hang">심한 체중 감소, 무력, 식욕부진, 다뇨·다음, 하복부 부종이 공통이고 말기에 핍뇨로 바뀐다. 좌신이 작아진 것을 촉지할 수 있다(LAIM).</span><span class="hang">저나트륨·저염소혈증, 칼슘·칼륨은 낮을 수 있고 마그네슘·인은 정상이거나 높다. 중증은 대사성 산증, 경증은 대사성 알칼리증이다. 급성 신부전은 인이 대개 현저히 높다는 점이 다르다.</span><span class="hang">목표는 생명 연장이다. 식용 동물의 긴급 도축은 도체가 대개 부적합해 권장하지 않는다(Constable). 부종이 없으면 물과 소금을 자유 급여하고, 스트레스를 피하며, 고에너지·단백 균형 사료를 준다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">37.</span><span>신우신염 — 원인<span class="hang">대개 하부요로에서 올라간 상행성 세균 감염이며 젖소에서 가장 흔히 진단되는 신장 질환이다(Rebhun).</span><span class="hang">주 원인균은 Corynebacterium renale와 대장균이다. C. pilosum, C. cystitidis도 관여하며 외음부 상재균으로 여겨진다. LAIM은 C. cystitidis를 이 무리에서 가장 병원성이 강하다고 기술한다.</span><span class="hang">지금은 대장균이 다수라는 기술(Constable, Blackwell)과 C. renale가 가장 흔하다는 기술(LAIM 일부 연구)이 있다. Constable은 C. renale 감소를 농후사료에 따른 요 pH 저하, 베타락탐 보급, 도뇨 감소로 설명한다.</span><span class="hang">드물게 Trueperella pyogenes, Proteus, 연쇄상구균, 포도상구균, Klebsiella, Pseudomonas가 원인이다. 송아지는 제동맥 감염에서 신염·신농양이 생긴다.</span><span class="hang">C. renale는 하부 생식기 상재균으로 요로 점막 부착을 돕는 섬모(pili)가 있다. 보균우는 소변으로 오래 배출하고 균은 환경에서 50일 넘게 산다.</span><span class="hang">전파는 직접 접촉, 오염된 솔, 부주의한 도뇨, 오줌 튀김이다. 특정 종모우 사용 뒤 연발하고 인공수정으로 바꾸면 멈추는 예로 보아 교미 전파도 있다. 대장균은 분변 오염과 방어능 저하로 상행한다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>신우신염 — 역학·위험요인<span class="hang">대개 산발적이다. 우군 연간 발생률 0.5~1.5%(1개 우군 16%), 우군 유병률 0.3~2.7%다.</span><span class="hang">분만 후 수주~수개월의 성 암소에 가장 흔하다. 임상례의 약 75%가 유산·난산·산욕 감염 뒤에 생기고(Constable), 73%가 분만 후 90일 안에 생긴다(Blackwell). 송아지는 상행성 배꼽 감염, 수소·거세우는 요로 폐색의 합병증으로 생긴다.</span><span class="hang">위험요인: 난산·산과 처치 손상, 방광마비·요석증에 의한 요 정체, 비정상 음문 형태, 직장질루, 기질·자궁염, 임신, 우군 내 보균우, 교미 전파. 추운 계절과 고능력 우군에서 늘어난다.</span><span class="hang">케토시스 의심우의 체계적 도뇨가 발생 증가와 관련되었고, 도뇨 실습에 쓴 소의 10%에서 발병했다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>신우신염 — 기전<span class="hang">요 정체(염증 찌꺼기에 의한 요관 폐쇄, 임신 자궁 압박, 요석증)와 방광요관 역류가 상행을 돕는다. 상대적으로 저산소인 신우·수질이 먼저 침범되고 진행하면 피질로 퍼진다.</span><span class="hang">C. renale는 알칼리 요에서, 대장균은 산성 요(pH 6.0)에서 잘 부착한다. C. renale는 요소 분해로 요를 알칼리로 유지한다. 신장 감염 시 생기는 항체는 치유나 재감염 방어에 도움이 안 된다.</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>신우신염 — 임상증상<span class="hang">급성: 발열(39.7~40.8℃), 식욕부진, 유량 급감, 빈맥, 탈수. 일부는 발 구르기, 꼬리 흔들기, 배 차기, 등 구부림의 복통을 보여 분만 후 급성 복통 감별에 넣는다.</span><span class="hang">복통 발작은 몇 시간이면 지나가며, 고름·찌꺼기·응혈이 요관·신배를 막아 생긴다. 응혈이 방광·요도를 채우거나 음문으로 비어져 나오기도 한다(Rebhun).</span><span class="hang">더 흔하게는 서서히 시작해 수주에 걸쳐 체온이 오르내리고(약 39.5℃) 식욕이 변덕스러우며 살이 빠지고 유량이 준다.</span><span class="hang">소변 속 혈액·고름·점액·조직 찌꺼기가 가장 뚜렷한 소견이며 특히 마지막 부분에 많다. 배뇨가 잦고 흘리듯 보며 아파한다. 이상 소변과 외견상 회복이 번갈아 온다.</span><span class="hang">만성: 체중 감소, 거친 피모, 생산 저하, 설사, 다뇨, 빈혈이 보이고 신장 통증으로 등을 젖히거나 몸을 뻗는다. 하복부 부종이 생길 수 있다. 요로 증상 없이 체중 감소만으로 오는 예가 있어 소변검사가 필수다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>신우신염 — 직장·질·초음파 검사<span class="hang">초기에는 직장검사가 정상일 수 있다. 진행하면 방광벽 비후와 한쪽·양쪽 요관 비대가 촉지된다.</span><span class="hang">좌신이 가장 흔히 침범된다. 커지고 분엽이 없어지며 물렁하고 아프고 동맥 박동이 뚜렷할 수 있다.</span><span class="hang">질을 통해 방광목 위 요관 말단을 만지면 직장으로 놓치는 미세한 요관 비대를 찾을 수 있다(Rebhun).</span><span class="hang">초음파: 신배·신우 확장, 신우의 에코성 응집물, 결석, 급성은 신장 비대, 만성은 작고 불규칙한 신장, 낭성 변화, 요관 확장, 방광벽 비후. Rebhun은 침범 쪽 요관 확장이 가장 흔한 소견이라고 한다. 직장으로 닿지 않는 우신을 평가할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>신우신염 — 임상병리<span class="hang">혼탁뇨, 대부분 육안적 혈뇨, 단백뇨, 농뇨, 세균뇨가 있다. 요 pH는 대부분 8.5 초과, 비중은 1.008~1.021로 기록되었다(Constable).</span><span class="hang">그람 염색으로 예비 판정하고 정량 배양·감수성 검사가 가장 중요하다. 항생제를 최소 24~48시간 끊은 뒤 도뇨나 중간뇨로 받는다.</span><span class="hang">진행례에서 저알부민혈증과 고글로불린혈증(감염 6~14일 뒤 5.0 g/dL 초과)이 있다. 호중구 증가와 고섬유소원혈증은 일정하지 않다.</span><span class="hang">고질소혈증에 비농축뇨(Blackwell 1.020 미만, Rebhun 1.022 이하)가 겹치면 양측 침범과 신부전을 시사한다. 탈수(신전성)와 응혈에 의한 폐색(신후성)도 감별한다.</span><span class="hang">크레아티닌 1.5 mg/dL 초과와 BUN 100 mg/dL 초과면 예후가 매우 나쁘다. 경증·초기에는 두 수치가 신뢰할 지표가 아니다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>신우신염 — 감별<span class="hang">급성 복통형: 급성 장폐색(배변은 대개 정상, 직장검사로 장 이상 없음), 수소·거세우의 요로 폐색. 만성형: 외상성 제2위염.</span><span class="hang">혈뇨·농뇨: 방광염(전신 증상 없고 요관 정상), 색전성 신염, 요석증, 효소성 혈뇨, 산후 혈색소뇨, 아나플라즈마·바베시아, 렙토스피라.</span><span class="hang">배뇨곤란: 기질염, 자궁염, 질주위 농양, 골반 내 방광 감입, 외음 외상.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>신우신염 — 항균 치료<table class="bxt"><tr><th>약물</th><th class="c">용량·경로</th><th>비고</th></tr><tr><td>프로카인 페니실린 G</td><td class="c">22,000 IU/kg 근육 12시간마다, 또는 44,000 IU/kg 24시간마다</td><td>2~3주(Constable)</td></tr><tr><td>페니실린 Na·K염</td><td class="c">22,000~44,000 IU/kg 정맥 6시간마다</td><td>초급성·중증 초기</td></tr><tr><td>암피실린</td><td class="c">10 mg/kg 근육 24시간마다(Constable), 11 mg/kg 12시간마다(Blackwell·LAIM)</td><td>2~3주</td></tr><tr><td>아목시실린</td><td class="c">10 mg/kg 근육 24시간마다</td><td>2~3주</td></tr><tr><td>옥시테트라사이클린</td><td class="c">10 mg/kg 근육 24시간마다</td><td>2~3주, 신독성 주의</td></tr><tr><td>염화암모늄</td><td class="c">200 mg/kg 경구 24시간마다</td><td>요 산성화(Blackwell)</td></tr></table><span class="hang">C. renale는 페니실린에 일정하게 감수성이고, 대장균도 요중 농도가 매우 높아 시험관 내성이라도 효과가 있을 수 있다.</span><span class="hang">Rebhun: 도뇨 시료 채취 후 페니실린 22,000 U/kg 근육 12시간마다를 결과가 나올 때까지 준다. C. renale면 3주 계속하고, 대장균인데 72~96시간에 호전이 없으면 감수성에 따라 바꾼다. 아미노글리코사이드는 고질소혈증이 없고 허가 약물에 내성일 때만 예외적으로 쓴다.</span><span class="hang">최소 3주가 원칙이며 단기 치료는 만성 재발로 간다. 종료 1주(7~10일) 뒤 소변검사·배양으로 완치를 확인한다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>신우신염 — 보조 치료와 수술<span class="hang">수액은 신전성 고질소혈증을 교정하고 요로의 찌꺼기·세균을 씻어낸다. 신독성 항생제를 쓸 때 특히 중요하다.</span><span class="hang">요 pH 조절: C. renale면 요를 산성으로, 대장균이면 알칼리로 만들도록 사료를 바꾼다는 기술이 있다(Constable). Blackwell·LAIM은 요 산성화가 부착 억제에 도움이 될 수 있다고 한다.</span><span class="hang">내과 치료에 반응하지 않는 심한 편측 신우신염은 편측 신적출을 한다. 고질소혈증이 없고 반대쪽 신장이 정상이어야 하며 서서 국소마취로 할 수 있다. 남은 신장이 건강하면 성장·생산에 제한이 없다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>신우신염 — 예후와 예방<span class="hang">초기례는 충분한 치료로 영구 회복을 기대한다. 체형·식욕·유량 회복과 소변 맑아짐이 좋은 징후다. 진행례는 기껏해야 보통이고 재발이 흔하다(재발률 약 10%).</span><span class="hang">치료례의 치사율·비자발적 도태율은 18~47%로 보고되며, Blackwell은 치사율 약 18%, 도태율 약 33%를 든다. 양측 침범·고질소혈증, 방광마비·직장질루에 이은 경우, 만성례는 예후가 나쁘다.</span><span class="hang">예방: 불필요한 도뇨를 피하고 질검사·산과 처치를 위생적으로 하며 기구를 소독한다. 발병우를 격리하고 오염 깔짚을 처분한다. 자연교배 우군에서 늘면 인공수정으로 바꾸면 크게 줄 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">47.</span><span>색전성 신염<span class="hang">패혈증·균혈증 때 세균이 신장에 박혀 화농성 병소·신농양·경색을 만든다. 원발 병소는 심내막염, 자궁·유방·배꼽·복강의 화농 병소, 신생 송아지 대장균 패혈증이다.</span><span class="hang">다발성 색전이 실질 대부분을 파괴하거나 큰 감염 경색이 있을 때만 증상이 나며 독혈증과 원발병 증상이 주다. 큰 경색은 일시적 복통을 일으키고, 신우로 번지면 신우신염과 비슷해진다.</span><span class="hang">다른 신질환 징후 없이 단백뇨·원주·미세혈뇨가 갑자기 나오면 신경색을 시사한다. 탈수 환자에서 이런 소견이 보이면 재수화하고 신독성 약물을 피한다.</span><span class="hang">배양·감수성으로 항균제를 골라 7~14일 주고, 원발병을 함께 다스린다. 패혈 신생우에서는 신독성 약물을 특히 피한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>방광염 — 원인<span class="hang">방광 외상이나 요 정체가 있을 때 세균이 들어가 생긴다. 흔한 배경은 방광 결석, 난산, 오염된 도뇨, 임신 말기, 방광마비이고 균은 주로 대장균, 그다음 코리네박테리아다. 요 정체가 가장 중요한 소인이다.</span><span class="hang">난산은 천골신경 손상으로 방광 긴장을 떨어뜨리고 요도를 통한 직접 오염을 일으켜 젖소 방광염의 주요 위험요인이다(Rebhun).</span><span class="hang">송아지 방광염은 거의 항상 요막관 등 배꼽 잔존물의 감염이나 유착 때문이다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>방광염 — 증상과 진단<span class="hang">자주 소량씩 아프게 배뇨하고 흐름이 그친 뒤에도 몇 분간 배뇨 자세로 힘을 준다. 매우 급성이면 가벼운 복통·발열이 있을 수 있다. 회음부 요 짓무름, 음문 털의 모래 같은 결정이 보이기도 한다.</span><span class="hang">중증 소변은 혈액·고름이 섞이고 암모니아 냄새가 나며, 가벼우면 혼탁하기만 하다. 발열이 흔하지 않아 급성 신우신염과 구분되며 대개 아파 보이지 않는다.</span><span class="hang">직장검사에서 방광벽이 두꺼워 야구공~소프트볼 크기로 단단히 만져진다. 질 촉진상 요관이 정상이고 신장 소견이 없으면 신우신염을 배제한다. 결석도 직장·초음파로 찾는다.</span><span class="hang">시험지는 대개 잠혈·단백 양성이고 정량 배양으로 확진한다. 방광내시경으로 점막 병변을 본다.</span><span class="hang">송아지·재발성 방광염은 초음파로 요막관 농양과 방광 유착을 반드시 찾고, 배뇨 전후 방광을 비교해 잔뇨를 본다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>방광염 — 치료<span class="hang">배양·감수성에 따라 요에 농축되는 항균제를 쓴다. 결과 전에는 페니실린 22,000 U/kg이나 암피실린 11 mg/kg이 좋은 선택이다(Rebhun).</span><span class="hang">기간은 최소 7일, 가능하면 14일이고(Constable), Bovine Medicine은 2~3주를 기술한다. 치료 중과 종료 후 7~10일에 다시 배양한다.</span><span class="hang">방광 무력이 겹치면 폴리 카테터를 일시 유치한다. 물과 소금을 충분히 주고 음이온염 사료로 요 산성화와 이뇨를 유도할 수 있다(Rebhun).</span><span class="hang">배꼽·요막관 유착 송아지는 복부 정중 접근으로 방광을 떼어내고 병소를 절제한다. 만성례는 박멸이 어렵고 신장 침범이 흔해 예후가 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>방광마비<span class="hang">원인: 난산 중 골반 내 천골신경 손상, 승가나 칸막이에 의한 천골·꼬리뿌리 압궤, 림프종의 경막외 압박, 꼬리를 보정 손잡이로 세게 당기기. 큰 요도 폐색 뒤에는 긴장이 돌아오는 데 며칠 걸린다.</span><span class="hang">소에서 흔한 하위운동뉴런형은 방광 팽만, 요 흘림을 보이며 직장으로 쉽게 짜진다. 상위운동뉴런형은 방광이 팽팽하고 짜기 어렵다(광견병 소에서 관찰).</span><span class="hang">대개 방광염이 생기거나 번식검사 중 큰 방광이 촉지되어서야 알게 된다. 질에 요가 고여 질염과 수태 실패가 흔하다(Rebhun).</span><span class="hang">급성기에는 유치 폴리 카테터와 예방적 페니실린을 쓰고, 외상성이면 NSAID, 덱사메타손 10~20 mg 1일 1회 3일, 또는 경막외 덱사메타손 5 mg을 쓴다. 만성례는 재발성 방광염과 신우신염으로 예후가 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>악성 카타르열의 출혈성 방광염<span class="hang">양 헤르페스바이러스 2형에 의한 드문 형태로 대개 수개월 안에 양과 가까이 지낸 이력이 있다.</span><span class="hang">급발성 고열(41.1~42.2℃), 침울, 혈뇨, 배뇨곤란을 보이고 24~72시간 안에 폐사한다. 구강·눈 병변이 없을 수 있다. 전혈 PCR과 경쟁 ELISA로 확인한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>아밀로이드증 — 원인<span class="hang">농장동물에서는 다른 곳의 만성 화농 과정과 함께 생기는 AA 아밀로이드가 대부분이다. 전구물질은 간의 급성기 단백인 혈청 아밀로이드 A(SAA)지만 SAA 증가만으로는 생기지 않는다.</span><span class="hang">소는 외상성 제2위복막염, 자궁염, 유방염, 지간부란, 만성 폐렴, 농양과 관련된다. 다만 약 절반만 기여할 만한 만성 감염이 있었고 25두 중 5두는 동반 염증이 없었다.</span><span class="hang">일본의 4세 넘은 도축우 302두 중 5.0%에서 내장 AA 아밀로이드증이 있었다. Rebhun은 발병우가 4세 이상이라고 기술한다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>아밀로이드증 — 증상과 진단<span class="hang">대량 단백뇨에 따른 저단백혈증과 부종의 신증후군으로 나타난다. 체중 감소, 생산 저하, 대개 심한 설사, 턱밑·하복부 부종, 다음, 급속한 수척을 보인다. 식욕은 초기에 괜찮다.</span><span class="hang">설사는 장 아밀로이드 침착과 저알부민혈증에 따른 장벽 부종 때문이며 장 단백 소실로 저알부민혈증을 더 악화시킨다.</span><span class="hang">좌신이 크고 단단하며 분엽은 유지된다. 림프종·수신증·신우신염과 구분되지만 사구체신염도 분엽이 보존된다. 분만 후 2주 안에 나타나 2~5주 안에 폐사하는 경과도 있다.</span><span class="hang">극심하고 지속적인 단백뇨가 핵심이다. 혈청 알부민 1.0 g/dL 미만이면 부종이 흔하다. 저칼슘·저마그네슘혈증, 고섬유소원혈증, 고질소혈증, 저비중 요가 동반된다.</span><span class="hang">사구체신염과는 신생검·부검으로 구분하고 요네병 등 위장관 질환을 감별한다. 루골 요오드로 신장 절단면의 아밀로이드가 적갈색, 황산을 더하면 청색이 된다. 콩고레드 편광에서 녹색 복굴절을 보인다.</span><span class="hang">치료가 없고 치명적이다. 안티트롬빈 III 소실로 과응고가 생겨 신정맥 혈전으로 급사하기도 한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>사구체신염<span class="hang">소에서는 드물다. 만성 감염·농양의 면역복합체가 사구체를 손상해 단백 누출과 진행성 신부전을 일으킨다. 요네병, 소바이러스성설사, 렙토스피라증과 관련된 예도 있다.</span><span class="hang">한 가족의 전형매 3두가 18~30개월령에 신증후군으로 폐사한 유전성 의심 예, 생후 공통 항혈청을 맞은 5~8주령 육성우 집단에서 설사·부종·고혈압이 생긴 예가 있다(Rebhun).</span><span class="hang">체중 감소, 하복부 부종, 좌신 비대, UP:UC 3 초과 단백뇨를 보인다. 아밀로이드증과는 신생검으로 구분하며 아밀로이드증은 4세 이상, 사구체신염은 흔히 더 어리다.</span><span class="hang">진단될 즈음 대개 신부전이어서 치료가 제한적이다. 신부전 없는 일부 송아지가 부신피질호르몬에 반응했다는 일화가 있다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>신세뇨관산증·판코니 증후군<span class="hang">신세뇨관산증은 음이온차 정상의 고염소성 대사성 산증으로 의심하되, 생리식염수 대량 투여도 같은 산증을 내므로 주의한다. 살모넬라증 송아지와 옥시테트라사이클린 신부전 젖소 예가 있으며 중탄산(경구·정맥)으로 치료한다. 젖소 예는 5일간 중탄산 정맥수액과 중탄산 100 g 1일 2회 경구로 회복했다(Rebhun).</span><span class="hang">판코니 증후군은 근위세뇨관의 포도당·아미노산·인·중탄산 재흡수 장애로, 성장 지연 육성우에서 다뇨·다음, 혈당 정상인 당뇨, 인뇨, 아미노산뇨가 보고되었다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">57.</span><span>요석증 — 개요<span class="hang">곡류 위주 사료나 특정 초지의 반추류는 40~60%가 결석을 만들지만 대부분 무증상이다. 거세 수컷에서 결석이 요도를 막으면 치사율이 높은 외과 질환이 되므로 예방이 중요하다.</span><span class="hang">한우컨설팅지침서는 요결석증을 비육우 대사성 질환 중 가장 많이 발생하는 질병으로 기술한다. Rebhun은 비육우·방목우의 가장 중요한 비뇨기 질환이며 젖소는 송아지·거세우를 빼면 드물다고 한다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>요석증 — 결석 형성 요인<span class="hang">결석은 핵(nidus) 주위에 용질이 오래 침전·응결해 생기며, 여러 요인의 상호작용으로 생기고 단일 요인 과잉으로는 잘 재현되지 않는다.</span><span class="hang">핵 형성: 비타민 A 결핍이나 에스트로겐(초지, 사료, 제랄레논, 이식제)이 상피 탈락과 편평상피화생을 일으킨다. 비타민 A 결핍은 주요 원인이 아니라는 견해도 있다.</span><span class="hang">인: 소는 농후사료가 체중의 1.5%에 이르면 요 침전물이 생기고, 체중의 2.5%로 2개월 먹이면 결석이 생기기 시작한다. 펠렛은 침 분비를 줄여 침을 통한 인 배설을 줄이고 요중 인을 늘린다.</span><span class="hang">마그네슘이 많은 사료(일부 대용유)는 폐색성 요석증 증가와 관련되고, 이때 칼슘 보충이 결석을 막는다.</span><span class="hang">응결: 결석 유기기질(뮤코단백)이 접착제 역할을 하며 고농후·저조사료, 펠렛, 급속 증체가 이를 늘린다.</span><span class="hang">물: 농축뇨가 위험인자다. 급수 접근성·익숙함·수질이 나쁘거나 이유기·혹한기에 음수가 준다. 물의 경도(특히 마그네슘)와 광물질도 관여한다.</span><span class="hang">기타: 요 정체와 감염, 목화씨박·볏짚·마일로 수수, 몰아 먹이기, 비타민 D 과잉(Rebhun). 알팔파는 결석을 만든다는 견해와 막는다는 견해가 있다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>요석증 — 한우 자료의 원인 기술<span class="hang">사료의 칼슘에 비해 인이 높을수록 요중 인 배설이 는다. 밀기울 같은 강피류는 인이 높고 칼슘이 낮아 장기 과량 급여 시 위험하다. 인 과다는 혈중 칼슘 저하와 부갑상선호르몬 증가로 뼈의 칼슘·인 용출을 늘려 요중 인을 더 올린다.</span><span class="hang">농후사료 다급에 따른 산증으로 요 pH가 떨어지면 요중 인 농도가 늘어 결정화가 촉진된다고 기술한다. 이는 알칼리 요가 인산염 결석을 촉진한다는 Constable·LAIM의 기술과 다르다.</span><span class="hang">석회 성분이 많은 지하수, 규산염·수산염이 많은 간척지 볏짚·사료작물, 수단그라스 같은 수수류 다급도 원인이다. 오줌 중 인·마그네슘이 높은 것이 특징이다.</span><table class="bxt"><tr><th>사료 Ca %</th><th class="c">사료 P %</th><th class="c">요 P mg/dL</th><th class="c">요 Mg mg/dL</th><th class="c">요 P 배설 g/일</th></tr><tr><td>0.1</td><td class="c">0.6</td><td class="c">180</td><td class="c">37</td><td class="c">1.53</td></tr><tr><td>0.6</td><td class="c">0.6</td><td class="c">93</td><td class="c">45</td><td class="c">0.53</td></tr><tr><td>1.2</td><td class="c">0.6</td><td class="c">36</td><td class="c">59</td><td class="c">0.26</td></tr></table></span></p><p class="bx-num"><span class="bxn">60.</span><span>요석증 — 결석의 종류<table class="bxt"><tr><th>결석</th><th>주된 조건</th><th>특성</th></tr><tr><td>스트루바이트(인산마그네슘암모늄)</td><td>곡류 비육, 고마그네슘 사료</td><td>알칼리 요, pH 7.2 초과에서 결정화, 6.5 미만에서 용해</td></tr><tr><td>인회석(인산칼슘)</td><td>고인산 곡류 사료</td><td>알칼리 요</td></tr><tr><td>규산(실리카)</td><td>규산 많은 방목 초지(최대 6%)</td><td>pH 영향 적고 산성 요에서 오히려 생김, 소금으로 예방</td></tr><tr><td>탄산칼슘</td><td>클로버 초지, 알팔파, 수산염 식물</td><td>알칼리 요, 방사선 불투과</td></tr><tr><td>수산칼슘</td><td>반추류에서 극히 드묾</td><td>pH 영향 없음</td></tr></table><span class="hang">수산칼슘·탄산칼슘·규산은 방사선 불투과성이다. 스트루바이트는 Constable·Blackwell은 투과성, LAIM은 불투과성으로 기술한다. 방사선에 안 보여도 결석을 배제할 수 없다.</span><span class="hang">결석 성분은 섭취 원소에 좌우되므로 문제 지역에서는 성분을 분석한다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>요석증 — 요도 직경·거세·폐색 부위<span class="hang">결석 형성은 수소와 거세우가 비슷하지만, 폐색을 정하는 가장 중요한 요인은 요도 직경이다. 6개월령 거세우는 2개월령 거세우보다 요도가 8% 굵어 13% 더 큰 결석을 내보내고, 수소는 조기 거세우보다 44% 큰 결석을 통과시킨다.</span><span class="hang">한우컨설팅지침서는 거세를 6개월령 이후로 늦추기를 권한다. Constable은 거세 연기의 개선 효과가 크지 않을 것이라고 기술한다.</span><span class="hang">암컷은 요도가 짧고 넓어 폐색이 거의 없다. 거세우는 견인근(retractor penis) 부착부 근처의 S자 만곡 원위부에서 가장 흔히 막힌다. 한우 자료도 S자 만곡부를 호발 부위로 들고 신장·세뇨관은 드물다고 한다.</span><span class="hang">소는 대개 결석 하나가 폐색을 일으킨다. 비육 초기와 추운 날씨(음수 감소)에 발생률이 가장 높고, 산발하다가도 짧은 기간에 집단 발생할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>요석증 — 요도 폐색의 증상<span class="hang">배 차기, 뒷발 구르기, 꼬리 흔들기의 복통, 포피가 흔들릴 만큼의 음경 경련, 힘주기·끙끙거림·이갈기를 보이고 피 섞인 오줌 몇 방울만 나온다. 포피 털에 결정이 많이 붙어 있고 무뇨면 포피가 말라 있다.</span><span class="hang">한우 자료: 꼬리를 들고 돌아다니며 배뇨 자세를 취해도 오줌이 안 나오고, 뒷발을 앞에서 뒤로 휘두르듯 찬다. 뒤에서 보면 요도 팽창에 따른 파동이 보이기도 한다.</span><span class="hang">부분 폐색우(dribbler)는 피 섞인 오줌을 소량씩 자주 누며, 삼각형 결석으로 생기고 드물다.</span><span class="hang">직장검사에서 방광이 크게 팽만하고 골반 요도가 박동하며 아파한다. 이미 파열되었으면 방광이 커져 있지 않다. 포피구부터 S자 만곡, 회음부까지 음경 전체를 촉진해 아픈 종창을 찾는다.</span><span class="hang">요도게실과 판막 때문에 귀두에서 방광까지 카테터를 넣는 것은 거의 불가능하다.</span><span class="hang">완전 폐색이 약 36시간 이상이면 양측 수신증 위험이 있다(LAIM). 48시간 넘게 막혔거나 고질소혈증이 심하면 수술 전 신장 초음파를 하고, 심한 수신증이면 예후 불량이다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>요석증 — 요도 파열과 방광 파열<span class="hang">폐색을 풀지 않으면 대개 48시간(2~3일) 안에 요도나 방광 중 하나가 터진다. 매끈한 구형 결석은 방광 파열을, 불규칙한 결석은 요도벽 압박 괴사로 요도 파열을 잘 일으킨다.</span><span class="hang">요도 파열: 오줌이 하복벽·포피 피하로 새어 액체 종창(water belly)이 흉부까지 퍼질 수 있다. 처음엔 따뜻하고 아프지만 괴사하면 차고 통증이 없어지며 봉와직염·독혈증·피부 탈락이 온다. 농양, 탈장, 음경 혈종과 감별한다.</span><span class="hang">방광 파열: 파열 직후 불편감이 사라지지만 요독증이 진행해 식욕부진·침울이 오고 복부가 점점 불러 촉진 파동이 있다. 파열 부위는 거의 항상 방광 등쪽이며 2~3일 뒤 폐사한다. 한우 자료도 하복부 팽만과 요독증·복막염 폐사를 기술한다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>요석증 — 임상병리와 영상<span class="hang">요소·크레아티닌은 파열 전에 오르고 파열 뒤 더 오른다. 방광 파열 반추류는 저나트륨, 저염소, 고인산, 저삼투압 혈청이 되며 요도 파열은 변화가 작다. 칼륨은 침 배설 때문에 대개 정상이다.</span><span class="hang">복강액·혈청 크레아티닌비 2:1 초과면 요복증이다. 초기에는 요소 비, 40시간 뒤에는 크레아티닌 비가 진단적이다.</span><span class="hang">방광 파열 거세우의 치료 후 생존율은 49%였고, 혈청 인 9.0 mg/dL(2.9 mmol/L) 초과 개체는 모두 죽었다.</span><span class="hang">초음파로 방광 팽만, 벽 비후, 복강 자유액(파열 또는 임박)을 본다. 송아지는 방사선으로 결석의 수·위치·크기를 평가할 수 있다.</span><span class="hang">감별: 어린 소의 요도와(urethral recess) 확장은 회음 정중선 종창과 요도 박동을 보이지만 폐색이 없고 박동 뒤 오줌이 수동적으로 흘러나온다. 위장관 폐색, 음경 털 고리, 비폐색성 결석의 방광염·신우신염도 감별한다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>요석증 — 내과 치료<span class="hang">비육 막바지면 도축 구제가 현실적이다. 파열 전 초기 폐색우는 대개 도축 검사를 통과하지만 요독증이면 불합격이다.</span><span class="hang">아미노프로마진(Constable 0.7 mg/kg, Rebhun 0.2~0.3 mg/kg 정맥·근육)은 효과가 불확실하고 요도 주위에 평활근이 거의 없어 현장에서는 무효로 본다. 많은 나라에서 소 사용이 금지되어 있다. 아세프로마진 0.02 mg/kg 정맥 4~6시간마다의 효과도 불분명하다.</span><span class="hang">더 합리적인 방법은 NSAID, 견인근 기시부 국소마취 침윤, 음부신경 차단으로 견인근을 이완해 S자 만곡을 펴는 것이다. 자일라진은 이뇨 작용으로 파열을 앞당기므로 쓰지 않는다.</span><span class="hang">역행 수압세척(2% 리도카인 섞은 생리식염수)은 성공이 드물고 요도 외상·협착을 일으킬 수 있다. 방광절개 후 순행 세척이 성공률이 높다.</span><span class="hang">한우 자료: 오줌이 소량씩 나오면 자율신경차단제, 신경안정제, 요도확장제를 쓰고 염화암모늄 20~
