<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>소화기 검사 — 복부 외형과 팽만<span class="hang">뒤에서 윤곽을 보고 최대 팽만 부위를 찾은 뒤 위관 삽입, 타진·청진·진탕, 직장검사, 복강천자를 조합한다. 반추위가 심하게 팽만하면 대구경 위관으로 감압한다(미주신경성 소화불량은 100~150 L가 나오기도 함). 거품·죽 같은 내용물로 관이 막히면 물 20~40 L씩 넣고 중력으로 빼는 세척을 한다.</span><table class="bxt"><tr><th>원인</th><th>주요 소견</th></tr><tr><td>급성 고창증</td><td>좌측 현저, 좌겸부 긴장, 위관으로 가스·거품 확인</td></tr><tr><td>미주신경성 소화불량</td><td>좌측 전체+우측 하복부(papple형), 직장으로 L자형 반추위</td></tr><tr><td>급성 제1위 산증</td><td>좌측 중등도, 출렁임, 반추위 정지, pH 5 미만</td></tr><tr><td>우방전위·염전</td><td>우겸부 팽만, 핑, 직장으로 우하복부 긴장된 장기</td></tr><tr><td>좌방전위</td><td>복부가 홀쭉, 좌측 9~12늑골 상부 핑</td></tr><tr><td>장폐색</td><td>우측 경~중등도 팽만, 진탕음, 분변 소량·암색</td></tr><tr><td>맹장확장·염전</td><td>우겸부 핑, 직장으로 움직이는 맹단</td></tr><tr><td>태수·요막수종</td><td>복부 하반부 양측 점진 팽만, 임신 말기</td></tr></table></span></p><p class="bx-num"><span class="bxn">2.</span><span>좌측 복부 — 반추위 운동과 핑<span class="hang">1차 수축(혼합)은 약 1분, 2차 수축(트림)은 약 2분마다 일어난다. 좌겸부에서 2회 수축을 들은 뒤 10~13늑골 등쪽 1/3로 옮긴다. 정상우는 여기서도 반추위음이 들리고, 안 들리면 좌방전위를 의심한다. 출렁이는 소리는 곡류과식, 장기 식욕부진(만성 복막염, 제4위·제3위 매식)에서 난다. 초기 미주신경성 소화불량은 분당 3~6회의 강한 수축이 보이지만 소리는 거의 없다.</span><span class="hang">9~13늑골 중간을 타진·청진해 핑을 찾는다. 원인은 좌방전위, 무긴장 반추위, 드물게 기복증이다. 무긴장 반추위의 음은 낮고 넓어 퐁(pong)이라 한다. 수일 식욕부진한 성우는 반추위 등쪽 주머니가 꺼져(rumen void) 요추 횡돌기까지 퐁이 나고, 진탕음이 없으며, 직장으로 꺼진 등쪽 주머니와 배쪽으로 끌려간 좌신장이 만져진다. 원인 질병을 치료하면 회복된다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>우측 복부 — 핑의 원인과 위치<table class="bxt"><tr><th>질환</th><th>핑 위치</th></tr><tr><td>우방전위</td><td>9~12늑골, 늑연골 접합부~근위 1/3, 겸부로는 거의 안 넘음</td></tr><tr><td>제4위 염전</td><td>더 넓게 8늑골까지, 뒤로 겸부 일부, 배쪽 경계가 수평</td></tr><tr><td>맹장확장</td><td>겸부 등쪽과 마지막 1~2늑간. 염전 시 겸부를 채우고 앞뒤 2늑간씩</td></tr><tr><td>소장폐색</td><td>음높이·강도가 다른 여러 작은 핑</td></tr><tr><td>하행결장·직장</td><td>요추 횡돌기 바로 아래 우측 후복부, 직장검사 후 흔함</td></tr><tr><td>기복증</td><td>복부 등쪽 1/3 양측</td></tr></table><span class="hang">Rebhun: 우방전위 핑은 최소 9늑골, 흔히 8늑골까지 뻗는다. 겸부 앞 3늑간 이상 넘지 않는 핑은 위장관 정체에 따른 양성 근위결장 확장이며 일차 진단이 아니다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>직장검사 소견<span class="hang">L자형 반추위는 미주신경성 소화불량, 길고 움직이는 장기와 맹단은 맹결장염전, 우하복부의 긴장된 장기는 제4위 염전이다. 제4위 매식은 극단적인 경우만 만져지며 2분간 관찰해 수축하며 멀어지면 반추위 배쪽 주머니다. 좌방전위는 대개 안 만져지고 작아진 반추위가 우측으로 약간 밀려 있다. 장중첩은 약 20~25%에서만 소시지 모양으로 촉지된다. 장간막 염전은 팽팽한 띠, 지방괴사는 벽돌 같은 덩어리, 복막염은 후복부 침범 시에만 섬유소 유착이 만져진다.</span><span class="hang">분만 직후 소화기 증상은 태반정체·자궁염 독혈증이 반추위 정지, 장마비, 우측 핑을 일으킬 수 있으므로 질·직장검사로 자궁을 확인한다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>분변 검사<span class="hang">성우는 하루 10~24회 30~50 kg을 배설하고 통과에 1.5~4일 걸린다. 24시간 이상 무배변은 비정상이며 기능적 폐색(장마비, 반추위·제4위 운동장애)에서도 최대 3일 거의 무배변일 수 있다.</span><span class="hang">혈액: 제4위 출혈은 흑변, 소장은 균일한 암적색, 맹장·결장은 고루 섞인 혈액, 직장은 표면의 선홍색 줄이다. 제4위에서 직장까지 7~19시간 걸린다. 잠혈검사는 o-톨리딘법이 분변 g당 헤모글로빈 6 mg, 구아이악법이 10 mg을 검출하며, 직장검사 전 채취한 변으로 2~4일 반복한다.</span><span class="hang">끈적이고 질긴 변은 전위 폐색, 반죽 같은 변은 좌방전위, 호두 크기 미소화 섬유나 0.5 cm 넘는 식물 입자는 반추·전위 운동 이상, 직장 내 점액 마개는 기능적 폐색을 시사한다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>복통 검출과 복강천자<span class="hang">기관을 청진하며 6~8회 호흡 후 예고 없이 검상 뒤 복부를 주먹·무릎으로 밀어 올린다. 신음은 복막 병변을 시사하나 없다고 배제되지 않는다. 급성 망위염의 신음은 3~5일만 지속될 수 있다. 큰 소는 두 사람이 막대를 들어 올리고 기갑 꼬집기도 쓴다. 심한 폐렴·흉막염도 신음을 일으킨다.</span><span class="hang">천자 부위는 검상 뒤 10~12 cm, 정중선 외측 10~15 cm, 무딘 유두관이나 16~18G 5 cm 바늘로 최소 세 곳을 시도한다. Rebhun은 우측 유방 앞 유방정맥 옆을 18G 1.5인치로 찌른다. 액이 안 나와도 복막염을 배제할 수 없다.</span><span class="hang">해석: 유핵세포 6000/μL 초과·총단백 3 g/dL 초과는 80%에서 복막염과 일치한다. 호중구 40% 초과·호산구 10% 미만도 복막염과 관련된다. D-dimer가 기준(0~0.6 mg/L) 초과면 민감도 0.96, 특이도 0.99다. 낮은 복수 포도당은 패혈성을 강하게 시사한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">7.</span><span>반추위액 검사 — 채취와 pH<span class="hang">위관 채취는 침 혼입이 문제여서 100~200 mL 이상을 빠르게 받는다. 침 5~10% 혼입은 pH를 0.1~0.2, 50%는 약 1 올리고(Large Animal IM), 위관 pH는 천자보다 약 0.3 높다(Constable).</span><span class="hang">반추위 천자: 좌측 슬개골 상단 높이, 마지막 늑골 뒤 15~20 cm. 2.1×80 mm 바늘(다른 기술은 12~15 cm 14~16G)로 3~5 mL를 흡인한다. 음압을 걸면 CO2가 빠져 pH가 오르므로 막히면 공기를 조금 역주입한다. 6%에서 혈종·농양 합병증이 보고됐다. pH는 즉시 미터로 잰다(시험지는 녹색 액에서 부정확, Rebhun).</span><table class="bxt"><tr><th>상황</th><th class="c">pH</th></tr><tr><td>정상 범위</td><td class="c">6.2~7.2</td></tr><tr><td>곡류 급여우</td><td class="c">5.5~6</td></tr><tr><td>조사료우의 중등도 이상</td><td class="c">5~6</td></tr><tr><td>탄수화물 과식(6~24시간 유지)</td><td class="c">5 미만</td></tr><tr><td>식욕부진·소화불량 조사료</td><td class="c">7~7.5</td></tr><tr><td>단백 부패·침 혼입·요소</td><td class="c">7.5~8.5 이상</td></tr></table><span class="hang">과식 후 24시간 넘으면 침과 혈장 희석으로 pH가 5.5~7.0으로 오를 수 있다. 조사료우의 pH 5.5~6은 관찰 못 한 곡류 섭취를 의심한다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>반추위액 — 육안·미생물·염소<span class="hang">색은 방목 시 짙은 녹색, 사일리지·볏짚은 황갈색, 곡류과식은 유백회색, 장기 정체·부패는 녹흑색이다. 정상은 약간 끈적하고, 물 같으면 미생물 비활성, 거품 과다는 포말성 고창이나 미주신경성 소화불량이다. 곰팡이 썩는 냄새는 단백 부패, 강한 신 냄새는 젖산 과다, 암모니아 냄새는 요소 섭취다.</span><span class="hang">원충은 저배율 시야당 5~7마리 활동이 정상이고 중·대형 원충 소실은 대개 산증이다. 정상은 그람음성 우세, 곡류과식은 그람양성으로 바뀐다. 메틸렌블루 환원: 반추위액 10 mL에 0.03% 용액 0.5 mL를 섞어 2~6분에 탈색되면 정상(Rebhun). 침전활성: 입자가 떠오르는 데 3~9분이 정상, 가라앉으면 심한 비활성이다.</span><span class="hang">염소: 정상 10~25 mEq/L. 제4위 역류, 장폐색, 고염분 섭취 시 오르며 역류 시 80~100 mmol/L까지 간다. Rebhun은 30 mEq/L 초과를 역류로 본다. 이온선택전극은 아세트산·중탄산 간섭으로 과대 측정한다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>전위 운동저하 치료 원칙과 반추위액 이식<span class="hang">마전자·용담·주석산 등 반추촉진제는 효과가 없다. 네오스티그민(0.02~0.04 mg/kg SC)·카바콜은 비협조적 운동만 일으켜 권장하지 않고 복막염·임신 말기에 금기다. 메토클로프라미드는 0.3 mg/kg IM에서 일시적 효과와 신경증상뿐이다. 엡솜염 0.5~1.0 kg도 효과가 입증되지 않았다. 저칼슘혈증은 무긴장을 일으키므로 칼슘이 운동을 회복시킨다.</span><span class="hang">반추위액 이식: 도축장이나 누관 공여우가 좋다. 건강우에 물 20~30 L를 넣고 사이펀으로 빼 걸러서 위관 투여한다. 성우 최소 5 L(Rebhun은 송아지 1 L, 성우 8 L 이상), 매일 반복. 실온 수일 보관이 가능하다는 기술(Constable)과 1시간 안에 못 쓰면 냉동하라는 기술(Rebhun)이 있다. 프로필렌글리콜 4~8 oz, 염화칼륨 1~2 oz를 섞기도 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">10.</span><span>단순성 소화불량 — 원인·증상<span class="hang">소화 불량한 조사료, 곰팡이·과열·동결 사료, 농후사료의 적당한 과잉, 급격한 사료 변경, 음수 제한, 사일리지 무제한 급여(하루 45~50 kg), 장기 경구 항생제가 원인이다. 곡류과식과는 정도 차이지만 임상상이 뚜렷이 다르다.</span><span class="hang">갑작스러운 식욕 감소, 경미한 유량 감소, 반추 정지, 반추위 수축 감소. 반추위는 반죽 같고 팽만은 뚜렷하지 않다. 첫날 분변은 적고 마르다가 24~48시간 뒤 묽고 악취 나는 설사. 활력징후 정상, 대개 12~48시간에 자연 회복한다.</span><span class="hang">배제 진단이다. 소변 케톤으로 케톤증을 감별한다. 반추위 pH 6.5~7.0, 원충 감소, 메틸렌블루 환원 지연. 감별: 케톤증, 창상성 망위염, 곡류과식, 좌우 방전위·염전, 미주신경성 소화불량, 독혈증성 이차 무긴장, 저칼슘혈증 초기(6~18시간 무긴장과 경미한 고창, 칼슘에 반응).</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>단순성 소화불량 — 치료·예방<span class="hang">신선한 건초를 하루 여러 번 소량 주고 곡류를 끊는다. 수일 경과하면 반추위액 이식(하루 5 L, 최소 3일).</span><span class="hang">반추위액이 산성일 때만 수산화마그네슘 400 g/450 kg을 준다. 162 g 볼루스나 450 g 분말을 물 3.5 L에 3일 주면 pH가 오르지만 원충은 줄고 메틸렌블루 환원은 지연된다. 내용물이 마르면 물 15~30 L를 위관 투여한다. 고단백 사료로 알칼리성이면 식초 5~10 L.</span><span class="hang">Rebhun: 모든 예에 23% 보로글루콘산칼슘 500 mL를 IV 또는 4곳 피하 분할, 완하제-반추촉진제를 2~3일 감량 투여한다. 탈수·핍뇨 소에 마그네슘 제제를 반복하면 고마그네슘혈증과 알칼리증으로 쇠약해진다.</span><span class="hang">소장성 소화불량(Rebhun): 소장에 가스·액이 차 심한 복통을 일으키며 성우 장성 복통의 가장 흔한 원인일 수 있다. 저칼슘·저염소혈증이 흔하고 칼슘·완하제·플루닉신 1회 후 12~24시간에 묽은 변을 다량 배출하며 회복한다. 팽팽한 장 고리, 혈변, 무배변, 순환 악화, 초음파상 무운동 장 고리는 물리적 폐색을 시사한다.</span><span class="hang">예방: 사료는 7~14일에 걸쳐 바꾼다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>급성 제1위 산증(곡류과식) — 원인·기전<span class="hang">발효성 탄수화물(곡류, 사과, 포도, 빵, 사탕무, 덜 발효된 맥주박)의 급격한 대량 섭취다. 사료통 침입, 자동급이기 고장, 비육 입식 초기와 증량 시, 급이 중단 12~24시간 후 무제한 급여가 흔하다. 밀·보리·옥수수가 가장, 귀리·수수가 가장 덜 독성이고 분쇄할수록 독성이 크다. 적응 젖소는 15~20 kg에 중등도지만 비적응 육우는 10 kg으로 폐사할 수 있다. 이환율 10~50%, 치명률 무치료 최대 90%, 치료해도 30~40%다. 한우컨설팅지침서: 제한급식에서 자유급식으로 바꾸는 비육 초기, 여름·가을에 많고 섭취 후 12~36시간에 증상이 난다.</span><span class="hang">2~6시간에 Streptococcus bovis가 증식해 pH 5 이하로 떨어지고 섬유분해균·원충이 죽으며 젖산균이 D·L 젖산을 만든다. 반추위 삼투압이 280에서 약 400 mOsm/kg으로 올라 탈수·혈액농축과 삼투성 설사가 온다. L-젖산은 빨리 대사되나 D-젖산은 축적된다. 화학적 반추위염이 4~6일 뒤 진균성 반추위염(Mucor, Rhizopus, Absidia)과 복막염으로, 반추위염 부위로 간농양으로 이어진다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>급성 제1위 산증 — 임상증상·검사<span class="hang">경증은 식욕부진, 묽은 변, 반추위 운동 감소로 3~4일째 스스로 먹는다. 중증은 24~48시간 내 기립불능·비틀거림, 체온 대개 36.5~38.5℃, 심박 100 미만이면 120~140보다 예후가 낫고, 호흡 60~90회. 설사는 거의 항상 있고 담색에 달콤시큼한 냄새, 곡립이 섞인다. 탈수는 경증 4~6%, 중증 10~12%, 무뇨가 흔하며 수액 후 이뇨는 좋은 징후다. 반추위는 반죽 같거나 액체로 탄력 있어 촉진이 오판을 낳고, 1차 수축 없이 출렁인다. 실명, 안검반사 둔화, 제엽염, 약 48시간 뒤 유열 같은 횡와. 3~4일째 재악화는 진균성 반추위염을 의심한다.</span><span class="hang">반추위액은 유백녹색, 신 냄새, 거품 없음, pH 대개 5 미만, 원충 없음. 헤마토크릿은 약 34%에서 말기 50~60%로 오르며 가장 좋은 중증도 지표다. 혈청칼슘 6~8 mg/dL(1.5~2.0 mmol/L)로 경도 저하. 요 pH는 4.5~5.0이며 실험에서 혈액 pH = 0.062×요 pH + 6.90, 염기과잉 = 4.44×요 pH − 32.7이었다. 사후 1시간이 지나면 반추위 pH를 믿을 수 없다.</span><span class="hang">감별: 단순성 소화불량(pH·원충 정상), 유열(분변 단단, 탈수 없음, 칼슘 반응), 초급성 대장균성 유방염, 급성 미만성 복막염.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>급성 제1위 산증 — 중증도별 처치(Constable)<table class="bxt"><tr><th>정도</th><th>주요 소견</th><th>처치</th></tr><tr><td>초급성</td><td>측와, 기립불능, 탈수 8~12%, 심박 110~130, 체온 35.5~38.0℃, pH 약 4</td><td>반추위절개, 5% 중조 5 L(450 kg) 30분 IV 후 등장 수액 150 mL/kg 6~12시간</td></tr><tr><td>급성</td><td>보행하나 실조, 탈수 8~10%, 심박 90~100, pH 5~6, 원충 없음</td><td>즉시 도태 고려, 세척 또는 절개, 중조·수액, 건초</td></tr><tr><td>아급성</td><td>활발, 물을 찾음, 탈수 4~6%, 심박 72~84, pH 5.5~6.5</td><td>수산화마그네슘 500 g/450 kg, 필요시 수액, 건초</td></tr><tr><td>경증</td><td>정상 섭식, pH 6.5~7</td><td>건초 주고 48시간 관찰</td></tr></table><span class="hang">Rebhun은 pH 5.0 이하, 심박 100 초과, 탈수 8% 초과, 팽만과 기립불능이면 반추위절개를 권한다. 24시간 이상 지났으면 점막 손상은 이미 결정돼 있다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>급성 제1위 산증 — 처치 세부<span class="hang">과식 발견 직후: 사료 차단, 물 과음 방지, 1일량 절반의 건초, 12~24시간 매시간 걷기. 독성량을 먹은 소는 6~8시간에 침울해지므로 골라 치료한다. 18~24시간 뒤 건초를 먹는 소만 물을 자유롭게 준다. 이환우는 물을 과음해 18~24시간 뒤 폐사할 수 있다.</span><span class="hang">반추위절개: 비우고 세척한 뒤 반추위액 10~20 L와 건초를 넣는다. 절개 후에는 알칼리화제를 넣지 않는다(24~36시간 대사성 알칼리증 위험). 세척: 내경 25~28 mm 관으로 온수 주입·배출 10~15회, 흡인성 폐렴 위험이 있다.</span><span class="hang">정맥: 5% 중조 5 L/450 kg 30분 후 1.3% 중조 150 mL/kg 6~12시간. 반응하면 1시간 내 배뇨, 6~12시간에 일어선다. Rebhun은 고장식염수 후 젖산링거액, 혈액 pH 7.15 미만이면 중조를 추가하고, 고장식염수 후 과음으로 반추위가 다시 차지 않게 물을 제한한다. 반추위내 산화·수산화마그네슘 500 g/450 kg은 산증이 확인된 경우에만.</span><span class="hang">기타: 반추위액 이식은 pH 6.0~7.0 회복 후 최소 5 L. 중증에 프로카인 페니실린 G 또는 옥시테트라사이클린(반추위염·간농양 예방), 비타민 B1. Rebhun은 페니실린 10,000~20,000 U/kg IM·SC 1일 1회 3~5일, 광범위 항생제는 진균 과증식 때문에 피하고, 반추위액을 빼고 활성탄 1~2 lb를 넣는 방법을 쓴다. 3일째까지 건초를 먹고 분변을 다량 배출해야 한다.</span><span class="hang">한우컨설팅지침서: 중조 주사액 500 mL IV 또는 100~200 g 경구, 5~10% 포도당 10 L에 비타민B 복합제 IV, 테라마이신 경구, 비타민ADE 근주, 지사제, 회복 후 건강우 반추위액과 전해질, 농후사료 중단 후 건초 위주.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>급성 제1위 산증 — 합병증·예방<span class="hang">합병증: 진균성 반추위염(3~5일), 간농양과 후대정맥 증후군, 제엽염(수주~수개월 뒤), 10일~2주 뒤 유산, 7~14일 뒤 색전성 뇌감염(Rebhun), 다발성뇌연화증.</span><span class="hang">비육 적응: 조사료 50~60% 혼합 사료로 7~10일 시작해 2~4일마다 조사료를 10%씩 줄여 10~15%까지, 약 21일에 적응한다. 별도 급여 시 농후사료 8~10 g/kg으로 시작해 2~4일마다 10~12%씩 늘린다. 완충제는 적응 초기만 일부 효과가 있고 알팔파 10%보다 낫지 않다. 이오노포어는 살리노마이신이 모넨신·라살로시드보다 보호 효과가 크다.</span><span class="hang">한우컨설팅지침서: 조사료:농후사료 40:60 정도, 농후사료를 많이 줄 때 중조 1일 두당 100~150 g, 탄산칼슘·염화암모늄 1일 두당 10 g, 석회석 분말 사료의 2.7%.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">17.</span><span>아급성 반추위산증(SARA) — 정의·증상<span class="hang">비구조 탄수화물 과다와 물리적 유효섬유 부족으로 pH가 반복 저하된다. 반추위 천자 pH 5.5 이하, 가능하면 하루 3시간 이상 지속이 정의로 합의되어 가며, 5.2~5.6의 반복 저하로도 기술한다. 섬유 소화는 6.2 미만에서 이미 떨어진다. 조기 비유 젖소의 최대 20%에서 5.5 미만이 관찰되고, 젖산보다 휘발성지방산 과다가 중요하다. 방목 착유우도 연한 목초기나 착유 시 농후사료 대량 급여로 심하게 생긴다(Rebhun).</span><span class="hang">우군 증상: 제엽염(10% 넘으면 사양 문제), 간헐적 설사와 들쭉날쭉한 분변 점수, 섭식 변동, 체충실 감소, 간농양, 후대정맥 혈전에 의한 객혈, 유지방 저하, 반추 감소, 제4위 질환 증가, 높은 도태율.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>SARA — 진단<span class="hang">pH 최저점에 채취한다. 분리급여는 주 농후사료 2~4시간 뒤, TMR은 급여 4~8시간(Rebhun 6~8시간) 뒤.</span><span class="hang">우군 판정은 책마다 다르다. Constable: 12두 이상 천자, 10두 이상 중 30%가 5.5 이하면 산증 상태, 12두 중 3두 이상이면 유병률 15% 이하와 30% 초과를 구별. Rebhun: 12두 중 5두 이상 5.5 미만이면 우군 문제, 천자 5.3~5.7·경구 프로브 5.5~5.9를 SARA 범위로, 6.0 미만을 의심으로 본다. Bovine Medicine: 12두 중 2두 5.5 미만이면 경계, 5.8 미만을 시사 소견으로 쓰는 연구도 있다.</span><span class="hang">보조 지표: 유지방:유단백 1.15 미만, 유지방률이 유단백률보다 낮은 소가 10% 초과(비유 30일 이후). 쉬는 소의 40% 이상(Bovine Medicine은 먹거나 자지 않는 소의 60% 이상)이 반추해야 한다. 분변 20~30개를 체질해 곡립을 본다. 초음파 반추위 점막 7.3 mm 초과가 pH 5.5 미만과 관련됐다(예비 연구).</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>SARA — 예방<span class="hang">분만 후 첫 주 곡류 건물 3~5 kg 이하, 하루 110~220 g씩 늘려 6~8주에 최고량. 분만 전 사료 1.54~1.63 Mcal/kg NEl를 최소 3주 전부터 급여한다. 미세 분쇄·증기 압편·고수분 곡류, 밀·보리 전분, 습하고 잘게 썬 옥수수 사일리지가 위험하다.</span><span class="hang">DCAD((Na+K)−(Cl+S))는 조기 비유 약 +400, 중기 +275~+400 mEq/kg 건물. 섬유 입자는 4 cm 이상이어야 매트에 기여하며, 입자 분리기 상단이 7% 미만이면 위험하고 15% 넘게 골라먹을 정도면 오히려 위험하다. 사조 폭 두당 75 cm 미만은 골라먹기를 악화한다. 하루 2회 급여, 농후사료 전 장초 소량, 모넨신. 알팔파 건초 추가는 유효섬유 부족 발생 시 응급처치에 가깝다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>제1위 부전각화증<span class="hang">아급성 젖산증과 송아지 고창에 동반되며 섬유·완충 부족을 뜻한다. 열처리 알팔파 펠릿 등 고농후사료에서 흔하다. 유두가 커지고 가죽 같으며 검게 뭉친다. 액면 높이 등쪽에서 가장 심하고 분문 병변은 고창 위험을 높인다고 추정된다. 군내 이환율은 40%에 이를 수 있다.</span><span class="hang">한우컨설팅지침서: 조사료 부족과 가루·소입자 배합사료 장기 급여, 군사 시 서열 높은 소의 농후사료 편식이 원인이다. 식욕 저하, 증체 정지, 만성 설사, 습관성 고창을 보이며, 비육 전기 군에서 가장 잘 크던 소가 만성 고창과 설사를 보이는 것이 특징이다. 제1위염, 간농양, 제4위 궤양, 제4위 전위의 원인이 된다. 예방·치료는 자동목걸이로 다툼 방지, 양질 조사료, 비타민A 첨가·주사, 농후사료 감량과 중조·탄산칼슘·염화암모늄·석회석 분말 첨가.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">21.</span><span>반추위 알칼리증<span class="hang">가장 흔한 형태는 발효가 줄었는데 침 유입이 계속되는 경우다. 장기 식욕부진, 소화 불량한 조사료, 일부 단순성 소화불량에서 pH 7~7.5가 되며 일차 문제가 아니다(Large Animal IM). 고단백 사료는 대개 중성을 넘지 않는다. 요소·뷰렛·인산암모늄 과급여나 암모늄 비료 섭취는 pH 7.5~8.5와 강한 암모니아 냄새를 낸다. 단백 부패(변패·분변 오염 사료)도 고 pH를 만든다.</span><span class="hang">Bovine Medicine: 비활성에 의한 경우는 대개 경미(7.0~7.5), 독성·알칼리성 물질은 7.5 초과. 복통, 전위 정지, 탈수, 고창, 역류, 암모니아 호흡취, 설사, 흥분, 근진전. 탈수, BUN 상승, 저칼륨·저칼슘혈증, 원충 소실.</span><span class="hang">치료: 원인 교정. 반추위 세척 또는 절개로 비우고 식초를 반복 투여해 암모니아 흡수를 줄인다(Bovine Medicine 30분마다, Constable 5~10 L). 요소는 농후사료의 3% 미만, 잘 섞고 점진 적응시킨다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">22.</span><span>고창증 — 분류와 원인<span class="hang">포말성(일차성): 안정된 거품이 가스를 가둔다. 목초 고창은 콩과 잎의 엽록체 막 파편이 기포 융합을 막는 것이 핵심이다. 알팔파, 붉은·흰 클로버, 어린 곡류 목초가 위험하고 탄닌 함유 버즈풋트레포일·세인포인은 안전하다. 개화 전 영양생장기, 이른 아침 이슬, 서늘한 밤, 단속적 방목이 위험하고 엽:경 비 0.5 미만이면 위험이 낮다. 비육장 고창은 곡류가 사료의 80%를 넘거나 미세 분쇄일 때, 50~100일째 생긴다.</span><span class="hang">가스성(이차성): 트림 장애다. 식도폐색·협착, 종격 림프절 비대, 분문 유두종·육아종, 미주신경성 소화불량, 횡격막 탈장, 파상풍, 저칼슘혈증, 아나필락시스, 측와·앙와 자세가 원인이다.</span><span class="hang">한우컨설팅지침서: 농후사료 과식이 가장 큰 원인이고, 비·이슬 젖은 사료, 변패 사료, 두과 청초, 태반·금속·비닐 섭취, 섭취 직후 운동·수송, 급격한 사료 변경, 6개월 미만 송아지, 제1위 부전각화증(습관성 고창)도 원인이다.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>고창증 — 임상·진단<span class="hang">방목·비육 소는 흔히 폐사한 채 발견된다. 고창 목초에 처음 들어가면 대개 2~3일째 생기나 빠르면 15분 만에 팽만한다. 좌겸부 상부가 가장 뚜렷하고, 배를 차며 잦은 배변·배뇨, 개구호흡, 혀 내밀기, 호흡 분당 60회까지, 때로 분출성 구토. 경증은 좌겸부 피부를 5~7 cm 집을 수 있고, 중증은 양측 팽만에 전혀 집히지 않고 비틀거린다. 초기 수축은 강하나 소리가 작고 말기엔 무긴장. 심박 100~120, 수축기 잡음. 대개 발현 3~4시간 이후 폐사한다. 한우컨설팅지침서는 결막 충혈, 질 점막 청색증, 호흡 60회 이상을 질식 위험 징후로 든다.</span><span class="hang">위관으로 거품이 나오고 가스가 안 빠지면 포말성, 쉽게 빠지면 가스성이다. 가스성은 좌측 상복부에서 정중선까지 넓은 핑이 나고 호흡곤란이 드물다(Rebhun). 크고 높은 좌방전위는 장기 윤곽이 보이고 핑이 11늑골에서 멈춘다.</span><span class="hang">부검(사후 1시간 내): 혀 돌출, 두경부 림프절 출혈, 경부 식도 충혈과 흉부 식도 창백(bloat line), 앞쪽 충혈·뒤쪽 창백, 창백한 간. 기종저, 낙뢰, 탄저와 감별한다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>고창증 — 응급처치<span class="hang">즉시 원인 사료에서 뺀다. 개구호흡, 혀 돌출, 비틀거림이면 응급 반추위절개: 좌겸부 중앙에 10~20 cm를 반추위까지 한 번에 절개한다. 복강 오염은 의외로 적다. 쓰러지면 수분 내 죽는다.</span><span class="hang">투관침: 표준 투관침은 초급성 거품에 너무 가늘어 피부 절개 후 2.5 cm 대구경을 쓴다. 투관을 통해 소포제를 넣고 수시간 둔다(Constable). Rebhun은 젖소 경피 투관이 복막염을 반드시 일으키므로 극단적 응급 외에는 금기라 하고, 진행성 포말성 고창은 응급 반추위절개를 선택한다. 흉부 압박이 심한 소는 위관 삽입 중 급사할 수 있다.</span><span class="hang">한우컨설팅지침서 투관: 좌측 옆구리, 등뼈 끝에서 아래로 10 cm와 마지막 갈비뼈·요각 중간이 만나는 곳. 털을 3~4 cm 깎고 소독, 피부 약 1 cm 절개 후 한 번에 찌르고 가스는 막으며 서서히 뺀다(급격한 제거는 쇼크). 내침을 다시 꽂아 내용물을 빼고 뽑는다. 양쪽 배가 척추보다 높은 경우 외에는 투관하지 않는 것이 좋고, 포말성은 반추위절개가 필요하다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>고창증 — 소포제와 비육장 처치<span class="hang">개구기로 직경 2 cm까지 위관을 넣고, 포말성이면 관을 둔 채 소포제를 넣은 뒤 1시간 관찰한다. 무독성 오일 250 mL(흔히 500 mL까지), 계면활성제 첨가 유제가 잘 섞인다. 폴록살렌 25~50 g은 콩과 고창용이며 비육장 고창에는 효과가 떨어진다. 폴록살렌·알코올에톡실레이트는 오일보다 빠르다. Alfasure 30 mL를 겸부 중앙에 6 cm 14G 바늘로 반추위내 주사하면 중앙 25분에 소실됐다.</span><span class="hang">경증은 막대를 재갈처럼 물리거나 중조 150~200 g을 물 1 L에 타서 먹인다. 반추위를 주무르고 걷게 한다. 비육장 고창은 위관으로 빼고 광유를 넣은 뒤 20분 걷게 하며, 중등도 팽만우는 걷기만으로 트림을 시작한다.</span><span class="hang">가스성 고창은 원인 치료가 핵심이다. 저칼슘혈증은 칼슘, 소화불량은 위관 배기와 칼슘·완하제, 식도폐색은 폐색 해소, 국소 복막염은 항생제·안정·자석 또는 반추위절개(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>고창증 — 예방<span class="hang">목초: 화본과-콩과 혼파가 가장 효과적이고 콩과 50%를 최대 안전선으로 본다. 이슬이 마른 뒤 방목, 방목 전 거친 건초를 배불리 먹이고 계속 방목, 띠방목, 24~48시간 예건 목초. 오일은 착유 시 1일 2회 60~120 mL 또는 고위험기 하루 두당 240~300 g(사료·음수 2% 유제). 계면활성제는 5~8 mL로 10~18시간 효과. 폴록살렌 1일 2 g/100 kg. 모넨신 서방형 캡슐은 하루 약 300 mg을 100일 방출해 발생을 약 50% 줄였고, 액제 1일 300 mg은 24시간 보호한다.</span><span class="hang">비육장: 썬 조사료(볏짚, 화본과 건초) 10~15% 이상을 완전사료에 섞고, 곡류는 압편·파쇄만, 미세 분쇄와 펠릿은 피한다. 폴록살렌은 무효, 4% 소금은 섭취·증체를 줄인다. 절식 후 과식을 막고 물은 항상 준다.</span><span class="hang">한우컨설팅지침서: 육성기 조사료 위주, 사료 변경은 최소 15일 적응, 수송 후 조사료 먼저, 변질 사료·비닐 이물 제거, 후산 섭취 방지, 비육 후기에도 최소 조사료.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>만성·재발성 고창<span class="hang">송아지: 2~4개월령 우유만 먹는 저섬유 사료, 경구 항생제 과용, 메트스코폴라민 후 24~72시간 장마비, 폐렴 후 흉부 미주신경 손상, 송아지 좌방전위, 건초 없는 펠릿 사료(10% 이상 발생). 반추위 음수자는 3~8주령 버킷 급여 송아지에서 식도구 반사 실패로 우유가 반추위에서 부패해 급여 1시간 내 고창, 점토 같은 변, D-젖산증 침울을 보인다. 위관으로 회색 악취 액을 빼고 젖병 급여나 이유로 바꾼다(Rebhun).</span><span class="hang">원인 불명의 건강한 송아지 가스성 고창은 일시적 반추위 누관이 예후가 좋다. 누관은 파상풍 소의 배기·급식에도 쓰지만 만성 포말성 고창(복막염, 제4위 역류)에는 효과가 없다.</span><span class="hang">성우는 대개 미주신경 경로 병변(망위염, 망위·간 농양, 리스테리아, 림프종, 분문 유두종, 제4위 역류)이다. 역류는 반추위 염소 30 mEq/L 초과와 저염소성 알칼리증을 보이며 예후가 나쁘다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>창상성 망위복막염(하드웨어병) — 원인·기전<span class="hang">썬 사료의 금속 이물(철사 59%, 못 36%)이 제2위벽을 뚫는다. 사일리지 덮개용 폐타이어 철사가 중요하며 덴마크 조사에서 병변의 81%와 관련됐다. 대부분 2세 이상 젖소이고 썬 사료 급여, 겨울에 많다. 정상우의 최대 90%에 금속 이물이 있고, 임상 이환우의 약 25%는 불치 합병증으로 간다. 임신 마지막 3분기 자궁 무게와 분만 시 복압이 천공을 촉진한다(Rebhun).</span><span class="hang">대부분 제2위 전벽 하부를 뚫는다. 철사는 6주면 부식되나 못은 1년 이상 남는다. 천공 약 24시간 뒤 증상이 시작되고 72시간 무렵에는 이물이 제2위 안으로 빠져 있는 경우가 많다. 섬유소성 국소 복막염은 끈 모양 유착이 되고 대부분 6개월 안에 사라진다. 분만, 강제 운동, 수송은 유착을 깨 미만성 복막염을 부른다.</span><span class="hang">후유증: 제2위 농양, 미주신경성 소화불량, 심낭염, 흉막염·폐렴, 간·비장 농양, 횡격막 탈장, 위대망동맥 열상에 의한 급사, 검상부 체외 누관, 심내막염과 그에 따른 다발성 관절염·신염.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>창상성 망위복막염 — 임상증상<span class="hang">급성 국소형: 12시간 안에 완전 식욕부진, 유량 1/3 이하로 감소. 움직이기를 꺼리고 내리막에서 신음, 약 50%가 등을 구부린다. 체온 39.5~40℃, 심박 약 80, 호흡 약 30이며 40℃ 초과와 심박 90 초과는 심한 합병증을 시사한다. 반추 소실, 반추위 정지, 가스성 고창. 검상 뒤 폭 약 20 cm 띠를 좌우 각 6회 이상 눌러 신음을 확인한다. 첫날 가장 뚜렷하고 3일째면 찾기 어렵다.</span><span class="hang">Rebhun은 확진 200여 두 중 절반 이상이 체온 정상이었다며 정상 체온으로 배제하지 말라고 한다. 반추위 수축 시 뒷발 구르기, 이갈이, 구토, 팔꿈치 외전도 본다.</span><span class="hang">만성형: 항생제에도 식욕·유량이 회복되지 않고 체충실 불량, 분변 감소와 미소화 입자, 미열, 작은 반추위와 중등도 고창, 건초는 먹고 농후사료는 거부. 신음은 불확실하다. 미만성: 1~2일 내 심한 독혈증, 심박 100~140, 고열 후 저체온, 복벽 전체 통증, 신음성 호기, 순환부전.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>창상성 망위복막염 — 검사<span class="hang">급성 국소: 성숙 호중구 4000/μL 초과와 미성숙 200/μL 초과(재생성 좌방이동)가 최대 3일. 미만성: 백혈구 4000/μL 미만과 퇴행성 좌방이동은 예후 불량. 혈장 총단백은 망위염 88±13, 다른 소화기병 77±12 g/L였다. SAA 68 μg/mL 초과, 합토글로빈 0.74 g/L 초과는 민감도 1.00, 특이도 0.86. 미만성에서 피브리노겐 10~20 g/L. Rebhun: 혈구는 정상인 경우가 많으나 거의 모두 피브리노겐 상승, 10일 이상 만성은 글로불린 5.7 g/dL 초과, 정체 정도에 비례해 저염소성 알칼리증(혈청 Cl 70~90 mEq/L까지). Bovine Medicine: 백혈구 10,000 초과, 호중구 대개 60~65%.</span><span class="hang">방사선: 반드시 기립 자세. 측면 촬영 민감도 83%, 특이도 90%. 자석에 붙지 않은 1 cm 이상 이물, 제2위 주위 가스·가스-액체 경계면(특이도 97%), 윤곽 함몰, 제2위 변위가 소견이다. 철사가 자석에 완전히 붙었으면 반추위절개 가치가 적다.</span><span class="hang">초음파: 3.5 MHz로 흉골 6~7늑간 배쪽. 정상 2상성 수축은 분당 약 1회이고 망위염은 3분에 2·1·0회로 줄며 폭이 1~3 cm로 작아진다. 섬유소는 고에코, 농양은 고에코 피막과 저에코 중심. 금속은 안 보인다. 나침반이 좌흉벽 팔꿈치 뒤에서 60~90° 편향하면 자석이 있고, 자석 보유우의 복막염은 제4위 궤양 가능성이 더 크다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>창상성 망위복막염 — 감별<span class="hang">단순성 소화불량, 이물에 의한 제2위-제3위 구 폐쇄(신음·발열 없음, 반추위절개로만 진단), 곡류과식, 장폐색, 제4위 염전, 심낭염, 흉막염, 천공성 제4위 궤양(우측 하복부 통증, 분만 2주 전~100일), 패혈성 자궁염, 신우신염, 괴사성 경관·질염(이급후증), 간농양, 케톤증. 망위염은 식욕·유량이 급감하고 복통이 있으며 케톤은 음성~미량이지만, 조기 비유기에는 이차 케톤증이 생기므로 케톤뇨만으로 감별하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>창상성 망위복막염 — 치료·예방<span class="hang">보존요법: 자석 경구(1~4일 뒤 85%가 제2위, 천공 이물의 32%가 붙음), 작은 우방 감금, 프로카인 페니실린 22,000 U/kg IM 1일 1회 최소 5일 또는 옥시테트라사이클린 16.5 mg/kg IV 1일 1회 최소 5일. 반추위가 정지해 있으면 자석이 제2위로 가지 않는다. 탈수·알칼리증에는 수액과 염화칼륨 2~4 oz 경구 1일 2회 또는 IV 40 mEq/L, 알칼리성 반추촉진제는 피한다(Rebhun). 48~72시간에 평가한다.</span><span class="hang">반추위절개: 보존요법 3일에 호전이 없을 때, 고가우, 임신 마지막 3개월, 만성형, 이미 자석이 있는데 발병한 경우. 수술 전 칼륨 페니실린 G 1000만 IU IV 1회. 유착이 뚜렷하면 장막면을 탐색하지 않고 제2위 점막 전체를 더듬으며, 제2위 농양은 제2위 안으로 절개 배농한다. 회복률은 보존·수술 모두 80~90%, 무치료 약 60%이고, 한 연구에서 보존 경증 84%, 수술한 어려운 예 47%였다. 임신 6개월 이후 소는 재발이 흔하다.</span><span class="hang">예방: 사료 가공 장비에 자석을 달고 철사 대신 합성 끈을 쓴다. 길이 7.5 cm 둥근 자석을 18개월~2세(Rebhun은 12~18개월, 어린 황소 포함)에 투여하면 발생과 합병증이 90~98% 준다. 덴마크에서 자석 보유우의 97%에 병변이 없었고 210 mT 자석이 110 mT보다 우수했다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">33.</span><span>창상성 심낭염<span class="hang">망위염의 약 8%에서 생기며 임신 마지막 3개월과 분만 시 많다. 독혈증과 심낭액 저류에 의한 울혈성 심부전이 증상을 만들고, 2~3일 만의 급속한 부종은 조기 폐사를 뜻한다.</span><span class="hang">침울, 식욕부진, 급격한 체중 감소, 등 구부림과 팔꿈치 외전, 얕은 호흡 40~50회와 신음, 양측 경정맥 확장·박동, 흉전·하복부 부종. 초기 40~41℃, 심박 100 이상. 초기에는 호흡에 따라 변하는 마찰음, 삼출 후 심음 약화와 출렁·딸랑거리는 소리. 국한 부위만 들릴 수 있어 양측을 청진한다. 대부분 1~2주에 폐사한다.</span><span class="hang">백혈구 16,000~30,000/μL, 호중구증가. 좌측 4~5늑간에서 10 cm 18G 바늘로 심낭천자해 악취 나는 혼탁액이 나오면 진단된다. 초음파로 다량의 저에코 액과 섬유소를 보고 천자를 유도한다. 감별은 심내막염, 림프종, 선천성 심기형, 폐성심이다.</span><span class="hang">치료 성적이 불량해 안락사를 흔히 권한다. 소수는 심낭 카테터를 두고 0.9% 식염수에 묽힌 요오드액으로 매일 세척하며 프로카인 페니실린이나 옥시테트라사이클린을 장기 투여해 살린다. 1회 배액은 수일 내 재발한다. 5늑골 절제 심낭절개술 성공례가 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">34.</span><span>미주신경성 소화불량(Hoflund 증후군) — 원인과 견해 차이<span class="hang">제2위·제4위의 유출 장애로 내용물이 쌓인다. 대개 수주~수개월 전 망위염 병력이 있는 젖소에 생기며 육우·황소에도 생긴다.</span><span class="hang">Constable: 망위염 합병증 42두에서 신경 손상 증거는 없었고 광범위한 제2위 주위 유착이 제2위 운동을 기계적으로 억제해 입자 분리가 깨지는 것이 주 기전이다. Rebhun: 뇌간에서 인두, 제2위 내측벽, 제4위까지 미주신경 경로 어디서든 손상되면 생기며, 유착이 있어도 복측 미주신경 분지의 신경성 손상이 함께 있어야 한다는 것이 다수 견해다. Bovine Medicine은 미주신경 기능장애가 전체의 1/3 미만과 관련된다고 한다.</span><span class="hang">기타 원인: 제2위 주위·간 농양, 방선균 육아종, 분문 섬유유두종, 림프종, 인두 외상, 폐렴, 제4위 염전 수술 후, 임신 말기(4형), 신경초종.</span><span class="hang">분류: 전방 기능성 협착(제3위 이송 실패, L자형 반추위, 과운동형은 거품성 고창)과 후방 기능성 협착(유문 통과 실패, 제4위 매식, 염산 역류로 반추위 염소 상승과 저염소·저칼륨혈증). 전방 협착은 알칼리증·탈수가 예상되지 않는다. 예후는 전방이 단순 망위염보다, 후방이 전방보다 나쁘다. Bovine Medicine 4형: 트림 실패, 제3위 이송 실패, 제4위 매식, 임신 말기 부분 폐쇄.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>미주신경성 소화불량 — 임상·검사<span class="hang">수일간 식욕부진, 체중 감소, 서서히 커지는 papple형 복부(좌측 사과, 우측 배), 소량의 반죽 같은 변에 긴 미소화 입자, 정상 활력징후, 통상 치료에 무반응.</span><span class="hang">과운동형: 분당 4~6회 뚜렷한 파동에도 소리는 거의 없다. 서맥 44~60회, 흡기 정점에서 큰 수축기 잡음(고창 해소 시 소실). 초음파 제2위 수축 3분에 4.5회 초과는 전방 협착과 관련됐다. 무긴장형: 임신 말기에 많고, 완하제·부교감신경작동제에 무반응, 직장에서 거대 반추위가 골반 입구를 막으며 기아로 죽는다. 제4위 매식형: 우하복부 반죽 같은 장기, 임신 말기엔 안 만져지고 파열로 급사하기도 한다. 무긴장 반추위와 제4위 매식의 조합이 가장 흔하다.</span><span class="hang">서맥의 원인: Constable은 섭식 감소 때문이라 하고, Rebhun은 미주신경 역행성 자극에 의한 부교감성 서맥으로 보되 식욕부진·충만 부족과도 관련된다고 한다.</span><span class="hang">반추위 염소: 정상과 전방 협착 30 mmol/L 미만, 후방 협착 40 초과, 임신 말기 소화불량 66까지(Constable). Rebhun은 대부분 정상이거나 경미한 알칼리증이며 혈청 Cl 75 mEq/L 미만은 유문·근위 소장 폐색이나 신부전을 시사한다고 한다. 글로불린 상승은 농양, 복수 종양세포는 제4위 림프종(약 50%에서 검출)을 시사한다.</span><span class="hang">감별: 임신 말기 소화불량, 제2위-제3위 구 이물 폐쇄(크기 변동, 활기 있음), 만성 망위염, 사료성 제4위 매식, 제3위 매식, 유문 위석, 흑변 없는 제4위 궤양, 횡격막 탈장.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>미주신경성 소화불량 — 치료·예후<span class="hang">예후는 대개 나쁘다. 내경 25 mm 위관으로 비우고 세척한다. 수액·전해질 3일과 광유 경구(치료표는 1일 4 L 3일, 본문은 5~10 L 1일 3일) 또는 디옥틸설포석시네이트에 일부가 반응한다. 분만이 가까운 고가우는 수액으로 버티다 분만 유도할 수 있으나 다음 임신에 재발할 수 있다.</span><span class="hang">좌측 개복·반추위절개는 진단과 감압을 겸하고 과운동형은 7~10일에 회복한다. 제2위 주위 농양 배농은 1년 이상 생존을 연장했고, 가스 정체에는 영구 반추위 누관이 도움이 된다. 제4위 절개는 대개 불만족스럽다. 상당수는 도축을 권한다.</span><span class="hang">Rebhun 112두 장기 추적(양호/전체): 망위염 13/32, 제2위 농양 10/15, 우측 제4위 염전 3/26, 미만성 복막염 0/8, 천공성 궤양 3/6. 압박성 농양은 배농으로 풀려 예후가 비교적 좋다.</span><span class="hang">Large Animal IM 원칙: 원인 확인(대개 개복), 원인 치료, 반복 감압, 사료·물 제한과 장초 급여, 반추위액 이식, 만성 가스성 고창이면 누관. 반응은 수주가 걸린다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">37.</span><span>제4위 좌방전위(LDA) — 원인·기전<span class="hang">분만 전 2주~분만 후 2~4주의 건물섭취량 감소로 반추위 충만이 줄고, 농후사료 증가와 휘발성지방산이 제4위 운동저하와 가스(메탄 약 70%) 축적을 일으킨다. 약 90%가 분만 6주 내 생기며 북미 비유기 발생률 3~5%(목표 3% 미만), 치명률 약 5%(설사 동반 21%)다.</span><span class="hang">위험요인: 분만 전 음의 에너지 균형, 과비, 사조 관리 불량, 분만 전 사료 1.65 Mcal NEl/kg DM 초과, 조섬유 16~17% 미만, 완전 펠릿 사료, 4~7세, 태반정체·케톤증·자궁염·쌍태·유열. 유전율 0.2~0.5이며 모틸린 유전자 SNP가 관련된다. 분만 전 저칼슘이 위험을 4.8배 높였다는 연구와 아니라는 연구가 있다. 칼슘 1.2 mmol/L 미만에서 제4위 운동이 사라진다.</span><span class="hang">분만 후 복강 공간과 반추위 충만 부족 상태에서 가스 찬 제4위 기저부·대만이 반추위 아래로 미끄러져 좌측 복벽을 올라간다. 폐색이 불완전하고 혈행 장애가 없어 영향은 만성 기아이며, 경도 저염소·저칼륨 알칼리증, 이차 케톤증, 지방간이 따른다. 내강압 중앙 9 mmHg. 내독소혈증은 없다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>좌방전위 — 임상증상<span class="hang">분만 후 수일~1주 내 농후사료 거부(건초는 먹음), 유량 30~50% 감소, 케톤증. 케톤증 치료 후 호전되다 재발하는 경우가 흔하다. 좌측 복부가 납작하고 늑골궁이 벌어져 보인다. 활력징후 정상, 분변은 적고 묽다.</span><span class="hang">겸부 앞쪽에서 반추위음이 안 들리고, 겸부 중앙과 팔꿈치를 잇는 선 아래에서 반추위와 무관한 고음 딸랑음이 난다. 9~12늑골 상부 1/3에서 핑과 진탕음. 수송 직후 사라졌다가 24~48시간에 다시 난다. Rebhun: 핑은 대개 요각-팔꿈치 선상, 9늑골(흔히 8늑골)까지 뻗고, 큰 전위는 13늑골 뒤 겸부에 반달 모양으로 보인다. 송아지는 늑골 뒤 겸부 등쪽에 핑이 나고 주소는 만성·간헐적 고창이다. 성우도 좌측 하방의 핑은 좌방전위로 간주한다. 반추 모니터에서 핑 1~3일 전 반추 시간이 줄 수 있다.</span><span class="hang">천공성 궤양 동반 시 발열, 복통, 양측 겸부 핑(기복증)이 나타나며 예후가 나쁘다. 알칼리증에 의한 발작성 심방세동은 교정 후 5일 내 대개 사라진다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>좌방전위 — 검사·감별<span class="hang">케톤뇨는 항상 있고 혈당은 정상~고혈당, 경도 저염소·저칼륨 알칼리증. 생검상 55%에 지방간. 심한 케톤증 동반 시 혈액 pH가 산성일 수 있다(Rebhun). 예측 지표: 분만 전에는 NEFA만 관련됐고, 분만 후 1~7일 혈청 BHB 1.2 mmol/L 이상은 8배, 유즙 BHB 1.2 이상은 3.4배 위험했다. 분만 후 1~2주 AST 100~180 U/L와 BHB 1.0~1.6 mmol/L도 위험과 관련된다. 감시는 분만 전 마지막 주 NEFA, 분만 후 첫 주 BHB에 둔다.</span><span class="hang">제4위 천자(좌측 10~11늑간 중간 1/3)는 원충 없는 pH 2의 액, 반추위액은 원충 있고 pH 6~7. 초음파로 좌복벽과 반추위 사이의 제4위(배쪽 액, 등쪽 가스, 주름)를 본다.</span><span class="hang">감별: 단순성 소화불량, 원발성 케톤증(분만 2~6주, 포도당·프로필렌글리콜에 12~24시간 반응, 재발 적음), 만성 망위염(무긴장 반추위의 넓고 낮은 퐁), 미주신경성 소화불량, 비만우 증후군, 반추위 붕괴(진탕음 없음).</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>좌방전위 — 수술 교정<span class="hang">우겸부 대망고정술(기립): 가장 널리 쓰이며 혼자 할 수 있다. 위치가 상대적이고 비만우 대망이 찢어질 수 있으며 이후 우방전위가 가능하다. 유문고정술은 유문부 장막근층을 봉합에 포함한다(유문에 너무 가깝지 않게).</span><span class="hang">우측 정중선 옆 제4위고정술(앙와): 정확한 위치와 영구 유착, 궤양 봉합이 가능하다. 흡인성 폐렴, 인력, 절개부 탈장·누관, 유방정맥 문제가 단점이고 폐렴·근골격 손상·임신 말기 소에 금기다. 좌겸부 제4위고정술은 조수가 필요하고 핑이 뚜렷한 예에 한다. 복강경법은 회복이 빠르다.</span><span class="hang">맹목 봉합·토글핀: 빠르고 싸나 제4위 미스, 유문 폐색, 다른 장기 관통, 복막염, 정맥염 위험이 있다. 14일·60일 도태율이 10%·20%로 기립 겸부 수술(3%·7%)보다 높다. 48~72시간에 호전이 없으면 봉합을 풀거나 탐색하고 토글은 10~14일 넘게 두지 않는다(Rebhun).</span><span class="hang">LDA 82%, RDA 74%가 완치 퇴원했다. 짧은 이환, 좋은 식욕, 정상 분변, 낮은 헤마토크릿·요소·빌리루빈·AST, 높은 Na·K·Cl이 좋은 예후 인자다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>좌방전위 — 내과·보조 치료<span class="hang">굴리기: 우측으로 눕혀 시계방향(뒤에서 볼 때)으로 앙와시켜 2~5분 흔든 뒤 좌측으로 내려 바로 일으킨다. 우방전위·염전, 임신 말기 소에는 금한다. Rebhun 진료에서 단순 LDA 100두 중 30두가 한 비유기 동안 교정을 유지했다. 이후 건초를 최대한 먹인다.</span><span class="hang">염화칼륨 경구 2~4 oz(1 oz는 420 mEq, 1 g은 약 14 mEq) 1일 1~2회. 혈청 K 2.5 mEq/L 미만은 위중 환자로 경구(최대 1 lb)와 80 mEq/L 서서히 IV를 병행하며, IV 수액에는 대개 40 mEq/L. 반복 이소플루프레돈 투여가 심한 저칼륨혈증과 관련된다.</span><span class="hang">에리트로마이신 8.8~10 mg/kg IM이 가장 효과적인 제4위 운동촉진제로 수술 전 10 mg/kg 1회가 배출 속도와 유량을 늘렸으나, 항균제의 비항균 목적 사용은 내성 우려로 부적절하고 표시외 사용이다. 메토클로프라미드, 네오스티그민, 베타네콜은 권장되지 않는다. 플루닉신 2.2 mg/kg 수술 전 1회 IV가 1일째 반추위 수축을 늘렸다. 술후 반추위액 10 L 이식(당일과 다음 날)은 섭식·유량을 늘렸다. 케톤증은 포도당 IV와 프로필렌글리콜로 치료한다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>좌방전위 — 예방<span class="hang">분만 전 과비와 음의 에너지 균형을 피하고 사조 관리로 건물섭취를 최대화한다. 분만 전 사료 1.65 Mcal NEl/kg DM 이하, 곡류·옥수수 사일리지 최소, 다른 조사료 자유채식, 대량 농후사료 사전급여는 이득이 없다. 조섬유 최소 17%로 반추위를 채운다. 유열·준임상 저칼슘혈증, 케톤증, 자궁염을 관리하고, 준임상 케톤증 검색과 프로필렌글리콜 치료가 위험을 줄였다(Rebhun). 분만 3주 전 모넨신 서방형 캡슐(1일 335 mg, 95일)은 좌방전위와 임상 케톤증을 약 40%, 태반정체를 약 25% 줄인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">43.</span><span>제4위 우방전위(RDA)와 염전(AV) — 정의·기전<span class="hang">주로 분만 후 3~6주 성우에 생긴다. AV:LDA는 1:7.4, 병원 치명률 AV 24%, LDA 6%. 육우는 1개월~6세, 송아지는 수주~6개월령에 생기며 이유 전 송아지 RDA는 흔히 AV로 진행해 고창증으로 오진되기도 한다.</span><span class="hang">수술 소견 기준: RDA는 팽만 장기가 우측 전복부에 있으나 간이 복벽에 닿아 있고 꼬임이 없다. AV는 간을 내측으로 밀어내고 대망이 덮지 않으며 주로 제3위-제4위 접합부에 단단한 꼬임이 있다. 꼬임이 제2위-제3위 접합부에 있으면 제3위-제4위 염전(OAV)이다. 술후 생존율은 AV 87%, OAV 55%, 제2위-제3위-제4위 염전은 0%에 가깝다.</span><span class="hang">확장기에는 염산·NaCl·K가 분비되나 나가지 못해 탈수와 저염소·저칼륨성 알칼리증이 온다. 우방전위는 불안정해 응급 수술 대상이다. 염전은 180~270° 꼬여 허혈성 괴사를 일으키고 소만을 중심으로 제4위·제3위·제2위가 함께 돈다(Rebhun). 600 kg 소의 제4위에 최대 35 L가 찬다. 내강압 16 mmHg가 회복·불량 군의 최적 구분값이었다. 진행 염전은 젖산 산증이 겹치고 역설적 산성뇨가 나온다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>우방전위·염전 — 임상증상<span class="hang">우방전위: 최근 분만, 막연한 소화불량, 적고 묽은 변, 우측 9~12늑골 핑.</span><span class="hang">초기 염전: 침울, 탈수, 계속 물을 홀짝임, 체온 정상, 심박 정상~100(Rebhun은 60 미만 서맥부터 110까지), 반추위 정지, 우측 늑골궁 뒤의 긴장된 장기와 진탕음. 3~4일 지나면 우측이 보이게 팽만하고 직장으로 촉지된다.</span><span class="hang">진행 염전: 심박 100~120, 핑이 8늑골까지 뻗으면 간이 밀려났다는 뜻이다. 직장에서 장기와 복벽 사이에 손이 안 들어가고 대망이 덮고 있다(맹장은 내외측을 다 만질 수 있음). 분변은 적고 검으며 48시간 내 혈변·흑변이 된다(설사로 오인 금지). 교정 안 하면 48~96시간에 죽는다. 느리고 얕은 호흡은 심한 알칼리증의 호흡 보상이다. 송아지 급성 염전은 심박 120~160, 우측 뚜렷한 핑과 압통.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>제4위 질환의 산염기·전해질(Rebhun)<table class="bxt"><tr><th>상태</th><th class="c">pH</th><th class="c">Cl</th><th class="c">K</th><th class="c">HCO3</th><th class="c">BE</th></tr><tr><td>정상 정맥혈</td><td class="c">7.35~7.50</td><td class="c">97~111</td><td class="c">3.7~4.9</td><td class="c">20~30</td><td class="c">−2.5~+2.5</td></tr><tr><td>전형적 LDA</td><td class="c">7.45~7.55</td><td class="c">85~95</td><td class="c">3.5~4.5</td><td class="c">25~35</td><td class="c">0~10</td></tr><tr><td>전형적 RDA</td><td class="c">7.45~7.60</td><td class="c">85~95</td><td class="c">3.0~4.0</td><td class="c">30~40</td><td class="c">5~15</td></tr><tr><td>전형적 AV</td><td class="c">7.45~7.60</td><td class="c">75~90</td><td class="c">2.5~3.5</td><td class="c">35~50</td><td class="c">10~25</td></tr><tr><td>진행 AV</td><td class="c">7.45~7.65</td><td class="c">60~80</td><td class="c">2.0~3.5</td><td class="c">35~55</td><td class="c">10~35</td></tr><tr><td>괴사 동반 말기 AV</td><td class="c">7.30~7.45</td><td class="c">85~95</td><td class="c">3.0~4.5</td><td class="c">15~25</td><td class="c">−10~0</td></tr><tr><td>심한 케톤증 동반 LDA</td><td class="c">7.15~7.30</td><td class="c">85~95</td><td class="c">3.5~4.5</td><td class="c">15~30</td><td class="c">−10~0</td></tr></table><span class="hang">단위는 Cl·K·HCO3 mEq/L. 큰 염전에 심한 탈수·쇠약인데 산염기가 정상이거나 산증이면 괴사·쇼크가 겹친 것으로 예후가 매우 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>우방전위·염전 — 예후 지표<span class="hang">수술 소견: 1군 주로 가스·심박 정상(매우 좋음), 2군 액체 20 L 미만·심박 100 미만(좋음), 3군 액체 20 L 이상·심박 100 이상(중등도).</span><span class="hang">심박, 탈수, 식욕부진 기간, 혈청 ALP가 가장 좋은 수술 전 지표였다. 음이온차 30 mEq/L는 염소나 염기과잉보다 정확한 불량 지표다. 혈중 L-젖산 2 mmol/L 이하는 좋은 예후, 6 이상은 나쁜 예후다(Rebhun은 6 초과라도 좋은 결과가 있어 단일 수치로 결정하지 말라 함). 수술 시 많은 액량, 정맥 혈전, 청색·흑색 제4위는 불량하다.</span><span class="hang">Rebhun: 염전 24시간 초과는 생존율 50% 미만, 48시간 초과는 매우 나쁘다. 대사성 산증에 기립불능이면 극히 나쁘다. 신체 소견이 괜찮으면 검사치만으로 수술을 거부하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>우방전위·염전 — 치료·합병증<span class="hang">수술 전 구별이 안 되므로 즉시 기립 우겸부 개복을 한다. 우겸부 대망고정술이나 우측 정중선 옆 제4위고정술만 적응이다(Rebhun). 흡인 감압 후 제3위를 등쪽·외측으로 밀어 정복하고, 액체가 10 L 넘으면 위관을 쌈지봉합해 배액한다.</span><span class="hang">수액: 7.2% 고장식염수 2 L를 10분에(3.4 mL/kg) 준 뒤 0.9% 10 L를 50분에 준 것이 0.9% 26 L를 65분에 준 것보다 빠르고 효과적이며 쌌다. 검사실이 없으면 0.85% 식염수 2 L, 1.1% KCl 1 L, 5% 포도당 1 L 혼합액을 시간당 4~6 L. 술후 경구 NaCl 50~100 g과 KCl 50~120 g 매일(Rebhun은 경증에 물 20~40 L와 KCl 30~120 g 1일 2회, 중증엔 고장식염수 1~2 L 또는 생리식염수 20~60 L에 KCl 40 mEq/L). 수술 전 경구 수액은 팽만을 악화시킨다.</span><span class="hang">Rebhun 관행: 수술 전 플루닉신 500 mg, 고장식염수 1~2 L IV, 칼슘 500 mL SC, 술후 이온칼슘 감시와 반추위액 이식, 광범위 항생제. Constable: 25% 보로글루콘산칼슘 500 mL IV가 경험적으로 좋고, 콜린작동제는 무효, 술후 3~5일 건초만 준다. 송아지는 앙와로 배꼽과 검상 사이 최고점에 16G 12 cm 바늘을 찔러 응급 감압한다.</span><span class="hang">술후 미주신경성 소화불량 유사 증후군이 14~21%에서 생기고 12~20%만 정상 생산으로 돌아간다(미주신경 신장, 소만부 혈전, 벽 괴사, 복막염). 24~72시간은 좋아 보이다 나빠지므로 최소 96시간 지나야 좋은 예후를 말할 수 있다. 발병 1~4시간 안에 교정하면 훨씬 적다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>제4위 궤양 — 원인·분류·증상<span class="hang">원발성은 원인 불명이고, 이차성은 좌우 방전위(담즙 역류), 림프종, BVD·악성카타르열, 제4위 매식·염전에서 생긴다. 고비유 조기 젖소, 장거리 수송·통증성 질환 후 황소, 비육우 급사, 포유 육우 송아지(2~4개월령)에서 발생한다. 확진 성우 치명률은 약 50%다.</span><table class="bxt"><tr><th>유형</th><th>내용</th><th class="c">치명률</th></tr><tr><td>1형 비천공성</td><td>불완전 관통, 경미한 출혈</td><td class="c">25%</td></tr><tr><td>2형 출혈성</td><td>큰 혈관 침식, 심한 출혈·빈혈</td><td class="c">100%</td></tr><tr><td>3형 천공·국소 복막염</td><td>유착으로 국한</td><td class="c">50%</td></tr><tr><td>4형 천공·미만성 복막염</td><td>내용물이 복강 전체로</td><td class="c">100%</td></tr></table><span class="hang">출혈성: 약 70%가 복통, 흑변, 창백한 점막 중 하나 이상을 보인다. 갑작스러운 식욕부진, 심박 90~100, 흑변(출혈 18~24시간 뒤부터, 4~6일 지속). 대량 출혈은 체온 정상, 백묵색 점막, 맥 100~140, 쇠약, 회음부의 달콤한 혈액 냄새. 경미한 출혈은 몇 입 먹다 멈추는 식욕, 이갈이, 간헐적 잠혈(Rebhun).</span><span class="hang">천공: 국소형은 망위염과 비슷하나 정중선 우측 중간 배쪽 통증이 가장 심하고 39.4~40.6℃, 분만 후 6주에 많다. 미만형은 일시적 고열 40.0~41.4℃, 차가운 피부, 심박 100~140, 패혈성 쇼크. 송아지는 흔히 폐사한 채 발견된다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>제4위 궤양 — 진단<span class="hang">흑변은 급성 출혈성 궤양을 거의 확진하지만 정상 분변이 만성 궤양을 배제하지 않는다. 잠혈은 여러 번 검사하며 염전, 장폐색, 흡혈 기생충에서도 양성이다. 십이지장 궤양도 같은 증상을 낸다. 가스트린은 정상 103, 출혈성 궤양 평균 1213 pg/mL였다. 펩시노겐 5.5 U/L 초과는 민감도 0.65, 특이도 0.81로 유용성이 낮다.</span><span class="hang">국소 복막염은 초음파와 복강천자(백혈구 5000~6000/μL 초과, 단백 3.0 g/dL 초과)가 가장 좋다. 악취 복수와 낮은 혈장 단백은 미만성을 시사한다. 헤마토크릿은 출혈 시작 최소 4시간(초급성은 12~18시간) 뒤에야 반영된다. 흑변 소는 다른 부위 림프종을 꼭 찾는다(수혈에 반응 없이 폐사).</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>제4위 궤양 — 치료<span class="hang">수혈은 임상상태(쇠약, 빈맥, 호흡곤란)로 판단한다. Rebhun: 수화 정상·24~72시간 출혈 소의 수혈 기준은 PCV 14%, 탈수 소는 16~17%라도 필요할 수 있다. 백묵색 점막, 맥 100 초과(송아지 120 초과)면 대개 필요하다. 만성 보상성 빈혈은 8~9%로도 견디고, PCV가 안정되고 젖산 2 mmol/L 미만이면 불필요할 수 있다. 건강우 전혈 4~6 L(Constable 심한 실혈 시 20 mL/kg), 첫 수혈은 교차시험 생략, 등장 수액 병행. 아미노카프로산 40 mg/kg 6시간마다 1일, 20분 IV.</span><span class="hang">제산제: 산화마그네슘 500~800 g/450 kg 1일 2~4일(성우 경험적 효과). 라니티딘 1.5 mg/kg IV 8시간마다, 판토프라졸 1 mg/kg IV 또는 1.5~2 mg/kg SC 24시간마다(Rebhun, 반추동물 효능 미입증). 송아지는 라니티딘 경구 10 mg/kg 8시간마다, 오메프라졸 경구 4 mg/kg 24시간마다, 수크랄페이트. 카올린-펙틴은 더 이상 권하지 않는다.</span><span class="hang">사일리지·고수분 옥수수·미세 분쇄 농후사료를 5~14일 끊고 양질 건초로 바꾼다. 천공 국소 복막염은 우방 안정과 광범위 항생제 7~14일(또는 정상 체온 48시간까지). 코르티코스테로이드와 NSAID(아스피린, 페닐부타존, 플루닉신)는 금기다(Rebhun). 천공성 궤양은 방전위가 없으면 내과 치료가 낫다는 것이 합의다. 출혈과 방전위가 함께 있으면 PCV 14% 초과면 바로 교정하고, 미만이며 빈혈 징후가 있으면 수술 전후에 수혈한다. 미만성 복막염은 대개 산증이므로 젖산링거액을 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">51.</span><span>제4위 매식 — 원인·임상<span class="hang">원발성은 분만 후 젖소에 많고(유문동만 또는 체부까지) 우측 개복으로만 확인된다. 사료성은 추운 겨울 저질 조사료를 많이 먹는 임신 육우에서 영하 5~10℃가 수일 계속되면 농장 임신우의 최대 15%가 걸린다. 모래, 자갈, 완두 줄기, 아몬드 껍질도 원인이다. 이차성은 망위염과 천공성 궤양 복막염이 가장 흔하다(Rebhun).</span><span class="hang">분만우 원발성은 좌측 핑이 없는 것 외에 좌방전위와 같다. 사료성은 수일에 걸친 거식, 소량 분변, 중등도 팽만, 체중 감소, 쇠약. 체온 정상~저체온, 심박 정상~100, 진행 시 120. 반추위는 정지, pH 6.5~7.0. 우하복부 바닥의 장기는 임신 자궁 때문에 촉지가 어렵다. 심하면 3~6일에 폐사하고 파열 시 수시간에 죽는다. Rebhun: 소량의 산성 액만 빠져나가 설사가 흔하고, 대부분 알칼리증은 중등도이거나 없다.</span><span class="hang">대사성 알칼리증, 저염소·저칼륨혈증, 혈액농축. 유문동 국한 매식이 저염소가 더 심하다. 감별은 미주신경성 소화불량의 매식, 제3위 매식, 미만성 복막염, 장폐색이다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>제4위 매식 — 치료·예방<span class="hang">심박 100~120의 쇠약우는 경제성이 낮으면 안락사한다. 균형 전해질액을 24시간 100~150 mL/kg로 최대 72시간 지속 IV. 25% 디옥틸소듐설포석시네이트 120~180 mL/450 kg을 온수 10 L, 광유 5 L와 섞어 매일 3~5일 위관 투여하며 3일째까지 호전돼야 한다. 기름 섞인 분변 증가는 좋은 징후다.</span><span class="hang">수술: 유문동 매식은 우겸부 개복으로 바깥에서 주무르고 디옥틸설포석시네이트 100 mL를 내강에 주사하며 경과가 좋다. 체부 매식의 제4위 절개는 무긴장 악화로 결과가 나쁘다. 반추위절개 후 관으로 광유 하루 2 L를 수일 넣는 방법도 있다. Rebhun: 커피 1 lb, 베타네콜 0.07 mg/kg SC, 리도카인 CRI(1.3 mg/kg 서서히 후 0.05 mg/kg/분), 에리트로마이신 8~10 mg/kg IM 1일 1~2회(미국에서 비항균 목적 사용은 불법).</span><span class="hang">분만 2주 이내 임신우가 반응 없으면 덱사메타손 20 mg IM으로 분만 유도. 모래 매식은 이동시키고 광유 하루 15 L 이상. 예방은 저질 조사료의 단백·DE 분석과 곡류 보충, 추운 기간 유지 요구량 30~40% 증가 반영, 눈으로 수분 섭취하게 두지 않기.</span><span class="hang">제3위 매식: 정의가 어렵고 대개 개복·부검 시 진단한다. 임신 말기에 거식, 소량 분변, 정상 반추위 운동을 보이며 제4위가 정상이면 전해질도 정상일 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>장폐색 — 원인·임상<span class="hang">장중첩: 성우는 원위 공장이 가장 흔하고, 2개월 미만 송아지에 가장 많다(장염이 위험요인). 성우는 결절충 결절·용종·선암이 시발점이 된다. 염전: 소장 전체 또는 원위 공장·회장(flange), 송아지 장간막근부, 대망·유문고정 후 십이지장 S자 곡. 교액: 장간막 열공, 제대 잔류물, 대망 열공, 개방 거세 후 gut tie. 내강 폐색: 위석·모구, 회장 매식, HBS 혈병, 지방괴사, 간농양 압박.</span><span class="hang">초기 급성 복통(배차기, 뒷다리 구르기, 울음)이 8~12시간에 가라앉고 거식·무배변이 된다. 혈행 장애가 없으면 활력징후가 거의 정상이다. 우측 경도 팽만과 진탕음, 분변은 소량·점액 덮인 덩어리, 장중첩은 붉은 죽 같은 혈액(raspberry), 마지막엔 점액 마개만. 장중첩은 12~24시간 뒤 복통 없이 1주까지 생존할 수 있다(Rebhun). 근위 폐색일수록 전위·제4위가 이차 팽만한다. 3~8일에 폐사한다.</span><span class="hang">직장: 장중첩 약 20~25%가 소시지 모양, 염전은 팽팽한 장간막 띠. 수일 지나면 직장은 비고 타르 같은 점액만 있다. 초음파에서 무운동 확장 고리와 침전은 수술 병변을 시사한다. 확장 고리가 하나면 십이지장, 여럿이면 공장·회장. 근위 폐색은 혈청 Cl이 70 mEq/L 미만까지 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>장폐색 — 감별·치료<span class="hang">가장 중요한 감별은 소장성 소화불량이다. 배변을 상당량 하는 소는 소장 폐색이 아니다. 맹장확장·염전, 큰 우방전위·염전, 자궁염전, 장간막 혈종·혈복, 신우신염·요로결석, 유기인 중독, 수컷 요도폐색, 미만성 복막염과 감별한다.</span><span class="hang">우겸부 개복 교정이 유일한 치료다. 수술 전 IV 수액과 플루닉신 1.1 mg/kg, 술전후 항생제, 절제·문합 시 광범위 항생제 3~7일. 술후 4~24시간에 묽은 변, 5~7일간 정상 체온·식욕·배변이면 예후가 좋다. 리도카인 CRI는 신생 송아지에서 경련을 일으킨 예가 있다(Rebhun).</span><span class="hang">생존율: 소장 전체 염전 44%, 원위 공장·회장 염전 86%(젖소 63%, 육우 22%), 장중첩 약 50%, 모구 폐색 72%. 회장 매식은 맹장 쪽으로 주물러 넘기면 결과가 매우 좋다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>출혈성 장증후군(HBS) — 원인·임상<span class="hang">공장의 분절성 괴사출혈성 장염과 내강 혈병으로 소장이 막힌다. C. perfringens A형이 자주 분리되나 재현 실험이 모두 실패해 이차 요인으로 보며, 벽내 혈종이 먼저 생긴다는 조직 소견이 있다. 진균독소·STEC 관여설도 있다. 산유량 최고기 성우(미국 조사 중앙 분만 후 104일, 중앙 3산차)에 산발하고 브라운스위스가 과대 대표된다(Rebhun은 혈통 농장 연간 유병률 10%까지). 대규모 우군, 소마토트로핀, 고에너지 섭취가 위험요인이다.</span><span class="hang">갑작스러운 거식, 유량 급감, 우측 팽만, 쇠약에서 기립불능, 복통, 급사도 있다. 체온 정상~경미 상승, 심박 90~120, 창백한 점막, 우측 진탕음. 직장에서 블랙베리 잼 같은 흑적색 끈적한 변과 소화된 혈액 냄새, 단단한 장 고리(혈병)와 탄력 있는 고리. 장중첩과 진찰로 구별하기 어렵다. 경과 2~4일.</span><span class="hang">초음파: 확장 고리(직경 4.3~12.0 cm), 운동 소실, 19%에서 혈병에 해당하는 고에코 물질, 장 사이 액체·섬유소는 진행 예. 대사성 알칼리증, 저칼륨·저염소혈증. 살모넬라와 달리 열이 없다(Constable).</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>출혈성 장증후군 — 치료·예방<span class="hang">특이 내과 치료는 없고 수술 확인·교정을 권한다. 집중 수액, 페니실린. 벽내 혈종이 일차 병변이라는 소견에 따라 절제·문합을 선호하는 견해와, 초기 병변은 혈병을 주물러 깨는 것으로 좋은 결과를 얻었다는 보고가 있다. Peek은 생존율 58%로 가장 높은 성적을 보고했고 장절개보다 마사지가 결과가 좋았다(Rebhun). 약한 장벽은 조작 시 쉽게 파열된다.</span><span class="hang">예방(제안 수준): 섬유 증량, 골라먹기 방지, 급속 발효 탄수화물 감량, 섭취 일정 유지, 급격한 변경 회피, 사료의 C. perfringens·A. fumigatus 검사, 농장 분리 A형 균 자가백신 고려. 시판 C·D형 백신은 효과가 없을 것으로 본다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>맹장확장·맹결장염전 — 원인·임상<span class="hang">비유 첫 12주의 3~5세 고비유 젖소에 많고 브라운스위스가 과대 대표된다. 맹장 내 휘발성지방산(특히 부티르산) 증가에 의한 무긴장설이 있으나 최근 연구는 나선결장 운동저하를 일차 요인으로 본다. 저칼슘혈증이 85%에 있다. 건강우 번식검사에서 경도 확장이 촉지되기도 한다(Rebhun).</span><span class="hang">단순 확장: 식욕·유량·분변 감소, 활력징후 정상, 우겸부에서 10늑간까지 핑, 진탕음. 맹결장염전: 거식, 반추위 정지, 분변 소실, 우측 팽만, 탈수, 심박 80~100, 복통(Rebhun은 소장 폐색만큼 격렬할 수 있다고 함).</span><span class="hang">직장: 길이 최대 90 cm, 직경 최대 20 cm의 움직이는 원통형 장기와 골반 쪽 맹단이 진단적이다. 직장검사나 수송 후 파열하기도 한다. 우방전위·염전과는 핑 위치(맹장은 겸부 중심), 촉지(맹장은 상복부에서 쉽게 닿고 움직임), 혈청 염소(맹장은 큰 변화 없음)로 구별한다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>맹장확장·맹결장염전 — 치료<span class="hang">내과 치료 대상(Rebhun): 심박 정상~경미 상승, 약간의 배변과 조사료 식욕, 탈수 경미, 맹단이 골반 입구에서 촉지, 저칼슘혈증. 완하제-반추촉진제(온수에 타서 위관), 반추위액 이식, 칼슘·칼륨, 발효성 사료 제한을 3~7일 지속하며 진통제는 쓰지 않는다. Constable은 양질 건초만으로 2~4일에 회복할 수 있다고 한다. 네오스티그민 0.02 mg/kg SC 매시간 2~3일(효능 시험 없음), 베타네콜 0.07 mg/kg SC가 더 협조적인 운동을 유도한다. 자일라진은 금기다.</span><span class="hang">수술 대상: 염전·후굴, 지속 빈맥, 배변·식욕 소실, 탈수, 중등도 이상 팽만, 복통, 재발. 수술 전 수액과 플루닉신 0.5~1.0 mg/kg. 긴 우겸부 절개, 바늘 흡인 감압 후 맹장 첨부를 절개해 비우고 근위결장·회장을 짜낸 뒤 2층 봉합한다. 괴사·재발 시 부분 또는 전 맹장절제.</span><span class="hang">재발률은 1주 내 11~13%, 장기 약 25%(Constable), 약 10%(Rebhun). 단순 확장 예후는 매우 좋고 조기 진단된 염전도 대개 좋다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>복부 지방괴사<span class="hang">대망·장간막의 단단한 괴사 지방 덩어리로 저지종과 앵거스에 상대적으로 흔하고 7세에 정점이다. 태아로 오인되기 쉽고 서서히 장폐색을 일으켜 중등도 복통과 소량 배변을 보인다. 정기 직장검사에서 우연히 발견되는 일이 많다. Rebhun: 과비 중·노령우의 직장 협착이 가장 흔하고 종양보다 훨씬 단단하며, 완전 폐색 전에는 설사를 한다. 치료가 없고 예후가 절망적이라 도태한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">60.</span><span>복막염 — 원인·임상<span class="hang">대부분 이차성이다. 망위염, 반추위 투관, 제4위 궤양 천공, 염전 후 괴사, 곡류과식 반추위염, 제왕절개, 교미 시 질 파열, 인공수정 시 정액 복강 주입, 칼슘·셀레늄 등의 복강 주사, 분만 중 자궁·직장 파열, 분만 시 소장 절단. Rebhun은 우겸부 복강 주사(특히 고농도 포도당)와 자궁 주입 피펫의 질 천공을 든다.</span><span class="hang">급성: 거식, 발열(국소형 39.5℃가 24~36시간 뒤 정상화, 41.5℃까지 고열은 미만성, 말기 저체온). 정상 체온이 배제하지 않는다. 분변 감소와 최대 3일 무배변, 끈적하게 마른 직장, 작은 검은 공 같은 변과 젤리 점액. 움직이지 않고 등을 구부리며 배변·배뇨 시 신음한다.</span><span class="hang">초급성 미만성(분만 직후, 장관 파열): 혼수에 가까운 침울, 37~37.5℃, 심박 110~120, 통증 반응 없음, 24~48시간에 폐사. 만성: 유착에 의한 소화불량과 독혈증이 반복 악화하며 예후가 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>복막염 — 진단·치료<span class="hang">혈액: 급성 미만성은 백혈구감소와 퇴행성 좌방이동, 수일 경과하면 호중구증가와 좌방이동, 급성 국소는 정상~경미 증가와 재생성 좌방이동, 만성은 정상이거나 현저한 호중구증가. 복수는 양, 혈액·사료 혼입, 응고·단백, 백혈구, 미생물을 본다. D-dimer가 가장 정확하고(95% 이상), LDH와 혈청-복수 알부민 경사는 민감도 49~67%, 특이도 88~96%다.</span><span class="hang">감별: 국소형은 망위염, 장폐색, 간·비장 농양, 방전위, 자궁염, 케톤증. 미만형은 유열, 대장균성 유방염, 곡류과식, 궤양 천공, 자궁 파열. 만성형은 미주신경성 소화불량, 지방괴사, 복수(심질환, 후대정맥 혈전, 중피종), 방광 파열.</span><span class="hang">치료: 원인 치료, 필요시 탐색 개복. 광범위 항생제 IV·IM(비교 시험은 없고 투여 편의와 휴약기간으로 선택). 독혈증·쇼크 시 집중 수액과 플루닉신 0.25~1.1 mg/kg IV 8~12시간마다. 복강내 항생제는 근거가 없고 유착 위험이 있다. 포비돈요오드(3%, 10%) 세척은 화학적 복막염을 일으켜 쓰지 않는다. 미만성은 대개 산증이므로 젖산링거액을 고려한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">62.</span><span>겨울설사(winter dysentery)<span class="hang">소 코로나바이러스와 관련되며 악천후, 밀사, 수송이 임상을 촉발한다고 본다. 추운 계절 사사 중인 최근 분만 2~6세 젖소에 많고 비육우·육우에도 생긴다. 1~2주에 우군 전체로 번지고 이환율은 1주 뒤 최대 100%, 치명률 2% 미만이다. 면역은 약 6개월, 2~3년 안에는 재발이 드물다. 60두 이상, 전년 발생, 계류식 우사, 분뇨·사료 장비 공용이 위험요인이다.</span><span class="hang">잠복기 3~7일 후 폭발적 설사가 4~7일에 성우 대부분을 덮친다. 설사 전 39.5~40.5℃ 발열, 약 1주간 유량 급감(심하면 하루 유량 25~95% 감소), 짧은 식욕부진. 분변은 액상·균질·냄새 적고 점액·상피 없이 혈액량에 따라 암녹색~흑색이며 세차게 분출한다. 콧물·기침이 동반된다. 2~3일에 정상 변으로 돌아오나 생산 회복은 수주~수개월 걸리기도 하고, 폐사는 주로 장내 실혈과 빈혈 때문이다.</span><span class="hang">분변·구인두액에서 전자현미경, ELISA, RT-PCR로 검출하며, 성우는 급성기 IgG가 이미 높아 IgA·IgM 포획 ELISA가 유용하다. 독혈증·탈수가 없고 24~48시간에 자연 치유되어 치료 가치는 의심스럽고 심한 탈수만 수액으로 치료한다. 특이 예방법은 없고 물품을 통한 전파 차단과 밀사 해소에 힘쓴다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>살모넬라증 — 성우형<span class="hang">주요 혈청형은 S. Typhimurium, S. Dublin, S. Newport다. 보균우 유입과 사료·물 결핍, 수송, 밀사가 발병을 촉발한다. S. Dublin은 농장 상재형으로 스트레스 시 산발하고 최근 분만우에 많다.</span><span class="hang">급성 장염: 40~41℃ 고열이 설사 시작과 함께 급락하고, 심한 수양성 설사, 이질, 이급후증, 악취, 점액·혈액, 장 원주 모양의 섬유소 원주. 완전 거식, 빈맥, 착유우 무유, 큰 혈병 배출, 복통. 조기 치료하지 않으면 치명률 75%, 2~5일에 죽는다. 생존 임신우는 유산하고 S. Dublin은 증상 없이 임신 124~270일 유산을 일으킨다. 만성 장염은 간헐적 설사, 섬유소 원주, 39℃ 간헐 발열, 쇠약. 말단 건성괴저가 후유증으로 생긴다.</span><span class="hang">배양만이 확진과 혈청형을 준다. 급성기, 항생제 전에 채취한다. 보균우는 간헐 배균이라 반복 채취가 필요하고(말에서 5회 연속 음성으로 95% 이상 배제) S. Dublin은 분리가 더 어렵다. 감별은 콕시듐증(2~8개월령), 장폐색, HBS(열 없음), 겨울설사, 점막병, 고사리·비소 중독이다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>살모넬라증 — 치료<span class="hang">항생제는 보균우와 내성 우려로 논란이 있지만 급성 장염 소는 균혈증이 흔해 의심·확인된 균혈증은 치료해야 한다. 만성 장염과 건강 배균우 치료는 매우 논란적이다. 감수성 검사에 근거하고 세포내 침투가 좋은 약을 고른다. 페니실린, 에리트로마이신, 타일로신에는 대개 내성이다.</span><table class="bxt"><tr><th>약물(소)</th><th>용량</th></tr><tr><td>트리메토프림-설파</td><td>복합 20 mg/kg IV·IM 12~24시간마다</td></tr><tr><td>아목시실린</td><td>10 mg/kg IM 12시간마다</td></tr><tr><td>아목시실린-클라불란산</td><td>복합 12 mg/kg IM 12시간마다</td></tr><tr><td>암피실린</td><td>10 mg/kg 경구·IM 12시간마다</td></tr><tr><td>엔로플록사신*</td><td>2.5~5.0 mg/kg SC·IM 24시간마다</td></tr><tr><td>세프티오퍼*</td><td>1.1~2.2 mg/kg SC·IM 24시간마다 3일</td></tr><tr><td>플루닉신</td><td>2.2 mg/kg IV 단회</td></tr><tr><td>멜록시캄</td><td>0.5 mg/kg SC·IV 단회</td></tr></table><span class="hang">*표는 중요 항균제로 1차 사용을 권하지 않는다. 클로람페니콜·니트로푸라존은 식용동물 금지 국가가 많다. 경구·정맥 수액으로 탈수와 산염기를 교정하고 NSAID는 짧고 낮게 쓴다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>존씨병(Johne's disease) — 원인·전파·임상<span class="hang">Mycobacterium avium subsp. paratuberculosis(MAP)에 의한 만성 육아종성 장염이다. 환경에서 1년 이상 생존하고 HTST 살균에도 일부 생존한다. 감염우의 10~15%만 발병하며 임상 1두 뒤에 감염우 15~25두가 있다.</span><span class="hang">분변-경구 전파가 주경로이고 생후 수시간~수일이 가장 감수성이 높으며 최소 4개월까지, 1세부터는 성우 수준이다. 오염 유두·초유·우유, 감염우 우유 배균(임상우 최대 45%), 태내 감염(준임상 어미 태아 최대 9%, 임상 어미 39%)이 경로다. 발병 15~18개월 전부터 배균하고 농장 간 전파는 주로 감염우 구입이다. 잠복기 2년 이상, 대개 2~5세에 발병한다.</span><span class="hang">1단계 잠복(2세까지, 검출 거의 불가), 2단계 준임상(분변 배양 15~25%만 양성), 3단계 임상(대개 2~6세, 식욕 유지에도 점진적 체중 감소, 수주에 걸친 설사, 유량 감소, 활력징후 정상, 혈액·점액 없는 균질한 묽은 변, 분만 후 악화), 4단계 진행(수척, 하악간 부종, 물호스 같은 설사, 결국 폐사).</span><span class="hang">부검: 회장 말단·맹장·결장 시작부가 3~4배 두꺼워지고 점막이 주름지며 회맹판은 항상 침범된다. 장간막 림프절은 붓지만 결핵과 달리 괴사·석회화는 드물다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>존씨병 — 진단검사<table class="bxt"><tr><th>검사</th><th>성능·특징</th></tr><tr><td>분변 배양</td><td>가장 신뢰성 높은 지표. 특이도 98% 이상, 민감도 임상우 70% 이상, 준임상 23~29%. 4~16주 소요. 5두 혼합 시 민감도 86%, 특이도 96%</td></tr><tr><td>분변 PCR</td><td>수일 내 결과, 저배균우에서 배양보다 민감도 낮음. 생균 여부 모름</td></tr><tr><td>혈청·우유 ELISA</td><td>가장 흔히 씀. 준임상 민감도 7~39%, 1단계 약 10%. 1산 소 양성 확률 2~3배 낮음. OD·S/P 정량값이 배균량과 맞음</td></tr><tr><td>AGID</td><td>임상 질환 진단에 가장 적합. 민감도 96%, 특이도 94%. 결핵 청정 우군에만</td></tr><tr><td>보체결합</td><td>임상우 민감도 약 90%, 특이도 약 70%. 초기·보균우 검출 못함</td></tr><tr><td>IFN-γ</td><td>표준화 안 됨, 권장 안 함</td></tr></table><span class="hang">낙농 우군 감염 여부는 환경 분변 6개 배양이 가장 비용 효율적이다. 첫 의심례 확진은 부검(회장·장간막 림프절 조직·배양)이 가장 확실하다. 구입 시에는 출처 우군 상태를 보고, 구매자 우군 양성률의 절반 이하 우군에서 음성우만 산다.</span><span class="hang">감별: 오스테르타기아, 살모넬라, 이차 구리결핍(지역 문제, 구리에 반응), 만성 망위염, 영양불량, 신우신염, 림프종, 아밀로이드증.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>존씨병 — 치료·관리<span class="hang">완치법이 없어 치료를 권하지 않는다. 시도하면 평생 유지해야 하고 배균 기간을 늘린다. 이소니아지드 10~20 mg/kg 경구 1일 평생(간 기능 감시), 리팜핀 10~20 mg/kg 경구, 클로파지민 두당 600~1000 mg 경구 1일, 모넨신 착유우 185~660 mg·건유우 115~410 mg 1일(캐나다는 고위험 우군 배균 감소로 표시)이 보고됐다.</span><span class="hang">감염우 확인·제거, 유입 방지, 노출 방지가 3원칙이다. 양성우와 새끼는 도축용으로만 팔고, 6~12개월 간격으로 2회 연속 음성까지 반복 검사한다. 검사-도태는 유병률 5% 초과에서 이익이며 ELISA가 효율적이다. 임상우는 즉시 도태한다.</span><span class="hang">송아지 위생: 깨끗한 전용 분만방, 분만 직후 분리, 위생적 초유 채취, 음성우 초유만, 이후 살균유나 대용유, 첫해까지 성우와 분리, 사료·물·장비 공용 금지, 방목지 분뇨 살포 금지. 초유는 63℃ 60분 살균이 권장된다. 육우는 저밀도 깨끗한 분만 구역, 유대 형성 후 깨끗한 방목지로 이동, 번식우 연 1회 검사.</span><span class="hang">백신은 임상 발생을 줄이나 감염을 없애지 못하고 결핵 진단과 간섭한다. 1개월령 미만 송아지에만, 결핵 근절 계획이 없는 결핵 청정 지역의 고도 감염 우군에 쓸 수 있다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>BVD의 소화기 증상(짧게)<span class="hang">준임상: 미열, 백혈구감소, 경미한 설사 후 수일에 회복. 급성 점막병: 6~24개월령 지속감염우, 40~41℃, 침흘림, 반추위 정지, 2~4일 뒤 악취 수양성 설사(점액·혈액), 이급후증, 입술·잇몸·경구개·혀의 합쳐지는 얕은 미란(최대 20%는 없음), 지간 미란과 파행, 5~7일에 폐사. 만성 점막병은 간헐 설사, 쇠약, 만성 고창, 낫지 않는 미란. 초급성 BVD(BVDV-2)는 성우 포함 전 연령에 심한 설사, 이질, 최고 42℃, 무유, 이환율 최대 40%, 폐사율 최대 25%.</span><span class="hang">감별: 설사와 구강 병변이 함께면 점막병·악성카타르열, 구강 병변만이면 구제역·수포성구내염·블루텅·구진성구내염, 설사만이면 살모넬라·겨울설사·존씨병·구리결핍·오스테르타기아·콕시듐·비소·탄수화물 과식.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">69.</span><span>구내염과 목질설<span class="hang">원인은 물리적(투약기 외상, 이물, 거친 까락·가시), 화학적(자극성 약물, 산·알칼리 오투여), 감염성(구강 괴사간균증, 구제역·수포성구내염의 수포, BVD·악성카타르열의 미란, 구진성구내염의 증식성 병변)이다. 식욕부진, 아픈 저작, 입맛 다시기, 침흘림, 입 검사를 싫어한다. 수포는 1~2 cm로 쉽게 터져 날카로운 얕은 궤양을 남기고, 미란은 얕아 처음엔 잘 안 보인다. 다른 부위(제관, 피부점막 경계) 병변은 전신 질환을 시사하며 수포성 질환 감별이 가장 중요하다. 원인 치료와 부드러운 사료, 심하면 위관 급식을 한다.</span><span class="hang">목질설(방선간균증): Actinobacillus lignieresii가 점막 찰과상으로 침입해 혀의 근염, 육아종, 섬유화, 농양을 일으키고 채식이 어렵다. 요오드화칼륨 1일 6~10 g 경구 7~10일 또는 요오드화나트륨 70 mg/kg을 10~20% 용액으로 1회 IV. 연조직은 대개 1회로 24~48시간에 호전되고 골 병변은 10~14일 간격 1~2회 추가한다. 눈물, 식욕부진, 기침, 비듬이 나면 요오드 중독이므로 중단한다. 임신 말기 유산 가능성을 알리고 피하 주사는 피한다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>식도폐색(choke)<span class="hang">소는 순무, 감자, 사과, 옥수수 속대 같은 고형물이 주원인이고 송아지는 부러진 식도 급유관, 외부 압박은 종격 림프절 비대·농양이다. 경부 식도 상부나 흉곽 입구에 잘 걸린다. 갑자기 먹기를 멈추고 불안해하며 강하게 삼키고 침흘림, 기침, 씹기. 완전 폐색이면 고창이 빨리 오지만 포말성 목초 고창만큼 심하지 않다. 경련이 풀리며 수시간에 급성 증상이 가라앉고 상당수가 저절로 내려가나 최대 1주 지속되기도 하며, 오래 끼면 괴사·천공·협착이 온다. 만성은 중등도 만성 고창이 첫 증상이다. 식도 천공은 경부 피하기종으로 만져진다(Rebhun).</span><span class="hang">위관으로 위치를 확인하고 부드럽게 밀어 본다(세게 밀면 천공). 개구기를 끼우고 손을 인두에 넣은 채 조수가 이물을 밀어 올리거나 철사 고리를 걸어 빼며, 채소에는 절단 고리 달린 Thygesen 프로방이 효과적이다. 실패하면 이물을 두고 이완을 기다리며 필요할 때만 반추위에 투관해 둔다. 송아지 급유관은 경정맥구를 따라 만져지며 자일라진 경진정 후 구강으로 또는 코로 내시경을 넣어 올가미로 뺀다(Rebhun). 작은 천공은 항생제로 낫지만 사료가 새는 큰 천공은 예후가 나쁘다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">71.</span><span>직장탈 — 원인·분류<span class="hang">소에서 가끔 생기며 6개월~2세에 많다(Large Animal IM). 심한 설사의 장염, 어린 소의 콕시듐증 이급후증, 광견병, 척수 농양, 골반 장기 충혈(Constable), 만성 기침, 복부 충만 증가, 납·불소·에스트로겐·아연 중독이 원인이다.</span><span class="hang">1형은 점막·점막하만, 2형은 직장 전층, 3형은 전층 탈출에 직장·소결장 장중첩이 겹친 것, 4형은 장중첩만으로 직장 안에 고랑이 촉지된다. 1·2형이 흔하고 교정이 쉬우며 3·4형은 혈행 손상으로 빠른 처치가 필요하다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>직장탈 — 치료·예후<span class="hang">원인을 없애고 조기 교정한다. 명백히 청색·괴사가 아니면 살린다. 1·2형은 2% 리도카인 4~6 mL 미추 경막외마취(자일라진 소량 추가로 연장), 온수·순한 비누 세척, 부종은 주무르며 글리세린이나 설탕을 바른다. 윤활 정복 후 비흡수사로 항문 주위 쌈지봉합(직장에 들어가지 않게, 배변 가능하게)을 하고 3~4일 뒤 제거한다. 조직 손상 시 광범위 항생제.</span><span class="hang">정복 불가, 광범위 괴사, 재발이면 점막하 절제, 절단, 탈장환을 쓴다. 정복 안 되는 3·4형은 개복으로 정복·절제하고, 4형은 정복해도 누출·복막염이 올 수 있다. 합병증은 재발, 협착, 변비, 직장 주위 농양, 복막염이다. 보존 관리된 1·2형은 예후가 좋고 3·4형은 보통~신중하다.</span></span></p></div>
</div>
`;
}
function med_liverHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 간</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>간질환 일반 — 분류와 기능 예비력<span class="hang">간질환은 원인에 따라 중독, 기생충, 대사장애, 감염, 담도 폐쇄로 나뉘며, 증상이 오로지 간에서 비롯되는 원발성과 전신 질환의 일부로 나타나는 속발성으로 구분하기도 한다.</span><span class="hang">미만성 질환은 간기능부전 증상을 동반하는 일이 많고, 국소성 질환은 병소에서 만들어진 독소나 담도 등 주변 장기 압박으로 증상을 낸다.</span><span class="hang">병리학적으로 염증 반응(담관·쿠퍼세포 증식, 섬유화)이 있는 간염(hepatitis)과 비염증성 변성인 간증(hepatosis)으로 나누지만 임상적으로는 차이가 크지 않다.</span><span class="hang">간은 예비력이 커서 실질의 약 3/4(70~80%)이 기능을 잃어야 간기능부전 증상이 나타난다. 그래서 간질환은 기능부전보다 먼저 존재하고, 검사로 기능부전 이전에 발견될 수 있다. 소의 간농양처럼 큰 병소가 있어도 증상이 거의 없는 경우가 대표적이다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>간기능과 문맥 순환<span class="hang">기능부전 시 임상증상을 일으키는 주요 기능은 정상혈당 유지, 혈장단백(급성기 단백 포함) 합성, 담즙산 형성·배설과 빌리루빈 포합·배설, 프로트롬빈 형성, 암모니아·광감작 물질 등 독성 물질의 해독·배설이다.</span><span class="hang">문맥에서 위·비장과 대장 하부의 혈액은 간 좌엽으로, 소장 혈액은 우엽으로 섞이지 않고 흐른다. 그래서 중독성 간염이 간의 한쪽에 국한되거나 전이성 농양·종양이 특정 엽에 생긴다.</span><span class="hang">간 혈관상이 막히면 문맥계 울혈, 문맥고혈압, 소화·흡수 장애가 오고 말기에는 복수가 생긴다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>간질환의 임상증상 개요<span class="hang">소의 간질환은 체중감소, 침울, 무기력이 주 증상이다. 발열과 황달이 함께 있으면 예후가 나쁘다.</span><span class="hang">간성뇌증 증상으로 실명, 머리 밀기, 흥분, 운동실조, 쇠약이 나타난다. 반추수는 이급후중을 보이고 때로 과도하게 울기도 한다.</span><span class="hang">소에서 흔한 징후는 체중감소, 복수, 설사, 이급후중, 직장탈이다(Large Animal IM). 설사는 문맥고혈압에 의한 장 부종 때문으로 보이며 지방 흡수장애 때문은 아니다.</span><span class="hang">단백 동화 장애로 소모와 저단백혈증이 오며 하악간 부종(병턱, bottle jaw)이 생길 수 있다. 간섬유화로 문맥 순환이 막히면 부종은 더 심하고 주로 복강에 국한된다. 간질환의 복수는 변형 누출액이지만 간에서 단백이 새어 단백 농도가 3~3.5 g/dL로 비교적 높을 수 있다.</span><span class="hang">중증 미만성 간질환에서는 프로트롬빈 등 응고인자 합성이 줄어 출혈 경향이 생긴다. 담즙산이 없으면 지용성 비타민 K 흡수도 줄어들므로 중증 간기능부전 환축은 수술 전 비타민 K를 비경구 투여하는 것이 좋다.</span><span class="hang">간 피막의 팽창이나 피막 병변은 아급성 복통을 일으켜 등을 굽히고 움직이기 싫어하며, 우측 후흉부 간 부위를 깊이 누르면 통증을 보인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">4.</span><span>황달 — 간전성(용혈성) 황달<span class="hang">황달은 혈중 빌리루빈 상승으로 피부·점막·공막이 노랗게 물드는 것이며, 간·담도 질환에 특이적이지 않다. 반대로 급성 간염에서 황달이 뚜렷이 없는 경우도 있다.</span><span class="hang">혈관 내·외 대량 용혈로 비포합(간접) 빌리루빈이 늘어난다. 소의 원인으로 세균성 혈색소뇨증, 렙토스피라증, 바베시아증, 아나플라스마증, 십자화과 식물 섭취, 분만후 혈색소뇨증, 송아지 냉수 다음(물중독), 신생자 동종면역 용혈 등이 있다.</span><span class="hang">혈색소혈증·혈색소뇨는 혈관 내 용혈에서만 나타나며, 아나플라스마증처럼 망내계에서 일어나는 혈관 외 용혈에서는 보이지 않는다.</span><span class="hang">황달은 중등도이고, 재생성 빈혈, 정상 혈액 단백, 요 유로빌리노겐 증가와 요 빌리루빈 음성, 혈청 간접 빌리루빈 우세가 특징이다.</span><span class="hang">소의 황달은 대부분 용혈성 질환에서 보이며 비포합 빌리루빈이 크게 오른다. 반추수 황달의 가장 흔한 원인이 용혈일 가능성이 높다는 기술도 같다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>황달 — 간성(간세포성) 황달과 간후성(폐쇄성) 황달<span class="hang">간성 황달은 간세포 변성으로 빌리루빈 포합 능력이 떨어지고, 염증성 종대·부종이 간내 담즙 흐름을 기계적으로 막아 생긴다. 포합과 배설 모두 장애를 받지만 배설 장애가 더 커서 포합 빌리루빈이 가장 많이 오른다. 요 빌리루빈과 유로빌리노겐이 모두 증가한다.</span><span class="hang">간후성 황달은 담관이 기생충(간흡충), 담석, 종양 압박, 담관염으로 막혀 생긴다. 완전 폐쇄 시 변에서 담즙색소가 사라지고 혈청 포합 빌리루빈과 총빌리루빈이 크게 오르며, 요에 빌리루빈이 대량 나오지만 유로빌리노겐은 없다.</span><span class="hang">부분 폐쇄에서는 변에 담즙색소가 있고 요 유로빌리노겐도 나와 간세포성 황달과 구분이 어렵다. 담즙 흐름의 절반 이상이 막히면 부분 폐쇄라도 황달이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>황달 — 감별 검사와 소에서의 해석 주의<span class="hang">담즙 흐름 장애 여부를 정확히 가르는 근거는 요 빌리루빈·유로빌리노겐 검사와 혈청 포합·비포합 빌리루빈 비율이다. 비포합 빌리루빈은 신장으로 배설되지 않는다.</span><table class="bxt"><tr><th>구분</th><th>혈청 우세 빌리루빈</th><th>요 빌리루빈</th><th>요 유로빌리노겐</th><th>변 담즙색소</th></tr><tr><td>간전성(용혈)</td><td>간접(비포합)</td><td>없음</td><td>증가</td><td>있음</td></tr><tr><td>간성</td><td>직접(포합)</td><td>증가</td><td>증가</td><td>있음</td></tr><tr><td>간후성 완전 폐쇄</td><td>직접(포합)</td><td>대량</td><td>없음</td><td>없음</td></tr><tr><td>간후성 부분 폐쇄</td><td>직접(포합)</td><td>증가</td><td>있음</td><td>있음</td></tr></table><span class="hang">혈청 빌리루빈 17 µmol/L(1.0 mg/dL) 초과면 혈청이 노랗게 보이고, 40 µmol/L(2.3 mg/dL) 초과면 점막 황달이 보인다.</span><span class="hang">소와 말은 담즙 흐름이 간 뒤에서 막혀도 대부분 비포합 빌리루빈 증가가 주가 되므로, 사람 의학에서 가져온 포합/비포합 비율 해석이 잘 맞지 않는다(Constable). 반면 담즙 폐쇄나 간내 담즙정체 시 직접/총빌리루빈 비율이 소에서 0.5를 넘을 수 있다는 기술도 있다(Large Animal IM).</span><span class="hang">간질환이 있는 성우가 꼭 고빌리루빈혈증을 보이지는 않고, 고빌리루빈혈증이 있어도 육안 황달은 드물다. 빌리루빈은 성우 만성 간질환에 특이적이지도 민감하지도 않고, 송아지에서도 지표로 믿기 어렵다. 소는 식욕부진만으로도 빌리루빈이 경미하게 오른다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">7.</span><span>간성뇌증 — 정의와 증상<span class="hang">정상이라면 간에서 해독될 신경독성 물질이 혈중에 쌓여 신경증상이 나타나는 것이다. 중증 간세포 부전이나 간 우회 순환(단락)에서 흔하다.</span><span class="hang">증상은 침울, 머리 밀기, 강박 보행, 운동실조, 근육 떨림·쇠약, 중추성 실명, 과흥분, 경련이며 말기에 간성 혼수가 온다.</span><span class="hang">대표적인 것이 머리를 밀고 자극에 반응하지 않으며 실명하기도 하는 더미 증후군(dummy syndrome)이다.</span><span class="hang">간염은 황달이나 광과민증이 없으면 뇌질환으로 오진하기 쉽다. 신경증상은 뇌척수염, 뇌연화증, 뇌부종과 감별하고, 곡류 과식 같은 급성 소화기 질환도 비슷한 신경증상을 낼 수 있다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>간성뇌증 — 기전과 원인<span class="hang">저혈당, 아미노산·암모니아·아세틸콜린 축적, 간실질 분해산물 등 여러 요인이 거론되며 한 가지로 설명되지 않는다. 저칼륨혈증, 알칼리증, 단쇄 지방산, 가성 신경전달물질도 관여할 수 있다.</span><span class="hang">암모니아가 중심 역할을 한다는 데 대체로 동의하지만, 뇌증의 중증도는 간기능 손상 정도와는 잘 맞고 고암모니아혈증 정도와는 잘 맞지 않는다. 송아지에 암모니아를 정맥 주입하면 해면상 변성(status spongiosus)이 재현된다.</span><span class="hang">소에서는 간 지질 농도 30% 이상의 중증 간지질증이 간성뇌증과 간 혼수와 관련된다(Constable). 성우의 간성뇌증은 대개 크로탈라리아·세네시오 같은 피롤리지딘 알칼로이드 함유 목초에 의한 미만성 간질환에 속발하고, 송아지는 대개 문맥전신단락이 원인이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>문맥전신단락(송아지)<span class="hang">드물게 송아지에서 기록되며, 간 위축으로 이차 간기능부전이 온다. 수 주~수개월령에 성장 지연, 복수, 간성뇌증에 의한 다양한 신경증상(피질성 실명, 선회, 치매)을 보이고 지속적인 이급후중이 흔하다(Constable).</span><span class="hang">처음 2주 정도는 정상으로 보이다가 반추위가 기능하기 시작하면서 혈중 암모니아가 올라 대뇌·척수 증상이 오르내린다는 기술도 있다(Rebhun). 선천성 단락에는 복수가 없고, 만성 간질환·섬유화에 의한 후천성 단락에서는 고단백 복수가 흔하다는 기술이 있어 Constable과 다르다.</span><span class="hang">혈중 암모니아와 혈청 담즙산은 크게 오르지만 간효소는 정상일 수 있다. 단락은 빌리루빈혈증, 간효소 상승, 응고 이상 없이 암모니아만 올린다. 확진은 문맥조영술, 초음파, 조영 방사선, CT·MRI로 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">10.</span><span>이차성(간성) 광과민증 — 기전<span class="hang">엽록소가 소화관에서 분해되어 생기는 필로에리트린(phylloerythrin)은 정상적으로 간에서 포합되어 담즙으로 배설된다. 간·담도 기능부전 시 필로에리트린이 간, 혈액, 피부에 쌓이고, 무색소 피부가 햇빛에 노출되면 손상이 온다.</span><span class="hang">녹색 사료를 먹고 햇빛에 노출될 때만 나타난다. 증상은 홍반, 부종, 소양감에서 장액 삼출, 괴사와 피부 탈락까지 다양하며, 무색소 부위와 햇빛을 많이 받는 부위가 심하다. 유두와 주둥이에서 가장 심한 경우가 많다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>이차성 광과민증 — 원인과 진단<span class="hang">간성 광과민증 원인(Rebhun): 식물로 코키아, 미오포룸, 아가베 레추길라, 유채·케일, 테트라디미아, 곰팡이 핀 알팔파 건초, 놀리나, 에키움, 란타나, 헬리오트로피움, 세네시오, 암싱키아, 크로탈라리아, 기장(Panicum), 나르테시움 등이 있다.</span><span class="hang hang3">곰팡이: 피토미세스 차르타룸(Pithomyces chartarum), 남조류, 페리코니아, 포몹시스(루핀), 푸자리움(곰팡이 옥수수), 아스페르길루스(저장 사료).</span><span class="hang hang3">감염·기생충·종양·화학물질: 렙토스피라증, 간농양, 기생충성 간낭포(흡충, 포충), 림프육종, 간세포암, 담관암, 구리, 인, 사염화탄소.</span><span class="hang">원발성 광과민증이나 포르피린증으로 빨리 확인되지 않는 한, 광과민증을 보이는 모든 개체에 GGT, AST, SDH와 포합 빌리루빈 같은 기능 검사를 의뢰한다. 간성으로 판단되면 목초·사료에서 간독성 식물을 찾고, 초음파와 간생검으로 간담도 질환 유형을 분류한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">12.</span><span>간 특수검사 — 촉진·타진·초음파<span class="hang">소의 간은 우측 늑골에 가려 대부분 가장자리를 촉지할 수 없다. 우측 후흉부 간 탁음 부위 전체를 깊게 타진·압박하여 통증을 확인하는데, 국소 병변의 통증은 매우 좁은 부위에 국한될 수 있다.</span><span class="hang">초음파는 3.5~5.0 MHz 선형 또는 볼록 탐촉자로 서 있는 소의 우측에서 마지막 늑골 뒤부터 제5 늑간까지, 각 늑간을 위에서 아래로 늑골과 평행하게 검사한다. 간의 크기·위치·실질 양상, 담낭과 담관, 간정맥·문맥·후대정맥을 본다.</span><span class="hang">초음파로 간흡충증, 간농양, 종양, 후대정맥 혈전증, 간지질증을 진단할 수 있고, 후대정맥 혈전증의 유일한 실용적 진단법이다. 담즙정체는 간내·간외 담관과 담낭의 확장으로 진단한다.</span><span class="hang">우측 제9~11 늑간에서 초음파 유도 경피 담낭천자로 담즙을 얻어 흡충 충란과 담즙산을 검사할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>간생검<span class="hang">Tru-Cut형 생검 기구가 가장 만족스럽고, 스프링식이 더 확실하게 자른다. 가능하면 초음파 유도로 한다. 소는 대개 진정이 필요 없다.</span><span class="hang">부위는 책마다 다르게 기술된다.</span><span class="hang hang3">Constable: 우측 제10 늑간, 요각에서 주관절로 그은 선과 대전자에서 그은 수평선 사이.</span><span class="hang hang3">Bovine Medicine: 우측 제11 늑간, 횡돌기에서 15 cm 아래. 장골익에서 주관절과 견관절로 그은 두 선 사이의 제11 늑간이며 반대쪽 주관절 방향으로 찌른다.</span><span class="hang hang3">Large Animal IM: 겸부 중앙에서 앞으로 그은 수평선이 우측 제11 늑간과 만나는 점에서 약간 앞쪽·아래쪽을 향한다.</span><span class="hang">위험은 간문부 대혈관·담관 손상, 출혈 경향 시 치명적 혈복강, 농양 천자에 의한 복막염, 대담관 천공에 의한 담즙성 복막염이다. 이론상 흑색병(black disease)을 유발할 수 있으나 수천 건의 생검에서 그런 일은 없었다.</span><span class="hang">간농양이 의심되면 파열 위험 때문에 생검은 금기이다. 농양, 육아종, 종양, 간흡충 같은 국소 병변은 생검으로 놓치기 쉽고, 미만성·대상성 병변(대부분의 중독·감염·대사성 간질환)은 잘 진단된다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">14.</span><span>간기능 검사 — 담즙산·빌리루빈·BSP<span class="hang">혈청 담즙산은 장간 순환의 효율을 반영하며 간세포 기능장애, 섬유화, 문맥전신단락에서 황달보다 먼저 오른다. 소에서 간지질증, 간농양, 간흡충증, 담석에서 상승이 보고되었다.</span><span class="hang">소는 개체·연령·형태 간 변이가 매우 크고(육우가 젖소보다 더 큼), 시간 단위로 최대 60 µmol/L까지 변동한다. 사양 방식과 비유 단계도 영향을 주며 비유가 진행될수록 감소한다. 송아지·육성우는 비유우보다 유의하게 낮다. 급식과의 관련은 확인되지 않았다.</span><span class="hang">단일 시료로 간손상을 판단하려면 육우 126 µmol/L, 비유 젖소 88 µmol/L를 넘어야 한다. 이를 넘는 유의한 상승은 간질환의 특이적 지표이며, 소의 다양한 간질환에 대해 다른 간기능 검사보다 특이적·민감하고 질병 정도와 상관된다(Constable).</span><span class="hang">설포브로모프탈레인(BSP) 청소율 검사는 BSP 500~1000 mg(약 2 mg/kg)을 정맥 주사하고 5, 7, 9, 11분 등에 채혈하여 반감기를 구한다. 반추수 정상 반감기는 5분 미만이며 어린 동물과 임신 동물에서 길어질 수 있다. 지금은 거의 쓰지 않고 저알부민혈증이나 고빌리루빈혈증에서는 금기이다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">15.</span><span>간기능 검사 — 암모니아·요소·알부민·혈당<span class="hang">암모니아는 장내 미생물의 아미노산 탈아미노로 생기고 간에서 요소로 바뀐다. 간질환 소에서 혈장 암모니아가 유의하게 오르지만 혈장 요소 감소가 항상 동반되지는 않는다.</span><span class="hang">건강한 소의 혈장 암모니아:요소 비는 9:1, 암모니아:혈당 비는 11:1이다. 간질환에서 암모니아:혈당 40:1 또는 암모니아:요소 30:1이면, 특히 총케톤체가 오르고 혈당이 떨어지는 경우 예후가 조심스럽다.</span><span class="hang">암모니아는 휘발성이어서 시료를 얼음에 두고 채혈 후 30분 안에 분석해야 하므로 현장 일상 검사에는 맞지 않는다.</span><span class="hang">알부민은 중증·만성 간질환에서 감소하지만 신장 손실, 사료 단백 부족, 소화·흡수 장애로도 줄어든다. 소 알부민 반감기는 약 16.5일이어서 주로 만성 간질환에서 감소한다. 저알부민과 고글로불린이 함께 있으면 원발성 간질환보다 만성 염증을 시사한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>간효소 — 종류와 해석<span class="hang">간세포 세포질에서 새어 나오는 누출 효소(SDH, GDH, AST, LDH, OCT)와 담즙정체 시 합성이 늘어나는 효소(GGT, ALP)로 나뉜다. 간 기능 여유 때문에 간세포 손상과 기능장애는 반드시 일치하지 않으며, 효소가 크게 올라도 기능적 간조직의 절반 이상이 손상되어야 임상 질환이 나타난다.</span><table class="bxt"><tr><th>효소</th><th>특이성</th><th>소에서의 특징</th></tr><tr><td>SDH(L-이디톨 탈수소효소)</td><td>간 특이</td><td>급성 손상에 매우 선택적, 초기 간기능장애에 가장 민감. 반감기가 짧아 만성 질환에 부적합. 냉장 24시간·냉동 72시간 안에 활성 저하, 수 시간 안에 분석</td></tr><tr><td>GDH(GLDH)</td><td>간 특이</td><td>반추수에서 간질환에 매우 특이. 반감기가 짧아 만성 질환에서는 오르지 않을 수 있음</td></tr><tr><td>AST</td><td>간·근육·적혈구</td><td>단독 해석 불가. CK 정상이면서 AST·GLDH 상승이면 간세포 괴사. 용혈 시료에서 위상승</td></tr><tr><td>GGT</td><td>간담도(혈청 활성은 거의 간 유래)</td><td>소 간담도 질환에 매우 특이, 주로 담즙정체로 상승. 신생 송아지는 초유 흡수로 높음(흡유 후 4000 IU/L 초과 가능)</td></tr><tr><td>ALP</td><td>비특이(뼈·장·태반·대식세포)</td><td>정상 소의 변이가 너무 커 해석 어려움. 담도 폐쇄 검사로는 선호되나 다른 조직 손상에도 반응</td></tr><tr><td>ALT</td><td>-</td><td>반추수 간세포 내 활성이 낮아 진단 가치 거의 없음</td></tr><tr><td>OCT</td><td>간</td><td>활동성 괴사 시 만성 질환에서도 상승. 간지질증 보조 진단으로 제안. 일상 분석 어려움</td></tr></table><span class="hang">성우의 만성 간질환 식별에는 GGT, ALP, SDH, AST, GDH가 가장 유용하다. 초기에는 SDH, 담즙 배설 검사가 맞는 후기에는 빌리루빈이 더 적합하다(Constable).</span><span class="hang">담즙정체 효소는 섬유화에 의한 담관 협착 때문에 만성 간질환에서 누출 효소보다 높게 유지될 가능성이 크다. 말기에 가까운 만성 간질환에서는 남은 정상 조직이 적어 효소 상승이 미미할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>송아지의 간검사와 소의 정상 상한치<span class="hang">6주령 미만 신생 송아지에서는 성우용 일반 간검사가 간질환 검출에 쓸모가 없다. 대부분의 효소와 총빌리루빈이 2주령보다 신생 송아지에서 유의하게 높다. 6주령 미만에서 간질환이 의심되면 GDH와 총담즙산을 조합하고, 경피 간생검이 가장 많은 정보를 준다.</span><span class="hang">소의 간기능 검사 정상 상한치(Large Animal IM, 여러 출처 종합, 각 검사실 기준치 우선).</span><table class="bxt"><tr><th>검사</th><th class="c">1주 미만</th><th class="c">1~4주</th><th class="c">1~6개월</th><th class="c">성우</th></tr><tr><td>총빌리루빈(mg/dL)</td><td class="c">2.4</td><td class="c">0.9</td><td class="c">0.4</td><td class="c">0.3</td></tr><tr><td>직접빌리루빈(mg/dL)</td><td class="c">0.6</td><td class="c">0.3</td><td class="c">0.2</td><td class="c">0.1</td></tr><tr><td>총담즙산(µmol/L)</td><td class="c">45</td><td class="c">35</td><td class="c">60</td><td class="c">120</td></tr><tr><td>BSP 반감기(분)</td><td class="c">15</td><td class="c">8</td><td class="c">5</td><td class="c">3</td></tr><tr><td>AST(IU/L)</td><td class="c">60</td><td class="c">60</td><td class="c">60</td><td class="c">60</td></tr><tr><td>GGT(IU/L)</td><td class="c">4200</td><td class="c">1300</td><td class="c">-</td><td class="c">24</td></tr><tr><td>ALT(IU/L)</td><td class="c">1150</td><td class="c">1000</td><td class="c">-</td><td class="c">81</td></tr><tr><td>SDH(IU/L)</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">15.3</td></tr><tr><td>GDH(IU/L)</td><td class="c">24</td><td class="c">22</td><td class="c">19</td><td class="c">19</td></tr><tr><td>LDH(IU/L)</td><td class="c">1380</td><td class="c">1280</td><td class="c">-</td><td class="c">1445</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">18.</span><span>간질환 치료 원칙<span class="hang">미만성 간질환에는 만족스러운 일반 치료가 없으며, 손상 원인을 제거하는 것이 주목적이다. 급성 간염에서는 급성 간기능부전 위험기를 넘겨 간이 재생할 때까지 버티게 하는 것이 최선이다.</span><span class="hang">이 시기에 저혈당으로 죽을 수 있으므로 포도당을 경구·정맥으로 주어 혈당을 유지한다. 구아니딘 중독 위험 때문에 칼슘염을 경구·비경구로 충분히 공급한다.</span><span class="hang">암모니아 중독 위험이 있어 단백질과 단백 가수분해물은 피하는 것이 좋고, 사료는 고탄수화물·고칼슘·저단백·저지방으로 한다. 다만 환축은 대개 완전 식욕부진이다.</span><span class="hang">만성 미만성 질환의 섬유화는 매우 초기를 빼면 비가역적이다. 초기에는 콜린 등 지방친화 인자와 저지방·저단백 사료가 섬유 수축의 압박 효과를 줄일 수 있고, 이 시기의 고단백 사료는 지방 침착을 늘려 간기능을 더 늦춘다. 간섬유화는 간염의 최종 단계로 보고 대개 치료하지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>미만성 간질환(간염) — 원인 분류<span class="hang">여기서 간염은 퇴행성·염증성 미만성 간질환 전체를 뜻하며 간경변도 포함한다. 섬유화는 간염과 원인·증후군이 같고 발병이 더 느릴 뿐이다.</span><span class="hang">중독성: 무기물(구리, 인, 비소, 셀레늄), 유기물(사염화탄소, 헥사클로로에탄, 고시폴, 크레졸·콜타르, 클로로폼), 피롤리지딘 알칼로이드 식물(세네시오, 크로탈라리아, 헬리오트로피움, 암싱키아), 란타나, 루핀, 알사이크 클로버, 젖은 알팔파 건초, 곰팡이(피토미세스, 아스페르길루스 플라부스, 페니실리움 루브룸, 포몹시스, 푸자리움), 남조류, 잎벌 유충.</span><span class="hang">독혈증·관류성: 부위와 상관없이 많은 세균 감염에서 중등도 간염이 생긴다. 젖소에서 유방염·자궁염 뒤 내독소혈증에 의한 간기능부전이 올 수 있다. 화상, 외상, 경색 후에도 같다.</span><span class="hang">기생충성: 급성·만성 간흡충 감염. 대량 감염은 급성 간기능부전, 특히 하악 부종을 일으키고, 만성에서는 담관염이 퍼져 만성 기능부전을 일으킨다.</span><span class="hang">영양성: 분만 전후 음의 에너지 균형에 의한 간지질증. 기타 울혈성 간병증(울혈성 심부전에 의한 소엽중심 변성), 문맥전신단락이 있다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>패혈증 관련 간기능부전과 간 진균증<span class="hang">급성 패혈성 유방염·자궁염 뒤 내독소혈증 증상으로 시작하여 식욕부진, 체중감소, 유량 감소, 드물게 광과민성 피부염을 보이는 비유우 간기능부전 증후군이 보고되었다(Rebhun).</span><span class="hang">간효소 상승과 BSP 청소의 현저한 지연이 있었고, 간생검에서 내독소혈증에 의한 간세포 공포화·괴사를 보였다. 강제급이와 대증 치료로 5두 중 3두가 회복되었다.</span><span class="hang">분만 후 패혈증 소의 초기 관리와 급성 질환 치료에 반응이 느린 경우의 장기 관리에서 간손상 가능성을 고려한다.</span><span class="hang">유방염·반추위염 등으로 장기간 항생제 치료 후 지속 발열, 완전 식욕부진, 간효소 상승이 있으면 장·간 진균증(아스페르길루스 등)을 의심하며, 대개 치명적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">21.</span><span>지방간(간지질증) — 정의와 원인<span class="hang">지방간(hepatic lipidosis, 지방동원 증후군, fat cow syndrome, 소 임신중독)은 체지방이 과도하게 간으로 동원되어 간의 지질 흡수가 산화·분비를 넘어설 때 생긴다. 남는 지질은 트리아실글리세롤로 저장되고 간 대사 기능이 떨어진다.</span><span class="hang">젖소에서는 분만 직후의 급격한 에너지 요구, 비육 상태가 좋은 임신 육우에서는 사료의 갑작스러운 결핍(특히 쌍태)이 원인이다. 고능력우 비유 초기에 흔한 음의 에너지 균형이 과장된 것이다.</span><span class="hang">분만 시 실제로 살쪘는지보다 비유 초기 음의 에너지 균형의 정도가 결정적이라는 기술(Constable)과, 처음부터 살찌지 않은 소는 지방간 증후군이 생기지 않으며 마른 임신 육우는 극도로 쇠약해져 굶어 죽어도 임신중독은 생기지 않는다는 기술이 함께 있다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>지방간 — 역학<span class="hang">분만 전후 수 주간 고능력우에서 흔하며 분만 후 처음 4주에 주로 생기고, 이때 최대 50%의 소가 어느 정도 간에 트리아실글리세롤이 쌓인다. 영국에서는 고능력우의 약 30%가 분만 1주 후 지방간으로 본다.</span><span class="hang">한 현장 연구에서 폐사·도태 비율은 경도 15%, 중등도 31%, 고도 42%였다. 최대 25%가 발병하고 치사율 90%인 젖소 집단 발생도 있었다. 미국 발생률 10~20% 보고가 있다(Blackwell).</span><span class="hang">북미 육우의 중증형(임신중독)은 쌍태를 밴 살찐 소에서 임신 마지막 6주에 가장 흔하며 이환율 약 1%, 폐사율은 대개 100%이다. 호주·영국에서는 초산우가 경산우보다 많고 임신 7~9개월이나 막 분만한 소가 대부분이다. 호주 육우의 이환율은 대개 1~3%, 최대 10%이고 대개 치명적이다.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>지방간 — 위험요인<span class="hang">분만 시 과비(BCS 3.75/5 초과, Blackwell; 4.0 이상, Large Animal IM), 분만 직전 심한 사료 제한, 건유기 전체의 과잉 에너지, 긴 분만간격과 긴 건유기가 주요 분만 전 위험요인이다.</span><span class="hang">분만 후 위험요인은 분만 전후 질병, 식욕부진·절식, 케톤생성 사료, 급격한 사료 변경, 난산, 스트레스, 불량한 우사 환경이다.</span><span class="hang">케토시스, 제4위 좌방전위, 유방염, 태반정체, 유열, 기립불능 등 비유 초기 질병은 모두 지방간을 촉진하고, 지방간이 있으면 이들 질병의 치료가 훨씬 어려워진다.</span><span class="hang">과비우의 체중을 줄이려고 임신 말기에 반기아 사료를 주거나, 난산을 줄이려고 임신 육우의 사료를 사일리지에서 짚으로 바꾸면 집단 발생이 일어났다.</span><span class="hang">개체적으로 귀한 수정란·난자 공여우처럼 건유기나 분만간격이 긴 소가 특히 취약하다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>지방간 — 기전<span class="hang">분만 전후의 호르몬 변화(인슐린/글루카곤 비 저하, 카테콜아민 증가)로 호르몬 감수성 리파아제가 활성화되어 지방조직에서 비에스테르화 지방산(NEFA)이 대량 방출된다. 간은 공급량에 비례하여 NEFA를 흡수한다.</span><span class="hang">간에서 NEFA는 완전 산화, 케톤체로 부분 산화, 트리글리세라이드로 재에스테르화된다. 소 간세포는 초저밀도지단백(VLDL) 형태로 지방을 내보내는 능력이 낮고, 비유 초기에는 VLDL의 주 아포지단백인 apoB100이 매우 적어 더 떨어진다. 그 결과 트리아실글리세롤이 간세포에 쌓인다.</span><span class="hang">정상적으로 간지방은 분만 몇 주 전부터 늘어 분만 1주 후 평균 약 20%(습중량)에 이르고, 분만 26주 후 5% 미만으로 서서히 줄어든다. 분만 1주 후 개체 간 범위는 거의 0~70%이다. 지방동원은 에너지 결핍보다 호르몬 환경 변화로 분만 2~3주 전부터 시작된다.</span><span class="hang">모든 고능력우는 분만 전과 분만 후 처음 수 주간 간지방이 15~32%로 늘며, 이 변화는 기능적이고 가역적이다. 절식 후 재급여한 소는 18일 안에 주요 간기능이 회복되었고, 분만 후 간지질증 소도 분만 6개월 후 간지방이 정상(15% 미만)이었다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>지방간 — 임상증상(젖소)<span class="hang">대개 분만 후 며칠 안에 생기며 유열, 제4위 좌방전위, 소화불량, 태반정체, 난산처럼 식욕을 일시적으로 떨어뜨리는 질병이 계기가 된다.</span><span class="hang">대개 BCS 4/5 이상으로 지나치게 살쪄 있고, 겸부·어깨·미근부에 피하지방이 많이 촉지된다. 원인 질병 치료에 반응하지 않고 식욕을 완전히 잃는다.</span><span class="hang">체온·심박·호흡은 정상 범위이고, 반추위 운동이 약하거나 없으며 변이 적다. 오래 누워 있고 일으키면 서기 어려워한다. 일반 치료에 반응하지 않는 중증 케토시스와 현저한 케톤뇨가 있을 수 있다.</span><span class="hang">먹지 않고 점점 쇠약해져 완전히 기립불능이 되며 7~10일 안에 죽는다. 일부는 응시, 머리를 높이 듦, 머리·목 근육 떨림 같은 신경증상을 보인다. 말기에 혼수, 빈맥, 현저한 고혈당이 오며 중증 치사율은 50% 이상에 이를 수 있다.</span><span class="hang">중등도 지방간은 증상이 훨씬 가볍고, 건초를 조금이라도 계속 먹으면 대부분 며칠 안에 회복한다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>지방간 — 임상증상(육우 임신중독·단백에너지 영양실조)<span class="hang">분만 직전 살찐 육우는 공격적이고 불안하며 흥분하고 비틀거리며 쉽게 넘어진다. 변은 적고 단단하며 빈맥이 있다.</span><span class="hang">분만 2개월 전에 생기면 10~14일간 침울하고 먹지 않다가 흉와위가 된다. 호흡이 빠르고 호기 시 신음이 있을 수 있으며, 맑은 콧물과 비경 상피 박리가 있을 수 있다. 말기에 악취 나는 황색 설사를 보이고 조용히 죽는다. 경과는 10~14일이다.</span><span class="hang">단백에너지 영양실조(PEM)와 육우 임신중독은 주로 겨울에 질 낮은 사료를 먹는 임신 육우에서 체중감소, 쇠약, 침울, 기립불능으로 나타난다. 성장 중인 임신 미경산우가 특히 취약하다. 간세포 지방 침윤은 PEM 초기에 일시적이고, 부검 시 간은 정상보다 작다. 의식은 있으나 일어나지 못하고, 대개 기립불능 7~14일 뒤 죽는다. 케톤뇨는 전형적이지 않다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>지방간 — 아임상 지방간과 번식·면역<span class="hang">분만 후 처음 수 주의 아임상 지방간은 정상 발정 주기 회복 지연과 수태율 저하로 분만-수태 간격을 늘린다. 경도와 중등도 지방간 사이에도 번식성적 차이가 있을 수 있다. 다만 지방간 소의 분만 후 호르몬 프로필에서 수태율 저하 기전은 밝혀지지 않았다.</span><span class="hang">분만 2주째 간지방 20% 초과 소에서 백혈구감소가 관찰되었고, 다형핵 백혈구의 기능도 떨어진다. 이는 아임상 지방간 소의 유방염·자궁내막염 증가와 관련될 수 있으나 인과관계는 확실하지 않다.</span><span class="hang">간 쿠퍼세포 기능 저하와 높은 NEFA·BHB의 면역 억제 때문에 경미한 자궁염이나 유방염도 패혈증으로 이어질 수 있다. 악취 나는 분비물 없이 패혈성 자궁염으로 죽기도 한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>지방간 — 임상병리<span class="hang">혈장·혈청 NEFA, 아세토아세트산, BHB, 총빌리루빈이 오르고 프럭토사민이 낮아지며, 간지방 비율과 관련된다. 간효소 중에서는 AST와 OCT가 간지방 비율과 가장 잘 관련되고, ALT, SDH, GDH, ALP, GGT는 관련이 약하다(Constable).</span><span class="hang">간지방 비율의 가장 적절한 생화학 지표는 혈장 NEFA:콜레스테롤 비일 수 있다. NEFA는 간이 처리하지 못한 대사물을, 콜레스테롤은 재에스테르화와 VLDL 배출 속도를 반영한다.</span><span class="hang">혈청 프럭토사민은 지난 1~3주간 혈당을 반영하며, 213 µmol/L 미만이면 간지질증을 예측한다. 혈장 피브리노겐은 간지질증 중증도에 반비례하여 감소한다.</span><span class="hang">혈장 암모니아는 간지방 비율과는 관련이 약하지만, 중증 간지질증의 간부전 지표로 매우 좋다. 중증 간기능장애에서 29 µmol/L를 넘고 정맥보다 동맥 시료가 높다.</span><span class="hang">간효소는 건유우보다 높지만 정상 범위 안인 경우가 많고 담즙산은 대부분 유의하게 오르지 않는다는 기술(Large Animal IM)과, GDH, GGT, AST, 담즙산, 빌리루빈이 현저히 오른다는 기술(Blackwell)이 엇갈린다. 진단·예후에 쓸 만큼 일관되지 않다(Rebhun).</span><span class="hang">혈액상은 백혈구·호중구·림프구 감소와 퇴행성 좌방이동이 흔하나 비특이적이다. 혈청 트리글리세라이드와 콜레스테롤은 감소한다. BSP 반감기가 9분을 넘으면 예후가 더 조심스럽다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>지방간 — 간생검과 비중 부유시험<span class="hang">간생검이 간지방 정도를 가장 정확히 추정하는 확진 방법이다. 생검 최적 시기는 분만 후 8~14일이다(Periparturient Diseases). 다만 대부분의 소는 병력·임상·검사 소견으로 진단하며 생검은 거의 필요 없다(Rebhun).</span><span class="hang">생검 조직을 물(비중 1.000)과 비중 1.025, 1.055 황산구리 용액에 넣어 뜨고 가라앉음으로 지방 함량을 추정한다. 책마다 구간이 조금 다르다.</span><table class="bxt"><tr><th>부유 양상</th><th>Constable</th><th>Rebhun</th></tr><tr><td>세 용액 모두 뜸</td><td>지질 34% 초과, 중증(간기능부전 증상 예상)</td><td>35% 초과, 중증</td></tr><tr><td>물에 가라앉고 1.025·1.055에 뜸</td><td>25~34%, 중등도</td><td>25~35%, 현저</td></tr><tr><td>1.055에만 뜸</td><td>13~25%, 경도(대부분의 건강한 분만후 소)</td><td>15~25%, 경도</td></tr><tr><td>모두 가라앉음</td><td>13% 미만, 무의미</td><td>-</td></tr></table><span class="hang">임상증상은 25~35% 구간에서 나타나고 35% 초과에서 심해지지만 이 구간으로 예후를 확실히 판단할 수는 없고, 높은 구간의 소도 치료로 살아날 수 있다(Rebhun). 간지방 34% 초과(증류수에 뜸)까지는 지방량과 증상의 관련이 적다(Large Animal IM).</span><span class="hang">분만 1주 후 조직학적 지질 기준: 20% 미만(간 50 mg/g 미만) 경도·정상, 20~40%(50~100 mg/g) 중등도, 40% 초과(100 mg/g 초과) 중증이며, 20% 초과를 지방간으로 본다. 임상적 간질환은 간지질 35~45% 이상에서 일관되게 나타난다(Constable).</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>지방간 — 초음파·부검·감별<span class="hang">초음파에서 지방간은 지방 공포와 트리글리세라이드 양에 대략 비례하여 미만성으로 에코가 높아지고(밝아짐) 간혈관이 작아 보이며, 간이 커지고 가장자리가 둥글어질 수 있다. 판정이 주관적이고 장비 설정에 좌우되며, 디지털 영상 분석은 연구 단계이다.</span><span class="hang">치명적 중증례의 간은 크게 커지고 담황색이며 잘 부서지고 기름지며 물에 뜰 수 있다. 조직학적으로 지방 낭포(지방육아종), 간세포 종대, 동양혈관 압박, 조면소포체 감소, 미토콘드리아 손상이 보인다. 신장, 심근·골격근, 부신에도 트리글리세라이드가 침윤한다.</span><span class="hang">젖소 감별: 제4위 좌방전위(이차 케토시스, 좌측 핑음), 태반정체·자궁염(발열, 악취 분비물, 어느 정도 지방간이 동반되어 구분 불가), 분만 직후 원발성 케토시스(포도당·프로필렌글리콜에 반응 좋음), 유열.</span><span class="hang">육우 분만 전 임신중독 감별: 제4위 매몰, 미주신경성 소화불량, 만성 복막염. 이차 감별로 중독성·감염성(살모넬라, 클로스트리듐)·기생충성 간염, 담즙정체, 간농양도 고려한다(Blackwell).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>지방간 — 치료 원칙과 예후<span class="hang">중증 지방간의 예후는 나쁘다. 3일 이상 완전 식욕부진인 중증례는 집중 치료에도 대개 죽고, 신경증상이 있으면 예후가 매우 나쁘다. 가장 큰 예후 인자는 먹는지 여부이며, 계속 더 먹는 소는 보조 치료와 기호성 사료로 회복한다.</span><span class="hang">질 좋고 기호성 높은 건초와 충분한 물을 준다. 동반 질환을 치료하는 것이 가장 중요하다.</span><span class="hang">세 가지 전략이 있다. 지방동원과 혈장 NEFA를 줄이는 것(가장 효과적, 프로필렌글리콜이 일부 이 기전), 간에서 NEFA의 완전 산화를 돕는 것, 간의 VLDL 배출을 늘리는 것(콜린)이다. 기전이 달라 프로필렌글리콜과 반추위 보호 콜린의 병용이 이론적 이점이 있다.</span><span class="hang">만성 지방동원·케토시스·간지질증 소는 흔히 우군 최고 능력우이며 이미 1~3주간 일반 케토시스 치료를 여러 번 받은 경우가 많다. 하룻밤에 낫지 않으므로 더 적극적으로 치료한다(Rebhun). 이런 만성례는 분만 후 6주간 발정이 늦고 유량이 줄지만 완전 회복 예후는 매우 좋고, 대부분 비유 6~8주에 회복한다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>지방간 — 치료 약물<table class="bxt"><tr><th>약물</th><th>용량·방법</th><th>출처·비고</th></tr><tr><td>프로필렌글리콜</td><td>300 mL/일, 5일, 경구</td><td>Constable. 사료에 섞지 말고 드렌치(Rebhun)</td></tr><tr><td>50% 포도당</td><td>500 mL 1회 정주</td><td>Constable. 250~500 mL를 3일 반복(Blackwell)</td></tr><tr><td>포도당 CRI</td><td>5~10% 포도당 + 염화칼륨 최종 40 mEq/L</td><td>Rebhun. BHB 1.2 mmol/L 미만, 혈당 150 mg/dL 미만 목표</td></tr><tr><td>포도당 지속 정주</td><td>약 100~200 mg/kg/시간</td><td>Large Animal IM</td></tr><tr><td>덱사메타손-21-이소니코티네이트</td><td>20~25 mg 근주</td><td>좌방전위 수술 후 간 지질 감소(Constable)</td></tr><tr><td>글루코코르티코이드</td><td>덱사메타손 10~30 mg, 플루메타손 2~5 mg, 프레드니솔론 100~200 mg</td><td>Blackwell, Large Animal IM. 면역 억제, 임신축 금기</td></tr><tr><td>글루카곤</td><td>15 mg/일 피하, 14일</td><td>분만 8일째 시작, 3.5세 초과 소에서 간 트리글리세라이드 감소(Constable). 7.5~15 mg/일, 비용 과다(Large Animal IM)</td></tr><tr><td>인슐린(장시간형 PZI)</td><td>200 IU 피하 24~36시간마다</td><td>Rebhun, 반드시 포도당 지속 정주와 병용</td></tr><tr><td>인슐린(NPH·Lente)</td><td>체중 1000 lb당 200 IU, 12시간마다</td><td>Large Animal IM, 포도당 없이 쓰면 심한 저혈당 위험</td></tr><tr><td>비타민 B12</td><td>1~4 mg 정주, 1일 1회 2~3회</td><td>Constable</td></tr><tr><td>니아신</td><td>12 g/일 경구</td><td>지방분해 억제(Rebhun)</td></tr><tr><td>반추위 보호 콜린</td><td>45~75 g/일, 분만 21일 전~분만 60일 후</td><td>Large Animal IM. 60 g/일(Blackwell)</td></tr></table><span class="hang">그 밖에 반추위액 이식(5~10 L), 물과 복합 전해질 10~30 L 반추위 내 투여가 있다(Constable).</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>지방간 — 강제급이와 제한 착유<span class="hang">만성 지방동원과 간지질증 소에서 가장 중요한 치료는 강제급이다. 알팔파 분말, 염화칼륨 4 oz, 건강한 공여우의 반추위액으로 만든 죽을 하루 2회 준다(Rebhun).</span><span class="hang">3~5일 치료해도 효과가 없으면 하루 2회 1분씩만 착유하여 음의 에너지 균형의 고리를 끊는다. CMT 음성인 소만 대상으로 하며, 대개 4~7일 제한 착유하면 케토시스가 해결된다. 이후 남은 비유기 유량은 매우 좋았다고 한다.</span><span class="hang">분만 시 비만하고 중증 케토시스가 있는 소는 입원하여 저혈압, 젖산산증, 패혈증, 근육병증, 무기질·전해질 불균형에 대해 수액 치료를 한다. 일부는 기저 혈당이 이미 높을 수 있다. 강제급이와 제한 착유, 필요시 인슐린을 쓰고, 패혈증 위험 때문에 적절한 전신 항생제를 준다.</span><span class="hang">육우 집단 발생 시 남은 소를 체형별로 나눠 급여한다. 지나치게 살찐 소는 가장 좋은 건초와 보충사료를 주고, 바닥에 사료를 뿌려 걷게 하여 운동시킨다(Constable).</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>지방간 — 예방<span class="hang">분만 시 과비를 피하는 것이 가장 효과적이다. 비유 말기와 건유기에 살찌지 않게 하고, 분만 전후 질병(케토시스, 전위, 태반정체, 급성 유방염, 유열, 기립불능)을 가능한 한 빨리 치료한다.</span><span class="hang">NRC는 건유 시작부터 분만 약 21일 전까지 NEL 약 1.25 Mcal/kg, 분만 전 마지막 3주는 1.54~1.62 Mcal/kg 사료를 권장한다. 건유 초기 과잉 에너지는 다음 비유 초기에 악영향을 남긴다. 건유 시 BCS를 전통적인 3.5보다 약 3.0으로 맞추도록 권장한다(Constable).</span><span class="hang">모넨신 서방형 캡슐(335 mg/일, 95일)을 분만 2~4주 전 투여하면 에너지 관련 질병, 아임상 케토시스, 좌방전위를 40%, 태반정체를 25% 줄였다.</span><span class="hang">12~13개월 분만간격 유지, 분만·수정·비유 중기·건유기 체형 관찰, 비유 말기 에너지를 유량에 맞추기가 필요하다. 임신 7개월과 건유기 이후 유지·임신 요구량 아래로 사료를 제한하는 것은 반드시 역효과이다. 건유기 건물섭취는 체중의 약 2%로 제한하되 요구량을 맞춘다(Large Animal IM).</span><span class="hang">육우 임신중독은 임신 말 1/3기, 특히 건유기에 살찌지 않게 하는 것이 원칙이다. 체격과 체형별로 나눠 급여하고 혈당과 BHB로 대사 프로필을 평가한다. PEM 예방은 임신 말 1/3기에 BCS 5~7(9점 척도)로 진입하고 양질 조사료를 충분히 주는 것이다. 조사료 최대 건물섭취량은 저질(짚) 체중의 1~1.5%, 중간 2%, 우수 2.5%이고, 0°C에서는 유지 에너지가 20% 더 필요하다(Large Animal IM).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">35.</span><span>간농양 — 원인균<span class="hang">F. necrophorum은 그람음성 무아포 혐기성(내기성) 간균으로 반추수 구강과 상부 소화기·호흡기의 상재균이며 부제병, 송아지 디프테리아의 원인균이기도 하다. 젖산을 주 기질로 쓰므로 조사료에서 고곡류 사료로 바뀌면 반추위 내 수가 늘어난다. 체외에서는 길어야 1개월 생존한다.</span><span class="hang">아종 necrophorum(옛 생물형 A)이 소 간농양의 71~95%(75%는 순수배양)에서, 아종 funduliforme(옛 생물형 B)는 5~29%(75% 이상 혼합감염)에서 분리된다. 아종 necrophorum이 백혈구독소를 더 많이 만들어 병원성이 강하다.</span><span class="hang">두 번째로 흔한 균은 Trueperella pyogenes이며 산소를 소비해 혐기 환경을 만들고 용혈로 철을 공급하여 F. necrophorum 증식을 돕는다. 백혈구독소가 T. pyogenes를 탐식으로부터 보호한다고 여겨진다. Bacteroides, 연쇄상구균, 포도상구균도 혼합 분리된다.</span><span class="hang">주 독력인자는 백혈구독소와 내독소(LPS)이다. 백혈구독소는 반추수 호중구, 대식세포, 간세포, 반추위 상피세포에 특이적으로 세포독성이 있다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>간농양 — 역학과 위험요인<span class="hang">모든 연령·형태의 소에서 생기지만 반추위염에 속발하는 곡류 비육우에서 경제적으로 가장 중요하다. 미국 비육장 유병률은 대부분 12~32%, 평균 10~20%(1~2%에서 60~80%까지)이다. 도태 젖소의 간농양 발생률이 32.1%라는 조사도 있다.</span><span class="hang">반추위 산증에 의한 반추위염이 일차 감염 부위이다. 저조사료·고에너지 사료일수록, 조사료가 줄수록 늘어난다. 배고픈 소를 고에너지 사료에 갑자기 들이거나, 에너지를 빨리 올리거나, 급여 시간과 양이 불규칙한 사조 관리에서 많다.</span><span class="hang">홀스타인은 더 오래, 더 많이 먹어 육우 품종보다 위험이 높고 중증 농양 비율도 높다(50~60% 대 30~40%). 거세우가 미경산우보다 약간 높다.</span><span class="hang">송아지는 출생 시 배꼽 감염(대개 7일령 전후 발병, 제정맥염 동반)이나 반추위 궤양으로 감염된다. 젖소는 비유 개시 시 사료 에너지가 갑자기 늘 때 같은 반추위 발효 적응 실패가 올 수 있고, 창상성 제2위염이 원인이면 개체 문제가 된다. 간흡충 이행 궤적에 농양이 생기기도 한다.</span><span class="hang">한 우군에서 여러 마리에 간농양이 확인되면 영양 관리와 아급성 반추위 산증을 우군 문제로 의심해야 한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>간농양 — 기전과 경제적 의미<span class="hang">반추위염이나 제정맥염의 혈액이 문맥계로 배액되면서 세균이 간 모세혈관에 색전으로 걸린다. 급성 반추위 산증의 단기 고산도 노출이나 아급성 산증의 만성 노출이 반추위 점막 부전각화증과 반추위염을 일으키고, 그 부위에서 F. necrophorum이 크게 늘어 침입한다.</span><span class="hang">문맥에 F. necrophorum을 접종하면 30분~2시간 안에 미세농양, 3~36시간 안에 육안 농양이 생긴다. 8시간 이하는 호중구, 12시간 이상은 대식세포가 우세하다.</span><span class="hang">농양은 대부분 너무 작아 증상이 없다. 간 병소에서 혈행성으로 퍼지거나 후대정맥으로 터지면 여러 장기 병변, 객혈을 동반한 중증 폐질환, 급사(후대정맥 증후군)가 온다. 농양이 총담관 근처에서 자라면 담즙 흐름을 막고, 미주신경성 소화불량의 원인이 되기도 한다.</span><span class="hang">미국 도축장 조사에서 비육 거세우 간의 5.4%가 대농양, 8.3%가 소농양으로 폐기되었고 간농양이 간 폐기의 단일 최대 원인이다. 가장 큰 손실은 간 폐기보다 대농양 소의 사료섭취·사료효율·증체·도체율 저하이며, 이는 가장 심한 농양(대농양 1개 이상 또는 다발성 소농양)에서만 나타난다. 도축 시 발견되면 간을 폐기해야 하므로 부산물 수취 가격이 떨어진다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>간농양 — 임상증상<span class="hang">비육우는 수백 개의 작은 농양이나 몇 개의 큰 농양이 있어도 대부분 증상이 없고 도축 시 발견된다.</span><span class="hang">젖소 급성례는 발열, 식욕부진, 침울, 유량 감소, 쇠약을 보이고, 우측 후늑골 타진 시 복통, 등을 굽힘, 움직이거나 눕기를 꺼림이 있다. 간이 커져 늑골궁 뒤에서 쉽게 촉지되기도 하며, 숨쉴 때마다 신음할 만큼 아프기도 하다.</span><span class="hang">만성례는 국소 징후 없이 식욕부진, 쇠약, 간헐적 설사와 변비를 보인다. 진단된 홀스타인에서 가장 흔한 증상은 식욕부진이었다(Large Animal IM).</span><span class="hang">급성이면 건강하던 소가 아무 증상 없이 갑자기 죽는다. 비육 말기에 살이 잘 오른 소가 갑자기 죽으면 간농양을 의심할 수 있다. 만성이면 점점 마르고 허약하며 황달을 보이고, 말기에 고열(41°C), 만성 설사, 호흡기 증상, 때로 뒷다리 부종을 보인다. 생전 진단이 어려워 다른 병으로 치료하다 죽은 소의 부검에서 발견되는 경우가 대부분이다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>간농양 — 진단·부검·감별<span class="hang">크거나 여러 개인 농양에서는 현저한 호중구성 백혈구증가가 있을 수 있고, 혈청 글로불린과 피브리노겐이 크게 오른다. 간효소는 오르지 않을 수 있으나 큰 농양에서는 GGT가 오를 수 있다. 임상화학과 간기능 검사는 간농양 예측에 가치가 낮다.</span><span class="hang">간은 염증이 생겨도 말기 전에는 혈액 성분과 간기능 검사가 정상이어서 죽기 전 진단이 매우 어렵다(한우컨설팅지침서).</span><span class="hang">초음파가 위치 확인, 예후·치료 반응 평가에 가장 유용하다. 병변은 수 cm에서 20 cm 이상이며 대개 인접한 3~4개 늑간에서 보이고, 흡인이 꼭 필요하지는 않다. 고에코 농양(진한 농)은 치료 성공 가능성이 낮고, 저에코 단일 농양은 페니실린 1개월 투여로 회복한 예가 있다(Rebhun). 드물게 큰 농양이 흉부 방사선에서 횡격막을 밀어낸 모습으로 보인다.</span><span class="hang">도축우 6337두 중 368두(5.8%)에 간농양이 있었고 그중 24%가 후대정맥 혈전증을 일으킬 수 있는 간 앞쪽 등쪽에 있었다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>간농양 — 치료<span class="hang">F. necrophorum은 시험관 내에서 베타락탐, 테트라사이클린, 마크로라이드, 린코마이신에 감수성이고 아미노글리코사이드와 이오노포어에 내성이다. S. enterica는 페니실린·마크로라이드에 감수성이 아니다.</span><span class="hang">비육우 간농양은 임상 질환이 아니어서 일상적으로 치료하지 않는다. 임상례는 병소 내 치료 농도를 얻기 위해 고용량 장기 투여가 필요하며, 국소 감염이 완전히 통제되지 않아 재발이 흔하다.</span><table class="bxt"><tr><th>약물</th><th>용량</th><
