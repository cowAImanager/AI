/tr><tr><td>프로카인 페니실린 G</td><td>44,000 IU/kg 근주, 24시간마다 장기</td></tr><tr><td>옥시테트라사이클린</td><td>10 mg/kg 근주 24시간마다, 또는 지속형 20 mg/kg 72시간마다 장기</td></tr><tr><td>암피실린 삼수화물</td><td>10 mg/kg 피하·근주, 24시간마다 장기</td></tr></table><span class="hang">페니실린은 작고 저에코인 농양에서 성공할 수 있으나 4주 이상 투여하지 않으면 재발이 잦다. 배농 여부는 크기, 위치, 소의 상태로 정하며 배농해도 재발할 수 있다. 임상증상을 일으킨 농양의 예후는 조심스럽고, 크고 고에코인 농양에서 가장 나쁘다(Rebhun).</span><span class="hang">테트라사이클린 같은 광범위 항생제로 낫는 경우도 있으나 효과 없는 경우가 많아 비경제적이며, 간농양으로 진단되면 바로 출하하는 것이 바람직하다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>간농양 — 예방: 사료 관리<span class="hang">반추위 산증과 반추위염 예방이 핵심이다. 사료 에너지를 단계적으로 올리고, 곡류 종류와 함량에 주의하며, 사조 관리를 바르게 한다.</span><span class="hang">고곡류 사료에 서서히 적응시키고, 과소·과다 급여를 피하며, 급여 횟수를 늘려 섭취를 분산하고, 조사료 함량을 늘리며, 주정박 같은 곡류 부산물을 넣고, 혼합 품질을 관리하며, 충분한 사조 공간과 깨끗한 물을 준다(Large Animal IM).</span><span class="hang">젖소에서는 완충제, 고수분 옥수수 같은 고에너지 곡류 전에 건초 선급여, 무엇보다 TMR 급여로 산성 사료를 누그러뜨린다. 젖소 사료를 육성우나 임신 미경산우에 주지 않는다(Rebhun).</span><span class="hang">제1위염, 복막염, 제대염이 생기면 즉시 적극 치료하고, 제1위염 예방을 위해 과산증을 예방한다. 농후사료 다급으로 과산증과 제1위 부전각화증이 생기고 그 점막이 계속 자극받으면 제1위염이 된다(한우컨설팅지침서).</span><span class="hang">신생 송아지는 배꼽 소독, 깨끗한 깔짚, 충분한 양질 초유 급여로 상행성 제정맥 감염을 막는다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>간농양 — 예방: 사료첨가 항생제와 백신<span class="hang">사료 첨가 항생제는 간농양 발생을 크게 줄이며 미국 비육장의 70% 이상이 쓰지만, EU 등 많은 나라에서는 예방 목적 사료 첨가가 허용되지 않는다.</span><table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>타이로신</td><td>90 mg/두/일 경구 장기(사료 톤당 11 g). 톤당 8~10 g 또는 60~90 mg/두/일(Large Animal IM)</td></tr><tr><td>클로르테트라사이클린</td><td>70 mg/두/일 경구 장기</td></tr><tr><td>옥시테트라사이클린</td><td>75 mg/두/일 경구 장기</td></tr><tr><td>버지니아마이신</td><td>16.5~19.8 mg/kg 경구, 24시간마다 장기</td></tr></table><span class="hang">타이로신이 가장 많이 쓰이고 효과가 높다. 타이로신 톤당 11 g 또는 90 mg/두/일 급여 시험 요약에서 간농양이 73% 줄었다(Constable). 40~70% 감소라는 기술도 있다(Large Animal IM). F. necrophorum의 내성 발현 증거는 없다.</span><span class="hang">백혈구독소 백신과 T. pyogenes–F. necrophorum 세균-톡소이드 백신은 사료 내 타이로신과 비슷한 정도로 유병률과 중증도를 줄였다. 두 시험에서 감소율은 48.4%(대조 31%, 접종 16%)와 37.5%(대조 48%, 접종 30%)였고, 타이로신과 병용해도 상가 효과는 없었다.</span><span class="hang">시판 세균 백신(Fusogard)은 2 mL를 21일 간격으로 피하 주사한다. 유병률이 낮은(10%) 집단에서는 효과가 있었지만 높은(30%) 집단에서는 효과가 없었다(Large Animal IM).</span><span class="hang">부제병 예방 백신을 주사하는 방법도 있지만 효과가 그다지 좋지 않다(한우컨설팅지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">43.</span><span>후대정맥 혈전증 — 기전<span class="hang">후대정맥 혈전증(caudal vena cava thrombosis, CVCT)은 대부분 간문부나 후대정맥 인접 간농양, 또는 횡격막 뒤 농양에서 시작한다. 정맥염이 먼저 생기고 혈전이 흉강 쪽 혈관으로 자란다. 혈전은 간과 우심방 사이 어디에나 생기지만 후대정맥이 횡격막으로 들어가는 곳이 가장 흔하다.</span><span class="hang">혈전에서 떨어진 색전이 폐동맥에 걸려 색전증, 동맥내막염, 다발성 폐농양, 만성 화농성 폐렴을 일으킨다. 폐농양 근위부 폐동맥에 동맥류가 생기고, 소의 폐동맥 분지는 기관지에 가까이 달리므로 커진 농양이 기도로 터지면 화농성 기관지폐렴과 동맥류 출혈이 이어져 객혈과 비출혈이 된다.</span><span class="hang">농양의 수보다 위치가 훨씬 중요하며, 간문부나 후대정맥 인접 농양만 의미 있는 위험이다. 젖소는 비육우의 다발성 소농양(sawdust liver)과 달리 크고 적은 농양, 흔히 단 하나를 가진다. 원인 병리는 증상 발현 수개월~수년 전에 시작되었을 가능성이 높다.</span><span class="hang">혈전이 간정맥 개구부를 막으면 간 울혈과 간종대, 복수, 복부 팽만이 오고, 문맥고혈압으로 전신 내장 부종과 설사가 생길 수 있다. 일부는 우심부전과 만성 폐성심이 온다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>후대정맥 혈전증 — 임상형<span class="hang">급사형: 간문부 농양이 후대정맥으로 급성 파열되면 대량 혈전색전이 우심과 폐동맥으로 가 폐경색, 독혈증, 무산소증으로 급사한다. 성우 젖소 급사의 흔한 원인 중 하나이므로, 갑자기 죽은 성우의 현장 부검에서 간문부와 후대정맥을 꼭 살핀다. 대량 기관지 내 출혈로 피 웅덩이에 누운 채 발견되며, 소에서 호흡기 출혈로 그 자리에서 쓰러져 죽는 유일한 흔한 원인일 것이다.</span><span class="hang">급성 호흡곤란형: 무리에서 한 마리만 과급성 호흡곤란, 발열, 빈호흡·빈맥을 보이며 폐부종, 피하기종, 개구호흡이 있을 수 있다. 호흡 노력에 비해 폐음은 오히려 조용하다. 대증 치료로 5~10일에 걸쳐 나아지기도 하지만, 대개 3~6주 뒤 객혈, 비출혈, 빈혈, 만성 폐렴이 시작된다.</span><span class="hang">객혈·비출혈·만성 폐렴·빈혈형(고전형, 가장 흔함): 발육 불량, 반복 기관지폐렴 치료 병력, 발열(39.4~41.1°C), 호흡수 증가, 국소 수포음, 빈혈성 심잡음, 고통스러운 호흡과 호기 신음, 늑간·검상연골 압박 시 통증, 반추위 운동 저하, 제2위 통증 반응 양성이 있다. 비출혈이 객혈 소에서 가장 흔한 징후이다. 일부는 심내막염이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>후대정맥 혈전증 — 진단<span class="hang">빈혈, 객혈, 비출혈, 광범위한 비정상 폐음이 특징적인 조합이다. 빈혈, 백혈구증가, 재생성 좌방이동을 동반한 호중구증가, 만성 감염에 의한 고감마글로불린혈증이 흔하고, 혈청 GGT는 약 1/3에서 높다.</span><span class="hang">혈청 글로불린 5.0 g/dL 초과와 피브리노겐 600 mg/dL 초과가 흔하며 의심을 높이지만 확진은 아니다(Rebhun).</span><span class="hang">초음파에서 후대정맥이 정상의 삼각형이 아닌 원형~타원형이고, 간정맥·비정맥·문맥이 확장될 수 있으며, 혈전을 직접 볼 수도 있다. 간문부 주변 후대정맥의 정상 직경은 2~5 cm이다. 우측 제8~12 늑간 경복부 초음파로 간농양과 간문부, 복부 후대정맥을 본다(Rebhun).</span><span class="hang">흉부 방사선은 약 1/3에서 이상을 보이며, 불규칙한 국소·미만성 폐 음영 증가, 색전성 경색과 출혈에 의한 음영, 횡격막 가까운 흉부 후대정맥 확장을 보일 수 있다. 내시경으로 하부 기도 출혈을 확인하고 기관 세척액을 얻을 수 있다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>후대정맥 혈전증 — 치료·예후·관리<span class="hang">효과 있을 치료가 없으며, 조기에 알아보고 가능하면 도축하여 회수하는 것이 주 과제이다(Constable).</span><span class="hang">급성 호흡곤란형의 대증 치료(Rebhun): 옥시테트라사이클린, 세프티오퍼, 페니실린 같은 광범위 항생제, 폐부종 시 푸로세마이드 250~500 mg 근주 1일 2회, 기관지 확장과 분비 억제를 위해 아트로핀 2.2 mg/45 kg 피하 1일 2회, 내독소혈증 대비 플루닉신 메글루민 250~500 mg/450 kg. 호전되면 혈전색전 무균화를 기대하며 장기 항생제를 유지한다.</span><span class="hang">고전형은 병변이 광범위하여 치료할 가치가 거의 없다. 귀한 소는 페니실린 22,000 U/kg 근주 1일 2회와 아스피린 240~480 그레인/450 kg 경구 1일 2회를 장기 투여할 수 있으나, 이미 비출혈을 보인 소에는 아스피린이 금기이다.</span><span class="hang">하부 기도에서 비롯된 비출혈이 확인되면 예후는 극히 조심스럽고, 객혈·비출혈이 시작된 소는 대개 3주 이상 살지 못한다.</span><span class="hang">한 우군에 CVCT 1두는 흔한 불운이지만 2두 이상이면 심각한 경제적 손실의 신호이므로 즉시 사료 프로그램을 평가하고 아급성 반추위 산증을 검사한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">47.</span><span>간질증(간흡충증) — 원인과 생활사<span class="hang">Fasciola hepatica가 가장 흔하고 중요한 간흡충으로 서늘한 기후에 전 세계적으로 분포한다. 더 큰 F. gigantica는 아프리카·아시아 일부 등 따뜻한 지역에 국한된다. 양과 소에서 경제적으로 중요하며, 만성 감염 양이 목초 오염의 가장 중요한 원천이다.</span><span class="hang">성충은 담관에 살며 충란을 분변으로 배출한다. 습한 환경에서 기온이 5~6°C를 넘으면 미라시디움이 부화하여 24~30시간 안에 림네아과 진흙 달팽이에 침입해야 한다. 달팽이 안에서 무성 증식 후 세르카리아로 나와 풀에 붙어 질긴 낭벽을 가진 메타세르카리아가 된다.</span><span class="hang">메타세르카리아를 섭취하면 미성숙 흡충이 장벽을 뚫고 복강을 가로질러 간에 이른다. 이행이 빗나가 소에서는 특히 폐에서 이소성 흡충이 발견되기도 한다.</span><span class="hang">미성숙 흡충은 약 4~5주간 간실질을 이행하며 0.1 mm에서 10 mm로 자라고, 담관에 들어간 뒤 두 배 이상 커져 감염 10~12주 후 산란을 시작한다. 달팽이 안 발육에는 25°C에서 최소 42일(약 600 생장도일)이 걸린다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>간질증 — 역학<span class="hang">위험은 방목지 감염 달팽이 수로 정해진다. 달팽이는 습한 환경에 국한되며 산성이 아닌 저지대 습지, 느린 물, 작은 개울, 샘, 막힌 배수로, 급수조 넘침, 자주 관개하는 땅을 좋아한다. 중성 토양(pH 6~8)과 배수 불량 지역이 해당된다(Blackwell). 피트 초지에 석회를 주면 산도가 낮아져 위험이 커질 수 있다.</span><span class="hang">달팽이 번식과 달팽이 내 흡충 발육은 10°C 이상에서만 일어나므로 대부분 나라에서 겨울에는 발육이 없다. 메타세르카리아는 대개 늦여름과 가을에 가장 많다. 2주간 지속되는 여름 더위와 가뭄은 목초 메타세르카리아를 죽여 전파 시기를 끝낸다.</span><span class="hang">메타세르카리아는 건초·사일리지 제조 중 대개 죽지만, 습한 상태로 수확해 제대로 말리지 않은 건초에서는 최대 8개월 감염력을 유지한다.</span><span class="hang">단기간 대량 섭취는 급성, 장기간 소량 섭취는 만성 질환을 일으킨다. 양과 염소는 강한 방어 면역이 생기지 않지만, 소는 결국 흡충 대부분을 배출하고 재감염에 부분적 방어력을 얻는다. 소의 부분 획득 저항성은 첫 노출 5~6개월 뒤 시작되고 흡충 수명이 짧아 1년 말에는 거의 남지 않는다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>간질증 — 기전<span class="hang">급성 간질증은 어린 흡충이 간실질을 통과하며 생긴다. 메타세르카리아 대량 섭취 5~6주 뒤 흡충이 충분히 커져 기계적 손상, 급성 간기능부전, 출혈이 온다. 소에서 급성형은 드물다.</span><span class="hang">이행 흡충이 만든 혐기성 괴사 조건에서 잠복하던 Clostridium novyi 아포가 활성화되어 감염성 괴사성 간염(흑색병)이 생기고, 세균성 혈색소뇨증도 유발되는 것으로 여겨진다.</span><span class="hang">만성 간질증은 성충이 담관에 자리 잡은 뒤에야 생긴다. 담관염, 담도 폐쇄, 섬유화, 상피를 통한 혈장단백 누출로 저알부민혈증이 오고, 흡충의 흡혈로 전혈이 손실되어 빈혈이 된다. 철 저장이 고갈되면서 정색소성 빈혈이 저색소성으로 바뀐다.</span><span class="hang">만성 감염은 육성 미경산우의 증체와 사료효율, 육우의 증체를 떨어뜨린다. 소의 Salmonella Dublin 감수성을 높이고 감염과 분변 배설을 연장시킨다는 보고가 있다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>간질증 — 임상증상<span class="hang">소는 대개 만성형이며 드물게 아급성이다. 체중감소(특히 비유 중), 유량 감소, 빈혈이 생긴다. 증상이 있으면 체중감소, 쇠약, 침울, 식욕부진, 거친 털, 빈혈, 저단백혈증, 하악 부종, 드물게 경미한 황달을 보인다.</span><span class="hang">우군 내 흡충 분포가 편중되어 있어 흡충 대부분을 가진 10~20%의 소수에서 증상이 먼저 나타난다.</span><span class="hang">소의 흡충 부담별 경제적 손실은 10마리 미만 무시할 만함, 10~40마리 가능, 40마리 초과 개연성 높음이며, 임상 질환은 200마리 초과에서 나타난다. 영양이 부족한 송아지에서 평균 40마리면 증체 8%, 140마리면 28% 감소하였다(Large Animal IM).</span><span class="hang">번식우 농장에서는 영양 스트레스와 소화관 선충 중감염이 겹쳐 체형 저하, 포유 능력 저하, 발정 회복 지연을 일으키고, 번식 효율 저하, 분만간격 연장, 이유 시 체중 미달로 이어진다(Large Animal IM). 번식력 저하도 기술된다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>간질증 — 진단<span class="hang">급성형은 중증 정색소성 빈혈, 호산구증가, 중증 저알부민혈증과 간효소 상승을 보인다. GDH는 어린 흡충이 실질을 이행할 때 특히 가치가 있고 담관에 들어간 뒤 떨어진다. AST 증가는 감염 4주부터 측정되며 미성숙 감염 지표로 유용하다. 아직 미성숙이므로 분변에 충란이 없다.</span><span class="hang">아급성·만성형은 중증 저색소성 대구성 빈혈, 저알부민혈증, 고글로불린혈증을 보이고, 성충의 담관 활동으로 GGT가 오른다. 다른 간기능 검사는 큰 영향이 없다.</span><span class="hang">분변의 특징적 유개(operculated) 충란을 많이 검출하면 만성 간질증을 확진한다. 충란은 벽이 얇고 담즙색소로 황갈색이며(약 140×80 µm), 무거워 부유법으로 잘 뜨지 않는다. 황산아연 용액(비중 1.36)이 권장되지만 침전법이 더 정확하다.</span><span class="hang">반추위 흡충(Paramphistomum) 충란도 유개란이라 구별해야 한다. Paramphistomum 충란은 회색이고(F. hepatica는 호박색) 약간 작고 뚜껑 쪽이 더 뾰족하다. 흡충 구제제가 반추위 흡충에 듣지 않아 치료 후에도 충란이 남는다(Large Animal IM).</span><span class="hang">소는 충란 배출이 적어 현성기에도 분변 검사 민감도가 낮으므로 위험 개체 10~15두의 분변을 검사한다. 우군 평가에서 전파 시기 종료 2~4개월 뒤 분변 2 g당 1개 미만이고 유병률 25%이면 손실 개연성 낮음, 2 g당 1~3개면 손실 가능, 2 g당 10개 이상이면 중감염과 손실 개연성 높음이다(Large Animal IM).</span><span class="hang">혈액·우유 ELISA는 소의 개체·우군 진단에 특히 유용하며, 항체는 감염 2주 뒤부터 6주까지 오른다. 트리클라벤다졸 치료 후 최대 7개월 남아 노출 이력만 뜻할 수 있다(Bovine Medicine). 분변 항원 ELISA는 감염 강도도 알려준다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>간질증 — 부검<span class="hang">급성형: 간이 크게 손상되고 부으며, 피막에 작은 구멍과 피막하 출혈이 많고, 실질에 손상 궤적이 있고 잘 부서진다. 복강에 혈성 장액이 늘어날 수 있다. 미성숙 흡충은 작아서 간을 얇게 썰어 물에 흔들어 가라앉히면 찾기 쉽고, 크기로 감염 기간을 추정해 위험 목초지를 판단할 수 있다.</span><span class="hang">만성형: 약 3.5×1 cm의 잎 모양 흡충이 특히 복엽의 크게 확장·비후된 담관에 있다. 담관이 간 표면 위로 솟고 막힌 담관에 낭이 생기기도 한다. 간실질은 광범위하게 섬유화되고 간림프절은 암갈색이다.</span><span class="hang">담관벽 석회화는 소에서 흔하고 양에서는 없다. 감염 약 20주 후 석회화가 시작된다. 석회화된 담관이 간 표면에 돌출하여 파이프줄기 간(pipe-stem liver)이라 하며 담낭도 커진다(Bovine Medicine). 만성 감염 간은 윤곽이 불규칙하고 창백하며 단단하고, 복엽이 가장 심하게 침범되어 작아진다.</span><span class="hang">감별: 만성형은 구리·코발트 결핍, 오스테르타지아증 등 기생충성 위장염, 요네병. 부검 시 Taenia hydatigena 유충과 구별한다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>간질증 — 치료 약물<span class="hang">모든 약이 모든 발육 단계에 똑같이 듣지는 않으며 경구 트리클라벤다졸이 이상에 가장 가깝다. 급성형에는 간실질을 손상하는 미성숙충에 잘 듣는 약을, 만성형에는 성충에 듣는 약을 고른다. 간 해독 기능이 이미 손상되어 있으므로 안전성도 고려한다.</span><table class="bxt"><tr><th>약물</th><th>소 용량</th><th>특징</th></tr><tr><td>트리클라벤다졸</td><td>12 mg/kg 경구</td><td>소에서 2주령 이상 모든 단계에 높은 효과, 급성 발생의 선택약. 관리 프로그램 투약 간격 8~10주. 내성 보고 다수</td></tr><tr><td>클로르설론 + 니트록시닐</td><td>2 mg/kg + 10.2 mg/kg 피하</td><td>병용으로 미성숙충 효과 최대 99%</td></tr><tr><td>알벤다졸</td><td>10 mg/kg 경구</td><td>성충, 살충란 효과(성충 70% 초과 사멸, Blackwell). 도축 휴약 27일, 번식 연령 암소 사용 금지(임신 초기 기형 유발 가능, Rebhun)</td></tr><tr><td>클로르설론</td><td>13.2 mg/kg 피하(Constable), 2 mg/kg 피하(이버멕틴 합제)</td><td>2 mg/kg에서 성충과 12~14주령 미성숙충에 효과, 8주령은 가변. 7 mg/kg 경구는 성충 99%, 8~12주령 초과 85% 이상(Blackwell)</td></tr><tr><td>니트록시닐</td><td>10 mg/kg 피하</td><td>성충에 좋음. 급성형은 최대 50% 증량 필요. 반추위 미생물이 불활성화하므로 경구 불가</td></tr><tr><td>옥시클로자니드</td><td>10 mg/kg 경구</td><td>성충만, 미성숙충에 무효. 우유 휴약이 짧은 편. 일시적 연변</td></tr></table><span class="hang">모든 흡충 구제제는 우유 휴약 기간이 있거나 사람 식용 우유 생산 동물에 사용이 금지되므로 젖소는 건유 시 치료하는 것이 가장 좋다. 흡충 구제제는 대개 비유 젖소에 허가되어 있지 않다(Blackwell).</span><span class="hang">흡충·선충 합제는 두 기생충 위험이 동시에 있을 때만 쓴다. 무관한 기생충에 내성 선택압을 줄 수 있다.</span><span class="hang">F. hepatica의 알벤다졸, 클로르설론, 트리클라벤다졸 내성이 보고되었다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>간질증 — 전략적 구제와 관리<span class="hang">감염원 차단이 이상적이다. 달팽이 서식지를 찾아 지도화하고 위험 시기에 방목을 피하며, 좁고 경계가 뚜렷한 서식지는 울타리로 막는다. 배수, 도랑·배수관·급수조 정비로 서식지를 줄인다. 가을·겨울 가장 습한 초지에 소를 들이지 않는 것만으로도 위험이 준다.</span><span class="hang">메타세르카리아 섭취와 발병 사이 간격을 이용해 미성숙충에 듣는 약으로 이행충을 제거하여 급성형을 막고, 몇 주 뒤 성충에 듣는 약으로 만성형을 막는다.</span><span class="hang">축사 사육 소는 입사 후 치료하며 시기는 약의 미성숙충 활성에 따른다. 6주령 미만 미성숙충에 듣는 트리클라벤다졸은 입사 시, 라폭사니드나 클로산텔 제제는 입사 4~6주 뒤 쓴다. 젖소는 건유 시 치료한다. 위험이 높은 해에는 야외 월동우를 봄에 치료하며, 이때는 성충 전용 약을 써서 트리클라벤다졸 선택압을 줄인다(Bovine Medicine).</span><span class="hang">전파 시기 종료 2~3개월 안에 효과 높은 약으로 1회 정기 치료하여 겨울 스트레스 전에 성충을 없앤다. 위험이 큰 해나 관개 초지에서는 봄에 추가 치료한다(Large Animal IM).</span><span class="hang">살패제(황산구리 등)는 사람, 가축, 환경에 위험할 수 있고 달팽이가 빨리 재정착하므로 매우 철저해야 한다. 유행 지역에서는 세균성 혈색소뇨증과 흑색병 백신 접종이 현명하다(Rebhun). 재조합 카텝신 L 백신이 소와 양에서 최대 79% 방어를 보였으나 개발 중이다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>기타 간흡충 — 대형 간흡충과 창형흡충<span class="hang">Fascioloides magna(대형 미국 간흡충)는 사슴의 기생충이며 소는 비정상 종말숙주이다. 소에서는 강한 피막 반응으로 담관과 통하지 않는 두꺼운 벽의 검은 낭(지름 약 4 cm)을 만들어 충란이 배출되지 않으므로 분변 검사로 진단할 수 없다. 간실질과 국소 림프절이 특징적으로 검게 착색된다.</span><span class="hang">소에서는 대개 불현성이며 간 폐기가 주 피해이다. 만성 간질증과 비슷한 증상을 낼 수 있다. 양·염소에서는 피막화되지 않고 계속 이행하여 한두 마리로도 치명적이다.</span><span class="hang">Dicrocoelium dendriticum(창형흡충)은 육상 달팽이와 개미(Formica)를 중간숙주로 하여 습지와 무관하게 배수 좋은 땅, 건조한 초지에서도 전파된다. 간실질을 이행하지 않고 담관으로 바로 올라가 병원성이 낮으며, 매우 심한 감염에서만 발육 불량, 간실질 섬유화, 소담관 증식·비후가 온다. 감염이 감염성 괴사성 간염으로 이어질 수 있다.</span><span class="hang">창형흡충은 0.5~1.5 cm로 작고 피침형이며 담관에만 있다. 충란은 작고 유개이며 비대칭이고 암갈색이며(약 40×25 µm), 고비중(1.30~1.45) 부유액이 필요하다. 알벤다졸 15~20 mg/kg, 네토비민 20 mg/kg이 효과적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">56.</span><span>감염성 괴사성 간염(흑색병) — 원인과 역학<span class="hang">원인은 Clostridium novyi B형이다. 아포는 토양에 상재하고 정상 동물의 간에도 있을 수 있으며, 간의 일차 괴사 과정이 계기가 되어 증식하면서 치사량의 독소를 만든다. A형과 C형은 사후 사체에 침입할 뿐 이 병을 일으키지 않는다.</span><span class="hang">현장 발생은 대개 미성숙 간흡충의 간 침입으로 촉발되지만 Cysticercus tenuicollis 낭미충 침입, 간생검 외상 같은 다른 국소 간손상도 유발할 수 있다. 특별한 유발 병변 없이 비육장 소의 급사 원인으로 제시된 예도 있다.</span><span class="hang">양과 소에서 거의 항상 치명적이다. 소의 발생 자료는 적지만 간흡충이 유입되는 지역에서 늘고 있으며 관개 농장에서 흔히 발생한다. 양에서는 2~4세의 영양 상태가 좋은 성축이 특히 취약하다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>감염성 괴사성 간염 — 임상과 부검<span class="hang">소는 양과 증상이 같지만 경과가 1~2일로 더 길다. 갑작스러운 심한 침울, 움직이기 싫어함, 피부 냉감, 반추위음 소실, 저체온 또는 정상 체온, 심음 약화·둔화가 두드러진다. 특히 간을 깊게 촉진하면 복통이 있고 변은 반유동성이며 안와 주위 부종이 생길 수 있다.</span><span class="hang">부검 시 콧구멍에서 혈성 거품이 나오고 사체가 빨리 부패한다. 피하 혈관의 현저한 울혈로 피부 안쪽이 검게 보여 흑색병이라는 이름이 붙었다. 심낭·흉강·복강에 혈성 장액이 늘 많다.</span><span class="hang">간은 붓고 회갈색이며, 지름 1~2 cm의 황색 괴사 부위를 선홍색 충혈대가 둘러싼다. 주로 횡격막면 피막 아래에 있으나 깊이 있을 수도 있어 간을 세심하게 썰지 않으면 놓친다. 소에서는 흔히 선상이어서 찾기 어렵다. 대개 최근 흡충 침입의 손상 궤적이 있고, 성숙 흡충은 보통 보이지 않는다.</span><span class="hang">확진은 전형적 간병변에서 C. novyi 배양과 신선 사체의 복수·간병변에서 기성 독소 증명이다. 사후 24시간이 지난 사체의 독소 검사는 위양성이 많고, 비병원성 B형 균주도 흔해 형광항체법이 위양성을 낼 수 있다. 시료는 밀폐 용기의 간과 병변 주변 압착 도말 4장(혐기 배양, FAT), 고정 간이다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>감염성 괴사성 간염 — 치료와 예방<span class="hang">효과적인 치료는 없다. 소는 경과가 길어 페니실린이나 광범위 항생제 비경구 투여를 시도할 수 있으나 보고된 예의 치사율은 높다. 페니실린 G 나트륨·칼륨 40,000 IU/kg 정주 6~8시간마다(Constable), 20,000~40,000 IU/kg 정주 6시간마다(Blackwell).</span><span class="hang">발생 시 우군 전체에 지속형 페니실린이나 테트라사이클린을 투여하고 흡충 구제제(클로르설론 7 mg/kg 경구 등)를 쓴다. 치료 중인 동물은 운동 스트레스로 급사할 수 있으므로 움직임을 제한한다(Blackwell).</span><span class="hang">명반 침전 톡소이드 백신이 매우 효과적이며 발생 중에도 접종할 수 있고 2주 안에 폐사가 줄기 시작한다. 발생 농장은 첫 접종 4~6주 뒤 2차, 이후 매년 접종한다. 최대 면역을 위해 초여름(예상 흡충 노출 최소 1개월 전 이른 봄, Blackwell)에 접종한다.</span><span class="hang">살패제와 흡충 구제제로 간흡충을 통제하고, 사체는 소각하거나 깊이 묻는다. 백신에 C. novyi B형 항원이 들어 있는지 확인한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">59.</span><span>세균성 혈색소뇨증 — 간 관점의 요점<span class="hang">원인은 Clostridium haemolyticum(C. novyi D형)으로 토양 혐기균이다. 유행 지역에서는 건강한 소의 간에서도 흔히 발견되며, 혐기 조건에서 괴사성·용혈성 독소인 포스포리파아제 C(베타독소)를 만든다.</span><span class="hang">이행 간흡충이 가장 중요한 생물학적 유발 요인이고, 간농양(반추위염 속발), Cysticercus tenuicollis, 패혈증, 간의 대사성 무산소증, 간독소, 간생검도 아포를 영양형으로 활성화할 수 있다.</span><span class="hang">문맥 소분지에 기질화된 혈전이 생겨 특징적인 큰 빈혈성 경색이 만들어지고, 그 안에서 균이 증식하여 베타독소가 전신으로 퍼져 독혈증, 혈관 손상, 혈관 내 용혈을 일으킨다.</span><span class="hang">특징 병변은 지름 5~20 cm의 창백한 간 허혈성 경색으로 충혈대에 둘러싸이며, 신장이 검게 변한다. C. novyi는 정상 간에서도 배양되지만 특징적 경색이 있으면 대개 진단에 충분하다(Rebhun). 혈액검사에서 간손상을 반영하여 AST, GGT가 오르고 빌리루빈이 경도~중등도로 오른다.</span><span class="hang">고용량 페니실린(44,000 U/kg 정주 1일 4회, Rebhun), 전혈 수혈, 수액을 쓰나 성공은 드물다. 회복한 종모우는 간 파열 위험 때문에 최소 3주간 교배하지 않는다. 흡충 통제, 반추위염 유발 사양 교정, C. novyi D형 백신(3~4주 간격 2회, 위험 소는 연 2회 보강)으로 예방한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">60.</span><span>피롤리지딘 알칼로이드 중독 — 간손상 양상<span class="hang">크로탈라리아, 에키움, 헬리오트로피움, 세네시오 등의 알칼로이드 자체는 무독하지만, 간 시토크롬 P450이 만든 피롤 대사물이 누적성 간독소로 작용한다. 피롤은 세포 단백과 결합하고 DNA·RNA를 교차결합하여 세포분열 이상, 거대간세포증(megalocytosis), 괴사를 일으킨다. 소에서는 소엽중심정맥·간정맥이 손상되어 폐쇄된다.</span><span class="hang">간병변은 천천히 진행하지만 발병은 대개 갑작스럽고, 독초 목초지에서 옮긴 지 수개월 뒤에 발병할 수 있다. 송아지가 성우보다 훨씬 감수성이 높고, 양·염소는 소·말 중독량의 30배 이상에서도 견딘다.</span><span class="hang">세네시오 방목 소의 조기 간손상 예측에는 혈청 GGT와 GDH 측정이 권장된다. 탈수소효소는 초기에 오르지만 기능부전 증상이 나타날 즈음에는 정상으로 돌아올 수 있고, 병변이 주로 문맥역에 있어 GGT와 ALP가 일관되게 오른다. 만성례의 손상 정도 평가에는 BSP 청소 검사와 간생검의 조합이 가장 유용하다.</span><span class="hang">간생검에서 섬유화, 담관 증식, 거대간세포증의 삼징이 특징이다. 문맥역 사이를 잇는 섬유화는 결국 치명적이다. 부검 시 소는 마르고 복수와 직장탈이 있으며, 간은 작고 창백한 갈색~황색이며 단단하다. 대개 치명적이며 독초가 있는 목초지와 건초를 피해 예방한다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>아플라톡신 중독 — 간손상 양상<span class="hang">아스페르길루스 플라부스 등이 상대습도 95~97%, 25~37°C에서 상한 사료(땅콩, 면실박, 수수, 옥수수 등)에 만든다. 제분으로 파괴되지 않는다. 육우·젖소는 양이나 말보다 감수성이 높고 어린 동물일수록 취약하다. 사료 AFB1 100 µg/kg 초과면 소에 유독하고, 송아지 LD50은 0.5~1.5 mg/kg으로 추정된다.</span><span class="hang">문맥으로 빠르게 흡수되어 간에 모이고, 시토크롬 P450이 AFB1을 독성 대사물 AFB1-8,9-에폭사이드로 바꿔 DNA·RNA·단백 부가물을 만든다. 탄수화물·지질·단백 대사가 손상되며 간증과 간기능부전이 주 효과이다. 섭취 AFB1의 1~2%가 AFM1으로 우유에 나온다.</span><span class="hang">GGT, AST, SDH가 급성으로 오르고 프로트롬빈 시간과 빌리루빈이 증가한다. 부검 소견은 거대간세포증, 다발성 괴사와 섬유화, 문맥역 원형세포 침윤, 담관 증식 등 간증이며 황달이 있다. 거대간세포증은 피롤리지딘 알칼로이드 중독과 감별해야 한다. 치료는 대증뿐이다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>기타 간독성 물질 — 간병변 요약<span class="hang">간독성 식물과 병변(Large Animal IM): 란타나(괴사, 모세담관 허탈), 테트라디미아(괴사), 놀리나(지방변성, 소엽중심 괴사), 아가베 레추길라(괴사, 광과민증), 남가새(Tribulus, 담관 섬유화·괴사), 기장류(담관 섬유화·괴사), 도꼬마리(출혈성 소엽중심 괴사), 루핀(괴사, 포몹신), 면실(고시폴, 괴사와 심장병변), 남조류(괴사), 알사이크 클로버(문맥 섬유화, 담관 증식), 곰팡이 핀 알팔파(담관 증식, 괴사).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>담관 질환 — 담즙정체와 담관염<span class="hang">임상 증상이 있는 담도 질환은 드물다. 간내 담즙정체는 분만 전후 중증 지방간 비유우에서 관찰되며, 간관 내 침전물(sludge)이나 결석으로도 생긴다.</span><span class="hang">간외 담즙정체는 총담관 담석, 간농양·광범위 유착·간문부나 십이지장 유두 근처 염증 병변의 외부 압박으로 생긴다. 담즙 흐름이 막히면 장내 미생물의 상행 감염으로 담관염이 생기고, 염증 산물과 담즙 성분(담즙산, 콜레스테롤, 결석)이 침전하여 흐름을 더 막는다.</span><span class="hang">증상은 불쾌감, 복통, 발열, 오렌지색 소변을 동반한 황달, 때로 필로에리트린 축적에 의한 광과민성 피부염이며 간 부위 통증이 있다. 백혈구증가, 고피브리노겐혈증, 고빌리루빈혈증, 빌리루빈뇨, 고글로불린혈증과 SDH, AST, ALP, GGT 상승이 있다(Rebhun).</span><span class="hang">초음파에서 담낭, 담낭관·총담관, 주요 간내 담관의 심한 확장이 보인다. 식욕부진 소는 모두 담낭이 늘어날 수 있으므로 담낭 확장은 특이적이지 않고, 담낭관·총담관과 주요 간내 담관 확장이 진단적이다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>담석증과 간종양<span class="hang">소의 담도 결석은 대개 간질증의 후유증이다. 경증은 식욕부진과 간 부위 통증을, 중증은 반복되는 심한 복통 발작, 소화관 정체, 간 부위 타진 통증을 보인다. 황달은 치명례의 말기에만 기립불능, 침울, 혼수와 함께 나타난다.</span><span class="hang">간에서 가장 흔한 종양은 송아지 림프종증의 전이 병소이며, 반추수에서는 원발성 선종·선암과 문맥역 배액 부위 종양의 전이도 드물지 않다. 대부분 간기능장애 증상이 없으나 촉지될 만큼 커지거나 피막을 늘려 복통을 일으킬 수 있다.</span><span class="hang">종양이 담즙 흐름을 막으면 황달과 광과민증이 예상되므로, 황달과 광과민증이 함께 있는 소에서 간종양을 고려한다. 폐·비장 전이가 관찰되었고, 담관암 노령우에서 완전 담도 폐쇄와 고암모니아성 간성뇌증이 있었다. 초음파가 위치 확인, 생검 유도, 예후 평가에 쓸모 있다.</span></span></p></div>
</div>
`;
}
function med_respHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 호흡기</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>호흡기 검사 — 청진의 원칙<span class="hang">조용한 곳에서 보정하되 진정은 호흡음을 약하게 하므로 피한다. 후두·기관·기관분기부를 먼저 듣고 양쪽 폐야 전체를 체계적으로 듣는다.</span><span class="hang">호흡음은 큰 기도의 난류에서 생기고 정상 폐는 공기-조직 경계면 때문에 소리가 감쇠된다. 폐포가 차고 기관지가 열려 있으면(경화·무기폐) 기관음 같은 크고 거친 소리가 들리고, 기관지가 삼출물로 막히면 오히려 소리가 줄어든다.</span><span class="hang">재호흡 검사: 처음 청진에 이상음이 없는데 호흡기병이 의심될 때 코를 30~60초 막거나 밀폐 봉지(체중 kg당 10~15 mL, 500 kg 소는 10 L)를 씌워 깊은 호흡을 유도한다. 호흡곤란 동물에는 금기다.</span><span class="hang">만성 폐렴의 경화 부위는 견갑 아래로 청진기를 밀어 넣어야 들리는 경우가 많다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>호흡음의 해석<table class="bxt"><tr><th>소리</th><th>의미·예</th></tr><tr><td>호흡음 증가</td><td>발열·흥분·고온·운동, 경화·무기폐에서 거칠고 큼</td></tr><tr><td>호흡음 감소·소실</td><td>비만, 흉수, 흉강 종괴, 기흉, 횡격막 탈장, 큰 폐농양, 삼출물로 막힌 기관지</td></tr><tr><td>수포음(crackle)</td><td>짧고 단속적. 기도 분비물·삼출물, 점막 부종(기관지폐렴, 흡인성 폐렴). 간질성 폐기종에서 큰 수포음</td></tr><tr><td>천명음(wheeze)</td><td>연속음. 흡기성은 흉곽 외 상부기도, 호기성은 흉곽 내 기도 협착(기관지수축, 세기관지염)</td></tr><tr><td>흉막 마찰음</td><td>사포 소리, 기침으로 안 변함. 흉막염 초기, 흉수가 차면 사라짐</td></tr><tr><td>협착음(stridor)</td><td>고음의 흡기음. 후두 폐쇄(송아지 디프테리아, 후두 부종)</td></tr><tr><td>코골이음(stertor)</td><td>청진기 없이 들리는 낮은 소리. 인두·비인두 부분 폐쇄</td></tr><tr><td>호기성 신음</td><td>미만성 폐기종, 광범위 경화, 흉막폐렴, 급성 흉막염</td></tr></table></span></p><p class="bx-num"><span class="bxn">3.</span><span>상부기도음과 폐렴의 구별, 기침과 자세<span class="hang">청진기 없이 들리는 소리는 대부분 상부기도에서 나온다. 상부기도음은 양쪽 폐야로 전달되어 폐렴으로 오인되므로 반드시 기관을 청진한다. 후두염·기관염은 흡기성 호흡곤란, 잦은 기침, 후두·기관 압박 시 쉽게 유발되는 기침이 특징이다. 폐렴의 이상음은 흡기·호기 모두에서 들린다.</span><span class="hang">빠르고 얕은 호흡이 초기 폐렴의 주된 징후이며 호흡수는 병변 범위를 정확히 반영하지 않는다. 세균성 기관지폐렴은 습하고 아픈 기침, 바이러스성 간질성 폐렴은 마른 발작성 기침을 보인다.</span><span class="hang">심한 호흡곤란에서는 머리와 목을 낮게 뻗고 개구호흡하며 침을 흘리고, 흉막통이 있으면 팔꿈치를 벌린다. 검사 중 날뛰는 것은 대개 저산소증 때문이므로 보정을 풀어야 하며 계속 붙잡으면 질식사할 수 있다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">4.</span><span>흉부 초음파 — 원리와 진단 가치<span class="hang">흉막에 닿지 않은 폐 병변은 볼 수 없다. 정상 폐는 고에코 흉막선과 아래의 반향 인공물로, 경화 폐는 균질한 저에코의 간 모양 조직으로 보인다.</span><span class="hang">검출 가능한 소견: 흉수와 그 성상, 무기폐·경화, 흉막에 닿은 농양, 흉강 종괴, 혜성꼬리 인공물(흉막 거칠어짐), 기흉(등쪽 공기선의 미끄럼 소실), 횡격막 탈장. 흉수 검출은 방사선보다 민감하다.</span><span class="hang">송아지 경화 검출에서 청진의 민감도는 초음파 대비 6%(Constable), 또는 3~17%이고 위스콘신 점수표는 민감도 55%·특이도 58%였다(Rebhun). 초음파는 무증상 병변에서 민감도 94%, 특이도 100%였다.</span><span class="hang">흉수는 무에코~저에코, 섬유소는 떠다니는 실 모양, 유착은 흉막을 잇는 에코성 띠다. 흉수·농양 내 소용돌이치는 밝은 가스 에코는 혐기성 감염을 시사한다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>송아지 흉부 초음파 방법<span class="hang">직장 임신진단용 3.5~8 MHz 선형 탐촉자가 좋고, 70% 이소프로필 알코올을 털에 뿌리며 털은 깎지 않아도 된다. 10번에서 1번 늑간 방향으로 각 늑간을 등쪽에서 배쪽으로 훑는다(Rebhun). 5~7번 늑간이 가장 유용하다는 기술도 있다(Bovine Medicine).</span><span class="hang">랜드마크: 6~10번 늑간은 후엽(배쪽 경계 횡격막), 우측 5번은 우중엽, 좌측 4~5번은 좌전엽 후부, 우측 3~4번은 우전엽 후부(심장이 경계), 우측 1~2번은 우전엽 전부(내흉동정맥 주위 흉막 계단). 우전엽 끝은 좌측 2번 늑간에서만 보이기도 한다.</span><span class="hang">기관지폐렴은 우전엽 전부, 우중엽, 좌전엽 후부에 흔하고 후엽은 드물다. 후엽 침범, 농양, 불량한 체형은 예후가 나쁘다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>송아지 폐 초음파 점수<table class="bxt"><tr><th class="c">점수</th><th>소견</th></tr><tr><td class="c">0</td><td>혜성꼬리 거의 없음, 경화 없음</td></tr><tr><td class="c">1</td><td>미만성 혜성꼬리, 경화 없음</td></tr><tr><td class="c">2</td><td>소엽성 폐렴: 단일·다발성 반점상 경화</td></tr><tr><td class="c">3</td><td>대엽성: 1개 엽 전체 경화</td></tr><tr><td class="c">4</td><td>대엽성: 2개 엽 전체 경화</td></tr><tr><td class="c">5</td><td>대엽성: 3개 엽 이상 전체 경화</td></tr></table><span class="hang">3~5점은 대엽성 세균성 기관지폐렴, 1 cm 미만 2점 병변은 대개 바이러스성, 0~1점은 대체로 정상이다(Rebhun). 세균 접종 2시간 후 변화가 생겨 6시간에 최고가 되며 이때 이미 초음파로 보인다.</span><span class="hang">만성 화농성 폐렴은 병변 등쪽 경계에 2~8 cm 저에코 기둥들, 배쪽에 넓은 간 모양 경화를 보인다(Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">7.</span><span>기도 시료 — 비인두 스왑과 경기관 세척<span class="hang">비인두 스왑: 외피 보호 스왑을 내안각 높이까지 넣고 끝을 내밀어 돌린 뒤 외피 안으로 넣어 뺀다. IBR 등 상부기도 바이러스에 유용하나, M. haemolytica 등은 상재균이라 원인 단정이 어렵다. M. bovis는 감염 개체의 33%만 비인두 배양 양성이었다. 나무 자루 면봉은 마이코플라즈마를 억제한다.</span><span class="hang">경기관 세척(TTW): 기관 중간부를 소독하고 연골륜 사이로 10 G, 2인치 바늘을 넣어 관을 흉곽 입구 10 cm 너머까지 넣는다. 따뜻한 멸균 식염수나 젖산링거액 20~30 mL를 주입 후 즉시 흡인하면 5~10 mL가 회수된다.</span><span class="hang">심한 기침 개체에서는 기관 구멍으로 피하기종이 생길 수 있다. 기관 흡인물은 여러 부위 분비물이 섞여 폐농양 같은 국소 병변에 더 민감하다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>기관지폐포세척(BAL)<span class="hang">커프 달린 관을 코로 넣어 기관지에 끼우고 따뜻한 젖산링거액을 송아지 약 30 mL, 성우 최대 180 mL 주입 후 즉시 흡인한다(Constable).</span><span class="hang">현장법: 목을 앞으로 뻗게 보정하고 콧구멍에 국소마취 젤을 바른 뒤 지름 6 mm, 90 cm 관을 배쪽 비도로 넣어 흡기 때 성문을 통과시킨다. 관 끝에서 호흡이 느껴지고 기침이 나면 기관이다. 기관분기부에서 인산완충식염수 20 mL를 넣었다 빼면 거품 섞인 액 약 10 mL가 나온다. 열 있는 4~6두를 고르고 중증은 피한다(Bovine Medicine).</span><span class="hang">좁은 부위만 세척되어 국소 병변을 놓칠 수 있다. 이상 소견은 진단적이나 정상 결과가 병변을 배제하지 못한다. M. bovis는 BAL과 부검 조직 배양 일치도가 높다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>세척액 세포학 해석<table class="bxt"><tr><th>대상</th><th class="c">호중구 %</th><th class="c">대식세포 %</th><th class="c">호산구 %</th></tr><tr><td>정상 송아지(2~3개월)</td><td class="c">12±10</td><td class="c">86±10</td><td class="c">0</td></tr><tr><td>폐충 폐렴 송아지</td><td class="c">20±20</td><td class="c">20±10</td><td class="c">70±10</td></tr><tr><td>건강우(6~10개월)</td><td class="c">&lt;5</td><td class="c">80~85</td><td class="c">-</td></tr></table><span class="hang">감염성·비감염성 염증 모두 호중구 비율이 높아진다. 세균성 폐렴은 호중구 우세에 급성기 세포 내 그람음성 간균이 보인다(Rebhun). 호산구는 비정상이며 폐충 이행을 시사한다. 헤모시데린 탐식 대식세포는 과거 폐출혈의 증거다.</span><span class="hang">농부폐는 림프구성, 지질 폐렴은 oil red O 염색 지질이 특징이다. 곰팡이가 보이면 진균성 폐렴보다 오염인 경우가 흔하다. BAL을 2시간 만에 반복하면 호중구 반응이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>흉강천자와 혈액 검사<span class="hang">하부 5~6번 늑간에서 초음파 유도로 한다. 피막 농양에는 8.75 cm, 18 G 바늘이 좋다(Rebhun). 감염성 흉막염 흉수는 백혈구 40,000~100,000/µL, 단백질 최대 50 g/L이며 호기·혐기 세균과 마이코플라즈마를 배양한다.</span><span class="hang">쌍혈청은 약 3주 간격으로 환축과 정상우 6두 정도에서 채취하며 혈장이 아닌 혈청을 쓴다. 급성기단백(합토글로빈, SAA)은 개체 변이가 커서 직장체온보다 낫지 않고, 백혈구 수는 예측력이 낮다.</span><span class="hang">동맥혈 PaO2가 1 mmHg 떨어질 때마다 병든 폐 비율이 0.6~0.8% 늘어난다(실험적 BRSV). 이개동맥·미동맥에서 채혈한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">11.</span><span>소 호흡기 질병 복합(BRD) — 정의와 원인체<span class="hang">비염, 인후두염, 기관염, 기관지염, 흉막염, 폐렴을 통칭하며 단일 원인이 아니어서 BRD 증후군이라 한다. 호흡곤란, 기침, 콧물, 침울, 40~41℃ 발열, 폐렴 청진 소견을 보이고 예기치 않은 폐사가 첫 신호일 수 있다. 이환율은 10~50%다.</span><span class="hang">북미 비육장 입식우의 평균 16% 이상이 걸리며 비육장 이환의 65~79%, 폐사의 44~72%를 차지한다.</span><span class="hang">바이러스: BHV-1, BRSV, PI-3, BVDV, 코로나바이러스, 아데노바이러스. 세균: M. haemolytica, P. multocida, H. somni. 마이코플라즈마: M. bovis, M. dispar, M. bovirhinis, Ureaplasma. 기생충: D. viviparus. 원인 불명: 비정형 간질성 폐렴. 이차균: T. pyogenes.</span><span class="hang">이들은 정상 소에도 널리 있으므로 스트레스로 인한 면역저하가 기회감염을 허용한다는 것이 기본 개념이다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>BRD — 바이러스·세균 상승작용<span class="hang">PI-3나 BHV-1 감염 후 M. haemolytica를 접종하면 단독 감염보다 훨씬 심한 병이 된다. 호중구 기능·동원 장애, 대식세포 활성 저하, 림프구 변화 등 여러 기전이 작용한다.</span><span class="hang">PI-3 후 7일째 세균 접종 시 폐 청소 방해가 가장 크고 3일째는 거의 없다. BHV-1과 M. haemolytica 상호작용은 최대 30일 지속된다.</span><span class="hang">이유 스트레스가 BHV-1 일차감염과 겹치면 세균 감염 폐사율이 크게 오른다. 수송 직전 이유한 송아지는 45일 적응시킨 송아지보다 BRD가 많았다. 다만 파스튜렐라 폐렴은 바이러스 선행 없이도 재현된다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>BRD — 스트레스와 위험요인<span class="hang">경매시장 구입, 여러 출처 혼합, 수송, 이유, 처치(거세·제각·주사), 밀사, 급격한 기온·습도 변화, 추위와 습기, 먼지, 사료·물 박탈, 환기 불량. 젖소 송아지는 환기 불량과 구입우 도입, 초유 수동면역 실패가 가장 중요하다.</span><span class="hang">캐나다 비육장에서 치명적 섬유소성 폐렴은 입식 약 16일째 최고였고, 경매장 혼합이 많을수록 위험했으나 수송 거리는 관련이 없었다.</span><span class="hang">한우: 생후 2~3개월(초유 면역 소실)과 구입 후 1~2주째, 겨울과 환절기, 10℃ 이상 일교차에서 많다. 5월 초~6월 말에 많고 영하 10℃ 이하에서 발생률이 가장 높으며 13개월 이후 줄어든다. 육우가 젖소보다 호흡기 성숙이 늦어 위험이 높다는 기술이 있다(한국 자료).</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>BRD — 발생 4단계(한국 자료)<table class="bxt"><tr><th>단계</th><th>진행</th><th class="c">발생률 %</th><th class="c">사망률 %</th></tr><tr><td>1</td><td>스트레스 호르몬 증가, 백혈구 탐식기능 마비</td><td class="c">40</td><td class="c">5</td></tr><tr><td>2</td><td>인후두부 바이러스 일차 증식</td><td class="c">30</td><td class="c">20</td></tr><tr><td>3</td><td>바이러스 전신 이행, 조직 파괴, 고열, M. haemolytica 급증식</td><td class="c">20</td><td class="c">55</td></tr><tr><td>4</td><td>상재세균 급증식, 폐렴</td><td class="c">10</td><td class="c">20</td></tr></table><span class="hang">한 단계라도 없으면 발병하지 않는다는 개념으로, 1단계 스트레스 제거, 2·3단계 바이러스·세균 백신, 4단계 조기 발견과 즉시 치료로 대응한다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>수송열(shipping fever)<span class="hang">갓 이유되어 입식한 육우 송아지의 급성 독혈성 기관지폐렴으로 주원인은 M. haemolytica다. 미국 비육장 평균 발생률 16.2%, 폐사율 약 4%다.</span><span class="hang">입식 7~10일에 집단 발생하나 입식 시 이미 앓기도 한다. 최고는 3주 이내이고 치명 사례의 75%가 입식 2주 안에 아팠다. 단일 목장 출신 무리는 이환 5% 미만으로 짧게 끝나지만 경매 혼합우는 수주 지속된다. 며칠마다 새 소를 채워 넣으면 길어진다.</span><span class="hang">한우: 스트레스 후 3~14일에 1~3두로 시작해 무리에 퍼진다(한우송아지질병관리핸드북).</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>BRD — 조기 발견<span class="hang">육안 관찰은 민감도 0.62, 특이도 0.63이다. 도축 시 폐 병변우의 68%가 치료 기록이 없었다. 발생 무리를 보정틀로 통과시키면 겉보기 정상우의 20% 이상이 40~41℃ 발열만 있고 치료에 잘 반응한다.</span><span class="hang">반추위 온도 볼루스 연구에서 열 에피소드의 74%는 증상이 없었고 75%는 48시간 미만이었다. 열이 하루 지속될 때마다 일당증체가 약 33 g 줄었다.</span><span class="hang">한우 현장: 이른 새벽 사료 섭취 때나 포유 전 콧물·기침을 보고, 낮에 운동장에서 강제 운동 후 기침을 확인한다. 무리 전체를 움직이게 해서 침울한 소를 찾는다.</span><span class="hang">젖소 송아지는 위스콘신 점수표(체온, 콧물, 기침, 눈물, 귀 위치 각 0~3점, 2개 항목 이상 이상이면 치료)를 쓴다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>BRD — 증상 점수 판정표(한국 자료)<table class="bxt"><tr><th>항목</th><th class="c">0점</th><th class="c">1점</th><th class="c">2점</th></tr><tr><td>체온 송아지/성우</td><td class="c">39.5 미만/38.9 이하</td><td class="c">39.5~39.9/39~39.9</td><td class="c">40.0℃ 이상</td></tr><tr><td>호흡수(회/분)</td><td class="c">49 이하</td><td class="c">50~79</td><td class="c">80 이상</td></tr><tr><td>맥박수(회/분)</td><td class="c">89 이하</td><td class="c">90~119</td><td class="c">120 이상</td></tr><tr><td>식욕</td><td class="c">정상</td><td class="c">약간 감퇴</td><td class="c">없음</td></tr><tr><td>기침</td><td class="c">없음</td><td class="c">움직이면</td><td class="c">가만있어도</td></tr><tr><td>콧물</td><td class="c">없음</td><td class="c">맑은 콧물</td><td class="c">고름 모양</td></tr><tr><td>수포음</td><td class="c">없음</td><td class="c">약간</td><td class="c">심함</td></tr></table><span class="hang">합계 10점 이상 A(만성, 치료 불가), 6~9점 B(급성, 치료 곤란), 5점 이하 C(초기 또는 회복, 치료 가능)다.</span><span class="hang">진행: 초기 짧은 마른기침, 누관 폐쇄로 인한 눈물, 39.3~42℃ 발열 → 중기 결막 충혈·눈곱·누런 콧물 → 말기 폐조직 괴사, 농포, 흉막 유착, 개구호흡과 거품 침 후 폐사.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>BRD — 감별 요점<table class="bxt"><tr><th>질병</th><th>역학·소견</th></tr><tr><td>파스튜렐라 폐렴</td><td>이유·수송 어린 소, 독혈성, 배쪽 호흡음 증가·습성 수포음, 초기 치료 반응 좋음</td></tr><tr><td>바이러스성 간질성 폐렴</td><td>이환 높고 폐사 낮음, 독혈증 경미, 천명음, 3~5일 회복</td></tr><tr><td>H. somni</td><td>비육장 6~8개월, 화농성 흉막폐렴·심근염 급사, 반응 불량</td></tr><tr><td>IBR</td><td>미접종 무리, 비강 병변, 폭발적 기침, 고열, 독혈증 없음</td></tr><tr><td>M. bovis</td><td>만성 폐렴, 관절염, 중이염, 항생제 무반응</td></tr><tr><td>AIP</td><td>성우가 무성한 가을 목초지로 이동 4~10일, 급사, 신음, 피하기종</td></tr><tr><td>폐충증</td><td>첫 방목, 등쪽 수포음, 호산구증가, 구충제 반응</td></tr><tr><td>후대정맥혈전증</td><td>단일 성우, 객혈·비출혈, 빈혈, 무반응</td></tr></table><span class="hang">침울·식욕부진(독혈증)은 세균성 폐렴의 지표다. 기관지성 폐렴은 조기 치료 반응이 좋고, 간질성은 반응이 느리거나 없으며, 혈행성(혈전증)은 객혈과 무반응이 특징이다.</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>BRD — 부검과 시료<span class="hang">가장 흔한 소견은 전엽과 중·후엽 배쪽의 암적색 경화(섬유소성 기관지폐렴), 섬유소성 흉막염, 폐농양이다. 만성은 응고괴사, 피막 농양, 질긴 유착을 보인다. 바이러스성은 폐가 크고 무너지지 않는 미만성 간질성 폐렴과 후엽 폐기종이다.</span><span class="hang">대표적이고 초기이며 치료하지 않은 개체를 골라 폐(병변·정상 경계)와 기관기관지 림프절을 신선·포르말린으로 나눈다. 비인두 분리주와 폐 분리주의 감수성은 다를 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">20.</span><span>BRD 치료 — 원칙<span class="hang">농장을 방문해 진단하고 투약 지시와 휴약을 명확히 하며 치료우를 표시·기록한다. 발견 즉시 치료한다. 실험 감염 후 치료를 48시간 늦추면 경과가 길어지고 폐사가 늘었다.</span><span class="hang">독혈증이 있으면 세균성 폐렴으로 보고 처음에는 주사로 준다. 사료·물 투여는 식욕부진 개체에서 과소투여가 된다.</span><span class="hang">한국 치료 3원칙: 전문가와 상의해 약을 고르고, 발견 즉시 시작하며, 최소 3일 계속하고 증상 소실 후 2일 더 치료한다. 늦으면 병변이 굳어 혈류가 막혀 항생제가 도달하지 못한다. 경구 항생제는 반추위 미생물을 해치므로 쓰지 않고 여러 항생제를 동시에 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>BRD 항생제 용량(Constable)<table class="bxt"><tr><th>약물</th><th>용량·경로</th></tr><tr><td>툴라트로마이신</td><td>2.5 mg/kg SC 1회</td></tr><tr><td>플로르페니콜</td><td>20 mg/kg IM 48시간 간격, 또는 40 mg/kg SC 1회</td></tr><tr><td>틸미코신</td><td>10 mg/kg SC 1회(Rebhun 10~20 mg/kg)</td></tr><tr><td>가미스로마이신</td><td>6 mg/kg SC 1회</td></tr><tr><td>엔로플록사신*</td><td>2.5~5.0 mg/kg 24시간 3일, 또는 7.5~12.5 mg/kg 1회</td></tr><tr><td>다노플록사신*</td><td>6 mg/kg SC 48시간, 또는 8 mg/kg SC 1회</td></tr><tr><td>세프티오퍼 결정형 유리산*</td><td>6.6 mg/kg 귀 뒷면 SC 1회</td></tr><tr><td>세프티오퍼 염산염·나트륨*</td><td>1.1~2.2 mg/kg 24시간 3일</td></tr><tr><td>세프퀴놈*</td><td>1 mg/kg IM 24시간 3~5일</td></tr><tr><td>옥시테트라사이클린</td><td>10 mg/kg IM 24시간 4일</td></tr><tr><td>트리메토프림+설파독신</td><td>2.66 + 13.33 mg/kg IM 24시간 3일</td></tr></table><span class="hang">* 매우 중요한 항생제로 1차 선택을 권하지 않는다(OIE: 증상 없는 사료·물 예방투여 금지, 2차 치료는 세균 검사 근거로).</span><span class="hang">메타분석 효과 순위는 툴라트로마이신, 엔로플록사신, 다노플록사신, 플로르페니콜이었다. 옥시테트라사이클린, TMP-설파, 귀 기저부 세프티오퍼는 낮았고 옥시테트라사이클린 재치료 위험은 64~77%였다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>항생제 휴약(미국 표시 기준, Large Animal IM)<table class="bxt"><tr><th>약물(용량)</th><th class="c">도축/우유</th></tr><tr><td>세프티오퍼 결정형 유리산(6.6 mg/kg 귀 SC)</td><td class="c">13일/0일</td></tr><tr><td>다노플록사신(8 mg/kg 1회, 6 mg/kg 2회)</td><td class="c">4일/불허</td></tr><tr><td>엔로플록사신(1회 또는 3일 요법)</td><td class="c">28일/불허</td></tr><tr><td>플로르페니콜 20 mg/kg IM 48시간</td><td class="c">28일/불허</td></tr><tr><td>플로르페니콜 40 mg/kg SC 1회</td><td class="c">38일/불허</td></tr><tr><td>가미스로마이신 6 mg/kg</td><td class="c">35일/불허</td></tr><tr><td>옥시테트라사이클린 LA 20 mg/kg</td><td class="c">28일/96시간</td></tr><tr><td>틸디피로신 4 mg/kg</td><td class="c">21일/불허</td></tr><tr><td>틸미코신 10~15 mg/kg</td><td class="c">42일/불허</td></tr><tr><td>툴라트로마이신 2.5 mg/kg</td><td class="c">18일/불허</td></tr><tr><td>암피실린 4.4~11 mg/kg 24시간</td><td class="c">6일/48시간</td></tr><tr><td>세프티오퍼 나트륨 1.1~2.2 mg/kg</td><td class="c">4일/0일</td></tr><tr><td>세프티오퍼 염산염 1.1~2.2 mg/kg</td><td class="c">3일/0일</td></tr><tr><td>타일로신 17.6 mg/kg IM</td><td class="c">21일/불허</td></tr></table><span class="hang">제품·국가마다 다르므로 국내 허가 휴약을 따른다. 틸미코신은 염소에 독성이 있다. 미국에서 엔로플록사신은 20개월 미만 소에만, 플루닉신 단독 주사는 비유우에 정맥으로만 허용된다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>치료 반응 평가와 실패 원인<span class="hang">12~24시간 안에 체온이 떨어지고 외양·식욕이 좋아져야 한다. 1.1℃ 이상 하강을 개선으로 보며 48~72시간에 정상으로 돌아온다. 최소 3일, 흔히 5~7일 연속 치료가 재발을 줄인다(Rebhun). 적시 치료 시 85~90%가 24시간 안에 회복한다.</span><span class="hang">항생제 효과 판정은 48시간 안에 하며 NSAID 병용은 판정을 어렵게 한다.</span><span class="hang">실패 원인: 치료 지연에 의한 폐농양·기관지확장증·흉막염, 바이러스성·간질성 폐렴, 용량·기간 부족, 내성. 반응이 없으면 바이러스·마이코플라즈마 동반, 미교정 환경, 폐충을 의심한다. M. haemolytica는 다제내성이 흔하고 혈청형 A6가 A1·A2보다 내성률이 높다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>소염제<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>플루닉신 메글루민</td><td>2.2 mg/kg IV 1회(Constable), 0.5~1.1 mg/kg(Rebhun)</td></tr><tr><td>케토프로펜</td><td>3 mg/kg IM 24시간 2~3일</td></tr><tr><td>카프로펜</td><td>1.4 mg/kg IV·SC 1회</td></tr><tr><td>멜록시캄</td><td>0.5 mg/kg SC·IV 1회</td></tr><tr><td>톨페남산</td><td>2 mg/kg 24~48시간, 또는 4 mg/kg 1회</td></tr><tr><td>아스피린</td><td>성우 240~480그레인 경구 1일 2회</td></tr></table><span class="hang">심한 BRD에서 항생제와 병용하면 해열과 섭식 회복이 빠르다. 장기 효과는 일정하지 않다. Rebhun 저자들은 위장 부작용 우려로 1~3일만 쓰며, 장기·과량은 탈수 소에서 제4위 궤양과 신독성 위험이 있다.</span><span class="hang">스테로이드는 실험·임상 결과가 대부분 불리하다. 쓴다면 덱사메타손 10~20 mg 성우 1회만, 임신우는 금기다. 해열 효과로 효과 없는 항생제를 효과 있다고 착각할 수 있다. 한국 자료는 만성 호흡기질환에 NSAID를 항생제와 병용하되 해열제와 중복하지 말라고 한다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>보조 요법과 집단 치료<span class="hang">아트로핀 2.2 mg/45 kg IM·SC 1일 2회(분비 감소, 약한 기관지 확장), 아미노필린 5 mg/kg IV 60분 1일 2회 또는 10 mg/kg 24시간 지속주입(호흡곤란 송아지), 트리펠렌나민 1 mg/kg(근거 없음)이 쓰인다(Rebhun). 베타2 작용제는 식품동물에 대부분 금지다.</span><span class="hang">수액은 폐부종을 악화시키지 않게 조절하고, 환기 나쁜 따뜻한 우사보다 차가운 신선한 공기가 낫다.</span><span class="hang">한국 자료: 포도당은 등장액이 폐수종을 일으킬 수 있어 10~50% 고장액을 쓰고 비타민 B·C, 아미노산, 진해거담제를 함께 쓴다. 기침만 남고 식욕·체온이 정상이며 콧물이 없으면 치료를 중단한다.</span><span class="hang">집단 치료: 새 환축이 하루 5~10%씩 나오면 동거우 전체에 지속성 항생제를 준다(Constable). 한국 자료는 눈물·콧물 개체가 있으면 동거우 전두를 3일 동시 치료하고, 39.5℃ 이상 개체는 해열제와 항생제로 3일 치료하며, 무리 1/3 이상 발병 시 전두를 치료하라고 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">26.</span><span>메타필락시스<span class="hang">초기 환축 식별이 어려워 고위험군 전체를 미리 치료한다. 북미 메타분석에서 입식 시 투여는 폐사 2%, 이환 26%를 줄이고 일당증체를 0.11 kg 높였다(Bovine Medicine).</span><span class="hang">효과 입증: 틸미코신 10 mg/kg SC, 플로르페니콜 40 mg/kg SC, 가미스로마이신 6 mg/kg SC, 툴라트로마이신 2.5 mg/kg SC, 세프티오퍼 결정형 유리산 6.6 mg/kg 귀 SC. 장기작용 옥시테트라사이클린 20 mg/kg은 결과가 일정하지 않고 틸미코신보다 이환율이 높았다.</span><span class="hang">고위험군은 급이유, 미접종, 혼합, 수송, 미적응 송아지이며 위험이 가장 큰 첫 3주를 덮어야 한다. 젖소 이유 송아지를 군사로 옮길 때 장기작용 항생제 1회나 클로르테트라사이클린·설파메타진 사료 5~7일을 쓴다(Rebhun).</span><span class="hang">사료·음수 투약은 아픈 소의 섭취 감소로 치료 농도에 못 미친다. 클로르테트라사이클린·설파메타진은 첫 24시간 150 mg/kg, 이후 75 mg/kg로 5~10일이 표준 권장량이다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>BRD 예방 — 사양관리<span class="hang">사전 적응: 이유 전 백신과 거세·제각 등을 분산하고 수송 최소 2주 전 이유한다. 이유 2주 전부터 같은 방목장에서 건초와 물을 준다. 이유우는 하루 2회 이상 관찰하고 잘 먹을 때까지 장거리 수송하지 않는다.</span><span class="hang">수송 중 사료·물 박탈은 24~30시간 이내, 장거리면 24시간마다 8~12시간 쉬게 한다. 입식 후 2~3주는 농후사료 50~75%와 양질 건초 TMR(Constable), 30~45일 컨디셔닝과 입식 4~6주 전 백신(Bovine Medicine)이 권장된다.</span><span class="hang">한우 입식우: 첫날 농후사료를 주지 않고 다음 날부터 체중 2%의 1/5씩 늘리며 조사료와 물은 첫날부터 자유급여한다. 구입우는 2~3주 격리한다.</span><span class="hang">환경 기준(한국): 환기 겨울 4회, 여름 15회 이상, 습도 송아지 60%(성우 70%), 주 1회 이상 소독, 육성우 3.3 m2/두, 비육우 6.6 m2/두. 적온은 송아지 13~25℃, 육성우·번식우 0~20℃ 내외다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>BRD 백신 — 근거<span class="hang">항체는 생기나 방어와 늘 일치하지 않고 야외 효능 근거가 빈약하다. 면역 형성에 2~3주가 걸리고 여러 번 접종이 필요할 수 있다.</span><span class="hang">파스튜렐라 백신 메타분석 위험비 0.93(0.89~0.98)으로 효과는 작다. 류코톡신 항체는 추가접종 14일 후 최고라 2회 접종이 필요하다. 사균 파스튜렐라 백신은 효과가 없거나 이환율을 높였다는 보고가 있다.</span><span class="hang">입식 직후 생바이러스 백신은 폐사 증가와 관련되어 금기에 가깝다. 바이러스 백신은 이유 2~3주 전, 출하 2주 전에 접종한다. H. somni 백신은 근거가 부족하다.</span><span class="hang">분만 6·3주 전 젖소 류코톡신 백신은 초유 항체를 높이고, 분만 4주 전 육우 접종은 2개월 미만, 3·4개월령 송아지 접종은 6개월까지 방어에 도움이 될 수 있다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>호흡기 백신 프로그램(한국 자료)<span class="hang">바이러스 혼합백신(IBR, BVD, PI-3, BRSV, 헤모필루스): 송아지는 생후 30일령(30~40일령) 1차, 3~4주 후 2차, 이후 6개월(국산) 또는 1년(수입품) 간격 보강. 구입우는 구입 즉시 1차, 1개월 후 2차. 어미소는 3~4주 간격 2회, 수정 1개월과 임신 말기 1개월은 피한다.</span><span class="hang">세균 백신(만헤이미아, 만헤이미아+파스튜렐라): 구입우는 도착 다음 날 1회 2 mL 근육주사, 송아지는 이유·수송 14일 전(또는 이유 10일 전) 1회.</span><span class="hang">입식 14일 전까지 2차를 마치고 이동하는 것이 가장 좋다. 미접종 입식우는 도착 다음 날부터 1개월 간격 2회 접종한다. 송아지 호흡기 질환은 주로 생후 2개월 이후에 생긴다.</span><span class="hang">Rebhun은 모체항체가 줄어드는 3개월령 전후 1차, 2~4주 후 2차를 권하며 IBR·BVD는 사백신 2회 후 생백신 보강이 반응이 가장 좋았다고 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">30.</span><span>만헤이미아(Mannheimia haemolytica) 폐렴 — 원인과 기전<span class="hang">이유 송아지의 가장 중요한 세균이다. 12개 혈청형 중 A2는 비인두 상재균이고 A1과 최근 A6가 질병과 관련된다. 스트레스와 바이러스 감염으로 A1이 폭발적으로 증식·집락해 폐로 흡입된다. 한국 자료는 출생 직후 어미소에게서 옮아 인후두에 상재한다고 한다.</span><span class="hang">Rebhun은 바이러스 도움 없이도 치명적 폐렴을 일으키는 일차 병원체로 보며, 바이러스 감염 무리에 겹치면 폐사율 30~50%에 이를 수 있다. 코르티코스테로이드(이유, 수송, 무리 재편)는 기도 항균 펩타이드 생성을 억제한다.</span><span class="hang">주요 인자는 섬모, 협막, 내독소, 류코톡신(LKT)이다. LKT는 반추류 백혈구와 혈소판에만 작용하는 구멍형성 독소로, 파괴된 호중구가 단백분해효소와 산화물을 내어 폐포벽 괴사, 폐부종, 섬유소성 폐렴과 흉막 유착을 만든다.</span><span class="hang">혈청 LKT 중화항체가는 실험 감염 저항성과 직접 상관한다. 사균 백신은 주로 표면항원 항체만 만든다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>만헤이미아 — 임상증상<span class="hang">6개월~2세에 흔하나 모든 연령이 걸린다. 젖소 무리는 도입우, 공동방목·전시회 귀가 후에 발생하며 분만 직후 성우의 심급성 흉막폐렴 발생도 있다.</span><span class="hang">40~41℃ 발열, 침울, 빠르고 얕은 호흡, 약한 기침, 홀쭉한 복부, 점액농성 콧물, 반추위 무력. 초기에는 전복측 호흡음이 커지고 진행하면 수포음, 며칠 후 천명음이 들린다. 마찰음이 없어도 유착 흉막염을 배제할 수 없다.</span><span class="hang">Rebhun: 대개 40.0~41.7℃(최대 42.2℃)이고 배쪽 경화음이 P. multocida보다 훨씬 흔하다. 중증은 등쪽 폐가 과부하로 조용해지고 피하기종, 호기성 신음, 늑간 압통이 있다.</span><span class="hang">경과는 2~4일로 조기 치료 시 24~48시간에 회복하나 늦으면 죽거나 만성화한다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>만헤이미아 — 급속 경화형과 증식성 폐렴(Rebhun)<span class="hang">급속 경화형: 41.1~42.2℃, 침흘림, 호흡 60~120회/분, 식욕·유량 소실과 함께 수포음 없이 배쪽 25~75% 경화를 뜻하는 기관지음만 들린다. 섬유소성 흉막염 통증과 반추위 정지로 창상성 복막염이나 제4위 궤양 천공으로 오진하기 쉽다. 12~48시간에 죽고 모든 허가 항생제 내성 분리주도 있었다. 전신마취 1~2일 후 입원 송아지에서도 보인다.</span><span class="hang">증식성 폐렴: 파스튜렐라·만헤이미아 폐렴 회복 2~4주 후 한 마리가 갑자기 미열, 개구호흡, 전체적으로 조용한 폐를 보인다. 아트로핀 2.2 mg/45 kg 1일 2회, 푸로세미드 25 mg/45 kg 1일 1~2회, 광범위 항생제, 환기 좋은 곳의 안정으로 치료하며 7~10일에 서서히 회복한다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>만헤이미아 — 진단과 병리<span class="hang">치료 전 급성 개체의 기관 세척액·BAL 또는 부검 폐·림프절 배양으로 확진한다. 유행 시 바이러스, H. somni, 마이코플라즈마 검사와 급성기 혈청도 확보한다. 혈액은 좌방이동 호중구감소가 흔하고 섬유소원이 높다(Rebhun).</span><span class="hang">초음파에서 다량 흉수와 섬유소성 흉막폐렴이 고열 급성 사례에 보이면 M. haemolytica를 강하게 의심한다.</span><span class="hang">부검: 전복측 1/3 이상 경화, 섬유소성 흉막염, 적·백·회색 얼룩 절단면. 다발성 응고괴사가 가장 특징적이다. 병변 연령은 2~3일 연한 회자색, 6일 단단한 결절, 9~10일 섬유 피막이다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>만헤이미아 — 치료와 예방 요점<span class="hang">시료 채취 후 즉시 광범위 항생제를 시작한다. 미국 비육장 1차 치료제는 툴라트로마이신(66.3%), 플루오로퀴놀론(43.1%), 플로르페니콜·3세대 세팔로스포린(각 34.8%), 테트라사이클린(28.1%) 순이었다.</span><span class="hang">24~72시간 안에 좋아지면 예후가 좋고, 72시간을 넘기면 만성 폐 손상과 농양 위험이 크다(Rebhun).</span><span class="hang">예방은 관리 개선, 사전 적응, 메타필락시스, 백신의 조합이다. 류코톡신 백신은 이환·폐사를 줄였다는 기술(Rebhun)과 야외 시험에서 큰 이점이 없었다는 기술(Constable)이 함께 있다. 한국 자료: 새 개체 입식 후 약 6~10일에 발현한다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>파스튜렐라 멀토시다(Pasteurella multocida) 폐렴<span class="hang">A3(일부 D3)형이 하부기도 감염의 주병원체이고 B·E형은 출혈성 패혈증 원인이다. 상재균으로 하부기도 방어가 손상될 때 들어가며 어린 포유 송아지 폐렴의 주원인이다. 최근 P. multocida 단독 수송열이 늘었다.</span><span class="hang">암모니아에 의한 점액섬모 손상이 대표적 소인이고 단독 폐렴은 대개 관리 문제다. 단일 개체면 구입, 분만, BVDV 지속감염 등 그 개체의 스트레스를 찾는다.</span><span class="hang">39.7~40.8℃ 발열, 습성 기침, 양측 전복측 수포음이 전형적이고 등쪽은 정상이다. 무리의 10~50%가 걸리며 M. haemolytica보다 이환·폐사가 적다. 병리는 섬유소가 적고 다발성 응고괴사 없는 섬유소화농성 기관지폐렴이며, 만성은 기관지확장증과 농양을 보인다.</span><span class="hang">분리주는 페니실린 등에 감수성이 흔하나 마이코플라즈마 동반이 늘어 마크로라이드, 엔로플록사신, 플로르페니콜이 경험적 1차 선택이 되었다. 반응이 없으면 다른 병원체, 미교정 환경, 폐충을 의심한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">36.</span><span>히스토필루스 솜니(Histophilus somni) — 원인과 역학<span class="hang">패혈증, 혈전성 수막뇌염(TME), 흉막폐렴, 심근염, 다발성 활막염, 중이염, 번식장애를 일으킨다. 정상 수소의 50% 이상, 암소의 8~10%가 생식기에 보균한다.</span><span class="hang">지금은 TME보다 흉막염, 폐렴, 심근염이 흔하다. 비육장 6~12개월령에서 많고 폐렴 폐사는 입식 첫 5주, 심근염·흉막염·TME는 3주 이후에 주로 생긴다. 치명적 발병 중앙값은 폐렴 12일, 심근염·흉막염 22일이다(Constable).</span><span class="hang">한국 자료는 이유 송아지(6~8개월)가 수송 후 1~2일 만에 발생하고 파스튜렐라보다 빨리 퍼지나 치사율은 낮다고 적는다. 혈관염과 혈전이 병리의 중심이다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>히스토필루스 솜니 — 증상·진단·치료<span class="hang">호흡기형은 특징이 없고 비육장 흉막염 소 대부분은 치료받지 못하고 죽는다. 최근 BRD 치료에 실패한 소에서 의심한다. 젖소에서는 P. multocida나 경~중등도 M. haemolytica와 구별되지 않으며 39.7~41.4℃, 호흡 40~80회/분, 최대 50%에서 배쪽 경화음을 보인다(Rebhun).</span><span class="hang">후두염은 심한 호흡곤란과 코골이음, 심근염형은 급사하거나 발열 치료 10~14일 후 죽는다. 폐렴 발생 중 신경증상 개체가 나오면 강하게 의심하며 신경형은 4개월령 이상에서만 생긴다. 망막 출혈이 진단에 도움이 된다.</span><span class="hang">배양 민감도가 낮고 비인두보다 BAL에서 잘 분리된다. 표준 항생제 무반응이 특징이다.</span><span class="hang">옥시테트라사이클린 20 mg/kg IV 24시간 최소 3일, 플로르페니콜 20 mg/kg IM 48시간(Constable). 암피실린 11~22 mg/kg 1일 2회 3~7일도 쓰였으나 마이코플라즈마 가능성 때문에 마크로라이드, 엔로플록사신, 플로르페니콜이 선호된다. 체온 추이로 판정하도록 NSAID를 피하라는 견해가 있다(Rebhun).</span><span class="hang">TME는 기립불능 전 치료 시 6~12시간에 회복하나 누우면 대개 죽는다. 지속성 옥시테트라사이클린 집단투여는 히스토필루스 폐사를 줄이지 못했으나 BRD 이환·폐사는 14%, 71% 줄였다. 백신은 2~3주 간격 2회이며 효능은 불확실하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>마이코플라즈마 보비스(Mycoplasma bovis) — 원인과 역학<span class="hang">세포벽 없는 세균으로 폐렴, 중이염, 관절염, 각결막염, 유방염, 유산을 일으키며 비육우 만성 폐렴·다발성 관절염 증후군(CPPS)의 원인이다. BRSV, 코로나바이러스와 함께 송아지 폐렴 3대 원인이다.</span><span class="hang">비육장 입식 시 7% 미만이던 감염이 수주에 40~100%로 오른다. CPPS 이환율 20~85%, 치명률 3~50%다. 만성 항생제 내성 폐렴 폐의 90% 이상에 M. bovis, 60%에 BVDV가 있었다.</span><span class="hang">직접 접촉과 에어로졸로 퍼지고 정상우가 수개월~수년 배출한다. 감염 유방염우의 초유·폐유 급여는 구강·상부기도 집락과 중이염을 일으키는 효과적 전파 경로다. 기온 급락이 배출과 발병을 늘린다.</span><span class="hang">변이표면단백 항원변이, 림프구 자멸사, 호중구 산화폭발 차단, 생물막, 폐 상피 침투로 전신 감염을 일으킨다. 항체는 방어적이지 않다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>마이코플라즈마 보비스 — 임상형<span class="hang">CPPS: 입식 수주 내, 항생제에 반응 없던 호흡기병 병력, 큰 기관지음·수포음·천명음과 소리 없는 부위가 섞이고 진행성 체중감소를 보인다. 어린 송아지는 갑작스러운 심한 호흡곤란과 치료에도 빠른 악화를 보인다.</span><span class="hang">순수 마이코플라즈마 폐렴은 움직일 때 기침, 호흡 40~60회/분, 39.7~40.6℃로 경미하며 대부분 잘 먹는다(Rebhun). 대개 다른 병원체와 함께 분리된다.</span><span class="hang">관절염: 비체중부하 파행, 큰 관절 종창과 건초 팽대(섬유소성 활막염). 중증은 누공과 도태로 간다.</span><span class="hang">중이염·내이염: 2~6주령에 흔하고 이환율 3~10%, 치명률 약 50%다. 머리 흔들기, 한쪽 머리기울기, 같은 쪽 귀·눈꺼풀·입술 마비, 외이 화농, 연하곤란과 젖 역류를 보인다. 젖소 이유 전 송아지는 폐렴+중이염이, 이유 후 육성우는 관절염형이 더 흔하다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>마이코플라즈마 보비스 — 진단<span class="hang">배양(폐, 비강 스왑, BAL, TTW, 활액), PCR, 항원 검출(샌드위치 ELISA, 면역조직화학)을 쓴다. 배양은 민감도가 낮고 PCR이 빠르고 널리 쓰인다. 시료는 24시간 이내 운송이면 냉장, 아니면 냉동하되 7~10일을 넘기지 않는다.</span><span class="hang">ELISA 항체는 감염 6~10일 후 나오지만 임상과 상관이 낮고 수개월~수년 남는다. 모체항체 반감기는 12~16일이다. 무리 선별용이다.</span><span class="hang">부검: 전복측 경화 안의 경계 뚜렷한 흰 건락괴사 병소(1~10 mm, 융합 시 최대 5 cm)가 특징이고 짜면 덩어리로 빠진다. 섬유소성 다발성 활막염과 중이 삼출물도 보인다. 한국 자료는 소엽성 폐기종과 무기폐가 섞인 대리석 모양을 기술한다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>마이코플라즈마 보비스 — 치료와 방제<span class="hang">반응은 기껏해야 보통이고 관절염은 특히 나쁘다. 건락 조직 내 약물 분포 제한과 생물막으로 체외 감수성과 다르다. 베타락탐과 설폰아미드에는 본래 내성이다.</span><span class="hang">Constable 용량: 툴라트로마이신 2.5 mg/kg SC 1회, 플로르페니콜 20 mg/kg IM 48시간, 틸미코신 10 mg/kg SC, 가미스로마이신 6 mg/kg SC, 엔로플록사신 2.5~5.0 mg/kg 24시간, 다노플록사신 6 mg/kg 48시간, 옥시테트라사이클린 10 mg/kg IM 24시간.</span><span class="hang">타일로신, 옥시테트라사이클린, 린코마이신, 스펙티노마이신은 최근 내성이 흔해 적절하지 않다는 기술(Constable)과, 한국 자료에서 이들을 틸미코신·플로르페니콜과 함께 드는 기술이 있다. Rebhun은 에리스로마이신 5.5 mg/kg 1일 2회를 대안으로 든다. 조기·장기 치료가 핵심이다.</span><span class="hang">방제: 폐쇄 우군과 신규우 검사·격리, 감염우 초유·우유 비급여나 저온살균(65℃ 1시간, M. bovis는 65℃ 2분·70℃ 1분에 불활화), 기구 소독, 연령별 분리, 충분한 초유. 이환·폐사가 높으면 메타필락시스가 정당화될 수 있다. 백신은 야외 효능 근거가 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">42.</span><span>소전염성비기관염(IBR) — 원인과 역학<span class="hang">BHV-1이 원인이다. 1.1은 호흡기형, 1.2a·1.2b는 생식기형(1.2a 유산), 1.3은 BHV-5로 개명된 뇌염형이다. 비강 분비물, 기침 비말, 생식기 분비물, 정액이 감염원이며 냉동정액에서 최대 1년 산다.</span><span class="hang">이환율·치명률은 젖소 약 8%·3%, 미접종 비육우 20~30%·대개 1% 이하이고 사망은 대부분 이차 세균 감염 때문이다. 신생 송아지 전신형은 치명률이 거의 100%다. 6개월령 이상에서 흔하다.</span><span class="hang">한국 자료: 보균우 입식 후 1주~수주에 집단 발병하고 감염률 5~10%, 폐사율 2~10%, 한냉기에 많다. 잠복기 2~3일(실험 3~7일, 비육장 입식 10~20일 후)이다.</span><span class="hang">일차 감염이나 약독화 백신 후 삼차신경절에 잠복하고 수송, 분만, 스테로이드, 다른 질병으로 재활성화된다. 상재 우군의 모든 소를 감염원으로 본다. 백신은 야외주 잠복을 막지 못한다. BHV-1은 M. haemolytica 류코톡신 결합을 늘린다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>IBR — 임상형<span class="hang">비기관염형: 갑작스러운 식욕부진, 큰 기침, 최대 42℃ 발열, 심한 비점막 충혈과 비중격의 회색 괴사 반점, 장액성 눈물·콧물, 침 증가, 유량 급감. 이차감염이 없으면 폐는 호흡음 증가뿐이고 기관염으로 흡기성 호흡곤란이 있다. 폐쇄성 세기관지염으로 급사하기도 한다.</span><span class="hang">젖소 무리는 수일에 회복하나 생산은 10~14일 회복되지 않고 수일~90일에 유산이 따른다. 비육우는 경과가 길고 콧물이 화농성으로 변한다.</span><span class="hang">결막형: 결막만 붉고 붓고 장액성 눈물을 흘리며 각막은 가장자리 부종 외에 정상이다. 궤양이 없어 Moraxella 각결막염과 구별된다.</span><span class="hang">신생 송아지(10일 미만) 전신형: 고열, 침흘림, 연구개 미란, 인두염, 후두 부종, 기관지폐렴, 혀 아래 괴사 반점. 6개월 미만은 뇌염을 보일 수 있다. 유산은 임신 6~8개월에 흔하며 한국 자료는 감염 후 2주~3개월에 2~20% 유산, 유산우의 약 50%가 후산정체를 보인다고 한다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>IBR — 진단과 치료<span class="hang">전형적 증상과 비강 반점으로 임상 진단하고 7일 이내 병변 긁은 물질의 형광항체, 바이러스 분리, PCR로 확진한다. 배출은 시작 중앙값 2일, 최고 4일, 종료 14일이다. 알긴산칼슘 면봉은 2시간 내 바이러스를 죽인다.</span><span class="hang">생백신 후 최대 14일까지 PCR 위양성이 있을 수 있어 접종력을 확인한다. 면역저하 개체의 비강 반점은 재활성화일 수 있어 일차 IBR로 진단하지 않으나 전염 위험은 있다(Rebhun).</span><span class="hang">부검: 성우 병변은 비강~큰 기관지에 국한되고 폐는 대개 정상이다. 신생 송아지는 식도·반추위의 우유 응고물 같은 괴사를 보인다.</span><span class="hang">이차 세균성 기관염·폐렴에 광범위 항생제를 주고 환축을 격리한다. 기관염은 특히 어려워 여러 날 매일 치료한다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>IBR — 백신<span class="hang">생백신은 빠르고 오래가며 국소 면역을 유도해 40~96시간에 방어가 생긴다. 비강 백신은 72시간 후 방어했고 발생 시 동거우 전체에 쓰기도 한다.</span><span class="hang">소 조직배양 유래 근육 생백신은 면역 없는 임신우에 유산을 일으키며, 비강·온도감수성 백신은 임신우에 안전하다. 생백신은 교배 14일 후 감염 시 불임을 일으킬 수 있다. 3일령 미만에 근육 BHV-1·PI-3 생백신을 주자 치명적 전신 감염이 생겼다.</span><span class="hang">사백신은 10~14일 간격 2회가 필요하고 2차 후 7~10일에 방어가 생긴다. gE 결손 표지(DIVA) 백신은 박멸 프로그램에 쓰고 모체항체가 있어도 효과가 있다.</span><span class="hang">권장: 육우 송아지는 이유 2~3주 전, 번식우는 교배 최소 2주 전, 비육우는 입식 최소 10일 전(아니면 입식 시 접종 후 7~10일 격리), 젖소 육성우는 교배 2~3주 전 접종한다. 메타분석에서 육우 송아지는 폐렴 위험이 절반 이하, 호흡기 폐사가 약 1/5이었으나 6개월 미만 젖소 송아지는 차이가 없었다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">46.</span><span>소 호흡기 합포체 바이러스(BRSV) — 원인과 기전<span class="hang">뉴모바이러스로 6개월 미만 송아지와 성 젖소에서 가장 중요한 바이러스성 원인이라 할 수 있다. 일차 감염의 90%가 송아지·육성우에서 생기고 3세 이상은 모두 항체 양성이며, 도입 없이도 매년 재감염이 반복된다. 한국은 1986년 70% 항체 분포가 확인되었다.</span><span class="hang">이환율 30~50% 이상, 치명률 대개 3~5%다. 면역은 짧고 재감염이 흔하다. 모체항체는 감염을 막지 못하나 3개월 미만에서 중증도와 반비례한다. 이유 2~3주 후 육우 송아지, 포유 송아지, 임신·분만 직후 성 젖소가 심하다.</span><span class="hang">섬모상피를 손상해 점액섬모 청소를 떨어뜨린다. 치명적 급성형은 며칠 전 경미한 병이 선행하는 경우가 많아 IgE 과민반응과 비만세포 탈과립이 관여하는 것으로 보며, 측부환기가 없는 소 폐 구조 때문에 간질성 폐기종이 생긴다.</span><span class="hang">3-메틸인돌과 상승작용을 하며, 포르말린 불활화 백신 후 공격 접종에서 오히려 병이 심해진 실험 보고가 있다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>BRSV — 임상증상<span class="hang">무리에 갑자기 퍼지는 급성 호흡기병으로 마른 기침, 심한 호흡곤란, 양측 콧물, 40~42℃ 발열, 유량 급감이 있다. 열은 항생제에도 3~5일 지속되며 이차감염이 없으면 독혈증은 없다.</span><span class="hang">배쪽 큰 호흡음과 세기관지염의 천명음이 들린다. 대부분 5~7일에 회복하고 1~2%는 복식호흡, 호기성 신음, 거품 침의 개구호흡 후 2~5일에 죽는다. 기갑부 피하기종이 생길 수 있다.</span><span class="hang">Rebhun: 심한 호흡곤란에도 폐가 매우 조용한 경우가 중요한 징후로, 기흉이나 미만성 부종·폐기종 때문이다. 고열에도 패혈증처럼 보이지 않는다. 이상성 경과로 호전 후 수일~수주 뒤 심급성 호흡곤란이 오며 흔히 치명적이다. 6주령 미만에서 드물고 2~6개월령에 가장 흔하다.</span><span class="hang">한국 자료: 잠복기 2~3일, 39.5~41.5℃ 발열이 유행열과 달리 5~6일 지속되고 중증은 가슴 앞·어깨 밑·턱 밑 피하기종이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>BRSV — 진단<span class="hang">분리가 어렵고 11~21일이 걸린다. 배출 시작 중앙값 3일, 최고 5일, 종료 9일이다. 초기 기관 흡인물이 이상적이고 비인두 스왑은 수송배지에 냉장(냉동 금지) 운송한다. PCR이 선호된다.</span><span class="hang">바이러스 중화시험이 표준 혈청검사다. 항체가가 2주 전에 최고가 될 수 있어 1일·14일째 채혈한다. 젖소 송아지는 대부분 5개월 이후 모체항체가 없으므로 6개월 이상 양성은 무리 내 노출을 뜻한다.</span><span class="hang">피하기종이나 기흉만으로 진단하지 않는다. 심한 경화성 기관지폐렴에서도 등쪽 폐 과부하로 생긴다.</span><span class="hang">부검: 폐가 크고 무너지지 않으며 전복측 암적색 경화, 등쪽·후엽의 심한 간질성·수포성 폐기종과 부종, 호산성 봉입체를 가진 다핵 합포체가 보인다. 여러 부위를 채취한다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>BRSV — 치료와 예방<span class="hang">특이 치료는 없다. 이차 세균 대비 광범위 항생제 3~5일은 흔히 쓰지만 꼭 필요하지는 않다. NSAID와 스테로이드는 효능 근거가 없다(Constable). Rebhun은 패혈증 징후가 적은 송아지·비임신우에 스테로이드가 때로 극적 효과를 준다고 한다.</span><span class="hang">2단계(과민반응형) 성우 처방 예(Rebhun): 광범위 항생제, 덱사메타손 10~20 mg 1일 1회(임신우 제외), 트리펠렌나민 1 mg/kg 1일 2회, 아트로핀 0.048 mg/kg 1일 2회, 플루닉신 1 mg/kg IV 12~24시간, 심한 폐부종 시 푸로세미드 250 mg 1일 1~2회. 비강 산소 10~15 L/분, 아미노필린 10 mg/kg 24시간 지속주입, 기흉 배기를 더한다.</span><span class="hang">음성 우군은 폐쇄 우군, 이웃 농장 코 접촉 차단, 신규우 2~3주 격리로 유입을 막는다. 백신 방어는 대개 4개월 미만이다. 6개월 미만 젖소 송아지 불활화 백신은 폐사를 줄였다. 비경구 생백신은 신생 송아지에서 반응이 억제되고 비강 생백신도 모체항체의 방해를 받는다.</span><span class="hang">심한 발생은 적극 치료에도 폐사율 10~30%에 이를 수 있다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">50.</span><span>PI-3(파라인플루엔자-3)<span class="hang">섬모상피와 폐포대식세포를 손상해 세균 이차감염을 소인하고 기관지수축을 일으킨다. 단독 감염은 대개 불현성이거나 경미하다.</span><span class="hang">40.0~41.7℃ 발열, 장액성 콧물, 호흡 40~80회/분, 기관 수포음이며 7일 안에 회복한다(Rebhun). 한국 자료: 잠복기 1~2일 후 3~4일간 40℃ 전후, 단독 감염 폐사율 1% 이하, 6~10일에 회복한다. 배출은 시작 1일, 최고 4일, 종료 10일이다.</span><span class="hang">미국 북부 젖소에서는 거의 동정되지 않아 BRD에 중요하지 않은 듯하다(Rebhun). 한국 자료는 수송열과 송아지 유행성 폐렴의 주요 원인으로 기술한다. 보강제 사백신 2주 간격 2회는 비강 배출을 막는다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>소 코로나바이러스(호흡기)<span class="hang">비육장 입식우의 90%가 이미 양성이고 대부분 28일 내 혈청전환한다. 최근 감염과 BRD의 관련은 없었다는 보고와, 비강 배출·항체 반응 소의 치료 위험 1.6배, 배출 소의 도축 시 폐 병변 위험 2.2배라는 보고가 섞여 있다. 수송열 초기 환축의 80% 이상이 배출했다.</span><span class="hang">송아지 유행성 폐렴에서 일차적 역할의 증거가 있다. 아일랜드 호흡기병 송아지의 23%에서 가장 흔한 바이러스, 이탈리아 2~3개월 송아지 발생의 약 75%에서 유일한 바이러스였다.</span><span class="hang">PCR은 장관주와 호흡기주를 구별하지 못한다(Rebhun). 현재 백신은 설사용 허가이고 호흡기주(아계통 2a·2b·2c)와 백신주(계통 1)가 달라 호흡기 효과는 낮을 것으로 본다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>BVD의 역할과 기타 바이러스<span class="hang">모든 BVDV는 급성 감염 7~14일간 호중구·대식세포·림프구 기능을 떨어뜨리고 폐포대식세포를 감염시켜 폐렴을 소인한다. 비세포병원성 1a·1b형이 폐에서 자주 발견된다. 면역 없는 소가 2형에 걸리면 점막 미란 없이 심한 간질성 폐렴, 혈소판감소, 급사가 생긴다.</span><span class="hang">급성 BVDV 초기에는 41.1~42.2℃ 고열만 있고 폐는 정상이다. 무리의 단일 세균성 폐렴이나 만성 화농성 폐렴에서는 지속감염(PI) 검사를 한다.</span><span class="hang">M. haemolytica 류코톡신, BRSV, BVDV 혈청전환이 온타리오 비육장 호흡기병의 약 70%를 예측했다.</span><span class="hang">아데노 3·7형, 소 비염 A·B 바이러스, 소 인플루엔자 D가 호흡기병 송아지의 62%에서 검출되었으나 인과관계는 불확실하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>송아지 폐렴(유행성 송아지 폐렴) — 원인과 위험요인<span class="hang">6개월 미만 축사 사육 송아지의 임상적 호흡기병을 가리키는 기술적 용어다. BRSV, 코로나바이러스, 마이코플라즈마가 일차 병원체이고 P. multocida가 흔한 이차균이며 M. haemolytica는 덜 분리된다. 한국 자료는 파라인플루엔자를 주원인으로, 생후 2주~1년(1~6개월령)에 다발하며 외부 입식우가 주된 전염원이라고 한다.</span><span class="hang">발병은 IgG와 비강 IgA가 가장 낮은 2~4주령에 시작하고 IgG2가 느는 2~4개월령부터 줄어든다. 초유 수동면역 실패가 일관된 주요 위험요인이며 폐사의 최대 31%가 부적절한 초유 급여와 관련된다. 생후 14일 내 설사는 90일 내 호흡기병 위험을 높인다.</span><span class="hang">이유 전 군사하지 않거나 7두 이하 군사, 허치 사용, 6~7일까지의 공실·소독 기간이 위험을 낮춘다. 추운 날 환기구를 닫으면 습도와 비말 농도가 오른다.</span><span class="hang">기준(Rebhun): 생후 1~7일 혈청 총단백 5.5 g/dL 이상(Brix 8.4% 이상)을 75~80% 이상이 충족해야 한다. 군사 칸 송아지당 깔짚 약 35 sq ft, 칸 내 연령차 7~10일 미만.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>송아지 폐렴 — 증상과 감별<span class="hang">원인과 무관하게 비슷하다. 40~40.5℃ 열, 비염, 가벼운 설사, 기관을 누르면 쉽게 유발되는 거칠고 마른 기침이 특징이다. 첨엽·심엽 배쪽에서 크고 거친 호흡음이 들리고 심음이 커진다. 경과는 4~7일이다.</span><span class="hang">파스튜렐라 이차감염 시 41~41.5℃로 오르고 수포음과 마찰음이 생긴다. T. pyogenes나 F. necrophorum이 침입하면 경화와 독혈증이 심하고 농양이 생겨 재발이 잦다.</span><span class="hang">감별: M. haemolytica·H. somni(심한 독혈증), M. bovis(무리의 갑작스러운 호흡곤란, 반응 불량), 송아지 디프테리아, 폐충, 급성 심근 영양장애, 흡인성 폐렴, 선천성 심장기형.</span><span class="hang">미국 이유 전 송아지 사망의 22%가 BRD이며 치명률 2~9%다. 3개월 내 폐렴 치료 육성우는 90일 이후 폐사 위험이 2.5배이고, 호흡기병 없는 송아지는 6개월 일찍 첫 분만했다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>송아지 폐렴 — 치료<span class="hang">바이러스·마이코플라즈마성은 반응이 나쁘나 이차감염 가능성이 높아 3일간 매일 항생제를 주며 마이코플라즈마에도 듣는 약을 선호한다. 재발하면 3~5일 반복 치료한다. 기관지확장제와 NSAID 보조는 효능이 의문이다(Constable). 원인 환경을 반드시 교정한다.</span><span class="hang">한국 자료: 이차감염 예방으로 항균제·설파제를 쓰고 대사촉진제, 해열제, 거담제, 전해질, 영양제를 주며 탈수를 막는다. 치료하지 않으면 3~7일에 죽고 불완전 치유 시 폐농양으로 만성화한다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>송아지 폐렴 — 환경과 예방<span class="hang">적온 13~21℃, 상대습도 70%(Constable). 습도 55~75%가 최적(Blackwell), 85%를 넘지 않게(Bovine Medicine)라는 기술도 있다.</span><span class="hang">환기: 겨울 시간당 최소 4회, 여름 최대 40회(Bovine Medicine) 또는 45~60회(Rebhun). 송아지당 6주까지 6 m3, 12주까지 10 m3 이상, 암모니아 10 ppm 미만.</span><span class="hang">칸 공기 세균은 30,000 CFU/m3 미만이 양호하고 100,000을 넘으면 호흡기병과 관련된다. 밀도를 2배로 하면 환기를 10배 늘려도 상쇄되지 않는다(Rebhun).</span><span class="hang">성우와 공기를 공유하지 않게 별도 송아지사나 허치를 쓴다. 구입 송아지는 수주 격리하고 3주령부터 스타터와 양질 건초를 준다.</span><span class="hang">2015년 메타분석에서 2주~4개월 젖소 송아지 바이러스 백신은 자연 노출 시 이환·폐사를 줄이지 않았다. 2주 간격 반복 접종 과면역은 근거가 없다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">57.</span><span>만성 화농성 폐렴(Trueperella pyogenes)과 폐농양<span class="hang">숙주 방어 손상이나 괴사 폐에 정착하는 이차균이다. 흡인, 선행 감염, BVDV, BLAD가 소인이고 혐기균, P. multocida, 마이코플라즈마가 함께 있다. 만성일수록 관여 가능성이 높다.</span><span class="hang">1주 이상 또는 수개월 반복 폐렴으로 성우는 분만 후 드러나기 흔하다. 미열(39.4~40.6℃), 호흡 40~100회/분, 누울 때 머리 신전, 기침, 여윔, 유량 감소, 배쪽 수포음·경화음, 기침 후 악취를 보인다. 성장 불량 소의 감별에 넣는다. 글로불린 5.0 g/dL 초과가 흔하다.</span><span class="hang">예후가 나쁘다. 페니실린 22,000 U/kg 1일 2회 7~30일이 선택약이고 세프티오퍼, 암피실린, 테트라사이클린도 쓴다. 단기 호전 후 재발이 흔하다(Rebhun).</span><span class="hang">흉곽 내 피막 농양은 한쪽 배쪽 폐음이 없고 심장이 반대쪽으로 밀려 반대편 심음이 크다. 20~28 Fr 투관침으로 배액하고 페니실린 22,000 U/kg 1일 2회를 쓰며 자극성 요오드 세척은 금기다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">58.</span><span>송아지 디프테리아(괴사간균증) — 원인<span class="hang">Fusobacterium necrophorum에 의한 괴사성 감염으로 구강형은 괴사성 구내염, 인두·후두형이 송아지 디프테리아(괴사성 후두염)다. 상재균이며 손상되지 않은 점막은 뚫지 못한다. 후두형은 반복적 후두 폐쇄로 생긴 접촉궤양이, 구강형은 거친 사료와 이빨 상처가 침입구다.</span><span class="hang">구내염은 2주~3개월령, 후두형은 1세까지(드물게 3세)에 생기고 축사 밀사 송아지에 많다. 더러운 젖꼭지·양동이로 퍼질 수 있다.</span><span class="hang">한국 자료: 어린 송아지와 12개월령에서 겨울철 밀사·비위생 사육에 많고 이병률 10~100%이나 적절히 치료하면 폐사율은 낮다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>송아지 디프테리아 — 증상과 진단<span class="hang">후두형: 습하고 아픈 기침, 굉음 같은 흡기성 호흡곤란(honker calf), 침흘림, 아픈 삼킴, 식욕부진, 41℃ 고열, 인두부 종창, 악취 호흡(Constable). Rebhun은 39.4~40.3℃ 미열과 먹을 때의 짧은 기침을 기술한다. 흡기 쪽이 늘 더 심하다.</span><span class="hang">구강형: 39.5~40℃, 악취, 짚 섞인 침, 입꼬리 뒤 볼 종창과 깊은 궤양.</span><span class="hang">개구기와 빛 또는 내시경으로 피열연골의 괴사 병변과 성문 협착을 본다. 검사가 호흡곤란을 악화시키므로 심하면 먼저 기관절개를 한다. 만성은 점막이 정상이어도 연골 괴사가 있을 수 있어 후두 초음파가 유용하다.</span><span class="hang">치료하지 않으면 2~7일에 죽고 흡인성 폐렴이 생길 수 있다. 감별: 후두 종양, 외상성 인두염, 피열연골 이물, IBR, H. somni 후두염.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>송아지 디프테리아 — 치료와 예방<span class="hang">프로카인 페니실린 22,000 IU/kg IM 12시간 간격 또는 44,000 IU/kg 24시간 간격 최소 7일(Constable), 급성은 22,000 U/kg IM 1일 2회(Rebhun). 베타락탐, 테트라사이클린, 마크로라이드에 감수성이고 아미노글리코사이드에 내성이다. 세프티오퍼·세프퀴놈은 2차 선택이다. 연골염은 최대 3주 이상 치료한다.</span><span class="hang">NSAID나 스테로이드로 후두 부종을 줄인다. 한국 자료는 설파제·테트라사이클린과 인후두 종창에 정맥 요오드화나트륨을 든다.</span><span class="hang">심한 호흡곤란에는 경부 근위 1/3에 기관절개가 필수이며 관은 하루 1회 이상 씻는다. 기관절개 후에도 빈호흡이 조금만 나아지면 심한 기관지폐렴을 시사한다.</span><span class="hang">구강형은 괴사물 제거, 요오드팅크, 설파메타진 150 mg/kg 경구 3~5일로 대개 낫는다.</span><span class="hang">만성 연골염·변형은 예후가 나쁘며 14~30일 치료, 아전 피열연골절제술, 후두기관 개구술을 고려한다. 회복 후에도 흡기 협착음이 남을 수 있다. 예방은 급이 위생, 거친 사료 회피, 환축 격리다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">61.</span><span>흡인성 폐렴 — 원인과 증상<span class="hang">송아지: 백근증, 위관·식도 급여기 기관 삽입, 큰 구멍 젖꼭지 병(거꾸로 들었을 때 방울만 떨어져야 한다), 누운 채 급여, 미숙아, 인두 외상, 장기 난산 후 태변 흡인. 성우: 유열(옆으로 누워 역류 내용물 흡인)이 가장 흔하고, 잘못된 강제 투약, 위관 오삽입, 식도경색, 미주신경 손상, 신경질환, 수술 중 역류도 원인이다.</span><span class="hang">다량이면 즉시 호흡곤란, 청색증, 기침 후 수분~수시간에 죽는다. 소량이면 항생제 반응이 나쁜 열, 호흡곤란, 양측 전복측 수포음·경화음의 진행성 패혈성 폐렴이 된다. 누운 쪽 폐에 병변이 몰리기도 한다. 대개 단일 개체지만 백근증 무리는 여러 마리가 걸린다.</span><span class="hang">반추위 내용물 흡인은 독혈성 괴저성 폐렴이 되고, 24~48시간 후 독혈성 기관지폐렴과 뚜렷한 백혈구·호중구감소를 보인다(Constable). 불용성 물질은 48~72시간에 폐사한다(한국 자료). 방사선은 심장 앞뒤 배쪽 경화를 보인다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>흡인성 폐렴 — 치료와 예방<span class="hang">흡인 물질 속 미생물을 겨냥한 광범위 항생제와 NSAID를 주고 호전되면 최소 2주 계속한다. 지속되는 열, 침울, 호흡곤란, 독혈증은 대개 치명적 결과의 신호다. 인두 외상에 의한 연하곤란성 흡인이 결과가 가장 좋았다(Rebhun).</span><span class="hang">신생 송아지 태변 흡인은 덱사메타손 5 mg/50 kg 1회를 항생제·산소와 함께 줄 수 있다(Rebhun). 광유 흡인은 사실상 치명적이다.</span><span class="hang">약물과 우유는 소량씩 주어 뱉을 수 있게 하고 투약 중 재채기하면 즉시 풀어 준다(한국 자료). 병 급여 시 머리와 목을 지면과 평행하게 하고, 연하곤란 소는 바닥에서 먹이며, 유열을 신속히 치료한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>폐충증(Dictyocaulus viviparus) — 생활환과 역학<span class="hang">기생성 기관지염(husk)의 원인이다. 성충은 기관·기관지에 살고 알이 기침으로 올라와 삼켜져 1기 유충이 분변으로 나온다. 18~21℃에서 3~7일에 감염성 3기 유충이 되고 습기가 필수다. Pilobolus 곰팡이 포자낭 폭발로 최대 3 m 퍼지며 월동한다.</span><span class="hang">섭취 유충은 장간막 림프절을 거쳐 폐로 가서 감염 3~4주에 산란을 시작한다(잠복기 약 4주). 면역은 빨리 생기나 불완전하고 재감염이 없으면 약해진다. 수백~수천 마리로도 증상이 생긴다.</span><span class="hang">실내 사육 후 매년 같은 송아지 방목지에 나간 첫 방목 송아지가 가장 취약하며 대개 방목 2~4개월 후 병원성 수준에 이른다. 최근 성우 발생이 늘고 있다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>폐충증 — 기전과 증상<span class="hang">유충이 세기관지를 막아 폐포 허탈, 폐부종, 간질성 폐기종이 생기며 이때는 치료에 즉시 반응한다. 성충기에는 알·충체 흡인으로 이물성 폐렴과 기관지확장증이 생긴다. 회복기 소의 약 25%는 폐포 상피 입방화로 비가역적으로 죽을 수 있다.</span><span class="hang">급성형: 갑작스러운 얕은 복식호흡 60~100회/분, 잦은 기침, 40~41℃, 심박 100~120회/분, 생기는 있음. 24시간 내 개구호흡·청색증으로 악화되어 3~14일에 죽으며 치명률은 75~80%다.</span><span class="hang">아급성형(송아지에 더 흔함): 체온 정상~약간 높음, 호흡 60~70회/분, 발작성 기침, 3~4주 경과, 빠른 여윔. 7~8주 후 재발 사례는 예후가 매우 나쁘다.</span><span class="hang">Rebhun: 깊고 습한 기침과 전 폐야의 미만성 습성 수포음이 세균성 폐렴과의 감별 요점이다. 무리 대부분이 걸리고 폐사율은 낮다.</span><span class="hang">재감염 증후군: 면역 있는 성우가 오염 목초지에 간 14~16일 후 잦고 깊은 기침, 빈호흡, 유량 급감을 보이며 L4 이행 때문에 분변 검사는 음성이다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>폐충증 — 진단<span class="hang">베르만법으로 1기 유충(0.5 mm 미만, 장 세포의 굴절 과립)을 찾는다. 증상 약 12일 후(감염 약 24일 후)부터 나오므로 잠복기와 부분 면역 성우에서는 음성일 수 있어 여러 마리를 검사한다.</span><span class="hang">기관 세척액의 호산구성 염증은 폐충을 강하게 시사한다(Rebhun). 혈청·우유 ELISA가 있으나 일차 감염 수주 후에야 양성이다.</span><span class="hang">부드럽고 발작적인 기침이 감별에 도움이 된다. 오염 목초지 이동 1~2주 후 성우 발생은 AIP와 임상적으로 구별되지 않아 항체, 부검 충체, 목초·분변 유충을 확인한다.</span><span class="hang">부검: 최대 8 cm 성충, 후엽의 진분홍 경화와 간질성 폐기종. 재감염형은 죽은 유충 주위 5 mm 회녹색 결절이 특징이다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>폐충증 — 치료<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>에프리노멕틴</td><td>0.5 mg/kg 푸어온, 0.2 mg/kg SC</td></tr><tr><td>이버멕틴·목시덱틴</td><td>0.2 mg/kg SC·PO, 0.5 mg/kg 푸어온</td></tr><tr><td>도라멕틴</td><td>0.2 mg/kg SC·IM</td></tr><tr><td>알벤다졸</td><td>10 mg/kg PO</td></tr><tr><td>옥스펜다졸</td><td>7.5 mg/kg PO(본문 4.5 mg/kg)</td></tr><tr><td>펜벤다졸</td><td>5 mg/kg PO</td></tr><tr><td>레바미솔</td><td>7.5 mg/kg(푸어온 10 mg/kg), Rebhun 8 mg/kg</td></tr></table><span class="hang">마크로사이클릭 락톤은 잔효가 있다(이버멕틴 최대 28일, 도라멕틴 주사 35일·푸어온 42일, 목시덱틴 42일). 에프리노멕틴은 우유 휴약이 없어 성 젖소에 선택약이다. 벤지미다졸과 레바미솔은 잔효가 없다.</span><span class="hang">중증은 충체가 죽으며 처음에 악화될 수 있어 항히스타민이나 플루닉신과 항생제를 함께 준다. 중증 개체는 실내로 들이고 나머지는 깨끗한 목초지로 옮긴다. 항생제만 주면 열은 내려도 기침과 호흡곤란은 남는다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>폐충증 — 방제<span class="hang">방사선 약독화 유충 1,000마리 경구 백신을 8주령 이상 건강한 송아지에 방목 6주·4주 전 2회 준다. 접종우와 미접종우를 함께 방목하지 않는다.</span><span class="hang">전략적 구충: 지속방출 볼루스(펜벤다졸 최대 140일, 옥스펜다졸 3주 간격 5~6회)나 초기 방목기 2~3회 마크로사이클릭 락톤(이버멕틴 방목 3·8·13주). 에프리노멕틴 서방형 1.0 mg/kg SC는 최대 150일, 이버멕틴 장기작용 0.63 mg/kg SC는 최소 77일 방어한다.</span><span class="hang">송아지를 성우 뒤에 방목하지 않고, 이른 봄 방목을 피하며, 습한 여름에 주의한다. 육성우 분뇨를 뿌린 목초지의 착유우 발생 사례가 있다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">68.</span><span>비정형 간질성 폐렴(AIP, 급성 소 폐부종·폐기종 ABPE) — 원인<span class="hang">fog fever라고도 하며 독혈증 없는 호흡곤란, 진행성, 치료 무반응, 폐기종·부종·유리질막·폐포상피 증식이 비정형인 점이다.</span><span class="hang">목초지형: 무성한 목초의 L-트립토판이 반추위에서 3-메틸인돌(3MI)로 바뀌고, 흡수 후 폐 Clara 세포와 1형 폐포상피의 시토크롬 P450이 독성 대사체로 활성화한다. 트립토판 0.3% DM 풀을 먹는 450 kg 소는 3일이면 실험 재현 용량(0.35 g/kg)에 가깝게 섭취한다.</span><span class="hang">기타: Fusarium 오염 고구마(4-이포메아놀), Perilla 민트(페릴라 케톤), 이산화질소 등 흄, 비육 암소의 MGA 급여. 폐충 재감염과 Ascaris suis 이행도 비슷한 병을 만든다. 송아지는 3MI에 더 저항성이어서 같은 목초지의 성우만 걸린다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>AIP — 역학과 증상<span class="hang">마른 여름 목초지에서 무성한 가을 목초지로 갑자기 옮긴 성우에서 4~10일(Rebhun은 2주 이내) 후 생긴다. 이환율 10~50% 이상, 치명률 25~50%이며 여러 마리가 죽은 채 발견된다. 1세 미만은 대개 걸리지 않는다. 가을 2~4주에 걸쳐 생기고 첫서리 후 급감한다.</span><span class="hang">비육장형은 입식우의 약 2.8%, 여름·가을 비육 말기(출하 15~45일 전)에 많고 앨버타 확진 사례는 모두 암소였다. 한국 자료: 비육 후반에 머리를 들고 침을 흘리며 심한 호흡곤란으로 불안·공격적이 되면 대부분 AIP를 의심한다.</span><span class="hang">신음 동반 호기, 개구호흡, 머리·목 신전, 거품 침, 불안, 기침은 드물다. 억지로 걸리면 쓰러져 죽는다. 체온 38.5~39.5℃(더운 날 41~42℃), 심박 80~120회/분, 고창, 기갑부 피하기종이 흔하다.</span><span class="hang">초기 배쪽의 크고 맑은 호흡음, 며칠 생존 시 간질성 폐기종의 큰 수포음이 진단적이다. 회복 일부는 수개월 후 폐성심이 온다. 혈액 검사는 진단 가치가 없다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>AIP — 감별과 부검<span class="hang">감별: 파스튜렐라 폐렴(발열·독혈증, 젊은 소, 24시간 내 반응), 유기인제 중독(축동, 근진전, 이상 폐음 없음), 질산염 중독(초콜릿색 점막, 이상 폐음 없음), 농부폐, 폐충, Ascaris suis 이행(돼지 사육 이력).</span><span class="hang">부검: 폐가 크고 단단하며 무너지지 않는다. 창백한 폐기종, 진분홍 삼출, 단백액 찬 노란 부위, 상피화된 암적색 부위가 섞인 대리석 모양이다. 염증이 거의 없고 유리질막이 특징이며 소기도 병변이 없어 기관지폐렴과 구별된다.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>AIP — 치료와 예방<span class="hang">특이 치료는 없다. 새 사례 대부분이 발생 4일째까지 생겨 목초지에서 빼도 막지 못하고 두어도 대개 더 생기지 않는다(Constable). 중증 소는 꼭 필요할 때만 아주 천천히 그늘로 옮기고, 즉시 도축을 고려한다. 경증은 건드리지 않으면 1~2주에 회복한다.</span><span class="hang">푸로세미드 0.5~1.0 mg/kg, 아트로핀 0.048 mg/kg 1일 2회, 항히스타민, NSAID 등이 경험적으로 쓰였으나 평가되지 않았다(Rebhun).</span><span class="hang">예방: 모넨신 200 mg/두/일을 이동 1일 전부터 최소 4일(Constable) 또는 이동 수일 전부터 이동 후 7~10일(Rebhun). 효과는 중단 48시간 내 사라진다. 클로르테트라사이클린 2.5 g/두/일 이동 1일 전부터 최소 4일, 라살로시드 200 mg/두/일 최소 14일도 쓸 수 있다.</span><span class="hang">방목 관리: 첫날 2시간, 매일 1시간씩 늘려 10~12일에 종일 방목하고, 방목 전 아침에 건조 건초를 최소 4일 자유급여한다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>기타 비감염성 간질성 폐질환<span class="hang">농부폐(외인성 알레르기성 폐포염): 곰팡이·먼지 건초(Micropolyspora faeni 등)에 장기 노출된 성우의 만성 기침, 체중·유량 감소, 독혈증 없음, 림프구성 세척액. 침강항체는 정상우에도 흔하다. 건초를 바깥에서 주거나 적시거나 버리는 관리가 치료다.</span><span class="hang">증식성 폐렴: 단일·소수 개체의 급성 호흡곤란, 미열, 전 폐야가 매우 조용함. 푸로세미드 0.5~1.0 mg/kg 2일, 아트로핀 0.048 mg/kg 1일 2회, 덱사메타손 10~20 mg 3일(임신우 제외), 광범위 항생제 5~7일(Rebhun).</span><span class="hang">이산화질소(사일로 가스): 사일로 근처 소의 만성 마른기침이나 급성 폐부종. 폐쇄성 세기관지염(매우 심한 마른기침)과 미만성 섬유성 폐포염(만성 진행성)은 치료가 거의 듣지 않는다.</span><span class="hang">아나필락시스: 에피네프린 1:1000 2~10 mL IM·SC(중증 2~4 mL IV), 트리펠렌나민 1 mg/kg, 폐부종 시 푸로세미드 0.5~1.0 mg/kg, 비임신우 덱사메타손 20~40 mg(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">73.</span><span>후대정맥 혈전증 — 폐 증상<span class="hang">반추위 산증, 제4위 궤양으로 생긴 간문부 농양(또는 다른 복강 농양)이 후대정맥 혈전을 만들고, 색전이 폐동맥에서 색전성 폐렴, 폐농양, 동맥류를 만들어 기관지로 터진다. 1세 미만은 드물다.</span><span class="hang">급사형, 단일 개체의 급성 호흡곤란형(예상보다 조용한 폐), 고전형(객혈, 비출혈, 만성 폐렴, 빈혈)이 있으며 급성형 호전 3~6주 뒤 비출혈이 오는 경우가 많다(Rebhun). 약 절반이 대량 기관지 출혈로 급사하며, 소에서 쓰러져 죽는 호흡기 출혈의 거의 유일한 흔한 원인이다.</span><span class="hang">글로불린 5.0 g/dL 초과, 섬유소원 600 mg/dL 초과가 흔하다. 우측 8~12번 늑간 초음파에서 간농양, 혈전, 정상 삼각형이 아닌 둥근 후대정맥(정상 지름 2~5 cm), 간정맥 확장을 본다.</span><span class="hang">효과적 치료가 없어 조기 도태한다. 귀한 소는 장기 페니실린 22,000 U/kg 1일 2회와 아스피린을 쓰나 비출혈이 있으면 아스피린은 금기다. 출혈이 보이면 대개 3주를 넘기지 못한다. 무리에 2두 이상이면 사양과 아급성 반추위 산증을 점검한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">74.</span><span>흉막염·흉막농양 — 원인과 증상<span class="hang">대부분 폐렴(M. haemolytica, H. somni)에서 이어지고 창상성 망위염, 관통상, 식도 천공, 폐농양 파열, 결핵, CBPP로도 생긴다.</span><span class="hang">초기에는 얕은 복식호흡, 팔꿈치 외전, 움직이기 싫어함, 늑간 압통이 있고 마찰음은 초기에만 들린다. 흉수가 차면 배쪽 폐음 감약과 수평 탁음선이 생긴다.</span><span class="hang">소는 흉막강이 통하지 않아 염증성 흉수가 흔히 한쪽(주로 우측)에 국한된다. 양측성은 양측 폐질환이나 우심부전·저단백혈증을 시사한다. 흉수는 심장을 밀지 않아 양쪽 심음이 들리고, 한쪽 종괴·농양은 심장을 반대쪽으로 민다. 경화는 기관지음, 흉수는 무음이다. 다량이면 경정맥·유정맥이 팽대한다(Rebhun).</span><span class="hang">심급성은 독성 호중구 동반 백혈구감소, 만성은 정상~증가와 고섬유소원혈증, 빈혈을 보인다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>흉막염 — 치료<span class="hang">흉수 배양 근거 항생제를 수주, 마지막 천자 후 최소 1주 더 준다(Rebhun). 배액 기준은 초기 반응 불량, 호흡곤란 유발 다량 흉수, 악취 흉수, 흉수 세포 내 세균이다.</span><span class="hang">적은 양은 2~3일 간격 12~20 Fr 관, 많으면 24~32 Fr 관을 고정하고 하임리히 밸브로 수동 배액한다. 흡인은 섬유소로 막히기 쉽다.</span><span class="hang">세척: 등쪽·배쪽에 관을 두고 따뜻한 0.9% 식염수 5~10 L를 각 반흉강에 중력으로 넣은 뒤 배쪽 관으로 뺀다. 개흉술 성공 보고가 있다. 흉수가 있는 폐렴은 항생제 무반응 발열과 심한 호흡곤란을 보인다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>기흉·종격동기종<span class="hang">기흉: 한쪽 또는 양쪽 등쪽 폐음 소실, 배쪽 호흡음 증가, 호흡곤란. 소는 종격동이 완전해 대개 한쪽이다. 가장 흔한 원인은 만성 기관지폐렴의 수포 파열이고 감염원은 BRSV가 가장 흔하다. 수포성 폐기종이나 폐부종은 배액 대상이 아니므로 구별한다.</span><span class="hang">등쪽 9~10번 늑간 천자로 공기를 뽑아 진단과 치료를 겸하며 대부분 1~2회에 반응한다.</span><span class="hang">종격동기종은 분만 후 소에 흔하고 등쪽 피하기종과 양측 심음 감약이 일관된 소견이며 방사선에서 대동맥 이중 윤곽이 보인다. 심막염과 감별한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">77.</span><span>후두염·기관 질환<span class="hang">원인은 IBR, 송아지 디프테리아, H. somni, 외상(투약기·위관), 후두 부종(고사리 중독, 아나필락시스), 인두·인두 뒤 농양, 림프종, 늑골 골절 가골의 기관 압박 등이다. 기침과 굉음·협착음 동반 흡기성 호흡곤란이 공통이며 세균성 기관기관지염은 습하고 아픈 기침으로 피·섬유소를 뱉는다.</span><span class="hang">급성 후두 부종(아나필락시스): 항히스타민, 에피네프린 1:1000 1~5 mL IV 또는 4~8 mL SC·IM, 덱사메타손 40 mg 또는 메틸프레드니솔론 100~500 mg을 즉시 주고 바로 반응이 없으면 지체 없이 기관절개한다(Rebhun).</span><span class="hang">비육우 기관 협착(honker): 원인 불명으로 기관 등쪽 벽의 부종·출혈로 기침, 호흡곤란, 코골이음을 보이며 완전 폐쇄로 급사하기도 한다.</span><span class="hang">인두 농양은 구강 내 배액이 좋고 T. pyogenes·Fusobacterium을 겨냥해 베타락탐을 1~2주 준다. 기관 내 염증성 폐쇄는 아세틸시스테인 분무와 기관지확장제로 치료한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">78.</span><span>비강 질환 — 알레르기성 비염과 육아종<span class="hang">여름 콧물병: 목초가 꽃필 때 방목우에 생기고 채널제도 품종에 많다. 갑작스러운 호흡곤란, 주황~노란 건락성 콧물, 재채기, 소양증으로 코를 비벼 나뭇가지가 박히기도 한다. 만성기에는 앞쪽 비강에 2~8 mm 결절이 생긴다. 콧물·생검에 호산구가 많다.</span><span class="hang">목초지에서 약 1주 빼고 항히스타민을 주며 5~7일에 개선된다. 뺄 수 없으면 비임신 육성우에 스테로이드를 쓴다(Rebhun).</span><span class="hang">풍토성 비강 육아종(호주 등)은 6개월~4세의 만성 알레르기성 비염으로 콧구멍 안 5~8 cm까지 1~4 mm 결절이 있고 상당수가 도태된다.</span><span class="hang">진균성(Rhinosporidium 등) 육아종은 최대 5 cm 용종이며 출혈이 흔하다. 요오드화나트륨 IV 30 g/450 kg 1~2회 후 유기 요오드 30 g 경구를 요오드중독까지 준다. Actinobacillus lignieresii 육아종은 감량 절제와 요오드로 예후가 좋고, Actinomyces bovis는 페니실린 22,000 U/kg를 병용한다(Rebhun). 한쪽 콧물·기류 감소, 호너 증후군, 안구돌출은 비인두·부비동 종양을 시사한다.</span></span></p><p class="bx-num"><span class="bxn">79.</span><span>비강 질환 — 부비동염<span class="hang">급성 전두동염은 대개 비멸균 제각 후에 생긴다. 39.4~41.1℃, 점액농성 콧물, 눈을 반쯤 감고 머리를 기대는 두통 자세, 타진 통증, 제각 부위 고름이 있다. 상처 세정, 식염수 세척, 7~14일 페니실린, 진통제로 예후가 좋다. 파상풍에 주의한다.</span><span class="hang">만성 전두동염은 제각 수개월~수년 후나 상행성 감염(P. multocida, T. pyogenes 혼합)으로 생긴다. 간헐적 한쪽 콧물과 발열, 골성 팽대, 안구돌출이 있고 신경 합병증은 대개 치명적이다.</span><span class="hang">각돌기부와 정중선에서 약 4.0 cm(양 안와 뒤 연결선 위) 두 곳을 지름 2.0~2.5 cm 이상으로 천공해 세척·배액하고 배양 근거 항생제를 2~4주 쓴다. 2세 미만은 부비동 발달이 덜해 주의한다. 액상 고름은 좋은, 고형 조직은 나쁜 예후 징후다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">80.</span><span>결핵의 호흡기 양상(짧게)<span class="hang">진행성 호흡곤란, 기침, 체중 감소, 폐렴 징후의 원인으로 기억한다. 커진 흉강 림프절이 식도를 눌러 고창을, 기관을 눌러 호흡곤란을 일으킬 수 있다. 다량 흉수는 드물다(Rebhun). 결핵의 만성 흉막염은 대개 무증상이다. 상세는 전신 탭을 본다.</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>소 전염성 흉막폐렴(CBPP, 짧게)<span class="hang">Mycoplasma mycoides subsp. mycoides SC가 원인인 OIE 신고 해외 질병으로 잠복기 3~6주이며 보균우 도입으로 발생한다. 40.5℃ 발열, 흉통, 팔꿈치 외전, 호기성 신음, 마찰음, 목·육수 부종, 현저한 흉막염과 대리석 모양 폐가 특징이다. CF, C-ELISA, PCR로 진단하며 치료하지 않고 박멸한다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>신생 송아지 호흡곤란<span class="hang">태변 흡인, 선천성 심장기형, 백근증, 늑골 골절, 특히 미숙 폐의 표면활성제 결핍이 원인이며 270일 이전 출생, 복제·체외수정 송아지에 흔하다. 정상 송아지는 생후 1시간 안에 호흡이 정상화된다. 건강한 신생 송아지도 생후 30~60분 PaO2 55~60 mmHg일 수 있고, 정맥 PCO2 45 mmHg 초과는 고탄산혈증이다.</span><span class="hang">기도 액체는 뒷다리로 10초 들거나 콧구멍별 5초 흡인으로 빼되 길게 하지 않는다. 가습 비강 산소 5~8 L/분, 비타민 E·셀레늄, 예방적 항생제, IgG가 낮으면 혈장, 덱사메타손 10 mg 1회를 흔히 쓴다. 옆으로 눕히지 않는다(Rebhun).</span><span class="hang">표면활성제는 기관 내 주입 후 10초간 배와위로 돌려 분포시킨다. 260일 이전 유도분만이 불가피하면 어미에 덱사메타손 5 mg IM 12시간 간격 4일, 5일째 10 mg 12시간 간격, 6일째 미분만 시 40 mg과 PGF2α를 주는 7일 유도법이 있다(Rebhun).</span></span></p></div>
</div>
`;
}
function med_cardioHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 순환·혈액</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>심혈관 검사 — 시진과 정맥 촉진<span class="hang">하악간, 앞가슴(brisket), 하복부, 유방, 하지의 부종과 복수 여부를 본다. 저단백혈증, 혈관염, 혈전정맥염, 림프절염과 감별한다. 송아지의 소안구증·꼬리 이상은 심실중격결손 동반을 시사하지만 대부분의 선천성 기형은 다른 기형 없이 나타난다.</span><span class="hang">점막은 결막과 음문에서 본다. 홀스타인처럼 색소가 섞인 품종은 구강점막이 정상이어도 창백해 보인다. 청색증은 드물며 심한 폐질환, 진행된 심부전, 우좌단락에서 나타난다.</span><span class="hang">유정맥은 경정맥보다 정맥압 상승을 더 민감하게 반영한다. 손끝으로 박동을 보고 복벽에 눌러 보아, 잘 눌리지 않거나 손끝에서 굴러 빠지면 우심부전을 의심한다. 유방이 큰 노령우는 정상이어도 약한 박동이 있을 수 있다. 경정맥은 소가 긴장하므로 검사 마지막에 만진다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>경정맥 박동 — 가성과 진성<span class="hang">가성(정상) 박동은 마른 젖소에서 흔하며 심방수축 역류, 수축기 방실판 팽윤, 경동맥 박동 전달로 생긴다. 머리와 목을 수평으로 두면 흉곽입구에서 하악 쪽으로 파도처럼 오르고, 머리를 들면 일부만 오르거나 사라진다.</span><span class="hang">진성 박동은 머리를 수평 또는 약간 들어도 정맥 전체를 빠르게 채운다. 하악지 근처를 막고 피를 흉곽 쪽으로 훑어 비우면 가성은 사라지고 진성은 곧 다시 찬다. 진성은 우심부전, 중심정맥압 상승, 삼첨판 폐쇄부전을 뜻한다. 우심부전에서는 박동보다 확장 자체가 더 인상적이다.</span><span class="hang">정상 성우는 머리를 들었을 때 심기저부보다 5~8 cm 위까지 경정맥이 차 있고 a파와 c파가 보인다. 완전방실차단에서는 대포파(cannon a wave), 삼첨판 폐쇄부전에서는 큰 c파가 나타난다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>심음과 청진 부위<span class="hang">심음은 왼쪽에서 더 잘 들린다. 오른쪽은 청진기를 겨드랑이 쪽 제3늑간까지 깊이 넣어야 한다. 체형점수가 5/5에 가까우면 오른쪽 심음이 안 들릴 수 있다.</span><table class="bxt"><tr><th>판막</th><th>최강점(Rebhun)</th></tr><tr><td>폐동맥판</td><td>좌 제3늑간, 어깨와 팔꿈치 사이</td></tr><tr><td>대동맥판</td><td>좌 제4늑간, 어깨 높이</td></tr><tr><td>승모판</td><td>좌 제5늑간, 팔꿈치 바로 위(심첨)</td></tr><tr><td>삼첨판</td><td>우 제3늑간, 팔꿈치와 어깨 중간</td></tr></table><span class="hang">Constable은 소의 승모판 최강점을 좌 제4늑간으로 기술한다.</span><span class="hang">S2 분열은 정상 소에서 흔하다. S3는 흥분한 소(70~90회/분)에서 흔하고 100회를 넘으면 듣기 어렵다. S4는 심박 90 미만 소의 약 40%에서 들린다. 소에서 S3·S4나 분마율은 이상이 아니지만, 빈맥 소의 뚜렷하고 지속적인 분마율은 심장병의 첫 신호일 수 있다.</span><span class="hang">정상 성우 심박은 60~84회/분이다(절식 소 하한 48회 제안). 신생 송아지는 110~120회까지 정상일 수 있다. 아픈 소가 60회 미만이면 대개 미주신경성 서맥이다.</span><span class="hang">심음 증강: 마른 체형, 흥분, 빈혈, 저마그네슘혈증, 심내막염, 반대쪽 종괴에 의한 심장 변위. 심음 감약: 비만, 수소의 두꺼운 흉벽, 심낭염, 종격기종, 횡격막탈장, 저칼슘혈증, 말기 순환부전.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>심잡음 — 분류와 등급<span class="hang">시기는 심음이 아니라 동맥박동(전완 안쪽 정중동맥)에 맞춰 판정한다. 수축기 잡음은 방실판 폐쇄부전이나 대동맥·폐동맥 협착, 이완기 잡음은 반월판 폐쇄부전이나 방실판 협착이다. 연속성 잡음은 드물며 동맥관개존 송아지나 심낭염 소에서 들린다.</span><table class="bxt"><tr><th>등급(Constable)</th><th>소견</th></tr><tr><td>I</td><td>숙련자가 주의해야 겨우 들림</td></tr><tr><td>II</td><td>몇 초 들으면 분명히 들림</td></tr><tr><td>III</td><td>청진 즉시 넓은 범위에서 들림</td></tr><tr><td>IV</td><td>매우 크고 진전(thrill) 동반, 청진기를 살짝 대면 안 들림</td></tr><tr><td>V</td><td>진전 동반, 살짝 대도 들림</td></tr></table><span class="hang">Rebhun은 6단계를 쓰며 5/6은 진전이 촉지되는 큰 잡음, 6/6은 청진기를 떼도 들리는 잡음이다.</span><span class="hang">I등급은 의미 없고 IV·V등급은 항상 의미 있다. 모든 전수축기 승모판·삼첨판 잡음, 전이완기 잡음, 우측 잡음, 진전이 있는 잡음은 병적으로 본다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>무해성(기능성) 잡음<span class="hang">비유 젖소의 좌측 전방 심기저부 수축기 박출성 잡음은 매우 흔하며 폐동맥판 위에 청진기를 정확히 대야 들린다.</span><span class="hang">생후 2~3주 송아지의 1~3등급 전수축기 잡음은 방실판 가장자리 혈액낭 때문으로 추정한다. 신생 송아지 심기저부 수축기 잡음은 닫히는 동맥관 때문으로 본다.</span><span class="hang">누운 소의 우측 1~3등급 수축기 잡음은 일어서면 사라진다. 제1위 확장과 고창증에서도 비슷하다. 빈혈·저단백혈증의 혈액성 잡음은 특히 폐동맥판 위에서 들린다. 빠른 정맥수액 중에도 잡음이 생긴다.</span><span class="hang">방실판의 혈액낭·장액낭은 홀스타인에서 흔하고(도축장 유병률 49%) 병적 의미가 없다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>동맥박동과 정맥압<span class="hang">미추동맥, 기립불능 소의 안면동맥, 청진과 동시에 볼 때는 정중동맥을 쓴다. 심박과 맥박을 같이 세어 맥결손을 찾는다. 직장검사 때 하행대동맥이 가장 좋다.</span><span class="hang">불규칙 맥은 기본 리듬을 두드리며 따라가 본다. 2도 방실차단은 따라갈 수 있고, 심방세동은 리듬을 잡을 수 없다(불규칙적으로 불규칙).</span><span class="hang">경정맥압: 14~16 G 바늘을 심장 쪽으로 넣고 삼방활전에 헤파린 식염수 주사기와 수액줄을 연결해, 식염수 기둥 끝과 견관절 사이 수직 거리(cm)를 잰다. 중심정맥압은 건강한 성우 평균 2.3 cmH2O, 창상성 심낭염 소 9~21 cmH2O, 탈수 설사 송아지 -3.5~0.7 cmH2O였다. 성우는 카테터를 60 cm 이상 넣고 머리를 중립 자세로 둔다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>심전도와 심초음파 기초<span class="hang">심전도는 부정맥 확진에 필수이나 방 확장 평가는 심초음파로 한다. 기저-심첨 유도는 양극을 좌 제5늑간 팔꿈치 높이, 음극을 우 경정맥구 흉곽입구에서 약 30 cm 위, 접지를 목이나 기갑에 붙인다. P파는 단봉 양성, QRS는 작은 양성 뒤 큰 음성 편위다.</span><span class="hang">심초음파는 성우 3.5 MHz 이하(투과 20 cm 이상), 송아지 5 MHz를 쓰며 늑간이 좁아 위상배열 탐촉자가 가장 좋다. 우측 제3~5늑간 하부에서 시작하고 앞다리를 앞·바깥으로 당긴다. 털을 깎지 않고 70% 이소프로필알코올만 발라도 되며 농장에서 15~20분이면 끝난다.</span><span class="hang">우측 장축 4방 단면(제4늑간과 평행)에서 양 심실·심방과 방실판, 시계방향으로 돌린 좌심실유출로(LVOT) 단면에서 막성 심실중격과 대동맥판(심실중격결손 진단 단면), 더 돌리거나 제3늑간에서 우심실유출로 단면으로 폐동맥판을 본다. 좌측 단면은 승모판 병변 의심 시 쓴다.</span><span class="hang">판막 병변, 증식물, 종괴, 흉수·심낭수, 단락을 볼 수 있으나 국소 심근질환은 잘 잡지 못한다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>심장 트로포닌 I(cTnI)<span class="hang">심근 특이적이며 사람용 측정기로 소에서도 잰다. 건강한 소 기준은 0.04 ng/mL 미만(Constable), 현장 측정기 0~0.05 ng/mL, 다른 측정법 상한 0.08 ng/mL(Rebhun)이다.</span><span class="hang">특발성 심낭염, 창상성 제2위복막염, 심내막염, 타일레리아병, 심근염, 모넨신 중독(대량 투여 후 1~6일에 1 ng/mL 초과), 후대정맥 혈전증, 구제역, 내독소혈증에서 오르고 폐렴·흉강 농양에서도 가끔 오른다. 소에서는 반감기를 몰라 단일 값으로 예후를 판정하지 못한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">9.</span><span>울혈성 심부전 — 원인과 기전<span class="hang">판막질환(심내막염, 선천성 판막 협착, 건삭 파열), 심근질환(심근염, 영양성·독성 심근변성, 유전성 심근병증, 우심방 백혈병 병변), 단락성 선천성 기형, 폐고혈압(고산병, 폐성심), 심막질환(심낭염, 심장압전)이 원인이다.</span><span class="hang">압력부하는 좌심실이, 용적부하는 우심실이 더 잘 견딘다. 부정맥은 울혈성 심부전보다 급성 심부전의 흔한 원인이다. 소는 심박을 안정 시의 2~4배까지만 올릴 수 있고, 심기능부전에서 안정 시 120회를 넘으면 즉시 치료할 빈맥성 부정맥인 경우가 많다.</span><span class="hang">우심부전은 체정맥 울혈로 부종과 체강 삼출, 단백뇨, 문맥 울혈에 의한 소화장애와 말기 설사를 일으킨다. 좌심부전은 폐울혈과 폐부종을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>울혈성 심부전 — 임상증상<span class="hang">소는 대부분 우심부전이다. 양측 경정맥·유정맥 확장(±박동), 앞가슴 부종, 하악간·복부 정중선 부종, 진행되면 복수가 나타난다. 반추류는 두꺼운 피부가 중력복 역할을 해 다리 부종이 잘 생기지 않는다(Constable). Rebhun은 하지 부종도 가능하다고 한다.</span><span class="hang">간이 커져 우측 늑골궁 뒤로 둥근 가장자리가 만져진다. 호흡이 깊어지고 오줌이 줄며 단백뇨가 있다. 식욕이 떨어지고 상태가 빨리 나빠진다. 지속 빈맥과 운동불내성이 있다. 복수는 직장검사에서 장기가 떠 있는 느낌과 파동으로 알고 요복막, 자궁수종, 중피종, 후대정맥 혈전증과 감별한다.</span><span class="hang">좌심부전은 안정 시 빈호흡, 기침, 폐 하부 수포음, 말기 청색증이다. 단독 좌심부전은 드물고 진행된 우심부전에 겹친다.</span><span class="hang">초기에는 가벼운 운동에도 호흡곤란이 오고 회복이 늦으며, 말기 임신이나 고온 같은 부하에서 보상이 깨진다.</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>울혈성 심부전 — 진단과 감별<span class="hang">가장 어려운 감별은 저단백혈증이다. 복측 부종, 운동불내성, 빈맥은 같지만 경정맥·유정맥 확장과 박동이 없다. 정맥 확장·박동과 비정상 심음·리듬이 함께 있는 것이 소 심부전 진단의 핵심이다.</span><span class="hang">체강액은 누출액이고, 심장압전은 혈장액성, 심낭염은 삼출액이다. 수동 간울혈로 GGT, ALP가 오를 수 있다. 부검에서 우심부전은 피하부종, 복수, 흉수, 심낭수, 육두구간(nutmeg liver), 좌심부전은 폐울혈·폐부종을 남긴다.</span><span class="hang">소 울혈성 심부전의 주원인은 심낭염, 심내막염, 심근병증, 폐성심이며 심장 림프육종과 선천성 기형도 혼동된다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>울혈성 심부전 — 치료와 예후<span class="hang">원인 치료가 우선이나 소에서는 대부분 실패한다. 심낭 질환은 심낭액 제거가 핵심이고, 펌프 부전은 이뇨제, 염분 제한, 운동 제한, 강심제로 관리한다. 말기 임신우는 분만 유도를 고려한다.</span><table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>푸로세미드(furosemide)</td><td>2.5~5 mg/kg IV 초회(Constable); 0.5~1.0 mg/kg 1일 2회(Rebhun)</td></tr><tr><td>디곡신(digoxin) 부하</td><td>0.022 mg/kg IV 후 0.0034 mg/kg 4시간마다</td></tr><tr><td>디곡신 지속주입</td><td>0.86 µg/kg/시간 IV</td></tr><tr><td>KCl(식욕 없을 때)</td><td>100 g/일 경구(Constable), 50~100 g/일(Rebhun)</td></tr></table><span class="hang">푸로세미드 반복 투여는 저칼륨·저염소성 대사성 알칼리증을 일으키므로 K, Cl을 확인한다. 디곡신은 제1위에서 파괴되어 정맥 투여하고, 근육주사는 근괴사 때문에 금기다. 소의 반감기는 5.5~7.2시간이고 저칼륨에서 독성이 커진다. 정맥 칼슘제는 이완기말압을 올려 급성 좌심부전을 부를 수 있다.</span><span class="hang">예후는 대부분 불량하다. 부정맥, 심장압전, 심낭염은 회복 가능성이 있으나 심내막·심근·심외막이 침범되면 완전 회복은 거의 없다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>급성 심부전<span class="hang">심한 부정맥, 판막·혈관 파열, 심낭압전이 원인이다. 빈맥성 부정맥은 심근염(구제역), 구리·셀레늄 결핍 심근병, 식물 중독, 감전·낙뢰에서, 서맥은 정맥 칼슘제, 자일라진, 톨라졸린, 진한 KCl, 주목 중독에서 온다.</span><span class="hang">흥분·운동 중에 호흡곤란, 비틀거림, 쓰러짐, 심한 창백이 오고 수초~수분 안에 죽거나 회복한다. 신경계 질환과는 심한 서맥·빈맥, 창백, 약하거나 없는 맥박으로 구별한다. 치료는 대개 불가능하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">14.</span><span>창상성 심낭염 — 원인과 기전<span class="hang">제2위에서 이동한 금속 이물이 심낭을 뚫어 생기며 창상성 제2위복막염의 약 8%가 진행한다. 임신 말기 3개월과 분만 때 많다(원인 상세는 소화기 탭).</span><span class="hang">처음 천공 때 생기거나, 이물이 제2위벽 누관에 남았다가 나중에 뚫는다. 이물 없이 외상성 종격염에서 번지기도 한다. 섬유소성 마찰음 단계 뒤 삼출로 심음이 감약되고 심방·우심실이 눌려 울혈성 심부전이 온다. 2~3일 만에 심한 부종이 생기면 대개 일찍 죽는다.</span><span class="hang">많은 소가 7~14일 전 막연한 병을 앓다 나아 보인 뒤 심장 증상으로 다시 악화되는 2단계 경과를 보인다(이물이 흉강으로 넘어가며 복막 통증이 줄었다가 심낭 패혈증으로 악화).</span><span class="hang">드물게 철사가 관상동맥이나 심실벽을 찢어 혈심낭으로 급사한다.</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>창상성 심낭염 — 임상증상<span class="hang">침울, 식욕부진, 잦은 와상, 급격한 체중감소, 등을 굽히고 팔꿈치를 벌린 자세, 얕은 복식호흡(40~50회/분)과 신음이 있다. 양측 경정맥 확장, 앞가슴·복부 부종이 흔하고 심하면 결막 부종이 눈꺼풀 위로 늘어진다. 경정맥 박동이 목 위쪽까지 보인다.</span><span class="hang">초기 발열 40~41°C, 심박 100회/분 내외와 작은 맥은 일정한 소견이다. 기갑 압박, 검상연골 뒤 촉진, 심장 부위 타진에서 통증성 신음과 탁음 영역 확대가 있다.</span><span class="hang">초기에는 마찰음, 며칠 뒤 삼출이 많아지면 심음 감약과 그르렁·첨벙·딸랑거리는 소리가 난다. 급성기에는 소리가 날마다 바뀌고 좁은 부위에서만 들릴 수 있어 양쪽을 모두 청진한다. 종격염의 흉막 마찰음은 훨씬 크고 심박이 덜 빠르다.</span><span class="hang">대부분 1~2주 안에 심한 부종, 호흡곤란, 수양성 설사, 와상으로 죽는다. 만성형은 전신반응 없이 경정맥 울혈, 심음 감약, 국소 첨벙음, 빈맥(90~100회/분)이 남아 다음 임신·비유를 견디지 못한다.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>창상성 심낭염 — 진단<span class="hang">혈액: 백혈구 16,000~30,000/µL, 호중구증가, 호산구감소. 10~14일 넘으면 알부민 감소와 글로불린 증가로 총단백이 높고, 섬유소원 증가는 모든 시기에 있다.</span><span class="hang">심낭천자: 좌 제4~5늑간 심음 최강점에서 10 cm 18 G 바늘(Constable), 또는 좌 제5늑간 팔꿈치 바로 위에서 18 G 8.75 cm 척수침(Rebhun). 지속 배액은 20 Fr 흉강 투관침을 쓴다. 액은 혼탁하고 후산정체 자궁염 같은 악취가 나며 이것으로 진단된다. 정상 심낭액은 단백 2.5 g/dL 미만, 백혈구 5000/µL 이하다. 기흉, 치명적 부정맥, 심장 천자, 흉막염 위험이 있어 초음파 유도와 심전도 감시하에 한다.</span><span class="hang">초음파: 섬유소 조각과 가스 음영이 섞인 불균질한 저에코 심낭액, 확장기 심실 허탈·수축기 심방 허탈 같은 압전 소견. 서서 찍은 측면 방사선에서 횡격막을 넘은 이물과 기포-액면이 보이면 확진이다.</span><span class="hang">심전도: 동성빈맥, 흉수가 동반된 우심부전에서 QRS 진폭 감소(흉수 없는 심낭수 단독은 오히려 진폭 증가).</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>심낭삼출의 감별<table class="bxt
