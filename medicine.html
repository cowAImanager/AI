<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>지간 과형성(지간 섬유종)<span class="hang">지간 인대가 느슨한 유전성 체형에 동반되거나 만성 지간 피부염 자극으로 생긴다. 홀스타인, 무거운 소, 수소의 뒷발에 많다. 그 자체는 아프지 않으나 커져서 끼거나 궤양·2차 감염이 생기면 절고, 부제병 위험을 높이며 지피염 병소가 된다.</span><span class="hang">젖소 대부분은 지간 피부염 관리 부실의 반영이므로 일상 삭제 때 떼지 말고 원인을 다룬다. 통증 원인이면 섬유종과 지간 지방을 함께 수술로 제거하되 원위지간관절낭과 십자인대를 다치지 않게 하고, 발가락이 벌어지지 않게 붕대한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">39.</span><span>구제역 — 발굽 병변<span class="hang">잠복기 3~6일 뒤 유량 급감과 40~41℃ 고열, 구내염이 오고 지간열과 제관에 수포가 생긴다. 수포가 터지면 심한 파행과 제관 종창으로 자주 눕고, 2차 세균 감염은 심부로 퍼질 수 있다.</span><span class="hang">유두 수포가 농가가 처음 보는 소견일 수 있었으며 2010~2011년 한국 유행이 그 예다. 어린 소는 수포 없이 심근 손상으로 폐사할 수 있다.</span><span class="hang">제관염에 의한 급성 파행이 집단 발생하면 구제역을 의심하고 반드시 구강을 본다. 감별은 수포성 구내염, 소바이러스성설사, 악성카타르열이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">40.</span><span>맥각중독·페스큐 중독 — 사지 괴저<span class="hang">맥각균(Claviceps purpurea) 균핵이 많은 곡류·목초를 오래 먹으면 에르고타민 등이 세동맥 연축과 내피 손상을 일으켜 말단이 괴저된다. 오염 목초는 대개 2~4주 뒤 절기 시작하며, 괴저형은 추운 계절에 나타난다.</span><span class="hang">뒷다리 하부, 꼬리, 귀가 발적·종창·냉감·감각 소실을 보이다 청흑색으로 마르고 떨어져 나간다. 통증은 없으나 초기부터 약간 절고 설사가 동반되기도 한다.</span><span class="hang">톨페스큐 내생균의 에르고발린에 의한 페스큐 족(fescue foot)은 추운 날씨에 방목 10~14일 안에 심한 파행, 2주 뒤 발가락·꼬리 괴저를 일으키며 무리의 10%까지 걸린다.</span><span class="hang">사료·조직 알칼로이드 분석으로 확진하고 동맥 혈전, 외상, 균혈증, 동상과 감별한다. 즉시 오염 사료를 끊고, 맥각 감염 이삭은 사료의 0.1%를 넘지 않게 하며 임신우에는 먹이지 않는다.</span><span class="hang">한우 송아지 뒷다리 말단 괴사가 집단 발생한 예가 있고 어미젖을 통한 곰팡이독소 섭취로 추정하나 대부분 원인을 못 밝혔다. 어미 사료에 곰팡이독소 흡착제를 넣으며 치료법은 없다(한우송아지질병관리핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>화농성 관절염·감염성 건초염 — 원인<span class="hang">신생 송아지에 가장 흔하며 균혈증·패혈증 뒤 관절에 정착하고, 초유 이행 실패 송아지가 특히 취약하다.</span><span class="hang">송아지는 제대정맥염에 의한 관절병(Trueperella pyogenes, 괴간균, 포도상구균), 대장균, Salmonella Dublin·Typhimurium, Mycoplasma bovis가 원인이다. 3~6개월 마이코플라스마 관절염은 대개 폐렴을 동반한다.</span><span class="hang">성우는 Histophilus somni 활막염, 근위지간관절 천공창(T. pyogenes), 부제병의 관절 확산, 유방·자궁 감염과 심내막염·폐렴·간농양의 혈행 전파가 원인이다.</span><span class="hang">송아지가 일어날 때 거친 바닥에 긁힌 앞무릎 상처에 분변이 오염되어 생기는 경우가 흔하다(한우송아지질병관리핸드북).</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>병태 발생과 임상증상<span class="hang">혈행성은 먼저 활막염이 생기고 이어 연골과 뼈가 침범되므로, 활막염 단계에서 감염을 없애야 손상이 적다. 진행하면 판누스, 연골 미란, 연골하 골수염이 생기고 만성기에 강직이 올 수 있다.</span><span class="hang">땅을 딛지 않을 정도의 파행, 열감, 촉통, 수동 운동 거부가 있고 발열은 대개 39.4~40.0℃로 낮다. 비절, 무릎(stifle), 완관절이 가장 흔하다. 송아지는 여러 관절이 걸리고 간·심내막·뇌막 병변이 함께 있을 수 있다.</span><span class="hang">아픈 다리를 편 채 옆으로 눕는다. 다발성 관절염 소는 오래 누워 2차 굴건 구축이 생기기도 하며, 방치하면 관절이 터지거나 욕창으로 폐사한다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>진단 — 관절천자와 활액<span class="hang">무균 관절천자와 활액 분석이 핵심이며 항생제 전에 한다. 점조한 고름은 16~18G, 만성 T. pyogenes 감염은 14G 바늘이 필요하다.</span><table class="bxt"><tr><th>활액</th><th class="c">정상</th><th class="c">퇴행성 관절병</th><th class="c">감염성 관절염</th></tr><tr><td>외관</td><td class="c">무색 투명</td><td class="c">담황색, 섬유 부유물</td><td class="c">혼탁 황색</td></tr><tr><td>백혈구(/μL)</td><td class="c">&lt;250</td><td class="c">250~1,000</td><td class="c">50,000~150,000</td></tr><tr><td>호중구(%)</td><td class="c">7</td><td class="c">10~15</td><td class="c">80~90</td></tr><tr><td>총단백(g/dL)</td><td class="c">1.2~1.8</td><td class="c">1.6~1.8</td><td class="c">3.2~4.5</td></tr></table><span class="hang">백혈구 30,000/μL 초과, 총고형분 3.0g/dL 초과면 패혈성으로 본다(Rebhun). 세균성은 변성 호중구가 많으나 급성 마이코플라스마는 호중구가 보존된다. 마이코플라스마 고름은 치즈 같고 냄새가 없고, T. pyogenes는 혐기성 악취가 난다.</span><span class="hang">배양 양성률은 40~75%이며 음성이라도 세균성을 배제하지 못한다. 방사선 변화는 2~3주 뒤에 나타나므로 급성기에는 활액, 만성기 예후 판정에는 방사선이 유용하다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>치료<span class="hang">급성 패혈성 관절염은 응급이며 항생제만 쓰면 성공률이 낮다. 14G 바늘 두 개를 관절 반대편에 꽂고 데운 젖산링거액이나 생리식염수 관절당 1~2L를 흘려보내며, 첨가해도 안전한 소독제는 0.1% 포비돈요오드뿐이다. 1~2주에 3~7회 반복한다.</span><span class="hang">반응이 없으면 관절 절개와 배액관으로 연속 배액하며, 만성 T. pyogenes 감염 송아지는 절개 배농이 필요하다.</span><table class="bxt"><tr><th>약물</th><th class="c">용량·비고</th></tr><tr><td>세프티오푸르</td><td class="c">1mg/kg 정맥 12시간마다 20일 + 세척(실험 대장균 관절염)</td></tr><tr><td>마르보플록사신</td><td class="c">4mg/kg 근육 매일 10일(송아지)</td></tr><tr><td>암피실린 삼수화물</td><td class="c">10mg/kg 근육</td></tr><tr><td>플로르페니콜</td><td class="c">40mg/kg 비경구; 정맥 국소 관류 2.2mg/kg</td></tr><tr><td>툴라스로마이신</td><td class="c">2.5mg/kg</td></tr></table><span class="hang">옥시테트라사이클린, 페니실린, 트리메토프림-설파디아진은 송아지 관절에 잘 들어간다. 기간은 최소 2주, 경험적으로 3주이며 마이코플라스마 의심 시 베타락탐을 단독으로 쓰지 않는다.</span><span class="hang">관절 내에는 젠타마이신 500mg, 아미카신 125mg, 세파졸린 500mg을 쓰나 아미노글리코사이드는 휴약이 길어 식용동물에 부적합하다. 지혈대 아래 정맥 국소 관류로 세파졸린을 주면 관절에 치료 농도가 나온다.</span><span class="hang">NSAID와 최소 3~4주 우방 안정을 한다. 만성은 무균 강직이 유일한 목표다. 제대정맥염에 의한 다발성 관절염은 제대를 먼저 치료하며 예후가 대개 나쁘다.</span><span class="hang">화농되지 않고 붓기만 했으면 관절강에 바늘을 넣지 말고 페니실린계와 단백분해 소염제를 1주 이상 준다는 기술도 있다(한우송아지질병관리핸드북).</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>예후와 예방<span class="hang">급성·단일 관절·원인 교정 가능 시 좋고 주관절 같은 상부 관절은 나쁘다. 마이코플라스마는 반응이 나빠 몇 주 절 수 있고 H. somni 활막염은 빨리 반응한다. 무릎 파행 소에서 패혈성 관절염은 22%만 정상화되었다.</span><span class="hang">초유를 일찍 충분히 먹이고 제대를 소독하며 깔짚을 충분히 깔아 무릎 상처를 막는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">46.</span><span>관절수종과 부종(송아지)<span class="hang">혈행성 세균 감염으로 보통 2개 이상 관절이 붓고 열감이 있으며 관절낭에 고름이 차 기립불능이 되기도 한다. 광범위 항생제·소염제와 강옥도 도포를 하고 고름은 배농 후 항생제를 주입한다(한우송아지질병관리핸드북).</span><span class="hang">부종은 병원균, 타박, 내부 질환으로 조직액이 피하에 고이는 것으로 송아지는 다리 부종이 흔하다. 화농 시 배농, 항생제·소염제 2~3일을 쓰고 백신 과민 부종에는 에페드린을 준다.</span><span class="hang">완관절 앞면 단순 타박은 패혈성처럼 붓고 아플 수 있으므로 소염제·붕대·사육 환경 개선으로 치료하며 드문 패혈성 완관절염과 구별한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">47.</span><span>퇴행성 관절병(골관절증)·골연골증 — 원인<span class="hang">관절연골 변성·미란, 연골하골 상아질화, 가장자리 골증식이 특징인 비감염성 질환이다. 골연골증은 관절연골 심층과 성장판의 연골내 골화 결함이다.</span><span class="hang">유전 소인, 형태 결함(지나치게 곧은 뒷다리), 급성 외상(종모우 무릎 십자인대), 노화, 영양(구루병·골연화증, 인 결핍), 불소증, 과거 패혈성 관절염, 수소 과영양이 원인이다. 고관절병은 9개월령 어린 육우 수소에서도 생긴다.</span><span class="hang">골연골증은 콘크리트 바닥에서 운동 없이 빨리 자라는 소와 고에너지 비육장 소에 생기며 무릎관절이 가장 흔하고 연골하 골낭종이 흔한 발현이다.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>임상증상과 진단<span class="hang">몇 주~몇 달에 걸쳐 심해지고 치료에 반응하지 않는 만성 파행이다. 경직 보행, 다리 간 체중 이동, 유량 감소, 긴 횡와가 있고 일시 호전 후 재발한다. 근위축으로 관절 돌기가 두드러지고 관절낭 촉통은 대개 없으며 무릎에 염발음이 있다.</span><span class="hang">종모우 고관절병 초기에는 성욕은 있으나 승가를 꺼린다. 골연골증은 임상 파행이 40% 미만이어도 방사선상 88%가 양측성이다.</span><span class="hang">활액은 특이 소견이 없거나 비패혈성 염증이고, 방사선상 연골 미란, 연골하골 경화, 골증식체가 보인다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>치료와 예후<span class="hang">대개 진행성이라 식용동물은 도태한다. NSAID로 생산을 유지할 수 있고 종모우는 전기사정으로 채정을 계속할 수 있다. 관절 내 코르티코스테로이드는 일시 완화를 주나 연골 미란을 가속한다.</span><span class="hang">무릎 연골하 골낭종 소는 75%가 원래 용도로 돌아갔다. 예방은 출생 후 3개월 과영양 회피, 운동, 충격을 줄이는 바닥, 체형이 좋은 종축 사용이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">50.</span><span>골수염·부골 — 원인<span class="hang">혈행성, 인접 감염 확산, 외상·수술로 생긴다. 1개월 미만 송아지와 6~12개월 육성우에 많고, 소 445례에서 혈행성이 외상성보다 3.2배 많았으며 T. pyogenes가 가장 흔했다.</span><span class="hang">성장판형은 6개월 이상 소에 T. pyogenes로 중수·중족·요골·경골 원위에, 골단형은 12주 미만 송아지에 살모넬라로 대퇴골 원위 과·슬개골·요골 원위에 생긴다.</span><span class="hang">부골은 하지 뼈를 덮는 연부조직이 얇아 외상 후 피질 허혈과 세균 침입으로 생기며 6개월~2세 소의 제3중수·중족골에 가장 흔하다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>임상증상·진단·치료<span class="hang">파행, 종창, 촉통, 만성 배농 누관이 있고 항생제를 끊으면 재발한다. 경추(4~6번) 골수염은 목을 굽히지 못해 무릎 꿇고 먹으며 치료 반응이 없다. 2~9주 송아지의 경흉추(C6~T1) 골수염은 앞다리 무릎 꿇기를 보이며 S. Dublin이 흔하다.</span><span class="hang">방사선이 필수이며 부골은 수술, 골수염은 내과 치료나 안락사를 결정하므로 구별한다. 배양은 누관 분비물보다 수술로 얻은 부골과 인접 조직이 정확하다.</span><span class="hang">내과 치료만으로는 성공이 드물어 부골, 괴사 조직, 누관을 수술로 제거한다. 항생제는 최소 10일, 이상적으로 소파 후 4~6주이며, 지혈대 아래 정맥 국소 관류(페니실린G칼륨, 세프티오푸르, 30분 유지)도 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>골절 — 일반 원칙<span class="hang">폐쇄 골절은 비부하 파행, 다리 변형, 염발음으로 진단하며 복잡 골절의 예후 판정에는 방사선이 필요하다. 송아지가 성우보다, 폐쇄가 개방보다 예후가 좋다.</span><span class="hang">상부 골절은 경제성이 되면 전원한다. 상완골은 우방 안정만으로 낫는 경우가 많으나 대퇴·경골·요척골은 고정 없이 잘 낫지 않는다. 완관절·비절과 요척골 원위는 전지 깁스, 경골·대퇴골은 토머스 부목이나 내고정이 좋다.</span><span class="hang">전원 시 골절 위 관절을 넘는 부목·깁스를 해 수송한다. 육성우 무리의 집단 골절은 칼슘·인·비타민D 영양 평가가 필수다.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>성장판 골절과 송아지 골절<span class="hang">어린 반추동물의 중수·중족 성장판 골절이 가장 흔한 자연 골절이다. 젖소에서는 프리스톨 미경산우가 일어날 때 앞다리가 칸막이 밑에 끼어 중수골이 부러지며 원위 골단이 항상 포함된다. 자일라진 진정 후 발굽부터 요골 원위 위까지 섬유유리 깁스를 하고 4~6주에 풀며 예후는 매우 좋다.</span><span class="hang">산과 사슬이 중수부에 잘못 걸린 강제 견인은 신생 송아지 중수·중족 원위 골절을 일으키며, 골절 원위가 차가우면 예후가 매우 나쁘다. 앞 태위 기계 견인은 송아지 대퇴골 과상부 골절을 일으킨다.</span><span class="hang">한우 송아지는 큰 소에게 밟히거나 파이프에 끼어 단순 골절이 흔하다. 관절 굴곡을 따르는 연철 부목과 석고 붕대로 깁스하고 항생제·소염제 5일, 30~40일 뒤 푼다. 밀사를 피하고 송아지 전용 방을 둔다(한우송아지질병관리핸드북). 깁스를 너무 오래 두면 욕창과 골수염이 생긴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">54.</span><span>구루병(rickets) — 원인과 증상<span class="hang">성장 중인 뼈의 무기질화 실패로 칼슘·인·비타민D의 절대·상대 결핍이 원인이며 빠른 성장이 악화시킨다. 송아지는 인 결핍 방목지의 인 결핍과 장기 실내 사육의 비타민D 결핍이 흔하다.</span><span class="hang">경직 보행, 앞다리 관절과 늑연골 접합부 종대, 완관절에서 앞·바깥으로 휜 장골, 긴 횡와가 특징이다. 이 맹출이 늦고 빨리 닳으며 턱뼈가 물러져 입을 다물지 못하기도 한다. 집약 사육 어린 소는 아킬레스건 파열과 자연 골절이 생길 수 있다.</span><span class="hang">초기 증상은 다리를 바꿔 가며 저는 이동성 파행이며, 비육장 어린 소의 골이영양증에서는 비복근 부착부 분리가 가장 흔하다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>구루병 — 진단과 치료<span class="hang">알칼리성 포스파타아제가 흔히 오르고 인·비타민D 결핍이면 혈청 인이 3mg/dL 아래다. 25-수산화비타민D는 정상(5ng/mL 초과)보다 크게 낮고, 인 결핍형은 정상~높다. 요 Ca:P 0.05 미만은 칼슘·비타민D 결핍, 1 초과는 인 결핍을 시사한다.</span><span class="hang">방사선상 장골 끝이 좀먹은 듯하고 오목·평평하다. 정상 뼈 회분:유기물 3:2가 구루병에서 1:2~1:3으로 낮아지며, 회분이 뼈 무게의 45% 미만이면 골이영양증을 시사한다.</span><span class="hang">구리 결핍(중수·중족 원위 종대, 혈장·간 구리 저하), 집약 사육 육성우의 괴사성 골단염과 감별한다. 칼슘·인·비타민D에 반응이 없으면 구리 결핍, 불소증을 생각한다.</span><span class="hang">인산이칼슘을 하루 요구량의 3~4배로 6일 경구 투여해 10일째까지 요구량으로 줄이고 비타민D 10,000IU/kg을 1회 주사한다. 큰 변형은 남는다.</span><span class="hang">비타민D 11,000IU/kg 1회로 3~6개월 유지된다. 비경구 비타민D3 1,500만~1,700만IU는 고칼슘혈증과 2~3주 뒤 식욕부진·기립불능·높은 치사율을 일으키며 분만 1개월 전 임신우가 더 민감하다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>골연화증(osteomalacia)<span class="hang">성숙 동물에서 비유·임신의 소모가 소인이며 인 결핍 지역 소에 주로 생기고, 비육장에서는 칼슘·비타민D 없이 인만 과다할 때 생긴다.</span><span class="hang">초기에는 생산성 저하와 이식증이 있고 이후 경직 보행, 다리를 바꾸는 파행, 걸을 때 딱딱 소리, 등 굽음이 오며 다유량 소에서는 '유량 파행(milk lameness)'이라 한다. 계기 없이 골절과 건 부착부 분리가 생기고, 보정만으로도 척추·골반 골절이 생겨 기립불능이 되기도 한다.</span><span class="hang">알칼리성 포스파타아제 증가, 혈청 인 감소, 뼈 밀도 감소가 보인다. 만성 불소증(이빨 반점, 골간 융기)과 감별하며 호전까지 몇 주 걸리고 변형은 영구적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">57.</span><span>백근병(영양성 근변성) — 원인과 역학<span class="hang">셀레늄·비타민E 결핍에 다불포화지방산 같은 조건 요인이 더해져 생기며, 겨우내 결핍 사료를 먹은 어미의 빨리 자라는 송아지가 잘 걸린다. 겨울 사육 후 방목, 장거리 보행, 백신 접종·제각 같은 소란이 계기가 된다.</span><span class="hang">6개월 미만 송아지에 가장 흔하지만 2세까지 생기며 1년생, 12~18개월 비육우, 결핍 식단의 분만 미경산우에서도 발생한다. 셀레늄은 대구 간유 급여 송아지의 근이영양증은 막지 못한다.</span><span class="hang">셀레늄 0.5mg/kg 미만 토양의 작물은 0.05mg/kg 건물 미만이 되기 쉽다. 시판 사료에 셀레늄이 첨가된 미국에서는 주로 소규모 농가 송아지에서 보이며, 한우 송아지에서는 거의 발생하지 않는다는 기술이 있다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>기전<span class="hang">셀레늄 의존 글루타치온과산화효소(GSH-Px)와 비타민E가 부족하면 근섬유막 지질 과산화로 근섬유가 초자 변성·괴사하고 석회화된다.</span><span class="hang">어린 송아지는 심근·횡격막형이 많아 급사하고 치료에도 잘 죽으며, 나이 든 송아지와 1년생은 골격근형이 많아 기립불능을 보이고 치료에 반응한다. 대퇴이두근이 특히 잘 걸린다. 어린 송아지는 근육 마이오글로빈이 적어 중증이어도 소변이 정상일 수 있다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>임상증상<span class="hang">급성형은 운동 뒤 쓰러져 급사하거나 갑자기 거품 섞인·혈성 콧물을 동반한 심한 호흡곤란이 온다. 세우면 축 늘어지나 정신·반사는 정상이고, 심박수 150~200회/분과 부정맥, 호흡수 60~72회/분이 있으며 6~12시간 안에 죽는다. 집단 발생 시 15%까지 급성형이 되고 치사율은 100%에 가깝다.</span><span class="hang">아급성형이 가장 흔하다. 일어서지 못하거나 서도 경직·떨림으로 몇 분을 못 버티며 걸을 때 비절이 회전한다. 세우면 몇 초 안에 떨리고 머리가 처진다. 근육이 대칭으로 커질 수 있으나 대개 무르고, 식욕이 남아 붙잡아 주면 젖을 빤다. 치료하면 3~5일 안에 걷는다.</span><span class="hang">신생 송아지는 혀만 침범되어 빨지 못하거나, 인두·호흡근 침범으로 흡인성 폐렴과 호흡곤란이 생겨 폐렴으로 오인된다.</span><span class="hang">봄 방목 직후 18~24개월 미경산우에서 양쪽 복거근 파열로 견갑골이 척추 위로 솟는 '나는 견갑골'이 집단 발생한다. 1년생의 '마비성 마이오글로빈뇨'는 방목 1주 안에 경직, 기립불능, 마이오글로빈뇨를 보인다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>진단<span class="hang">CK는 소에서 반감기 2~4시간이지만 약 3일간 지표가 된다. 정상 26±5IU/L인데 백근병은 대개 1,000IU/L 초과, 흔히 5,000~10,000IU/L다. AST는 3~10일 상승이 지속되며 급성 송아지 300~900IU/L(정상 100 미만)다. AST 상승에 CK 하강이면 변성이 멈춘 것이다. CK 1,000 초과, AST 대개 500IU/L 초과라는 기술도 있다(Rebhun).</span><span class="hang">확진은 전혈 셀레늄(헤파린)이나 GSH-Px(EDTA), 사후 간·신장 셀레늄이다. 적혈구 GSH-Px는 셀레늄 투여 4~6주 뒤에야 오르므로 최근 투여한 송아지도 평가할 수 있다.</span><table class="bxt"><tr><th>지표</th><th class="c">결핍</th><th class="c">경계</th><th class="c">정상</th></tr><tr><td>전혈 셀레늄(ng/mL)</td><td class="c">&lt;50</td><td class="c">50~100</td><td class="c">&gt;100</td></tr><tr><td>전혈 GSH-Px(mU/mg Hb)</td><td class="c">&lt;30</td><td class="c">30~60</td><td class="c">&gt;60</td></tr><tr><td>전혈 셀레늄(μg/dL, Rebhun)</td><td class="c">&lt;8.0</td><td class="c">8.0~12.0</td><td class="c">&gt;12.0</td></tr><tr><td>GSH-Px(U/g Hb, Rebhun)</td><td class="c">&lt;20</td><td class="c">20~30</td><td class="c">&gt;30</td></tr><tr><td>간 셀레늄(μg/g 건물)</td><td class="c">0.07~0.60</td><td class="c">0.45~0.90</td><td class="c">0.90~1.75</td></tr></table><span class="hang">성우 혈청 셀레늄 정상은 70~100ng/mL다. 혈청 토코페롤 2mg/L 미만, 간 α-토코페롤 5mg/kg 습중 미만이 결핍 임계치다.</span><span class="hang">부검 시 대칭성 골격근에 생선살 같은 흰 줄무늬, 송아지 좌심실 심내막 밑에 석회화된 흰 부위가 있다. 아급성형은 다발성 관절염, 흑각병, 골이영양증, 척수 압박, 유기인 중독, 곡류 과식 산증과 감별한다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>치료<span class="hang">셀레늄 3mg/mL(아셀렌산나트륨·칼륨)와 dl-α-토코페롤아세트산 150IU/mL 혼합액을 2mL/45kg 근육주사하며 대개 1회로 충분하다(Constable). 제조사 용량으로 3일 간격 3~4회까지 반복한다는 기술도 있다(Rebhun).</span><span class="hang">심근 중증형은 치사율 약 90%다. 같은 무리 모두에 같은 용량을 예방 투여하되 조심히 다룬다. 골격근형은 3일째부터 좋아져 1주 안에 걷는다.</span><span class="hang">과량은 중독사를 일으키므로 표지 용량을 지킨다. 표지 용량 0.055mg/kg은 치료에 충분하나 장기 보충에는 부족하다. 소의 독성 용량은 0.25~0.5mg/kg이다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>예방<span class="hang">임신우 사료에 셀레늄 0.1mg/kg 건물과 α-토코페롤 1g/두/일을 주고 비유기에도 잇는다. 성장 육우는 셀레늄 0.1mg/kg 건물과 α-토코페롤 150mg/두/일이다.</span><span class="hang">임신 후기 2/3와 비유 첫 달에 셀레늄 14.8mg/kg, 비타민E 2,700IU/kg 함유 광물질을 자유 섭취시키면 육우 송아지 백근병을 막는다. 젖소 완전배합사료 셀레늄은 0.3mg/kg 건물까지 허용되며 섭취 5~7mg/일이면 혈청 70~100ng/mL가 된다.</span><span class="hang">아셀렌산나트륨 주사 효과는 송아지에서 23일이면 사라진다. 바륨 셀레네이트 1mg Se/kg 피하는 5개월, 반추위 셀레늄 펠릿은 최대 2년 유지된다. 대부분 주사 제제는 비타민E가 부족하다.</span><span class="hang">송아지가 태어나면 셀레늄·비타민E 혼합제를 예방 투여하고 어미에게도 준다(한우컨설팅지침서, 한우송아지질병관리핸드북).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>근병증 일반 — 혈청 효소 해석<span class="hang">근병증은 비염증성 근변성으로 항상 양측성, 주로 뒷다리이며 근효소 상승과 마이오글로빈뇨가 흔하다. 환축은 대개 정신이 맑으나 아파 보인다.</span><span class="hang">CK는 반감기가 짧아 추가 변성이 없으면 3~4일에 정상화되고 AST는 며칠 높게 남는다. 매일 측정해 CK가 뚝 떨어지고 AST가 천천히 내려가면 변성이 멈춘 것, CK가 계속 높으면 진행 중이다. CK 1,000IU/L 이상은 대개 급성 원발 근병이고 500~1,000IU/L는 누운 동물에서 해석이 어렵다.</span><span class="hang">마이오글로빈 40mg/dL 초과 시 소변이 검게 변한다. 혈장 변색은 혈색소뇨를 시사하며 마이오글로빈은 혈청을 물들이지 않는다.</span><span class="hang">지지 치료는 15cm 이상 깔짚, 부드러운 바닥, 잦은 체위 변경, 신증 예방 수액이다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>운동성 근병증·주사부위 근염<span class="hang">셀레늄과 무관하게 몇 분간 미친 듯이 뛴 소가 쓰러져 일어나지 못하고 마이오글로빈뇨를 보이며 대개 죽는다. 진흙에 갇히거나 칸막이에 걸려 근육군이 파괴되면 젖산·칼륨 방출로 쇼크와 신경 증상이 온다(Rebhun).</span><span class="hang">급성 사지 근염은 심한 파행, 종창, 열감, 촉통과 독혈증이 있을 수 있다. 무증상 호산구성 근염은 육우 도체 폐기를 일으킨다.</span><span class="hang">주사부위 병변은 고급 부위 손실이 크므로 근육주사는 어깨 앞 경부에 하고 가능하면 피하 제형을 쓴다. 분만 직전 엉덩이에 유중수형 보조제 백신 2종을 놓은 뒤 기립불능·파행과 우군 50%에 최대 24cm 종창이 생긴 예가 있다.</span><span class="hang">송아지 대동맥·장골동맥 혈전증은 뒷다리 급성 마비, 냉감, 맥압 감소를 보이고 대개 폐사한다. 척수 외상, 척추체 농양, 백근병, 주사 신경 손상, 클로스트리디움 근염과 감별한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">65.</span><span>다운우 증후군 — 정의와 분류<span class="hang">뚜렷한 이유 없이 최소 24시간 일어서지 못하는 소다. 정신이 맑고 흉와를 유지하는 '각성 다운우'(대개 신경 손상, 골절, 고관절 탈구, 근손상)와 정신 둔화·생체징후 이상으로 흉와 유지가 어려운 '비각성 다운우'(저칼슘혈증, 패혈증, 복막염, 중증 지방간 등)로 나누며, 앞다리로 기는 소를 '기는 소(creeper)'라 한다.</span><span class="hang">진단은 칼슘을 2회 투여했는데도 24시간 이상 누운 소에서 다른 원인을 배제해 내린다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>원인과 위험요인<span class="hang">대부분 유열의 합병증이며 유열 증례의 3.8~28.2%가 다운우가 된다. 미국 조사에서 원인은 분만성 저칼슘혈증 19%, 분만 손상 22%, 미끄러짐·넘어짐 15%였고 육우는 분만 마비가 가장 흔했다.</span><span class="hang">유열 치료 전 기립불능이 6시간 미만이면 다운우 진행이 거의 없었고, 7~12시간 26%, 12~18시간 32%, 18시간 초과 38%였다(Fenwick).</span><span class="hang">회복률은 초산우 10.1%, 2~4산 17.7%, 5산 22.2%이고 비유 15일 미만 28.4%, 그 뒤 6.2%다. 24시간 미만 누운 소는 32%, 그 이상은 8.2%가 회복했다. 체형점수 4.0/5 초과는 위험이 4.3배이고 2.5 미만 소의 회복률은 8.1%였다.</span><span class="hang">오래 누운 소에서 낮은 혈청 인은 좋은 예후, 높은 인은 근손상에 따른 나쁜 예후와 관련된다. 이소플루프레돈 반복 사용에 의한 혈청 칼륨 2.0mmol/L 미만 저칼륨혈증도 원인이다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>병태 발생 — 구획 증후군과 압궤 증후군<span class="hang">6시간 넘게 누우면 조직 손상이 시작되므로 지속 기립불능은 응급이다. 압박은 주로 반건양근, 무릎 뒤 근육, 좌골신경과 그 분지(비골·경골신경)를 다치게 한다.</span><span class="hang">압박으로 정맥 유출이 막혀 구획 내압이 오르고, 두꺼운 근막이 팽창을 막아 저산소·부종의 악순환이 된다. 압궤 증후군은 CK·AST 급증, 칼륨·인 상승, 마이오글로빈뇨로 나타나고 급성 신부전을 일으킨다.</span><span class="hang">실험상 6~9시간이면 다리가 붓고 굳으며, CK는 6시간까지 정상이다가 12시간 평균 12,000U/L, 24시간 40,000U/L가 되고 단백뇨·마이오글로빈뇨는 12~36시간에 나온다.</span><span class="hang">일어나려 애쓰다 생기는 운동성 근병증이 더해진다. 다리가 벌어지면 내전근, 기는 소는 대퇴사두근, 반복 실패하면 비복근·반막양근-반건양근이 다친다. 약 10%에서 급성 국소 심근염이 생겨 칼슘 정맥주사에 나쁘게 반응한다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>임상증상<span class="hang">유열 치료 소의 약 30%가 24시간까지 일어서지 못한다. 대개 밝고 식욕이 있으며 체온 정상, 심박 80~100회/분일 수 있고 칼슘 정맥주사 직후 부정맥·급사가 있을 수 있다. 심한 단백뇨는 광범위 근손상을 뜻한다.</span><span class="hang">엉덩이를 20~30cm 이상 들지 못하는 소가 있고, 서서 구절이 과굴곡되면 비골신경 손상이다. 뒷다리를 양옆으로 팔꿈치까지 뻗은 자세는 내측 대퇴근 허혈을 일으키며 고관절 탈구와 관련될 수 있다.</span><span class="hang">중증은 머리를 젖힌 채 옆으로 누우려 하고 먹지 않는다(비각성). 유방염, 비절·팔꿈치 욕창, 들기 기구에 의한 요각 손상이 흔한 합병증이다.</span><span class="hang">잘 돌보면 약 50%가 4일 안에 선다. 7일 넘게 누우면 예후가 나쁘지만 10~14일 뒤 선 예도 있다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>임상 검사<span class="hang">나이·비유 단계, 기립불능 기간, 치료 내용(칼슘 과량, NSAID 용량), 최근 발정(승가 외상)을 묻는다. 초산우는 저칼슘혈증이 아니고, 4~5세 이상 BLV 양성우는 척수 림프육종 가능성이 있다.</span><span class="hang">유방(독성 유방염이 가장 흔한 전신 원인), 자궁, 소화기를 보고 소변으로 케톤과 마이오글로빈을 본다.</span><span class="hang">양쪽을 보려고 소를 굴린다. 무릎·고관절, 양쪽 비복근·건, 대퇴 뒤·둔부 근육을 촉진한다. 비절이 과굴곡되면 비복근, 과신전되면 제3비골근 손상이다. 다리를 움직이며 직장으로 골반 염발음과 폐쇄공 내 대퇴골두를 확인한다. 회음부 감각·꼬리 긴장 소실은 요추 림프육종이나 요천추 외상을 시사한다.</span><span class="hang">혈청 칼륨은 빨리 원심하지 않으면 거짓 상승한다. 칼슘·칼륨 결핍이 남은 채 일어나려 하면 큰 손상이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>예후 지표 — CK·AST<span class="hang">CK·AST는 18~24시간에 크게 오른다. 소 CK 반감기는 약 8~9시간(Constable) 또는 4~8시간(Rebhun)이므로 채혈 시점을 고려한다. 누운 직후 매우 높다가 24~48시간에 크게 떨어지면 근육 파열 같은 급성 외상, 중등도 상승이 유지·증가하면 지속 압박 손상이다. 24~48시간 누운 소는 CK, 7일 누운 소는 AST가 낫다.</span><span class="hang">누운 젖소 262두에서 비회복 예측 절단값은 CK 2,330, LDH 2,225, AST 171U/L였고 AST의 예측력이 가장 좋았으며 첫날 시료가 가장 좋았다.</span><table class="bxt"><tr><th>기립불능 일수</th><th class="c">회복 가능성 5% 미만이 되는 CK(정상 상한의 배수)</th></tr><tr><td>1</td><td class="c">50</td></tr><tr><td>2</td><td class="c">44</td></tr><tr><td>3</td><td class="c">38</td></tr><tr><td>4</td><td class="c">29</td></tr><tr><td>5</td><td class="c">23</td></tr><tr><td>6</td><td class="c">17</td></tr><tr><td>7</td><td class="c">10</td></tr></table><span class="hang">위 표는 Bovine Medicine(Clark 1987)이다. CK 100,000IU/L 초과나 AST 10,000IU/L 초과는 예후 불량이지만 그 밖에는 수치와 예후의 상관이 어렵고, 부유 치료 소에서는 CK와 생존이 상관없었다(Rebhun).</span><span class="hang">혈청 요소 25mmol/L 초과, 크레아티닌 130mmol/L 초과, 총단백:섬유소원 10:1 미만, 호중구 감소·좌방이동은 예후 불량이다.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>감별<span class="hang">각성 다운우는 저칼슘혈증, 분만 마비, 골·골반 골절, 고관절 탈구, 비복근 파열, 저칼륨혈증, 보툴리즘, 척수 림프육종과 감별한다.</span><span class="hang">비각성 다운우는 저칼슘혈증, 지방간, 대장균성 유방염, 독성 자궁염, 저마그네슘혈증, 쇼크, 복막염, 급성 반추위 산증, 제4위 염전, 저칼륨혈증, 보툴리즘, 수막뇌염, 대뇌피질괴사증과 감별한다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>치료 — 간호와 약물<span class="hang">원인을 치료하면서 2차 손상을 막는다. 예후는 간호의 질에 크게 좌우되며 콘크리트가 아닌 바닥으로 옮기는 것이 최우선이다. 짚을 깊게 깐 흙바닥이나 약 30cm 모래가 이상적이다.</span><span class="hang">최소 4~6시간마다 좌우로 굴리고 아래쪽 다리가 몸 밑에 뻗어 있지 않게 한다. 하루 5회 굴리고 2회 들어 올리라는 권고도 있다(Bovine Medicine). 다리가 벌어지는 소는 족쇄(hobble)를 채우고 완관절에 붕대를 감으며, 누운 자리에서 사료·물을 주고 착유한다.</span><span class="hang">NSAID(플루닉신, 멜록시캄)나 덱사메타손을 쓰며 반복 NSAID는 제4위 궤양을 주의한다. 초기에 덱사메타손 0.2~0.3mg/kg 정맥 1회를 쓰는 임상가도 있으나 임신우는 유산을 상의한다. 골반 통증에는 경막외 덱사메타손 5mg이나 모르핀 0.1~0.2mg/kg 12시간마다를 쓴다(Rebhun).</span><span class="hang">경구 수액은 삼킴 반사가 좋은 소에서 흉와 상태로만, 1회 40L 이하로 한다. 마이오글로빈뇨가 있으면 수액으로 용적을 늘린다. 경구 전해질로는 물 15~20갤런에 프로피온산칼슘 500g, 황산마그네슘 250g, 인산일나트륨 220g, 염화칼륨 150g을 섞어 쓴다.</span><span class="hang">셀레늄·비타민E 1회 투여는 해가 없다. 항생제는 유방염·폐렴 같은 적응증이 있을 때만 쓴다.</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>들어 올리기 기구<span class="hang">원칙은 소의 행동이다. 일어나려 하는 소는 미끄럽지 않은 바닥에서 꼬리 기부를 들어 돕는다.</span><span class="hang">엉덩이 들기 기구(hip lifter)는 요각에 빠르게 채워 들어 올리고 네 다리로 서면 20~30분 세워 둔 뒤 내리며 하루 1~2회 반복한다(Constable). 서면 1~2분 안에 풀거나 느슨하게 하고 5분을 넘기지 않는다는 기술도 있다(Rebhun). 두껍게 패딩하며, 체중을 싣지 않는 소는 몇 분 안에 내리고 매단 채 혼자 두지 않는다. 요각 손상·골절 위험으로 사용을 권하지 않는 저자도 있다.</span><span class="hang">슬링은 체중을 분산해 더 적합하나 설치가 번거롭고 끈 부위 욕창을 패딩으로 막는다. 일어나려 하고 세워 주면 서는 소가 최적이며 대개 하루 2번 1~5일이면 스스로 선다. 노력이 없는 소를 드는 것은 대개 실패한다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>부유 수조<span class="hang">37~38℃ 물을 빨리 채우면 40~50cm에서 흉와가 되고 1/2~2/3에서 대개 서려 한다. 35℃ 아래면 온수를 보탠다. 부유 시간은 6~8시간, 하루 16~18시간, 10시간 이하 등 기관마다 다르고 2~3일 뒤 경미한 제엽염이 생기기도 한다.</span><span class="hang">51두 성공률은 37%였다. 첫 부유 후 걸어 나간 소는 생존 가능성이 약 5배, 똑바로 선 소는 3배이고, 먹지 않은 소는 사망 가능성이 2배다. 3일째 이후에도 서지 못하면 예후가 매우 나쁘다.</span><span class="hang">건 파열, 골절, 고관절 탈구, 패혈성 관절염은 부적합하고 유열 후유 다운우가 가장 적합하다. 머리를 못 가누는 보툴리즘·중증 저칼륨혈증은 익사 위험이 있다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>예후 판단·안락사·예방<span class="hang">아픈 다리에 체중을 날마다 더 싣는 미세한 호전이 예후의 열쇠다. 밝고 일어나려 하며 자세를 자주 바꾸는 소는 설 가능성이 높고, 둔하며 움직이지 않고 자주 옆으로 눕고 뒷다리를 뒤로 뻗는 소는 예후가 나쁘다(Bovine Medicine).</span><span class="hang">안락사 기준은 예후 불량 질환, 반응 없는 통증, 며칠간 식욕 부진, 흉와 유지 불가, 간호 불가, 욕창·유방염 등 합병증, 간호에도 악화, 10일 넘게 치료 무반응이다.</span><span class="hang">유열은 누웠다면 1시간 안에 치료한다. 고위험 소는 분만 전후 12~24시간 관찰하고 칼슘 염을 경구 투여할 수 있다. 분만 전 깔짚 좋은 분만방에 두고 분만 후 48시간 이상 머물게 한다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>송아지 기립불능증<span class="hang">대사성 원인은 저칼슘·저마그네슘혈증, 쇠약, 소모성 질환, 백근증, 비타민A·콜린 결핍, 설사·독혈증, 중독, 구루병이고, 외상성 원인은 폐쇄·비골·대퇴신경 마비, 척수 압박, 고관절 탈구, 골절, 관절염이다. BVD·아까바네 같은 선천 감염은 치료가 안 된다(한우송아지질병관리핸드북).</span><span class="hang">분만 지연에 의한 저산소증 송아지는 기립·포유 불능, 호흡 촉박으로 2~3일 내 대부분 죽는다. 초유를 짜 먹이며 강심제를 주고 산소포화도가 95% 이상이어야 회복을 기대한다. 생시체중 17kg 이하 송아지는 젖을 짜 먹이며 격리 사육한다(한우컨설팅지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">77.</span><span>비복근 파열<span class="hang">파열되면 그 다리에 체중을 실을 수 없어 대개 예후가 절망적이다. 전형적 환자는 최근 저칼슘혈증을 앓은 성우로 미끄러운 바닥에서 반복해 일어나려다 생긴다. 진흙에 갇힌 어린 소, 트랙터 로더 사고도 원인이다.</span><span class="hang">비절 끝이 땅에 닿아 경골과 중족골이 90도를 이루는 '토끼 다리' 자세가 고전적이며 일으킬 때 반드시 뒤에서 관찰한다. 대개 근복 원위부에 혈종과 단단한 종창이 있고 건이 늘어진다. 양측 파열은 그냥 다운우로 보일 수 있어 다운우 검사 때 비복근 전장을 촉진한다.</span><span class="hang">부분 파열은 비절이 약간 처지고 단단한 종창이 있다. 성우 완전 파열은 거의 절망적이고, 세 다리로 서는 송아지는 좋은 바닥 우방에 몇 달 두며 비절 굴곡을 막는 가벼운 부목이 도움이 될 수 있다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>제3비골근 파열·굴건 열상<span class="hang">제3비골근 파열은 과도한 기립 노력이나 승가 중 미끄러짐으로 생긴다. 무릎이 굽어도 비절이 펴진 채로 있어 발끝을 끌며, 비절을 완전히 편 채 무릎을 굽힐 수 있으면 확진이다. 예후는 조심스럽지만 좋은 바닥에서 회복하는 소도 있다.</span><span class="hang">굴건 열상은 분뇨 스크레이퍼 날이 가장 흔한 원인이다. 천·심지굴건이 모두 끊기면 구절 뒤가 땅에 닿고 발끝이 들린다. 천지굴건만이면 압박 드레싱과 항생제 10~14일, 심지굴건까지면 송아지는 뒤꿈치를 2.5~3.75cm 높인 PVC 부목, 성우는 깁스를 6~12주 한다. 성우 예후는 기껏해야 보통이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>클로스트리디움 근염(흑각병·악성수종) — 원인<span class="hang">흑각병(blackleg, 기종저)은 Clostridium chauvoei에 의한 골격근·심근의 괴사성 근염이다. 악성수종(malignant edema)은 C. septicum, C. perfringens, C. sordellii, C. novyi 등이 상처로 들어가 생기며 혼합 감염이 흔하다. 포자는 토양에서 수년간 살아남는다.</span><span class="hang">흑각병은 '내인성'으로, 섭취한 포자가 근육과 간에 휴면하다 타박·저산소로 조직이 손상되면 발아하며 대개 외상력이 없다. 악성수종은 상처로 들어가는 '외인성'이다. 셀레늄 결핍에 의한 근괴사도 계기가 될 수 있다.</span><span class="hang">C. chauvoei와 C. sordellii가 치사율이 가장 높고 C. perfringens가 가장 낮다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>역학<span class="hang">흑각병은 6개월~2세의 빨리 자라고 영양 좋은 소에 가장 흔하다. 따뜻한 계절, 비가 많은 해, 침수 지역, 땅을 파헤친 뒤 발생하며 짧은 기간에 여러 마리가 걸리고 치사율은 100%에 가깝다. 좁은 출입구를 지나며 근육 타박을 입은 초산우의 겨울 집단 발생도 있었다.</span><span class="hang">악성수종은 근육주사(프로스타글란딘이 가장 흔하며 소독 부족·다회용 바이알·오염 주사기 탓), 단미, 거세, 분만 후 외음부 열상, 제대를 통해 생긴다.</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>임상증상<span class="hang">흑각병은 한쪽 다리 위쪽이 크게 부으며 심하게 전다. 침울, 식욕 절폐, 반추위 정지, 41℃ 고열, 맥박 100~120회/분이 있으나 열이 없을 수도 있다. 종창은 처음엔 뜨겁고 아프다가 곧 차갑고 무통이 되며 기종(염발음)이 만져지고 피부가 변색·건조된다. 12~36시간에 조용히 죽고 폐사한 채 발견되는 경우가 많다.</span><span class="hang">악성수종은 감염 6~48시간 뒤 상처 부위에 반죽 같은 종창, 발적, 심한 촉통이 생겼다가 피부가 검고 팽팽해진다. C. novyi는 기종이 없다. 41~42℃ 고열이 있고 24~48시간 안에 죽는다. 분만 감염은 외음부 종창과 적갈색 분비물이 골반·회음부로 퍼진다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>진단<span class="hang">종창 부위를 무균 흡인하면 장액혈성·갈색 액과 가스가 나오고, 그람 염색에서 큰 그람양성 간균을 보거나 형광항체 검사로 가장 빨리 확진한다. 혐기 배양용 근육은 냉장해 24시간 안에 보낸다. 사후 변화가 빨라 죽은 직후 검사한다.</span><span class="hang">혈액 검사는 진단적이지 않고, 병변 혈관이 막혀 CK·AST가 약간만 오르기도 한다.</span><span class="hang">흑각병 폐사우는 아픈 뒷다리를 뻣뻣이 뻗은 채 발견되고 빨리 부패하며 콧구멍·항문으로 혈성 거품이 나온다. 근육은 암적~흑색으로 붓고 썩은 버터 냄새와 기포 섞인 혈성 액이 있으며 절단면이 마르고 금속 광택을 띤다. 병변이 작을 수 있어 심장, 혀, 횡격막, 요근을 모두 보고 가죽을 다 벗긴다.</span><span class="hang">임상 소견으로 균종을 가릴 수 없다. 소 176례에서 C. chauvoei(단독·C. septicum 동반) 56%, C. novyi(단독·C. septicum 동반) 36%였다. 탄저, 낙뢰, 세균성 혈색소뇨증, 흑병(black disease), 급성 중독과 감별한다.</span></span></p><p class="bx-num"><span class="bxn">83.</span><span>치료<span class="hang">결정 페니실린G 나트륨·칼륨 40,000~44,000IU/kg 정맥 4~8시간마다로 시작해 지속형으로 잇는다. 근육·피하 44,000U/kg 1일 2회도 쓰며 병변 근위부에 직접 주사하기도 한다.</span><span class="hang">피부와 근막을 절개해 개창하고 과산화수소로 세척해 혐기 환경을 깬다. 플루닉신 2.2mg/kg 정맥 24시간마다, 케토프로펜 3mg/kg 근육 24시간마다, 멜록시캄 0.5mg/kg 1회 등 NSAID와 수액을 쓰고, 쇼크에는 코르티코스테로이드를 1회만 쓴다. 항독소는 아주 초기에만 의미가 있다.</span><span class="hang">항생제는 1~4주 필요하고 괴사 근육이 떨어져 장기 상처 관리가 필요하며 회복률은 낮다.</span></span></p><p class="bx-num"><span class="bxn">84.</span><span>예방<span class="hang">상재 농장은 3~6개월령 모든 소에 4주 간격 2회 접종 후 매년 위험 시기 직전에 보강한다. 모체 면역이 최소 3개월 지속되어 그 전 접종을 방해하므로 4개월 미만에 접종했으면 4개월 이후 다시 한다. 면역이 짧아 6~8개월마다 보강하라는 기술도 있다(Large Animal IM).</span><span class="hang">최소 C. chauvoei, C. septicum, C. novyi를 포함한 다가 백신을 쓴다. 대개 3세 미만만 접종하나 고위험 농장은 평생 접종한다.</span><span class="hang">집단 발생 시 남은 소를 즉시 접종하고 페니실린(44,000IU/kg 근육 1일 1회 3일)을 주며 목장을 옮긴다. 항생제를 주지 않으면 면역이 생기는 14일까지 새 증례가 나온다. 사체는 소각하거나 깊이 묻는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">85.</span><span>송아지 굽은 발굽(굴건 구축) — 원인<span class="hang">신생 송아지 근골격 이상 중 가장 흔하며 대개 선천성 굴건 단축으로 앞다리·양측이 많다. 임신 중 루핀 급여, 아까바네 바이러스, 로코초, 망간 결핍, 유전성 관절 강직도 원인이다.</span><span class="hang">아까바네가 임신 4~6개월에 감염되면 척추·목·다리 관절이 뒤틀린 송아지, 6~7개월이면 발목 관절 근육이 위축된 송아지가 태어난다. 츄잔 바이러스가 임신 2~4개월에 감염되면 허약 송아지가 나고 다리가 O자로 휘기도 한다. 17kg 이하 미숙 송아지와 백근병도 굽은 발굽·기립불능을 보인다(한우컨설팅지침서).</span><span class="hang">후천성은 패혈증, 백근병, 다발성 관절염, 신경 질환으로 오래 누워 있을 때 생기며 육성우는 외상이나 제엽염 뒤 앞다리에 생긴다.</span></span></p><p class="bx-num"><span class="bxn">86.</span><span>증상과 감별<span class="hang">구절에서 꺾여 발끝으로 서거나 심하면 구절 등쪽으로 선다. 일어서지 못해 초유를 충분히 못 먹으므로 제대 감염, 다발성 관절염, 수막염 위험이 크다.</span><span class="hang">관절굽음증(arthrogryposis)은 마취해도 펴지지 않고 건 절단으로도 교정되지 않는 절망적 상태라 반드시 배제한다.</span></span></p><p class="bx-num"><span class="bxn">87.</span><span>치료와 예방<span class="hang">단순 선천성은 발가락을 자주 펴 주고 서서 운동하게 하는 물리치료로 충분하며 가벼우면 저절로 낫는다. 반응이 없으면 솜 위에 PVC 부목을 대고 매주 갈며 더 편다. 부목이나 링 깁스를 7~10일 둔다는 기술도 있다. 나이가 들수록 반응이 떨어지므로 일찍 치료한다.</span><span class="hang">실패하면 천지·심지굴건을 절단하고 몇 주 깁스한다. 둘 다 잘라야 하면 예후가 나쁘다. 망아지에 쓰는 고용량 옥시테트라사이클린은 소에서 효과가 덜하고 급성 신부전 위험이 크다.</span><span class="hang">심한 바이러스성 기형은 치료법이 없고, 한두 다리가 조금 굽은 정도면 압박 붕대나 부목으로 회복될 수 있다. 어미는 다음 해 정상 분만하므로 도태할 필요가 없다. 아까바네 생백신을 매년 3~4월 모기 발생 전에 접종하고 모기를 막는다. 츄잔병 백신은 아직 없다(한우컨설팅지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">88.</span><span>수소 파행 — 번식학 영양 탭에서 옮긴 보충 · 자연교배 수소의 파행<span class="hang">젖소 농장 자연교배 수소의 파행은 사료·축사·바닥·싸움의 복합 결과다. 비유우 사료는 에너지·단백·칼슘이 수소 유지 요구량을 초과해 과잉 에너지는 제엽염, 과잉 칼슘은 골격 병변을 일으킨다. 교배기 중 휴식·교대를 권장한다.</span></span></p><p class="bx-num"><span class="bxn">89.</span><span>수소 비복근 파열의 소인<span class="hang">과급여에 의한 과도 증체, 광물 보충 부족(품종별 요구 차이로 악화), 황 함량 높은 주정박류 급여, 골격이 성숙할 시간 부족. 과다 급여는 급속한 골격 성장(나선형 발톱)을 부른다.</span></span></p></div>
</div>
`;
}
function med_skinHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 피부·눈</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>피부 검사 원칙 — 일차성·이차성 구분과 검사 순서<span class="hang">피부병은 병변이 처음 피부에 국한되는 일차성과 다른 장기 병의 피부 증상인 이차성으로 나뉜다. 철저한 전신검사에서 다른 장기 이상이 없으면 일차성으로 본다.</span><span class="hang">병력 청취와 전신검사를 먼저 하고 피부를 시진·촉진한다. 필요하면 세균검사 면봉, 피부사상균·외부기생충 검사용 긁어내기(scraping), 조직검사용 생검을 한다.</span><span class="hang">생검은 병변부·경계부·정상부를 함께 포함한다. 비대표 부위 채취, 겸자에 의한 압궤, 고정 불량이 흔한 인공산물이다.</span><span class="hang">병변은 크기, 깊이, 체표 분포, 침범 범위, 피지·땀 분비 이상, 피모 변화, 피부색·온도, 통증·가려움 유무로 기술한다. Wood 등은 피부사상균 검사에 쓰지만 많은 Trichophyton은 형광을 내지 않는다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>주요 피부 병변 용어<table class="bxt"><tr><th>병변</th><th>성상</th></tr><tr><td>인설(scale)</td><td>마른 비늘 모양 박리, 표면에만 있음</td></tr><tr><td>과각화(hyperkeratosis)</td><td>각질 과다 증식, 표면은 손상 없음</td></tr><tr><td>착각화(parakeratosis)</td><td>핵이 남은 각질세포가 피부에 붙어 남음</td></tr><tr><td>수포(vesicle)</td><td>장액이 찬 1~2 cm 물집</td></tr><tr><td>농포(pustule)</td><td>고름이 찬 1~5 mm 물집, 터짐</td></tr><tr><td>팽진(wheal)</td><td>부종성·홍반성 일시적 융기</td></tr><tr><td>구진(papule)</td><td>1 cm까지, 중심 괴사가 있고 터짐</td></tr><tr><td>결절(nodule)</td><td>1 cm까지 단단한 융기, 괴사 중심 없음</td></tr><tr><td>가피(crust)</td><td>혈액·고름·피부 부스러기의 응고물</td></tr></table></span></p><p class="bx-num"><span class="bxn">3.</span><span>가려움의 의미<span class="hang">가려움은 표피 감각이라 표피가 없는 깊은 궤양 중심이나 털·각질만 침범하는 링웜 같은 아주 얕은 병변에서는 생기지 않는다. 점막피부 경계에서 가장 심하다.</span><span class="hang">소에서 흔한 원인은 개선충·피선충 옴, 이, 신경형 케토시스, 오제스키병(가성광견병)이다. 모든 종에서 광과민증 초기와 두드러기 팽진도 가렵다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>피부병 치료 원칙<span class="hang">국소·전신 치료를 고르기 전에 정확히 진단하고 원인을 찾는다. 약이 피부에 닿도록 털과 부스러기를 치운다. 세균성은 감수성 검사를 권하고 무분별한 항균제 사용은 피한다.</span><span class="hang">알레르기·광과민증처럼 원인 제거가 어려우면 대증 치료만 가능하다. 항염증 치료는 이후 진단을 어렵게 할 수 있다.</span><span class="hang">보조 치료는 정균 연고·드레싱으로 2차 감염 예방, 긁기 방지, 넓은 병변의 체액·전해질 보충, 함황 아미노산을 포함한 단백질 공급이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>피부사상균증(버짐병, 윤선, ringworm) — 원인과 역학<span class="hang">소에서는 Trichophyton verrucosum이 가장 흔하고 T. mentagrophytes 등이 드물게 관여한다.</span><span class="hang">직접 접촉보다 깔짚, 굴레, 솔 같은 매개물 접촉이 더 중요할 수 있다. 감염군의 정상 개체 최대 20%가 보균한다. 포자는 건조·서늘하면 수년간 살아 축사와 기구가 오래 감염원이 된다(한우 자료: 탈락 모낭·각질에서 4~5년, 토양에서도 장기간).</span><span class="hang">밀집 사육, 특히 실내 사육에서 많다. 겨울에 다발하고 봄에 자연 회복되는 경향이 있으나 여름에도 발생한다. 습도가 높으면 증식이 늘어난다. 송아지를 계속 넣고 빼는 사육장에서 유병률이 높고 올인올아웃이 전파를 줄인다.</span><span class="hang">어린 소가 주로 걸린다. Rebhun은 2개월령~1세 육성우, 한우 자료는 수동면역이 끝나는 생후 1~3개월령을 든다. 성우 집단 발생은 겨울에 감염된 초산우가 착유군에 들어온 뒤 생기기도 한다. BVDV 지속감염 송아지, BLAD 송아지, 중병 개체, 코르티코스테로이드 투여 소는 병변이 심하다.</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>기전<span class="hang">각질층과 털을 침범해 털 구조가 풀려 끊어지고 탈모가 생긴다. 호기성이라 가피 아래 중심부 균은 죽고 주변부만 활동해 원형으로 퍼진다.</span><span class="hang">송아지 실험 감염 후 뚜렷한 병변까지 약 4주 걸리고(Rebhun 잠복기 1~4주, 한우 자료 3~4주), 자연 회복은 2~4개월이다. 회복 후 같은 균종에 대한 저항성이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>임상증상<span class="hang">전형 병변은 피부 위로 솟은 두꺼운 회백색 가피이며 대략 원형으로 지름 약 3 cm다(Rebhun 1~5 cm, 한우 자료는 감염 2~3개월 뒤 1~10 cm 회색 석면 모양 반점). 초기에는 가피 아래가 축축하고, 오래되면 가피가 떨어져 인설과 탈모만 남는다.</span><span class="hang">송아지는 눈 주위, 귀, 주둥이, 목, 몸통에 많고 전신으로 번져 융합하기도 한다. 성우는 몸통·목에 많고 유방·옆구리·뒷다리 병변은 착유자 감염 위험을 높인다.</span><span class="hang">가려움은 없거나 경미하다(Constable, Rebhun). 한우 자료는 가려움으로 벽에 비벼 상처와 2차 화농이 생긴다고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>진단과 감별<span class="hang">병변 가장자리에서 털·인설을 채취한다. 70% 알코올로 닦고 10% KOH로 처리해 검경하면 털 안팎에 사슬 모양 포자(Trichophyton)가 보인다. 배양은 2~6주 걸린다. 큰 가피는 피한다.</span><span class="hang">조기 진단에는 알코올로 닦아 말린 병변을 멸균 솔로 쓸어 멸균 봉지에 담아 수 시간 내 배양하는 방법이 가장 유용하다.</span><span class="hang">감별: 덕지 피부염(벗기면 생살이 드러나는 질긴 가피), 유전성 착각화(아연 보충에 빠르게 반응), 개선충 옴(심한 가려움, 진드기 검출), 소양충 옴, 유두종(납작한 회색 사마귀가 링웜과 혼동), 아연반응성 피부병, 피부 림프종.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>국소 치료<span class="hang">자연 회복이 흔해(약 90일 이내, Blackwell 70~100일) 효과 판정이 어렵지만 환경 오염을 줄이려고 치료한다. 가피를 긁어 태우고 약을 솔로 바르거나 문질러 넣는다. 털을 깎으면 쉽지만 전파 위험이 있다.</span><span class="hang">Whitfield 연고(벤조산 6% + 살리실산 3%)가 근거가 가장 강하다. 그 밖에 포비돈요오드, 1% 아졸계, 0.2% 에닐코나졸, 5~10% 황산구리, 4급암모늄 1:200~1:1000 등이 쓰인다.</span><span class="hang">집단에 퍼지면 전신 분무·세척을 한다. 2~5% 석회황(Rebhun) 또는 5% 석회황, 0.5% 차아염소산나트륨, 3% 캡탄, 나타마이신 100 ppm 등을 최소 5일 매일, 이후 주 1회 회복까지 쓴다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>전신 치료<table class="bxt"><tr><th>약</th><th class="c">용량</th><th>출처·비고</th></tr><tr><td>요오드화나트륨 10%</td><td class="c">1 g/14 kg IV, 수 회 반복</td><td>Constable, Blackwell(주 1회)</td></tr><tr><td>요오드화나트륨 20%</td><td class="c">150 mL/450 kg IV, 3~4일 뒤 반복</td><td>Rebhun</td></tr><tr><td>요오드화나트륨 10%</td><td class="c">1 mL/kg IV, 1주 간격 2회</td><td>한우 자료, 발열 소 금지</td></tr><tr><td>그리세오풀빈</td><td class="c">7.5~10 mg/kg PO 1일 1회</td><td>Constable, 비용 높음</td></tr><tr><td>그리세오풀빈</td><td class="c">20~60 mg/kg PO 7일 이상</td><td>Rebhun, 미국 소 미승인</td></tr><tr><td>그리세오풀빈</td><td class="c">10~20 mg/kg 1~2주 사료 혼합</td><td>한우 자료</td></tr><tr><td>이버멕틴</td><td class="c">200 µg/kg SC</td><td>Constable 치료 목록</td></tr></table></span></p><p class="bx-num"><span class="bxn">11.</span><span>백신·소독·예방<span class="hang">비병원성 T. verrucosum 동결건조 소분생자·균사로 만든 무보조 생백신이 유럽·스칸디나비아에서 소의 감염 예방에 크게 성공했고 국가 접종으로 박멸한 사례가 있다. 재구성한 백신을 오래 두면 드물게 아나필락시스 사망이 있다. 감염우에 접종하면 치유가 빨라진다.</span><span class="hang">방제 실패는 대개 치료 전 환경 오염 때문이다. 격리, 기구 분리, 솔은 에닐코나졸이나 가정용 표백제 1:10으로 소독한다. 축사는 2.5~5% 페놀계, 5% 석회황, 5% 포르말린, 3% 캡탄, 5% 차아염소산나트륨으로 소독한다. 한우 자료는 2.5~5.0% 석탄산액이나 1% 가성소다액 분무, 0.4% 포르말린 환경 소독을 제시한다.</span><span class="hang">햇빛과 낮은 사육 밀도가 매우 효과적이어서 영양 불량우가 잘 걸리므로 어린 실내 사육우에 비타민 A를 보충하고 셀레늄·아연 섭취를 확인한다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>한우 현장 처방(한우컨설팅지침서·송아지핸드북)<span class="hang">유황연고 450 g에 카네스텐 분말 20 g(또는 데푼지트·닥타린 20 g)을 섞어 물에 데워 녹인 뒤 굳힌 연고를 2~3일 간격 3~4회 딱지 위에 바른다. 딱지를 억지로 떼면 우사와 다른 소에 다시 퍼진다.</span><span class="hang">설포크로란틴·클로르덴신은 10~25분에 살균한다. 운동장은 0.01~0.5%, 우사 목재·파이프는 3%로 뿌린다. 소독약을 소에 직접 뿌리지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">13.</span><span>덕지 피부염(dermatophilosis, 피부 연쇄상사상균증) — 원인과 역학<span class="hang">Dermatophilus congolensis가 원인이다. 균사 속 휴면 유주자가 습기를 만나 운동성 구균(감염형)으로 바뀐다. 건강한 피부는 뚫지 못해 상처나 오랜 젖음에 의한 침연이 있어야 감염된다.</span><span class="hang">얼굴·발의 경미한 보균 병변과 털에 남은 가피가 감염원이다. 접촉, 승가, 흡혈 파리·진드기, 오염 약욕으로 퍼진다. 열대에서 진드기(Amblyomma 등)는 면역을 억눌러 병변을 넓힌다.</span><span class="hang">온대 소에서 집단 발생은 드물지만 비가 많으면 발병률이 50%에 이른다. 승가 상처로 엉덩이·등에 잘 생기고 젖소의 샤워 냉각·분무가 위험 요인이다(9개 농장 10~66%). 초산우 분만 첫 몇 주에 자궁내막염·유방염이 겹치면 더 많다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>임상증상<span class="hang">초기에는 농포 위 털이 곤두서 다발로 엉긴다(붓 모양 병변). 기름진 삼출물이 굳어 떼기 어려운 가피가 되고 굴곡부에서 갈라진다. 가피는 크림색~갈색, 2~5 cm로 모자이크처럼 붙어 있다. 초기엔 떼면 아파하고 아래에 육아조직과 고름(Rebhun: 진한 황록색 고름)이 있다. 가려움은 없다.</span><span class="hang">기갑에서 엉덩이까지 등선을 따라 시작해 옆구리 절반까지 내려오는 분포가 흔하다. 관절 굴곡부, 사타구니, 앞다리 사이, 유방 뒤에만 생기기도 하고 수소는 음낭에 생긴다. 연못·진흙·젖은 목초지에 있으면 다리 아래쪽과 주둥이에 생긴다.</span><span class="hang">송아지는 감염 유방 접촉이나 양동이 포유 우유에 의한 피부 손상으로 주둥이에서 시작해 머리·목으로 번진다.</span><span class="hang">체표 50% 넘게 퍼지면 쇠약, 단백 손실, 패혈증으로 죽을 수 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>진단과 감별<span class="hang">두꺼운 가피 아랫면을 슬라이드에 눌러 찍은 도말(그람, Diff-Quik)에서 두 줄 유주자가 배열된 분지 균사('기찻길' 모양)가 보인다. 급성 병변에서 분리가 쉽고 폴리믹신 B로 오염균을 억제한다.도 쓴다.</span><span class="hang">등선부터 시작해 광과민증과 혼동하지만 덕지 피부염은 흰 털과 색깔 털 부위를 가리지 않는다. 감별: 링웜, 포도구균 모낭염, 옴, 이, 아연반응성 피부병, 유두종, 피부 림프종, 악성카타르열, 점막병.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>치료<table class="bxt"><tr><th>약</th><th class="c">용량</th><th>출처</th></tr><tr><td>옥시테트라사이클린</td><td class="c">5 mg/kg, 주 1회 필요 시 반복</td><td>Constable</td></tr><tr><td>지속성 옥시테트라사이클린</td><td class="c">20 mg/kg 1회 IM/SC</td><td>Constable, Rebhun, LAIM</td></tr><tr><td>프로카인 페니실린 G</td><td class="c">22,000 IU/kg IM 1일 1회 3일</td><td>Constable</td></tr><tr><td>프로카인 페니실린 G</td><td class="c">20,000 U/kg IM 1일 2회 5~7일</td><td>Rebhun</td></tr></table><span class="hang">젖은 환경에서 빼내 건조하게 두면 몇 주 만에 저절로 낫기도 한다. 가피 다발을 떼거나 털을 깎아 균량을 줄이고 요오드·클로르헥시딘 샴푸나 석회황 세척을 한다. 떼어낸 가피는 감염원이므로 바닥에 털지 말고 폐기한다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>예방<span class="hang">지속적 젖음과 피부 손상 원인을 피하는 것이 원칙이며 건조한 날씨가 되면 대개 사라진다. 감염우 격리, 기구 공유 금지, 외부기생충 관리, 비 피할 곳 제공이 필요하다. 열대에서는 진드기 구제가 가장 중요하다. 백신은 면역이 균주 특이적이라 실패했다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">18.</span><span>유두종(사마귀, papillomatosis) — 원인과 BPV 형<span class="hang">소 유두종바이러스(BPV)는 형마다 부위 특이성이 있고 형 사이 교차면역이 약하다. 한 병변에는 한 형이 있지만 한 개체에 부위별로 다른 형이 있을 수 있다. 소의 병변은 대개 섬유유두종이다.</span><table class="bxt"><tr><th>형</th><th>부위·모양</th></tr><tr><td>BPV-1</td><td>유두·피부의 엽상 섬유유두종, 음경 섬유유두종</td></tr><tr><td>BPV-1, 2</td><td>이마·목·등 등 몸 앞쪽의 흔한 피부 사마귀(콜리플라워 모양)</td></tr><tr><td>BPV-2</td><td>항문생식기·배의 콜리플라워형, 고사리 섭취 시 방광암과 관련</td></tr><tr><td>BPV-3</td><td>낮고 납작한 비정형 사마귀, 수년 지속</td></tr><tr><td>BPV-4</td><td>식도·식도구·전위 유두종, 고사리 섭취 시 암화</td></tr><tr><td>BPV-5</td><td>유방·유두 쌀알형 섬유유두종(미국 젖소에서 가장 흔한 유두 사마귀, Rebhun)</td></tr><tr><td>BPV-6</td><td>유두·유방 엽상 상피 유두종</td></tr><tr><td>BPV-7, 9, 10</td><td>유두·유방(BPV-10은 혀)</td></tr></table></span></p><p class="bx-num"><span class="bxn">19.</span><span>역학과 전파<span class="hang">상처를 통한 직접 접촉과 계류대·사료조·솔·굴레 같은 매개물로 퍼진다. 귀표, 낙인, 철조망 긁힘 부위에 무리지어 생기고 임신 감정 직장검사로 육우 미경산우에 항문 주위 사마귀가 집단 발생한 기록이 있다. 비전문가가 기구 소독 없이 제각한 뒤 집단 발생이 흔하다(Rebhun). 흡혈 파리 매개 가능성이 있다.</span><span class="hang">2세 미만(Rebhun 6~24개월령) 소에 많고 같은 군에서는 같은 부위에 생긴다. 성우가 덜 걸리는 것은 어릴 때 얻은 면역 때문으로 본다. 면역억제제 투여로 잠복감염이 발병하기도 한다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>임상증상<span class="hang">피부 사마귀는 머리(특히 눈 주위)·목·어깨에 많고 1 cm 이상, 마르고 각질화된 콜리플라워 모양이다. 대부분 자연 퇴행하나 5~6개월, 길게는 36개월 지속하며 몸이 축나기도 한다.</span><span class="hang">유두 사마귀는 착유기에 당겨진 듯 약 1 cm로 늘어난 엽상형(세게 당기면 뿌리째 빠짐), 지름 2 cm까지의 납작한 원형, 쌀알형이 있다. 건유기에 퇴행했다가 다음 비유기에 재발한다. 유두 끝 사마귀는 착유 방해와 유방염 위험을 높인다.</span><span class="hang">음문·음경 사마귀는 크고 잘 부서지며 출혈하고 감염·구더기가 끼어 교배를 불가능하게 한다. 젊은 수소 음경 사마귀는 유경성이 많고 채정·교배 후 출혈이 주호소이며 자연 퇴행이 잦다.</span><span class="hang">소화관 유두종은 거친 사료로 생긴 상처를 따라 줄지어 생긴다. 식도구·제2위 병변은 만성 고창 원인이 된다. 고사리를 먹는 소에서는 면역억제와 돌연변이 유발물질로 편평세포암이 되고, 방광 병변은 지방병성 혈뇨와 관련된다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>진단과 감별<span class="hang">대개 육안으로 진단하고 비정형 병변만 생검한다. 감별: 편평세포암, 링웜(납작하고 넓은 회색 사마귀와 혼동), 덕지 피부염, 피부 림프종. 비정형 유두종은 진피 섬유증식이 없고 낮고 납작하며 원형으로 융합하고 오래간다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>치료<span class="hang">1~12개월 안에 자연 치유되므로 치료는 대개 필요 없다. 수술이나 냉동수술로 제거할 수 있다. 작은 사마귀 일부를 짓누르거나 몇 개를 떼면 퇴행이 빨라진다고 하나 자연 회복 때문에 판정이 어렵다. 초기 수술·백신이 남은 사마귀를 키운다는 우려도 있다.</span><span class="hang">냉동수술은 종양 파괴와 세포매개면역 자극을 겸해 비전문가 제각 후 양쪽 사마귀 집단 발생에 유용하다(Rebhun). 음경 사마귀는 정밀 박리 후 기저부를 동결-해동-동결 2회(-30°C 이상)한다. 유경성이 광기저성보다 치료가 쉽고 재발이 적다. 질 사마귀는 줄기에 혈관이 많아 결찰이 필요할 수 있다.</span><span class="hang">착유를 방해하는 돌출 유두 사마귀는 가위로 피부와 평평하게 자른다. 늘어진 사마귀는 고무링으로 묶어 떨어뜨린다(Bovine Medicine, 한우 자료). 떼어 출혈하면 달군 인두로 지진다(한우 자료).</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>자가백신과 예방<span class="hang">환축의 사마귀 조직을 균질화·여과하고 포르말린으로 불활화해 만든다. 지역 형을 포함하므로 시판 백신보다 낫다. 오래된 사마귀 상피에 바이러스가 더 많다.</span><span class="hang">피하보다 피내 접종이 낫다고 하며 1~2주 간격 2~4회가 흔하다(LAIM: 2 mL 피내 주 3회). 체표·음경 사마귀는 3~6주 안에 80~85% 회복하나 유두 사마귀는 33%이고 낮고 납작한 광기저성 사마귀는 반응이 나쁘다.</span><span class="hang">감염우 격리, 공용 기구 금지, 제각기·문신기·수술기구를 개체마다 바이러스 살균 용액으로 소독, 1두 1침 원칙을 지킨다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">24.</span><span>럼피스킨병(lumpy skin disease) — 원인과 역학<span class="hang">Capripoxvirus 속 Neethling 바이러스이며 양두·산양두 바이러스와 항원적으로 가깝다. 아프리카에서 이집트·이스라엘·중동·터키·이란·아제르바이잔 등으로 퍼졌고 유럽 유입 위험이 있다. 신고 대상 질병이다(Bovine Medicine).</span><span class="hang">이환율은 유행 때 80%까지, 상재지에서 10~30%다. 폐사율은 대개 낮지만(Bovine Medicine 3% 미만) 10% 이상일 수 있다. 사료 섭취·유량 감소, 유두 병변에 의한 2차 유방염, 가죽 손상, 수소 번식력 저하, 유산으로 손실이 크다.</span><span class="hang">대부분 절지동물 매개로 전파된다. 침파리(Stomoxys)와 Amblyomma·Rhipicephalus 진드기로 실험 전파되었고 콧물·눈물·정액·우유에 바이러스가 있으나 직접 접촉은 주 경로가 아니다. 인공수정 정액 전파가 실험적으로 증명되었다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>임상증상<span class="hang">잠복기는 야외 2~4주, 실험 7~14일이다. 심하면 1주 넘는 발열에 눈물·콧물·침흘림·파행이 따르고 약 1주 뒤 피내 결절이 갑자기 나타나며 회음부에서 시작하는 경우가 많다.</span><span class="hang">결절은 둥글고 단단하며 1~4 cm, 납작하고 털이 곤두선다. 몇 개에서 수백 개이며 감염의 50% 미만만 전신 결절을 보인다. 비강·비갑개(콧물, 호흡 폐쇄, 코골이), 구강(판에서 궤양, 침흘림), 결막(심한 눈물), 포피·음문에도 생긴다.</span><span class="hang">결절은 빨리 사라지거나 단단한 혹으로 남거나 축축하게 괴사해 노란 중심이 떨어지며 고환·힘줄까지 드러낸다. 국소 림프절이 붓고 특히 다리가 붓는다. 호흡기 병변 뒤 폐렴이 흔하다. 회복은 4~12주이고 임신우는 유산한다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>진단과 감별<span class="hang">바이러스 분리, PCR(피부에서 감염 후 90일까지 검출, 분리 가능 기간보다 훨씬 김), 중화항체 생성 전 초기 항원 ELISA, 전자현미경을 쓴다. 전자현미경은 파라폭스(구진성 구내염, 가성우두)와 구별되지만 우두·백시니아와 형태가 비슷하다. 조직에서 진피·피하의 육아종성 반응과 초기 병변의 호산성 세포질 봉입체가 보인다.</span><span class="hang">감별: 가성 럼피스킨병(BHV-2, 더 얕은 병변, 바이러스 분리로 구별), 곤충 교상, 쇠파리 유충증.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>치료와 방제<span class="hang">치료는 대증 치료와 2차 세균감염 항균제뿐이다. 비발생 지역은 발생 지역 소의 이동 통제로 유입을 막고 유입되면 백신으로 방제한다.</span><span class="hang">동결건조 약독 생백신이 주로 쓰인다. 양두 백신은 이집트 2006년, 이스라엘 2006~2007년(접종우 11% 피부 병변)에서 방어가 불완전해 이스라엘은 2012년 Neethling 약독주를 썼다. 케냐 양두·산양두 백신주(O-240)는 실제로 LSD 바이러스이며 약독화가 낮아 소에 안전하지 않을 수 있다.</span><span class="hang">발생이 시작된 뒤 접종은 대부분 이미 잠복 중이고 주사침 위생이 나쁘면 오히려 퍼뜨리므로 효과가 제한적이다. 청정국 유입 시에는 감염·접촉우 살처분, 오염 가죽 폐기, 위험군 접종이 일반적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>우두·가성우두·유두 피부염(BHV-2)·우역 — 우두(cowpox)<span class="hang">Orthopoxvirus이다. 유럽·서아시아 설치류가 보유숙주이고 소는 드문 우연 숙주다. 고양이나 사람에서 들어와 착유자 손·착유컵으로 소 사이에 퍼진다. 상재 농장에서는 미경산우와 신규 도입우만 걸린다.</span><span class="hang">잠복 3~6일 뒤 장미색 홍반, 기부에 충혈대가 있는 연한 구진, 중심이 오목한 노란 수포, 농포, 두껍고 붉은 가피 순으로 진행한다. 가피는 1~2 cm이고 착유우는 가피 대신 깊은 궤양이 된다. 유두와 유방 아래에 국한되며 포유 송아지는 입 주위, 수소는 음낭에 생긴다.</span><span class="hang">진단은 전자현미경, PCR, 바이러스 분리다. 치료는 대증이고 착유 위생과 4급암모늄 알코올 팅크 유두 침지로 전파를 막는다. 사람 감염은 대개 고양이·쥐에서 온다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>가성우두(pseudocowpox)<span class="hang">Parapoxvirus이며 소 구진성 구내염 바이러스와 같을 수 있다. 대부분 나라에 있고 농장 안 전파가 느려 최대 1년 머문다. 이환율은 100%에 가깝지만 한 시점엔 5~10%(최대 50%)다. 분만 직후·신규 도입우가 가장 감수성이고 2세 미만은 분만하지 않았으면 거의 걸리지 않는다. 면역이 약해 곧 재발한다.</span><span class="hang">한 유두에 10개까지 생긴다. 홍반 뒤 수포·농포가 약 48시간에 터져 두꺼운 가피가 된다. 가피는 0.5~25 mm이고 아래 육아조직으로 크게 솟는다. 7~10일에 떨어지며 작은 사마귀 같은 육아종을 둘러싼 말발굽 모양의 작은 가피 고리를 남기는데 이것이 핵심 감별점이다. 18~21일에 사라졌다가 약 1개월 뒤 주기적으로 재발한다.</span><span class="hang">진단은 수포액 전자현미경이다. 치료는 가피 제거·소각, 착유 후 수렴제(triple dye), 착유 직전 연화 연고다. 요오드포 유두 침지가 가장 효과적인 방제다. 사람에게 착유자 결절을 만든다.</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>소 헤르페스 유두염(BHV-2 유두 피부염, bovine herpes mammillitis)<span class="hang">α-헤르페스바이러스 BHV-2가 원인이며 유두염 외에 전신의 얕은 피부병인 가성 럼피스킨병(Allerton 바이러스)도 일으킨다. 드물게 BHV-4도 유방 농포성 피부염을 만든다.</span><span class="hang">처음 감염된 농장은 이환율 18~96%이고 이후에는 분만 초산우에 국한된다. 분만 후 2주 안의 초산우, 특히 분만 유방 부종이 심한 개체에 심하다. 바이러스가 배아층 이하로 들어가야 하므로 착유 손상, 유두 균열, 흡혈 파리가 필요하다. 6~15주 지속하고 면역은 약 1년이다.</span><span class="hang">잠복 5~10일, 전신 증상은 없다. 얇은 1~2 cm 수포가 24시간 안에 터지며 심한 부종·홍반, 장액 삼출, 피부 탈락으로 유두 전체가 푸르게 붓고 궤양이 된다. 가벼운 병변은 10일, 심한 궤양은 2~3개월 간다. 유두가 건성 괴저로 통째 떨어지기도 한다.</span><span class="hang">진단은 초기 수포액 바이러스 분리·전자현미경과 쌍혈청이다(BHV-2 1:16, BHV-4 1:20 이상이면 노출).</span><span class="hang">특이 치료는 없다. 착유 직전 수용성 소독 연고, 착유 직후 triple dye 같은 수렴 로션으로 착유를 견딜 가피를 만든다. 격리와 착유 위생은 효과가 적고 요오드포 소독을 권한다. 분만 부종을 줄이면 중증도가 준다. 유방염이 늘고 유량이 20%까지 준다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>유두·유방 병변 감별<table class="bxt"><tr><th>질병</th><th>특징</th></tr><tr><td>우두</td><td>전형 두창 단계, 두껍고 붉은 가피, 착유우는 깊은 궤양</td></tr><tr><td>가성우두</td><td>수포 드묾, 말발굽 모양 가피 고리, 주기적 재발</td></tr><tr><td>BHV-2 유두염</td><td>분만 직후 초산우, 부종 심함, 피부 탈락·궤양</td></tr><tr><td>유방 농가진</td><td>유두 기부 2~4 mm 농포, 황색포도구균, 포도구균 유방염 동반</td></tr><tr><td>기타</td><td>유두종, 구제역·수포성 구내염, 유두 균열·동상, 광과민증, 일광화상, 화학 화상</td></tr></table></span></p><p class="bx-num"><span class="bxn">32.</span><span>우역(rinderpest)<span class="hang">Morbillivirus이며 2011년 세계 박멸이 선언되었다. 사망은 주로 심한 설사·이질과 탈수 때문이었다. 결막염이 2차 증상으로 나타나는 병에 포함된다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">33.</span><span>옴(mange) — 원인 진드기와 진단<span class="hang">소의 옴 진드기는 개선충(Sarcoptes scabiei var. bovis), 소양충(Psoroptes ovis), 피선충(Chorioptes bovis), 모낭충(Demodex bovis), Psorergates bos다. 겨울철 실내 사육에서 많다. 스테로이드는 금기다(Bovine Medicine).</span><span class="hang">피가 날 정도로 깊이 긁되 병변 가장자리에서 채취한다(중심부는 대개 음성). 10% KOH로 녹여 검경하고 여러 곳을 긁는다. 모낭충은 결절의 밀랍 같은 내용물을 짜서 본다. 개선충은 찾기 어려워 음성이어도 배제하지 못한다.</span><table class="bxt"><tr><th>종류</th><th>주 부위</th><th class="c">가려움</th></tr><tr><td>개선충</td><td>허벅지 안쪽, 목 아래, 브리스킷, 꼬리 기부, 머리·어깨</td><td class="c">매우 심함</td></tr><tr><td>소양충</td><td>기갑, 목, 꼬리 기부에서 등·옆구리로</td><td class="c">매우 심함</td></tr><tr><td>피선충</td><td>꼬리 기부, 회음, 유방 뒤, 허벅지, 음낭, 여름엔 발목 위</td><td class="c">경미~중등</td></tr><tr><td>모낭충</td><td>브리스킷, 목 아래, 전완, 어깨, 기갑 뒤</td><td class="c">없음</td></tr><tr><td>Psorergates</td><td>흉곽, 옆구리, 허벅지 반점성 탈모</td><td class="c">경미</td></tr></table></span></p><p class="bx-num"><span class="bxn">34.</span><span>개선충 옴(sarcoptic mange, barn itch)<span class="hang">암컷이 각질층 아래 얕은 굴을 파고 알을 낳으며 생활환은 10~13일이다. 숙주 밖에서는 며칠(실험 조건 최대 3주) 산다. 직접 접촉이 주 경로이며 깔짚·기구·옷도 매개한다. 춥고 습한 날씨에 활발하고 과밀·영양불량과 함께 간다. 사람에게 일시 감염되며 많은 나라에서 신고 대상이다.</span><span class="hang">작은 붉은 구진과 홍반, 심한 가려움, 긁고 물어 생긴 찰과상, 탈모, 생살 위 두꺼운 갈색 가피, 주변 피부 비후·주름이 생긴다. 소 전신이 6주 만에 침범될 수 있다. 사료 섭취·유량이 크게 줄고 발정을 보이지 않으며 방치하면 쇠약해 죽는다.</span><span class="hang">대환식 락톤(이버멕틴, 에프리노멕틴, 목시덱틴, 도라멕틴) 푸어온·주사가 우선이다. 잔효성 때문에 재처치는 대개 필요 없고 소는 1회 주사로 14일에 진드기가 없어졌다. 병변 회복이 느린 것을 약효 실패로 오인하지 않는다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>소양충 옴(psoroptic mange)과 피선충 옴(chorioptic mange)<span class="hang">소양충은 피부 표면을 긁어 지질 삼출액을 먹고 가피 밑에 산다. 생활환 10~11일이고 숙주 밖에서 10일(최대 3주) 산다. 이버멕틴 처치 소는 9~14일 비감염우와 분리한다. 목시덱틴 0.5% 푸어온 0.5 mg/kg은 0.2 mg/kg 주사와 효과가 같았고 도라멕틴 0.2 mg/kg SC도 효과적이었다.</span><span class="hang">피선충 옴은 소에서 가장 흔한 옴이다. 표피 부스러기를 먹고 생활환은 약 3주다. 3 mm 정도 작은 가피가 회음·유방 뒤·허벅지에 생기고 꼬리 기부와 좌골 사이의 두꺼운 가피는 직장검사 때 자주 보인다. 군의 10~20%가 경미한 병변을 보이는 경우가 흔하다(Rebhun). 대부분 미관 문제지만 제관염·심한 자극·유량 급감을 보이는 급속 확산 증후군 보고가 있다.</span><span class="hang">피선충은 군에서 박멸이 어렵다. 목시덱틴 푸어온 0.5 mg/kg은 제거했으나 0.2 mg/kg 주사는 일부만 청정화했다. 이버멕틴 0.2 mg/kg SC 2회도 감소에 그쳤다. 아미트라즈 0.05%가 98% 제거, 폭심 0.05~0.1% 10일 간격 2회로 박멸했다. Rebhun은 쿠마포스 0.03% 분무 2주 간격 2회, 석회황 2% 주 1회 4회를 든다. 군 전체를 치료하고 빗으로 가피를 긁어낸 뒤 처치한다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>모낭충 옴(demodectic mange)<span class="hang">모낭·피지선에 살며 생활환 전부가 숙주 위다. 송아지는 어미에게서 반나절 만에 옮는다. 소에서는 대부분 늦겨울~초봄 성우 젖소에 생겨 어린 면역결핍 개에서 생기는 것과 다르다. 대부분 무증상이다.</span><span class="hang">지름 약 3 mm(Rebhun 0.5~1 cm, 정상 털로 덮임) 결절·농포가 생겨 가죽 속 산탄 알갱이처럼 만져진다. 내용물은 흰 치즈 모양이다. 가려움은 없다.</span><span class="hang">이버멕틴 0.3 mg/kg으로 육우 수소 98% 치유 보고(Constable), 이버멕틴 200 µg/kg 주 2회 주사와 아미트라즈 주 1회 침지 병용 성공 보고(LAIM)가 있다. 치료는 대개 필요 없고 증상이 뚜렷한 개체는 면역결핍이나 유전 소인을 확인한다. 예후는 신중하다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>옴 약제와 착유우·휴약<span class="hang">Rebhun(미국 기준): 에프리노멕틴·목시덱틴 푸어온은 착유우에 승인되어 표시대로 쓰면 우유 폐기가 없다. 도라멕틴은 20개월령 이상 젖소 암소에 쓸 수 없다. 2% 석회황을 35.0~40.5°C로 데워 침지·분무하면 휴약이 없고 10~14일 간격으로 반복할 수 있다. 개선충·소양충은 신고 대상이라 방역 당국에 알린다.</span><span class="hang">Bovine Medicine(영국 기준): 대환식 락톤 주사·푸어온은 피선충·개선충에 대체로 효과적이고 도라멕틴·목시덱틴 일부 제품이 소양충 효능을 표방한다. 처치 소는 재감염을 막으려 2~3주 격리한다. 대부분 착유우 허가가 없고 에프리노멕틴 푸어온만 착유우에 쓸 수 있다. 퍼메트린 푸어온도 옴에 효과적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>이(pediculosis) — 원인과 역학<span class="hang">흡혈이는 Linognathus vituli, Solenopotes capillatus, Haematopinus eurysternus, H. quadripertusus이고 씹는이는 Bovicola(Damalinia) bovis다. 숙주 특이적이고 전 생활환이 숙주 위다.</span><span class="hang">흡혈이 암컷은 하루 2~6개 알을 털에 붙이고 5~11일에 부화하며 약충 3단계(각 2~4일)를 거친다. 33~37°C에서 잘 자라고 고온에 약해 여름에 적고 가을부터 늘어 늦겨울에 정점이다. 숙주 밖에서 최대 2주 산다. 신생 송아지는 어미에게서 빨리 옮는다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>증상과 진단<span class="hang">가려움, 불안, 핥기, 비비기로 피모·가죽 손상, 유량 감소, 비육 효율 저하, 시설 파손이 생긴다. L. vituli·H. eurysternus 다량 감염은 빈혈을 일으킨다. 계속 핥아 송아지에 모구가 생긴다.</span><span class="hang">젖은 붓으로 쓴 듯한 핥은 자국이 옆구리·등·엉덩이에 생기는 것이 전형이다. 한두 마리의 심한 개체는 군 전체 문제를 뜻한다.</span><span class="hang">머리, 목 옆, 목 아래 늘어진 피부(dewlap), 회음부(escutcheon), 꼬리털을 털을 헤쳐 손전등으로 본다. 씹는이는 둥근 머리에 연갈색이고 잘 움직이며 등·옆구리에 모인다. 흡혈이는 회색~청회색에 머리가 뾰족하고 피부에 붙어 있으며 머리와 긴 털에 많다.</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>치료와 예방<span class="hang">Constable은 대환식 락톤 주사·푸어온이 흡혈이·씹는이 모두에 우수하다고 쓴다. Blackwell·Bovine Medicine은 대환식 락톤은 주로 흡혈이에 듣고 푸어온이 주사보다 낫다고 하며 피레스로이드가 두 종 모두에 듣는다고 쓴다. LAIM은 이버멕틴 200 µg/kg SC 14일 간격 2회는 흡혈이에만, 국소 살충제 2주 간격 2~3회는 두 종 모두에 듣는다고 한다. 알은 죽지 않아 반복이 필요하다.</span><span class="hang">잔효가 21일 넘는 제품은 재처치가 필요 없다. 군 전체를 치료하고 개체수가 늘기 시작하는 가을~초겨울에 맞춘다(너무 이르면 봄에 재발). Rebhun은 깔짚 제거, 우사 분무, 전 두수 일제 처치 후 2~4주 뒤 반복을 권하고, 착유우는 에프리노멕틴·목시덱틴 푸어온이나 승인된 피레트린·퍼메트린·쿠마포스 제품을 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>쇠파리 유충증(hypodermosis, warble) — 원인과 생활환<span class="hang">Hypoderma bovis와 H. lineatum이 원인이다. 성충은 벌 크기(12~18 mm)이고 입이 퇴화해 1주 미만 산다. 영국, 아일랜드, 노르웨이, 스웨덴, 덴마크, 몰타에서 박멸되었고 남반구에는 정착하지 않았다.</span><span class="hang">봄~늦여름에 H. lineatum(3~4주 먼저 출현)은 다리·몸 아래 털에 5~25개씩 줄지어 최대 600개, H. bovis는 엉덩이·뒷다리 위쪽 털에 한 개씩 알을 붙인다. 4~6일에 부화한 유충이 단백분해효소로 피부를 뚫고 결합조직을 따라 이동한다.</span><span class="hang">H. lineatum은 식도 점막하, H. bovis는 흉요추 경막외 지방에 2~4개월 머문다(겨울 휴지 부위). 늦겨울~봄에 등 피하에 이르러 숨구멍을 내고 육아종성 낭(warble) 안에서 1~2개월 두 번 탈피해 25~30 mm가 된 뒤 땅에 떨어져 번데기가 된다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>증상과 진단<span class="hang">H. bovis의 산란 비행은 소를 겁에 질리게 해 날뛰는 행동(gadding)으로 울타리에 부딪혀 다치고 채식·번식 행동이 방해된다. 파리는 물거나 쏘지 않는다.</span><span class="hang">등에 숨구멍이 보이는 부드럽고 아픈 혹이 한 마리에 200~300개까지 생긴다. 성장·유량 저하(처치 후 유량·유지방 증가), 면역억제, 가죽·도체 손상이 손실이다.</span><span class="hang">척수관 유충은 열이나 다른 전신 증상 없는 급성 후지마비를 일으키며 진행하지 않아 외상처럼 보인다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>치료와 처치 시기<span class="hang">모든 유충 단계가 대환식 락톤(도라멕틴, 이버멕틴, 에프리노멕틴, 목시덱틴)에 매우 민감하고 잔효는 약 4주다. 생산성과 개체군 관리를 위해 처치를 강하게 권한다(Constable). 체계 살충제를 쓸 수 없으면 등에 테트라클로르빈포스 분말을 뿌린다(Blackwell).</span><span class="hang">파리 활동이 끝난 직후나 1기 유충이 위험 부위를 떠난 봄에 처치한다. 식도에 있을 때 죽이면 심한 염증성 부종으로 연하·트림이 막혀 침흘림과 고창이 오고, 척수관에 있을 때 죽이면 부종과 경도~중증 마비가 온다. 미국 북동부는 서리로 파리철이 끝나고 유충이 커지기 전인 10월 15일~11월 15일에 처치한다(Rebhun).</span><span class="hang">Rebhun은 착유우는 나이 면역으로 감염이 적고 잔류 문제가 있어 처치하지 않으며 수개월 안에 분만할 미경산우도 처치하지 않는다고 쓴다. 에프리노멕틴·목시덱틴 푸어온은 표시대로 쓰면 우유 폐기가 없다.</span><span class="hang">등 혹을 짜거나 짓눌러 유충을 깨뜨리면 침울, 침흘림, 눈물, 호흡곤란, 목 옆 피부 주름, 턱밑 부종을 보이는 심한 전신 반응이나 사망이 온다. 혹이 생긴 뒤에는 손대지 말라고 농가에 알린다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">44.</span><span>파리·구더기·진드기 — 침파리·뿔파리·얼굴파리<span class="hang">침파리(Stomoxys calcitrans)는 암수 모두 흡혈하고 흘린 사료, 사일리지 가장자리, 퇴비 같은 젖은 썩은 유기물에서 번식하며 여름에 3~4주에 한 세대다. 앞다리에 평균 2마리 넘게 앉으면 손실이 크다. 탄저·BVDV를 기계적으로 옮긴다.</span><span class="hang">뿔파리(Haematobia)는 Stephanofilaria(배 정중선 피부염)를 옮긴다. 얼굴파리(Musca autumnalis)는 눈물·콧물을 먹어 Moraxella bovis와 안충(Thelazia)을 옮긴다. 살충제 함침 귀표는 미경산우·건유우의 얼굴파리·뿔파리에 쓰고, 에프리노멕틴·목시덱틴 푸어온은 뿔파리에 효과적이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>구더기증(myiasis)<span class="hang">금파리류는 제각·거세·외상 상처, 노출된 잔류 태반, 신생 송아지 배꼽, 난산 뒤 괴사 음문, 설사로 젖은 회음, 핑크아이 뒤 천공·함몰 눈과 안와 종양에 알을 낳는다. 어린 송아지에서 독혈증처럼 쇠약을 더한다.</span><span class="hang">털을 깎고 세척·괴사조직 제거 후 구더기를 죽인다. 쿠마포스 0.25%를 국소 분무할 수 있으나 송아지에 과용하면 유기인 중독이 온다. 파리 기피 연고는 흡수를 줄이려고 상처 둘레에 고리 모양으로 바른다. 착유우는 승인 약제만 쓴다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>진드기(tick) — 피해와 약제<span class="hang">진드기는 이보다 숙주 특이성이 낮고 숙주 밖에서 오래 산다. 흡혈로 아픈 교상, 가죽 손상, 빈혈, 마비, 2차 감염을 일으키고 아나플라즈마병, 바베시아병 등을 옮긴다. 한우 자료는 방목지 진드기 흡혈로 타일레리아가 전파된다고 쓴다.</span><table class="bxt"><tr><th>약제</th><th class="c">용량·효과</th></tr><tr><td>아미트라즈 0.025%</td><td class="c">전신 분무 86.0%, 침지 99.8% 방제</td></tr><tr><td>플루메트린</td><td class="c">1% 푸어온 1 mL/10 kg 97%, 0.0033% 분무 99%</td></tr><tr><td>이버멕틴</td><td class="c">0.2 mg/kg SC 4일 간격 2회로 청정화, 국소는 0.5 mg/kg 필요</td></tr><tr><td>목시덱틴</td><td class="c">0.2 mg/kg SC 4주 간격 또는 0.5 mg/kg 푸어온</td></tr><tr><td>도라멕틴</td><td class="c">0.2 mg/kg SC, B. microplus 제거와 재정착 방지</td></tr></table><span class="hang">이버멕틴 주사는 2일 지연 뒤 Boophilus를 21일 방제하나 Ixodes ricinus에는 효과가 불확실하다. 유기인제, 피레스로이드, 대환식 락톤 모두 저항성이 보고되었다. 피레스로이드와 유기인제를 섞어 극복한다(사이퍼메트린+클로르펜빈포스, 델타메트린+에티온).</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>진드기·파리 방제 전략<span class="hang">살비제, 목초지 관리(휴목·윤환방목), 저항성 소(제부 혈통 50%까지, 그 이상은 증체·성숙·기질 불이익), 백신(장 항원 Bm86 재조합 백신, 소가 자연 노출되지 않아 정기 추가 접종 필요)을 묶은 통합 관리를 한다.</span><span class="hang">한우 자료(진드기): 방목 시 7~15일 간격으로 약제를 살포하고 방목 전후에 실시한다.</span><span class="hang">한우 자료(파리): 24시간 지난 분변을 좋아하므로 하루 1회 이상 분변을 치운다. 살충제는 알이 죽지 않으므로 10일 간격으로 반복하고 내성을 막으려 봄·초여름과 가을에 성분이 다른 약을 번갈아 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>광과민증(photosensitization) — 기전과 분류<span class="hang">피부에 쌓인 광감작 물질이 320~400 nm 빛을 받아 자유기를 만들고 털·색소로 가려지지 않은 피부를 손상한다. 일광화상과 달리 감작 물질이 필요하고 발병이 빠르며 병변이 훨씬 심하다.</span><table class="bxt"><tr><th>형</th><th>원인</th></tr><tr><td>I형 일차성</td><td>외인성 감작 물질 섭취·주사·접촉: 고추나물(St. John's wort, hypericin), 메밀(fagopyrin), furocoumarin 식물(Ammi majus 등), 페노티아진, 분만 유도용 코르티코스테로이드, 테트라사이클린·설폰아마이드(Rebhun)</td></tr><tr><td>II형</td><td>포르피린 대사 유전 결함: 선천성 적혈구생성 포르피린증(pink tooth, 홀스타인 등), 원형포르피린증(리무진 등)</td></tr><tr><td>III형 간성</td><td>간 손상으로 엽록소 대사산물 phylloerythrin 배설 장애, 가장 흔함: Pithomyces 곰팡이, 남조류, 루핀, 피롤리지딘 알칼로이드 식물(Senecio, Crotalaria), 란타나, 간질충·간농양·렙토스피라(Rebhun)</td></tr><tr><td>IV형 원인 불명</td><td>유채·케일·알팔파·클로버, 물에 젖거나 곰팡이 핀 알팔파 건초·사일리지(간 증상 없이 대발생)</td></tr></table></span></p><p class="bx-num"><span class="bxn">49.</span><span>임상증상<span class="hang">색소 없고 햇빛을 받는 피부에만 생기고 색소 부위는 멀쩡하다. 홍반, 부종, 삼출로 털이 엉겨 덩어리로 빠짐, 괴저·탈락 순이다. 등에서 가장 심하고 옆으로 갈수록 약하며 배쪽엔 없다. 얼룩소에서 경계가 칼로 자른 듯 뚜렷하다.</span><span class="hang">호발 부위는 귀, 결막(각막 외측 혼탁), 눈꺼풀, 주둥이, 얼굴, 유두 외측면이고 음문·회음이 덜하다. 검은 소는 음문 입술, 눈꺼풀 가장자리, 각막에 생긴다.</span><span class="hang">초기에 주둥이 홍반·부종, 눈물·콧물, 눈부심이 있다. 부종으로 귀가 처지고 눈꺼풀·콧구멍이 닫혀 호흡곤란, 입술이 부어 연하곤란이 온다. 가려움이 심해 불안해하고 비빈다. 유두가 침범되면 발로 차고 물에 들어가 유두를 식힌다. 각막염이 실명까지 간다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>진단과 감별<span class="hang">병변 분포로 진단하며 광과민증 자체의 특이 검사는 없다. 간성은 혈장 phylloerythrin 분광분석으로 진단한다(양 정상 0.05 µg/mL 미만, 증상 시 0.3 µg/mL 초과). 황달은 간성을 강하게 시사하나 간효소(GGT, AST, SDH)와 빌리루빈으로 확인한다. 일차성이 의심되어도 간 질환과 포르피린증을 배제한다(Rebhun).</span><span class="hang">적혈구생성 포르피린증은 적갈색 소변, 분홍~적갈색 치아, 빈혈, 성장 불량을 보이고 치아·소변이 Wood 등에서 주황~적색 형광을 낸다. 원형포르피린증은 빈혈과 치아·소변 변색이 없다.</span><span class="hang">감별: 덕지 피부염(흰 털·색깔 털 구분 없음), 긴 털 소의 지속적 젖음, 핑크아이(광범위 피부염 없음), 일광화상(색소 옅은 착유우 유두 등, Rebhun).</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>치료와 예후<span class="hang">즉시 햇빛을 피하고 원인 식물·약을 끊으며 이미 먹은 독성 물질을 빼려고 완하제를 준다. NSAID, 코르티코스테로이드, 항히스타민제를 비경구로 충분히 주고 패혈증 예방 항균제를 고려한다. 탈락 피부는 괴사조직을 제거하고 구더기를 감시한다.</span><span class="hang">일차성 예후는 피부 손실이 넓지 않으면 양호~보통이고 간성은 대부분 심한 간담도 질환이라 나쁘다(Rebhun). 상재지에서는 피부색 짙은 품종으로 위험 목초지를 쓸 수 있다. 포르피린증은 햇빛 차단 외 치료가 없고 도태하며 부모의 보인자 여부를 등록 단체에 알린다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>피부 괴사·괴저(gangrene) — 분류와 원인<span class="hang">건성 괴저는 동맥 폐색으로 생기며 마르고 쪼그라든 검붉은 조직에 경계선이 뚜렷하고 세균이 살지 못해 부패가 없다. 습성 괴저는 정맥·림프 폐쇄로 축축하고 붓고 차며 부패균 감염으로 악취와 패혈증 위험이 있다. 가스 괴저는 C. perfringens 감염이다.</span><span class="hang">원인: 욕창(젖소에서 가장 흔함, 장기 기립불능과 깔짚 없는 콘크리트), 고무링·끈·수술 후 남긴 꼬리 붕대 압박, 부식제, 화상·동상, 클로스트리듐 감염, 괴저성 유방염, BHV-2 유두염, 맥각·톨페스큐 중독, 에피네프린 함유 국소마취제 피내 주사, 송아지 살모넬라 패혈증 색전(발목~제관 사이 경계 뚜렷한 탈락), 광과민증 말기.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>증상과 치료<span class="hang">건성은 처음부터 마르고 차고 함몰되며 적갈색에 냄새가 없고 미라 같다. 탈락이 오래 걸리고 아래에 육아조직이 있다. 습성은 축축하게 스며 나오고 붓고 변색되며 차갑다. 가장자리에서 분리되어 마르기 전에 떨어질 수 있고 아래가 생살로 젖어 있다.</span><span class="hang">원인을 제거한다. 습성은 수렴·항균 연고로 괴저 조직 분리를 돕고 2차 감염을 막으며 심하면 적극적 괴사조직 제거나 절단을 한다. 전신 항균제는 괴저 조직에 이르지 못하지만 패혈증이 의심되면 쓴다(Constable). 건성은 스스로 분리면을 만들므로 자연 탈락을 기다린다.</span><span class="hang">파상풍 예방이 항상 필요하며 탈락 기간에는 파상풍 톡소이드 2주 간격 2회가 가장 좋다. 구더기를 막으려 파리를 방제한다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>동상(frostbite)<span class="hang">건강한 동물에선 드물고 신생 송아지나 쇼크·독혈증으로 말초 순환이 떨어진 소에 생긴다. 귀끝, 꼬리, 유두, 음낭, 다리 아래가 잘 걸린다. 경도는 창백·감각 저하 뒤 아픈 홍반·인설·탈모, 중도는 건성 괴저·무감각·탈락이다.</span><span class="hang">젖은 말단이 심하게 추워지면 위험하다. 유두 침지제가 마르기 전에 착유우를 우사로 내보내거나 허치 송아지 주둥이에 우유가 얼면 생긴다. 건강한 소는 -12.2°C(10°F)보다 따뜻하면 드물고 -17.8°C(0°F) 이하나 풍속 냉각에선 흔하다. 분만 유방 부종이 심한 초산우 유두가 특히 위험하다.</span><span class="hang">재동결이 없는 곳으로 옮겨 40.5~43.9°C(Rebhun) 또는 38~44°C(LAIM) 물로 빨리 녹인다. 빠른 해동이 더 아프지만 손상이 적으므로 진통제를 준다. 라놀린·알로에 연고를 바른다. 넓으면 전신 항균제와 파상풍 예방을 한다. 한번 동상 입은 조직은 다시 걸리기 쉽다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">55.</span><span>탈모 감별·아연 결핍 — 기전별 분류<table class="bxt"><tr><th>기전</th><th>예</th></tr><tr><td>모낭 미발달·소실</td><td>선천성 무모증, 깊은 상처·화상·심한 종기 흉터(반흔성 탈모, 재생 안 됨)</td></tr><tr><td>털 생성 실패(선천)</td><td>유전성 대칭 탈모, 무모증·무치증(주로 수송아지), 홀스타인 치사성 무모증, 털색 연관 모낭 이형성, baldy calf, 어미 요오드 결핍(갑상선종)</td></tr><tr><td>털 생성 실패(후천)</td><td>말초신경 손상, 모낭 감염, 원형 탈모증(alopecia areata, 검은 털 품종 소인), 베스노이티아증</td></tr><tr><td>생긴 털 소실</td><td>링웜, 덕지 피부염, 영양 불량·중병 뒤 대사성 탈모(심한 설사, 반추위 음수 송아지), 비동물성 지방 대용유, 이·진드기·옴으로 비비기, 탈륨·셀레늄·비소·수은·Leucaena 중독, 비육 수소 꼬리털 탈락</td></tr></table><span class="hang">털이 부러진 경우는 그루터기나 새 털이 보이고, 털이 나지 않은 경우는 피부가 반들거리고 얇다. 긁어내기·면봉 검사로 원인이 안 나오면 생검으로 모낭 상태를 본다. 원형 탈모증은 생검으로 확진하며 병변이 적으면 1년 안에 저절로 회복하기도 하나 넓으면 회복하지 않는다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>탈모 — 자주 만나는 비감염성 원인<span class="hang">생장기 탈락(anagen defluxion): 폐렴·패혈증·심한 설사로 고열을 앓은 며칠 뒤 목·몸통·다리 털이 넓게 빠지고 피부는 건강하며 그루터기가 만져진다. 원발병이 나아갈 때 나타나 농가를 걱정시키지만 몇 주 뒤 다시 자란다. 휴지기 탈락은 스트레스 2~3개월 뒤의 지연 탈모다(Rebhun).</span><span class="hang">접촉성 피부염·분뇨 오염: 양동이로 대용유를 먹인 송아지의 주둥이·귀 탈모, 오래 누운 소의 회음·배·뒷다리의 분홍빛 탈모가 생긴다. 순한 비누로 씻고 말려 마른 깔짚을 주고 산화아연 연고를 바른다.</span><span class="hang">송아지 저지방혈증(한우 송아지핸드북): 설사로 포유를 못하거나 젖이 부족·불량하면 필수지방산(리놀레산, 리놀렌산, 아라키돈산)이 부족해 부분·전신 탈모와 각화가 생기고 발육이 늦다. 옥수수·콩·땅콩 기름을 먹이거나 인트라리포즈 3 mL/kg을 정맥주사한다. 설사 치료 중에도 어미와 떼지 말고 포유시킨다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>아연 결핍(착각화증) — 원인<span class="hang">반추동물의 일차 결핍은 드물다. 토양 pH 6.5 초과, 질소·인 비료 증가, 같은 토양 풀보다 아연이 적은 일부 콩과식물, 노숙한 식물이 위험을 높인다. 어린 풀, 늦게 벤 건초, 과도한 황, 사일리지 토양 오염은 이용률을 떨어뜨려 이차 결핍을 만든다(Constable). Bovine Medicine은 구리·철 과잉을 원인으로 들고 흔하지만 과소 진단된다고 쓴다.</span><span class="hang">송아지는 아연 40 mg/kg 사료에서 건강했으나 아연 20~80 mg/kg(정상 93 mg/kg)에 칼슘 0.6%인 목초를 먹는 소에서 착각화가 생겼다.</span><span class="hang">유전성(치사 형질 A46, Adema병)은 홀스타인-프리지안의 상염색체 열성 SLC39A4 변이로 장에서 아연을 거의 흡수하지 못하며 4~8주령에 증상이 나타나고 아연 투여로 낫는다. 출생 시 혈장 아연은 정상이다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>아연 결핍 — 증상<span class="hang">자연 발생 중증 소는 피부의 약 40%에 착각화·탈모가 생기며 주둥이, 음문, 항문, 꼬리 기부, 귀, 뒷다리 뒤쪽, 무릎 주름, 옆구리, 목에 뚜렷하다. 대부분 체형이 나쁘고 발육이 늦다. 가려움은 없다고도(Constable 요약) 심하거나 없다고도(Rebhun) 기술된다.</span><span class="hang">실험 증례는 성장 불량, 경직 보행, 제관·비절·무릎 부종, 뒷발목 앞쪽의 액체 찬 부종, 다리·음낭·목·콧구멍 주위 피부 주름, 치아 주위 출혈, 치판 궤양을 보이고 유두 착각화가 착유 중 미란된다. 결핍 사료 약 2주 뒤 증상이 나와 조직 저장이 없음을 보여준다.</span><span class="hang">결핍은 젖소 유방염 위험(혈청 9.7 µmol/L 미만), 수정률·정액 질 저하, 상처 치유 지연, 야맹증·눈물(Bovine Medicine)과도 연관된다. 분만 직전 혈장 아연이 급락하며 난산 소에서 더 떨어져 미경산우 난산과 아연 결핍의 연관이 가설로 제기되었다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>아연 결핍 — 진단과 치료<span class="hang">긁어내기는 음성이고 생검에서 착각화를 확인한다. 혈청 아연 정상은 80~120 µg/dL(12.2~18.2 µmol/L)이고 결핍 송아지는 18 µg/dL(3.0 µmol/L)까지 떨어진다. 결핍 사료 1주에 정상의 약 50%가 된다. 혈중 아연은 분만, 고열 스트레스, 다른 질병으로 쉽게 떨어져 단독 수치는 오해를 부른다. 털 아연은 정확한 지표가 아니다.</span><span class="hang">감별: 개선충 옴(심한 가려움, 진드기 검출, 살충제 반응), 링웜, 비타민 A 결핍, 기타 발육 부진.</span><span class="hang">소는 응급으로 황산아연 2~4 g/일을 먹이고 이후 아연 비료를 준다. 아연 치료 후 1주에 호전, 3주에 완치된다(유전성도 1~3주에 반전). 고용량 아연은 구리를 추가 급여하는 소의 구리 흡수를 방해한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">60.</span><span>피하 농양·방선균증·방선간균증 — 피하 농양(subcutaneous abscess)<span class="hang">대부분 외상성 피부 관통 후 감염이다. 여우꼬리풀(Hordeum jubatum) 같은 까락이 볼 점막으로 파고들면 Trueperella pyogenes와 Actinobacillus spp.에 의한 얼굴 농양이 여러 마리에 동시에 생긴다. 피막이 잘 형성되므로 외과적으로 배농해 개방창으로 치료하며 비경구 항균제·요오드 치료는 효과가 없다(Constable).</span><span class="hang">볼 근육·목 농양은 연부조직에 있고 움직여 움직이지 않는 방선균증 병변과 구별되며 절개·배농으로 빨리 낫는다. 이빨과 볼 사이에 낀 이물·마른 사료도 비슷해 보이므로 갑자기 부었으면 입 안을 본다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>방선균증(actinomycosis, 혹턱 lumpy jaw) — 원인과 증상<span class="hang">Actinomyces bovis는 구강 상재균이다. 날카로운 사료나 이물로 생긴 구강 점막 상처, 치아 맹출 중인 치조로 들어가 골막염·골수염(희박성 화농육아종성)을 만든다. 산발적이지만 흔하고 치료 반응이 나쁘다. 거친 판자 사료조를 공유한 60두 중 7두가 걸린 유행 사례가 있다(Rebhun).</span><span class="hang">하악·상악의 가운데 어금니 높이에 통증 없는 단단한 뼈 종창으로 시작한다. Rebhun은 초기엔 따뜻하고 아픈 부종이 단단한 뼈 종창 위에 겹쳐 외상과 혼동된다고 쓴다. 몇 주~몇 달에 걸쳐 커지며 움직이지 않고 나중엔 아프다. 하악 안쪽으로 커지면 늦게 발견된다.</span><span class="hang">피부를 뚫고 꿀 같은 끈적한 고름에 작고 단단한 황백색 과립을 소량 낸다. 누관은 아물고 새로 생기기를 반복한다. 치아가 비뚤어지고 아파 씹기 어렵고 수척해진다. 국소 림프절은 침범하지 않는다. 연부조직형은 식도구·하부 식도·제2위 전벽을 침범해 주기적 설사, 만성 고창, 이식증을 보인다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>방선균증 — 진단과 치료<span class="hang">배농되는 고름의 그람 염색에서 그람 양성 분지 사상균, 으깬 과립 도말이나 조직에서 곤봉 집락을 본다. 배농되지 않으면 조직 코어 생검이나 흡인을 한다. 방사선 사진은 다발성 방사선 투과 부위와 골막 증식을 보여 골종양, 치근 감염, 골절, 부골, 부비동염과 감별한다.</span><span class="hang">외과적 괴사조직 제거와 항균 치료, 특히 요오드를 쓴다. 요오드화물은 방선균증에는 효과가 상대적으로 낮아 항균제의 보조로 본다(Rebhun). 초기 병변은 성공하나 큰 병변은 거의 반응하지 않아 일찍 치료한다.</span><table class="bxt"><tr><th>약</th><th class="c">용량</th><th>출처</th></tr><tr><td>요오드화나트륨 10~20%</td><td class="c">70 mg/kg 서서히 IV, 7~10일 뒤 반복 가능</td><td>Constable</td></tr><tr><td>요오드화나트륨</td><td class="c">30 g/450 kg IV 1회 또는 요오드 중독까지 2~3일 간격</td><td>Rebhun</td></tr><tr><td>요오드화칼륨</td><td class="c">6~10 g/두 PO 1일 1회 10일</td><td>Constable</td></tr><tr><td>프로카인 페니실린</td><td class="c">44,000 IU/kg IM 1일 1회 7일</td><td>Constable</td></tr><tr><td>프로카인 페니실린</td><td class="c">22,000 U/kg 1일 1회</td><td>Rebhun</td></tr><tr><td>옥시테트라사이클린</td><td class="c">10 mg/kg IM 1일 1회 7일 이상, 지속성 20 mg/kg 72시간마다</td><td>Constable</td></tr><tr><td>플로르페니콜</td><td class="c">20 mg/kg IM 48시간마다</td><td>Constable</td></tr><tr><td>이소니아지드</td><td class="c">2.5~5 mg/kg(표) 또는 10~20 mg/kg(본문) PO 1일 1회 30일</td><td>Constable, Rebhun 10~20 mg/kg</td></tr></table><span class="hang">이소니아지드는 유산을 일으킬 수 있다. Bovine Medicine은 아목시실린을 1차, 아목시실린·클라불란산을 2차로 두고 요오드화나트륨 IV를 병용한다.</span><span class="hang">한우 송아지핸드북: 초기에는 페니실린 3일 이상으로 쉽게 낫고 뼈 깊이 누관이 생기면 어렵다. 배농 후 투약하고 악화된 병변은 수술이 필요하다. 거친 조사료와 철사 같은 날카로운 물체를 치운다. 배농 병변이 있는 소는 격리하거나 처분한다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>방선간균증(actinobacillosis, 나무혀 wooden tongue) — 원인과 증상<span class="hang">Actinobacillus lignieresii는 상부 소화관 상재 그람 음성균이다. 소에서는 혀 고랑의 궤양·관통상, 혀끝 관통상, 치아에 의한 혀 옆 열상으로 들어간다. 거친 목초나 가시 까락, 질긴 건초, 날 선 볏짚, 구리 결핍 지역에서 집단 발생한다. 코잡이, 경정맥 주사, 수술 부위(제4위 고정술 토글)에도 육아종이 생긴다.</span><span class="hang">급성은 약 48시간 못 먹고 침을 많이 흘리며 이물이 있는 듯 혀를 살살 씹는다. 혀가 붓고 특히 기부가 딱딱하며 끝은 정상처럼 보이고 만지면 아파한다. 혀 옆에 결절·궤양이 있다. 턱밑 봉와직염과 침관 확장(하마종)이 동반되며 급성기엔 발열이 있다. 만성은 섬유화로 혀가 쪼그라들고 움직이지 않아 수척해진다.</span><span class="hang">고름의 유황 과립(곤봉 장미꽃 모양)은 A. bovis, 녹농균, 황색포도구균 육아종에서도 보여 특이적이지 않다. 균 분리가 확진이며 만성이거나 항균제를 쓴 뒤에는 어렵다. 감별: 구강 이물, 광견병, 식도 폐색, 결핵, 피부 림프종, 종양, 과잉 육아조직.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>방선간균증 — 치료와 예방<span class="hang">요오드화물이 표준 치료이며 방선간균증에서는 반응이 극적이고 영구적이다. 요오드화칼륨 6~10 g/일 PO 7~10일, 또는 요오드화나트륨 70 mg/kg을 10~20% 용액으로 1회 IV한다. 연부조직은 1회 과정으로 24~48시간에 급성 증상이 사라지고 뼈 병변은 10~14일 간격으로 1~2회 더 한다(Constable). Rebhun은 20% 요오드화나트륨 70 mg/kg을 2~3일 간격으로 요오드 중독까지 반복하거나 IV 후 유기 요오드 1 oz/450 kg/일 급여를 쓴다.</span><span class="hang">눈물, 식욕부진, 기침, 비듬 같은 인설이 생기면 요오드 중독으로 보고 중단한다. 만삭우에서 드물게 유산 보고가 있어 알린다(실험 재현은 안 됨, Rebhun은 가능성이 낮다고 봄). 미국에서는 착유우에 주사용 요오드가 허가되지 않는다.</span><span class="hang">설폰아마이드, 페니실린, 스트렙토마이신, 광범위 항균제를 병용하며 피부형은 스트렙토마이신·디하이드로스트렙토마이신을 2~4주 쓸 수 있다. Bovine Medicine은 옥시테트라사이클린을 1차, 아목시실린을 2차로 둔다. 육아종은 해부학적으로 가능하면 축소 절제 후 내과 치료하고 좁은 기부의 버섯형 육아종엔 냉동치료를 더한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">65.</span><span>피부 편평세포암과 기타 피부 종양<span class="hang">편평세포암은 젖소에서 가장 흔한 악성 피부 종양이다. 눈꺼풀·음문 같은 점막피부 경계에 색소가 없는 소가 위험하며 햇빛, 나이(위험 연령 7~9세), 유전, BPV 감염이 관여한다. 만성 자극 상처, 낙인 각화종, 나이 든 소의 유방·귀끝에서도 생긴다. 음문은 색소 없는 쪽에 더 많고 에어셔에서 잘 생긴다.</span><span class="hang">색소 없는 부위에서 솟거나 궤양된 분홍색 자갈 모양 종괴가 특징이며 흰~노란 괴사물이 덮이고 악취가 나 파리와 구더기를 끈다. 생검으로 확진한다. 전이는 약 10%이고 국소 침윤과 국소 림프절 침범이 더 흔한 문제다. 작은 종양은 냉동수술, 고주파 온열, 방사선, 절제가 좋다. BCG 종양 내 주사는 이후 결핵 검사 위양성을 일으키므로 쓰지 않는다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>눈 검사 원칙<span class="hang">머리를 잘 보정하고 이개안검신경 차단(2% 리도카인)으로 안검 경련을 풀면 아픈 눈을 보기 쉽다. 머리를 아래로 돌리면 각막이 잘 드러난다. 어두운 곳에서 초점 광원으로 직접·측방 조명한다.</span><span class="hang">동공 대광반사를 본 뒤 빛을 반대 눈으로 빨리 옮긴다(swinging flashlight). 실명에 대광반사가 없으면 망막, 시신경, 시신경교차, 근위 시삭 병변이고, 실명인데 반사가 정상이면 대개 대뇌피질 병변이다.</span><span class="hang">눈이 아픈 모든 소는 플루오레세인으로 각막·결막의 미란·궤양을 확인한다. 기질 농양은 상피가 덮여 염색되지 않을 수 있다. 배양 면봉은 국소마취제 점안 전에 채취한다. 안압 저하는 포도막염, 상승은 녹내장을 뜻한다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>소에서 흔한 안질환 감별(Rebhun 등)<table class="bxt"><tr><th>질병</th><th>전신 상태</th><th>눈 소견</th></tr><tr><td>IBK</td><td>열 없고 건강, 한쪽·양쪽</td><td>중심 각막 궤양 또는 국소 부종이 궤양으로, 어린 소·신규 도입우, 4~6주에 회복</td></tr><tr><td>IBR 결막염</td><td>콧물·발열, 양쪽</td><td>흰 판이 있는 결막부종, 5~7일 뒤 주변부 각막 부종(중심 투명), 1~2주 회복</td></tr><tr><td>악성카타르열</td><td>고열, 양쪽</td><td>약 5일부터 곧고 깊은 각막 내 혈관을 동반한 주변부 각막염, 전방축농, 범포도막염, 저이환·고폐사</td></tr><tr><td>리스테리아 각결막염</td><td>건강, 주로 한쪽</td><td>각막윤부에서 중심으로 퍼지는 청백색 혼탁, 궤양 드묾, 포도막염, 겨울·사일리지</td></tr><tr><td>편평세포암</td><td>건강, 5~10세</td><td>외측 각막윤부(75%)·눈꺼풀(15%)·순막(10%)의 분홍~흰 콜리플라워 종괴, 진행 전 통증 없음</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">68.</span><span>전염성 각결막염(IBK, 핑크아이) — 원인<span class="hang">용혈성이고 선모(pili)를 가진 Moraxella bovis가 코흐 가설을 충족한 유일한 병원체다. 선모(Q형이 I형보다 부착·감염력이 높음)로 각막 상피에 붙고 β-용혈소(RTX 계열 세포독소)가 상피를 파괴한다. 선모는 7개 혈청군이 있고 항체에 대응해 항원을 바꾼다.</span><span class="hang">Moraxella bovoculi(2007년 명명)는 최근 IBK 검체에서 가장 많이 분리되고 급성 IBK와 가장 상관되지만 실험 접종에서 궤양을 재현하지 못해 직접 원인인지 위험 요인인지 불확실하다. M. ovis, Mycoplasma spp., IBR 바이러스는 각막 손상과 분비물 증가로 위험을 높인다. 약독 IBR 생백신을 함께 주면 실험 IBK가 더 심했다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>역학과 경제적 의미<span class="hang">여름·가을에 많고 유행 3~4주째 정점이며 이환율이 80%(공격률 90~100%)까지 이르나 폐사는 없다. 영구 실명·안구 소실은 드물다. 겨울에도 밀집 축사·비육장에서 심한 발생이 있다.</span><span class="hang">소가 유일한 보유숙주이고 결막, 비강, 질에 보균한다. 무증상 보균우가 1년 넘게 다음 해 감염원이 된다. 얼굴파리(Musca autumnalis)가 주 매개체로 몸 겉에서 3일, 장 안에서 2일 균이 산다. 파리가 없으면 실험 전파가 드물다.</span><span class="hang">어린 소가 가장 감수성이나 감수성 집단에선 모든 연령이 걸린다. Bos taurus가 Bos indicus보다, 헤리퍼드 계통이 더 걸리고 양쪽 감염도 많다. 눈꺼풀 색소가 완전한 눈은 덜 걸린다. 회복하면 다음 계절까지 면역이 남는다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>임상증상<span class="hang">잠복기는 2~3일(실험 최대 3주)이다. 각막 혈관 충혈과 결막 부종, 다량의 눈물, 안검 경련, 눈부심이 먼저 오고 일부는 경도~중등도 발열, 유량·식욕 저하가 있다.</span><span class="hang">1~2일 뒤 각막 중심(Rebhun: 중심 또는 중심 아래)에 작은 혼탁(부종)이 생기고 다음 2일 동안 솟아 궤양이 된다. 이 단계에서 자연 회복도 흔하다. 진행하면 혼탁이 넓어져 증상 약 6일 뒤 각막 전체를 덮기도 하며 색은 흰색~진한 노랑이다.</span><span class="hang">염증이 가라앉으면 눈곱이 화농성이 되고 혼탁이 줄어 총 3~5주에 회복한다(Rebhun 4~6주). 약 2%는 완전 혼탁이 남고 대부분은 작은 흰 흉터만 남는다.</span><span class="hang">심하면 각막이 원추형으로 솟고 혈관이 증식하며 정점의 궤양 아래 밝은 노란 고름과 홍반대가 생겨 터지면 실명한다. 깊은 궤양은 가장자리가 녹아 괴사해 보이고 중심이 투명하거나 어두우면 데스메막에 가깝다. 2차 포도막염은 전방축농, 후방 유착, 백내장을 남긴다.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>진단과 감별<span class="hang">임상 소견과 군 이환율로 대개 진단한다. 배양은 활동성 궤양 가장자리를 면봉으로 문지르고 결막낭은 피하면 오염이 줄고 Moraxella 분리가 좋아진다. β-락탐 치료에 반응하지 않으면 마이코플라스마를 고려한다. 혈청검사는 임상 의미가 적다.</span><span class="hang">감별: 외상성 결막염(이물), Pasteurella multocida A형(축사 미경산우, 72시간 안에 심한 기질 소실), Mycoplasma bovis(눈꺼풀 부종이 두드러짐), 클라미디아(같은 양상이나 경과가 길고 이환율 높음), 리스테리아 각결막염(다른 계절, 궤양 드묾), IBR, 악성카타르열, BVD, 블루텅, 안충증, 편평세포암, 광과민증 각막염.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>치료 약제<table class="bxt"><tr><th>경로·약</th><th class="c">용량</th><th>출처</th></tr><tr><td>국소 벤자틴 클록사실린 안연고</td><td class="c">250~375 mg, 72시간 간격 2회, 한쪽만 걸려도 양쪽</td><td>Constable</td></tr><tr><td>국소 겐타마이신·에리스로마이신·토브라마이신 연고</td><td class="c">하루 여러 번, 유방염 연고 사용 가능</td><td>Rebhun</td></tr><tr><td>결막하 프로카인 페니실린 G</td><td class="c">300,000 IU/mL 1~2 mL, 48~72시간 간격 2회</td><td>Constable</td></tr><tr><td>결막하 페니실린 G</td><td class="c">300,000 U(1 mL)</td><td>Rebhun</td></tr><tr><td>결막하 페니실린</td><td class="c">600,000 IU/2 mL</td><td>Blackwell</td></tr><tr><td>안검 내 10% 옥시테트라사이클린</td><td class="c">1~2 mL 1회</td><td>Constable</td></tr><tr><td>지속성 옥시테트라사이클린</td><td class="c">20 mg/kg IM, 48~72시간 간격 2회</td><td>Constable</td></tr><tr><td>플로르페니콜</td><td class="c">20 mg/kg 48시간 간격 2회 또는 40 mg/kg SC 1회</td><td>Constable, LAIM</td></tr><tr><td>툴라스로마이신</td><td class="c">2.5 mg/kg SC 1회</td><td>Constable, LAIM</td></tr><tr><td>틸미코신</td><td class="c">5(~10) mg/kg SC 1회</td><td>Constable</td></tr><tr><td>세프티오푸르(CCFA)</td><td class="c">6.6 mg/kg 귀 뒤쪽 기부 SC 1회</td><td>Constable, LAIM</td></tr></table><span class="hang">자연 치유가 흔하지만 조기 치료는 흉터를 줄인다. 영향받은 개체만이 아니라 군 전체를 치료하면 추가 발생이 멈출 수 있다. 플로르페니콜은 지속성 옥시테트라사이클린보다 치유가 빠르고 재발이 적었다. 미국에서 IBK 표시 허가는 옥시테트라사이클린과 툴라스로마이신뿐이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>결막하·안검 주사 요령과 휴약<span class="hang">결막하 주사는 반드시 안구 결막(bulbar conjunctiva) 아래에 놓는다. 위쪽 눈꺼풀 결막 주사는 효과가 없었다. 결막하 항균제는 저장형이 아니어서 12시간 안에 흡수되고, 효과가 직접 확산 때문인지 주사 부위에서 결막으로 새는 약 때문인지 논란이 있다(Rebhun은 눈꺼풀 주사는 새는 약 말고는 소용없다고 본다).</span><span class="hang">결막하 페니실린 2회는 지속성 옥시테트라사이클린 20 mg/kg 1회와 효과가 비슷했지만 재발은 더 많았고 송아지 집단에 놓아도 감염을 없애지 못했다. 안검 내 옥시테트라사이클린 2 mL는 전신 옥시테트라사이클린(20 mg/kg)과 효과가 같았고 일시적으로 눈꺼풀이 부어 눈을 덮는데 이것이 각막을 보호해 치유를 도울 수 있다.</span><span class="hang">착유우에 결막하 페니실린 300,000 U(1 mL)를 놓으면 22시간까지 우유에서 잔류가 검출된다(Rebhun). 유방염 연고나 안연고도 우유·고기 휴약을 지킨다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>보조 치료<span class="hang">심한 개체는 직사광선을 피해 어두운 곳에 두거나 눈 위에 붙여 들쳐 약을 넣을 수 있는 안대(데님 패치)를 쓴다. 안대는 아래로 배액되게 하고 주 2~3회 밑을 확인한다.</span><span class="hang">1% 아트로핀 안연고(하루 2회)로 모양체 경련과 통증을 줄이고 국소마취제를 병용할 수 있다. 심하면 NSAID(플루닉신)를 쓴다. 심한 궤양은 순막을 며칠 각막 위로 봉합하거나 안검 봉합을 한다. 코르티코스테로이드 국소·결막하 투여는 흔히 쓰이지만 치유를 개선하지 못하고 악화시킬 수 있다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>예방<span class="hang">파리 방제(송아지 살충제 함침 귀표, 등·얼굴 문지르개), 방목 전 웃자란 풀 베기, 먼지 감소, 결핍 지역의 구리·셀레늄 보충, 기구·손·굴레를 통한 의인성 전파 차단이 핵심이다. 감염우를 다룰 때 일회용 장갑을 끼고 굴레와 기구는 10% 가정용 표백제(1:9 희석, 매일 새로 만들고 오염되면 교체)로 소독한다.</span><span class="hang">시판 M. bovis 세균 백신은 30년 넘게 나왔지만 효과가 일관되지 않다. 선모 항원 다양성과 항원 전환 때문이다. M. bovoculi 백신(2017년 조건부 허가)도 있다. 자가백신은 피하·결막하 접종 모두 효과가 없었다는 대조 시험이 있다. 접종은 예상 발생 4주(LAIM 4~6주) 전에 시작한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">76.</span><span>눈 편평세포암(cancer eye) — 원인과 역학<span class="hang">소에서 가장 흔한 종양 중 하나이며 미국 연방 검사 도축장 소 도체 폐기의 12.5%가 이 병 때문이었다(LAIM). 눈 주위·각막공막 색소 부족(유전율이 높음, 시멘탈 눈 주위 색소 h2 0.79)과 자외선의 유전-환경 상호작용이 원인이다. 유두종 바이러스가 전구 병변에서 발견되나 종양 유지에 필요하지는 않아 역할이 불분명하다.</span><span class="hang">햇빛을 많이 받는 육우, 머리가 흰 헤리퍼드·시멘탈과 거의 흰 홀스타인에 많다. 5세 미만은 드물고 3세 미만은 거의 없다(Rebhun 5~10세). 자외선 노출이 클수록 더 어린 나이에 생긴다. 다발 지역에서는 색소 없는 음문 병변도 흔하다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>진행 단계와 증상<span class="hang">전구 병변은 판(1단계), 각화종·각화극세포종(2단계), 유두종(3단계)이며 자연 퇴행률이 높다(작은 전구 병변 최대 88%). 4단계 편평세포암은 퇴행하지 않는다. 지름 2 cm 넘는 병변은 대개 암이다.</span><span class="hang">무혈관 각막과 색소 있는 눈꺼풀에서는 시작하지 않고 주변에서 혈관을 끌고 침범한다. 외측 각막윤부가 약 3/4을 차지하고, 순막(제3안검, 가장 빨리 자람)과 아래 눈꺼풀 중간~안쪽이 그다음이다.</span><span class="hang">고전적 병변은 넓은 기부로 붙은 살집 있고 부서지며 괴사·궤양된 유두종 모양 종괴로 눈을 감아도 보이고 눈물과 고름을 낸다. 만성 비치유성 눈꺼풀 궤양, 납작한 딱지, 사마귀 모양으로도 나타난다(Rebhun).</span><span class="hang">국소 침윤은 흔하나 림프절(이하선, 턱밑, 경정맥구)과 내장 전이는 늦게 일부에서만 생긴다. 눈꺼풀 종양이 진단 시 부피가 커서 더 잘 전이한다. 내안각 종양은 2 cm만 진행해도 안와로 들어가 우려가 크다. 같은 쪽 콧구멍의 악취 나는 화농성 콧물은 부비동·비강 침윤을 시사하며 안락사를 고려한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>진단과 감별<span class="hang">전구 병변과 암은 임상으로 구별이 어려워 박리 세포검사나 생검을 한다. 세포검사는 반응성 상피세포와 혼동되어 확정적이지 않을 수 있어 조직검사를 권한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">79.</span><span>치료와 예방<table class="bxt"><tr><th>방법</th><th>적응·요점</th></tr><tr><td>외과적 절제</td><td>2 cm 미만(Rebhun 2.5 cm 미만), 2~3 mm 이상 정상 조직 포함, 눈꺼풀 가장자리를 아끼는 오각형(텐트형) 절제. 3 cm 미만 순막 종양은 순막 전체를 연골까지 제거(최소 5 mm 여유)</td></tr><tr><td>냉동괴사</td><td>액체질소 2회 동결-해동, 종양 주변 정상 피부가 -40°C에 이르도록, 각막은 스티로폼으로 보호. 중간 크기에 좋고 눈꺼풀 가장자리 보존. 7~14일에 괴사 탈락, 탈색·흰 털 남음</td></tr><tr><td>고주파 온열</td><td>50°C, 깊이 3~5 mm까지만, 작거나 축소한 종양</td></tr><tr><td>방사선</td><td>스트론튬-90 베타선 부위당 10,000 rad, 깊이 2 mm 미만</td></tr><tr><td>면역요법</td><td>종양 추출물 백신(동결건조 200 mg이 100 mg보다 회복률 높음), 인터루킨-2 종양 주위 200,000~2,000,000 U 매일 10일, BCG 종양 내(영구 퇴행 37%, 재발 26%, 계속 성장 37%). 젖소는 결핵 위양성 때문에 BCG 금지(Rebhun)</td></tr><tr><td>적출·안와 내용물 적출</td><td>2 cm(Rebhun은 5 cm 넘는 큰 눈꺼풀 종괴) 넘는 침윤성 종양. 출혈과 수술 후 감염(53두 중 19%)이 주 문제, 적출 후 재발은 드묾. 안구 뒤 종양 의심 시 안와 내용물 전체 적출</td></tr></table><span class="hang">순막 절제 후 국소 항균제를 하루 3~4회 7일, 페니실린 22,000 U/kg을 1일 1회 3일 준다(Rebhun). 비임신우는 수술 10~14일 전 국소 스테로이드로 종양 경계를 뚜렷하게 할 수 있다.</span><span class="hang">예방은 눈꺼풀 색소를 늘리는 육종, 진단우의 직계 자손과 부모 제거, Bos indicus와 교배다. 정기 검사로 일찍 찾아 작을 때 치료하며 '두고 보지 말라'(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">80.</span><span>IBR 결막염·악성카타르열·리스테리아 각결막염 — IBR 결막염(BHV-1 눈 형태)<span class="hang">전형적 붉은코(호흡기형)에서도 결막염이 흔하지만 결막염이 주 증상인 집단 발생이 비접종 소에 생기며 핑크아이로 오진하기 쉽다. 군의 10~70%가 걸리고 한쪽 또는 양쪽이다.</span><span class="hang">결막 충혈, 48~72시간에 장액성에서 점액화농성으로 바뀌는 다량의 눈곱, 각막윤부 근처 눈꺼풀 결막의 다발성 흰 판(병리특징적)이 보인다. 착유 성우는 40.6~42.2°C 고열, 침울, 유량 감소로 아파 보이고 미경산우는 덜하다.</span><span class="hang">5~9일 뒤 판이 합쳐 탈락하고 결막 부종이 심해지며 일부는 중심을 남기는 원형 주변부 각막 부종을 보인다(IBK는 중심이 흐림). 1차 각막 궤양은 없고 각막은 2차 세균감염 때만 손상된다.</span><span class="hang">진단은 결막 도말 형광항체, 바이러스 분리, PCR, 쌍혈청이며 바이러스는 발병 7~9일 뒤엔 눈에서 잘 나오지 않는다.</span><span class="hang">치료 없이 14~20일에 낫는다. 심하면 분비물을 닦고 광범위 항균 안연고로 2차 감염을 막는다. 이 시기 코르티코스테로이드는 어떤 경로든 금기다. 동반한 각막윤부 기질 각막염은 2~4주에 저절로 낫는다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>악성카타르열(MCF)의 눈 소견<span class="hang">두부·안구형이 가장 흔하다. 41~41.5°C 고열, 심한 침울, 다량의 점액화농성 콧물과 함께 눈곱, 정도가 다양한 각막 부종, 안검 경련, 포도막염, 공막 혈관 충혈이 나타난다. 항상 양쪽이다.</span><span class="hang">각막 부종은 항상 어느 정도 있으며 각막공막 경계의 좁은 회색 고리에서 시작해 중심으로 퍼진다. 약 5일부터 곧고 깊은 각막 내 혈관이 보인다. 단핵구성 전방축농, 각막 후면 침착물, 방수 혼탁, 섬유소, 홍채 충혈·부종, 축동 같은 전포도막염이 일부~대부분에 있다.</span><span class="hang">각막 부종의 진행과 포도막염 지속은 생존 가능성이 낮음을 뜻한다(처음 부종 정도는 예후와 무관). 만성형은 양쪽 각막 백반이나 중심 기질 각막염이 남는다. 콧물, 각막 부종, 발열, 림프절 종대가 점막병·블루텅과의 감별에 도움 되며 치료는 경과를 바꾸지 못한다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>리스테리아 각결막염·포도막염(사일리지 눈)<span class="hang">Listeria monocytogenes가 질 낮은 사일리지 입자와 함께 눈에 들어가 생기며 전신 리스테리아증과 무관하다. 큰 원형 베일이나 링 급이기에서 아래쪽부터 먹으면 위쪽 사료가 머리에 떨어져 위험하다. 늦가을~초봄 실내 사육기에 많다. 영국에서 전체 발생률 3.4%, 이환 농장 평균 66.5%가 보고되었다.</span><span class="hang">대개 한쪽이다. 눈물, 카타르성 결막염, 눈부심, 안검 경련 뒤 각막윤부에서 중심으로 퍼지는 청백색 혼탁, 전방의 흰 섬유소 반점, 홍채의 흰 반점, 전방축농이 생긴다. 궤양은 드물다. 치료 없이 1~3주에 낫는 자기 한정성이다.</span><span class="hang">치료(Constable): 클록사실린 안연고 250 mg 48시간마다, 옥시테트라사이클린 안연고 24시간마다, 프로카인 페니실린 40,000 IU/kg IM 1일 1회, 옥시테트라사이클린 10 mg/kg IM 1일 1회, 암피실린 10 mg/kg SC 1일 1회. Rebhun은 국소 아트로핀을 항상 쓰고 국소 덱사메타손 하루 3~4회는 포도막염을 줄이고 경과를 줄이나 임신우는 주의하라고 쓴다.</span><span class="hang">질 낮은 사일리지를 피하고 사료가 눈높이보다 낮게 오도록 급이한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">83.</span><span>비타민 A 결핍 실명 — 원인<span class="hang">장기간 건조한 목초지 방목, 녹색 사료 없는 실내 사육, 보리·볏짚 위주의 무보충 비육에서 생긴다. 노란 옥수수를 빼면 곡류에는 카로틴이 거의 없고 결핍 사료 5~18개월(비육우는 6~12개월) 뒤 증상이 나온다. 같은 사료에서 거세우가 암소보다 잘 걸리고 수컷이 더 약하다.</span><span class="hang">카로틴은 태반을 통과하지 않아 분만 전 녹색 사료를 먹여도 신생 송아지 간 저장이 늘지 않는다. 비타민 A 에스터(어유)와 주사는 태반을 통과한다. 결핍 미경산우의 송아지는 동공이 확대된 실명, 안구진탕, 허약, 운동실조를 보이고 소안구증, 무수정체, 각막 유피종이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">84.</span><span>증상<span class="hang">어두운 곳에서 못 보는 야맹증이 가장 먼저 나타나지만 익숙한 환경의 소에서는 현장에서 잘 드러나지 않는다. 참 안구건조증(각막 비후·혼탁)은 송아지에만 생긴다.</span><span class="hang">경련형: 6~8개월령 육우 송아지가 건조한 여름 목초지에서 이유된 뒤 흥분·운동 시 쓰러져 10~30초 간대-강직 경련을 한다. 뇌척수액압 상승 때문이며 대개 실명하지 않는다. 치료하면 48시간 안에 회복한다.</span><span class="hang">눈형: 주로 12~18개월령(2~3세까지)에 생긴다. 낮에도 양쪽 눈이 보이지 않고 양쪽 동공이 크게 확대·고정되어 빛에 반응하지 않는다. 시신경유두 부종, 유두 주위 망막 박리·출혈, 반사판 광택 감소가 보이고 위협반사는 없으나 안검·각막 반사는 있다.</span></span></p><p class="bx-num"><span class="bxn">85.</span><span>진단과 치료<span class="hang">혈장 비타민 A 20 µg/dL이 적정 하한이고 소 정상은 25~60 µg/dL이다. 시신경유두 부종은 18 µg/dL 미만에서 야맹증보다 먼저 생긴다. 한 비육우 발생에서 8.9~18 µg/dL은 체중 감소만, 4.9~8.9는 운동실조·실명, 4.9 미만은 경련과 시신경 협착을 보였다. 송아지 뇌척수액압은 정상 100 mm 미만에서 결핍 시 200 mm 넘게 오른다.</span><span class="hang">유지 요구량의 10~20배인 440 IU/kg를 즉시 비경구로 주며 유성보다 수용성 제제가 낫다(Rebhun은 며칠간). 사료로 최소 40 IU/kg/일을 공급한다. 실명한 눈형은 시신경 변성 때문에 반응하지 않으므로 도축 처분한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">86.</span><span>각막 이물·외상 — 원인과 증상<span class="hang">사료, 결막 이물, 계류대·보정틀, 꼬리 휘두르기가 각막 찰과상·열상·궤양을 만든다. 이물은 대개 식물성이며 강풍, 사료·깔짚을 날리는 송풍기·선풍기, 개방 트레일러 수송, 옆으로 누운 자세가 위험하다. 대부분 방치되어 심해진 뒤 감염된다.</span><span class="hang">눈물, 안검 경련, 눈부심, 결막 충혈과 부종, 눈꺼풀 부종이 있다. 처음엔 장액성이고 오래되거나 감염되면 점액화농성 눈곱이 된다. 각막 궤양이 있는 거의 모든 소 눈에 반사성 포도막염(통증, 방수 혼탁, 축동)이 있다. 이물이 의심되면 국소마취 후 순막을 들어 뒤쪽 결막까지 확대해 본다.</span></span></p><p class="bx-num"><span class="bxn">87.</span><span>치료<span class="hang">이물은 이개안검신경 차단과 국소마취(0.5% 프로파라카인 또는 리도카인) 후 바늘을 부러뜨린 25 G 바늘 허브를 12 mL 주사기에 달아 식염수를 세게 뿌려 씻어낸다. 안 되면 진정 후 젖은 면봉이나 안과 겸자로 제거하고 상피화될 때까지 국소·결막하 항균제를 준다.</span><span class="hang">감염되지 않은 급성 찰과상, 궤양, 비관통 열상은 광범위 항균 안연고로 예방한다. 결막하 항균제는 보조나 단독으로 쓸 수 있다. 1% 아트로핀(용액 1방울 또는 연고 2~3 mm, 하루 1~3회)은 축동이 있는 아픈 눈에 쓰며 1회로 3~4시간 안에 훨씬 편해진다. 각막이 손상되었을 때 코르티코스테로이드와 국소 NSAID는 금기다.</span><span class="hang">감염 궤양은 가능하면 궤양 가장자리 긁은 물질로 그람 염색·배양 후 국소 항균제를 가능한 한 자주 넣는다. 결막하 페니실린 150,000~300,000 U는 높지만 짧은 농도를 만들며 매일 반복할 수 있다. 전신 항균제는 대개 도움이 안 된다. 각막 부종이 심하면 5% 고장 식염 연고를 6~12시간마다 쓴다(Blackwell).</span><span class="hang">데스메막이 드러난 깊은 궤양은 결막 피판을 고려한다. 부분층 열상은 피판을 잘라내고, 홍채가 빠진 관통 열상은 전문 처치가 필요하며 수정체·유리체가 빠진 큰 손상은 적출한다. 노출 각막염은 윤활제를 하루 4~6회 넣거나 일시적 부분 안검 봉합(눈꺼풀 반층 봉합)을 즉시 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">88.</span><span>선천성 안질환 — 선천성 백내장<span class="hang">여러 품종에서 생기며 일부는 유전이 의심된다. 홀스타인 핵백내장, 저지의 열성 소수정체·백내장·수정체 편위·무홍채(거의 실명하나 손으로 먹이면 키울 수 있음)가 기술되었고 에어셔 한 군에서 110두 중 26%가 백내장이었다.</span><span class="hang">신생 송아지 백내장은 유전이거나 발생 중 사고일 수 있고 임상만으로는 구별하지 못한다. 다른 혈통의 같은 연령 송아지에도 있으면 중독이나 임신 125~175일 BVDV 감염 같은 공통 노출을, 한 혈통에만 있으면 유전을 의심한다. 유전이 배제되지 않으면 수송아지를 종모우로 쓰지 않는다.</span><span class="hang">부분 백내장은 매우 느리게 진행하거나 진행하지 않지만 언제든 진행해 실명할 수 있다고 알린다. 수술은 시력 회복에 대개 성공하나 경제적 이유로 드물다. 후천성 백내장은 포도막염·심한 IBK 뒤 후방 유착에서 오므로 눈 손상·IBK·포도막염에 국소 아트로핀을 일상적으로 쓰는 것이 가장 쉬운 예방이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">89.</span><span>기타 선천성 눈 결함<span class="hang">홀스타인 선천성 각막 혼탁은 출생 시 양쪽 각막이 흐린 청색이며 시력이 제한되나 완전 실명은 아니다. 샤롤레 결손(coloboma)은 상염색체 우성으로 유병률이 6%까지이고 시력 영향은 거의 없다. 헤리퍼드 안 유피종은 유전되며 각막·순막·눈꺼풀의 털 난 피부 조직이다. 털이 없고 작으면 치료가 필요 없고 커지거나 털이 나면 표층 각막 절제로 제거한다.</span></span></p></div>
</div>
`;
}
function med_metabHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 대사·내분비</div>
<div class="rb-boxes">
