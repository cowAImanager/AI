<div class="bx"><p class="bx-num"><span class="bxn">21.</span><span>환경성 연쇄상구균(S. uberis, S. dysgalactiae) — 원인·역학<span class="hang">전염성 병원체를 줄인 목장에서 임상형의 약 1/3을 차지한다. 신규 감염은 건유 후 2주와 분만 전 2주에 높고 절반은 건유기, 절반은 비유 초기에 생기며 건유기 감염률이 비유기의 약 5배다. 감염 기간은 대개 28일 미만이다.</span><span class="hang">S. uberis는 깔짚(짚에 많고 톱밥에 적음), 입술·편도·복부 피부, 분변에 있다. 젖은 짚과 깊은 짚 깔짚이 주 위험이며 방목우도 그늘 밑·진흙탕에서 노출된다. 방목 낙농의 분만 시 임상형 최다 원인이다.</span><span class="hang">일부 목장에서는 우세 균주가 착유 중 전염성으로 퍼진다(Rebhun). S. dysgalactiae는 편도·질에도 있고 파리·여름유방염과도 관련된다.</span><span class="hang">약 절반이 임상형이 되며 우유 이상만 43%, 우유+분방 이상 49%, 전신증상 8%이고 대개 24~48시간에 임상 회복된다. 다른 균이 S. uberis로 오동정될 수 있어 치료 반응이 나쁘면 분자 진단을 고려한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>치료와 예방<span class="hang">페니실린, 노보비오신, 아목시실린, 세파피린에 대부분 감수성이고 아미노글리코사이드에는 낮다. 임상형은 최소 12시간 간격 2회 유방내 주입하며 세팔로스포린 1회로 세균학적 치유율 60~65%를 기대한다. 비유 100일 이내 임상형은 치료 이득이 크다.</span><span class="hang">난치처럼 보이는 경우 대부분은 치료 기간이 짧아서이며 세프티오퍼 125 mg이나 피를리마이신 50 mg 24시간 간격 5~8일 연장 투여로 치유율이 오른다. 재발은 새 균주 감염이 많다.</span><span class="hang">옥시토신·짜내기만으로는 치유율이 낮고 재발이 많아 권장하지 않는다. 전신 치료는 거의 필요 없다. 분만 시 S. uberis 준임상 감염도 유량을 줄이므로 치료한다.</span><span class="hang">페네타메이트 5 g 근육 3일에 멜록시캄 250 mg 피하 1회를 더하자 도태율이 28%에서 16%로 줄었다.</span><span class="hang">예방: 짚 깔짚을 피하거나 매일 교체, 모래 깔짚, 깨끗하고 마른 유두 착유, 전침지(환경성 최대 50% 감소), 착유 후 30분 기립. 건유 때 장기작용 제제와 비스무트 내부 봉합제를 함께 쓴다. 세팔로늄 250 mg 건유 처치는 S. uberis 신규 감염을 12.3%에서 1.2%로 줄였다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">23.</span><span>코아굴라제 음성 포도상구균(CNS)·Corynebacterium bovis<span class="hang">CNS는 주병원체를 관리한 목장에서 가장 흔한 분리균이지만 소병원체로 분류한다. S. chromogenes(미경산우), S. simulans(고령우), S. epidermidis가 우세하다. 미경산우 분방의 20~70%가 분만 전 감염되나 대부분 분만 초기에 소실된다.</span><span class="hang">대개 가벼운 임상형과 중등도 SCC 상승을 일으키고 유량에는 영향이 적다. 자연 치유가 흔하고 임상형은 2~3일 유방내 치료에 잘 반응하며 준임상형은 대개 치료가 필요 없다. 건유 치료 치유율은 90% 이상이다. 후침지와 유두 끝 상태 개선이 관리의 중심이다.</span><span class="hang">C. bovis는 유두관에 사는 전염성 소병원체로 후침지가 부실하면 빠르게 퍼지고 수개월 지속된다. SCC를 약간 올리며 감염 분방은 주병원체에 덜 걸린다. 대부분 유방내 제제에 감수성이고, 후침지를 개선해도 약 1년간 유병률이 줄지 않으며 건유 치료로 사라진다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">24.</span><span>마이코플라즈마 유방염 — 원인·역학<span class="hang">주로 M. bovis이며 다른 종도 있다. 대규모 목장, 착유 위생 불량, 외부 도입 후 수주~수개월 뒤 발생한다. 분방에 12개월 넘게 지속되고 무증상 배출우가 있으며 호흡기·질에도 정착하고 혈행 전파된다.</span><span class="hang">착유기, 손, 공용 주사기·캐뉼러 일괄 주입으로 전파되고 곧 네 분방으로 퍼진다. 분만 직후 소가 가장 심하다. 감염우 우유를 먹은 송아지에 폐렴, 관절염, 중이염이 생긴다. 감염우의 최대 75%를 도태해야 할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>임상증상·진단<span class="hang">여러 소의 여러 분방에 심한 임상형이 생기는데 전신증상은 거의 없는 것이 전형이다. 유량이 한 번의 착유 사이에 거의 0이 될 수 있다. 일부는 무릎·구절 관절염을 보인다.</span><span class="hang">분비물은 처음 거의 정상이나 세워 두면 모래 같은 침전과 탁한 유청이 분리되고, 이후 커드·고름 같은 분비물로 바뀌며 큰 응괴는 없다. 수주~수개월 지속되고 분방이 위축된다. 실험 감염 시 41℃까지, 자연 증례 39.4~40.8℃(Rebhun) 발열한다.</span><span class="hang">특수 배지(37℃, 10% CO2)가 필요하다. 명백한 유방염인데 일반 배양 음성이고 항생제에 반응하지 않으면 의심한다. 우유 SCC는 대개 2,000만/mL 이상이고 발병 시 백혈구가 1,800~2,500/µL로 준다. PCR로 1~2일에 동정한다.</span><span class="hang">원유 배양 민감도는 33~59%로 낮아 반복 배양으로 보완한다. 확진될 때면 목장의 10% 이상이 감염되어 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>치료·관리<span class="hang">감염우는 평생 감염으로 본다. 시험관에서는 플루오로퀴놀론·플로르페니콜·티아뮬린에 감수성이나 임상 의미는 의문이고, 옥시테트라사이클린 5 g 정맥 3일은 일시 호전뿐, 유수 유제 주입은 악화시킨다.</span><span class="hang">확진 감염우는 치료하지 말고 찾아 격리·도태한다. 대규모 목장은 마지막에 착유하는 감염 소군을 둘 수 있다.</span><span class="hang">Rebhun: 전두 분방 배양, 후침지 1% 요오드, 소 사이 착유컵을 30~75 ppm 요오드로 헹굼, 양성우 도태·격리, 남은 소 매월 배양, 음성 후 우유 필터 매월 배양.</span><span class="hang">폐기 초유·우유는 살균해 먹인다. 감염 분방 유두 절단은 환경을 오염시켜 권장하지 않는다. 재감염 저항성은 1년 미만이고 백신 효과는 입증되지 않았다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">27.</span><span>대장균형 유방염 — 원인·역학<span class="hang">대장균, 클렙시엘라(주로 K. pneumoniae), Enterobacter가 원인인 장관 유래 기회감염이다. 특정 병원형이 없고 내성도 드물며 숙주 요인이 중증도를 정한다.</span><span class="hang">주로 사육 축사나 우기의 건조장에서 생기고 방목우에는 드물다. 저SCC 목장에서 가장 중요한 유방염으로 임상형의 30~40%를 차지한다. 감염 분방은 2~4%로 낮다.</span><span class="hang">감염의 80~90%가 임상형이 되고 8~10%는 최급성이며 대개 분만 후 며칠 안이다. 50% 이상이 10일 안에 끝난다.</span><span class="hang">건유기 감염률이 비유기의 약 4배이며 건유 후 2주와 분만 전 2주에 가장 높다. 건유 후반에 감염되어 분만 후 최급성으로 나타나는 경우가 많다.</span><span class="hang">최급성 치사율은 집중 치료에도 80%에 이를 수 있고 분만우의 25%가 몇 주 안에 걸리는 집단 발생도 있다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>위험요인<span class="hang">낮은 SCC: 분방 SCC 25만이면 소량 접종 시 증식을 제한하고 50만이면 완전 방어한다. 분만 전후 호중구 동원 지연(케톤혈증 시 더 심함), 비타민 E·셀레늄 결핍, 고령·고능력우, 분만 후 기립불능우, 유두 손상, 오염된 주입 기구.</span><span class="hang">깔짚: 톱밥 &gt; 대팻밥 &gt; 짚 순으로 유두 끝 대장균형이 많고, 젖으면 특히 클렙시엘라가 는다. 톱밥 도입이 클렙시엘라 집단 발생을 부를 수 있고 신선한 톱밥도 며칠 안에 g당 10^7 마리가 될 수 있다(Rebhun).</span><span class="hang">젖은 유두 착유, 오염된 세척수, 진공 변동, 우유 누출, 유방 부종, 불완전 착유, 태반정체·자궁 분비물 접촉, 여름 고온다습(Rebhun). J5 항원 IgG1 역가 1:240 미만은 위험 5.3배다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>기전<span class="hang">증식한 대장균의 내독소가 혈관 투과성을 높여 부종·종창을 만들고, 호중구가 40~250배 유입되며 이 때문에 전신 백혈구·호중구 감소가 온다.</span><span class="hang">결과는 호중구 반응 속도에 달려 있다. 빠르면 가볍거나 자연 치유되고 배양 음성일 수 있다. 12시간째 10^3 CFU/mL 미만이면 예후가 좋고 10^6을 넘으면 탐식이 손상된다.</span><span class="hang">분만 직후 소는 호중구 유입이 늦어 15시간까지 우유 변화 없이 전신증상이 먼저 나타난다. 비유 중·후기 소는 예후가 좋다.</span><span class="hang">균혈증이 중증의 32~48%에 있다. 저칼슘혈증과 저칼륨혈증(Rebhun)이 쇠약에 기여한다.</span><span class="hang">조직 침습성이 낮아 살아남으면 같은 비유기 부분 회복, 다음 비유기 완전 회복도 가능하나 한 조사에서 다음 비유기까지 남은 소는 43%였다. 만성 감염도 감염 분방의 최소 10%에서 확인된다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>임상증상<span class="hang">최급성: 한 착유 때 정상이던 소가 다음 착유 때 무유증과 독혈증을 보인다. 완전 식욕부진, 심한 침울, 떨림, 귀 냉감, 40~42℃ 발열. 6~8시간 안에 기립불능이 되며 그때는 체온이 정상 이하로 떨어져 유열처럼 보인다.</span><span class="hang">심박 100~120회/분, 반추위 정지, 가벼운 물설사, 탈수, 다호흡, 폐울혈로 호기 시 신음. 공막 충혈, 전방축농도 생긴다(Rebhun).</span><span class="hang">분방은 붓고 따뜻하나 심하지 않아 놓치기 쉽다. 분비물이 묽은 우유에서 맨눈으로 겨우 보이는 가루 같은 박편이 섞인 노란 장액으로 변하는 것이 특징이며, 검은 판에 정상 분방 우유를 먼저 짜고 그 위에 짜 보면 잘 보인다.</span><span class="hang">6~8시간 만에 죽거나 24~48시간 살기도 한다. 급성형은 분방 종창과 다양한 발열·식욕부진을 보이고 치료로 며칠 안에 회복된다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>진단·감별<span class="hang">물 같은 우유, 떨림, 분방 경결, 빈맥, 다호흡, 발열, 쇠약, 24시간 미만의 경과가 가장 유용한 예측 소견이다.</span><span class="hang">혈액농축, 현저한 백혈구·호중구 감소와 퇴행성 좌방이동, 혈소판 감소. 2일째 악화되면 예후 불량이다. 분엽 호중구 3,200/µL 미만은 그람음성 원인 예측 민감도 0.93, 특이도 0.89다.</span><span class="hang">CMT는 대개 3+다. 최급성은 배양 양성이나 덜 급하면 음성일 수 있다. 감수성 검사는 권장되지 않는다.</span><span class="hang">유열과 비슷하지만 현저한 빈맥, 탈수, 설사는 유열답지 않아 유방을 꼭 확인한다. 유열은 호중구 증가·스트레스 백혈구상을 보인다. 곡류 과식 젖산산증은 반추위액이 많고 pH 5.0 미만이다.</span><span class="hang">클렙시엘라는 젖은 톱밥과 강우에 강하게 연관되고, 내독소 증상이 가장 극적이고 오래가 분방 반응과 무관하게 7일까지 식욕부진·쇠약이 지속된다(Rebhun). 자연 치유율이 대장균보다 낮아 보인다(Constable).</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>치료 — 전신 항생제<span class="hang">전신증상이 있으면 광범위 항생제를 처음엔 정맥, 이후 근육으로 준다. 중증도가 세균수와 비례하고 균혈증이 흔하기 때문이다.</span><table class="bxt"><tr><th>약물</th><th>용량·근거</th></tr><tr><td>세프티오퍼</td><td>2.2 mg/kg 근육 24시간 간격, 자연 증례에서 폐사·도태 1/3</td></tr><tr><td>세프퀴놈</td><td>1 mg/kg 근육 24시간 간격 2회(± 유방내 75 mg 12시간 간격 3회)</td></tr><tr><td>트리메토프림-설파디아진</td><td>4 g + 20 g 근육 24시간 간격 3~5일, 자연 증례 효과</td></tr><tr><td>옥시테트라사이클린</td><td>16.5 mg/kg 정맥 24시간 간격 3~5일 + 세파피린 200 mg 유방내 + 보조치료</td></tr><tr><td>다노플록사신</td><td>6 mg/kg 정맥 1회(실험 감염)</td></tr><tr><td>엔로플록사신</td><td>5 mg/kg, 실험 감염엔 효과, 자연 증례엔 미미</td></tr><tr><td>젠타마이신</td><td>2 g 근육 12시간 간격, 무처치와 차이 없음</td></tr></table><span class="hang">페니실린 G 근육주사는 대장균에 무처치와 다르지 않다. Rebhun은 세프티오퍼 전신 투여와 아미노글리코사이드의 유선 분포가 가장 나쁘고, 옥시테트라사이클린은 분포가 좋으나 탈수우에 신독성이 있다고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>치료 — 유방내 주입·짜내기<span class="hang">경~중등도에는 그람음성균에 듣는 β-락타마제 저항성 유방내 제제를 쓴다(세프티오퍼 125 mg 1일 1회 5일, 세파피린 200 mg). 하루 첫·마지막 착유 뒤 완전히 짜내고 주입한다. 젠타마이신 500 mg 유방내는 효과가 없었다.</span><span class="hang">옥시토신 10~20 IU 근육주사 후 마사지하며 짜낸다. 더 많은 용량이나 정맥주사는 필요 없다.</span><span class="hang">짜내기 빈도: Constable은 매시간 짜내기를 쓰되 효과는 입증되지 않았다고 하고, Rebhun은 최급성이라도 4~6시간 간격을 넘지 말라고 한다(너무 잦으면 괄약근이 열려 다른 균이 들어감).</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>치료 — 수액·칼슘<span class="hang">등장성 전해질액을 첫 24시간 80 mL/kg(400~600 kg 소 32~48 L, 첫 4시간 20 L) 지속 정맥주사한다. 6~8시간이면 반응이 보이고 5일 집중 수액에도 호전이 없으면 예후 불량이다.</span><span class="hang">고장식염수(7.2~7.5%) 4~5 mL/kg을 4~5분에 정맥주사하고 바로 물을 마시게 한다(Constable). Rebhun은 고장식염수 2~3 L 후 경구 전해질 최소 10갤런 또는 정맥 20~40 L를 쓴다.</span><span class="hang">최급성은 흔치 않게 대사성 산증을 보이므로 쇠약이 심하면 산염기·전해질을 검사한다. 경산우는 모두 칼슘을 주되 설 수 있으면 피하, 기립불능이면 아주 천천히 정맥으로 준다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>치료 — 소염제·스테로이드<span class="hang">케토프로펜은 자연 증례 효과가 입증된 유일한 NSAID다. 설파디아진 20 g + 트리메토프림 4 g에 케토프로펜 2 g 근육 1일 1회를 더하자 회복률이 71~84%에서 92~95%로 올랐다.</span><span class="hang">플루닉신: Constable 2.2 mg/kg 정맥, Rebhun 중등도 0.3 mg/kg 정맥 1일 3회, 중증 1.0 mg/kg 정맥 1일 1회. 유방염 소는 청소가 느려 잔류가 검출된다. 탈수우에서 제4위 궤양·신유두괴사 위험이 있어 탈수를 교정한다.</span><span class="hang">멜록시캄 250 mg 피하 1회(Constable). 페닐부타존 근육주사는 근괴사로 권장되지 않는다.</span><span class="hang">Rebhun은 덱사메타손 유방내 10~20 mg 1회 또는 중증에 30 mg 근육 1회(임신 말기 금지)를 허용하나 100~200 mg 쇼크 용량과 반복 투여는 위험하다고 한다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>중증도별 치료 지침(Rebhun)<span class="hang">경미: 6시간마다 짜냄(± 옥시토신), 칼슘 피하, 항생제를 쓰면 첫·마지막 착유 뒤 유방내. 24시간에 호전되면 계속하거나 승인 유방내 제제 1일 2회 총 6~8회.</span><span class="hang">중등도: 위에 플루닉신 0.3 mg/kg 1일 3회, 탈수 교정, 같은 약이나 유선 분포가 좋은 약으로 전신 항생제를 더하고 호전되면 최소 3일 계속.</span><span class="hang">중증: 옥시토신 후 짜냄, 플루닉신 1.0 mg/kg 1일 1회, 칼슘, 대량 수액이나 고장식염수+경구 전해질, 유방내·전신 항생제, 항히스타민·덱사메타손 30 mg 근육 1회 고려, 위관 급여.</span><span class="hang">만성·간헐형: 배양·감수성에 따라 착유 후 최소 8회 연속 치료하거나 건유 제제로 치료한다. 가치 낮은 소는 비싼 치료 전에 도태를 고려한다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>예후와 예방<span class="hang">심한 침울, 쇠약, 설사·탈수, 기립불능, 심박 120회/분 초과는 예후 불량이다.</span><span class="hang">집단 발생 시: 배양으로 원인 확인, 깔짚 조사(톱밥·대팻밥이면 모래로 바꾸거나 자주 교체), 축사 대청소, 착유 전 위생, 착유기 점검, 착유 직후 신선한 사료로 최소 30분 기립.</span><span class="hang">젖은 깔짚은 칸 뒤쪽 1/3을 매일 갈고 모래가 표준이다. 분만 최소 2주 전 깨끗한 곳으로 옮기고 분만 10일 전부터 유두 침지를 하며, 우유가 새는 소는 차단 침지나 콜로디온으로 막는다.</span><span class="hang">후침지는 효과가 적고 전침지가 환경성 감염을 약 51% 줄인다. 비타민 E는 건유우 1,000 IU/일과 셀레늄 3 mg/일, 비유우 400~600 IU/일과 셀레늄 6 mg/일이 되게 한다. 건유 말 14일간 4,000 IU/일로 임상형이 88% 줄었다.</span><span class="hang">J5(Rc 변이 대장균 O111:B4)나 Re 변이 S. typhimurium 백신은 임상형 발생과 중증도를 줄여 비유 첫 90일 위험이 5배 낮았고, 임상형이 비유기의 1%를 넘으면 수익성이 있다. Constable은 고발생 목장에서 최소 6개월마다, Rebhun은 임신 7·8개월과 분만 후 약 2주 접종을 든다. 내독소 때문에 비유우 유량이 일시 7% 줄며 병든 소, 고온다습기, 다른 그람음성 백신과 동시 접종은 피한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">38.</span><span>Trueperella pyogenes 유방염·여름유방염 — 원인·역학<span class="hang">주로 사육우에 산발하는 화농성 유방염과, 여름 방목 건유우·미경산우에 집단 발생하는 여름유방염이 있다.</span><span class="hang">여름유방염에서 T. pyogenes가 1차 병원체지만 중증도는 Peptostreptococcus indolicus, S. dysgalactiae, Fusobacterium necrophorum 등과의 혼합감염이 정한다. 유두 끝 손상이 있어야 감염된다.</span><span class="hang">임신 말기 건유우와 미경산우에 많고 2개월령 송아지에도 생긴다. 파리(Hydrotaea irritans) 활동과 일치하며 습한 여름, 숲이 많고 낮은 지대 목장에 많고 같은 목장이 해마다 걸린다. 건유우의 25%까지 걸리는 집단 발생도 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>임상증상<span class="hang">대개 최급성으로 40~41℃ 발열, 빈맥, 완전 식욕부진, 심한 침울을 보이고 유산할 수 있다. 거의 항상 한 분방, 흔히 앞 분방이다.</span><span class="hang">분방이 매우 단단하고 아프며 분비물은 응괴 섞인 물 같다가 특유의 악취 나는 고름이 된다. 파리가 많이 붙어 있고 같은 쪽 뒷다리를 절 수 있다.</span><span class="hang">살아남으면 농양이 생겨 흔히 유두 기부에서 터지고 기능은 영구히 잃는다. 유두염과 유두 폐색이 흔한 후유증이다. 치료하지 않으면 사망률 약 50%다.</span><span class="hang">계절성, 화농, 농양, 심한 전신 반응으로 임상 진단이 가장 쉬운 유방염이다. 배양으로 확인하며 냉동하면 양성률이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>치료·예방<span class="hang">반응이 매우 나쁘고 분방은 거의 잃는다. 원인은 내성이 아니라 광범위한 화농이다.</span><span class="hang">Constable: 즉시 옥시테트라사이클린 정맥주사, 최급성은 설파디미딘이나 테트라사이클린 전신 투여와 반복 짜내기. 분방을 남기려면 영구 건유한다. 치료해도 분방의 80% 이상은 쓸모없어진다.</span><span class="hang">Rebhun: 농양 전 조기 치료가 최선이다. 완전히 짜낸 뒤 페니실린 22,000 U/kg 근육 1일 2회 최소 1주와 유방내 페니실린 1일 1~2회를 병용하며 대개 7~14일 걸린다. 분방이 부드러워지고 분비물이 묽어지면 호전이다.</span><span class="hang">배액을 위해 유두를 절단하거나 세로로 가르기도 하고, 고름이 흐르는 소는 격리한다.</span><span class="hang">예방: 건유 기간 3주 간격 건유 제제(클록사실린 500 mg + 암피실린 250 mg 장기작용) 주입이 가장 선호되고 세팔로늄 4주 간격도 대안이다. 살충제 분무·귀표·푸어온으로 파리를 방제하고 건유우를 매일 관찰하며 위험 목초지를 피한다. Bovine Medicine은 유두 봉합제와 매주 스톡홀름 타르 도포도 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>슈도모나스·세라티아 유방염<span class="hang">슈도모나스는 오염된 주입제나 세척수(호스·온수기에 서식)로 산발 또는 집단 발생한다. 급성 괴사성 내독소성 유방염으로 분비물은 장액성·혈성이고 첫 발작에 기능을 잃는 경우가 많으며 사망률은 17%까지다. 다제내성·바이오필름으로 치료가 잘 안 되고 평생 배출하는 경우가 많다. 3세대 세팔로스포린, 젠타마이신·아미카신, 플루오로퀴놀론이 가장 효과적일 것으로 본다.</span><span class="hang">세라티아는 경한 만성 유방염을 일으키며 오염된 톱밥이나 클로르헥시딘·4급암모늄 침지액에서 살아남는다. 권장 농도 요오드에서는 살지 못한다. 페니실린·암피실린·세파피린에 내성이고 네오마이신(유방내 2 g 후 1 g 3일)이 만족스러웠다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>파스튜렐라·만헤이미아 유방염<span class="hang">소에서는 드물지만 송아지를 유모우로 키우는 목장에서 문제가 될 수 있다. 심한 발열, 독혈성 쇼크, 기립불능, 붉고 물 같은 우유를 보이고 파종성 혈관내응고로 출혈할 수 있다. 네 분방이 모두 걸려 우유가 멈추고 이후 섬유화·위축된다.</span><span class="hang">걸린 소의 초유를 먹은 신생 송아지가 파스튜렐라증으로 죽을 수 있다. 치료 반응이 나빠 도태나 분방 폐쇄가 필요하다(Rebhun). Constable은 테트라사이클린 유방내 주입을 선호한다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>노카르디아 유방염<span class="hang">토양 부생균이 비위생적 유방 세척이나 주입으로 들어가며 오염된 건유 제제로 집단 발생한 예가 있다. 분만 직후 성우에 많고 클로르헥시딘 아세테이트 침지액에서 살아남는다.</span><span class="hang">분만 15일 안이면 발열·식욕부진, 그 외에는 2~5 cm의 단단한 결절과 1 mm 크기 흰 알갱이가 섞인 회색 점조 분비물을 보인다. 회복해 남길 만한 소는 없어 모두 도태된다.</span><span class="hang">배양은 72시간까지 기다린다. 주입 전 알코올 솜으로 유두 끝을 문지르는 것이 예방 효과가 있었다.</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>효모·진균 유방염<span class="hang">대부분 칸디다이며 오염된 캐뉼러·다회용 주입액으로 들어가 농가가 치료한 세균성 유방염 뒤에 생긴다. 칸디다는 페니실린·테트라사이클린을 질소원으로 쓰고 스테로이드가 악화시킨다.</span><span class="hang">1~3주간 여러 항생제에 반응하지 않은 병력, 미만성으로 붓고 반죽 같은(단단하지 않은) 분방, 39.4~41℃ 발열이 있어도 독혈성이 아닌 상태가 전형이다. 도말이나 배양으로 확진한다.</span><span class="hang">모든 항생제를 끊고 하루 4회 이상 짜내면 대부분 2~6주에 자연 치유된다(Rebhun). 미코나졸 200 mg 12시간 간격 8회는 효과가 없었다. Cryptococcus neoformans는 공중보건상 위험이 있다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>프로토테카 유방염<span class="hang">엽록소 없는 조류로 진흙·고인 물에 흔하다. 주로 P. zopfii 유전형 2와 P. blaschkeae이며 인수공통이다. 묽은 우유와 큰 흰 응괴부터 분방 경결까지 다양하고 무증상 배출우가 많으며 만성 육아종성 병변을 만든다.</span><span class="hang">위험요인: 비유방용 약물의 유방내 주입(OR 136.8), 내부 봉합제(OR 34.2)·외부 봉합제(OR 80.0) 사용, 비위생적 반복 주입, 2산 이상, 라군 유출수로 씻은 재활용 모래. 일정 수가 감염되면 착유 시 소에서 소로 퍼진다.</span><span class="hang">효과적 치료가 없어 배양 양성우를 격리·도태하며 간헐 배출하므로 전두 검사를 반복한다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>기타 드문 원인<span class="hang">Bacillus cereus: 오염된 건유 제제나 맥주박의 포자로 분만 후 급성 출혈성 유방염, 41℃ 발열, 24~36시간 폐사, 괴저. 건유우에서 확인되면 분방당 네오마이신 750 mg + 프라마이세틴 375 mg을 주입한다.</span><span class="hang">Clostridium perfringens A형: 초산우의 드문 괴저성 유방염으로 가스가 많이 만져진다. 고용량 페니실린 전신·유방내, 수액·플루닉신, 유두 절단·절개 배액을 하며 조기 치료 시 생존 예후는 좋다(Rebhun). 유방 내 가스는 황색포도상구균, 슈도모나스, T. pyogenes, 대장균형에서도 생긴다.</span><span class="hang">마이코박테리아: 기름 기제 주입 뒤 분방이 엄청나게 비대해지고 치료가 듣지 않는다. 손상 유두에 기름 기제 제제는 피한다.</span><span class="hang">외상성 유방염: 유두관·괄약근까지 미친 손상 뒤에는 혼합감염이 흔하므로 모든 유두·유방 손상과 수술에 예방적 광범위 항생제를 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">47.</span><span>유방염 치료 원칙 — 치료 결정<span class="hang">항생제가 필요한가, 경로는 무엇인가, 어떤 약인가, 빈도·기간은 얼마인가를 묻는다. 병원체, 염증 정도, 감염 기간, 비유 단계, 나이·임신 상태로 정한다.</span><span class="hang">분방 이상이나 전신증상이 있으면 동물복지상 반드시 치료한다. 전체 무처치는 그람양성균이 남아 재발·집단 발생을 부르므로 대안이 아니다. 분비물 이상만 있는 경증은 저전염성 목장에서 대개 환경성이며 4~6회 착유 안에 정상으로 돌아오는 일이 많다.</span><span class="hang">Rebhun은 임상형 치료의 50~70%가 불필요하거나 효과 없다고 추정한다. 연쇄상구균과 CNS는 유방내 치료에 잘 듣고, 효모, 프로토테카, 마이코플라즈마, T. pyogenes, 대부분의 그람음성균은 잘 듣지 않는다.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>투여 경로 — 세 구획 모델<table class="bxt"><tr><th>병원체</th><th class="c">우유·유관</th><th class="c">실질</th><th class="c">전신</th></tr><tr><td>황색포도상구균, T. pyogenes</td><td class="c">+</td><td class="c">++</td><td class="c">−</td></tr><tr><td>S. agalactiae, 환경성 연쇄상구균</td><td class="c">++</td><td class="c">+</td><td class="c">−</td></tr><tr><td>C. bovis, CNS</td><td class="c">++</td><td class="c">−</td><td class="c">−</td></tr><tr><td>대장균, K. pneumoniae</td><td class="c">+</td><td class="c">−</td><td class="c">++</td></tr><tr><td>M. bovis</td><td class="c">+</td><td class="c">+</td><td class="c">++</td></tr><tr><td>유방내 치료 효과</td><td class="c">좋음~매우 좋음</td><td class="c">중간</td><td class="c">나쁨</td></tr><tr><td>전신 치료 효과</td><td class="c">나쁨~중간</td><td class="c">중간~매우 좋음</td><td class="c">좋음~매우 좋음</td></tr></table><span class="hang">합의: 분비물 이상 또는 분비물+분방 이상은 유방내만, 개체 이상까지 있으면 유방내+전신에 소염제·수액을 더한다. 전신 투여 시 유선 농도를 얻으려면 보통보다 높은 용량을 3~5일 준다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>약제 선택<span class="hang">감수성 검사는 인체 유래 기준치가 소 우유에 타당하지 않고 결과가 최소 2일 걸려 초기 선택의 일상적 근거가 될 수 없다. 실제로는 허가 약품, 임상증상, 목장의 이전 배양 결과와 치료 경험, 비용, 휴약으로 고른다.</span><span class="hang">유방내 확산이 좋은 약: 페네타메이트, 암피실린, 아목시실린, 에리스로마이신, 타일로신. 중간: 페니실린 G, 클록사실린, 테트라사이클린. 나쁨: 스트렙토마이신, 네오마이신.</span><span class="hang">우유에서 탐식이 떨어지므로 유방내 약은 살균성이어야 한다. 3세대 세팔로스포린·플루오로퀴놀론은 그람양성·음성 모두 의심될 때 선택 약이나 나라에 따라 쓸 수 없다. β-락타마제 생성 황색포도상구균에는 클록사실린이 흔히 쓰인다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>유방내 주입 절차<span class="hang">유두를 씻고 말린 뒤 살균 침지액에 30초 접촉 후 일회용 수건(소당 1장, 유두당 한 귀퉁이)으로 닦는다.</span><span class="hang">유두마다 별도의 70% 알코올 솜으로 끝을 닦되 먼 쪽 유두부터 하고, 주입은 가까운 쪽부터 한다.</span><span class="hang">캐뉼러 끝만 넣는다(부분 삽입, 최대 4 mm). 케라틴 마개를 보존하고 세균을 덜 넣어 신규 감염이 적고 치유율이 높다. 다회용 용기와 일괄 주입은 피한다. 주입 후 후침지하고 치료우를 표시한다.</span><span class="hang">옥시토신 후 짜내고 주입하는 방법은 근거가 부족하다. 짜낸다면 그날 마지막 짜내기 뒤 주입한다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>원인 미상 응급 치료와 치료 기간<span class="hang">원인 미상 급성·최급성(분만 직전 건유우 포함): 옥시테트라사이클린 정맥, 페네타메이트, 강화 설폰아마이드 등 전신 투여에 세파피린·세프티오퍼·페니실린 G-네오마이신 같은 β-락타마제 저항성 유방내 제제를 더한다. 세프티오퍼 전신 투여는 분비물·분방 이상형에 효과가 없다.</span><span class="hang">Constable 정리: 개체 이상 시 세프퀴놈, 세프티오퍼, 플루오로퀴놀론, 페네타메이트, 옥시테트라사이클린 전신(R-1), 고장식염수나 대량 등장액(R-2), 멜록시캄 250 mg 피하 1회(R-2).</span><span class="hang">기간: 5~8일 연장 치료가 라벨 2~3일보다 효과적이라는 것이 확인되었으나 허가 외 사용, 휴약 연장, 잔류 위반이 문제다. 라벨과 지침이 허용할 때 연장 치료가 선호된다. 유방내 제제는 착유로 제거되므로 빈도가 착유 일정에 좌우된다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>현장 배양 기반 선택 치료<span class="hang">분비물 이상만 있으면 18~24시간 배양 후 그람양성균만 치료하고, 분방·개체 이상이면 즉시 치료한 뒤 결과로 조정한다. 대기 중인 소는 매일 재평가한다.</span><span class="hang">422두 연구에서 그람양성·혼합은 세파피린, 그람음성·무성장은 무처치로 하자 항생제 사용이 절반으로 줄었고 치유·재발·SCC·유량·생존에 차이가 없었다.</span><span class="hang">Rebhun 시험: 연쇄상구균·CNS·장구균만 세파피린 2회, 프로토테카·마이코플라즈마·황색포도상구균·S. agalactiae는 도태, 나머지 무처치로 결과 차이 없이 출하 제외일이 8.9일에서 6.9일로 줄었다. 무성장·기타 균은 도태, 건유, 분방 폐쇄, 증상 소실까지 우유 폐기로 관리한다.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>준임상 유방염 치료와 치료 실패<span class="hang">비유기 준임상형 치료는 대개 권장되지 않으며 예외는 S. agalactiae다. 황색포도상구균은 15~60%로 보람이 적다.</span><span class="hang">Rebhun: 처음 높아진 소는 다음 달 자연 치유가 많아 두지 않는다. 연속 2회 linear score 4.0 초과 소의 분방을 CMT로 보고 양성 분방을 배양해 그람양성균만 치료한다. 5회 이상 연속 고SCC, 4산 이상, 다분방 감염은 반응이 나쁘다.</span><span class="hang">실패 원인: 미세농양, 확산 불량, 우유·조직 단백에 의한 불활화, 세포내 생존, 내성, L형 세균. 임상 회복이 감염 소실을 뜻하지는 않는다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>휴약과 잔류<span class="hang">대략적 출하 제한(마지막 투여 후, Constable): 비유우 유방내 72시간, 전신 1회 36시간, 전신 연속 72시간, 장기작용 전신 10일, 자궁내 정제 72시간, 건유 제제는 분만 최소 4주 전 투여·분만 후 최소 96시간.</span><span class="hang">건유 제제를 비유우에 쓰면 심각한 위반이다. 비처치 분방, 전신·자궁내 투여 후에도 우유로 배출된다. 치료우는 다리 밴드나 염료로 표시한다.</span><table class="bxt"><tr><th>미국 승인 비유우 유방내 제제(Rebhun)</th><th class="c">우유(시간)</th><th class="c">고기(일)</th><th class="c">투여</th></tr><tr><td>아목시실린</td><td class="c">60</td><td class="c">12</td><td class="c">12시간 간격 3회</td></tr><tr><td>세프티오퍼 염산염</td><td class="c">72</td><td class="c">2</td><td class="c">24시간 간격 2~8회</td></tr><tr><td>세파피린</td><td class="c">96</td><td class="c">4</td><td class="c">12시간 간격 2회</td></tr><tr><td>클록사실린</td><td class="c">48</td><td class="c">10</td><td class="c">12시간 간격 3회</td></tr><tr><td>헤타실린</td><td class="c">72</td><td class="c">10</td><td class="c">24시간 간격 3회</td></tr><tr><td>페니실린 G</td><td class="c">60</td><td class="c">3</td><td class="c">12시간 간격 3회</td></tr><tr><td>피를리마이신</td><td class="c">36</td><td class="c">9(2회 초과 시 21 이상)</td><td class="c">24시간 간격 2~8회</td></tr></table><span class="hang">미국 승인 비유우 주사제(Rebhun): 암피실린 우유 48시간·고기 6일, 세프티오퍼 염산염·나트륨 우유 없음·고기 4일(0.5~1.0 mg/lb 3~5일), 세프티오퍼 결정형 유리산 우유 없음·고기 13일, 옥시테트라사이클린 우유 96시간·고기 28일, 프로카인 페니실린 G 우유 48시간·고기 4~10일(3,000 U/lb, 5일 이내). 용량·기간을 늘리면 휴약을 연장한다.</span><span class="hang">우측 잔류 검사는 개체유에서 위양성이 많다(특이도 0.78~0.95). 염증 우유의 천연 살균물질 때문이며 82℃ 5분 가열로 줄일 수 있다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>분방의 영구 건유(화학적 폐쇄)<span class="hang">최선은 완전히 짜낸 뒤 플루닉신 1 mg/kg 정맥주사하고 5% 포비돈 요오드(요오드 0.5%) 120 mL를 주입하는 방법이며 개체 총 유량은 줄지 않는다.</span><span class="hang">클로르헥시딘 현탁액 60 mL를 하루 1회 3일(또는 24시간 뒤 1회 반복) 주입하면 14~63일 안에 기능을 잃으나 다음 비유기에 다시 젖이 나올 수 있다(7두 중 5두).</span><span class="hang">과거 방법: 3% 질산은 30~60 mL, 5% 황산구리 20 mL, 아크리플라빈 용액. 반응이 심하면 자주 짜내고, 없으면 10~14일 뒤 짜낸다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">56.</span><span>건유기 치료 — 원칙과 이점<span class="hang">마지막 착유 직후 장기작용 유방내 항생제를 주입해 기존 감염을 없애고 건유 초기 신규 감염을 막는다. 유방염 관리의 초석이다.</span><span class="hang">이점: 비유기보다 높은 치유율, 고용량 안전 사용, 긴 잔류 시간, 건유기 신규 감염 감소, 분만 전 조직 재생, 분만 시 임상형 감소, 잔류 위험 감소.</span><span class="hang">기대 치유율은 연쇄상구균 80%, 황색포도상구균 60%다. 뉴질랜드 연구에서 황색포도상구균 85%, S. uberis 90%, S. agalactiae 90%(무처치 31%, 50%, 29%)가 소실되었다(LAIM). Rebhun은 목장 건유 치유율 목표를 80% 이상으로 둔다.</span><span class="hang">건유 분비물은 락토페린이 많아 그람음성 감염이 드물므로 연쇄상구균, β-락타마제 생성 황색포도상구균, T. pyogenes에 강한 약을 고른다. 건유 제제는 그람음성 신규 감염을 막지 못한다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>전두 건유 대 선택적 건유<span class="hang">한 분방이 감염되면 다른 분방도 감염되었을 가능성이 높아 소 단위 치료가 합리적이다. 전두 건유는 분방 신규 감염률을 약 14%에서 7%로 낮추고 유량 증가만으로 비용을 상쇄한다. 현 선별검사가 부정확해 Constable은 전두 치료를 일반 권장한다.</span><span class="hang">가장 실용적 선택 기준은 마지막 검정 SCC가 초산우 15만, 경산우 25만 미만이다. 저SCC 무처치 분방은 비유 첫 100일 임상형이 70% 많았지만(주로 S. uberis) 총 항생제 사용은 85% 줄었다.</span><span class="hang">Rebhun과 LAIM은 내성 문제로 선택적 건유가 늘 것으로 보며, 원유 SCC 20만 초과 목장은 재고하라고 한다(LAIM). 내부 봉합제가 무처치우의 신규 감염 예방을 보완한다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>건유 제제의 지속과 주입 절차<span class="hang">대부분 약 4주, 일부 6주 유효 농도를 유지하며(Constable) 70일을 넘기는 경우는 드물다. 분만 전 재처치는 가치가 거의 없으나 여름유방염 다발 지역은 예외다.</span><span class="hang">미국 승인 건유 제제(Rebhun): 세프티오퍼(분만 28일 이내 금지, 고기 16일), 세파피린(우유 72시간, 고기 42일), 클록사실린(고기 28~30일), 페니실린 G(분만 후 72시간, 고기 14일), 페니실린 G+노보비오신(분만 후 72시간, 고기 30일).</span><span class="hang">완전히 짜냄 → 침지·건조 → 먼 쪽부터 알코올 솜으로 유두 끝 문지름 → 가까운 쪽부터 부분 삽입 주입 → 재침지. 급격히 건유하고 착유 중 처치하지 않으며 처치 후 30분 세워 둔다(Bovine Medicine).</span><span class="hang">비위생적 주입은 효모, 노카르디아, 슈도모나스, 프로토테카를 넣어 원래 균보다 큰 손상을 준다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>내부 유두 봉합제<span class="hang">건유 후 유두관은 최대 7일 열려 있고 14~21일에 걸쳐 케라틴 마개가 생기며, 건유 시 유량이 많으면 열린 채 남는다. 마개가 생기면 이후 감염 위험은 매우 낮다.</span><span class="hang">파라핀 기제 차질산비스무트는 항균력 없이 유두관 아래쪽에 가라앉아 물리적 장벽이 되며 최소 100일 지속된다.</span><span class="hang">메타분석: 무처치 대비 신규 감염 73%, 분만 후 임상형 48% 감소. 항생제 건유와 병용하면 단독보다 신규 감염 25%, 임상형 29% 추가 감소. 건유 70일 초과 소에서 세팔로늄 단독 11% 대 병용 4%였다.</span><span class="hang">기존 감염은 없애지 못하므로 항생제 건유 제제 직후 주입하고 위로 마사지하지 않는다. 단독 사용 시 무균 조작에 특히 주의한다. 분만 첫 착유 때 분방마다 10~12번 짜내고 초유는 최소 4일 출하하지 않는다.</span><span class="hang">Rebhun은 전 비유기 말 유방염이 있었던 소에서 병용 근거가 있고 단독 사용도 신규 감염을 줄인다고 쓴다. 외부 봉합제는 부착 기간이 비유우엔 너무 길고 건유우엔 너무 짧아 효과가 확립되지 않았다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>건유우 관리<span class="hang">건유 첫 주 매일 유두 침지는 S. uberis 감염을 줄이지 못했다.</span><span class="hang">환경은 깨끗하고, 건조하고, 서늘하고, 편안하게 한다. 축사가 안 되면 방목이 낫지만 그늘 밑 밀집·진흙은 위험하다. 분만 우방은 깨끗이 깔고 파리를 방제하며 유방·옆구리·뒷다리 안쪽 털을 깎는다.</span><span class="hang">비타민 E·셀레늄을 충분히 주고 유열을 예방한다. 분만 약 7일 전과 직후 bG-CSF 피하주사는 환경성 임상형을 줄였다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">61.</span><span>미경산우 유방염 — 역학·위험요인<span class="hang">분만 전에는 거의 드러나지 않지만 분만 전 분비물의 29~74%, 첫 분만 시 12~57%에서 병원체가 분리된다. 포도상구균(주로 CNS, 일부 황색포도상구균)이 가장 많고 환경성 연쇄상구균도 흔하다. CNS는 분만 후 첫 주에 상당수 자연 소실된다.</span><span class="hang">황색포도상구균 감염 미경산우가 있으면 대개 착유우도 상당수 감염되어 있다.</span><span class="hang">위험요인: 군사 송아지의 교차흡유, 비살균 유방염 우유·초유 급여, 파리 물림(유두 끝 딱지, 3개월령부터), 분만 전 경산우와 같은 축사, 비위생 환경, 유방 부종.</span><span class="hang">무리 사육 미경산우의 비대칭 유방 비대는 교차흡유 유방염을, 좌우 대칭 조기 발육은 낭종성 난소, 에스트로겐 함유 사료, 제랄레논을 의심한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>예방과 분만 전 치료<span class="hang">LAIM 예방 전략: 성우 유방염 관리, 포유기 개별 사육, 계속 빠는 송아지 도태, 대용유나 살균유 급여, 파리 방제, 분만 미경산우를 깨끗한 착유기로 먼저 착유, 깨끗한 분만 우방, 분만 전 비타민 E 1,000 IU/일과 셀레늄, J5 백신, 문제 목장은 분만 전 주 수회 유두 침지나 분만 약 1개월 전 내부 봉합제.</span><span class="hang">분만 약 30일 전 내부 봉합제는 비유 첫 14일 S. uberis 감염을 84%, 임상형을 68% 줄였다.</span><span class="hang">분만 전 항생제 유방내 치료는 문제 목장에만 권한다. CNS 감염 미경산우에 클록사실린 나트륨이나 세파피린 나트륨 200 mg을 분만 7일 전 주입하면 치유율 84%, 97%(무처치 27%)였다. LAIM은 잔류를 줄이려 분만 최소 60일 전 처치를 권한다.</span><span class="hang">분만 10~12주 전 세파피린 건유 제제는 감염의 90% 이상을 없앴고 분만 5일째 잔류 양성 분방은 없었다. Rebhun은 분만 10~14일 전 피를리마이신 1회를 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>육우·포유우 유방염<span class="hang">육우의 15~40%가 적어도 한 분방에 감염을 갖는다. CNS가 주이고 황색포도상구균은 시료의 7~10%다. 임상형은 드물고 경증은 대부분 놓친다(LAIM). Bovine Medicine은 육우에서 과소진단된다고 쓴다.</span><span class="hang">파리가 포도상구균을 옮기고, 송아지가 구인두 세균을 유두에 옮기거나 우유를 유두에서 유두로 나른다. 비위생 축사, 나쁜 유방 형태, 유두 손상도 위험하다.</span><span class="hang">준임상 유방염 어미의 송아지는 이유 체중이 최대 40 kg 적고 감염 분방이 많을수록 손실이 크다.</span><span class="hang">이유 시 건유 치료는 다음 분만 감염을 줄이고 송아지 증체를 늘렸으나 일상 사용의 경제성은 없고, CMT 선택 치료도 부정확하다. 위생적 축사, 적정 밀도, 파리 방제가 기본이다. Constable은 감염 수준이 낮아 관리 프로그램이 경제적이지 않다고 본다.</span><span class="hang">포유 관련: 유모우 목장의 파스튜렐라 유방염과 초유를 먹은 송아지의 파스튜렐라증, 마이코플라즈마 우유를 먹은 송아지의 폐렴·중이염, 헤르페스 유두염·위우두 어미를 빤 송아지의 구강 병변, 급성 대장균형 분방을 송아지에게 빨려 배출하는 방법(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">64.</span><span>유방 부종 — 원인<span class="hang">분만 시 부종은 생리적이며 분만 몇 주 전 시작해 분만 후 2~4주에 빠진다(Rebhun). Constable은 대개 하루 이틀에 빠진다고 쓴다. 이보다 오래가면 병적이며 분만 미경산우에서 가장 심하다.</span><span class="hang">유선 혈류 감소와 젖정맥 압력 상승이 관여하고 유전 경향이 있다(유량과의 유전상관 0.40). 저단백혈증은 선행 요인이 아니라는 기술(Constable)과 기여할 수 있다는 기술(Rebhun, Periparturient)이 있다.</span><span class="hang">위험요인: 고나트륨·고칼륨 사료(방목하면 사라짐), 겨울 분만, 큰 키, 수송아지, 비만, 운동 부족, 첫 분만 고령, 밀사. 분만 전 곡물 과다는 Constable은 소인이라 하고 Rebhun은 급여 시험이 뒷받침하지 않는다고 한다. Rebhun은 미경산우 칼륨을 하루 227 g 이하로 제시한다.</span><span class="hang">심하거나 지속되면 심장 질환, 후대정맥·젖정맥 혈전, 저단백혈증을 배제한다. 비대칭 복부 부종은 젖정맥 혈종이나 혈전정맥염을 시사한다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>임상증상과 점수<span class="hang">대칭성으로 유방에서 복부 아래를 따라 앞으로 퍼지고 차가우며 눌러 자국이 남는다. 착유를 방해해 불완전 착유·우유 누출로 유방염 위험을 높이고, 유방 열구 피부염, 헤르페스 유두염 악화, 동상, 현수인대 손상의 원인이 된다.</span><span class="hang">가벼운 형은 유방 바로 앞의 단단한 판으로 무해하나 매 비유기 반복되면 피부가 영구히 두꺼워진다.</span><table class="bxt"><tr><th class="c">점수</th><th>정의</th></tr><tr><td class="c">1~2</td><td>유방 기부, 일부 분방 주위</td></tr><tr><td class="c">3</td><td>유방 아래쪽 절반</td></tr><tr><td class="c">4~5</td><td>정중선·배꼽까지</td></tr><tr><td class="c">6</td><td>유방 전체, 정중 현수인대 주름 소실</td></tr><tr><td class="c">7~8</td><td>흉골까지, 복피하정맥 구분 불가</td></tr><tr><td class="c">9~10</td><td>허벅지 → 음문까지 심한 부종</td></tr></table></span></p><p class="bx-num"><span class="bxn">66.</span><span>치료와 예방<span class="hang">분만 전에 심해 현수장치 손상이 우려되거나 우유가 새면 치료한다. 분만 전 착유를 하면 초유는 버리고 송아지에게 다른 초유를 준다. 분만 후 잦은 착유와 이뇨제가 주 치료다.</span><table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>아세타졸아마이드</td><td>1~2 g 1일 2회 경구·주사 1~6일, 24시간 안에 빠지는 경우가 많음</td></tr><tr><td>클로로티아자이드</td><td>2 g 1일 2회 경구 또는 0.5 g 1일 2회 정맥·근육, 3~4일</td></tr><tr><td>푸로세미드</td><td>1 mg/kg 근육·정맥, 5 mg/kg 경구(Constable) / 분만 전 0.5~1.0 mg/kg 시작 후 감량, 1일 1~2회 2~4일(Rebhun)</td></tr></table><span class="hang">푸로세미드 장기 사용은 저칼륨·저염소혈증과 대사성 알칼리증, 소변 칼슘 손실로 경산우 유열 위험을 높인다. 분만 전 이뇨제는 체액 손실이 크면 위험하다.</span><span class="hang">코르티코스테로이드는 Constable은 효과가 없어 보인다고 하고, Rebhun은 분만 후 덱사메타손-이뇨제 경구 복합제가 어떤 목장에서는 더 낫다고 한다(임신 말기 금지).</span><span class="hang">온습포, 마사지, 지지대, 운동, 염분 제한이 보조가 된다. 집단 문제면 나트륨·칼륨과 양이온-음이온 균형을 평가하고, 부종 딸을 낳는 종모우를 피한다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>유방 현수인대 파열<span class="hang">성우에서 수년에 걸쳐 진행하며 분만 시 심한 부종과 무게로 정중 현수인대가 무너진다. 유두가 옆으로 향한다. 급성 파열은 유방이 크게 처지고 붓고 장액이 스며 나와 괴저성 유방염이나 요막수종 복벽 파열과 혼동될 수 있다.</span><span class="hang">부종, 손상, 유방염 위험이 커지고 착유기 장착이 어려워진다. 치료법은 없고 지지대로 부분 완화된다. 예방은 유전 선발과 분만 부종의 신속한 치료뿐이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">68.</span><span>혈유 — 분만 후 혈유<span class="hang">유방 부종이 있는 미경산우의 모세혈관 출혈이 가장 흔하고 직접 외상도 원인이다. 연분홍~초콜릿색이며 분만 7~8일 뒤까지 남을 수 있으나 대개 4~8회 착유 안에 멎는다. 혈액이 세균 배지가 되므로 유방염을 관찰한다(Rebhun).</span><span class="hang">칼슘 보로글루코네이트나 포르말린 정맥주사가 널리 쓰이나 효과 연구가 없고 치료 가치가 의문이다. 유두 속 응괴는 눌러 부수면 잘 나온다.</span><span class="hang">분만 직후가 아닌데 네 분방 모두 혈유면 렙토스피라증이나 광범위 모세혈관 손상을 의심한다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>비유 중 심한 유방내 출혈<span class="hang">원인은 대개 모르며 외상을 의심하고 일부는 혈소판감소가 있다. 우유가 붉고 응괴가 뚜렷하며 계속되면 빈혈이 온다.</span><span class="hang">착유를 멈추면 출혈은 멎을 수 있으나 유관·유두조에 응괴가 차서 다시 착유하지 못할 수 있다. 하루 1회로 착유를 줄이는 것이 최적 관리로 여겨지고, 며칠에 해결되지 않으면 착유 중지를 고려한다.</span><span class="hang">혈소판감소나 PCV 10% 미만이면 BLV, BVDV, 블루텅, 아나플라스마, 요네병 음성 공여우의 신선 전혈 4~6 L를 수혈한다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>유방 혈종과 젖정맥 혈전정맥염<span class="hang">비유우는 유방 바로 앞, 건유우는 음문 아래 회음부에 부드럽거나 파동성의 차갑고 통증 없는 종창이 생긴다. 젖정맥 투약 시도로도 생긴다. 계속 커지며 빈혈이 진행하면 2~7일에 죽을 수 있다.</span><span class="hang">초음파로 확인하되 천자는 감염·재출혈 위험이 있어 꺼린다. 농양은 따뜻하고 아프며 가스 음영이 보인다.</span><span class="hang">우방 안정, 12~24시간마다 관찰, 출혈 중 NSAID 금지. PCV 10~12%, 심박 100회/분 초과, 호흡 60회/분 초과면 전혈 5~8 L 수혈. 절개해 출혈 혈관을 찾는 것은 금기다. 안정되면 흡수되나 일부는 농양이 된다.</span><span class="hang">젖정맥 혈전정맥염은 정맥주사 합병증으로 유방 비대칭과 색전(심내막염·신염) 위험이 있어 이 정맥은 위급할 때 외에는 쓰지 않는다. 농양이 되면 초음파 유도 배액과 β-락탐 항생제를 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">71.</span><span>유방 농양<span class="hang">피부 천자 후 생긴 농양은 분비물이 정상인 분방에도 나타나며 분만 직전 미경산우나 성우, 한 목장 여러 두에 생길 수 있다. 유방염성 농양은 T. pyogenes 유방염의 전형이다.</span><span class="hang">T. pyogenes, 포도상구균, 때로 Fusobacterium, Prevotella, P. indolicus가 있다. 단단하고 따뜻하며 아프고 두꺼운 피막에 싸여 있다. 초음파로 내용물·가스와 위를 지나는 혈관을 확인한다.</span><span class="hang">보존적 치료로 2~8주 뒤 자연 파열·배액을 기다리는 것이 가장 안전하다. 배액 후 묽은 소독제나 식염수로 매일 세척하고 구멍이 일찍 닫히지 않게 하며 전신 항생제는 대개 필요 없다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">72.</span><span>유두 손상 — 외상·열상<span class="hang">유두 끝이 가장 흔한 손상 부위로 같은 쪽 발굽·부제나 옆 소에 밟혀 생기며 처진 유방에 많다. 통증성 종창, 착유 거부, 불완전 착유가 생기고 유방염이 흔한 후유증이다.</span><span class="hang">급성 유두 끝 손상은 소염 치료와 추가 손상 방지가 기본이다. 착유가 어려우면 기계 착유를 멈추고 1일 2회 멸균 캐뉼러로 짜내되 알코올로 끝을 닦고 넣는다. 실리콘·왁스 삽입물이나 유치 캐뉼러도 쓴다(Rebhun).</span><span class="hang">전층 열상은 응급으로 모든 층을 봉합해야 한다. 수직 열상이 잘 낫고, 유두관이 잘린 피판은 잘라 낸다. 봉합 후 유치 캐뉼러를 열어 두고 전신 항생제 3~5일과 분방 내 항생제를 쓴다. 상처 벌어짐이 흔해 심하면 건유 후 수술하는 편이 성공률이 높다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>유두 끝 병변과 흑반<span class="hang">기계 착유우의 유두구 2 mm 흰 고리는 정상이다. 이것이 비대·각화·균열을 거쳐 딱지, 유두관 외번, 미란으로 진행하며 과도하거나 변동하는 진공, 불량 라이너, 부적절한 박동비, 과착유가 원인이다.</span><span class="hang">흑반은 유두 끝의 깊은 분화구 궤양 가운데 검은 점이 있는 병변으로 단단하고 뾰족한 유두의 과도한 진공·과착유가 원인이다. F. necrophorum이 흔하고 황색포도상구균도 분리되며 T. pyogenes 유방염이 흔한 후유증이다.</span><span class="hang">반응이 나쁘다. 휘트필드 연고, 10% 살리실산, 5% 황산구리, 요오드 연고나 35% 글리세롤 첨가 요오드 침지액을 철저히 반복 바르고 착유기 결함을 고친다.</span></span></p><p class="bx-num"><span class="bxn">74.</span><span>유두 피부염(환경·화학·물리적)<span class="hang">튼살: 진흙·바람·추위로 유두 기부 근처에 수평 균열이 여러 개 생기며 봄 방목 직후 악천후에 흔하다. 침지액에 글리세린 10%를 넣는다.</span><span class="hang">화학적: 자극성·동결 해동된 침지액, 석회 깔짚, 진한 발굽 소독조, 파리 약. 착색 유두를 포함해 유두 대부분이 붉고 물집이 생기며 여러 두가 걸린다. 원인을 없애고 씻은 뒤 라놀린·알로에를 바른다.</span><span class="hang">광과민: 비착색 피부의 유두 측면에 홍반·경결이 생기고 소가 물에 유두를 담근다. 코르티코스테로이드 분만 유도 후에는 유두에 국한된다. 그늘과 원인 제거.</span><span class="hang">동상: 젖은 유두, 부종이 있는 분만 미경산우, 영하 18℃ 이하. 창백하고 차갑게 붓다가 가죽처럼 굳고 검게 변해 떨어진다. 헤르페스 유두염과 감별하며, 따뜻한 곳에 두고 라놀린으로 보호한다.</span><span class="hang">괴저성 유방염에 동반된 유두염은 차갑고 자흑색이며 피하 가스와 함께 벗겨진다. 유두조 외상에 의한 만성 유두염은 중앙에 단단한 끈처럼 만져지고 잘 낫지 않는다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>유두종(사마귀)<span class="hang">소 유두종바이러스가 착유기와 손으로 찰과 부위에 퍼진다. 가장 흔한 것은 BPV5의 납작한 쌀알 모양이고 잎 모양은 BPV1·BPV6이다. 젊은 소에 많고 수개월에 퇴행하나 유두 사마귀는 수년 갈 수 있다.</span><span class="hang">유두 끝에 생기면 착유를 방해하고 유방염 소인이 된다. 쌀알형은 대개 치료가 필요 없고 잎 모양은 잘라 낸다. 많으면 액체질소로 냉각한 쇠막대로 얼린다. 집단 문제면 살바이러스 침지, 감염우 마지막 착유, 개별 종이 수건을 쓴다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>우두와 위우두<span class="hang">위우두(파라폭스바이러스)는 흔하다. 통증성 부종 뒤 작은 주황 구진, 짙은 적색 딱지가 생기고 가운데가 패며 10일쯤 고리·말굽 모양 딱지가 남는다. 수포는 드물고 대개 6주 안(Rebhun 2~3주) 흉터 없이 낫는다. 착유기와 손으로 퍼지고 재발하며 착유자 결절이 생긴다. 유방염은 헤르페스 유두염보다 훨씬 덜하다. 특이 치료는 없고 장갑을 낀다.</span><span class="hang">우두(오르토폭스바이러스)는 드물고 인수공통이다. 쥐가 자연 숙주이며 사람이 소에 옮기는 것으로 본다. 홍반 → 구진 → 수포 → 농포 → 분화구와 갈색 딱지, 착유우에선 느리게 낫는 궤양이 된다. 감염우를 분리해 마지막에 착유하고 감염된 착유자는 몇 주간 착유하지 않는다(Bovine Medicine).</span><span class="hang">감별: 헤르페스 유두염, 화학 손상, 수포성 질환, 구제역, 유방 농가진. 확진은 바이러스 분리, PCR, 전자현미경이다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>소 헤르페스 유두염<span class="hang">소 헤르페스바이러스 2형(드물게 4형)이 원인이다. 처음 감염된 목장은 이환율 18~96%이고 이후엔 분만 미경산우에 국한된다. 대개 분만 후 2주 안이며 분만 부종이 심하면 특히 심하다.</span><span class="hang">잠복기 5~10일, 전신증상 없다. 얇은 수포가 24시간 안에 터져 장액이 흐르고 피부가 벗겨지며 4일째 딱지, 3주에 재생된다. 심하면 유두 전체가 푸르게 변해 벗겨지고 궤양이 2~3개월 간다.</span><span class="hang">착유가 어려워 유방염이 늘고 유량이 최대 20% 준다. 감염 미경산우의 최대 50%가 유방염으로 손실된다(Rebhun). 어미를 빤 송아지에 구강 병변이 생긴다.</span><span class="hang">초기 수포액 바이러스 분리·PCR, 생검 핵내 봉입체(위우두는 세포질 내), 혈청 역가(BHV-2 1:16, BHV-4 1:20 이상). 특이 치료는 없고 착유 전 수용성 소독 연고, 착유 후 수렴제(크리스탈 바이올렛)로 딱지를 지킨다. 요오드 소독제를 쓰고, 분만 부종을 줄이면 중증도가 낮아진다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>유방 농가진·유방 열구 피부염<span class="hang">유방 농가진: 황색포도상구균에 의한 유두 기부의 2~4 mm 농포가 유두·유방으로 퍼진다. 포도상구균 유방염과 흔히 동반되고 착유자에 옮을 수 있으며 우두로 오인된다. 후침지, 착유 전 세척, 소독 연고로 대개 멎는다. Rebhun은 털을 깎고 포비돈 요오드로 씻으며 항생제는 대개 불필요하다고 한다.</span><span class="hang">유방 열구 피부염: 좌우 유방 사이, 유방 앞 정중선, 유방과 허벅지가 닿는 부위에 피지 분비, 악취, 괴사를 보인다. 고령·고능력우와 깊은 유방에 많고 허벅지 부위는 부종이 있는 분만 미경산우에 많다.</span><span class="hang">부종 해소와 수건으로 반복 문지르는 괴사조직 제거, 심하면 눕혀 큐렛으로 제거한다. Bovine Medicine은 주로 포도상구균이 원인이며 세척과 국소·전신 항생제를 든다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>착유 위생 — 착유 절차 원칙<span class="hang">착유 전 유방 위생, 사출 자극, 효율적 착유, 착유 후 유두 소독이 원칙이다. 착유 간격을 일정하게 하고 아드레날린 분비로 옥시토신 작용을 막는 스트레스를 피한다.</span><span class="hang">목표는 깨끗하고 마른 유두를 착유하는 것이다. 유방을 적시지 말고 개별 종이 수건과 일회용 장갑을 쓴다. 공용 수건과 세척 양동이는 전염성 병원체를 퍼뜨린다.</span><span class="hang">앞젖 짜기는 조기 발견, 유두관 세균 배출, 사출 자극의 이점이 있으며 전침지·세척보다 먼저 한다. 유방 위생 점수는 1(깨끗) ~ 4(30% 이상 굳은 오물)이며 유방·뒷다리 점수가 SCC와 연관된다.</span><span class="hang">Bovine Medicine 점검: 전침지 소당 침지 10 mL·분무 15 mL, 부착까지 60~90초 대기, 과소·과착유 피하기, 탈착 직후 후침지, 박동수 분당 55~65회, 박동비 60:40 전후, 라이너는 2,500회 착유마다 교체.</span><span class="hang">불규칙한 진공 변동과 라이너 미끄러짐은 우유 방울을 유두 끝으로 역류시켜 세균을 밀어 넣는다. 착유 후 유두관이 수축하는 데 약 2시간 걸리므로 사료를 주어 서 있게 한다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>전침지와 후침지<span class="hang">후침지는 비유우에서 가장 효과적인 단일 관리법으로 신규 감염을 50~90% 줄인다. 주로 전염성 병원체와 C. bovis에 효과적이고 대장균형에는 효과가 적다.</span><span class="hang">요오드는 세균·바이러스·진균에 효과적이고 최소 0.5%가 이상적이며 10% 글리세린 함유 요오드가 기준 표준이다. 클로르헥시딘은 유기물 존재 시 효과가 좋고 지속성이 뛰어나나 바이러스·진균에 약하다. 그 밖에 LDBSA, 4급암모늄, 4% 차아염소산나트륨(값싸나 미승인)이 있다.</span><span class="hang">유두의 최소 아래 절반 이상을 덮는다. 분무는 침지와 효과가 같지만 엉성해지기 쉽다. 희석하지 말고 남은 액을 원래 용기에 붓지 않으며 얼지 않게 둔다. 정기적으로 바꿀 필요는 없다. 추운 날은 고보습 제품을 쓴다.</span><span class="hang">전침지는 환경성 감염을 약 51% 줄이지만 임상형 감소는 입증되지 않았다. 차단형 침지는 살균 후침지보다 낫지 않았다. 세라티아·노카르디아는 일부 클로르헥시딘·4급암모늄 침지액에서 살아남는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">81.</span><span>유방염 관리 프로그램 — 원리<span class="hang">유병률은 신규 감염률에서 소실률을 뺀 것이다. 신규 감염률은 노출 수준 × 감수성 분방 수, 소실률은 감염 수 × 치료 효과 + 자연 치유다.</span><span class="hang">세 원칙: 기존 감염 제거(건유 치료가 최선, 비유기 치료, 만성우 도태), 신규 감염 예방(후침지가 최선, 착유기, 건유 치료·내부 봉합제, 환경·영양), 유방 건강 감시.</span><span class="hang">박멸은 S. agalactiae 외에는 현실적이지 않다. SCC를 지나치게 낮추면 대장균형 저항성이 떨어질 수 있다는 견해가 있다. 수익 대 비용은 약 6:1이다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>10대 관리 항목<span class="hang">5대 항목: ① 유방 위생과 올바른 착유 ② 착유기 설치·작동·유지 ③ 건유우 관리와 치료 ④ 비유기 임상형의 적절한 치료 ⑤ 만성 감염우 도태. 전염성 유방염에는 매우 성공적이나 환경성에는 불충분하다.</span><span class="hang">추가 5항목: ⑥ 적절한 환경 ⑦ 기록 ⑧ 유방 건강 감시 ⑨ 프로그램 정기 검토 ⑩ 목표 설정.</span><span class="hang">도태: 흔히 한 비유기 임상형 3회 이상이면 도태하나 근거 연구는 적다. 만성 유방염 기록과 깊은 촉진에서 심한 섬유화가 도태 근거가 된다.</span></span></p><p class="bx-num"><span class="bxn">83.</span><span>감시 지표와 목표치<table class="bxt"><tr><th>지표(Bovine Medicine)</th><th class="c">목표</th><th class="c">개입 수준</th></tr><tr><td>임상형(100두당 연간)</td><td class="c">30</td><td class="c">40</td></tr><tr><td>재발률</td><td class="c">10% 미만</td><td class="c">15%</td></tr><tr><td>유방염 도태율</td><td class="c">2% 미만</td><td class="c">5%</td></tr><tr><td>건유우(여름)유방염</td><td class="c">1% 미만</td><td class="c">5%</td></tr><tr><td>분만 30일 이내 첫 임상형</td><td class="c">8.5% 이하</td><td class="c">—</td></tr><tr><td>월 신규 고SCC(20만 초과)</td><td class="c">5% 미만</td><td class="c">—</td></tr><tr><td>만성 감염(최근 2회 20만 초과)</td><td class="c">5% 미만</td><td class="c">—</td></tr><tr><td>건유기 신규 감염(저→고)</td><td class="c">5% 미만</td><td class="c">—</td></tr><tr><td>건유 전후 모두 저SCC</td><td class="c">80% 초과</td><td class="c">—</td></tr></table><span class="hang">Rebhun은 월 임상형 2% 미만, 재발률 30%를 허용 수준, 우수 목장 신규 임상형을 비유기 100두당 15건으로 제시하고, Constable은 잘 관리하면 연 7~21건으로 유지할 수 있다고 쓴다.</span><span class="hang">분만 30일 이내 임상형이 많으면 건유기 기원, 이후가 많으면 비유기 기원이다. 감염 기간이 길고 원유 SCC가 높으며 한 분방 재발이 많으면 전염성, 기간이 짧고 SCC가 낮으며 분만 전후 임상형이 많으면 환경성 양상이다.</span></span></p></div>
</div>
`;
}
function med_sysHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 전신·감염</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>발열 감별 — 정의와 원인 분류<span class="hang">발열은 환경과 관계없이 체온조절 설정점이 올라가 심부체온이 높아진 상태로, 고체온에 감염이나 염증이 결합된 것이다.</span><span class="hang">패혈성 발열이 더 흔하다. 국소 감염(농양, 봉와직염, 축농), 간헐적 전신감염(균혈증, 심내막염), 지속적 전신감염(패혈증)이 여기에 든다.</span><span class="hang">무균성 발열에는 이종단백 주사 같은 화학적 발열, 조직·혈액 붕괴에 의한 수술열, 괴사성 물질 주사 뒤 근육 괴사, 심한 용혈 위기(혈색소혈증), 광범위 경색, 소의 다중심성 림프육종 같은 급성장 종양의 괴사, 아나필락시스·혈관신경성부종 같은 면역반응이 있다.</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>기전과 경과<span class="hang">세균, 바이러스, 내독소, 항원항체복합체 같은 외인성 발열물질이 단핵구·대식세포에서 내인성 발열물질(IL-1, TNF-α)을 분비시키고, 시상하부 전방에서 PGE2 합성이 늘어 설정점이 올라간다. 그람음성균 지질다당류가 가장 강력한 외인성 발열물질의 하나다.</span><span class="hang">상승기(오한기)에는 피부혈관 수축, 피부 냉감·건조, 근육 떨림, 소변 감소가 있고 사지는 차지만 직장온은 높다. 극기에는 피부혈관이 확장되고 발한·이뇨가 나타나며 반추동물은 전위 운동이 줄어든다. 하강기에는 혈관확장과 발한으로 체온이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>임상소견과 열형<span class="hang">체온 상승, 심박 증가와 맥박 약화, 호흡 증가, 쇠약, 핍뇨(흔히 단백뇨), 갈증, 식욕부진, 분변 감소, 침울, 근육 무력이 나타난다. 체온 상승은 대개 중등도이고 42℃를 넘는 일은 드물다.</span><span class="hang">열형은 일과성, 계류열(일교차 없음), 이장열(일교차 과장), 간헐열(2~3일 발열과 정상기 반복), 비정형으로 나눈다. 상승 후 정상으로 떨어졌다가 다시 오르는 이상성 발열도 있다.</span><span class="hang">농장동물 발열의 가장 흔한 원인은 폐렴, 복막염, 유방염, 뇌염, 패혈증, 바이러스혈증 같은 염증이다.</span><span class="hang">비육우 무리에서 침울·식욕부진·호흡곤란과 39.5~40.5℃ 발열이 있을 때, 40.5℃ 이상이 2일 연속이면 급성 미분화 소 호흡기병 또는 미분화 발열로 진단하는 경향이 있다.</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>원인불명열 접근<span class="hang">발열에 특이적인 임상병리 소견은 없다. 혈액 미생물검사, 체강액 분석, 뇌척수액, 유즙, 생식기 분비물, 관절액, 생검, 시험개복, 영상검사로 병소를 찾는다.</span><span class="hang">흔히 숨어 있는 병소는 복막·흉막·폐 농양, 패혈성 자궁염, 심내막염, 다발성 관절염, 신우신염이다.</span></span></p><p class="bx-num"><span class="bxn">5.</span><span>발열의 치료<span class="hang">원인 질병을 찾아 치료하는 것이 핵심이다. 세균 감염에는 원인, 중증도, 병소 접근성에 맞춰 항균제를 고른다. 바이러스병에서 2차 세균감염 예방 목적의 항균제는 논란이 있고 이득이 불확실하다.</span><span class="hang">원인불명열에 맹목적으로 광범위 항균제를 쓰면 약물독성, 내성균 중복감염, 이후 배양진단 방해가 생기므로 권장되지 않는다. 시험 투여를 할 때는 매일 반응을 평가하며 원인 규명을 계속한다. 농양이나 흉강의 감염원은 배액이 필요할 수 있다.</span><span class="hang">발열은 대개 해가 적고 방어에 유리하므로 해열제는 꼭 필요하지 않고 치료 효과 판단을 흐릴 수 있다. 불편감이나 식욕부진을 일으키거나 고체온사 위험이 있을 만큼 높으면 플루닉신 메글루민(flunixin meglumine) 같은 NSAID를 쓴다. 비경구 투여 30분 안에 직장온이 내려가기 시작하지만 대개 정상범위까지는 돌아오지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">6.</span><span>패혈증·내독소혈증 — 용어 정의<span class="hang">패혈증(sepsis)은 의심되거나 확인된 세균 감염에 전신염증반응증후군(SIRS)이 동반된 상태다. SIRS는 감염성(세균, 바이러스, 원충, 진균) 또는 비감염성(외상, 독소, 고체온, 화상) 손상에 대한 전신 염증이다.</span><span class="hang">가축의 SIRS 기준은 확립되지 않았고, 사람에서는 다음 가운데 2가지 이상을 쓴다: 고체온 또는 저체온, 빈맥, 빈호흡 또는 과환기, 백혈구 감소·증가 또는 띠호중구 10% 초과. 더위 스트레스, 환경 한랭, 통증이 측정에 영향을 줄 때는 적용하지 않는다.</span><span class="hang">중증 패혈증은 장기 기능부전을 동반한 패혈증이고, 패혈성 쇼크는 적극적 정맥수액에도 저혈압(평균동맥압 65 mmHg 미만)이 이어지는 중증 패혈증이다.</span><span class="hang">균혈증은 세균이 일시적으로 혈류에 있으나 패혈증이나 쇼크가 없는 상태로, 직장검사 같은 점막 조작 뒤 흔히 생긴다. 패혈증(septicemia)은 병원체가 병 경과 내내 혈중에 있으면서 병을 직접 일으키는 상태다. 둘 이상 장기의 기능부전은 다장기기능부전증후군(MODS)이라 부른다.</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>원인<span class="hang">송아지: 대장균과 살모넬라가 흔하고 혈액에서 가장 많이 분리되는 것은 대장균이다. 패혈증 송아지의 10%는 그람양성균, 28%는 복합감염이다. 설사 유무와 관계없이 중증 송아지의 30%가 균혈증이며 초유 면역 이행 실패 송아지에서 위험이 높다.</span><span class="hang">소: 히스토필루스 솜니(Histophilus somni), 파스튜렐라 멀토시다, 만하이미아 헤몰리티카, 예르시니아 슈도투베르쿨로시스, BVD 바이러스 급성·만성 감염, 악성카타르열이 있다. 탄저, 파스튜렐라증, 살모넬라증은 모든 식용동물에 생긴다.</span><span class="hang">내독소혈증을 흔히 동반하는 소의 병은 대장균성 유방염, 복막염, 폐렴·흉막염, 심낭염, 패혈성 자궁염, 신생자 패혈증, 근염, 수막뇌염, 일부 장염이다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>기전<span class="hang">세균의 외독소·내독소가 숙주 매개체 분비를 일으켜 심한 독혈증과 고열을 만들고, 단핵구·림프구 자극으로 SIRS가 시작된다. 신생 송아지에서 혈장 TNF-α 농도는 임상 중증도와 연관된다.</span><span class="hang">내독소는 그람음성균 외막의 지질다당류로, 세균이 급증하거나 세포벽이 깨질 때 방출된다. 장 안의 내독소는 장점막이 손상(장염, 급성 장폐색)되어야 흡수되고, 소량은 간에서 해독된다.</span><span class="hang">SIRS가 진행하면 파종성혈관내응고(DIC)가 온다. 초기 과응고가 응고인자·혈소판 소모로 저응고로 바뀌고, 섬유소용해 활성화가 출혈 경향의 주원인이 된다. 통제되지 않는 과응고는 MODS로 폐사율이 높다.</span></span></p><p class="bx-num"><span class="bxn">9.</span><span>임상증상<span class="hang">패혈증의 주증상은 발열, 심혈관 기능부전과 쇼크, 점막·피하 점상출혈(때로 반상출혈)이다. 출혈은 결막과 구강·음문 점막에서 가장 잘 보인다. 관절, 심장판막, 수막, 눈에 국재하면 해당 증상이 더해진다.</span><span class="hang">급성 독혈증: 침울, 식욕부진, 근육 무력, 분변 감소(소량 설사도 가능), 빈맥, 초기 심음 증강 뒤 감약, 약하고 빠르나 규칙적인 맥이 나타난다. 초기 발열이 흔하나 나중에는 정상이나 저체온이 된다. 말기에는 허탈되어 혼수나 경련으로 죽는다.</span><span class="hang">중증 내독소혈증: 고체온 뒤 저체온, 빈맥 뒤 심박출 감소, 혈압 저하, 피부·사지 냉감, 설사, 점막 울혈과 모세혈관재충만시간 연장, 근무력과 기립불능이 나타난다. 무뇨성 신부전이 흔하다. DIC가 오면 점막·공막 점상·반상출혈과 채혈 부위 출혈이 보인다.</span><span class="hang">30일령 미만 패혈증 송아지는 사지 냉감, 탈수, 약한 맥, CRT 연장, 무력, 기립불능 같은 쇼크 소견과 안구염, 신경증상, 제대정맥염, 다발성 관절염 같은 국재 소견을 보인다. 신생 송아지는 체온조절 실패나 초유 결핍 때문에 발열이 없을 수 있다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>임상병리<span class="hang">혈액배양: 발열 직전에 큰 정맥이나 동맥에서 채혈한다. 털을 깎고 포비돈요오드로 소독한 뒤 최소 10 mL(가능하면 30 mL)를 혐기적으로 받아 혈액:배지 1:10~1:20으로 접종하고 최대 1주간 매일 관찰한다.</span><span class="hang">혈액상: 경증 내독소혈증은 백혈구증가·호중구증가를, 중증으로 갈수록 백혈구·호중구·림프구 감소를 더 심하고 길게 보인다. 띠호중구, 후골수구, 독성 호중구는 예후 지표가 된다.</span><span class="hang">응고: 혈소판, 프로트롬빈, 섬유소원 감소와 D-dimer 증가가 소모성 응고병증을 시사한다. 패혈성 쇼크가 의심되는 신생 송아지는 aPTT가 연장되며, 응고 이상이 심한 송아지는 집중치료에도 죽을 가능성이 훨씬 높다.</span><span class="hang">생화학(급성 내독소혈증): 저혈당, 혈중 요소 증가, 모세혈관 투과성 증가에 의한 알부민·총단백 감소가 흔하다. 성우는 경미한 저칼슘·저마그네슘·저칼륨·저인혈증을 보이고 혈장 철과 아연이 감소한다. 만성 독혈증은 글로불린 증가로 총단백이 높다.</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>치료 원칙<span class="hang">목표지향치료 4요소: (1) 감염 병소 제거, (2) 그람음성 범위의 살균성 항균제, (3) 상대적 저혈량·저혈압·저혈당과 전해질·산염기 이상을 교정하는 적극적 수액, (4) 사이클로옥시게나제 산물을 억제하는 NSAID나 글루코코르티코이드.</span><span class="hang">세포벽에 작용하는 β-락탐계는 이론상 내독소를 한꺼번에 방출시킬 수 있으나 임상적 해는 확인되지 않았고, 아미노글리코시드를 함께 쓰면 이를 막는다. 항균제를 시작할 때는 NSAID를 같이 준다. 신생 송아지에서 세프티오푸르는 분포용적이 크고 청소가 느려 용량을 조정한다.</span><span class="hang">수액: 첫 1시간 20~40 mL/kg 같은 볼루스 소생에 우려가 제기되어, 신속 소생은 소량 고장식염수(7.5% NaCl)로 하고 등장 정질액은 20 mL/kg/h 미만으로 수 시간에 걸쳐 준다. 추정 혈액량의 0.5~1.0배를 수 시간에 걸쳐 줄 수 있다. 반응 지표는 말초혈관수축 해소, 맥질 회복, 배뇨 재개, 중심정맥압 상승, 평균동맥압 65 mmHg 초과다. 수액 세부는 수액 탭에서 다룬다.</span><span class="hang">저혈당과 식욕부진이 있으므로 수액에 포도당을 넣는다.</span><span class="hang">설사 송아지 가운데 빨기반사 감소, 탈수 6% 초과, 무력, 기립불능, 침울을 보이는 중증은 균혈증 빈도가 약 30%이므로 대장균 균혈증을 겨냥해 일상적으로 치료한다. 초유 이행 실패 신생자 패혈증에는 혈장이나 전혈 수혈이 유리하다고 여겨지나 폐사율 개선은 불확실하다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>보조 약물 용량<table class="bxt"><tr><th>약물</th><th>용량·방법</th><th>비고</th></tr><tr><td>플루닉신 메글루민</td><td>1.1~2.2 mg/kg IV, 24시간마다(미국 소 허가)</td><td>내독소혈증 NSAID 선택약. 반복 투여 시 수화 유지. 경구 2.2 mg/kg도 IV와 비슷한 효과</td></tr><tr><td>플루닉신(말 권장)</td><td>1.1 mg/kg IV, 12시간마다</td><td>0.25 mg/kg '항내독소 용량'이라는 표현은 오해 소지가 있다</td></tr><tr><td>페닐부타존</td><td>5 mg/kg/일 IV, 5일(송아지 실험)</td><td>국가에 따라 소 사용 금지</td></tr><tr><td>덱사메타손</td><td>1 mg/kg IV, 24시간마다</td><td>가능한 한 일찍. 면역억제 우려, 자연발생 증례 효과 근거 부족</td></tr><tr><td>폴리믹신 B</td><td>1 mg(6,000 U)/kg, 8시간 간격</td><td>망아지·말 근거. 조기 투여해야 효과</td></tr><tr><td>도부타민</td><td>성축 0.5~1, 신생자 1~3 µg/kg/min</td><td>강심제 선택약. 심박·리듬·혈압 보며 적정</td></tr><tr><td>노르에피네프린</td><td>0.01~1 µg/kg/min</td><td>수액·도부타민에 반응 없는 저혈압. 5% 포도당에 희석</td></tr></table><span class="hang">송아지 실험 내독소혈증에서 케토프로펜, 플루닉신, 케토롤락, 페닐부타존을 비교했을 때 어느 것도 뚜렷이 우월하지 않았다. 착유우 실험에서 플루닉신과 페닐부타존은 내독소 청소를 각각 2~3배, 6~12배 늦췄다.</span><span class="hang">J-5 대장균 고면역혈청은 송아지·망아지에서 효과가 확인되지 않았고 폴리믹신 B에 반응이 없을 때로 미룬다. 펜톡시필린, DMSO, 인슐린 등은 자연발생 증례 연구가 없어 권장되지 않는다. DIC는 헤파린보다 적극적 수액으로 미세순환을 유지하는 데 중점을 둔다.</span><span class="hang">예방의 축은 신생자 패혈증 감소, 그람음성 감염의 조기 적극 치료이며, 코어 지질다당류 백신이 그람음성 유방염 감소에 쓰인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">13.</span><span>소바이러스성설사·점막병(BVD/MD) — 원인<span class="hang">페스티바이러스속(Flaviviridae) 외피 단일가닥 RNA 바이러스로 BVDV-1(1a~1l)과 BVDV-2(2a, 2b)가 있다. HoBi 유사 페스티바이러스(BVDV-3 제안)도 소에서 비슷한 병과 지속감염을 일으킨다.</span><span class="hang">세포배양 효과에 따라 비세포병원성(NCP)과 세포병원성(CP) 생물형으로 나눈다. 야외의 주류는 NCP이고 임상병도 대부분 NCP가 일으킨다. CP는 주로 점막병 증례에서 분리되며, 지속감염우 안에서 NCP의 재조합이나 돌연변이로 생긴다. 두 생물형은 혈청학적으로 구별되지 않는다.</span><span class="hang">두 생물형 모두 태반을 넘지만 태아에 지속감염을 일으키는 것은 NCP뿐이다.</span><span class="hang">BVDV-2 강독주는 발열, 설사, 백혈구·림프구·호중구 감소, 혈소판감소와 폐사를 일으키고, 약독주는 백혈구감소와 미열만 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>역학과 전파<span class="hang">주 감염원은 지속감염(PI)우로, 평생 분비물로 대량의 바이러스를 배출한다. 미국 육우에서 귀조직 검사로 본 개체 수준 PI 유병률은 0.12%, 농가 안 0~16%, 농가 수준 8.8%였다.</span><span class="hang">직접 접촉이 주 경로이고 공기, 흡혈파리, 주사바늘 재사용 같은 매개물, 정액(인공수정·자연교배), 수정란, 오염된 소태아혈청이 들어간 백신으로도 전파된다.</span><span class="hang">점막병 발생은 대개 농가 두수의 5% 미만이다. 국내에는 1953년부터 발생해 전국에 퍼져 있다는 기술이 있다(한우컨설팅지침서).</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>임신 시기별 감염 결과<table class="bxt"><tr><th>감염 시기</th><th>결과</th></tr><tr><td>수정 전후~임신 45일</td><td>수태율 저하(배란 지연·실패), 수정 실패, 조기배아사, 재발정. 수정 4일 후 감염 시 8~17일 바이러스혈증, 불임 소는 약 20일 뒤 재발정</td></tr><tr><td>임신 45~125일(지침서 42~125일)</td><td>NCP 감염 태아가 살아남으면 면역관용 PI우로 태어난다. 50~100일 감염은 유산·미라변성 가능하나 태아 생존율이 70%까지 된다</td></tr><tr><td>임신 125~175일(지침서 100~150일)</td><td>신경계·면역계 기관형성 말기로 선천기형(소뇌형성부전, 눈 이상 등)</td></tr><tr><td>임신 150~180일 이후</td><td>면역반응으로 바이러스 제거, 항체 양성 정상 송아지. 유산·사산·허약 송아지 보고도 있다</td></tr></table><span class="hang">지침서는 수정 후 1주 안에 감염되면 태아가 사망·흡수되어 저수태우가 되고, 42~125일 감염 시 절반 정도가 유산·미라가 된다고 쓴다.</span><span class="hang">PI 수소의 정액에는 바이러스가 있으나 정액 성상은 정상일 수 있다. 급성 감염 수소도 일시적으로 정액에 바이러스를 배출하며 정액 성상이 크게 나빠진다. 주 증식 부위는 정낭과 전립선이다.</span></span></p><p class="bx-num"><span class="bxn">16.</span><span>지속감염(PI)우<span class="hang">PI우는 자기 바이러스주에 면역관용이어서 그 주의 중화항체를 만들지 못하지만 다른 항원에는 정상 반응한다. 백신을 맞으면 백신주 항체는 생기나 지속 바이러스는 남는다.</span><span class="hang">정상으로 보이거나, 작고 발육이 나쁘거나, 곱슬털을 보인다. 대개 6~24개월령(드물게 3세까지)에 점막병으로 죽지만 일부는 5년까지 건강하게 산다.</span><span class="hang">PI 암소는 임신할 수 있으나 PI 송아지를 낳는다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>점막병의 발생기전<span class="hang">점막병은 PI우에서만 생긴다. 지속 NCP주와 항원적으로 같은 CP주가 중복감염(주로 체내 돌연변이)되면 2~3주 안에 전형적 점막병이 온다. 이 CP주가 같은 무리의 다른 PI우에게 빠르게 퍼지면 집단 발생이 된다.</span><span class="hang">생독백신 CP주와 재조합해 접종 약 3개월 뒤 생기는 백신후 점막병이 있으나 드물고, PI우에서만 생긴다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>임상형 — 불현성, 급성·만성 점막병<span class="hang">불현성(BVD): 가장 흔한 형태다. 면역능 있는 혈청음성 소가 출생 후 감염되면 미열, 백혈구감소, 식욕저하, 경미한 설사를 보이다 며칠 안에 회복하고 중화항체가 생긴다.</span><span class="hang">급성 점막병: 6~24개월령 PI우에 갑자기 생긴다. 고립 농가에서 이환율 44%, 치명률 100% 보고가 있다. 침울, 식욕부진, 유연, 40~41℃ 발열, 빈맥, 다호흡, 반추 정지가 있고 발병 2~4일 뒤 악취 나는 수양성 설사(점액·혈액·섬유소 원주 가능)와 이급후중이 온다.</span><span class="hang">구강 미란은 입술 안쪽, 잇몸·치판, 경구개 뒤쪽, 구각, 혀에 생기고 합쳐져 '삶은 듯한' 모양이 된다. 비경에도 생긴다. 20%까지는 구강 병변이 없거나 찾기 어렵다. 점액화농성 콧물, 눈물, 각막부종, 제엽염·관상대염·지간 미란에 의한 네 다리 파행도 있다.</span><span class="hang">발병 5~7일 뒤 탈수·쇠약으로 죽는다. 며칠 안에 죽는 심급성 증례는 장마비로 설사 없이 장이 액체로 차 있기도 하다.</span><span class="hang">만성 점막병: 며칠 안에 죽지 않은 증례가 간헐적 설사, 식욕저하, 진행성 쇠약, 거친 피모, 만성 고창, 발굽 변형, 구강·피부 만성 미란을 보인다. 회음부, 음낭, 포피, 음문, 사지 사이, 부제·지간·뒤꿈치의 딱지 덮인 미란이 낫지 않는 것이 중요한 소견이다. 18개월까지 살다가 쇠약으로 죽는다.</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>임상형 — 심급성 BVD, 혈소판감소 출혈형, 번식장애<span class="hang">심급성 BVD: 면역능 있는 성우를 포함한 모든 연령에서 강독 BVDV-2가 일으킨다. 호흡기 증상이 주소이고 심한 침울, 호흡곤란, 수양성 설사, 혈변, 결막염, 42℃까지 발열, 착유우 무유가 있다. 구강 미란은 일정하지 않다. 이환율 40%, 조폐사율 25%까지 이르고 몇 달 뒤 PI 송아지가 태어난다. 위험인자는 입식우 차단방역 부실과 백신 미접종·부적절 접종이다.</span><span class="hang">혈소판감소·출혈형: NCP BVDV-2와 관련된다. 혈소판 25,000/µL 미만, 혈변, 점막 점상·반상출혈, 전방출혈, 비출혈, 주사부위·곤충 물린 자리의 지혈 지연, 발열, 설사, 반추위 정지, 탈수가 있고 치명률은 약 25%다.</span><span class="hang">번식장애: 감수성 번식우군에 교배 전후~임신 초중기에 들어오면 수태 실패, 배아사, 미라변성, 유산, 조산, 사산, 기형, 허약 송아지, PI 송아지가 생기고 손실이 2~4년 이어진다. 육우에서는 분만기 직전 여러 마리가 짧은 기간에 유산하고, 분만기 초에 조산·사산, 처음 2~4주에 허약 송아지가 태어나 초유를 먹여도 수 시간 안에 죽는다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>선천기형<span class="hang">소뇌형성부전, 소뇌증, 수두증, 수무뇌증, 공뇌증, 수초형성저하, 백내장, 소안구증, 망막변성, 시신경염, 흉선형성부전, 털과소·탈모, 골형성 이상, 하악단소, 성장지연이 있다.</span><span class="hang">소뇌형성부전 송아지는 운동실조, 넓은 기저 자세, 비틀거림, 걸으려 할 때 뒤로 넘어짐을 보인다. 경증은 손으로 먹이면 살 수 있다. 눈 결함으로 여러 정도의 실명이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>진단 — 검사법<span class="hang">급성 점막병은 정상의 50% 이하(1,000~3,000/µL)로 떨어지는 심한 백혈구·림프구 감소가 특징이고 수주 지속될 수 있다. 결과 해석에는 백신 이력이 필요하다.</span><table class="bxt"><tr><th>검사</th><th>특징</th></tr><tr><td>바이러스 분리</td><td>금본위. 생체에서는 전혈 버피코트가 최적. 혈청 IPMA는 5~7일 소요, 3개월령 미만은 모체항체 간섭으로 부적합</td></tr><tr><td>귀조직(피부) 면역조직화학</td><td>PI우는 표피 전층에 항원이 있다. 연령·모체항체와 무관하고 1회 양성으로 PI 확정. 애매하면 수주 뒤 재검</td></tr><tr><td>항원포착 ELISA(ACE)</td><td>혈청 검사는 3개월령 미만 비권장. 귀조직 시료는 모체항체 영향 없음. 1회 양성을 PI로 간주하나 급성감염에서 드물게 양성</td></tr><tr><td>RT-PCR</td><td>고감도라 수십 두 풀링 가능. 일시감염우와 생독백신 접종우도 양성이어서 2~3주 뒤 추적검사 필요. 집유 체세포로 착유 PI우 검출</td></tr><tr><td>혈청중화시험</td><td>30일 간격 짝혈청의 4배 상승으로 급성감염 확인. 3~5일 소요, 실험실 간 차이 큼</td></tr><tr><td>항체 ELISA(차단)</td><td>혈청·혈장·집유 사용. 백신 사용이 적은 근절 지역에서 유용</td></tr></table><span class="hang">급성감염의 바이러스 분리는 감염 3일 후부터 8~10일까지 전혈로 한다. 혈청 항체는 감염 2~3주 뒤 나타나 8~10주 뒤 최고가 된다.</span><span class="hang">유산의 경우 어미가 이미 항체를 가져 짝혈청 상승이 없을 수 있다. 어미가 음성이면 BVD 유산은 배제된다. 기형 송아지는 초유 섭취 전 채혈로 항체를 본다.</span><span class="hang">PI우는 모체항체가 사라지면 대개 혈청음성이지만 이종주 감염이나 백신으로 양성일 수 있다. PI 태아를 임신한 어미는 항체가가 매우 높으며 임신 7개월 이후 검사가 가장 믿을 만하다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>PI우 검출 절차<span class="hang">(1) 송아지 포함 전 두수 전혈로 바이러스 분리, ACE, RT-PCR을 한다. PCR 양성은 일시감염일 수 있어 추적검사로 PI 여부를 정한다.</span><span class="hang">(2) 3개월령 이상은 혈청으로 검사하고, 어린 송아지는 자란 뒤 검사하거나 다른 검사를 쓴다. RT-PCR 양성은 3주 뒤 재검한다.</span><span class="hang">(3) 송아지 포함 전 두수의 귀조직(피부 생검)을 포르말린 고정 IHC나 신선 조직 ACE로 검사한다. 1회 양성으로 PI가 확정된다. 어느 연령에나 정확하고 시료 1개로 충분해 전 두수 검사에 가장 많이 쓴다.</span><span class="hang">(4) 착유우는 합동 유즙 체세포를 RT-PCR이나 바이러스 분리로 선별하고 나머지는 (1)이나 (3)으로 검사한다. 양성은 3주 뒤 재검한다.</span><span class="hang">분만 기록이 정확하면 송아지가 PI 음성일 때 어미도 PI가 아님이 확정되어 한 번 검사로 두 마리 상태를 정한다. 젖소는 수송아지도 검사한다.</span><span class="hang">점막병이 확인된 농가는 3개월령 이상은 혈청, 3개월령 미만은 전혈로 전 두수를 검사하고, 이후 9개월간 태어나는 송아지도 검사한다. 이 9~12개월 동안 육성우와 번식우가 감염우와 접촉하지 않게 한다.</span><span class="hang">백신 미접종 6~12개월령 육성우 5두의 혈청검사(BVDV-1·2 모두)로 PI 보유 농가를 찾는 방법은 민감도 66%, 특이도 100%였다.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>감별진단과 치료<span class="hang">구강 미란과 설사: 악성카타르열, 우역. 설사 없는 구강 병변: 구제역, 수포성구내염, 블루텅, 소 구진성구내염, 괴사성구내염. 구강 병변 없는 설사: 살모넬라증, 겨울설사, 존씨병, 구리결핍, 오스터타기아증, 콕시듐증, 비소중독, 탄수화물 과식.</span><span class="hang">심급성 BVD는 악성카타르열, 급성 살모넬라증, 블루텅과, 혈소판감소 출혈형은 악성카타르열, 곰팡이 핀 스위트클로버 중독, 블루텅과 감별한다. 발육불량 PI 송아지는 영양불량, 구리결핍, 만성 폐렴과 감별한다.</span><span class="hang">특이 치료는 없다. 심한 수양성 설사와 뚜렷한 구강 병변이 있는 점막병은 예후가 나빠 도태나 안락사를 고려하고, 만성 점막병은 도태한다.</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>방제 — 원칙과 차단방역<span class="hang">최종 목표는 PI 송아지 출생을 막는 것으로, 차단방역, 백신, 차단사육(biocontainment)을 함께 쓴다. 가장 보호해야 할 집단은 임신우, 특히 임신 초기 소다.</span><span class="hang">입식우는 도착 후 2~3주 격리하고 그동안이나 도착 전에 PI 검사를 한다. 임신 입식우는 기존 임신우 앞에서 분만시키지 않고, 그 송아지는 결과가 나올 때까지 격리한다. 임신 입식 육성우의 태아가 이미 PI일 수 있으며 이를 가려낼 간단한 검사는 없다.</span><span class="hang">육우 번식우군은 번식기 최소 2주 전에 송아지, 대체 육성우, 수소, 송아지 없는 미임신우를 모두 검사해 PI우를 없앤다. 검사 시점 임신우는 송아지가 음성으로 확인될 때까지 번식우군에서 격리한다. 양성은 30일 뒤 재검해 음성이면 일시감염으로 본다. PI 송아지를 낳은 어미가 음성이면 어미는 PI가 아니므로 송아지를 이유·도태한 뒤 번식우군에 돌려보낸다. PI우는 도축용으로만 판다.</span><span class="hang">PI우를 없애면 자연 청정화가 일어난다. 일시감염은 전파 효율이 낮고, 농가 안 유지는 주로 PI우와 임신 초기 혈청음성우의 접촉 때문이다. 작은 농가가 큰 농가보다 자연 청정화가 잘 된다.</span><span class="hang">인공수정소는 혈액 바이러스 분리로 PI 수소를 가린다(혈청검사로는 안 된다). 동결정액은 RT-nPCR로 확인할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>백신<span class="hang">백신은 감염을 완전히 막거나 PI우를 없애지 못하므로 단독 방제수단으로는 부적합하다. 목표는 임상병 예방과 태아감염(PI) 예방이다. 실험에서 항체가 1:16은 중증 임상병을, 1:256은 전신 바이러스 배출을 막았다.</span><table class="bxt"><tr><th>구분</th><th>생독(MLV)</th><th>불활화</th></tr><tr><td>장점</td><td>저렴, 1회로 면역, 3주 안에 넓은 범위 중화항체, 1년 넘게 지속</td><td>감염성 없음, 백신후 질병 없음, 임신우에 안전</td></tr><tr><td>단점</td><td>보관·취급 불량 시 실패, 병원성 회복 우려, PI우의 백신후 점막병, 태아병원성으로 임신우 금기</td><td>고가, 기초접종 2회 필요, 항체가 낮고 짧음(2차 접종 약 5주 뒤 최고, 12주 안에 음전)</td></tr></table><span class="hang">혈청음성 임신우에 임신 51~190일 MLV를 접종하면 백신주가 태반을 넘는다. 120일 이전 접종은 유산, 신경·근골격 기형, 주산기 폐사, 성장지연, 지속감염을 일으킬 수 있다. 지침서도 임신우에는 사독백신을 쓰라고 한다.</span><span class="hang">MLV 면역은 1:32까지의 모체항체에 방해받지 않으며, 모체항체 반감기 21일과 초유 섭취 뒤 중화항체가 1:2,000을 가정하면 4~6개월령 접종이 대부분 성공한다. 첫 교배 전 재접종을 권한다. 면역 어미의 송아지는 초유 면역이 6개월령까지 간다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>백신 일정<span class="hang">태아감염 예방: 모든 송아지를 4~6개월령에 MLV로 접종하고, 대체 육성우와 경산우는 교배 3~6주 전에 MLV를 접종하며 번식우는 매년 교배 3~6주 전 재접종한다. 수소도 매년 재접종한다. 어떤 백신이든 교배 최소 3주 전에 접종해 수태 전에 항체 양성이 되게 한다.</span><span class="hang">육우 번식농가: 대체 육성우와 경산우를 매년 교배 최소 3주 전에 MLV로 접종하고, 송아지는 이유 최소 3주 전에 접종한다.</span><span class="hang">비육우: PI우의 점막병은 백신으로 줄일 수 없다. 심급성 BVD, 혈소판감소형, 면역억제 위험이 있으면 입식 때 MLV를 접종한다.</span><span class="hang">젖소: 송아지는 약 4개월령과 5~6개월령에 1형·2형 포함 MLV, 육성우는 첫 교배 약 45일 전 MLV, 분만우는 교배 약 30일 전 MLV를 접종한다. BVD 유산이 진행 중인 농가는 임신 진단 시점이나 예상 유산 1개월 전부터 불활화 백신을 2~3주 간격 2회 접종한다. 교배 전에 같은 MLV 성분을 맞은 소는 임신 전 기간에 다가 MLV를 맞아도 안전하다.</span><span class="hang">강독주 발생 농가는 전 두수를 접종하되 임신우는 불활화 백신을 쓴다. 지침서는 호흡기질병 혼합예방백신의 정기 접종을 권한다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>근절<span class="hang">백신 없이 검사·도태로 근절하는 방식이 스칸디나비아 등 유럽에서 성공했다. 기본 개념은 (1) PI우가 생겨야 농가가 감염된 것이고, (2) 재유입이 없으면 자연 청정화로 유병률이 떨어지며, (3) PI우와 임신 초기 감수성우가 접촉하지 않으면 바이러스가 유지되지 못한다는 것이다.</span><span class="hang">구성요소는 사육 현황 파악, 유병률 감시, 신뢰할 진단검사, 교육, 차단방역(입식우 격리·검사, 공동 방목지 규칙, 정액·수정란·초유·백신 같은 생물학적 제제 관리)이다.</span><span class="hang">바이러스를 없앤 뒤에는 소가 점점 감수성이 되어 재유입 시 심한 발생이 날 수 있으므로, 재노출 가능성이 높은 지역은 근절 후에도 백신을 계속하는 것이 신중하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>악성카타르열(MCF) — 원인과 역학<span class="hang">감마헤르페스바이러스아과 마카바이러스속의 두 바이러스가 임상·병리로 구별되지 않는 병을 일으킨다. 누 관련 AlHV-1(아프리카)과 양 관련 OvHV-2다. 북미 소 증례는 거의 모두 OvHV-2다.</span><span class="hang">양·염소·누는 증상 없는 보유숙주이고, 소·들소·사슴은 감수성 숙주이자 바이러스를 배출하지 않는 막다른 숙주여서 소끼리는 전파되지 않는다.</span><span class="hang">자연 사육 양은 사실상 모두 OvHV-2에 감염되어 있다. 새끼양은 대부분 2~3개월령 이후 감염되고 6~9개월령에 콧물로 가장 많이 배출한다. 전파는 호흡기 분비물 흡입·섭취, 코 맞대기, 매개물로 추정되며 같은 건물에 두기만 해도 감염될 수 있다.</span><span class="hang">분만하는 양과 접촉한 뒤 1~2개월에 증례가 시작되는 일이 많다. 대개 산발적으로 한두 마리지만 드물게 농가의 50%까지 걸린다. 거의 항상 치명적이라는 기술(Constable)과 50%까지 급성기를 넘겨 회복하거나 만성화한다는 기술(Rebhun)이 있다.</span><span class="hang">늦겨울·봄·여름에 많다. 회복우의 지속 바이러스혈증과 스트레스에 의한 잠복감염 재활성화가 양 접촉 없는 증례의 원인으로 거론된다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>임상증상<span class="hang">잠복기는 자연감염 3~8주, 실험감염 평균 22일(14~37일)이다. 심급성형, 소화기형, 두부·안형(가장 흔함), 경증형이 있으며 서로 연속적이다.</span><span class="hang">두부·안형: 갑작스러운 극심한 침울, 식욕부진, 무유, 41~41.5℃ 고열, 맥박 100~120회, 다량의 점액화농성 콧물, 비강 폐쇄에 의한 협착음성 호흡곤란, 눈물과 각막부종, 안검경련, 포도막염, 공막혈관 충혈이 나타난다.</span><span class="hang">각막혼탁은 항상 어느 정도 있으며 각막윤부의 회색 고리로 시작해 중심으로 퍼진다. 각막부종이 진행하고 전방포도막염이 낫지 않으면 생존 가능성이 낮다.</span><span class="hang">비강·구강 점막 괴사, 경구개·잇몸·혀의 미란, 끝이 출혈·미란된 볼유두, 끈적한 거품 침, 딱지로 덮인 비경, 발굽-피부 경계·유두·음문·음낭 피부의 박리가 생긴다. 체표 림프절 종대가 초기부터 일관되게 나타난다.</span><span class="hang">운동실조, 근육떨림, 안진, 머리 밀기, 마비, 경련 같은 신경증상, 변비에서 혈변까지 다양한 분변, 배뇨 끝이 가장 붉은 혈뇨가 있을 수 있다. 수주 끄는 증례에서도 39.5℃ 넘는 발열이 이어지는 것이 특징이다. 대개 3~7일(드물게 14일) 경과하며, 회복한 듯하다 7~10일 뒤 급성 뇌염으로 죽기도 한다.</span><span class="hang">심급성형은 1~3일 경과로 고열, 호흡곤란, 급성 위장염만 보인다. 소화기형은 심한 설사와 경미한 결막염을 보인다. 경증형은 일과성 발열과 경미한 미란 뒤 회복, 재발, 또는 양측 각막백반을 남기는 만성형이 된다. 고열을 동반한 출혈성 방광염만 보이다 1~4일에 죽는 급성형도 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>진단과 감별<span class="hang">백혈구 감소(3,000~6,000/µL) 기록이 있으나 중등도 백혈구 증가가 더 흔하다는 기술도 있다.</span><span class="hang">EDTA 전혈 백혈구의 PCR로 바이러스 DNA를 검출하는 것이 표준 진단이다. 경쟁억제 ELISA(CI-ELISA)는 항체를 보지만 임상 초기에 음성일 수 있고 AlHV-1과 OvHV-2를 구별하지 못한다. 증상 없는 소도 PCR 양성일 수 있어 다른 병을 MCF로 오진할 수 있다.</span><span class="hang">부검에서 구강·비강·식도·제4위 미란, 파이어판 종대·궤양, 전신 림프절 종대·부종·출혈, 방광 출혈이 보이고, 조직학적 괴사성 혈관염이 특징 병변이다.</span><span class="hang">감별: 점막병, IBR, 블루텅, 산발성 소 뇌척수염, 우역.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>치료와 예방<span class="hang">치료로 경과를 바꾸기 어렵고 NSAID로 불편을 덜어준다.</span><span class="hang">소와 양을 떼어 기르고, 발생 지역의 양을 소 농가에 들이지 않는다. OvHV-2는 공기로 70 m 넘게 옮겨질 수 있다고 추정되며, 소·들소 농가는 양과 1마일 떨어지도록 권하는 기술이 있다(Rebhun).</span><span class="hang">효과적인 백신은 없다. 보균 소는 혈청 CI-ELISA와 전혈 PCR을 함께 써서 찾는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">32.</span><span>구제역(FMD) — 원인과 역학<span class="hang">피코르나바이러스과 아프토바이러스로 O, A, C, SAT1, SAT2, SAT3, Asia1의 7개 혈청형이 있고 혈청형 사이에 교차면역이 없다. 우제류의 전염성이 매우 강한 병으로 폐사율은 대개 낮지만 경제적 피해가 크다.</span><span class="hang">수포액에 바이러스가 가장 많아 수포가 터질 때 전염력이 최고다. 발병 전과 회복 직후에도 우유·정액 등으로 배출된다. 수포 파열 뒤 4일 넘게 전염성을 갖는 일은 드물다.</span><span class="hang">소·양·염소의 50%까지 보균동물이 될 수 있고(돼지는 아님), 특히 백신 접종 후 노출된 소에서 생긴다. 비인두가 지속 부위로 2년까지 저농도 배출이 있을 수 있고 유선에 3~7주 남기도 한다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>임상증상<span class="hang">잠복기는 보통 3~6일(1~7일)이다. 유량 급감과 40~41℃ 고열, 침울, 식욕부진으로 시작하고 이어 통증성 구내염이 온다. 이때 체온은 내려가기 시작한다.</span><span class="hang">줄처럼 늘어지는 다량의 침, 입맛 다시는 소리, 조심스러운 저작이 특징이다. 협점막·치판·혀에 1~2 cm 수포가 생겨 24시간 안에 터지고 약 1주에 낫는다. 동시에 지간과 관상대에 수포가 생겨 심한 파행과 기립불능, 관상대 종창이 온다. 2차 세균감염이 발굽 심부로 번질 수 있다.</span><span class="hang">유두 수포가 유두구에 생기면 심한 유방염으로 이어진다. 2010~2011년 한국 유행에서는 유두 수포가 낙농가가 처음 본 주증상이었다. 임신우는 유산하거나 사산한다.</span><span class="hang">병변 정도에 비해 체중 감소와 유량 저하가 훨씬 심하다. 2~3일 뒤 다시 먹지만 회복에 6개월까지 걸린다. 어린 동물은 수포 없이도 심근 손상으로 많이 죽는다. 성우에도 5~6일째 급성 심근부전으로 갑자기 악화해 경련하며 죽는 악성형이 있다.</span><span class="hang">후유증으로 호흡곤란, 빈혈, 과다한 털, 더위 불내성을 보이는 'hairy panter' 증후군이 있다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>진단과 감별<span class="hang">신선한 수포액과 주변 상피를 글리세롤-인산완충액(pH 7.2~7.6) 운반배지에 담아 보내는 것이 최선이다. 수포가 아물고 있으면 혈액과, 프로방컵으로 받은 식도-인두(OP) 액을 최대 5두에서 채취한다.</span><span class="hang">세포배양 바이러스 분리, 항원 ELISA, RT-PCR, 혈청검사로 진단하고 혈청형은 표준실험실에서 확정한다.</span><span class="hang">감별: 수포성구내염, 수포진, 돼지수포병, 우역, BVD.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>치료와 방제<span class="hang">특이 치료는 없다. 살처분 정책이 없는 상재국에서는 순한 소독제와 보호 드레싱을 쓰며 플루닉신 메글루민에 증상 반응이 좋다고 한다.</span><span class="hang">박멸: 진단 즉시 노출군 우제류를 살처분해 현장에서 소각·매몰하고, 고기 회수를 금하며 우유는 오염된 것으로 본다. 축사는 1~2% 수산화나트륨, 포르말린, 4% 탄산나트륨으로 소독한다(산과 알칼리가 가장 효과적이고 세제가 활성을 높인다). 6개월 비운 뒤 감시동물을 넣어 이상이 없으면 재입식한다. 발생지 반경 16~24 km 농장을 즉시 이동 제한한다.</span><span class="hang">상재 지역은 불활화 백신으로 집단 접종한다. 1회 접종 면역은 6~8개월만 믿을 수 있고, 오일 보조제 백신은 성우 연 1회, 어린 소 연 2회 접종한다. 면역은 접종 7~20일 뒤 생긴다. 남미에서는 미접종 어미의 송아지는 4개월령과 8개월령에, 접종 어미의 송아지는 6개월령과 10개월령에 접종하도록 권한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">36.</span><span>소 유행열(BEF) — 원인과 역학<span class="hang">랍도바이러스과 에페메로바이러스로 혈액의 백혈구-혈소판 분획과 밀접하다. 모기(Culex 등)와 등에모기(Culicoides)가 매개하고 접촉, 침, 눈물, 정액으로는 전파되지 않는다. 보균 상태가 없다.</span><span class="hang">여름에 매개충이 바람을 타고 퍼지며 유행한다. 일본 발생은 한국에서 시작된 것으로 추정된다. 국내는 1921년 이후 약 7년 주기로 대유행했고 1988, 1991년 대유행 뒤에도 해마다 발생한다는 기술이 있다(지침서). 한번 걸리면 오래 면역(실험상 동종주 2년까지 견고)이 생겨 세대가 바뀌는 3~7년 주기로 발생한다.</span><span class="hang">유행 시 이환율 25~45%(감수성 높으면 100%), 상재지 5~10%이고, 치명률과 도태율은 약독주 1%, 강독주는 10%까지다. 3~6개월령 미만 송아지는 발병하지 않는다. 비만우, 고능력우, 수소가 가장 심하고 2세 미만은 경미하다. 지침서는 7월 중순~11월에 6개월령 이상 소에 피해를 준다고 쓴다.</span><span class="hang">착유우 유량이 30~70%(말기 비유우 80%까지) 떨어지고 회복 뒤에도 이전 수준으로 돌아오지 않는다. 발정 지연, 유산, 수소의 일시적 불임이 있다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>임상증상<span class="hang">잠복기 2~4일(최장 10일) 뒤 갑자기 40.5~41℃ 발열이 오며 이상성이거나 아침에 떨어진다(지침서 41~42℃). 식욕부진, 유량 급감, 변비 또는 설사, 호흡·심박 증가, 끈적한 콧물과 눈물, 머리 흔들기, 근육떨림, 무력이 나타나고 어깨·목·등이 붓기도 한다.</span><span class="hang">둘째 날 근육 증상이 뚜렷해져 심한 경직, 간대성 근육운동, 한두 다리 무력, 네 다리를 몸 아래 모은 제엽염 같은 자세를 보인다. 셋째 날쯤 먹고 반추하며 열이 내리지만 파행과 무력은 2~3일 더 간다('3일열').</span><span class="hang">상당수가 주저앉아 유열처럼 뒷다리를 뻗고 머리를 옆구리로 돌린 자세를 취한다. 폐기종과 피하기종이 생길 수 있다. 지침서는 호흡수 50~70회(때로 100회), 폐포 파열로 어깨·가슴 피하 공기주머니와 피 섞인 거품, 목 통증으로 거품 침을 흘림, 딱딱한 바닥에 오래 누워 생기는 욕창을 든다.</span><span class="hang">회복 2~3주 뒤 재발하는 증례가 있고, 지속성 기립불능으로 도태되기도 하며, 소수가 유산한다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>진단<span class="hang">발열기 혈액은 잘 응고되지 않는다. 호중구 증가와 좌방이동, 림프구 감소, 약 7일간 섬유소원 증가, CK 현저한 증가가 있고 자연 증례에서는 뚜렷한 저칼슘혈증이 있다.</span><span class="hang">차단 ELISA가 간편하고 선호되는 혈청검사다. 부검 소견은 관절·심낭·흉막·복막의 장액섬유소성 다발성 장막염, 림프절 종대·부종, 폐기종이다.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>치료<span class="hang">플루닉신 메글루민 2.2 mg/kg/일 IV·IM이나 케토프로펜 3 mg/kg/일 IM을 3일 쓰면 경직·파행·식욕부진이 호전되나 호흡기 증상에는 효과가 적다. 저칼슘혈증 증상이 있으면 보로글루콘산칼슘을 비경구로 주며, 누운 소를 일으키는 데 흔히 도움이 된다.</span><span class="hang">지침서: 발견 즉시 시원한 곳으로 옮긴다(오한 때문에 햇볕을 찾아가 악화된다). 바닥이 딱딱하지 않은 곳에 깔짚을 30 cm 이상 깔고, 누워 있으면 2~3시간마다 눕는 방향을 바꿔 욕창을 막는다. 치료 핵심은 체온을 빨리 내리는 것으로 해열진통제와 고농도 영양제를 주고, 증상에 따라 강심제, 항히스타민제, 소화제, 2차 감염 예방 광범위 항생제를 준다. 직장에 고무호스를 30 cm쯤 넣고 5~10분간 찬물 관장을 하면 체온이 떨어진다. 조기 치료 시 폐사율은 1% 이내다.</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>예방<span class="hang">백신이 유일하게 효과적인 방제법이다. 약독 백신은 2회 접종으로 최대 12개월 예방되며 일본에서 대유행을 막은 것으로 평가된다. 불활화 백신은 장기 면역에 3회 이상 접종이 필요하다. 지침서는 예방접종과 모기 구제를 든다(예방접종 프로그램 참조).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">41.</span><span>블루텅(BT) — 원인과 소의 증상<span class="hang">레오바이러스과 오르비바이러스로 26개 혈청형이 있다. 접촉으로 전파되지 않고 특정 Culicoides 등에모기가 생물학적으로 매개한다. 소는 고역가 바이러스혈증을 보이는 보유·증폭숙주이고 증상은 주로 양에서 나타난다.</span><span class="hang">소 감염은 대부분 불현성이지만 혈청형 8 같은 일부 주는 소에서도 심하다. 잠복기 6~8일, 40~41℃ 발열(일정하지 않음), 기면, 식욕부진, 유량 감소가 있다. 비경·구강·혀의 궤양·괴사·가피, 점액화농성 또는 혈성 콧물과 구취, 유연, 유방·관상대·눈 주위 피부 병변, 원위 사지 부종에 의한 보행 기피, 2~3주 뒤 무색소 피부의 광과민피부염이 생긴다. 목·기갑 피부가 두꺼워지고 아프기도 하다.</span><span class="hang">임신 초기 감염은 유산, 사산, 수무뇌증, 소두증, 관절굽음증, 실명, 턱 변형을 일으킬 수 있다. 바이러스혈증 중 수소는 정액에 바이러스를 배출하고 일시적 불임이 될 수 있다.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>블루텅 — 진단·치료·방제<span class="hang">소에서 바이러스 분리는 접종 후 49일까지 가능했으나 등에모기를 감염시킬 수 있는 바이러스혈증은 최대 3주, RT-PCR 양성은 약 4개월 지속되었다. 혈액은 얼리지 않는다. 혈청검사는 경쟁 ELISA가 권장된다. 자궁 내 감염은 초유 전 혈액으로 확인한다.</span><span class="hang">감별: 구제역, EHD, BVD/점막병, 악성카타르열, 급성 광과민피부염, 소 헤르페스 유두염, 수포성구내염, IBR.</span><span class="hang">특이 치료는 없고 대증 치료하며 햇빛이 피부 병변을 악화시키므로 그늘에 둔다. 해외 악성 전염병과 증상이 겹치므로 당국에 알린다. 백신은 발생 지역의 유일한 만족스러운 방제법으로, 면역은 접종 10일 뒤 생기고 예상 발생 1개월 전 연 1회 재접종을 권한다(양 기준 기술). 약독 생백신은 임신 동물에 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>유행성출혈병(EHD)·이바라키병<span class="hang">블루텅과 비슷한 오르비바이러스로 Culicoides가 매개한다. 흰꼬리사슴에서 가장 심하고 소는 대개 불현성이나 근래 소의 신흥 질병으로 여겨진다. 소 발생의 이환율은 대개 5% 이하(이스라엘 착유우군 5~80%), 폐사율은 1% 미만이다.</span><span class="hang">소의 증상은 식욕부진, 반추 감소, 무력, 유량 감소, 경직 보행, 짧은 발열이며, 구강 점막 발적·부종, 치판과 절치 뒤쪽의 괴사성 궤양, 비경 피부 균열·박리, 유두·유방 피부 충혈이 생길 수 있다. 며칠 가는 심한 연하곤란과 식도염도 보고된다.</span><span class="hang">이바라키병은 EHDV-2 계열 주가 1959년 일본에서 일으킨 소의 병으로, 일본·한국·대만에 1960년대와 30년 뒤 두 차례 큰 유행이 있었다(첫 유행 이환 39,000두, 폐사 4,000두). 발열, 점막 충혈·부종, 출혈, 궤양성 구내염, 후두·인두 마비, 유연, 연하곤란이 특징이며 흡인성 폐렴으로 많이 죽는다. 임신우 감염은 유산·사산을 일으키고 임신 70~120일 감염 태아는 수무뇌증이 될 수 있다.</span><span class="hang">특이 치료와 시판 백신은 없다(Constable). 일본에서는 이바라키-2주 유래 생독·불활화 백신이 개발되어 매개충이 적은 시기에 1회 접종해 효과를 보였다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">44.</span><span>아까바네병 — 원인과 역학<span class="hang">부니아바이러스과 오르토부니아바이러스속 심부 혈청군 바이러스다. 성우는 대개 불현성이고 병은 태아(송아지)에서 나타난다. 일본·한국에서 대만을 거쳐 호주에 이르는 띠와 중동에서 남아공에 이르는 띠에서 유행한다.</span><span class="hang">소의 바이러스혈증은 1~9일(어미 2~4일)로 짧고 장기 보균은 없다. 상재지에서는 번식우가 첫 임신 전에 감염되어 면역을 얻으므로 병이 나타나지 않고, 매개충이 상재지 밖으로 퍼질 때 면역 없는 임신 초기 소가 감염되어 간헐적 유행이 생긴다. 5~10년 간격으로 사라졌다 나타난다.</span><span class="hang">일본·한국의 매개충은 Culicoides brevitarsis, C. oxystoma, Aedes vexans, Culex tritaeniorhynchus다. 지침서는 모기가 활동하는 여름에는 피해가 없고 가을부터 이듬해 봄(10월~3월)에 유산과 기형 송아지가 나타난다고 쓴다.</span><span class="hang">일본과 한국에서는 2~7세 소의 과민, 떨림, 운동실조 같은 신경증상과 생후 감염 뇌척수염 보고도 있다. 유전군 Ia는 신경독성이 강하다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>아까바네병 — 임신우와 태아<span class="hang">어미는 증상이 없고 태아 감염 시기에 따라 결과가 달라진다. Constable은 임신 76~104일 감염 시 수무뇌증, 105~174일 감염 시 관절굽음증이 생긴다고 쓴다.</span><table class="bxt"><tr><th>감염 임신월령(지침서)</th><th>결과</th></tr><tr><td>1개월 미만</td><td>태아 사망·흡수, 수정 2~3개월 뒤 재발정</td></tr><tr><td>2~4개월</td><td>뇌수두증(뇌는 발달하지 않고 물이 찬) 송아지</td></tr><tr><td>4~6개월</td><td>척추·목·다리 관절이 뒤틀린 관절만곡증</td></tr><tr><td>6~7개월</td><td>발목관절 근육이 위축된 송아지</td></tr><tr><td>8개월 이후</td><td>거의 정상 송아지</td></tr></table><span class="hang">유행 초기에 유산·사산·조산이, 이어 관절굽음증이, 끝무렵에 수무뇌증이 나온다. 관절굽음증 송아지는 거의 모두 난산으로 조산이 필요하고 어미까지 위험해진다. 태수과다나 기형태아로 배가 불러오기도 한다.</span><span class="hang">관절굽음증 송아지는 작고 저체중이지만 이빨·털·발굽은 성숙했고, 일어서지 못하며 사지 관절이 굴곡(때로 신전) 고정되고 근육이 위축되어 있다. 힘줄을 자르면 관절이 움직인다. 수무뇌증 송아지는 걸을 수 있으나 지능이 없고 눈이 멀며 어미를 찾지 않는다. 지침서는 머리가 2~3배 큰 송아지는 살아 나와도 2~3일 안에 죽는다고 쓴다.</span><span class="hang">재발은 매우 드물고, 난산으로 생식기 이상이 생기지 않는 한 다음 수태에 영향이 없다(지침서). 기형 송아지 상세는 주산기 탭에서 다룬다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>아까바네병 — 진단·치료·예방<span class="hang">태아 혈청이나 초유 섭취 전 신생자 혈청의 특이 항체가 진단적이다. 면역능이 생기기 전 감염이면 음성일 수 있으므로 여러 두를 검사한다. 어미의 짝혈청 상승은 최근 감염을 시사할 뿐이다. 감별: 루핀 유발 관절굽음증, 망간결핍, 유전성 관절굽음증, 블루텅·BVD 태아감염.</span><span class="hang">기형 송아지는 생존이 어려워 치료하지 않는다. 지침서는 발목만 굽은 경우 발끝이 땅에 닿을 정도로 펴지면 부목을 1개월 대고, 펴지지 않으면 발목 인대를 절단한 뒤 부목을 1개월 대면 펴진다고 쓴다.</span><span class="hang">매개충 방제는 현실적으로 어렵다(소겨모기는 매우 작아 방충망을 통과한다). 살충등 설치와 정기 살충제 살포가 어느 정도 도움이 된다. 백신이 가장 효과적이다. 불활화 백신은 임신 전 2회와 매년 추가 접종이 필요하고, 모체이행항체는 초유를 먹은 송아지에서 4~5개월 간다. 지침서는 가임 암소에 매년 4~6월, 모기 발생 1개월 전까지 접종을 마치라고 한다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>츄잔병·아이노 바이러스<span class="hang">츄잔 바이러스는 오르비바이러스(Palyam 아군)로 Culicoides oxystoma(지침서: 쌀겨모기)가 매개한다. 일본 규슈(1985~1986)에서 처음 보고되었고 국내는 1993년 제주에서 확인되었으며 아까바네와 같이 제2종 가축전염병으로 관리된다. 10월~이듬해 3월에 주로 발생하고 초임우와 육우에 많다.</span><span class="hang">어미는 증상이 없다. 임신 중 감염되면 백혈구감소와 바이러스혈증이 2개월쯤 지속되며 태반을 거쳐 태아가 감염된다. 임신 초기(2~4개월) 감염 시 허약 송아지가 태어난다. 유산·조산·사산이 거의 없고 관절·척추 굽음이 없다는 점이 아까바네와 다르다.</span><span class="hang">송아지는 스스로 빨지 못하고 기립곤란을 보이며, 간질양 발작, 사지 굴절·회전, 머리를 든 선회운동 같은 신경증상, O자형으로 휜 다리, 입을 벌리고 침 흘림, 안구 백탁·실명을 보인다. 신경증상 송아지는 대뇌가 결손되어 있다.</span><span class="hang">치료법은 없고 임신우의 모기 노출을 피하는 것이 가장 중요하다. 국내 사독백신이 개발되었으나 판매되지 않았다는 기술(지침서)과 일본에 아까바네·아이노·츄잔 혼합 백신이 있다는 기술(Constable)이 있다.</span><span class="hang">아이노 바이러스는 아까바네와 같은 심부 혈청군으로 호주·일본·이스라엘에 있으며, 분포는 아까바네와 비슷하나 유병률이 낮고 임상병은 훨씬 드물다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>탄저 — 원인과 역학<span class="hang">탄저균(Bacillus anthracis)은 그람양성, 호기성, 비운동성, 협막을 가진 아포형성 간균이다. 영양형은 약하지만 아포는 수십 년 살고 건조·염장 가죽에서도 버틴다. 공기에 노출되어야 아포를 만들며 생체 안에서는 만들지 않는다. 아포 형성은 12~42℃에서 일어나고 9~12℃ 미만에서는 일어나지 않는다.</span><span class="hang">지침서: 아포 전 균은 -15℃ 냉동육에서 2주, 염장육에서 45일, 아포는 사체에서 12년, 토양에서 30년 생존한다. 121℃ 15분, 또는 10% 포르말린, 0.2% 승홍수, 5% 석탄산, 5% 가성소다로 10분 이상 소독하면 죽는다. 제2종 가축전염병이자 인수공통병이다.</span><span class="hang">한국은 아시아 상재지역에 들어 있다. 아포 오염 토양이나 그 위에서 자란 풀·사료를 먹어 감염되며, 비 온 뒤 15.5℃ 이상에서 발아·증식했다가 건조해지면 다시 아포가 된다. 방목기에 많다. 흡혈곤충과 가죽·골분 같은 동물 부산물도 감염원이다.</span><span class="hang">협막(식균작용 회피)과 치사인자·부종인자·방어항원으로 된 독소가 혈관투과성 증가, 혈전, 부종, 응고 장애를 일으켜 혈관성 쇼크로 죽게 한다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>임상증상<span class="hang">잠복기는 1~2주로 추정된다(지침서 2~10일, 경우에 따라 45일).</span><span class="hang">심급성형: 유행 초기에 흔하다. 경과가 1~2시간이어서 대개 죽은 채 발견된다. 발열, 근육떨림, 호흡곤란, 점막 울혈이 있다가 허탈과 말기 경련으로 죽고, 사후 코·입·항문·음문에서 출혈한다.</span><span class="hang">급성형: 약 48시간 경과한다. 심한 침울(때로 앞서 짧은 흥분), 42℃까지 고열, 빠르고 깊은 호흡, 울혈·출혈성 점막, 심박 증가, 절식, 반추위 정지가 있다. 임신우는 유산하고 착유우는 유량이 급감하며 우유에 피가 섞이거나 진한 노란색이 된다. 설사와 이질, 혀·인후·흉골·회음·옆구리의 국소 부종이 생길 수 있다.</span><span class="hang">급사 감별: 낙뢰, 심급성 기종저, 악성수종, 세균성 혈색소뇨증, 저마그네슘혈성 테타니, 후대정맥 혈전증, 출혈성 제4위 궤양, 공장출혈증후군, 비소중독, 심급성 살모넬라증.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>진단 — 사체를 열지 않는다<span class="hang">탄저가 의심되면 해부하지 않는다. 사체는 사후강직이 없고 빨리 가스로 부패해 '목마' 자세가 되며, 천연공에서 응고되지 않는 검붉은 타르 같은 피가 나온다. 해부했다면 혈액 응고 부전, 광범위 반상출혈, 체강의 혈성 장액, 심한 장염, 블랙베리 잼 같은 비장종대(지침서 2~5배)가 강한 근거다.</span><span class="hang">경정맥·유정맥·귀정맥에서 주사기로 채혈하거나 국소 부종액을 흡인한다. 부패가 진행했으면 절단한 꼬리나 귀의 신선한 단면에서 피를 받는다. 12시간 넘은 사체는 클로스트리듐이 섞여 판독이 어렵다.</span><span class="hang">표준 진단은 폴리크롬 메틸렌블루 염색 혈액도말에서 끝이 각진 간균(사슬)을 둘러싼 이염성 협막을 보는 것이다. 형광항체, 배양, 아스콜리 시험(부패 조직 항원), PCR, 15분 판독 면역크로마토 검사(민감도 93.1%, 특이도 약 100%, 최근 백신 접종우 위양성 없음)가 있다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>치료<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>페니실린 G 나트륨·칼륨</td><td>20,000 IU/kg IV, 12시간마다(최소한 부하용량은 IV)</td></tr><tr><td>프로카인 페니실린</td><td>22,000 IU/kg IM 12시간마다 또는 44,000 IU/kg IM 24시간마다</td></tr><tr><td>옥시테트라사이클린</td><td>10 mg/kg IV·IM, 24시간마다</td></tr><tr><td>탄저 고면역혈청</td><td>투여</td></tr></table><span class="hang">중증 동물은 회복이 어렵지만 다른 증상 전에 발열을 찾아 치료하면 회복을 기대할 수 있다. 재발을 막으려고 최소 5일 치료한다. 균을 없애도 남은 독혈증에는 효과적인 치료가 없다. 지침서는 페니실린, 스트렙토마이신과 항혈청을 든다.</span></span></p><p class="bx-num"><span class="bxn">52.</span><span>방제와 백신<span class="hang">발생 농장을 격리하고 분비물과 사체를 처리하며 생존 동물에 백신을 접종한다. 격리 기간에는 우유·고기 반출을 금한다. 사체는 열지 말고 오염 분뇨·깔짚·흙과 함께 현장에서 태우는 것이 가장 좋다. 생석회를 충분히 넣는 깊은 매몰(Rebhun: 6피트 이상)도 쓰나 지하수 오염 위험이 있다. 바로 처리하지 못하면 5% 포름알데히드를 뿌린다.</span><span class="hang">의심우와 동거우는 발생이 멈출 때까지 격리하고 그 뒤 2주간 이동을 제한한다. 동거우에는 장기지속성 테트라사이클린(20 mg/kg, 72시간마다)이나 프로카인 페니실린(44,000 IU/kg, 24시간마다) 예방 투여가 흔하다. 생균 백신이므로 접종 7~10일 안의 항생제는 백신 효과를 떨어뜨린다.</span><span class="hang">아포 형성 전에는 일반 소독제나 60℃ 몇 분으로 영양형이 죽지만, 아포가 생긴 뒤에는 5% 라이솔에 최소 2일 접촉해야 한다. 5~10% 포르말린·수산화나트륨이 가장 효과적이고, 3% 과초산을 흙에 8 L/m2 뿌리면 살균된다. 오염 의복은 10% 포름알데히드에 담근다.</span><span class="hang">스턴(Sterne) 백신(협막 없는 독소생성 약독주 아포)이 대부분 나라에서 쓰인다. 1회 접종 약 8일 뒤 발생이 멈추나 상황에 따라 2회가 필요하다. 접종 뒤 발열 반응과 유량 저하가 있다. Rebhun은 방목 전 연 1회를 권하고, 지침서는 기종저 혼합백신을 6개월령 이상 전 두수에 매년 2~4월 1회 접종하라고 한다.</span><span class="hang">사람은 환축·사체 접촉, 감염육 섭취, 흡혈곤충으로 감염되고 잠복기는 2~3일이다. 원인 모르게 죽은 소를 먹어서는 안 된다. 피부·폐·장탄저가 있고 폐탄저가 가장 위험하다(지침서).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">53.</span><span>결핵(소결핵) — 원인과 역학<span class="hang">Mycobacterium bovis(일부 M. caprae)가 원인인 만성 소모성 질병으로 제2종 가축전염병이다. 항산성 세포내 기생균이며 모든 연령·종이 감수성이나 주로 소와 돼지에 감염된다. 감염우가 주 감염원이고 일부 지역은 야생동물 보유숙주가 근절을 가로막는다.</span><span class="hang">성우는 흡입이 주 경로로 흉강 병변이 많고, 송아지는 감염 우유를 먹어 장간막 림프절 병변이 많다. 생식기 전파는 드물다. 객담, 기관 삼출물, 분변, 우유로 배출한다.</span><span class="hang">지침서: 균은 햇볕에서 수일, 토양·초지 1~2년, 퇴비·우사 2년, 물 1년, 분뇨 452~469일, 객담 2~6개월, 식육 10개월, 사체 4년 생존한다. 저온·고온살균으로 쉽게 죽고 5% 석탄산, 크레졸이 유효하다. 깔짚 같은 오염원 제거가 부실하면 같은 농장에 반복 발생한다.</span></span></p><p class="bx-num"><span class="bxn">54.</span><span>임상증상<span class="hang">임상 병변이 있는 감염우는 소수다. 다른 증상 없는 진행성 쇠약, 변덕스러운 식욕, 변동하는 체온이 의심 소견이며 온순하고 둔해지나 눈은 밝다. 분만 뒤 더 뚜렷해진다.</span><span class="hang">폐: 낮고 억눌린 습성 기침이 한두 번씩 나며 인두 압박, 운동, 아침, 추위로 유발된다. 진행하면 호흡곤란, 타진 탁음, 삐걱거리는 수포음이 생긴다. 기관지 림프절 종대는 기도 협착을, 종격 림프절 종대는 재발성·지속성 반추위 고창을 일으킨다. 인두후 림프절 종대는 연하곤란과 시끄러운 호흡을 일으킨다.</span><span class="hang">자궁 결핵은 불임이나 임신 말기 반복 유산을 일으킨다. 결핵성 유방염은 뒷분방 상부부터 경결·비대가 오며 유방상 림프절 촉진이 필수다. 초기 우유는 정상이나 나중에 미세 응고물이 가라앉고 맑은 호박색 액이 남는다.</span><span class="hang">감별: 마이코플라스마 보비스, 만성 폐농양, 흡인성 폐렴, 존씨병, 기생충증, 소 백혈병.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>투베르쿨린 검사<span class="hang">소형 PPD를 피내 주사하고 72시간 뒤 지연형 과민반응에 의한 부종을 본다. 미근부 추벽(꼬리주름) 검사(CFT)는 실용성 때문에 미국·캐나다·뉴질랜드에서, 경부 단일 피내검사(SIT)는 유럽에서 쓴다. 경부가 민감도·특이도가 더 높지만 보정과 털 깎기가 필요하다. CFT는 촉진으로, SIT와 비교검사는 주사 전과 72시간 뒤 피부 두께를 캘리퍼로 재서 판정한다.</span><span class="hang">용량은 소형 투베르쿨린 최소 2,000 IU(감작이 약한 소는 5,000 IU까지), 주사량 0.2 mL 이하다. 미국은 미근부 추벽에 0.1 mL를 쓴다. 천천히 정확히 피내 주사할수록 부종이 크다.</span><span class="hang">지침서 판정 기준(미근부 추벽 접종 72시간 뒤 접종 전과의 추벽 두께 차이):</span><table class="bxt"><tr><th>두께 증가</th><th>판정</th></tr><tr><td>5 mm 이상</td><td>양성</td></tr><tr><td>3~5 mm</td><td>의양성</td></tr><tr><td>3 mm 이하</td><td>음성</td></tr></table><span class="hang">비교 피내검사(SICT): 소형과 조류형 투베르쿨린을 목 두 곳(양쪽 또는 같은 쪽 약 12 cm 간격 위아래)에 동시에 주사하고 72시간 뒤 비교해 반응이 큰 쪽을 감작 원인으로 본다. 원래 반응우의 원인 확인용이지만, 조류결핵·존씨병이 많거나 존씨병 백신을 쓴 곳에서는 1차 검사로 쓴다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>검사의 함정과 보조검사<span class="hang">위양성: 사람형·조류형 결핵, 존씨병(백신 포함), 피부결핵(궤양성 림프관염), 비병원성 항산균, 노카르디아 감작, 판독 전 주사부위 자극물 주입. 비특이 반응이 의심되면 SID나 CFT 7일 뒤 경부 비교검사, 또는 피부검사 8~28일 뒤 인터페론-γ 검사로 재검한다.</span><span class="hang">위음성: 진행된 결핵(특히 광범위 폐병변의 무반응), 감염 6주 이내, 분만 6주 이내(분만 전후 30%까지 위음성, 4~6주 뒤 양성 복귀), 8~60일 안의 투베르쿨린 투여에 의한 탈감작, 노령우, 역가 낮거나 오염된 투베르쿨린, 다회용 주사기의 용량 편차. 의양성우는 60일 전에 재검하지 않는다. 감염 어미 초유를 먹은 송아지는 감염 없이도 3주까지 양성일 수 있다.</span><span class="hang">인터페론-γ 검사: PPD로 자극한 전혈 배양의 IFN-γ를 잰다. 한 번만 다루면 되고 감염 3~5주 뒤부터 검출한다. 민감도 67%로 SCIT보다 높고 특이도 96%로 낮다. 채혈 당일, 늦어도 하룻밤 보관 뒤 실험실에서 시작한다.</span><span class="hang">확진은 배양(37℃에서 최소 8주, 가능하면 10~12주, 보통 3~6주에 자람)과 항산성 염색이다. 부검에서 기관지·인두후·종격 림프절 육아종, 크림~주황색 건락 고름, 흉막·복막 결절, 석회화된 피막 결절이 보인다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>방제<span class="hang">근절 프로그램이 있는 나라에서는 치료가 허용되지 않으며 검사·도태만이 효과가 입증된 방법이다.</span><span class="hang">3개월령 이상 전 두수를 검사하고 양성우는 법에 따라 처리한다. 진행된 임상 증례는 반응하지 않을 수 있으므로 초회 검사 때 전 두수를 임상 검사한다. 노령우와 분만 6주 이내 소는 특수 검사나 재검을 쓴다.</span><span class="hang">음성이 나올 때까지 3개월 간격으로 재검하고, 6개월 뒤 다시 음성이면 청정으로 분류하며 이후 매년 확인 검사한다. 사료조·급수조를 청소·소독하고 의양성우를 격리하며 이중 울타리로 분리한다. 대체 송아지는 결핵 없는 우유로 기른다.</span><span class="hang">지침서: 입식 시 결핵·브루셀라 비발생 농가의 소인지와 질병검진카드를 확인하고, 격리 후 검진하고 합사하며, 자연교미 수소는 반드시 검사한다. 개·고양이·닭·오리의 축사 접근을 막고, 주 1회 이상 축사를 소독하며 농장 주변에 생석회를 뿌린다. 양성우가 나오면 동거우를 살처분한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">58.</span><span>브루셀라병 — 원인과 전파<span class="hang">소는 Brucella abortus가 원인인 그람음성 소간균, 통성 세포내 기생균이다. 사람도 감염되는 법정 가축전염병이다. 유산 상세는 번식 탭에서 다룬다.</span><span class="hang">유산태아, 태막, 후산에 균이 많고 유산 뒤 질분비물과 우유로 배설된다. 오염 사료·물의 경구감염이 가장 중요하고 창상, 결막, 유방, 교미·인공수정, 태반 감염도 가능하다. 저온살균으로 쉽게 죽는다. 감염우는 분만 2주 전부터 분만 뒤 1개월간 대량 배균한다(지침서).</span><table class="bxt"><tr><th>환경</th><th>생존기간(지침서)</th></tr><tr><td>흙 / 분뇨 / 물</td><td>30일~7개월 / 25일~1년 / 57일</td></tr><tr><td>우사 안 / 퇴비(깔짚) / 사료</td><td>4개월 / 5개월 / 5개월</td></tr><tr><td>원유 / 고기 / 사체</td><td>2일~1개월 / 12개월 / 44일</td></tr><tr><td>유산태아(태반) / 직사광선 / 저온살균</td><td>수개월 / 5시간 / 15분</td></tr></table><span class="hang">감염우는 대부분 평생 보균우가 되어, 이후 임신에서 유산은 드물어도 분만 때마다 배균한다. 수직감염이나 감염 우유로 감염된 송아지는 혈청음성 잠복감염으로 지내다 임신 말기나 분만 때 양전되기도 한다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>증상과 진단<span class="hang">주로 임신 후반기(5개월~만기, 지침서 6~8개월)에 전구증상 없이 유산·사산·조산하고 후산정체, 수태율 저하, 일시적·영구적 불임이 따른다. 유산은 초임우에 많고 성우가 감염으로 죽지는 않는다. 무릎 활액낭염, 유방·유방상 림프절 종창, 유량 감소가 있고 수소는 고환염·부고환염·정낭염으로 불임이 된다.</span><span class="hang">배양이 금본위이고 유산태아 PCR이 늘고 있다. 혈청검사(시험관응집, 평판응집, 카드시험, 보체결합, ELISA)와 집유 밀크링 검사로 감시한다. IgM 응집소는 감염 2주 안에, IgG는 1~2개월에 최고가 된다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>방제<span class="hang">균이 세포 안에 있어 항생제 치료가 극히 어렵고 경제성이 없어 하지 않으며 양성우는 강제 도태한다. 실험적으로는 테트라사이클린·스트렙토마이신 병용이 지지된다.</span><span class="hang">지침서의 농가 대책: 감염우 색출·살처분, 정기검사로 음성농장 증명, 입식 시 검사증명서 확인과 음성농장 구입, 유·조산·불임우 격리와 신고 검사, 유산태아·후산물 소독 후 소각·매몰, 개·고양이·쥐 접근 차단, 분만 예정 2주 전부터 격리 사육. 국내 발생의 주 전염원은 외부 입식우로 본다.</span><span class="hang">지침서의 방역시책: 1세 이상 암소 전 두수 연 1회 이상 검사와 양성우 강제 폐기, 수집상·중개상 소와 자연교배용 수소 연 4회 이상 검사, 감염률 2.0% 초과 고위험 지역 연 1회 추가 검사, 거래 소 검사증명서 휴대, 청정농장 지정과 검사 면제.</span><span class="hang">미국은 4~8개월령 암송아지에 RB51 백신(기존 혈청검사에 반응하지 않고 strain 19보다 유산 유발이 적음)을 쓰고, 수송아지는 생식기 만성 감염 우려로 접종하지 않는다(Rebhun).</span><table class="bxt"><tr><th>소독제(지침서)</th><th>온도</th><th>시간</th><th>대상</th></tr><tr><td>크레졸 3%</td><td>70~80℃</td><td>1시간</td><td>축사, 기구</td></tr><tr><td>석탄산 3~4%</td><td>70~80℃</td><td>1시간</td><td>축사, 기구</td></tr><tr><td>가성소다 2%</td><td>60℃</td><td>3시간</td><td>축사, 기구</td></tr><tr><td>알데하이드 2%</td><td>20℃</td><td>10분</td><td>축사, 기구</td></tr><tr><td>염화칼슘 5%</td><td>실온</td><td>1시간</td><td>축사, 기구</td></tr><tr><td>염소 0.5%</td><td>실온</td><td>4시간</td><td>물, 축사</td></tr><tr><td>생석회 5%</td><td>8~20℃</td><td>3시간</td><td>토양, 하수, 퇴비</td></tr><tr><td>차아염소산소다 0.03%</td><td>실온</td><td>10분</td><td>기구</td></tr></table><span class="hang">사람 브루셀라병은 축산 종사자의 직업병으로 잠복기 2~4주, 지속성·간헐성 발열, 두통, 허탈, 다한, 오한, 관절통, 체중 감소를 보이며 독시사이클린·스트렙토마이신 6주 투약이 권장된다. 수의사·인공수정사는 보호안경과 장갑을 쓰고, 발생 농가 종사자와 진료 수의사는 보건소 검사를 받는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">61.</span><span>렙토스피라증 — 원인과 역학<span class="hang">Leptospira interrogans와 L. borgpetersenii의 여러 혈청형이 원인이다. 소는 Hardjo(L. borgpetersenii Hardjo-bovis)의 유일한 유지숙주이고, Pomona, Canicola, Icterohaemorrhagiae, Grippotyphosa 같은 비숙주적응형은 우발 감염으로 소에 10일~4개월 지속된다.</span><span class="hang">감염동물 오줌으로 퍼지며 결막, 소화관·생식기 점막, 상처나 물에 불은 피부로 들어온다. 지표 습도가 균 생존의 가장 중요한 요인이다. 개, 돼지, 쥐, 사슴 등이 환경을 오염시킨다. 주요 인수공통병이다.</span><span class="hang">Hardjo 감염 위험인자는 감염우 구입, 감염 소·양과 공동방목, 감염 수소 자연교배, 오염된 하천·홍수·배수로 물 접근이다.</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>임상증상<span class="hang">Pomona 잠복기는 3~9일이다. 급성형은 송아지에 많고 41~41.7℃ 고열, 패혈증, 용혈성 빈혈, 혈색소뇨, 황달, 점상출혈을 보이며 2개월령 미만 폐사율이 높다.</span><span class="hang">성우 급성형: 고열과 함께 유즙 분비가 완전히 멎고 처진 유방의 네 분방에서 붉은·주황·진노랑의 진한 유즙이 나온다. 성우의 혈색소뇨는 드물다. Hardjo는 대개 치료와 관계없이 10~14일 뒤 유량이 회복된다(유량 저하 증후군).</span><span class="hang">유산은 패혈기에도 생기지만 대개 감염 평균 3주 뒤(Hardjo는 4~12주 뒤) 임신 4개월~만기 태아가 자가융해된 채로 나온다. 이때 어미는 이미 항체가가 올라 있다. 말기 감염 송아지는 허약하거나 죽어 태어난다.</span><span class="hang">Hardjo 상재 농가는 성우가 저항성이어도 초산우에 불임, 조기배아사, 수정횟수 증가, 분만간격 연장이 계속된다. 유산·분만 뒤 3주까지 난관에서 배양되고 자연교배로 전파될 수 있다.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>진단<span class="hang">짝혈청 4배 상승이 감염의 가장 좋은 증거의 하나이고(숙주적응형 제외), 유산 뒤 단일 고역가도 강하게 시사한다. Hardjo는 유산 시 항체가가 낮거나 없을 수 있다. 백신 항체가는 대개 1:400 이하다.</span><span class="hang">미세응집시험(MAT)이 가장 많이 쓰이고 ELISA는 혈청형을 알려주지 않는다. 오줌 PCR은 민감도가 높으나 혈청형을 구분하지 못한다. 오줌은 표시용량의 푸로세미드 투여 뒤 세 번째 배뇨분을 받아 24시간 안에 도착하게 보낸다. 유산 태아 심장혈 MAT와 태반·태수 검출을 함께 쓴다.</span><span class="hang">급성 용혈 감별: 산후 혈색소뇨증, 세균성 혈색소뇨증, 바베시아증, 아나플라즈마증(혈색소뇨 없음), 만성 구리중독, 송아지 냉수 용혈, 유채·케일 중독. 유산 감별: 네오스포라, 살모넬라, IBR, BVD.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>치료<table class="bxt"><tr><th>약물</th><th>용량(소)</th></tr><tr><td>디하이드로스트렙토마이신</td><td>25 mg/kg IM 24시간마다 3~5일(Pomona 전신감염 12 mg/kg 1일 2회 3일)</td></tr><tr><td>옥시테트라사이클린</td><td>20 mg/kg IM 24시간마다 3~5일</td></tr><tr><td>장기지속성 옥시테트라사이클린</td><t
