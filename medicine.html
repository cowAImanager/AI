<p class="bx-num"><span class="bxn" data-n="181">•</span><span>갑자기 시작하는 습성 통증성 기침, 크게 코 고는 소리를 동반한 심한 흡기성 호흡곤란, 머리·목을 뻗은 개구호흡, 침 흘림을 보이고, 자주 아프게 삼키며 서서 계속 물을 홀짝인다. 발열은 41.1℃까지이고(후두형에서 39.44~40.28℃의 미열로 적은 책도 있다), 양쪽 콧물과 악취 나는 입냄새가 있다. 후두가 붓고 만지면 기침과 통증이 나며 호흡곤란이 심해진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>치료하지 않으면 세균 독소와 상기도 폐쇄로 2~7일에 많이 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>회복해도 후두가 변형되어 그르렁거리는 호흡과 거칠고 마른 기침이 남고, 이물성 폐렴과 만성 발육 불량이 흔한 후유증이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span>옥시테트라사이클린 11mg/kg 정맥 또는 피하 24시간 간격, 지속형 20mg/kg 피하 72시간 간격, 프로카인 페니실린 G 22,000~44,000U/kg 근육 12~24시간 간격, 플로르페니콜 20mg/kg 근육 48시간 간격 또는 40mg/kg 피하 96시간 간격이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>급성에 페니실린 22,000U/kg 근육 1일 2회, 만성은 14~30일로 연장하며, 최소 7일로 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>설파메타진은 첫 140mg/kg 정맥 후 70mg/kg 정맥 24시간 간격, 또는 150mg/kg 경구 24시간 간격 3~5일(5일 넘기지 않는다).</span></p>
<p class="bx-num"><span class="bxn" data-n="187">•</span><span>만성은 깊은 연골 감염에 소디움 아이오다이드를 함께 쓰는 임상가도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="188">•</span><span>플루닉신 1.1~2.2mg/kg 정맥 1일 1회 또는 2회 분할로 부기·염증·열을 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="189">•</span><span>호흡곤란이 심하면 덱사메타손 0.05~0.2mg/kg 정맥 또는 근육 1~2회, 반복 투여는 권하지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="190">•</span><span>케토프로펜 3mg/kg 근육 또는 정맥 24시간 간격, 아스피린 100mg/kg 경구 12시간 간격도 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="191">•</span><span>처음에는 먹이는 약을 피한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="192">•</span><span>심하면 기관절개가 필요하고, 바람을 피할 곳·환기·사료와 물 접근, 필요하면 경구·정맥 수액 같은 간호가 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="193">•</span><span>일찍 적극 치료하면 예후는 보통~양호하고 치사율은 약 15~20%다. 약 20%가 만성이 되고 후두 연골이 침범되면 낫지 않는 경우가 많아 만성 무반응 개체는 도태를 권한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="194">•</span><span>일찍 적극 치료해도 재발하기도 하고, 연골 괴사가 넓으면 죽거나 만성 발육 불량이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>급성은 보통, 만성은 이미 후두 변형·연골 괴사가 있어 나쁘고, 심한 기관지폐렴이 동반되면 예후가 훨씬 나빠진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="196">•</span><span>예방은 사료조·급여 기구 청결, 거친 사료 피하기이고, 다른 호흡기병 대책이 괴사성 후두염 발생을 줄일 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="197">•</span><span>감별은 인두 외상·연조직염·농양, 심한 바이러스성 후두염(IBR 등), 방선균증, 후두 부종·농양·외상·마비·종양, BVD, 이물성 폐렴, 치아 농양, 턱뼈 골절, 이물이다.</span></p>
</div>
<div class="bx"><div class="bx-title">이물성(흡인성) 폐렴</div>
<p class="bx-num"><span class="bxn" data-n="198">•</span><span>위험 요인은 미숙한 사람의 강제 경구·위관 투여, 깊은 진정·마취, 인두·식도 장애, 신생 송아지의 태변 흡인, 셀레늄 결핍, 괴사성 후두염이다. 머리를 높이 든 채 많은 양의 약을 먹여도 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="199">•</span><span>송아지는 근육영양장애(셀레늄·비타민 E 결핍)로 삼키는 근육이 약해져 우유를 흡인하거나, 위관·식도 급여기가 기관으로 들어가거나, 구멍이 너무 큰 젖꼭지로 먹이거나, 누운 채 젖병으로 먹일 때가 흔한 원인이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="200">•</span><span>성우는 유열이 가장 흔한 원인이다. 심한 저칼슘혈증 소는 옆으로 누워 고창이 생기고, 반위된 제1위 내용물을 반혼수 상태라 뱉어내지 못해 흡인한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="201">•</span><span>대량의 액체가 기관으로 들어가면 바로 호흡곤란·청색증·반복 기침을 보이고 거품 섞인 액체를 코·입으로 뱉으며 몇 분~몇 시간 안에 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="202">•</span><span>소량의 우유·사료가 들어가면 그 안의 세균이 증식해 패혈성 기관지폐렴이 되고, 증상은 서서히 진행한다. 항생제에 잘 듣지 않는 열, 호흡곤란, 빠른 호흡, 앞아래쪽 양쪽 폐의 수포음·기관지음이 나타난다. 옆으로 누운 채 흡인했으면 주로 한쪽 폐만 침범한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="203">•</span><span>전염성 폐렴과 달리 보통 한 마리만 걸린다. 부검 병변은 대개 오른쪽 앞아래 폐엽의 괴저성 폐렴이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="204">•</span><span>많이 흡인하면 콧물과 악취 나는 입냄새가 있고, 흉막 삼출이 차면 폐 아래쪽 소리가 작아진다. 쇼크나 급사도 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="205">•</span><span>흡인을 알아챈 즉시, 증상이 있든 없든 그람양성·음성 균을 덮는 광범위 항생제를 시작하고, 심하면 혐기성 균까지 덮는다. 항생제는 흡인한 물질에 보통 들어 있는 세균을 목표로 고른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="206">•</span><span>스테로이드나 비스테로이드성 소염제로 쇼크와 염증을 조절한다. 태변을 흡인한 신생 송아지는 덱사메타손 5mg/50kg 1회를 항생제·보조 치료(가능하면 산소)와 함께 줄 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="207">•</span><span>인두·식도 기능에 문제가 있으면 먹이는 약은 피한다. 삼킴 장애가 있는 소는 바닥에서 떨어진 높이에서 먹여 재흡인을 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="208">•</span><span>장기간(몇 주) 항생제가 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="209">•</span><span>증상이 나아지면 최소 2주 계속한다. 열·침울·호흡곤란·독혈증이 계속되면 대개 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="210">•</span><span>소량 흡인을 빨리 치료하면 살지만, 대량 흡인, 괴저성 폐렴, 늦은 발견, 선천성이거나 회복 어려운 원인이면 예후 불량이다. 광물성 기름처럼 괴사를 일으키거나 흡수되지 않는 물질을 흡인하면 거의 다 죽으므로 치료하지 않는다. 심한 호흡곤란과 청색증이 있으면 안락사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="211">•</span><span>경구·위관 투여 기술 교육이 가장 중요한 예방이다. 젖병은 거꾸로 들었을 때 우유가 방울방울 떨어지기만 해야 한다. 허약·미숙·누운 송아지는 머리·목을 젖힌 채 먹이지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="212">•</span><span>유열처럼 일어서지 못하는 소는 빨리 치료해 엎드린 자세를 유지시킨다. 식도 폐쇄·삼킴 장애가 있는 소는 사료를 끊는다.</span></p>
</div>
</div>
`;
}

<div class="bx-sub"><div class="bx-subtitle">원인체별 감별</div>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>병원체별 발병 일령.<div class="bxt-wrap"><table class="bxt bxt-vac2"><tr><th>병원체</th><th>발병 일령</th></tr><tr><th>장독소형 대장균(ETEC)</th><td>3일 미만</td></tr><tr><th>C. perfringens C형</th><td>10일 미만</td></tr><tr><th>로타바이러스</th><td>5~15일</td></tr><tr><th>코로나바이러스</th><td>5~21일</td></tr><tr><th>크립토스포리디움</th><td>5~28일</td></tr><tr><th>살모넬라</th><td>2주 이후</td></tr><tr><th>콕시듐</th><td>3주 이후</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>분변 모양만으로는 진단이 안 된다.<div class="bxt-wrap"><table class="bxt bxt-vac2"><tr><th>소견</th><th>시사하는 것</th></tr><tr><th>혈변</th><td>살모넬라·코로나·장출혈성 대장균·BVD·콕시듐</td></tr><tr><th>점액</th><td>대장 침범</td></tr><tr><th>분변 속 우유 덩어리</th><td>흡수불량(주로 바이러스)</td></tr><tr><th>발열</th><td>살모넬라·장병원성 대장균·콕시듐</td></tr><tr><th>이급후증(tenesmus)</th><td>콕시듐</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>지알디아는 다른 원인체와 함께 나오는 경우가 많고 단독 병원성은 불확실하다. 2주령 이상, 흔히 1개월령 이후에 감염되어 몇 달 가는 만성이 된다. 펜벤다졸 5mg/kg 하루 1회 3일 또는 알벤다졸 20mg/kg 하루 1회 3일 경구가 효과가 있다.</span></p>

</div>
<div class="bx-sub"><div class="bx-subtitle">치료 목표·탈수·산증 평가</div>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>치료 목표는 수분·전해질 교정, 산증 교정, 영양 공급, 필요할 때 세균 감염 치료·예방이다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>설사 송아지의 가장 흔한 사인은 탈수와 산증이다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>개체 치료로는 패혈증·균혈증 예방, 소장·제4위 대장균 수 감소, 음의 에너지 균형 예방, 진통으로 스트레스 줄이기를 목표로 그람음성 항균제와 비스테로이드 소염제를 쓰고, 우유는 1회량을 줄이고 횟수를 늘리는 것이 현재 권고다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>기립 상태, 눈 함몰, 반사(밀었을 때 자세를 바로잡는지, 눈꺼풀 반사)로 산증 정도를 추정한다.</span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>잘 서고 눈 함몰이 없으면 알칼리화 능력이 큰 경구 전해질을 준다.</span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>그 외에는 기립 상태가 나쁠수록 중탄산나트륨을 250, 500, 750mmol로 늘린다(누워 일어나지 못하면 750mmol).</span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>눈 함몰이 있거나 포도당이 필요하면 0.9% 식염수 5~10L에 섞어 지속 점적한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>건강한 송아지는 눈이 꺼지지 않는다. 피부 탄력은 눈꺼풀보다 목 중간 피부를 1초 집어 비튼 뒤 복귀 시간으로 본다. 탈수·염기결핍 추정은 다음과 같다(책마다 피부 복귀 시간이 다르다).<div class="bxt-wrap"><table class="bxt"><tr><th>탈수</th><th>눈알~안와 거리</th><th>목 피부 복귀</th><th>빨기·점막·기립</th><th>염기결핍(mmol/L)</th></tr><tr><th>4~5%</th><td>없음~2mm</td><td>1~2초 미만</td><td>정상, 잘 빨고 걸어 다님</td><td>5</td></tr><tr><th>6~8%</th><td>2~4mm(약간 떨어짐)</td><td>1~2초(5~10초, 또는 8%에서 6초로 적은 책도 있다)</td><td>점막 끈적, 걸어 다님</td><td>10 (걸어 다니면 5~10)</td></tr><tr><th>8~10%</th><td>4~6mm(0.5cm 미만)</td><td>2~5초(11~15초로 적은 책도 있다)</td><td>빨기 감소, 사지 냉감, 점막 끈적하거나 마름, 허약</td><td>15 (허약하면 10~15)</td></tr><tr><th>10~12%</th><td>6~8mm(0.5~1cm)</td><td>5~10초(16~45초, 또는 12%에서 8초 초과로 적은 책도 있다)</td><td>빨기 아주 약하거나 없음, 입·사지 차가움, 점막 마름, 대개 누움</td><td>20 (누우면 15~20)</td></tr><tr><th>12% 초과</th><td>8~12mm</td><td>10초 초과</td><td>빨기 없음, 저체온, 누움</td><td>20 초과</td></tr></table></div></span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>급성 설사에서는 눈 함몰이 가장 믿을 만하고, 눈 위치는 체지방에도 좌우되므로 만성 설사·악액질 송아지는 목 피부 복귀가 낫다. 탈수가 거의 없어도 며칠에 걸친 중탄산 손실이나 D-젖산으로 심한 산증이 올 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>기립·근긴장·빨기 반응·입안 온도·일령으로도 염기결핍(mEq/L)을 추정한다. 괄호는 같은 값을 다른 말로 적은 표.<div class="bxt-wrap"><table class="bxt bxt-vac2"><tr><th>기립·빨기·입안 온도</th><th>8일령 미만</th><th>8일령 초과</th></tr><tr><th>근긴장 좋고 서며 빨기 강함, 입안 따뜻함 (밝고 걸음)</th><td>0</td><td>최대 5</td></tr><tr><th>서지만 빨기 약하고 입안 약간 참 (부축해야 섬)</th><td>5</td><td>10</td></tr><tr><th>흉골와위, 빨기 없음, 입안 참 (못 서나 빨기 있음)</th><td>10</td><td>15</td></tr><tr><th>옆으로 누움, 빨기 없음, 입안 차가움 (혼수·빨기 없음)</th><td>10</td><td>20</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="24">•</span><span>탈수 정도와 산증 정도는 관계가 적어 따로 판단한다. D-젖산이 높으면 빨기 반사는 남아도 눈꺼풀 반사가 떨어지고, 침울, 비틀거림, 머리를 숙이고 귀가 처진 자세를 거쳐 눕는다. 8일령 미만은 주로 빠르고 심한 탈수로 처지고, 8일령 초과는 D-젖산 축적에 의한 산증이 처짐의 큰 원인이다. 설사에서 회복된 10~20일령 송아지가 탈수 없이 산증만으로 처지고 비틀거리기도 하는데 중탄산나트륨 정맥주사에 빨리 반응한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>서맥(분당 90회 미만)은 저체온, 저혈당, 고칼륨혈증을 시사한다. 고칼륨혈증도 D-젖산 산증처럼 전신 허약을 보이지만 눈꺼풀 반사로 구별되고 둘이 함께 오는 경우는 드물다. 서맥이나 부정맥이 있으면 바로 중탄산 수액을 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>동반 질환으로 폐(청진), 배꼽(통증·종창·축축함), 관절(종창·파행)을 확인한다. 1주령 미만, 빨기 반사 소실, 동반 감염이 있는 누운 송아지는 패혈증 가능성이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>설사로 혈중 중탄산이 크게 떨어지고 pH가 낮아진다. 정맥혈 pH 7.0 미만 송아지는 즉시 비경구로 산혈증을 치료한다. 나트륨은 약간 낮고 클로라이드는 약간 높을 수 있다. 정상 정맥혈은 pH 7.35~7.50, pCO2 34~45mmHg, 중탄산 20~30mmol/L이다. 음이온차 = (Na + K) − (Cl + HCO3), 정상 14~26mmol/L이고 젖산·케톤산·인산이 늘면 커진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>L-젖산 축적은 생후 첫 주에만 보이고, 설사 송아지의 음이온차 증가 산증에는 D-젖산이 크게 기여한다. 고나트륨·저클로라이드 장액 손실이 강이온 산증에 보태고, 탈수로 총단백이 오르는 약산 산증은 작은 요인이다. 운동실조·혼수 같은 신경 증상은 산혈증보다 D-젖산 상승으로 더 잘 설명된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="29">•</span><span>D-젖산은 상업 검사실이나 현장 장비로 재지 못한다(혈당과 D-젖산을 전용 휴대용 측정기로 잴 수 있다고 적은 책도 있다). 심한 대사성 산증, 음이온차 크게 증가, L-젖산 정상이거나 약간 증가(현장 측정 가능), 심한 질소혈증 없음이면 D-젖산이 높다고 본다. 탈수 송아지가 다 D-젖산이 높은 것은 아니고 D-젖산 산증 송아지가 꼭 탈수된 것도 아니다.</span></p>
<p class="bx-num"><span class="bxn" data-n="30">•</span><span>고칼륨혈증은 산혈증이 심한 탈수 설사 송아지에서 가장 두드러진 전해질 이상이고 대학병원 조사에서 34%였다. 생후 첫 며칠의 심한 급성 설사, 특히 ETEC에서 주로 보이고 로타·코로나는 그만큼 심한 산증을 잘 만들지 않는다. 서맥, 부정맥, 심방정지로 죽을 수 있다. 칼륨 상승 정도는 정맥혈 pH·염기과잉보다 탈수 정도와 더 관련되어, 소변으로 칼륨을 못 내보내는 것이 더 중요할 수 있다. 산증에는 보통 고칼륨혈증이 따르지만 전신 칼륨은 그대로이거나 모자랄 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>2주령 미만으로 급성 설사, 누움, 탈수에 서맥이나 부정맥이 있으면 고칼륨혈증을 의심한다. 7.0mEq/L 초과는 심정지를 부를 수 있어 바로 교정한다(부정맥은 대개 칼륨 8mEq/L 초과에서 온다고 적은 책도 있다). 정맥혈 pH 7.0 이상인 송아지는 수동면역 실패와 패혈증이 없으면 예후가 좋다.</span></p>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>i-STAT 같은 휴대용 분석기로 Na, K, 이온화칼슘, tCO2, pH, pCO2, pO2, 염기과잉, 적혈구용적을 잰다. 소에서 기준 장비와 상관이 좋았다. 헤파린 주사기에 받아 마개를 막고 얼음에 두면 4시간 이상 운반해도 된다. 총 CO2나 중탄산은 대사성 산증 정도를 보는 좋은 지표다. 혈청 tCO2는 중탄산보다 1~2 높다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">경구 수액</div>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>탈수 속도를 예측할 수 없으므로 21일령 미만 송아지는 설사 첫 징후부터 경구 전해질을 준다. 24시간 필요량을 계산해 하루 3회로 나눠 먹이는 것이 좋다. 경구 전해질과 물은 항상 먹을 수 있게 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>조성은 나트륨 90~130mmol/L(130 초과는 고나트륨혈증과 제4위 배출 지연 위험), 나트륨 흡수를 돕는 포도당·시트르산·아세트산·프로피온산·글리신, 알칼리화제 50mmol/L 초과와 SID 60~80, 염소 40~80mEq/L, 칼륨 10~30mmol/L이다. 삼투압 약 600mOsm/L까지는 영양 보충이 되지만 700mOsm/L 이상은 탈수를 키우고 제4위 배출이 늦어 고창·제4위염 위험이 있다. 물 수백 L에 타는 묽은 제품(부스터)은 탈수 송아지를 회복시키지 못한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>알칼리화 능력 70~80mEq/L인 전해질을 하루 4~6L 먹인다. 저혈당이나 산증이 없으면 등장성이 고장성보다 제4위 통과가 정상에 가깝다. 우유를 끊은 송아지는 등장성 저포도당액으로 체중이 더 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>경구 수액은 60~80%만 흡수되므로 양을 계산할 때 감안하고, 심한 대장균 설사에서는 60%까지 떨어진다. 일반 전해질은 하루 4L 기준 에너지 필요량의 15~25%만 채운다.</span></p>
<p class="bx-num"><span class="bxn" data-n="37">•</span><span>알칼리화제는 중탄산 62mmol/L 이하, 시트르산 12mmol/L 이하면 우유 응고를 방해하지 않았다. 우유를 조금씩 자주 먹는 송아지에는 주로 아세트산을 쓴 제품이 낫고, 우유를 끊은 송아지에는 어느 알칼리화제든 듣는다. 중탄산 제품은 소장 세균 과증식과 ETEC 부착·독소 생산을 도울 수 있다는 우려가 있어 ETEC 설사에는 아세트산 제품을 권한다. 아세트산 외의 알칼리화제가 든 전해질은 우유를 먹는 송아지에게 주지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>전해질은 우유와 섞지 말고 우유 급여 2시간 전후로 띄운다(최소 30분으로 적은 책도 있다). 빨지 않는 송아지는 고에너지 전해질을 체중의 10% 이상, 최소 4회로 나눠 먹인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>송아지는 자당을 잘 소화하지 못해 집에서 만든 전해질에 설탕을 넣으면 분변으로 잃는 수분·전해질이 늘어난다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">정맥 수액</div>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>눈 함몰 4mm 이상이거나 서지 못하는 송아지는 경구 수액에 더해 정맥 수액을 준다. 급성 설사, 탈수 7% 미만, 구강 약간 건조, 빨기 좋고 서 있으며 입안이 따뜻하면 경구 수액으로 한다. 탈수 7~9%, 약한 산증, 빨기 약함, 근긴장 좋음, 입안 따뜻함이면 7.5% 고장식염수 3~4mL/kg를 5분에 걸쳐 정맥주사하고, 스스로 마시게 하거나 위관으로 경구 전해질 40~60mL/kg를 주고 6~8시간 뒤 재평가한다. 탈수 9% 초과, 구강 건조·차가움, 누워 있음, 빨기 없음, 심한 침울이면 알칼리화제를 넣은 정맥 수액을 6~8시간, 필요하면 24~36시간 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="41">•</span><span>고장액은 7.2% 고장식염수(또는 6% 덱스트란 70 첨가) 4mL/kg를 4분에 걸쳐 정맥주사하고 등장 알칼리화 경구 전해질을 반드시 함께 준다. 8.4% 중탄산나트륨 1mL/kg/분 15분도 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>저체온 송아지에 찬 수액을 주면 심박출량이 떨어져 죽을 수 있다. 뜨거운 물 양동이에 수액줄을 감아 담가 데우고 물 온도를 자주 확인한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>초기 수액으로 5% 포도당 1L에 중탄산나트륨 150mEq를 넣은 액을 처음 1~3L 준다. 고칼륨혈증 송아지에 칼륨 든 수액을 처음부터 주지 않는다(서맥·부정맥 송아지에서 사망 예가 있다). 이후 하트만 같은 균형 전해질로 유지한다. 누워 있던 송아지도 수액 2~4L 뒤 6시간 안에 서고 6~24시간 안에 빤다.</span></p>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>탈수량(L) = 체중(kg) × 탈수%/100. 유지량은 하루 60~120mL/kg(진행 손실 포함)이고 24시간 총량 = 탈수량 + 유지량이다(유지량 하루 50~100mL/kg, 설사 손실 하루 1~6L로 적은 책도 있다). 탈수와 분변량은 매일 다시 평가해 조정한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>투여 속도는 첫 1시간 40~80mL/kg까지는 폐수종 위험이 크지 않다. 이후 유지 속도 약 4mL/kg/시간, 손실이 커도 20mL/kg/시간을 넘기지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>필요 중탄산(mmol) = 체중(kg) × 추정 염기결핍(mmol/L) × 0.5~0.6. 염기결핍(mmol/L) = 30 − tCO2로 잡아 체중 × (30 − 혈청 tCO2 또는 중탄산) × 0.6으로 계산한다(예: 40kg, tCO2 10mmol/L이면 40 × 20 × 0.6 = 480mmol). 정상 중탄산을 25로 놓고 체중 × (25 − 측정 중탄산) × 0.6으로 계산한 예(50kg, 중탄산 5 → 600mmol)도 있다. 설사 신생 송아지는 결핍의 100% 가까이 보정해도 되고 설사가 계속되면 더 필요하다. 송아지 분포용적은 0.6이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>신생 송아지 세포외액을 체중의 50%로 보고 계산하는 방법도 있다. 40kg 송아지는 20L이고, 정맥혈장 중탄산 10mEq/L에 목표가 25~30이면 1L당 15~20mEq가 모자라 20L × 15 = 300mEq가 필요하다. 정맥혈 총 CO2로 대신 계산해도 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>8.4% 중탄산나트륨 1mL에 중탄산 1mEq, 중탄산나트륨 1g에 12mEq가 들어 있다. 1.3% 등장 중탄산나트륨은 증류수 1L에 13g(또는 8.4% 150mL를 물 1L에 섞음)이고 1L에 중탄산 150mmol이 들어 있다. 보정은 등장액으로 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>알칼리화제 중 심한 산증에 일관되게 듣는 것은 중탄산뿐이다. 중탄산나트륨을 칼슘 든 액(링거액)과 섞으면 침전이 생길 수 있어 식염수와 섞는다. 혈액 pH 7.25~7.45면 완전 교정할 필요가 없다. 24시간에 걸쳐 교정하는 것이 이상적이나 4시간에 교정해도 문제는 드물다. 정상 송아지 값은 정맥혈 pH 7.34, 중탄산 30mmol/L, 염기과잉 5mmol/L다.</span></p>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>대부분 설사 송아지는 심한 저혈당이 아니다. 혈당 2mmol/L(36mg/dL) 미만은 생존 가능성이 크게 낮고 흔히 패혈증이 있다. 이때 정맥 수액에 포도당을 2.5~5%가 되게 넣는다. 50% 포도당 20mL를 1L에 넣으면 1%가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>고칼륨 송아지에는 중탄산나트륨 150~300mEq/L를 넣은 5% 포도당 1~3L를 정맥주사한다. 포도당과 중탄산이 칼륨을 세포 안으로 옮기고 저혈당도 막는다. 고비를 넘기면 칼륨 든 균형 전해질로 바꾼다. 인슐린은 필요 없다. 고칼륨혈증은 재수화(신장 관류 회복, 희석)와 산증 교정으로 풀리고, 고장 중탄산이 고장 식염수나 포도당보다 고칼륨 송아지 소생에 낫다.</span></p>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span>칼륨 보충량(mEq) = 체중(kg) × 0.4 × 칼륨 결핍(mEq/L). 수액에 20~30mEq/L까지 안전하게 넣고 시간당 0.5mEq/kg를 넘기지 않는다. 산증이 교정되면 칼륨이 세포 안으로 들어가 저칼륨혈증이 올 수 있으니 미리 대비한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>적절히 치료하면 24시간 뒤 서고 빨기 반사가 좋아야 한다. 계속 처지면 교정되지 않은 산증이나 독혈증이다. 마른 송아지나 우유를 3일 넘게 못 먹은 송아지는 영양 공급이 필요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">우유 급여</div>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>처지고 빨 생각이 없으면 우유를 최대 12시간 끊는다. 전해질로 1~2일 안에 활력이 돌아오면 1회 1L, 하루 2~4회로 소량부터 다시 먹인다. 활발하고 빨려는 송아지에게서 우유를 끊을 이유는 없다. 설사 송아지는 유당 불내성보다 전반적 흡수불량이 문제라 탄수화물 종류를 바꾸기보다 1회량을 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>우유는 24~36시간 넘게 끊지 않는다. 바이러스성 설사에서 24시간 넘게 끊으면 쇠약·아사 위험이 있다. 설사가 늘어도 일부는 흡수되어 장 회복에 쓰이므로 소량씩 자주 먹인다. 전해질만으로는 유지 에너지가 안 되어 1~2일 넘게 전해질만 주면 체중이 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="56">•</span><span>빠는 송아지는 어미 곁에 두고 포유시킨다. 설사가 심해지거나 처지면 24시간 우유를 끊는다. 한우 같은 비육종 송아지는 조금씩 자주 먹는 데 익숙하므로 1회 1L 넘게 먹이지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">항생제 사용 기준</div>
<p class="bx-num"><span class="bxn" data-n="57">•</span><span>대부분 설사 송아지는 항생제가 필요 없다. 전신 증상이 없는 설사(우유 식욕 정상, 발열 없음)에는 권하지 않는다. 신생 송아지 항생제 사용은 농장 내성균을 늘리는 주된 요인이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>빨기 반사 감소, 탈수 6% 초과, 허약, 기립 불능, 침울 같은 심한 전신 증상이 있으면 대장균 균혈증을 겨냥해 그람음성 항생제를 쓴다. 누운 송아지 190두 중 31%가 균혈증이었다. 분변 대장균은 소장 균주를 대표하지 못해 분변 감수성 검사로 약을 고르지 않고, 여러 마리의 치료 반응으로 판단한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>경구제는 가벼운 송아지의 소장 대장균 과증식 치료용이고, 중등도 이상 전신 증상에는 주사제를 쓴다. 아목시실린(amoxicillin) 10mg/kg 12시간마다 경구가 폐사와 설사 기간을 줄였다. 아미노글리코사이드 경구제는 흡수가 안 되어 확진된 ETEC에만 쓰고 패혈증에는 맞지 않는다. 콜리스틴 경구도 흡수가 안 되어 패혈증 의심 때는 맞지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>주사는 아목시실린 또는 암피실린 10mg/kg 근육 12시간마다, 또는 설파디아진 20mg/kg + 트리메토프림 5mg/kg 정맥·근육 24시간마다 5일을 권한다(허가 외 용량이라 휴약이 길다). 수액 뒤에도 발열·허약이 계속되면 설파제 복합제 25mg/kg 정맥·근육 24시간마다 또는 암피실린 10mg/kg 근육 12시간마다 등을 3~5일 쓴다고 적은 책도 있다. 세프티오퍼(ceftiofur) 2.2mg/kg 근육 24시간마다 3일을 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="61">•</span><span>세프티오퍼와 플루오로퀴놀론은 사람 의료의 최우선 중요 항생제라 첫 치료로 쓰지 않는다. 아미노글리코사이드 주사는 신독성과 긴 휴약 때문에 피한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">대증 치료·예후</div>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>메트스코폴라민, 아트로핀 같은 장운동 억제 성분 제품은 금기이고 과량이면 고창과 장마비를 일으킬 수 있다. 비스무트 서브살리실산은 안전하게 쓸 수 있다. 카올린·펙틴은 전해질 손실을 늘릴 수 있어 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>전신 증상이 있는 설사 송아지에는 비스테로이드 소염제를 권한다. 신장 관류 저하 위험 때문에 수액을 시작한 뒤에 주고, 제4위 궤양을 피하려고 3회를 넘기지 않는다. 멜록시캄(meloxicam) 0.5mg/kg 피하(설사 시작 때)가 섭취량·탈수·분변을 개선했다. 코르티코스테로이드는 권하지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>플루닉신(flunixin meglumine)은 1.1mg/kg 정맥 또는 2.2mg/kg 근육(1.1~2.2mg/kg 정맥 24시간마다로 적은 책도 있다)으로, 대장균 독소에 의한 분비를 줄이고 혈변 송아지의 이환 기간을 줄인다. 혈변이 있을 때만 이환 감소 경향을 보였다는 평가도 있다. 반복 투여는 신장·위장 손상 위험이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>대부분 2~3일에 낫는다. 탈수 유지 능력과 면역글로불린 상태가 예후를 정한다. 저감마글로불린혈증·패혈증 송아지는 폐사 위험이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>침울이 심할수록, 심한 저체온이나 동반 질환이 있으면 예후가 나쁘다. 수막염(목을 뻗고 굽히지 않음), 관절, 눈(공막 혈관 충혈, 전방축농)까지 간 패혈증은 예후 불량이고, 진행된 악액질은 폐사의 믿을 만한 지표다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방</div>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>예방 원칙은 원인체 노출 최소화, 충분한 초유, 특이·비특이 면역 강화, 차단방역이다. 초유는 3~4일간 장 국소 면역을 주고 이후에는 혈중 항체가 장으로 일부 돌아와 제한적으로 보호한다. 초유를 60℃에서 1시간 가열하면 IgG는 그대로이고 세균 수가 줄어 설사가 줄었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>번식우 농가에서는 분만 장소를 배수와 바람막이가 좋은 곳으로 정하고 해마다 옮긴다. 분만 2주 전 이내에 깨끗한 곳으로 옮기고 초산우와 경산우를 따로 관리한다. 분만 기간은 60일 이내로 하고, 송아지 일령 차이가 4주 이내인 무리로 나누며 모든 송아지가 4주령이 될 때까지 무리를 섞지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>어린 송아지부터 먼저 돌보고 설사 송아지는 마지막에 다룬다. 기구는 개체마다 세척·소독한다. 설사 송아지는 격리한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방접종</div>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>ETEC 설사는 생후 3일 안에 오므로 송아지가 스스로 면역을 만들 시간이 없고, 임신 말기 어미소 접종으로 초유 K99 항체를 높인다. 분만 6주·3주 전 접종을 권한다. 기초접종을 분만 18개월 전에 하고 임신 후반에 보강해도 효과가 있었다. 심한 K99 발생 농장에서는 분만까지 10일 넘게 남은 어미소에 접종해도 폐사를 상당히 막았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>로타·코로나 불활화 백신을 건유우에 분만 6주·3주 전 접종하고 이후 매년 분만 4주 전보다 늦지 않게 보강한다. 송아지 경구 생백신은 초유 전에 줘야 해 초유가 늦어지고 야외 효과에 의문이 있다. 백신 맞은 어미소 젖의 중화항체도 분만 3~7일이면 방어 수준 아래로 떨어진다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">로타바이러스성 설사(rotavirus diarrhea)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>대개 5일령~2주령이고 초유를 못 먹으면 24시간에도 온다. 감염 1~3일 뒤 증상이 나와 5~9일 가고, 증상과 함께 3~7일 바이러스를 배출한다. 임신·분만기 어미소가 무증상으로 배출해 송아지에게 옮기는 것이 가장 흔한 감염원이다. 분변에서 9개월까지 살아 분만 장소에 해마다 남는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>이환율 50~100%다. 5일령 미만에서 탈수·쇼크가 잘 오고, 2주령이 넘으면 D-젖산이 많이 생기지 않는 한 드물다. 건강한 송아지의 최대 20%도 배출한다. BVDV와 혼합감염되면 설사가 더 심했다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span>단순 감염은 설사 1~2일, 2차 세균 감염이 있으면 3~5일 간다. 6~12시간마다 상태를 확인한다. 빨기 반응 없는 송아지는 1.3% 중탄산나트륨 2L 정맥주사 후 하트만을 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>융모 손상으로 경구 수액 흡수가 ETEC보다 떨어지지만 일부는 흡수되므로 하루 4~6L를 적극 먹인다. 우유는 24시간 넘게 끊지 않고 소량씩 자주 준다. 장 회복에 며칠~1주가 걸린다. 순수 로타에는 항생제가 필요 없으나 혼합감염 가능성 때문에 심한 송아지는 전신 항생제를 쓸 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>중화항체 1:1024 이상인 초유나 초유 섞은 우유를 생후 14~30일 계속 먹이면 대개 감염을 막는다. 우유·대용유에 초유를 10% 섞어 30일까지 먹여 발생이 준 보고가 있다. 면역 초유 400mL를 2~12일령에 매일 먹여 설사가 41%에서 3%로 준 연구도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>비피막 바이러스라 환경에 강하고 유기물이 있으면 소독제 효과가 거의 없다. 분변을 치운 뒤 표백제, 페놀계, 과황산염 소독제를 10분 넘게 접촉시키고 햇볕에 말린다. 클로르헥시딘에는 비교적 강하고 비누로만 닦으면 오히려 퍼질 수 있다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">코로나바이러스성 설사(coronavirus diarrhea)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>5일령~1개월령에 흔하고 5개월령까지 기록이 있다(평균 7~10일령, 늦게는 3주령에 시작한다고 적은 책도 있다). 감염 3일 뒤부터 약 1주 분변으로, 2일 뒤부터 2주 콧물로 배출하고 정상 어미소의 70% 넘게 분변에서 나오며 분만기와 겨울에 배출이 늘어난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>소장과 대장을 모두 침범해 로타보다 병변이 심하다(점액 출혈성 장결장염). 로타보다 증상이 심하고 폐사율이 높으며, 다른 원인체와 혼합감염되면 폐사율이 50%를 넘을 수 있다. 점액과 혈액 반점이 보이고 폐렴·장염 복합으로 오기도 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="80">•</span><span>단순 감염은 설사 2~3일, 2차 세균 감염이 있으면 4~6일 가고 완전 회복에 몇 주가 걸릴 수 있다. 대장 병변 때문에 설사가 약 1주 간다고 적은 책도 있다. 폐·장 2차 세균 감염에 전신 항생제가 흔히 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>장형은 대부분 수분·전해질 보충과 비스테로이드 소염제 같은 지지요법으로 치료한다. 장형 백신은 여러 가지가 있으나 호흡기형 백신은 아직 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>피막 바이러스라 로타보다 환경에서 오래 못 가고 소독제에 약하다. 건유우에 불활화 로타·코로나 백신을 분만 6주·3주 전, 이후 매년 분만 4주 전에 접종한다. 송아지 출생 시 접종은 면역 어미소 초유보다 믿기 어렵다. 송아지 비강 코로나 생백신이 설사 발생과 정도를 줄였다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">노로·토로바이러스성 설사(noro, torovirus diarrhea)</div>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>토로바이러스는 PCR로 6주령 미만 설사 송아지 분변의 25~30%에서 단독으로 나왔다. 주로 3주령 미만이고 생후 1~3일에 시작하기도 하며 10개월령까지 증상이 있다. 가볍거나 중간 정도 설사를 일으키고 무증상 소의 분변·콧물에서도 나온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>미국 조사에서 노로바이러스는 설사 송아지 44.7%, 건강 송아지 16.3%로 설사 송아지에서 많았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>노로, 토로, 네보, 아이치, 아스트로바이러스는 정상 송아지 분변에서도 나오고 아직 잘 설계된 실험으로 장염을 재현하지 못했다. 대개 혼합감염의 일부로 나오며 관리·예방은 다른 바이러스와 같다.</span></p>
</div>
<div class="bx"><div class="bx-title">대장균성 설사(송아지 백리, colibacillosis)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>1~7일령, 대부분 5일령 미만이다. K99 ETEC에는 생후 48시간이 가장 취약하고 로타와 겹치면 약 10일령까지 늘어난다(대개 3일령 미만이고 로타와 겹치면 7~14일령까지로 적은 책도 있다). 2일령이 지나면 장세포가 K99 부착에 저항성을 얻는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>초급성은 4~12시간 만에 쇼크로 죽는다. 설사가 나오기 전에도 장에 액체가 고여 오른쪽 아랫배를 청진하며 흔들면 출렁이는 소리가 들린다. 고칼륨혈증·저혈당으로 서맥과 부정맥이 오고, 누워 있으면 체온이 정상 이하다. 급성은 12~48시간에 걸쳐 노란색·흰색·녹색의 많은 물설사와 탈수가 진행된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>ETEC는 정맥 수액을 주면 많은 설사가 터지면서 빠르게 좋아지고, 대장균 패혈증은 설사가 적고 늦게 나오며 수액에 극적으로 반응하지 않는다. 관절염·전방축농 같은 국소 감염은 ETEC보다 패혈증·살모넬라를 시사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>부착·미융모소멸·시가독소 대장균은 2일령~4주령(4~28일령으로 적은 책도 있다)에 혈변, 이갈이, 탈수를 일으키고 사람에게 옮을 수 있다. 혈변·발열이 있으면 살모넬라를 감별한다. 분변의 대장균 분리는 병원 인자를 확인하지 않으면 의미가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>초급성 ETEC는 혈장 중탄산과 정맥혈 pH가 낮은 전형적 대사성 산증, 고칼륨혈증, 저혈당을 보인다. 가벼운 저나트륨·저클로르혈증은 일정하지 않고 탈수는 대개 8% 초과다. 3일령 송아지 예: Na 127, K 8.1, Cl 104, HCO3 12, 총 CO2 10mEq/L, 정맥혈 pH 7.09(기준 132~150, 3.9~5.5, 97~106, 20~30, 26~38, 7.35~7.50). 중탄산 6mEq/L, pH 6.98, K 8.4인 송아지도 중탄산 치료로 빨리 회복했다. 클로스트리디움 장독혈증은 ETEC만큼 심한 산증이 드물다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>정맥 수액이 주 치료다. 누워 있거나, 서도 탈수가 뚜렷하고 점막이 차고 마르며 빨기가 약하면 정맥 수액으로 시작하고(송아지 설사 정맥 수액 참조), 걸어 다니고 잘 빨면 경구 수액으로 된다. 설사는 2~4일 묽게 가고 그보다 길면 다른 원인체가 겹친 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>우유는 24~36시간 넘게 끊지 않고 그동안 고품질 경구 전해질을 하루 4~6회 준다. 균주가 감수성이면 경구 아목시실린 10mg/kg 12시간마다 또는 아목시실린·클라불란산 합계 12.5mg/kg 12시간마다 최소 3일이 정당화된다. 장기 반복 사용은 내성을 부르므로 폐사가 많으면 감수성 검사를 한다. 부착·미융모소멸·시가독소 대장균의 심한 혈변에는 전혈 1~2L 수혈이 필요할 수 있다. 항생제 용량은 송아지 설사 항생제 사용 기준을 따른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>발생 농장에서는 감수성 있는 항생제를 생후 3일간 하루 1회 주면 설사 예방에 효과가 높다. 백신 맞은 어미소가 분만하기 전까지 K99 단클론항체를 쓸 수 있으나 야외 효과는 낮을 수 있고, 출생 직후 초유 전에 줘야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>K99 초유 항체는 다른 F형(F41 등) ETEC를 교차 방어하지 못한다. 초유가 ETEC보다 먼저 장에 들어가야 한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">살모넬라증(salmonellosis)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>발열과 설사가 핵심이고 발열이 설사보다 먼저 올 수 있다. 신선 혈액·점액이나 혈병이 섞이고 정화조 냄새가 난다. 2주령~2개월령에 가장 많지만 어느 나이든 생기고, 오염이 심하면 생후 며칠 안에도 심하게 앓는다. 폐렴, 관절염, 수막염이 따를 수 있다. 지속감염(PI) BVDV 송아지는 위험이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>대개 2개월령 미만(1일~6개월)이다. S. Typhimurium은 평균 14일령(1~35일)에 주로 장 병변, S. Dublin은 4~8주령에 호흡곤란·급사가 주이고 사지·귀·꼬리 건성 괴저가 올 수 있다. 섬유소 막이 점막 탈락처럼 보이고 단백 소실성 장병증을 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>설사·무른 변이 약 7~10일, 증상이 사라진 뒤 2~3주 증체 불량이 있다. 회복 후 최대 6개월 분변으로 균을 배출한다. 송아지에서 폐렴과 사지 말단 건성 괴저가 합병될 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>수액과 항생제가 기본이다. ETEC보다 나트륨·염소 손실이 심하고 설사가 더 오래 가며 만성이 될 수 있다. 혈액 손실과 저단백혈증에 전혈 수혈이 필요할 수 있다. 쇼크에는 코르티코스테로이드나 플루닉신을 정맥 수액과 함께 1회 쓰고 반복은 피한다. 고장식염수는 쓰지 않고 경구 전해질 흡수율은 약 60%다.</span></p>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>항생제는 초급성·급성에 쓰고 5~7일 계속한다. 가벼운 경우, 무증상, 만성은 이득이 없고 무리 전체 경구 테트라사이클린은 금기다. 항생제가 균 배출을 멈추지는 못한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>플로르페니콜 20mg/kg 근육 48시간마다, 세프티오퍼 2.2mg/kg 근육·피하 12시간마다 4~7일, 플루닉신 0.5mg/kg 정맥 첫날 12시간마다 이후 24시간마다(신장 질환이 있으면 쓰지 않는다).</span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>설파디아진 25mg/kg + 트리메토프림 5mg/kg 경구 하루 1회 5일이 실험 감염 폐사를 줄였다. 경구 트리메토프림은 반추위에서 파괴되므로 3주령 미만에만 쓰고 그 이상은 정맥으로 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>사람에게 옮을 수 있으므로 설사 송아지를 다룰 때 위생에 주의한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">콕시듐증(coccidiosis)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>3주령~6개월령에 흔하다. E. bovis·E. zuernii 잠복기는 15~20일, 배출 기간은 약 11일이다. 감염의 최대 95%는 눈에 띄지 않는 증체 저하다. 이유 후 합사 때(8~16주령) 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>무리 사육 송아지에서는 혈변보다 묽은 변, 마른 몸, 거친 털이 주 증상이고 가장 심한 개체가 무리 전체 문제를 알린다. 신경형(근육 떨림, 과민, 안진, 발작)은 폐사율이 높다. 감별은 살모넬라, BVD, 선충, 영양 불량이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>오시스트는 설사 시작 2~4일 뒤 나오고 분변 1g당 5,000개 이상이면 의미 있다고 보지만 건강한 소에서도 소량 나오므로 그것만으로 진단하지 않는다. 분변 검사가 낮거나 0이어도 심한 콕시듐증일 수 있어 여러 마리를 검사한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료</div>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>설파메타진(설파디미딘) 140mg/kg 3일, 또는 첫날 247mg/kg 후 2~5일 123mg/kg(110mg/kg 5일로 적은 책도 있다). 암프롤리움 10mg/kg 5일. 급성 발생에는 디클라주릴·톨트라주릴이 특히 유용하다. 설사 송아지는 무리에서 빼고 전해질·포도당 같은 지지요법을 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>설파퀴녹살린 13.2mg/kg 경구 하루 1회 + 암프롤리움 10mg/kg 5일이 임상 반응이 좋다. 설파제를 쓸 때는 암프롤리움을 함께 쓰면 좋다. 이급후증(tenesmus)이 심하면 경막외 마취로 쉬게 한다. 기생충학자들은 임상 콕시듐증 치료 효과에 의문을 제기한다. 암프롤리움은 회백질연화증 위험을 높일 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방</div>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>톨트라주릴 20mg/kg 경구 1회(시기는 사육 체계에 따라; 15mg/kg 1회로 적은 책도 있다), 디클라주릴 1mg/kg 1회(14일 뒤 2회째 가능), 데코퀴네이트 0.5mg/kg 28~30일(0.5~1.0mg/kg/일 최소 28일 사료 첨가로 적은 책도 있다), 라살로시드 1mg/kg 연속, 신생 송아지 대용유에 라살로시드 80mg/kg. 백신은 없다. 합사·밀사 같은 위험 시기에 예방적으로 쓰면 면역 형성을 방해하지 않고 임상형을 막는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>예방약 대부분은 먹이는 동안만 효과가 있어 끊기면 위험해진다. 이온운반체(모넨신·라살로시드)는 어린 송아지에서 독성(수막염·식염중독 비슷한 신경 증상)이 오기 쉬워 용량을 정확히 한다. 데코퀴네이트는 어린 송아지에 독성이 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>건조와 햇볕이 오시스트를 죽인다. 밀사 금지, 분뇨 축적과 진흙탕 제거, 사료를 바닥에서 띄워 급여한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">크립토스포리디움증(cryptosporidiosis)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>1~4주령에 감염되어 4~14일 증상을 보이고 1~3주령에 배출이 가장 많다(5~28일령에 가장 흔하다고 적은 책도 있다). 설사 외에 침울, 탈수, 식욕부진, 발열, 이급후증(tenesmus)이 있을 수 있고 회복에 4~6주 걸리기도 한다. 4개월령이 넘으면 무증상이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>3주령 미만 이환율은 50%를 넘지만 혼합감염이 없고 지지요법이 적절하면 폐사율은 낮다. 단독이면 설사가 7일까지 가지만 대개 빨기는 유지하고 대개 7일 이내에 저절로 낫는다. 방목 번식우 송아지 발생은 젖소보다 심해 폐사율 30%까지 보고됐다. 추운 날씨, 젖은 깔짚, 영양 부족 송아지가 더 잘 앓는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>치료는 거의 지지요법이다. 가능하면 생유나 좋은 대용유를 계속 먹이고 전해질만 24시간 넘게 주지 않는다. 우유는 하루 최소 2회, 전해질은 그 사이(우유 급여 1~2시간 뒤)에 준다. 세균 혼합감염이 없으면 항생제는 필요 없다. 소염제는 탈수 송아지에 신중히 쓴다(탈수와 신독성 약물이 겹치면 급성 신부전).</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>라살로시드는 송아지에 독성인 고용량(8mg/kg)에서만 배출을 줄였고 0.8mg/kg는 효과가 없었다. 콕시듐 예방 허가 용량은 1mg/kg/일이다. 신생 송아지에 라살로시드 100mg을 하루 2회 먹여 근육 괴사가 생긴 보고가 있다. 일반 콕시듐약은 독성 용량의 라살로시드 외에는 효과가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>할로푸지논(halofuginone lactate) 100μg/kg 7일이 여러 나라에서 예방용으로 허가되어 있다(60~125μg/kg로 적은 책도 있다). 오시스트 배출과 설사 시작을 늦추지만 설사 발생·정도는 크게 줄이지 못할 수 있다. 생후 첫 1주 매일 예방 투여는 송아지 간 교차감염을 줄이는 관리와 함께할 때 효과가 있다. 안전역이 좁아 용량을 엄수하고 심한 탈수 송아지에는 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>일반 소독제는 효과가 없다. 5% 암모니아, 3~6% 과산화수소, 10% 포르말린 식염수, 동결, 2% 크레졸 소독제가 유효하다. 물속에서 12주 넘게 산다. 과황산칼륨(과산화) 계열 소독제는 듣지 않는다고 한 책과 실험 조건에서 감염력을 줄였다고 한 책이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>개체 사육하고, 세척·소독해 새 바닥에 옮긴 송아지 우리를 쓴다. 이전 송아지가 쓰던 땅은 몇 달 오염되므로 깔짚을 모두 치우고 며칠~몇 주 햇볕에 말린다. 급여 기구는 개체별로 쓰고, 일은 어린 송아지에서 나이 든 송아지로, 건강한 송아지에서 아픈 송아지로 한다. 현재 쓸 수 있는 수동·능동 면역법이 없다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">유두분선충증(Strongyloides papillosus)</div>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>나이 든 소의 피하에 모인 유충이 분만이 다가오면 유선으로 옮겨 신생 송아지가 젖으로 감염되고, 생후 약 1주부터 장에 산란 암컷이 있을 수 있다. 유충은 주로 발굽 사이 피부로 들어간다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>자연 감염은 간헐 설사, 혈액·점액 변, 기침, 발굽 사이 피부염(파행, 발 구르기, 발 물기), 농포성 피부염을 일으킨다. 실험 감염 송아지가 심정지로 죽었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>감염원을 없애고 관리를 바꾸면 저절로 회복할 수 있다. 임신 말기 어미소 구충은 유즙 감염을 줄인다.</span></p>
</div>
<div class="bx"><div class="bx-title">포유송아지 제1위 부패증(ruminal drinker)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>양동이로 마시거나, 우유 온도가 들쭉날쭉하거나, 스트레스를 받거나, 너무 낮은 위치에서 먹거나, 유속이 빠르면 식도구가 닫히지 않는다. 우유를 강제로 먹이거나, 폐렴·흉막염·중이염·경정맥염처럼 아픈 병이 있으면 식도구 반사가 일어나지 않아 급성형이 온다. 불규칙한 급여 시간, 저질 대용유, 찬 우유, 이유 후 다시 우유 급여, 양동이 급여는 만성형의 원인이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>3~8주령, 주로 양동이 급여 송아지에서 만성·간헐 고창, 발육 부진, 점토 같은 변을 보인다. 급성 고창은 급여 후 1시간 안에 올 수 있다. 사료를 하루 약 0.9kg 넘게 먹는 2개월령 이상 송아지에 우유를 계속 주거나, 이유기에 아파서 우유를 다시 먹이는 경우에도 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>우유 거부, 빨기 반사 약화, 재발성 고창, 부푼 왼쪽 배의 출렁이는 소리를 보이고, 대사성 산증으로 심하게 처져 앞다리를 뒤로 뻗은 자세를 보이기도 하며 산증으로 죽을 수 있다. D-젖산 축적으로 심한 산증과 신경 증상이 오며, 눈꺼풀 반사 소실이 D-젖산 상승의 가장 좋은 임상 지표다. 위관을 넣으면 회색 악취액이 역류한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>5~23일령 송아지에 우유를 위관으로 매일 넣은 실험에서 첫 급여 뒤 평균 pH가 6.7에서 4.9로 떨어지고 이후 4~5 사이였다. 액은 우유 같고 신 냄새가 나며 L·D-젖산이 모두 늘고, 며칠 안에 D-젖산 대사성 산증이 왔다. 제1위 pH가 비정상적으로 낮다(6 미만)고 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>제1위 부패는 pH 7 이상, 제4위 역류는 낮거나 정상이다. 제1위액 2mL를 우유 2mL와 섞어 응고하면 레닌이 있는 것으로 제4위 역류를 뜻한다. 송아지 제1위액 클로라이드는 55~102mmol/L로 성우(25)보다 높아 제4위 역류 판정에 쓸 수 없다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>위관으로 제1위에 남은 발효 우유를 빼내 세척하고 수액으로 산증을 교정한다. 부패균을 줄이려고 항생제를 쓸 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>D-젖산 산증에는 중탄산나트륨을 정맥 또는 경구로 준다. 가벼우면 중탄산 함유 경구 수액, 염기결핍 10mEq/L 초과면 정맥 수액이 필요하다. 필요량(mEq) = 염기결핍 × 체중(kg) × 0.6.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>D-젖산 산증의 가장 일관된 검사 소견은 대사성 산증(중탄산 저하)과 음이온차 증가다. 계산의 0.6은 수액량이 더 중요한 L-젖산 탈수성 산증 때보다 큰 값이다. 중탄산나트륨은 신장 배설 증가와 장내 생성 감소로 몇 시간 안에 D-젖산을 낮춘다.</span></p>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>예방은 1회 급여량을 줄이고, 양동이 대신 젖꼭지로 먹이며, 송아지 사료를 일찍 먹여 반추위 발달을 돕는 것이다. 체온 정도의 우유를 젖병으로 조금씩 먹이고 하루 총량은 횟수를 늘려 유지한다. 며칠령 이후에는 우유를 위관으로 먹이지 않는다. 대용유는 정확한 농도로 일정하게 탄다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>반추위 산증도 D-젖산 산증을 일으키고 가장 일관된 소견은 침울이다. 중탄산이 풍부한 수액을 정맥이나 경구로 줘 산증과 탈수를 교정한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">포유송아지 제4위 고창증(abomasal bloat)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>젖소 송아지에 많고 산발적이다. 위험 요인은 고삼투압 대용유·경구 전해질, 잘못 탄 대용유, 하루 1회 많은 양, 찬 우유, 물 미제공, 불규칙한 급여 시간, 초유 이행 실패다. 가스 생성균과 제4위 배출 지연이 함께 작용하는 것으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>식욕 절폐, 양쪽 또는 오른쪽 복부 팽만, 고창을 보이고 흔히 48시간 안에 급사한다. 고혈당과 요당(소변 스틱)이 보고됐다. 고창과 복통이 먼저 오고 설사는 양이 적으며, 치명률이 75~100%로 높다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>송아지를 등 대고 눕혀 배꼽과 칼돌기 사이 가장 높은 곳에 14G, 50mm 바늘을 찔러 가스를 뺀다(21두 중 20두 합병증 없음). 선 채로 빼면 완전히 빠지지 않고 복막염 위험이 크다. 반복 천자도 복막염 위험이 높아 다시 차거나 나빠지면 오른쪽 옆구리를 열어 염전을 확인한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>왼쪽 옆구리를 맹목적으로 투관하지 않는다. 늘어난 것은 제4위인데 반추위로 오인해 찌르면 얇아진 제4위가 찢어진다. 위관 감압은 효과가 적다. 산화마그네슘 하제는 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>정맥 수액으로 탈수·전해질을 교정하고 클로스트리디움을 겨냥해 프로카인 페니실린 주사나 경구 베타락탐을 쓴다. 프로카인 페니실린은 22,000U/kg 근육 하루 1회. 경구 페니실린이나 테트라사이클린이 가스 생성을 줄일 수 있다. 클로람페니콜은 미국 등 여러 나라에서 식용동물 사용이 금지돼 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>예방은 양동이 대신 젖병, 급여 횟수를 늘리고 1회량을 줄이며 우유를 체온으로 유지해 먹이는 것이다. 대용유 종류, 1회량, 급여 시간, 온도, 타는 방법, 기구 세척을 점검한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">송아지 분석증(hair ball)</div>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>이에 시달려 몸을 계속 핥는 송아지에서 털뭉치가 많고, 자라는 송아지가 털뭉치로 장이 막힐 수 있다. 털뭉치는 송아지 복부 팽만의 원인 중 하나다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>내과 치료에 반응하지 않는 제4위 고창에서는 제4위 절개로 털뭉치와 부패한 우유를 꺼낼 수 있다.</span></p>
</div>
<div class="bx"><div class="bx-title">허약 송아지(weak calf)</div>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>임신 말기 어미소에 단백질이 부족한 사료를 먹이고 송아지가 적정 온도보다 훨씬 추운 곳에서 태어나면 허약 송아지 증후군이 재현됐다. 임신 3기 어미소는 하루 조단백 0.9kg이 필요하고, 450kg 소는 조단백 10% 이상의 좋은 건초를 건물로 하루 9.9kg 먹어야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>신생 송아지 산증은 난산, 긴 분만, 설사가 원인이고 탈수와 따로 올 수 있다. 침울, 흉골와위~옆으로 누움, 빨기 반사 소실을 보인다. 혈액 pH 7.38 미만과 중탄산 결핍 8% 이상(원문 표기, 단위 확인 필요)으로 진단한다. 가벼우면 경구 전해질·중탄산(또는 전구물질), 중등도 이상은 중탄산 두당 200~400mmol 정맥주사가 가장 좋다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>출생~24시간 동맥혈 평균은 pH 7.30(출생)→7.36(30분)→7.38(4시간)→7.42(12시간)→7.43(24시간), PCO2 57→44mmHg, PO2 45→67mmHg, 중탄산 27~28mmol/L, 염기과잉 0.9~4.4다. pH·중탄산·염기과잉은 정맥혈로도 되지만 PaO2·PaCO2는 동맥혈(뒤귓바퀴동맥, 상완동맥)이 필요하다. 얼음에 두면 4시간까지 믿을 만하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>난산 송아지는 호흡성·대사성 산증이 오지만 대개 몇 시간 안에 스스로 교정한다. 오래 가면 PaO2 45mmHg 미만, PaCO2 57mmHg 초과, pH 7.3 미만이 흔하고 서지 못함, 빨기 약화, 체온 36.5℃ 미만, 서맥(분당 80회 미만)을 보인다. 환기가 나쁜 저산소 송아지에 중탄산나트륨은 고탄산혈증과 뇌 산증을 키울 수 있어 권하지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>저질 대용유(단백질 22% 미만, 지방 20% 미만)를 쓰거나 묽게 타거나 양이 부족하면 송아지가 마르고, 털이 거칠고 군데군데 빠지며, 설사하고 배고파한다. 송아지는 자당을 잘 소화하지 못해 설사 송아지의 전해질에 설탕을 넣으면 수분·전해질 손실이 늘어난다.</span></p>
</div>
<div class="bx"><div class="bx-title">송아지 비타민 결핍증(vitamin deficiencies)</div>
<div class="bx-sub"><div class="bx-subtitle">비타민A 결핍증</div>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>결핍 어미소의 송아지는 눈이 멀고 이마가 둥글게 솟고 앞무릎 관절이 두꺼우며 약하게 태어난다. 결핍 송아지는 식욕부진, 발육 불량, 실명, 설사, 폐렴을 보인다. 첫 증상은 흔히 어두운 곳에서 장애물을 피하지 못하는 야맹증이다. 소는 결막 건조보다 눈물 과다가 나타난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>비타민A 결핍 소는 동공 대광반사가 없고, 회백질연화증·납중독 송아지는 대광반사가 남아 있어 구별된다. 야맹증과 초기 망막 변성은 회복되지만 시신경관 협착에 의한 시신경 압박은 되돌릴 수 없다. 진행된 증상은 되돌릴 수 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>440IU/kg 주사 후 사료를 보강할 때까지 50~60일마다 6,000IU/kg 주사한다. 결핍 송아지는 카로틴을 비타민A로 바꾸지 못해 고용량 경구 투여가 중요하다. 송아지 대용유 권장량은 건물 1kg당 11,000IU다. 크립토 감염 송아지는 장 흡수가 떨어져 주사로 준다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비타민D 결핍증(구루병)</div>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>긴 뼈가 약하고 휘며, 앞무릎·비절 관절이 커지고 아프며, 갈비뼈 염주, 뻣뻣한 걸음, 뒷다리 끌기, 등 굽음을 보인다. 현대 송아지 사육에서 구루병에 의한 병적 골절·사지 변형은 극히 드물어졌다. 성장기 무리에서 골절이 잇따르면 사료의 칼슘·인·비타민D를 점검한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>주사용 비타민D가 가장 효과적이고 빨리 교정되지만 뼈 변형과 연골 손실은 되돌릴 수 없다. 과량 투여가 주된 부작용이다. 가둬 기르는 시간을 줄이고 햇볕을 쬐게 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비타민E·셀레늄 결핍증(백근병)</div>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>3개월령 미만에 많다. 송아지는 주로 2~4개월령에 봄·여름 방목 중 운동과 함께 오지만 선천·신생 송아지형도 있다. 결핍 농장에서는 허약 송아지와 설사, 높은 폐사가 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>빈맥(분당 120회 초과)과 부정맥이 가장 흔한 심장 증상이고 운동이나 보정만으로도 급사할 수 있다. 혀·삼킴 근육이 침범되면 빨기가 어렵고 우유를 흡인해 폐렴이 온다. 소변 스틱의 잠혈(미오글로빈)·단백 양성이 진단에 도움이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>비타민E·셀레늄은 정맥 대신 근육·피하로 주고(아나필락시스 위험) 72시간 간격으로 3~4회 반복하며, 뛰지 못하게 좁은 우리에 둔다. 셀레늄 허가 용량은 0.055~0.067mg/kg 근육·피하이고 크게 늘리면 셀레늄 중독 위험이 있다. 복합제의 비타민E는 보존제 수준이라 비타민E 보충에는 부족하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>이미 생긴 병변은 되돌릴 수 없다. 진단 후 3일을 살면 예후가 좋다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">송아지 제대정맥염(omphalophlebitis)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>신생 송아지에서 가장 흔한 병의 하나로 1.3~29.9%에서 생긴다. 흔한 분리균은 Trueperella pyogenes, 대장균, Proteus, 엔테로코커스, 연쇄상구균, 포도상구균이다. 초유 이행 실패 송아지에서 위험이 높다. 진한 요오드를 지나치게 쓰면 탯줄 조직이 괴사해 오히려 감염이 늘 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>요막관이 가장 흔히, 제동맥이 가장 드물게 침범된다. 겉 배꼽이 말라 정상으로 보여도 속의 요막관·제정맥·제동맥 감염으로 심하게 앓을 수 있다. 송아지 뒤에 서서 배꼽 위쪽을 양손으로 모아 누르면 커지고 아픈 구조물을 찾을 수 있다. 요막관이 복벽에 붙으면 방광염으로 빈뇨·배뇨곤란을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>잠복 감염은 몇 주령이 되어서야 발열·침울과 복막염, 관절염, 요로감염으로 나타난다. 배꼽 밖 농양은 아프고 따뜻하며 환납되지 않고 점점 커진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>다른 이상 없이 연조직염·혈관 비대만 있는 신생 송아지는 딱지를 떼어 배액하고 페니실린 22,000U/kg 또는 암피실린 11mg/kg를 하루 1~2회 준다. 발열과 패혈증 징후가 있으면 초유 이행을 확인하고 그람음성까지 덮는 집중 항생제 후 안정되면(1~3일) 배꼽을 절제한다. 관절염·요로감염이 동반되면 절제와 함께 7~21일 항생제가 필요하다. 배꼽 밖 농양은 천자로 고름을 확인하고 넓게 배액해 매일 세척한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>일찍 항생제와 지지요법을 하면 농양이 생기기 전에 나을 수 있지만 자리 잡은 감염은 대개 수술로 제거한다. 일부는 장기간 광범위 항생제로 낫고 내과 치료가 듣지 않으면 수술을 권한다. 수동면역이 충분하고 관절 등이 침범되지 않았으면 예후가 낫다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>예방은 분만 우리 위생, 신생 송아지의 분만 우리 체류 시간 단축, 초유 관리, 탯줄 소독이다. 7% 요오드 팅크와 클로르헥시딘 등의 예방 효과가 비슷했다. 출생 시와 5일 안에 배꼽의 종창·습기·통증을 확인한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">송아지 배꼽탈장(umbilical hernia)</div>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>유전 소인이 있고 배꼽 감염에 이어 생기기도 한다. 단순 탈장은 지름 1~10cm로 부드럽고 환납되며 아프지 않고, 그물막과 제4위가 만져질 수 있다. 4cm 미만은 3~4개월령까지 저절로 닫히는 경우가 많다(소에서 저절로 닫히는 경우가 드물다고 적은 책도 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>탈장은 뚜렷한 탈장륜이 있고 환납될 수 있다. 농양은 따뜻하고 고름이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>4~5cm보다 큰 탈장은 수술을 고려한다. 4cm 미만 작은 탈장은 진정·국소마취 후 옆으로 눕혀 환납하고 고무링(elastrator band)을 복벽 가까이 걸어 금속 핀 2개를 교차시켜 고정하는 방법을 쓸 수 있다. 큰 송아지는 수술 전 48시간 절식하고, 모든 개체에 파상풍 예방을 한다. 수술 후 운동을 제한하고 패혈증·봉합 파열을 관찰한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>손가락 3개 폭 미만은 손으로 환납한 뒤 배 둘레를 탄력 접착테이프로 몇 주 감아 두는 방법이 성공한 예가 있다(빨리 자라면 1~2주마다 교체). 크거나 다른 방법이 실패하면 수술한다.</span></p>
</div>
<div class="bx"><div class="bx-title">송아지 물중독(water intoxication)</div>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>2~4개월령에 가장 많다. 우유로 키우던 송아지에게 처음 물을 무제한 주면 생긴다. 목마른 송아지는 마실 때 식도구가 닫혀 물이 제4위로 바로 간다. 실험적으로 체중의 12% 물 투여로 재현됐다. 적혈구는 4~5개월령에 삼투 충격에 가장 약하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>대부분 몇 분~몇 시간 안에 짙은 붉은 오줌을 눈다. 찬물이면 빈맥과 저체온이 온다. 심하면 침울, 경련, 혼수 같은 신경 증상과 호흡곤란, 혈색소뇨, 폐사가 온다. 2시간 만에 죽기도 하지만 대부분 후유증 없이 회복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>혈색소뇨와 병력으로 진단하고 미열이 있을 수 있다. 전해질을 넣지 않은 저장성 수액을 정맥으로 많이 줘도 같은 용혈이 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>증상이 나왔을 때는 이미 용혈이 일어난 뒤라 보통 치료하지 않는다. 물을 일시 제한하고 지지요법을 한다. 저나트륨·저클로르혈증 교정에 7.2% 고장식염수 5mL/kg를 5분에 걸쳐 정맥주사하기도 하나 경증은 필요 없다. 혈중 나트륨이 110mmol/L 정도로 낮고 신경 증상이 있으면 고장식염수, 만니톨, 코르티코스테로이드가 도움이 될 수 있고, 나트륨은 과교정 없이 120~125mmol/L까지만 올린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>목마른 소가 한꺼번에 무제한 마시지 않게 하고, 송아지는 태어날 때부터 물을 자유롭게 먹게 한다.</span></p>
</div>
</div>
`;
}
function med_sysHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 전신·감염</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">유산 질병 공통</div>
<p class="bx-num"><span class="bxn" data-n="1">•</span><span>임신 42일 전 손실은 배아 사멸로 따로 본다. 소는 임신 180~200일까지 주로 황체가 프로게스테론을 만들고, 그 뒤로 태반이 넘겨받는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="2">•</span><span>비육우 우군은 2~3%, 젖소 우군은 10%까지를 배경 유산으로 보고 그보다 많으면 조사한다. 우군 유산율 5% 미만, 이상적으로 1~2%를 목표로 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="3">•</span><span>시료를 다 보내도 원인 규명률은 약 30%다. 유산은 수주~수개월 전에 생긴 일의 결과인 경우가 많다. 혈청은 유산 시와 2~3주 뒤 쌍혈청으로 받고, 우군의 10% 정도를 채혈하면 해석이 쉽다.</span></p>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>태아는 통째로 보내는 것이 가장 좋고, 아니면 간·뇌·흉선·심장·비장·신장·위 내용물·폐와 태반(자엽 포함)을 냉장해 보낸다. 태아를 못 보내면 폐, 위 내용물, 간, 비장, 태반을 배양용 냉장, 바이러스용 냉동, 조직용 포르말린으로 보낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>조사는 유산 임신 시기, 종모우, 미경산·경산 구분, 입식 날짜, 계절, 접종 내역, 개 유무를 비교하고 임신우를 재검해 공태·미이라·자궁축농증을 찾는다.</span></p>
</div>
<div class="bx"><div class="bx-title">소바이러스성설사(BVD/MD)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>법정전염병이 아니다(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>소바이러스성설사 바이러스(BVDV)는 플라비바이러스과 페스티바이러스속 RNA 바이러스다. 유전자형(1형·2형)과 생물형(세포변성 cp주·비세포변성 ncp주)을 따로 나누며, 지속감염과 관련된 것은 비세포변성형뿐이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>바이러스는 눈물, 침, 오줌 등 분비물로 배출되고 서늘한 곳에서 며칠 살아 기구와 파리로도 옮는다. 가장 큰 유입 위험은 지속감염우 입식, 다음이 방목지 공유와 미접종이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신 시기별 결과·지속감염우</div>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>교배 무렵 감염되면 수태가 안 되고, 첫 45일 감염은 배아 사멸을 일으키며 유산은 어느 시기에나 생긴다. 태아 감염은 임신 약 35일 태반 부착 뒤에 생긴다. 태아는 노출 10~27일 뒤 죽지만 배출은 최대 50일 늦어 대개 자가융해된다. 감수성 우군의 유산율은 25%에 이를 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>지속감염은 임신 45~145일(다른 곳은 125일 이전) 감염으로 생긴다(18~125일 비세포변성주 감염으로 적은 책도 있다). 2·3분기(100~150일) 감염은 소뇌형성부전, 망막위축, 백내장, 성장지연, 폐형성부전 같은 기형을 일으키고, 150일 이후 감염은 대개 회복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>임신 후기 감염으로 중화항체를 갖고 태어난 송아지는 생후 10개월 안에 중병이 더 잘 생기고, 성성숙이 늦거나 미경산우 때 수태가 덜 될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>지속감염우는 수명이 짧아 80% 넘게 2세 전에 죽고, 전체 소의 지속감염우 비율은 보통 0.05% 미만이다. 지속감염 어미는 항상 지속감염 송아지를 낳으므로 송아지가 음성이면 어미도 음성이다. 지속감염 송아지는 대부분 지속감염 어미가 아니라 임신 중 급성 감염된 어미에서 나오므로, 송아지가 양성이면 어미를 검사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>구입한 임신우는 뱃속에 지속감염 송아지를 품고 들어올 수 있고, 어미를 검사해서는 이를 알 수 없다. 이런 소가 낳은 송아지는 분만 직후 바로 지속감염 검사를 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상</div>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>급성 감염은 대부분 10~14일에 회복한다. 점막병은 지속감염우가 세포변성형에 중복감염(자기 바이러스의 돌연변이, 세포변성형 생독백신 접종 포함)되어 생기고, 심한 설사·침흘림·소화관 출혈과 미란을 보이며 치명률이 매우 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>유전자형 2형은 혈소판감소에 의한 출혈(채혈 부위 지혈 지연, 공막·눈꺼풀 안쪽·뺨 안쪽·아래 잇몸·혀·입천장 점막 출혈), 발열, 폐렴, 설사, 급사를 감염우의 10~100%에서 일으킨다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="16">•</span><span>급성 감염은 혈청, 전혈, 코 면봉에서 바이러스 분리나 RT-PCR, 또는 급성기·회복기 쌍혈청의 중화항체 4배 상승으로 진단한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>지속감염은 3주 간격으로 두 번 검출되면 확인된다. 귀 조직 항원 ELISA나 면역조직화학은 한 번 검사로 찾고 초유 항체가 있는 송아지와 생독백신 접종우에도 쓸 수 있다. 급성 감염도 가끔 양성이라 값비싼 소는 30일 뒤 혈액으로 재검한다. RT-PCR은 시료를 합쳐 검사할 수 있지만 항원 ELISA는 2개 넘게 합치면 부정확하다. 20분 현장 ELISA도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span>우군 감시는 BVD 접종을 하지 않은 6~12개월령 소에서 중화항체가 나오면 우군 안에 바이러스가 돌고 있다는 뜻이다. 초유 먹기 전 신생 송아지의 중화항체 검사도 같은 의미다. 지속감염우가 적은 우군은 전두수 검사보다 신규 입식우, 신생 송아지, 유산태아, 병든 소·죽은 소를 검사하는 편이 경제적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>유산태아에는 특이 병변이 없고 바이러스 분리도 잘 안 되며, 어미 항체가는 유산 전에 이미 올라 있어 진단 가치가 적다. 선천감염 송아지는 소뇌형성부전이 육안으로 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>감별은 유산에서 IBR, 네오스포라병, 렙토스피라병, 브루셀라병, 송아지 설사에서 신생 송아지 설사 원인 전부, 혈소판감소 출혈에서 스위트클로버 중독, 쿠마린 중독, 비타민 K 결핍이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>특이 치료는 없다. 스트레스를 피하고 탈수에 수액, 2차 감염에 항생제를 쓴다. 부신피질호르몬과 비스테로이드소염제는 소화관 미란을 악화시켜 쓰지 않는다. 혈소판감소 출혈에는 BLV 음성·비지속감염 공혈우 신선 전혈을 성우 4L, 송아지 1~2L 수혈하고 주사·수술을 피한다. 심한 소는 대개 죽는 점막병일 수 있고 지속감염우는 치료법이 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>백신은 1형과 2형 항원을 모두 포함하는 것이 낫다. 번식 최소 30일 전에 방어면역을 만들고 번식 직전 접종은 피한다. 생독백신이 태아감염 예방에 낫고 사독백신은 기초 2회째를 빠뜨리면 실패한다. 생독백신은 면역억제에 주의하고, 백신만 믿지 말고 차단방역과 지속감염우 검사를 함께 한다. 초유 항체는 송아지를 2~4개월 보호한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>입식우는 3주 격리하며 지속감염 검사, 구입 임신우는 낳은 송아지를 검사한 뒤 합사, 정액은 음성 종모우 것만 쓴다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">소전염성비기관염(IBR) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="24">•</span><span>제3종 가축전염병(현행 가축전염병예방법). 원인은 소 허피스바이러스 1형(BHV-1)이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>콧물, 비말, 생식기 분비물, 수정란, 정액, 태아액으로 옮고 평생 잠복하며, 수송 같은 스트레스와 덱사메타손으로 재활성화된다. 정액에서는 12개월 저장 뒤에도 분리된다. 수소는 증상 없이 평생 간헐 배출할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>호흡기형은 삼차신경절, 생식기형은 천추신경절에 잠복한다. 잠복우는 항체가 늘 검출되지는 않으며, 잠복우에 접종해도 야외주 배출은 막지 못한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>호흡기형 균주(BHV-1.1)와 생식기형 균주(BHV-1.2)는 유전적으로 구별되고 한 우군에서 두 균주가 동시에 도는 일은 드물며, 생식기형 유행 뒤에는 대개 유산이 따르지 않는다(다른 형보다 덜 흔하지만 늘 위험이 있다고 적은 책도 있다).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상</div>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>생식기형은 잠복기 1~3일, 우군의 60~90%로 빠르게 퍼진다. 점액농성 질 분비물, 배뇨통, 림프소포 위 농포가 3mm 미만 궤양에서 합쳐진 미란으로 진행하고, 수소 귀두포피염도 아파 암수 모두 교미를 꺼린다. 10~30일에 가라앉고 면역은 일시적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="29">•</span><span>수소는 포피 유착으로 번식력이 떨어질 수 있다. 오염 정액으로 수정하면 자궁내막염, 수태 불량, 짧은 발정이 올 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="30">•</span><span>유산은 보통 임신 마지막 3분기(범위 4~8개월)에 생기고 호흡기형 균주에 의한 것이 많다(임신 5~6개월이 가장 감수성이 높다고 적은 책도 있다). 태아는 48시간 안에 죽지만 배출까지 최대 7일이 걸려 자가융해가 심하고, 감염 뒤 100일까지도 유산할 수 있다. 급성기나 그 뒤 4~8주 안에 유산한다. 바이러스는 태반에 3개월까지 잠복할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>접종하지 않은 임신우는 최대 25%가 유산한다(면역 없는 우군은 25~60%까지로 적은 책도 있다). 면역 있는 어미는 유산하지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>생식기형은 특징적인 생식기 병변만으로 임상 진단이 충분하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>유산태아는 간, 부신, 신장, 폐가 좋은 시료다. 간에 핵내봉입체가 자주 보인다. 태아와 태반을 함께 보내야 진단율이 오른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>혈청은 2~3주 간격 쌍혈청이 필요하고 단일 시료는 역가가 높아도 가치가 적다. 유산은 감염 뒤 한참 지나 일어나 역가가 이미 최고치라 유산 시점에서 역가 상승을 잡을 수 없다. 감별은 BVD, 곰팡이성 유산, 네오스포라병, 렙토스피라병이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>적절한 치료법이 없다. 보조 치료를 하고, 비스테로이드소염제가 증상을 덜어줄 수 있으며, 2차 세균감염에 항생제를 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>생독백신 근육 접종은 임신우에 유산을 일으킬 수 있고, 면역 없는 임신우는 생독백신 주사 90일 뒤에도 유산할 수 있다. 이행항체는 주사형 반응을 떨어뜨리지만 비강 백신은 영향이 없다. 기초접종은 생독, 보강은 사독으로 하는 방법이 있고 비강 백신은 유행 중에도 쓸 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="37">•</span><span>미경산우는 6개월령에 접종하고 번식 3~4주 전에 보강하며, 번식에 너무 가깝게 접종하면 수태율이 떨어질 수 있다. 사독백신은 2~4주 간격 2회 후 6~12개월마다 보강하고, 면역은 6~12개월을 넘기기 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>바이러스는 환경에서 약하고 겨울에 더 오래 산다. 증상우는 격리하고 정액·수정란은 음성 공여우 것을 쓴다. 유럽은 검사·도태와 유전자결손 표지 백신으로 근절했다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">아까바네병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>제3종 가축전염병(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>아까바네바이러스(Akabane virus)는 소, 면양, 산양에 병을 일으킨다. 매개충은 작은 흡혈 등에모기(Culicoides)다. 감염 후 1~6일에 바이러스혈증, 14일 뒤 항체가 나온다. 감염된 임신우의 30~40%에서 태아가 감염된다. 장기 보균우는 없는 것으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="41">•</span><span>성우 감염은 대개 증상이 없지만 일본·한국의 이리키(Iriki)주는 송아지·성우에 뇌염(신경병) 유행을 일으킨다. 정액으로는 배출되지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>소의 감수성 시기는 임신 3~6개월이다. 임신 79~104일 감염은 수두무뇌증, 103~174일 감염은 뇌·척수의 국소 변성을 동반한 관절만곡증, 임신 후기 감염은 뇌척수염을 일으킨다(자연감염에서 76~104일 수두무뇌증·공뇌증, 103~174일 관절만곡증으로 적은 책도 있다). 유산은 3분기에 무리 지어 생길 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>기형 모양만으로는 다른 매개충 바이러스와 같아 검사기관 확인이 필요하다. 어미 혈청과 초유 먹기 전 송아지 혈청을 검사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>감별은 블루텅, BVD, 슈말렌베르크 바이러스, 루핀 같은 독소, 유독·영양·유전성 신경근육 기형이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방</div>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>면역 없는 임신우를 매개충이 많은 여름·가을에 들이지 않는다. 새로 들이는 소는 번식 전에 유행 지역에 들여 면역을 갖게 한다. 백신은 번식 전에 접종한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">츄잔병</div>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>법정전염병이 아니다(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>츄잔 바이러스(Chuzan virus)는 오비바이러스속 팔리암 아군에 속하고 Culicoides oxystoma가 주 매개충으로 보인다. 임신우 감염으로 뇌수두증, 수두무뇌증, 소뇌형성부전이 생긴다.</span></p>
</div>
<div class="bx"><div class="bx-title">소유행열 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>제3종 가축전염병(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>열이 두 번 이상 오르내리고 눈물, 콧물, 전위 무력, 경직과 파행을 보이며 8시간~1주 넘게 누워 있을 수 있다. 이환율은 80%에 이르기도 하고 영양이 아주 좋은 소 외에는 잘 죽지 않아 95~97%가 회복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>임신 8~9개월 임신우의 약 5%가 유산하고 수소는 최대 6개월 일시 불임이 온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>감별은 저칼슘혈증과 급성 제엽염이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span>완전한 휴식이 가장 효과적이고 회복 중 스트레스는 재발을 부른다. 누운 소는 기립불능우처럼 간호하고 불필요하게 건드리지 않는다. 2~5일 안에 일어서도록 돕고 하루 여러 번 굴린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>탈수에는 등장 수액을 정맥으로 주고, 삼킴 반사가 없으면 경구 투여를 하지 않는다. 소염제를 초기에 2~3일 반복하고 칼슘 보로글루코네이트(calcium borogluconate) 정맥 또는 피하가 일부에서 도움이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>생독백신은 방어가 좋고 사독백신은 6개월 정도만 방어한다. 감염우의 피가 주사로 옮겨질 수 있으니 주사바늘은 한 번만 쓴다.</span></p>
</div>
<div class="bx"><div class="bx-title">블루텅 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제1종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>제1종 가축전염병(현행 가축전염병예방법)이며 2026년 3월 제2종으로 내리는 개정안이 발의되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="56">•</span><span>레오바이러스과 오비바이러스속 RNA 바이러스로 혈청형이 26개이고 혈청형 사이 교차방어가 적다. 등에모기 같은 흡혈곤충이 옮기고, 소의 바이러스혈증은 60~100일 가며 태반·정액으로도 옮는다. 유럽 BTV-8은 일부 지역 소 폐사율이 26%였고 태반을 넘는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="57">•</span><span>소는 거의 무증상이지만 야외 유행에서는 입·혀 수포·궤양, 콧등 건조·갈라짐, 침흘림, 발열, 근염·관상대염에 의한 파행을 보일 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>바이러스혈증은 수주 가지만 면역관용·지속감염으로 이어지지 않는다. 70일 전 태아 감염은 사멸·흡수, 70~130일은 사산·허약 송아지·수두무뇌증·유산, 150일 이후는 뇌염·조산을 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>생독백신은 임신 초기에 쓰면 유산·기형과 관련된다. 혈액은 EDTA로 냉장해 보낸다.</span></p>
</div>
<div class="bx"><div class="bx-title">구제역 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제1종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>제1종 가축전염병(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="61">•</span><span>이환율은 거의 100%, 폐사율은 1~5%이고 어린 동물은 더 높다. 소는 먼저, 더 심하게 증상을 보이는 지표동물이다. 소 잠복기 2~14일, 제1위 기둥에도 수포가 생기고 회복우는 대개 2주 안에 배출을 멈춘다.</span></p>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>감별은 수포성구내염, 구진성구내염, BVD-점막병, 악성카타르열, 우역, 블루텅, IBR이다.</span></p>
</div>
<div class="bx"><div class="bx-title">수포성구내염 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제1종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>제1종 가축전염병(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>뉴저지형이 소에 더 병원성이 높다. 바이러스는 상처로 들어가 거친 사료가 위험을 높이고, 이환율은 높고 폐사율은 낮다. 임상으로는 구제역과 구별할 수 없고 수포액은 전염력이 매우 강하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>부드러운 사료, 격리, 초기 곤충 방제가 대책이고 사람도 감염될 수 있어 장갑을 쓴다.</span></p>
</div>
<div class="bx"><div class="bx-title">소 백혈병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병(지방병성 소류코시스)</span></div>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>제3종 가축전염병(지방병성 소류코시스만 해당)(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>감염 림프구가 옮겨져 전파된다. 위험 요인은 양성 어미의 송아지, 감염우 생초유, 제각기·문신기·주사바늘·직장검사 장갑 같은 피 묻은 기구 공용, 자연교배, 파리 방제 미흡이다. 청정 우군에 들어오는 주원인은 감염우 구입이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>태반 감염은 임신의 10% 미만이지만 바이러스량이 많은 어미는 40%에 이를 수 있고, 지속성 림프구증가증 소가 가장 위험하다. 송아지는 생후 3일 안에 초유·우유로 가장 잘 감염되고, 얼렸다 녹이거나 살균하면 바이러스가 죽는다. 감염우와 비감염우를 약 3m 떨어뜨리거나 울타리로 나눈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>림프종은 감염우의 5% 미만(약 1.7%로 적은 책도 있다), 보통 3세 이상에서 림프절, 우심방, 제4위, 자궁, 경막외 척수 등에 생긴다. 직장검사에서 내장 림프종은 지방괴사처럼 만져지고, 척수 림프종의 후지 마비는 분만 신경손상과 감별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>분만 전후에는 항체가 검출 한계 아래로 떨어질 수 있다. 림프절은 세침흡인보다 절제 생검이 정확하다. 진단 뒤 수개월을 넘기는 소는 드물다.</span></p>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>관리는 주사바늘 1두 1침, 직장검사·인공수정 장갑 1두 1매, 초유·우유 가열 또는 냉동, 파리 방제, 인공수정, 소작 제각, 피 묻은 기구 세척·소독이다. 이것만으로 완전 근절은 증명되지 않았고 선택 도태가 필요하다. 전기 소작 제각과 기구의 클로르헥시딘·차아염소산 소독으로 신규 감염이 줄었고 백신은 없다. 양성 공란우 수정란을 음성 수란우에 이식하면 음성 송아지를 얻는다.</span></p>
</div>
<div class="bx"><div class="bx-title">소 해면상뇌증(BSE) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>제2종 가축전염병(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>고전형은 3~6세 이상에서 2주 넘게 서서히 진행하고 과흥분, 불안한 표정, 과대보행 운동실조, 감각과민, 얼굴·귀 떨림, 반복 발차기, 체중감소를 보인다. 공격성은 일부만 보인다. 잠복기 2~12년, 소끼리 수평전파 보고는 없다. 감염 어미의 새끼가 감염될 가능성이 3배였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span>감별은 저마그네슘혈증, 두개내 종양, 납중독, 리스테리아병, 신경형 케토시스, 회백질연화증, 광견병, 척수 외상이고 모두 죽는다.</span></p>
</div>
<div class="bx"><div class="bx-title">브루셀라병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>제2종 가축전염병(현행 가축전염병예방법)이자 인수공통전염병이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>원인은 Brucella abortus다. 소의 자연교배 전파는 드물지만 오염 정액 인공수정은 옮길 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상</div>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>유산은 임신 3분기(5개월~만삭으로 적은 책도 있다)에 생긴다. 처음 감염된 우군은 유산율이 70%까지 오를 수 있다. 약 80%는 한 번만 유산하고 이후 분만 때마다 많은 균을 배출한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>태반염이 일관된 소견이고, 정상 자엽과 심하게 괴사·출혈된 자엽이 섞여 있으며 자엽 사이 태반이 두껍고 불투명하다. 태아는 1~3일 자궁에 머문 뒤 나오고, 유산 뒤 배출은 대개 3주 안에 멈춘다. 태아에 기관지폐렴이 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>감염 어미 송아지의 대부분은 회복하지만 약 2.5%는 검사 음성 잠복 감염으로 남아 첫 임신에 유산하거나 감염 분만을 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·치료</div>
<p class="bx-num"><span class="bxn" data-n="80">•</span><span>배양이 확진이고, 혈청검사는 선별과 감시에 쓴다. 유산 시점 혈청검사가 유용하고 쌍혈청은 대개 필요 없다. 태아 조직, 태막, 질 분비물 배양으로 확인하며 태아 제4위 내용물이 PCR에 가장 좋은 시료일 수 있다. 선별은 카드·로즈벵갈 같은 민감한 응집검사, 확인은 보체결합·ELISA·형광편광으로 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>지속성 옥시테트라사이클린과 스트렙토마이신 병용으로 배출이 줄고 일부는 균이 없어질 수 있지만, 근절이 우선이라 감염우는 거의 치료하지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방</div>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>가능하면 폐쇄 우군을 유지하고, 입식우는 검사·격리한다. 유입 경로는 이웃 전파, 잠복기 소 입식, 잠복 감염 미경산우 보유의 세 가지다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">우결핵 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>제2종 가축전염병(현행 가축전염병예방법). 원인은 Mycobacterium bovis다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>성우는 흡입, 송아지는 감염 우유로 주로 걸린다. 2세 이상에서 많다. 양성 반응우 대부분은 폐보다 림프절 병변이 있고, 전신 중증우는 반응하지 않을 수 있다. 자궁내막염으로 후기 유산이 생기고 위험 송아지의 약 1%가 선천 감염된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>아침, 추울 때, 운동 때 심해지는 습한 기침, 오르내리는 미열, 인후두 등 림프절 종대·파열 배농을 보인다. 감별은 요네병, 기생충, 백혈병, 마이코플라즈마 폐렴·폐농양이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>투베르쿨린 검사는 미근부 주름에 PPD 0.1mL를 피내 접종하고 72시간에 판정하며, 의양성·양성은 비교경부검사로 재검하고 감마인터페론 검사를 보조로 쓴다. 감염 3~6주 뒤에야 반응하고 민감도 약 85%, 특이도 약 98%다. 진행된 중증, 최근 감염, 노령 소는 위음성, 조류결핵·요네병 감작우는 위양성이 나올 수 있다. 치료는 하지 않는다.</span></p>
</div>
<div class="bx"><div class="bx-title">렙토스피라병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>제3종 가축전염병(현행 가축전염병예방법)이자 인수공통전염병이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>Leptospira interrogans는 23 혈청군 200여 혈청형이 있다. hardjo는 소 적응형으로 6~18개월 무증상 감염이 지속되며 수개월~수년 배출하고, 불임·조기배아사가 흔하며 유산은 감염 수개월 뒤 산발적이다. pomona 등 비적응형은 쥐·돼지·야생동물 오줌에 오염된 환경에서 옮고 6개월 안에 끝나며, 유산은 1~4주 뒤 집단으로 오기 쉽다. 고인 물에서 6개월까지 산다.</span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>비적응형은 어린 소에 급성 중증을 일으키고, 수소는 오줌·정액으로 배출하는 무증상 보균우가 많다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상</div>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>pomona 잠복기는 3~9일이다. 급성은 송아지에 흔하고 41℃ 넘는 발열, 용혈성 빈혈, 혈색소뇨, 황달을 보이며 2개월 미만 폐사율이 높다. 성우는 혈색소뇨가 드물다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>유산은 평균 감염 3주 뒤, 임신 4개월~만삭(주로 마지막 3분기)이다. pomona는 급성기 1~6주 뒤 유산율 50%까지, hardjo는 1~3개월 뒤 대개 10% 미만으로 유산한다. hardjo는 불임, 수정 횟수 증가, 분만간격 연장, 후산정체, 허약 송아지를 늘린다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>의심되는 여러 마리로 우군 단위 진단을 한다. MAT 혈청검사는 쌍혈청(7~10일 간격) 4배 상승, 또는 증상과 함께 1:800 초과면 진단한다. 접종하지 않은 우군에서 여러 마리가 300을 넘으면 의미가 있다. 어미 pomona 항체가 1:12,800 초과는 렙토 유산을 시사하고, hardjo 항체가는 대개 1:100 미만이다. 접종 항체가는 1:100~1:400이고 1~3개월 간다. 만성 보균우는 음성일 수 있어 낮은 항체가로 배제하지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>소변은 빌리루빈, 혈색소, 단백이 늘 수 있고 소변 자체가 감염원이다. 배출이 간헐적이라 음성이 병을 배제하지 못한다. 유산 뒤 약 10일~2주 안에 어미 오줌에서 균을 찾을 수 있다. 푸로세미드(furosemide)를 주고 세 번째 오줌을 받아 24시간 안에 보낸다. 오줌 PCR이 가장 민감하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>감별은 송아지 물중독(열이 없다), 산후혈색소뇨증, 아나플라즈마병, 바베시아병, 세균성혈색소뇨증, 급성 간염이다. 번식 증상은 브루셀라병, 캄필로박터병, 트리코모나스병, IBR, BVD, 네오스포라병, 영양불량과 감별한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>급성 pomona는 테트라사이클린, 베타락탐, 마크로라이드로 치료한다. 테트라사이클린(tetracycline) 10~15mg/kg 12시간마다 3~5일, 지속성 옥시테트라사이클린(oxytetracycline) 20mg/kg 10일 간격 2회를 쓴다. 스트렙토마이신·디하이드로스트렙토마이신 12.5mg/kg 12시간마다 3일, 25mg/kg 1회면 pomona 등 비적응형의 보균 상태를 대개 없앤다.</span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>hardjo 보균 배출은 지속성 옥시테트라사이클린 20mg/kg 근육 1회, 틸미코신(tilmicosin) 10mg/kg 피하 1회, 세프티오퍼(ceftiofur) 2.2 또는 5mg/kg 근육 1일 1회 5일(또는 20mg/kg 3일), 아목시실린(amoxicillin) 15mg/kg 근육 48시간 간격 2회로 없앤다. 툴라트로마이신(tulathromycin) 2.5mg/kg 피하 1회로 오줌·신장·난관·자궁에서 균이 없어졌다. 항생제 치료는 재감염을 막기 위해 접종과 함께 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>유행 시 임신우에 사독백신과 옥시테트라사이클린을 주고, 유산우 격리, 태아·태반 제거, 돼지·설치류·오염된 물 차단을 한다. 다가 백신은 유산과 폐사를 막고 신장 정착을 줄이며, 혈청음성 대체우를 고른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>접종은 4~6개월령 2회로 기초면역 후 4~6개월(습한 곳은 더 자주)마다 보강하고, 1회만 맞히는 것이 흔한 실수다. hardjo 문제에는 hardjo 단가 백신을 쓴다. 감염 소를 다루는 사람은 장갑, 장화, 보안경이나 마스크를 쓴다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">리스테리아병</div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>Listeria monocytogenes는 pH 5~9, 0~45℃에서 자라고, 발효가 덜 되어 pH가 충분히 안 떨어진 사일리지(특히 곤포)에서 증식한다. pH 5.0 미만이면 증식이 막힌다. 마른 흙에서 2년 산다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>구강·비강 점막 상처나 이갈이 때 치수로 들어가 삼차신경을 따라 뇌간에 이른다고 본다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">뇌염형</div>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>성우 뇌수막뇌염의 잠복기는 2~3주다. 대개 한 마리만 걸리고 우군 성우의 1%를 넘는 일이 드물다. 12개월 미만 소에서는 드물고 중앙 나이는 4세다. 치료하지 않으면 거의 100% 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>뇌신경 증상은 대개 한쪽에 치우친다. 턱 처짐·씹기 곤란, 귀·눈꺼풀·입술 처짐과 한쪽 침흘림, 눈이 감기지 않아 생기는 노출성 각막염, 머리 기울임과 안진, 삼킴 곤란, 혀 마비, 머리 밀기를 보인다. 구토나 고창증이 초기 증상으로 오기도 하고, 실명은 드물다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>감별은 광견병, 중이·내이염, 두부 외상, 혈전색전성 수막뇌염, 뇌간 농양이다. 광견병이 가장 중요하다. 중이·내이염 소는 더 또렷하고 먹고 마실 수 있으며 주로 어린 송아지다. 회백질연화증과 납중독은 양쪽 피질맹이 있고 뇌신경 증상이 없다. 신경형 케토시스는 뇌신경 결손이 없고 소변 케톤이 양성이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">유산형</div>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>소는 임신 마지막 2개월에 산발적으로 유산하고(15% 미만) 어미는 대개 증상이 없지만 발열, 후산정체, 자궁내막염이 올 수 있다. 번식력 영향은 일시적이고 재감염에 저항한다. 태아 간·자엽에 2mm 회백색 병소가 보인다. 남은 임신우에 테트라사이클린을 쓸 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>만삭 근처 감염은 어미에 자궁염·패혈증, 후산정체를 일으키고, 같은 소가 해마다 유산하기도 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>페니실린 20,000~40,000IU/kg 정맥 6~8시간마다 7일, 이어서 24시간마다 14~21일 더 준다. 또는 옥시테트라사이클린 10mg/kg 정맥 12시간마다 14일. 겉보기 회복 뒤 최소 1주 더 투여한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>다른 용량으로는 칼륨 페니실린 G 40,000IU/kg 정맥 1일 3~4회 7일 뒤 프로카인 페니실린 22,000IU/kg 근육 1일 1회 14~21일, 또는 페니실린 44,000U/kg 1일 2회 근육 또는 피하 최소 7일 이후 1일 1회 또는 22,000U/kg 1일 2회가 있다. 옥시테트라사이클린 10mg/kg 1일 2회 정맥 또는 피하는 수액 없이 쓰면 신부전 위험이 있다. 스스로 먹고 마신 뒤 최소 1주 더 주고(대개 7~21일), 일찍 줄이면 재발한다. 회복에 1개월이 걸리기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>보조 치료는 탈수 교정 수액(경구 또는 정맥), 노출성 각막염 관리, 바닥이 미끄럽지 않고 깔짚을 깐 우방이다. 침의 중탄산 손실로 대사성 산증이 오므로 혈장 중탄산·칼륨을 재서 교정 수액을 주고, 물과 전해질을 위관으로 준다. 염기 결핍 10mEq/L인 성우는 중탄산나트륨 약 125g이 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>예후는 일찍 치료할수록 좋다. 걸을 수 있을 때 진단해 집중 치료하면 보통~좋음이다. 누워 있거나 혼수인 소는 회복이 드물고, 2~3일 치료에 나아지지 않으면 안락사를 고려한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>양질의 pH 낮은 사일리지를 쓰고 흙·분변 오염을 막는다. 여러 마리가 걸리면 건초와 사일리지를 배양하고, 썩은 사료는 버리며 오염된 곳에 울타리를 친다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">캄필로박터병</div>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>Campylobacter fetus subsp. venerealis가 교배로 옮는 성병이다. 수소 포피가 보균처다. 2세 이하 수소는 잘 감염되지 않지만 기계적으로 옮길 수 있고, 5세 넘은 수소가 만성 보균우가 되기 쉽다. 감염 수소와 처녀 미경산우의 교배 전파율은 거의 100%다.</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>암소는 3~6개월(4~8개월, 5개월 안으로 적은 책도 있다)에 회복하고 재감염에 저항한다. 1% 미만은 자궁경관에 균을 지닌 채 임신한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>조기 배아 사멸과 반복 재발정이 주된 모습이고 임신 손실은 대부분 30~70일에 생긴다. 수정당 종부 횟수가 2.5~3.5회로 늘고 분만기가 길어진다. 수소는 증상과 정액 이상이 없다. 유산율은 10% 미만(10~50%로 적은 책도 있다)이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>진단은 감염 후 3주~3개월에 자궁경관 점액을 채취하고, 발정 후기에 채취하면 위양성이 늘어난다. 유산 3일 안에 자궁·질 면봉을 채취한다. 수소는 1주 간격 2회 포피 긁개나 세척액을 배양·형광항체·PCR로 검사한다. 균은 채취 후 6~8시간 살고 Clark 배지에 넣으면 48시간까지 산다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>우군 진단은 수소부터 한다. 인공수정 피펫에 12mL 주사기를 달고 음압을 걸며 포피를 10~15회 세게 긁어 스메그마를 얻고 6시간 안에 검사기관에 보낸다. 질점액 응집반응은 감염 37~70일 사이 시료로 우군 검사에 쓴다. 유산태아는 제4위 내용물이 가장 좋다. 감별은 트리코모나스병으로, 우군 양상이 같지만 자궁축농증 증가는 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>치료는 수소에 스트렙토마이신 20mg/kg 피하 1~2회와 함께 스트렙토마이신 5g을 넣은 국소 현탁액을 포피와 음경에 3일 연속 바른다. 내성주가 보고되어 있다. 우군 전체 치료는 실용적이지 않다. 백신으로 생긴 IgG가 자궁·포피 감염을 없애 치료로도 쓰인다. 자궁에 스트렙토마이신·페니실린을 주입하면 회복이 빨라진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>오염되지 않은 정액으로 인공수정하고, 감염 우군은 두 번식기 동안 인공수정만 한다. 감염 동물은 검사해 도태한다. 백신이 있는 곳에서는 번식기 전 2회 접종한다. 자연교배를 계속하면 기존 수소를 처녀 수소로 바꾸고, 번식기 끝에 수소 전체를 검사해 양성은 도태한다. 접종한 비감염 수소도 기계적으로 옮길 수 있다.</span></p>
</div>
<div class="bx"><div class="bx-title">탄저병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>제2종 가축전염병(현행 가축전염병예방법)이자 인수공통전염병이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>원인은 Bacillus anthracis다. 가뭄 뒤 큰비, 땅파기 뒤 발생이 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>의심 사체는 열지 않는다(공기에 닿으면 아포 형성). 검사기관에 미리 알린다. 시료는 표재 정맥의 응고되지 않은 혈액, 큰 바늘로 뽑은 안구액 또는 눈알이고 귀·피부·장 내용물은 권하지 않는다. 12시간 넘은 사체는 클로스트리디아가 덮어 도말 판독이 어렵다. 혈액으로 15분 만에 보는 현장 면역크로마토 검사가 있다(민감도 93.1%). 감별은 기종저, 악성수종, 낙뢰, 고창증이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>치료는 페니실린 G 나트륨·칼륨 20,000IU/kg 정맥 12시간마다, 프로카인 페니실린 22,000IU/kg 근육 12시간마다 또는 44,000IU/kg 24시간마다, 옥시테트라사이클린 10mg/kg 정맥 또는 근육 24시간마다. 이미 퍼진 독소에는 효과가 없다. 최소 5일 치료하고 항생제는 검사 검출을 방해한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>위험군 예방 투여는 프로카인 페니실린 44,000IU/kg 24시간마다, 또는 지속성 옥시테트라사이클린 20mg/kg 72시간마다. 탄저 생균백신 접종 전후 7~10일 안에 항생제를 쓰면 백신 효과가 떨어진다. 사체는 태우거나 1.8m 이상 묻고 생석회를 덮는다.</span></p>
</div>
<div class="bx"><div class="bx-title">기종저 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>제2종 가축전염병(현행 가축전염병예방법)이며 2026년 3월 제3종으로 내리는 개정안이 발의되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>원인은 Clostridium chauvoei다. 먹은 아포가 근육 대식세포 안에 살다가 타박 등으로 혐기 상태가 되면 발아해 독소를 만든다. 영양 상태가 아주 좋은 소, 늦여름~초겨울, 비접종 우군에 많다. 6~24개월에 많지만 좁은 통로에서의 타박으로 2~3세 초산우에 집단 발생한 예가 있고, 셀레늄 결핍 근육 손상도 계기가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>대부분 급사한다. 증상이 보이면 침울, 주로 뒷다리 파행과 부종·염발음, 산패한 버터 냄새다. 부은 근육은 따뜻하고 부드럽다가 단단해지고 피부가 검고 차가워지며, 24~48시간에 진행해 치료하지 않으면 3일을 넘기기 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>무균 천자액(장액혈액성·갈색, 가스)의 그람염색에서 큰 그람양성 막대균이 보이면 빠르게 진단된다. 감별은 악성수종, 탄저, 뱀 교상, 납·비소 중독, 질산염·청산 중독 같은 급사 원인이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>치료는 프로카인 페니실린 G 고용량(24,000IU/kg) 근육주사(44,000U/kg 1일 2회 근육 또는 피하로 적은 책도 있다), 소염제, 수액이고 항생제는 1~4주 쓴다. 병변 피부를 절개해 개창·배액하고 생리식염수, 과산화수소·요오드액으로 씻는다. 쇼크에는 수액과 부신피질호르몬 1회를 쓴다. 예후는 나쁘고 살아도 장애가 남을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>2세 미만 어린 소는 1년에 최소 2회 접종하고, 생애 첫 접종 4~6주 뒤 보강한다. 4개월 미만에 접종했으면 4개월 이후 다시 접종한다. 방어면역은 접종 2주 뒤 생긴다. 발생하면 감수성 소 전두수를 접종하면서 페니실린을 같이 준다. 사체는 태우거나 깊이 묻고 석회를 덮는다.</span></p>
</div>
<div class="bx"><div class="bx-title">장독혈증</div>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>Clostridium perfringens C형은 어린 송아지에 급성 치명적 출혈성 장염을 일으킨다. 갑작스러운 사료 변경, 고곡류, 젖이 많은 어미의 송아지, 들쭉날쭉한 급여, 추위, 스트레스, 콕시듐 동시감염이 위험요인이다. 많은 우유를 한 번에 먹이는 것이 흔한 계기다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>복통·복부팽창이 설사보다 먼저 오고 변은 대장균·살모넬라 설사만큼 묽거나 많지 않다. 오른쪽 아래 복부를 흔들면 소장에 액체가 찬 것을 알 수 있다. 산-염기·전해질 이상은 크지 않고 대장균·살모넬라 설사보다 대사성 산증이 덜해 감별에 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>죽은 뒤 균이 증식해 장 밖으로 퍼지므로 균 분리만으로는 진단할 수 없고, 장내용물 독소 검출과 맞는 병변이 필요하다. 베타 독소는 단백분해효소에 빨리 분해되므로 장내용물은 바로 냉동하거나 빨리 보낸다. 감별은 탄저, 중독, 제4위 질환, 살모넬라증, 렙토스피라병, 회백질연화증이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>치료는 프로카인 페니실린 G 20,000~30,000IU/kg 근육 또는 피하 12시간마다, 또는 칼륨·나트륨 페니실린 44,000U/kg 정맥 6시간마다 24~48시간 뒤 프로카인 페니실린 44,000U/kg 근육 12시간마다. C·D형 항독소는 성우 30mL를 정맥 또는 피하로, 3~4시간마다 반복할 수 있고 과민반응에 주의한다. 수액을 주고 처음 몇 시간은 경구 급여를 중단한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>쇼크에는 플루닉신 0.5~1.1mg/kg 정맥이나 덱사메타손을 1회만 쓰고, 반복하면 장 궤양·천공 위험이 있다. 누워 있으면 예후가 매우 나쁘고 폐사율은 거의 100%다.</span></p>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>임신 말기 어미에 C·D형 톡소이드를 접종해 초유 면역을 준다. 첫 접종 약 4주 뒤 보강, 신생우는 10일령에 접종하고 2주 뒤 다시 한다. 발생 중에는 출생 직후 항독소를 줄 수 있다. 사료 변경은 적응 기간을 둔다. 한 번에 먹이는 우유량을 줄이고 횟수를 늘리며 체온 정도로 데워 먹인다. 새 초지는 첫날 15분, 둘째 날 30분, 셋째 날 1시간, 넷째 날 2시간처럼 서서히 늘린다.</span></p>
</div>
<div class="bx"><div class="bx-title">큐열 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>제2종 가축전염병(현행 가축전염병예방법)이자 인수공통전염병이다. 원인은 Coxiella burnetii다.</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>대부분 불현성이고 소는 산발 유산, 불임, 저체중 송아지를 보이며 소의 유산은 드물다. 증상 없는 소도 오랫동안 생식기 분비물, 우유, 오줌, 분변으로 배출하고 다음 임신에도 배출한다. 혈청양성 미경산우의 약 절반이 분만 때 배출하고, 만성 감염우는 수개월~수년 간헐 배출한다. 1~10마리 균으로도 감염된다. 사람은 주로 오염 먼지 흡입으로 감염된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>태반 자엽 사이가 두꺼운 흰 삼출물로 가죽처럼 보인다. 정상 분만에도 균이 적게 나와 진단은 태반 병변과 정량 PCR, 다른 원인 배제를 함께 본다. 태반, 질 분비물, 태아 간·폐·위 내용물로 PCR하고 태반·태아는 이중 포장해 냉장으로 보낸다. 혈청 양성은 노출만 뜻한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>유행 시 남은 임신우에 마지막 달 지속성 옥시테트라사이클린 20mg/kg 피하 2회를 흔히 쓰지만 효과는 입증되지 않았다. 대체우는 청정 우군에서 들인다. 소독은 1~2% 락스다.</span></p>
</div>
<div class="bx"><div class="bx-title">트리코모나스병</div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파·증상</div>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>원충 Tritrichomonas foetus는 방추형 8~12×15~20μm(10×15μm로 적은 책도 있다)이고 앞쪽 편모 3개와 파동막이 있다. 교배로 옮는 성병이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>수소 포피와 음경 상피에 살고 증상이 없으며 정액 성상에도 영향이 없다. 3세 넘은 수소는 만성 보균우가 되고 2세 미만은 감염이 없어지는 것으로 보인다. 감염 수소의 평균 나이는 5.5세였다. 감염 수소의 동결정액으로 수정해도 암소가 감염된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>수소에서 암소로는 한 번 교배로 옮지만 암소에서 수소로는 최대 6회 교배가 필요할 수 있다. 감염되지 않은 수소도 20분 안에 연속 교배하면 암소 사이에 옮길 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>암소는 난관염, 자궁내막염, 자궁경관염을 일으킨다. 대개 임신 첫 3분기, 감염 7~9주 뒤 태아가 죽고 대부분 5개월 전에 유산한다. 유산율은 5~30%다. 공태우의 최대 5%가 자궁축농증으로 직장검사에서 발견되며, 교배 후 자궁축농증이 여러 마리 생기면 먼저 이 병을 의심한다. 우군 임신율이 70%까지 떨어지고 분만 시기가 늘어진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>자궁 감염은 3~4개월(대개 95일 안, 6~18주로 적은 책도 있다)에 없어지고 이후 2~6개월 재감염 면역이 있다. 1% 미만이 1년까지 보균우로 남는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단</div>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>수소는 포피 긁개로 얻은 포피 분비물을 전용 배지에서 37℃로 배양해 1, 3, 5, 7일에 200~400배로 본다. 원충은 물결치듯 빠르고 불규칙하게 구르는 움직임으로 알아본다. 배양 민감도는 84~96%이고 현장에서는 더 낮을 수 있어 배양과 PCR을 함께 권한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>수소 스메그마가 가장 믿을 만하고 암소 질점액은 우군 검사에 맞지 않다. 시료는 햇빛과 냉장을 피해 상온으로 빨리 보내고, 분변 트리코모나스와 구별하려 PCR로 확인한다. 자궁축농증 내용물을 바로 검경하면 원충이 보인다. 유산태아의 제4위 내용물에서도 찾는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>여러 나라에서 치료가 불법이고, 니트로이미다졸계 약물은 쓰지 않는다. 이프로니다졸 같은 이미다졸계는 효과가 있지만 식용동물에 금지된 곳이 많다. 트리파플라빈·아크리플라빈 국소 도포를 적은 책도 있다. 양성 수소와 공태우는 도태하고, 감염 암소는 도태하거나 최소 3개월 성휴식을 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>새로 들이는 수소는 모두 검사하고, 처녀 수소를 쓰며, 다른 우군과 섞어 방목하지 않는다. 자연교배 우군은 3세 넘은 수소를 검사해 양성을 도태한다. 공태우나 늦게 분만하는 소를 들이지 않는다. 관리된 동결정액으로 인공수정한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">네오스포라병</div>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>원충 Neospora caninum이 원인이다. 개와 코요테가 종숙주이고 소와 사슴이 중간숙주다.</span></p>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>우군 안 주 경로는 어미에서 태아로의 수직감염이고, 개 분변 오시스트에 오염된 사료·물에 의한 점원성 수평감염은 집단 유산을 일으킨다. 소끼리 수평감염은 없다. 유산태아·태반을 먹은 개는 오시스트를 대량 배출한다. 교배·인공수정·초유는 의미 있는 경로가 아니다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>수직전파율은 75~100%(최대 95%로 적은 책도 있다)이고 항체가 1:400 이상 어미 94.8%, 1:25~200 어미 14.8%였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>어미는 증상이 없다. 임신 3개월~만삭, 주로 5~6개월에 유산한다(주로 4~6개월, 2분기 초반, 주로 마지막 3분기로 적은 책도 있다). 5개월 전에 죽은 태아는 미이라가 되기 쉽다. 혈청양성 어미는 유산 위험이 2~3배(3~7배로 적은 책도 있다) 높고 반복 유산한다. 4~8주 사이 위험 소의 10~15% 넘게 유산하면 유산 폭풍으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>선천감염 송아지의 95%는 정상으로 보인다. 일부는 출생 때나 생후 4주 안에 운동실조, 쇠약, 고유감각 소실 같은 신경증상을 보이고, 드물게 수두증, 척수 협착, 관절만곡증이 생긴다. 임상 증상은 2개월 미만 송아지에서만 보고되었고 체중 미달, 기립불능, 사지 굴곡·과신전, 슬개반사 감소, 안구돌출을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>어미 혈청 양성은 노출만 뜻하므로 태아 조직병리와 함께 판단하고 태아 뇌, 심장, 간, 태반을 보낸다. 어미 항체가는 유산 2주 안이 가장 높고 60일 넘으면 음성일 수 있다. 태아 체강액 항체검사는 5개월 넘은 태아에서 쓸 만하고 뇌가 가장 좋은 시료다. 여러 마리 유산 시 유산우와 비유산우의 양성률을 비교한다. IFAT 1:2,000 초과는 최근 유산, 1:200 초과는 기존 감염을 시사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>승인된 약이 없고 시판 백신도 없다. 선천감염 신생 송아지에 톨트라주릴(toltrazuril)을 주자 감염이 없어져 다음 세대 수직감염을 줄일 가능성이 보였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>개·야생 개과 동물이 사료·물·방목지를 오염시키지 못하게 하고, 태반·유산태아·죽은 송아지는 바로 치운다. 초유 전 송아지 혈청(어려우면 6개월령)으로 선천감염우를 찾아 도태한다. 전두수 검사 후 양성우의 딸을 대체우에서 빼는 편이 모두 도태보다 경제적이고, 입식우는 혈청음성 우군에서 들이며, 우수한 양성우는 음성 수란우에 수정란 이식으로 혈통을 살린다. 스트레스와 병발 질병을 줄이면 재활성화 유산이 줄 수 있고, 육우 품종이 젖소보다 저항성이 높다. BVD 관리도 함께 한다.</span></p>
</div>
<div class="bx"><div class="bx-title">진드기 매개 질병(파이로병) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병(바베시아 bovis·bigemina, 아나플라즈마 marginale, 타일레리아 parva·annulata만)</span></div>
<div class="bx-sub"><div class="bx-subtitle">현장 감별</div>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>현장 감별은 바베시아병은 혈관내 용혈이라 혈색소뇨(소변 스틱 잠혈 양성)가 나오고, 아나플라즈마병은 혈관외 용혈이라 혈색소뇨가 없다. 김자·라이트 염색 혈액 도말로 적혈구 안의 원충을 본다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">타일레리아병</div>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>제2종 가축전염병이며 Theileria parva·annulata만 해당한다(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>양성 타일레리아병(T. orientalis군)은 Haemaphysalis 진드기, 흡혈파리, 주사바늘로 옮고 평생 감염된다. 이케다(ikeda) 유전형이 병원성이 가장 강하고 태반 감염도 보고되어 있다. 대부분 무증상이지만 드물게 혈관내 용혈로 고열, 황달, 짙은 오줌, 림프절 종대를 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>테트라사이클린과 이미도카브는 효과가 없었고 할로푸지논, 파르바쿠온, 부파르바쿠온은 효과가 있었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>용량은 부파르바쿠온 2.5mg/kg 근육 48시간 간격 2회, 할로푸지논(halofuginone lactate) 1.2mg/kg 경구, 옥시테트라사이클린 20mg/kg 근육(효과는 덜함)이다. 이 용량은 동부해안열과 열대 타일레리아병 기준이다. 신경형 열대 타일레리아병에 부파르바쿠온 2.5mg/kg 1회가 약 90% 효과라고 적은 책도 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">아나플라즈마병</div>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>제2종 가축전염병이며 Anaplasma marginale만 해당한다(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>A. marginale은 진드기가 자연 전파하고 등에, 주사바늘, 피 묻은 기구, 직장검사 장갑, 주입·수정 기구로 기계적으로 옮는다. 진드기 안 경란전파가 없어 소의 지속감염이 전파 유지에 필수다. 임신 3분기 감염우에서 태반 감염으로 보균 송아지가 나올 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>잠복기 7~60일. 송아지는 대개 증상이 없고, 6개월~3세는 가볍거나 중등도, 3세 넘으면 심하다. 발열, 식욕부진, 빈혈(창백·황달·빈맥·운동불내성), 폐사가 있고 혈색소뇨는 없다. 2세 넘은 감수성 소의 치명률은 30~50%다. 살아남으면 보균우가 되고 유산할 수 있다. 빈혈우는 다루는 것만으로 뇌 저산소가 올 수 있다.</span></p>
