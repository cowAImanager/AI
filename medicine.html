<p class="bx-num"><span class="bxn" data-n="30">•</span><span>10~20분에 걸쳐 청진하며 준다. 최대 안전 속도는 23% 칼슘보로글루코네이트 0.065 mL/kg/분, 600kg 소라면 분당 39 mL다. 너무 빠르면 심장이 수축기에 멈춘다. 주사액은 체온 정도로 데운다.</span></p>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>주사 중 심박이 다소 느려지는 것은 정상이다. 갑자기 빨라지거나 부정맥이 생기면 늦추거나 멈추고 심한 서맥도 마찬가지다(서맥은 걱정하지 않고 심한 부정맥·빈맥이 계속되면 나머지를 피하로 주라고 적은 책도 있다). 부정맥에는 아트로핀 정맥주사를 쓸 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>재발을 막으려 둘째 병의 전부나 일부를 피하로 주는 임상가가 많고, 정맥 500 mL에 피하 500 mL를 더하면 재발이 줄었다는 기록이 있다. 반면 정맥 직후 피하 1병은 재발을 막지 못하며 재발 방지용 피하·경구 칼슘은 12~24시간 뒤에 주는 것이 낫다고 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>피하는 한 자리에 칼슘 1~1.5g(약 50~75 mL)까지만 놓고, 포름알데히드가 들었거나 500 mL당 포도당이 25g 넘는 칼슘액은 피하에 놓지 않는다. 염화칼슘은 혈관 밖으로 새면 조직이 괴사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>누운 소는 순환이 나빠 피하 칼슘만으로는 부족하다. 피하로 여러 번 놓은 소에 정맥주사를 더하면 피하 칼슘이 한꺼번에 흡수되어 독성이 날 수 있다. 서 있는 소에는 정맥주사를 하지 않거나 아주 조심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>내독소는 심근의 칼슘 민감도를 높여 정맥 칼슘에 심장이 멈출 수 있다. 심한 케톤증·지방간 소도 민감하고, 더위에 노출된 소는 체온을 39.5℃ 아래로 낮춘 뒤 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>경구로 쓸 수 있는 것은 염화칼슘과 칼슘 프로피오네이트다. 칼슘 45~90g을 분만 때와 12~24시간 뒤 준다. 녹는 칼슘 약 200g이 반수치사량이다. 염화칼슘은 부식성이 있어 반복하지 않는다. 칼슘 프로피오네이트 50~90g을 단독 또는 정맥 치료 보조로 쓴다. 누운 소나 삼킴이 나쁜 소에게 먹이면 흡인성 폐렴으로 죽을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="37">•</span><span>칼슘제의 마그네슘은 저마그네슘혈증을 잠시 교정하고 칼륨은 심장 독성을 줄이지만 들어 있는 인은 아인산염이라 쓰이지 않는다. 칼슘에 반응하지 않는 약 15%에 비타민D3 유사체(1α-hydroxycholecalciferol) 1 µg/kg을 반은 정맥, 반은 근육으로 준다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료 반응·재치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>주사 중 트림, 배변, 배뇨를 하고 합병증 없는 소는 주사가 끝날 무렵 일어서기도 한다. 근육 떨림, 맥이 느려지고 강해짐, 콧등 땀도 좋은 반응이다. 일으키기 전에 미끄러운 바닥에서 옮겨 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>75%가 2시간 안에 일어서고, 반응한 소의 25~30%가 재발해 24~48시간 안에 다시 치료가 필요할 수 있다(약 20%가 대개 약 24시간 뒤 재발한다고 적은 책도 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>처음 치료할 때 서 있던 소는 기립불능·폐사가 없었고, 흉와 소는 기립불능 13%·폐사 2%, 횡와 소는 기립불능 37%·폐사 12%였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="41">•</span><span>정맥 치료 30분 뒤에는 어느 정도 나아져야 한다. 8~12시간 뒤 다시 치료하고 인·칼륨·마그네슘 결핍도 확인한다. 다른 원인이 없으면 최대 3회까지 반복하며 그 이상은 거의 효과가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>재발성 유열은 나이 많은 고능력우에 많고 지방간이 겹치기도 한다. 비타민D 1회 근육주사, 좋은 바닥, 진통제, 앞무릎 붕대를 권하고 재발하면 마그네슘도 보충한다. 완전 회복까지 24~72시간 걸리기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>예방으로 음이온염을 써 사료 양이온·음이온 차를 건물 kg당 -25~-75 mEq로 맞추고 분만 전 소 10~20%의 오줌 pH를 매주 재어 6.0~7.0을 유지한다(-10~-15 mEq/100g, 홀스타인 오줌 pH 6.2~6.8을 목표로 적은 책도 있다). 오줌 pH가 5.0~5.5면 음이온 과잉으로 섭취가 준다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">저마그네슘혈증(hypomagnesemia)</div>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>분만 후 2개월 안의 포유 육우가 빠르게 자라는 서늘한 계절 풀을 뜯을 때 가장 많고, 건조 사료를 먹는 축사 소에도 겨울 테타니가 생긴다. 칼륨·질소가 많고 마그네슘·나트륨이 적은 어린 풀이 원인이다. 추위, 수송, 섭취 감소가 계기가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>저마그네슘혈증은 부갑상선호르몬 작용을 떨어뜨려 저칼슘혈증을 부르지만 유열 소 대부분은 마그네슘이 정상이거나 높다. 유열 1단계를 지나서도 근육 강직과 과민이 남으면 동반을 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>급성은 흔히 죽은 채 발견된다. 무리에서 떨어지고 귀를 세워 씰룩이며 과민·공격적이다. 근육 떨림, 안구진탕, 눈꺼풀 떨림, 운동실조, 간대성 경련, 후궁반장, 체온 상승, 빈맥을 보인다. 손뼉 같은 자극에도 발작이 다시 온다. 5~60분 안에 죽는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>치료는 다루는 것을 최소로 하고 경련이 심하면 진정제를 근육으로 먼저 준다. 대개 저칼슘혈증이 함께 있어 마그네슘 5%가 든 칼슘보로글루코네이트 500 mL를 정맥주사한다. 성우에 마그네슘 1.5~2.25g(2~3g으로 적은 책도 있다)이 필요하고 5~10분 이상 걸쳐 넣는다. 칼륨이 든 수액은 쓰지 않는다. 너무 빨리 넣으면 호흡이 멎을 수 있어 심박을 보며 넣는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>치료 후 적어도 30분은 일으키지 않는다. 회복할 소는 약 1시간 뒤 회복하지만 12시간 안에 재발이 많다. 재발 방지로 10~20% 황산마그네슘 250 mL를 네 곳 이상 나눠 피하주사하거나, 삼킴이 돌아온 뒤 산화마그네슘 100g을 물에 타 먹인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>한 마리가 걸리면 바로 나머지 소의 마그네슘을 늘려 곡류에 섞어 임신우 하루 10~15g, 포유 육우 20g을 더 준다. 마그네슘은 맛이 없어 사료나 당밀에 섞어야 먹는다. 하루 일부는 건초나 다 자란 풀만 먹게 한다.</span></p>
</div>
<div class="bx"><div class="bx-title">저인혈증·저칼륨혈증(hypophosphatemia·hypokalemia)</div>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>칼슘으로 저칼슘혈증이 교정된 뒤에도 인이 계속 낮은 기립불능 소가 있다. 대개 유열에 뒤따르며 사료 인 부족 때문은 아니고 유열 예방이 최선의 예방이다. 인이 원인이라는 확실한 근거는 없고 유열 소의 낮은 인은 칼슘만 주어도 몇 시간 안에 정상이 된다. 오래 누운 소에서 인이 오히려 높으면 근육 손상이 커서 예후가 나쁘다.</span></p>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>인은 근육·신경 손상 전에 치료하면 회복하는 소가 있다. 경구는 인산일나트륨 200g(인 50g), 정맥은 인산일나트륨 23g(인 6g)을 생리식염수 1L에 녹여 준다(경구 200~500g, 정맥 또는 피하 20~30g을 천천히 쓴다고 적은 책도 있다). 정맥 인은 몇 시간에 걸쳐 주고 칼슘·마그네슘 수액에 섞지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span>칼륨이 2.5 mEq/L 아래면 점점 약해져 몇 시간 만에 일어서지 못한다. 머리조차 들지 못하는 이완성 마비가 특징이라 유열로 오인되지만 칼슘에 반응하지 않는다. 이소플루프레돈 반복 투여나 케토시스 반복 치료(50% 포도당, 프로필렌글리콜, 코르티코스테로이드)를 받은 소에 많다. 오래 먹지 못한 소는 대사성 알칼리증이 생겨 칼륨이 세포 안으로 더 들어가 저칼륨혈증이 악화된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>칼륨은 먹이는 것이 정맥보다 못하지 않다. 심한 소에 염화칼륨을 처음 최대 약 450g, 이후 약 225g씩 하루 2회 먹이며 며칠 뒤 설사가 온다(120g을 먹이고 12시간 뒤 120g을 더 주어 24시간에 240g(0.4 g/kg)을 주며 더 많으면 설사, 침흘림, 근육 떨림이 온다고 적은 책도 있다). 24~48시간 안에 일어서지 못하면 결과가 나쁘고 칼륨이 정상이 될 때까지 슬링·들개를 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>칼륨 정맥주사는 심한 저칼륨으로 누워 있고 반추위가 멈춘 소의 첫 치료에만 쓴다. 등장성(1.15%) 염화칼륨을 시간당 3.2 mL/kg 미만으로 준다. 더 빠르면 심실세동으로 죽을 수 있다.</span></p>
</div>
<div class="bx"><div class="bx-title">임신중독증(pregnancy toxemia)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·발생</div>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>육우의 임신중독증은 지방간 증후군의 심한 형태로, 살찐 육우가 쌍태를 밴 경우 임신 마지막 6주에 가장 많다. 임신 말기까지 잘 먹다가 갑자기 사료가 모자라거나, 너무 살쪄서 에너지 낮은 사료를 충분히 먹지 못할 때 생긴다. 난산을 줄이려고 임신 육우의 사료를 사일리지에서 짚으로 바꿔 살을 빼다가 집단 발생한 예가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="56">•</span><span>마른 임신 육우는 극도로 여위어 누워서 굶어 죽을 수는 있어도 임신중독증에는 걸리지 않는다. 겨울에 질 낮은 사료를 먹는 여윈 임신 육우의 단백·에너지 결핍은 털이 길고 약하며 정신은 있으나 일어서지 못하기도 하고 누운 뒤 7~14일에 대부분 죽는다. 자라는 임신 미경산우와 추위가 위험을 높인다. 요네병, 림프종, 기생충과 감별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="57">•</span><span>인이 모자란 사료를 먹는 육우는 임신 말기 태아가 인을 끌어가 갑자기 눕는 저인혈증형이 있다. 정신이 또렷하고 앞에 놓은 사료는 먹으며 쌍태에 많고 저칼슘·저마그네슘·저혈당이 함께 온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>대개 산발적으로 이환율 약 1%(1~3%, 많게는 10%)지만 폐사율은 거의 100%다. 초산우가 노산우보다 많고(노산우에 더 많다고 적은 책도 있다) 임신 7~9개월이나 막 분만한 소가 대부분이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>위험 요인은 쌍태, 영양 공급이 고르지 않거나 줄거나 끊긴 경우(특히 살찐 뒤 영양이 갑자기 떨어진 소), 기생충, 이빨 불량, 파행, 갑작스런 춥고 비 오는 날씨·처치·수송 같은 스트레스다.</span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>젖소에서 임신 말기 케토시스는 드물고 쌍태 소가 다른 병으로 사료를 못 먹을 때 생긴다. 치료하지 않으면 심한 변비, 기립불능, 신부전으로 죽으며 양과 달리 실명은 흔하지 않다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="61">•</span><span>살찐 육우가 분만 직전에 걸리면 공격적이고 안절부절못하며 흥분하고 비틀거린다. 잘 일어나지 못하고 쉽게 넘어진다. 분변이 적고 단단하며 빈맥이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>분만 2개월 전에 걸리면 10~14일 동안 침울하고 먹지 않다가 흉와로 눕는다. 호흡이 빠르고 날숨에 끙 소리를 내기도 한다. 콧물은 맑고 콧등 상피가 벗겨지기도 한다. 말기에는 악취 나는 노란 설사를 하고 혼수 상태로 조용히 죽는다. 경과는 10~14일이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>초기 신호는 거친 털, 사료 거부, 멍하고 무리에서 떨어지는 것이다. 진행하면 쇠약, 반추위 운동 저하(단단하고 마른 변), 신경 증상(약 10%: 핥기, 머리 밀기, 선회, 실명, 떨림), 기립불능, 달콤한 아세톤 입냄새가 온다. 생체징후는 대개 정상이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>소변 케톤 양성이며 케톤뇨가 케톤혈증보다 먼저 나온다. 혈당은 낮거나 정상이고, 말기(흔히 태아 사망 뒤)에는 오히려 높을 수 있다. 임신중독증은 대사성 산증의 원인 질환에 든다.</span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>감별은 저칼슘혈증, 리스테리아증, 회백질연화증, 유산 임박, 구리 중독, 반추위 산증, 저마그네슘혈증, 외상, 기생충이다. 분만 전 육우는 제4위 막힘, 미주신경성 소화불량, 만성 복막염과도 구별한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>에너지를 공급하고 에너지 요구를 늘리는 요인(태아)을 없앤다. 치료비와 예후를 먼저 따진다. 환축은 따로 떼어 에너지 소모와 사료 경쟁을 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>식욕부진과 기립불능 전이면 사료 조정과 당 전구물질(프로필렌글리콜, 글리세롤, 칼슘·나트륨 프로피오네이트, 당밀)로 충분할 수 있다. 가벼운 경우 프로필렌글리콜과 전해질을 먹인다. 프로필렌글리콜 1일 300 mL를 5일 먹이고, 50% 포도당 500 mL를 1회 정맥주사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>분만 유도는 덱사메타손 25~30 mg 근육주사, 또는 프로스타글란딘 F2α(디노프로스트(dinoprost) 25 mg 근육주사, 클로프로스테놀(cloprostenol) 500 µg 근육주사)로 하며 24~72시간 사이에 분만한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>유도 후 72시간 안에 분만하지 않거나 소 상태가 심하면 제왕절개로 포도당 수요를 없앤다. 태아는 대개 살 수 없고 소를 살리려는 처치다. 유도·제왕절개 후에는 광범위 항생제, 소염제, 옥시토신을 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>진행된 마른 소는 대개 치료가 듣지 않는다. 454kg 소는 하루 대사에너지 13 Mcal이 필요해 50% 포도당으로는 약 6.5L를 계속 점적해야 한다. 알팔파 펠릿 죽을 하루 약 11kg 강제 급여하고 프로필렌글리콜 150~200 mL를 하루 2회 먹인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>식욕이 돌아오는지가 가장 중요한 예후 인자다. 3일 이상 완전히 먹지 않은 심한 소는 집중 치료에도 대개 죽고 신경 증상이 있으면 예후가 매우 나쁘다. 오래 누워 있으면 회복 가능성이 크게 떨어진다. 살아남은 소는 난산, 후산정체, 분만 후 대사 질환이 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>한 마리가 걸리면 다른 소도 위험하다. 남은 소를 체형별로 나눠 급여하고, 너무 살찐 소에게는 가장 좋은 건초와 보충사료를 주며, 바닥에 사료를 뿌려 걷게 한다. 번식 시작부터 임신 끝까지 알맞은 체형을 유지하는 것이 예방의 핵심이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>마른 소의 예방은 임신 3기에 BCS 5~7(9점 척도)로 들어가게 하고 질 좋은 조사료를 충분히 주는 것이다. 질 낮은 조사료는 체중의 1~1.5%밖에 먹지 못하고, 기온이 10℃면 유지 에너지가 약 10%, 0℃면 20% 더 든다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">고사리 중독(bracken fern poisoning)</div>
<div class="bx-sub"><div class="bx-subtitle">급성 출혈형</div>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span>주 독성분은 프타킬로시드(ptaquiloside)로 골수를 억제해 모든 혈구가 줄고 혈소판·호중구 감소 증상이 나타난다. 독성이 누적되어 먹기 시작한 뒤 2~8주에 갑자기 증상이 나온다. 1~3개월 먹은 뒤 늦게 나타나기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>사료의 20%까지 고사리를 30일 이상 먹으면 발병하고 섭취를 멈춘 뒤에도 6주까지 새 환축이 나올 수 있다. 생풀도 말린 것도 독이 있고 어린 순과 뿌리줄기가 가장 독하다. 풀이 모자랄 때와 봄 새순 때 먹으며 말린 고사리를 깔짚으로 써도 문제가 된다. 무리 전체가 잠복 상태일 때 몇 마리만 증상을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>고열, 흑색변, 코피, 혈뇨, 점막 점상출혈, 눈 앞방 출혈, 눈·질 출혈이 나타난다. 호중구 감소로 폐 등 2차 감염이 흔해 호흡곤란이 온다. 다발성 내부 출혈과 균혈증으로 1~3일 안에 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>감별은 탄저, 소바이러스성설사(BVD), 퓨라졸리돈 중독, 스위트클로버 중독이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>특이 치료는 없다. 오염된 방목지·사료에서 옮기고 광범위 항생제, 수혈, 간호를 한다. 전혈·혈소판 수혈이 도움될 수 있으나 혈소판 5만/µL 미만, 백혈구 2,000/µL 미만으로 진행된 소는 대개 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>독은 젖으로 나와 포유 송아지도 걸릴 수 있다. 고사리의 티아미나제는 반추동물에서는 반추위 미생물이 티아민을 충분히 만들어 증상을 거의 일으키지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">효소성 혈뇨</div>
<p class="bx-num"><span class="bxn" data-n="80">•</span><span>고사리를 오래(대개 1~3개월에 걸쳐 체중만큼) 먹어 생기는 만성·간헐성 혈뇨로 급성 중독과 다르다. 프타킬로시드가 소 유두종바이러스 2형(BPV-2)과 함께 방광 종양을 일으킨다. 프타킬로시드는 오줌으로 나가 알칼리 오줌에서 발암물질로 바뀐다.</span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>오염 초지의 소는 2~3세에 혈뇨가 나타난다. 방광 유두종은 급여 1년 뒤부터, 침윤성 암은 2~6년 뒤 생기며 풍토 지역에서는 성우의 90%까지 걸린다. 방치되거나 새로 개간한 땅에서 주로 생기고 토지 관리가 좋아지면 사라진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>오래 끄는 간헐적 혈뇨가 첫 증상이고 핏덩이가 요도를 막기도 한다. 만성 출혈로 빈맥, 빈호흡, 창백한 점막, 체형 저하가 온다. 직장검사로 두꺼워진 방광벽과 종양이 만져질 수 있고 몇 달~몇 년 뒤 쇠약해 죽는다. 2차 방광염·신우신염이 생길 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>소변 스틱 잠혈 반응이 방광 병변의 수와 심한 정도와 연관된다. 육안 혈뇨가 없으면 오줌을 원심해 침전물에서 적혈구를 찾고, 여러 번 검사해야 할 수 있다. 응고 검사는 정상이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>갓 받은 오줌 침전물에 온전한 적혈구가 있으면 혈뇨다. 용혈성 질환과 달리 황달이 없고, 여러 마리가 걸리며 고사리가 있고 빈혈이 심하다. 감별은 방광염, 신우신염, 다른 독물에 의한 혈뇨이며 방광벽 비후는 방광염에서도 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>고사리를 줄이거나 없애는 것이 유일한 치료다. 종양이 생기기 전에 끊으면 혈뇨가 멈춘다. 일찍 도태하면 손실이 줄고 종양이 생긴 소는 도태한다. 프타킬로시드는 젖과 고기에도 나온다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">산후 혈색소뇨증(postparturient hemoglobinuria)</div>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>인이 부족한 토양의 풀을 먹는 소에 생기며 분만 한 달 안의 다산우에 많다. 걸린 소 대부분은 저인혈증이지만 전부는 아니고 셀레늄·구리·에너지가 함께 부족한 경우가 많아 인만으로 설명하기 어렵다. 케토시스 치료를 받은 소가 더 위험하다. 사료로 인을 결핍시킨 실험에서는 용혈이 생기지 않아 저인혈증이 직접 원인이 아닐 수 있다. 곰팡이독 시트리닌과도 연관된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>위험 요인은 저인 사료, 구리 결핍, 가뭄, 인 결핍 토양 방목, 오랜 축사 사육, 극한 추위, 유채·순무 등 십자화과 식물, 비트펄프 다량, 찬물이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>오줌이 붉은색에서 커피색으로 변하고 초기 39.4~40℃ 발열, 심박 80~130회를 보인다. 심하면 빈맥, 빈호흡, 창백한 점막, 차가운 사지 같은 저혈량 쇼크 징후가 오고 미열과 심기저부 수축기 잡음이 들릴 수 있다. 빈혈이 뚜렷하고 4~5일 뒤 조혈 반응이 나타난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>소변 스틱 혈색소 반응 양성이고 오줌 pH가 8~9로 높다. 급성은 3~5일에 죽거나 2~8주 회복기를 거친다(예후를 매우 나쁘게 2~5일에 폐사한다고 적은 책도 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>치료는 등장성 다중이온 수액이다. 심한 빈혈·저산소 징후가 있으면 전혈을 수혈하는데 총혈액량(체중의 약 8%)의 1/4~1/3이면 대개 충분하다. 수혈을 12시간 넘게 늦추면 되돌릴 수 없는 경우가 많고 성우에 적어도 5~6L가 필요하며 48시간 뒤 다시 필요할 수 있다. 수혈 뒤 수액으로 신장을 보호한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>무수 인산이수소나트륨(NaH2PO4) 30g을 멸균 증류수 300mL에 녹여 천천히 정맥주사하고 이어 경구 150~200g을 12~24시간마다 준다(정맥 60g/물 300 mL 뒤 인산나트륨 200~300g을 12시간마다 먹인다고 적은 책도 있다). 산성이라 피하주사는 하지 않고 부타포스판·톨디포스는 쓸 수 있는 인이 아니다. 구리 결핍이 의심되면 구리 글리시네이트 1.5 mg/kg를 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>예방은 분만 전후 인을 충분히 주고 알팔파, 사탕무, 십자화과 식물을 임신우 사료에서 빼는 것이다. 구리 결핍 지역은 구리도 보충한다.</span></p>
</div>
<div class="bx"><div class="bx-title">비만우 증후군(지방간, fat cow syndrome)</div>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>육우에서는 잘 먹던 살찐 소가 임신 말기에 갑자기 영양 섭취가 줄 때 가장 많고 드물게 분만 전 개체로 생긴다. 심한 형태가 임신중독증이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>위험 요인은 분만 때 비만(BCS 3.75/5 초과), 분만 직전 심한 사료 제한, 건유기 내내 에너지 과다, 긴 분만 간격이다. 비만 상태로 분만하는 고에너지 사육 미경산우도 심하게 걸린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>비만우가 분만 무렵 심한 식욕부진, 재발성 유열, 후산정체, 근병증, 패혈증을 보이는 것이 전형이다. 간 기능이 떨어져 가벼운 자궁염에도 악취 없이 패혈증으로 죽을 수 있다. 동반 질병은 가벼워도 찾아서 치료해야 하며 폐사율은 25%를 넘는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>치료는 신선한 사료를 하루 여러 번 주어 섭취를 돋운다. 50% 포도당 250~500mL 정맥주사를 3일 반복, 글루코코르티코이드(덱사메타손 10~30mg 또는 프레드니솔론 100~200mg, 임신우 금기), 프로필렌글리콜 300g/일, 글리세롤 200g/일, 칼슘 프로피오네이트 500g/일을 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>3일 이상 완전히 먹지 않는 소는 죽는다. 가장 중요한 치료는 강제 급여로 알팔파 가루, 염화칼륨 약 110g, 건강한 소의 반추위액을 섞어 하루 2회 먹인다. 일어서기 힘든 소에는 플루닉신 500mg을 주고 앞무릎에 붕대를 감는다. 콜린·메티오닌의 가치는 크지 않다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>심하고 합병증이 있으면 예후가 매우 나쁘다. 예방은 분만 간격을 12~13개월로 유지하고 체형을 살피는 것이다. 임신 7개월 이후에는 유지·임신 요구량 아래로 사료를 줄이면 반드시 역효과가 난다.</span></p>
</div>
<div class="bx"><div class="bx-title">케토시스(아세톤혈증, ketosis)</div>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>현장 진단은 휴대용 혈중 BHB 측정기가 가장 정확하며 1.2 mmol/L 이상을 고케톤혈증으로 본다. 소변 케톤 스틱은 특이도는 높으나 민감도가 낮고 오줌을 받을 수 있는 소가 절반쯤이다. 숨의 아세톤 냄새는 민감도가 약 50%다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>생체징후는 대개 정상이고 분변이 마르며 털이 거칠다. 저혈당으로 쇠약·운동실조가 오기도 한다. 신경형은 과도한 핥기, 울부짖기, 선회, 머리 밀기, 씹기, 강박 보행, 실명처럼 보이는 증상을 보이고 공격적일 수 있다. 광견병, 리스테리아증, 저마그네슘혈증, 급성 납중독과 감별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>케토시스는 대사성 산증의 흔한 원인이다. 예측은 어렵지만 중탄산 12 mEq/L까지 떨어지는 심한 경우도 있다. 케톤을 만드는 사료를 많이 먹어도 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>치료는 프로필렌글리콜 310g(300 mL)을 하루 1회 3~5일 물약으로 먹이고 사료에 섞지 않는다(250 mL 하루 2회에서 300 mL 하루 1회까지 최대 5일로 적은 책도 있다). 50% 포도당 500 mL 정맥주사는 BHB를 약 4시간 낮추고 프로필렌글리콜과 함께 쓸 때 가장 오래 간다. 250 mL를 쓰는 임상가도 있다. 50% 포도당이 혈관 밖으로 새면 조직 자극과 농양이 생긴다. 비타민B12를 하루 2~5mg(1.25~2.5mg으로 적은 책도 있다) 보조로 쓰나 근거는 약하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>코르티코스테로이드의 관례적 사용은 권하지 않는다. 덱사메타손 20mg 1회가 BHB 3.2 mmol/L 넘는 소에는 오히려 해로울 수 있다. 쓸 때는 포도당과 함께 쓰면 재발이 적고, 이소플루프레돈 과용은 심한 저칼륨혈증을 부른다. 코르티코스테로이드는 임신우에 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>신경형은 포도당 정맥주사와 포수클로랄 하루 40g 경구로 치료한다. 가벼운 케토시스는 대부분 1주 안에 낫고 분만 첫 주에 생겼거나 심하거나 지방간이 겹치면 예후가 나쁘다.</span></p>
</div>
<div class="bx"><div class="bx-title">골연화증(osteomalacia)</div>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>성장 대신 비유·임신의 소모가 원인이고 주로 인 결핍이 심한 지역의 소에 생긴다. 비타민D 결핍이 원인이면 저칼슘혈증도 함께 오고 뼈가 휘어 관절 통증이 심하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>뚜렷한 계기 없이 골절이나 힘줄 부착부 분리가 자주 생긴다. 옮겨 다니는 파행, 등 굽음이나 처짐, 저절로 생겨 낫지 않는 골절, 이식증, 여윔, 번식 저하를 보인다. 골반이 변형되면 난산이 생길 수 있고 결국 영구 기립불능으로 굶어 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>진단은 가슴이 납작한 모양과 뼈 회분의 칼슘:인 비율로 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>치료는 인·칼슘·비타민D 부족을 바로잡는다. 사료 칼슘:인은 2:1이 알맞고 체중 150~300kg 소는 하루 인 9~18g이 필요하다. 햇빛을 쬐게 하고 비타민D 10,000~30,000 IU/kg를 주사한다. 제대로 치료하면 예후가 좋지만 좋아지기까지 몇 주 걸리고 뼈 변형은 대개 영구적이다.</span></p>
</div>
<div class="bx"><div class="bx-title">비타민A 결핍증(vitamin A deficiency)</div>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>들에서 말린 건초는 비타민A 활성의 약 80%를 잃고 열·햇빛·습기가 카로틴을 파괴한다. 간 저장 때문에 결핍 사료를 먹고 약 180일 뒤 증상이 나온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>성우는 하늘을 보는 자세, 실명, 설사, 전신 부종, 안구진탕, 간헐적 경련을 보이며 자극하면 발작이 잘 오고 체형은 좋아 보인다. 소는 결막 건조 대신 눈물이 많고 각막 혼탁, 관절·앞가슴 부종, 폐렴·핑크아이 감수성 증가도 있다. 결핍 어미의 송아지는 실명, 둥근 이마, 굵은 앞무릎으로 약하게 태어난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>실명한 소는 동공이 커지고 빛 반사가 없어 동공 반사가 남는 회백질연화증·납중독과 구별된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>치료는 무리 전체에 비타민A 440 IU/kg를 주사하고 반복할 수 있으며 사료로 하루 40 IU/kg를 준다(440 IU/kg 뒤 사료가 개선될 때까지 50~60일마다 6,000 IU/kg를 주사한다고 적은 책도 있다). 기름보다 수용성 주사제가 낫다. 망막·시신경이 손상돼 실명한 소는 회복하지 못한다. 비타민 A·D 주사는 출하 2개월 안에 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>사료 건물 kg당 비육우 2,200 IU, 임신우 2,800 IU를 권한다.</span></p>
</div>
<div class="bx"><div class="bx-title">중독증 총론</div>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>여러 마리 급사는 독초, 화학물질, 낙뢰, 전염병을 함께 생각한다. 울타리를 따라 걸으며 독초와 뜯은 흔적을 찾고 의심 식물은 비닐봉지에 넣어 냉장으로 보내거나 사진을 보낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>질산염은 눈방수를 받고 간은 생것과 냉동을 함께 보낸다. 곰팡이가 보인다고 곰팡이독이 있는 것도, 안 보인다고 없는 것도 아니다.</span></p>
</div>
<div class="bx"><div class="bx-title">유기인제 중독(organophosphate poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>무스카린 증상(침 흘림, 눈물, 배뇨, 배변, 축동, 서맥, 호흡곤란, 고창, 일시적 설사), 니코틴 증상(근육 떨림, 고체온, 운동실조, 마비로 진행), 중추 증상(침울, 경련, 행동 변화)을 보인다. 피부 노출은 증상이 1~7일 늦게 나오기도 하고, 클로르피리포스 푸어온은 큰 숫소에 2~7일 뒤 쇠약, 근육 떨림, 반추위 정지를 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>진단은 노출 이력, 아트로핀 반응, 콜린에스테라아제 활성 저하(정상의 50% 미만이면 노출, 25% 미만이고 증상이 맞으면 중독)로 한다. 카바메이트는 활성이 정상으로 나올 수 있다. 노출 사실과 아트로핀 반응으로 진단하는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>아트로핀은 무스카린 증상만 되돌리고 떨림·마비는 되돌리지 못한다. 용량은 0.25~1 mg/kg(1/4 정맥, 나머지 근육·피하, 서맥과 분비물을 보며 2~4시간마다 낮은 용량으로 반복)이며, 0.25~0.50 mg/kg 필요할 때만 반복, 0.5~1.0 mg/kg 6시간 뒤 반복, 0.5 mg/kg로 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>프랄리독심(2-PAM)은 20 mg/kg 정맥주사 4~12시간마다(36시간 안에 반응 없으면 중단) 쓰며, 20~50 mg/kg 근육주사(처음 24~48시간)나 25~50 mg/kg 20% 용액을 6분에 걸쳐 정맥주사한다고 적은 책도 있다. 노출 24시간 안에 써야 반응이 좋고 카바릴(카바메이트)에는 해로울 수 있다. 결합이 비가역적이라 옥심을 쓸 수 없다고 적은 책도 있어 의견이 갈린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>안정된 뒤 활성탄 450~900g(500kg 소)을 죽으로 먹이고 피부는 주방 세제로 씻는다. 경련은 디아제팜으로 잡는다. 쿠마포스 같은 느린 제제는 10일까지 반복 치료해야 할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>아픈 소, 특히 탈수된 소에는 쓰지 않는다. 먹이는 약으로 쓸 때는 미리 물을 충분히 먹인다.</span></p>
</div>
<div class="bx"><div class="bx-title">유기염소제 중독(chlorinated hydrocarbon poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>침 흘림, 흥분, 떨림, 간대·강직성 경련, 후궁반장, 뒷걸음질, 과도한 핥기를 보인다. 경련은 며칠 이어지고 사이사이 정상으로 보이기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>피부는 비누와 물로 씻고 털이 길면 깎는다. 경구 노출은 활성탄 1~2 g/kg를 죽으로 먹이고 이후 하루 500~1,000g을 한동안 먹여 장간 순환을 줄인다. 활성탄이나 미네랄오일은 경구 노출 10~12시간 안에 주고 옥수수기름 같은 소화되는 기름은 흡수를 늘려 쓰지 않는다. 경련은 디아제팜·바르비투르산제로 잡는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>지방에 오래 남아 고기·우유 출하는 당국과 상의하며 시료는 알루미늄 포일이나 유리병에 담는다.</span></p>
</div>
<div class="bx"><div class="bx-title">쥐약 중독(rodenticide poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>항응고 쥐약은 먹고 2~10일(3~5일로 적은 책도 있다) 뒤 흑색변, 코피, 혈뇨, 상처·흡혈곤충 문 자리 출혈, 혈종, 관절·체강 출혈, 유산이 나타나고 급사도 한다. 작용 기간은 와파린 약 14일, 브로마디올론 21일, 브로디파쿰 등 2세대 30일이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>항응고 쥐약 치료는 비타민 K1 1.0 mg/kg 피하·근육 하루 2회 적어도 5일이다(1~2 mg/kg 근육·피하로 적은 책도 있다). 먹이는 K1은 반추위에서 분해돼 듣지 않고 K3는 대체제가 아니며 독성이 있다. 빈혈이 심하면 신선 전혈 2~6L를 수혈한다. 끝낼 때 K1을 48시간 끊고 응고 시간을 다시 잰다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>불화초산나트륨은 소에 심장 독성이 주로 와서 비틀거리고 떨며 땀을 흘리다 심부전으로 죽고, 실명·경련 같은 신경 증상도 보인다. 해독제가 없고 증상이 빨라 활성탄 처치도 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>인화아연은 젖은 위 내용물에서 썩은 생선 냄새 나는 포스핀 가스가 나오고 반추류 치사량은 약 60 mg/kg이다. 30분~4시간(때로 12~18시간) 뒤 고창, 운동실조, 기립불능, 호흡곤란을 보이며 치사량이면 48시간 넘게 살지 못한다. 해독제는 없다.</span></p>
</div>
<div class="bx"><div class="bx-title">청산 중독(cyanide poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>어린 생육기, 시들거나 서리·가뭄 피해를 입은 풀이 독하고 갓 벤 풀에서 주로 생긴다. 건초·사일리지로 만들면 독성이 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>먹고 10~15분 안에 불안, 쇠약, 운동실조, 과호흡 뒤 누워 경련하고 15~60분 안에 죽을 수 있다. 점막이 처음에 체리처럼 붉다. 죽지 않을 정도면 대개 1시간 안에 회복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>반추위 내용물에서 쓴 아몬드 냄새가 날 수 있고, 사료·반추위 내용물용 피크린산 종이 현장 검사가 있다. 간은 사후 4시간, 근육은 20시간 안에 밀폐 용기로 보낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>치료는 10% 티오황산나트륨 20 mL와 10% 아질산나트륨 10 mL를 섞어 정맥 또는 복강에 주거나, 30~40% 티오황산나트륨만 100kg당 25~50g 정맥주사한다. 식초 약 4L를 물 11~19L에 타 위관으로 넣기도 한다. 티오황산나트륨 0.5 g/kg(30~40%) 정맥주사, 또는 아질산나트륨 5g과 티오황산나트륨 15g을 물 200 mL에 섞어 정맥주사하는 것을 표준으로 하고 티오황산나트륨 660 mg/kg 고용량이 더 낫다고 적은 책도 있다. 질산염 중독이 함께 의심되면 아질산나트륨을 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>예방은 굶주린 소를 풀지 않고 수수는 키가 75cm를 넘은 뒤 주는 것이다. 서리 뒤 적어도 4~6일 기다린다. 임신우가 수수를 오래 먹으면 송아지가 관절굽음증으로 태어날 수 있다.</span></p>
</div>
<div class="bx"><div class="bx-title">질산염·아질산염 중독(nitrate·nitrite poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>같은 사료를 며칠·몇 주 먹다가 갑자기 생긴다. 그늘, 흐린 날, 질소비료, 가뭄, 서리, 제초제가 질산염을 쌓이게 하고 비 맞은 건초 더미 맨 아래 곤포에 몰린다. 밤과 이른 아침에 가장 높다. 사일리지로 만들면 30%까지 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>피가 초콜릿 갈색이고 점막이 흙빛이다. 메트헤모글로빈 30% 넘으면 증상, 80~90%면 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>질산염·아질산염은 태반을 넘어 노출 3~7일 이상 뒤 유산, 사산, 허약 송아지가 나온다. 급성 증상이 거의 없어도 유산할 수 있다. 태아나 어미 눈방수 질산염을 시판 스틱으로 재어 약 30 ppm 이상이면 강하게 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>치료는 메틸렌블루 1% 용액 4~15 mg/kg 정맥주사다(2~4% 용액 4~15 mg/kg, 1% 용액 5~15 mg/kg을 천천히 주고 증상이 남으면 낮은 용량을 추가, 1~2% 용액 1~2 mg/kg에서 심하면 10 mg/kg까지로 적은 책도 있다). 찬물이나 식초를 먹여 환원을 늦추고 미네랄오일로 배출을 돕는다. 심한 저산소 소는 다룰 때 스트레스를 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>조사료 질산염 5,000 ppm 미만은 대개 안전하다. 사료는 0.6% 미만이 좋고 10,000 ppm 넘으면 급성 중독, 0.6~1.0%면 번식 손실이 온다. 음수는 440 mg/L 미만이어야 하며 급성 중독은 1,300 mg/L(1,500 ppm으로 적은 책도 있다)을 넘을 때 온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>적응은 비임신 성우부터 시작한다. 의심 조사료는 섞거나 나눠 주고 임신우에게 주지 않으며 7~10일에 걸쳐 적응시킨다. 예취 높이를 약 45cm로 올린다.</span></p>
</div>
<div class="bx"><div class="bx-title">소금 중독(salt poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>총용존염 7,000 mg/L 넘는 물은 급성 중독을, 3,000 mg/L 미만은 안전하다. 급성 독성량은 약 2.2 g/kg이고 물을 제한하면 훨씬 적은 양으로 중독된다. 흔한 형태는 물을 못 먹다 갑자기 마음껏 마시는 물 중독이다. 얼어붙은 물, 제설 소금물을 마신 예가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>점액·피 섞인 설사, 복통, 하늘 보는 자세, 실명, 공격성, 발작, 머리 밀기, 계속 씹기, 안구진탕을 보이고 물을 급히 마시면 혈색소뇨가 오기도 한다. 뒷다리 구절이 꺾인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>치료의 핵심은 혈중 나트륨을 천천히 낮추는 것이다. 성우는 적은 물을 일정 간격으로 주고 마음껏 마시게 하지 않는다. 감소 속도는 시간당 0.5~1 mEq/L, 교정은 24시간 이상으로 하고 오래됐거나 시점을 모르면 0.5 mmol/L 이하로 한다. 경구 수액에는 소금을 넣어 등장으로 맞추고 물은 3~4일 뒤부터 서서히 준다. 5% 포도당액은 뇌부종을 악화시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>악화되면 만니톨 0.5~2.0 g/kg(20%) 정맥이나 글리세린 1 mL/kg(물과 반반) 경구, 덱사메타손 0.04~0.08 mg/kg, 티아민 10 mg/kg 피하를 쓴다. 탈수 없는 급성 과다 섭취면 푸로세마이드 0.5 mg/kg를 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>고나트륨혈증이 심하면 생리식염수에 소금을 더해 환자 혈청 나트륨보다 10~15 mEq/L 낮은 고나트륨 수액을 만들어 시간당 1~3 mL/kg로 주며, 대사성 산증이 있으면 소금 대신 중탄산나트륨으로 나트륨을 더한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>하루 소금은 건물섭취량의 4%를 넘지 않게 하고 깨끗한 물을 늘 준다. 소금을 못 먹던 소는 서서히 늘리고 탈수됐거나 굶은 소에게 주지 않는다.</span></p>
</div>
<div class="bx"><div class="bx-title">요소 중독(암모니아 중독, urea poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>적응하지 않은 소의 독성량은 약 0.45 g/kg, 적응한 소 치사량은 1~1.5 g/kg이다. 적응은 1~3일 만에 사라지고 어린 소가 더 민감하다. 덜 섞인 사료, 저에너지 사료, 24~48시간 굶긴 뒤 급여가 위험하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>먹고 30분~몇 시간 안에 쇠약, 호흡곤란, 침 흘림, 이갈이, 고창, 흥분, 울부짖음, 눈꺼풀·입술·목에서 시작해 뒤로 퍼지는 떨림, 경련이 오며 흔히 죽은 채 발견된다. 주 사인은 호흡 정지이고 저마그네슘혈증과 비슷하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>살아 있는 소나 아주 갓 죽은 소의 반추위액 pH가 8.0을 넘으면 비단백태질소 중독에 맞고, 사후 pH는 죽은 뒤 시간이 지나면 믿기 어렵다. 혈액이나 눈 유리체의 암모니아가 1.0 mg/dL를 넘는다. 요소 중독은 대사성 산증을 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>치료는 성우에 찬물 20~30L와 식초 2~6L를 위관으로 넣는다. 5% 초산은 강직성 경련 전에 먹여야 효과가 있고 보조로 등장성 수액, 칼슘·마그네슘 정맥주사를 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>요소는 곡류 사료의 3%, 전체 사료의 1%를 넘지 않게 하고 사료 질소의 1/3 넘게 비단백태질소로 주지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>당이 많은 양질 조사료를 암모니아 처리하면 이미다졸이 생겨 갑자기 날뛰어 원을 그리거나 내달려 부딪히고 귀 씰룩임, 동공 확대, 떨림, 울부짖음을 보인다. 독이 젖으로 나와 포유 송아지만 걸리기도 하며 급여를 멈추면 대개 회복한다. 혈중·반추위 암모니아는 정상이다. 처리는 질 낮은 조사료에만, 암모니아는 건물의 3% 이하, 처리 온도는 70℃ 이하로 하고 포유 중인 어미에게는 주지 않는다.</span></p>
</div>
<div class="bx"><div class="bx-title">맥각 중독(성우, ergotism)</div>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>맥각(균핵)은 눈에 보이며 호밀, 트리티케일, 밀, 보리, 귀리 낟알을 대신하고 옥수수에는 없다. 서늘하고 축축한 봄과 서리 뒤에 많다. 사료에 맥각 0.3~1.0%면 사지 끝 건성 괴저와 파행이 온다. 송아지 맥각 중독은 근골격 탭에 따로 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>오염 풀밭에 나간 뒤 빠르면 10일, 대개 2~4주 뒤 파행이 시작된다. 말초 괴저는 추운 계절, 고체온형은 더운 날씨에 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>괴저는 뒷다리 아래·꼬리·귀에 붉어짐, 부종, 냉감, 털 빠짐, 감각 소실로 시작해 청흑색으로 마르고 며칠 뒤 경계가 생겨 떨어진다. 아프지 않지만 초기부터 절고 설사가 따르기도 한다. 관상대가 붉게 붓고 살이 빠지며 발을 구르고 뒷다리 구절이 꺾이는 것이 첫 신호일 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>고체온형은 41~42℃, 호흡곤란, 침 흘림을 보이고 30℃ 넘는 날 운동시키면 죽기 쉽다. 시간이 지나면 회복한다. 유산을 일으킬 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>오염 곡물을 바로 뺀다. 효과적인 치료는 없고 그 이상 치료는 대개 하지 않는다. 사료 속 맥각 이삭은 0.1%를 넘지 않게 하고, 오염 풀밭은 예취기 날을 높여 이삭을 먼저 베고 뜯긴다. 임신우에게는 주지 않는 것이 좋다.</span></p>
</div>
<div class="bx"><div class="bx-title">곰팡이 중독(마이코톡신 중독, mycotoxicosis)</div>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>곰팡이 동정이나 포자 수로는 판단하지 못하고 사료 독소 농도를 직접 분석한다. 쭉정이·부서진 낟알에 독소가 가장 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>아플라톡신은 간 손상, 성장·섭취 저하를 일으키고 어린 소가 민감하다. 제랄레논은 비정상 발정, 외음부 부종, 수태율 저하, 유산을 일으키며 미경산우가 더 민감하고 깨끗한 사료로 바꾸면 3~7주에 사라진다. T-2 독소는 출혈, 떨림 곰팡이독은 방목 중 떨림을 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>오염 사료를 끊으면 가벼운 노출은 3~6주에 회복한다. 가볍거나 부서진 낟알을 골라내면 독소가 크게 준다. 아플라톡신에는 알루미노실리케이트·벤토나이트 흡착제가 효과가 인정되나 다른 독소용 흡착제는 분명하지 않다.</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>곡물 수분을 15% 미만으로 낮추면 아플라톡신이 생기지 않는다. 미국 아플라톡신 기준은 번식 육우용 옥수수 100 ppb, 어린 소 사료 20 ppb다.</span></p>
</div>
<div class="bx"><div class="bx-title">도토리 중독(acorn poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>푸른 잎이나 도토리를 먹고 3~7일 뒤 증상이 나온다. 봄에는 어린잎·눈, 가을에는 도토리가 문제이고 가뭄이나 폭풍으로 가지·도토리가 떨어진 뒤 많다. 사료의 50% 이상을 참나무로 먹으면 증상이 나오고 300kg 미만 어린 소가 더 심하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>변비 뒤 혈변이나 흑색 타르변, 아랫배·회음·음문·턱밑·앞가슴의 심한 부종이 생긴다. 급성은 무뇨, 그 밖에 다뇨·혈뇨, 복수를 보인다. 경과는 1~12일이나 노출을 멈추고 21일 뒤 신부전으로 죽은 예도 있으며 치명률이 80%를 넘는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>급성기에는 저나트륨·고칼륨·저염소·고인혈증, 뚜렷한 저칼슘혈증(5.1~6.8 mg/dL), 음이온차가 아주 높은(29~32) 가벼운 대사성 산증이 온다. 오래 끈 경우는 음이온차가 높고 저칼륨혈증과 가벼운 대사성 알칼리증을 보인다. 대사성 산증이면 중탄산나트륨으로 교정한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>치료는 정맥 수액으로 이뇨와 전해질 교정을 하고 무뇨면 푸로세마이드 1 mg/kg를 12시간마다 정맥주사한다. 코르티코스테로이드·비스테로이드 소염제는 경과를 바꾸지 못한다. 2차 폐렴 예방 항생제, 반추위액 이식, 건초와 물을 주고 신독성 항생제는 피한다. 반추위 절개를 하기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>초기에는 수산화칼슘, 활성탄, 하제(미네랄오일 500kg당 1L, 황산나트륨 400kg당 1kg, 황산마그네슘 400kg당 450g)가 도움이 될 수 있고 폴리에틸렌글리콜 1 g/kg/일이 타닌과 결합한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>계속 무뇨면 예후가 나쁘고, 스스로 먹기 시작하면 회복이 좋으며 신장 기능은 5~10주에 돌아온다. 회복은 대개 60일 안이다. 예방은 노출 직전부터 수산화칼슘 10% 펠릿을 하루 약 0.9kg(10~15% 펠릿 1kg으로 적은 책도 있다) 먹이는 것이다. 갑자기 참나무에 노출된 소에 아무 사료라도 주면 폐사가 준다.</span></p>
</div>
<div class="bx"><div class="bx-title">감자 중독(potato poisoning)</div>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>독은 덜 익은 열매, 잎, 싹, 퍼런 덩이줄기에 몰려 있고 반추류는 솔라닌에 비교적 강하다. 감자가 사료의 50%를 넘어야 중독이 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>침 흘림, 복통, 설사나 변비, 동공 확대, 침울, 운동실조, 떨림을 보이며 몇 시간~며칠 잠복기가 있을 수 있다. 소에서는 다리의 물집·딱지 피부염이 더 흔한 증후군이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>해독제는 없고 활성탄 1~5 g/kg를 죽으로 먹이며 대개 예후가 좋다. 싹 나거나 병든 감자는 끓여서 사료의 25% 미만으로 주면 안전하다.</span></p>
</div>
<div class="bx"><div class="bx-title">항생물질·예방접종 쇼크(anaphylaxis)</div>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>백신, 페니실린·테트라사이클린·설파제, 국소마취제가 원인이 되며 1시간 안에 주사한 이력이 있다. 프로카인 반응은 흥분과 콧김을 보이나 부종이 없다. 고농도 비타민E·셀레늄 근육주사 몇 분 뒤 허탈·호흡곤란이 오기도 하며 10~20%가 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>항원 노출 후 대개 10~20분 안에 심한 호흡곤란, 근육 떨림, 불안, 머리·목을 뻗고 입 벌려 숨쉬기, 입 거품, 인후 부종으로 그르렁거림이 오고 체온이 40.5℃까지 오를 수 있다. 털이 서고 두드러기, 잦은 배뇨·배변 시도를 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="172">•</span><span>감별은 급성 고창, 급성 기관지폐렴, 급성 간질성 폐렴이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>에피네프린(원문 표기 1/100)을 체중 45kg(원문 100 lb)당 1mL 피하 또는 정맥주사하고 필요하면 15~20분 뒤 한 번 더 준다(1:1000을 성우에 2~10 mL 근육·피하(심하면 2~4 mL 정맥), 또는 500kg 소에 4~8 mL 정맥·피하로 적은 책도 있다). 반감기가 짧아 재발을 지켜본다. 대부분 1회로 충분하나 심하면 8~12시간 간격으로 반복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>보조로 플루닉신(flunixin meglumine, 50mg/mL) 45kg당 1~2mL 정맥·근육주사(1.1 mg/kg 정맥), 트리펠레나민 1 mg/kg, 폐부종에 푸로세마이드 0.5~1.0 mg/kg 근육, 비임신우 덱사메타손 20~40mg을 쓴다. 코르티코스테로이드는 에피네프린 뒤에 준다. 증상이 나온 뒤 항히스타민제는 효과가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>대개 12~24시간에 정상으로 돌아오며, 이후 유산할 수 있고 24시간 동안 폐기종을 살핀다.</span></p>
</div>
</div>
`;
}
function med_prevHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 예방</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">구입우 격리와 차단방역</div><p class="bx-num"><span class="bxn" data-n="1">•</span><span>사 온 소로 전염병이 들어오는 일이 많다. 송아지는 되도록 적은 곳에서, 가능하면 한 농장에서 직접 사고, 가축시장에서 여러 곳 송아지를 모으는 것은 피한다.</span></p><p class="bx-num"><span class="bxn" data-n="2">•</span><span>우군을 닫아 두고, 들일 때는 격리·검사 뒤 합사한다. 임신우는 분만 때까지 격리하고 태어난 송아지의 BVD 지속감염 검사를 한 뒤 들인다.</span></p><p class="bx-num"><span class="bxn" data-n="3">•</span><span>새로 들인 소는 격리 중에 기생충 부담과 구충 반응도 확인한다.</span></p></div>
<div class="bx"><div class="bx-title">초유 급여와 수동면역</div><div class="bx-sub"><div class="bx-subtitle">급여 시기·양</div><p class="bx-num"><span class="bxn" data-n="4">•</span><span>장의 면역글로불린 운반 능력은 생후 2시간부터 20시간까지 직선으로 떨어지고 24~36시간에 멈춘다. 생후 12시간 넘어 처음 먹으면 무감마글로불린혈증 위험이 크게 오른다. 2시간 안 급여에 비해 4·6·12시간에 먹이면 24시간 혈청 IgG가 10~15%·25~30%·40~50% 낮았다.</span></p><p class="bx-num"><span class="bxn" data-n="5">•</span><span>생후 4~6시간 안에 IgG 150g 이상을 먹인다(생후 6시간 안에 총 IgG 280~300g을 목표로 적은 책도 있다). 육우 송아지는 어미 초유 2~3L를 빨면 된다. 젖소 송아지는 생후 12시간 안에 4L를 먹이고 첫 2L는 1~2시간 안에 준다.</span></p><p class="bx-num"><span class="bxn" data-n="6">•</span><span>육우 송아지는 어미에게 초유가 있고 생후 2~4시간 안에 서서 빨면 대개 충분하다. 6시간까지 빨지 못하면 냉동초유나 대용초유를 먹이며, 대용초유는 IgG 최소 100g, 가능하면 150g을 준다(생후 6시간 안에 IgG 250~300g 이상으로 적은 책도 있다). 초유 보조제(IgG 25~60g)만으로는 충분한 면역이 생기지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="7">•</span><span>난산·제왕절개 송아지는 수동면역 실패 위험이 크다. 생후 4시간 안에 못 빤 육우 송아지는 충분한 면역에 이를 가능성이 6.4배 낮았고, 빠는 반사가 약하면 4시간 안에 못 먹을 위험이 41.6배였다. 어미를 보정틀에 넣고 15~20분 빨게 하고, 빠는 반사가 약하면 짜서 먹인다.</span></p><p class="bx-num"><span class="bxn" data-n="8">•</span><span>식도 급여기(튜브)는 1.5L 넘게 줄 때나 빨지 않을 때만 쓰고, 그보다 적으면 젖병이 낫다.</span></p><p class="bx-num"><span class="bxn" data-n="9">•</span><span>신생 송아지 활력 목표는 머리 들기 생후 3분, 흉와위 5분, 일어서려는 시도 20분, 스스로 서기 60~90분이다.</span></p><p class="bx-num"><span class="bxn" data-n="10">•</span><span>분만 전에 사료를 심하게 제한하지 않는다. 초유량이 줄고 진해져 송아지가 빨기 어려워진다.</span></p><p class="bx-num"><span class="bxn" data-n="11">•</span><span>초유를 2주간 계속 먹이면 장 점막 국소 방어로 설사가 준다. 장이 닫힌 뒤에도 초유는 장 안에서 보호한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">초유 질·보관</div><p class="bx-num"><span class="bxn" data-n="12">•</span><span>겉모양으로는 IgG 농도를 알 수 없다. Brix 굴절계 22% 이상이 IgG 50g/L 이상에 해당하고(21~23%가 50g/L로 적은 책도 있다), 18% 미만은 저질이다. 육우 초유는 IgG 50·75·100g/L가 Brix 22.5·25.5·26.9%였고 평균 IgG는 95.9g/L였다.</span></p><p class="bx-num"><span class="bxn" data-n="13">•</span><span>초산우 초유도 검사 없이 버리지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="14">•</span><span>분만 후 1시간마다 IgG가 3.7% 준다. 6·10·14시간 늦게 짜면 17·27·33% 준다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>총세균 10만 CFU/mL 미만, 대장균군 1만 CFU/mL 미만이어야 한다. 세균이 많으면 IgG 흡수도 준다. 초유 급여기는 아픈 송아지에 쓰지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>여러 소의 초유를 섞지 말고 다른 농장 초유는 쓰지 않는다. 요네병, 살모넬라, 백혈병 등이 옮을 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>짠 뒤 1시간 안에 냉장·냉동한다. 냉장은 12시간까지(1주 이내로 적은 책도 있다), -20℃ 냉동은 1년까지 두며 1~2L 용기에 개체별로 표시해 얼린다. 2L 용기에 나눠 냉장하면 2일 안에 쓰고, 48시간 넘게 냉장하면 수동면역 실패가 생길 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>40·50·60·70℃에서 녹이면 IgG1이 8·14·15·26%, 전자레인지 200·350W는 20·31% 줄었다. 1~4L씩 납작한 봉지로 얼리고 40℃ 물에 흔들며 녹인다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">수동면역 평가·실패</div><p class="bx-num"><span class="bxn" data-n="19">•</span><span>생후 24~48시간 혈청 IgG 10mg/mL 미만이 수동면역 실패다. 육우는 24시간 IgG 24g/L 초과, 혈청단백 6.0g/dL 초과일 때 이환·폐사가 줄었고, 24g/L 미만이면 발병 1.6배, 이유 전 폐사 2.7배였다.</span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>굴절계로 재면 혈청단백 5.0g/dL 미만은 실패, 5.0~5.5 경계, 5.5 초과가 적정이다. 우군 목표는 80%가 5.5 초과(12두 중 9두 이상)이고 생후 1~7일에 12두 이상 검사한다. 설사 송아지는 탈수로 높게 나오므로 빼며, 대용초유를 먹인 송아지는 신뢰도가 낮다. 혈청 Brix 8.3% 미만도 실패로 보고 8.4% 이상(가능하면 10%)을 목표로 한다.</span></p><p class="bx-num"><span class="bxn" data-n="21">•</span><span>실패 자체는 병이 아니라 감염병 소인이다. 약 70%는 살지만 생산 손실이 남을 수 있다. 육우 송아지 실패율은 9~32%이고 이환·폐사의 가장 흔한 위험요인이다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>초유 IgG 반감기는 16~20일이라 90~120일령에는 2% 미만만 남고, 5~8개월령 전에는 능동면역이 약하다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>치료는 혈장 20~40mL/kg이며(혈장·전혈 10~20mL/kg 또는 40mL/kg으로 적은 책도 있다) 어미나 BLV·BVDV 음성 소에서 얻는다. 처음 5mL/kg/시간으로 30분 관찰한 뒤 10~20mL/kg/시간으로 준다. 이상반응은 떨림, 두드러기, 부종, 털 세움, 거친 숨소리, 심박·호흡 증가다. 좌측 겸부 중앙으로 복강 투여도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>수혈한 IgG 반감기는 4.4일로 초유 IgG 17.1일보다 짧다. 실패 송아지는 병원체 노출을 줄이고, 환경이 나쁘면 예방적 광범위 항생제를 고려한다.</span></p><p class="bx-num"><span class="bxn" data-n="25">•</span><span>배꼽은 생후 곧 요오드 팅크나 클로르헥시딘으로 소독한다. 조산한 송아지는 클로르헥시딘 침지가 효과 있었고 요오드는 결과가 엇갈렸다.</span></p></div></div>
<div class="bx"><div class="bx-title">분만 관리</div><p class="bx-num"><span class="bxn" data-n="26">•</span><span>초산우와 경산우를 따로 분만시키고 초산우는 3~4주 먼저 분만하게 한다. 분만장은 배수가 잘 되고 밀도가 낮으며 깨끗하고 건조해야 한다.</span></p><p class="bx-num"><span class="bxn" data-n="27">•</span><span>신생 설사는 대개 1~3주령에 생기고, 분만기 후반에 태어난 송아지일수록 앞서 태어난 송아지가 불린 병원체에 더 많이 노출된다. 주령이 다른 송아지를 떼어 놓고 임신우를 정기적으로 깨끗한 분만 구역으로 옮기면 줄었다. 초산우의 송아지는 초유량·질이 낮고 난산이 많아 위험이 크다.</span></p></div>
<div class="bx"><div class="bx-title">백신 사용 원칙</div><p class="bx-num"><span class="bxn" data-n="28">•</span><span>면역이 제대로 작동하려면 단백질·에너지와 비타민 A·E, 구리, 셀레늄, 아연이 충분해야 한다. 접종이 곧 면역이나 방어를 뜻하지는 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="29">•</span><span>신생 송아지에게는 어떤 백신보다 충분한 초유가 더 중요하다. 분만 때 분비되는 코르티코스테로이드 등으로 생후 첫 주에는 전신 면역반응이 크게 떨어진다.</span></p><p class="bx-num"><span class="bxn" data-n="30">•</span><span>모체항체가 높으면 첫 접종 뒤 항체가 오르지 않지만 B세포 기억과 세포면역은 생길 수 있어 간섭이 생각만큼 절대적이지 않다. 클로스트리디움 항체는 2~3개월령까지, 호흡기 바이러스 항체는 4~5개월령(5~6개월령으로 적은 곳도 있다)까지 간다.</span></p><p class="bx-num"><span class="bxn" data-n="31">•</span><span>거세, 제각, 이유, 이동 때는 전신 접종을 피한다. 접종 1주 안에 코르티코스테로이드를 쓰지 않는다. 이미 아프거나 스트레스가 심한 소는 반응이 없고 면역계에 부담만 준다.</span></p><p class="bx-num"><span class="bxn" data-n="32">•</span><span>사독백신은 보강접종을 해야 방어가 생기고 빠뜨리면 거의 면역이 없다. 너무 일찍 놓으면 2차 반응이 없고 너무 늦으면 첫 접종처럼 된다. 전신 접종 뒤 2주면 면역을 기대하고 비강 접종은 48시간 안에 점막면역이 생긴다.</span></p><p class="bx-num"><span class="bxn" data-n="33">•</span><span>백신은 아이스박스 등에 넣어 서늘하고 햇빛 없게 둔다. 생백신은 1시간 안에 쓸 양만 녹이고 남은 것은 보관하지 않는다. 표시가 없으면 같은 주사기에 섞지 않는다. 바늘은 5~10두마다 바꾸고, 생백신 기구는 화학 소독제로 소독하지 않는다(남은 소독제가 백신을 죽인다). 가능하면 피하주사 제품을 쓰고 목에 놓는다.</span></p><p class="bx-num"><span class="bxn" data-n="34">•</span><span>접종 뒤 최소 30분 지켜본다. 아나필락시스는 몇 분 안에 떨림·땀으로 시작하며, 에피네프린 1:1000 용액을 체중 50kg당 1mL 가능하면 정맥으로 준다. 대부분 백신에서 5,000~10,000회에 1회 이하지만 살모넬라·대장균 같은 그람음성균 백신은 더 잦다.</span></p></div>
<div class="bx"><div class="bx-title">송아지 설사병 예방접종(로타·코로나·대장균)</div><p class="bx-num"><span class="bxn" data-n="35">•</span><span>임신우에 접종해 초유로 송아지를 보호한다. 처음 맞는 임신우는 분만 6주·3주 전 2회, 전에 맞은 소는 분만 3~4주 전 1회 접종한다. 어미 혈청 항체가 오르는 때가 초유 생성 시기와 맞아야 해서 너무 이르거나 늦으면 초유로 덜 넘어간다. 제품마다 시기가 다르므로 제조사 지시를 따른다.</span></p><p class="bx-num"><span class="bxn" data-n="36">•</span><span>송아지 경구 백신은 출생 직후 초유 전에 먹이고 초유는 몇 시간 늦춘다. 초유 항체가 백신 바이러스를 중화하므로 생후 1일이 넘으면 효과가 없을 수 있고, 현장에서 시간을 맞추기 어려워 효과가 엇갈린다.</span></p><p class="bx-num"><span class="bxn" data-n="37">•</span><span>장독소성 대장균 설사는 주로 생후 72시간 안에 생기고 72~96시간령이면 송아지가 강해진다. 백신 맞은 어미의 초유를 생후 첫날 충분히 먹어야 막으며, 초유를 못 먹은 송아지는 어미 백신으로 보호되지 않는다. 부착성 대장균(AEEC·STEC)은 이 백신으로 막지 못한다.</span></p><p class="bx-num"><span class="bxn" data-n="38">•</span><span>어미 백신이나 초유 보조제로도 육우 송아지 설사 발생을 늘 막지는 못한다.</span></p></div>
<div class="bx"><div class="bx-title">호흡기병 혼합백신</div><p class="bx-num"><span class="bxn" data-n="39">•</span><span>전염성비기관염(IBR), 소바이러스성 설사(BVD), 파라인플루엔자3(PI3), 소합포체성폐렴(BRSV), 헤모필러스를 담은 혼합백신이다. 생독 주사·비강 백신은 3일 안에 면역이 생기고, 사독백신은 2회 맞혀야 한다.</span></p><p class="bx-num"><span class="bxn" data-n="40">•</span><span>생독 IBR 주사 백신은 태아에 감염해 유산을 일으킬 수 있다. 대부분 임신우와 임신우를 빠는 송아지에는 허가되지 않았고, 번식 전 같은 계열을 맞고 12개월 안에 다시 맞은 소에 쓰도록 허가된 제품만 예외다. 그 밖에는 비강 생백신이나 사독백신을 권한다. 수정 3~4일 전이나 14일 뒤의 생독 주사 백신은 수태율을 떨어뜨렸다.</span></p><p class="bx-num"><span class="bxn" data-n="41">•</span><span>6개월령 전에 맞은 송아지는 모체항체에 막혔을 수 있어 재접종하며 6~8개월령에 다시 놓는 경우가 많다. 비강 생백신은 모체항체가 있어도 면역을 만들 수 있다. 3개월령 전 호흡기 백신 접종이 바람직해 보이나 근거는 아직 부족하다.</span></p><p class="bx-num"><span class="bxn" data-n="42">•</span><span>이유 2~4주 전에 호흡기 바이러스 백신과 클로스트리디움 보강접종을 하고, 이유 때 호흡기 백신을 보강한다.</span></p><p class="bx-num"><span class="bxn" data-n="43">•</span><span>12~14개월령 미경산우는 번식 최소 1개월 전에 접종하고, 2회 맞히는 제품은 2차를 번식 1개월 전까지 끝낸다. 수소는 생독 IBR이 다시 활성화돼 정액으로 나올 수 있어 사독백신을 권한다.</span></p></div>
<div class="bx"><div class="bx-title">만헤이미아(파스튜렐라) 폐렴 백신</div><p class="bx-num"><span class="bxn" data-n="44">•</span><span>Mannheimia haemolytica 단독, 또는 Mannheimia haemolytica와 Pasteurella multocida 혼합 백신이다.</span></p><p class="bx-num"><span class="bxn" data-n="45">•</span><span>이유·수송·노출 15~21일 전에 놓고, 위험 시기보다 2~3주 넘게 앞서 놓았으면 수송 전에 보강한다. 생독 IBR·PI3 백신과 함께 놓으면 만헤이미아 백신 효과가 떨어졌다.</span></p><p class="bx-num"><span class="bxn" data-n="46">•</span><span>수송 전 최소 40일 이유가 백신보다 발병을 줄이는 데 더 중요해 보였다. 가볍고 위험도 높은 송아지에게는 백신 내독소 때문에 이득이 적다.</span></p></div>
<div class="bx"><div class="bx-title">탄저·기종저 백신</div><p class="bx-num"><span class="bxn" data-n="47">•</span><span>기종저 백신은 2세 미만 어린 소에 1년에 2회 접종하고, 생애 첫 접종 4~6주 뒤 보강한다. 방어면역은 보통 접종 2주 뒤 생긴다. 임신 말기 어미에 접종하면 초유로 송아지를 지킨다.</span></p><p class="bx-num"><span class="bxn" data-n="48">•</span><span>기종저가 발생하면 감수성 소 모두 접종하면서 프로카인 페니실린을 함께 준다.</span></p><p class="bx-num"><span class="bxn" data-n="49">•</span><span>탄저 백신은 상재지에서 계절 발생 2~4주 전에 접종하고 4~5주 뒤 보강, 이후 매년 접종한다(발생했던 초지에 내놓기 4주 전에 매년 목 피하 1회로 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="50">•</span><span>탄저 백신은 생균 백신이라 접종 전후 7~10일은 항생제를 쓰지 않는다(항생제를 쓴 뒤 최소 7일 지나 접종한다고 적은 책도 있다).</span></p></div>
<div class="bx"><div class="bx-title">아까바네병 백신</div><p class="bx-num"><span class="bxn" data-n="51">•</span><span>생백신·사독백신을 번식 전에 놓는다. 사독백신은 임신 전 2회와 매년 보강접종한다. 면역 없는 소는 번식 전에 상재지에 들여 면역이 생기게 한다.</span></p><p class="bx-num"><span class="bxn" data-n="52">•</span><span>초유를 먹은 송아지의 모체항체는 4~5개월 가며 육우가 젖소보다 조금 길다.</span></p></div>
<div class="bx"><div class="bx-title">유행열 백신</div><p class="bx-num"><span class="bxn" data-n="53">•</span><span>자연감염은 평생 면역을 남긴다. 생백신은 방어가 좋고 사독백신은 6개월만 지킨다.</span></p></div>
<div class="bx"><div class="bx-title">구제역 백신</div><p class="bx-num"><span class="bxn" data-n="54">•</span><span>혈청형 사이 교차방어가 약해 그 지역 유행주와 같은 아형의 백신이어야 한다. 발생 때는 같은 주로 둘레(링) 접종을 한다.</span></p></div>
<div class="bx"><div class="bx-title">법정 가축전염병 정기검사(국내 제도)</div><p class="bx-num"><span class="bxn" data-n="55">•</span><span>국내 제도에 따라 정기적으로 검사해야 할 질병이다. 검진기관은 축산위생연구소다.<table class="bxt"><tr><th>질병</th><th>검진 시기</th><th>대상</th><th>양성축 처리</th><th>기타</th></tr><tr><td>우결핵, 브루셀라병</td><td>연중</td><td>성우 및 송아지</td><td>살처분·매몰</td><td>살처분 시 보상금 지급</td></tr><tr><td>요네병</td><td>필요시</td><td>성우</td><td>도태</td><td>2세 이상에서 발생이 많다</td></tr></table></span></p><p class="bx-num"><span class="bxn" data-n="56">•</span><span>소를 살 때 결핵·브루셀라병 비발생 농가의 소인지 질병검진카드로 확인한다. 입식하면 다른 소와 격리 사육하고 검진 후 합사한다. 자연교배용 수소는 반드시 검사한다.</span></p></div>
<div class="bx"><div class="bx-title">우결핵 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div><p class="bx-num"><span class="bxn" data-n="57">•</span><span>우결핵은 법정 제2종 가축전염병(현행 가축전염병예방법)이다. 결핵은 우군 병이라 농장 유입을 막는 것이 핵심이며 치료는 고려하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="58">•</span><span>국내 검사는 꼬리 밑 주름 피부에 튜버큘린 진단액을 접종하고 72시간 후 접종 전과 주름 두께 차이로 판정한다. 5mm 이상 양성, 3~5mm 의양성, 3mm 이하 음성이다. 한·육우는 혈액 ELISA와 감마인터페론 검사로도 진단할 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="59">•</span><span>꼬리주름 시험은 1차 선별검사다. 비결핵 항산균 노출로 위양성이 날 수 있어 조류형·우형 PPD를 따로 주사하는 비교 시험이나 감마인터페론 검사로 확인한다.</span></p><p class="bx-num"><span class="bxn" data-n="60">•</span><span>국내 제도상 생후 1년 이상 소는 매년 튜버큘린 검사를 하고 양성우는 살처분하며, 동거축은 60~90일 간격으로 2회 이상 재검사한다. 청정축군에서 사고 도입우는 동물위생시험소에서 사전검사하며, 잠복기가 길어 2~3개월 뒤 추가 검사를 권한다.</span></p></div>
<div class="bx"><div class="bx-title">브루셀라병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div><p class="bx-num"><span class="bxn" data-n="61">•</span><span>임신 후반기 유산, 약한 송아지, 태반정체가 특징이고 처음 들어온 우군에서는 집단 유산이 날 수 있다. 유산 태아·태막·분비물과 젖으로 균이 나온다.</span></p><p class="bx-num"><span class="bxn" data-n="62">•</span><span>진단은 혈청검사가 중심이며 로즈벵갈 같은 민감한 선별검사 뒤 보체결합 같은 특이한 확인검사를 한다. 국내에서는 한·육우 개체별 혈청을 로즈벵갈 응집반응으로 검사하고 양성은 시험관응집법으로 최종 판정하며, 혈액을 동물위생시험소에 의뢰한다.</span></p><p class="bx-num"><span class="bxn" data-n="63">•</span><span>국내 검사 제도는 사육 중인 1세(12개월) 이상 한·육우 암소 전 두수를 매년 1회 이상 개체별로 정기검사하고(거세우 제외) 양성우는 강제 폐기한다. 수집상·중개상이 기르는 소와 자연교배용 수소는 연 4회 이상 검사한다.</span></p><p class="bx-num"><span class="bxn" data-n="64">•</span><span>가축시장·농장 간 거래 소(검사증명서 유효기간 2개월)와 도축 출하 소(유효기간 3개월)는 검사증명서를 지녀야 한다. 살 때는 반드시 검사증명서를 확인하고 브루셀라병이 없던 음성농장에서 산다. 증명서 없는 소나 양성농장 동거소를 사는 것이 농장 발생의 시작이다.</span></p></div>
<div class="bx"><div class="bx-title">요네병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div><p class="bx-num"><span class="bxn" data-n="65">•</span><span>원인은 Mycobacterium avium subsp. paratuberculosis(MAP)이고 균이 섞인 분변이 주 감염원이다. 6개월령 미만이 가장 감수성이 높아 대부분 생후 6개월 안에 감염되고, 잠복기는 1년에서 수년이다. 감염우의 약 1/3은 초유·젖으로, 약 20%는 태반으로 균을 넘기며, 감염우의 10~15%만 임상형이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="66">•</span><span>물 같은 설사가 처음엔 간헐적이다가 계속되며 피·점액·악취는 없다. 식욕은 유지되면서 여위고, 진행하면 저단백으로 아래턱 부종이 온다. 보통 2~3년에 걸쳐 진행해 결국 죽는다. 증상 전부터 분변으로 균을 배출한다.</span></p><p class="bx-num"><span class="bxn" data-n="67">•</span><span>혈청 ELISA는 특이도가 높고(98% 이상) 민감도는 낮다(30~50%). 분변 고체배지 배양은 10~16주 걸린다. 농장 첫 사례는 ELISA보다 분변 배양·PCR로 확진한다. ELISA 강양성은 다량 배출우이므로 빨리 도태하고, 음성이면 감염됐더라도 유의한 양을 배출하지는 않을 것이다.</span></p><p class="bx-num"><span class="bxn" data-n="68">•</span><span>감별은 기생충, 구리 결핍, 백혈병, 살모넬라, 아밀로이드증, 만성 창상성 복막염이다.</span></p><p class="bx-num"><span class="bxn" data-n="69">•</span><span>어린 소가 성우 분변에 닿지 않게 한다. 깨끗한 곳에서 분만·사육하고, 초유·젖을 여러 송아지에 나눠 먹이지 않으며, 이유 송아지를 성우와 떼고, 송아지 사료·물에 성우 분변이 들지 않게 한다. 농장 유입은 주로 감염우 구입으로 생긴다. 치료약은 없다.</span></p></div>
<div class="bx"><div class="bx-title">내부기생충 구충</div><div class="bx-sub"><div class="bx-subtitle">방목우·송아지</div><p class="bx-num"><span class="bxn" data-n="70">•</span><span>첫 방목기 어린 소가 가장 위험하고, 두 번째 방목기 뒤의 성우는 증상이나 구충이 필요한 일이 드물다. 초산우와 어려서 방목하지 않은 새로 산 소는 구충이 필요할 수 있다. 방목 전과 방목 3·6주 뒤 구충한다(이버멕틴은 3·8주).</span></p><p class="bx-num"><span class="bxn" data-n="71">•</span><span>유두분선충은 오염된 바닥·깔짚에서 피부로 들어가고 젖으로 신생 송아지에 옮는다. 생후 약 1주부터 장에 산란 성충이 있을 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="72">•</span><span>소회충 유충은 어미 젖으로 신생 송아지에 옮고 어미 조직에 최소 5개월 남는다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">구충제 용량</div><p class="bx-num"><span class="bxn" data-n="73">•</span><span>아래 수치는 내성 문제가 없을 때의 기준이고 따로 적지 않으면 경구 용량이다. 나라·제형마다 허가가 달라 국내 제품 표시와 다를 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="74">•</span><span>계열은 벤지미다졸계(알벤다졸, 펜벤다졸, 옥스펜다졸), 레바미솔, 마크로사이클릭 락톤계(이버멕틴, 도라멕틴, 에프리노멕틴, 목시덱틴)다. 마크로사이클릭 락톤계는 응애·이·진드기·소가죽파리 유충에도 듣지만 간질과 조충에는 듣지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="75">•</span><span>마크로사이클릭 락톤계는 이버멕틴(ivermectin)·도라멕틴(doramectin)·목시덱틴(moxidectin) 경구·피하·근육 0.2mg/kg, 푸어온 0.5mg/kg. 에프리노멕틴(eprinomectin) 푸어온 0.5mg/kg, 서방형 주사 1.0mg/kg. 휴면 유충에도 잘 듣는다.</span></p><p class="bx-num"><span class="bxn" data-n="76">•</span><span>벤지미다졸계는 알벤다졸(albendazole) 10mg/kg, 펜벤다졸(fenbendazole) 5~10mg/kg, 옥스펜다졸(oxfendazole) 4.5mg/kg. 휴면 유충에 알벤다졸은 잘 듣고 펜벤다졸은 보통이다.</span></p><p class="bx-num"><span class="bxn" data-n="77">•</span><span>레바미솔(levamisole)은 경구 5~7.5mg/kg, 피부 바르기 10mg/kg. 휴면 유충에는 듣지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="78">•</span><span>간질은 클로설론과 알벤다졸이 성충에 듣는다. 알벤다졸 10mg/kg 경구는 성충에 듣고 충란도 죽인다. 클로설론(clorsulon)은 이버멕틴 합제로 2mg/kg 피하주사하며 성충과 12~14주령 미성숙충에 듣지만 8주령 충에는 효과가 일정하지 않다. 옥시클로자니드(oxyclozanide) 10mg/kg 경구, 트리클라벤다졸(triclabendazole) 12mg/kg 경구.</span></p><p class="bx-num"><span class="bxn" data-n="79">•</span><span>이버멕틴은 오스테르타기아 감염을 최대 21일, 쿠페리아 감염을 최대 14일 막는다. 이 잔류 효과 때문에 방목 송아지 반복 구충 간격을 이버멕틴 5주, 도라멕틴·에프리노멕틴·목시덱틴 8주로 늘린다.</span></p><p class="bx-num"><span class="bxn" data-n="80">•</span><span>경구제가 내성을 덜 만들고 푸어온에서 내성·치료 실패가 더 많았다. 송아지는 서로 핥아 푸어온 효과가 떨어지므로 송아지에게는 덜 알맞다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">내성 줄이기</div><p class="bx-num"><span class="bxn" data-n="81">•</span><span>소에서도 모든 계열에 내성이 보고됐다. 쿠페리아가 가장 흔하고 오스테르타기아·헤몬쿠스·트리코스트롱길루스에서도 확인됐다.</span></p><p class="bx-num"><span class="bxn" data-n="82">•</span><span>평균 체중으로 용량을 정하면 일부가 저용량을 받으므로 가장 무거운 소에 맞춘다. 투약기는 잘 관리·보정하고 체중계로 재는 것이 가장 좋다. 유효기간과 보관 조건을 지킨다.</span></p><p class="bx-num"><span class="bxn" data-n="83">•</span><span>분변 충란수 감소 시험으로 농장별 효과를 확인한다. 투약 때와 14일 뒤 분변을 비교하고, 소는 14일을 꼭 채운다. 소는 충란수가 낮아 적은 수도 잡는 부유법을 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="84">•</span><span>방목 경험이 있는 2년차 소와 성우는 구충하지 않아 약에 노출되지 않은 충을 남기고, 1년차 송아지를 해마다 같은 초지에 두지 않으며, 같은 계열을 해마다 송아지에 쓰지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="85">•</span><span>무리의 20%가 기생충의 80%를 지니는 일이 흔하므로 많이 지니고 증상 위험이 큰 개체를 골라 구충한다. 계열이 다른 약을 함께 쓰는 방법도 제시된다.</span></p></div></div>
<div class="bx"><div class="bx-title">휴약기간</div><p class="bx-num"><span class="bxn" data-n="86">•</span><span>휴약기간은 약을 쓴 뒤 출하할 수 있을 때까지 기다려야 하는 기간이다. 조직 잔류가 허용 기준 아래로 떨어져야 한다. 약물마다 다르고, 같은 약도 투여량, 나이, 질병 상태에 따라 달라진다.</span></p><p class="bx-num"><span class="bxn" data-n="87">•</span><span>휴약기간은 표시 용량과 투여 간격에 대해서만 정해져 있다. 표시 외 용량·간격으로 쓰면 휴약기간 설정은 수의사 책임이고, 표시 용량의 휴약기간으로 미루어 정할 수 없다.</span></p><p class="bx-num"><span class="bxn" data-n="88">•</span><span>테트라사이클린·아미노글리코사이드를 반복 투여하면 조직에 쌓였다가 천천히 빠져 휴약이 길어진다.</span></p><p class="bx-num"><span class="bxn" data-n="89">•</span><span>약을 쓰면 축주에게 휴약기간이 끝나기 전엔 출하할 수 없다고 알려야 한다. 법 규정과 표시 외 사용 요건은 미국 기준이라 국내와 다를 수 있다.</span></p></div>
<div class="bx"><div class="bx-title">파리·모기 구제</div><p class="bx-num"><span class="bxn" data-n="90">•</span><span>축사 살충제는 파리가 가장 많을 때보다 철 초에 뿌린다. 축사용 약을 소에 직접 뿌리면 중독될 수 있다. 미끼는 소가 먹지 못하는 곳에 둔다.</span></p><p class="bx-num"><span class="bxn" data-n="91">•</span><span>죽은 동물·태반은 치워 검정파리를 막고 상처를 매일 돌봐 구더기를 막는다.</span></p><p class="bx-num"><span class="bxn" data-n="92">•</span><span>늪·고인 물을 없애면 모기, 등에, 등에모기(Culicoides)가 준다.</span></p></div>
<div class="bx"><div class="bx-title">진드기 매개 질환 예방</div><p class="bx-num"><span class="bxn" data-n="93">•</span><span>진드기 구제는 일손이 많이 들고 진드기가 여러 살비제에 내성이 생겼다. 약욕·분무·푸어온·이버멕틴 제제를 쓴다. 타일레리아는 진드기가 옮기므로 방제도 방목 제한과 살비제 같은 매개체 구제가 중심이다.</span></p><p class="bx-num"><span class="bxn" data-n="94">•</span><span>바베시아·아나플라스마는 이미도카브 치료로 최대 2개월 재감염을 막을 수 있다. 면역 없는 소를 상재지로 옮기기 전에 백신을 맞힌다.</span></p><p class="bx-num"><span class="bxn" data-n="95">•</span><span>아나플라스마는 매개 곤충 구제와 함께 장기지속형 옥시테트라사이클린 20mg/kg을 매개체 철 시작부터 끝난 뒤 30~60일까지 21~28일 간격으로 주는 예방법이 있다.</span></p></div>
<div class="bx"><div class="bx-title">이 구제</div><p class="bx-num"><span class="bxn" data-n="96">•</span><span>이는 늦가을에 번식해 겨울에 가장 심하고, 여름에는 햇볕 받는 체표가 너무 뜨거워 줄어든다. 무리 안의 보균우가 여름을 넘기고 가을에 다시 퍼뜨린다. 털이 길고 밀집 사육하거나 면역이 떨어진 소에 많다.</span></p><p class="bx-num"><span class="bxn" data-n="97">•</span><span>가려움, 불안, 핥기가 주증상이고 젖은 붓으로 칠한 듯한 핥은 자국이 특징이다. 한두 마리만 심해 보여도 우군 문제다. 털을 가르거나 깎아 펜라이트로 보면 잘 씻기지 않는 갈색 점으로 보인다. 흡혈이가 많으면 빈혈이 온다.</span></p><p class="bx-num"><span class="bxn" data-n="98">•</span><span>마크로사이클릭 락톤계(이버멕틴, 목시덱틴, 도라멕틴, 에프리노멕틴) 주사·푸어온은 흡혈이와 씹는이 모두에 효과가 좋다(마크로사이클릭 락톤계는 흡혈이에 듣고, 씹는이는 퍼메트린 푸어온·분제가 더 나을 수 있다고 적은 책도 있다). 살충제는 알을 죽이지 못하므로 2주 간격 2~3회 처리하며, 지속 효과가 21일을 넘는 제제는 2차 처리가 필요 없다.</span></p><p class="bx-num"><span class="bxn" data-n="99">•</span><span>개체만 치료하지 말고 모든 소와 축사를 함께 처리한다. 깔짚을 치우고 축사에 뿌린 뒤 2~4주 뒤 반복한다. 매년 문제인 농장은 이가 가장 많아지기 전 가을에 처리한다. 너무 일찍 처리하면 남은 소수 때문에 봄에 다시 번지고, 감염된 소 한두 마리가 들어와도 서서히 다시 퍼진다.</span></p></div>
<div class="bx"><div class="bx-title">소가죽파리 구더기증</div><p class="bx-num"><span class="bxn" data-n="100">•</span><span>소가죽파리(Hypoderma bovis)와 선형소가죽파리(H. lineatum) 유충이 등 쪽 피하에 혹을 만든다. 초산우에 더 많다.</span></p><p class="bx-num"><span class="bxn" data-n="101">•</span><span>이른 가을, 알이 다 깨고 유충이 이동 초기일 때 등선에 전신 살충제(유기인제, 마크로사이클릭 락톤계)를 붓는다. 늦게 죽이면 식도(H. lineatum) 염증으로 침흘림·고창, 척수 주위(H. bovis) 염증으로 마비가 올 수 있어, 등에 혹이 나타나기 8~12주 전 이후로는 처리하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="102">•</span><span>혹 속 유충을 짜거나 터뜨리면 심한 전신 반응이 올 수 있으므로 숨구멍을 넓혀 통째로 뺀다.</span></p></div>
<div class="bx"><div class="bx-title">개선충·식피개선충·모낭충</div><p class="bx-num"><span class="bxn" data-n="103">•</span><span>개선충(Sarcoptes)은 가려움이 매우 심하고 꼬리·목·가슴·엉덩이·허벅지 안쪽에 잘 생긴다. 응애가 잘 안 보여 여러 번 깊게 긁어 본다. 사람에게 일시 감염될 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="104">•</span><span>개선충 치료는 2% 석회유황을 35~40.5℃로 데워 10~14일 간격으로 약욕·분무하거나 에프리노멕틴 푸어온을 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="105">•</span><span>식피개선충(Chorioptes)은 꼬리 밑동·회음부·허벅지 안쪽에 딱지를 만들고 겨울에 많으며, 피부를 긁어 확진하고 우군 전체를 처리한다.</span></p><p class="bx-num"><span class="bxn" data-n="106">•</span><span>모낭충(Demodex bovis)은 대부분 증상이 없고 대개 치료가 필요 없다.</span></p></div>
<div class="bx"><div class="bx-title">소 정상 생리값</div><p class="bx-num"><span class="bxn" data-n="107">•</span><span>체온은 성우 38~39℃, 송아지 39~40.5℃이고 신생 송아지는 성우보다 0.5~1℃ 높다. 하루 0.5~1℃ 변하고 발정 며칠 전 약간 오를 수 있다. 기온이 37.5℃를 넘으면 39.5℃도 정상일 수 있고 41℃에 가까우면 열사병이 올 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="108">•</span><span>직장에서 2분간 잰다. 배변 직후나 체온계가 분변 덩어리에 꽂히면 낮게 나온다. 소 평균 38.5℃, 39.5℃를 넘으면 고체온이다. 하루 1℃까지 변해 아침에 낮고 늦은 오후에 높으며, 고온다습하면 1.6℃까지 오를 수 있다. 임신 말기에 약 0.6℃ 오를 수 있고, 분만 직전과 발정 직전·배란 때 약 0.3℃ 낮아진다.</span></p><p class="bx-num"><span class="bxn" data-n="109">•</span><span>39.2℃를 넘으면 외부 열 때문이 아닌 한 염증성 질환을 의심한다. 그러나 정상 체온이라고 감염성 질환이 배제되지는 않는다. 확진된 창상성 제2위복막염의 50% 이상이 정상 체온이었다.</span></p><p class="bx-num"><span class="bxn" data-n="110">•</span><span>맥박은 성우 평균 60회(40~80), 30일령 미만 송아지 120회(100~140)이며 아래턱 혈관 패임에서 안면동맥으로 잰다(꼬리 중간동맥에서 30초 이상 세며 성우 60~80회, 어린 송아지 100~120회로 적은 책도 있다). 성우 60~84회, 송아지 72~100회로 적은 책도 있으며, 신생 송아지는 110~120회까지 나오지만 다룰 때 흥분한 탓이 많다. 서맥은 사료와 물을 몇 시간 끊은 정상 소에서도 흔하다.</span></p><p class="bx-num"><span class="bxn" data-n="111">•</span><span>호흡수는 성우 평균 24회(12~36), 송아지 48회(30~60)이다(안정 시 성우 18~28회 또는 15~35회, 송아지 20~40회로 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="112">•</span><span>성우 호흡수 40회를 넘으면 헐떡임이다. 40~60회 경도, 60~80회 중등도, 80~120회 심한 고온 스트레스다.</span></p><p class="bx-num"><span class="bxn" data-n="113">•</span><span>반추위 1차 수축은 분당 1.5~3회(1~2회로 적은 책도 있다)이고 옆구리 벽이 1~2cm 이상 밀려야 한다. 급여 후 시간과 사료 종류에 따라 다르며, 저칼슘혈증·복막염에서 약하거나 없다.</span></p></div>
</div>
`;
}
function med_fluidHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 수액·항생제</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn" data-n="1">•</span><span>임상검사 체계 — 구성과 원칙<span class="hang">임상검사는 의미 있는 병력 청취, 환경 관찰을 포함한 철저한 신체검사, 필요할 때 보조검사 선택의 세 부분으로 이루어진다(Rebhun). 목표는 관련 장기계를 찾고 감별진단 목록을 세워 가능하면 확진에 이르는 것이다.</span><span class="hang">패턴 인식은 경험이 쌓일수록 중요해지지만 철저한 검사를 대신하면 진단 정확도가 떨어진다. 두 질병이 겹치면 증상이 더해지거나 서로 상쇄된다(예: 저칼슘혈증의 저체온과 대장균 유방염의 발열이 겹쳐 체온이 정상으로 나옴).</span><span class="hang">원거리 관찰 뒤 소를 만지기 전에 활력징후를 먼저 잰다. 보정·구강 검사 같은 조작이 심박·호흡을 바꾸기 때문이다. 가능하면 서 있는 상태에서 조용히 검사한다(Constable).</span></span></p><p class="bx-num"><span class="bxn" data-n="2">•</span><span>근접 신체검사의 일반 순서(Constable)<span class="hang">활력징후(체온·심박·맥박·호흡·탈수 정도) → 흉부(심음의 수·리듬·강도, 폐음) → 복부 → 두경부(눈·구강·안면·경정맥) → 직장검사 → 비뇨기 → 생식기 → 유방 → 근골격 → 신경계 → 피부(귀·발굽·뿔).</span><span class="hang">활력징후 이후 순서는 응급도와 검사 편의에 따라 바꾼다. 예를 들어 분만 직후 심급성 유방염 젖소는 체온·심박·호흡·폐·반추위를 본 뒤 바로 유방을 자세히 본다.</span></span></p><p class="bx-num"><span class="bxn" data-n="3">•</span><span>소 신체검사의 실제 동선 — 후방에서 시작<span class="hang">착유·수정에 익숙한 젖소는 뒤쪽에서 시작하면 덜 흥분한다. 머리·앞쪽부터 다가가면 심박·호흡이 올라간다(Rebhun).</span><span class="hang">후방: 직장 체온계를 2분 꽂아 두는 동안 미근동맥(꼬리 기부에서 15~30 cm)으로 맥박을 세고 흉벽 움직임으로 호흡수를 센다. 같은 시간에 뒤쪽 유방과 유방상림프절을 만지고 외음부 점막(빈혈·황달·충혈)과 분비물, 냄새, 분변 상태, 좌우 늑골궁의 비대칭을 본다.</span><span class="hang">좌측: 심장(폐동맥판 3늑간, 대동맥판 4늑간, 승모판 5늑간)과 폐 청진 → 좌측 핑 → 좌겸부에서 최소 1분 반추위 청진·촉진 → 기갑 꼬집기·그런트 시험 → 유방(Blackwell 단계 1~7).</span><span class="hang">우측: 우측 경정맥 충만, 삼첨판(3늑간, 주관절과 견관절 중간), 폐, 우측 핑, 우측복부 밸로트먼트(임신 7개월 이상 태아, 종괴) → 직장검사 → 두부는 소가 가장 싫어하므로 마지막에 본다(단계 8~12).</span></span></p><p class="bx-num"><span class="bxn" data-n="4">•</span><span>신체검사 기법 요점<span class="hang">촉진 소견 용어: 반죽상(doughy, 눌러 자국이 남음, 부종), 단단함(정상 간 정도), 경(뼈 같음), 파동성, 긴장성(가스·액체로 팽만한 장기), 기종성(염발음).</span><span class="hang">타진음: 공명음(정상 폐), 고음(압력 받는 가스, 고창), 탁음(심장·간 같은 실질). 흉부 탁음 증가는 경화·흉수·종괴, 공명 증가는 기종·기흉을 시사한다.</span><span class="hang">타진·청진 병용(핑): 좌측 핑은 좌방전위(LDA)·반추위 가스·기복증, 우측 핑은 맹장·나선결장·소장·십이지장·자궁(분만 후)·직장·우방전위/염전에서 난다. 우방전위·염전 핑은 대개 8늑골보다 앞쪽이다(Blackwell).</span><span class="hang">밸로트먼트·청진으로 들리는 출렁임 소리: 좌측이면 곡류과식·반추위 액체 과다·LDA, 우측이면 장폐색·제4위 염전·맹장 확장·마비성 장폐색을 시사한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn" data-n="5">•</span><span>정상 생리값 — 체온<table class="bxt"><tr><th>구분</th><th class="c">정상</th><th>출처·비고</th></tr><tr><td>성우</td><td class="c">평균 38.5℃, 임계점 39.5℃</td><td>Constable</td></tr><tr><td>젖소 성우</td><td class="c">38.0~39.17℃</td><td>Rebhun. 39.2~39.5℃는 만성 복막염 입원우에서 흔히 보여 정상으로 보지 않는다</td></tr><tr><td>성우</td><td class="c">38.5℃ (38.0~39.0)</td><td>Blackwell</td></tr><tr><td>송아지</td><td class="c">39.0℃ (38.5~39.5)</td><td>Blackwell</td></tr><tr><td>1세 이하 / 1세 이상</td><td class="c">38.5~40.5℃ / 37.5~38.5℃</td><td>한우송아지질병관리핸드북</td></tr></table><span class="hang">생리적 변동: 하루 중 최대 1℃(아침 최저, 늦은 오후 최고), 임신 말기 약 0.6℃ 상승, 분만 직전과 발정 직전·배란 때 약 0.3℃ 하강. 고온다습하면 최대 1.6℃, 심한 운동 뒤 2.5~3℃ 오른다. 추위에 적응한 소를 따뜻한 실내로 들이면 2~4시간 안에 임계점을 넘을 수 있다.</span><span class="hang">체온계는 2분 둔다. 배변 직후, 분변 덩어리에 꽂힘, 짧은 측정, 직장 내 공기(pneumorectum)는 거짓 저체온을 만든다. 직장이 불가능하면 질에서 잰다.</span><span class="hang">발열 원인을 못 찾고 환경이 덥다면 같은 우리 소들의 체온을 함께 재 본다. 외상성 제2위복막염 확진우의 최소 50%는 체온이 정상이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn" data-n="6">•</span><span>정상 생리값 — 심박·맥박<table class="bxt"><tr><th>구분</th><th class="c">성우(회/분)</th><th class="c">송아지(회/분)</th><th>출처</th></tr><tr><td>Constable</td><td class="c">60~80</td><td class="c">100~120 (어린 송아지)</td><td>안정시 맥박</td></tr><tr><td>Rebhun</td><td class="c">60~84</td><td class="c">72~100</td><td>대형우는 60 가까이, 저지종은 상한 쪽</td></tr><tr><td>Blackwell</td><td class="c">60~80</td><td class="c">80~120</td><td>서맥 기준 60 미만</td></tr></table><span class="hang">맥박은 미근동맥(중미동맥)이나 안면동맥에서 최소 30초 센다. 맥박결손이 있으면 맥박수와 심박수가 다르다.</span><span class="hang">빈맥: 패혈증·독혈증·순환부전·통증·흥분. 사지 근골격 통증이면 누웠을 때와 섰을 때 맥박 차이가 크다.</span><span class="hang">서맥은 소에서 드물다. 뇌하수체 농양, 미주신경성 소화불량, 보툴리눔중독, 외상성 제2위복막염 후 횡격막 유착, 반추위가 평소보다 많이 빈 경우, 저혈당·고칼륨혈증 송아지에서 본다. 정상 소도 몇 시간 절식·절수하면 서맥이 흔하다(급수컵 고장 등).</span></span></p><p class="bx-num"><span class="bxn" data-n="7">•</span><span>정상 생리값 — 호흡수<table class="bxt"><tr><th>출처</th><th class="c">성우(회/분)</th><th class="c">송아지(회/분)</th></tr><tr><td>Constable</td><td class="c">10~30</td><td class="c">-</td></tr><tr><td>Rebhun</td><td class="c">18~28 (Gibbons), 15~35 (Rosenberger)</td><td class="c">20~40</td></tr><tr><td>Blackwell</td><td class="c">15~35</td><td class="c">20~40</td></tr></table><span class="hang">비만우는 정상의 2~3배까지 높을 수 있고, 기온·습도가 크게 오르면 2배가 된다. 추위에 적응한 소를 실내로 들이면 2시간 안에 6~8배까지 오르고 개구호흡을 한다.</span><span class="hang">정상 호흡 주기는 흡기·호기·휴지의 세 상이 같은 길이다. 대사성 산증은 깊이와 수를 모두 늘리고, 심한 대사성 알칼리증과 흉부·횡격막·전복부 통증은 깊이를 줄인다. 흉식 호흡은 복막염·복부팽만, 복식 호흡은 흉막염·섬유소성 기관지폐렴·폐기종·폐수종에서 본다.</span></span></p><p class="bx-num"><span class="bxn" data-n="8">•</span><span>정상 생리값 — 반추운동<span class="hang">1차 수축(제2위와 반추위 배낭·복낭)은 분당 1~2회이며 급여 후 경과 시간과 사료 종류에 따라 달라진다. 2차 수축은 분당 약 1회로 트림과 연관된다(Constable). Blackwell은 정상 반추 수축을 분당 1~3회로 쓴다.</span><span class="hang">좌겸부에서 청진하며 정상 순서는 액체가 꾸르륵하는 소리와 함께 겸부가 한 번 들리고, 이어 더 크게 들리면서 가스성 굉음이 난다. 좌측 하부 늑골 위에서는 그 직전 제2위 수축의 약한 액체음이 들린다.</span><span class="hang">운동 저하는 내독소혈증·복막염·저칼슘혈증 등에 의한 정체, 운동 항진은 미주신경성 소화불량과 반추위 팽만을 시사한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn" data-n="9">•</span><span>혈액검사 — 전혈구검사(CBC) 정상치<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>적혈구 (×10¹²/L)</td><td class="c">5.1~7.6</td><td class="c">5~10</td></tr><tr><td>혈색소 (g/L)</td><td class="c">85~122</td><td class="c">80~150</td></tr><tr><td>PCV (L/L)</td><td class="c">0.22~0.33</td><td class="c">0.24~0.46</td></tr><tr><td>MCV (fL)</td><td class="c">38~50</td><td class="c">40~60</td></tr><tr><td>MCH (pg)</td><td class="c">14~18</td><td class="c">11~17</td></tr><tr><td>MCHC (g/L)</td><td class="c">360~390</td><td class="c">300~360</td></tr><tr><td>혈소판 (×10⁹/L)</td><td class="c">200~650</td><td class="c">150~650</td></tr><tr><td>백혈구 (×10⁹/L)</td><td class="c">4.9~12.0</td><td class="c">4~12</td></tr><tr><td>호중구(성숙) (×10⁹/L)</td><td class="c">1.8~6.3</td><td class="c">0.6~4.0</td></tr><tr><td>간상호중구</td><td class="c">드묾</td><td class="c">&lt;0.2</td></tr><tr><td>림프구 (×10⁹/L)</td><td class="c">1.6~5.6</td><td class="c">2.5~7.5</td></tr><tr><td>단핵구 (×10⁹/L)</td><td class="c">0~0.8</td><td class="c">&lt;0.9</td></tr><tr><td>호산구 (×10⁹/L)</td><td class="c">0~0.9</td><td class="c">&lt;0.8</td></tr><tr><td>피브리노겐 (g/L)</td><td class="c">2~7</td><td class="c">3~7</td></tr><tr><td>망상적혈구</td><td class="c">-</td><td class="c">0</td></tr></table><span class="hang">참고범위는 나이·품종·성별·사료·지역·채혈과 측정법에 따라 달라지며, 대개 건강우 60~120두에서 위아래 2.5%를 버려 정한다. 따라서 검사실 자체 참고범위를 우선한다(Bovine Medicine).</span><span class="hang">Constable 부록 수치는 성우 기준이며 신생 송아지 참고치는 별도 표를 쓰라고 되어 있다.</span></span></p><p class="bx-num"><span class="bxn" data-n="10">•</span><span>CBC 해석 요점 — 백혈구<span class="hang">건강한 성우는 호중구:림프구가 약 1:2이고, 6개월 미만은 호중구가 우세하며 총 백혈구도 높을 수 있다.</span><span class="hang">소 골수는 수출 가능한 성숙 호중구 저장분이 작아 급성 염증 초기에는 오히려 호중구감소가 흔하다. 내독소혈증도 호중구를 변연 풀로 옮겨 호중구감소를 만든다. 24~48시간 안에 간상호중구가 나타나고 독성 변화(세포질 공포·과립·핵 분절)가 보인다.</span><span class="hang">호중구증가 등급(소): 경도 &lt;8, 중등도 8~15, 고도 &gt;15 ×10⁹/L. 말(&lt;15, 15~25, &gt;25)이나 개보다 반응 폭이 작다.</span><span class="hang">스트레스 백혈구상: 좌방이동·독성 변화 없는 성숙 호중구증가, 림프구감소, 호산구감소. 총 백혈구는 참고범위 안일 수 있다. 흥분(에피네프린)은 경도 호중구증가와 경도~중등도 림프구증가를 만든다(어린 개체).</span><span class="hang">지속성 림프구증가는 소백혈병바이러스 감염에서 흔하다. 호산구증가는 알레르기·기생충에서도 일관되지 않다.</span></span></p><p class="bx-num"><span class="bxn" data-n="11">•</span><span>CBC 해석 요점 — 적혈구·단백·피브리노겐<span class="hang">빈혈은 재생성(실혈·용혈, 미성숙 적혈구 출현)과 비재생성으로 나눈다. 재생 반응이 혈액에 나타나는 데 2~4일 걸리므로 사건 후 3일 이내는 전재생성으로 본다. 건강한 소는 혈중에 다염성·망상적혈구가 없다. 가장 흔한 비재생성 빈혈은 염증성 질환 빈혈이다.</span><span class="hang">소 적혈구 수명은 평균 150일이다. 탈수는 PCV와 총단백을 함께 올리며(혈액농축), 탈수가 알부민 증가의 유일한 원인이다.</span><span class="hang">피브리노겐은 총·감별 백혈구보다 믿을 만한 염증 지표지만 염증 후 36~48시간 지나야 오른다(10~15 g/L까지). 급성기에는 합토글로빈·혈청아밀로이드A가 더 민감하다.</span><span class="hang">총단백:피브리노겐 비가 10:1 미만이면 탈수가 아닌 절대적 피브리노겐 증가, 즉 염증을 시사한다. 다만 염증 때 글로불린도 같이 올라 비의 유용성이 떨어질 수 있다.</span></span></p><p class="bx-num"><span class="bxn" data-n="12">•</span><span>혈청화학 정상치 — 전해질·산염기·무기질<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>Na (mmol/L)</td><td class="c">132~152</td><td class="c">132~152</td></tr><tr><td>K (mmol/L)</td><td class="c">3.9~5.8</td><td class="c">3.9~5.8</td></tr><tr><td>Cl (mmol/L)</td><td class="c">95~110</td><td class="c">95~110</td></tr><tr><td>HCO₃ (mmol/L)</td><td class="c">20~30</td><td class="c">20~30</td></tr><tr><td>총 CO₂ (mmol/L)</td><td class="c">20~30</td><td class="c">-</td></tr><tr><td>음이온차 (mmol/L)</td><td class="c">14~26</td><td class="c">14~26</td></tr><tr><td>정맥 pH</td><td class="c">7.35~7.50</td><td class="c">-</td></tr><tr><td>정맥 PCO₂ (mmHg)</td><td class="c">34~45</td><td class="c">-</td></tr><tr><td>삼투질농도 (mOsm/kg)</td><td class="c">270~306</td><td class="c">-</td></tr><tr><td>총 Ca (mmol/L)</td><td class="c">2.43~3.10 (9.7~12.4 mg/dL)</td><td class="c">2.0~3.0</td></tr><tr><td>이온화 Ca (mmol/L)</td><td class="c">1.0~1.3</td><td class="c">-</td></tr><tr><td>무기인 (mmol/L)</td><td class="c">1.8~2.1 (5.6~6.5 mg/dL)</td><td class="c">1.29~2.26</td></tr><tr><td>Mg (mmol/L)</td><td class="c">0.74~1.10 (1.8~2.3 mg/dL)</td><td class="c">0.6~1.1</td></tr><tr><td>철 (µmol/L)</td><td class="c">10~29</td><td class="c">-</td></tr></table><span class="hang">Constable 본문은 대동물 혈장 HCO₃ 정상을 24~30 mmol/L, 대동물 혈액 pH를 7.35~7.45, 대동물 염기과잉 정상을 0~6 mEq/L로 쓴다. 음이온차 95% 범위는 소 14~20 mEq/L로 본문에 따로 나온다.</span></span></p><p class="bx-num"><span class="bxn" data-n="13">•</span><span>혈청화학 정상치 — 신장·간·효소·대사물·단백<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>요소질소 (mmol/L)</td><td class="c">2.0~9.6 (6~27 mg/dL)</td><td class="c">요소 2.1~9.6</td></tr><tr><td>크레아티닌 (µmol/L)</td><td class="c">88~175 (1.0~2.0 mg/dL)</td><td class="c">90~120</td></tr><tr><td>총빌리루빈 (µmol/L)</td><td class="c">0.17~8.55</td><td class="c">2~18</td></tr><tr><td>담즙산 (µmol/L)</td><td class="c">&lt;120</td><td class="c">-</td></tr><tr><td>콜레스테롤 (mmol/L)</td><td class="c">1.7~5.6</td><td class="c">-</td></tr><tr><td>포도당 (mmol/L)</td><td class="c">2.5~4.2 (45~75 mg/dL)</td><td class="c">-</td></tr><tr><td>BHB (mmol/L)</td><td class="c">-</td><td class="c">&lt;1.0</td></tr><tr><td>젖산 (mmol/L)</td><td class="c">0.6~2.2</td><td class="c">-</td></tr><tr><td>ALT (U/L)</td><td class="c">11~40</td><td class="c">-</td></tr><tr><td>ALP (U/L)</td><td class="c">0~200</td><td class="c">-</td></tr><tr><td>AST (U/L)</td><td class="c">78~132</td><td class="c">60~150</td></tr><tr><td>CK (U/L)</td><td class="c">35~280</td><td class="c">50~400</td></tr><tr><td>GGT (U/L)</td><td class="c">6.1~17.4</td><td class="c">&lt;36</td></tr><tr><td>SDH (U/L)</td><td class="c">4.3~15.3</td><td class="c">-</td></tr><tr><td>GLDH (U/L)</td><td class="c">-</td><td class="c">&lt;20</td></tr><tr><td>LDH (U/L)</td><td class="c">692~1445</td><td class="c">-</td></tr><tr><td>총단백 (g/L)</td><td class="c">57~81</td><td class="c">58~80 (혈장 굴절계 60~80)</td></tr><tr><td>알부민 (g/L)</td><td class="c">21~36</td><td class="c">22~36</td></tr><tr><td>글로불린 (g/L)</td><td class="c">-</td><td class="c">24~40</td></tr></table><span class="hang">Bovine Medicine은 혈액 요소질소 = 요소 × 2.14로 환산하라고 한다. 빌리루빈이 45 µmol/L를 넘으면 조직이 눈에 띄게 노래진다.</span></span></p><p class="bx-num"><span class="bxn" data-n="14">•</span><span>혈청화학 해석 요점<span class="hang">반추동물은 요소를 침과 소화관으로 재분비하므로 요소는 사구체여과율(GFR) 지표로 믿기 어렵고 단백 이화 지표로 쓴다. 크레아티닌은 GFR을 잘 반영하나 근육량에 비례해 육우 수소에서 젖소보다 훨씬 높다. 탈수 시 요비중 1.025 초과면 신기능은 유지된 신전성 고질소혈증이다.</span><span class="hang">효소 상승 등급(참고범위 상한의 배수, Bovine Medicine): CK 경도 &lt;5배, 중등도 &lt;10배, 고도 &gt;50배, 극심 &gt;100배. AST 각각 &lt;2, &lt;3, &gt;5, &gt;8배. GLDH·GGT·빌리루빈·크레아티닌도 비슷한 배수 기준을 쓴다.</span><span class="hang">CK는 반감기가 짧고 AST는 길어 둘의 상승·하강 양상으로 기립불능우 근괴사의 지속 여부를 판단한다. 용혈이 없고 CK 정상인데 AST와 GLDH가 오르면 간세포 괴사다.</span><span class="hang">Ca 저하 등급: 경도 &lt;2, 중등도 &lt;1.5, 고도 &lt;1, 극심 &lt;0.5 mmol/L. 임상형 저칼슘혈증은 대개 1.5 미만이다. BHB는 건유기 &lt;0.6, 분만 후 아임상 케토시스 &gt;1.4, 케토시스 &gt;3.0 mmol/L.</span><span class="hang">Cl 저하는 전위장 정체에서 흔하다. LDA는 경도, RDA는 중등도~고도(&lt;70 mmol/L)이며 역설적 산성뇨를 동반한 대사성 알칼리증이 된다. K 저하는 식욕부진과 대사성 산증(송아지 설사)에서 본다.</span><span class="hang">혈청 GGT는 초유에 많아 생후 3일 이내 송아지의 수동면역 이행 평가에 쓴다(1일령 196, 2일령 136, 3일령 112 U/L 미만이면 IgG1 10 g/L 미만 가능성).</span></span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>채혈과 시료 취급<span class="hang">성우는 미정맥(중미정맥)이나 경정맥에서 채혈한다. 미정맥은 꼬리 기부에서 10~20 cm, 복측 정중선에 18~20G 2.5~3.75 cm 바늘로 뼈에 닿을 때까지 찔러 흡인한다. 어린 송아지는 미정맥 채혈을 하지 않는다. 유정맥은 혈전·정맥염·심내막염 위험 때문에 채혈·투약에 쓰지 않는다(Rebhun).</span><span class="hang">CBC는 EDTA관에 받아 즉시 잘 섞고 그 자리에서 무염색 도말을 만든다(4℃ 운반). 피브리노겐은 혈장(EDTA·헤파린), 응고검사는 구연산관, 대부분 생화학은 혈청, 정확한 포도당은 불화나트륨관을 쓴다. 혈청은 응고 후 약 30분에 분리해 4℃에서 24~48시간 보존한다.</span><span class="hang">혈액가스: 나트륨헤파린으로 코팅한 3 mL 폴리프로필렌 주사기로 경정맥혈을 혐기적으로 받고 기포를 빼 마개를 한 뒤 정맥혈은 얼음물(0℃)에 두고 30분 안에 분석한다. 동맥혈은 체온이나 실온에 둔다. 부분 진공 채혈관은 혈액가스에 절대 쓰지 않는다. 호흡기 질환이 없으면 경정맥혈로 동맥 pH·PCO₂·HCO₃·염기과잉을 예측할 수 있다.</span><span class="hang">총 CO₂를 생화학 분석기로 잴 때는 채혈관을 끝까지 채우고 4~10 mL 관을 쓴다. 덜 채우면 CO₂가 빠져 낮게 나온다.</span><span class="hang">사람용 휴대 혈당계는 적혈구 내 포도당을 혈장과 같다고 가정해 소에 맞지 않으므로 종 특이 보정이 된 기기를 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn" data-n="16">•</span><span>탈수 — 원인과 기전<span class="hang">원인은 수분 섭취 부족(물 결핍, 독혈증으로 갈증 소실, 식도폐색)과 과다 손실이다. 가장 흔한 원인은 설사이며, 곡류과식, 급성 장폐색, 미만성 복막염, 제4위 확장·염전에서도 심하다. 대부분의 탈수에서 보정해야 할 핵심 손실은 물보다 전해질이다.</span><span class="hang">처음에는 세포내·간질액에서 물이 빠져 혈액량을 지키므로 피부 탄력 저하, 피부·점막 건조, 안와 뒤 지방 감소에 의한 안구함몰이 먼저 온다. 계속되면 순환혈액량 감소와 혈액농축, 말초순환부전, 신혈류 감소로 인한 요량 감소와 혈중요소질소의 중등도 상승, 혐기 대사에 의한 대사성 산증이 온다.</span><span class="hang">물·전해질 섭취만 못 하는 경우(식도폐색 등)는 신장이 잘 보상해 탈수가 가볍고, 분변은 적고 단단하며 반추위 내용물도 건조하다. 심급성·급성 손실은 혈관 내에서 주로 빠져 임상적으로 드러나지 않을 수 있다.</span></span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>송아지 탈수 평가 — 안구함몰과 피부 텐트<span class="hang">송아지 탈수의 가장 좋은 지표는 안구가 안와로 들어간 정도다. 아래 눈꺼풀을 정상 위치로 살짝 뒤집어 함몰 거리를 mm로 재고 1.7을 곱하면 정상 체중 대비 탈수 %가 된다. 8 mm 함몰은 약 14% 탈수다(Constable).</span><span class="hang">탈수 8% 이상, 즉 안구함몰 4 mm 이상이면 정맥 수액이 권장된다. 안구함몰 4 mm 이상이거나 서지 못하는 송아지는 경구 전해질액에 더해 정맥 수액(소량 고장식염수, 소량 중탄산나트륨, 또는 대량 등장 정질액)을 준다.</span><span class="hang">두 번째 지표는 목과 외측 흉벽 피부 탄력이다. 피부를 꼬집어 90° 돌린 뒤 놓아 주름이 사라지는 시간을 재며 정상은 2초 미만이다. 위·아래 눈꺼풀 피부 텐트는 송아지에서 부정확해 권하지 않는다. 점막 습윤도는 젖소 송아지에서는 민감하나 고온 환경 브라만 교잡 송아지에서는 유용하지 않았다.</span><span class="hang">설사 송아지의 침울 정도는 탈수, 저체온, 대사성 산증 정도와 연관된다.</span></span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>송아지 탈수·산증 평가표 (Large Animal IM)<table class="bxt"><tr><th>임상 소견</th><th>태도</th><th class="c">피부 텐트(초)</th><th class="c">안구함몰(mm)</th><th class="c">탈수(%)</th><th class="c">추정 염기결손(mmol/L)</th></tr><tr><td>증상 미미, 흡입반사 있음</td><td>정상</td><td class="c">&lt;1</td><td class="c">없음</td><td class="c">5</td><td class="c">5</td></tr><tr><td>-</td><td>약간 침울</td><td class="c">1~2</td><td class="c">2~4</td><td class="c">6~8 (경도)</td><td class="c">10</td></tr><tr><td>흡입 감소, 사지 말단 차가움</td><td>침울</td><td class="c">2~5</td><td class="c">4~6</td><td class="c">8~10 (중등도)</td><td class="c">15</td></tr><tr><td>흡입반사 매우 약하거나 없음, 입·사지 차가움</td><td>혼수</td><td class="c">5~10</td><td class="c">6~8</td><td class="c">10~12 (고도)</td><td class="c">20</td></tr><tr><td>흡입반사 없음, 저체온</td><td>혼수/폐사</td><td class="c">&gt;10</td><td class="c">8~12</td><td class="c">&gt;12</td><td class="c">&gt;20</td></tr></table><span class="hang">같은 책의 다른 표(신생 송아지)는 기준이 다르다: 0% 함몰 없음·텐트 &lt;1초·점막 촉촉, 1~5% 없음~약간·1~4초·촉촉, 6~8% 안구와 안와 약간 분리·5~10초·끈적, 9~10% 0.5 cm 미만 틈·11~15초·끈적~건조, 11~12% 0.5~1 cm 틈·16~45초·건조.</span><span class="hang">국내 지침(한우송아지질병관리핸드북, 체중 50 kg 기준): 4~6% 가벼움(안구함몰 거의 없음) 경구, 6~8% 중간(피부 2~4초) 경구, 8~10% 심함(기립곤란·체온하강, 6~10초) 경구·정맥, 10~12% 쇼크(기립불능·혼수, 20~45초) 정맥. 수액량 = 유지량(체중 3%) + 탈수량 × 1/3~1/2(WHO 기준)이라고 쓴다.</span></span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>성우 탈수 평가표 (Large Animal IM, Smith 인용)<table class="bxt"><tr><th class="c">탈수(%)</th><th>안구함몰</th><th>윗눈꺼풀 피부 텐트</th><th>점막</th></tr><tr><td class="c">경도 6~7</td><td>약간</td><td>약간 지연(2~3초)</td><td>촉촉</td></tr><tr><td class="c">중등도 8~9</td><td>뚜렷이 함몰</td><td>뚜렷이 지연(3~6초)</td><td>끈적</td></tr><tr><td class="c">고도 10~12</td><td>안와로 심하게 함몰</td><td>계속 텐트 유지</td><td>건조</td></tr></table><span class="hang">성우의 최적 평가법은 확립되지 않았으나 안구함몰과 목 부위 피부 텐트 시간이 가장 정확하고 민감할 것으로 본다(Constable). 위 표는 윗눈꺼풀 피부를, Constable은 목 피부를 권한다는 점이 다르다.</span><span class="hang">차고 축축한 피부가 30초 넘게 텐트로 남으면 고도 탈수다. 구강점막 청색증과 모세혈관재충만시간 4초 초과는 예후 불량, 점점 심해지는 빈맥은 악화를 뜻한다. 정상 직장체온은 좋은 예후 지표가 아니지만 저체온은 악화를 시사한다.</span><span class="hang">탈수 동물은 빠르게 체중이 줄고 근육 약화·식욕부진이 흔하다. 젖소의 물 섭취를 4일간 제한하면 유량 75%, 체중 14%가 줄고, 10% 제한만으로도 유량이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>탈수의 검사실 지표<span class="hang">PCV 30~40% 정상, 40~50% 수액이 필요할 수도 아닐 수도, 50~60% 회복에 수액 필요, 60% 초과는 집중 수액이 필요하고 예후 불량. 총단백 6.0~7.5 g/dL 정상, 8~10 g/dL 수액 필요하나 예후 양호, 10 g/dL 초과 예후 불량(Constable). 빈혈·저단백혈증 동물과 신생자(PCV 변동, 초유 이행 차이)는 수치가 오도할 수 있다.</span><span class="hang">삼투질농도로 본 분류(건강 대동물 약 285 mOsm/kg): 고장성 탈수 &gt;300(물 결핍, 일부 위장 질환), 저장성 탈수 &lt;270(급성 분비성 설사, 살모넬라증), 등장성 탈수(전해질 정상). 저장성 탈수는 수분 손실에 비해 임상 탈수가 가장 뚜렷하다.</span><span class="hang">요소·크레아티닌은 탈수 정도를 반영하며 신전성 고질소혈증은 수액 후 떨어진다. 체중을 매일 같은 시각(아침 급여 전)에 재고 PCV와 굴절계 총단백을 같이 보면 세포외액 변화를 싸게 추적할 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn" data-n="21">•</span><span>수액요법 — 원칙과 목표<span class="hang">가장 중요한 원칙은 탈수와 전해질 손실을 예방하는 것(충분한 물, 급수 공간, 소금·광물질 상시 공급)이고, 다음은 손실이 진행 중인 질병에서 가능한 한 빨리 보충하는 것이다.</span><span class="hang">동시에 있을 수 있는 이상은 체액량 결손(자유수), 혈장 삼투질 결손, 특정 전해질 불균형, 산염기 불균형, 교질삼투압 불균형의 다섯 가지다. 이상 교정에 4~6시간, 유지요법은 질병에 따라 2~4일 걸린다.</span><span class="hang">순환혈액량 감소와 산염기 불균형을 먼저 정맥으로 교정한다. 순환혈액량이 회복되면 신기능이 돌아와 산염기·전해질 교정을 돕는다. 순환혈액량이 줄어 있으면 복강·피하·경구 경로는 모두 부적절하다.</span><span class="hang">검사실 없이도 병력·진단·이환 기간으로 이상을 예측할 수 있다. 급성 감염성 설사는 대사성 산증과 저나트륨혈증, 상부 장폐색·제4위 정체는 저염소·저칼륨 대사성 알칼리증, 만성 신질환은 저나트륨·저염소혈증, 초식동물의 만성 식욕부진은 저칼륨혈증(특히 비유 반추동물)이다. 18~24시간 심한 수양성 설사를 한 동물은 심한 산혈증일 수 있다.</span></span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>수액량 계산 — 결손량·유지량·지속 손실량<span class="hang">결손량(L) = 탈수 % × 체중(kg). 예: 50 kg 송아지 8% 탈수 = 4 L(Large Animal IM, Constable 표).</span><span class="hang">유지량: Constable은 60~80 mL/kg/24시간(약 3~4 mL/kg/시간), Large Animal IM은 성우 2~3 mL/kg/시간, 신생자 4~6 mL/kg/시간, 송아지 50~100 mL/kg/일로 쓴다. 국내 지침은 체중의 3%로 계산한다.</span><span class="hang">지속 손실량: 심한 설사면 지속 손실과 유지량을 합쳐 24시간에 약 150 mL/kg에 이른다. 설사 송아지 분변 손실은 1~6 L이며 분변 양상과 양으로 추정하고 매일 재평가한다. 경구 수액은 60~80%만 흡수되므로 계산에 반영한다(Large Animal IM).</span><span class="hang">비유 중인 젖소는 비유에 필요한 물을 과소평가하기 쉽다. 옥수수 사일리지 위주, 쾌적 환경에서 하루 45 kg 착유하는 600 kg 젖소는 최소 140 L/일이 필요하다.</span><span class="hang">투여는 두 단계로 한다. 첫 4~6시간 수화요법 100~150 mL/kg IV, 이후 20~24시간 유지요법(지속 손실 + 유지량) 60~80 mL/kg/24시간 IV.</span></span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>수액량 예시 (Constable)<table class="bxt"><tr><th>동물</th><th class="c">탈수(% 체중)</th><th class="c">재수화(L)</th><th class="c">유지(L/24시간)</th></tr><tr><td>신생 송아지 50 kg</td><td class="c">8</td><td class="c">4</td><td class="c">2.5~5</td></tr><tr><td>신생 송아지 50 kg</td><td class="c">12</td><td class="c">6</td><td class="c">2.5~5</td></tr><tr><td>성우 700 kg</td><td class="c">8</td><td class="c">56</td><td class="c">35~70</td></tr><tr><td>성우 700 kg</td><td class="c">12</td><td class="c">84</td><td class="c">35~70</td></tr></table><span class="hang">심급성 대장균 유방염은 균형 전해질액을 24~48시간 동안 100~150 mL/kg/24시간 정맥으로 준다(Constable 표 5-2).</span></span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>투여 속도<span class="hang">송아지는 0.9% NaCl과 중탄산나트륨액을 시간당 1~3 L, 곡류과식으로 심한 탈수·산증인 소는 시간당 10~12 L까지 준다. 칼륨이 첨가된 액은 조심해서 시간당 3~5 L로 준다(Constable). 14G 카테터로 성우에 20 L를 4시간에 줄 수 있다.</span><span class="hang">패혈 환자에서 첫 1시간 20~40 mL/kg 같은 볼루스 수액 소생의 문제가 지적되어, 빠른 소생은 소량 고장식염수에 맡기고 대량 정질액은 볼루스가 아닌 시간당 20 mL/kg 미만의 느린 속도로 주라고 Constable은 권한다.</span><span class="hang">Large Animal IM은 제4위 염전 등 상부 폐색에서 수술 전·중 등장 정질액 15~20 L(20~25 mL/kg) 볼루스 후 30~40 L(3~5 mL/kg/시간), 산증·패혈 반추동물에서 첨가제 없는 정질액 25~50 mL/kg 볼루스 후 정속주입, 성우 패혈증에서 4~5 mL/kg/시간으로 첫 24시간 최소 40~60 L를 권한다. 칼륨·칼슘 첨가액은 볼루스로 주지 않는다.</span></span></p><p class="bx-num"><span class="bxn" data-n="25">•</span><span>수액 중 감시와 부작용<span class="hang">양호한 반응: 30~60분 안에 배뇨, 정신상태 호전, 수화 징후. 검사실이 있으면 PCV, HCO₃, 혈액 pH로 감시한다.</span><span class="hang">불량 반응: 기존 폐렴이나 과속 투여로 인한 폐수종으로 호흡곤란, 신부전·방광마비로 무뇨, 알칼리 과다투여로 테타니. 갑작스런 근무력은 저칼륨혈증, 갑작스런 빈맥·과호흡은 과수화를 시사하므로 즉시 멈추고 재평가한다. 투여 수 시간 뒤 발한·떨림·침울은 수액 오염을 의심한다.</span><span class="hang">중심정맥압 정상 2~10 cmH₂O(견관절 기준). 2 미만은 수액 필요, 15 초과는 심부전과 용적과부하.</span><span class="hang">저체온 동물에 정맥 수액을 주면 심부체온이 더 떨어진다. 37℃로 데운 수액도 수액세트를 지나며 식으므로 카테터 가까이에서 수액줄을 가온한다. 국내 지침은 수액줄을 약 45℃ 물통에 담가 송아지 체온(39.5℃)보다 높게 데워 주라고 한다.</span></span></p><p class="bx-num"><span class="bxn" data-n="26">•</span><span>정맥 경로와 카테터<span class="hang">경정맥이 대량 수액의 기본 경로다. 2 L 이하를 바로 줄 때는 5.0~7.5 cm 스테인리스 14G 바늘이 좋다. 3.75 cm 일회용 14G는 너무 짧고 날카로워 정맥 내막 열상·혈관 밖 누출이 잦다(Rebhun). 바늘 재사용 시 세척·멸균은 소백혈병바이러스와 세균 전파 방지에 중요하다.</span><span class="hang">유치 카테터: 경정맥 앞 1/3을 털 깎고 소독, 리도카인 피내 1 mL 후 15번 메스로 피부를 5 mm 절개, 성우는 최소 16G(대개 14G 13 cm), 송아지는 14~18G 13 cm까지 쓴다. 혈전 형성은 실라스틱 &lt; 폴리우레탄 &lt; 테플론 순으로 적다.</span><span class="hang">이정맥: 성우는 14G 5 cm 카테터로 4시간에 20 L, 신생 송아지는 귀 기부에 지혈대를 감고 22G 2.5 cm 나비 카테터를 쓴다(북유럽). 송아지 정맥 확보가 어려우면 몸을 거꾸로 매달아 경정맥을 확장시키거나, 대퇴골·상완골두에 14~16G 바늘로 골내 수액을 준다.</span><span class="hang">수일간 경정맥 카테터는 혈전정맥염·화농성 정맥염·카테터 패혈증을 만든다. 약 50%는 완전 폐쇄되어 2~3주 쓸 수 없다. 무균 술기가 핵심이며 헤파린 150 IU/kg SC 12시간 간격 예방은 술기가 좋으면 필요 없다고 본다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn" data-n="27">•</span><span>수액 종류 — 장력과 유효 강이온차(SID)<span class="hang">대동물 혈장수 삼투압은 약 306 mOsm/L이므로 등장(300~312), 고장(&gt;312), 저장(&lt;300)으로 나눈다. 적혈구는 저삼투에 약해 정맥 수액은 등장이나 고장이 이상적이다. 정상 혈장 SID는 약 40 mEq/L이며 유효 SID가 큰 액은 알칼리화, 0인 액은 산성화한다.</span><table class="bxt"><tr><th>용액</th><th class="c">유효 SID (mEq/L)</th><th class="c">삼투압 (mOsm/L)</th><th>성격</th></tr><tr><td>8.4% NaHCO₃</td><td class="c">1000</td><td class="c">2000</td><td>고장·알칼리화</td></tr><tr><td>5.0% NaHCO₃</td><td class="c">595</td><td class="c">1190</td><td>고장·알칼리화</td></tr><tr><td>10% NaH₂PO₄</td><td class="c">145</td><td class="c">1150</td><td>고장·알칼리화</td></tr><tr><td>50% 포도당</td><td class="c">0</td><td class="c">2500</td><td>고장·산성화</td></tr><tr><td>7.2% NaCl</td><td class="c">0</td><td class="c">2460</td><td>고장·산성화</td></tr><tr><td>25% 황산마그네슘</td><td class="c">0</td><td class="c">2028</td><td>고장·산성화</td></tr><tr><td>23% 보로글루콘산칼슘</td><td class="c">0</td><td class="c">1069</td><td>고장·산성화</td></tr><tr><td>1.3% NaHCO₃</td><td class="c">155</td><td class="c">310</td><td>등장·알칼리화</td></tr><tr><td>링거액</td><td class="c">0</td><td class="c">309</td><td>등장·산성화</td></tr><tr><td>0.9% NaCl</td><td class="c">0</td><td class="c">308</td><td>등장·산성화</td></tr><tr><td>1.15% KCl</td><td class="c">0</td><td class="c">308</td><td>등장·산성화</td></tr><tr><td>초산링거</td><td class="c">27</td><td class="c">294</td><td>저장·알칼리화</td></tr><tr><td>젖산링거</td><td class="c">&lt;14</td><td class="c">275</td><td>저장·알칼리화</td></tr><tr><td>5% 포도당</td><td class="c">0</td><td class="c">250</td><td>저장·산성화</td></tr></table><span class="hang">나트륨 함유 정질액은 세포외액 전체로 퍼진다. 저혈량(회로 문제)에는 늘 적응이지만 울혈성 심부전(펌프 문제)과 심한 저알부민혈증(부종 악화)에는 금기다.</span></span></p><p class="bx-num"><span class="bxn" data-n="28">•</span><span>주요 정맥 수액 조성 (mmol/L)<table class="bxt"><tr><th>용액</th><th class="c">Na</th><th class="c">K</th><th class="c">Ca</th><th class="c">Mg</th><th class="c">Cl</th><th class="c">HCO₃·전구체</th><th>주 적응</th></tr><t
