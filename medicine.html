<div class="bx"><p class="bx-num"><span class="bxn">9.</span><span>납 중독(plumbism) — 원인과 역학<span class="hang">소에서 가장 흔한 중독 가운데 하나다. 캐나다 앨버타 22년 자료에서 소 중독 진단 1위였고, 52%가 6개월령 이하였다. 어린 소는 흡수율이 높고 호기심이 많아 납을 찾아 먹는다. 방목 개시 며칠 뒤 봄에 많고, 농기계 배터리·폐유 교체가 잦은 5~8월에도 많다.</span><span class="hang">원인 확인 사례의 80% 이상이 폐배터리(39.5%)와 폐크랭크오일(31.6%)이었다. 그 밖에 납 페인트(울타리·벽·캔), 사냥 산탄이 섞인 사일리지·건초, 사료 배합기에 갈려 들어간 배터리, 폐전선을 태운 재, 제련소·도로 주변 오염 목초가 있다.</span><span class="hang">소는 기름을 잘 마시고 페인트를 핥으며 배터리를 씹는다. 인 결핍(이식증), 사육 밀집·지루함도 위험인자다. 금속 납 입자는 제2위에 가라앉아 서서히 가용성 초산납으로 바뀌며 지속적 공급원이 된다.</span><span class="hang">이환율은 군 노출 시 10~30%, 무치료 치명률은 100%에 이르나 조기 집중치료로 50% 이하로 낮출 수 있다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>납 중독 — 기전<span class="hang">섭취한 납의 2~10%만 흡수된다. 칼슘·철·아연 결핍은 흡수와 독성을 높인다. 흡수된 납의 60~90%는 적혈구에 있고, 연부조직(신장·간)을 거쳐 뼈에 저장된다. 배설은 담즙과 우유로 느리며 소변 배설은 적다.</span><span class="hang">혈액뇌장벽을 깨뜨려 뇌부종을 일으키고, 칼슘·아연을 대체하며 단백질 설프하이드릴기에 결합해 효소를 억제한다. δ-아미노레불린산 탈수효소(δ-ALA-D)와 페로킬라타제를 억제해 헴 합성을 줄인다.</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>납 중독 — 임상증상<span class="hang">급성형(송아지·어린 소): 12~24시간의 짧은 경과이고, 방목 중이면 증상 없이 폐사체로 발견되는 경우가 많다. 머리·목의 비틀거림과 근육 떨림, 턱을 씹는 동작(껌 씹기 발작), 입 거품, 눈꺼풀 깜박임, 안구 회전, 울부짖음이 뚜렷하다.</span><span class="hang">실명과 목·얼굴·귀의 경련이 일관되게 나타난다. 쓰러져 강직-간대성 경련을 반복하고 경련 사이에도 산동, 후궁반장, 떨림이 지속된다. 촉각·소리 과민, 빈맥·빈호흡이 있다.</span><span class="hang">서 있는 개체는 실명 상태로 광폭해져 울타리로 돌진하고 벽을 넘으려 하며 머리를 강하게 벽에 누른다. 사람을 공격하는 듯 보이기도 한다. 경련 중 호흡부전으로 죽는다.</span><span class="hang">아급성형(성우에 흔함, 3~4일 생존): 반추위 무력, 초기 변비 뒤 악취 설사, 이갈기, 침흘림, 둔마, 실명, 보행 이상, 간헐적 선회. 근육 떨림과 과민은 급성형보다 덜하다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>납 중독 — 진단<table class="bxt"><tr><th>검체</th><th>판정 기준</th></tr><tr><td>전혈 납</td><td>정상 0.05~0.25 ppm 미만(배경 노출 0.1 ppm 미만), 중독 0.35 ppm 초과, 1.0 ppm부터 폐사 시작</td></tr><tr><td>신장 피질</td><td>25 mg/kg(습중량) 진단적, 간보다 신뢰도 높음(Constable). 간·신장 10 ppm 초과 진단적(Rebhun·Blackwell)</td></tr><tr><td>간</td><td>10~20 mg/kg 습중량 가능</td></tr><tr><td>δ-ALA-D(1세 미만)</td><td>200 mmol PBG/mL RBC/h 미만이면 의심, 100 미만이면 섭취 확정</td></tr><tr><td>δ-ALA-D(2세 이하)</td><td>100 미만이면 섭취 시사</td></tr></table><span class="hang">혈중 납은 노출의 좋은 지표지만 임상증상 유무·정도와의 상관은 나쁘다. 경련하는 소가 0.30 ppm, 무증상 소가 0.90 ppm일 수도 있다(Blackwell). 0.25~0.35 ppm 회색지대에서는 δ-ALA-D를 함께 본다.</span><span class="hang">분변 납: 높으면 최근 2~3주 내 섭취다. 혈중 높고 분변 낮으면 수주 전 섭취, 둘 다 높으면 최근 섭취와 흡수를 뜻한다.</span><span class="hang">방사선으로 제2위 내 방사선 불투과성 물체를 확인할 수 있고, 반추위 내용물에서 기름을 찾는다(Rebhun). 부검: 급성은 육안 병변이 대개 없다. 만성은 후두엽 중심 대뇌피질 연화·공동화·황색 변색, 신피질 깊은 곳의 항산성 핵내 봉입체. 제2위의 페인트 조각·납 덩어리는 진단을 뒷받침하나 없다고 배제되지는 않는다.</span><span class="hang">검체: 간·신장·제2위 내용물 50 g(납 정량), 포르말린 대뇌피질·신장. 감별: 비소 중독, 회백질연화증, 비타민 A 결핍, 저마그네슘혈증 테타니, 수막뇌염, 신경형 케토시스, Claviceps paspali 중독.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>납 중독 — 치료<table class="bxt"><tr><th>약물</th><th>용량·용법</th><th>출처</th></tr><tr><td>CaEDTA(에데트산칼슘이나트륨)</td><td>73.3 mg/kg/일을 2~3회 나눠 느린 정맥, 3~5일. 2일 휴약 후 필요하면 3~5일 반복</td><td>Constable</td></tr><tr><td>CaEDTA</td><td>35 mg/kg 정맥 12시간마다, 최소 3~5일</td><td>Rebhun</td></tr><tr><td>CaEDTA</td><td>55~90 mg/kg 느린 정맥 또는 근육 12시간마다, 재치료는 최소 2일 쉬고</td><td>Blackwell</td></tr><tr><td>티아민 HCl</td><td>2 mg/kg 근육, CaEDTA와 동시, 1일 최대 8 mg/kg</td><td>Constable</td></tr><tr><td>티아민</td><td>1 g 정맥 1일 1회</td><td>Rebhun</td></tr><tr><td>황산마그네슘</td><td>경구. 사료 첨가 시 체중 1 lb당 0.5 g/일 제안</td><td>Rebhun·Blackwell</td></tr><tr><td>디머카프롤(BAL)</td><td>3.0 mg/kg 근육(5% 용액), 2일간 4시간마다, 3일째 6시간마다, 이후 10일간 12시간마다. 뇌 침투, 신독성·통증</td><td>Blackwell</td></tr></table><span class="hang">보존 치료: 신경증상에는 진정(디아제팜·바르비투르), 탈수에는 정맥 수액.</span><span class="hang">반추위 절개: 제2위 주름 사이 입자 제거가 어려워 불완전할 수 있으나, 고가 개체이고 제거 가능한 형태의 납을 먹었음이 확실하면 적절하다.</span><span class="hang">주의: 위장관에 납이 많이 남은 채로 킬레이트하면 흡수가 오히려 늘 수 있다. 조직에서 동원된 납이 일시적으로 혈중 농도와 증상을 악화시킬 수 있다. 킬레이트 중 혈중 납은 24시간 안에 50% 이상 떨어지지만 조직 납은 남아 있어 치료 효과 판정에 부적합하고, δ-ALA-D가 회복되지 않으면 효소를 억제할 만큼 납이 남았다는 뜻이다. CaEDTA는 장기 투여 시 신장·위장 독성이 있고 구리·철을 함께 제거한다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>납 중독 — 잔류와 예방<span class="hang">치료우는 표시하고 수개월간 월 1~2회 혈중 납을 측정해, 최소 2주 간격 3회 연속 배경 수준이면 도축해도 안전하다고 본다. 배경 수준까지 최소 6개월이 걸린다는 현장 관찰이 있다. 정상 혈중 납은 0.10 ppm 미만이다(Blackwell).</span><span class="hang">예방: 목초지에 쓰레기를 두지 않는다. 목초지에서 나무·폐기물을 태우지 않고 재에 접근시키지 않는다. 폐배터리·폐유는 소가 닿지 않는 곳에 보관한다. 농기계 정비 구역을 축사와 분리한다. 무연 페인트만 쓴다. 이식증을 줄이는 적절한 영양을 준다. 오염 목초지에는 인산염 암석을 뿌리고 사료에 인산칼슘을 일시 첨가해 흡수를 줄인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">15.</span><span>수은 중독 — 요약<span class="hang">규제로 드물다. 대개 페닐수은 등 유기수은 살균제 처리 종자를 장기간 먹은 만성 중독이다. 처리 종자가 사료의 10% 정도면 대개 무해하며, 반추동물은 1회 대량 섭취로는 중독되지 않는다고 본다. 소는 유기수은 하루 10 mg/kg 섭취로 중독된다.</span><span class="hang">무기수은 급성: 혈액 섞인 구토물, 심한 설사, 수시간 내 쇼크 사망.</span><span class="hang">만성 유기수은: 운동실조, 부전마비, 기립불능, 경련, 신부전. 급여 시작 20일 뒤에야 증상이 날 수 있다. 표적은 뇌와 신장이다.</span><span class="hang">진단: 신장 농도가 가장 높아 신장 50 g을 보낸다. 무기수은은 소변, 유기수은은 털이 좋은 검체다. 혈액은 노출 후 3~5일까지만 유용하다. 우유로 섭취량의 0.2% 미만이 나온다. 치료: 해독제가 없고 킬레이트 사용은 논란이다. 급성기에는 활성탄과 미네랄오일, 수액, 위장보호제.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>비소 중독 — 원인<span class="hang">무기 비소가 가장 독하고 유기 비소가 가장 덜 독하다. 아비산염 경구 독성 용량 1~25 mg/kg, 비산염 30~100 mg/kg. 출처는 목재 방부제(크롬구리비산염 처리목, 그 재), 오래된 살충제·제초제·쥐약, 이런 제품이 쌓인 흙, 광산 슬래그, 돼지·가금 사료첨가제다. 침지액·분무로 피부 흡수도 일어난다.</span><span class="hang">설프하이드릴기 효소를 억제한다(3가가 가장 독함). 반추동물은 섭취 후 20~50시간 지나 증상이 시작되며 전위가 찰수록 늦어진다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>비소 중독 — 증상과 진단<span class="hang">급성: 갑작스러운 심한 복통, 신음, 빈호흡, 침흘림, 이갈기, 반추위 완전 정지, 소에서도 구토, 이어서 묽고 악취 나며 때로 출혈성인 설사. 빈맥, 약한 맥, 탈수, 핍뇨. 체온은 정상. 위장염형은 치명률이 100%에 가깝다. 아급성은 2~7일 경과에 떨림·운동실조·간대성 경련 후 혼수.</span><span class="hang">살아 있는 소에서 가장 좋은 검체는 대량(약 1 L)의 소변이다. 섭취 직후부터 약 10일간 소변·분변·우유로 나온다. 털에는 털갈이까지 남아 만성 노출 증거가 된다(비노출 0.5 mg/kg 미만, 노출 5~10 mg/kg).</span><span class="hang">부검: 반추동물은 전위 점막은 멀쩡하고 제4위·장에 병변이 있다. 소에서 신세뇨관 괴사가 보인다. 급성은 간, 아급성·만성은 신장이 좋은 정량 검체다. 간·신장 10~15 mg/kg 습중량 초과를 진단적으로 보지만 그보다 낮아도 비소로 죽을 수 있고 2~3일 생존하면 3 mg/kg까지 떨어진다(Constable). 간·신장 3 ppm 습중량 초과를 기준으로 하는 기술도 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>비소 중독 — 치료<table class="bxt"><tr><th>약물</th><th>용량</th></tr><tr><td>티오황산나트륨</td><td>20~40 mg/kg 정맥 8시간마다, 또는 80 mg/kg 경구 1일 1회, 또는 30~60 mg/kg 경구 6시간마다 3~4일(Constable). 30 g 경구 1일 1회 4일(Rebhun)</td></tr><tr><td>디머카프롤(BAL)</td><td>1.5~5 mg/kg 근육 4~6시간마다 10일</td></tr><tr><td>티옥트산</td><td>50 mg/kg 정맥 8시간마다(Constable). 20% 용액 50 mg/kg 근육 1일 3회(Rebhun)</td></tr></table><span class="hang">실험 중독우 비교에서 티오황산나트륨은 효과가 적었고 BAL과 티옥트산 병용이 가장 나았다. 활성탄 1~4 g/kg 경구와 미네랄오일 또는 황산마그네슘으로 장내 잔여 비소를 제거하되 강한 하제는 피한다. 충분한 수액이 예후를 개선한다.</span><span class="hang">급성은 섭취량이 크고 증상 시작이 늦어 치료 가치가 작고, 중독우는 식용 부적합이라 치료를 잘 하지 않는다. 처리목을 울타리·축사에 쓰지 말고 태운 재에 접근시키지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">19.</span><span>구리 중독 — 원인과 감수성<span class="hang">급성은 단회 대량 투여·섭취(가용성 구리염 오투여, 황산구리 발욕조, 조류제거제·살균제 용기, 구리염 주사), 만성은 구리 과잉 사료·광물첨가제·대용유, 구리 살균제가 묻은 풀, 구리 사료를 먹인 돼지·닭의 분뇨를 뿌린 목초지, 제련소 오염에서 온다.</span><span class="hang">소의 급성 독성 용량은 200 mg/kg(최대 800 mg/kg)이고, 반추 전 송아지는 양과 비슷하게 민감하다. 소는 대개 사료 100 ppm을 견디지만, 구리 함량이 낮은 광물첨가제(비유우 38 mg/kg)를 2년 먹고 치명적 용혈이 난 예가 있다(Constable). 비유 중 37.5 mg/kg DM, 건유기 22.6 mg/kg DM 사료로 만성 중독이 보고되었다(Blackwell).</span><span class="hang">앵거스가 샤롤레·시멘탈보다, 저지가 홀스타인보다 민감할 수 있다. 성우가 어린 소보다 저항성이 크다. 몰리브덴·황이 적은 사료, 높은 Cu:Mo 비율(10:1 초과), 이오노포어, 피롤리지딘 같은 간독성 식물이 위험을 높인다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>구리 중독 — 기전과 용혈 위기<span class="hang">급성 대량 섭취는 위장관 점막의 강한 자극, 청록색 분변·점막, 심한 쇼크를 일으키고 살아남으면 혈관내 용혈이 온다. 과량 주사는 이튿날부터 죽기 시작해 3일째 정점이며, 초기 사망은 간부전, 후기 사망은 신세뇨관 괴사 때문이다.</span><span class="hang">만성 중독은 담즙 배설을 넘는 섭취로 간에 구리가 쌓이는 무증상 전용혈기를 거친다. 최대 간 농도에 이르면(노출 6개월에 이르기도 함) 간세포 괴사와 함께 구리가 혈중으로 쏟아져 급성 혈관내 용혈로 죽는다(용혈기).</span><span class="hang">영양 수준 저하, 수송, 비유 같은 스트레스가 방출을 촉발한다고 본다. 위기 직전까지 건강해 보이다가 급사하는 것이 위험하다. 사인은 급성 용혈성 빈혈과 혈색소뇨성 신증이다.</span></span></p><p class="bx-num"><span class="bxn">21.</span><span>구리 중독 — 임상증상과 진단<span class="hang">급성 섭취: 침흘림, 복통, 탈수, 설사, 청록색 점액성 분변, 체온 저하와 빈맥을 동반한 쇼크, 대개 24시간 내 허탈 사망. 오래 살면 이질과 황달. 주사 중독 송아지는 3일 이상 생존 시 복수·흉수, 혈색소뇨, 출혈, 머리 누르기, 후궁반장, 선회를 보인다.</span><span class="hang">만성: 식욕부진, 갈증, 혈색소뇨, 창백, 황달이 갑자기 나타나고 위장관 기능은 정상이다. 깊은 침울 후 24~48시간에 죽는다. 메트헤모글로빈혈증으로 갈색 점막, 빈혈, 호흡곤란을 보인다는 기술도 있다(Rebhun).</span><span class="hang">GGT·AST는 용혈 위기 전에 오를 수 있어 군 내 위험 개체를 골라 킬레이트할 때 쓴다. 혈중 구리는 위기 전까지 크게 오르지 않으므로 간 생검이 만성 중독 검출에 가장 좋다. 부검 시에는 미상엽 농도가 가장 높다.</span><span class="hang">수치: 정상 혈액 0.7~1.3 ppm, 정상 간 30~140 ppm 습중량, 정상 신장 15 ppm 이상 습중량(Rebhun). 용혈 위기 시 혈중 4.9~7.2 ppm(정상 약 1 ppm), 중독 송아지 간 30 mmol/kg, 단회 대량 섭취 후 신장 25 mg/kg DM 초과(Constable). 간 250 ppm DM 초과, 신장 100 ppm DM 초과, 전혈 10~20배 상승(Blackwell).</span><span class="hang">부검: 황달, 혈색소뇨, 부은 황색 간, 연한 비장, 청흑색(gunmetal) 신장. 소에서는 만성 간병변(공포변성, 문맥주위 섬유화)이 양보다 잘 보인다. 감별: 바베시아증, 세균성 혈색소뇨증, 렙토스피라증, 질산염 중독, 양파·배추과 SMCO 중독, 분만 후 혈색소뇨증.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>구리 중독 — 치료와 예방<span class="hang">급성: 수액, 위장보호제, NSAID로 탈수·통증·쇼크를 다루고, PCV가 빠르게 떨어지면 수혈한다.</span><span class="hang">만성: 몰리브덴산나트륨 3 g과 티오황산나트륨 5 g을 두당 1일 사료에 2주 첨가 후 감량(Rebhun). 테트라티오몰리브덴산암모늄 1.7 mg/kg 정맥 또는 3.4 mg/kg 피하를 격일 3회, 또는 2~15 mg/kg 정맥 1일 1회 3~6일. 송아지에 CaEDTA 70 mg/kg 2일 사용 예가 있다(Constable). 나라마다 허가된 몰리브덴 제형이 다르고, 영국에서는 테트라티오몰리브덴산 치료우의 식용이 불가하다.</span><span class="hang">예방: 공급원 제거, 사료 구리 감량 또는 몰리브덴 추가로 Cu:Mo 비율을 낮춘다. 황산구리 발욕조 폐액을 적절히 처리한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">23.</span><span>몰리브덴 과잉·이차 구리결핍 — 원인<span class="hang">몰리브덴이 많은 토양(영국 서머싯의 teart 목초지, 이탄지), 광산·금속공장·정유소 오염, 몰리브덴 비료, 몰리브덴 첨가 엔진오일로 생긴다. 소가 가장 민감하고 양·염소, 돼지, 말 순이다. 어린 성장우에서 증상이 뚜렷하다.</span><span class="hang">급성은 사료 7400 mg/kg(체중당 하루 약 30 mg/kg)에서, 만성은 하루 3 mg/kg에서 생긴다. 황 섭취가 많고 구리 상태가 낮으면 1 mg/kg에서도 생기며, 사료 2.4 mg/kg DM에서 구리 대사 간섭이 시작된다. 사료 10 mg/kg은 언제나 위험하다. 콩과 특히 알사이크클로버가 몰리브덴을 많이 흡수하고 봄·가을에 높다.</span><span class="hang">반추위에서 황이 황화물이 되어 몰리브덴과 티오몰리브덴산을 만들고, 이것이 장내에서 구리와 결합해 흡수를 막고 흡수 후에도 구리 이용을 막으며 배설을 늘린다. 증상 대부분은 실질적·기능적 구리 결핍이다. 사료 몰리브덴 10 mg/kg 초과는 이차 구리결핍과 연관되며, 이탄 토양에서 흔하다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>몰리브덴 과잉 — 증상과 진단<span class="hang">만성: 목초지 진입 8~10일 내 시작되는 지속성 설사, 수척, 건조한 피모, 산유량 급감, 검은 털의 탈색(적색·회색 기운, 눈 주위가 안경을 쓴 듯 보임), 구리 보충제에 대한 강한 갈망. 3개월~2.5세 소는 다리·등이 뻣뻣하고 일어나기 힘들며 움직이기를 꺼린다. 제엽염 같은 보행이나 발굽은 정상이고 식욕은 유지된다. 급성은 식욕부진, 침흘림, 후지부터 진행하는 운동실조, 기립불능, 사망.</span><span class="hang">혈중 구리는 정상 1.0 µg/mL에서 0.25 µg/mL로 떨어진다. 혈중 몰리브덴은 정상 약 0.05 mg/kg에서 0.10 mg/kg으로 오른다(Rebhun: 0.10 mg/kg 초과). 사료 Cu:Mo 2:1 미만 또는 몰리브덴 10 ppm 초과가 기준이다(Rebhun). 사료의 몰리브덴·구리·황을 함께 분석한다.</span><span class="hang">부검에서 특징적 병변은 없고 장염도 없다. 감별: 구리 중독, 내부기생충(오스터타기아), 요네병, 살모넬라증·겨울설사·BVD 같은 급성 장염.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>몰리브덴 과잉 — 치료와 예방<span class="hang">황산구리를 성우 1일 2 g 경구(2~3일) 또는 주 5 g 투여하면 2~3일에 설사가 멎고 다른 증상도 빨리 좋아진다(Constable). 사료에 황산구리 1~2%를 넣거나 몰리브덴을 줄인다(Rebhun). 장기적으로 Cu:Mo 4:1~10:1, S:Mo 100:1 미만을 유지한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">26.</span><span>셀레늄 중독 — 원인과 증상<span class="hang">셀레늄이 많은 토양의 축적 식물(일부 Astragalus 등, 최대 10,000 ppm), 사료 첨가 오류, 비타민 E 병용 주사제를 포함한 셀레늄 제제 과량 투여로 생긴다. 소의 1회 급성 경구 독성 용량은 9 mg/kg이다. 소는 양보다 내성이 크고 어린 동물이 더 약하다. 모넨신 병용은 셀레늄 독성을 높인다.</span><span class="hang">급성: 심한 호흡곤란, 불안, 완전 식욕부진, 침흘림, 수양성 설사, 발열, 빈맥, 자세·보행 이상, 짧은 경과 뒤 사망.</span><span class="hang">만성(alkali disease): 둔마, 수척, 거친 피모, 경직, 파행. 소는 꼬리 기부와 꼬리털이 빠진다. 관상대 부종, 발굽 변형·분리·탈락, 심한 파행이 생기고 신생 송아지에 선천성 발굽 기형이 올 수 있다. 골격근·심근 병증이 보인다.</span></span></p><p class="bx-num"><span class="bxn">27.</span><span>셀레늄 중독 — 진단과 예방<span class="hang">혈중 3 mg/kg, 소변 4 mg/kg 초과에서 증상이 보이고, 혈청은 정상 140~190 ng/mL에서 1500 ng/mL로 오른다. 털 5.0 mg/kg 미만이면 만성 가능성 낮음, 5~10 경계, 10 초과는 만성 진단적이다(Constable).</span><span class="hang">털 5 ppm 초과, 혈액 1.5 ppm 초과, 간 1.25 ppm 습중량 초과를 기준으로 하는 기술도 있다(Rebhun). 글루타티온 과산화효소는 독성 평가에 부적합하다(Bovine Medicine). 검체: 간·신장 50 g, 의심 사료 500 g.</span><span class="hang">치료법이 없다. 사료 셀레늄은 5 mg/kg DM을 넘기지 않는다. 25 mg/kg DM 목초를 수주 먹으면 만성 중독이 예상된다. 셀레늄 제제는 권장 용량과 경로를 엄격히 지킨다. 결핍이 중독보다 훨씬 흔한 문제다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">28.</span><span>불소 중독 — 원인<span class="hang">급성은 매우 드물며 불화나트륨 등 옛 제품, 화산재에서 온다. 만성이 대부분이다. 불소가 많은 인광석 보충제, 알루미늄 제련소·과인산석회 공장·벽돌·유리 공장 매연에 오염된 목초(풍하 14 km까지), 화산재, 깊은 우물·지하수가 원인이다.</span><span class="hang">반추동물이 계속 섭취해도 안전한 최대치는 하루 1 mg/kg이고 2 mg/kg에서 증상이 난다. 실험에서 사료 27 mg/kg이면 법랑질 반점, 49 mg/kg이면 함요, 93 mg/kg이면 뚜렷한 골병변이 생긴다. 젖소 내성 한계 40 mg/kg은 너무 높다는 견해가 있다.</span><span class="hang">물: 5 mg/kg에서 경미한 치아 병변, 10 mg/kg 초과에서 과도한 마모와 영양 장애, 30 mg/kg에서 전신 영향.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>불소 중독 — 증상과 진단<span class="hang">치아 불소증: 가장 이르고 진단적인 소견이다. 영구치에 가로 띠 모양 색소 반점(옅은 황·녹·갈·흑색)이 생기고 항상 좌우 대칭이다. 심하면 반점이 함요가 되고 치아가 부서지며 고르지 않게 빨리 닳는다. 저작 장애로 섭식이 줄어 성장 부진, 성우의 쇠약·케토시스가 온다.</span><span class="hang">골 불소증: 허리·고관절·후지의 파행과 쇠약이 먼저 보인다. 하악·흉골·중수골·중족골·지골이 비대해지고 외골증이 생기며 골절되기 쉽다. 군 단위로 고관절 파행이나 제3지골 골절이 나면 불소증을 의심한다. 제3지골 가로 골절로 갑자기 심한 앞다리 파행이 오기도 한다.</span><span class="hang">급성: 반추위 정지, 변비 또는 설사, 운동실조, 근육 떨림, 놀란 표정, 산동, 과민, 계속 씹기, 테타니·경련 후 수시간 내 사망.</span><span class="hang">검사: 정상 혈중 0.2 mg/dL까지, 소변 2~6 mg/kg. 중독우는 혈중 0.6 mg/dL, 소변 16~68 mg/kg(비중 1.040으로 보정). 혈청 ALP가 3~7배 오른다. 뼈(건조 탈지 기준)는 정상 1200 mg/kg까지, 반점만 있으면 3000, 심한 임상증상이면 4000 mg/kg 초과(Constable). 치밀골 5500 ppm, 해면골 7000 ppm 초과를 기준으로 하는 기술도 있다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>불소 중독 — 치료와 관리<span class="hang">공급원 제거 외에는 대증 치료다. 치아·뼈 병변은 회복되지 않는다. 활성탄은 불소와 잘 결합하지 않아 권하지 않는다. 칼슘·마그네슘·알루미늄을 경구로 주어 결합시키고, 저칼슘혈증·테타니에는 정맥 칼슘을 쓴다.</span><span class="hang">젖소 총사료 불소는 50 mg/kg 미만으로 한다. 인산 보충제는 착유·번식우 0.2%, 비육우 0.3% 이하 불소이어야 하고 곡물사료의 2%를 넘지 않게 한다. 어린 소는 불소 없는 물을 먹이고 성우만 위험한 물을 쓰며 3개월 간격으로 안전·위험 수원을 교대한다. 알루미늄염은 뼈 축적을 20~30%만 줄여 현장 대책으로 정당화되지 않았다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">31.</span><span>질산염·아질산염 중독 — 원인<span class="hang">식물 속 독성 형태는 질산염이고, 반추위 미생물이 이를 훨씬 독한 아질산염으로 환원한다. 정상적으로는 다시 암모니아로 바뀌지만 대량·급속 섭취로 이 과정이 넘치면 아질산염이 흡수된다. 소의 아질산염 최소 치사량은 88~110 mg/kg(질산칼륨 약 0.6 g/kg)이고, 질산칼륨 하루 약 0.15 g/kg을 3~13회 먹으면 유산이 생긴다.</span><span class="hang">원천: 어린 귀리·보리·밀·호밀, 수단그라스·수수·옥수수, 무성한 라이그라스, 순무·사탕무 잎, 유채, 명아주·비름(redroot pigweed)·엉겅퀴 등 질산염 축적 잡초. 비료 오염 우물물, 비료 자체, 질산염을 소금으로 착각한 오투여도 원인이다.</span><span class="hang">질산염이 많아지는 조건: 질소 과다 시비·분뇨 살포, 흐리거나 추운 날씨·밤·제초제·식물 병·시듦처럼 광합성이 억제될 때, 가뭄 뒤 첫 비. 뿌리와 줄기가 잎보다 많다. 건초는 질산염이 거의 그대로 남고, 사일리지는 약 30% 줄지만 사일로 침출액은 독할 수 있다.</span><span class="hang">배고픈 소, 수송 직후 소, 갑자기 마음껏 먹게 된 소가 위험하다. 모넨신은 질산염의 아질산염 전환을 촉진한다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>질산염 중독 — 메트헤모글로빈과 임상증상<span class="hang">아질산염이 헴 철을 2가에서 3가로 산화해 메트헤모글로빈혈증과 조직 저산소증을 만든다. 증상은 메트헤모글로빈 40~50%에서 나타나고 송아지는 60%까지 무증상일 수 있다(Constable). 30% 초과에서 증상, 80~90%에서 치사라는 기술도 있다(Rebhun·Bovine Medicine).</span><span class="hang">미리 생긴 아질산염은 매우 빨리, 반추위 전환을 거치면 수시간 지나 증상이 시작된다. 섭취 후 1시간 안에 죽을 수 있고 대개 12~24시간 안에 죽는다.</span><span class="hang">쇠약, 침울, 호흡곤란, 청색증 또는 갈색 점막, 운동실조, 떨림, 말기 경련. 혈액이 초콜릿색이나 일관된 소견은 아니고 사후 수시간이면 사라진다. 급성 중독에서 살아남은 소는 3~7일 뒤(수주까지) 유산한다. 어미 증상이 경미해도 태아 저산소증으로 유산할 수 있다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>질산염 중독 — 진단<span class="hang">안구액이 진단 체액으로 가장 좋다. 사후 72시간까지, 냉장하면 1주까지 측정할 수 있다. 질산염 시험지와 디페닐아민 시험으로 현장에서 안구액·식물을 검사할 수 있다. 반추위 내용물은 사후 미생물 작용으로 불안정해 쓸모가 적다(Blackwell).</span><table class="bxt"><tr><th>지표</th><th>기준</th></tr><tr><td>안구액 질산염</td><td>40 µg/mL(40 ppm) 초과면 확진(Rebhun). 10 ppm 초과 의심, 20 ppm 초과 진단적, 생후 첫날 송아지는 정상이 약 20 ppm이라 30 ppm 초과를 기준(Blackwell)</td></tr><tr><td>혈청·혈장 등 체액 질산염</td><td>15 ppm 초과 의심, 20~30 ppm 초과 진단적, 50 ppm 초과 중독 부합(Blackwell)</td></tr><tr><td>메트헤모글로빈</td><td>정상 0.12~0.2 g/dL, 뚜렷한 증상 1.65~2.97 g/dL, 치사 9 g/dL. 채혈 후 1~2시간 안에 인산완충액 혈액으로 측정</td></tr><tr><td>사료(건물)</td><td>6000~10,000 ppm 잠재 독성(Constable). 1% 초과 급성 중독, 0.5% 유산 위험, 안전 0.3% 이하(Constable). 0.6% 미만 권장, 10,000 ppm 초과 급성(Rebhun). 5000 ppm 미만 대체로 안전(Blackwell)</td></tr><tr><td>음수</td><td>1500 ppm 초과 급성 가능. 질산염 440 mg/L, 아질산염 33 mg/L 이하 권고(Rebhun)</td></tr></table><span class="hang">검체: 방수 1 mL·소변 1 mL 동결, 의심 사료(건조), 반추위 내용물 100 g(클로로포름·포르말린 첨가). 부검: 검붉거나 커피색 혈액이 잘 응고되지 않고, 위장 점막 충혈·출혈, 심근·기관 점상출혈.</span><span class="hang">감별: 급성 폐기종·폐부종, 곡류 과식, 시안화물, 남조류, 저마그네슘혈증, 요소 중독, 구리·양파 등 산화성 용혈.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>질산염 중독 — 치료(메틸렌블루)<table class="bxt"><tr><th>출처</th><th>메틸렌블루 용량</th></tr><tr><td>Constable</td><td>전통적으로 1~2 mg/kg를 1~2% 용액 정맥, 최대 10 mg/kg까지 사용. 반감기 약 2시간이라 필요하면 6~8시간마다 반복</td></tr><tr><td>Rebhun</td><td>1% 용액 4~15 mg/kg 정맥</td></tr><tr><td>Blackwell</td><td>1% 생리식염수 용액 5~15 mg/kg 천천히 정맥. 증상이 남으면 더 낮은 용량 추가</td></tr></table><span class="hang">많은 양에서는 메틸렌블루 자체가 메트헤모글로빈을 만들지만 적은 양에서는 빠르게 정상 혈색소로 되돌린다. 식용동물 허가 외 사용이다. 조직이 수개월 착색될 수 있고 소변이 짙은 녹색이 된다. 도축 휴약 180일(Constable).</span><span class="hang">찬물로 반추위를 세척하고 페니실린을 경구로 주어 반추위 내 아질산염 생성을 늦출 수 있다(Blackwell). 정맥 수액을 병용한다(Rebhun). 경증은 치료 없이 수시간에 회복하기도 한다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>질산염 중독 — 예방<span class="hang">배고프거나 수송 중인 소를 위험 사료에 바로 접근시키지 않고, 먼저 건초나 마른 목초로 배를 채운다. 탄수화물을 충분히 준다(옥수수 보충이 도움). 7~10일에 걸쳐 고질산염 사료에 적응시킨다. 의심 사일리지는 밤새 공기에 노출한 뒤 준다.</span><span class="hang">의심 사료는 급여 전에 분석하고, 저질산염 사료와 희석하거나 두 번에 나눠 준다. 질산염이 높거나 불확실한 사료는 임신우에게 주지 않는다. 질산염이 쌓일 조건에서 수확해야 하면 예취 높이를 18인치로 올려 줄기 아랫부분을 남긴다. 콩과-화본과 혼파는 위험을 줄인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">36.</span><span>요소·비단백태질소(NPN) 중독 — 원인<span class="hang">요소(사료 첨가물·당밀 혼합·광물 블록·비료), 암모늄염, 암모니아 처리 사료가 원인이다. 사료용 요소는 질소 약 45%로 요소 1 g이 단백질 2.81 g에 해당한다. 과량 급여, 적응 안 된 소에 급여, 혼합 불량, 비료 유출·저장 비료 접근, 오염수가 흔한 계기다.</span><span class="hang">절식우에서 0.33 g/kg까지는 혈중 암모니아 상승, 0.44 g/kg이면 10분 내 증상, 1~1.5 g/kg이면 사망. 적응 안 된 소는 0.4 g/kg에서 증상을 보이지만 서서히 늘리면 견딘다. 내성은 급여를 3일 끊으면 사라진다. 절식, 쉽게 이용되는 탄수화물 부족, 저단백 사료가 내성을 낮춘다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>요소 중독 — 기전과 임상증상<span class="hang">반추위 우레아제가 요소를 암모니아로 분해하는데 대량 유입 시 미생물 이용을 넘는다. 반추위 pH가 오르면 비이온형 암모니아가 늘어 빠르게 흡수된다. 증상 정도는 반추위가 아닌 혈중 암모니아에 비례한다. 고암모니아혈증은 TCA 회로를 억제해 전신 젖산산증을 일으키고, 대사성 산증에 동반된 고칼륨혈증이 부정맥·심정지를 부른다.</span><span class="hang">섭취 10~30분 뒤 심한 복통, 입·코 거품, 울부짖음, 소리·움직임 과민(공격성), 근육 떨림, 운동실조, 쇠약, 호흡곤란, 고창, 격렬한 몸부림. 심하면 수분 안에, 흔히 섭취 약 4시간에 죽고 치명률이 높다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>요소 중독 — 진단과 치료<span class="hang">반추위 pH 8.0 초과(생체 또는 아주 신선한 사체), 혈액이나 유리체 암모니아 1.0 mg/dL 초과(Rebhun). 반추위 암모니아 1000 mg/L, 혈청 암모니아질소 10~13 mmol/L, 혈중 암모니아질소 0.7~0.8 mg/dL에서 증상(Constable). 사체에서는 반추위·제4위·안구액을 쓴다. 특징적 부검 병변은 없고 전신 충혈·출혈·폐부종 정도다.</span><span class="hang">5% 초산(식초) 경구로 반추위 pH를 낮춘다. 소 4 L(Constable). 찬물 10~30 L 경구로 희석하고 우레아제 작용을 늦추며, 약 30분 뒤 재발하므로 반복한다. 식초 2~6 L와 찬물 20~30 L를 위관 투여한다는 기술도 있다(Rebhun). 첫 증상 즉시 시작해야 한다. 유일하게 확실한 치료는 대구경 위관이나 반추위 절개로 반추위를 비우는 것이다.</span><span class="hang">감별: 암모니아 처리 사료 중독, 급성 폐기종·폐부종, 급성 간부전, 급성 식염 중독, 남조류, 뇌염, 저마그네슘혈증.</span></span></p><p class="bx-num"><span class="bxn">39.</span><span>요소 중독 예방과 암모니아 처리 사료 중독(bovine bonkers)<span class="hang">요소는 탄수화물과 함께 서서히 도입한다. 젖소는 농후사료의 1%, 두당 1일 135 g, 총 조단백의 20% 이하(Constable). 사료 질소의 1/3 이상을 NPN으로 주지 않고, 서서히 늘리지 않는 한 총사료의 1%를 넘기지 않는다(Rebhun). 저장 비료·유출 비료에 접근시키지 않는다.</span><span class="hang">bovine bonkers: 고품질 고탄수화물 건초에 무수암모니아를 처리하면 4-메틸이미다졸 등이 생겨 과흥분, 빠른 눈 깜박임, 산동, 귀 털기, 빈뇨·빈변, 호흡곤란, 입 거품, 울부짖음, 돌진, 선회, 경련을 일으킨다. 어미가 멀쩡해도 포유 송아지가 걸릴 수 있다. 혈중 암모니아는 정상이고 특이 병변이 없다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">40.</span><span>시안화물 중독(청산배당체) — 원인<span class="hang">청산배당체 자체는 무독하다. 식물 효소나 반추위 미생물의 β-글리코시다제가 가수분해해 청산(HCN)을 낸다. 반추동물은 이 때문에 위험하고, 위산이 효소를 불활성화하는 말·돼지는 덜 민감하다. 소·양의 최소 치사량은 배당체 형태 HCN 약 2 mg/kg이다. 식물 시안 잠재량 200 ppm(20 mg/100 g) 초과가 잠재 독성이다.</span><span class="hang">주요 식물: 수수·수단그라스·존슨그라스, 벚나무속(Prunus, 벚·체리월계수 등), 사과(Malus, 사과씨·사과박), 아마씨(박), 카사바, 비파, 남천, 화살풀(Triglochin), 일부 클로버·살갈퀴.</span><span class="hang">배당체가 많아지는 때: 성장이 억제되었다가 급히 자랄 때(가뭄 뒤 가을비, 뜯긴 뒤 재생, 제초제 살포 후), 시들거나 서리 맞았거나 어린 식물, 가뭄 해, 고질소·저인 토양. 건조·서리는 식물 효소만 파괴해 독성은 그대로이고 반추위 효소로 다시 독해진다. 사일리지는 시안이 많이 줄지만 공기에 노출되면 HCN이 날 수 있다.</span><span class="hang">배고픈 소, 낯선 식물을 처음 접하는 소, 마른 목초지에서 탈출해 어린 수수밭을 폭식한 소가 위험하다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>시안화물 중독 — 기전과 임상증상<span class="hang">사이토크롬 c 산화효소를 억제해 세포가 산소를 쓰지 못한다. 산소가 혈액에 남아 정맥혈이 선홍색이 되고, 뇌 저산소증으로 죽는다. 소량은 간 로다네이스가 티오시안산염으로 해독하고 만성 소량 섭취는 갑상선종, 수수 방광염-운동실조 증후군, 관절만곡증 송아지와 연관된다.</span><span class="hang">대개 1~2시간을 넘기지 못한다. 초급성은 섭취 10~15분 내 발병해 증상 2~3분 뒤 죽는다. 호흡곤란, 불안, 비틀거림, 떨림, 신음, 기립불능, 후궁반장을 동반한 말기 간대성 경련. 점막은 선홍색. 급성형은 침울, 비틀거림, 머리·목에서 시작해 퍼지는 근육 떨림, 호흡곤란, 산동, 안진, 말기 청색증.</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>시안화물 중독 — 진단<span class="hang">특이 임상병리 소견은 없다. 부검에서 초급성은 정맥혈이 선홍색이나 현장 증례 대부분은 저산소로 검붉다. 혈액 응고 지연, 기관·폐 충혈·출혈, 심외막·심내막 출혈. 반추위의 쓴 아몬드 냄새는 식물에 따라 있거나 없다.</span><span class="hang">반추위 내용물·간·근육 50 g을 기밀 용기에 즉시 동결한다. 수송 중 HCN이 날아간다. 간은 사후 4시간, 근육은 20시간 안에 채취해야 하고, 근육이 HCN을 가장 잘 보존한다. 근육 HCN 0.63 µg/mL이면 진단 근거가 된다.</span><span class="hang">현장 검사: 피크르산나트륨 시험지(Henrici 시험). 의심 식물·반추위 내용물을 물과 클로로포름 몇 방울과 함께 시험관에 넣고 마개를 한 채 살짝 데우면 노랑이 빨강으로 변한다. 식물은 시들지 않은 상태로 검사해야 한다.</span><span class="hang">감별: 질산염 중독(초콜릿색 혈액), 요소 중독, 급성 폐기종, 남조류, 낙뢰·감전, 3-메틸인돌·이포메아놀 중독.</span></span></p><p class="bx-num"><span class="bxn">43.</span><span>시안화물 중독 — 치료와 예방<table class="bxt"><tr><th>처방</th><th>용량</th></tr><tr><td>아질산나트륨 + 티오황산나트륨(표준)</td><td>소: 아질산나트륨 5 g + 티오황산나트륨 15 g을 물 200 mL에 정맥(Constable)</td></tr><tr><td>티오황산나트륨 단독</td><td>30~40% 용액 25~50 g/100 kg 정맥. 고용량 660 mg/kg(30% 용액) 정맥이 결과가 더 좋다(Constable). 0.5 g/kg(30~40% 용액) 정맥과 경구 병행(Rebhun)</td></tr><tr><td>고용량 티오황산 병용</td><td>아질산나트륨 22 mg/kg, 또는 p-아미노프로피오페논 1~1.5 mg/kg, 또는 염화코발트 10.6 mg/kg</td></tr><tr><td>노출 무증상 개체</td><td>티오황산나트륨 30 g 경구, 1시간마다 반복</td></tr></table><span class="hang">아질산나트륨은 반추동물에서 추가 이득이 없을 수 있고, 질산염 중독이 겹쳤을 가능성이 있으면 금기다. 메틸렌블루는 효과가 없어 쓰지 않는다(Blackwell). 아질산 과량은 메트헤모글로빈혈증으로 저산소를 악화시킨다. HCN이 계속 방출되므로 치료를 반복해야 할 수 있다.</span><span class="hang">예방: 배고픈 소를 수수류에 넣지 않는다. 가뭄 스트레스·미성숙·시듦·서리 피해·급성장기 수수는 피하고, 대부분 품종은 75 cm 넘게 자란 뒤 방목하거나 청예한다. 서리 피해 후에는 최소 4~6일 기다린다. 독성 수수는 건초로 만들지 않고 사일리지가 훨씬 안전하다(3주 발효로 약 50% 감소).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">44.</span><span>유기인·카바메이트 중독 — 원인과 기전<span class="hang">아세틸콜린에스테라제를 억제한다. 유기인은 결합이 비가역적이고 카바메이트는 자연히 풀려 덜 위험하다. 과량 투여, 작물용 유성 제제를 동물에 사용, 탈수 동물에 투여, 과수원·밭 살포액의 목초지 비산, 저장 농약 접근이 원인이다.</span><span class="hang">클로르피리포스는 성우 젖소·성숙 종모우에 쓰지 않는다. 비육우에 한정하고 12주령 미만 송아지, 8개월령 초과 수소에는 쓰지 않는다(Constable). 테스토스테론이 독성을 높이는 듯하여 군 노출 시 종모우가 특히 걸린다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>유기인·카바메이트 중독 — 임상증상<span class="hang">독한 용액은 흡입·섭취 수분 안에 증상이 나고 2~5분 뒤 죽는다. 고형 저독성 제제는 수시간 늦게, 사망은 12~24시간까지 늦는다. 피부 노출은 1~7일 이상 지연되기도 한다.</span><span class="hang">침흘림, 눈물, 불안, 콧물, 기침, 호흡곤란, 설사, 빈뇨, 근육 경직·비틀거림. 여러 마리의 신음성 호흡곤란이 멀리서도 들린다. 혀 돌출, 축동(시력 저하), 머리·목에서 시작해 온몸으로 퍼지는 근육 떨림, 고창, 허탈, 사망. 클로르피리포스 중독 수소는 심한 반추위 정지를 보인다.</span><span class="hang">지연성 신경독성: 8~90일 뒤 후구 운동실조와 마비. 트리아릴인산 같은 공업용 유기인(유압유·윤활유)은 10일~수개월 뒤 서서히 진행하는 후구 부전마비를 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>유기인·카바메이트 중독 — 진단<span class="hang">혈액·뇌·망막의 콜린에스테라제 활성 저하로 진단한다. 대조군 대비 50~100% 감소가 설득력 있고(Constable), 50% 넘게 감소하면 진단적이다(Rebhun).</span><span class="hang">혈중 콜린에스테라제 억제는 증상보다 훨씬 오래간다. 카바메이트는 증상이 남아 있는 동안에도 수시간 안에 기준치로 돌아와 진단에 쓸 수 없을 수 있다.</span><span class="hang">급성 사례는 부검 병변이 없다. 의심 사료의 농약 분석은 유용하나 동물 조직 분석은 쓸모없거나 오해를 부를 수 있다는 기술(Constable)과 혈액·반추위 내용물·소변의 유기인 잔류 분석을 권하는 기술(Bovine Medicine)이 있다. 감별: 니코틴 중독 초기, 급성 폐기종·폐부종, 아나필락시스, 남조류 anatoxin-a(s), 보툴리즘.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>유기인·카바메이트 중독 — 치료(아트로핀·2-PAM)<table class="bxt"><tr><th>약물</th><th>용량</th><th>출처</th></tr><tr><td>황산아트로핀</td><td>0.5 mg/kg, 1/4은 정맥, 나머지는 근육·피하. 3~4시간마다 1~2일 반복, 침흘림과 심박으로 조절</td><td>Constable</td></tr><tr><td>황산아트로핀</td><td>0.25~0.50 mg/kg, 필요할 때만 반복</td><td>Rebhun</td></tr><tr><td>프랄리독심(2-PAM)</td><td>25~50 mg/kg, 20% 용액 6분에 걸쳐 정맥, 필요시 반복. 쿠마포스처럼 느린 화합물은 10일까지</td><td>Constable</td></tr><tr><td>프랄리독심(2-PAM)</td><td>20~50 mg/kg 근육, 첫 24~48시간에 투여가 가장 좋음</td><td>Rebhun</td></tr><tr><td>활성탄</td><td>1~2 lb 경구</td><td>Rebhun</td></tr></table><span class="hang">아트로핀은 무스카린 증상만 되돌리고 떨림·경련 같은 니코틴 증상은 되돌리지 못한다. 옥심은 시간이 지날수록 효과가 급감해 24시간 뒤에는 의미가 적고, 경제성 때문에 군 단위로는 잘 쓰지 않는다. 카바메이트 중독에는 2-PAM을 쓰지 않는다(Rebhun).</span><span class="hang">약욕·분무 노출은 비눗물로 부드럽게 씻는다. 경구 노출은 활성탄으로 흡착한다. 경구 투여 전에는 신선한 물을 충분히 먹인다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">48.</span><span>식염 중독·물 부족 — 원인<span class="hang">두 형태가 있다. 과량의 소금을 먹는 경우와, 정상 소금 섭취에 물 섭취가 제한된 경우다. 물통 결빙, 급수 장치 고장, 새 급수기 미숙, 염분 많은 지하수, 송아지에 고농도 전해질제·고삼투압 대용유를 주고 물을 주지 않는 경우가 흔하다(Rebhun).</span><span class="hang">급성 염화나트륨 중독 용량은 소 2.2 g/kg이다. 착유우, 특히 비유 초기 고능력우가 가장 민감하고 육우·건유우·양은 덜하다. 물 나트륨 1000 mg/L면 젖소에서 만성 문제와 산유 감소가 생긴다. 1.75% 소금물에서 미경산우는 체중이 유지되지 않고, 0.25% 소금물도 고능력우 산유량을 유의하게 줄인다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>식염 중독 — 기전과 임상증상<span class="hang">급성 다량 섭취는 고농도 소금 자극으로 위장염, 삼투성 설사, 탈수를 일으키고 흡수되어 신경을 침범한다. 물 제한형은 수일에 걸쳐 뇌 등에 나트륨이 쌓였다가, 물을 갑자기 마음껏 마시면 물이 조직으로 몰려 급성 뇌부종과 두개내압 상승이 온다. 회백질연화증과 관련이 있다.</span><span class="hang">급성: 설사(점액), 복통, 식욕부진. 흔하게는 섭취 1~2일 뒤 후궁반장, 안진, 떨림, 실명, 부전마비, 구절 굴곡(knuckling)이 나타나고, 기립불능·경련 뒤 발병 24시간 안에 죽는다. 콧물·다뇨가 있을 수 있다. 물 공급 재개 후 회백질연화증이 생길 수 있다(Bovine Medicine).</span><span class="hang">아급성(염분 많은 음수): 식욕 저하, 갈증, 송아지의 계속되는 울음, 체중 감소, 탈수, 저체온, 쇠약, 때때로 설사. 운동을 시키면 운동실조, 허탈, 입·코 거품을 동반한 강직성 경련. 비유우에서 케토시스가 합병한다.</span><span class="hang">물 완전 결핍: 목초지 소는 흥분해 울타리를 부수고 급수시설을 망가뜨린다. 함몰된 복부·안구 등 탈수, 떨림, 입 거품, 경직된 보행 후 기립불능. 갈증 해소 후에도 한동안 부패 태아 유산과 자궁경관 개대 부전 난산이 생긴다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>식염 중독 — 진단<span class="hang">혈청 나트륨이 정상 135~145 mmol/L에서 160~210 mmol/L로 오른다. 소는 돼지와 달리 호산구 감소가 없다. 뇌척수액 나트륨이 혈청보다 높다. 혈장 나트륨 160 mEq/L 초과(Rebhun).</span><span class="hang">부검: 급성은 제3위·제4위 점막 충혈과 묽고 검은 분변. 수일 생존 시 심낭수, 골격근 부종. 뇌 나트륨 1800 ppm 초과면 소에서 진단적이다. 검체: 간·골격근·뇌·혈청·뇌척수액·방수 또는 유리체(나트륨), 사료·물, 포르말린 뇌 반쪽.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>식염 중독 — 치료와 예방<span class="hang">독성 사료·물을 즉시 제거한다. 증상이 없으면 물을 주고 수일간 면밀히 관찰한다.</span><span class="hang">급성(발병 12~24시간 미만): 혈청 나트륨을 시간당 1 mmol/L 속도로 낮춘다. 탈수가 없으면 5% 포도당이나 0.45% 식염수, 저혈량이면 0.9% 식염수나 등장 정질액을 쓴다.</span><span class="hang">만성 또는 경과 불명: 물을 소량씩 자주 주고 무제한 급수는 발병 두수를 갑자기 늘릴 수 있으니 피한다. 마시지 못하면 위관으로 준다. 혈청 나트륨은 시간당 0.5 mmol/L 이하로 낮춘다.</span><span class="hang">자유수 결핍량(L) = 0.6 × 체중(kg) × (현재 혈청 Na ÷ 참고치 Na − 1). 첫 24시간에 50% 이하를 보충하고 나머지는 24~48시간에 걸쳐 준다. 위장보호제, 폐부종에 이뇨제, 뇌부종에 만니톨이나 고장 식염수를 쓴다. 나트륨 함유 수액으로 서서히 교정하고 티아민을 준다는 기술도 있다(Rebhun). 소금과 물은 언제나 자유롭게 접근할 수 있어야 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>유황 과잉 — 원인과 기전<span class="hang">황산염이 많은 우물물, 황산염 염류·황 함유 광물첨가제, 고황 단백질원, 에탄올 부산물인 주정박(DDG), 외부기생충용 유황 분말, 흡입 황화수소·이산화황이 원인이다. 소에서 85~450 g/두 급여가 치명적이었다. 서부 방목지에서는 물속 황산염이 가장 흔한 원인이다(Blackwell).</span><span class="hang">반추위 미생물이 황산염·원소 황을 황화물, 이어 황화수소로 바꾸고, 흡수된 황화수소가 세포 에너지 생산(ATP)을 막는다. 에너지 요구가 큰 뇌가 주로 다쳐 회백질연화증이 생긴다. 반추위 pH가 낮을수록 황화수소가 많이 생긴다.</span><span class="hang">사료 총황 0.4% DM 초과가 기준이나 모두 발병하지는 않으며 물로 들어오는 황을 반드시 합산한다(Rebhun). NRC는 소 사료 황을 요구량 수준(젖소 0.2%, 육우 0.15%)으로 제한하도록 권한다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>유황 과잉 — 증상·진단·치료<span class="hang">급성: 중추성 실명, 머리 누르기, 후궁반장, 기립불능, 경련, 혼수, 사망. 복통, 악취 설사, 반추위 정지, 황화수소 냄새. 12~48시간에 발병하고 대개 죽는다. 사료·물 변경 1~2일 뒤 돌연사하거나, 수일~2~3주 뒤 대뇌 증상이 난다.</span><span class="hang">아급성·만성: 피질성 실명, 이갈기, 쇠약, 운동실조, 머리 미세 떨림, 기립불능. 노출 수주 뒤에야 나타나기도 하고 회복해도 신경 결손이 남는다. 회백질연화증 상세는 신경 탭에서 다룬다.</span><span class="hang">진단은 부검 소견과 사료·물의 황 분석으로 한다. 모든 사료 성분과 물을 분석해 총량을 계산한다. 반추위 가스 황화수소 농도와 혈중 황화헤모글로빈이 보조가 된다. 급성례에는 회백질연화증이 없을 수 있다.</span><span class="hang">티아민 10 mg/kg 느린 정맥·근육 12시간마다 3일(Constable). 티아민 10 mg/kg 6~8시간마다, 첫 회는 천천히 정맥(빠르면 허탈), 이후 근육 3~5일, 덱사메타손 1~2 mg/kg 근육·피하로 뇌부종 감소(Blackwell). 고황 공급원에서 빼고 저황 사료로 바꾼다. 주정박은 배치마다 검사하고, 사료·물 변경은 특히 여름에 갑자기 하지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">54.</span><span>이오노포어 중독 — 원인과 용량<span class="hang">모넨신·라살로시드·살리노마이신이 반추동물에 쓰인다. 안전역이 좁아 희석 실패, 혼합 불량, 용기·포대 혼동, 액상 제제 침전으로 사고가 난다. 소는 권장량의 10배 넘게 먹고 중독되는 일이 흔하다. 특히 어린 송아지에서 잘 생긴다(Rebhun).</span><span class="hang">모넨신 권장량은 소 두당 1일 50~200 mg, 사료 16.5~33 ppm(Constable), FDA 권고 총사료 5.5~33 ppm(Blackwell). 소에서 증상은 10 mg/kg, LD50은 26.4 mg/kg(LD1 5.5, LD10 11 mg/kg). 사료 200~400 ppm을 며칠 먹으면 만성 중독, 100 ppm 1년은 영향이 없었다(Blackwell). 라살로시드 소 치사량은 50~100 mg/kg.</span><span class="hang">마크롤라이드 항생제 동시 급여는 모넨신 독성 위험을 높인다(Rebhun). 모넨신은 고질소 사료에서 아질산염 중독을, 셀레늄 병용 시 셀레늄 독성을 높인다. 말은 가장 민감해 소 사료를 먹으면 위험하다.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>이오노포어 중독 — 기전과 임상증상<span class="hang">세포 내외 양이온(Ca, Na, K) 균형을 깨 ATP 생성을 방해하고, 칼슘·나트륨 대량 유입으로 근세포가 변성·괴사한다. 표적은 심근과 골격근이며, 소는 둘이 비슷하게 다친다.</span><span class="hang">가장 일관된 소견은 식욕부진이다. 고용량이면 24시간 안에, 적은 섭취면 5일까지 늦게 시작한다. 식욕부진 뒤 설사, 떨림, 쇠약, 빈맥, 반추위 무력이 오고 이 단계에서 급성 심부전으로 죽을 수 있다. 하루 이틀 살아남으면 흉전부 부종, 경정맥 확장, 복수, 묽은 변, 호흡곤란, 빈맥 같은 울혈성 심부전이 온다.</span><span class="hang">폐사는 사고 뒤 수일~수개월에 걸쳐 이어지고 분만 같은 운동 부하가 흔한 계기다. 장기간 소량 섭취는 모두 울혈성 심부전 양상이다. 송아지, 특히 라살로시드 중독에서 중추신경 증상이 보인다(Rebhun). 골격근 손상이 우세하면 쇠약, 운동실조, 기립불능, 근색소뇨가 난다.</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>이오노포어 중독 — 진단<span class="hang">CK·LDH·ALP·AST 상승, 근색소뇨(흔하고 오래감), 심장 트로포닌 I 상승.</span><span class="hang">확진은 사료와 위(반추위) 내용물의 이오노포어 정량이다. 혈청 이오노포어 분석은 별 도움이 안 된다. LC/MS로 모넨신·라살로시드·살리노마이신·나라신을 분석한다.</span><span class="hang">부검: 심근병증, 폐부종, 간·심장 비대, 심낭수, 흉수, 복수, 출혈이나 창백한 줄무늬가 있는 근육. 급사례는 병변이 없을 수 있어 여러 부위를 포르말린에 고정해 조직검사한다. 비대하고 단단하며 청색을 띤 간(울혈)이 섭취 수일~수개월 뒤에도 보인다(Rebhun).</span><span class="hang">감별: 다른 이오노포어 동시 섭취, 셀레늄·비타민 E 결핍, 강심배당체 식물(협죽도), 주목, 커피센나(Cassia), 털살갈퀴, 흰뱀뿌리, IBR·수송열.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>이오노포어 중독 — 치료와 예방<span class="hang">특이 치료가 없고 보존 치료만 한다. 활성탄이나 미네랄오일로 장내 잔여 독물을 제거하지만 이미 흡수되었으면 소용없고, 심근이 다치면 회복을 기대하기 어렵다.</span><span class="hang">셀레늄·비타민 E는 증상 시작 뒤에는 효과가 없고 증상 전에 주면 도움이 될 수 있다는 기술(Constable)과, 비경구 셀레늄·비타민 E로 이차 산화 손상을 줄인다는 기술(Rebhun·Blackwell)이 있다. 디곡신은 이오노포어 중독에 금기다(Blackwell).</span><span class="hang">마구간 휴식과 스트레스 없는 환경으로 심장 부담을 줄이고 운동·흥분을 제한한다. 만성 심질환 가능성 때문에 예후는 조심스럽다. 사료공장과 농장에서 제조·혼합 관리를 철저히 하고, 여러 이오노포어를 함부로 겹쳐 쓰지 않으며, 말이 소 사료에 접근하지 못하게 한다. 소 식용조직 모넨신 허용치는 0.05 ppm이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">58.</span><span>곰팡이독 — 육우 관점 총론<span class="hang">반추동물은 반추위 미생물이 독소를 덜 독한 물질로 바꿔 단위동물보다 덜 민감하다. 반추 전 송아지와 스트레스·섭취량이 큰 젖소가 더 위험하다(Blackwell).</span><span class="hang">가장 흔한 현장 소견은 사료 섭취 감소·거부, 증체·산유 저하, 면역억제 같은 막연한 생산성 저하다. 새 사료·새 목초지 도입과 발병 시점을 맞춰 보고, 의심 사료를 LC-MS 등으로 분석한다.</span><span class="hang">치료는 오염 사료 중단, 깨끗한 사료와 보존 치료이며 저용량 노출은 3~6주에 회복한다. 오염 사료 희석은 규제상 허용되지 않을 수 있다. 미국에서 곰팡이독 결합제는 승인되지 않았고, 알루미노규산염·벤토나이트의 아플라톡신 결합만 효과가 인정된다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>아플라톡신<span class="hang">Aspergillus flavus·parasiticus가 옥수수·땅콩·면실박·수수에 만든다. 가뭄, 고온, 해충 피해가 수확 전 오염을, 고습 저장이 수확 후 오염을 키운다. B1이 가장 독하고 간에서 에폭사이드로 활성화되어 DNA·단백질에 결합한다. 섭취 B1의 1~2%가 M1으로 우유에 나온다. 어린 동물이 더 민감하고 3~6개월령 송아지가 가장 취약하다.</span><span class="hang">증상: 사료 수백 ppb에서 섭취·증체 저하. 급성은 실명, 선회, 귀 경련, 이갈기, 거품, 광과민 피부염, 설사, 심한 이급후중, 직장 탈출, 유산, 기립불능 후 경련, 48시간 내 사망. 혈종(응고 장애), 산유 감소, 면역억제. 간효소(GGT·AST·SDH)·빌리루빈·프로트롬빈 시간 상승. 부검은 간세포 거대화, 괴사, 섬유화, 담관 증식.</span><span class="hang">기준: 소에서 사료 AFB1 100 µg/kg 초과가 독성(Constable), 사료 20 ppb 이상, 우유 0.5 ppb 미만(Rebhun). 미국 FDA 사료 기준: 비육 마무리 육우용 옥수수·땅콩 300 ppb, 육우용 면실박 300 ppb, 번식 육우 100 ppb, 미성숙 동물·젖소 20 ppb, 우유 M1 0.5 ppb(EU 0.05 ppb). 치료는 간부전 대증 치료뿐이다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>제아랄레논<span class="hang">Fusarium graminearum 등이 습한 저장 옥수수·보리·밀·귀리에 만드는 비스테로이드성 에스트로겐이다. 수분 뒤 추위가 오는 조건에서 잘 생긴다. 소는 덜 에스트로겐성인 β-제아랄레놀로 주로 대사해 돼지보다 영향이 작다.</span><span class="hang">소에서는 수태율 저하와 수정 횟수 증가가 주 영향이다. 난소 주기와 무관한 발정 행동, 임신 말기 발정, 원인 불명 질염, 미경산 육성우의 대칭성 유방 비대, 산유 감소, 유산 의심 예가 있다. 외음부 부종, 탈출, 무발정, 위임신, 불임도 기술된다(Blackwell).</span><span class="hang">사료 5 ppm 이상에서 증상(Rebhun). 오염 사료를 끊으면 완전히 회복하며 탈출 장기만 외과 처치한다. 저장 곡물 수분은 15~16% 미만으로 유지한다. 감별: 알팔파·클로버 식물성 에스트로겐, 성장촉진 이식제 과량. 번식 영향 상세는 번식 탭에서 다룬다.</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>트리코테센(DON·T-2)<span class="hang">Fusarium이 개화기 고온다습, 우박 피해, 월동 곡물에서 만든다. DON(구토독)은 반추위에서 거의 무독한 DOM-1로 바뀌어 반추동물은 내성이 크고, 육우·양이 젖소보다 더 높은 농도를 견딘다.</span><span class="hang">대표 증상은 사료 거부와 설사다. 저농도 만성 노출은 영양 장애, 생산성 저하, 면역 반응 감소로 나타난다. 더 독한 A형(T-2, HT-2, DAS)은 구강 점막 괴사, 응고 장애·출혈, 면역억제, 백혈구 감소, 번식 장애, 발열, 유산(T-2는 태반 통과)을 일으킨다. T-2·DAS 10 ppm 초과가 독성이다(Rebhun).</span><span class="hang">미국 DON 권고: 4개월령 넘은 반추 육우·비육우는 곡물·부산물 10 ppm(주정박·맥주박 30 ppm), 총사료 10 ppm 이하. 4개월령 넘은 반추 젖소는 총사료 5 ppm 이하. 4개월령 미만은 곡물 5 ppm으로 사료의 40% 이하(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>푸모니신 — 요약<span class="hang">푸모니신은 Fusarium verticillioides가 옥수수에 만들며 주정박에서 3배 농축된다. 말·돼지보다 소가 훨씬 덜 민감하다. 소·양은 100 ppm을 거의 영향 없이 견디고 150~200 ppm에서 식욕부진, 체중 감소, 경미한 간 손상이 온다. 젖소가 더 민감해 분만 전후 100 ppm에서 산유·섭취가 줄었다. 우유로 나오지 않는다.</span><span class="hang">미국 FDA 푸모니신 지침(옥수수·부산물, 사료의 50% 이하): 번식 반추동물 30 ppm, 3개월령 이상 도축용 반추동물 60 ppm, 그 밖과 미성숙 반추동물 10 ppm.</span></span></p><p class="bx-num"><span class="bxn">63.</span><span>맥각 중독(Claviceps purpurea)<span class="hang">호밀·트리티케일과 여러 목초 이삭의 균핵(맥각)을 대량 먹을 때 생긴다. 따뜻하고 습한 계절 뒤에 많고 사일리지가 되어도 독성이 남는다.</span><span class="hang">말단 괴저형: 후지 하부, 꼬리, 귀가 붉어지고 붓고 차가워지며 털이 빠지고 감각이 없어진 뒤 청흑색으로 마르고 결국 분리·탈락한다. 통증은 없으나 초기부터 파행이 있고 설사가 흔히 동반된다. 감염 목초지 진입 10일 만에 파행이 보이기도 하나 대부분 2~4주 뒤 나타난다. 추운 달에 괴저, 더운 날씨에 고체온형이 많다.</span><span class="hang">고체온형: 41~42℃, 호흡곤란, 침흘림, 그늘·물을 찾음, 산유·증체 저하. 30℃ 넘는 날 운동시키면 흔히 죽는다.</span><span class="hang">사료 맥각 0.3~1.0%에서 증상(Rebhun). 오염 사료를 즉시 끊는다. 사료 내 맥각 이삭은 0.1%를 넘기지 않고, 맥각 낀 목초는 예취 날을 높여 이삭을 제거한 뒤 방목한다. 임신우에게 먹이지 않는다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>톨페스큐 내생균 중독(fescue toxicosis)<span class="hang">톨페스큐의 내생균 Neotyphodium coenophialum이 에르고발린을 만든다. 품종별 독성 차이가 커 KY-31이 가장 독하다. 감염 페스큐 목초지의 에르고발린 200~600 ppb(0.2~0.6 ppm) 아급성·만성 노출로 생긴다(Blackwell).</span><span class="hang">여름 중독(summer slump): 가장 흔하다. 영양가 있는 목초가 충분한데도 산유 감소와 증체 불량, 31℃ 넘으면 악화. 체온 최고 40.5℃, 호흡곤란, 침흘림, 식욕 저하, 거친 피모, 물·그늘을 강박적으로 찾음. 목초지에서 옮긴 뒤 약 6주까지 고체온이 남는다. 프로락틴이 낮다. 수태율 저하도 보인다(Rebhun).</span><span class="hang">페스큐 발(fescue foot): 추운 날씨에 페스큐 우점 목초지에 넣은 지 10~14일(가을, 10~21일이라는 기술도 있음) 만에 심한 파행, 2주 이상 지나 발가락·꼬리 괴저와 탈락. 군 발생률 10%까지, 목초지에서 뺀 뒤 1주까지 새 증례가 나온다. 초기 광범위 항생제가 이차 감염 예방에 쓸 수 있다.</span><span class="hang">지방괴사: 복강 지방이 굳고 괴사해 골반강이면 난산, 장간막이면 폐색·고창을 일으키며 흔히 부검 시 우연히 발견된다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>진전성 곰팡이독(staggers)<span class="hang">Claviceps paspali에 감염된 성숙 달리스그래스·바히아그래스(paspalitrem), 버뮤다그래스, 내생균 감염 다년생 라이그래스(lolitrem B), Penicillium(penitrem A), Aspergillus clavatus가 원인이다.</span><span class="hang">운동 시 악화되는 떨림, 과흥분, 운동실조, 측정과대, 강직 후 허탈과 이완. 라이그래스 떨림은 머리에서 시작해 목·어깨, 다리로 퍼진다. 늦여름·초가을 과방목 목초지에서 많다.</span><span class="hang">스트레스를 피하고 감염 목초지에서 빼면 대개 7~15일에 완전히 회복한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">66.</span><span>고사리 중독 — 원인과 기전<span class="hang">고사리(Pteridium aquilinum)는 생것이든 마른 것이든 독하고, 새로 돋는 어린 잎과 뿌리줄기가 가장 독하다. 목초가 부족할 때와 봄 새순이 날 때 먹고, 오염 건초나 고사리 깔짚으로도 노출된다. 대체로 사료의 20%까지를 30일 이상 먹으면 발병하고 노출을 끊은 뒤 6주까지 새 증례가 나온다. 1~3개월 장기 섭취 뒤 지연되어 나타난다(Rebhun).</span><span class="hang">주 독소 프타킬로사이드는 방사선 유사 작용으로 골수 모든 계열을 억제한다. 알칼리성 소변에서 발암물질 다이에논으로 바뀌어 방광 종양을 만들고, 소 유두종바이러스 2형과 상승 작용한다. 우유로 이행한다.</span><span class="hang">고사리의 티아미나제는 반추위 미생물이 티아민을 충분히 만들어 반추동물에서는 거의 문제가 되지 않고 말·돼지에서 신경병을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>고사리 중독 — 급성 출혈형(골수 억제)<span class="hang">비출혈, 점상·반상출혈, 쇠약. 전방출혈, 자연공 출혈, 출혈성 설사, 흑색변, 혈뇨. 호중구 감소로 위장관 궤양을 통해 세균이 침입해 균혈증, 간 경색, 폐렴(호흡곤란·발열)이 흔히 겹친다. 무리 전체가 무증상으로 영향을 받는 가운데 일부 개체가 발병한다.</span><span class="hang">송아지에서는 출혈 없이 진행성 호흡곤란을 보이는 후두 부종형이 있다(Rebhun).</span><span class="hang">호중구·혈소판 감소가 빈혈보다 먼저 오고, 출혈 시간이 길어지나 프로트롬빈 시간은 정상이다. 골수 생검에서 범혈구감소. 부검: 다발성 출혈, 창백한 골수, 부종·궤양성 위장관.</span><span class="hang">특이 치료가 없다. 노출 중단, 광범위 항생제, 수혈(플라스틱 백 채혈 전혈이나 혈소판 풍부 혈장)을 하지만 반응이 나쁘고 골수 억제 개체는 거의 회복하지 못한다. 감별: 탄저, BVD, 퓨라졸리돈 중독, 스위트클로버·쥐약 중독, 방사선 손상, 스타키보트리스 중독.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>고사리 중독 — 효소성 혈뇨(bovine enzootic hematuria)<span class="hang">고사리가 많은 지역의 풍토병으로 3세 넘은 소에서 주로 생기고 대개 치명적이다. 방광 점막하 혈관종과 혈관육종, 이행상피암, 유두종 등이 생긴다.</span><span class="hang">심하면 핏덩이 섞인 대량 혈뇨로 출혈성 빈혈, 쇠약, 기립불능 후 1~2주에 죽는다. 경하면 간헐적 경미한 혈뇨나 무증상 혈뇨로 수개월에 걸쳐 쇠약해진다. 직장검사로 방광벽 비후를 촉지할 수 있고 방광경으로 크고 작은 흰색~적색 결절이 보인다. 이차 방광염·신우신염이 생길 수 있다.</span><span class="hang">소변 시험지 잠혈 반응은 병변 수·정도와 비례한다. 육안 혈뇨가 없으면 원심 침사를 반복 검사한다. 응고검사와 과립구·혈소판은 정상이다. 출혈량은 병변 크기와 비례하지 않아 작은 병변으로도 출혈사할 수 있다.</span><span class="hang">치료하지 않고 가능한 빨리 처분한다. 심하면 수혈, 그 밖에는 조혈제를 준다. 영양 개선으로 발생이 줄고, 석고 225~335 kg/ha 시비가 발병을 늦춘다고 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">69.</span><span>주목(Taxus) 중독<span class="hang">조경수 전정 가지를 버리거나 먹인 경우가 대부분이다. 붉은 가종피를 빼고 전체가 독하며 씨앗도 독하다. 마른 가지·죽은 나무도 독하고 태운 잎을 먹고 죽은 송아지도 있다. 일본주목·서양주목이 탁신 함량이 가장 높다. 최소 독성량은 소 잎 2 g/kg, 말 0.2~0.4 g/kg.</span><span class="hang">탁신 B가 심근 칼슘 통로를 막아 서맥, 방실 전도 시간 증가, QRS 확장, 부정맥, 심정지를 일으킨다. 대부분 폐사체로 발견되거나 수시간 내 죽는다. 아치사량이면 서맥, 호흡곤란, 운동실조, 불안 또는 침울, 근육 떨림, 허탈, 유산, 경련. 며칠 뒤 부정맥으로 죽기도 한다. 반추동물이 섭취 후 3일을 넘기면 예후가 좋다.</span><span class="hang">육안 병변이 대개 없고 입·반추위에 주목 조각이 있는 것이 진단 근거다. 다발성 심근 괴사, 만성례 심근 섬유화가 보일 수 있다.</span><span class="hang">해독제가 없다. 반추동물은 반추위 절개와 활성탄. 아트로핀·리도카인은 동물에 써 왔으나 사람에서 효과가 없었다. 주목을 목초지 주변에 심지 말고 전정 가지를 멀리 버린다.</span></span></p><p class="bx-num"><span class="bxn">70.</span><span>진달래과 그라야노톡신(진달래·철쭉·마취목)<span class="hang">진달래·철쭉(Rhododendron), 마취목(Pieris), 칼미아(Kalmia, 산월계수), Leucothoe, Lyonia 등 진달래과 식물의 꽃·잎·가지·줄기에 있다. 가지치기 잔재를 목초지에 버렸을 때 많이 죽는다.</span><span class="hang">전압 의존 나트륨 통로를 계속 열어 지속적 탈분극을 만든다. 섭취 3~14시간(Constable) 또는 6시간 이내(Blackwell)에 시작한다. 둔마, 심한 침흘림, 분출성 구토(되새김질 역류), 고창, 반복 삼킴·트림, 이급후중, 복통, 비틀거림, 기립불능, 후궁반장 경련, 떨림, 호흡곤란, 신음. 빈맥, 저혈압, 부정맥, 41.1℃까지 발열.</span><span class="hang">흡인성 폐렴이 흔한 후유증이며 유일하게 흔한 육안 부검 소견이다. 소화관 내 식물 확인, 분변·소변 LC-MS로 진단한다.</span><span class="hang">특이 해독제는 없다. 아트로핀 단독 또는 염소·소에서 황산아트로핀 10~20 mg과 10% 캄퍼설폰산나트륨 15~20 mL 피하 병용이 쓰였다. 급성이므로 활성탄 경구, 보존 치료. 심한 중독도 회복 가능하다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>강심배당체 식물(협죽도 등)<span class="hang">협죽도(Nerium oleander), 디기탈리스, 은방울꽃, 박주가리(Asclepias), 헬레보루스, 아보카도 등이 카데놀라이드를 함유한다. 아주 적은 양으로 중독되고 치명률이 매우 높다. 말라도 독성이 남는다.</span><span class="hang">Na/K-ATPase를 억제해 세포내 칼슘을 높이고 미주신경 긴장을 높여 부정맥과 심정지를 일으킨다. 무관심, 고개 숙이고 배를 움츠린 자세, 이갈기·신음, 빈맥·서맥·방실차단 등 부정맥, 호흡곤란, 반추위 무력, 고창, 점액·혈액 섞인 설사, 탈수, 후구 부전마비. 운동 중 돌연사가 흔하다.</span><span class="hang">심전도 이상(PR 연장, ST 변화, T파 변화, QRS 확장, 방실 해리, 심실빈맥), 혈액농축, 고칼륨혈증, 고질소혈증. 위 내용물의 식물 조각과 LC-MS로 독소를 확인한다. 부검은 12시간 넘게 살면 다발성 심근 변성·괴사, 심내막·심외막 출혈.</span><span class="hang">활성탄과 수액. 부정맥에 리도카인·프로카인아마이드, 방실차단에 아트로핀, 빈맥에 프로프라놀롤을 쓴다(Constable). 부정맥에 아트로핀, 반추위 절개로 제거(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>참나무(도토리) 중독 — 원인과 기전<span class="hang">잎·새순·풋도토리의 가수분해성 타닌과 단순 페놀이 원인이다. 봄에는 새순과 어린 잎, 가을에는 도토리로 생긴다. 가뭄 등으로 목초가 부족할 때 많고, 비바람·늦은 봄눈으로 가지·도토리가 목초지에 떨어진 뒤에도 생긴다. 도토리를 갈망해 다른 풀을 마다하는 개체가 있다. 소가 가장 많이 걸리고 어린 소가 더 심하다. 치명률이 흔히 80%를 넘는다.</span><span class="hang">반추위에서 피로갈롤·갈산 등 페놀 대사물이 생겨 신세뇨관을 괴사시키고 위장관 점막 궤양을 만든다. 혈관 단백질에 결합해 출혈과 부종을 일으킨다. 다른 먹이 없이 3~4일 먹으면 신증이 생긴다(Constable). 평균 1주(2~14일) 섭취 뒤 발병하며 노출 중단 21일 뒤 발병한 보고도 있다(Blackwell).</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>참나무 중독 — 증상·진단·치료<span class="hang">섭취 3~7일 뒤 식욕부진, 침울, 반추위 정지, 변비 후 점액·혈액 섞인 검은 타르변(출혈성 장염), 하복부·회음부·턱밑·흉전부 피하 부종, 복통. 초급성은 무뇨이고 다뇨·혈뇨도 보인다. 이차 기관지폐렴, 위장관 천공·농양.</span><span class="hang">고질소혈증, 저나트륨혈증, 고칼륨혈증, 고인산혈증, 저칼슘혈증, 간효소 상승. 등장뇨, 단백뇨, 혈뇨, 당뇨, 과립 원주. 부검: 피하 부종, 복수·흉수, 신주위 부종과 출혈을 동반한 창백하고 커진 신장(세뇨관 응고괴사), 입~장의 다발성 궤양, 반추위 속 도토리·잎. 감별: 비름(pigweed)·옥살산 중독, 요로결석, 렙토스피라증, 중금속, 신독성 항생제, IBR·BVD.</span><span class="hang">모든 소를 참나무에서 즉시 떼고 건초와 물을 준다. 이뇨와 산염기·전해질 교정을 위한 정맥 수액이 핵심이다. 반추위 절개(Rebhun). 이차 폐렴·농양에 항생제(신독성 약물은 금기), 반추위액 이식. 초기에 수산화칼슘, 활성탄, 미네랄오일 1 L/500 kg, 황산나트륨 1 kg/400 kg 또는 황산마그네슘 450 g/400 kg, 폴리에틸렌글리콜 1 g/kg/일(타닌 결합)을 쓴다(Blackwell). 신기능 회복은 대개 60일 안이나 심하면 드물다. 회복한 육성우는 보상 증체로 비육장에서 잘 큰다는 기술(Constable)과 만성 신질환으로 증체가 나쁘다는 기술(Blackwell)이 있다.</span><span class="hang">예방: 어린 참나무 군락 방목 제한, 수산화칼슘 10~15% 함유 펠릿 보충제 두당 1 kg/일(Blackwell), 사료의 15% 수산화칼슘(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">74.</span><span>피롤리지딘 알칼로이드 중독<span class="hang">개쑥갓류(Senecio, 서양금방망이 ragwort), Crotalaria, Heliotropium, Echium, Amsinckia가 원인이다. 소와 말이 다른 종보다 30~40배 민감하고 양은 저항성이 크다. 생풀은 맛이 없어 잘 안 먹지만 시들거나 베어진 풀, 건초·사일리지 속 풀은 잘 먹는다.</span><span class="hang">간 P450이 만든 피롤 대사물이 누적성 간독소로 작용해 간세포 거대화, 정맥 폐쇄, 섬유화를 만든다. 독성 용량 섭취 뒤 최대 18개월이 지나 증상이 나기도 한다.</span><span class="hang">소: 갑작스러운 침울과 외부 자극 무반응, 간간이 흥분·광폭·공격 행동, 심한 설사와 배변 노책(직장 탈출 다발), 복통, 비틀거림, 선회, 부분 실명. 2~3일에 죽거나 수주 끌며 식욕부진, 체중 감소, 설사, 노책, 황달, 드물게 광과민 피부염. 산유량 급감.</span><span class="hang">간 기능검사(빌리루빈, 담즙산), 고암모니아혈증, 저알부민혈증. 간 생검이나 부검 조직에서 간세포 거대화, 섬유화, 담관 증식. 건초·사일리지 시료에서 식물을 찾는다. 치료법이 없다. 독초 방제(제초제, 생물학적 방제), 양을 이용한 간헐 방목으로 관리한다.</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>기타 식물 — 쇠뜨기·로코위드·루핀·양파·배추과<span class="hang">쇠뜨기(Equisetum): 고사리처럼 티아미나제를 가지며 오염 건초를 먹은 말에서 주로 티아민 결핍성 신경증상을 일으킨다. 소에 대해서는 원문에 기술이 적다.</span><span class="hang">로코위드(Astragalus·Oxytropis, swainsonine): 2~6주 방목으로 유도성 만노시드 축적증(신경세포 공포화). 떨림, 운동실조, 식욕부진, 행동 변화, 고지대에서는 울혈성 심부전 증상. 혈중 림프구 공포가 보인다. 치료는 없고 목초지에서 빼면 회복될 수 있다.</span><span class="hang">루핀: 쓴 루핀의 퀴놀리지딘 알칼로이드가 신경 증후군(침흘림, 순막 돌출, 쇠약, 기립불능, 호흡마비)을 일으키며 씨앗이 가장 독하고 말라도 남는다. 루핀 그루터기의 곰팡이독(phomopsin)은 간병증(lupinosis)을 일으킨다. 임신 40~100일 섭취로 인한 굽은 송아지병(기형)은 번식 탭에서 다룬다.</span><span class="hang">양파(Allium)와 배추과(유채·케일·순무): 이황화물·SMCO가 적혈구를 산화해 하인츠소체, 용혈성 빈혈, 혈색소뇨를 일으킨다. 소가 가장 민감하고 폐기 양파는 건물 25%까지 견딘다. 배추과는 성숙·재생기, 꽃·씨앗이 가장 독하다. 특이 치료가 없고 중증은 수혈한다. 제한 급여와 다른 사료로 희석한다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>기타 식물 — 독미나리·옥살산·비름<span class="hang">독미나리류(Cicuta, Oenanthe): 뿌리가 주 독원으로 도랑 정비나 홍수로 드러날 때 먹는다. 초기 떨림, 불안, 비틀거림 뒤 울부짖음·후궁반장·입 거품을 동반한 격렬한 간대성 경련. 경련 사이 고창, 침흘림, 이갈기, 빈맥, 고체온, 산동. 수분~수시간에 호흡부전으로 죽는다. 뿌리가 반추위보다 식도홈에 끼어 있는 경우가 많다. 실용적 치료법이 없다.</span><span class="hang">옥살산(소리쟁이·수영 Rumex, 대황 잎): 신부전, 고인산혈증·고칼륨혈증을 흔히 동반한 저칼슘혈증. 요로의 옥살산 결정, 반추위 내 식물로 진단. 대량 정맥 수액, 반추위 절개(Rebhun).</span><span class="hang">비름(Amaranthus retroflexus): 가뭄 때 잎 부분이 질산염과 옥살산의 흔한 원천이다. 피하 부종, 저단백혈증, 신부전. 대량 정맥 수액, 반추위 절개(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">77.</span><span>남조류(청녹조) 독소 — 원인과 증상<span class="hang">따뜻하고 고인 담수·기수의 조류 번성(bloom)을 마셔 생긴다. 늦여름~가을, 고수온, 얕은 수심, 햇빛, 연안으로 부는 바람, 비료 유출·분뇨로 인한 질소·인 과잉이 위험인자다.</span><span class="hang">마이크로시스틴(간독소, Microcystis·Anabaena 등): 단백질 인산가수분해효소를 억제해 간세포 괴사와 간내 출혈로 죽는다. 대부분 폐사체로 발견되거나 수시간 내 죽는다. 덜 급성이면 식욕부진, 혼미 또는 과민, 반추위 무력, 탈수, 기립불능, 황달, 광과민. 겉보기 정상이던 개체가 이후 3개월에 걸쳐 죽기도 한다.</span><span class="hang">아나톡신(신경독, Anabaena): anatoxin-a는 니코틴 수용체 작용제로 노출 15분 내 근육 떨림, 혼미, 비틀거림, 기립불능, 과민(작은 자극에 후궁반장 경련), 호흡정지. anatoxin-a(s)는 말초 아세틸콜린에스테라제 억제제로 침흘림, 눈물, 설사가 더해진다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>남조류 — 진단과 관리<span class="hang">마이크로시스틴: 간효소 상승, 고칼륨혈증, 저혈당, 저알부민혈증. 부검에서 흑갈색~청색의 커진 간(소엽 중심 괴사), 전신 점상출혈, 체강 삼출, 때로 출혈성 장염. 아나톡신은 특이 병변이 없다.</span><span class="hang">물과 소화관에 남조류가 있다는 것만으로 진단되지 않는다. 물과 동물 조직·체액에서 독소를 확인해야 한다. 독소는 2~3일이면 물에서 사라질 수 있어 빨리 채수하고, 번성 물질은 바로 보존해 동정한다. 마이크로시스틴은 ELISA, 조직은 LC/MS/MS.</span><span class="hang">특이 해독제가 없고 치료는 대개 소용없다. 활성탄과 보존 치료(Rebhun). 깨끗한 수원으로 옮기거나 번성 지점에서 먼 곳에서 취수한다. 석회·명반·석고로 조류와 인을 침전시킨다. 연못 물을 황산구리 0.2~0.4 ppm으로 처리한다는 기술(Rebhun)과, 황산구리를 규제 없이 일상적으로 쓰는 것은 더 이상 권하지 않고 죽은 조류가 독소를 내므로 처리 후 최소 5일은 음수로 쓰지 않는다는 기술(Constable)이 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>보툴리즘 — 중독 관점의 원인<span class="hang">Clostridium botulinum이 만든 신경독을 먹어 생긴다. 소·양은 주로 C·D형, 사료 부패형은 대개 B형이다. 독소는 사체, 특히 뼈에서 오래(최소 1년) 남는다. 소는 무게당 C형 독소에 생쥐보다 13배 민감하다.</span><span class="hang">사료 부패형: pH·수분·혐기 조건이 맞은 부패 사료(비 맞은 건초, 곤포 사일리지 특히 원형 곤포, 맥주박, 고수분 곡물)에서 균이 증식한다.</span><span class="hang">사체 오염형: C·D형이 많다. 건초·사일리지에 쥐·고양이·새 사체가 섞이면 독소가 주변 사료로 번진다. 고양이 사체가 든 사료로 젖소 444두 중 427두가 죽은 예가 있다. 계분·계분 사일리지를 비료나 깔짚으로 쓰거나 목초지에 쌓아 두면 D형(가끔 C형) 집단 발생이 난다. 인 결핍 방목우의 뼈 씹기도 원인이다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>보툴리즘 — 임상·진단·관리<span class="hang">접근 3~17일(빠르면 1일) 뒤 발병한다. 발열 없이 뒤에서 앞으로 진행하는 대칭성 이완성 마비, 초기의 뚜렷한 근육 떨림, 산동, 안검하수, 혀 긴장도와 혀 당김 힘 저하. 유열처럼 고개를 옆구리로 돌리고 엎드린다. 감각과 의식은 끝까지 유지되고 1~4일에 조용히 죽는다.</span><span class="hang">특이 혈액 소견이 없다. 혈청·소화관 내용물·사료의 독소(생쥐 접종), 사료·소화관의 포자로 확인하나 민감도가 낮아 양성 개체가 일부이거나 없을 수 있다. 백신 미접종군 발생, 유사 질환 배제(저칼슘혈증, 저칼륨혈증, 진드기 마비, 마비형 광견병, 유기인 중독)로 추정 진단한다. 검체: 의심 사료, 분변, 반추위·장 내용물, 이환 동거우 혈청.</span><span class="hang">항독소는 초기에 써야 하고 구하기 어렵다. 보존 치료로 수액·장관 영양, 흡인 방지. 신경근 접합부 약화를 강화하는 프로카인 페니실린, 테트라사이클린, 아미노글리코사이드와 네오스티그민은 피한다.</span><span class="hang">같은 노출을 받은 나머지 개체는 즉시 백신을 접종한다. 이미 발병한 개체에는 무효하다. 문제 사료를 다시 쓰려면 톡소이드를 2주 간격 3회 접종한 뒤 급여한다. 인·단백 결핍을 교정하고 사체를 위생적으로 처리한다. 중독우의 고기·우유는 식용하지 않는다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">81.</span><span>가스 중독 — 황화수소(분뇨 피트)<span class="hang">밀폐 축사 슬랫 아래 분뇨 저장조에서 혐기 분해로 황화수소, 암모니아, 메탄, 이산화탄소가 생긴다. 비우기 전 분뇨를 교반하면 다량이 한꺼번에 방출된다. 700 ppm 넘는 황화수소에서 소·돼지가 초급성으로 죽는다. 500~1000 ppm은 경동맥체를 자극해 빈호흡을 일으키다 호흡중추를 억제한다. 고농도는 후각을 마비시켜 썩은 달걀 냄새 경고가 사라진다.</span><span class="hang">축사 곳곳에 몸부림 흔적 없이 쓰러진 채 발견된다. 눈·호흡기 염증, 기립불능, 경련도 보인다(Rebhun). 부검: 폐부종, 근육·내장 광범위 출혈, 좌우 대칭 대뇌 부종·괴사(층상 괴사).</span><span class="hang">교반 중에는 문·창문을 활짝 열어 환기하고, 분뇨 배출 중에는 사람과 동물이 밀폐 축사에 들어가지 않는다. 폭기나 산화제, 철염 첨가로 황화수소 생성을 억제한다. 사람에게도 치명적이다.</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>가스 중독 — 일산화탄소·이산화질소·암모니아·이산화탄소<span class="hang">일산화탄소: 엔진 배기, 난방기, 축사 화재 연기. 식욕부진, 운동실조, 쇠약, 빈호흡, 호흡곤란, 사망. 혈액이 선홍색(cherry red)이고 조직이 분홍빛이다. 보존 치료와 산소 공급(Rebhun).</span><span class="hang">이산화질소(사일로 가스): 사일리지 발효 중 생기며 표백제 같은 강한 냄새와 황갈색 연무가 보인다. 호흡곤란, 메트헤모글로빈혈증(갈색 혈액), 사망. 1% 메틸렌블루 4~15 mg/kg 정맥(Rebhun).</span><span class="hang">암모니아: 100~200 ppm은 결막·호흡기 점막 자극, 500 ppm 초과는 인후두 자극과 후두경련, 2000 ppm 초과는 30분 안에 사망할 수 있다. 무수암모니아 액체 비료 유출은 돌연사, 각막 궤양, 상부 호흡기·기관지 점막 괴사를 일으킨다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">83.</span><span>항응고 살서제와 스위트클로버(쿠마린) 중독<span class="hang">비타민 K 에폭사이드 환원효소를 억제해 응고인자 II·VII·IX·X 합성을 막는다. 기존 인자가 소모될 때까지 2~4일 지연된다. 2세대(브로디파쿰·브로마디올론·디페나쿰)는 와파린보다 훨씬 강하고(브로디파쿰 약 100배) 간에 128일까지 남아 1회 섭취로 중독된다. 소는 대량 1회 섭취나 매일 노출이 아니면 잘 걸리지 않는다.</span><span class="hang">스위트클로버(Melilotus)·향기풀의 쿠마롤이 건초·사일리지에서 곰팡이에 의해 디쿠마롤로 바뀐다. 사료 디쿠마롤 약 20 mg/kg이 독성 수준이다. 10~20 mg/kg은 100일 이상 안전, 30 mg/kg은 4개월, 60~70 mg/kg은 17일 만에 발병한다.</span><span class="hang">피하·근간·장막하 출혈과 혈종(통증·염발음 없음), 경직, 파행, 한쪽 다리 심한 부종, 창백한 점막. 식욕·체온·호흡은 말기까지 정상이다. 거세·제각 후 심한 출혈, 비출혈, 혈뇨, 흑색변. 어미가 멀쩡해도 생후 수일 송아지가 머리·목 부종으로 약해진다.</span><span class="hang">PT가 출혈 전부터 늘어나 유용하다. ACT·aPTT·PIVKA도 연장되고 혈소판·FDP는 정상이다. 혈액·소변·간에서 항응고제, 사료(20~30 ppm)·간(1 ppm)에서 디쿠마롤을 확인한다. 비타민 K1 1~2 mg/kg 근육·피하(Constable), 1~1.5 mg/kg(Constable 치료표), 0.5~2.5 mg/kg 근육·피하 수회(Rebhun). 반추위에서 분해되어 경구 투여는 효과가 없다고 본다. 비타민 K3는 효과가 없다. 위급하면 신선 전혈·혈장 수혈. 의심 사료는 수술 최소 3주 전부터, 임신우는 분만 전 3주간 주지 않는다.</span></span></p><p class="bx-num"><span class="bxn">84.</span><span>제초제·기타 농약 — 요약<span class="hang">파라콰트 소 LD50 35~50 mg/kg, 디콰트 20~40 mg/kg. 소에서 디콰트는 치명적 제4위염·장염, 간·심근 변성을 일으키고, 파라콰트의 폐섬유화는 소·양의 치사량에서는 생기지 않는다.</span><span class="hang">염소산나트륨 소 치사량 0.5 g/kg. 제4위·십이지장의 검은 미란, 혈색소뇨, 빈혈, 메트헤모글로빈혈증, 매우 검은 혈액. 특이 치료가 없고 대량 수혈을 권한다. 페녹시계(2,4-D)는 살포 후 식물 기호성과 질산염을 수일간 높이고, 글리포세이트도 기호성을 높인다. 소금에 굶주린 소가 농약 원액에 접근하는 것이 주된 위험이다.</span><span class="hang">메탈데하이드 민달팽이 미끼: 침흘림, 흥분, 안진, 경련, 발열. 인화아연: 습기·위 내용물과 만나 포스핀 가스를 내며 부검 시 썩은 생선·마늘 냄새, 내용물은 밀폐 동결. 스트리키닌: 0.5~2시간 내 극심한 강직과 경련, 마취나 진정·반추위 절개. 모두 보존 치료 중심이다(Rebhun·Bovine Medicine).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">85.</span><span>약물 과량 — 이버멕틴 등 마크로사이클릭 락톤<span class="hang">안전역이 넓으나 어린 동물(혈액뇌장벽 미성숙), 체중 과소평가, 대량 과다 투여에서 중독된다. P-당단백 수송계를 넘어 중추 GABA 통로에 결합한다. 8개월령 저지 수송아지에 600 µg/kg 정맥·피하 투여 시 침울, 운동실조, 축동이 나타났고, 8 mg/kg 투여 송아지는 24시간 뒤 기립불능이 되었다.</span><span class="hang">운동실조, 넓게 벌린 자세, 떨림, 시력 장애, 산동, 고체온, 경련, 기립불능. 해독제는 없다. 장간순환을 하므로 활성탄을 반복 투여하고 떨림·경련 조절과 수액을 준다. 정맥 지질유제(20% 대두유)가 개·포니에서 쓰였으나 대동물 용량은 정해지지 않았다.</span></span></p><p class="bx-num"><span class="bxn">86.</span><span>약물 과량 — 아미노글리코사이드와 기타 의인성 중독<span class="hang">아미노글리코사이드: 신독성은 10일 넘는 장기 치료에서 흔하다. 위험인자는 고용량, 장기 투여, 기존 신기능 장애·탈수, 신독성 약물·이뇨제 병용, 높은 최저 농도, 아주 어리거나 늙은 개체, 대사성 산증·전해질 이상. 세뇨관 재생으로 대체로 가역적이다. 탈수 개체나 신질환 의심 개체에는 신독성 약물을 피한다.</span><span class="hang">리도카인: 송아지 장폐색에 정맥 투여하거나 과량 시 떨림·경련, 디아제팜과 수액으로 대개 회복. 칼륨: 신기능 저하나 설사 산증 송아지에 과량 정맥·경구 투여 시 서맥, 부정맥, 돌연사. 칼슘 정맥, 포도당·인슐린(0.1 U/kg) 투여(Rebhun).</span><span class="hang">프로필렌글리콜: 성우에 12 oz를 하루 2회 넘게 주면 식욕부진, 복부 팽만, 운동실조, 침흘림, 경련, 반추위 pH 저하. 반추위액 이식. 비타민 D3: 대량 주사(어린 송아지, 분만 전 저지)로 고칼슘·고인산혈증, 심장·대혈관 석회화, 심부전. 요오드: 하루 12 mg/두를 크게 넘는 보충·반복 투여로 기침, 비루·안루, 건조한 비듬 피모, 면역억제, 혈청·우유 요오드 20 µg/dL 이상.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">87.</span><span>셀레늄·카드뮴·납·비소 — 번식 영향 보충 · 셀레늄 만성 중독(알칼리병)<span class="hang">침울·식욕부진·체중 감소·탈모·발굽 변형·파행이다. 반추동물 독성 용량은 명확하지 않다(종간 2.2~20mg/kg 체중 이상).</span><span class="hang">사료 셀레늄 20~50mg/kg에서 소·양·말의 수태율 감소·태아 흡수 증가가 보고됐다.</span></span></p><p class="bx-num"><span class="bxn">88.</span><span>카드뮴<span class="hang">배터리·인산 비료·하수 슬러지에서 온다. 철 결핍 시 장 흡수가 늘고 Ca·Zn·Fe·Cu·Se 대사와 상호작용한다.</span><span class="hang">고농도 사료 Cd는 섭취 감소·증체 불량·빈혈·골 흡수 감소·유산을 일으킨다.</span></span></p><p class="bx-num"><span class="bxn">89.</span><span>납·비소의 번식 영향<span class="hang">납은 아급성 증상에 유산이 포함되고, 태반을 통과해 태아 CNS에 축적되며 칼슘을 모방한다. Ca-EDTA 110 mg/kg 2~3일 + 티아민 성우 250~2500 mg/일.</span><span class="hang">비소는 무기형이 태반을 통과해 태아 신경상피에 축적되며, 소 유산은 산발적이다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">90.</span><span>질산염 — 번식 영향 보충 · 태아 영향<span class="hang">모체 메트헤모글로빈은 태반을 넘지 못하지만 질산·아질산은 태반을 넘어가 태아 메트헤모글로빈혈증·무산소증을 일으키며, 혈관 확장·저혈압도 동반된다.</span><span class="hang">모체 노출 약 3~7일 이후(또는 그 뒤)에 유산·사산·허약 송아지가 나타난다. 잠재성 독소 노출은 외견상 정상인 암소에서 태아 사망을 일으켜 일상 검사로는 진단이 어렵다.</span></span></p><p class="bx-num"><span class="bxn">91.</span><span>기준·예방 보충<span class="hang">조사료 질산염 0.6~1.0%(건물 기준 6000~10 000 ppm) 초과가 번식 손실과 연관된다. 물 질산염은 440 mg/l 미만을 권장하며, 급성 독성은 보통 1300 mg/l을 넘을 때 나타난다.</span><span class="hang">안구액 시료는 사후 수 시간 내 채취해 냉장하며, 유산 부검 항목에 포함한다.</span><span class="hang">사료·물의 고질산염 노출이 불가피하면 Propionibacterium acidipropionici P5 균주(세균성 사료 첨가제)를 보충할 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">92.</span><span>솔잎 유산(이소쿠프레스산) · 노출원과 발생 양상<span class="hang">폰데로사 소나무(Pinus ponderosa, 바늘 18~28 cm·다발당 2~3개) 잎 섭취가 만삭 유산을 일으킨다. 추위·강설, 사료가 부족한 늦가을~초봄, 스트레스 시에 녹색·낙엽 바늘을 더 먹는다. 임신 후기에 솔잎을 매일 0.71~0.85 kg(건물) 급여하면 후산정체를 동반한 유산이 일어났다.</span><span class="hang">주 독성 효과는 유산·후산정체·자궁염이며 공태우·거세우·수소는 영향이 없다.</span><span class="hang">이소쿠프레스산을 함유해 소의 후기 유산과 연관된 다른 식물: 잣나무(Pinus koraiensis), 로지폴소나무, 유럽노간주, 몬터레이사이프러스, 캘리포니아노간주. 유타·서부노간주 껍질은 아가트산이 많다.</span></span></p><p class="bx-num"><span class="bxn">93.</span><span>독성 기전과 원인 물질<span class="hang">유산 유발 물질은 이소쿠프레스산이다(아세틸·숙시닐 유도체가 반추위에서 가수분해되어 전환되고, 아가트산·임브리카톨산·디하이드로아가트산도 소량 관여). 임신 후기에 체중당 100 mg/kg을 1일 2회 급여한 것이 최소 유산 용량이었다.</span><span class="hang">솔잎 급여 암소의 혈장은 태반분엽 관류압을 높여 자궁 긴장도를 올리고 태아 혈류를 줄인다. 병리에서 자궁소구(caruncle) 동맥의 심한 협착이 확인된다. 만성 혈관 수축으로 자궁 혈류가 감소한다.</span></span></p><p class="bx-num"><span class="bxn">94.</span><span>번식 영향과 임상 징후<span class="hang">주로 임신 마지막 3분기 섭취 시 후기 유산이 오지만 임신 3개월 유산도 보고됐다. 섭취 2~21일 후 조산(즉시 유산도 가능)이 오며, 2.2~2.7 kg/일을 3일 이상 급여하면 조산이 유도된다.</span><span class="hang">외음부 부종·점액성 질 분비 → 약한 진통·자궁 출혈·자궁경 불완전 개장·난산·허약 송아지·무유증·후산정체.</span></span></p><p class="bx-num"><span class="bxn">95.</span><span>섭취·유산 위험을 키우는 요인<span class="hang">고단백 사료는 솔잎 섭취를 늘린다(솔잎의 축합 탄닌이 높은 반추위 암모니아의 불쾌감을 덜어 식욕을 올리는 것으로 추정).</span><span class="hang">부실한 BCS는 솔잎을 더 먹게 한다. 고단백·저에너지 사료에서는 BCS가 낮은 암소가 일관되게 더 먹었고, 저단백·고에너지 사료에서는 처음엔 더 먹다가 BCS 간 차이가 시간이 지나며 줄었다.</span><span class="hang">보충 에너지 부족은 위험을 높인다(옥수수 사일리지로 에너지를 채우면 유산이 일어나지 않았다).</span><span class="hang">채취 후 12개월 둔 솔잎, 분쇄·풍건으로 노화시킨 솔잎, 마그네슘 보충제, 사일리지 기반 사료, 벤토나이트, 솔잎에 혼합한 완전 광물질 보충제, 소금-황 블록은 모두 유산 유발 효과를 바꾸지 못했다.</span></span></p><p class="bx-num"><span class="bxn">96.</span><span>예방·치료<span class="hang">완전한 예방법은 없다. 마지막 3분기에 소나무 접근을 차단하고, 소나무 지대에 방목하는 임신우는 적정 BCS를 유지해 섭취를 줄이며, 충분한 사료·쉼터로 스트레스를 최소화하고 에너지 균형 + 보수적 단백 급여를 한다. 분만을 늦봄이나 가을로 옮기는 것도 방법이다.</span><span class="hang">특이 치료는 없다. 유산우는 항생제·자궁 주입 등 보조 치료, 조산 송아지는 초유·우유 보충이 필요하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">97.</span><span>페스큐 중독 — 번식 영향과 관리 · 번식 영향 — 암소<span class="hang">임신율·분만율 저하, 성장률 저하, 사춘기 개시 지연, 황체 기능 손상이 보고된다. 발정 주기 불규칙·호르몬 분비 억제·무유증을 유발한다.</span><span class="hang">프로락틴 저하(반추동물은 분만 시 태반 락토겐이 보상하지만 섭취 감소와 겹쳐 유량이 떨어진다), LH·프로스타글란딘 저하, 프로게스테론 저하로 초기 임신 유지가 어렵다.</span><span class="hang">조사료 섭취 감소가 특징이라 영양 저하와 번식 실패가 혼동되지만, 섭취 감소와 무관하게 알칼로이드 자체가 혈관 수축을 늘려 사지·말단과 자궁·난소 혈류를 줄인다.</span></span></p><p class="bx-num"><span class="bxn">98.</span><span>번식 영향 — 수소<span class="hang">내생균 감염(K31) 톨 페스큐를 방목한 수소는 정상 정자세포 수가 약 20% 감소해 번식 건전성 검사 불합격이 늘었다. 음낭둘레 감소·음낭 온도 상승이 더 우려되며, 에르고타민과 배양한 정자는 생존성이 떨어졌다.</span><span class="hang">극단적 환경 온도와 페스큐 방목에 따른 열 보유가 겹치면 수소 집단 전체의 정액 질·성욕이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">99.</span><span>관리 전략<span class="hang">종자머리 깎기, 사이갈이로 목초지 다양화, 무해 내생균·저알칼로이드 품종으로 전환, 오염 목초지 제거.</span><span class="hang">곡물·비페스큐 조사료로 전략적 희석, 분만·교배 시기를 알칼로이드 정점 회피로 조정. 단일 회피·희석 전략 하나로는 해결이 어려워 다면적 접근이 필요하다.</span><span class="hang">돔페리돈(D2 길항제)이 후보우에서 체중 감소 역전·프로게스테론 증가를 실험적으로 보여 임상 가치가 있을 수 있다. 페스큐 중독용 사료 첨가제는 많이 시험됐으나 자료 상당수가 독점 정보라 객관적 평가가 어렵다.</span><span class="hang">도파민 D2 수용체 유전자 SNP가 페스큐 방목우의 혈청 프로락틴과 연관돼 유전적 민감성 식별 가능성이 제기됐으나 검증되지 않았다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">100.</span><span>곰팡이독·디쿠마롤·수질 — 번식 영향 보충 · 아플라톡신의 번식 영향<span class="hang">배아 손실·태아 사망·기형이 가능하며, 소 유산은 드물지만 산발적 집단 발생이 있다. 효과는 난자·배아에 대한 직접 작용이 아니라 모체 항상성 변화로 본다. 수컷은 정자 생산 감소로 임성이 떨어진다.</span><span class="hang">태아 간 지방이영양증은 아플라톡신·피롤리지딘 알칼로이드 노출(셀레늄 결핍과 함께)과 관련될 수 있다.</span></span></p><p class="bx-num"><span class="bxn">101.</span><span>제아랄레논의 번식 영향<span class="hang">임성 저하·발정주기 이상·외음부 종창·질염·유량 감소·유선 비대를 일으킨다. 후보우가 성우보다 민감하다. 임신우에서는 배·태아 이상·태아 사망·유산·난산이 가능하다.</span><span class="hang">오염 사료 제거 후 3~7주에 징후가 사라진다.</span></span></p><p class="bx-num"><span class="bxn">102.</span><span>진균성 유산 예방<span class="hang">곰팡이 핀 건초·사료와 저질 사일리지를 피하고, 어둡고 습한 유기물 환경을 제거하고 환기한다. 천연 제올라이트는 곰팡이독소 결합제로 쓰인다.</span></span></p><p class="bx-num"><span class="bxn">103.</span><span>디쿠마롤 보충<span class="hang">태반을 통과해 태아 출혈과 산발적 유산을 일으킨다.</span><span class="hang">PCV 12% 미만이면 전혈 2~4 l/450 kg 수혈한다.</span><span class="hang">다른 쿠마린 함유 식물: 향기풀(Anthoxanthum odoratum), Lespedeza stipulacea, 미나리과.</span></span></p><p class="bx-num"><span class="bxn">104.</span><span>고인 물<span class="hang">독성 조류 번성이 남아 있을 수 있는 고인 물이 많은 구역은 방목하지 않는다. 임신 후보우·임신우는 가장 깨끗한 물에 접근시키고 자연 하천·연못은 피한다(렙토스피라 소변 오염).</span></span></p></div>
</div>
`;
}
function med_fluidHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 수액·항생제</div>
<div class="rb-boxes">
<div class="bx"><p class="bx-num"><span class="bxn">1.</span><span>임상검사 체계 — 구성과 원칙<span class="hang">임상검사는 의미 있는 병력 청취, 환경 관찰을 포함한 철저한 신체검사, 필요할 때 보조검사 선택의 세 부분으로 이루어진다(Rebhun). 목표는 관련 장기계를 찾고 감별진단 목록을 세워 가능하면 확진에 이르는 것이다.</span><span class="hang">패턴 인식은 경험이 쌓일수록 중요해지지만 철저한 검사를 대신하면 진단 정확도가 떨어진다. 두 질병이 겹치면 증상이 더해지거나 서로 상쇄된다(예: 저칼슘혈증의 저체온과 대장균 유방염의 발열이 겹쳐 체온이 정상으로 나옴).</span><span class="hang">원거리 관찰 뒤 소를 만지기 전에 활력징후를 먼저 잰다. 보정·구강 검사 같은 조작이 심박·호흡을 바꾸기 때문이다. 가능하면 서 있는 상태에서 조용히 검사한다(Constable).</span></span></p><p class="bx-num"><span class="bxn">2.</span><span>근접 신체검사의 일반 순서(Constable)<span class="hang">활력징후(체온·심박·맥박·호흡·탈수 정도) → 흉부(심음의 수·리듬·강도, 폐음) → 복부 → 두경부(눈·구강·안면·경정맥) → 직장검사 → 비뇨기 → 생식기 → 유방 → 근골격 → 신경계 → 피부(귀·발굽·뿔).</span><span class="hang">활력징후 이후 순서는 응급도와 검사 편의에 따라 바꾼다. 예를 들어 분만 직후 심급성 유방염 젖소는 체온·심박·호흡·폐·반추위를 본 뒤 바로 유방을 자세히 본다.</span></span></p><p class="bx-num"><span class="bxn">3.</span><span>소 신체검사의 실제 동선 — 후방에서 시작<span class="hang">착유·수정에 익숙한 젖소는 뒤쪽에서 시작하면 덜 흥분한다. 머리·앞쪽부터 다가가면 심박·호흡이 올라간다(Rebhun).</span><span class="hang">후방: 직장 체온계를 2분 꽂아 두는 동안 미근동맥(꼬리 기부에서 15~30 cm)으로 맥박을 세고 흉벽 움직임으로 호흡수를 센다. 같은 시간에 뒤쪽 유방과 유방상림프절을 만지고 외음부 점막(빈혈·황달·충혈)과 분비물, 냄새, 분변 상태, 좌우 늑골궁의 비대칭을 본다.</span><span class="hang">좌측: 심장(폐동맥판 3늑간, 대동맥판 4늑간, 승모판 5늑간)과 폐 청진 → 좌측 핑 → 좌겸부에서 최소 1분 반추위 청진·촉진 → 기갑 꼬집기·그런트 시험 → 유방(Blackwell 단계 1~7).</span><span class="hang">우측: 우측 경정맥 충만, 삼첨판(3늑간, 주관절과 견관절 중간), 폐, 우측 핑, 우측복부 밸로트먼트(임신 7개월 이상 태아, 종괴) → 직장검사 → 두부는 소가 가장 싫어하므로 마지막에 본다(단계 8~12).</span></span></p><p class="bx-num"><span class="bxn">4.</span><span>신체검사 기법 요점<span class="hang">촉진 소견 용어: 반죽상(doughy, 눌러 자국이 남음, 부종), 단단함(정상 간 정도), 경(뼈 같음), 파동성, 긴장성(가스·액체로 팽만한 장기), 기종성(염발음).</span><span class="hang">타진음: 공명음(정상 폐), 고음(압력 받는 가스, 고창), 탁음(심장·간 같은 실질). 흉부 탁음 증가는 경화·흉수·종괴, 공명 증가는 기종·기흉을 시사한다.</span><span class="hang">타진·청진 병용(핑): 좌측 핑은 좌방전위(LDA)·반추위 가스·기복증, 우측 핑은 맹장·나선결장·소장·십이지장·자궁(분만 후)·직장·우방전위/염전에서 난다. 우방전위·염전 핑은 대개 8늑골보다 앞쪽이다(Blackwell).</span><span class="hang">밸로트먼트·청진으로 들리는 출렁임 소리: 좌측이면 곡류과식·반추위 액체 과다·LDA, 우측이면 장폐색·제4위 염전·맹장 확장·마비성 장폐색을 시사한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">5.</span><span>정상 생리값 — 체온<table class="bxt"><tr><th>구분</th><th class="c">정상</th><th>출처·비고</th></tr><tr><td>성우</td><td class="c">평균 38.5℃, 임계점 39.5℃</td><td>Constable</td></tr><tr><td>젖소 성우</td><td class="c">38.0~39.17℃</td><td>Rebhun. 39.2~39.5℃는 만성 복막염 입원우에서 흔히 보여 정상으로 보지 않는다</td></tr><tr><td>성우</td><td class="c">38.5℃ (38.0~39.0)</td><td>Blackwell</td></tr><tr><td>송아지</td><td class="c">39.0℃ (38.5~39.5)</td><td>Blackwell</td></tr><tr><td>1세 이하 / 1세 이상</td><td class="c">38.5~40.5℃ / 37.5~38.5℃</td><td>한우송아지질병관리핸드북</td></tr></table><span class="hang">생리적 변동: 하루 중 최대 1℃(아침 최저, 늦은 오후 최고), 임신 말기 약 0.6℃ 상승, 분만 직전과 발정 직전·배란 때 약 0.3℃ 하강. 고온다습하면 최대 1.6℃, 심한 운동 뒤 2.5~3℃ 오른다. 추위에 적응한 소를 따뜻한 실내로 들이면 2~4시간 안에 임계점을 넘을 수 있다.</span><span class="hang">체온계는 2분 둔다. 배변 직후, 분변 덩어리에 꽂힘, 짧은 측정, 직장 내 공기(pneumorectum)는 거짓 저체온을 만든다. 직장이 불가능하면 질에서 잰다.</span><span class="hang">발열 원인을 못 찾고 환경이 덥다면 같은 우리 소들의 체온을 함께 재 본다. 외상성 제2위복막염 확진우의 최소 50%는 체온이 정상이다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">6.</span><span>정상 생리값 — 심박·맥박<table class="bxt"><tr><th>구분</th><th class="c">성우(회/분)</th><th class="c">송아지(회/분)</th><th>출처</th></tr><tr><td>Constable</td><td class="c">60~80</td><td class="c">100~120 (어린 송아지)</td><td>안정시 맥박</td></tr><tr><td>Rebhun</td><td class="c">60~84</td><td class="c">72~100</td><td>대형우는 60 가까이, 저지종은 상한 쪽</td></tr><tr><td>Blackwell</td><td class="c">60~80</td><td class="c">80~120</td><td>서맥 기준 60 미만</td></tr></table><span class="hang">맥박은 미근동맥(중미동맥)이나 안면동맥에서 최소 30초 센다. 맥박결손이 있으면 맥박수와 심박수가 다르다.</span><span class="hang">빈맥: 패혈증·독혈증·순환부전·통증·흥분. 사지 근골격 통증이면 누웠을 때와 섰을 때 맥박 차이가 크다.</span><span class="hang">서맥은 소에서 드물다. 뇌하수체 농양, 미주신경성 소화불량, 보툴리눔중독, 외상성 제2위복막염 후 횡격막 유착, 반추위가 평소보다 많이 빈 경우, 저혈당·고칼륨혈증 송아지에서 본다. 정상 소도 몇 시간 절식·절수하면 서맥이 흔하다(급수컵 고장 등).</span></span></p><p class="bx-num"><span class="bxn">7.</span><span>정상 생리값 — 호흡수<table class="bxt"><tr><th>출처</th><th class="c">성우(회/분)</th><th class="c">송아지(회/분)</th></tr><tr><td>Constable</td><td class="c">10~30</td><td class="c">-</td></tr><tr><td>Rebhun</td><td class="c">18~28 (Gibbons), 15~35 (Rosenberger)</td><td class="c">20~40</td></tr><tr><td>Blackwell</td><td class="c">15~35</td><td class="c">20~40</td></tr></table><span class="hang">비만우는 정상의 2~3배까지 높을 수 있고, 기온·습도가 크게 오르면 2배가 된다. 추위에 적응한 소를 실내로 들이면 2시간 안에 6~8배까지 오르고 개구호흡을 한다.</span><span class="hang">정상 호흡 주기는 흡기·호기·휴지의 세 상이 같은 길이다. 대사성 산증은 깊이와 수를 모두 늘리고, 심한 대사성 알칼리증과 흉부·횡격막·전복부 통증은 깊이를 줄인다. 흉식 호흡은 복막염·복부팽만, 복식 호흡은 흉막염·섬유소성 기관지폐렴·폐기종·폐수종에서 본다.</span></span></p><p class="bx-num"><span class="bxn">8.</span><span>정상 생리값 — 반추운동<span class="hang">1차 수축(제2위와 반추위 배낭·복낭)은 분당 1~2회이며 급여 후 경과 시간과 사료 종류에 따라 달라진다. 2차 수축은 분당 약 1회로 트림과 연관된다(Constable). Blackwell은 정상 반추 수축을 분당 1~3회로 쓴다.</span><span class="hang">좌겸부에서 청진하며 정상 순서는 액체가 꾸르륵하는 소리와 함께 겸부가 한 번 들리고, 이어 더 크게 들리면서 가스성 굉음이 난다. 좌측 하부 늑골 위에서는 그 직전 제2위 수축의 약한 액체음이 들린다.</span><span class="hang">운동 저하는 내독소혈증·복막염·저칼슘혈증 등에 의한 정체, 운동 항진은 미주신경성 소화불량과 반추위 팽만을 시사한다(Rebhun).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">9.</span><span>혈액검사 — 전혈구검사(CBC) 정상치<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>적혈구 (×10¹²/L)</td><td class="c">5.1~7.6</td><td class="c">5~10</td></tr><tr><td>혈색소 (g/L)</td><td class="c">85~122</td><td class="c">80~150</td></tr><tr><td>PCV (L/L)</td><td class="c">0.22~0.33</td><td class="c">0.24~0.46</td></tr><tr><td>MCV (fL)</td><td class="c">38~50</td><td class="c">40~60</td></tr><tr><td>MCH (pg)</td><td class="c">14~18</td><td class="c">11~17</td></tr><tr><td>MCHC (g/L)</td><td class="c">360~390</td><td class="c">300~360</td></tr><tr><td>혈소판 (×10⁹/L)</td><td class="c">200~650</td><td class="c">150~650</td></tr><tr><td>백혈구 (×10⁹/L)</td><td class="c">4.9~12.0</td><td class="c">4~12</td></tr><tr><td>호중구(성숙) (×10⁹/L)</td><td class="c">1.8~6.3</td><td class="c">0.6~4.0</td></tr><tr><td>간상호중구</td><td class="c">드묾</td><td class="c">&lt;0.2</td></tr><tr><td>림프구 (×10⁹/L)</td><td class="c">1.6~5.6</td><td class="c">2.5~7.5</td></tr><tr><td>단핵구 (×10⁹/L)</td><td class="c">0~0.8</td><td class="c">&lt;0.9</td></tr><tr><td>호산구 (×10⁹/L)</td><td class="c">0~0.9</td><td class="c">&lt;0.8</td></tr><tr><td>피브리노겐 (g/L)</td><td class="c">2~7</td><td class="c">3~7</td></tr><tr><td>망상적혈구</td><td class="c">-</td><td class="c">0</td></tr></table><span class="hang">참고범위는 나이·품종·성별·사료·지역·채혈과 측정법에 따라 달라지며, 대개 건강우 60~120두에서 위아래 2.5%를 버려 정한다. 따라서 검사실 자체 참고범위를 우선한다(Bovine Medicine).</span><span class="hang">Constable 부록 수치는 성우 기준이며 신생 송아지 참고치는 별도 표를 쓰라고 되어 있다.</span></span></p><p class="bx-num"><span class="bxn">10.</span><span>CBC 해석 요점 — 백혈구<span class="hang">건강한 성우는 호중구:림프구가 약 1:2이고, 6개월 미만은 호중구가 우세하며 총 백혈구도 높을 수 있다.</span><span class="hang">소 골수는 수출 가능한 성숙 호중구 저장분이 작아 급성 염증 초기에는 오히려 호중구감소가 흔하다. 내독소혈증도 호중구를 변연 풀로 옮겨 호중구감소를 만든다. 24~48시간 안에 간상호중구가 나타나고 독성 변화(세포질 공포·과립·핵 분절)가 보인다.</span><span class="hang">호중구증가 등급(소): 경도 &lt;8, 중등도 8~15, 고도 &gt;15 ×10⁹/L. 말(&lt;15, 15~25, &gt;25)이나 개보다 반응 폭이 작다.</span><span class="hang">스트레스 백혈구상: 좌방이동·독성 변화 없는 성숙 호중구증가, 림프구감소, 호산구감소. 총 백혈구는 참고범위 안일 수 있다. 흥분(에피네프린)은 경도 호중구증가와 경도~중등도 림프구증가를 만든다(어린 개체).</span><span class="hang">지속성 림프구증가는 소백혈병바이러스 감염에서 흔하다. 호산구증가는 알레르기·기생충에서도 일관되지 않다.</span></span></p><p class="bx-num"><span class="bxn">11.</span><span>CBC 해석 요점 — 적혈구·단백·피브리노겐<span class="hang">빈혈은 재생성(실혈·용혈, 미성숙 적혈구 출현)과 비재생성으로 나눈다. 재생 반응이 혈액에 나타나는 데 2~4일 걸리므로 사건 후 3일 이내는 전재생성으로 본다. 건강한 소는 혈중에 다염성·망상적혈구가 없다. 가장 흔한 비재생성 빈혈은 염증성 질환 빈혈이다.</span><span class="hang">소 적혈구 수명은 평균 150일이다. 탈수는 PCV와 총단백을 함께 올리며(혈액농축), 탈수가 알부민 증가의 유일한 원인이다.</span><span class="hang">피브리노겐은 총·감별 백혈구보다 믿을 만한 염증 지표지만 염증 후 36~48시간 지나야 오른다(10~15 g/L까지). 급성기에는 합토글로빈·혈청아밀로이드A가 더 민감하다.</span><span class="hang">총단백:피브리노겐 비가 10:1 미만이면 탈수가 아닌 절대적 피브리노겐 증가, 즉 염증을 시사한다. 다만 염증 때 글로불린도 같이 올라 비의 유용성이 떨어질 수 있다.</span></span></p><p class="bx-num"><span class="bxn">12.</span><span>혈청화학 정상치 — 전해질·산염기·무기질<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>Na (mmol/L)</td><td class="c">132~152</td><td class="c">132~152</td></tr><tr><td>K (mmol/L)</td><td class="c">3.9~5.8</td><td class="c">3.9~5.8</td></tr><tr><td>Cl (mmol/L)</td><td class="c">95~110</td><td class="c">95~110</td></tr><tr><td>HCO₃ (mmol/L)</td><td class="c">20~30</td><td class="c">20~30</td></tr><tr><td>총 CO₂ (mmol/L)</td><td class="c">20~30</td><td class="c">-</td></tr><tr><td>음이온차 (mmol/L)</td><td class="c">14~26</td><td class="c">14~26</td></tr><tr><td>정맥 pH</td><td class="c">7.35~7.50</td><td class="c">-</td></tr><tr><td>정맥 PCO₂ (mmHg)</td><td class="c">34~45</td><td class="c">-</td></tr><tr><td>삼투질농도 (mOsm/kg)</td><td class="c">270~306</td><td class="c">-</td></tr><tr><td>총 Ca (mmol/L)</td><td class="c">2.43~3.10 (9.7~12.4 mg/dL)</td><td class="c">2.0~3.0</td></tr><tr><td>이온화 Ca (mmol/L)</td><td class="c">1.0~1.3</td><td class="c">-</td></tr><tr><td>무기인 (mmol/L)</td><td class="c">1.8~2.1 (5.6~6.5 mg/dL)</td><td class="c">1.29~2.26</td></tr><tr><td>Mg (mmol/L)</td><td class="c">0.74~1.10 (1.8~2.3 mg/dL)</td><td class="c">0.6~1.1</td></tr><tr><td>철 (µmol/L)</td><td class="c">10~29</td><td class="c">-</td></tr></table><span class="hang">Constable 본문은 대동물 혈장 HCO₃ 정상을 24~30 mmol/L, 대동물 혈액 pH를 7.35~7.45, 대동물 염기과잉 정상을 0~6 mEq/L로 쓴다. 음이온차 95% 범위는 소 14~20 mEq/L로 본문에 따로 나온다.</span></span></p><p class="bx-num"><span class="bxn">13.</span><span>혈청화학 정상치 — 신장·간·효소·대사물·단백<table class="bxt"><tr><th>항목</th><th class="c">Constable 부록</th><th class="c">Bovine Medicine</th></tr><tr><td>요소질소 (mmol/L)</td><td class="c">2.0~9.6 (6~27 mg/dL)</td><td class="c">요소 2.1~9.6</td></tr><tr><td>크레아티닌 (µmol/L)</td><td class="c">88~175 (1.0~2.0 mg/dL)</td><td class="c">90~120</td></tr><tr><td>총빌리루빈 (µmol/L)</td><td class="c">0.17~8.55</td><td class="c">2~18</td></tr><tr><td>담즙산 (µmol/L)</td><td class="c">&lt;120</td><td class="c">-</td></tr><tr><td>콜레스테롤 (mmol/L)</td><td class="c">1.7~5.6</td><td class="c">-</td></tr><tr><td>포도당 (mmol/L)</td><td class="c">2.5~4.2 (45~75 mg/dL)</td><td class="c">-</td></tr><tr><td>BHB (mmol/L)</td><td class="c">-</td><td class="c">&lt;1.0</td></tr><tr><td>젖산 (mmol/L)</td><td class="c">0.6~2.2</td><td class="c">-</td></tr><tr><td>ALT (U/L)</td><td class="c">11~40</td><td class="c">-</td></tr><tr><td>ALP (U/L)</td><td class="c">0~200</td><td class="c">-</td></tr><tr><td>AST (U/L)</td><td class="c">78~132</td><td class="c">60~150</td></tr><tr><td>CK (U/L)</td><td class="c">35~280</td><td class="c">50~400</td></tr><tr><td>GGT (U/L)</td><td class="c">6.1~17.4</td><td class="c">&lt;36</td></tr><tr><td>SDH (U/L)</td><td class="c">4.3~15.3</td><td class="c">-</td></tr><tr><td>GLDH (U/L)</td><td class="c">-</td><td class="c">&lt;20</td></tr><tr><td>LDH (U/L)</td><td class="c">692~1445</td><td class="c">-</td></tr><tr><td>총단백 (g/L)</td><td class="c">57~81</td><td class="c">58~80 (혈장 굴절계 60~80)</td></tr><tr><td>알부민 (g/L)</td><td class="c">21~36</td><td class="c">22~36</td></tr><tr><td>글로불린 (g/L)</td><td class="c">-</td><td class="c">24~40</td></tr></table><span class="hang">Bovine Medicine은 혈액 요소질소 = 요소 × 2.14로 환산하라고 한다. 빌리루빈이 45 µmol/L를 넘으면 조직이 눈에 띄게 노래진다.</span></span></p><p class="bx-num"><span class="bxn">14.</span><span>혈청화학 해석 요점<span class="hang">반추동물은 요소를 침과 소화관으로 재분비하므로 요소는 사구체여과율(GFR) 지표로 믿기 어렵고 단백 이화 지표로 쓴다. 크레아티닌은 GFR을 잘 반영하나 근육량에 비례해 육우 수소에서 젖소보다 훨씬 높다. 탈수 시 요비중 1.025 초과면 신기능은 유지된 신전성 고질소혈증이다.</span><span class="hang">효소 상승 등급(참고범위 상한의 배수, Bovine Medicine): CK 경도 &lt;5배, 중등도 &lt;10배, 고도 &gt;50배, 극심 &gt;100배. AST 각각 &lt;2, &lt;3, &gt;5, &gt;8배. GLDH·GGT·빌리루빈·크레아티닌도 비슷한 배수 기준을 쓴다.</span><span class="hang">CK는 반감기가 짧고 AST는 길어 둘의 상승·하강 양상으로 기립불능우 근괴사의 지속 여부를 판단한다. 용혈이 없고 CK 정상인데 AST와 GLDH가 오르면 간세포 괴사다.</span><span class="hang">Ca 저하 등급: 경도 &lt;2, 중등도 &lt;1.5, 고도 &lt;1, 극심 &lt;0.5 mmol/L. 임상형 저칼슘혈증은 대개 1.5 미만이다. BHB는 건유기 &lt;0.6, 분만 후 아임상 케토시스 &gt;1.4, 케토시스 &gt;3.0 mmol/L.</span><span class="hang">Cl 저하는 전위장 정체에서 흔하다. LDA는 경도, RDA는 중등도~고도(&lt;70 mmol/L)이며 역설적 산성뇨를 동반한 대사성 알칼리증이 된다. K 저하는 식욕부진과 대사성 산증(송아지 설사)에서 본다.</span><span class="hang">혈청 GGT는 초유에 많아 생후 3일 이내 송아지의 수동면역 이행 평가에 쓴다(1일령 196, 2일령 136, 3일령 112 U/L 미만이면 IgG1 10 g/L 미만 가능성).</span></span></p><p class="bx-num"><span class="bxn">15.</span><span>채혈과 시료 취급<span class="hang">성우는 미정맥(중미정맥)이나 경정맥에서 채혈한다. 미정맥은 꼬리 기부에서 10~20 cm, 복측 정중선에 18~20G 2.5~3.75 cm 바늘로 뼈에 닿을 때까지 찔러 흡인한다. 어린 송아지는 미정맥 채혈을 하지 않는다. 유정맥은 혈전·정맥염·심내막염 위험 때문에 채혈·투약에 쓰지 않는다(Rebhun).</span><span class="hang">CBC는 EDTA관에 받아 즉시 잘 섞고 그 자리에서 무염색 도말을 만든다(4℃ 운반). 피브리노겐은 혈장(EDTA·헤파린), 응고검사는 구연산관, 대부분 생화학은 혈청, 정확한 포도당은 불화나트륨관을 쓴다. 혈청은 응고 후 약 30분에 분리해 4℃에서 24~48시간 보존한다.</span><span class="hang">혈액가스: 나트륨헤파린으로 코팅한 3 mL 폴리프로필렌 주사기로 경정맥혈을 혐기적으로 받고 기포를 빼 마개를 한 뒤 정맥혈은 얼음물(0℃)에 두고 30분 안에 분석한다. 동맥혈은 체온이나 실온에 둔다. 부분 진공 채혈관은 혈액가스에 절대 쓰지 않는다. 호흡기 질환이 없으면 경정맥혈로 동맥 pH·PCO₂·HCO₃·염기과잉을 예측할 수 있다.</span><span class="hang">총 CO₂를 생화학 분석기로 잴 때는 채혈관을 끝까지 채우고 4~10 mL 관을 쓴다. 덜 채우면 CO₂가 빠져 낮게 나온다.</span><span class="hang">사람용 휴대 혈당계는 적혈구 내 포도당을 혈장과 같다고 가정해 소에 맞지 않으므로 종 특이 보정이 된 기기를 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">16.</span><span>탈수 — 원인과 기전<span class="hang">원인은 수분 섭취 부족(물 결핍, 독혈증으로 갈증 소실, 식도폐색)과 과다 손실이다. 가장 흔한 원인은 설사이며, 곡류과식, 급성 장폐색, 미만성 복막염, 제4위 확장·염전에서도 심하다. 대부분의 탈수에서 보정해야 할 핵심 손실은 물보다 전해질이다.</span><span class="hang">처음에는 세포내·간질액에서 물이 빠져 혈액량을 지키므로 피부 탄력 저하, 피부·점막 건조, 안와 뒤 지방 감소에 의한 안구함몰이 먼저 온다. 계속되면 순환혈액량 감소와 혈액농축, 말초순환부전, 신혈류 감소로 인한 요량 감소와 혈중요소질소의 중등도 상승, 혐기 대사에 의한 대사성 산증이 온다.</span><span class="hang">물·전해질 섭취만 못 하는 경우(식도폐색 등)는 신장이 잘 보상해 탈수가 가볍고, 분변은 적고 단단하며 반추위 내용물도 건조하다. 심급성·급성 손실은 혈관 내에서 주로 빠져 임상적으로 드러나지 않을 수 있다.</span></span></p><p class="bx-num"><span class="bxn">17.</span><span>송아지 탈수 평가 — 안구함몰과 피부 텐트<span class="hang">송아지 탈수의 가장 좋은 지표는 안구가 안와로 들어간 정도다. 아래 눈꺼풀을 정상 위치로 살짝 뒤집어 함몰 거리를 mm로 재고 1.7을 곱하면 정상 체중 대비 탈수 %가 된다. 8 mm 함몰은 약 14% 탈수다(Constable).</span><span class="hang">탈수 8% 이상, 즉 안구함몰 4 mm 이상이면 정맥 수액이 권장된다. 안구함몰 4 mm 이상이거나 서지 못하는 송아지는 경구 전해질액에 더해 정맥 수액(소량 고장식염수, 소량 중탄산나트륨, 또는 대량 등장 정질액)을 준다.</span><span class="hang">두 번째 지표는 목과 외측 흉벽 피부 탄력이다. 피부를 꼬집어 90° 돌린 뒤 놓아 주름이 사라지는 시간을 재며 정상은 2초 미만이다. 위·아래 눈꺼풀 피부 텐트는 송아지에서 부정확해 권하지 않는다. 점막 습윤도는 젖소 송아지에서는 민감하나 고온 환경 브라만 교잡 송아지에서는 유용하지 않았다.</span><span class="hang">설사 송아지의 침울 정도는 탈수, 저체온, 대사성 산증 정도와 연관된다.</span></span></p><p class="bx-num"><span class="bxn">18.</span><span>송아지 탈수·산증 평가표 (Large Animal IM)<table class="bxt"><tr><th>임상 소견</th><th>태도</th><th class="c">피부 텐트(초)</th><th class="c">안구함몰(mm)</th><th class="c">탈수(%)</th><th class="c">추정 염기결손(mmol/L)</th></tr><tr><td>증상 미미, 흡입반사 있음</td><td>정상</td><td class="c">&lt;1</td><td class="c">없음</td><td class="c">5</td><td class="c">5</td></tr><tr><td>-</td><td>약간 침울</td><td class="c">1~2</td><td class="c">2~4</td><td class="c">6~8 (경도)</td><td class="c">10</td></tr><tr><td>흡입 감소, 사지 말단 차가움</td><td>침울</td><td class="c">2~5</td><td class="c">4~6</td><td class="c">8~10 (중등도)</td><td class="c">15</td></tr><tr><td>흡입반사 매우 약하거나 없음, 입·사지 차가움</td><td>혼수</td><td class="c">5~10</td><td class="c">6~8</td><td class="c">10~12 (고도)</td><td class="c">20</td></tr><tr><td>흡입반사 없음, 저체온</td><td>혼수/폐사</td><td class="c">&gt;10</td><td class="c">8~12</td><td class="c">&gt;12</td><td class="c">&gt;20</td></tr></table><span class="hang">같은 책의 다른 표(신생 송아지)는 기준이 다르다: 0% 함몰 없음·텐트 &lt;1초·점막 촉촉, 1~5% 없음~약간·1~4초·촉촉, 6~8% 안구와 안와 약간 분리·5~10초·끈적, 9~10% 0.5 cm 미만 틈·11~15초·끈적~건조, 11~12% 0.5~1 cm 틈·16~45초·건조.</span><span class="hang">국내 지침(한우송아지질병관리핸드북, 체중 50 kg 기준): 4~6% 가벼움(안구함몰 거의 없음) 경구, 6~8% 중간(피부 2~4초) 경구, 8~10% 심함(기립곤란·체온하강, 6~10초) 경구·정맥, 10~12% 쇼크(기립불능·혼수, 20~45초) 정맥. 수액량 = 유지량(체중 3%) + 탈수량 × 1/3~1/2(WHO 기준)이라고 쓴다.</span></span></p><p class="bx-num"><span class="bxn">19.</span><span>성우 탈수 평가표 (Large Animal IM, Smith 인용)<table class="bxt"><tr><th class="c">탈수(%)</th><th>안구함몰</th><th>윗눈꺼풀 피부 텐트</th><th>점막</th></tr><tr><td class="c">경도 6~7</td><td>약간</td><td>약간 지연(2~3초)</td><td>촉촉</td></tr><tr><td class="c">중등도 8~9</td><td>뚜렷이 함몰</td><td>뚜렷이 지연(3~6초)</td><td>끈적</td></tr><tr><td class="c">고도 10~12</td><td>안와로 심하게 함몰</td><td>계속 텐트 유지</td><td>건조</td></tr></table><span class="hang">성우의 최적 평가법은 확립되지 않았으나 안구함몰과 목 부위 피부 텐트 시간이 가장 정확하고 민감할 것으로 본다(Constable). 위 표는 윗눈꺼풀 피부를, Constable은 목 피부를 권한다는 점이 다르다.</span><span class="hang">차고 축축한 피부가 30초 넘게 텐트로 남으면 고도 탈수다. 구강점막 청색증과 모세혈관재충만시간 4초 초과는 예후 불량, 점점 심해지는 빈맥은 악화를 뜻한다. 정상 직장체온은 좋은 예후 지표가 아니지만 저체온은 악화를 시사한다.</span><span class="hang">탈수 동물은 빠르게 체중이 줄고 근육 약화·식욕부진이 흔하다. 젖소의 물 섭취를 4일간 제한하면 유량 75%, 체중 14%가 줄고, 10% 제한만으로도 유량이 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">20.</span><span>탈수의 검사실 지표<span class="hang">PCV 30~40% 정상, 40~50% 수액이 필요할 수도 아닐 수도, 50~60% 회복에 수액 필요, 60% 초과는 집중 수액이 필요하고 예후 불량. 총단백 6.0~7.5 g/dL 정상, 8~10 g/dL 수액 필요하나 예후 양호, 10 g/dL 초과 예후 불량(Constable). 빈혈·저단백혈증 동물과 신생자(PCV 변동, 초유 이행 차이)는 수치가 오도할 수 있다.</span><span class="hang">삼투질농도로 본 분류(건강 대동물 약 285 mOsm/kg): 고장성 탈수 &gt;300(물 결핍, 일부 위장 질환), 저장성 탈수 &lt;270(급성 분비성 설사, 살모넬라증), 등장성 탈수(전해질 정상). 저장성 탈수는 수분 손실에 비해 임상 탈수가 가장 뚜렷하다.</span><span class="hang">요소·크레아티닌은 탈수 정도를 반영하며 신전성 고질소혈증은 수액 후 떨어진다. 체중을 매일 같은 시각(아침 급여 전)에 재고 PCV와 굴절계 총단백을 같이 보면 세포외액 변화를 싸게 추적할 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">21.</span><span>수액요법 — 원칙과 목표<span class="hang">가장 중요한 원칙은 탈수와 전해질 손실을 예방하는 것(충분한 물, 급수 공간, 소금·광물질 상시 공급)이고, 다음은 손실이 진행 중인 질병에서 가능한 한 빨리 보충하는 것이다.</span><span class="hang">동시에 있을 수 있는 이상은 체액량 결손(자유수), 혈장 삼투질 결손, 특정 전해질 불균형, 산염기 불균형, 교질삼투압 불균형의 다섯 가지다. 이상 교정에 4~6시간, 유지요법은 질병에 따라 2~4일 걸린다.</span><span class="hang">순환혈액량 감소와 산염기 불균형을 먼저 정맥으로 교정한다. 순환혈액량이 회복되면 신기능이 돌아와 산염기·전해질 교정을 돕는다. 순환혈액량이 줄어 있으면 복강·피하·경구 경로는 모두 부적절하다.</span><span class="hang">검사실 없이도 병력·진단·이환 기간으로 이상을 예측할 수 있다. 급성 감염성 설사는 대사성 산증과 저나트륨혈증, 상부 장폐색·제4위 정체는 저염소·저칼륨 대사성 알칼리증, 만성 신질환은 저나트륨·저염소혈증, 초식동물의 만성 식욕부진은 저칼륨혈증(특히 비유 반추동물)이다. 18~24시간 심한 수양성 설사를 한 동물은 심한 산혈증일 수 있다.</span></span></p><p class="bx-num"><span class="bxn">22.</span><span>수액량 계산 — 결손량·유지량·지속 손실량<span class="hang">결손량(L) = 탈수 % × 체중(kg). 예: 50 kg 송아지 8% 탈수 = 4 L(Large Animal IM, Constable 표).</span><span class="hang">유지량: Constable은 60~80 mL/kg/24시간(약 3~4 mL/kg/시간), Large Animal IM은 성우 2~3 mL/kg/시간, 신생자 4~6 mL/kg/시간, 송아지 50~100 mL/kg/일로 쓴다. 국내 지침은 체중의 3%로 계산한다.</span><span class="hang">지속 손실량: 심한 설사면 지속 손실과 유지량을 합쳐 24시간에 약 150 mL/kg에 이른다. 설사 송아지 분변 손실은 1~6 L이며 분변 양상과 양으로 추정하고 매일 재평가한다. 경구 수액은 60~80%만 흡수되므로 계산에 반영한다(Large Animal IM).</span><span class="hang">비유 중인 젖소는 비유에 필요한 물을 과소평가하기 쉽다. 옥수수 사일리지 위주, 쾌적 환경에서 하루 45 kg 착유하는 600 kg 젖소는 최소 140 L/일이 필요하다.</span><span class="hang">투여는 두 단계로 한다. 첫 4~6시간 수화요법 100~150 mL/kg IV, 이후 20~24시간 유지요법(지속 손실 + 유지량) 60~80 mL/kg/24시간 IV.</span></span></p><p class="bx-num"><span class="bxn">23.</span><span>수액량 예시 (Constable)<table class="bxt"><tr><th>동물</th><th class="c">탈수(% 체중)</th><th class="c">재수화(L)</th><th class="c">유지(L/24시간)</th></tr><tr><td>신생 송아지 50 kg</td><td class="c">8</td><td class="c">4</td><td class="c">2.5~5</td></tr><tr><td>신생 송아지 50 kg</td><td class="c">12</td><td class="c">6</td><td class="c">2.5~5</td></tr><tr><td>성우 700 kg</td><td class="c">8</td><td class="c">56</td><td class="c">35~70</td></tr><tr><td>성우 700 kg</td><td class="c">12</td><td class="c">84</td><td class="c">35~70</td></tr></table><span class="hang">심급성 대장균 유방염은 균형 전해질액을 24~48시간 동안 100~150 mL/kg/24시간 정맥으로 준다(Constable 표 5-2).</span></span></p><p class="bx-num"><span class="bxn">24.</span><span>투여 속도<span class="hang">송아지는 0.9% NaCl과 중탄산나트륨액을 시간당 1~3 L, 곡류과식으로 심한 탈수·산증인 소는 시간당 10~12 L까지 준다. 칼륨이 첨가된 액은 조심해서 시간당 3~5 L로 준다(Constable). 14G 카테터로 성우에 20 L를 4시간에 줄 수 있다.</span><span class="hang">패혈 환자에서 첫 1시간 20~40 mL/kg 같은 볼루스 수액 소생의 문제가 지적되어, 빠른 소생은 소량 고장식염수에 맡기고 대량 정질액은 볼루스가 아닌 시간당 20 mL/kg 미만의 느린 속도로 주라고 Constable은 권한다.</span><span class="hang">Large Animal IM은 제4위 염전 등 상부 폐색에서 수술 전·중 등장 정질액 15~20 L(20~25 mL/kg) 볼루스 후 30~40 L(3~5 mL/kg/시간), 산증·패혈 반추동물에서 첨가제 없는 정질액 25~50 mL/kg 볼루스 후 정속주입, 성우 패혈증에서 4~5 mL/kg/시간으로 첫 24시간 최소 40~60 L를 권한다. 칼륨·칼슘 첨가액은 볼루스로 주지 않는다.</span></span></p><p class="bx-num"><span class="bxn">25.</span><span>수액 중 감시와 부작용<span class="hang">양호한 반응: 30~60분 안에 배뇨, 정신상태 호전, 수화 징후. 검사실이 있으면 PCV, HCO₃, 혈액 pH로 감시한다.</span><span class="hang">불량 반응: 기존 폐렴이나 과속 투여로 인한 폐수종으로 호흡곤란, 신부전·방광마비로 무뇨, 알칼리 과다투여로 테타니. 갑작스런 근무력은 저칼륨혈증, 갑작스런 빈맥·과호흡은 과수화를 시사하므로 즉시 멈추고 재평가한다. 투여 수 시간 뒤 발한·떨림·침울은 수액 오염을 의심한다.</span><span class="hang">중심정맥압 정상 2~10 cmH₂O(견관절 기준). 2 미만은 수액 필요, 15 초과는 심부전과 용적과부하.</span><span class="hang">저체온 동물에 정맥 수액을 주면 심부체온이 더 떨어진다. 37℃로 데운 수액도 수액세트를 지나며 식으므로 카테터 가까이에서 수액줄을 가온한다. 국내 지침은 수액줄을 약 45℃ 물통에 담가 송아지 체온(39.5℃)보다 높게 데워 주라고 한다.</span></span></p><p class="bx-num"><span class="bxn">26.</span><span>정맥 경로와 카테터<span class="hang">경정맥이 대량 수액의 기본 경로다. 2 L 이하를 바로 줄 때는 5.0~7.5 cm 스테인리스 14G 바늘이 좋다. 3.75 cm 일회용 14G는 너무 짧고 날카로워 정맥 내막 열상·혈관 밖 누출이 잦다(Rebhun). 바늘 재사용 시 세척·멸균은 소백혈병바이러스와 세균 전파 방지에 중요하다.</span><span class="hang">유치 카테터: 경정맥 앞 1/3을 털 깎고 소독, 리도카인 피내 1 mL 후 15번 메스로 피부를 5 mm 절개, 성우는 최소 16G(대개 14G 13 cm), 송아지는 14~18G 13 cm까지 쓴다. 혈전 형성은 실라스틱 &lt; 폴리우레탄 &lt; 테플론 순으로 적다.</span><span class="hang">이정맥: 성우는 14G 5 cm 카테터로 4시간에 20 L, 신생 송아지는 귀 기부에 지혈대를 감고 22G 2.5 cm 나비 카테터를 쓴다(북유럽). 송아지 정맥 확보가 어려우면 몸을 거꾸로 매달아 경정맥을 확장시키거나, 대퇴골·상완골두에 14~16G 바늘로 골내 수액을 준다.</span><span class="hang">수일간 경정맥 카테터는 혈전정맥염·화농성 정맥염·카테터 패혈증을 만든다. 약 50%는 완전 폐쇄되어 2~3주 쓸 수 없다. 무균 술기가 핵심이며 헤파린 150 IU/kg SC 12시간 간격 예방은 술기가 좋으면 필요 없다고 본다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">27.</span><span>수액 종류 — 장력과 유효 강이온차(SID)<span class="hang">대동물 혈장수 삼투압은 약 306 mOsm/L이므로 등장(300~312), 고장(&gt;312), 저장(&lt;300)으로 나눈다. 적혈구는 저삼투에 약해 정맥 수액은 등장이나 고장이 이상적이다. 정상 혈장 SID는 약 40 mEq/L이며 유효 SID가 큰 액은 알칼리화, 0인 액은 산성화한다.</span><table class="bxt"><tr><th>용액</th><th class="c">유효 SID (mEq/L)</th><th class="c">삼투압 (mOsm/L)</th><th>성격</th></tr><tr><td>8.4% NaHCO₃</td><td class="c">1000</td><td class="c">2000</td><td>고장·알칼리화</td></tr><tr><td>5.0% NaHCO₃</td><td class="c">595</td><td class="c">1190</td><td>고장·알칼리화</td></tr><tr><td>10% NaH₂PO₄</td><td class="c">145</td><td class="c">1150</td><td>고장·알칼리화</td></tr><tr><td>50% 포도당</td><td class="c">0</td><td class="c">2500</td><td>고장·산성화</td></tr><tr><td>7.2% NaCl</td><td class="c">0</td><td class="c">2460</td><td>고장·산성화</td></tr><tr><td>25% 황산마그네슘</td><td class="c">0</td><td class="c">2028</td><td>고장·산성화</td></tr><tr><td>23% 보로글루콘산칼슘</td><td class="c">0</td><td class="c">1069</td><td>고장·산성화</td></tr><tr><td>1.3% NaHCO₃</td><td class="c">155</td><td class="c">310</td><td>등장·알칼리화</td></tr><tr><td>링거액</td><td class="c">0</td><td class="c">309</td><td>등장·산성화</td></tr><tr><td>0.9% NaCl</td><td class="c">0</td><td class="c">308</td><td>등장·산성화</td></tr><tr><td>1.15% KCl</td><td class="c">0</td><td class="c">308</td><td>등장·산성화</td></tr><tr><td>초산링거</td><td class="c">27</td><td class="c">294</td><td>저장·알칼리화</td></tr><tr><td>젖산링거</td><td class="c">&lt;14</td><td class="c">275</td><td>저장·알칼리화</td></tr><tr><td>5% 포도당</td><td class="c">0</td><td class="c">250</td><td>저장·산성화</td></tr></table><span class="hang">나트륨 함유 정질액은 세포외액 전체로 퍼진다. 저혈량(회로 문제)에는 늘 적응이지만 울혈성 심부전(펌프 문제)과 심한 저알부민혈증(부종 악화)에는 금기다.</span></span></p><p class="bx-num"><span class="bxn">28.</span><span>주요 정맥 수액 조성 (mmol/L)<table class="bxt"><tr><th>용액</th><th class="c">Na</th><th class="c">K</th><th class="c">Ca</th><th class="c">Mg</th><th class="c">Cl</th><th class="c">HCO₃·전구체</th><th>주 적응</th></tr><tr><td>0.9% NaCl</td>
