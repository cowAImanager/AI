<p class="bx-num"><span class="bxn" data-n="13">•</span><span>미주신경성 소화불량(며칠에 걸쳐 제1위가 커져 배가 부풀고 점점 탈수되며 변이 적다), 독혈증에 따른 이차성 제1위 무력, 저칼슘혈증 초기(6~18시간 가벼운 고창과 제1위 무력, 칼슘 투여 후 회복)와도 구별한다. 복막염, 식욕을 떨어뜨리는 전신 질병 초기도 구별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>제1위액 클로라이드는 정상 30mEq/L 미만이다. 높으면 제4위 병이나 장 흐름 폐색에 의한 이차성 소화불량이고, 낮은 pH의 원인이 젖산 산증인지 제4위 역류인지 가르는 데 쓴다. 제4위 역류는 pH를 약간 낮추지만 정상 범위 안인 경우가 많아 pH로는 잘 못 찾는다. 높으면 대개 저클로르혈증과 대사성 알칼리증이 함께 있다. 젖산 산증과 오랜 식욕부진에서도 높을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>식욕부진 성우는 가벼운 대사성 알칼리증이 흔하다. 성우 장 폐색 대부분은 Cl·K·Na 저하와 대사성 알칼리증이고, 곡류 과식이나 오래된 심한 폐색은 산증이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료</div>
<p class="bx-num"><span class="bxn" data-n="16">•</span><span>원인 사료를 찾아 치우고 양질 목건초나 짚을 마음껏 먹게 한다. 상한 사료가 아니면 나중에 건초와 함께 조금씩 다시 늘린다. 24~48시간 안에 다시 먹는지 지켜본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>칼슘 보로글루코네이트 23% 500mL를 정맥 또는 피하 네 곳에 나누어 준다. 식욕 부진과 장 정지가 저칼슘혈증을 부르기 때문이다. 마그네슘 제제를 지나치게 반복하면 고마그네슘혈증과 대사성 알칼리증으로 근육이 약해질 수 있다. 미네랄오일 4~6L를 위관으로 넣으면 원인 사료의 흡수를 줄이고 배출을 돕는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span>네오스티그민(neostigmine) 같은 부교감신경 작용제는 제1위가 완전히 멈췄으면 소용없고 운동이 조금 남아 있을 때 자극할 수 있다. 협조된 운동을 만들지 못하고 효과 근거가 없으며 복막염 소와 임신 말기에 위험해 더 이상 권하지 않는다는 기술도 있다. 엡솜염(0.5~1.0kg) 같은 마그네슘염도 효과가 입증되지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>곡류 과식은 제1위 내용이 산성으로 확인될 때만 수산화마그네슘이나 산화마그네슘을 성우당 450g 준다. 산증이 없는데 주면 알칼리증을 일으킨다. 성우(450kg)당 수산화마그네슘 400g, 내용물이 말라 있으면 물 15~30L를 위관으로 넣는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>건강한 소의 제1위액 8~16L를 먹이면 제1위 균총 회복이 빨라진다. 며칠 이상 경과했거나 오래 굶은 소에 특히 효과적이며, 도축장 제1위 내용물이 좋은 공급원이고, 살아 있는 소에서는 물 20~30L를 위관으로 넣었다가 사이펀으로 받아낸다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">급성 제1위 산증(과산증)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="21">•</span><span>발효성 탄수화물(곡류, 사과, 포도, 빵, 사탕무, 덜 발효된 맥주박)을 갑자기 많이 먹어서 생긴다. 사료통 침입, 자동급이기 고장, 비육 입식 초기와 사료를 늘릴 때, 12~24시간 굶긴 뒤 무제한 급여가 흔한 상황이다. 제한급식에서 자유급식으로 바꾸는 비육 초기, 여름·가을에 많다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>밀·보리·옥수수가 가장 독하고 귀리·수수가 가장 덜 독하다. 곱게 갈거나 부술수록 독성이 크다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>먹고 2~6시간 안에 Streptococcus bovis가 늘어 젖산을 만들고 pH가 5 이하로 떨어진다. 섬유분해균·원충이 죽고 젖산균이 젖산을 더 만든다. 반추위 삼투압이 올라 체액이 반추위로 빨려 들어가 탈수·혈액농축과 삼투성 설사가 온다. pH 5 근처에서 반추위가 멈춘다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>화학적 반추위염은 4~6일 뒤 진균성 반추위염·복막염으로 번지고, 반추위염 부위를 통해 간농양으로 이어진다.</span></p><p class="bx-num"><span class="bxn" data-n="25">•</span><span>먹고 12~36시간 뒤 증상이 나타나고, 즉시 치료하지 않으면 수 시간 안에 죽는다. 경증은 식욕부진, 묽은 변, 반추위 운동 감소를 보이고 3~4일째 스스로 먹는다.</span></p><p class="bx-num"><span class="bxn" data-n="26">•</span><span>중증은 24~48시간 내 기립불능·비틀거림을 보이고 체온은 대개 36.5~38.5℃다. 심박은 산증이 심할수록 계속 오르며, 분당 100회 미만이면 예후가 낫고 120~140회면 나쁘다. 호흡은 얕고 빨라져 분당 60~90회까지 오른다.</span></p><p class="bx-num"><span class="bxn" data-n="27">•</span><span>설사는 거의 항상 있고 양이 많다. 색이 옅고 달콤하면서 신 냄새가 나며, 소화 안 된 곡식 낟알이 많이 섞여 있다. 탈수는 경증 4~6%, 중증 10~12%이고 무뇨가 흔하며, 수액 후 이뇨는 좋은 징후다.</span></p><p class="bx-num"><span class="bxn" data-n="28">•</span><span>반추위는 곡류를 많이 먹었으면 단단한 반죽 같고, 적게 먹고도 병났으면 꽉 차지 않고 액체 때문에 물렁하게 되튕겨 촉진으로 놓치기 쉽다. 1차 수축은 대개 없고, 청진하면 액체가 찰랑·꾸르륵거린다.</span></p><p class="bx-num"><span class="bxn" data-n="29">•</span><span>실명, 안검반사 둔화, 제엽염, 약 48시간 뒤 유열 같은 횡와를 보일 수 있다. 3~4일째 재악화는 진균성 반추위염을 의심한다.</span></p><p class="bx-num"><span class="bxn" data-n="30">•</span><span>감별은 단순성 소화불량(pH·원충 정상), 유열(분변 단단, 탈수 없음, 칼슘 반응), 초급성 대장균성 유방염, 급성 미만성 복막염이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="31">•</span><span>과식 발견 직후 사료를 차단하고 1일량 절반의 건초를 주며 12~24시간 매시간 걷게 한다. 독성량을 먹은 소는 6~8시간에 침울해지므로 골라 따로 치료한다.</span></p><p class="bx-num"><span class="bxn" data-n="32">•</span><span>물을 과음하면 반추위가 다시 차서 수 시간~18~24시간 안에 죽을 수 있다. 18~24시간 뒤 건초를 먹는 소만 물을 자유롭게 준다. 출하 직전 비육우면 긴급 도축이 가장 경제적일 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="33">•</span><span>기립불능이면 반추위를 절개한다. 비우고 사이펀으로 씻어 반추위염 정도를 보고 건초 몇 줌을 넣는다. 제3·4위로 넘어간 사료는 남는다. 단점은 시간·비용·시설이다.</span></p><p class="bx-num"><span class="bxn" data-n="34">•</span><span>서 있지만 처지고 심박이 90~100이면 세척한다. 내경 25~28 mm 관으로 좌겸부가 부풀 때까지 온수를 넣고 사이펀으로 빼기를 10~15회 한다. 흡인성 폐렴·횡와에 주의한다. 위관으로 반추위액을 최대한 빼고 활성탄 450~900 g을 넣는 방법도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="35">•</span><span>반추위를 비우지 않는 중등도(걸을 수 있음)에는 산화·수산화마그네슘 500 g/450 kg을 물 10 L에 타서 위관으로 넣고 반추위를 주무른다. 절개·세척으로 비웠으면 대사성 알칼리증 위험이 있어 넣지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="36">•</span><span>수액은 비틀거림·기립불능, 탈수 8% 이상, 심박 90~100 이상일 때 한다. 5% 중조 5 L/450 kg을 30분에 주고 이어서 1.3% 중조 150 mL/kg을 6~12시간에 준다. 고장식염수 뒤 하트만을 주고 혈액 pH 7.15 미만이면 중조를 추가하는 방법도 있는데, 고장식염수 뒤에는 물을 제한한다. 반응하면 1시간 안에 배뇨하고 6~12시간에 일어서려 한다.</span></p><p class="bx-num"><span class="bxn" data-n="37">•</span><span>쇼크에는 플루닉신(flunixin meglumine)을 쓴다. 중등도 이상 반추위염에는 페니실린 10,000~20,000 U/kg을 하루 1회 3~5일 근육 또는 피하주사한다. 광범위 항생제는 진균 과증식 때문에 피하고, 경구 페니실린·테트라사이클린은 가치가 제한적이다. 비타민 B군(회백질연화증)도 준다.</span></p><p class="bx-num"><span class="bxn" data-n="38">•</span><span>회복 판정은 3일째까지 건초를 먹고 분변을 다량 배출하는 것이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방·합병증</div><p class="bx-num"><span class="bxn" data-n="39">•</span><span>합병증은 진균성 반추위염(3~5일), 간농양(일부는 후대정맥 증후군으로), 제엽염(수주~수개월 뒤), 유산(10일~2주 뒤), 색전성 뇌감염(7~14일 뒤), 회백질연화증이다.</span></p><p class="bx-num"><span class="bxn" data-n="40">•</span><span>비육 적응은 조사료 50~60% 혼합사료로 7~10일 먹인 뒤 2~4일마다 조사료를 10%씩 줄여 10~15%까지 내리며, 약 21일이 걸린다. 따로 줄 때는 농후사료 8~10 g/kg에서 시작해 2~4일마다 10~12%씩 늘린다.</span></p><p class="bx-num"><span class="bxn" data-n="41">•</span><span>완충제는 적응 초기만 일부 효과가 있고 알팔파 10%보다 낫지 않다. 이오노포어는 살리노마이신이 모넨신·라살로시드보다 낫다.</span></p></div></div>
<div class="bx"><div class="bx-title">아급성 반추위 산증(SARA)</div><p class="bx-num"><span class="bxn" data-n="42">•</span><span>비구조 탄수화물 과다와 물리적 유효섬유 부족으로 반추위 pH가 반복해서 떨어지는 병이다. 반추위 천자 pH 5.5 이하가 가능하면 하루 3시간 이상 지속되는 것이 정의로 합의되어 가며, 5.2~5.6의 반복 저하로도 기술한다. 섬유 소화는 6.2 미만에서 이미 떨어진다.</span></p><p class="bx-num"><span class="bxn" data-n="43">•</span><span>조기 비유 젖소의 최대 20%에서 5.5 미만이 관찰되고, 젖산보다 휘발성지방산 과다가 중요하다. 방목 착유우도 연한 목초기나 착유 시 농후사료 대량 급여로 심하게 생긴다.</span></p><p class="bx-num"><span class="bxn" data-n="44">•</span><span>우군 증상은 제엽염(10%를 넘으면 사양 문제), 간헐적 설사와 들쭉날쭉한 분변 점수, 섭식 변동, 체충실 감소, 간농양, 후대정맥 혈전에 의한 객혈, 유지방 저하, 반추 감소, 제4위 질환 증가, 높은 도태율이다.</span></p><p class="bx-num"><span class="bxn" data-n="45">•</span><span>반추위액은 pH 최저점에 채취한다. 분리급여는 주 농후사료 2~4시간 뒤, TMR은 급여 4~8시간 뒤다(6~8시간으로 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="46">•</span><span>우군 판정 기준은 책마다 다르다. 12두 이상 천자해 10두 이상 중 30%가 5.5 이하면 산증 상태로 보고, 12두 중 3두 이상이면 유병률 15% 이하와 30% 초과를 구별한다. 12두 중 5두 이상이 5.5 미만이면 우군 문제로 보고 천자 5.3~5.7, 경구 프로브 5.5~5.9를 SARA 범위, 6.0 미만을 의심으로 보기도 한다. 12두 중 2두가 5.5 미만이면 경계로 보고, 5.8 미만을 시사 소견으로 쓰는 연구도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="47">•</span><span>보조 지표는 유지방:유단백 1.15 미만, 유지방률이 유단백률보다 낮은 소가 10% 초과(비유 30일 이후)다. 쉬는 소의 40% 이상(먹거나 자지 않는 소의 60% 이상으로 적은 책도 있다)이 반추해야 한다. 분변 20~30개를 체질해 곡립을 본다. 초음파 반추위 점막 7.3 mm 초과가 pH 5.5 미만과 관련됐다(예비 연구).</span></p><p class="bx-num"><span class="bxn" data-n="48">•</span><span>예방은 분만 후 첫 주 곡류 건물 3~5 kg 이하로 시작해 하루 110~220 g씩 늘려 6~8주에 최고량에 이르게 한다. 분만 전 사료는 1.54~1.63 Mcal/kg NEl를 최소 3주 전부터 급여한다. 미세 분쇄·증기 압편·고수분 곡류, 밀·보리 전분, 습하고 잘게 썬 옥수수 사일리지가 위험하다.</span></p><p class="bx-num"><span class="bxn" data-n="49">•</span><span>DCAD((Na+K)−(Cl+S))는 조기 비유 약 +400, 중기 +275~+400 mEq/kg 건물로 한다. 섬유 입자는 4 cm 이상이어야 매트에 기여하며, 입자 분리기 상단이 7% 미만이면 위험하고 15% 넘게 골라먹을 정도면 오히려 위험하다. 사조 폭 두당 75 cm 미만은 골라먹기를 악화한다. 하루 2회 급여, 농후사료 전 장초 소량, 모넨신이 도움이 된다. 알팔파 건초 추가는 유효섬유 부족 발생 시 응급처치에 가깝다.</span></p></div>
<div class="bx"><div class="bx-title">고창증</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="50">•</span><span>포말성(원발성)은 가스가 거품에 갇혀 트림으로 나가지 못하는 것이고, 가스성(속발성)은 식도가 막히거나 미주신경 기능이 떨어져 생긴다. 정상 소는 발효 가스를 최대로 만들 때보다 더 많이 트림할 수 있어, 가스가 많이 생기는 것 자체는 원인이 아니다. 배출이 막히거나 트림 기전이 억제되어야 고창이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="51">•</span><span>농후사료 위주 사료에서도 안정된 거품이 생기는데, 입자 크기와 발효 속도가 결정 요인이고 세균이 만든 점액이 낮은 pH에서 거품을 안정시킨다. 비육우의 산발적인 고창은 대개 식도염, 산증, 제1위염, 반추 부족 때문에 오는 가스성이다.</span></p><p class="bx-num"><span class="bxn" data-n="52">•</span><span>가스성 고창의 원인은 저칼슘혈증에 따른 장운동 정지, 식도폐색·식도 손상, 트림을 맡는 미주신경 뿌리를 다친 인두 손상, 고창을 동반한 소화불량, 파상풍, 급성 국소 복막염이다. 만성 폐렴이나 흉선 림프육종으로 부은 종격동 림프절, 분문부 유두종이나 방선균증도 원인이다.</span></p><p class="bx-num"><span class="bxn" data-n="53">•</span><span>젖이나 대용유만 먹고 섬유가 부족한 2~4개월령 송아지에 만성 가스성 고창이 흔하고, 건초 없이 펠렛만 먹는 이유 송아지는 10% 이상에서 생길 수 있다. 생후 5주 전에는 제1위 고창이 드물고 제4위 고창이 훨씬 흔하다. 식도구가 제대로 닫히지 않아 우유가 제1위로 들어가면 발효해 고창과 산증이 온다. 원인을 못 찾는 경우가 많고 시간이 지나면 저절로 없어진다.</span></p><p class="bx-num"><span class="bxn" data-n="54">•</span><span>경증은 좌측 겸부가 부풀어도 불편해하지 않고 겸부 피부를 5~7cm 쉽게 집어 올릴 수 있다. 중등도는 피부가 팽팽하지만 일부 집힌다. 중증은 양쪽 배가 부풀고 입을 벌려 숨쉬며 혀를 내밀고 비틀거리며, 좌측 겸부 피부를 전혀 집을 수 없다. 뒷다리를 멀리 뒤로 뻗고 서기도 하고, 복통과 호흡곤란으로 날뛰면 몇 분 안에 쓰러져 죽을 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="55">•</span><span>초기에는 제1위 수축이 강하고 잦지만 거품 때문에 소리가 작고, 팽창이 극심해지면 수축이 줄거나 없어진다. 심박이 분당 100~120회까지 오르고 수축기 잡음이 들릴 수 있는데 가스를 빼면 바로 없어진다. 증상이 나타나고 대개 3~4시간 안에는 죽지 않지만, 쓰러지면 몇 분 안에 죽는다. 가스성은 좌측 위쪽에 등선까지 큰 핑이 들리지만 호흡곤란은 드물다.</span></p><p class="bx-num"><span class="bxn" data-n="56">•</span><span>위관을 넣어 보면 포말성과 가스성이 구별되고, 식도가 막혔으면 넣을 때 걸린다. 위관이 쉽게 들어가고 팽창이 가라앉으면 가스성이다. 포말성은 위관을 넣어도 거의 빠지지 않고 핑도 덜 뚜렷하다. 사료 조건이 맞고 위관에서 거품이 나오면 원발성(포말성)이다. 며칠째 배가 부풀어 있거나 최근 며칠 사이 간헐적으로 반복되면 속발성을 의심한다.</span></p><p class="bx-num"><span class="bxn" data-n="57">•</span><span>좌측 겸부에서 핑이 들리면 높이 크게 생긴 제4위 좌측전위도 생각한다. 제4위는 바깥에서 장기 모양이 보이고 핑이 대개 11번 갈비뼈 앞에서 멈추지만, 제1위 팽창은 요각부터 횡격막까지 등쪽으로 핑이 난다. 기복증은 양쪽 등쪽에서 핑이 난다.</span></p><p class="bx-num"><span class="bxn" data-n="58">•</span><span>속발성은 트림을 못하게 하는 병과 구별한다. 식도 폐색(삼키기 어렵고 급성은 심하게 토하려 함), 만성 제2위복막염, 미주신경성 소화불량(수일~수주에 걸쳐 진행, 체중 감소, 분변 적음, 제1위 복낭이 커져 우하복부까지 부풂), 파상풍(사지·꼬리 경직, 순막 돌출, 과민, 가스성 고창)이다. 림프육종, 결핵이나 만성 폐렴으로 커진 림프절도 원인이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="59">•</span><span>소는 죽은 뒤에도 배가 부푼다. 살아서 고창이 있었으면 목과 흉강의 혈관·림프절이 눌려 경부 림프절과 혈관이 충혈되고, 흉강 입구 부근 식도에 충혈된 앞쪽과 눌린 뒤쪽 사이 흰 경계선이 보인다. 뒷몸 근육 사이 부종은 일정하게 나타나지 않는다. 간이 창백하고, 기종저, 낙뢰, 탄저처럼 갑자기 죽는 병의 특징 병변이 없어야 고창으로 진단한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="60">•</span><span>점점 심해지는 중증 포말성 고창은 응급 제1위 절개가 첫째 치료다. 제1위가 극도로 늘어나 호흡곤란이 있으면 바로 수술해야 하고, 투관침은 가스성은 풀어주지만 포말성에는 부족할 수 있다. 좌측 겸부 중앙에 날카로운 칼로 10~20cm를 피부·근육·제1위까지 한 번에 절개하면 내용물이 터져 나오며 곧 편해지고, 복강 오염은 의외로 적다.</span></p><p class="bx-num"><span class="bxn" data-n="61">•</span><span>투관은 복막염을 거의 확실히 일으키므로 응급 감압이 꼭 필요한 극단적인 경우가 아니면 하지 않는다. 투관 뒤 국소 또는 범발성 복막염이 올 수 있다. 일반 크기 투관침은 심한 포말성 거품이 빠지기에 너무 가늘어 지름 2.5cm 굵은 것을 쓰고, 압이 줄면 투관침으로 소포제를 넣고 몇 시간 꽂아둘 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="62">•</span><span>위관이 거품으로 막히거나 액체 아래로 잠기면 관에 바람을 불어넣거나 끝을 움직여 뚫는다. 흉부가 심하게 눌린 소는 위관을 넣다가 드물게 급사할 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="63">•</span><span>경증~중등도 포말성은 폴록살렌(poloxalene) 두당 25~50g을 먹이면 잘 듣고, 광유나 식물성 기름도 거품을 깬다. 호흡곤란이나 심한 복통이 없으면 위관으로 폴록살렌이나 광유를 넣는다. 기름은 250mL, 흔히 500mL까지 쓰며, 폴록살렌은 농후사료(곡류) 고창에는 효과가 떨어진다.</span></p><p class="bx-num"><span class="bxn" data-n="64">•</span><span>제1위 운동이 있으면 소포제가 저절로 섞인다. 운동이 멈췄으면 좌측 겸부를 주무르며 걷게 한다. 비육우 고창은 위관으로 소포제(광유 선호)를 넣고 20분 걷게 하며, 중등도는 몇 분 걷기만 해도 트림이 시작된다. 경증은 막대를 재갈처럼 물려 침을 흘리게 하고, 중탄산나트륨 150~200g을 물 1L에 타서 조심해서 먹여도 된다.</span></p><p class="bx-num"><span class="bxn" data-n="65">•</span><span>저칼슘혈증으로 온 가스성은 칼슘 주사와 위관이 필요하다. 고창을 동반한 소화불량은 위관으로 가스를 빼고 칼슘 주사, 하제·제산제·반추촉진제를 준다. 국소 복막염에 따른 고창은 항생제, 축사 안정, 자석으로 치료한다.</span></p><p class="bx-num"><span class="bxn" data-n="66">•</span><span>만성 가스성 고창은 포말성에 쓰는 소포제나 계면활성제에 반응하지 않고, 제1위 기능을 정상으로 되돌려야만 낫는다. 원인을 모르는 송아지의 만성·간헐성 가스성 고창은 임시 제1위 누관을 만드는 것이 가장 좋고, 몇 주 뒤 누관이 닫히면 대개 더 이상 고창이 없다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="67">•</span><span>사료에 섬유를 충분히 넣고 농후사료, 특히 옥수수·보리·대두박의 비율을 천천히 올려야 반추위가 적응한다. 농후사료 위주 소는 제1위 섬유층이 제대로 유지되어야 한다. 곡류 사료에는 볏짚 같은 짚이나 건초를 잘라 최소 10~15% 섞고, 조사료를 따로 주면 섭취량이 들쭉날쭉해 위험하다. 곡류는 압편·파쇄만 하고 곱게 갈지 않으며 펠렛은 권하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="68">•</span><span>알팔파 건초는 잎이 많고 덜 자라 줄기가 연한 것이 위험하고, 잘게 자르면 더 위험하다. 새 건초로 바꿀 때는 처음 5일간 묵은 건초와 섞어 준다. 알팔파 건초와 곡류를 50:50으로 섞은 사료가 가장 위험하고, 곡류가 35% 미만이면 위험이 낮다.</span></p><p class="bx-num"><span class="bxn" data-n="69">•</span><span>두과 목초지에 내기 전에 거친 건초나 짚을 배불리 먹이고, 처음에는 짧게 내보낸다. 오전보다 오후에 내보내면 고창이 덜하다. 이슬이 마른 뒤 방목하고, 두과는 개화 전 영양생장기에 가장 위험하며, 목초와 두과를 섞어 파종하는 것이 가장 효과적이고 값싼 예방이다.</span></p><p class="bx-num"><span class="bxn" data-n="70">•</span><span>모넨신(monensin) 하루 1mg/kg을 먹이면 두과 고창이 크게 줄었고, 고창 사료를 먹기 전부터 시작하는 것이 더 효과적이었다.</span></p></div></div>
<div class="bx"><div class="bx-title">제1위 부전각화증</div>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>펠렛이나 아주 곱게 간 고에너지 사료를 먹는 소에서 주로 생기며, 계속 높은 휘발성지방산 농도에 대한 반응으로 본다. 열처리한 알팔파 펠렛을 많이 먹인 소에서 흔하고, 썰지 않은 조사료를 정상량 먹는 소나 가공하지 않은 통곡류로는 생기지 않는다. 한 무리에서 40%까지 걸릴 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>이 병만으로 진단되는 일은 드물고, 대개 같이 있는 만성 산증 증상으로 발견된다. 비정상 융모는 쉽게 다쳐 제1위 벽의 만성 염증으로 이어지고, 송아지는 털을 핥는 버릇 때문에 털뭉치가 같이 생긴다. 분문 부위 부전각화가 고창 위험을 높인다는 설이 있으나 확인되지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>병변은 융모가 검고 커지고 두꺼워져 서로 붙는다. 액체 높이쯤의 제1위 등쪽 면이 가장 심하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span>아급성·만성 반추위 산증은 대개 반추위 pH 5~5.5다(아급성 5.1~5.7로 적은 책도 있다). 조사료를 먹는 소에서 5.5~6이면 비정상이고 몰래 곡류를 먹었을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>무리 판정에서 아급성 산증은 복낭 천자로 5.3~5.7, 200mL를 받는 구강 탐침으로 5.5~5.9이고 6.0 미만은 의심한다. 식욕이 없으면 정상으로 오르고 하루 중 변하므로 정상이라도 배제하지 못한다. 가장 낮을 때(분리 급여 2~4시간, 혼합사료 6~8시간 뒤) 재고, 12두 중 5두 이상 5.5 미만이면 무리 문제로 본다(급여 4~8시간 뒤 천자로 12두 중 40% 이상 5.5 미만으로 적은 책도 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>치료는 원인이 된 급여 잘못을 고치는 것(농후사료를 줄이고 길게 자른 조사료를 늘림)이 가장 좋다. 사료를 바꾸면 융모는 3주 만에도 자라거나 줄어들 수 있다. 제1위 벽에 염증이 없으면 예후가 좋다.</span></p>
</div>
<div class="bx"><div class="bx-title">창상성 제2위복막염·심낭염</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>원인 이물은 대개 5~15cm 길이의 약간 구부러진 철사와 못이다. 1,400두 부검에서 철사 59%, 못 36%였다. 임신 말기 3개월에는 무거운 자궁이 진자처럼 제1위·제2위를 눌러 천공을 거들고, 분만 때 힘주기도 복압을 높인다. 1세 이상에서 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>가공 사료를 먹는 축사 사육우에 많으며, 캐나다 서부에서는 번식 육우와 대체 미경산우 부검에서 가장 흔한 소견(8%)이었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>급성 국소 복막염은 갑자기 식욕이 거의 완전히 없어지고, 등을 굽히고 팔꿈치를 벌리며 불안한 얼굴로 선다. 반추가 거의 없고 제1위 운동이 약하며 가벼운 고창이 있을 수 있고, 변은 적고 마르거나 무르다. 일부는 되새김할 양보다 많이 토해 낸다. 움직이기 싫어하고 특히 내리막에서 신음하며, 배변·배뇨 때 아파서 횟수가 줄고 신음한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="80">•</span><span>39.4~40.6℃ 열이 날 수 있지만, 수술이나 부검으로 확진된 200두 넘는 소에서 절반 이상은 체온이 정상이었다. 정상 체온으로 이 병을 배제하지 않는다. 심박 약 80회, 호흡 약 30회이고 40℃가 넘고 심박이 90회를 넘으면 심한 합병증을 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>전형적인 증상은 첫 하루이틀에 가라앉아 시간이 지날수록 진단이 어려워진다. 만성이 되면 체중 감소, 거친 털, 간헐적 식욕부진, 변 상태 변화, 제1위 기능 이상과 가벼운 고창을 보이고 등을 굽히기도 한다. 설사나 전신 파행, 위치를 잡기 어려운 앞배 통증만 보이기도 한다. 회복 뒤에도 미주신경성 소화불량이 올 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>범발성 복막염은 열, 심박 90~140회(100~120회로 적은 책도 있다), 호흡 40~80회, 위장관 완전 정지, 피부 냉감을 보이고 숨쉴 때 신음하며, 12~48시간 안에 쇼크 상태로 간다. 체온은 처음 오르다 정상 이하로 떨어진다. 임신 말기에 생기면 복막염이 퍼지기 쉽다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>기갑을 꼬집으면 정상 소는 등을 아래로 굽히는데, 아픈 소는 굽히지 않고 신음할 수 있다. 검사의 민감도는 낮을 것이다. 검상연골 바로 뒤에서 좌우로 폭 약 20cm 띠를 따라 복벽 아래 1/3을 주먹이나 무릎으로 짧고 강하게 민다. 양쪽에서 최소 6번씩 하고 기관에 청진기를 대고 신음을 듣는다. 큰 성우와 황소는 단단한 막대를 배 밑에 가로로 대고 세게 들어올린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>직장검사 중 힘줄 때 신음할 수 있다. 변은 오래 머물러 건조하고 단단하며 얇은 점액막에 싸여 있다. 범발성 복막염이면 제1위와 좌측 복벽 사이, 장 사이, 골반강에서 섬유소 유착이 만져질 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>왼쪽 팔꿈치 뒤 흉벽에 나침반을 천천히 가져가 60~90도 돌아가면 제2위에 강한 자석이 있는 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>아급성~만성 창상성 제2위복막염 일부도 심한 알칼리증을 보여, 심한 알칼리증이 늘 제4위·유문 병을 뜻하지는 않는다. 미주신경성 소화불량은 대부분 산염기·전해질이 정상이거나 가벼운 저클로르·저칼륨 알칼리증이다. 클로라이드 75mEq/L 미만의 뚜렷한 저클로르성 대사성 알칼리증은 유문·근위 소장 폐색이나 신부전을 가장 시사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>복막염 증상이 뚜렷하면 천공성 제4위 궤양이 가장 중요한 감별 대상이다(정중선 오른쪽 아랫배 통증, 대개 발열, 분만 2주 전~분만 후 100일). 급성 신우신염, 자궁 천공, 괴사성 자궁경관·질염도 비슷하다. 체온이 정상이면 소화불량, 케톤증과 구별하는데, 케톤증은 복통이 없고 이 병은 소변 케톤이 음성~미량이다. 간농양·흉막염·심낭염, 횡격막 탈장, 심내막염, 심장 림프육종과도 구별한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>보존치료는 자석을 먹이고 전신 항생제를 쓰며 칸에 가둬 유착이 생기게 한다. 처음에는 앞다리 쪽을 높게 세워 둔다. 탈수와 대사성 알칼리증이 있으면 수액과 염화칼륨 경구 투여(약 57~113g 하루 두 번)를 하고, 알칼리성 반추촉진제는 피한다. 48~72시간 안에 먹고 반추하기 시작하면 회복을 기대할 수 있다. 소염진통제는 통증에 쓰지만 식욕이 없고 탈수된 소에서는 제4위 궤양과 신장 독성을 따진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>제1위가 멈춰 있으면 자석이 제2위로 가지 못한다. 건강한 소에서도 먹인 자석의 57%만 제2위에 있었고, 이미 벽을 뚫었거나 관통한 이물은 각각 약 54%, 32%만 자석에 붙었다(85%가 1~4일 안에 제2위에 가 있고 찌른 이물의 32%가 붙는다고 적은 책도 있다). 이미 자석이 있는 소에서 증상이 나면 처음부터 개복·제1위 절개를 고려한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>항생제는 최소 3~7일 쓰며 페니실린, 세프티오퍼, 암피실린, 테트라사이클린이 쓰였다. 급성기에는 제1위 세균, 만성 농양에는 Trueperella pyogenes와 혐기성균이 관여한다. 혼합 감염 가능성이 높아 테트라사이클린이나 트리메토프림-설파제가 더 합리적이라는 의견도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>국소 복막염만 있거나 간·비장만 같이 다친 경우 예후가 괜찮고, 심낭염·흉막염·복강 전체 유착이 있으면 나쁘다. 임상형의 약 25%는 낫지 않는 합병증으로 간다. 걷게 하거나 장거리 수송하면 유착이 떨어져 재발이 잦다. 분만 무렵 천공되거나 억지로 운동시키면 범발성 복막염으로 번질 수 있다. 임신 6개월이 넘은 소는 완전 회복이 어렵고 재발이 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>3일 안에 회복되지 않으면 제1위 절개로 이물을 꺼내야 할 수 있다. 식욕과 제1위 운동이 들쭉날쭉해도 제1위 절개를 고려한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>사료 처리 기계에 큰 자석을 달고 모든 소에 자석을 먹이면 자석에 붙는 이물에 의한 경우는 거의 다 막는다. 자석은 사기 전에 금속에 대 보고 약한 것은 사지 않는다. 결속에 철사 대신 합성 끈을 쓰면 발생이 크게 준다. 자석(길이 7.5cm, 지름 1.0~2.5cm, 끝이 둥근 원통형)은 젖소 집단에서 발생과 합병증을 90~98% 줄였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>자석 투여 시기는 15~16개월령이다. 12~18개월령, 6~8개월령, 18개월~2세로 적은 책도 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">창상성 심낭염</div>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>창상성 제2위복막염의 약 8%가 심낭염으로 간다. 임신 마지막 3개월과 분만 때 더 많다. 대개 7~14일 전에 가볍게 앓다 좋아진 것 같다가 다시 심장 증상으로 나빠지는 두 단계 경과를 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>경정맥이 부풀고 박동하며, 아랫배·흉전 부종, 빈맥, 양쪽 심음 감소가 있다. 대개 열이 있고 초기에 40~41℃ 고열이 흔하며, 움직이기 싫어하며 팔꿈치를 벌린다. 흉골 아래나 검상연골 부위를 누르면 아파한다. 심하면 결막도 붓는다. 심장 부위에서 세탁기 같은 출렁 소리가 나면 가스 생성균이 있다는 뜻이고 예후가 아주 나쁘다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>청진에서 마찰음, 출렁·찰랑 소리, 잡음이 하루하루 나타났다 사라졌다 한다. 만성은 양쪽 심음이 작고 멀리서 찰랑이는 소리가 난다. 아래쪽 1/3에서는 폐음이 안 들릴 수 있다. 이상음이 좁은 범위에서만 들릴 수 있어 양쪽 흉벽 전체를 꼼꼼히 듣는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>감별은 심장 림프육종과 원인 불명 출혈성 심낭염이 주된 대상이며, 원인 불명 출혈성은 배액 뒤 예후가 패혈성보다 낫다. 천공성 제4위 궤양, 간농양, 흉막염, 심내막염, 폐성심과도 구별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>대부분 1~2주 안에 죽는다. 부종이 빨리 생기면 곧 죽는다는 뜻이다. 만성으로 남은 소는 마르고 경정맥이 부풀며 심음이 작고 심박이 90~100회로, 다음 임신을 견디기 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>치료는 대개 보람이 없고 도태나 분만까지의 단기 생존을 목표로 한다. 반복 배액은 단기 생존에 도움이 되지만 정상 회복 예후는 나쁘다. 장기간, 고비용에 실패가 흔해 도태를 권하며, 패혈성 심낭염의 완전 회복은 30% 미만이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>약물은 페니실린 22,000 IU/kg(프로카인) 12시간마다 근육주사, 플루닉신(flunixin meglumine) 1.1mg/kg 24시간마다 또는 0.5mg/kg 12시간마다, 푸로세미드 0.5~1.0mg/kg 12~24시간마다 정맥주사다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">제3위 식체</div>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>임상 질병으로 정의하기 어렵고 보통 부검이나 개복 때 제3위가 크고 지나치게 단단한 것으로 진단한다. 질기고 섬유질 많은 사료, 특히 밀짚을 먹일 때 생긴다고 알려져 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>반복되는 소화불량, 제1위 운동 감소, 드물고 적은 변, 곡류 거부, 케톤 음성을 보인다. 우측 늑골궁 아래나 우측 제7~9늑간을 깊이 누르면 통증과 단단한 장기가 느껴질 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>심한 경우 식욕이 완전히 없어지고 배변이 멈추며 직장이 비어 있고, 아급성 복통으로 움직이거나 눕기를 싫어한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>제4위 식체와 비슷하나, 제3위 식체는 임신 말기에 오고 식욕부진, 적은 변, 정상 제1위 운동, 중등도 탈수를 보이며 커진 제3위는 대개 개복해야 만져진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>치료는 미네랄오일을 하루 4L씩 최소 3일 반복 투여하는 것이 권장되고 효과가 있어 보이지만 임상시험으로 확인되지는 않았다. 가스트린과 모틸린이 늘어 있어 에리스로마이신 같은 운동촉진제는 효과가 없을 것으로 본다.</span></p>
</div>
<div class="bx"><div class="bx-title">송아지 제4위 고창증</div><p class="bx-num"><span class="bxn" data-n="107">•</span><span>Clostridium perfringens, Campylobacter, Sarcina 같은 가스 생성균과 제4위 배출을 늦추는 요인이 함께 작용하는 것으로 본다. 삼투압 높은 대용유나 경구 전해질액, 잘못 탄 대용유, 하루 한 번 많은 양 급여, 찬 우유, 물을 주지 않음, 들쭉날쭉한 급여 시간, 초유 수동면역 실패가 위험 요인이다.</span></p><p class="bx-num"><span class="bxn" data-n="108">•</span><span>주로 2~6주령 포유 송아지에서 갑자기 배가 양쪽으로 부풀고 기운이 빠져 누우며 쇼크에 빠진다. 아랫배 전체에서 크기가 다른 핑과 출렁이는 소리가 나고, 버킷 급여 송아지에 더 많은 것 같다. 흔히 48시간 안에 갑자기 죽는다.</span></p><p class="bx-num"><span class="bxn" data-n="109">•</span><span>송아지를 반듯이 눕혀(등을 바닥에) 배꼽과 검상연골 사이 가장 높은 곳에 14G, 50mm 바늘을 찔러 가스를 뺀다. 이 방법으로 21마리 중 20마리를 합병증 없이 치료했다. 선 채로 찌르면 잘 안 빠지고 복막염 위험이 높으며, 반복 천자도 복막염 위험이 크다. 천자 뒤 나빠지거나 재발하면 염전 가능성이 있어 우측 겸부 개복을 한다.</span></p><p class="bx-num"><span class="bxn" data-n="110">•</span><span>탈수와 전해질 이상을 정맥 수액으로 바로잡고, 클로스트리디움을 겨냥해 프로카인 페니실린 주사나 경구 베타락탐 항생제를 쓸 수 있다. 프로카인 페니실린(procaine penicillin) 22,000 U/kg을 하루 한 번 근육주사한다. 위관을 넣어 냄새 나는 액체가 많이 빠지면 상태가 좋아지기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="111">•</span><span>수액과 위관에도 빨리 좋아지지 않으면 개복해 제4위를 비우고 궤양을 꿰맨다. 천공이 없고 저혈압이 회복되면 예후가 괜찮다.</span></p><p class="bx-num"><span class="bxn" data-n="112">•</span><span>예방은 포유 기구를 매번 소독하고, 우유나 대용유를 오염 없이 다루어 체온 정도로 데워 주며, 버킷보다 젖병으로 먹이고, 급여 횟수를 늘리는 것이다. 여러 마리가 걸리는 농장은 우유에 경구 페니실린을 섞어 막은 예가 있다. 급여량, 급여 시간, 우유 온도, 대용유 타는 방법, 기구 소독을 먼저 점검하는 것이 클로스트리디움 백신보다 효과적인 경우가 많다.</span></p></div>
<div class="bx"><div class="bx-title">제4위 궤양</div>
<div class="bx-sub"><div class="bx-subtitle">원인·분류</div>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>모든 나이에서 생긴다. 다 큰 소는 대부분 분만 후 첫 달에 자궁염, 유방염, 케톤증, 제4위 전위 같은 병과 같이 온다. 출혈성 궤양의 절반가량은 림프육종 때문이고 대개 6세 이상이다. 소염진통제도 원인이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>곱게 간 고에너지 산성 사료, 분만 직전도 위험 시기이고, 송아지는 하루 두 번 많은 양의 우유를 먹이는 것이 관련될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>1형 비천공(증상 없거나 가벼운 식욕 감소, 분변 잠혈), 2형 비천공 대량출혈(빈혈, 창백, 흑색변, 빈맥), 3형 천공 국소 복막염(창상성 제2위복막염과 아주 비슷), 4형 천공 범발성 복막염(초기 발열 뒤 저체온, 장 마비, 쇼크)으로 나눈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>포유 중인 육우 송아지의 궤양은 대부분 증상 없이 죽은 채 발견되고, 죽은 송아지는 성장이 평균 이상인 경우가 많았다. 86%가 2개월령 미만이고 93%가 천공성이었다. 제4위 털뭉치가 흔히 같이 있지만 원인이라고 볼 수는 없다. 생후 4일~이유 사이 죽은 육우 송아지에서 육안으로 3.9%, 조직검사로 18.9%의 궤양이 확인되었다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>대량 출혈은 체온이 정상이고 흑색변이 뚜렷하며, 점막이 분필처럼 하얗고 맥이 약하며 분당 100~140회로 빠르다. 회음부와 꼬리에서 소화된 피의 달큰한 냄새가 난다. 출혈이 적으면 사료에 관심을 보이다 몇 입 먹고 그만두고 가끔 이를 간다. 흑색변, 복통, 창백한 점막 중 하나 이상이 약 70%에서 보이고, 흑색변은 4~6일 간다.</span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>흑색변은 출혈 시작 후 18~24시간 지나야 보일 수 있다. 분변 잠혈검사는 1형 궤양을 찾는 데 도움이 되고, 여러 번 검사하면 민감도가 오른다. 잠혈검사는 직장검사 전에 받은 변으로 해야 위양성이 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>천공에 의한 국소 복막염은 대개 39.4~40.6℃ 열, 제1위 운동 저하, 복통이 있고 깊이 누르면 정중선 오른쪽 아랫배가 아프다. 감염이 막히면 며칠 안에 증상이 가라앉는다. 범발성은 24시간 안에 패혈성 쇼크가 오고 심박이 100회를 넘으며 이를 갈거나 신음한다. 처음부터 체온이 떨어져 있으면 대개 12~36시간 안에 죽는다. 제2위에 자석이 있는 소에서 복막염이 보이면 창상성보다 궤양 가능성이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>감별은 림프육종, 제4위 좌측전위, 제4위 염전, 장중첩, 십이지장 궤양, 출혈성 장증후군이다. 장중첩과 출혈성 장증후군의 변은 검은색이 아니라 검붉은 잼 색에 가깝다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>고에너지 사료를 빼고 양질 건초를 주며 칸에 가둬 안정시킨다. 사료가 제4위 산도를 완충하므로 식욕 회복이 치료의 가장 큰 목표다. Ht가 14% 이하로 떨어지면 수혈하는데 보통 전혈 4~6L 한 번이면 된다. 복막염이 의심되면 광범위 항생제를 쓴다. 소염진통제와 코르티코스테로이드는 궤양을 악화시키므로 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>제산제는 산화마그네슘을 400kg당 하루 500g 2~4일, 또는 고령토·펙틴 혼합액 2~3L 하루 두 번 준다(산화마그네슘 450kg당 하루 500~800g 2~4일이 경험적으로 쓰였고 고령토·펙틴은 더 이상 권하지 않는다고 적은 책도 있다). 송아지는 제산제 25~50mL를 8시간마다, 라니티딘 50mg/kg 8시간마다, 오메프라졸 4mg/kg 24시간마다 먹인다. 성우는 먹인 약이 제1위에서 희석되어 효과가 의심스럽다.</span></p>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>예방은 사료를 갑자기 바꾸지 않고, 정상 반추가 되도록 입자가 충분한 섬유를 준다. 과밀, 지나친 경쟁, 나쁜 환경 같은 스트레스를 줄이고 소백혈병 감염우를 없앤다. 송아지는 우유에서 마른 사료로 천천히 넘어가게 한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">제4위 식체</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>질 나쁘고 거친 조사료만 먹이는 번식 육우에서 주로 생기며, 에너지 요구를 채우려고 제1위가 허락하는 만큼 먹다 보니 큰 입자가 제4위에 쌓인다. 모래나 자갈을 먹거나 이식증이 있어도 생긴다. 질 낮은 목초지나 잘게 썬 저품질 조사료, 특히 추운 날씨에 많고 임신우에서 더 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>창상성 제2위복막염이나 천공성 궤양에 따른 복막염이 흔한 속발 원인이다. 부검 예의 20%는 창상성 제2위복막염 병변이 있었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>며칠~몇 주에 걸쳐 섭취량이 줄고 평소보다 단단한 변이 적게 나오며 우측 하복부가 커진다. 제1위 수축은 횟수는 정상이거나 많지만 약하고, 나중에는 멈춘다. 진행하면 누워서 숨쉴 때마다 신음한다. 맥박과 호흡은 죽기 직전까지 대개 정상이다. 콧구멍에 점액이 고이고 코가 마르고 갈라진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>제4위가 우측 늑골궁 뒤에서 단단한 덩어리로 만져질 수 있다. 직장검사로 제1위가 커져 복낭이 오른쪽까지 차는 L자 모양을 느끼고, 변은 거의 없이 점액만 묻어 나온다. 번식 육우는 임신 자궁 때문에 제4위가 안 만져질 수 있다. 비임신 비육우는 직장검사로 제4위와 제3위가 만져질 수 있고 둘은 구별이 안 될 수도 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">검사·감별</div>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>대사성 알칼리증, 저클로르혈증, 저칼륨혈증, 혈액 농축이 흔하고 백혈구는 정상 범위다. 유문동에 국한된 식체가 몸통까지 간 식체보다 저클로르혈증이 심하다. 사료성 식체의 제1위액 pH는 대개 정상(6.5~7.0)이고 원충 활성은 정상~크게 감소다.</span></p>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>제2·3위 구멍 통과 장애는 제1위가 액체로 크게 늘어나도 탈수가 가볍고 제1위액 클로라이드가 정상이며 혈청 전해질 이상이 적다. 유문 배출 장애(내부 구토)로 고클로라이드 제4위 내용이 역류하면 탈수가 심하고 제1위액 클로라이드가 오르며(정상 30mEq/L 미만) 저클로르·저칼륨 대사성 알칼리증과 역설적 산성뇨가 온다. 제1위액 클로라이드가 높으면 막힌 곳이 유문 쪽이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>미주신경성 소화불량에서 저클로르혈증은 제4위 역류를 뜻하고 III형(유문 배출 장애)·IV형(임신 말기)에서 보이며 50mEq/L 미만은 예후가 극히 나쁘다. 대사성 알칼리증은 II(제3위 통과 장애)·III·IV형, I형(트림 장애)은 식도 폐색 때 침 중탄산 손실로 대사성 산증이 올 수 있다. 제1위액 클로라이드 30mEq/L 초과는 염산 역류다. 제4위 식체의 대사성 알칼리증은 염화나트륨 정맥주사로 쉽게 교정된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>창상성 제2위복막염 합병증은 대개 임신 말기 한 두에서 오고 검상연골 뒤 깊은 촉진에 신음하며 며칠째 앓은 경우가 많다. 사료성은 앓은 지 며칠 안 되었고 여러 두가 걸릴 수 있다. 제4위 전위, 림프육종, 미주신경성 소화불량과도 구별한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>대개 늦게 발견되어 치료가 보람이 없고, 도축 출하가 가장 경제적인 경우가 많다. 치료로 풀리지 않으면 심한 증상이 나타나고 며칠 안에 죽는다. 젖소에서 유문동만 막힌 경우 단기 예후 93%, 제4위 전체는 50%였다. 쇠약하고 빈맥(100~120회)이 뚜렷하면 경제적 가치가 낮을 때 도태한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>초기 예는 소화 잘 되는 사료, 적극적인 수액, 미네랄오일 하루 4L 경구 투여로 풀릴 수 있다. 하제는 디옥틸 소디움 설포석시네이트 하루 50mg/kg, 황산마그네슘 하루 2.5g/kg, 미네랄오일 하루 8mL/kg, 수산화마그네슘 하루 1g/kg 중에서 고른다. 25% 디옥틸 소디움 설포석시네이트 450kg당 120~180mL를 따뜻한 물 10L, 미네랄오일 5L와 섞어 매일 3~5일 위관으로 넣는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>수액은 균형 전해질액을 24시간에 100~150mL/kg 속도로 최대 72시간 정맥에 계속 넣는다. 수액과 미네랄오일 경구 투여를 함께 하면 48시간 안에 반추와 배변이 시작되는 소가 있다. 하트만은 대사성 알칼리증을 악화시킬 수 있어 조심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>운동촉진제는 에리스로마이신 8.8~10mg/kg 하루 두 번 근육주사가 가장 효과적이지만 항생제를 이 목적으로 쓰는 것은 권하지 않는다. 베타네콜 0.07mg/kg 피하주사 하루 세 번은 가능성만 있고, 메토클로프라미드는 효과가 없다. 막힘을 풀기 전에 운동촉진제를 쓰면 제4위 파열 위험이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>코르티코스테로이드나 프로스타글란딘으로 분만을 유도하면 소가 편해진다. 분만 2주 이내이고 며칠 치료해도 반응이 없으면 덱사메타손(dexamethasone) 20mg 근육주사로 유도한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>모래 식체는 모래땅에서 옮기고 좋은 건초와 당밀·미네랄을 섞은 목초를 준다. 심하면 미네랄오일을 하루 15L 이상 많이 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>추위와 바람에 바깥에서 지내는 소는 유지 에너지 요구가 크게 늘어 짚이나 옥수숫대만으로는 부족하다. 농후사료와 더 좋은 조사료를 주고 겨울 동안 체형점수를 살펴 보충 시기를 놓치지 않는다. 질 낮은 조사료를 쓸 때는 조단백과 가소화에너지를 분석해 곡류를 보충한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">제4위 전위·염전</div>
<div class="bx-sub"><div class="bx-subtitle">좌측전위</div>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>분만 후 첫 6주가 정점이지만 비유·임신 어느 시기에도 생기고, 황소와 송아지도 걸린다. 이유 전 송아지는 대개 우측전위다. 육우에서도 보고되나 드물고, 분만과 무관한 예는 발정 때 올라타는 행동이 흔한 병력이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>농후사료부터 안 먹고 식욕이 떨어지며 케톤증이 대개 같이 있다. 변은 정상이거나 무르고 양이 준다. 체온·심박·호흡은 다른 병이 없으면 정상이다. 마지막 갈비뼈 한두 개가 벌어져 보이지만 겸부는 꺼져 있다. 전위가 있어도 반추하는 경우가 드물지 않다. 케톤증으로 치료해 며칠 좋아졌다가 재발한 소에서 전위가 진단되는 경우가 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>핑은 좌측 하복부 1/3 제8늑간부터 겸부까지 어디서나 들릴 수 있다. 대개 요각과 팔꿈치를 잇는 선 위에 있고 앞쪽으로 최소 9번, 흔히 8번 갈비뼈까지 이어진다(좌측 9~12번 늑골 위 1/3을 튕기며 청진하라고 적은 책도 있다). 송아지는 갈비뼈 뒤 겸부 쪽에서 들려 놓치기 쉽다. 수송 뒤 핑이 안 들리는 경우도 있으니 왼쪽 배 전체를 두드려 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>좌측 겸부에서 정상 긁는 소리 대신 꾸르륵·찰랑 소리가 난다. 청진하며 흔들면 큰 액체 장기의 출렁 소리가 난다. 겸부가 움직이는데 제1위 소리가 안 들리면 전위를 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>제1위 고창, 기복증, 꺼진 제1위, 자궁 가스, 드물게 맹장도 왼쪽에서 핑을 낸다. 위관에 조수가 바람을 불어 넣으며 왼쪽을 청진하면 제1위를 가려낼 수 있다. 제1위 핑은 제4위 핑만큼 아래로 내려오지 않고 출렁 소리와 높은 음이 없으며, 제1위 수축이 강하게 만져지면 제1위 핑일 가능성이 낮다.</span></p>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>소변 케톤은 대개 양성이다. 반응이 강할수록 원발성 케톤증일 가능성이 높다. 식욕이 돌아와도 간헐적이고 골라 먹으며 특히 건초만 먹는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>단순 전위는 대개 직장으로 만져지지 않고, 염전은 흔히 만져진다. 아주 드물게 제1위 왼쪽에서 제4위가 만져지거나 제1위가 안쪽으로 밀린 것을 느낀다.</span></p>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>심한 간 지방증이 같이 있으면 회복이 느리고 불완전해 예후를 조심스럽게 본다. 만성 소화불량에 따라 생긴 전위는 원래 병이 더 심해 예후가 나쁘다. 열과 기복증이 있으면 궤양 천공을 의심하고 예후를 조심스럽게 본다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">우측전위·염전</div>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>단순 우측전위는 좌측의 10~15% 정도로 생긴다. 염전은 모든 종류의 소에서 생긴다. 육우 품종에서도 1개월~6세(중앙값 10개월) 사이에 기록되었고 대개 1세 미만이었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>우측전위의 전신 상태는 좌측전위와 같고, 핑은 대개 오른쪽 위쪽 절반의 마지막 다섯 갈비뼈 아래에 국한된다. 핑이 앞쪽으로 9번이나 8번 갈비뼈까지 이어지는지 확인해야 결장·맹장 가스와 헷갈리지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>염전은 탈수가 진행해 눈이 꺼지고 피부 탄력이 떨어지며, 심박이 100회를 넘고 맥이 약하다. 양쪽 배가 부풀고 제1위가 완전히 멈춘다. 위장이 크게 늘어나도 복통은 드물다. 피부가 차고 변은 없거나 묽고 적다. 오른쪽 8번 갈비뼈부터 겸부 중간까지 음높이가 고른 넓은 핑이 들리고, 핑 아래 경계가 수평선이며 흔들면 출렁 소리가 난다. 우측전위보다 침울하고 불안해 보이며, 심박은 60회 미만의 서맥부터 110회까지 다양하고, 직장으로 제4위가 더 잘 만져진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>누워서 침울해지면 몇 시간 안에 죽으며, 이는 염전 뒤 1~3일 사이다. 변은 48시간 안에 피가 섞이거나 흑색변이 되고, 교정하지 않으면 누워서 48~96시간 안에 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>송아지 급성 염전은 갑자기 식욕이 없어지고 배를 차며 등을 내리고 울부짖고 힘주는 심한 복통을 보인다. 심박 120~160회, 배가 부풀어 팽팽하고 우측에서 뚜렷한 핑이 들리며, 우측 늑골궁 뒤의 긴장된 장기는 조금만 눌러도 아파한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>우측 핑의 감별은 맹장 확장(염전 포함), 나선결장 가스, 직장검사 뒤 직장 가스, 기복증, 자궁 가스, 십이지장 S자 굴곡 염전, 제4위 염전이다. 맹장과 직장의 핑은 요추 횡돌기 바로 아래에서 요각까지 띠 모양으로 들리고, 직장검사로 가스 찬 장기를 확인한다. 기복증은 양쪽 등쪽 전체에서 들린다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">산염기·예후</div>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>전위에서는 염산이 제4위에 갇히거나 제1·2위로 역류해 대사성 알칼리증이 온다. 혈액 pH와 중탄산이 조금 오르고 클로라이드가 조금 내린다. 알칼리증과 섭취 감소로 저칼륨혈증이 올 수 있다. 단순 전위는 저클로르·저칼륨 대사성 알칼리증이 가볍거나 중등도라 집중 교정이 필요한 경우가 드물다. 만성이거나 다른 병이 겹쳐 식욕부진이 심하면 더 적극적으로 교정한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>케톤증이 심하면 혈액 pH가 산성 쪽이고 음이온차가 크며 중탄산이 예상보다 낮을 수 있어 소변 케톤을 늘 본다. 오래되거나 심한 알칼리증은 역설적 산성뇨를 일으킨다. 탈수에서 나트륨을 최대로 재흡수하는데 클로라이드가 모자라고 칼륨도 심하게 모자라면 수소이온을 내보내, 알칼리증인데도 소변이 산성이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>염전은 혈액 농축과 중등도~심한 저클로르·저칼륨 대사성 알칼리증이다. 혈청 클로라이드는 초기 80~90, 방치·중증 65~80mEq/L다. 클로라이드와 염기과잉은 예후와 대체로 비례한다. 아주 진행되면 괴사·쇼크·젖산 산증이 알칼리증을 덮어 검사값이 정상이나 산증 쪽으로 나오므로, 큰 염전·심한 탈수·사지 냉감·직장으로 만져짐·허약에 이런 값이면 예후가 극히 나쁘다. 알칼리증 보상과 복부 팽만으로 호흡성 산증이 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>예후는 클로라이드·수화 상태와 비례하고 수술 전 심박, 염전 기간, 혈장 젖산, 음이온차와 반비례한다. 음이온차 30mEq/L는 예후 불량을 뜻하고 혈청 클로라이드나 염기과잉보다 정확했다. 수술 전 L-젖산 2mmol/L 이하는 좋은 결과, 6mmol/L 이상은 예후 불량이고 수술 뒤 젖산이 떨어지면 좋은 징후다(현장에서 2~3분에 측정). 다만 이 값만으로 수술을 거부하지 않는다. 대사성 산증이면서 누워 있으면 극히 나쁘고, 대사성 산증인데 저클로르·저칼륨혈증이 있으면 심한 케톤산증도 확인한다. 심박, 염기과잉, 혈청 클로라이드로 만든 수술 전 생사 예측 모형도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>늘어난 제4위를 천자하면 원충 없는 pH 2~4 액이 나오고 염전이면 혈액이 섞일 수 있다. 24시간 넘은 염전은 수술 후 생존율이 50% 미만이고 48시간 넘으면 예후가 극히 나쁘다. 누워 있으면 예후가 아주 나쁘다. 수술 뒤 흑색변, 식욕부진, 계속되는 빈맥, 탈수가 있으면 예후가 나쁘고, 72시간 지나도 묽고 적은 변이 계속되면 합병증을 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>정맥혈 산염기 값은 대략 아래와 같다. *큰 염전에 쇼크·조직 괴사가 겹쳐 대사성 산증이 알칼리증 위에 더해진 경우. **제4위 문제는 심해 보이지 않지만 케톤산증이 정맥혈 pH와 음이온차에 영향을 준 경우로 신경형 케톤증을 예상해야 한다.<table class="bxt"><tr><th>정맥혈</th><th>pH</th><th>Cl(mEq/L)</th><th>K(mEq/L)</th><th>HCO3(mEq/L)</th><th>염기과잉</th></tr><tr><td>정상</td><td class="c">7.35~7.50</td><td class="c">97~111</td><td class="c">3.7~4.9</td><td class="c">20~30</td><td class="c">-2.5~+2.5</td></tr><tr><td>전형적 좌측전위</td><td class="c">7.45~7.55</td><td class="c">85~95</td><td class="c">3.5~4.5</td><td class="c">25~35</td><td class="c">0~10</td></tr><tr><td>전형적 우측전위</td><td class="c">7.45~7.60</td><td class="c">85~95</td><td class="c">3.0~4.0</td><td class="c">30~40</td><td class="c">5~15</td></tr><tr><td>큰 우측전위</td><td class="c">7.45~7.60</td><td class="c">80~90</td><td class="c">3.0~3.5</td><td class="c">35~45</td><td class="c">5~20</td></tr><tr><td>전형적 염전</td><td class="c">7.45~7.60</td><td class="c">75~90</td><td class="c">2.5~3.5</td><td class="c">35~50</td><td class="c">10~25</td></tr><tr><td>진행된 염전</td><td class="c">7.45~7.65</td><td class="c">60~80</td><td class="c">2.0~3.5</td><td class="c">35~55</td><td class="c">10~35</td></tr><tr><td>제4위 괴사 동반 아주 진행된 염전*</td><td class="c">7.30~7.45</td><td class="c">85~95</td><td class="c">3.0~4.5</td><td class="c">15~25</td><td class="c">-10~0</td></tr><tr><td>심한 케톤증 동반 좌측전위**</td><td class="c">7.15~7.30</td><td class="c">85~95</td><td class="c">3.5~4.5</td><td class="c">15~30</td><td class="c">-10~0</td></tr></table></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료</div>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>단순 좌측전위는 하제, 반추촉진제, 제산제를 먹이고, 저칼슘혈증이면 칼슘을 피하나 정맥(천천히)으로 준다. 굴리기는 단순 좌측전위에만 하고 우측전위나 염전에는 절대 하지 않는다. 굴린 뒤 건초를 최대한 먹여 제1위를 채운다. 내과 치료만으로 100두 중 30두가 그 비유기 내내 재발하지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>교정 뒤에는 장이 정상으로 돌아오므로 경구 수액과 전해질로 충분한 경우가 많다. 염화칼륨 약 57~113g을 하루 한두 번 먹인다. 가벼운 염전 수술 뒤에는 물 20~40L와 염화칼륨 30~120g 하루 두 번 경구 투여로 충분하다. 우측전위 수술 뒤 염화나트륨과 염화칼륨을 각각 50~100g 먹인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>에리스로마이신(erythromycin) 10mg/kg을 수술 전에 근육주사하면 염전 소의 제4위 운동이 좋아진다. 8.8~10mg/kg 근육주사가 가장 효과적이지만, 항생제를 항균 외 목적으로 쓰면 내성을 키울 수 있어 적절하지 않다. 메토클로프라미드(metoclopramide)는 소의 제4위 배출을 늘리지 못한다. 베타네콜(bethanechol) 같은 부교감신경 작용제는 효과를 보인 임상시험이 없다. 칼슘과 칼륨은 저칼슘혈증, 저칼륨혈증이 뚜렷할 때 효과가 있을 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>준임상 케톤증을 적극 찾아 프로필렌글리콜로 치료하면 전위와 케톤증 위험이 준다. 칼슘, 포도당 정맥주사, 프로필렌글리콜 같은 당원 전구물질 경구 투여, 플루닉신을 보조로 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>굴려 눕혀 바늘로 꿰는 고정법(블라인드 태크, 토글)은 빠르고 싸지만, 제4위를 놓치거나 유문을 묶거나 다른 장기를 꿰는 합병증이 흔하다. 단순 전위는 48~72시간 안에 식욕이 뚜렷이 좋아져야 하고, 나빠지면 봉합을 풀어야 하며 토글은 10~14일 넘게 두지 않는다. 14일과 60일 도태율이 10%, 20%로 서서 하는 겸부 절개 교정(3%, 7%)보다 높았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>초기 저칼륨·저클로르 알칼리증과 탈수에는 0.9% 식염수 20~80L에 염화칼륨 25~100mEq/L를 넣어 정맥주사한다. 칼륨은 시간당 1mEq/kg를 넘기지 않고, 혈청 칼륨을 모르면 0.5mEq/kg 미만으로 한다. 대사성 산증이 된 진행 예는 링거액 같은 균형 전해질을 쓴다. 검사실이 없으면 등장 식염수(0.85%) 2L, 등장 염화칼륨(1.1%) 1L, 5% 포도당 1L 혼합액을 시간당 4~6L 정맥주사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>대사성 알칼리증 성우의 경구 산성화 수액은 소금 180g + 물 20L, 또는 소금 140g + 염화칼륨 50g + 염화칼슘 10g + 물 20L, 또는 7.2% 식염수 2.5L + 물 20L다. 대사성 산증 성우의 경구 알칼리화 수액은 중조 250g + 물 20L이고 필요 중탄산(mEq) = 체중(kg) × 염기결핍(mmol/L) × 0.3이다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">간농양</div>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>대개 혐기성균의 혼합감염이고 Fusobacterium necrophorum이 주원인균으로 간농양의 85%에서 분리된다. 류코톡신을 많이 내는 아종 necrophorum이 더 독해 간농양에서 더 흔하다(아종 necrophorum 71~95%, 아종 funduliforme 5~29%). Trueperella pyogenes가 두 번째로 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>갑자기 고에너지 사료로 바꾸거나, 급여 방식을 바꾸거나, 소를 지나치게 굶기거나, 맛없는 사료를 주거나, 조사료를 아주 적게 주면 산증성 제1위염이 생긴다. 사료 속 이물, 날카로운 사료 입자, 털이 제1위 손상을 키운다. 길고 마르고 거친 건초도 제1위 벽을 뚫어 위험을 높인다. 송아지는 지저분한 분만 환경과 초유 부족으로 배꼽 감염이 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>농양이 수백 개 있어도 증상이 거의 없고 도축 때에야 발견된다. 얕은 농양이 터지거나 후대정맥을 뚫으면 다른 장기로 퍼져 죽는다. 열, 식욕부진, 뻣뻣한 걸음, 설사, 화농성 관절염을 보이기도 한다. 큰 농양은 우측 뒤쪽 갈비뼈 위를 타진하면 아파하고 등을 굽히며, 배꼽 감염 송아지는 7일령쯤 증상을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>혈액검사와 간기능검사는 좋은 지표가 아니다. 급성은 창상성 제2위복막염과 비슷해 통증 위치로 구별한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>F. necrophorum과 T. pyogenes는 페니실린과 마크로라이드에 감수성이지만, 완전 회복이 어려워 항생제 치료는 실제로 거의 하지 않는다. 쓸 때는 페니실린, 암피실린, 옥시테트라사이클린을 아주 높은 용량으로 오래 쓰며, 옥시테트라사이클린을 많이 주면 저칼슘혈증이 올 수 있다. 프로카인 페니실린 G 44,000 IU/kg 24시간마다 근육주사, 옥시테트라사이클린(oxytetracycline) 10mg/kg 24시간마다 근육주사 또는 장기지속형 20mg/kg 72시간마다 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>예방은 고곡류 사료에 천천히 적응시키고, 적게 주거나 많이 주는 일을 피하며, 급여 횟수를 늘려 섭취를 고르게 하고, 조사료 비율을 높이며, 배합을 고르게 하고 사료조 공간과 깨끗한 물을 충분히 준다. 배꼽 소독과 충분한 초유로 송아지 배꼽 감염을 막는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="172">•</span><span>미국 비육장은 사료에 타이로신(tylosin)을 톤당 8~10g 또는 두당 하루 60~90mg 넣어 간농양을 40~70% 줄인다(두당 하루 90mg으로 73% 줄었다는 기술도 있다). EU 등 여러 나라는 사료에 예방 목적 항생제 첨가를 허용하지 않는다. F. necrophorum 세균 백신을 21일 간격으로 2mL씩 두 번 피하주사하면 발생과 정도가 줄었지만, 간농양이 적은(10%) 무리에서만 효과가 있고 많은(30%) 무리에서는 없었다.</span></p>
</div>
<div class="bx"><div class="bx-title">후대정맥 혈전증</div>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>대부분 제1위염에 따른 간농양, 특히 간문 가까이나 후대정맥 옆의 농양이 정맥을 뚫어 패혈성 혈전을 만들고, 떨어진 색전이 폐동맥에 걸려 폐농양과 동맥류를 만든다. 농양 수보다 위치가 중요하다. 비육우와 고에너지 사료를 먹는 젖소에 많고 1세 미만에서는 드물다.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>세 가지 모습이 있다. 아무 전조 없이 갑자기 죽는 형, 한 마리만 갑자기 심한 호흡곤란을 보이는 형, 코피·객혈·빈혈·만성 폐렴을 보이는 전형적인 형이다. 빈맥, 빠른 호흡, 호흡곤란, 기침, 흉골과 늑간을 깊이 누르면 통증, 넓은 범위의 쌕쌕음, 창백한 점막, 심잡음, 삼킨 피로 인한 흑색변을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>호흡기 증상에 빈혈, 넓은 범위의 쌕쌕음, 특히 객혈이 겹치면 이 병으로 본다. 코피를 흘리는 소에서 가장 흔히 보이는 증상이 객혈이다. 간이 커져 우측 겸부에서 간 끝이 만져지거나 복수가 생기기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="176">•</span><span>객혈이 보이면 대개 빠르게 나빠져 치료해도 죽고, 호흡기 대량 출혈로 갑자기 죽는 경우가 많다. 급성 호흡곤란형은 5~10일에 걸쳐 좋아지다가 평균 3~6주 뒤 코피가 나기 시작하고, 출혈이 보이면 대개 3주를 넘기지 못한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>예후가 아주 나빠 치료는 거의 하지 않고 도축 출하가 가장 현실적이다. 가치가 높은 소는 페니실린, 옥시테트라사이클린, 플로르페니콜을 몇 주~몇 달 쓰고, 심한 호흡곤란에는 푸로세미드 0.5~1mg/kg, 플루닉신 1.1~2.2mg/kg을 준다. 페니실린 22,000 U/kg 하루 두 번 근육주사를 오래 쓰기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>한 농장에 두 마리 이상 생기면 급여 프로그램을 점검하고 무리의 아급성 제1위 산증을 확인한다.</span></p>
</div>
<div class="bx"><div class="bx-title">요네병 <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">원인·전파</div>
<p class="bx-num"><span class="bxn" data-n="179">•</span><span>제2종 가축전염병(현행 가축전염병예방법)이다. 병원체는 Mycobacterium avium subsp. paratuberculosis다.</span></p>
<p class="bx-num"><span class="bxn" data-n="180">•</span><span>분만 장소, 어미 유방, 오염된 사료·급여 도구, 송아지 사육 공간이 주요 노출 지점이다. 신생 송아지가 가장 감수성이 높고 6개월이 넘으면 덜하며 1세면 성우와 같다. 임상형 어미 태아의 40%에서 태반 감염이 확인되었다. 감염우의 약 1/3이 증상과 관계없이 초유나 우유로 균을 내보낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="181">•</span><span>감염우 대부분은 도태될 때까지 증상을 보이지 않고, 감염률이 20~100%인 무리에서도 한 해 임상형은 성우의 5~10%를 넘기 어렵다. 임상형 1두가 있으면 15~20두가 더 감염되어 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>대표 증상은 호스로 뿜듯 나오는 물 같은 짙은 녹색 설사다. 이급후증(tenesmus)이 없고 혈액·점액·악취가 없으며 열, 탈수, 식욕부진이 없고 식욕이 좋다. 체중이 빨리 줄고 아래턱과 흉전에 부종이 생긴다. 임신 말기에 좋아졌다가 분만 직후 심하게 재발한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>증상은 대개 2~5세에 나타나지만 12개월 미만 미경산우나 8~10세 소에서도 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span>부검에서 회장 끝, 맹장, 결장 앞부분이 정상의 3~4배로 두꺼워지고 주름지며 회맹판이 두껍고 붉다.</span></p>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>감별은 심한 위장관 내부기생충, 신장 아밀로이드증, 구리 결핍, 만성 살모넬라증, 중독, 장 종양, 심부전, 사구체 신병증, 만성 소바이러스성설사, 소백혈병, 만성 제2위복막염이다. 콕시듐증과 내부기생충은 주로 어린 소에 오고 분변검사로 구별하며, 이차성 구리 결핍은 여러 두에 오고 구리 투여에 잘 반응한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>설사와 쇠약이 있는 성우를 확인할 때는 결과가 빠른 ELISA나 분변 PCR이 좋다. 그 농장에서 처음 나온 예라면 ELISA보다 분변 배양·PCR이나 부검(회장, 장간막 림프절 배양)으로 균을 확인한다. ELISA는 배출량이 적은 무증상우를 15% 정도만 잡지만 임상형은 90~100% 잡는다. 3세 미만 소는 감염되어 있어도 검사가 음성으로 나와 도입우 선별에 쓸모가 없다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="187">•</span><span>생산 현장에서는 치료하지 않는다. 치료해도 증상만 가라앉고 감염은 거의 없어지지 않으며 평생 매일 투약해야 하고, 태아 감염 가능성이 높아 태아를 살리려는 치료도 권하지 않는다. 치료는 오히려 배출 기간을 늘려 환경 오염을 키운다.</span></p>
<p class="bx-num"><span class="bxn" data-n="188">•</span><span>ELISA 값이 높은 소는 대량 배출우라 빨리 도태하고, 낮은 양성은 분만 장소와 초유 관리에 주의한다. 근절하려면 24개월령 넘는 모든 소를 여러 해 반복해서 분변 배양 검사해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="189">•</span><span>감염되지 않은 농장은 외부 도입을 막는 것이 기본이다. 새로 들인 소와 수소는 격리해 요네병을 포함한 검사 결과가 나올 때까지 번식우와 떼어 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="190">•</span><span>초유는 63℃에서 30분 저온살균하면 요네균이 죽는다. 60℃에서 60분 저어 가며 가열하면 균이 줄지만 완전히 없어지지 않을 수 있고, 같은 조건에서 IgG는 보존되고 요네균 노출 위험이 크게 준다. 송아지는 ELISA 음성, 가능하면 분변 배양 음성 어미의 초유를 먹이고, 여러 소의 초유를 섞어 먹이지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="191">•</span><span>번식우 농장은 분만 장소의 분뇨 오염, 포유 중인 어미의 몸과 유방 오염, 송아지가 성우 분변에 닿는 모든 경로를 막는 데 집중한다. 깨끗한 곳에서 낳게 하고, 이유 송아지는 성우와 떼며, 송아지 사료와 물이 성우 분변에 오염되지 않게 한다. 임신 말기 소가 있는 운동장에 분뇨가 쌓이지 않게 하고, 급이기·급수기 자리를 자주 옮기며, 임상형 어미의 송아지는 번식용으로 남기지 말고 비육한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">지방괴사증</div>
<p class="bx-num"><span class="bxn" data-n="192">•</span><span>원인은 모른다. 장쇄 포화지방산이 많은 사료, 미량원소 결핍, 외상, 호르몬 이상, 내생균에 감염된 톨 페스큐 섭취가 거론되고, 페스큐 중독의 한 형태로도 나타난다. 유전 소인도 거론되며 애버딘 앵거스와 저지에 더 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="193">•</span><span>대개 다 큰 소에 생기며 7세에 가장 많다. 살찐 중·노령우에 많고, 젖소보다 살찐 방목 육우에 더 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="194">•</span><span>장간막·대망의 단단한 덩어리가 장을 바깥에서 눌러 부분 또는 완전 폐색을 만든다. 완전 폐색 전에는 장이 눌려 설사를 자주 하고, 부분 식욕부진, 묽은 변 뒤 변이 거의 없어짐, 가끔 복부 팽만이나 가벼운 복통을 보이는 애매한 병이다. 체중 감소, 혈변, 복부 팽만, 우측 핑이 있을 수 있고, 폐색이 심해지면 열, 빈맥, 이급후증(tenesmus), 이갈이가 보인다. 골반강의 괴사 지방 덩어리로 난산이 올 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>증상 없는 소의 직장검사나 부검에서 우연히 발견되는 경우가 많다. 장을 둘러싸는 큰 덩어리가 직장으로 만져지며 종양과 비교해도 유난히 단단하고, 직장검사에서 태아로 착각하기 쉽다. 직장이 좁아져 직장검사가 불가능하거나 직장 손상 위험이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="196">•</span><span>감별은 림프육종, 장 선암, 복강 농양, 장폐색이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="197">•</span><span>증상 없는 지방괴사에 이소프로치오란 하루 20g을 8주간 먹인 시험에서 약 절반이 12주째 덩어리가 50% 줄었고, 1년 뒤 살아 있는 소의 절반은 덩어리가 만져지지 않았다. 증상이 나타난 소는 대개 치료하지 않는다. 예후는 대개 절망적이지만 드물게 국소 덩어리를 잘라내고 장을 이을 수 있는 경우가 있다.</span></p>
</div>
</div>
`;
}
function med_respHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 호흡기</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">소 호흡기질병(BRD)</div>
<div class="bx-sub"><div class="bx-subtitle">개요·원인</div>
<p class="bx-num"><span class="bxn" data-n="1">•</span><span>소 호흡기질병(BRD)은 호흡과 관련된 모든 기관의 염증을 통틀어 일컫는다. 한 원인이 한 곳에 병을 일으키는 것이 아니라서 호흡기질병 증후군(BRDC)이라고도 부른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="2">•</span><span>세 가지로 나눈다.<table class="bxt"><tr><th>구분</th><th>부위</th><th>특징</th></tr><tr><td>상부 호흡기 감염</td><td>콧구멍·인두·기관</td><td>기침·콧물·열·체중감소 정도로 대개 심하지 않다</td></tr><tr><td>디프테리아</td><td>주로 후두</td><td>호흡 잡음, 후두 부종으로 폐사하기도 한다</td></tr><tr><td>폐렴</td><td>하부 호흡기</td><td>수송열·유행성 송아지폐렴이 여기에 든다</td></tr></table></span></p>
<p class="bx-num"><span class="bxn" data-n="3">•</span><span>간접 원인(스트레스)으로 면역이 떨어진 상태에서 직접 원인인 바이러스·세균에 노출되어 감염된다.<table class="bxt"><tr><th>구분</th><th>종류</th><th>내용</th></tr><tr><td>간접 원인</td><td>스트레스</td><td>장거리 수송, 사육장소 변경(1~2주째), 합사와 분리, 여러 곳에서 사 온 소의 혼사, 좁은 공간 밀집사육, 환기 불량, 먼지, 다습, 암모니아·황화수소·이산화탄소 같은 유독가스(호흡기 점막 섬모의 이물 제거 기능을 떨어뜨린다), 갑작스런 기온 변화와 10℃ 이상의 심한 일교차, 장마철·환절기, 장기간 물·사료 미섭취, 과격한 운동·불안 지속, 다른 질병·수술로 인한 체력 저하, 초유 미섭취, 예방접종 결여</td></tr><tr><td rowspan="3">직접 원인</td><td>바이러스</td><td>소전염성비기관염(IBRV), 소바이러스성설사(BVD), 파라인플루엔자3(PI3V), 소합포체성폐렴(BRSV), 소아데노바이러스 3·7형, 코로나·라이노·레오바이러스 등</td></tr><tr><td>세균</td><td>Mannheimia haemolytica(Mh), Pasteurella multocida(Pm), Histophilus somni(Hs), Mycoplasma(Mp), Corynebacterium, 포도상구균, 방선균, 슈도모나스, 대장균</td></tr><tr><td>기생충·곰팡이</td><td>폐충, 아스퍼질러스</td></tr></table></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>증상은 스트레스나 새 소 접촉 후 6~10일에 나타난다. 초기에는 무리에서 떨어져 사료에 다가오지 않고 머리와 귀를 평소보다 낮게 든다. 진행하면 호흡이 빠르고 얕아지며 코를 자주 핥고 습성 기침을 한다. 체온은 40~41℃다.</span></p>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>발열은 다른 증상보다 24~36시간 먼저 나타날 수 있다. 발생 중인 우군에서 겉보기에 정상인 소의 20% 이상이 40~41℃ 발열만 있을 수 있고, 이 단계에서 치료 반응이 매우 좋다. 발생을 확인하면 같은 무리의 체온을 모두 재서 열이 있는 소를 일찍 치료한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>이유·수송 직후처럼 위험이 큰 무리는 처음 1~2주 동안 최소 하루 1회 살핀다. 기침·콧물·호흡곤란이 멀리서도 보이면 이미 진행된 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>청진에서 흉부 앞아래쪽(전복측)의 거친 기관지폐포음과 습성·건성 수포음이 들리고, 경화된 부위는 공기가 움직이지 않아 소리가 없다. 아래쪽 폐가 경화되면 거친 호흡음은 들리지만 타진하면 탁음이다. 섬유소성 흉막염이 생기면 아파서 움직이려 하지 않고 호흡이 얕으며 흉막 마찰음이 들리기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>폐렴은 세 갈래로 나누어 본다.</span></p><p class="bx-num"><span class="bxn" data-n="9">•</span><span>기관지폐렴은 기도로 들어온 병원체가 원인이다. 침울, 발열, 점막·공막 충혈 같은 패혈 증상이 있고 이상 폐음과 병변이 앞아래쪽에 있다. 바이러스성 원인도 여기에 든다.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>간질성 폐렴은 대개 비감염성으로 독소·알레르기원을 먹거나 들이마셔 생긴다. 침울·패혈은 덜하지만 호흡곤란이 심하고 빨리 죽을 수 있으며, 이상 폐음이 폐 전체에 퍼져 있고 항생제에 거의 반응하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="11">•</span><span>전이성 폐렴은 간농양·후대정맥 혈전 같은 다른 곳의 감염이 폐로 퍼진 것으로, 패혈 증상과 폐 전체의 병변을 보이다 결국 객혈을 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>감별할 병은 간질성 폐렴, 폐수종, 흉막염, 후두염, 기관염, 폐충, 이물성 폐렴, 폐섬유화이고 드물게 흉강 종양, 횡격막 탈장이다. 호흡기 외 원인으로 패혈증, 심부전, 산염기 이상, 질산염 중독이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>호흡성 산증은 pH 저하와 pCO2 상승이 특징이고 보상되면 중탄산이 오른다. 폐포 환기 감소로 생기며 심한 폐 질환, 고창, 신생 무호흡에서 보이고 상기도 폐색, 후두 부종, 폐렴이 흔한 원인이다. 정상 정맥혈은 pH 7.35~7.50, pCO2 34~45mmHg, 중탄산 20~30mmol/L다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방·백신</div>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>예방의 핵심은 스트레스 요인(수송, 여러 출처 혼합, 이유·거세·제각, 환기 불량, 밀사)을 줄이고 초유 수동면역을 확보하는 것이다. 백신은 그 다음이다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>겨울 축사는 습도가 85%를 넘기 쉽다. 송아지 축사 환기는 겨울 시간당 최소 4회, 여름 최대 40회다. 벽·천장에 물이 맺히거나 암모니아 냄새가 나면 환기가 부족한 것이다. 환기가 나쁜 따뜻한 곳보다 차갑더라도 신선한 공기 속에 두는 편이 낫다. 출처·나이가 다른 소를 섞지 않고 같은 무리를 유지한다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>새 소는 30일 격리한 뒤 합사한다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>수송으로 지친 소는 12~24시간 쉬게 하고 입식처치를 48시간 넘게 미루지 않는다. 마른 휴식 공간, 깨끗한 물, 양질의 긴 건초를 도착 즉시 준다. 입식처치 때 직장 체온을 재면 아픈 소를 찾기 쉽다. 수소는 입식 때 거세하면 이병률·폐사율이 늘어난다.</span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>초유로 받은 IgG의 반감기는 약 16~20일로 90~120일령이면 2% 미만만 남는다. 그래서 3~5개월령 송아지는 다른 스트레스가 없어도 폐렴에 잘 걸린다. 만헤이미아·파스튜렐라 모체항체도 30~90일령에 사라지고, 그 뒤 자연 노출로 생기는 항체는 오래가지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>바이러스 백신은 모체이행항체가 사라진 뒤인 약 10주령에 1차, 2~4주 뒤 2차. 10~12개월령 재접종 권장. 보강은 위험이 낮은 농장 1년 1회 전 두수, 높은 농장 1년 2~3회.</span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>입식 당일 접종은 위험이 가장 큰 처음 2주 동안 거의 보호하지 못하고, 입식 시 접종이 BRD 위험을 꾸준히 줄인다는 근거는 없다. 주사 백신은 입식 4~6주 전이 이상적이다.</span></p><p class="bx-num"><span class="bxn" data-n="21">•</span><span>모체이행항체는 주사용 생독백신의 면역 형성을 방해하지만 비강 생독백신에는 영향이 없어 어린 송아지에는 비강 백신이 유리하다. 비강 백신은 국소 면역이 빨리 생겨 발생 중에도 쓸 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>근육주사용 IBR 생독백신은 임신우에 유산을 일으킬 수 있고, 생독백신은 바이러스가 남아 재활성화될 위험이 있다. 생후 3일 이내 송아지에 생독백신을 놓은 뒤 치명적 전신 감염이 생긴 사례가 있다. 임신우는 1차를 생독, 보강을 불활화로 하는 방법이 있다. 가벼운 병이 있거나 면역이 억제된 소는 불활화백신을 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>만헤이미아 백신은 류코톡신 기반 제품이 이병률·폐사율을 줄이는 것으로 보고되었으나, 비육우 시험 메타분석에서는 이병률만 약간 줄이고 폐사율은 줄이지 못했다. 입식 시 또는 수송 3주 전 1회 접종한다. 흔히 Pasteurella multocida 항원과 섞여 있지만 P. multocida 성분이 야외에서 효과가 있음을 보인 제대로 된 시험은 없다. 히스토필루스 백신은 모두 사균백신으로 야외 시험 결과가 엇갈린다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>발생 초기에 BRSV 생독백신을 놓은 뒤 병이 악화된 것으로 보인 보고가 있어 발생 중 BRSV 접종은 해로울 수 있다. IBR은 비강·근육 접종 모두 면역이 빨리 생겨 발생 중 접종이 피해를 줄일 수 있으나 대조 연구로 검증되지는 않았다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료</div>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>세균성 폐렴 치료의 기본은 일찍, 충분히 길게, 맞는 약으로 치료하는 것이다. 지금은 듣는 약이 많아서 약을 잘못 고르는 것보다 치료가 늦는 것이 실패의 더 큰 원인이다. 폐 병변이 너무 진행되면 어떤 약으로도 되돌리기 어렵다. 집단 발생 초기에는 주사로 투여한다. 아픈 소는 사료 섭취가 줄어 경구 투여로는 치료 농도를 유지하기 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>직장 체온 40℃ 이상이면서 임상 증상이 있으면 치료한다. 발열·식욕부진·호흡곤란이 있으면 치료하고, 미열과 약한 침울만 있고 잘 먹는 소는 치료하지 않아도 될 수 있다. 치료한 소는 귀표 등으로 표시하고 개체, 날짜, 체중, 약·용량, 휴약기간, 결과를 기록한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>플로르페니콜, 세프티오퍼, 틸미코신, 툴라트로마이신, 플루오로퀴놀론은 폐조직에서 Mannheimia·Pasteurella·Histophilus를 억제하는 농도에 이른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>페니실린, 암피실린, 아목시실린, 에리스로마이신, 타이로신은 폐 침투가 훨씬 떨어진다(베타락탐은 폐 축적에 불리하지만 소 폐렴에 효과적이고, 에리스로마이신은 폐 농도 도달이 입증됐다고 적은 책도 있다). 마이코플라즈마 동시 감염이 늘어 베타락탐계(세프티오퍼·페니실린·암피실린)는 1차 약으로서 의미가 줄었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="29">•</span><span>Mannheimia·Pasteurella는 암피실린·테트라사이클린·에리스로마이신·설파메타진 내성이 흔하다. 에리스로마이신 교차내성으로 틸미코신 감수성 편차가 크다.</span></p>
<p class="bx-num"><span class="bxn" data-n="30">•</span><span>Pasteurella multocida는 페니실린을 포함한 여러 항생제에 감수성인 경우가 많고, Mannheimia는 내성 가능성이 훨씬 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>마크로라이드(툴라트로마이신, 틸미코신, 틸디피로신, 가미트로마이신), 엔로플록사신, 플로르페니콜이 송아지 BRD의 흔한 1차 약이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>메타분석 : 툴라트로마이신>엔로플록사신>다노플록사신>플로르페니콜 순으로 효과가 높게 추정, 옥시테트라사이클린·트리메토프림-설파는 낮았다. 옥시테트라사이클린의 재치료 위험은 64~77%였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>마크로라이드·플루오로퀴놀론·플로르페니콜은 폐 조직에서 P. multocida·M. haemolytica·H. somni 같은 그람음성균과 Mycoplasma까지 덮는 스펙트럼이라 감수성 결과 나오기 전 경험적 선택으로 타당하다. 세프티오퍼는 세 그람음성균엔 잘 듣지만 Mycoplasma 혼합감염이 늘어 1차 약으로서 의미가 줄었다(β-락탐은 Mycoplasma에 무효).</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>비스테로이드성 소염제는 처음 며칠 열을 내리고 겉모습을 좋게 하지만 증체 개선은 연구마다 다르고 폐사는 줄이지 못했다. 열을 내려 항생제 효과 판단을 어렵게 한다.</span></p><p class="bx-num"><span class="bxn" data-n="35">•</span><span>세균성 폐렴에 코르티코스테로이드는 권하지 않는다. 면역을 억제하고 IBR 재발을 일으킬 수 있으며, 열을 내려 맞지 않는 항생제도 듣는 것처럼 보이게 한다. 쓰더라도 첫 치료 때 덱사메타손(dexamethasone) 10~20mg/450kg 1회만 쓰고 임신우에는 쓰지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="36">•</span><span>플루닉신(flunixin meglumine) 1.1~2.2mg/kg 정맥 1회 또는 12시간 간격 2회로 나눠 최대 3일, 정맥 전용이다. 멜록시캄(meloxicam)은 1mg/kg 경구 또는 0.5mg/kg 근육이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="37">•</span><span>트리펠렌아민(tripelennamine) 1mg/kg 1일 2~3회 같은 항히스타민제는 요즘 덜 쓰이지만 경험 많은 임상가들이 아직 보조 치료로 많이 쓴다. 아트로핀(atropine) 2.2mg/45kg 근육 또는 피하 1일 2회는 뚜렷한 호흡곤란·개구호흡·폐수종이 있는 진행된 경우에 기관지 분비를 줄이고 가벼운 기관지 확장 효과를 내는 보조제로 쓴다. 정맥 수액을 지나치게 주면 폐수종이 생기거나 악화될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>비·추위·바람·뙤약볕을 피할 곳을 주고, 밀사와 진흙·분뇨를 피하며, 양질 사료와 깨끗한 물을 쉽게 먹게 한다. 무기질·비타민 결핍은 주사나 경구제로 바로잡는다. 환기가 나쁜 따뜻한 곳보다 차갑더라도 신선한 공기 속에 두는 편이 낫다. 아픈 소를 따로 두면 건강한 소와 사료 경쟁하는 스트레스가 줄어든다.</span></p>

<p class="bx-num"><span class="bxn" data-n="39">•</span><span>효과가 있으면 24시간 안에 기운과 식욕이 나아지고 열이 내린다. 1.1℃ 이상 내려가면 호전으로 본다. 대부분 48~72시간에 걸쳐 정상 체온이 된다. 24~72시간 안에 나아지는 소는 예후가 좋고, 72시간 넘게 걸리면 만성 폐 손상이나 폐농양 위험이 크다.</span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>약에 따라 최소 3일, 흔히 5~7일 계속 치료해야 재발이 적다. 열·호흡곤란·전신 염증 증상이 사라진 뒤 최소 48시간 더 치료한다. 예전에는 3일이면 충분하다고 봤으나 더 길게 치료해야 한다는 견해가 늘고 있고, 재발을 막으려면 항생제 효과가 최소 7~10일 지속되게 한다. 마이코플라즈마 폐렴은 7~10일 이상이 낫다.</span></p>
<p class="bx-num"><span class="bxn" data-n="41">•</span><span>첫 약을 주고 72시간 뒤에도 열이 있으면 약을 바꾸는 것이 예전 기준이었다. 그러나 지속형 항생제를 첫 약으로 썼으면 72시간보다 더 기다려도 된다. 약이 얼마나 오래 가는지에 따라 바꾸는 시점이 다르다.</span></p><p class="bx-num"><span class="bxn" data-n="42">•</span><span>지속형 옥시테트라사이클린(200mg/mL)은 2~3일, 세프티오퍼 결정형 유리산은 5~7일, 툴라트로마이신은 7~14일 뒤에도 반응이 없을 때 2차 약으로 바꾼다. 빨리 좋아지지 않는 소를 보고 약을 안 바꾸고 기다리기는 어렵지만, 3일마다 다른 지속형 약으로 갈아타는 것은 결과를 좋게 하지 못하고 비용과 내성만 늘린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>치료 실패의 원인은 약이 폐에 충분히 도달하지 못함, 세균 내성, 시험관 감수성과 실제 체내 농도의 차이, 경화된 폐나 고름 속으로 약이 침투하지 못함, 폐 병변이 이미 비가역적이거나 바이러스성임, 마이코플라즈마나 Trueperella pyogenes 동시 감염이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>체중 증가는 좋은 예후, 계속되는 체중 감소는 나쁜 징후다. 머리 기울임·귀 처짐(마이코플라즈마 중이염)은 나쁜 징후다. 합병증은 심막염, 심내막염, 흉막염, 다발성 관절염(마이코플라즈마·히스토필루스), 혈전색전성 수막뇌염(히스토필루스)이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">메타필락시스</div>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>메타필락시스는 세균성 폐렴 초기이거나 위험이 큰 무리 전체에 항생제를 주는 것으로, 소에 따라 치료 또는 예방 효과를 낸다. 위험이 큰 소에서 이병률·폐사율을 줄인다는 연구가 많다. 수송열로 죽는 소는 도착 때 이미 아프거나 도착 며칠 안에 아파지므로 도착 시 투여가 근거가 있다. 예전에는 사료·물로 주었으나 지금은 모든 소가 빨리 치료 농도에 이르는 주사제를 권한다. 이병률·폐사율이 높은 마이코플라즈마 우군에서도 메타필락시스가 정당화될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>미국에서 메타필락시스로 허가된 약은 툴라트로마이신 2.5mg/kg 피하, 틸미코신 10~15mg/kg 피하, 플로르페니콜 40mg/kg 피하, 가미트로마이신 6mg/kg 피하, 틸디피로신 4mg/kg 피하, 세프티오퍼 결정형 유리산 6.6mg/kg 귀 뒷면 피하, 엔로플록사신 7.5mg/kg 피하, 옥시테트라사이클린 300mg/mL 제제 30mg/kg으로 모두 1회다. 지속성 옥시테트라사이클린 20mg/kg 근육은 결과 편차가 크고 틸미코신보다 이병률이 높았다. 메타필락시스 뒤 여러 계열 항생제에 내성인 Mannheimia가 많이 나온다는 보고가 있어 효과가 줄어들 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>이유 뒤 1주쯤 군사로 옮길 때, 특히 한 번에 10마리 넘게 옮기면 호흡기병이 잘 생긴다. 옮길 때 지속성 옥시테트라사이클린, 틸미코신, 툴라트로마이신, 플로르페니콜 중 하나를 1회 주사해 많은 농장에서 조절했다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">국내 유통 호흡기 백신 비교</div>
<div class="bx-sub"><div class="bx-subtitle">바이러스 백신</div>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>비비박스3는 BRSV가 없고, 캐틀마스터 4는 BVDV 2형이 없다.<div class="bxt-wrap"><table class="bxt bxt-vac2"><tr><th></th><th>비비박스3<br><span style="font-weight:400">녹십자수의약품</span></th><th>캐틀마스터 4<br><span style="font-weight:400">Zoetis</span></th></tr><tr><th>항원</th><td>IBR, BVDV, PI3</td><td>IBR, PI3, BRSV, BVDV-1</td></tr><tr><th>생독/사독</th><td>전부 사독</td><td>IBR·PI3·BRSV 생독(온도감수성 IBR·PI3), BVDV 사독</td></tr><tr><th>BRSV</th><td>없음</td><td>있음</td></tr><tr><th>용량·경로</th><td>5mL 근육</td><td>2mL 근육(목)</td></tr><tr><th>최소 연령</th><td>3개월령</td><td>2주령</td></tr><tr><th>기초접종</th><td>4주 간격 2회</td><td>2~4주 간격 2회. 6개월령 미만 시작 시 6개월령 넘어 3차</td></tr><tr><th>보강</th><td>표기 없음(핸드북 6개월)</td><td>연 1회</td></tr><tr><th>주의</th><td>—</td><td>생독이라 BRD 발생 중 접종 신중</td></tr></table></div></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">세균 백신</div>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>원샷은 Mannheimia만 막는 사독이고, 원스 PMH는 두 균을 막는 생균 백신이다.<div class="bxt-wrap"><table class="bxt bxt-vac2"><tr><th></th><th>원샷<br><span style="font-weight:400">Zoetis</span></th><th>원스 PMH<br><span style="font-weight:400">MSD</span></th></tr><tr><th>항원</th><td><i>Mannheimia haemolytica</i></td><td><i>M. haemolytica</i> + <i>Pasteurella multocida</i></td></tr><tr><th>생독/사독</th><td>사독(류코톡소이드)</td><td>생독(약독 생균)</td></tr><tr><th>용량·경로</th><td>2mL 피하</td><td>2mL 피하(SQ) 또는 비강(IN)</td></tr><tr><th>최소 연령</th><td>제한 없음</td><td>SQ 3개월령 / IN 1주령</td></tr><tr><th>기초접종</th><td>1회</td><td>1회</td></tr><tr><th>보강</th><td>미확립</td><td>미확립(SQ 면역 16주 이상)</td></tr><tr><th>주의</th><td>—</td><td>생균이라 항생제 동시 투여 시 효과 감소 가능</td></tr><tr><th>도축 전</th><td>21일</td><td>21일</td></tr></table></div></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>국내 핸드북 용법은 바이러스 백신 생후 30일 1차, 3~4주 뒤 2차, 세균 백신은 스트레스 14일 전 또는 입식 다음날 1회다.</span></p>
</div>

<div class="bx"><div class="bx-title">송아지 유행성폐렴</div>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>축사에서 무리 지어 기르는 6개월령 미만 소에 매우 흔하고 1~1.5개월령에 가장 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span>이병률은 높고 폐사율은 낮다.</span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>위험 요인은 구입 송아지, 수동면역 실패, 밀사, 큰 무리, 나이 섞임, 환기 불량, 높은 습도, 이유·제각·거세, 겨울이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>발열, 침울, 식욕부진, 호흡수 증가, 점액농성 콧물, 눈물, 거친 마른 기침을 보이고 기관을 누르면 기침이 쉽게 난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>감별은 BRD, 이물성 폐렴, 폐충 폐렴, 선천성 심장병, 히스토필루스 증후군, 근육영양장애에 의한 호흡곤란(방목 직후 급성 쇠약·빈맥·부정맥)</span></p>
<p class="bx-num"><span class="bxn" data-n="56">•</span><span>바이러스·마이코플라즈마 감염이거나 폐 병변이 진행된 경우 치료에 반응하지 않는 일이 흔하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="57">•</span><span>Pasteurella multocida는 만성 폐렴과 관련 있어 예전 권장인 3~5일보다 길게 치료해야 할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>마크로라이드, 엔로플록사신, 플로르페니콜은 Pasteurella·Mannheimia·Histophilus와 마이코플라즈마에 모두 듣는 합리적인 경험적 선택이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>환기·관리 문제를 바로잡는 것이 약만큼 또는 그 이상 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>면역에 필요한 에너지·단백질·비타민·미네랄이 모자라면 호흡기병에 잘 걸린다. 특히 구리, 셀레늄, 아연, 망간, 철, 비타민 A·E 결핍에 주의한다. 설사를 줄이려고 생후 몇 주 동안 우유를 적게 먹이다가 에너지·단백질 부족을 만들기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="61">•</span><span>송아지 설사를 앓은 송아지는 이유 전 호흡기병도 잘 걸린다. 설사가 보통 호흡기병보다 먼저 오므로, 둘 다 문제인 농장은 설사부터 잡아야 한다.</span></p>
</div>

<div class="bx"><div class="bx-title">만헤이미아·파스튜렐라 폐렴</div>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>원인은 Mannheimia haemolytica와 Pasteurella multocida이다. 둘 다 Pasteurellaceae과의 그람음성 호기성 세균이고, 건강한 소의 비인두에도 산다. Mannheimia는 그람음성 간균(구간균으로 적은 책도 있다)이다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">Mannheimia haemolytica</div>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>Mannheimia 혈청형 A1이 소 폐렴 폐에서 가장 많이 분리되고 다음이 A6이며, 정상 소 비인두에서는 A2가 가장 많다. 수송이나 IBR·PI3 바이러스 감염 스트레스로 A1이 빠르게 늘어난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>병원성은 탐식을 막는 협막, 폐포 대식세포·단핵구·호중구를 죽이는 외독소(류코톡신), 그람음성균 세포벽에서 나와 보체·응고 연쇄반응을 일으키는 내독소(지질다당류), 그리고 정상 상기도에 비병원성 혈청형과 함께 살다가 스트레스 때 독한 A1으로 바뀌거나 과증식하는 성질에서 온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>IBR·BVD 같은 바이러스 감염 위에 독한 Mannheimia가 겹치면 폐사율이 30~50%에 이를 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>수송, 쇼 출품, 구입 같은 스트레스 1~2주 뒤 전형적인 폐렴으로 나타난다. 초기에는 발열·호흡수 증가·침울만 있고, 다른 바이러스와 함께 감염되지 않았으면 급성기에 기침은 두드러지지 않는다. 체온은 대개 40.0~41.67℃, 최고 42.22℃다.</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>팔꿈치를 벌리고 서거나 숨을 내쉬기 전에 멈칫하는 흉통 징후, 빈맥·침 흘림·창백하거나 검붉은 점막·모세혈관 재충만 지연·차가운 사지 같은 내독소혈증 징후를 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>앞아래쪽 폐에서 습성·건성 수포음과 경화를 뜻하는 기관지음, 흉막 마찰음이 들리고 늑간을 누르면 아파한다. 심하면 개구호흡, 피하기종, 호기 때마다 신음 소리를 낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>급속 경화형은 고열 41.11~42.22℃, 호흡수 60~120회/분, 식욕 절폐, 움직이지 않으려 하고, 앞아래쪽에서 수포음 없이 기관지음만 들린다. 제1위 운동 정지와 앞쪽 복부 통증 때문에 창상성 위염·복막염으로 오인하기 쉽다. 감수성 있는 약을 처음에 고르지 못하면 12~48시간에 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>치료는 광범위 항생제가 중심이며 진단 시료를 받은 뒤 바로 시작한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>제때 치료하면 약 85~90%가 24시간 안에 회복한다. 항생제를 늦추면 경과가 길어지고 폐사율이 오른다(실험 감염에서 48시간 지연). 며칠 회복한 듯하다 재발하는 것은 대개 늦은 치료 때문이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>내독소 대책으로 플루닉신을 함께 쓰면 개체의 결과가 나아진다. 비스테로이드성 소염제는 치료 처음 1~3일 쓰고 과량·장기 투여는 피한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>Mannheimia 폐렴에 코르티코스테로이드는 쓰지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">Pasteurella multocida</div>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span>Pasteurella multocida는 하부 기도 방어가 약해질 때 침입하는 기회감염균이다. Mannheimia보다 증상이 가볍고 짧다. 단독 기관지폐렴은 대개 관리 문제다.</span></p>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>Pasteurella multocida 폐렴은 발열 39.72~40.83℃, 침울, 습성 기침, 호흡수·깊이 증가, 앞아래쪽 양쪽 폐의 습성·건성 수포음을 보인다. 등쪽 폐는 대개 정상이다. 만성은 경화 부위가 앞아래쪽에만 있어서, 청진기를 어깨 밑으로 밀어 넣고 송아지의 입과 코를 잠시 막아 깊은 숨을 쉬게 해야 들린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>Pasteurella multocida는 페니실린을 포함한 여러 항생제에 감수성인 경우가 많다. 맞는 약에도 반응하지 않으면 다른 원인체(바이러스·마이코플라즈마) 동반, 관리·환기 문제 미해결, 폐충을 의심한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">공통 : 증식성 폐렴·예방</div>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>Mannheimia·Pasteurella 폐렴 집단 발생에서 회복한 송아지가 2~4주 뒤 갑자기 극심한 호흡곤란을 보이는 증식성 폐렴이 저자들의 임상 관찰로 보고되었다. 증상은 미열, 개구호흡, 폐 전체가 조용한 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>부검에서 앞아래쪽 폐는 이전 폐렴이 낫고 있는 소견이고, 나머지 폐 전체가 단단하고 무겁고 젖어 있으며 조직검사로 증식성 폐렴이 확인된다. BRSV 등 다른 병원체 검사는 음성이다. BRSV도 뒤늦은 과민성 폐렴을 일으키지만 병변이 다르다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>원인은 확인되지 않았고, 아래쪽 폐가 경화된 뒤 위쪽 폐가 들이마신 제1위 가스에 더 노출되기 때문이라는 가설이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="80">•</span><span>치료는 아트로핀 2.2mg/45kg 1일 2회, 푸로세미드 25mg/45kg 1일 1~2회, 광범위 항생제, 환기 좋은 칸에서 휴식이다. 반응은 느리지만 살아남은 소는 7~10일에 걸쳐 나아진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>예방은 위험이 큰 소의 예방적 항생제, 초유 수동면역과 Mannheimia 백신으로 면역 강화, 바이러스 감염·여러 출처 혼합·장거리 수송 줄이기의 세 갈래로 접근한다.</span></p><p class="bx-num"><span class="bxn" data-n="82">•</span><span>류코톡신 기반 Mannheimia 백신은 이병률·폐사율을 줄이는 효과가 입증되었고 흔히 Pasteurella multocida 항원과 섞여 있다. 백신의 Pasteurella multocida 성분이 야외에서 효과가 있음을 보인 제대로 된 시험은 없다.</span></p>
</div>
</div>

<div class="bx"><div class="bx-title">소전염성비기관염(IBR) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제3종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>소 허피스바이러스 1형(BHV-1)</span></p><p class="bx-num"><span class="bxn" data-n="84">•</span><span>백신을 맞지 않은 비육우의 이병률은 보통 20~30%이고 때로 100% 가까이 된다. 6개월령 미만에는 드물고 6~18개월령에서 가장 많고 심하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>합병증 없는 감염은 폐사가 적고 대부분의 죽음은 2차 세균성 기관염·기관지폐렴 때문이다. 치명률은 보통 1%를 넘지 않고 독한 strain에서 3~5%까지 간다. 백신을 맞지 않은 임신우는 최대 25%가 유산할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>감염된 소는 사실상 모두 잠복 감염되어 스트레스나 코르티코스테로이드 투여 때 다시 바이러스를 배출한다. 생독백신도 잠복 감염을 일으킬 수 있다. 잠복 감염 소에 백신을 놓아도 이미 있는 야외 strain의 배출은 막지 못하므로, 발생 농장의 소는 모두 감염원으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>바이러스는 정액 동결 과정에서도 살아남아 인공수정으로 옮을 수 있다. 자외선·건조·열·소독제에 약하지만 겨울에는 더 오래 산다.</span></p>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>증상은 감염 1~2일 안에 시작하고 발열은 감염 2~7일에 나타난다. 고열 40.56~42.22℃, 침울, 식욕부진, 호흡수 40~80회/분을 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="89">•</span><span>장액성 콧물이 감염 72시간 안에 진한 점액농성으로 바뀐다. 통증성 기침, 코끝의 마른 괴사 딱지, 비강 점막과 비중격의 흰 반점(plaque)이 보인다. 기관을 누르면 발작성 기침이 나고 결막염이 심할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>기관에서 거친 수포음이 들리고 상부 기도 소리가 양쪽 폐로 전달된다. 2차 세균성 기관지폐렴은 보통 급성 감염 7~10일 안에 생기고, 그렇지 않으면 7~14일 증상을 보인 뒤 회복한다. 합병증 없는 호흡기 감염은 5~7일에 낫는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>급성 감염 중이나 그 뒤 4~8주 안에 유산할 수 있고 대부분 임신 중·후기에 생긴다. 임신 4~8개월(주로 말기)에 감염 뒤 최대 100일까지 유산할 수 있으며, 임신 5~8개월에 가장 많다고 적은 책도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>유방염·자궁염·세균성 폐렴 같은 다른 병으로 아픈 소에서 잠복 바이러스가 재활성화되어 전형적인 IBR 반점이 보일 수 있다. 이런 소를 원발성 IBR로 진단하지 않지만, 같이 있는 소에게는 감염원이 될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>감별에서 파스튜렐라 폐렴은 뚜렷한 독혈증·침울, 폐음 이상, 좋은 항생제 반응을 보이는 반면, IBR은 2차 세균 폐렴이 없으면 독혈증이 없고 서서히 회복한다. BRSV는 호흡음이 거칠어지다가 호기성 호흡곤란·개구호흡으로 심해지고 기침이 쉽게 유발된다. PI3는 대개 가벼운 하부 호흡기병이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>송아지 디프테리아는 흡기성 호흡곤란과 크게 코 고는 소리, 악취 나는 입냄새, 후두를 만지면 붓고 아파하며 보통 한 마리에 심한 독혈증을 보인다. 소바이러스성설사는 구강 미란·궤양, 지속 설사, 탈수를, 악성카타르열은 심한 침울, 구강 미란, 각막염, 체표 림프절 종대, 높은 지속 발열, 혈뇨, 말기 뇌염을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>치료는 대증 치료.</span></p><p class="bx-num"><span class="bxn" data-n="96">•</span><span>양질 사료와 물을 쉽게 먹게 하고 수송, 거세, 제각, 새 소 합사 같은 스트레스는 피하거나 미룬다.</span></p><p class="bx-num"><span class="bxn" data-n="97">•</span><span>2차 세균성 폐렴을 치료·예방하는 항생제가 적절할 수 있으나 늘 필요한 것은 아니다. 스테로이드는 쓰지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>심한 소는 플루닉신 1.1~2.2mg/kg 정맥(1일 1회 또는 2회 분할)이 사료·물 섭취 유지에 도움이 될 수 있다. 탈수가 심하면 경구 또는 정맥 수액을 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>비강·근육 접종 모두 면역이 빨리 생겨 발생 중 IBR 접종이 피해를 줄일 수 있으나 대조 연구로 검증되지는 않았다. 비강 백신은 빠른 국소 면역을 주어 발생 중에도 쓸 수 있다. 생독백신의 주의 사항은 소 호흡기질병(BRD) 예방·백신과 같다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>자연 감염이나 백신 면역은 짧아 6~12개월을 넘지 않는 것으로 본다.</span></p><p class="bx-num"><span class="bxn" data-n="101">•</span><span>자연 감염에서 회복한 소는 다시 임상 증상을 보이지 않는다. 그러나 우군 면역을 자연 노출에 맡기는 것은 위험하다. 모든 소가 감염되어 면역을 얻는 것은 아니기 때문이다. 백신을 놓지 않고 자연 노출에 의존한 우군에서 집단 유산이 생긴다. 따라서 유병률이 높고 박멸이 어려운 지역에서는 백신을 권한다.</span></p>
</div>
<div class="bx"><div class="bx-title">파라인플루엔자(PI-3)</div>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>소 파라인플루엔자 바이러스 3형</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>감염은 흔하지만 대개 불현성</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>2~12개월령에 가장 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>점막섬모 장치를 손상시키고 폐포 대식세포의 탐식·살균 기능을 떨어뜨려 2차 세균성 폐렴에 걸리기 쉽게 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>가장 중요한 역할은 Mannheimia 같은 세균의 2차 감염을 쉽게 하는 것이고, 죽는 경우는 대개 2차 세균 감염 때문이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>합병증이 없으면 증상은 가볍다. 발열 40.0~41.67℃, 기침, 콧물·눈물, 호흡수 40~80회/분, 기관지폐포음 증가, 천명음, 기관 수포음, 때로 아래쪽 폐 수포음을 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>폐사는 드물고 7일에 걸쳐 회복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>대증 치료를 한다. 흔한 2차 세균성 폐렴을 치료해야 하며, 2차 감염이 겹치면 세균성 폐렴 치료에 대한 반응이 예상보다 느리고 불완전하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>환경 문제를 바로잡고 스트레스를 피하면 합병증이 없을 때 며칠 안에 저절로 낫는다.</span></p>
</div>
<div class="bx"><div class="bx-title">소합포체성폐렴(BRSV)</div>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>소 호흡기 합포체 바이러스(BRSV, bovine respiratory syncytial virus)</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>잠복기 3~5일, 이병률은 높고 치명률은 0~20%로 다양하다. 가을·겨울에 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>평생 재감염될 수 있고 자연 감염도 평생 면역을 주지 않아 해마다 재감염되기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>모체 항체는 감염을 막지 못하지만 증상을 가볍게 하고 백신 반응은 방해한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>먼지가 많으면 증상이 심해지고 BVD 동시 감염은 병을 악화시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>2주령 미만에는 드물고 1~8개월령에서 가장 많고 심하며 9개월령 이상에서는 드물다. 증상은 6개월령 미만에서 가장 뚜렷하지만 성우도 심하게 앓을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>무리 안에서 며칠~1주 사이 많은 소가 걸린다. 고열 40.0~42.22℃, 침울, 식욕부진, 침 흘림, 장액성·점액성 콧물을 보인다. 호흡수 증가(40~100회/분)부터 개구호흡까지 다양하다. 기침은 늘 있고 기관을 누르면 쉽게 유발된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>심하게 헐떡이는데도 청진하면 폐 전체가 아주 조용하거나 거의 안 들리는 경우가 있다. 겉모습과 반대라 BRSV를 의심하게 하는 중요한 소견이다. 기흉, 간질 폐수종, 폐기종이 작은 기도를 눌러 소리가 줄어드는 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>가벼운 발생이 아니면 일부 소에 기갑 부위 피하기종이 만져진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>피하기종·기흉은 다른 심한 폐렴에서도 생기므로 BRSV를 시사할 뿐 확진 소견은 아니다.</span></p>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>고열과 호흡곤란이 있어도 세균성 폐렴처럼 패혈 상태로 보이지 않는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>처음 증상이 치료로 좋아지는 듯하다가 며칠~몇 주 뒤 갑자기 극심한 호흡곤란이 오는 2단계 경과가 있다. 바이러스에 대한 면역 반응이 폐에서 지나치게 일어나는 과민 반응으로 보며, 이렇게 되면 대개 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>감별은 IBR(점액농성 콧물·결막염), BVD(구강 궤양), PI3(가벼운 하부 호흡기병), 코로나바이러스, 급성 간질성 폐렴(갑자기 발생, 호기 때 큰 소리·거품침·개구호흡, 무성한 목초지나 사료 변경 이력)이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>치료는 대증 치료이고 2차 세균성 폐렴을 막는 광범위 항생제를 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>비스테로이드성 소염제(플루닉신 1.1~2.2mg/kg 정맥, 1일 1회 또는 2회 분할)가 적절하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>심한 호흡곤란이나 급성 간질성 폐렴 징후가 있을 때(처음 좋아졌다가 다시 나빠지는 2단계 과민형 포함)는 광범위 항생제에 더해 덱사메타손 0.05~0.2mg/kg 정맥 또는 근육 1~2회(성우 10~20mg 1일 1회로 적은 책도 있다. 임신우 금지), 폐수종에 푸로세미드(furosemide) 0.5~1mg/kg 근육 또는 정맥 1일 1~2회(성우 250mg), 트리펠렌아민 1mg/kg 근육 1일 2회, 아트로핀 0.048mg/kg 근육 또는 피하 1일 2회, 플루닉신 1mg/kg 정맥 12 또는 24시간마다를 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>합병증 없는 BRSV는 예후가 좋지만 급성 간질성 폐렴(AIP) 양상이면 조심스럽다. 심한 호흡곤란 소는 치료하려고 조심스럽게 다루기만 해도 급격히 호흡이 무너져 죽을 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>심한 발생은 치료해도 10~30% 폐사할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>코르티코스테로이드·비스테로이드성 소염제가 증상을 다소 줄일 수 있으나 두 약 모두 효과 근거가 없다고 적은 책도 있다. 코르티코스테로이드는 2차 감염과 유산을 일으킬 수 있어 골라 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>증상 소는 격리하고, 심한 소에는 농후사료·사일리지를 주지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>합병증이 없으면 10~14일에 낫는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>생독·불활화 백신이 있다. 비강 생독백신이 예방을 개선할 가장 좋은 방법이다. 발생 초기에 생독백신을 놓은 뒤 병이 악화된 것으로 보인 보고가 있어 발생 중 접종은 해로울 수 있다. 그러나 BRSV 백신은 널리 쓰이고 백신에 의한 병 악화 보고는 드물어, 백신은 여전히 BRSV 방제 계획의 일부로 권한다.</span></p>
</div>
<div class="bx" data-col="right"><div class="bx-title">히스토필루스 감염증(Histophilus somni)</div>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>Histophilus somni(Pasteurellaceae과의 그람음성 호기성 세균. 운동성·아포·협막이 없는 다형성 구간균)</span></p>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>히스토필루스 폐렴은 증상만으로 다른 세균성 폐렴과 가를 수 없다. 심한 정도가 중간쯤이라, 심한 Pasteurella multocida 폐렴이나 가벼운 Mannheimia 폐렴처럼 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>발열 39.72~41.44℃, 호흡수 40~80회/분, 침울, 콧물, 통증성 기침을 보인다. 일반 광범위 항생제에 반응하지 않는 것이 히스토필루스 폐렴의 특징이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>신경형은 4개월령이 넘은 소에만 생기며, 폐렴 발생 중 신경 증상 소가 나오면 강하게 의심한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>전신형·흉막염형은 증상 없이 갑자기 죽은 채 발견되기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>심근염형은 운동을 싫어하고 움직이면 심한 호흡곤란이 오며 이동 중 쓰러져 죽는다. 주로 6~12개월령 비육우에서 입식 20~60일에 폐사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>폐는 멀쩡하고 흉막 표면에만 심한 섬유소성 흉막염이 있으면 수송열과 구별되는 히스토필루스 병변이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>세프티오퍼 1.1~2.2mg/kg 피하 3~5일, 엔로플록사신 7.5~12.5mg/kg 피하, 플로르페니콜 40mg/kg 피하</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>암피실린 11~22mg/kg 1일 2회 주사 3~7일, 옥시테트라사이클린 20mg/kg 정맥 24시간마다 최소 3일도 쓴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>마이코플라즈마 동반 가능성 때문에 베타락탐보다 마크로라이드·엔로플록사신·플로르페니콜을 1차로 고를 수 있다. 3일 치료에 반응이 없으면 대개 비가역 병변이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>효과 있는 약이면 24~72시간에 걸쳐 체온이 정상으로 내려가므로, 비스테로이드성 소염제·코르티코스테로이드는 쓰지 않는 편이 약 효과 판단에 낫다.</span></p>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>약 종류보다 조기 발견과 충분한 치료 기간이 더 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>예후는 심한 폐렴·호흡곤란이 없으면 보통~양호하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>히스토필루스 백신은 모두 사균백신이다. 2~3주 간격 2회 접종이 공격 시험에서는 예방 효과를 보였지만 야외 시험 결과는 엇갈리고 실패가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>예방으로 발생 중 지속성 옥시테트라사이클린 집단 주사는 히스토필루스 자체를 막는 효과는 증명되지 않았으나 원인 미분류 BRD 폐사는 뚜렷이 줄였다. 입식 후 메타필락시스도 히스토필루스 예방에는 결과가 엇갈린다.</span></p><p class="bx-num"><span class="bxn" data-n="148">•</span><span>이유·선별·혼합·수송 과정에서 송아지가 섞이는 일을 줄이면 위험이 줄 수 있다.</span></p>
</div>

<div class="bx"><div class="bx-title">마이코플라즈마 폐렴</div>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>Mycoplasma bovis</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>증상 없이 감염된 소의 입식이 주된 경로다.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>감염된 우유·초유 급여가 송아지 감염의 중요한 원인이고, 감염된 정액도 도입 경로가 될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>발열, 호흡수 증가, 식욕부진, 때로 호흡곤란·기침·콧물을 보인다. 치료에 예상대로 반응하지 않고 상당수가 몇 주씩 만성으로 앓는 것이 전형적인 호소다.</span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>어린 송아지는 일부가 중이염으로 한쪽 또는 양쪽 귀가 처지고 고름이 나오며 머리 기울임·안진·운동실조를 보인다. 이유 송아지와 비육 입식우는 일부가 관절염·건초염을 보인다. 중이염 소의 40~60%는 다발성 관절염·건초염이 함께 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>순수한 마이코플라즈마 폐렴은 움직일 때 기침, 호흡수 약간 증가(40~60회/분), 미열(39.72~40.56℃) 정도로 가볍고 대부분 잘 먹는다. 아침에 약간의 점액농성 콧물이 보였다 사라진다. 그러나 대부분은 다른 원인체와 함께 분리된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>허가 약이 여럿 있지만 반응이 나쁘다고 여러 저자가 보고한다. 조기 치료가 성공에 결정적이고 최소 10~14일 치료해야 한다는 경험적 보고가 있다. 건락 괴사 병변 때문에 허가 기간보다 길게 치료해야 할 수 있으나 근거 있는 기간 지침은 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>툴라트로마이신 2.5mg/kg 피하, 플로르페니콜 20mg/kg 목 근육, 에리스로마이신 5.5mg/kg 1일 2회, 틸미코신 10mg/kg 피하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>옥시테트라사이클린 11mg/kg 1일 1~2회는 예전 주력 약이었으나 내성과 무반응이 늘었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>플루오로퀴놀론이 가장 효과적이라고 한다. 세포벽이 없어 베타락탐계는 듣지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>마크로라이드(툴라트로마이신·가미트로마이신), 엔로플록사신, 플로르페니콜을 고르고, 옥시테트라사이클린·클로르테트라사이클린·틸미코신은 내성 문제가 있을 수 있으며 타이로신·린코마이신·스펙티노마이신도 최근 내성이 흔해 적절하지 않다.</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>세균 치료와 환기·관리 개선으로 마이코플라즈마는 따로 치료하지 않아도 회복하는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>중이염·관절염은 아주 일찍 치료하지 않으면 완전히 낫기 어렵고, 심한 만성 개체는 안락사가 적절할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>효과적인 백신이 없다. 미국에 허가 백신이 있으나 야외 효과 시험은 드물고 결과가 엇갈린다.</span></p>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>감염 우유를 먹이지 말고 송아지마다 따로 양동이·젖병을 쓰며, 환기를 좋게 하고 다른 소와 직접 닿지 않게 한다. 송아지 중이염·관절염 병력이 있는 농장의 소는 사지 않는다.</span></p>
</div>

<div class="bx"><div class="bx-title">우폐역(소 전염성 흉막폐렴) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제1종 가축전염병</span></div>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>Mycoplasma mycoides subsp. mycoides small colony형(MmmSC).</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>세포벽이 없는 다형성 균이고, 정상 상재균으로 보지 않는다. 버팔로·양·염소에서 분리되기도 하지만 병은 소(Bos속)에서만 생기고 다른 종으로 옮기지 않는다. 소독제·열·건조에 약해 몸 밖에서는 몇 시간을 넘기지 못한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>잠복기는 3~6주(드물게 6개월까지, 3~12주로 적은 책도 있다)이고, 감염 후 8개월까지 증상 없이 지낼 수 있어 검역 기간이 충분히 길어야 한다. 감염 소의 약 50%는 가벼운 형으로 지나가 불현성이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>환축이나 보균우가 내뿜는 비말을 들이마시는 직접·반복 접촉으로 옮는다. 6m 거리면 충분하다고 보나 200m 전파도 의심된다. 오줌에 많은 균이 나와 오줌 비말도 경로가 될 수 있다. 사물을 통한 전파는 자연 조건에서는 드물다(오염 건초는 144시간까지 감염력 유지).</span></p>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>회복 소의 약 25%가 폐의 격리괴사 조직(sequestrum)에 균을 2~3년까지 보존하는 보균우가 된다. 격리괴사 조직이 기관지로 터지면 비말 감염원이 되어 폐쇄 농장에서도 유행이 날 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>급성형은 처음 침입한 지역에서 흔하고 발병률 약 90%, 치사율 50% 이상이다(이환율·폐사율은 strain과 지역에 따라 30~100%·10~90%로 폭이 넓고, 유럽 strain은 10~50%·5~30%로 낮다). 갑작스런 고열(40℃), 산유 감소, 식욕·반추 정지, 심한 침울을 보이고 무리에서 떨어져 처진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>기침은 처음에는 운동할 때만 나고 흉통이 뚜렷하다. 움직이기 싫어하고 팔꿈치를 벌리고 등을 굽히고 머리를 뻗은 채 선다. 호흡은 얕고 빠르며 호기 때 신음한다. 흉부를 두드리면 아파하고, 초기에는 흉막 마찰음, 삼출이 차면 탁음·액체음·습성 수포음이 들린다. 목·흉수 부종과 큰 관절 부종이 올 수 있고, 송아지는 판막 심내막염·심근염이 생기기도 한다. 과급성은 호흡곤란 시작 1주 안에 죽는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>회복 소는 겉보기 정상이지만 일부는 폐에 격리괴사 조직이 남아 독혈증으로 발육 불량, 만성 기침, 운동 시 가벼운 호흡곤란을 보이고, 스트레스를 받으면 터져 급성으로 재발한다. 항생제·소염제가 증상을 가려 만성 병변 형성을 조장할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="172">•</span><span>병변은 흉강과 폐에 국한되고 대개 한쪽이다. 흉강에 섬유소 조각이 섞인 맑은 황갈색 액체가 다량 고이고, 소엽간 중격이 호박색 액체로 두꺼워져 소엽 윤곽이 뚜렷한 대리석 모양 경화가 특징이다. 만성은 1~10cm 격리괴사 조직이 섬유성 피막에 싸여 있다. 급성기에는 신장 경색이 흔하고, 송아지는 삼출성 복막염·수근·족근관절염이 동반된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>감별은 출혈성 패혈증(6~72시간 내 급사, 목·흉수 부종, Pasteurella 배양), 결핵(건락·석회화 결절), 폐농양, 유행열, 타일레리아, 방선간균증, 포충낭이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>도태한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>Mycoplasma에 듣는 계열은 테트라사이클린·마크로라이드·플로르페니콜·플루오로퀴놀론이고, 배출을 줄인다는 체내·체외 연구가 있다. 베타락탐계와 설파제는 세포벽과 엽산 합성이 없는 Mycoplasma에 원천적으로 무효다.</span></p>
<p class="bx-num"><span class="bxn" data-n="176">•</span><span>방역 수단은 이동 통제, 살처분, 백신, 치료 네 가지다. 환축과 접촉우 전부 살처분이 원칙이나 보상 체계가 필요하다. 환축 도태 + 접촉우 백신은 흔히 쓰이지만 병을 지속시키기 쉽다. 건강우 백신 + 환축 도태 + 위험군 재접종은 도축장 감시로 유행을 빨리 찾고 백신을 3년 이상 유지해야 하며, 풍토 지역은 매년 접종한다. 백신 효력과 야외 성적은 제한적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>면역 기전은 잘 모른다. 세포벽과 내독소가 없어 면역 반응을 거의 일으키지 않고 점막에 머물러 항체 반응이 약해, 항체가와 병변 심도가 일치하지 않는다(항체가 높아도 병변 없거나, 심한 병변에도 항체 낮음). 면역 혈청으로 수동 이전은 된다.</span></p>
</div>
<div class="bx"><div class="bx-title">송아지 디프테리아(괴사성 후두염)</div>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>Fusobacterium necrophorum(그람음성 다형성 간균, 혐기성균).</span></p>
<p class="bx-num"><span class="bxn" data-n="179">•</span><span>반추위의 정상 세균으로 간농양·부제병·발 농양의 주원인이기도 하며, 후두 감염은 이 균의 비전형적 감염 부위다.</span></p>
<p class="bx-num"><span class="bxn" data-n="180">•</span><span>산발적으로 생기며 비육우 유병률은 1~2%로 추정된다. 같은 급여 기구를 쓰거나 서로 핥는 접촉으로 퍼진다. 연령은 구내염형 2주~3개월령, 후두형 3~18개월령이고 24개월령까지 생긴다.</span></p>
