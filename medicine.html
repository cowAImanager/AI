<p class="bx-num"><span class="bxn" data-n="164">•</span><span>치료는 옥시테트라사이클린 11mg/kg 정맥 24시간마다 3~5일, 또는 지속성 20mg/kg 근육 72시간 간격(근육 또는 피하 1~2회로 적은 책도 있다). 적혈구용적 12% 이하면 전혈 4~8L 수혈, 8% 이하는 예후 불량이다. 보균 제거는 클로르테트라사이클린 4.4mg/kg/일 경구 60일, 옥시테트라사이클린 22mg/kg 5일 간격 5~6회, 또는 이미도카브 5.0mg/kg 근육 14일 간격 2회다.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>예방은 절지동물 구제다. 매개충 계절 시작부터 끝난 뒤 30~60일까지 21~28일마다 지속성 옥시테트라사이클린 20mg/kg, 또는 매개충 계절 동안 사료에 클로르테트라사이클린(chlortetracycline) 1일 1.1mg/kg을 준다. 청정 우군은 입식우를 격리하고 cELISA로 검사한다. 생백신은 어린 소에만 쓰고 임신우·성우에는 금기다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">바베시아병</div>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>제2종 가축전염병이며 Babesia bigemina·bovis만 해당한다(현행 가축전염병예방법).</span></p>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>적혈구 안의 원충으로 혈관내 용혈을 일으킨다. 진드기와 피 묻은 주사바늘·기구로 옮는다. 일본의 B. ovata는 Haemaphysalis longicornis가 옮긴다. 잠복기 2~3주. 유행 지역의 6개월 미만 송아지는 이행면역으로 잘 걸리지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>고열, 침울, 식욕부진, 쇠약이 먼저 오고, 혈색소혈증·점막 창백에 이어 혈색소뇨와 황달이 온다. 빈맥과 빈호흡이 심할 수 있다. 임신우는 유산이 많다. B. bigemina는 뇌형으로 흥분, 경련, 이갈기, 맹목, 혼수를 일으킨다. 원충 단백분해효소 등으로 대사성 산증과 무산소증이 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>김자·라이트 염색 혈액 도말에서 적혈구 안에 서양배 모양 원충이 둘씩 V자로 붙어 보인다. 원충이 안 보여도 배제할 수 없다. 감별은 렙토스피라병, 세균성혈색소뇨증, 타일레리아병, 산후혈색소뇨증, 독성 간병증, 산화성 식물, 만성 구리중독이고, 아나플라즈마병은 비슷하지만 혈색소뇨가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>치료는 디미나젠 3~5mg/kg 근육, 이미도카브 1~3mg/kg 피하 또는 근육이고 이미도카브는 최대 2개월 재감염을 예방한다. 소형 바베시아는 약에 더 저항한다. 빈혈이 심하면 수혈하는데, 총혈액량은 체중의 약 8%이고 그 1/4~1/3을 넣으면 대개 충분하다(체중 250kg당 전혈 4L로 적은 책도 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>혈색소뇨나 뇌 증상이 생긴 뒤에는 예후가 나쁘다. 적혈구용적 12% 넘는 급성은 치료 반응이 좋고 10% 미만은 나쁘다. 흥분하는 소는 보정 자체가 저산소 위기를 부를 수 있다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">내부기생충(연충류) 질병</div>
<div class="bx-sub"><div class="bx-subtitle">위장관 선충</div>
<p class="bx-num"><span class="bxn" data-n="172">•</span><span>방목하는 소는 Haemonchus, Ostertagia, Trichostrongylus, Nematodirus, Cooperia 선충 감염이 흔하고 어린 소가 감수성이 높다. 증체·번식 저하 같은 준임상 손실이 크다. 분변 충란 계수로 진단하되 휴면 유충이 있으면 과소평가된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>오스터타지아는 늦가을에 먹은 유충이 제4위 샘에서 휴면하다 늦겨울~봄에 한꺼번에 나와 심한 설사, 체중감소, 저단백혈증을 일으키고(제II형) 휴면 유충은 많은 구충제에 저항한다. 헤몬쿠스는 흡혈로 심한 빈혈을 일으킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>늦겨울~이른 봄 휴면 유충이 깨어날 때 휴면 유충에 듣는 마크로사이클릭 락톤계(아버멕틴, 목시덱틴)로 구충하고, 방목이 끝난 뒤(첫 서리 뒤) 반복한다. 용량은 무리 평균이 아니라 가장 무거운 소 기준으로 잡아 과소투여를 막는다. 붓는 제형은 송아지가 핥아 효과가 떨어질 수 있다. 내성이 확인된 계열은 쓰지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">간질증</div>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>간질(Fasciola hepatica) 충란은 뜨지 않으므로 침전법을 쓴다. 크고(약 140×80μm) 호박색이며 난개가 있고, 쌍구흡충 충란(회색으로 조금 작고 난개 쪽이 뾰족하다)과 구별해야 한다. 우군 합동 분변에서 2g당 충란 1개 미만이면 손실 가능성이 낮고 10개 이상이면 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="176">•</span><span>소는 대개 무증상이지만 심하면 성장불량, 번식력 저하, 체중감소, 송아지는 빈혈·턱밑 부종·복수를 보인다. 소는 감염 5~6개월 뒤부터 부분 저항성이 생기고 대부분 1년 안에 흡충이 사라진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>치료는 알벤다졸 10mg/kg 경구(투여 전 24시간 절식하면 효과 증가, 임신 초기 금지), 클로르설론(clorsulon) 7mg/kg 경구, 트리클라벤다졸(triclabendazole, 8주 미만 어린 충에도 효과)이다. 세 약 모두 내성이 보고되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>전파기가 끝난 뒤 가을~초겨울에 효과 좋은 약으로 한 번 구충해 겨울 전에 성충을 없애고 다음 해 달팽이 감염을 막는다. 배수 개선, 습지 울타리, 봄~초여름 전략 구충을 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">쌍구흡충증</div>
<p class="bx-num"><span class="bxn" data-n="179">•</span><span>쌍구흡충(Paramphistomum spp.)은 비병원성 반추위 흡충으로 본다. 간질 구충제는 쌍구흡충에 듣지 않아 구충 뒤에도 충란이 계속 나올 수 있다. 같은 달팽이가 옮기는 지역에서는 쌍구흡충 충란이 간질 위험 지표가 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">안충</div>
<p class="bx-num"><span class="bxn" data-n="180">•</span><span>안충(Thelazia spp.)은 이버멕틴(ivermectin)이나 도라멕틴(doramectin) 200μg/kg 피하가 99~100% 효과이고, 레바미솔 5mg/kg 피하 또는 1% 수용액 국소를 쓴다. 회복까지 약 2개월이다. 감별은 세균성·바이러스성 결막염, 각막 열상, 이물이다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">외부기생충성 질병</div>
<div class="bx-sub"><div class="bx-subtitle">구제 원칙</div>
<p class="bx-num"><span class="bxn" data-n="181">•</span><span>새로 들인 소는 격리해 피부를 살핀다. 이는 숙주 밖에서 오래 못 살아 시설을 1~4주 비우면 도움이 된다. 젖은 유기물을 치워 파리 유충 서식처를 줄인다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">이감염증</div>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>이는 한두 마리에 심해도 우군 문제라 축사와 전두수를 함께 처리하고 2~4주 뒤 반복한다. 피레스로이드계 국소 살충제는 씹는 이와 빠는 이에 모두, 마크로사이클릭 락톤계는 주로 빠는 이에 듣는다. 살충제는 알을 죽이지 못해 2주 간격 2~3회 반복한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>털을 가르거나 깎으면 갈색 점으로 잘 보이고, 젖은 붓 자국 같은 핥은 자국이 특징이다. 빠는 이가 많은 송아지는 빈혈이 올 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">파리·등에·소가죽파리</div>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span>소가죽파리(Hypoderma) 유충 구더기증은 마크로사이클릭 락톤계에 반응하며, 처치 중 유충을 터뜨리면 급성 아나필락시스가 올 수 있다. 유충이 식도나 척수 주위에 머물 때 늦게 죽이면 식도염이나 마비가 올 수 있어 파리 시기 직후 유충이 작을 때 처치하고, 혹이 생긴 뒤에는 짜내지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>침파리(Stomoxys calcitrans)는 탄저와 BVDV를, 소등에(Tabanus 등)는 백혈병, 수포성구내염, 탄저를 기계적으로 옮길 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">옴(천공개선충증·모낭충증)</div>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>천공개선충(Sarcoptes scabiei)은 사람에게도 옮는다. 응애가 적어 소파 음성이라도 배제하지 못하므로 여러 곳과 귀를 깊이 긁는다. 2% 석회유황을 35~40.5℃로 데워 10~14일 간격 반복 약욕한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="187">•</span><span>소모낭충(Demodex bovis)증은 가려움이 없고 예후는 신중하게 본다. 치료는 대개 필요 없다. 이버멕틴 200μg/kg 주 2회와 아미트라즈 주 1회 약욕으로 성공한 보고가 있다.</span></p>
</div>
</div>
</div>
`;
}
function med_skinHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 피부·눈</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">버짐병(윤선증·링웜, ringworm)</div><div class="bx-sub"><div class="bx-subtitle">원인·역학</div><p class="bx-num"><span class="bxn" data-n="1">•</span><span>버짐병은 피부사상균이 일으킨다. 소에서는 대부분 Trichophyton verrucosum이고 T. mentagrophytes가 그다음이다. 균은 완전히 각질화된 죽은 조직에만 들어가 털줄기를 약하게 만들어 털이 빠진다. 쥐가 Trichophyton의 보균 동물일 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="2">•</span><span>잠복기는 1~6주다(1~4주, 1~3주로 적은 책도 있다). 병변은 대개 1~3개월 간다. 자연 회복까지 1~4개월(70~100일로 적은 책도 있다) 걸린다. 4개월이 지나도 낫지 않으면 면역 저하나 환경 요인을 찾는다.</span></p><p class="bx-num"><span class="bxn" data-n="3">•</span><span>회복에는 세포성 면역이 중요하다. 면역은 완전하지 않고 지속 기간도 모른다. 송아지 때 앓은 성우에서도 집단 발생이 있어 평생 면역이라는 생각은 의문이다.</span></p><p class="bx-num"><span class="bxn" data-n="4">•</span><span>만성 질병, 발육 불량, 영양 불량 소는 병변이 넓고 빨리 번진다. BVD 지속감염 송아지와 BLAD 송아지는 심하게 앓는다. 성우도 폐렴·복막염 같은 급성 병이 오거나 코르티코스테로이드를 쓰면 병변이 갑자기 퍼진다.</span></p><p class="bx-num"><span class="bxn" data-n="5">•</span><span>실내 사육우에 많아 햇빛 부족이 원인으로 꼽혔고 그래서 비타민 A·D를 써 왔다. 그러나 여름에도 송아지와 성우에서 생겨 햇빛의 중요성은 낮아 보인다. 실내 사육이나 햇빛이 적은 안개 낀 날씨에 많다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">증상·진단·감별</div><p class="bx-num"><span class="bxn" data-n="6">•</span><span>송아지는 눈 주위·귀·주둥이·목·몸통, 꼬리 아래 회음부에 흔하다. 성우는 몸통·목에 많고 얼굴 병변은 적다. 경산우·미경산우는 유방, 수소는 목밑 처진 살과 턱 사이에 흔하다. 소의 병변은 딱지가 두꺼워 사마귀처럼 보이기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="7">•</span><span>가려움은 대개 가볍거나 없다(없는 것부터 심한 것까지 다양하다고 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="8">•</span><span>대개 병력과 증상만으로 진단한다. 모든 소에서 확진하는 것은 비용 대비 이득이 없을 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="9">•</span><span>균은 가장자리의 자라는 부위에 있으므로 가장자리의 부러진 털을 뽑는다. 큰 딱지는 피한다. 채취 전에 알코올로 닦고 말린다. 배양이 가장 흔하고 믿을 만한 확진법이다.</span></p><p class="bx-num"><span class="bxn" data-n="10">•</span><span>10% 수산화칼륨 표본으로 털·각질 속 포자 사슬을 확인할 수 있으나 비용 대비 효과가 낮고 허상이 많다. 대부분의 병원성 피부사상균은 형광을 내지 않아 우드램프는 진단에 쓸 수 없다.</span></p><p class="bx-num"><span class="bxn" data-n="11">•</span><span>초기에 솟은 버짐 병변은 사마귀처럼 보일 수 있다. 반대로 넓고 납작한 회색 사마귀는 딱지 버짐으로 잘못 진단되기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="12">•</span><span>감별은 모낭충증, 더마토필루스증, 외부기생충, 낙엽상천포창, 포도상구균 피부염, 아연 반응성 피부병, 유두종, 피부형 림프육종이다. 더마토필루스증과 낙엽상천포창이 가장 중요한 감별이다. 개선충·건선충은 진드기가 나오고 가려움이 심하다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="13">•</span><span>대부분 저절로 나아서 치료가 실제로 얼마나 도왔는지 판단하기 어렵다. 그래도 치료하면 환경 오염이 크게 준다. 무리 수십 두의 병변 수백 개를 잡아서 바르는 일은 노동이 커서 실패가 흔하다.</span></p><p class="bx-num"><span class="bxn" data-n="14">•</span><span>약을 바르기 전에 딱지를 긁거나 솔로 털어 없앤다. 털을 깎으면 도움이 되지만 퍼뜨릴 위험이 있다. 떼어낸 딱지·털은 제대로 처리하고, 병변 가장자리 바깥까지 넓게 바른다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>전신 분무·침지는 2~5% 석회유황, 0.5% 차아염소산나트륨, 0.02% 에닐코나졸(0.2%로 적은 책도 있다)을 매일 5일 뿌리거나 담근 뒤 나을 때까지 주 1회 한다(석회유황은 5일 뒤 주 1회로 3~4주, 헹구지 않는다고 적은 책도 있다). 3% 캡탄도 쓰지만 효과는 의문이다. 석회유황과 1:10 표백제는 효과가 있지만 지저분하고 냄새·얼룩이 남는다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>병변이 적거나 몇 마리만 치료할 때는 미코나졸·클로트리마졸·테르비나핀 크림을 1일 1~2회 바른다. 7% 요오드를 연고 기제에 섞어 1일 1회 7일 바르기도 한다. 휫필드 연고(6% 벤조산 + 3% 살리실산)가 효과 근거가 가장 강하고, 1% 티오코나졸, 10% 포비돈요오드, 5~10% 황산구리 용액도 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>그리세오풀빈은 20~60 mg/kg 경구로 7일 이상이 효과가 있을 것으로 본다(1일 1회 7.5~10 mg/kg으로 적은 책도 있다). 효과가 확실치 않고 비싸다는 평가도 있다. 기형을 일으켜 임신우에 쓰지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>요오드화나트륨은 20% 용액을 체중 450kg당 150mL 정맥주사하고 3~4일 뒤 반복한다. 10~20% 용액을 체중 14kg당 1g 주 1회 정맥주사가 효과 있다고 보고됐다.</span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>이트라코나졸 5~10 mg/kg 1일 1회 경구, 이버멕틴 200 µg/kg 피하주사도 치료 목록에 든다. 비타민 A·D는 햇빛을 완전히 못 본 소에만 의미가 있고 효과는 증명되지 않았다.</span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>임상 치유가 진균 소실보다 먼저 오므로 나을 때까지 치료하고, 최소 4~6주다. 석회유황은 흰 털을 물들인다. 자극성 약을 매일 오래 바르면 딱지성 피부염이 생길 수 있다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="21">•</span><span>새로 들이는 소는 격리했다가 합사한다. 버짐이 없던 무리는 감염우가 들어오지 않는 한 계속 깨끗한 경향이 있다. 재감염을 막으려면 접촉한 소 전부와 환경·기구를 함께 처리한다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>우사는 물로 씻고 고압 분무한 뒤 석회유황이나 차아염소산나트륨으로 소독하고, 말린 다음 새 깔짚을 깐다. 병변이 없는 소만 다시 들인다. 솔·빗·털깎기는 쓴 뒤 씻고 소독한다. 포자는 몇 년 살아 있어 여러 번 반복해야 한다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>환경 소독제는 5% 석회유황, 5% 차아염소산나트륨, 5% 포르말린, 3% 캡탄, 3% 크레졸 분무, 에닐코나졸 분무·훈연이다. 2.5~5% 페놀 소독제, 2% 포름알데히드 + 1% 가성소다 분무도 효과가 있다고 한다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>영양과 축사를 개선하고 밖으로 내보내며 밀도를 낮춘다. 햇빛과 낮은 사육 밀도가 가장 효과적이라 방목하는 포유 육우 송아지는 실내 집단 사육 송아지보다 훨씬 덜 걸린다. 송아지 사육장은 올인올아웃이 낫고, 실내 사육 어린 소는 셀레늄·아연 섭취가 충분한지 본다.</span></p><p class="bx-num"><span class="bxn" data-n="25">•</span><span>소를 다루는 사람은 장갑을 끼거나, 다룬 뒤 요오드포나 녹색비누로 손을 잘 씻는다.</span></p><p class="bx-num"><span class="bxn" data-n="26">•</span><span>동유럽과 스칸디나비아에서는 T. verrucosum 백신 접종이 오래 성공했고, 체계적으로 접종한 지역에서는 버짐이 효과적으로 줄었다. 증상이 줄었다는 보고는 있으나 공격 접종 방어 근거가 없어 논란이라는 평가도 있다.</span></p></div></div>
<div class="bx"><div class="bx-title">유두종(사마귀, papillomatosis)</div><div class="bx-sub"><div class="bx-subtitle">원인·역학</div><p class="bx-num"><span class="bxn" data-n="27">•</span><span>소 유두종바이러스(bovine papillomavirus)는 1~14형이 알려져 있고(적어도 10형으로 적은 책도 있다), 형끼리 교차 면역이 약하다. BPV1·2는 머리·목·몸통·다리의 전형적 사마귀를 만들고 BPV2가 가장 흔하다. BPV1은 음경·유두·코에도 생긴다. BPV3은 낮고 납작한 비전형 사마귀로 몇 년 간다. BPV4는 식도·전위 등 소화관과 방광, BPV5·6은 유두에 생긴다.</span></p><p class="bx-num"><span class="bxn" data-n="28">•</span><span>6~24개월령이 가장 위험하고 한 번 앓으면 어느 정도 면역이 생긴다. 대개 2세 미만에 생겨 3~12개월 간 뒤 저절로 없어진다. 길게는 36개월까지 남아 살이 크게 빠질 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="29">•</span><span>바이러스가 표피 표면으로 올라와 스탄치온·사료조·목줄·솔·고삐·우리를 오염시키므로 산발보다 풍토병이 된다. 못·쪼개진 나무·철조망·볼트 끝에 긁힌 상처로 들어간다. 제각·귀표·문신·거세 기구를 소독 없이 같이 쓰면 집단 발생한다. 귀표·문신 뒤 귀에 생기는 사마귀는 나이와 상관없다.</span></p><p class="bx-num"><span class="bxn" data-n="30">•</span><span>곤충 전파는 의심되지만 증명이 어렵다. 임신 감정 직장검사로 육우 미경산우에 항문 주위 사마귀가 크게 퍼진 기록이 있다. 무리 지어 키우는 어린 수소끼리 올라타면서 옮고, 소독하지 않은 인공질로도 다른 소에 옮긴다.</span></p><p class="bx-num"><span class="bxn" data-n="31">•</span><span>크고 많은 사마귀가 없어지지 않는 소는 세포성 면역 결핍, BVD 지속감염, BLAD를 의심한다. 면역 결핍으로 보이는 소에서는 아주 큰 사마귀가 여럿 생겨 살이 빠진다. 젖소보다 육우(특히 헤어포드)에서 더 흔해 보인다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">증상·진단</div><p class="bx-num"><span class="bxn" data-n="32">•</span><span>한 무리에서 같은 부위에 몰려 있으면 귀표·제각 상처처럼 원인을 찾기 쉽다. 큰 꽃양배추 사마귀는 더운 철에 파리 자극·구더기증·출혈이 문제이고, 드물게 출혈로 생명이 위험하다.</span></p><p class="bx-num"><span class="bxn" data-n="33">•</span><span>어린 수소 음경 사마귀는 교배를 방해하고 채정·교배 뒤 음경·포피 출혈이 흔한 주호소다. 큰 음경 사마귀는 포경이나 감돈포경을 일으킨다. 미경산우 질 사마귀는 커서 음문 밖으로 나오기 전에는 잘 모른다.</span></p><p class="bx-num"><span class="bxn" data-n="34">•</span><span>식도·전위 사마귀는 대개 증상이 없지만 트림을 막아 미주신경성 소화불량 증상을 낸다. 고사리를 많이 먹으면 암으로 바뀔 위험이 크고, 방광 종양(지방병성 혈뇨)에도 관여한다.</span></p><p class="bx-num"><span class="bxn" data-n="35">•</span><span>진단은 대부분 증상으로 충분하고 비전형 병변은 조직검사를 한다. 감별은 편평상피암, 더마토필루스증, 버짐이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="36">•</span><span>피부 사마귀는 1~12개월 안에 저절로 낫는 경우가 많아 치료가 꼭 필요하지는 않다. 여러 치료·백신이 자연 치유를 자기 효과로 오해받아 왔다. 초기에 수술하거나 백신을 놓으면 남은 사마귀가 커지고 경과가 길어진다는 우려도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="37">•</span><span>작은 사마귀는 짓누르거나 비틀어 떼거나 수술로 떼고, 큰 것은 냉동수술을 쓴다. 늘어진 사마귀는 고무링으로 묶는다. 몇 개를 떼거나 짓누르기, 자가백신 피내·피하주사, 레바미솔은 세포성 면역을 자극하려는 것이지만 효과는 모른다. 냉동수술은 종양을 없애면서 다른 사마귀의 거부도 유도할 수 있어, 비전문가가 제각한 뒤 양쪽 제각 자리에 생긴 집단 발생에 가장 쓸모 있었다.</span></p><p class="bx-num"><span class="bxn" data-n="38">•</span><span>자가백신은 사마귀 조직을 균질·분쇄하고 두 번 얼렸다 녹인 뒤 걸러 0.5% 포르말린으로 불활화한다. 2mL를 피내주사하며 원문은 "3 times weekly"다. 1~2주 간격 2~4회가 흔하고, 몸 표면·음경 사마귀는 80~85%가 3~6주에 회복되지만 유두 사마귀는 33%에 그치고 낮고 납작한 사마귀는 반응이 나쁘다.</span></p><p class="bx-num"><span class="bxn" data-n="39">•</span><span>음경 사마귀는 수술로 떼는 것이 가장 좋다. 1~2% 리도카인 국소마취 뒤 메스나 전기소작으로 떼고, 큰 혈관은 묶으며 요도를 다치지 않게 한다. 큰 것은 다 못 떼면 덩어리를 줄인다. 떼어낸 뒤 바닥을 얼렸다 녹였다 얼리는 냉동을 하면 결과가 좋다. 줄기가 가는 사마귀는 쉽고 재발이 적고, 바닥이 넓은 것은 재발이 많다. 주변 정상 상피까지 함께 떼면 재발이 준다.</span></p><p class="bx-num"><span class="bxn" data-n="40">•</span><span>수술 뒤 4~6주(4주로 적은 책도 있다)에 아물었는지와 재발을 확인한 뒤 교배에 쓴다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="41">•</span><span>직접 접촉과 기구로 옮으므로 격리하고, 서로 비비지 못하게 하며 고삐·솔 같은 기구를 같이 쓰지 않는다. 제각기·귀표기·문신기는 소마다 바이러스 소독액에 담근다. 수술 기구·문신기·제각기는 쓸 때마다 멸균하거나 소독하고, 날카로운 시설물을 고친다.</span></p><p class="bx-num"><span class="bxn" data-n="42">•</span><span>시판 백신과 자가백신 모두 효과가 들쭉날쭉하다. 시판 백신은 이미 있는 사마귀를 거의 없애지 못하지만 같은 BPV형이면 새 병변을 막을 수 있고, 자가백신도 무리 안의 같은 형에 의한 새 병변을 막을 수 있다. 백신은 치료보다 예방으로 쓸 때 도움이 되며, 수송아지를 모아 키우는 곳이나 사마귀가 많은 농장에 맞다. 이유 뒤 여러 출처의 수소와 집단 육성할 수소에 사마귀 백신을 권한다.</span></p></div></div>
<div class="bx"><div class="bx-title">방선균증(혹턱, actinomycosis, lumpy jaw)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="43">•</span><span>방선균증은 Actinomyces bovis가 일으킨다. 그람양성으로 뼈에 생기고 국소 림프절은 대개 침범하지 않는다. 이가 나는 시기의 잇몸 구멍(치조)으로 들어가 이가 나는 어린 소에 흔하고, 젊은 성우에 가장 흔해 보인다. 거친 나무판 사료조를 같이 쓴 소 60두 중 7두가 걸린 집단 발생 기록이 있다.</span></p><p class="bx-num"><span class="bxn" data-n="44">•</span><span>아프지 않고 단단하며 움직이지 않는 뼈 혹으로 시작하고(초기에 열감과 통증이 있다고 적은 책도 있다), 아래턱 수평부에 가장 흔하다. 처음에는 누관이 없다가 진행하면 누관이 생기고 이뿌리를 침범한다. 이가 침범되면 씹을 때 아파하고 여윈다.</span></p><p class="bx-num"><span class="bxn" data-n="45">•</span><span>꿀이나 유청 같은 끈적하고 냄새 없는 노란 고름에 모래 같은 단단한 황색 알갱이가 섞인다. 위턱이 심하게 부으면 숨쉬기 어렵다. 누관 고름은 다른 소에 전염성으로 본다.</span></p><p class="bx-num"><span class="bxn" data-n="46">•</span><span>연조직형은 식도구에서 식도 아래·제2위 앞벽으로 퍼져 체중 감소, 간헐적 설사, 만성 고창을 낸다. 기관·고환·소화관에도 육아종이 생긴다. 내장 방선균증의 소화 장애는 만성 복막염과 비슷하다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">진단·감별</div><p class="bx-num"><span class="bxn" data-n="47">•</span><span>고름을 생리식염수와 섞어 알갱이를 슬라이드 사이에 눌러 그람 염색하면 그람양성의 가지 친 실 모양 균이 보인다. 배양은 잘 안 된다. 누관이 있으면 세척해서 입안과 통하는지 보고, 입안을 살펴 흔들리는 이, 식물 까락, 심한 잇몸염, 골절을 확인한다.</span></p><p class="bx-num"><span class="bxn" data-n="48">•</span><span>감별은 이뿌리 농양, 다른 균에 의한 골수염, 볼 농양(움직이고 연조직에 있다), 이와 볼 사이에 낀 사료·이물(말랑하고 움직인다), 림프육종·섬유육종(말랑하다), 골절, 종양이다. 위턱이면 부비동염도 본다. 볼·목 농양은 째서 배농하면 빨리 낫고, 갑자기 부었으면 입안부터 본다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·예방</div><p class="bx-num"><span class="bxn" data-n="49">•</span><span>요오드화나트륨 10~20% 용액 70 mg/kg을 정맥주사하고 7~10일마다 또는 더 자주, 요오드 중독이 나올 때까지 반복한다(3~5일마다, 또는 체중 450kg당 30g 1회나 2~3일 간격 반복으로 적은 책도 있다). 뼈 병변은 10~14일 간격으로 1~2회 더 놓는다. 요오드제는 방선균증에서 효과가 떨어져 항생제의 보조로 본다.</span></p><p class="bx-num"><span class="bxn" data-n="50">•</span><span>경구 유기 요오드는 하루 60 mg/kg을 먹이며, 반복 정맥주사가 어려울 때 3주 쓴다. 첫 정맥주사 뒤 체중 450kg당 약 30g(원문 1온스)을 매일 요오드 중독까지 먹이는 방법도 있다. 요오드화칼륨 1일 6~10g을 7~10일 먹이기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="51">•</span><span>요오드 중독으로 눈물, 기침, 식욕 저하, 설사, 비듬, 콧물과 얼굴·목의 비듬 같은 각질이 나오면 끊는다. 끊으면 곧 사라진다. 주입 중 불안, 호흡곤란, 빈맥을 보일 수 있고 피하로 새면 심한 자극이 생긴다. 권장 용량에서는 유산을 일으키지 않는다는 경험과 보고가 있지만, 고용량 유산 일화 보고와 임신우 금기 표시가 있어 조심한다.</span></p><p class="bx-num"><span class="bxn" data-n="52">•</span><span>항생제는 페니실린 22,000 U/kg 1일 1회에 요오드화나트륨을 함께 쓴다(22,000 U/kg 근육주사 1일 2회 7~14일로 적은 책도 있다). 프로카인 페니실린 44,000 IU/kg 1일 1회 7일 근육주사, 옥시테트라사이클린 10 mg/kg 1일 1회 7일 이상(지속성 20 mg/kg 72시간마다), 플로르페니콜 20 mg/kg 48시간마다 근육주사도 쓴다. 에리스로마이신이 시험관에서 활성이 있고, 스트렙토마이신은 전통적 1순위였다.</span></p><p class="bx-num"><span class="bxn" data-n="53">•</span><span>이소니아지드 10 mg/kg/일 경구 1개월(10~20 mg/kg 24시간마다 30일로 적은 책도 있다)을 쓴다. 유산을 일으킬 수 있어 임신우에 쓰지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="54">•</span><span>누관이 있으면 긁어내고 포비돈요오드로 세척한다. 혈관이 많아 출혈이 심할 수 있고, 구멍이 크면 요오드 거즈를 채운다. 흔들리는 이는 뽑고 누관은 요오드액으로 씻는다. 지나치게 긁어내면 뼈가 부러질 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="55">•</span><span>치료로 대개 진행이 멈출 뿐 혹은 크게 줄지 않는다. 아주 큰 병변은 어떤 치료에도 반응이 없어 일찍 시작해야 한다. 오랜 뒤에도 재발할 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="56">•</span><span>예방은 거칠고 줄기 많은 사료, 단단한 까락이나 엉겅퀴가 많은 풀밭을 피하는 것이다. 고름이 나오는 소는 격리하고, 이가 나는 어린 소의 턱이 붓는지 살핀다. 백신은 없다.</span></p></div></div>
<div class="bx"><div class="bx-title">방선간균증(actinobacillosis, 나무혀)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="57">•</span><span>방선간균증은 Actinobacillus lignieresii가 일으킨다. 그람음성 간균으로 반추동물의 입안과 반추위에 늘 살고 식물 까락에도 있다. 점막 상처로 연조직에 들어가 육아종성 농양을 만든다. 건초·짚에서는 5일 넘게 살지 못한다.</span></p><p class="bx-num"><span class="bxn" data-n="58">•</span><span>대개 산발하지만 거친 사료와 밀집 사육이 겹치면 침을 통해 다른 소의 상처로 빨리 퍼져 집단 발생한다. 줄기 많은 거친 헤일리지를 먹인 지 1개월 만에 4~24개월령 미경산우의 73%가 걸린 기록이 있다. 막대기·가시덤불이 섞인 질 나쁜 건초가 원인으로 꼽힌다. 도축 소 혀의 0.7~3.6%에서 보인다. 구리 결핍 지역에 많다.</span></p><p class="bx-num"><span class="bxn" data-n="59">•</span><span>혀가 붓고 아주 단단하며 아프고 결절이 만져진다. 혀가 입 밖으로 나오고 침을 많이 흘리며 먹지 못한다. 턱 사이가 커지고 단단하다. 혀 뿌리에 가장 많고, 혀 뿌리와 혀 몸통 경계의 혀 고랑에 식물 까락이 낀 궤양이 흔하다. 혀끝은 정상처럼 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="60">•</span><span>급성기에는 열이 있고 아급성·만성에는 없다. 혀 아래로 늘어난 침샘관이 물혹처럼 보이기도 한다. 만성이 되면 혀가 섬유화되어 굳고 침 흘림과 체중 감소가 흔하다. 송아지는 만성 혀 병변으로 먹지 못해 굶어 죽기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="61">•</span><span>비전형 병변은 머리와 목 앞쪽 림프절에 가장 흔하다. 코·눈꺼풀 육아종, 경정맥 주사 자리 육아종도 있고 종양·폴립·낭종과 헷갈린다. 붉고 살 같은 덩어리에 유황 알갱이가 있고 냄새 없는 묽은 고름이 나온다. 인두 뒤 림프절이 커지면 코 고는 소리를 내며 숨쉬고 삼키기 어렵다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">진단·감별</div><p class="bx-num"><span class="bxn" data-n="62">•</span><span>고름을 두 슬라이드 사이에 눌러 유황 알갱이(곤봉 모양 집락)를 보고, 그람음성 간균이면 의심한다. 확진은 배양이다. 급성 혀 병변은 물혹·혀·턱 사이 부종을 흡인해 도말·배양한다.</span></p><p class="bx-num"><span class="bxn" data-n="63">•</span><span>방선균증은 그람양성으로 뼈에 생기고 국소 림프절은 대개 침범하지 않는다. 방선간균증은 그람음성으로 혀·림프절·피부 같은 연조직에 생긴다.</span></p><p class="bx-num"><span class="bxn" data-n="64">•</span><span>감별은 인두 외상·농양, 인두 뒤 림프절염·림프육종, 입안 이물, 치아 병, 기생충·이물 육아종, 과잉 육아조직, 방선균증, 보트리오마이코시스, 종양, 광견병, 식도 막힘, 결핵이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·예방</div><p class="bx-num"><span class="bxn" data-n="65">•</span><span>요오드화나트륨 10~20% 용액 70 mg/kg을 정맥주사 1회 하고 7~10일 뒤 적어도 1회 반복한다. 반응이 나쁘면 2~3일 간격으로 더 자주 놓는다(20% 용액 70 mg/kg을 2~3일 간격으로 요오드 중독이 나올 때까지 놓는다고 적은 책도 있다). 20% 용액은 자극이 아주 심해 수의사만 정맥주사한다. 연조직 병변은 대개 1회로 충분하다.</span></p><p class="bx-num"><span class="bxn" data-n="66">•</span><span>심할 때는 유기 요오드 하루 60 mg/kg 경구를 정맥주사와 함께 쓴다. 요오드 중독 징후와 주의는 방선균증과 같다.</span></p><p class="bx-num"><span class="bxn" data-n="67">•</span><span>대부분 세프티오퍼, 암피실린, 페니실린, 플로르페니콜, 설파제, 테트라사이클린에 감수성이다. 심하거나 퍼졌거나 반응이 없으면 감수성 항생제를 요오드제와 함께 쓴다. 1차 옥시테트라사이클린, 2차 아목시실린, 3차 강화 설폰아마이드, 필요하면 요오드화나트륨 정맥주사 순으로 쓰기도 한다. 육아종은 덩어리를 줄이는 절제와 약물을 함께 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="68">•</span><span>48시간 안에 혀가 부드러워져 먹을 수 있을 만큼 반응이 빠르다. 아급성은 느리게 반응한다. 혀만 침범한 급성은 예후가 좋고, 비전형 부위나 만성은 보통~신중이다.</span></p><p class="bx-num"><span class="bxn" data-n="69">•</span><span>예방은 거칠고 줄기 많은 사료, 단단한 까락이나 엉겅퀴가 많은 풀밭을 피하는 것이다. 집단 발생하면 바로 부드러운 사료로 바꾸고 걸린 소를 하나하나 치료하면 빨리 끝난다. 백신은 없다.</span></p></div></div>
<div class="bx"><div class="bx-title">소 전염성 각결막염(핑크아이, infectious bovine keratoconjunctivitis)</div><div class="bx-sub"><div class="bx-subtitle">원인·역학</div><p class="bx-num"><span class="bxn" data-n="70">•</span><span>소 전염성 각결막염은 Moraxella bovis가 일으킨다. 코흐의 원칙이 확인된 균은 M. bovis뿐이고 용혈성 균주가 병원성이다. IBR 바이러스, M. bovoculi, 마이코플라스마는 각막 손상과 눈물·콧물을 늘려 위험을 높이는 것으로 본다. 일부 발생에서는 M. bovis 없이 마이코플라스마만 나왔다. 최근에는 M. bovoculi가 가장 많이 분리되지만 공격 시험에서 병을 재현하지 못했다.</span></p><p class="bx-num"><span class="bxn" data-n="71">•</span><span>위험 요인은 파리, 자외선, 식물 까락이다. M. bovis는 얼굴파리 몸 표면에서 3일, 장 속에서 2일 산다. 더위·먼지·파리가 많은 여름에 발생한다. 살충 귀표와 등·얼굴 문지르개로 파리를 줄이면 발생이 준다. 이송과 밀집은 각막 외상을 늘린다.</span></p><p class="bx-num"><span class="bxn" data-n="72">•</span><span>송아지와 1년생에 많고 대개 한쪽 눈이다. 집단 발생 때는 1년생의 90~100%가 걸리기도 한다. 헤어포드에 많고 브라만과 눈 가장자리 색소가 많은 소에 적다. 증상 없는 보균우가 1년 넘게 균을 지니고, 처음 들어온 무리는 나이와 상관없이 걸리며, 겨울에도 좁게 몰아 두면 돈다. 앓은 송아지는 체중이 줄어 한쪽 눈은 5kg, 양쪽 눈은 15.75kg 가벼웠다는 연구가 있다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">증상·진단·감별</div><p class="bx-num"><span class="bxn" data-n="73">•</span><span>잠복기는 대개 2~3일이다. 충혈과 장액성~점액화농성 눈물로 시작해 1~3일 안에 각막 가운데나 아래 가운데에 둥근 궤양이 생긴다. 눈꺼풀 경련, 눈부심, 눈물 자국이 심해지면서 눈에 띈다. 진행하면 가장자리가 녹는 깊은 분화구 궤양이 되고, 데스메막에 가까워지면 가운데가 맑거나 어둡게 보인다. 이때 통증이 심해 식욕과 체중이 준다.</span></p><p class="bx-num"><span class="bxn" data-n="74">•</span><span>각막 가장자리에서 들어온 혈관이 궤양에 닿으면 육아조직이 메우고, 상피가 덮이면 통증이 사라진다. 육아조직은 빨강에서 분홍, 흰색으로 바뀌고 부종은 가장자리부터 걷힌다. 완전히 정리되기까지 몇 주~몇 달 걸리며 대부분 가운데에 흉터가 남지만 시력 손실은 적다. 많은 경우 2~3주에 저절로 낫는다(모두 3~5주에 회복한다고 적은 책도 있다). 돌보지 않으면 데스메막류, 천공, 전안구염으로 간다.</span></p><p class="bx-num"><span class="bxn" data-n="75">•</span><span>각막 색으로 보면 파랑은 부종, 빨강은 혈관·육아조직, 노랑은 괴사·기질 농양이다.</span></p><p class="bx-num"><span class="bxn" data-n="76">•</span><span>대개 증상과 무리 안 여러 마리 발병으로 진단한다. 각막 병변은 플루오레세인으로 염색한다. 가운데 염색되지 않는 어두운 부분을 형광 고리가 둘러싸면 데스메막이 드러난 것으로 곧 천공될 위험이 있다.</span></p><p class="bx-num"><span class="bxn" data-n="77">•</span><span>배양은 국소마취제를 넣기 전에 면봉으로 채취한다. 활동성 궤양 가장자리를 문지르고 결막낭은 피하면 잡균이 준다. 베타락탐 치료에 반응이 없으면 마이코플라스마 등 다른 원인을 생각한다.</span></p><p class="bx-num"><span class="bxn" data-n="78">•</span><span>감별은 각막 외상(둔상·관통·열상·안검내반), 각막 이물(식물 조각이 가장 흔하고 젖은 면봉으로 떼어낸다), 포도막염·녹내장, 진균 각막염, 유피종, 편평상피암이다. 악성카타르열과 IBR도 각막 부종·염증을 낸다. 리스테리아 각결막염(질 낮은 사일리지를 곤포째 먹일 때, 각막 궤양이 드물다), Pasteurella multocida(72시간 안에 각막이 심하게 녹는다), Mycoplasma bovis(눈꺼풀이 심하게 붓는다), 클라미디아, 소 바이러스성설사, 블루텅, 안충증도 감별한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="79">•</span><span>2~3주에 저절로 낫는 경우가 많으니 항생제가 꼭 필요한지 따진다. 이미 아물어 하얘진 눈에 항생제를 쓰지 않도록 농가에 아문 병변을 알아보는 법을 가르친다. 균은 에리스로마이신, 린코마이신, 타일로신에 내성이다.</span></p><p class="bx-num"><span class="bxn" data-n="80">•</span><span>결막하 주사는 페니실린 G 300,000 U(600,000 IU를 2mL에 넣는다고 적은 책도 있다)를 결막 아래 놓는다. 안구 결막 아래에 놓아야 하고 윗눈꺼풀 결막 아래는 효과가 없다.</span></p><p class="bx-num"><span class="bxn" data-n="81">•</span><span>전신 투여는 옥시테트라사이클린 20 mg/kg 1~2회(2회 간격은 72시간, 48시간으로 적은 곳도 있다), 플로르페니콜 20 mg/kg 근육주사 48시간 간격 2회 또는 40 mg/kg 피하 1회, 세프티오퍼 결정형 6.6 mg/kg 귀 뒷면 뿌리 피하 1회, 툴라스로마이신 2.5 mg/kg 피하, 틸미코신 5 또는 10 mg/kg 피하다.</span></p><p class="bx-num"><span class="bxn" data-n="82">•</span><span>10% 옥시테트라사이클린 2mL(1~2mL로 적은 곳도 있다)를 눈꺼풀 안에 1회 놓으면 전신 투여(20mg/kg)와 효과가 같았다.</span></p><p class="bx-num"><span class="bxn" data-n="83">•</span><span>국소는 겐타마이신·에리스로마이신·토브라마이신 안연고를 하루 여러 번 넣는다. 안연고 대신 유방염 연고를 써도 된다. 가능하면 4~8시간마다 넣고, 용액보다 연고가 오래 머물러 낫다. 벤자틴 클록사실린 안연고 250~375mg을 72시간 간격 2회 넣으며, 한쪽만 걸려도 양쪽 눈에 넣고 같은 튜브를 쓰면 옮길 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="84">•</span><span>간이 처방은 처음에 결막하 페니실린 1회, 국소 항생제와 아트로핀 1회를 하고, 이후 매일 국소 반복, 옥시테트라사이클린이나 툴라스로마이신을 라벨 용량으로 전신 투여한다.</span></p><p class="bx-num"><span class="bxn" data-n="85">•</span><span>보조로 1% 아트로핀 안연고를 1일 2회 넣는다. 심하면 플루닉신(flunixin meglumine)으로 통증과 염증을 줄인다. 햇빛을 피해 가두고 분비물을 닦고 파리를 구제한다. 각막 부종이 심하면 5% 고장 식염 연고를 6~12시간마다 넣는다. 차아염소산 스프레이가 통증·감염·치유 기간을 줄였다는 실험 감염 연구가 있다.</span></p><p class="bx-num"><span class="bxn" data-n="86">•</span><span>안대는 대조 연구는 없지만 햇빛 통증을 덜고 파리 전파를 줄일 것이다. 아래쪽은 열어 배출되게 하고, 주 1~2회(주 2~3회로 적은 책도 있다) 들춰서 나빠지지 않았는지 본다.</span></p><p class="bx-num"><span class="bxn" data-n="87">•</span><span>각막 궤양·열상에는 코르티코스테로이드와 국소 비스테로이드 소염제를 쓰지 않는다. 국소·결막하 스테로이드는 치유를 돕는다는 근거가 없고 악화시킬 수 있다. 자극성 스프레이·가루는 피한다.</span></p><p class="bx-num"><span class="bxn" data-n="88">•</span><span>각막 병변이 있는 눈은 갑자기 나빠질 수 있어 적어도 24시간마다 본다. 심하면 제3안검 피판이나 눈꺼풀 봉합을 고려하고, 천공·전안구염으로 계속 아픈 눈은 적출한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="89">•</span><span>새로 들인 소 격리, 얼굴파리 구제, 환축 격리나 안대가 방제법이다. 살충 귀표와 등·얼굴 문지르개를 쓰고, 방목 전에 여문 풀을 베어 까락 외상을 줄인다. 미량광물 결핍 지역은 구리·셀레늄을 보충한다. 발생 때 무리 전체에 주사나 경구 항생제를 주는 방법도 써 왔다. 앓은 소는 파리 철이 끝날 때까지 안 앓은 소와 섞지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="90">•</span><span>시판 M. bovis 세균백신이 있지만 늘 효과가 있지는 않다. 선모 항원이 다양해 백신 균주와 농장 균주가 다르면 안 듣는다. 자가백신과 시판 백신이 효과가 없었다는 최근 연구가 있어 논쟁 중이다. 접종하려면 예년 발생 시기보다 적어도 4주 전에 시작한다.</span></p><p class="bx-num"><span class="bxn" data-n="91">•</span><span>환축을 다룰 때 일회용 장갑과 비닐 앞치마를 쓰고 고삐·기구는 소마다 바꾸거나 소독한다. 가정용 락스를 물 9에 1로 섞은 10% 희석액이 싸고, 매일 새로 만들며 흙·분변이 묻으면 효과가 떨어진다.</span></p></div></div>
<div class="bx"><div class="bx-title">럼피스킨병(lumpy skin disease) <span style="font-weight:500;font-size:12px;color:var(--muted,#6b7280)">제2종 가축전염병</span></div>
<div class="bx-sub"><div class="bx-subtitle">개요·전파</div>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>절지동물에 의한 기계적 전파로 본다. 이집트숲모기는 감염우를 흡혈한 지 2~6일 뒤 옮길 수 있다. 침파리는 바이러스를 지니지만 전파는 증명되지 않았고 단단진드기도 옮길 수 있다(침파리와 일부 진드기에서 전파가 확인됐다고 적은 책도 있다). 우기에 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>감염 소는 약 2주간 피에 바이러스가 돌고(바이러스혈증), 이 기간에는 피·모든 분비물·결절에 바이러스가 있어 전파가 가능하다. 정액에서는 바이러스 유전자가 5개월까지 나온다. 감염 정액을 쓴 인공수정으로 옮는 것이 실험으로 입증됐다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>송아지가 성우보다 잘 걸린다. 처음 노출된 무리는 이환율 85~100%, 폐사율은 대개 3% 미만이다. 상재지 이환율은 10~30%이고 폐사율이 10% 넘을 수도 있다. 회복우는 약 3개월 면역이 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">증상·진단</div>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>잠복기는 7~28일, 대부분 노출 10~12일 뒤 나타난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>첫 증상은 40~42℃ 발열로 4주까지 간다. 발열 2일 안에 1~5cm 결절이 목·주둥이·콧구멍·눈꺼풀·등·다리·음낭·회음부·유방·꼬리에 생기고 만지면 아파한다. 결절은 표피·진피·피하조직에서 표층 근육까지 들어간다. 흔히 회음부부터 나오고, 전신 결절이 생기는 것은 감염의 50% 미만이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>결절 가운데가 괴사되어 꺼지고 딱지 덮인 괴사 심이 남으며 2차 세균 감염이 흔하다. 아무는 데 5~6주, 심하면 6개월까지 간다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>국소 림프절이 크게 붓는다. 관절·건초·관상대가 부어 다리를 절 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>입·식도·반추위·기관·폐 점막 병변으로 삼킴곤란·호흡곤란·폐렴이 온다.</span></p>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>임신 말기 유산은 태아 감염보다 고열 때문으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>황소는 발열, 포피·음경 손상, 바이러스성 고환염으로 불임이 될 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>시료는 딱지가 앉기 전 초기 병변 조직, 부은 림프절 흡인물, 초기 바이러스혈증 때 전혈(헤파린·EDTA), 급성기·회복기 혈청이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>감별은 곤충 교상·두드러기, 소피부파리유충증, 광과민증, 소 구진성구내염(입술·주둥이·입안·식도에 생기고 열·통증이 없으며 어린 소만 걸린다), 가성 럼피스킨병, 우두·가성우두(유두·유방의 얕은 병변), 더마토필루스증이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>가성 럼피스킨병은 소 헤르페스바이러스 2형이 원인으로, 지름 2cm까지 둥글고 가운데가 온전하며 피부 표층만 침범하고 약 2주에 폐사 없이 끝난다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">치료·예방</div>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>대증 치료다. 플루닉신 같은 해열제로 열을 내리고 식욕을 돕는다. 피부·유방·관절·건초의 심한 2차 감염에는 항생제를 쓴다. 환축의 이동을 막고 격리하는 것이 확산 방지의 핵심이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>상재지에서는 약독화 양두 바이러스 백신이나 약독화 Neethling주 백신으로 발생을 잘 막았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>곤충 구제는 전파를 막는 효과가 증명되지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>이미 발생한 무리에 백신을 놓는 것은 대부분이 잠복기라 효과가 제한적이고, 주삿바늘 위생이 나쁘면 오히려 퍼뜨린다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">소 구진성구내염(bovine papular stomatitis)</div>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>소 구진성구내염 바이러스는 가성우두·전염성 농포성 피부염 바이러스와 가까운 파라폭스바이러스이고, 셋이 종에 따라 적응한 하나의 바이러스일 수 있다. 접촉과 공동 급이 기구로 옮는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>1~12개월령 송아지에 흔하고 성우는 드물다. 수주~수개월령 송아지에 많고 더 큰 육성우에도 생긴다. 비육장 입식 후 4주 동안 2~10mm 병변이 흔하고 이환율이 100%에 가깝다. 증상 없는 소 45두 중 31두가 양성이어서 소가 보유숙주로 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>콧구멍 아래 가장자리에 2~4mm 충혈점이 먼저 생기고 이어 입안에도 생긴다. 18시간 안에 솟은 구진이 되고 일부는 1cm 넘는 판이 된다. 1일~3주에 없어지고 노랑·빨강·갈색 반점이 몇 주 더 남는다. 2차 병변이 나타났다 없어지며 4개월까지 가는 송아지도 있다. 대부분 열이 없고 잘 먹는다. 발굽 관상대에는 병변이 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>입안에서는 딱지 같거나 갈황색이고 가장자리가 거칠다. 납작하면 미란으로 오인한다. 가운데가 흰색으로 괴사해 떨어지면 구진 안에 궤양이 남는다. 약한 침 흘림과 젖·사료 거부가 있을 수 있지만 대부분 증상이 없어 모르고 지나간다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>중증형은 체중 감소·설사·침 흘림과 함께 입·식도·반추위에 미란이나 얕은 궤양이 생기고, 폐사율이 50%를 넘은 발생도 보고됐다. 치명적이었다는 옛 보고 대부분은 BVD 동시 감염이었을 것으로 보이며, BVD 지속감염우나 IBR·만성 세균 감염이 병변을 키운다. 비육장의 쥐꼬리 증후군(설사, 침 흘림, 증체 불량, 꼬리 끝 탈모)과 관련된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>소 입을 검사한 사람, 특히 손에 상처가 있으면 손에 아픈 증식성 병변이 생긴다.</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>감별은 BVD·점막병, 구제역, 가성우두, 수포성구내염, 남미의 우두 바이러스다. 이 병의 가장 큰 의의는 구제역과의 감별이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>특이 치료나 예방법은 없다. 심한 소만 대증 치료한다. 송아지를 따로 키우고 공동 급이 기구·양동이를 쓰지 않는다. 판매되는 백신은 없고 지역 분리주가 더 잘 막을 것이다. 반복 감염이 기록돼 면역이 잘 생기지 않는 것으로 본다.</span></p>
</div>
<div class="bx"><div class="bx-title">가성우두(pseudocowpox)</div>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>가성우두 바이러스는 구진성구내염·전염성 농포성 피부염 바이러스와 가까운 파라폭스바이러스이고, 셋이 종에 따라 적응한 하나의 바이러스일 수 있다. 젖소에 흔하고 육우에는 덜하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>감염 유두를 빤 송아지는 입안 병변이 생기고 구진성구내염과 구별되지 않는다. 젖을 빨지 않는 어린 송아지의 주둥이·입술 병변도 관찰됐다. 오염된 우유나 젖병으로 송아지가 감염된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>2~3mm 구진에서 딱지가 앉고 둥글게 퍼져 약 10일 뒤 15~20mm 고리나 말굽 모양 딱지가 된다. 깊은 궤양과 수포는 드물고 전신 증상은 없다. 딱지 아래에서 아물며 궤양이 아니라 솟아오르고, 2~3주에 아물지만 만성이 되기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>감염 뒤 면역이 거의 생기지 않아 무리 안에서 돌고 돈다. 사람 손·손가락·얼굴에 잘 낫지 않는 둥근 궤양을 만든다.</span></p>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>감별은 소 헤르페스 유두염(BHV-2, 작은 수포·농포가 터져 느리게 낫는 궤양), 구진성구내염, 유두종, 우두, 구제역(입·발굽 사이 수포가 함께 있다), 수포성구내염이다. 가장 중요한 감별은 헤르페스 유두염과 유두종이다. 전신 증상이 있으면 다른 점막병을 찾는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>진단은 딱지로 PCR, 바이러스 분리, 전자현미경 검사를 한다. 대개 저절로 나아서 병변을 깨끗이 하고 2차 세균 감염만 막으면 되며, 2차 감염이 있으면 전신·국소 항생제를 쓴다. 떼어낸 딱지는 환경 오염을 막도록 태운다.</span></p>
</div>
</div>
`;
}
function med_mskHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 근골격</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">발굽질환 개요</div><div class="bx-sub"><div class="bx-subtitle">원인·예방</div><p class="bx-num"><span class="bxn" data-n="1">•</span><span>발 부위 파행 대부분은 두 발굽 사이의 체중 분배가 고르지 않아서 생긴다. 뒷발은 바깥 발굽에 체중이 더 실려 그 발굽 각질이 보상적으로 더 자라고, 이것이 체중 불균형을 더 키운다. 앞발은 안쪽 발굽이 체중을 가장 많이 받는다.</span></p><p class="bx-num"><span class="bxn" data-n="2">•</span><span>단순 과신장은 그 자체로는 아프지 않지만 발굽 각질 질환의 소인이 되고 통증성 병변이 있는 소에 흔히 같이 있다. 파행을 치료할 때 정상 모양으로 깎아 주고, 우군 전체 과신장 정도를 보고 정기 삭제 필요성과 주기를 조언한다.</span></p><p class="bx-num"><span class="bxn" data-n="3">•</span><span>예방은 누워 쉬는 시간을 늘리고 서 있는 시간을 줄이는 사육 환경, 진흙·분뇨가 쌓이지 않는 마른 바닥, 정기 삭제로 병변을 일찍 찾고 체중을 고르게 싣게 하는 것이다. 콘크리트 바닥이나 가둬 기르는 우사는 방목보다 파행 위험이 크다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">파행 검사·감별</div><p class="bx-num"><span class="bxn" data-n="4">•</span><span>단단한 바닥(콘크리트)에서 걷게 하고 보폭이 짧거나 고르지 않은지, 등을 굽히는지, 머리를 흔드는지 본다.</span></p><p class="bx-num"><span class="bxn" data-n="5">•</span><span>가장 쉬운 평가는 3단계로, 정상, 파행(위 징후가 있지만 다리에 체중은 싣는다), 중증 파행(다리에 체중을 싣지 않는다)으로 나눈다.</span></p><p class="bx-num"><span class="bxn" data-n="6">•</span><span>한쪽 다리만 바깥으로 벌리면 대개 바깥 발굽 통증이다. 뒷다리 바깥 발굽의 백선 질환이면 체중을 안쪽 발굽으로 옮기려고 다리를 벌린다.</span></p><p class="bx-num"><span class="bxn" data-n="7">•</span><span>뒷다리를 몸 아래로 당겨 서면 제엽염 등으로 앞발이 아픈 것이고, 제엽염과 통증으로 안쪽 발굽 체중을 덜려고 앞다리를 교차하기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="8">•</span><span>발끝 궤양이 있으면 뒤꿈치부터 딛는다.</span></p><p class="bx-num"><span class="bxn" data-n="9">•</span><span>발굽과 지간을 깨끗이 씻고 병변 위치를 본다. 보이는 병변이 없으면 발굽테스터로 통증을 찾는데, 발바닥 뒤쪽 안쪽의 제저궤양 자리, 발끝 궤양 자리, 발바닥 출혈 부위를 눌러 본다. 지간 피부와 지간 틈에 균열이나 지피염 병변이 있는지도 꼼꼼히 본다.</span></p><p class="bx-num"><span class="bxn" data-n="10">•</span><span>발이 좌우 대칭으로 붓고 구절 위까지 올라가면 대개 지간부란이고, 한쪽 발굽만 부으면 화농성 건초염, 발굽 뒤쪽 깊은 농양, 원위지관절 감염인 경우가 더 많다. 발굽 각질 병변은 발굽테스터로 발바닥 전체를 눌러 보면 통증 반응을 보인다. 다리 위쪽 파행은 특징적인 걸음걸이 변화가 있고 발굽테스터에 반응이 없다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·발굽 삭제</div><p class="bx-num"><span class="bxn" data-n="11">•</span><span>치료 원칙은 먼저 통증을 없애고, 가능하면 근본 문제를 고치는 것이다.</span></p><p class="bx-num"><span class="bxn" data-n="12">•</span><span>아래층에서 떨어진 각질은 제거한다.</span></p><p class="bx-num"><span class="bxn" data-n="13">•</span><span>붕대는 치유를 돕지 않고 지혈이나 약을 붙여 두는 용도로만 쓰며 며칠 안에 풀어 병변을 드러내 둔다.</span></p><p class="bx-num"><span class="bxn" data-n="14">•</span><span>발굽블록은 통증성 질환 관리의 필수 도구다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>심한 발굽 각질 질환과 발굽 수술 뒤에는 플루닉신, 케토프로펜, 멜록시캄 같은 비스테로이드 소염제를 고려한다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>기능적 삭제는 발굽 앞벽을 단단해지는 제관 근처 지점부터 재어 75 mm로 자른다. 이어 발끝에서 가장 두껍고 뒤꿈치 쪽으로 갈수록 얇아지는 쐐기 모양으로 발바닥과 벽을 깎되 발끝 두께는 5 mm를 남겨 멍이 들지 않게 한다. 더 높은 발굽의 뒤꿈치를 깎아 두 발굽의 체중을 맞춘다. 마지막으로 두 발굽 안쪽 가장자리를 따라 발바닥을 오목하게 판다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>소독조 약액은 포르말린 3~5%, 황산동 5%를 쓰고, 분변 오염으로 효과가 떨어지므로 100~300두가 지나갈 때마다 비우고 청소해 다시 채운다.</span></p></div></div>
<div class="bx"><div class="bx-title">지간피부염(interdigital dermatitis)</div><p class="bx-num"><span class="bxn" data-n="18">•</span><span>Dichelobacter nodosus 감염에 의한 만성 지간피부염으로, 습한 곳에 서 있는 소에 매우 흔하다. 지간 피부 표피에 국한된 염증이며 D. nodosus가 1차 또는 보조 원인균이고 트레포네마도 관여한다. 지피염과 같은 질병군의 다른 모습이라는 견해가 있다. 밀사하고 축축하고 더러운 우사에서 흔하다.</span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>무증상 소에서도 아프지 않은 지간 피부 미란·궤양으로 감염을 알 수 있다. 대개 발굽 썩는 냄새(부제병)와는 다른 특유의 냄새가 나는 축축한 흰 삼출물이 있다. 초기에는 지간 틈에 표피 미란이 넓게 퍼지고, 지간 상피에 작은 원형 궤양이 생기며, 심하면 궤양·괴사와 함께 발굽 각질 아래가 들뜬다. 만성은 각화 과다로 피부가 거칠어진다.</span></p><p class="bx-num"><span class="bxn" data-n="20">•</span><span>가벼운 자극으로 아래 피부가 두꺼워지고 옆 발굽 안쪽 벽이 빨리 자랄 수 있다. 피부 비후는 지간증생이나 안쪽 벽 각질 과다로 이어진다.</span></p><p class="bx-num"><span class="bxn" data-n="21">•</span><span>감염이 뒤꿈치로 번지면 뒤꿈치 각질이 불규칙하게 침식되거나 뒤꿈치와 발바닥 경계에 가로 균열이 생긴다. 균열과 뒤꿈치 피부 비후로 체중 분배가 바뀌어 뒤꿈치 압력이 늘면서 절게 된다. 심하게 절지는 않고 뒤꿈치를 분뇨 도랑이나 턱 너머로 띄우고 서기도 하며 대개 양쪽 뒷다리에 대칭으로 온다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>감별은 지피염으로, 지간피부염은 지피염보다 덜 아프고 표면이 과립상·술 모양·유두종 모양인 경우가 드물다. 회색으로 축축하게 두꺼워진 피부에 얕은 궤양과 각화 과다가 군데군데 있다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>치료는 교정 삭제로 과다한 각질을 모두 제거하고 지간을 벌려 스스로 깨끗해지고 공기가 잘 통하게 한다. 뒤꿈치 균열은 덮고 있는 각질 조각을 잘라 내 공기에 노출시킨다. 원인균이 깊은 뒤꿈치 균열 속에 살아남으므로 균열을 깎아 오물이 끼지 않고 소독액이 닿게 한다. 진피가 드러난 드문 경우에는 발굽블록을 붙인다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>요오드, 구리·아연 용액 같은 국소 소독제는 모두 균을 죽이는 데 효과가 있다. 지피염과 같은 국소 항생제나 소독조로 치료·예방할 수 있지만 소독조를 꾸준히 해도 남아 있을 수 있다. 일반적인 비경구 부제병 치료에는 잘 반응하지 않는다.</span></p></div>
<div class="bx"><div class="bx-title">제구미란(heel horn erosion)</div><p class="bx-num"><span class="bxn" data-n="25">•</span><span>지간피부염 감염이 뒤꿈치로 번져 생기며, 뒤꿈치 각질이 조개껍데기처럼 겹겹이 파인 모양이 전형적이다. 균이 내는 단백분해효소가 발굽 각질을 녹인다.</span></p><p class="bx-num"><span class="bxn" data-n="26">•</span><span>만성 지간피부염에는 뒤꿈치 균열(제구미란)이 흔히 같이 오고, 뒤꿈치 각질 아래가 들뜨면 심하게 절 수 있다.</span></p></div>
<div class="bx"><div class="bx-title">지간증생(interdigital hyperplasia)</div><p class="bx-num"><span class="bxn" data-n="27">•</span><span>지간 인대가 느슨해 발굽이 벌어지는 체형과 관련된 유전 질환이며, 만성 지간피부염에 이어 후천적으로도 생긴다. 발굽이 벌어지는 체형은 주로 육우 문제이고 지간증생 소인이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="28">•</span><span>그 자체로는 아프지 않지만, 너무 커서 걸을 때 발바닥과 바닥 사이에 끼면 아프다. 부제병 위험을 높인다. 지간 틈의 지피염 병변은 흔히 지간증생 자리에 생긴다.</span></p><p class="bx-num"><span class="bxn" data-n="29">•</span><span>정기 삭제 때 습관적으로 제거하는 것은 말리고 근본 원인을 고쳐야 한다. 심한 통증의 원인일 때만 수술로 제거한다. 딱딱한 섬유조직이며 진행된 것은 수술로 제거해야 한다.</span></p></div>
<div class="bx"><div class="bx-title">우상성피부염(지피염, digital dermatitis)</div><div class="bx-sub"><div class="bx-subtitle">원인·병변</div><p class="bx-num"><span class="bxn" data-n="30">•</span><span>여러 혐기성 세균이 관여하며 활동성 병변에서는 트레포네마(Treponema)가 가장 꾸준히 나오고 표피·진피까지 들어간다. 거의 젖소에서만 본다고 적은 책도 있지만 육우를 포함한 모든 품종에서 보고되었다.</span></p><p class="bx-num"><span class="bxn" data-n="31">•</span><span>거친 바닥, 배수 불량, 분뇨 고임, 더럽고 축축한 깔짚, 밀사가 위험을 높인다. 감염우·무증상우의 접촉, 삭제 기구, 운반 차량으로 옮는다. 진흙·습한 환경과 외부 개체 구입이 가장 중요한 위험 요인이고, 들어오면 1년 안에 성우 대부분으로 빠르게 퍼진다. 재발이 흔하고 저절로 낫는 경우는 드물다.</span></p><p class="bx-num"><span class="bxn" data-n="32">•</span><span>약 80%가 뒷발 뒤꿈치 바로 위, 지간 틈 쪽 피부에 생기며 며느리발톱 아래 피부에만 생긴다. 1단계는 1~2 cm의 붉은 딸기 모양으로 매우 아프고, 2단계는 2~6 cm 궤양에 둘레 털이 2~3배 길다. 3단계는 회색 딱지가 앉으며 낫는 중이고, 4단계는 검은 실 모양 돌기가 난 만성 증식형, 5단계는 치유다. 실 모양 돌기 길이는 1 mm~3 cm다(1 mm~2 cm 이상, 10~15 mm로 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="33">•</span><span>씻으면 매우 아프고 건드리면 쉽게 피가 난다. 병변 크기와 파행 정도가 꼭 비례하지 않는다. 치료하지 않으면 뒤꿈치를 딛지 않아 뒤꿈치가 길어진다. 특징적인 모양과 위치로 진단한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">감별·치료</div><p class="bx-num"><span class="bxn" data-n="34">•</span><span>개체 감별은 지간부란, 지간증생, 지간피부염, 육아조직이 생긴 외상, 제구미란, 과삭제로 얇아진 발바닥이다. 우군 문제면 제엽염, 거칠거나 부식성 바닥에 의한 발바닥 과마모, 삭제 불량도 본다. 전신 증상이 있으면 BVD·구제역 같은 바이러스성 제관염을 생각한다.</span></p><p class="bx-num"><span class="bxn" data-n="35">•</span><span>국소 항생제가 가장 흔한 치료다. 옥시테트라사이클린 25 g/L 또는 린코마이신 8 g/L 용액을 2~4 L 분무기로 하루 1회 5~14일 뒤꿈치에 뿌리거나, 두 약 중 하나의 분말 2 g을 솜에 올려 탄력붕대로 감고 매일 갈아 5~10일 둔다. 개체 병변에 주사용 옥시테트라사이클린 3 mL를 국소에 바르는 방법도 있으며, 붕대를 감든 안 감든 결과는 같았다. 10% 주사용 옥시테트라사이클린 5~15 mL를 솜에 묻혀 얇게 감기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="36">•</span><span>재발이 많아 45~60일 뒤 다시 치료해야 할 수 있고, 치료 28일 뒤 겉보기에 나은 병변의 절반 이상에 현미경적 감염이 남아 있었다. 비경구 페니실린과 세프티오퍼가 효과 있었다는 보고가 있지만, 전신 항생제는 대부분 보고에서 이득이 없었다고 적은 책도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="37">•</span><span>우군 치료의 소독조 약액은 포르말린 5%, 옥시테트라사이클린 1~4 g/L, 린코마이신 1~4 g/L, 황산동 0.25~1 g/L, 황산아연 20% 등을 쓴다(포르말린 3~5%, 황산동 5%로 적은 책도 있다). 유병률 10% 미만 우군에서 반응이 좋고, 유병률이 높으면 개체 국소 치료가 더 효과적이다. 앞에 물 소독조를 하나 더 두어 발을 먼저 씻게 하고, 150~300두가 지나가면 약액을 갈며, 2~7일마다 실시한다. 소가 약액을 마시지 않게 조심한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예후·예방</div><p class="bx-num"><span class="bxn" data-n="38">•</span><span>치료 직후 오히려 더 아파하지만 48시간 안에 파행이 거의 풀린다. 72시간 뒤에도 많이 절면 다른 원인을 다시 찾는다. 재발이 흔해 관리를 계속해야 한다.</span></p><p class="bx-num"><span class="bxn" data-n="39">•</span><span>통로를 자주 긁어내고 우상을 깨끗하고 마르게 하며, 새 소를 들일 때 지피염이 있는지 확인하고, 농장 사이를 다니는 삭제 기구를 소독한다. 유효 요오드 2.5% 소독제로 삭제 기구를 씻으면 트레포네마 검출이 줄었다. 백신은 효과가 보고되지 않았다.</span></p></div></div>
<div class="bx"><div class="bx-title">지간부란(부제병, foot rot)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="40">•</span><span>그람음성 혐기성균인 Fusobacterium necrophorum이 주 원인균이고 Prevotella melaninogenica, Porphyromonas levii, Dichelobacter nodosus가 단독 또는 함께 비슷한 병변을 만든다. F. necrophorum과 Bacteroides melaninogenicus 둘 다 있어야 발병한다고 적은 책도 있다. 모두 반추동물 소화관 상재균이라 환경에 흔하다.</span></p><p class="bx-num"><span class="bxn" data-n="41">•</span><span>오래 젖어 짓무르거나 상처로 지간 피부가 손상되면 들어가 백혈구독소와 단백분해효소로 조직을 파괴한다. 질척한 운동장, 물 고인 방목지, 날카로운 자갈·콘크리트·그루터기가 위험하다.</span></p><p class="bx-num"><span class="bxn" data-n="42">•</span><span>발생률은 육우 1~3%다. 대개 산발적이지만 조건에 따라 집단 발생한다. 새 소를 들이면 독성 강한 균주가 들어와 집단 발생할 수 있다. 감염 후 24시간 안에 절 수 있고 진행이 빠르다. 대부분 발가락 연부조직에 그치지만 건·관절·뼈로 번지기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="43">•</span><span>한 다리 이상의 경도~중등도 파행으로 시작하며 뒷다리에 많다. 제관부가 좌우 대칭으로 붓고 구절까지 올라갈 수 있으며, 지간이 부어 두 발굽이 벌어진다. 지간에 괴사된 균열이 하나 이상 생기고 혐기성 괴사 특유의 냄새가 난다. 삼출물과 위막이 있을 수 있다(대개 삼출물 없는 마른 괴사라고 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="44">•</span><span>가벼운 열이 나고 누워 있는 시간이 늘어 사료 섭취가 준다. 어린 송아지는 다리를 들고 흔들거나, 여러 다리가 아프면 신경 질환처럼 비틀거려 보일 수 있다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">진단·치료</div><p class="bx-num"><span class="bxn" data-n="45">•</span><span>진단은 붓는 양상, 지간 균열, 냄새로 하는 임상 진단이다. 감별은 화농성 관절염, 발바닥 농양, 건초염, 제3지골 골염, 지간증생, 제엽염, 외상이다. 화농성 관절염·골수염·뒤꿈치 깊은 감염·백선 질환은 대개 아픈 발굽 한쪽만 비대칭으로 붓고, 이물은 상처 길이 있다.</span></p><p class="bx-num"><span class="bxn" data-n="46">•</span><span>농가에서 진단·치료한 경우가 많으므로 정말 부제병인지 확인한다. 원래 병이 제저궤양이면 항생제를 바꿔도 소용없다.</span></p><p class="bx-num"><span class="bxn" data-n="47">•</span><span>합병증 없는 대부분은 비경구 항생제로 며칠 안에 반응해 완전히 낫는다. 미국에서 부제병 적응증이 있는 약은 옥시테트라사이클린, 플로르페니콜, 세프티오퍼, 타일로신, 설파디메톡신, 툴라트로마이신이다. 결정형 세프티오퍼 6.6 mg/kg 귀 기부 피하 1회와 세프티오퍼 나트륨 3일 연속 투여의 회복률은 차이가 없었고, 세프티오퍼와 옥시테트라사이클린도 차이가 없었다. 대부분 어떤 항생제든 듣지만 다제내성 균주가 있고, 이 경우 타일로신이 듣는다.</span></p><p class="bx-num"><span class="bxn" data-n="48">•</span><span>보조로 비스테로이드 소염제를 흔히 쓴다. 멜록시캄 0.5 mg/kg 경구, 주사용 멜록시캄 0.5 mg/kg, 케토프로펜 3 mg/kg, 카프로펜 1.4 mg/kg. 국소 치료는 대개 필요 없고 젖은 붕대는 상황을 악화시킬 뿐이다. 괴사 조직을 씻어 내고 제거하면 도움이 되기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="49">•</span><span>증상 시작 24시간 안에 치료하면 대개 2~4일에 회복한다. 늦으면 회복이 10일 이상 길어진다. 72시간 안에 나아지지 않으면 다른 계열 항생제를 쓴다. 회복 중에는 깨끗하고 마른 곳에 두고, 기대대로 낫지 않으면 발을 다시 자세히 검사해 다른 병변이나 깊은 조직 감염을 찾는다.</span></p><p class="bx-num"><span class="bxn" data-n="50">•</span><span>합병증은 화농성 관절염, 화농성 건초염, 굴건 파열, 지간 농양, 골수염이고, 화농성 관절염이나 골수염이 되면 발굽 절단이 필요할 수 있다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="51">•</span><span>마르고 편한 쉴 자리를 주고 하루 10시간 이상 누울 수 있게 사육 밀도를 맞춘다. 급이·통행 구역 분뇨를 자주 치워 발이 계속 젖지 않게 한다. 방목우는 우기에 마른 땅을 쓰게 하고 급수·급이 장소는 배수와 분뇨 청소를 한다. 이동 통로의 돌·나뭇가지를 치운다.</span></p><p class="bx-num"><span class="bxn" data-n="52">•</span><span>소독조는 황산동·황산아연 5~10% 또는 포르말린 3~5%를 쓴다(포르말린 3%, 황산동 2%, 옥시테트라사이클린, 린코마이신·스펙티노마이신을 써 왔다고 적은 책도 있다). 건식 소독조로 황산동 10%와 소석회를 쓰기도 한다. 소를 충분히 서 있게 하기 어렵고 오래 서 있으면 분변에 오염되어 효과가 떨어진다.</span></p><p class="bx-num"><span class="bxn" data-n="53">•</span><span>백신은 독립적인 효능 자료가 적고, 부제병을 줄였다는 비육우 연구는 사료 차이와 얽혀 있었다. 요오드, 구리, 셀레늄, 아연, 비오틴 보충 효과는 결과가 일정하지 않았다.</span></p></div></div>
<div class="bx"><div class="bx-title">제엽염(laminitis)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="54">•</span><span>말은 앞발, 반추동물은 뒷발에 가장 흔하다. 소에서는 농후사료를 과하게 먹고 콘크리트 바닥에서 지내는 과체중 미경산우가 위험이 높아 보인다. 콘크리트 바닥과 고농후사료가 겹치면 위험이 크게 높아진다.</span></p><p class="bx-num"><span class="bxn" data-n="55">•</span><span>진피 손상은 일차 손상 시기에 체중을 싣고 서 있어야 생긴다. 걷기보다 가만히 서 있는 것이 손상된 진피에 더 해롭고, 누워 있는 동안에는 거의 생기지 않는다. 제3지골이 발바닥 쪽으로 움직이면 발바닥 출혈이나 제저궤양이 생기고, 백선 출혈이 심하면 혈종이 무균성 또는 세균성 농양이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="56">•</span><span>급성 제엽염은 드물고 아급성·무증상·만성형이 훨씬 흔하다. 원인이 된 사건에서 발굽 변화가 보이기까지 2개월 이상 걸릴 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="57">•</span><span>반추동물은 발바닥이 물러지고 연한 노란색으로 변한다. 발굽이 웃자라고 넓고 납작해지며 앞벽이 오목하게 휜다(슬리퍼 발굽). 발굽 앞벽에 가로 홈이 생긴다. 발바닥 출혈, 제저궤양, 백선 분리·농양, 푸석푸석한 발바닥 각질, 이중 발바닥이 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="58">•</span><span>감별은 지피염(digital dermatitis), 지간 봉와직염, 발굽 과신장, 얇은 발바닥이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·예방</div><p class="bx-num"><span class="bxn" data-n="59">•</span><span>기능적 삭제로 모든 발굽을 정상 모양으로 되돌린다. 제저궤양·백선 농양은 정상 각질이 진피에 잘 붙어 있는 곳까지 주변 각질을 깎아 낸다. 병변 주변 발바닥은 비스듬히 깎아 오물이 차는 깊은 구멍이 생기지 않게 한다. 건강한 발굽에 나무·고무·플라스틱 블록을 붙여 아픈 발굽에 체중이 실리지 않게 한다.</span></p><p class="bx-num"><span class="bxn" data-n="60">•</span><span>진통은 보통 약이 필요 없다. 병변이 심하면 비스테로이드 소염제를 쓴다. 플루닉신(flunixin meglumine) 1.1~2.2 mg/kg 하루 1회, 또는 멜록시캄(meloxicam) 0.5 mg/kg 하루 1회 경구.</span></p><p class="bx-num"><span class="bxn" data-n="61">•</span><span>삭제와 병변 처치로 대부분 좋아진다. 1주 안에 나아지고 2주면 거의, 3주면 정상 보행한다. 기대대로 낫지 않으면 다시 검사한다. 만성·중증은 제3지골 위치가 바뀌어 재발이 반복되고 예후가 나쁘다. 방치한 제저궤양·백선 농양은 뼈·관절·건으로 번질 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="62">•</span><span>비육우는 조사료 위주에서 농후사료 위주로 천천히 바꿔야 한다. 밀사를 피하고 편히 누울 자리를 주어 발굽 부담을 줄인다. 편히 오래 누울 수 있게 하는 것이 강력한 제엽염 예방책이다. 아연 메티오닌과 비오틴이 제엽염 관련 병변을 줄였다는 보고가 있다.</span></p></div></div>
<div class="bx"><div class="bx-title">제저궤양(sole ulcer)</div><p class="bx-num"><span class="bxn" data-n="63">•</span><span>제3지골 굴건 돌기와 바닥 사이에서 진피가 허혈과 압박 손상을 받아 생긴다. 그래서 굴건 돌기 바로 아래, 체중이 더 실리는 뒷발 바깥 발굽과 앞발 안쪽 발굽에 생긴다. 좌우 대칭으로 양쪽에 오기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="64">•</span><span>발끝 궤양은 과삭제나 과마모로 생기고, 뒤꿈치와 발바닥 경계 궤양은 심한 지간피부염에 이어 생기기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="65">•</span><span>치료는 병변 부위에 체중이 실리지 않게 하는 것이다. 교정 삭제로 아픈 발굽의 뒤꿈치를 낮추고, 대개 건강한 발굽에 블록을 붙인다. 붕대는 권하지 않는다. 진피가 온전하면 발굽 뒤쪽 붓기는 며칠 안에 가라앉는다. 약 4주 뒤 블록 상태를 보고 병변 주위 발바닥 각질을 다듬는다.</span></p><p class="bx-num"><span class="bxn" data-n="66">•</span><span>단순 제저궤양 소에 비오틴 1일 40 mg을 50일 주자 궤양을 덮는 새 표피의 각질 질이 좋아졌다.</span></p><p class="bx-num"><span class="bxn" data-n="67">•</span><span>전층 제저궤양이 낫는 데는 약 2개월 걸린다. 다음 산차에 재발하기 쉽다. 발굽 깊은 구조까지 감염되면 예후는 항상 조심스럽고, 적극적인 항생제만으로는 거의 성공하지 못한다. 블록을 붙인 뒤에도 계속 절면 다른 원인이나 블록 위치를 다시 확인한다.</span></p></div>
<div class="bx"><div class="bx-title">백선농양(white line abscess)</div><p class="bx-num"><span class="bxn" data-n="68">•</span><span>백선은 발굽 각질에서 가장 약한 부분이다. 걸을 때 뒤꿈치가 먼저 닿아 백선 바깥쪽 뒷부분으로 이물이 박히고, 깊은 혐기성 주머니가 진피까지 가서 농양이 된다. 제엽염은 백선을 더 무르게 해 백선 질환의 소인이 된다.</span></p><p class="bx-num"><span class="bxn" data-n="69">•</span><span>뒷발 바깥 발굽 백선의 뒤쪽 1/3이 가장 흔하고, 앞발은 안쪽 발굽 뒤쪽 1/4이다. 아픈 발굽 뒤꿈치 융기를 손가락으로 눌러 보면 반응한다. 발끝 가까이 있으면 발굽테스터가 필요할 수 있다. 얇게 한 겹 깎으면 대개 백선 일부가 검게 변색되어 드러나고, 갈라진 틈에 분변이 차 있으면 청소해야 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="70">•</span><span>농양 압력을 빼 주면 바로 통증이 준다. 떨어진 각질을 걷어 내고 염증 진피에 압력이 가지 않게 깎는다. 큰 농양과 발끝 농양은 건강한 발굽에 블록을 붙인다. 붕대는 권하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="71">•</span><span>대부분 잘 낫고 블록은 약 4주 뒤 뗀다. 단순 백선 농양은 교정 삭제와 건강한 발굽 블록으로 4~6주에 낫는다. 드물게 발 쿠션 연부조직과 원위지관절 뒤쪽 구조로 번져 수술이 필요하다.</span></p></div>
<div class="bx"><div class="bx-title">열제(발굽 균열, hoof crack)</div><p class="bx-num"><span class="bxn" data-n="72">•</span><span>제관에서 아래로 뻗은 앞벽·옆벽의 세로 균열은 젖소보다 방목 육우에 훨씬 흔하다. 캐나다 서부 육우 조사에서 37.5%가 균열이 하나 이상 있었다.</span></p><p class="bx-num"><span class="bxn" data-n="73">•</span><span>세로 균열은 먼저 균열이 파행 원인인지 확인한다. 아프면 이물을 조심히 긁어내고, 삭제할 때 결손을 더 키우지 않게 한다. 필요하면 육아조직을 제거하고 지혈한 뒤 아물 때까지 진피를 보호하며, 건강한 발굽에 블록을 붙인다.</span></p><p class="bx-num"><span class="bxn" data-n="74">•</span><span>비오틴 1일 10 mg 보충으로 발굽 경도가 높아져 18개월 뒤 세로 균열이 15%로 비보충군 35%보다 적었다.</span></p><p class="bx-num"><span class="bxn" data-n="75">•</span><span>가로 분리는 제관 진피가 손상되어 성장이 끊기면서 생기며, 끊긴 곳이 제관에서 약 5 cm 내려와야 보인다. 여덟 발굽 모두에 있지만 대개 한 발만 아파서 발견된다. 분리된 끝부분이 움직이며 발끝 진피를 집어서 아프다.</span></p><p class="bx-num"><span class="bxn" data-n="76">•</span><span>가로 분리는 발끝을 최대한 짧게 깎고 발끝 발바닥을 얇게 해 발끝 체중을 줄인다. 분리된 부분이 닳거나 깎여 나가면 합병증 없이 완전히 회복한다.</span></p></div>
<div class="bx"><div class="bx-title">발굽손상(회복불능 발굽)</div><p class="bx-num"><span class="bxn" data-n="77">•</span><span>발굽 깊은 구조까지 침범한 감염은 늦게 발견되는 경우가 많아 예후가 항상 조심스럽다. 일부 발굽 각질 병변은 깊은 화농성 관절염으로 진행한다.</span></p><p class="bx-num"><span class="bxn" data-n="78">•</span><span>외상으로 발굽 각질이 빠진 경우 진피나 깊은 구조가 크게 손상되었으면 발굽 절단이나 도축을 선택한다.</span></p></div>
<div class="bx"><div class="bx-title">파상풍(tetanus)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="79">•</span><span>말은 독소에 매우 민감하고 소는 비교적 저항성이 있다. 아포는 오래 살고 대부분의 소독제에 견딘다. 대개 개체 발생이지만 집단 발생도 있다. 오염된 기구로 처치한 뒤 집단 발생한 보고가 있다.</span></p><p class="bx-num"><span class="bxn" data-n="80">•</span><span>젖소는 분만 뒤 자궁 오염으로 가장 흔히 감염된다. 고무링·칼 거세, 단미, 제각, 코뚜레·귀표, 근육주사, 배꼽 감염도 감염 부위다. 송아지 배꼽 감염, 발바닥 농양, 꽉 끼는 목줄, 만성 부비동염, 난산 뒤 외음부·질 괴사, 분만 뒤 심한 자궁염도 감염 부위이며, 부위를 못 찾는 경우도 있다. 거칠고 섬유질 많은 사료를 먹는 어린 소에서 상처 없는 집단 발생도 가끔 있다.</span></p><p class="bx-num"><span class="bxn" data-n="81">•</span><span>잠복기는 3일~4주, 드물게 몇 개월이다.</span></p><p class="bx-num"><span class="bxn" data-n="82">•</span><span>제3안검 돌출이 가장 이르고 꾸준한 징후이며 주둥이를 들어 올리거나 얼굴을 톡톡 치면 더 뚜렷해진다(소에서는 일정하지 않고, 대부분에서 보이지만 전부는 아니라고 적은 책도 있다). 반추동물은 첫 24시간 안에 고창이 시작된다. 어린 소에서는 고창이 초기 징후인데 대개 심하지 않다. 진행하면 눈이 아래 바깥쪽으로 돌아가고 동공이 열린 채 고정될 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="83">•</span><span>소는 뻣뻣한 걸음이 전형이지만 묶여 있으면 걷는 모습을 못 보기 쉽다. 체온을 잴 때 꼬리가 내려오지 않고 들려 있으면 의심한다. 고창 때문에 창상성 제2위염이나 소화불량으로 오진하는 일이 많으므로, 묶인 소는 풀어 걷게 하고 얼굴을 보고 입을 벌려 본다.</span></p><p class="bx-num"><span class="bxn" data-n="84">•</span><span>감별은 저마그네슘혈증, 백근병, 회백질연화증, 장독혈증, 스트리크닌 중독, 수막염, 리스테리아증, 광견병, 뇌염, 유기인·카바메이트 중독이다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="85">•</span><span>귀에 솜을 막아 소리를 줄이고, 혼자 어두운 칸에 두며, 한 사람이 모든 처치를 맡고, 바닥은 미끄럽지 않게 한다. 미끄러운 바닥에서는 대퇴골 골절·고관절 탈구로 잃는 경우가 많다.</span></p><p class="bx-num"><span class="bxn" data-n="86">•</span><span>상처는 진정·진통 뒤 세척·괴사조직 제거·배액하고 최대한 공기가 통하게 한다. 상처 세척·괴사조직 제거·과산화수소 세척이 독소 흡수를 늘릴 수 있으므로 항독소를 먼저 준 뒤에 하라고 적은 책도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="87">•</span><span>프로카인 페니실린 22,000~33,000 U/kg 하루 2회. 프로카인 페니실린 22,000 IU/kg 근육 하루 2회가 식용동물의 1차 선택약이다. 송아지나 값비싼 소는 정맥 카테터로 결정성 페니실린을 같은 용량으로 하루 4회 주면 근육·피하주사의 통증과 흥분을 줄인다. 페니실린 G 30,000 IU/kg 근육 또는 정맥 12~24시간마다, 또는 프로카인 페니실린 44,000 IU/kg 근육 12~24시간마다로 적은 책도 있다. 대안은 옥시테트라사이클린 15 mg/kg 정맥 24시간마다.</span></p><p class="bx-num"><span class="bxn" data-n="88">•</span><span>진정은 아세프로마진이 대부분 도움이 된다. 성우는 20~40 mg을 하루 2~4회 정맥 카테터나 근육으로 주고 용량은 개체에 맞춘다. 이 용량이면 대부분 엎드린 자세에서 일어설 수 있다. 마그네슘 주입은 값싸고 근경련 억제에 쓸 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="89">•</span><span>항독소는 이미 결합한 독소는 풀지 못하지만 남은 독소를 잡으므로, 감염 부위를 못 찾아도 최소 1회 주고 12시간 간격으로 3~4회까지 반복할 수 있다. 권장량은 1,500~300,000 U로 다양하며 처음에 15,000 U를 1~2회 주는 방법이 있다. 최소 20 IU/kg을 정맥·근육·피하로 하루 1회 5일까지 반복하거나, 회당 10,000~50,000 IU를 근육 또는 정맥으로 1회 또는 반복한다고 적은 책도 있다. 말 유래 항독소의 척수강 내 투여는 반추동물에서 심한 반응이 있어 금기다.</span></p><p class="bx-num"><span class="bxn" data-n="90">•</span><span>먹지 못하는 시기에는 수액으로 탈수를 바로잡고 사료·물은 고개를 숙이지 않아도 되게 높이 둔다. 위관 삽입 같은 머리 쪽 처치는 소를 매우 불안하게 하므로, 위관이 필요할 만큼 고창이 있으면 국소마취로 왼쪽 겸부에 지름 2.5~5.0 cm의 제1위 누공을 만든다(심하면 지름 5~10 cm를 권하는 책도 있다). 가스가 빠지고 물과 알팔파 펠릿을 넣는 통로가 된다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방·예후</div><p class="bx-num"><span class="bxn" data-n="91">•</span><span>소는 저항성이 커서 전에 발생한 적이 없으면 일상 접종은 하지 않는다. 위험 지역 소는 톡소이드를 첫해에 2회, 이후 매년 1회 접종한다. 접종하지 않은 소에 비위생적 수술, 방치된 상처, 고무링 사용은 피한다. 회복한 소도 면역이 생기지 않을 수 있어 2~4주 간격으로 2회 접종한다.</span></p><p class="bx-num"><span class="bxn" data-n="92">•</span><span>접종하지 않은 소가 새 상처를 입으면 톡소이드와 항독소를 함께 준다. 항독소 1,500 IU로 단기 예방이 되지만 10~14일만 간다. 둘을 같이 줄 때는 다른 부위에 다른 주사기로 놓는다.</span></p><p class="bx-num"><span class="bxn" data-n="93">•</span><span>잠복기가 길면 증상이 가볍고 예후가 좋다. 최근 1년 안에 접종한 소는 예후가 낫다. 처음부터 증상이 심하거나 누워 있거나 빨리 진행하면 예후가 나쁘다. 집중 간호와 페니실린·진정제·항독소를 평균 14일 하면 평균 27일째에 50% 정도 회복할 수 있지만 비용이 크다. 보조 치료를 1~4주 해야 할 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="94">•</span><span>진단 뒤 14일은 위중한 상태로 본다. 치료 시작 24~48시간 안에 안정되면 회복 가능성이 있고, 물을 못 마시던 소가 3~5일께 다시 마시는 것이 가장 좋은 신호다. 안정된 뒤에도 5~10일까지 합병증으로 죽을 수 있다. 옆으로 누우면 경련이 악순환되어 대개 죽고, 슬링은 오히려 흥분시켜 쓸모없다. 14일을 넘기면 대개 완전히 회복한다.</span></p></div></div>
<div class="bx"><div class="bx-title">뒷다리 말단괴사(맥각중독증·페스큐 풋)</div><p class="bx-num"><span class="bxn" data-n="95">•</span><span>맥각은 이삭에 씨앗 모양의 검은 균핵으로 눈에 보이지만, 엔도파이트 감염은 눈에 보이지 않아 현미경으로 확인한다. 말초 괴저는 서늘한 계절에, 고체온형은 더운 계절에 온다.</span></p><p class="bx-num"><span class="bxn" data-n="96">•</span><span>오염 목초지에 들어간 뒤 빠르면 10일에 절기 시작하지만 대부분 2~4주 뒤에 발병한다. 페스큐 풋은 추운 시기에 방목을 시작하고 10~14일 안에 오고, 우군 발생률이 10%에 이를 수 있으며 목초지에서 뺀 뒤에도 1주일까지 새 환축이 나올 수 있다. 엔도파이트 감염 톨페스큐를 먹은 지 42일 안에 나온다는 책도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="97">•</span><span>뒷다리 아래쪽, 꼬리, 귀가 붉어지고 붓고 차가워지며 털이 빠지고 감각이 없어진다. 이어 검푸른색으로 변하고 피부가 마른다. 며칠 뒤 경계가 생겨 떨어져 나간다. 병변 자체는 아프지 않지만 초기부터 절고 대부분 누워 있을 수 있다. 심한 설사가 같이 오는 경우가 많다.</span></p><p class="bx-num"><span class="bxn" data-n="98">•</span><span>페스큐 풋은 뒷다리에 가장 많고 제관부의 붉은 선과 부종으로 시작하며 털이 쉽게 뽑힌다. 이어 자줏빛·검은색으로 썩어 피부가 떨어지고 귀 끝·꼬리 끝도 같은 변화가 온다. 등을 굽히고 털이 거칠어진다. 혈류가 있는 조직과 없는 조직 사이 경계선이 뚜렷하다. 눈·얼음이 있는 추운 날씨에 많다.</span></p><p class="bx-num"><span class="bxn" data-n="99">•</span><span>관절 위 피부(제관부)가 붉게 붓고, 등을 약간 굽히며, 뒷다리 구절이 꺾이는 것이 첫 징후일 수 있다. 정신은 또렷한데 살이 빠진다. 괴저가 떨어지기 전에 파행이나 신경 증상이 먼저 보일 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="100">•</span><span>감별은 동맥 혈전·색전, 혈류를 막는 외상, 셀레늄 중독, 살모넬라증, 동상이다. 붉어지고 붓기만 한 초기에는 외상, 제엽염, 부제병으로 오인할 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="101">•</span><span>의심되면 바로 모든 소를 목초지에서 빼고 오염 사료를 즉시 끊는다. 혈관확장제가 다소 도움이 될 수 있다. 초기에는 부드러운 바닥에서 보조 치료하고 국소·전신 항생제로 깊은 조직 감염을 막는다. 비스테로이드 소염제는 혈관 수축을 부를 수 있어 이론상 피하는 편이 낫다.</span></p><p class="bx-num"><span class="bxn" data-n="102">•</span><span>마른 괴저는 스스로 경계가 생겨 떨어지게 둔다. 조직이 떨어지는 동안 파상풍 톡소이드를 2주 간격으로 2회 주고 파리를 막는다. 괴사가 시작되면 치료 효과가 없고 통증을 조절할 수 없으면 안락사를 권한다.</span></p><p class="bx-num"><span class="bxn" data-n="103">•</span><span>맥각이 심한 곡물이나 목초는 먹이지 않는다. 사료 중 맥각 이삭은 0.1%를 넘지 않게 하고 임신우에는 먹이지 않는 것이 좋다. 목초지는 예취기 날을 높여 이삭을 먼저 베어 내면 방목할 수 있다.</span></p></div>
<div class="bx"><div class="bx-title">송아지 대퇴신경마비</div><p class="bx-num"><span class="bxn" data-n="104">•</span><span>난산, 특히 고관절 걸림(hip-lock)으로 강하게 견인한 송아지에 가장 흔하다. 고관절이 과신전되어 대퇴신경이 찢어진다. 넘어지거나 뒷다리부터 나오는 태아를 강하게 끌어내 고관절·슬관절이 과신전되면 한쪽 또는 양쪽 대퇴신경이 다친다.</span></p><p class="bx-num"><span class="bxn" data-n="105">•</span><span>아픈 뒷다리로 체중을 받치지 못하고 무릎(슬관절) 아래 관절이 모두 굽는다. 다리를 앞으로 내딛기는 한다. 대퇴사두근이 떨린다. 다리가 힘없이 처져 골절처럼 보일 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="106">•</span><span>슬개건 반사가 없거나 약하고 슬개골이 흔히 바깥쪽으로 밀려 있다. 넓적다리 안쪽부터 경골 안쪽 복사뼈까지 감각이 둔하거나 없다. 다리 안쪽(정강이 안쪽) 감각이 없으면 회복 예후가 나쁘다. 10일 안에 대퇴사두근 위축이 나타나고 몇 주에 걸쳐 심해지며, 이때 슬개골이 헐거워져 슬개골 탈구로 잘못 볼 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="107">•</span><span>치료는 즉시 덱사메타손과 비스테로이드 소염제를 주고, 비타민E·셀레늄을 권장량 투여한다. 깔짚과 바닥을 좋게 해 욕창을 막는다.</span></p><p class="bx-num"><span class="bxn" data-n="108">•</span><span>양측 완전마비는 누워 지내고, 한쪽 마비도 예후를 장담하기 어렵다. 견인 후 대퇴신경마비 송아지는 예후가 나쁘고, 근위축과 슬개골 이완이 오면 아주 나쁘다.</span></p></div>
<div class="bx"><div class="bx-title">송아지 화농성 관절염(suppurative arthritis)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="109">•</span><span>어린 송아지는 배꼽 감염이나 신생 패혈증에서 오고, 초유 면역 이행 실패 송아지가 특히 위험하다. 패혈증 송아지는 장염·수막염·포도막염·폐렴이 같이 있는 경우가 많다. 거친 바닥의 찰과상·욕창으로도 생기고, 다른 병으로 오래 누워 있는 송아지가 위험하다. 초유 섭취 부족과 비위생적인 사육 환경이 위험 요인이다.</span></p><p class="bx-num"><span class="bxn" data-n="110">•</span><span>대장균이 흔하지만 살모넬라, Trueperella pyogenes도 자주 나오며 만성일수록 T. pyogenes가 많다. 송아지 분리균은 연쇄상구균과 Mycoplasma bovis가 가장 흔하고, 유방염 우유를 먹이면 마이코플라스마 관절염이 생긴다. 3주 넘은 송아지는 상처나 장(살모넬라)·호흡기(Histophilus somni, 마이코플라스마)에서 온다. 마이코플라스마 관절염은 3~6개월 송아지에 흔하고 폐렴이 같이 있는 경우가 많다.</span></p><p class="bx-num"><span class="bxn" data-n="111">•</span><span>심한 파행, 관절낭 팽만, 열감, 관절을 굽히거나 펼 때 통증이 있다. 열은 대개 39.4~40.0℃로 낮다. 비절, 슬관절, 앞무릎(완관절)이 가장 흔하다. 여러 관절, 특히 양쪽 완관절이 함께 아프면 한 관절일 때보다 파행이 덜 뚜렷할 수 있다. 아픈 다리를 뻗고 눕거나 옆으로 눕기도 한다. 배꼽 흉터는 이상이 있을 수도 없을 수도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="112">•</span><span>신생 송아지는 간·심내막·수막에도 병변이 있을 수 있으며 걸음걸이가 중추성 운동실조처럼 보일 수 있다. 오래 누워 지내면 2차 굴건 구축이 생겨 선천성 굴건 구축과 구별해야 한다. 마이코플라스마 고름은 늘 냄새 없는 치즈 모양으로 T. pyogenes 감염의 악취와 다르다.</span></p><p class="bx-num"><span class="bxn" data-n="113">•</span><span>다발성 관절염이 심하면 누워 지내 신경계 질환으로 오인할 수 있으니 관절을 꼼꼼히 만져 본다. 감별은 퇴행성 관절질환, 골수염, 근변성, 근염, 건·인대 외상이다. 앞무릎 단순 타박도 화농성 관절염만큼 절 수 있으니 구별한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·예방</div><p class="bx-num"><span class="bxn" data-n="114">•</span><span>화농성 관절염은 응급이다. 치료 원칙은 광범위 전신 항생제, 관절 세척, 국소 항생제다. 급성은 관절 세척이 성공의 열쇠다. 전신 항생제가 관절 내 주입이나 세척액에 섞는 것보다 효과적이며 되도록 빨리 시작한다.</span></p><p class="bx-num"><span class="bxn" data-n="115">•</span><span>배양 결과 전에는 플로르페니콜이나 세프티오퍼(ceftiofur) 같은 광범위 항생제를 고르고, 마이코플라스마가 의심되면 베타락탐 단독은 쓰지 않는다. 플로르페니콜 40 mg/kg, 툴라트로마이신 2.5 mg/kg, 가미스로마이신 6 mg/kg 비경구 투여로 관절액 농도가 유효 수준에 이른다. 비경구 페니실린과 옥시테트라사이클린은 송아지 관절액으로 잘 들어간다. 마르보플록사신(marbofloxacin) 4 mg/kg 근육 하루 1회 10일이 효과가 있었다.</span></p><p class="bx-num"><span class="bxn" data-n="116">•</span><span>전신 항생제는 최소 2주 계속하고 마르고 깔짚 좋은 곳에 둔다(투여 기간을 경험적으로 3주 권하는 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="117">•</span><span>급성은 진한 고름이 찬 만성보다 예후가 훨씬 좋다. 초유 이행 실패에 이은 신생 송아지 관절염, 특히 다발성은 예후가 조심~나쁨이다. 송아지 화농성 관절염의 55%가 좋은 결과를 보였다는 연구가 있고, 소는 운동 능력을 기대하지 않아 말보다 예후가 대체로 낫다. 진행된 경우는 예후가 나쁘고 관절이 터지거나 욕창으로 폐사·도태하며, 만성 관절염·강직으로 걷기 힘들어진다.</span></p><p class="bx-num"><span class="bxn" data-n="118">•</span><span>예방은 양질의 초유를 충분히 먹이고, 출생 후 배꼽을 적절한 소독약에 담그는 것이다.</span></p></div></div>
<div class="bx"><div class="bx-title">송아지 골절(fracture)</div><div class="bx-sub"><div class="bx-subtitle">원인·진단</div><p class="bx-num"><span class="bxn" data-n="119">•</span><span>송아지는 골간 골절이 흔하고 대퇴골 골절은 분만 과정에서 생길 수 있다. 난산 때 무리한 견인으로 산과 체인이 중수골 부위에 잘못 걸려 신생 송아지의 중수골·중족골 원위부가 부러지기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="120">•</span><span>긴뼈·척추·갈비뼈·아래턱뼈가 저절로 부러지면 칼슘·인·구리·비타민D 결핍, 골수염, 종양을 생각한다. 자라는 무리에서 긴뼈·척추 골절이 여럿 나오면 대사성 질환을 의심하고 칼슘 등 영양을 점검한다.</span></p><p class="bx-num"><span class="bxn" data-n="121">•</span><span>폐쇄골절은 체중을 싣지 못하는 파행, 다리가 휘어진 모양, 그 부위의 마찰음으로 진단한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료·예후</div><p class="bx-num"><span class="bxn" data-n="122">•</span><span>비전위 완전골절 송아지는 칸 안 안정과 외고정만으로 나을 수 있다. 소의 중수골·중족골 골절은 흔하고 깁스로 예후가 좋다. 발가락뼈(지골) 골절은 다치지 않은 발굽에 블록을 붙이거나 깁스한다. 견갑골 몸통 골절은 보존 치료로 잘 낫는다.</span></p><p class="bx-num"><span class="bxn" data-n="123">•</span><span>부목·깁스는 골절 부위 위쪽 관절을 넘어 올라가야 한다. 깁스를 너무 오래 바꾸지 않으면 깁스 욕창과 골수염이 생길 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="124">•</span><span>상완골 골절은 마방 안정만으로 나은 경우가 많다. 대퇴골, 경골, 요골·척골 골절은 고정 없이는 잘 낫지 않는다. 비절·완관절 골절과 요골·척골 원위부 골절은 다리 전체 깁스로 될 수 있다. 경골·대퇴골 골절은 현장에서 다루기 어렵다.</span></p><p class="bx-num"><span class="bxn" data-n="125">•</span><span>송아지는 성우보다 골절 예후가 훨씬 좋다. 반추동물은 말보다 차분해 다친 다리를 잘 보호하고 완전한 보행 회복이 꼭 필요하지 않아 예후가 대체로 낫다. 오염 안 된 폐쇄골절이 개방골절보다 낫다. 개방골절은 드물지만 예후가 더 나쁘다. 제때 처치한 오염 없는 중수골·중족골 골절은 예후가 보통에서 좋음이다.</span></p><p class="bx-num"><span class="bxn" data-n="126">•</span><span>견인 체인에 의한 골절은 지혈대 효과나 뼛조각에 의한 혈관 손상으로 아래쪽 혈행이 막힐 수 있다. 골절 아래 조직이 차가우면 예후가 매우 나쁘다.</span></p></div></div>
<div class="bx"><div class="bx-title">송아지 부종(edema)</div><p class="bx-num"><span class="bxn" data-n="127">•</span><span>국소 부종은 대개 염증이나 정맥·림프 흐름 장애로, 전신 부종은 대개 심부전이나 저알부민혈증으로 생긴다.</span></p></div>
<div class="bx"><div class="bx-title">갓 태어난 송아지 굽은 발굽 및 후구허약</div><div class="bx-sub"><div class="bx-subtitle">아까바네·츄잔</div><p class="bx-num"><span class="bxn" data-n="128">•</span><span>아까바네 바이러스의 매개체는 흡혈 깔따구(Culicoides)다(깔따구와 아마 모기로 적은 책도 있다). 임신 76~104일 감염은 수두무뇌증·공뇌증, 103~174일 감염은 관절굽음증을 일으켰다. 감염 시기가 늦을수록 덜 심하고, 유산은 임신 말기 3분의 1에 무리 지어 생긴다. 동아시아의 일부 변이주(이리키주)는 송아지와 성우에 뇌척수염을 일으킨다.</span></p><p class="bx-num"><span class="bxn" data-n="129">•</span><span>츄잔 바이러스는 수두증·수두무뇌증·소뇌 형성부전을 일으키고 Culicoides oxystoma가 주 매개체로 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="130">•</span><span>태아 모양과 지역으로 의심할 수 있지만 다른 매개체 바이러스와 겉모습이 같아 검사실 확진이 필요하다. 어미소 혈청과 초유 먹기 전 송아지 혈청으로 항체 검사를 한다. 주요 병변은 관절굽음증(arthrogryposis)과 수두무뇌증이다. 감별은 BVD, 블루텅, 슈말렌베르크 바이러스, 아이노 바이러스, 독성·영양·유전 원인이다.</span></p><p class="bx-num"><span class="bxn" data-n="131">•</span><span>아까바네·츄잔으로 기형·허약 송아지를 낳았어도 어미소는 다음 해부터 정상 분만하므로 도태할 필요가 없다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">관절굽음증·굴건 구축</div><p class="bx-num"><span class="bxn" data-n="132">•</span><span>관절굽음증 다리는 깊은 진정이나 마취 상태에서도 펴지지 않고 건을 잘라도 교정되지 않는다. 손으로 펴지지 않고 관절 정렬이 틀어진 것이 특징이며 앞다리에 더 많다. 선천성이며 생존 예후가 나쁘고 난산으로 태아 절단이나 제왕절개가 필요할 수 있다. 살아남은 개체는 번식에 쓰지 않는다. 가벼운 변형은 손으로 바로잡고 부목·깁스로 받쳐 교정할 수 있고, 수술한 소의 약 80%를 도축 체중까지 키웠다고 적은 책도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="133">•</span><span>선천성 굴건 구축은 주로 앞다리에 오며 구절이 꺾여 발끝으로 서거나 심하면 구절 앞면으로 선다. 다른 기형이 없으면 치료할 만하다. 가벼우면 발가락을 자주 펴 주고 서서 운동하게 하는 것으로 충분하다.</span></p><p class="bx-num"><span class="bxn" data-n="134">•</span><span>발끝으로라도 디디면 솜붕대 위에 PVC 부목을 대고 매주 갈며 그때마다 건을 손으로 늘린다. 하루 몇 번 세워서 운동시킨다. 천지굴건·심지굴건을 모두 잘라야 하는 경우는 예후가 나쁘다. 망아지에 쓰는 고용량 옥시테트라사이클린은 소에서 효과가 덜하고 급성 신부전 위험이 크다.</span></p><p class="bx-num"><span class="bxn" data-n="135">•</span><span>후천성 굴건 구축은 패혈증, 백근병, 다발성 관절염, 영양불량, 신경 질환으로 오래 누워 있던 송아지에 생긴다. 원인을 고치면서 물리치료를 한다. 오래 누워 있을수록 반응이 나쁘다.</span></p></div></div>
<div class="bx"><div class="bx-title">백근병(white muscle disease, 셀레늄·비타민E 결핍증)</div><div class="bx-sub"><div class="bx-subtitle">원인·증상</div><p class="bx-num"><span class="bxn" data-n="136">•</span><span>송아지 백근병은 대부분 2~4개월령에 봄·여름 방목 중 운동과 함께 오지만 선천성·신생기 발생도 있다. 6개월 미만에 가장 흔하지만 2세까지도 볼 수 있다. 어린 개체 발생은 대개 임신 기간 어미의 결핍을 반영한다.</span></p><p class="bx-num"><span class="bxn" data-n="137">•</span><span>질 나쁜 건초·짚·뿌리작물을 먹이면 비타민E가 결핍되기 쉽고, 곡물을 오래 저장하면 비타민E가 크게 준다. 상업 사료를 쓰지 않고 광물질을 직접 배합하는 농가에서 주로 본다.</span></p><p class="bx-num"><span class="bxn" data-n="138">•</span><span>급성형은 운동 뒤 전구증상 없이 쓰러져 죽을 수 있고, 사료 급여 때 흥분이 돌연사를 부를 수 있다. 갑자기 처지고 심한 호흡곤란에 거품 섞이거나 피 섞인 콧물을 보인다. 심박이 분당 150~200회로 빠르고 부정맥이 흔하며 호흡이 분당 60~72회로 빠르고 폐 전체에서 큰 호흡음이 들린다. 체온은 정상이거나 약간 높다. 치료해도 6~12시간 안에 죽고 치사율은 100%에 가깝다. 심장형은 흔히 24시간 안에 죽는다.</span></p><p class="bx-num"><span class="bxn" data-n="139">•</span><span>골격근형은 근육 약화, 뻣뻣함, 떨림, 기립불능이 서서히 오고 만지면 근육이 단단하고 아파한다. 성장 빠른 송아지에 가장 흔하고 걸을 때 비절이 돌아가며, 정신과 식욕은 정상이고 붙잡아 주면 젖을 빤다. 일으켜 세우면 몇 초 안에 근육이 떨리고 목 근육이 약해 머리가 떨어진다.</span></p><p class="bx-num"><span class="bxn" data-n="140">•</span><span>횡격막·늑간근이 침범되면 호흡곤란, 혀가 침범되면 삼킴곤란이 온다. 갓난 송아지는 혀만 침범되어 빨려는 의욕은 있는데 혀가 늘어져 젖을 못 빨 수 있다. 호흡이 빠르거나 힘든 것이 주 증상이어서 농가가 폐렴으로 여기기 쉽고 오연성 폐렴이 같이 오기도 한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">진단·치료</div><p class="bx-num"><span class="bxn" data-n="141">•</span><span>여러 마리에 증상이 있고 소변에 미오글로빈이 나오면 임상 진단으로 충분한 경우가 많다. 육안 미오글로빈뇨가 없어도 소변 스틱에서 잠혈과 단백이 양성이면 의심한다. 가장 확실한 진단은 셀레늄 보충에 대한 반응이다. 뻣뻣한 걸음은 제엽염, 다발성 관절염, 파상풍과 감별한다.</span></p><p class="bx-num"><span class="bxn" data-n="142">•</span><span>주사용 셀레늄 제제의 표시 용량은 셀레늄 0.055~0.067 mg/kg(45 kg당 2.5~3 mg) 근육 또는 피하다. 셀레늄 3 mg과 dl-알파토코페롤 아세테이트 150 IU/mL 혼합제를 45 kg당 2 mL 근육주사하고 보통 1회로 충분하다(제조사 용량으로 3일 간격 3~4회까지 반복할 수 있다고 적은 책도 있다). 혼합제의 비타민E는 보존제 수준이라 비타민E 보충에는 모자라 경구로 보충한다.</span></p><p class="bx-num"><span class="bxn" data-n="143">•</span><span>셀레늄 주사는 과량이면 중독으로 죽을 수 있으므로 표시 용량을 지킨다. 증상이 없는 같은 무리 송아지도 같은 용량으로 예방 치료한다. 치료할 때 흥분시키면 급성형을 부를 수 있으니 조심해서 다룬다. 누워 있는 개체는 2차 폐렴·욕창 감염에 항생제를 주고 에너지·수분 공급에 신경 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="144">•</span><span>심장형은 심근 손상이 커서 대개 살기 어렵다. 심근 침범이 심하면 치사율이 약 90%다. 골격근형은 치료와 안정에 잘 반응해 3~5일 안에 서서 걷는 경우가 많지만, 폐렴 같은 합병증에 따라 예후는 조심스럽다. 해부학적 기능장애가 생긴 병변은 되돌릴 수 없다. 누워서 못 일어나는 중증은 도태를 고려한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="145">•</span><span>결핍된 어미는 태아와 초유에 충분한 셀레늄·비타민E를 주지 못하므로 임신 마지막 2개월에 충분히 급여한다. 개체는 30~60일 간격으로 셀레늄·비타민E를 주사해 체내 농도와 태반 이행을 유지할 수 있다. 소에서는 젖의 셀레늄을 늘려도 송아지 요구량을 못 채울 수 있다.</span></p><p class="bx-num"><span class="bxn" data-n="146">•</span><span>잘 만들고 잘 저장한 건초·곡물이나 좋은 풀을 먹이면 비타민E는 충분하다. 사료 건물 중 셀레늄 0.3 mg/kg, 비타민E 20 IU/kg 미만이면 보충한다. 조사료와 곡물은 건물 기준 셀레늄 0.1~0.3 ppm 이상이어야 적절하다.</span></p></div></div>
</div>
`;
}
function med_uroHtml(){
  return `

<div class="rb-boxes">
<div class="bx"><div class="bx-title">요결석증(요석증, urolithiasis)</div><div class="bx-sub"><div class="bx-subtitle">원인·역학</div><p class="bx-num"><span class="bxn" data-n="1">•</span><span>곡류 위주로 키우는 소는 대개 스트루바이트(인산암모늄마그네슘) 결석이다. 규산이 많은 목초를 먹는 소는 규산염 결석이 생기고, 귀리와 귀리짚도 규산이 많다. 탄산칼슘·수산칼슘 결석은 소에서 드물다. 소의 치명적 요결석증은 3~10%로 보고된다.</span></p><p class="bx-num"><span class="bxn" data-n="2">•</span><span>인산염 결석은 여러 개이고 매끄럽고 무르며 모래 같아서 포피 털에 붙는 결석이 이것이다. 규산염 결석은 대개 하나로 거칠고 단단한 흰색, 4~7mm다.</span></p><p class="bx-num"><span class="bxn" data-n="3">•</span><span>반추동물의 정상 오줌 pH는 7~9.5이고 결석은 알칼리 오줌에서 생긴다. 스트루바이트는 알칼리 오줌(pH 7.2 초과)에서 결정이 되고 6.5 미만에서 녹는다. 스트루바이트·인산칼슘·탄산칼슘 결석은 알칼리 오줌에서 덜 녹는다.</span></p><p class="bx-num"><span class="bxn" data-n="4">•</span><span>반추동물은 인을 주로 침으로 내보낸다. 농후사료가 많고 조사료가 적으면 침이 줄어 인이 오줌으로 나간다. 펠릿 사료도 침을 줄인다. 고농후사료는 오줌 점단백을 늘린다. 농후사료가 체중의 1.5%에 이르면 오줌에 침전물이 보이기 시작하고, 체중의 2.5%로 2개월 먹이면 결석이 생기기 시작한다.</span></p><p class="bx-num"><span class="bxn" data-n="5">•</span><span>Ca:P가 2:1 미만인 사료가 집단 발생을 잘 일으킨다. 스트루바이트 형성에는 인보다 마그네슘이 더 중요할 수 있고, 칼륨이 많은 사료(DCAD 상승)도 위험을 높인다. 마그네슘이 많은 사료(일부 송아지 대용유 포함)는 폐쇄를 늘린다. 면실박·볏짚·수수(마일로)도 결석을 더 일으킨다고 한다.</span></p><p class="bx-num"><span class="bxn" data-n="6">•</span><span>비타민A 결핍과 에스트로겐(목초·사료, 곰팡이독 제랄레논, 이식제)은 요로 상피를 편평상피로 바꿔 결석 핵을 만든다. 비타민D 과잉, 만성 요로감염도 원인이다. 다만 비타민A 결핍은 기여 요인 정도로 보고, 비타민A 결핍·비타민D 과잉·에스트로겐 모두 실제 근거가 부족해 주요 원인이 아니라고 적은 책도 있다.</span></p><p class="bx-num"><span class="bxn" data-n="7">•</span><span>가뭄이나 혹한으로 물이 얼거나 너무 차면 덜 마셔 오줌이 진해진다. 북미에서는 늦가을~겨울에 많다. 음용수의 광물 성분이 물 부족 자체보다 더 크게 작용할 것이다. 물의 경도, 특히 마그네슘도 관련된다. 사료를 한꺼번에 몰아 먹이면 일시적으로 오줌이 진해지므로 자유 채식이 낫다.</span></p><p class="bx-num"><span class="bxn" data-n="8">•</span><span>테스토스테론이 없으면 요도가 덜 자라 거세우가 잘 막힌다. 결석이 생기는 정도는 수소와 거세우가 비슷하다. 8개월령 넘은 거세우가 가장 많이 온다. 6개월령 거세우는 2개월령 거세우보다 요도 지름이 8% 크고 13% 더 큰 결석을 내보낼 수 있고, 수소는 조기 거세우보다 44% 큰 결석을 내보낸다(7개월령 거세가 1개월령 거세보다 13%, 수소는 44% 큰 결석을 내보낸다고 인용한 책도 있다). 암소는 요도가 짧고 늘어나 거의 막히지 않는다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">증상·진단·감별</div><p class="bx-num"><span class="bxn" data-n="9">•</span><span>거세우·수소에서는 음경후인근이 붙는 S자 만곡부 아래쪽(원위부)이 가장 흔한 폐쇄 부위다. 좌골궁 부위 폐쇄는 덜 흔하다.</span></p><p class="bx-num"><span class="bxn" data-n="10">•</span><span>초기 증상은 식욕부진, 침울, 가벼운 고창처럼 미묘할 수 있다. 육우 농가는 포피 부종을 처음 알아채기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="11">•</span><span>요도가 막히면 안절부절 발을 구르고 꼬리를 흔들며 이를 간다. 배를 차고 옆구리를 돌아본다. 빈맥·빈호흡과 반추위 정지로 인한 가벼운 고창이 흔하다. 배에 힘을 반복해서 주어 직장 탈출이 올 수 있다. 포피 털에 결정이나 피가 붙어 있고, 오줌을 못 누면 포피 털이 말라 있다.</span></p><p class="bx-num"><span class="bxn" data-n="12">•</span><span>오줌을 받을 수 있으면 단백뇨와 잠혈이 흔하다. 혈뇨·단백뇨는 흔하고 결정뇨는 일정하지 않다. 알칼리뇨도 흔하다. 농뇨가 있으면 외상성 요도염이나 방광염, 2차 감염을 생각한다.</span></p><p class="bx-num"><span class="bxn" data-n="13">•</span><span>직장검사에서 골반 요도가 박동하고 방광이 크게 차 있다. 방광이나 요도가 터진 뒤에는 방광이 커져 있지 않다. 결석이 하나일 때는 음경을 따라 요도를 꼼꼼히 만져 위치를 찾는다. 드물게 송아지는 막힌 곳 위쪽 회음부 정중선에 요도가 부풀어 보인다.</span></p><p class="bx-num"><span class="bxn" data-n="14">•</span><span>부분·만성 폐쇄는 오줌이 느리게 끊겨 나온다. 오줌을 방울방울 흘리고 힘주며 혈뇨가 있다. 직장검사에서 방광이 작고 벽이 두꺼울 수 있고, 신부전이 오면 처지고 여윈다.</span></p><p class="bx-num"><span class="bxn" data-n="15">•</span><span>완전 폐쇄를 48시간 이상 두면 요도나 방광이 터지고 배앓이가 멈춘다. 요도가 터지면 회음부·서혜부·포피·아랫배에 양쪽 대칭의 함요 부종이 생기고 겨드랑이·가슴까지 간다. 처음에는 따뜻하고 아프다가 괴사하면서 차갑고 검게 변하고 아프지 않다. 누관이 생기기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="16">•</span><span>요도 파열 부종은 배꼽·음낭 탈장과 배꼽정맥염과 꼼꼼한 촉진과 흡인으로 구분한다. 수소의 음경 혈종은 포피 주변만 붓고 복벽까지 가지 않으며, 감염 위험이 있어 흡인하지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="17">•</span><span>방광이 터지면 힘주기가 멈추고 1~2일 안에 아랫배가 양쪽으로 불러오며 침울·식욕부진·쇠약·탈수·쇼크가 심해진다. 배를 치면 파동이 있다. 체온은 정상이거나 쇼크로 낮고 숨에서 암모니아 냄새가 날 수 있다. 농가는 배앓이 뒤 24~48시간 좋아졌다가 배가 불러오고 다시 처진다고 말한다. 수소는 음낭 수종이 생기기도 한다.</span></p><p class="bx-num"><span class="bxn" data-n="18">•</span><span>실험으로 만든 요복증 소는 평균 14일 살았다(2~3일 버티다 죽는다고 적은 책도 있다). 방광 파열의 감별은 복막염, 장마비, 장염, 미주신경성 소화불량, 복수, 후대정맥 혈전증이다.</span></p><p class="bx-num"><span class="bxn" data-n="19">•</span><span>음경에 털이 고리로 감겨도 비슷한 불편과 배뇨곤란을 보인다. 요로감염은 방광 팽창이 드물고 오줌에 백혈구·세균이 많다. 결석이 저절로 빠진 뒤 외상성 요도염이 남으면 배뇨곤란이 차츰 좋아진다. 장 폐쇄도 빈맥·배앓이·고창을 보이므로 청진·타진·직장검사로 구분한다. 어린 소의 요도 게실 확장은 회음부 정중선 부종이 박동하지만 막힘이 없고 박동이 멎은 뒤 몇 분간 오줌이 흘러나온다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">치료</div><p class="bx-num"><span class="bxn" data-n="20">•</span><span>대부분 수술이 필요하다. 요독증이 없으면 바로 도축하는 것도 선택지다. 비육우는 질소혈증이나 요로 파열이 오기 전에 진단되면 즉시 출하할 수 있다. 막힘을 풀지 않으면 죽는 병이라 예방이 중요하다.</span></p><p class="bx-num"><span class="bxn" data-n="21">•</span><span>내과 치료는 아주 초기에 시작할 때만 성과가 있다. 페노티아진 계열 진정제가 요도 경련을 줄이고 음경후인근을 풀어 S자 만곡을 펴 결석이 빠지게 돕는다는 이론이다. 약으로 치료한 소는 오줌을 누는지, 다시 막히지 않는지 지켜본다.</span></p><p class="bx-num"><span class="bxn" data-n="22">•</span><span>아미노프로마진 0.2~0.3 mg/kg 정맥 또는 근육주사를 비육우에 써 왔으나(0.7 mg/kg으로 적은 책도 있다) 대조 자료가 부족하고 많은 나라에서 소에 금지다. 아세프로마진과 혼동하지 않는다. 요도 주위에 평활근이 거의 없어 효과를 기대하기 어렵고, 비스테로이드 소염제나 음경후인근 기시부 국소마취·음부신경 차단이 더 합리적이라고 한다.</span></p><p class="bx-num"><span class="bxn" data-n="23">•</span><span>자일라진 같은 알파2 작용제는 이뇨 작용 때문에 막힘이 풀리지 않은 소에 쓰지 않는다. 수술 직전 진정만 예외다.</span></p><p class="bx-num"><span class="bxn" data-n="24">•</span><span>인산염 결석은 오줌 산성화가 치료 성공에 대개 필수다. 염화암모늄 200 mg/kg을 24시간마다 경구로 주되, 대사성 산증 위험 때문에 50 mg/kg에서 시작해 50 mg/kg씩 올려 오줌 pH 6~6.5에 이를 때까지 늘린다. 이 pH에서 인산염 결석이 녹는다. pH 6~6.5에 이를 때까지 매일 잰다. 신장이 보상해 오줌이 다시 알칼리로 돌아가므로 결석이 녹았다고 판단될 때까지만 하고, 오래 쓰면 골감소가 온다.</span></p><p class="bx-num"><span class="bxn" data-n="25">•</span><span>수액은 생리식염수가 저나트륨·저염소를 바로잡고 고칼륨을 악화시키지 않아 경험적으로 좋다. 대사성 산증이 있으면 피한다. 칼륨이 든 수액을 섞지 않는다. 현장이나 비용 제약이 있으면 고장 식염수와 경구 수액으로 대신한다.</span></p><p class="bx-num"><span class="bxn" data-n="26">•</span><span>방광이 터졌으면 배의 오줌을 빼야 한다. 2% 리도카인으로 침윤하고 반추위 투관침이나 흉강 카테터로 뺀다. 30분 이상 천천히 빼고 가능하면 정맥 수액을 같이 놓아 순환 쇼크를 막는다.</span></p><p class="bx-num"><span class="bxn" data-n="27">•</span><span>요도가 터져 피하에 오줌이 많이 고였으면 피부를 절개해 빼서 괴사·감염·농양을 줄인다. 요도가 터진 소는 대개 회음부 요도루를 만들고 출하한다.</span></p><p class="bx-num"><span class="bxn" data-n="28">•</span><span>S자 만곡과 요도 게실 때문에 카테터가 방광까지 들어가기 거의 어렵다. 역행 세척은 성공이 드물고 요도를 터뜨리거나 결석을 게실로 밀어 넣을 수 있다. 결석은 대개 여러 개라 하나를 빼도 다시 막히기 쉽다.</span></p><p class="bx-num"><span class="bxn" data-n="29">•</span><span>회음부 요도루는 도축까지 살리는 구제 수술이고 협착·재폐쇄가 흔하다. 소 85두 수술에서 35%만 만족스럽게 회복했다.</span></p><p class="bx-num"><span class="bxn" data-n="30">•</span><span>수술 전후 베타락탐을 5~7일 쓴다. 오줌에 농축되는 설파제·베타락탐이 좋다. 플루닉신 1.1 mg/kg 정맥주사를 수술 전후로 쓰되 탈수가 심하면 조심한다.</span></p></div><div class="bx-sub"><div class="bx-subtitle">예방</div><p class="bx-num"><span class="bxn" data-n="31">•</span><span>가능하면 결석 성분 분석과 사료 분석으로 원인을 찾는다. 예방의 목표는 오줌을 묽게 해 결석 성분이 가라앉지 않게 하는 것이고, 소금과 물 섭취를 늘려 이룬다.</span></p><p class="bx-num"><span class="bxn" data-n="32">•</span><span>인산염 결석 예방에는 사료 Ca:P를 2:1 이상으로 맞춘다(1.5~2:1로 적은 책, 1.2:1이 기준이나 1.5~2.0:1 권고도 있다고 적은 책도 있다). 사료 마그네슘은 0.2% 미만으로 하고 곡류·알팔파를 줄인다. 긴 조사료를 늘리면 되새김과 침이 늘어 인이 분변으로 나가고 오줌의 결석 성분이 준다.</span></p><p class="bx-num"><span class="bxn" data-n="33">•</span><span>사료에 소금을 4~5% 넣으면 물을 더 마시고 결석 성분이 덜 가라앉으며, 혹한기에 특히 도움이 된다. 건물 섭취량의 3~5%까지 서서히 올리고, 그보다 많으면 식욕이 떨어진다. 덩어리 소금이나 핥는 소금은 물 섭취를 바꿀 만큼 먹지 않는다.</span></p><p class="bx-num"><span class="bxn" data-n="34">•</span><span>규산염 결석은 이유 전 마지막 60일에 주로 생기므로 송아지에게 소금을 많이 넣은 입질 사료를 준다. 입질 사료의 소금이나 염화암모늄을 차츰 늘리고 급이기를 깨끗한 물 가까이 둔다. 규산이 많은 위험 풀밭은 수소·거세우 대신 암소 방목에 쓴다.</span></p><p class="bx-num"><span class="bxn" data-n="35">•</span><span>염화암모늄으로 오줌 pH를 6.0~6.5로 낮추면 스트루바이트·인회석·탄산칼슘 결석을 막는 데 도움이 된다. DCAD를 0 mEq/kg으로 맞춘 사료도 오줌 pH를 6.0~6.5로 낮췄다. 염소가 많은 저DCAD 사료도 오줌을 산성화한다.</span></p><p class="bx-num"><span class="bxn" data-n="36">•</span><span>염화암모늄 용량은 체중 240kg 거세우 두당 하루 50~80g이다(건물 섭취량의 0.5~1%, 건물 섭취량의 0.5~2.0% 또는 거세우 하루 약 45g으로 적은 책도 있다). 산성화 정도는 사료 전체의 양이온(나트륨·칼륨)과 음이온(염소·황)에 따라 달라 농장마다 효과가 다르다. 오줌 pH는 2~5일에 걸쳐 내려간 뒤 안정된다.</span></p><p class="bx-num"><span class="bxn" data-n="37">•</span><span>염화암모늄은 맛이 없어 기호성 좋은 저칼륨 사료와 섞는다. 오래 먹이면 오줌 pH가 서서히 다시 오르는 소가 있어, 주 1회 pH 스틱으로 재고 오르면 끊었다가 다시 주는 방식을 쓴다. 오래 또는 많이 먹이면 만성 대사성 산증과 골밀도 감소가 온다.</span></p><p class="bx-num"><span class="bxn" data-n="38">•</span><span>규산염 결석은 오줌 pH의 영향을 받지 않는다(영향이 논란이지만 약한 산성뇨에서 줄어드는 경향이 있다고 적은 책, 산성 오줌(pH 7.0 미만)에서 규산염 결석이 생기므로 규산염 위험 소에 염화암모늄으로 pH를 낮추는 것은 맞지 않다고 적은 책도 있다).</span></p><p class="bx-num"><span class="bxn" data-n="39">•</span><span>거세를 미루면 요도가 넓어져 폐쇄가 줄 수 있지만 개선 폭은 크지 않을 것이다. 그 체중에서의 거세 합병증과 복지를 따져야 하고 사료와 물 관리에 집중하는 편이 낫다.</span></p><p class="bx-num"><span class="bxn" data-n="40">•</span><span>얼지 않는 맛있는 물을 늘 마시게 하고 겨울에는 히터, 여름에는 그늘을 둔다. 물통은 자주 닦고 자동 급수기가 잘 나오는지 점검한다. 빨리 채워지는 얕은 물통이 물이 덜 고인다. 염분이 많은 물은 의심한다.</span></p></div></div>
</div>
`;
}
function med_metabHtml(){
  return `
<div class="modal-sub" style="margin-bottom:6px;">${svgIcon('stethoscope',16)} 대사·중독</div>
<div class="rb-boxes">
<div class="bx"><div class="bx-title">분만 후 기립불능증(downer cow syndrome)</div>
<div class="bx-sub"><div class="bx-subtitle">원인·증상</div>
<p class="bx-num"><span class="bxn" data-n="1">•</span><span>육우에서 오래 누워 있는 주된 원인은 분만마비로 난산, 큰 송아지, 긴 분만 뒤에 많다. 분만 때 폐쇄신경, 더 흔하게는 좌골신경의 제6요추 가지가 다친다. 그 밖에 고관절 탈구, 골반·긴뼈 골절, 비복근 파열, 독성 유방염·자궁염, 척추 림프종, 저칼슘·저칼륨·저인·저마그네슘혈증이 원인이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="2">•</span><span>원인이 무엇이든 딱딱한 바닥에 오래 누우면 깔린 다리가 붓고 근막 안 압력이 올라 근육 괴사와 좌골신경 손상이 생긴다(구획증후군). 정상 소 16마리를 오른 뒷다리를 몸 밑에 넣은 채 6~12시간 흉와로 두었더니 8마리가 일어서지 못했다. 압박 허혈은 4시간 만에도 생긴다. 미끄러운 바닥에서 버둥거리면 운동성 근병증, 고관절 탈구, 대퇴골 목 골절이 겹친다.</span></p>
<p class="bx-num"><span class="bxn" data-n="3">•</span><span>유열로 누운 뒤 칼슘 치료까지 6시간 미만이면 기립불능이 거의 없었고 7~12시간은 26%, 12~18시간은 32%, 18시간 넘게는 38%였다. 유열 소의 3.8~28.2%가 alert downer가 되고 그 폐사율은 20~67%다.</span></p>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>분만마비나 미끄러운 바닥으로 뒷다리가 갈라지면 내전근이, 뒷다리를 뒤로 뻗고 기어 다니면 대퇴사두근이 다친다. 비절이 지나치게 굽으면 비복근, 지나치게 펴지면 제3비골근 손상을 의심한다. 칼슘 주사 후 일어섰을 때 깔렸던 다리의 구절이 꺾이면 정강이 바깥쪽에서 비골신경이 눌린 것이다. 앞다리 요골신경도 눌릴 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>흉와를 유지하며 먹고 마시는 소를 alert downer라 한다. 이런 소는 대개 며칠 안에 일어서고, 정신과 생체징후가 비정상이며 흉와를 유지 못 하고 먹지 않는 소는 며칠 안에 죽는다. 정신이 또렷한 소는 신경·근육 손상, 탈구, 골절이, 침울한 소는 전해질 이상과 독혈증이 주원인이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·예후</div>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>현장 검사는 직장검사로 골반 마찰음을 찾고, 보조자가 뒷다리를 움직이는 동안 폐쇄공 쪽에서 대퇴골두를 확인한다. 소변 스틱 잠혈·단백 반응이 강하거나 오줌이 갈색이면 근육 손상(근색소뇨)이다. 4분방을 모두 짜 독성 유방염을 확인하고 자궁 안에 송아지가 하나 더 있는지도 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>칼슘에 반응하지 않는 분만 전후 기립불능 소에 저인혈증이 흔하고 저칼륨혈증으로도 눕는다. 저마그네슘혈증은 대개 근육 강직·과민 상태로 나타나 기립불능 증후군과 다르다.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>근육 손상이 심하거나 순환이 나쁜 소는 근육에서 젖산이 나와 대사성 산증이 올 수 있고 급성기에는 혈중 칼륨이 오른다. 이런 소에는 알칼리화 균형 전해질 수액을 정맥으로 준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>며칠 누우면 가망 없다는 절대 기준은 없지만 하루하루 누울수록 나빠진다. 날마다 다리에 체중을 조금씩 더 싣는지가 예후 판단의 열쇠다. 7일 넘게 누워 있으면 예후가 나쁘지만 10~14일 누워 있다가 일어나 회복한 소도 있다. 제대로 돌보면 약 50%가 4일 이내에 일어선다.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>안락사는 예후 불량, 치료에 반응 없는 통증, 며칠간 식욕 없음, 흉와 유지 불가, 욕창 등 합병증, 적절한 간호에도 악화, 10일 넘게 반응 없음일 때 판단한다. 누운 소를 끌어서 옮기지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">간호·치료</div>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>콘크리트에서 옮기는 것이 최우선이다. 흙바닥에 짚을 두껍게 깔거나 모래를 약 30cm 깔고 물이 빠지게 약간 경사를 준다. 모래는 오줌을 머금지 않아 피부 짓무름을 막고 짚보다 깨끗이 관리하기 쉽다. 몸을 돌릴 수 있는 넓은 칸이 좋다. 미끄러운 바닥에서는 일어나려 하지 않고 점점 나빠진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>흉와로 받쳐 준다. 흉와가 아니면 반추위 내용물이 코로 나오거나 흡인된다. 스스로 못 돌면 일찍부터 굴려 주는데 간격은 3~4시간마다(4~6시간 또는 4~8시간마다로 적은 책도 있다)다. 굴린 뒤 아래쪽 다리가 몸 밑으로 뻗지 않았는지 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>분만마비로 뒷다리가 벌어지는 소는 양 뒷다리를 끈으로 묶어 갈라짐과 고관절 탈구를 막고, 모든 기립불능 소를 예방으로 묶는 임상가도 있다. 일어나려다 앞무릎을 짓누르므로 붕대를 감고, 머리가 벽에 붙지 않게 칸 안쪽에 짚단을 둘러 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>일으키기는 스스로 일어나려 하는 소만 돕는다. 다리 위치를 잡고 누운 쪽을 바꾼 뒤 소가 뒷다리로 밀 때 꼬리 뿌리를 들어 준다. 꼬리 끝보다 뿌리를 잡아야 효과가 좋고 꼬리 골절이 적다. 갈비를 살짝 찌르거나 전기 몰이봉을 쓰는 정도가 최대 자극이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>엉덩이 들개(hip lifter)는 일어서려 하고 세우면 설 수 있는 소가 대상이며 대개 하루 2회 1~5일이면 혼자 선다. 두껍게 패드를 대고 빨리 들어 올리며, 선 뒤 1~2분 안에 풀거나 느슨하게 하고 한 번에 5분을 넘기지 않는다. 처음에 서지 않아도 훈련으로 본다. 네 다리로 체중을 받치면 20~30분 세워 두고 하루 1~2회 반복한다고 적은 책도 있다. 매단 소를 혼자 두지 않는다. 몸통 슬링이 체중을 고르게 나눠 체중을 싣지 않는 소에 낫다.</span></p>
<p class="bx-num"><span class="bxn" data-n="16">•</span><span>진통소염제는 통증을 덜고 식욕을 지킨다. 플루닉신, 멜록시캄, 덱사메타손을 쓰되 비스테로이드 소염제 반복은 제4위 궤양을 부르므로 흑색변을 살핀다. 누운 초기에 덱사메타손 0.2~0.3 mg/kg 정맥주사 1회를 쓰는 임상가도 있으나 유산 작용이 있다. 비타민E·셀레늄 1회 주사를 경험적으로 준다. 보조 약물들의 효과는 잘 입증되지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>근색소뇨가 있으면 신장 손상을 막으려 수액을 늘린다. 경구 수액은 흉와에서만 주고 관 위치를 꼭 확인한다. 정신이 또렷하고 삼킴 반사가 좋은 소만 강제 급수하며 1회 40L를 넘기지 않는다. 물 57~76L에 칼슘 프로피오네이트 500g, 황산마그네슘 250g, 인산일나트륨 220g, 염화칼륨 150g을 넣은 분만우 경구 수액을 쓰는 임상가도 있다. 물은 엎어지지 않는 큰 고무통에 누운 자리 가까이 둔다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">예방</div>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span>유열은 소가 눕기 전 1단계에 치료하는 것이 가장 좋고, 누웠다면 1시간 넘게 미루지 않는다. 누운 소는 응급이다. 6시간만 누워 있어도 되돌릴 수 없는 압박 손상이 생길 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>유열 소는 짚을 넉넉히 깔거나 부드러운 땅으로 옮긴다. 분만 칸은 깨끗하고 깔짚을 두껍게 깔아 미끄러지지 않게 한다.</span></p>
</div>
</div>
<div class="bx"><div class="bx-title">저칼슘혈증(유열, parturient paresis)</div>
<div class="bx-sub"><div class="bx-subtitle">발생·증상</div>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>젖소보다 드물지만 포유 육우에도 개체 또는 집단으로 생긴다. 임신한 육우가 겨울에 질 나쁜 조사료를 먹을 때 생기며, 무리 안에서 서열이 낮은 소가 덜 먹어 걸린다. 원인 모를 설사를 앓는 육우에서도 생겼다.</span></p>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>분만 24시간 전부터 72시간 뒤 사이에 생기고 대부분 분만 후 24시간 안이다. 초산우는 거의 걸리지 않고 나이 든 소에 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>1단계는 아직 서 있다. 흥분·과민, 식욕 저하, 머리 끄덕임, 귀 씰룩임, 옆구리 가는 떨림, 뒷발을 끌며 체중을 옮긴다. 걸으려 하지 않고 걸으면 비틀거리다 넘어진다. 머리 주위를 건드리면 혀를 내미는 소가 많고 체온은 정상이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>2단계는 흉와로 누워 일어서지 못하고 졸린 듯 목을 S자로 꺾거나 머리를 옆구리에 댄다. 콧등이 마르고 귀·사지가 차며 체온 36.1~38.3℃, 동공 확대, 항문 긴장 저하, 약한 맥, 심박 약 80회, 변비, 반추위 정지를 보인다. 트림을 못 해 고창이 오고 각막 반사가 준다. 삼킴 반사가 나빠 누운 소에게 물약·환약을 먹이지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="24">•</span><span>3단계는 옆으로 누워 혼수에 빠지고 고창이 생긴다. 심박이 120회까지 오르고 맥이 거의 안 잡히며 치료하지 않으면 몇 시간 안에 죽는다. 사인은 고창에 의한 질식, 반추위 내용물 흡인, 순환 허탈이다. 더운 날에는 체온이 위험하게 오를 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>분만 전에 생기면 자궁 수축이 약해 송아지를 내보내지 못한다. 자궁경관이 다 열려 있고 태위가 정상이면 칼슘 정맥주사 후 대개 정상 분만한다. 자궁탈 소는 칼슘 정맥주사를 하는 것이 표준이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진단·감별</div>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>칼슘에 반응하지 않을 때에 대비해 치료 전에 혈액을 받아 둔다. 치료 전 4분방을 짜 독성 유방염·자궁염을 배제한다. 내독소혈증 소에 칼슘을 정맥주사하면 심장이 멈출 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>감별은 분만 신경 손상, 골반·다리 골절, 자궁 안 둘째 송아지, 저마그네슘혈증, 창상성 제2위염, 고관절 탈구, 척추 림프종이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>분만 전 칼륨·나트륨이 많고 염소·황이 적은 사료는 혈액을 알칼리(pH 7.45)로 만들어 부갑상선호르몬 작용과 칼슘 흡수를 떨어뜨린다. 대사성 알칼리증은 뼈 칼슘 동원과 장 흡수를 막고 알부민 결합을 늘려 이온화 칼슘을 낮춘다. 더위에는 헐떡임으로 호흡성 알칼리증이, 침을 많이 흘리면 대사성 산증이 올 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">칼슘제 용량·투여</div>
<p class="bx-num"><span class="bxn" data-n="29">•</span><span>체중 45kg당 칼슘 1g을 분당 1g 속도로 정맥주사하며 시판 500 mL 제품은 대부분 칼슘 10.5~12g이다(100kg당 칼슘 약 2g으로 적은 책도 있다). 혈중 칼슘은 약 4시간 정상 이상으로 유지된다. 23% 칼슘보로글루코네이트 500 mL는 칼슘 약 10g이고 700kg 소의 3단계 유열도 대개 1병이면 정상 수준에 이른다.</span></p>
