<td class="c">155</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">155</td><td class="c">-</td><td>순환혈액량 확장</td></tr><tr><td>1.3% NaHCO₃</td><td class="c">155~156</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">155~156</td><td>대사성 산증</td></tr><tr><td>링거액</td><td class="c">147</td><td class="c">4</td><td class="c">5</td><td class="c">-</td><td class="c">156</td><td class="c">-</td><td>성우 표준</td></tr><tr><td>젖산링거</td><td class="c">130</td><td class="c">4</td><td class="c">3 (2.7)</td><td class="c">-</td><td class="c">109~111</td><td class="c">젖산 28~30</td><td>신생자 표준</td></tr><tr><td>Normosol-R·Plasma-Lyte A</td><td class="c">140</td><td class="c">5</td><td class="c">-</td><td class="c">3</td><td class="c">98</td><td class="c">초산 27, 글루콘산 23</td><td>대사성 산증</td></tr><tr><td>생리식염수·등장 NaHCO₃ 등량 혼합</td><td class="c">155</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">78</td><td class="c">78</td><td>산증 + 탈수</td></tr><tr><td>McSherry 균형 전해질액</td><td class="c">138</td><td class="c">12</td><td class="c">3</td><td class="c">5</td><td class="c">100</td><td class="c">초산 50</td><td>설사 송아지(현재 시판 안 됨)</td></tr><tr><td>고칼륨 산성화액</td><td class="c">154</td><td class="c">35</td><td class="c">-</td><td class="c">-</td><td class="c">189</td><td class="c">-</td><td>제4위 질환 대사성 알칼리증</td></tr></table><span class="hang">고칼륨 산성화액은 생리식염수에 KCl 2.5 g/L를 넣거나, 등장 KCl(1.1%) 1 L + 0.9% NaCl 2 L + 포도당 1 L를 섞어 만든다(Constable 표 5-5는 포도당 9%, 표 5-2는 등장 포도당 5%로 적는다).</span><span class="hang">송아지 설사용 정맥액은 Na 150, K 5, 중탄산과 전구체 합 약 50 mmol/L를 권하며, 산혈증이 없으면 중탄산 함유액은 필요 없다.</span></span></p><p class="bx-num"><span class="bxn">29.</span><span>링거액·젖산링거(하트만)·초산링거<span class="hang">링거액은 Na·K·Ca·Cl을 생리적 농도로 담은 비알칼리화 등장액이다. 유효 SID 0이라 약하게 산성화하며(SID 1 mEq/L 감소마다 pH 약 0.016 하강), 식욕부진 시 알칼리혈증으로 가기 쉬운 성숙 반추동물의 표준 정맥 수액이다.</span><span class="hang">젖산링거는 알칼리화 저장액(275 mOsm/L)이다. 젖산은 L·D형 라세미 혼합인데 동물은 D-젖산 대사가 거의 없어 알칼리화 능력은 L-젖산액의 절반쯤이고 유효 SID는 계산값 28보다 낮다. 식욕부진 시 산혈증으로 가는 신생자와 성마의 표준 수액이다. 중증 환자는 L-젖산이 이미 높을 수 있어 이론상 초산링거가 낫다.</span><span class="hang">초산링거(Plasma-Lyte A, Normosol-R)는 Na 140으로 가축 혈장과 비슷하다(젖산링거 130). 글루콘산은 송아지에서 대사가 느리다. Large Animal IM은 하트만액도 성우 저염소성 알칼리증에 쓸 수 있는 균형 정질액으로 든다.</span><span class="hang">간 기능 저하(지방간, 심한 케토시스, 임신중독)에는 젖산 제거가 간에서 일어나므로 젖산링거를 피하고 2.5~5% 포도당을 넣은 Normosol-R이나 Plasma-Lyte 정속주입이 낫다(Large Animal IM).</span></span></p><p class="bx-num"><span class="bxn">30.</span><span>생리식염수(0.9% NaCl) — 책마다 평가가 다르다<span class="hang">Constable: 반추동물은 식욕부진 시 저칼슘·저칼륨혈증이 생기므로 일반적 치료에는 가치가 적고, 말, 수술 부위·창상 세척, 다른 전해질·포도당의 운반체로만 쓰라고 한다. 유효 SID 0으로 약하게 산성화한다.</span><span class="hang">Large Animal IM: 저염소성 대사성 알칼리증 소에는 상대적 염소 과잉 때문에 0.9% NaCl이 최선의 정질액이라고 본다. 반대로 대사성 산증이 의심되거나 확인된 반추동물에는 고염소혈증으로 산혈증을 악화시키므로 피한다.</span><span class="hang">검사실이 없을 때 성우 강이온(대사성) 알칼리증은 링거액, 0.9% NaCl, 또는 고장식염수와 식욕부진 개체의 경구 칼륨으로 교정하라고 Constable도 권한다. 식염수는 식탁염 180 g을 여과수 20 L에 녹여 농장에서 만들 수 있다.</span></span></p><p class="bx-num"><span class="bxn">31.</span><span>고장식염수 7.2% — 용량과 사용 조건<span class="hang">2460 mOsm/L(정상의 약 8배). 4~5 mL/kg를 4~5분에 걸쳐(1 mL/kg/분) 정맥 투여한다. 더 빠르면 혈관 확장과 심수축력 저하로 혈역학적 허탈이 오고, 더 느리면 등장액보다 나은 점이 없다. 투여 후 pH 하강은 0.08 미만으로 일시적이며, 혈청 Na는 170을 넘지 않는다.</span><span class="hang">세포내에서 혈관으로 물을 끌어 혈장량·심박출량·GFR을 올린다. 반추동물은 반추위가 주된 물 저장소이므로 고장식염수만 주고 경구 물이나 등장 정맥액을 잇지 않으면 저혈량 교정이 부족하다(Large Animal IM).</span><span class="hang">대장균 유방염 등 내독소 쇼크 젖소: 2 L(4~5 mL/kg) IV 후 즉시 물을 마시게 한다. Large Animal IM은 성우에 1~2 L(2~4 mL/kg) IV 후 물 약 20 L 경구를 권한다. 실험적 내독소 유방염에서 7.5% 5 mL/kg는 자발 음수를 등장액 대비 약 12배로 늘렸다.</span><span class="hang">설사 송아지: 등장 경구 전해질액 3 L를 식도 삽관으로 먼저 주고 18G 바늘로 경정맥에 4~5 mL/kg를 4~5분에 준다. 같은 Na 양의 젖산링거 80 mL/kg/1시간보다 소생이 빠르고 Na가 더 오래 유지된다. 덱스트란 추가는 필수가 아니다. 반면 실험적 급성 내독소혈증 송아지에서는 대량 등장식염수가 더 나았다.</span><span class="hang">RDA 소에서 7.2% 2 L/10분 후 0.9% NaCl 10 L는 같은 Na 양의 0.9% 26 L보다 초기 소생이 빨랐다. 급성 반추위 산증에는 반추위 삼투압이 이미 높아 이론적으로 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">32.</span><span>포도당<span class="hang">5% 포도당(250 mOsm/L)은 Na가 없어 세포외액을 늘리지 못하고 에너지도 적어 자유수 공급과 약물 운반체로만 쓴다. 이미 저나트륨인 동물에 Na 없는 물이나 5% 포도당만 주면 저나트륨혈증이 심해진다.</span><span class="hang">50% 포도당(2500 mOsm/L)은 케토시스·저혈당 반추동물에 흔히 주며 일시적으로 심수축력을 올린다. 혈관 밖으로 새면 자극이 크고 피하·복강 투여는 화학적 염증과 무균성 농양을 만든다(Rebhun).</span><span class="hang">포도당 1 g은 5 kcal를 내며, 절식 소의 유지 에너지를 50% 포도당으로 채우려면 45 kg 송아지 0.7 L/일, 180 kg 2.0 L/일, 454 kg 3.8 L/일, 544 kg 4.8 L/일이 필요하다. 대략의 지침일 뿐이고 식이로 채우도록 힘쓴다(Constable 표 5-4).</span><span class="hang">Large Animal IM: 심한 케토시스·지방간에서 포도당 1~2 mg/kg/분(성우는 3~6% 포도당액 약 1 L/시간), 혈당 80~110 mg/dL 유지. 반복 정맥 포도당은 혈장 인을 크게 떨어뜨리고 칼륨을 세포 안으로 옮긴다.</span><span class="hang">송아지 혈당 2 mmol/L(36 mg/dL) 미만은 생존율 저하와 연관되며(흔히 패혈증), 정맥액에 포도당을 최종 2.5~5%로 넣는다.</span></span></p><p class="bx-num"><span class="bxn">33.</span><span>중탄산나트륨 — 제형과 투여 속도<span class="hang">적응: 대사성 산증에 의한 혈액 pH 7.20 미만. 즉시 중탄산을 공급하므로 젖산·초산나트륨보다 대사성 산증 치료에 낫다. 임상 시험에서 심한 산증 송아지에 일관되게 효과적인 알칼리화제는 중탄산뿐이었다(Large Animal IM).</span><span class="hang">1.3% 등장액(155~156 mmol/L): 중탄산나트륨 13 g을 물 1 L에 녹인다. 8.4% 고장액: 1 mL = 1 mEq, 정맥 속도 1 mL/kg/분을 넘지 않는다. 5% 고장액: 2 mL/kg/분을 넘지 않는다.</span><span class="hang">송아지: 8.4% 5 mL/kg/5분 정맥은 정상혈량 송아지의 혼합 산증을 빠르게 교정하고 역설적 뇌척수액 산증이 없었다. 8.4%를 1 mL/분/kg로 15분간 주는 방법도 있다(Large Animal IM). 같은 Na 양이면 등장액이 재수화에, 고장액이 산혈증의 빠른 교정에 더 효과적이었다.</span><span class="hang">D-젖산 산증 증후군(1~4주령, 탈수·설사 거의 없이 침울·운동실조·흡입·위협반사 저하) 송아지는 1.3% 중탄산액 2.5~4.5 L를 정맥으로 줘야 회복한다.</span><span class="hang">칼슘 함유액(링거액 포함)과 섞으면 탄산칼슘 침전이 생긴다. 역설적 뇌척수액 산증은 조절 호흡 중인 마취 동물에서만 관찰되었다.</span></span></p><p class="bx-num"><span class="bxn">34.</span><span>중탄산 필요량 계산식<span class="hang">Constable: 전해질 총결손(mEq) = 결손 농도(ΔmEq/L) × 정상 수화 체중(kg) × 분포 공간(성우 0.3, 신생자 0.5). Na·Cl·HCO₃ 모두 세포외액(성우 체중의 30%, 신생자 50%)에 분포한다고 본다. Large Animal IM 검사 해석 장도 염기결손 × 체중 × 0.3(성체) 또는 0.5(신생·어린 개체)로 쓴다.</span><span class="hang">Large Animal IM 송아지 설사 장: 중탄산(mmol) = 체중(kg) × 염기결손(mmol/L) × 0.6(송아지 분포 용적). 총 CO₂나 혈청 HCO₃로 계산할 때는 (30 − tCO₂) × 체중 × 0.6. 예: 40 kg, tCO₂ 10이면 40 × 20 × 0.6 = 480 mmol. 같은 책 반추동물 수액 장은 NaHCO₃(mmol) = 체중 × 염기결손 × 0.3을 쓴다.</span><span class="hang">Rebhun은 신생자 세포외액 50%를 가정해 40 kg 송아지, HCO₃ 10 → 목표 25~30이면 20 L × 15 mEq = 300 mEq로 예시한다. 계수가 책마다 0.5와 0.6으로 다르다.</span><table class="bxt"><tr><th class="c">송아지 체중(kg)</th><th class="c">염기결손 10</th><th class="c">염기결손 15</th><th class="c">염기결손 20</th></tr><tr><td class="c">40</td><td class="c">200 mmol (1.3% 1.3 L)</td><td class="c">300 (1.9 L)</td><td class="c">400 (2.6 L)</td></tr><tr><td class="c">50</td><td class="c">250 (1.6 L)</td><td class="c">375 (2.4 L)</td><td class="c">500 (3.2 L)</td></tr></table><span class="hang">위 표(Large Animal IM 표 20.11)는 계수 0.5로 계산된 값이다. 계속되는 설사에는 추가 중탄산이 필요할 수 있다. pH 7.25~7.45는 큰 해가 없어 완전 교정이 꼭 필요하지는 않으며, 24시간에 걸친 교정이 이상적이나 4시간 교정도 문제가 드물다.</span><span class="hang">현장 결정 나무(Trefz): 잘 서고 안구함몰 없으면 고SID 경구액. 잘 서나 안구함몰 있으면 NaHCO₃ 250 mmol. 불안정하게 서면 500 mmol, 기립불능이거나 밀어도 자세를 못 바로잡고 안검반사 지연·소실이면 750 mmol. 안구함몰 7 mm 이상이면 0.9% NaCl 10 L 정속주입을 포함한다.</span></span></p><p class="bx-num"><span class="bxn">35.</span><span>칼륨 첨가 — 상한 속도와 경구 KCl<span class="hang">정맥 칼륨 투여 상한은 0.5 mEq/kg/시간이다. 이를 넘으면 심실조기수축에서 심실세동까지 위험하다. 가장 적극적인 방법은 등장 KCl(1.15%)을 3.2 mL/kg/시간 미만으로, 덜 적극적인 방법은 0.45% NaCl + 0.58% KCl 등장 혼합액, 가장 보수적인 방법은 링거액 1 L당 KCl 10 mmol 추가(329 mOsm/L)다. 정맥 경로는 심한 저칼륨혈증과 반추위 무력으로 누운 반추동물의 초기 치료에만 쓴다(Constable).</span><span class="hang">Large Animal IM: 정맥액에 KCl 20~40 mEq/L(송아지는 20~30 mEq/L)를 넣고, KCl 1.0 g은 약 14 mEq다. 보충량(mEq) = 체중 × 0.4 × K 결손(송아지).</span><span class="hang">경구 KCl이 비유 젖소 저칼륨혈증의 1차 선택이다. 식욕부진 젖소에 사료용 KCl 120 g을 12시간 간격 2회(24시간 240 g, 600 kg 소에서 0.4 g/kg/일). 0.4 g/kg/일 초과는 설사·유연·다리 떨림·호흡곤란·경련·폐사 위험이 있어 심한 저칼륨혈증 외에는 권하지 않는다. 0.58 g/kg는 6개월령 송아지에서 독성을 보였다(Constable). Large Animal IM은 10 g/100 kg 1일 2회를 쓴다.</span><span class="hang">산혈증·고칼륨혈증 송아지는 혈액량 회복·신기능 회복·산증 교정 전에 칼륨을 주면 위험하다. 산증이 교정되면서 칼륨이 세포 안으로 들어가 저칼륨혈증이 올 수 있으니 미리 대비한다. 식욕이 돌아오면 경구 섭취로 대개 결핍이 교정된다.</span></span></p><p class="bx-num"><span class="bxn">36.</span><span>수액에 칼슘 첨가<span class="hang">독혈증 소와 분만 후 다산우는 저칼슘혈증이 흔하므로 수액 1 L당 23% 보로글루콘산칼슘 25 mL를 넣는 것을 고려한다(Large Animal IM). 칼슘 첨가액은 볼루스로 주지 않는다.</span><span class="hang">칼슘 최대 안전 속도는 0.07 mEq/kg/분(23% 보로글루콘산칼슘 0.065 mL/kg/분, 500 kg 소에서 33 mL/분)이며 투여 중 반드시 심장을 청진한다. 자세한 칼슘 치료는 대사 탭에서 다룬다.</span><span class="hang">글루콘산칼슘을 중탄산나트륨에 넣으면 흰 탄산칼슘 침전이, 테트라사이클린과 함께 주면 노란 침전이 생긴다. 정맥 인산염은 정맥 칼슘 투여 2시간 이내에 주지 않는다.</span></span></p><p class="bx-num"><span class="bxn">37.</span><span>교질액<span class="hang">교질은 반투막을 통과하지 못해 혈장량을 오래 늘린다. 울혈성 심부전과 핍뇨·무뇨 신부전(폐수종 위험)에는 금기다. 시판 교질액 연구의 철회와 이해상충 문제로 근래 사용 열의가 줄었다(Constable).</span><span class="hang">전혈은 이상적인 교질·정질 균형액이며 산소 운반 능력이 있으나 4℃ 보관 수명이 24시간 미만이다. 혈장은 −20℃에서 최소 1년 보관된다. 반추동물에서는 덱스트란 70이나 히드록시에틸전분보다 혈장·전혈을 더 자주 쓴다.</span><span class="hang">덱스트란 70(6%, 0.9% NaCl): 5~40 mL/kg/시간이 보고되나 20 mL/kg/시간 미만이 안전하다. 1 mL가 혈장량을 0.8~1.2 mL 늘리고 24시간에 50%가 사라진다. 사람 24시간 최대 20 mL/kg. 응고장애 악화 위험이 있다.</span><span class="hang">히드록시에틸전분(헤타스타치) 6%: 20 mL/kg/시간 미만이 안전하고, Large Animal IM은 5~20 mL/kg/일을 쓴다. 고분자 제제는 사람에서 신독성·급성신부전과 연관되어 미국 FDA가 2013년 중환자 사용을 말렸다. 성우에서는 비용이 걸림돌이다.</span><span class="hang">고장식염수-덱스트란(7.2% NaCl + 6% 덱스트란 70) 4 mL/kg/4분 IV + 등장 경구 전해질액 50~60 mL/kg는 심한 탈수 설사 송아지를 빠르고 효과적으로 소생시켰다. 고장식염수-덱스트란 단독은 일시적 효과뿐이었다.</span></span></p><p class="bx-num"><span class="bxn">38.</span><span>농장 자가 조제 수액 (Large Animal IM 표 44.3, 물 20 L 기준)<table class="bxt"><tr><th>용액</th><th class="c">NaCl</th><th class="c">KCl</th><th class="c">CaCl₂</th><th class="c">50% 포도당</th><th class="c">물</th></tr><tr><td>0.9% NaCl</td><td class="c">180 g</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">20 L</td></tr><tr><td>반추동물 전해질액</td><td class="c">140 g</td><td class="c">25 g</td><td class="c">10 g</td><td class="c">-</td><td class="c">20 L</td></tr><tr><td>5% 포도당</td><td class="c">-</td><td class="c">-</td><td class="c">-</td><td class="c">2 L</td><td class="c">18 L</td></tr><tr><td>0.45% NaCl + 2.5% 포도당</td><td class="c">90 g</td><td class="c">-</td><td class="c">-</td><td class="c">1 L</td><td class="c">19 L</td></tr></table><span class="hang">여과하지 않은 수돗물로 만든 경우 저자는 48시간 이상 계속 쓰지 말고 비경구 항생제를 함께 쓰라고 권한다. Constable도 비용 때문에 증류수·끓인 물·수돗물로 염을 섞어 싸게 만들 수 있다고 쓴다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">39.</span><span>경구 수액 — 원칙<span class="hang">소화관에 흡수 장애가 없으면 유지요법은 경구가 낫다. 비경구보다 과수화와 전해질 독성 위험이 적고, 설사 중 지속 손실을 보충한다. 24시간 유지량을 계산해 하루 3회로 나눠 준다.</span><span class="hang">성우는 반추위 기능이 있어야 수액·전해질이 흡수된다. 반추위 무력 소에 대량 경구 수액을 주면 반추위에 격리되어 저염소·저칼륨 대사성 알칼리증이 생긴다. 제4위 염전은 수술 교정 후에만 경구 수액을 쓴다(수술 전에는 복부 팽만 악화, Large Animal IM).</span><span class="hang">축주에게 설사·탈수·침울·흡입 불량 신생 동물에 가능한 빨리 경구 전해질을 시작해 정상화될 때까지 계속하라고 알린다. 설사 동물에게는 경구 전해질액과 물을 늘 둔다.</span></span></p><p class="bx-num"><span class="bxn">40.</span><span>송아지 경구 전해질액 조성 기준 (Constable)<span class="hang">21일령 미만 송아지는 설사 첫 징후에 바로 경구 전해질액을 준다. 탈수 송아지의 첫 치료는 대용유에 섞지 않은 전해질액이 혈장량 확장에 낫다.</span><span class="hang">Na 90~130 mmol/L: 90 미만은 Na 부하 부족, 130 초과는 고나트륨혈증과 추가 자유수 손실을 부른다(우유 Na는 평균 28 mmol/L로 매우 낮다).</span><span class="hang">삼투압 300(등장)~700 mOsm/kg. 우유를 끊으면 에너지가 모자라므로 고장액(약 600), 우유를 먹이면 등장액(300)을 준다. 600 mOsm/kg는 제4위 배출을 늦춘다.</span><span class="hang">포도당과 초산·프로피온산·글리신 중 하나를 넣어 Na 공동수송과 에너지를 돕는다. 포도당 2.4 g/kg 초과는 제4위 배출을 늦춰 재수화가 느려질 수 있다. 포도당:Na 비(사람 영아 기준 최적 1.4)의 중요성은 송아지에서 의문이 제기되었다.</span><span class="hang">알칼리화제(초산·프로피온산·중탄산) 40~80 mmol/L, 유효 SID 40~80 mmol/L. SID 0인 액은 산성화해 권하지 않는다. 초산·프로피온산은 제4위 pH를 올리지 않아 우유와 함께 줄 수 있고 살모넬라 증식을 억제한다. 중탄산은 심한 산혈증 교정에 이론상 빠르지만 우유 없이 주면 제4위를 과알칼리화한다(25 mmol/L 저농도는 응고에 문제가 없었다).</span><span class="hang">우유는 24시간 넘게 끊지 않는다. 우유를 계속 주면 설사 기간이 짧고 체중이 유지되며 점막 재생이 빠르다. 신선 생유가 대용유나 살균 폐기유보다 낫다. 전해질액을 우유에 섞는 방법도 효과적이며 이때 물을 늘 둔다.</span></span></p><p class="bx-num"><span class="bxn">41.</span><span>성우 경구·반추위 수액<span class="hang">소는 하루 최대 180 L의 침(Na 126 mEq/L)을 내고 그 Na 절반을 전위가 재흡수하므로 경구 Na는 잘 흡수되고 물이 따라간다. 반추위 내용물이 혈장보다 저장성이면 저장 기능 덕에 느리지만 지속적으로 흡수된다.</span><span class="hang">최적 조성은 알려지지 않았으나 Na·K·Ca·Mg·인·프로피온산을 담아야 한다(Constable). 제시된 처방: ① NaCl 6.17 g + KCl 0.34 g + NaHCO₃ 2.89 g/L(Na 140, K 4.5, Cl 110 mmol/L, 탈수 염소에서 비반추위 삽관으로 효과) ② 저염소·저칼륨 알칼리증용 NaCl 7 g + KCl 1.5 g + CaCl₂ 1 g/L(Na 120, K 20, Ca 9, Cl 158 mmol/L).</span><span class="hang">단순 제4위 전위로 경도 탈수인 소는 물·전해질 10~20 L 장관 투여로 충분하다(Large Animal IM). 고장식염수 후에는 물 약 20 L를 먹이거나 위관으로 준다.</span><span class="hang">경구 NaHCO₃ 2.5 g/kg는 성우에 심한 대사성 알칼리증을 만든다. 40% 중탄산나트륨 700 mL나 46% 프로피온산나트륨 드렌치는 혈액 pH를 비슷하게 올린다. 곡류과식에는 수산화·산화마그네슘보다 경구 중탄산이 더 효과적일 것으로 본다.</span><span class="hang">위관(stomach tube) 삽입은 미숙한 인력이 하면 인두·식도 손상과 오연 위험이 있다. 반사가 저하된 소에 드렌치나 볼루스를 주지 않는다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">42.</span><span>피하·복강 수액<span class="hang">송아지는 균형 전해질액을 한 부위에 250~1000 mL까지 피하로 줄 수 있고, 주입 중 부풀어 오른 곳을 살살 펴서 흡수를 돕는다. 포도당 함유액과 자극성 약물은 피하로 주지 않는다(Rebhun).</span><span class="hang">복강 주사는 비전문가의 칼슘 투여 외에는 드물다. 우겸부에서 하며 피하·근육·장관 내로 들어갈 수 있고, 포도당이 섞이면 화학적 복막염, 장 유착이 생길 수 있다. 누운 소는 왼쪽으로 굴린 뒤 5 cm 이상 바늘로 찌른다.</span><span class="hang">순환혈액량이 줄어 있으면 복강·피하·경구 경로는 모두 수화요법으로 부적절하다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">43.</span><span>산염기 평가 — 기본 해석<span class="hang">전통적 Henderson–Hasselbalch 접근은 pH를 전체 지표, PCO₂를 호흡 성분, 표준(생체 내) 염기과잉을 비호흡(대사) 성분으로 본다. HCO₃는 pH와 PCO₂로 계산되는 종속 변수라 독립 지표가 될 수 없다. 총단백·알부민·인이 크게 비정상이면 강이온 접근(pH, PCO₂, 측정 SID, Atot)과 강이온차(SIG)를 쓴다.</span><span class="hang">대동물 혈장 HCO₃ 정상 24~30 mmol/L(사람 22~24). 경도 대사성 산증 20~24, 중등도 14~18, 고도는 10 미만으로 예후 불량. 염기과잉 정상 0~6 mEq/L. 대사성 산증에서는 과호흡으로 PCO₂가 보상적으로 내려가고, 알칼리증에서는 저호흡으로 올라간다.</span><span class="hang">정맥혈 정상 pH 7.35~7.45. 중등도 산혈증 7.30~7.25, 고도 7.25~7.20, 위중 7.10~7.00이며 위중 단계는 신생자를 빼면 치사율이 높다. 신체는 pH 7.0~7.6을 견딘다. 일차 장애는 pH가 종의 평균보다 낮으면 산증, 높으면 알칼리증으로 판단한다.</span><span class="hang">호흡기 질환이 없으면 총 CO₂가 유용한 선별검사다(감소 = 대사성 산증, 증가 = 대사성 알칼리증).</span></span></p><p class="bx-num"><span class="bxn">44.</span><span>음이온차·강이온차·젖산<span class="hang">음이온차 = (Na + K) − (Cl + HCO₃). 대동물은 K를 넣어 계산하는 것이 합의다. 정상 음이온차의 약 2/3는 혈청 단백의 음전하다. 성우 95% 범위 14~20 mEq/L(Constable 본문), 참고범위 14~26(Constable 부록, Bovine Medicine). 중증 소에서는 젖산·케톤산·요독 음이온으로 30을 넘기도 한다.</span><span class="hang">소에서 음이온차는 혈중 L-젖산뿐 아니라 인·크레아티닌의 영향도 받아 젖산 예측력이 말보다 떨어지며, 음이온차 증가는 요독 음이온 존재를 시사한다. 사람·말과 달리 소의 미측정 음이온은 약 7 mEq/L로 상당하다.</span><span class="hang">SIG 참고범위 −5~+5 mEq/L. −5 미만(흔함)은 미측정 강음이온 증가를 뜻한다. 송아지 Atot 23.1 mmol/L(총단백 g당 0.41, 알부민 g당 0.75), pKa 7.08.</span><span class="hang">대동물 혈장 L-젖산 정상은 1.5 mmol/L 미만. 경도 2.5~4.9, 중등도 5.0~9.9, 고도 10 이상이며 10 초과는 사람·돼지·말에서 높은 사망률과 연관된다. 한 시점 값보다 처치에 따른 변화가 예후에 더 유용하다.</span></span></p><p class="bx-num"><span class="bxn">45.</span><span>저염소성 저칼륨성 대사성 알칼리증 — 제4위 질환<span class="hang">기전: 제4위 점막은 HCO₃와 교환해 다량의 Cl을 분비하고 H·Cl·K는 소장에서 재흡수된다. 제4위 확장·매복·염전(우방전위), 상부 장폐색으로 배출이 막히면 HCl과 K가 제4위와 반추위 역류로 격리된다. 신장은 Cl과 HCO₃ 재흡수가 반비례하므로 저염소혈증을 보상하려 HCO₃ 재흡수를 늘리고 알칼리혈증이 된다.</span><span class="hang">알칼리증이면 K가 세포 안으로 들어가 총량 결핍 없이도 혈청 K가 낮다. 신장은 산염기보다 혈장량 유지를 우선해 원위 세관에서 Na를 H와 바꿔 재흡수하므로 역설적 산성뇨가 생긴다(분만 후 산성뇨와 감별).</span><span class="hang">대표값(Constable 표 5-1, 제4위 확장·매복·염전): PCV 42 ± 6%, pH 7.49 ± 0.15, HCO₃ 35.4 ± 5.7, PCO₂ 46.4 ± 7.5, Na 138.5 ± 5.4, Cl 88.6 ± 12.8, K 3.4 ± 0.6, BUN 40 ± 15 mg/dL. Bovine Medicine은 RDA에서 Cl 70 미만을 중등도~고도로 본다.</span><span class="hang">임상 소견은 특징적이지 않다. 얕고 느린 호흡, 극심한 알칼리혈증(pH &gt; 7.60)에서 이온화 칼슘 저하로 근떨림·강직성 경련, 말기 과호흡·호흡곤란.</span><span class="hang">치료: 0.9% NaCl 정맥으로 세포외액과 Na·Cl 결손을 보충하고 경구 KCl을 준다. Cl이 충분하면 Na가 HCO₃ 없이 재흡수되어 알칼리증이 풀린다. 균형액으로 Na 135~155, Cl 150~170, K 10~20 mEq/L 용액이 효과적이고 분만 직후 젖소는 보로글루콘산칼슘을 더한다. 2 L 0.9% NaCl + 1 L 1.1% KCl + 1 L 5% 포도당 혼합도 쓴다. 산성화액(염화암모늄 등)은 검사실 감시가 가능할 때만 쓴다(Constable).</span></span></p><p class="bx-num"><span class="bxn">46.</span><span>대사성 산증 — 설사와 곡류과식<span class="hang">원인 분류(전통): 염기(HCO₃) 과다 손실, 내인성·외인성 산 축적, 둘의 복합. 강이온 접근: 저나트륨혈증이나 강음이온(Cl, L·D-젖산, 케톤산) 증가에 의한 강이온 산증, 그리고 알부민·글로불린·인 증가에 의한 비휘발성 완충이온 산증. 성숙 반추동물의 급성 장폐색은 적어도 초기에는 알칼리증이고 말은 산증이라는 차이가 있다.</span><span class="hang">신생 송아지 설사 대표값(표 5-1): PCV 45.3 ± 7.0%, pH 7.08 ± 0.12, HCO₃ 13.7 ± 4.2, Na 138 ± 9.4, Cl 101.4 ± 7.5, K 7.4 ± 1.6, BUN 50.1 ± 30.5 mg/dL. 급성 곡류과식: PCV 45 ± 6%, pH 7.10 ± 0.05, HCO₃ 12.5 ± 3.5, Na 132 ± 4, Cl 93 ± 3, K 5.0 ± 2.5.</span><span class="hang">임상: 정신 침울, 근무력, 신생자의 흡입 저하·소실. 안검반사 지연·소실은 고D-젖산혈증, 불안정한 기립·기립불능과 청각·시각·통증 자극(정맥천자) 반응 지연·소실은 심한 산혈증을 시사한다. 심한 탈수·산혈증 송아지는 호흡 기능이 억제되어 오히려 호흡이 느리고 얕을 수 있다. 고칼륨혈증이 겹치면 서맥·심차단·급사가 오며 운반·보정 중 특히 위험하다.</span><span class="hang">흥미롭게도 건강 신생 송아지에 급성 산혈증(pH 6.96, 염기과잉 −22)을 실험적으로 만들어도 임상 이상이 없었다. 산혈증이 만성이어야 증상이 나타나거나, 증상 대부분이 원발 질환과 동반 전해질·에너지 이상 때문일 수 있다.</span><span class="hang">치료: 송아지 설사는 등장 식염수와 등장 중탄산나트륨 등량 혼합에 5% 포도당, 균형 전해질액을 정맥과 경구로(Constable 표 5-2). 곡류과식(D-젖산 산증)은 중탄산나트륨 후 균형 전해질액 정맥. Large Animal IM은 산증 반추동물에 젖산링거·Plasma-Lyte 같은 비산성화액을 0.9% NaCl보다 우선하고, pH 7.20 미만이면 1.3~5% 중탄산을 쓰며, 검사가 없으면 젖산링거와 중탄산액을 번갈아 써 과교정을 피한다.</span></span></p><p class="bx-num"><span class="bxn">47.</span><span>저칼륨혈증과의 연결<span class="hang">정의: 혈청·혈장 K 3.9 mEq/L 미만. LDA·RDA·제4위 염전·매복, 임상형 유방염, 난산, 태반정체, 지방간이 있는 비유 젖소에서 흔하다. 건물섭취 감소, 제4위 Cl 격리에 의한 알칼리혈증, 고혈당에 따른 고인슐린혈증, 우유로 나가는 K(우유 1 L당 1.4 g), 교감신경 활성, 알도스테론, 낮은 근육량이 겹친다. LDA 수술우·지방간 치료우에서 낮은 K는 비생존의 유의한 예측인자였다.</span><span class="hang">이소플루프레돈(광물코르티코이드 활성 있는 글루코코르티코이드)을 케토시스에 반복 투여하면 저칼륨혈증과 기립불능이 와 치사율이 높다. 칼륨 없는 수액을 오래 주어도 생긴다.</span><span class="hang">증상: 근무력, 원인 모를 장기 기립불능, 머리를 들지 못함, 식욕부진, 근떨림, 심하면 혼수. 근무력 감별에 늘 저칼륨혈증을 넣는다.</span><span class="hang">K는 주로 세포 안에 있어 혈청 K는 총량을 잘 반영하지 못한다. 적혈구 K는 개체차(7~70 mmol/L)가 커서 쓸모가 없고, 우유 K(초기 42, 중기 40, 말기 27 mmol/L)는 치료 반응 추적에 쓸 수 있다. 골격근 K 함량이 가장 정확하다.</span></span></p><p class="bx-num"><span class="bxn">48.</span><span>고칼륨혈증<span class="hang">심한 대사성 산증·산혈증, 특히 설사 송아지에서 흔하며 체내 총 K가 정상이거나 낮아도 생긴다. 고D-젖산혈증 산혈증 송아지에서는 오히려 드물다. 사구체여과율 감소와 가장 강하게 연관된다.</span><span class="hang">7~8 mmol/L를 넘으면 심장에 큰 영향을 준다(현저한 서맥·부정맥·급성 심정지). 말 실험에서 6~7 mmol/L부터 심전도 변화(P파 넓어짐·소실, T파 증고, QRS 연장), 8~11에서 심한 심독성이 나타났다. 설사 송아지에 흔한 저나트륨혈증이 심전도 변화를 악화시킨다.</span><span class="hang">치료의 핵심은 Na 함유액으로 혈장량을 늘려 신혈류와 요 생성을 회복하고 산혈증을 교정하는 것이며, 1.3% 중탄산나트륨처럼 빠르게 알칼리화하는 액이 특히 좋다. 고장식염수도 고장 중탄산만큼 효과적이었다. 칼슘은 역치 전위를 올려 막 효과를 상쇄하며 23% 글루콘산칼슘 0.2~0.4 mL/kg을 정맥으로 준다. 포도당·인슐린은 일상적으로 필요 없다.</span><span class="hang">Rebhun은 고칼륨혈증 ETEC 설사 송아지에 처음 1~3 L를 5% 포도당 1 L에 NaHCO₃ 150 mEq를 넣은 액으로 주고, K와 HCO₃가 개선된 뒤에 칼륨 함유액을 쓰라고 한다. 서맥·부정맥 송아지에 칼륨액을 먼저 주어 폐사한 예가 있다.</span></span></p><p class="bx-num"><span class="bxn">49.</span><span>나트륨 이상과 수중독<span class="hang">저나트륨혈증의 가장 흔한 원인은 장관을 통한 Na 손실이다(ETEC 분비액은 혈장과 Na 농도가 비슷). 증상은 특이적이지 않다. 48시간 넘은 만성 저나트륨혈증(&lt;120 mEq/L)을 너무 빨리 교정하면 탈수초가 생길 수 있어 대동물에서는 하루 8 mEq/L 상승을 목표로 한다.</span><span class="hang">수액 1 L의 효과: Na 변화 = (수액 Na − 혈청 Na) / (총체수 + 1), 총체수 = 체중 × 0.6. 24시간 8 mEq/L 상승에 필요한 1 L 수액의 Na = 8 × (0.6 × 체중 + 1) + 혈청 Na. 7.2%·5%·0.9% NaCl을 섞어 만든다.</span><span class="hang">고나트륨혈증은 물 제한이나 대용유·경구 전해질액 혼합 오류가 주원인이며(유청 기반 대용유는 Na가 높음), 160 초과에서 임상적이고 180~190 초과면 치사율이 높다. 증상은 허약·침울·이상 자세·시각 상실·안면근 경련. 급히 교정하면 뇌부종과 대후두공 탈출이 오므로 시간당 0.5~1.0 mEq/L(하루 10 mEq/L) 낮추며, Na 함유 경구 전해질액이 선호된다.</span><span class="hang">수중독: 물을 제한받던 2~4개월령 송아지가 갑자기 많이 마시면 혈관내 용혈, 혈색소뇨(검붉은 오줌), 저나트륨·저염소혈증이 온다. 대개 치료가 늦어 몇 시간 안에 혈색소뇨가 사라지지만, 필요하면 7.2% NaCl 5 mL/kg을 5분에 걸쳐 정맥으로 준다. 송아지는 태어나면서부터 물을 자유롭게 먹게 한다.</span></span></p><p class="bx-num"><span class="bxn">50.</span><span>저칼슘·저인·저마그네슘과의 연결(짧게)<span class="hang">며칠 식욕부진한 분만 젖소는 저칼슘혈증이 흔하며 식욕부진·경도 빈맥과 심음 약화·반추위 운동 저하·분변 감소가 6~36시간 이어지고 장폐색과 헷갈린다. 총 Ca 1.5~2.0 mmol/L이며 정맥 칼슘에 반응이 좋다. 곡류과식 반추동물도 흔히 저칼슘혈증이다.</span><span class="hang">이온화 칼슘이 생물학적 활성형이다. 혐기 채혈로 실제 pH에서 측정하며, 진공관처럼 CO₂가 빠진 시료만 pH 7.40 보정식(cCa²⁺ × 10^(−0.24 × (7.40 − pH)))을 쓴다. 알칼리혈증은 이온화 칼슘을 낮춘다.</span><span class="hang">대부분의 시판 정맥 인 제제는 아인산·차아인산염이라 포유류가 쓸 수 없다. 심한 저인산혈증 젖소에는 10% NaH₂PO₄ 300 mL 서서히 정맥, 반추위가 움직이면 사료용 인산일나트륨 200~350 g 경구가 낫다. 마그네슘 경구 생체이용률은 낮아 치료가 아닌 예방에 쓴다. 상세 용량은 대사 탭에서 다룬다.</span></span></p><p class="bx-num"><span class="bxn">51.</span><span>질병별 수분·전해질 이상과 권장 수액 (Constable 표 5-2, 소 관련)<table class="bxt"><tr><th>질병</th><th>주요 이상</th><th>권장 수액</th></tr><tr><td>신생 송아지 설사</td><td>대사성 산증, HCO₃ 저하, 심한 탈수, Na 손실, 심한 산증 시 고칼륨혈증</td><td>등장 식염수·등장 중탄산 등량 혼합 + 5% 포도당, 균형 전해질액(정맥·경구)</td></tr><tr><td>곡류과식(D-젖산 산증)</td><td>대사성 산증, HCO₃ 저하, 심한 탈수</td><td>중탄산나트륨 후 균형 전해질액 정맥</td></tr><tr><td>급성 미만성 복막염</td><td>탈수, 마비성 장폐색에 의한 경도 대사성 알칼리증</td><td>균형 전해질액 대량 정맥</td></tr><tr><td>우측 확장·제4위 염전, 제4위 매복</td><td>대사성 알칼리증, 현저한 저염소혈증, 저칼륨혈증, 심한 탈수</td><td>균형 전해질액이나 고칼륨·염소 산성화액 정맥, 산성화액 경구 가능</td></tr><tr><td>심급성 대장균 유방염</td><td>심한 탈수, 경도 저칼슘혈증 포함 경도 전해질 결손, 설사 시 대사성 산증</td><td>균형 전해질액 대량 정맥 24~48시간(100~150 mL/kg/24시간)</td></tr><tr><td>급성 장폐색</td><td>폐색 위치에 따라 산증 또는 알칼리증, 소는 중등도 탈수</td><td>등장 중탄산 3~5 L/500 kg 후 균형 전해질액(말 기준 기술)</td></tr></table></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">52.</span><span>수혈·혈장 — 적응과 채혈(짧게, 상세는 혈액 탭)<span class="hang">적응: 극심한 빈혈, 급성 실혈, 혈소판감소증·응고결손에 의한 출혈, 수동면역 이행 실패 신생 송아지. 처음 수혈하는 소는 교차시험이 필요 없고 혈액형이 많아 혈액형 검사도 거의 필요 없다. 임상적으로 의미 있는 수혈반응은 1% 미만이다(Rebhun). 반추동물은 첫 수혈의 알레르기 반응이 극히 드물다(Constable).</span><span class="hang">공혈우: 크고 건강하며 소백혈병바이러스 음성·BVDV 지속감염 아닌 소, 도태 예정 공태우가 이상적이다. 700 kg 이상이면 6 L를 안전하게 뽑는다. 자일라진 15~25 mg IV로 진정, 목 아래 1/3에 쵸크로프, 15 cm 8G 투관침, 20% 구연산나트륨 35 mL/L가 든 병에 받으며 살살 돌려 섞는다. 15분 안에 6 L를 받을 수 있고 숙련되면 매달 수년간 쓸 수 있다.</span></span></p><p class="bx-num"><span class="bxn">53.</span><span>수혈·혈장 — 투여와 반응<span class="hang">수혈자에 14G 정맥 카테터를 넣고 인라인 필터가 있는 수혈세트로 느리게~중간 속도로 30~120분에 준다. 너무 빠르면 빈맥·빈호흡·허탈이 온다. 처음 몇 분은 느리게 주며 심박·체온·호흡을 보고 이상 없으면 속도를 크게 올린다(전혈·혈장 공통).</span><span class="hang">두드러기, 점막피부 경계부 부종, 빈맥, 빈호흡이 보이면 즉시 중단하고 알레르기 반응을 치료(주로 항히스타민)한 뒤 교차시험이나 다른 공혈우를 고른다.</span><span class="hang">설사 송아지에 소 혈장 600~800 mL(단백 5 g/dL)와 전해질을 정맥으로 준 군의 14일 생존율은 93%로 전해질만 준 군(54%)보다 높았다(초유 미급여 송아지로 추정). 혈장이 필요한 신생 반추동물에는 더 싼 전혈을 흔히 쓴다. 사람 알부민은 비싸서 대동물에 쓸 이유가 없다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">54.</span><span>항생제 원칙 — 선택의 기본<span class="hang">이상적 선택 순서: 배양으로 원인균 확인 → 각 약제의 최소억제농도(MIC) 확인 → 감염 부위에서 MIC를 넘는 농도를 비독성 용량으로 얻을 수 있는 약 선택 → 해당 동물종에서 용량·경로·간격 결정. 비용(투여 편의, 횟수, 기간 포함), 조직 잔류와 휴약기간이 전략의 일차 결정 요인이다(Constable).</span><span class="hang">확진 없이도 치료는 시작해야 하며, 부위와 성상으로 원인균을 추정한다. 한 균이 우세하면 그 균을 겨냥하고, 여러 균이 비슷하면 광범위 약이나 병용으로 시작해 감수성 결과 후 좁힌다.</span><span class="hang">시료는 생명을 위협하는 개체, 여러 균이 원인일 수 있는 증후군, 반응 없는 만성 질환, 무리 발생에서 특히 채취한다. 설사 무리는 만성 개체가 아닌 설사 시작 개체에서, 폐렴은 비강이 아닌 경기관 흡인물로 받는다.</span><span class="hang">Bovine Medicine 체크리스트: 항생제가 필요한 진단인가, 원인균·감수성, 장기와 조직 침투, 세포내·외 여부, 좁은 범위 약 가능성, 용량·횟수·기간, 부작용, 경로, 치료 대상(임상우만 또는 위험군 포함), 휴약·잔류, 비용효율.</span></span></p><p class="bx-num"><span class="bxn">55.</span><span>감수성 검사의 해석<span class="hang">MIC는 18~24시간 배양 후 육안 증식을 막는 최저 농도다. 대부분 항생제는 투약 간격 내내 MIC의 2~5배(효과 치료에 3~5배) 혈장 농도가 필요하다. 시험관 희석법이 표준이지만 현장에서는 거의 쓰지 않는다.</span><span class="hang">디스크 확산법(Kirby–Bauer)은 정성적이며 기준점이 대개 사람 약동학에 근거해 반추동물과 잘 맞지 않고, 계열 대표 약 하나로 시험하며, 표준 배지·조건이 지켜지지 않는 경우가 많다. 억제대 크기 비교로 상대적 효능을 판단할 수 없다. 대동물 질병 대부분에서 기준점이 검증되지 않았다.</span><span class="hang">설폰아미드 감수성 결과는 자주 오도한다. 내성으로 나와도 임상 반응이 좋을 수 있다.</span><span class="hang">경험적 선택은 빠르고 싸지만 최대 50%에서 잘못된 약, 감수성 기반 선택은 24~48시간과 비용이 든다(Constable 상자 6-1).</span></span></p><p class="bx-num"><span class="bxn">56.</span><span>시간의존성과 농도의존성<table class="bxt"><tr><th>계열</th><th>작용</th><th>살균 양상</th><th>항생제후 효과</th><th>PK/PD 지표</th></tr><tr><td>아미노글리코사이드</td><td>살균</td><td>농도의존</td><td>있음</td><td>AUC24/MIC, Cmax/MIC</td></tr><tr><td>베타락탐</td><td>살균</td><td>시간의존</td><td>그람음성 없음, 그람양성 있음</td><td>T &gt; MIC</td></tr><tr><td>플루오로퀴놀론</td><td>살균</td><td>농도의존</td><td>있음</td><td>AUC24/MIC, Cmax/MIC</td></tr><tr><td>마크롤라이드</td><td>정균</td><td>시간의존</td><td>없음</td><td>T &gt; MIC</td></tr><tr><td>설폰아미드</td><td>정균</td><td>시간의존</td><td>없음</td><td>-</td></tr><tr><td>테트라사이클린</td><td>정균</td><td>시간의존</td><td>있음</td><td>AUC24/MIC</td></tr><tr><td>트리메토프림</td><td>정균(설파와 병용 시 예외)</td><td>시간의존</td><td>없음</td><td>-</td></tr></table><span class="hang">농도의존성: 최고 농도가 높을수록 살균 속도·정도가 커지고 내성 선택이 줄며, 긴 항생제후 효과로 긴 투약 간격이 가능하다. AUC/MIC나 Cmax/MIC 비 8~10 이상이 효능과 가장 잘 맞는다(Constable). 마크롤라이드는 균에 따라 어느 쪽도 될 수 있다.</span><span class="hang">시간의존성: MIC를 넘는 시간이 효능을 결정하고 그 이상 농도를 올려도 살균이 비례해 늘지 않는다. 투약 간격의 최소 50% 동안 평균 혈장 농도가 MIC를 넘어야 하며, 혈장 농도는 MIC의 2~4배가 좋다. 필요한 T &gt; MIC는 카바페넴 25%, 확장 범위 페니실린 50~70%, 아미노페니실린·페니실린 100%다.</span></span></p><p class="bx-num"><span class="bxn">57.</span><span>살균·정균과 병용<span class="hang">살균제: 베타락탐(페니실린·세팔로스포린·반합성 페니실린), 아미노글리코사이드, 글리코펩타이드, 리팜핀, 바시트라신, 폴리믹신, 플루오로퀴놀론. 정균제: 설폰아미드, 트리메토프림, 테트라사이클린, 마크롤라이드, 린코마이신, 클로람페니콜, 플로르페니콜(Constable 상자 6-2).</span><span class="hang">살균제는 백혈구감소가 흔한 급성 패혈증, 숙주 방어가 약한 경우(고사리 중독 등 과립구감소), 협막이 두꺼운 균에 낫다. 정균제는 면역 기능이 온전해야 효과가 있다.</span><span class="hang">살균제끼리는 무관 또는 상승, 정균제끼리는 무관, 살균제와 정균제는 길항할 수 있다는 전통 규칙은 너무 일반적이지만 병용은 피하는 것이 현명하다. 길항을 가장 흔히 일으키는 것은 테트라사이클린·클로람페니콜·마크롤라이드다. 클로람페니콜·마크롤라이드·린코사마이드는 50S 결합 부위가 겹쳐 함께 쓰지 않는다. 설폰아미드와 디아미노피리미딘 병용만 예외적 상승이다(Bovine Medicine).</span><span class="hang">고정 비율 합제(페니실린·스트렙토마이신 등)는 한 약 용량이 다른 약에 묶이고 배설 속도가 달라 권하지 않는다. 병용 시 각 약을 권장 용량으로 따로, 다른 부위에 준다. 결정 페니실린과 네오마이신처럼 눈에 보이는 물리적 배합금기도 있다.</span></span></p><p class="bx-num"><span class="bxn">58.</span><span>조직 분포와 장벽<span class="hang">대부분 항생제는 세포외액에 비교적 자유롭게 퍼지지만 설폰아미드·클로람페니콜계·테트라사이클린·플루오로퀴놀론·마크롤라이드는 총체수에 가깝게 분포하고 세포 안으로 들어간다. 베타락탐은 생리적 pH에서 이온화되어 분포용적이 작고 마크롤라이드는 세포에 농축되어 크다.</span><span class="hang">장벽: 뇌·뇌척수액, 장막강, 관절·활액, 눈, 태반·태아. 설폰아미드·테트라사이클린·클로람페니콜은 정상 상태에서도 어느 정도 통과하고 페니실린은 그렇지 못하다. 아미노글리코사이드는 활액·흉수·복수에는 들어가나 뇌·눈에는 못 들어간다. 염증이 있으면 장벽의 의미가 줄지만, 눈은 예외로 정맥 투여로 높은 혈중 농도가 필요하다.</span><span class="hang">거의 모든 항생제는 신장으로 배설된다. 아미노글리코사이드는 신장에 위반 잔류가 오래 남는다. 페니실린·테트라사이클린은 장간순환이 크다.</span><span class="hang">폐 침투(Bovine Medicine): 플로르페니콜, 세프티오푸르, 틸미코신, 툴라트로마이신, 플루오로퀴놀론은 폐에서 만하이미아·파스튜렐라·히스토필루스의 MIC에 도달한다. 페니실린, 암피실린, 아목시실린, 에리스로마이신, 타일로신은 폐 침투가 훨씬 떨어진다.</span></span></p><p class="bx-num"><span class="bxn">59.</span><span>약물 투여 경로<span class="hang">정맥: 즉시 높은 혈중·조직 농도. 패혈증 등 생명 위협 질환, 확산 경로가 긴 괴사 부위, 근육 손상을 피해야 할 출하 직전 육우에 쓴다. 볼루스가 아닌 천천히 주며 정맥용 제제만 쓴다. 현장에서는 첫 정맥 부하 용량 후 근육 유지 용량이 합리적이다. 경동맥 오주입, 운반체 급성 독성, 설폰아미드·테트라사이클린의 혈관주위 반응과 혈전에 주의한다.</span><span class="hang">근육: 대동물에서 가장 흔하나 육용 동물, 특히 자극성 제제는 가능하면 피한다. 지속성 테트라사이클린 근주 병변은 12개월 뒤 도축에서도 발견된다. 대부분 약은 30~120분에 최고 농도에 이른다.</span><span class="hang">피하: 근육 병변 우려로 사용이 늘었다. 지방층에 들어가지 않으면 근육 주사의 합리적 대안이다. 흡수가 느려 유휴약이 더 길어질 수 있다(Rebhun).</span><span class="hang">경구: 반추동물에는 거의 쓰지 않는다. 혈중 농도가 12~18시간 지나야 오르고 들쭉날쭉하며, 반추위에서 파괴·불활화되고 반추위 세균총을 교란해 정체·식욕부진·침울을 만든다. 썼다면 반추위액 이식(cud transfer)으로 세균총을 회복시킨다. 아미노글리코사이드·폴리믹신은 장에서 흡수되지 않고 벤질페니실린은 위에서 파괴된다. 반추 전 송아지는 우유에 섞으면 옥시테트라사이클린·트리메토프림 흡수가 떨어진다.</span><span class="hang">복강: 출하 직전 소에서 가끔 쓴다. 우겸부 마지막 늑골과 요각 중간, 요추 횡돌기에서 10 cm 이상 아래. 기관 내 투여는 이점이 없었다. 생식기는 비경구 투여가 생식기 전 부위에 농도를 내지만 자궁 내 주입은 내막·자궁 분비물에서만 비슷한 농도를 낸다.</span></span></p><p class="bx-num"><span class="bxn">60.</span><span>주사 부위 원칙 — 목 근육과 피하<span class="hang">육용 동물에 근주해야 한다면 목 근육에 준다. 흉터·흠이 발골 때 발견되어 다듬어 낼 수 있기 때문이다. 소·말 모두 목 주사가 둔부·어깨보다 약동학이 좋고 늘어진 목살(dewlap)이 생체이용률이 가장 나쁘다. 성축은 한 부위 10 mL 이하, 표시 최대량을 넘기지 않으며 주사 전 흡인해 혈관 내 주입을 피한다(Constable).</span><span class="hang">Rebhun(젖소)은 다르게 쓴다. 근주 주 부위를 대퇴 후부 근육(반막양근·반건양근)으로, 둔부는 근육이 적고 좌골신경 손상 위험이 있어 피하라고 하며(특히 송아지), 목·삼두근은 잘 보정된 소에서만 쓴다. 성우 한 부위 최대 20 mL, 어린 송아지 5 mL 이하. 송아지 목 근육은 비자극성 5 mL 미만에 쓴다. 성우 근주는 수성 약 18G 3.75 cm, 유성·점성 약(페니실린, 옥시테트라사이클린 염산염) 16G 3.75 cm, 2개월 미만 송아지 18~20G 2.5 cm.</span><span class="hang">피하 부위: 앞다리 뒤 흉부 중간 높이와 앞다리 앞 목 아래의 느슨한 피부. 견갑골을 찌르지 않게 주의한다. 성우 14G, 송아지 16G 3.75 cm. 500 mL 보로글루콘산칼슘은 3~4부위로 나눈다.</span><span class="hang">세프티오푸르 결정유리산(지속형)은 귀 뒷면의 머리 부착부나 귀 뒷면 가운데 1/3에 피하로 준다. 귀 동맥에 들어가면 치명적이며, 약 1000회 중 1회 급사가 보고되었다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">61.</span><span>주사 합병증<span class="hang">프로카인 반응: 프로카인 페니실린이 혈관에 들어가면 60초 안에 흥분·돌진·떨림·허탈. 흡인 확인 후에도 굵은 약을 가는 바늘로 밀다가 바늘 끝이 혈관에 들어가 생긴다. 충분히 굵은 바늘을 쓴다. 반응이 오면 소를 건드리지 말고 사람을 물린다. 대개 치명적이지 않고 페니실린 치료를 끊을 필요가 없어 알레르기(아나필락시스)와 구분한다.</span><span class="hang">클로스트리듐 근염: 자극성 약이 국소 괴사로 혐기 환경을 만들면 C. perfringens·C. septicum이 감염한다. 현재 가장 흔한 원인 약은 프로스타글란딘이다. 멸균 주사기·바늘, 다회용 바이알 오염 방지, 분변 묻은 피부에 주사 금지.</span><span class="hang">가장 자극적인 정맥 약은 40~50% 포도당, 20% 요오드화나트륨, 칼슘이다. 플루닉신도 미국에서 정맥 투여만 허가되어 혈관주위 누출을 피해야 한다. 페닐부타존 미정맥 혈관주위 주사로 꼬리 탈락이 생긴 예가 있다.</span><span class="hang">피하 합병증: 포도당·칼슘포도당 피하 주사는 화학적 염증·괴사·무균 농양, 불량한 소독은 봉와직염·농양을 만든다(아래로 처지는 통증성 부종, 파행, 발열).</span></span></p><p class="bx-num"><span class="bxn">62.</span><span>치료 기간과 반응 평가<span class="hang">확립된 요법이 없는 질환은 최소 3~5일, 또는 체온이 정상으로 돌아온 뒤 최소 1일 더(특히 정균제) 준다. 만성 화농성 질환은 2~4주 이상 걸린다(Constable 본문).</span><span class="hang">같은 책의 내성 예방 지침은 7~10일 또는 해열 후 4~5일, 숙주 방어 약화 시 10~14일, 만성 감염 4~6주로 쓴다.</span><span class="hang">반응 평가: 뚜렷한 악화나 추가 발열이 없으면 3일을 기다린다(Constable 본문). 같은 장 지침은 4일 내 호전으로 판단한다. Bovine Medicine은 2~5일 지속 발열과 전신 악화면 다른, 아마도 더 넓은 범위 약으로 바꿀지 고려하라고 한다. 원인 미상이면 전혀 다른 계열로 바꾸되 바이러스성·비감염성 원인을 먼저 다시 생각한다.</span><span class="hang">반응 불량 원인: 감수성 없는 균, 약이 닿기 어려운 부위, 대사 정지 상태의 균(심내막염, 괴사·섬유화 조직), 배액이 필요한 화농. 쇼크·독혈증·탈수에 대한 보조요법이 결과를 크게 좌우한다(4 L 수분 결손 설사 송아지에 항생제 3 mL는 별 의미가 없다).</span><span class="hang">표시 용량은 법적 용량이고 휴약이 그에 맞춰 정해진다. 오래된 대동물 항생제 다수는 표시 용량이 너무 낮고 간격이 너무 길다. 저독성 약(벤질페니실린)은 여러 배 늘릴 수 있으나 독성 있는 약은 늘리지 말고 다른 약을 찾는다. 표시 외 용량을 쓰면 휴약을 늘려야 한다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">63.</span><span>소 항생제 용량 — 베타락탐<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th class="c">간격</th><th>경로·출처</th></tr><tr><td>페니실린G 프로카인</td><td class="c">10,000~60,000 IU/kg</td><td class="c">12~24시간</td><td>IM, SC (Constable 부록)</td></tr><tr><td>페니실린G 프로카인</td><td class="c">22,000 U/kg</td><td class="c">12~24시간</td><td>IM (Rebhun 여러 질환). 심내막염 22,000~33,000 U/kg 1일 2회 표시 외</td></tr><tr><td>페니실린G 벤자틴</td><td class="c">44,000~66,000 IU/kg</td><td class="c">48~72시간</td><td>IM, SC (Constable 부록)</td></tr><tr><td>페니실린G 나트륨·칼륨</td><td class="c">44,000 U/kg</td><td class="c">6시간</td><td>IV (Rebhun). 칼륨 페니실린은 칼륨 때문에 천천히 정주</td></tr><tr><td>암피실린 나트륨</td><td class="c">22 mg/kg</td><td class="c">12시간</td><td>SC, IV (Constable 부록)</td></tr><tr><td>암피실린 삼수화물</td><td class="c">4~22 mg/kg</td><td class="c">12~24시간</td><td>IM, SC (Constable 부록)</td></tr><tr><td>암피실린(송아지 패혈증)</td><td class="c">20 mg/kg</td><td class="c">8~12시간</td><td>IV, IM (Constable)</td></tr><tr><td>암피실린</td><td class="c">10~20 mg/kg</td><td class="c">1일 2회</td><td>Rebhun 심내막염, 표시 외</td></tr><tr><td>아목시실린 삼수화물</td><td class="c">20 mg/kg</td><td class="c">12시간</td><td>IM, 송아지 (Constable)</td></tr><tr><td>세프티오푸르 나트륨</td><td class="c">1.1~2.2 mg/kg</td><td class="c">24시간</td><td>IM, IV (부록). BRD 1.2~2.2 mg/kg SC·IM 3일</td></tr><tr><td>세프티오푸르 염산염</td><td class="c">1.1~2.2 mg/kg</td><td class="c">24시간</td><td>SC 3일 (BRD). 부록은 IM, SC 3~5일. 유방 내 125 mg/분방 24시간, 건유 500 mg 1회</td></tr><tr><td>세프티오푸르 결정유리산</td><td class="c">6.6 mg/kg</td><td class="c">1회</td><td>귀 뒷면 SC</td></tr><tr><td>세프티오푸르(송아지 패혈증)</td><td class="c">2~4 mg/kg</td><td class="c">24시간</td><td>SC (Constable)</td></tr><tr><td>세프퀴놈</td><td class="c">1 mg/kg</td><td class="c">24시간</td><td>IM 3~5일 (Constable)</td></tr></table><span class="hang">세팔로스포린은 사람과 동물에서 매우 중요한 항생제로 분류되어 1차 선택은 권하지 않는다(Constable 호흡기 장, Bovine Medicine).</span><span class="hang">독성: 페니실린 대사물이 합텐으로 작용해 과민반응(피부 발진, 용혈성 빈혈, 아나필락시스)을 일으키며 잔류가 공중보건 위험이 된다. 세팔로스포린은 페니실린 과민 동물에 교차반응이 있고 잠재 신독성이 있어 아미노글리코사이드와 함께 쓸 때 주의한다. 페니실린은 활발히 분열하는 균에 가장 효과적이므로 정균제와 함께 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">64.</span><span>소 항생제 용량 — 테트라사이클린·페니콜<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th class="c">간격</th><th>경로·출처</th></tr><tr><td>옥시테트라사이클린</td><td class="c">5~20 mg/kg</td><td class="c">12~24시간</td><td>IV, IM (Constable 부록)</td></tr><tr><td>옥시테트라사이클린</td><td class="c">10 mg/kg</td><td class="c">24시간</td><td>IM 4일 (BRD 치료)</td></tr><tr><td>옥시테트라사이클린 지속형(LA)</td><td class="c">20 mg/kg</td><td class="c">1회</td><td>IM (BRD 메타필락시스)</td></tr><tr><td>플로르페니콜</td><td class="c">20 mg/kg</td><td class="c">48시간</td><td>IM, 1회 반복</td></tr><tr><td>플로르페니콜</td><td class="c">40 mg/kg</td><td class="c">1회</td><td>SC (부록은 IM으로 표기)</td></tr></table><span class="hang">테트라사이클린 독성: 고용량이나 신기능 저하 시 신독성. 유효기간 지난 테트라사이클린·옥시테트라사이클린은 분해되어 판코니 증후군을 만든다. 옥시테트라사이클린 외에는 근육·피하 자극이 커 무균 농양을 만든다.</span><span class="hang">빠른 정주는 방실차단·서맥·저혈압으로 허탈을 일으키므로 수 분에 걸쳐 천천히, 또는 다가 양이온이 없는 생리식염수에 희석해 준다. 희석하지 않은 프로필렌글리콜 기반 제제를 빠르게 정주하면 혈관내 용혈·혈색소뇨가 온다. 급성 독혈증·심한 호흡곤란 개체는 정주로 쓰러질 수 있어 복강 투여도 쓴다.</span><span class="hang">태반을 쉽게 통과해 태아 골 발달을 해치므로 임신 후반기에 쓰지 않는다. 임신 말기 2~3주와 생후 첫 달에는 치아 변색이 생긴다. 고농도에서는 단백 합성을 줄인다.</span><span class="hang">플로르페니콜 독성: 소에서 설사, 사료 섭취·반추위 활동 감소, 근육·피하 국소 반응. 과량·장기 투여 시 치명적 골수 억제가 보고되었다. 클로람페니콜은 사람 재생불량성 빈혈 때문에 식용동물에 금지된다.</span></span></p><p class="bx-num"><span class="bxn">65.</span><span>소 항생제 용량 — 마크롤라이드<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th class="c">간격</th><th>경로·출처</th></tr><tr><td>툴라트로마이신</td><td class="c">2.5 mg/kg</td><td class="c">1회</td><td>SC</td></tr><tr><td>틸미코신</td><td class="c">10 mg/kg</td><td class="c">1회 (부록은 72시간)</td><td>SC</td></tr><tr><td>가미트로마이신</td><td class="c">6 mg/kg</td><td class="c">1회</td><td>SC</td></tr><tr><td>틸디피로신</td><td class="c">4 mg/kg</td><td class="c">1회</td><td>SC (부록)</td></tr><tr><td>타일로신</td><td class="c">18 mg/kg</td><td class="c">24시간</td><td>IM (부록)</td></tr></table><span class="hang">마크롤라이드는 대개 정균이며 고농도에서 살균, 호기성 그람양성균·그람양성 혐기균·마이코플라스마에 효과적이다. 틸미코신·툴라트로마이신은 염증 부위 호중구·대식세포에 모인다.</span><span class="hang">주의: 근주 통증·자극은 제형에 따라 다르다. 틸미코신은 소 외 동물에서 심독성이 있고 사람의 우발적 노출로 사망 예가 있다(자가 주사 주의). 타일로신 정주는 소에서 쇼크·호흡곤란·침울을 일으킨다. 타일로신·스피라마이신은 수의사에게 접촉피부염을 만든다. 소에서도 설사가 보고되었다.</span><span class="hang">린코사마이드는 반추동물에서 위막성 결장염이 보고되었고 경구 투여는 금기다. 사료 7.5 ppm 린코마이신 섭취로 식욕부진·설사·케토시스·유량 감소가 왔다. 린코마이신-스펙티노마이신 경구 제제를 소에 주사하면 심한 폐수종으로 대량 폐사한다.</span></span></p><p class="bx-num"><span class="bxn">66.</span><span>소 항생제 용량 — 플루오로퀴놀론(사용 제한)<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th class="c">간격</th><th>경로·출처</th></tr><tr><td>엔로플록사신</td><td class="c">2.5~5.0 mg/kg</td><td class="c">24시간</td><td>SC 3일 (BRD), 부록은 3~5일</td></tr><tr><td>엔로플록사신</td><td class="c">7.5~12.5 mg/kg</td><td class="c">1회</td><td>SC</td></tr><tr><td>다노플록사신</td><td class="c">6 mg/kg</td><td class="c">48시간</td><td>SC, 1회만 반복</td></tr><tr><td>다노플록사신</td><td class="c">8 mg/kg</td><td class="c">1회</td><td>SC</td></tr><tr><td>마르보플록사신</td><td class="c">2 mg/kg</td><td class="c">24시간</td><td>IM, IV, SC (부록)</td></tr></table><span class="hang">사용 제한: 사람과 동물에서 매우 중요한 항생제로 1차 사용을 말린다. 미국은 식용동물에 플루오로퀴놀론의 표시 외 사용을 금지하고, 일부 국가는 치료 사용 자체를 제한하려 한다. Bovine Medicine은 세팔로스포린과 함께 급성 중증 개별 증례에만 매우 선택적으로 쓰라고 한다.</span><span class="hang">살균·농도의존성, 그람음성균에 좋고 혐기균에는 약해 혐기 감염에 쓰지 않는다. 마이코플라스마·클라미디아에도 효과가 있다. 어린 개·망아지 관절병증(다른 가축은 더 저항성), 고용량 위장 장애, 중추신경 독성(사람·말). 임신 동물은 다른 약이 없을 때만 쓴다.</span></span></p><p class="bx-num"><span class="bxn">67.</span><span>소 항생제 용량 — 설파·트리메토프림<table class="bxt"><tr><th>약물</th><th class="c">용량</th><th class="c">간격</th><th>경로·출처</th></tr><tr><td>설폰아미드/트리메토프림</td><td class="c">15~30 mg/kg</td><td class="c">12~24시간</td><td>IM, IV (부록). 반추 전 송아지 15~30 mg/kg PO</td></tr><tr><td>설파독신/트리메토프림</td><td class="c">15 mg/kg</td><td class="c">12~24시간</td><td>IM, SC, IV (부록)</td></tr><tr><td>트리메토프림 2.66 + 설파독신 13.33 mg/kg</td><td class="c">-</td><td class="c">24시간</td><td>IM 3일 (BRD)</td></tr><tr><td>트리메토프림-설파 합제</td><td class="c">22 mg/kg</td><td class="c">12시간</td><td>SC, IM, IV, PO (Rebhun 송아지 설사, 미국 표시 외)</td></tr><tr><td>설파디메톡신</td><td class="c">55~110 mg/kg</td><td class="c">24시간</td><td>PO (부록)</td></tr><tr><td>설파디메톡신</td><td class="c">55 mg/kg 후 28 mg/kg</td><td class="c">24시간</td><td>IV (부록)</td></tr></table><span class="hang">설폰아미드는 경구 생체이용률과 분포(중추신경·관절 포함)가 좋고 우유 농도는 낮다. 괴사조직과 고름에서 효능이 떨어진다(고름의 대사 전구체가 억제를 우회). 반추동물에서 경구 투여하는 몇 안 되는 예외로 비경구 치료 후 유지 투여에 쓴다.</span><span class="hang">주의: 과량이나 탈수 시 결정뇨(초식동물은 알칼리뇨라 덜하다). 간·신 질환, 혈액질환, 설파 과민 이력이면 피한다. 주사용 강화 설파제는 현탁액이라 빠른 정주로 저혈압·허탈이 온다. 미국에서는 비유 젖소에 승인된 일부(설파디메톡신 등) 외 설폰아미드가 금지되고, 20개월 이상 젖소에 설파메타진이 금지된다. 소 대사·배설 반감기가 용량에 의존해 휴약 설정이 까다롭다.</span></span></p><p class="bx-num"><span class="bxn">68.</span><span>아미노글리코사이드(겐타마이신) — 신독성과 장기 잔류<span class="hang">Constable 부록은 반추동물에 겐타마이신을 권하지 않음(NR)으로 표시한다. 미국소임상수의사회(AABP)는 소에 아미노글리코사이드 사용 자발적 중단을 결의했다.</span><span class="hang">Rebhun은 AEEC·STEC 설사 송아지에 겐타마이신 6.6 mg/kg IM·IV 24시간 간격(아미카신 15 mg/kg SC·IV 24시간)을 쓴다고 하면서 미국 표시 외 사용이며, 적절한 검사 뒤에 긴 고기 휴약을 이해하고서만 쓰라고 한다.</span><span class="hang">신독성은 10일 넘는 장기 투여에서 흔하며 근위세관 손상, 단백뇨, GFR 감소, 고질소혈증을 만든다. 위험 인자: 고용량, 장기 투여, 기존 신기능 장애나 탈수, 신독성 약·이뇨제 병용(푸로세미드 등), 높은 최저 농도 지속, 매우 어리거나 늙은 개체. 대사성 산증과 저나트륨·저칼륨혈증이 신독성을 키우고, 고단백 사료는 보호한다. 신독성은 대체로 가역적이다.</span><span class="hang">반복 투여 후 조직에 침착되었다가 천천히 빠져 휴약 위반 농도가 오래 남고 특히 신장 잔류가 길다. 겐타마이신은 유방에서 흡수되지 않는다고 여겨지지만 염증 유방에서는 유방 내 투여량의 87% 이상이 흡수된다. 태반을 통과하고, 빠른 정주는 서맥·저혈압, 드물게 신경근 차단(칼슘 정주로 치료)을 만든다. 산소 의존 수송이라 혐기균에는 효과가 없다.</span><span class="hang">스펙티노마이신은 독성이 훨씬 적어 400 mg/kg IV까지 견디며 이독성·신독성이 없다.</span></span></p><p class="bx-num"><span class="bxn">69.</span><span>휴약기간 — 원문이 말하는 원칙<span class="hang">휴약(withdrawal)은 출하 전 약 없이 두어야 하는 기간, 우유 휴약(withholding)은 우유를 사람 소비로 보낼 수 없는 기간이다. 조직 허용 기준은 규제 당국이 정하며 안전 여유가 크다.</span><span class="hang">위반 농도는 나라마다 다르고 검출법 감도에 따라 정해지며 기술이 좋아질수록 낮아지므로 Constable은 구체 수치를 싣지 않고 지역 규정을 보라고 한다. 휴약은 약, 투여량, 나이, 질병 상태에 따라 달라지며 건강우 자료로 정해져 질병 개체에서는 반감기가 크게 바뀔 수 있다.</span><span class="hang">표시 용량에는 휴약이 함께 정해져 있다. 표시 외 사용 시 휴약 설정은 전적으로 수의사 책임이며 표시 용량 휴약에서 외삽할 수 없다. 미국은 FARAD(www.farad.org)가 표시 외 사용 휴약을 권고한다. 수의사는 축주에게 휴약을 반드시 알려야 하며 알리지 않으면 법적 책임을 진다.</span><span class="hang">영국 처방 단계(cascade)에서 해당 종의 휴약이 없으면 우유 최소 7일, 고기 최소 28일을 적용한다. 표시 외 사용에는 대개 더 긴 표준 휴약이 붙는다(Bovine Medicine).</span><span class="hang">피하 투여는 흡수가 느려 근주보다 우유 휴약이 더 길 수 있다(Rebhun). 테트라사이클린·아미노글리코사이드는 반복 투여 후 긴 씻김 기간이 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">70.</span><span>항생제 사용 제한<span class="hang">미국에서 식용동물 사용 금지: 클로람페니콜, 디메트리다졸, 이프로니다졸 등 니트로이미다졸, 푸라졸리돈·니트로푸라존 등 니트로푸란, 비유 젖소의 설폰아미드(승인된 설파디메톡신·설파브로모메타진·설파메톡시피리다진 제외), 플루오로퀴놀론(표시 외), 글리코펩타이드(반코마이신).</span><span class="hang">메트로니다졸은 변이원성·발암성으로 많은 나라에서 식용동물에 금지된다. 니트로푸란도 발암성으로 많은 나라에서 금지된다. 페닐부타존은 미국에서 20개월 이상 암컷 젖소에 금지되며 식용동물에 쓰지 말아야 한다.</span><span class="hang">EU는 1997년 아보파신, 1999년 바시트라신·스피라마이신·타일로신·버지니아마이신의 성장촉진 사용을 금지했다. 금지 후 동물 반코마이신 내성 장구균이 줄었다.</span><span class="hang">미국 표시 외 사용 요건: 수의사 감독, FDA 승인 약, 유효한 수의사-축주-환축 관계, 치료 목적만(생산 목적 불가), 사료 내 표시 외 사용 금지, 위반 잔류를 남기지 않을 것.</span><span class="hang">Bovine Medicine의 책임 있는 사용 원칙: 예방 우선, 사람 의료에 중요한 약을 1차로 쓰지 않음, 좁은 범위 우선, 치료 두수 최소화, 권장 기간 준수, 기록, 표시 준수, 성장촉진 목적의 아치료 용량 사용 금지.</span></span></p><p class="bx-num"><span class="bxn">71.</span><span>내성<span class="hang">유형: 자연(내재) 내성, 돌연변이 내성, 염색체외(획득) 내성. 기전: 표적 변화(PBP 변화, DNA 자이레이스), 약 파괴(베타락타메이스), 유효 농도 도달 방해(포린 변화, 유출 펌프). 임상적으로는 플라스미드·트랜스포존 매개 다제내성이 중요하며 장내세균, 황색포도상구균, 일부 파스튜렐라에서 특히 그렇다.</span><span class="hang">치료 용량 항생제는 상재균을 바꾸어 내성균을 선택한다. 성장촉진 사료 항생제와 항생제 처리 우유 급여는 장내 내성균을 선택한다. 내성 대장균은 어린 동물과 집약 사육(송아지 육용) 개체에 더 많고 나이가 들면 줄어든다. 송아지 대용유의 테트라사이클린·네오마이신은 건강 이익을 입증한 연구가 없다.</span><span class="hang">개체 치료 중 내성이 생기는 것은 대동물에서 인정된 문제가 아니다. 성장촉진제를 쓰는 농장에서는 같은 약이나 같은 계열을 시험 없이 치료에 쓰지 않는 것이 현명하다.</span><span class="hang">내성 억제(3D): 축소(대체 치료가 있으면 항생제를 쓰지 않음, 최단 기간, 정기적 교대), 설계(효과적 용량, 범위를 좁힌 적합한 약), 오염 제거(장갑, 손 씻기, 붕대, 수술 무균). 일찍 시작하고 충분한 용량을 쓰며 장기 사용을 피한다.</span></span></p><p class="bx-num"><span class="bxn">72.</span><span>잔류 — 원인과 예방<span class="hang">우유 잔류 원인: 휴약 미준수와 처리우 우유의 실수 혼입이 가장 흔하다. 처리우 식별 부족(색 다리밴드 권장), 첫 착유의 고농도 약으로 오염된 착유기·기록병, 건유 처치 후 조기 분만·짧은 건유, 분만 전 미경산우 건유제 주입(26일까지 잔류), 건유우 실수 착유, 처리 분방만 폐기, 비유 중 건유제 오용, 처리우 구입.</span><span class="hang">처리우는 대형 목장에서 마지막에 착유하거나 별도 장비로 착유하고 병우군으로 분리한다. 치료와 휴약 종료일 기록이 중요한 예방책이다.</span><span class="hang">육류 잔류는 주로 도태 젖소와 어린 송아지(bob veal)에서 생긴다. 원인은 휴약 미준수 61%, 미승인 약 10%, 처리우 우유·초유 급여 9%, 표시 용량 초과 6%이며, 관련 약은 네오마이신·스트렙토마이신·페니실린·옥시테트라사이클린·겐타마이신·설파메타진, 경로는 근주 60%, 경구 28%, 유방 내 9%다.</span><span class="hang">자궁 내 주입도 자궁내막과 난관을 거친 복강 흡수로 혈중·조직·우유 잔류를 만든다. 한 분방 주입 후 다른 분방 우유에도 낮은 농도가 나온다. 잔류 검사(Delvotest, Charm 등 세균 증식 억제 검사)는 페니실린계에 민감하나 다른 계열에는 덜하고, 염증 유방 우유의 억제물질로 위양성이 날 수 있다.</span></span></p><p class="bx-num"><span class="bxn">73.</span><span>경구 항생제·사료 오염과 반추동물<span class="hang">사료공장에서 약제 사료와 무약 사료를 연이어 만들면 오염이 생긴다(클로르테트라사이클린, 설폰아미드, 페니실린, 이오노포어가 흔함). 오염 사료를 먹은 젖소는 24시간 안에 식욕부진, 반추위 정체, 소화 안 된 섬유가 섞인 커스터드 같은 분변, 유량 급감을 보이고 침울·근섬유속연축·케토시스·저칼슘혈증·기립불능도 생긴다. 무약 사료로 바꾸면 회복하나 그 비유기 유량이 계속 떨어질 수 있다.</span><span class="hang">건강한 신생 송아지에 경구 항생제를 주면 융모 위축과 흡수불량성 설사가 올 수 있다(네오마이신 &gt; 테트라사이클린·암피실린). 장염의 특정 치료는 무방하나 예방적 경구 투여는 위험하다. 서로 다른 약을 2주 이상 경구로 계속 주면 효모·포도상구균·녹농균 중복감염이 생긴다.</span><span class="hang">이오노포어(모넨신 등)는 반추위 발효를 바꾸는 사료첨가제로 치료용 항생제가 아니다. 권장량에서는 안전하나 혼합 오류·과량 시 소는 주로 심근이 손상된다. 말이 가장 민감하다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">74.</span><span>소염제 — 비스테로이드소염제(NSAID) 공통 원칙<span class="hang">NSAID는 COX를 억제해 프로스타글란딘 합성을 막아 소염·진통·해열 작용을 하며 경도~중등도 통증에 24~72시간 작용한다. 신세관 괴사·유두 괴사 위험을 줄이려면 정상 수화 상태에서 준다(Constable).</span><span class="hang">분만 때 일상적 NSAID 투여는 대부분의 연구에서 태반정체 증가와 연관되어 권하지 않는다(PGF2α가 태반 박리에 중요). 난산우에서 이익은 아직 모른다.</span><span class="hang">Rebhun은 발열이 패혈증·독혈증에 대한 보호 반응이므로 해열제로 반사적으로 가리지 말고 원발 질환을 치료하며, 발열을 치료 반응 평가에 쓰라고 한다(소는 말처럼 발열 후 제엽염 경향이 없다).</span><span class="hang">표시 일정보다 오래 쓰면 표시 외 사용이 되어 표준 휴약이 적용된다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">75.</span><span>플루닉신 메글루민<span class="hang">내독소혈증 치료에 가장 흔히 쓰는 NSAID이며 급성 연부조직·내장 통증의 선택 약이다. 반추동물 부하 용량 1.1~2.2 mg/kg IV, 유지 1.1 mg/kg 24시간 간격(일부 연구는 8~12시간). 미국 소 허가는 정맥만, 1.1~2.2 mg/kg 24시간 간격이다. BRD 소염 요법으로 2.2 mg/kg IV 1회. 부록은 1.1~2.2 mg/kg 12~24시간 IV.</span><span class="hang">근주 후 드물게 근괴사가 있어 정맥이 선호되며 혈관주위 누출을 피한다. 소에서 2.2 mg/kg 경구 사전 투여는 정맥과 같은 효과를 냈고 생체이용률은 53~60%다.</span><span class="hang">0.25 mg/kg 항내독소 용량 개념은 오도적이라 권하지 않는다. 플루닉신과 페닐부타존은 젖소에서 내독소 혈장 제거를 2~3배, 6~12배 늦췄다. 장 치유 지연, 위장관·신장 손상, 장 투과성 증가와 연관된다. 반복 투여 시 수화 상태를 지킨다.</span></span></p><p class="bx-num"><span class="bxn">76.</span><span>멜록시캄·케토프로펜·기타 NSAID<span class="hang">멜록시캄: 플루닉신보다 오래가고 근주·피하가 가능하며 COX-2에 선택적이라 제4위 궤양·신세관 손상 부작용이 이론상 적다. 0.5 mg/kg SC·IV 1회, 경구 0.5~1 mg/kg 1~2일 간격(제각·거세 진통에 효과). 미국 처방 지침상 경구 멜록시캄은 3일 넘는 지속 진통이 필요할 때만 쓴다.</span><span class="hang">케토프로펜: 유럽에서 소 유방염·파행·외상 통증에 3.3 mg/kg IV·IM 24시간 간격 3일로 허가되었다. BRD에 3 mg/kg IM 24시간 2~3일, 부록은 2~4 mg/kg 24시간 IM·IV. 제각·거세 후 수 시간 진통 효과.</span><span class="hang">카프로펜 1.4 mg/kg IV·SC 1회(가장 안전한 NSAID), 톨페남산 2 mg/kg IM·IV 24~48시간 또는 4 mg/kg 1회(BRD).</span><span class="hang">페닐부타존: 소 경구 10~20 mg/kg 후 매일 4~6 mg/kg 또는 격일 10~14 mg/kg. 근골격 통증에 가장 효과적이라는 인상이 있으나 사람에 혈액질환·발암성이 있어 식용동물에 쓰지 말아야 한다. 신생자는 제거가 느리다.</span><span class="hang">디클로페낙은 남아시아에서 소 사체를 먹은 독수리의 신부전 대량 폐사로 2006년 금지되었다.</span></span></p><p class="bx-num"><span class="bxn">77.</span><span>아스피린<span class="hang">소에 가장 흔히 쓰는 진통제지만 효과가 크지 않고 근거가 적다. 100 mg/kg 경구 12시간 간격(Constable 본문). 부록은 50~100 mg/kg 12시간 경구.</span><span class="hang">소장 흡수가 제한적일 수 있어 정맥(35 mg/kg 6시간 간격)도 가능하나 플루닉신·페닐부타존이 보급된 뒤로는 쓰지 않는다.</span></span></p><p class="bx-num"><span class="bxn">78.</span><span>덱사메타손과 코르티코스테로이드 — 임신우 유산 주의<span class="hang">용량(Constable 부록, 소): 소염 0.02~2 mg/kg 24시간 IV·IM, 분만 유도 20~30 mg 총량 1회 IM, 케토시스 5~20 mg 총량 1회~24시간 IM. BRD 보조 0.01~0.03 mg/kg IM·IV.</span><span class="hang">Rebhun: 폐렴 초기에 저용량(10~20 mg/450 kg) 1회만 쓰고 반복하지 않는다. 강력한 해열 작용으로 부적절한 항생제를 쓰고도 열이 내려 안심하게 만들 수 있다. 상부기도 급성 폐색에 덱사메타손 40 mg. 케토시스 1회 용량 0.02 mg/kg은 의미 있는 면역 저하가 없다.</span><span class="hang">덱사메타손은 유산을 일으키므로 임신우에 쓰지 않는다. 임신우에는 유산 작용이 덜한 이소플루프레돈 아세테이트를 표시 용량으로 대신 쓴다(Rebhun). 이소플루프레돈 부록 용량 10~20 mg 총량 1회 IM. 다만 반복·표시 외 용량은 저칼륨혈증·기립불능을 만든다. 건유 중인 임신우에도 코르티코스테로이드를 쓰지 않는다.</span><span class="hang">내독소 쇼크에서 코르티코스테로이드 효과는 실험적 사전 투여에서만 뚜렷했고 자연 발생 증례의 대조 임상 근거는 없다. 덱사메타손 투여 후 송아지 호중구가 20,000/µL 이상 오를 수 있다.</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">79.</span><span>진통·진정 — 약물 분류와 다중모드 진통<span class="hang">비경구 진통제 일곱 종류: 국소마취제(리도카인·메피바카인·부피바카인), NSAID, 알파2 작용제(자일라진·데토미딘), 오피오이드, NMDA 길항제(케타민), 바닐로이드(캡사이신), GABA 유사체(가바펜틴). 국소마취제·알파2·오피오이드는 수 시간 단기, NSAID는 수일~수개월 장기 진통에 쓴다(Constable).</span><span class="hang">작용 경로가 다른 두 가지 이상을 함께 쓰는 다중모드 진통이 가장 효과적이다(예: 제왕절개에 전신 NSAID + 국소 절개선 차단). 선택적 처치는 통증 전에 선제 투여한다. 효과 발현 지연: NSAID 수술 전 10~30분, 절개선 차단 5~15분, 주추곁 마취 5~10분, 정맥 국소마취 10~15분, 각신경 차단 3~10분(Bovine Medicine).</span><span class="hang">오피오이드는 반추동물에서 μ·κ 수용체 분포가 달라 진통이 짧거나 없고 고용량이 필요하며 행동 부작용이 있다. EU에서는 소에 허가된 오피오이드가 없다. Rebhun은 경막외 카테터로 무보존제 모르핀 0.3 mg/kg을 1일 1~2회 주어 심한 후지·골반 통증을 치료했다.</span></span></p><p class="bx-num"><span class="bxn">80.</span><span>자일라진<span class="hang">반추동물에서 가장 흔히 쓰는 알파2 작용제다. 진정과 함께 위장관 운동·호흡 억제, 요량 증가가 따르고 작용이 짧아 단기 진통용으로 한계가 있다.</span><span class="hang">용량(Constable 부록, 반추동물): 0.01~0.05 mg/kg IV, 0.02~0.10 mg/kg IM. 길항제 요힘빈 0.125 mg/kg IV.</span><span class="hang">Rebhun 실례: 안과 검사 진정 0.01~0.03 mg/kg IV, 송아지 국소마취 병용 보정 0.22 mg/kg 이하 IV, 각신경 차단 전 0.1 mg/kg, 공혈우 진정 15~25 mg 총량 IV.</span><span class="hang">자일라진과 케타민은 영국에서 소 전신마취에 허가된 유일한 약이며 기관 삽관을 권한다(Bovine Medicine).</span></span></p><p class="bx-num"><span class="bxn">81.</span><span>리도카인과 국소마취<span class="hang">전압 의존 Na 통로를 막아 통각 섬유를 다른 감각·운동 섬유보다 먼저 차단한다. 싸고 예측 가능하지만 작용이 짧다. 산성 제제라 주사 시 따가우며, 2% 리도카인 10 mL에 8.4% 중탄산나트륨 1 mL를 섞으면 통증이 준다(즉시 사용, 보관하면 리도카인이 석출).</span><span class="hang">EU는 리도카인 대사물 2,6-자일리딘의 변이원성 때문에 식용동물 사용을 우려하며, 같은 대사물을 만들지 않는 프로카인을 대안으로 본다.</span><span class="hang">정맥 국소마취: 비절·완관절 위에 지혈대를 감고 원위 표재정맥에 아드레날린 없는 리도카인·프로카인 20~30 mL를 준다. 10~12분이면 원위 사지가 완전 마취되고 지혈대가 있는 동안 최소 1시간 지속된다.</span><span class="hang">신생 송아지는 리도카인 간 대사가 늦어 장폐색용 말 표준 용량 정속주입으로 경련 독성이 생겼고 디아제팜과 중단으로 수 시간 내 회복했다(Rebhun).</span></span></p><p class="bx-num"><span class="bxn">82.</span><span>경막외 마취(짧게)<span class="hang">적응: 난산·자궁·질 탈출 정복 시 노책 억제, 결장염·직장·질 자극에 의한 이급후중 완화, 회음부 수술. 생식기·직장·회음부가 마취된다.</span><span class="hang">부위: 제1~2미추 사이(꼬리를 위아래로 움직여 천골 뒤 첫 가동 관절을 찾음, Rebhun) 또는 천미추 사이나 제1미추간(Bovine Medicine). 소독 후 18G 3.75 cm 바늘(800 kg 초과·성우 수소는 더 긴 바늘)을 정중선에서 수직으로 넣어 저항이 갑자기 사라지거나 공기가 빨려드는 소리가 나면 경막외강이다. 바늘 허브에 떨어뜨린 약 방울이 빨려 들어가면 위치가 맞다. 공기가 오래 들어가면 공기색전이 생길 수 있어 바로 주입한다.</span><span class="hang">용량: 성우 2% 리도카인 3~6 mL면 대개 충분하며 상행 마취로 후지 기능이 떨어지지 않게 가능한 적게 준다. 사나운 소는 2% 리도카인 4 mL + 자일라진(20 mg/mL) 1 mL. Bovine Medicine은 자일라진 0.05 mg/kg(500 kg당 2% 용액 1.25 mL)을 국소마취제로 5 mL로 맞춰 쓰며 12~24시간 지속된다고 한다(표시 외). 아드레날린이 든 약은 척수 괴사와 후지 신경결손을 일으킬 수 있어 쓰지 않는다.</span><span class="hang">주입 후 바늘을 바로 뺀다(남겨 두면 척수신경 열상). 소는 서 있거나 흉와위로 앞쪽이 뒤보다 낮지 않게 한다. 후지 마비가 오면 바닥이 미끄럽지 않은 곳에 느슨하게 족쇄를 채운다. 반복이 예상되면 경막외 카테터를 쓰고, 작용이 긴 마취제는 마지막 선택으로만 쓴다. 꼬리 기부 외상의 통증과 이급후중에 자일라진·리도카인 경막외가 효과적이었다(Constable).</span></span></p></div>
<div class="bx"><p class="bx-num"><span class="bxn">83.</span><span>메타필락시스 — 원칙(짧게, 상세는 호흡기 탭)<span class="hang">메타필락시스는 고스트레스 신규 입식우·이유우 무리 전체를 명백한 발병 전에 입식 시 항생제로 처치하는 것이다. 입식우는 BRD 위험군인 동시에 이미 여러 단계의 병을 앓고 있을 수 있어 예방이자 치료로 볼 수 있다. 대개 입식 며칠 안에 한다.</span><span class="hang">결정 요인: 입식 시 외관, 현재·예상 이환·폐사 양상, 사료 섭취, 체온 상승, BRD 관리용 허가 제품의 효능. 치료에 쓰는 항생제가 모두 BRD 감소 효과가 있지는 않으므로 승인된 약만 쓴다.</span><span class="hang">미국 메타필락시스 허가 약: 세프티오푸르(결정유리산), 클로르테트라사이클린, 클로르테트라사이클린/설파메타진, 플로르페니콜, 옥시테트라사이클린, 틸미코신, 툴라트로마이신. Constable 호흡기 장 용량: 툴라트로마이신 2.5 mg/kg SC, 플로르페니콜 40 mg/kg SC, 틸미코신 10 mg/kg SC, 가미트로마이신 6 mg/kg SC, 옥시테트라사이클린 LA 20 mg/kg IM(이상 1회). 엔로플록사신·다노플록사신·세프티오푸르·세프퀴놈은 매우 중요한 항생제로 1차 사용을 말린다.</span><span class="hang">이송 전 사전 적응(preconditioning)이 BRD 발생을 줄이는 핵심 전략이다: 이유 후 일정 기간(대개 30~45일), 세균·바이러스 백신, 구충, 거세·제각, 사료조·급수조 적응. 건강 개체에 대한 전략적 투약은 위험 평가와 다른 위험 감소책 검토로 정당화해야 한다(Bovine Medicine).</span></span></p></div>
</div>
`;

function renderVet(){

function namuify(root, doc){
  root = root || document.getElementById('main');
  if(!root) return;
  doc = doc || {};
  root.classList.add('namu-doc');

  if(sub) sub.remove();
  const intro = root.querySelector('.rb-intro');

  if(intro){ introHtml = intro.outerHTML; intro.remove(); }
  const stripIcon = s => s.replace(/^[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F\s]+/u,'').replace(/^\s*\d+\.\s*/,'').trim();
  const chev = '<span class="namu-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';
  const chapters = [...root.querySelectorAll('.grass-section-title')];

    ci++; let si=0;
    const gm = ch.querySelector('.gst-main');

    ch.replaceWith(h);
    const tocCh={num:ci, text:t, id:'s-'+ci, subs:[]};
    toc.push(tocCh);
    const block = h.nextElementSibling;
    if(block && block.classList.contains('rb-block')){
      block.querySelectorAll('.rb-sub').forEach(rs=>{
        si++;

        rs.replaceWith(h3);
        tocCh.subs.push({num:ci+'.'+si, text:st, id:'s-'+ci+'-'+si});

    hh.addEventListener('click', function(){ namuToggle(hh); });
  });

/* 박스 2열 배치: 순서대로 앞 절반(높이 기준)은 왼쪽, 나머지는 오른쪽 */
function vetBoxLayout(root){
  root.querySelectorAll('.rb-boxes').forEach(function(wrap){
    var boxes=[].slice.call(wrap.querySelectorAll(':scope > .bx, :scope > .col > .bx'));
    if(!boxes.length) return;
    wrap.innerHTML='';
    if(window.innerWidth<=700){ boxes.forEach(function(b){ wrap.appendChild(b); }); return; }
    var left=document.createElement('div'), right=document.createElement('div');
    left.className='col'; right.className='col';
    wrap.appendChild(left); wrap.appendChild(right);
    boxes.forEach(function(b){ left.appendChild(b); });
    var hs=boxes.map(function(b){ return b.offsetHeight+6; });
    var total=hs.reduce(function(a,c){ return a+c; },0), acc=0, best=1, bestDiff=Infinity;
    for(var k=1;k<boxes.length;k++){ acc+=hs[k-1]; var d=Math.abs(acc-(total-acc)); if(d<bestDiff){ bestDiff=d; best=k; } }
    boxes.forEach(function(b,k){ if(k>=best) right.appendChild(b); });
  });
}
var _vetRelayoutT=null;
window.addEventListener('resize', function(){ clearTimeout(_vetRelayoutT); _vetRelayoutT=setTimeout(function(){ var r=document.querySelector('#main .namu-doc'); if(r) vetBoxLayout(r); }, 150); });
function namuToggle(h){
  var collapsed = h.classList.toggle('namu-collapsed');
  var stop = (h.tagName === 'H2') ? ['H2'] : ['H2','H3'];
  var n = h.nextElementSibling;
  while(n && stop.indexOf(n.tagName) === -1){
    n.style.display = collapsed ? 'none' : '';
    n = n.nextElementSibling;
  }
}
let VETEDITS = {}, _vetLoaded = false, _vetLoading = false;
/* KPN 후대성적: 기본 데이터(KPN_DATA.DB) 위에 웹에서 고친 값(VETEDITS.__kpn__)을 덮어쓴다 */
function kpnApplyEdits(){
  var D=window.KPN_DATA; if(!D||!D.DB) return;
  if(!window.__KPN_BASE_DB) window.__KPN_BASE_DB=JSON.parse(JSON.stringify(D.DB));
  var db=JSON.parse(JSON.stringify(window.__KPN_BASE_DB));
  var ed=(VETEDITS&&VETEDITS.__kpn__&&typeof VETEDITS.__kpn__==='object')?VETEDITS.__kpn__:{};
  Object.keys(ed).forEach(function(k){ if(ed[k]===null) delete db[k]; else if(Array.isArray(ed[k])&&ed[k].length>=9) db[k]=ed[k]; });
  D.DB=db;
}
async function vetEditsEnsure(){
  if(_vetLoaded || _vetLoading) return;
  if(typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length) return;
  _vetLoading = true;
  try{
    const db = firebase.firestore();
    const snap = await db.collection('library').doc('vetEdits').get();
    VETEDITS = (snap.exists && snap.data() && snap.data().data) ? (JSON.parse(snap.data().data)||{}) : {};
    _vetLoaded = true;
    try{ kpnApplyEdits(); }catch(e){ console.warn('KPN 수정값 적용 실패', e); }
  }catch(e){ console.warn('vetEdits load 실패', e); }
  _vetLoading = false;
  if(typeof UI!=='undefined' && UI.vetMode){ try{ renderVet(); }catch(e){} }
}
async function vetEditsSave(){
  try{
    const db = firebase.firestore();
    await db.collection('library').doc('vetEdits').set({data:JSON.stringify(VETEDITS), updated:Date.now()}, {merge:true});
    if(typeof toast==='function') toast('수정 내용이 저장됐어요.');
    return true;
  }catch(e){ console.warn('vetEdits save 실패', e); if(typeof toast==='function') toast('저장 실패 — 주인 계정 로그인 상태를 확인해주세요.'); return false; }
}
function vetSecNodes(h){
  var stop = (h.tagName==='H2') ? ['H2'] : ['H2','H3'];
  var nodes=[], n=h.nextElementSibling;
  while(n && stop.indexOf(n.tagName)===-1){ nodes.push(n); n=n.nextElementSibling; }
  return nodes;
}
function vetApplyOverrides(root){
  if(!VETEDITS) return;
  root.querySelectorAll('.namu-h2,.namu-h3').forEach(function(h){
    var key=h.dataset.vkey; if(!key) return;
    var html=VETEDITS[key]; if(html==null) return;
    var nodes=vetSecNodes(h); if(!nodes.length) return;
    var parent=nodes[0].parentNode;
    var anchor=nodes[nodes.length-1].nextSibling;
    nodes.forEach(function(n){ n.remove(); });
    var tmp=document.createElement('div'); tmp.innerHTML=html;
    // Plain text must remain a section node so it can be edited again.
    Array.from(tmp.childNodes).forEach(function(n){
      if(n.nodeType===3 && n.textContent.trim()){
        var p=document.createElement('p'); p.className='rb-p'; p.textContent=n.textContent; n.replaceWith(p);
      }
    });
    while(tmp.firstChild){ parent.insertBefore(tmp.firstChild, anchor); }
  });
}
/* 강조(형광펜): 본문에서 드래그한 구절을 저장해 두었다가 다시 표시한다. 주인 로그인 상태에서만 추가·해제 가능 */
var HLSEL=null, _hlTimer=null;
var HL_BLOCK='p.rb-p, .rb-list li, .rb-key li, .rb-cc-b';
function vetHlList(tab, create){
  var all=VETEDITS && VETEDITS.__hl__;
  if(!all || typeof all!=='object'){ if(!create) return []; all=VETEDITS.__hl__={}; }
  if(!Array.isArray(all[tab])){ if(!create) return []; all[tab]=[]; }
  return all[tab];
}
function vetHlWrap(block, start, end, idx){
  var walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  var pos=0, nodes=[], n;
  while((n=walker.nextNode())){
    var s=pos, e=pos+n.nodeValue.length;
    if(e>start && s<end) nodes.push({n:n, from:Math.max(start,s)-s, to:Math.min(end,e)-s});
    pos=e; if(pos>=end) break;
  }
  nodes.forEach(function(o){
    var mid=o.from>0 ? o.n.splitText(o.from) : o.n;
    if(o.to-o.from < mid.nodeValue.length) mid.splitText(o.to-o.from);
    var m=document.createElement('mark'); m.className='hl'; m.dataset.hl=idx;
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  return nodes.length>0;
}
function vetHlApplyOne(root, it, idx){
  var blocks=Array.prototype.slice.call(root.querySelectorAll(HL_BLOCK));
  var pre=it.b||'', needle=pre+it.t+(it.a||'');
  for(var i=0;i<blocks.length;i++){
    var k=blocks[i].textContent.indexOf(needle);
    if(k>=0){ var st=k+pre.length; return vetHlWrap(blocks[i], st, st+it.t.length, idx); }
  }
  var hit=null, cnt=0;
  blocks.forEach(function(b){
    var tx=b.textContent, p=tx.indexOf(it.t);
    while(p>=0){ cnt++; hit={b:b,p:p}; p=tx.indexOf(it.t,p+1); }
  });
  if(cnt===1) return vetHlWrap(hit.b, hit.p, hit.p+it.t.length, idx);
  return false;
}
function vetApplyHighlights(root, tab){
  vetHlList(tab).forEach(function(it,i){ vetHlApplyOne(root,it,i); });
}
function vetHlRefresh(root, tab){
  root.querySelectorAll('mark.hl').forEach(function(m){
    var par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m);
    par.removeChild(m); par.normalize();
  });
  vetApplyHighlights(root, tab);
}
function vetHlSelInfo(){
  var main=document.querySelector('#main .namu-doc');
  if(!main) return null;
  if(!((typeof isAdmin==='function') && isAdmin())) return null;
  if(document.querySelector('.vet-edit-box')) return null;
  var sel=window.getSelection(); if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var s0=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  var e0=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer;
  var bs=(s0 && s0.closest) ? s0.closest(HL_BLOCK) : null, be=(e0 && e0.closest) ? e0.closest(HL_BLOCK) : null;
  if(!bs || bs!==be || !main.contains(bs)) return null;
  var pre=document.createRange(); pre.selectNodeContents(bs); pre.setEnd(r.startContainer, r.startOffset);
  var start=pre.toString().length, raw=r.toString();
  start+=raw.length-raw.replace(/^\s+/,'').length;
  var t=raw.trim(); if(!t || t.length>240) return null;
  var full=bs.textContent, marks=[];
  bs.querySelectorAll('mark.hl').forEach(function(m){ if(r.intersectsNode(m)) marks.push(+m.dataset.hl); });
  return {t:t, b:full.slice(Math.max(0,start-15),start), a:full.slice(start+t.length,start+t.length+15), marks:marks};
}
function vetHlBar(){
  var bar=document.getElementById('hlBar'); if(bar) return bar;
  bar=document.createElement('div'); bar.id='hlBar'; bar.className='hl-bar';
  bar.innerHTML='<button type="button" data-hl-act="add">강조</button><button type="button" data-hl-act="del">해제</button>';
  document.body.appendChild(bar);
  bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  bar.addEventListener('click', vetHlAct);
  return bar;
}
function vetHlShow(info){
  HLSEL=info; clearTimeout(_hlTimer);
  var bar=vetHlBar();
  bar.querySelector('[data-hl-act="add"]').disabled=!info.t;
  bar.querySelector('[data-hl-act="del"]').disabled=!(info.marks && info.marks.length);
  bar.style.display='flex';
}
function vetHlHideSoon(ms){
  clearTimeout(_hlTimer);
  _hlTimer=setTimeout(function(){ var b=document.getElementById('hlBar'); if(b) b.style.display='none'; HLSEL=null; }, ms);
}
async function vetHlAct(e){
  var btn=e.target.closest('[data-hl-act]'); if(!btn || btn.disabled || !HLSEL) return;
  if(!_vetLoaded){ if(typeof toast==='function') toast('저장된 내용을 불러오는 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  var tab=UI.vetTab, list=vetHlList(tab,true), snap=JSON.stringify(VETEDITS.__hl__||{}), info=HLSEL;
  if(btn.dataset.hlAct==='add'){
    list.push({t:info.t, b:info.b, a:info.a});
  } else {
    info.marks.slice().sort(function(x,y){return y-x;}).forEach(function(i){ list.splice(i,1); });
  }
  var ok=await vetEditsSave();
  if(!ok){ VETEDITS.__hl__=JSON.parse(snap); return; }
  vetHlRefresh(document.querySelector('#main .namu-doc'), tab);
  var s=window.getSelection(); if(s) s.removeAllRanges();
  HLSEL=null; var b=document.getElementById('hlBar'); if(b) b.style.display='none';
}
function vetHlInit(){
  document.addEventListener('selectionchange', function(){
    var info=vetHlSelInfo();
    if(info) vetHlShow(info); else if(HLSEL) vetHlHideSoon(1500);
  });
  document.addEventListener('click', function(e){
    var m=e.target.closest && e.target.closest('mark.hl'); if(!m) return;
    if(!((typeof isAdmin==='function') && isAdmin()) || document.querySelector('.vet-edit-box')) return;
    var s=window.getSelection(); if(s && !s.isCollapsed) return;
    vetHlShow({t:'', b:'', a:'', marks:[+m.dataset.hl]}); vetHlHideSoon(4000);
  });
}
function vetEnterEdit(h){
  if(!((typeof isAdmin==='function') && isAdmin())) return;
  if(document.querySelector('.vet-edit-box')) return;
  var nodes=vetSecNodes(h); if(!nodes.length) return;
  var parent=nodes[0].parentNode;
  var box=document.createElement('div');
  box.className='vet-edit-box'; box.setAttribute('contenteditable','true');
  parent.insertBefore(box, nodes[0]);
  nodes.forEach(function(n){ box.appendChild(n); });
  var bar=document.createElement('div');
  bar.className='vet-edit-bar';
  bar.innerHTML='<button type="button" class="vet-eb-save">저장</button><button type="button" class="vet-eb-cancel">취소</button>';
  box.insertAdjacentElement('afterend', bar);
  box.focus();
  bar.querySelector('.vet-eb-save').addEventListener('click', async function(){
    const oldHtml=VETEDITS[h.dataset.vkey];
    VETEDITS[h.dataset.vkey]=box.innerHTML;
    this.textContent='저장 중…'; this.disabled=true;
    const saved = await vetEditsSave();
    if(saved) renderVet();
    else { if(oldHtml===undefined) delete VETEDITS[h.dataset.vkey]; else VETEDITS[h.dataset.vkey]=oldHtml; this.textContent='저장'; this.disabled=false; }
  });
  bar.querySelector('.vet-eb-cancel').addEventListener('click', function(){ renderVet(); });
}

/* 풀정보: 섹션 제목 + 카드를 접이식(아코디언)으로 묶기 — 모바일에서 목차부터 보이게 */
function groupGrassSections(root){
  root = root || document.getElementById('main');
  if(!root) return;
  const titles = [...root.querySelectorAll('.grass-section-title')];
  titles.forEach(title => {
    const details = document.createElement('details');
    details.className = 'grass-acc';
    details.open = false;          // 기본 접힘 → 목차처럼 보임
    const summary = document.createElement('summary');
    summary.className = 'grass-acc-sum';
    summary.innerHTML = title.innerHTML;
    details.appendChild(summary);
    title.replaceWith(details);
    let node = details.nextElementSibling;
    while(node && !node.classList.contains('grass-section-title') && !node.classList.contains('modal-actions')){
      const next = node.nextElementSibling;
      details.appendChild(node);
      node = next;
    }
  });
}
