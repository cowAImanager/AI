/* 달성군 농장 목록: 개인정보라서 코드에 넣지 않고 Firestore(private/daeguFarms)에 두며, 주인 로그인 상태에서만 읽는다 */
let FARMS=null, _farmsLoading=false, _farmsMissing=false, _farmsError=false;
function farmsRef(){ return firebase.firestore().collection('private').doc('daeguFarms'); }
function farmEsc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function farmsBox(){ return document.querySelector('#main .vet-panel'); }
async function farmsLoad(){
  if(FARMS||_farmsLoading||!isAdmin()) return;
  if(typeof firebase==='undefined'||!firebase.apps||!firebase.apps.length) return;
  _farmsLoading=true; _farmsMissing=false; _farmsError=false;
  try{
    const snap=await farmsRef().get();
    if(snap.exists && snap.data() && snap.data().data){ FARMS=JSON.parse(snap.data().data); }
    else _farmsMissing=true;
  }catch(e){ console.warn('농장 목록 불러오기 실패',e); _farmsError=true; }
  _farmsLoading=false;
  var _b=farmsBox(); if(_b){ if(UI.vetTab==='farms') farmsMount(_b); else if(UI.vetTab==='route') routeMount(_b); }
}
async function farmsImportText(text){
  var rows;
  try{ rows=JSON.parse(text); }catch(e){ toast('JSON 파일이 아니에요.'); return false; }
  if(!Array.isArray(rows)||!rows.length||rows.length>5000||!rows.every(function(r){ return r&&typeof r.n==='string'&&typeof r.a==='string'&&typeof r.p==='string'; })){ toast('농장 목록 형식(이름·주소·전화번호)이 맞지 않아요.'); return false; }
  try{ await farmsRef().set({data:JSON.stringify(rows),updated:Date.now()}); }
  catch(e){ console.warn('농장 목록 저장 실패',e); toast('저장하지 못했어요. 주인 로그인과 접근 규칙을 확인해주세요.'); return false; }
  FARMS=rows; _farmsMissing=false; _farmsError=false;
  toast('농장 목록 '+rows.length+'곳을 저장했어요.');
  if(UI.vetTab==='farms' && farmsBox()) farmsMount(farmsBox());
  return true;
}
function farmsUploader(label){
  return '<label class="fm-up">'+label+'<input type="file" accept=".json,application/json" id="fmFile" hidden></label>';
}
function farmsBindUpload(box){
  var f=box.querySelector('#fmFile'); if(!f) return;
  f.addEventListener('change',function(){
    var file=f.files&&f.files[0]; if(!file) return;
    var r=new FileReader(); r.onload=function(){ farmsImportText(String(r.result)); }; r.readAsText(file,'utf-8');
  });
}
function farmsFilter(q){
  var toks=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length) return FARMS;
  return FARMS.filter(function(f){
    var hay=(f.n+' '+f.a+' '+f.p).toLowerCase(), hayNH=hay.replace(/-/g,'');
    return toks.every(function(t){
      if(hay.indexOf(t)>=0) return true;
      return /^[\d-]+$/.test(t) && hayNH.indexOf(t.replace(/-/g,''))>=0;
    });
  });
}
function farmsDraw(box){

function farmsMount(box){

  var inp=box.querySelector('#fmQ');
  inp.addEventListener('input',function(){ farmsDraw(box); });
  box.querySelector('#fmClr').addEventListener('click',function(){ inp.value=''; farmsDraw(box); inp.focus(); });
  farmsBindUpload(box); farmsDraw(box);
}

/* 방역 동선: 유가읍·현풍읍 농장을 마을(리) 단위 최단 순환 경로 순서로 나열한다. 농장 데이터는 농장 목록과 같은 Firestore 문서를 쓴다.
   아래 숫자는 마을 중심 사이 직선거리에 1.3을 곱한 추정 km(다음 마을까지)이며 좌표는 담지 않는다. */
const ROUTE_LOOP=[['유가읍','도의리',4.5],['현풍읍','대리',1.6],['현풍읍','지리',2.6],['현풍읍','오산리',3.1],['현풍읍','원교리',4.8],['유가읍','쌍계리',2.2],['유가읍','초곡리',3.3],['유가읍','양리',3.2],['유가읍','음리',2.0],['유가읍','용리',3.9],['유가읍','유곡리',4.4],['유가읍','본말리',3.7],['유가읍','한정리',2.1]];
let RT={start:'도의리',n:22};
function routeLotKey(rest){
  var m=String(rest||'').match(/(산)?\s*(\d+)(?:-(\d+))?/);
  if(!m) return [1e9,0];
  return [(m[1]?100000:0)+parseInt(m[2],10), m[3]?parseInt(m[3],10):0];
}
function routeBuild(){
  var groups={};
  FARMS.forEach(function(f){
    var m=f.a.match(/달성군 (유가읍|현풍읍) (\S+리) ?(.*)$/); if(!m) return;
    var k=m[1]+'|'+m[2]; (groups[k]=groups[k]||[]).push({f:f,key:routeLotKey(m[3])});
  });
  var total=0; Object.keys(groups).forEach(function(k){ total+=groups[k].length; });
  var si=ROUTE_LOOP.findIndex(function(v){ return v[1]===RT.start; }); if(si<0) si=0;
  var rot=ROUTE_LOOP.slice(si).concat(ROUTE_LOOP.slice(0,si));
  var vills=[];
  rot.forEach(function(v,i){
    var arr=groups[v[0]+'|'+v[1]]; delete groups[v[0]+'|'+v[1]];
    if(!arr||!arr.length) return;
    arr.sort(function(a,b){ return a.key[0]-b.key[0]||a.key[1]-b.key[1]; });
    vills.push({eup:v[0],ri:v[1],pos:i,farms:arr.map(function(x){ return x.f; })});
  });
  var extra=[];
  Object.keys(groups).sort().forEach(function(k){ var p=k.split('|'); groups[k].sort(function(a,b){ return a.key[0]-b.key[0]||a.key[1]-b.key[1]; }); extra.push({eup:p[0],ri:p[1],pos:-1,farms:groups[k].map(function(x){ return x.f; })}); });
  var days=[],cur=[],cnt=0;
  vills.forEach(function(v){
    if(RT.n>0 && cnt>0 && cnt+v.farms.length>RT.n && cnt>=RT.n*0.5){ days.push(cur); cur=[]; cnt=0; }
    cur.push(v); cnt+=v.farms.length;
  });
  if(cur.length) days.push(cur);
  function legSum(a,b){ var s=0; for(var i=a;i<b;i++) s+=rot[i][2]; return s; }
  days.forEach(function(d){ var km=0; for(var i=1;i<d.length;i++) km+=legSum(d[i-1].pos,d[i].pos); d.km=km; d.count=d.reduce(function(s,v){ return s+v.farms.length; },0); });
  return {days:days,extra:extra,total:total};
}
function routeKakao(q){ return 'https://map.kakao.com/link/search/'+encodeURIComponent(q); }
function routeNaver(q){ return 'https://map.naver.com/p/search/'+encodeURIComponent(q); }
function routeFarmRow(f,n){
  var ph=f.p?'<a class="rt-tel" href="tel:'+f.p.replace(/-/g,'')+'">'+farmEsc(f.p)+'</a>':'';
  return '<div class="rt-row"><span class="rt-n">'+n+'</span><div class="rt-main"><div class="rt-l1"><b>'+farmEsc(f.n)+'</b>'+ph+'</div>'+
    '<div class="rt-l2">'+farmEsc(f.a.replace('대구광역시 달성군 ',''))+' <a href="'+routeKakao(f.a)+'" target="_blank" rel="noopener">카카오</a><a href="'+routeNaver(f.a)+'" target="_blank" rel="noopener">네이버</a></div></div></div>';
}
function routeDraw(box){
  var r=routeBuild(), out=box.querySelector('#rtOut'), n=0, h='';
  var loopKm=ROUTE_LOOP.reduce(function(s,v){ return s+v[2]; },0);
  h+='<div class="fm-count">유가읍·현풍읍 농장 '+r.total+'곳 · 마을 한 바퀴(13곳) 약 '+loopKm.toFixed(1)+'km (추정)</div>';
  r.days.forEach(function(d,di){
    h+='<div class="rt-day"><div class="rt-dh"><b>'+(di+1)+'일차</b><span>농장 '+d.count+'곳 · 마을 '+d.length+'곳 · 마을 간 이동 약 '+d.km.toFixed(1)+'km</span></div>';
    d.forEach(function(v){
      h+='<div class="rt-vh"><b>'+farmEsc(v.ri)+'</b><span>'+v.eup+' · '+v.farms.length+'곳</span><a href="'+routeKakao('대구 달성군 '+v.eup+' '+v.ri)+'" target="_blank" rel="noopener">마을 지도</a></div>';
      v.farms.forEach(function(f){ n++; h+=routeFarmRow(f,n); });
    });
    h+='</div>';
  });
  if(r.extra.length){
    h+='<div class="rt-day"><div class="rt-dh"><b>순서 미정</b><span>경로표에 없는 마을이라 맨 뒤에 둔다</span></div>';
    r.extra.forEach(function(v){
      h+='<div class="rt-vh"><b>'+farmEsc(v.ri)+'</b><span>'+v.eup+' · '+v.farms.length+'곳</span></div>';
      v.farms.forEach(function(f){ n++; h+=routeFarmRow(f,n); });
    });
    h+='</div>';
  }
  if(!r.total) h='<div class="fm-empty">유가읍·현풍읍 농장이 목록에 없다.</div>';
  h+='<div class="fm-note" style="margin-top:14px;">이동 거리는 마을 중심 사이 직선거리에 1.3을 곱한 추정값이고, 출발지에서 첫 마을까지와 마지막 마을에서 돌아오는 길은 넣지 않았다. 같은 마을 안에서는 번지 순서로 나열했다. 마을 순서는 13개 마을을 한 바퀴 도는 최단 경로이고, 시작 마을을 바꾸면 같은 바퀴를 그 마을부터 돈다.</div>';
  out.innerHTML=h;
}
function routeMount(box){
  if(!box) return;
  if(!isAdmin()){
    FARMS=null; _farmsMissing=false; _farmsError=false;
    box.innerHTML='<div class="fm-note">농장주 개인정보라서 주인 계정으로 로그인해야 볼 수 있다.</div><button type="button" class="btn secondary" data-action="openAdminLogin">로그인</button>';

    if(_farmsError){
      box.innerHTML='<div class="fm-note">농장 목록을 불러오지 못했다. 연결과 접근 규칙을 확인해라.</div><button type="button" class="btn secondary" id="rtRetry">다시 시도</button>';

      return;

  }
  var so=ROUTE_LOOP.map(function(v){ return '<option value="'+v[1]+'"'+(v[1]===RT.start?' selected':'')+'>'+v[0].charAt(0)+' '+v[1]+'</option>'; }).join('');
  var no=[[10,'하루 10곳'],[15,'하루 15곳'],[20,'하루 20곳'],[22,'하루 22곳 (3일)'],[30,'하루 30곳'],[0,'하루에 전부']].map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===RT.n?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  box.innerHTML='<div class="rt-ctl"><label>시작 마을<select id="rtStart">'+so+'</select></label><label>하루 방문<select id="rtN">'+no+'</select></label></div><div id="rtOut"></div>';
  box.querySelector('#rtStart').addEventListener('change',function(e){ RT.start=e.target.value; routeDraw(box); });
  box.querySelector('#rtN').addEventListener('change',function(e){ RT.n=parseInt(e.target.value,10); routeDraw(box); });
  routeDraw(box);
}

function namuToggle(h){
  var collapsed = h.classList.toggle('namu-collapsed');

let VETEDITS = {}, _vetLoaded = false, _vetLoading = false;
/* KPN 후대성적: 기본 데이터(KPN_DATA.DB) 위에 웹에서 고친 값(VETEDITS.__kpn__)을 덮어쓴다 */
function kpnApplyEdits(){
  var D=window.KPN_DATA; if(!D||!D.DB) return;
  if(!window.__KPN_BASE_DB) window.__KPN_BASE_DB=JSON.parse(JSON.stringify(D.DB));
  var db=JSON.parse(JSON.stringify(window.__KPN_BASE_DB));
  var ed=(VETEDITS&&VETEDITS.__kpn__&&typeof VETEDITS.__kpn__==='object')?VETEDITS.__kpn__:{};
  Object.keys(ed).forEach(function(k){ if(ed[k]===null) delete db[k]; else if(Array.isArray(ed[k])&&ed[k].length>=9) db[k]=ed[k]; });
  D.DB=db;
}
async function vetEditsEnsure(){
  if(_vetLoaded || _vetLoading) return;
  if(typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length) return;
  _vetLoading = true;
  try{
    const db = firebase.firestore();
    const snap = await db.collection('library').doc('vetEdits').get();
    VETEDITS = (snap.exists && snap.data() && snap.data().data) ? (JSON.parse(snap.data().data)||{}) : {};
    _vetLoaded = true;
    try{ kpnApplyEdits(); }catch(e){ console.warn('KPN 수정값 적용 실패', e); }
  }catch(e){ console.warn('vetEdits load 실패', e); }
  _vetLoading = false;
  if(typeof UI!=='undefined' && UI.vetMode){ try{ renderVet(); }catch(e){} }
}
async function vetEditsSave(){
  try{
    const db = firebase.firestore();
    await db.collection('library').doc('vetEdits').set({data:JSON.stringify(VETEDITS), updated:Date.now()}, {merge:true});
    if(typeof toast==='function') toast('수정 내용이 저장됐어요.');
    return true;
  }catch(e){ console.warn('vetEdits save 실패', e); if(typeof toast==='function') toast('저장 실패 — 주인 계정 로그인 상태를 확인해주세요.'); return false; }
}
function vetSecNodes(h){
  var stop = (h.tagName==='H2') ? ['H2'] : ['H2','H3'];
  var nodes=[], n=h.nextElementSibling;
  while(n && stop.indexOf(n.tagName)===-1){ nodes.push(n); n=n.nextElementSibling; }
  return nodes;
}
function vetApplyOverrides(root){
  if(!VETEDITS) return;
  root.querySelectorAll('.namu-h2,.namu-h3').forEach(function(h){
    var key=h.dataset.vkey; if(!key) return;
    var html=VETEDITS[key]; if(html==null) return;
    var nodes=vetSecNodes(h); if(!nodes.length) return;
    var parent=nodes[0].parentNode;
    var anchor=nodes[nodes.length-1].nextSibling;
    nodes.forEach(function(n){ n.remove(); });
    var tmp=document.createElement('div'); tmp.innerHTML=html;
    // Plain text must remain a section node so it can be edited again.
    Array.from(tmp.childNodes).forEach(function(n){
      if(n.nodeType===3 && n.textContent.trim()){
        var p=document.createElement('p'); p.className='rb-p'; p.textContent=n.textContent; n.replaceWith(p);
      }
    });
    while(tmp.firstChild){ parent.insertBefore(tmp.firstChild, anchor); }
  });
}
/* 강조(형광펜): 본문에서 드래그한 구절을 저장해 두었다가 다시 표시한다. 주인 로그인 상태에서만 추가·해제 가능 */
var HLSEL=null, _hlTimer=null;
var HL_BLOCK='p.rb-p, .rb-list li, .rb-key li, .rb-cc-b';
function vetHlList(tab, create){
  var all=VETEDITS && VETEDITS.__hl__;
  if(!all || typeof all!=='object'){ if(!create) return []; all=VETEDITS.__hl__={}; }
  if(!Array.isArray(all[tab])){ if(!create) return []; all[tab]=[]; }
  return all[tab];
}
function vetHlWrap(block, start, end, idx){
  var walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  var pos=0, nodes=[], n;
  while((n=walker.nextNode())){
    var s=pos, e=pos+n.nodeValue.length;
    if(e>start && s<end) nodes.push({n:n, from:Math.max(start,s)-s, to:Math.min(end,e)-s});
    pos=e; if(pos>=end) break;
  }
  nodes.forEach(function(o){
    var mid=o.from>0 ? o.n.splitText(o.from) : o.n;
    if(o.to-o.from < mid.nodeValue.length) mid.splitText(o.to-o.from);
    var m=document.createElement('mark'); m.className='hl'; m.dataset.hl=idx;
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  return nodes.length>0;
}
function vetHlApplyOne(root, it, idx){
  var blocks=Array.prototype.slice.call(root.querySelectorAll(HL_BLOCK));
  var pre=it.b||'', needle=pre+it.t+(it.a||'');
  for(var i=0;i<blocks.length;i++){
    var k=blocks[i].textContent.indexOf(needle);
    if(k>=0){ var st=k+pre.length; return vetHlWrap(blocks[i], st, st+it.t.length, idx); }
  }
  var hit=null, cnt=0;
  blocks.forEach(function(b){
    var tx=b.textContent, p=tx.indexOf(it.t);
    while(p>=0){ cnt++; hit={b:b,p:p}; p=tx.indexOf(it.t,p+1); }
  });
  if(cnt===1) return vetHlWrap(hit.b, hit.p, hit.p+it.t.length, idx);
  return false;
}
function vetApplyHighlights(root, tab){
  vetHlList(tab).forEach(function(it,i){ vetHlApplyOne(root,it,i); });
}
function vetHlRefresh(root, tab){
  root.querySelectorAll('mark.hl').forEach(function(m){
    var par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m);
    par.removeChild(m); par.normalize();
  });
  vetApplyHighlights(root, tab);
}
function vetHlSelInfo(){
  var main=document.querySelector('#main .namu-doc');
  if(!main) return null;
  if(!((typeof isAdmin==='function') && isAdmin())) return null;
  if(document.querySelector('.vet-edit-box')) return null;
  var sel=window.getSelection(); if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var s0=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  var e0=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer;
  var bs=(s0 && s0.closest) ? s0.closest(HL_BLOCK) : null, be=(e0 && e0.closest) ? e0.closest(HL_BLOCK) : null;
  if(!bs || bs!==be || !main.contains(bs)) return null;
  var pre=document.createRange(); pre.selectNodeContents(bs); pre.setEnd(r.startContainer, r.startOffset);
  var start=pre.toString().length, raw=r.toString();
  start+=raw.length-raw.replace(/^\s+/,'').length;
  var t=raw.trim(); if(!t || t.length>240) return null;
  var full=bs.textContent, marks=[];
  bs.querySelectorAll('mark.hl').forEach(function(m){ if(r.intersectsNode(m)) marks.push(+m.dataset.hl); });
  return {t:t, b:full.slice(Math.max(0,start-15),start), a:full.slice(start+t.length,start+t.length+15), marks:marks};
}
function vetHlBar(){
  var bar=document.getElementById('hlBar'); if(bar) return bar;
  bar=document.createElement('div'); bar.id='hlBar'; bar.className='hl-bar';
  bar.innerHTML='<button type="button" data-hl-act="add">강조</button><button type="button" data-hl-act="del">해제</button>';
  document.body.appendChild(bar);
  bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  bar.addEventListener('click', vetHlAct);
  return bar;
}
function vetHlShow(info){
  HLSEL=info; clearTimeout(_hlTimer);
  var bar=vetHlBar();
  bar.querySelector('[data-hl-act="add"]').disabled=!info.t;
  bar.querySelector('[data-hl-act="del"]').disabled=!(info.marks && info.marks.length);
  bar.style.display='flex';
}
function vetHlHideSoon(ms){
  clearTimeout(_hlTimer);
  _hlTimer=setTimeout(function(){ var b=document.getElementById('hlBar'); if(b) b.style.display='none'; HLSEL=null; }, ms);
}
async function vetHlAct(e){
  var btn=e.target.closest('[data-hl-act]'); if(!btn || btn.disabled || !HLSEL) return;
  if(!_vetLoaded){ if(typeof toast==='function') toast('저장된 내용을 불러오는 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  var tab=UI.vetTab, list=vetHlList(tab,true), snap=JSON.stringify(VETEDITS.__hl__||{}), info=HLSEL;
  if(btn.dataset.hlAct==='add'){
    list.push({t:info.t, b:info.b, a:info.a});
  } else {
    info.marks.slice().sort(function(x,y){return y-x;}).forEach(function(i){ list.splice(i,1); });
  }
  var ok=await vetEditsSave();
  if(!ok){ VETEDITS.__hl__=JSON.parse(snap); return; }
  vetHlRefresh(document.querySelector('#main .namu-doc'), tab);
  var s=window.getSelection(); if(s) s.removeAllRanges();
  HLSEL=null; var b=document.getElementById('hlBar'); if(b) b.style.display='none';
}
function vetHlInit(){
  document.addEventListener('selectionchange', function(){
    var info=vetHlSelInfo();
    if(info) vetHlShow(info); else if(HLSEL) vetHlHideSoon(1500);
  });
  document.addEventListener('click', function(e){
    var m=e.target.closest && e.target.closest('mark.hl'); if(!m) return;
    if(!((typeof isAdmin==='function') && isAdmin()) || document.querySelector('.vet-edit-box')) return;
    var s=window.getSelection(); if(s && !s.isCollapsed) return;
    vetHlShow({t:'', b:'', a:'', marks:[+m.dataset.hl]}); vetHlHideSoon(4000);
  });
}
function vetEnterEdit(h){
  if(!((typeof isAdmin==='function') && isAdmin())) return;
  if(document.querySelector('.vet-edit-box')) return;
  var nodes=vetSecNodes(h); if(!nodes.length) return;
  var parent=nodes[0].parentNode;
  var box=document.createElement('div');
  box.className='vet-edit-box'; box.setAttribute('contenteditable','true');
  parent.insertBefore(box, nodes[0]);
  nodes.forEach(function(n){ box.appendChild(n); });
  var bar=document.createElement('div');
  bar.className='vet-edit-bar';
  bar.innerHTML='<button type="button" class="vet-eb-save">저장</button><button type="button" class="vet-eb-cancel">취소</button>';
  box.insertAdjacentElement('afterend', bar);
  box.focus();
  bar.querySelector('.vet-eb-save').addEventListener('click', async function(){
    const oldHtml=VETEDITS[h.dataset.vkey];
    VETEDITS[h.dataset.vkey]=box.innerHTML;
    this.textContent='저장 중…'; this.disabled=true;
    const saved = await vetEditsSave();
    if(saved) renderVet();
    else { if(oldHtml===undefined) delete VETEDITS[h.dataset.vkey]; else VETEDITS[h.dataset.vkey]=oldHtml; this.textContent='저장'; this.disabled=false; }
  });
  bar.querySelector('.vet-eb-cancel').addEventListener('click', function(){ renderVet(); });
}

/* 풀정보: 섹션 제목 + 카드를 접이식(아코디언)으로 묶기 — 모바일에서 목차부터 보이게 */
function groupGrassSections(root){
  root = root || document.getElementById('main');
  if(!root) return;
  const titles = [...root.querySelectorAll('.grass-section-title')];
  titles.forEach(title => {
    const details = document.createElement('details');
    details.className = 'grass-acc';
    details.open = false;          // 기본 접힘 → 목차처럼 보임
    const summary = document.createElement('summary');
    summary.className = 'grass-acc-sum';
    summary.innerHTML = title.innerHTML;
    details.appendChild(summary);
    title.replaceWith(details);
    let node = details.nextElementSibling;
    while(node && !node.classList.contains('grass-section-title') && !node.classList.contains('modal-actions')){
      const next = node.nextElementSibling;
      details.appendChild(node);
      node = next;
    }
  });
}

  function cell(html,best,align){return '<td style="padding:8px 6px;text-align:'+(align||'center')+';'+(best?'background:var(--green-soft);':'')+'">'+html+'</td>';}

  function render(box){

  function renderVal(box){

      var dets=x.sig.det.join(' ');

    var maeHtml='';var mn=['도체중','단면적','등지방','근내'],mu=['kg','cm²','mm','점'],md=[1,1,1,2];

      +'<div style="font-size:13px;font-weight:800;color:var(--primary-dark);margin-bottom:6px;">예측 검증 (실측 있는 '+items.length+'두)</div>'
      +'<div style="font-size:12px;color:var(--ink);margin-bottom:4px;line-height:1.8;">두수 100↑ 소 기준 <b>형질별 평균 절대오차</b><br>'+maeHtml+'</div>'
      +'<div style="color:var(--ink-soft);font-size:11px;margin-bottom:10px;">모델이 평균적으로 이만큼 맞습니다(작을수록 정확).</div>'

  // ===== 즐겨찾기(관심 KPN) =====
  function favGet(){ try{ return (typeof DATA!=='undefined' && DATA && Array.isArray(DATA.kpnFav))?DATA.kpnFav:[]; }catch(e){ return []; } }

(function(){

    function f4(prefix,labels,units){ return [0,1,2,3].map(function(i){ return '<div><label style="'+LBL+'">'+labels[i]+' ('+units[i]+')</label><input id="'+prefix+i+'" inputmode="decimal" style="'+INP+'"></div>'; }).join(''); }
    wrap.insertAdjacentHTML('beforeend',
      '<div id="kpnEd" style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px;">'+
      '<button type="button" id="kedTog" style="'+BTN+'">✏️ 후대성적 수정</button>'+
      '<div id="kedBody" style="display:none;margin-top:12px;">'+
        '<div style="font-size:11px;color:var(--ink-soft);line-height:1.6;background:var(--surface-alt);border-radius:8px;padding:9px 11px;margin-bottom:10px;">※ 후대성적을 고치면 <b>실측 표시·저평가 판정·검증 로그</b>에 바로 반영됩니다. 예측값(EPD로 계산하는 큰 숫자)과 부·외조부 계통 보정은 그대로입니다. 계수는 맨 아래 "데이터 내려받기"로 받은 파일을 보내서 다시 맞춥니다.</div>'+
        '<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;"><div style="flex:1;max-width:180px;"><label style="'+LBL+'">KPN</label><input id="kedK" inputmode="numeric" placeholder="예: 1864" style="'+INP+'font-weight:800;"></div><button type="button" id="kedLoad" style="'+BTN+'">불러오기</button></div>'+
        '<div id="kedStat" style="font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px;">KPN을 넣고 불러오기를 누르세요. DB에 없는 번호는 새로 추가됩니다.</div>'+
        '<div style="font-size:11.5px;font-weight:800;color:var(--primary-dark);margin:6px 0;">후대성적</div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;"><div><label style="'+LBL+'">후대두수 (두)</label><input id="kedN" inputmode="numeric" style="'+INP+'"></div>'+f4('kedA',NM.map(function(x){return '실측 '+x;}),UN)+'</div>'+
        '<div style="font-size:10.5px;color:var(--ink-soft);margin:4px 0 8px;">실측 네 칸을 모두 비우면 "후대 없음"으로 저장됩니다. 일부만 채우면 저장되지 않습니다.</div>'+
        '<details style="margin:6px 0 10px;"><summary style="font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;">EPD·계통 정보 (새 KPN은 EPD 필수)</summary>'+
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px;">'+f4('kedE',NM.map(function(x){return 'EPD '+x;}),UN)+
          '<div><label style="'+LBL+'">부 KPN</label><input id="kedFa" inputmode="numeric" style="'+INP+'"></div><div><label style="'+LBL+'">외조부 KPN</label><input id="kedMg" inputmode="numeric" style="'+INP+'"></div>'+
          '<div><label style="'+LBL+'">등급 (예: AAAA)</label><input id="kedG" maxlength="4" style="'+INP+'text-transform:uppercase;"></div></div></details>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;"><button type="button" id="kedSave" style="'+BTN+'background:var(--primary);color:#fff;border-color:var(--primary);">저장</button>'+
          '<button type="button" id="kedRevert" style="'+BTN+'">원본으로 되돌리기</button><button type="button" id="kedDel" style="'+BTN+'color:var(--notpregnant-bg,#C0392B);">삭제</button></div>'+
        '<div style="font-size:11.5px;font-weight:800;color:var(--primary-dark);margin:16px 0 6px;">일괄 붙여넣기 (후대성적만)</div>'+
        '<textarea id="kedBulk" rows="5" placeholder="한 줄에 하나: KPN 후대두수 도체중 등심단면적 등지방 근내지방도&#10;예) 1864 30 561.2 105.4 14.8 6.9" style="'+INP+'font-family:inherit;line-height:1.5;"></textarea>'+
        '<div style="font-size:10.5px;color:var(--ink-soft);margin:4px 0 8px;">엑셀에서 복사해 붙여넣어도 됩니다(탭·쉼표·공백 구분). DB에 있는 KPN만 바뀝니다. 없는 KPN은 위에서 EPD와 함께 추가하세요.</div>'+
        '<button type="button" id="kedBulkGo" style="'+BTN+'">일괄 반영</button><div id="kedBulkRes" style="font-size:11.5px;line-height:1.6;margin-top:8px;"></div>'+
        '<div style="font-size:11.5px;font-weight:800;color:var(--primary-dark);margin:18px 0 6px;">데이터 내려받기</div>'+
        '<button type="button" id="kedExport" style="'+BTN+'">현재 데이터 내려받기 (JSON)</button>'+
        '<div style="font-size:10.5px;color:var(--ink-soft);margin-top:4px;">웹에서 고친 값이 모두 반영된 전체 데이터입니다. 계수를 다시 맞출 때 이 파일을 보내주세요.</div>'+
      '</div></div>');
    var $=function(id){ return box.querySelector('#'+id); };
    var cur=null;   // 현재 불러온 KPN 문자열
    function setStat(h){ $('kedStat').innerHTML=h; }
    function fill(k){
      var r=db()[k], has=!!r;
      $('kedN').value=has?r[4]:''; for(var i=0;i<4;i++){ $('kedA'+i).value=(has&&r[8])?r[8][i]:''; $('kedE'+i).value=has?r[i]:''; }
      $('kedFa').value=(has&&r[5]!=null)?r[5]:''; $('kedMg').value=(has&&r[6]!=null)?r[6]:''; $('kedG').value=has?(r[7]||''):'';
      var b=base()[k], e=eds()[k], note='';
      if(!has && b && e===null) note='원본에는 있으나 삭제된 상태입니다. 저장하면 다시 살아납니다.';
      else if(!has) note='DB에 없는 번호입니다. 새로 추가하려면 EPD(네 칸)까지 채워서 저장하세요.';
      else if(e!==undefined&&e!==null&&!(b&&sameRec(b,e))) note='웹에서 수정한 값입니다.'+(b?' 원본: 후대 '+b[4]+'두'+(b[8]?' · 실측 '+b[8].join(' / '):' · 실측 없음'):' (원본에 없던 새 KPN)');
      else note='원본 값입니다.';
      setStat('<b>KPN'+esc(k)+'</b> · '+note);
    }
    async function persist(snapshot,doneMsg){
      if(!_vetLoaded){ toast('저장된 내용을 불러오는 중이에요. 잠시 후 다시 시도해주세요.'); VETEDITS.__kpn__=snapshot; return false; }
      var ok=await vetEditsSave();
      if(!ok){ VETEDITS.__kpn__=snapshot; kpnApplyEdits(); if(window.__kpnRerender) window.__kpnRerender(box); return false; }
      kpnApplyEdits(); if(window.__kpnRerender) window.__kpnRerender(box);
      if(doneMsg) toast(doneMsg);
      return true;
    }
    function snap(){ var e=VETEDITS.__kpn__; return e?JSON.parse(JSON.stringify(e)):undefined; }
    $('kedTog').addEventListener('click',function(){ var b=$('kedBody'); b.style.display=(b.style.display==='none')?'block':'none'; });
    $('kedLoad').addEventListener('click',function(){
      var k=String(parseInt($('kedK').value,10)); if(k==='NaN'){ toast('KPN 숫자를 넣어주세요.'); return; }
      cur=k; fill(k);
    });
    $('kedK').addEventListener('keydown',function(e){ if(e.key==='Enter') $('kedLoad').click(); });
    $('kedSave').addEventListener('click',async function(){
      var k=String(parseInt($('kedK').value,10)); if(k==='NaN'){ toast('KPN 숫자를 넣어주세요.'); return; }
      var old=db()[k], isNew=!old;
      var n=num($('kedN').value); if(n===null||isNaN(n)||n<0||Math.floor(n)!==n){ toast('후대두수는 0 이상의 정수로 넣어주세요.'); return; }
      var a=[0,1,2,3].map(function(i){ return num($('kedA'+i).value); });
      var aBlank=a.every(function(x){ return x===null; }), aFull=a.every(function(x){ return x!==null&&!isNaN(x); });
      if(!aBlank&&!aFull){ toast('실측은 네 칸을 모두 채우거나 모두 비워주세요.'); return; }
      var epd=[0,1,2,3].map(function(i){ return num($('kedE'+i).value); });
      if(epd.some(function(x){ return x===null||isNaN(x); })){
        if(isNew){ toast('새 KPN은 EPD 네 칸을 모두 넣어야 해요. (EPD·계통 정보를 펼쳐주세요)'); return; }
        toast('EPD 칸에 숫자가 아닌 값이 있어요.'); return;
      }
      function ik(id){ var s=$(id).value.trim(); if(s==='') return null; var x=parseInt(s,10); return isNaN(x)?undefined:x; }
      var fa=ik('kedFa'), mg=ik('kedMg'); if(fa===undefined||mg===undefined){ toast('부·외조부 KPN은 숫자로 넣어주세요.'); return; }
      var g=$('kedG').value.trim().toUpperCase();
      if(g===''){ g=(old&&old[7]&&sameRec(old.slice(0,4),epd))?old[7]:[0,1,2,3].map(function(i){ return gradeOf(i,epd[i]); }).join(''); }
      if(!/^[ABCD-]{4}$/.test(g)){ toast('등급은 A·B·C·D 네 글자로 넣어주세요. (예: AAAA)'); return; }
      var rec=[epd[0],epd[1],epd[2],epd[3],n,fa,mg,g,aFull?a:null];
      var s0=snap(), e=eds(true), b=base()[k];
      if(b&&sameRec(b,rec)) delete e[k]; else e[k]=rec;
      cur=k;
      if(await persist(s0,'KPN'+k+' 저장했어요.')) fill(k);
    });
    $('kedRevert').addEventListener('click',async function(){
      var k=String(parseInt($('kedK').value,10)); if(k==='NaN'){ toast('KPN 숫자를 넣어주세요.'); return; }
      var e=eds(); if(e[k]===undefined){ toast('웹에서 수정한 내역이 없어요.'); return; }
      var s0=snap(); delete eds(true)[k];
      if(await persist(s0,'KPN'+k+' 원본으로 되돌렸어요.')) fill(k);
    });
    $('kedDel').addEventListener('click',async function(){
      var k=String(parseInt($('kedK').value,10)); if(k==='NaN'){ toast('KPN 숫자를 넣어주세요.'); return; }
      if(!db()[k]){ toast('DB에 없는 KPN이에요.'); return; }
      if(!confirm('KPN'+k+'을(를) 목록에서 삭제할까요? (원본으로 되돌리기로 다시 살릴 수 있어요)')) return;
      var s0=snap(), e=eds(true);
      if(base()[k]) e[k]=null; else delete e[k];
      if(await persist(s0,'KPN'+k+' 삭제했어요.')) fill(k);
    });
    $('kedExport').addEventListener('click',function(){
      try{
        var d=new Date(), p2=function(x){ return ('0'+x).slice(-2); }, ymd=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
        var out={exported:d.toISOString(),edited:Object.keys(eds()).length,
          format:'DB: KPN -> [EPD도체중, EPD등심단면적, EPD등지방, EPD근내지방도, 후대두수, 부KPN, 외조부KPN, 등급, 실측[도체중,등심단면적,등지방,근내지방도] 또는 null]',DB:db()};
        var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kpn_db_'+ymd+'.json';
        document.body.appendChild(a); a.click(); setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); },800);
        toast('kpn_db_'+ymd+'.json 을 내려받았어요.');
      }catch(e){ console.warn('내려받기 실패',e); toast('내려받지 못했어요.'); }
    });
    $('kedBulkGo').addEventListener('click',async function(){
      var lines=$('kedBulk').value.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
      if(!lines.length){ toast('붙여넣을 내용이 없어요.'); return; }
      var s0=snap(), e=eds(true), ok=[], miss=[], bad=[], same=0;
      lines.forEach(function(line,li){
        var t=line.split(/[\t, ]+/).filter(function(x){ return x!==''; });
        if(t.length>0 && isNaN(Number(t[0].replace(/,/g,'')))) { if(li===0) return; }   // 머리글 줄은 건너뜀
        if(t.length<6){ bad.push(line); return; }
        var k=String(parseInt(t[0],10)), v=t.slice(1,6).map(num);
        if(k==='NaN'||v.some(function(x){ return x===null||isNaN(x); })||v[0]<0||Math.floor(v[0])!==v[0]){ bad.push(line); return; }
        var r=db()[k]; if(!r){ miss.push(k); return; }
        var rec=r.slice(); rec[4]=v[0]; rec[8]=[v[1],v[2],v[3],v[4]];
        if(sameRec(r,rec)){ same++; return; }
        var b=base()[k]; if(b&&sameRec(b,rec)) delete e[k]; else e[k]=rec;
        ok.push(k);
      });
      var res='<b>'+ok.length+'건 반영</b>'+(same?' · 변화 없음 '+same+'건':'')+(miss.length?'<br>DB에 없는 KPN '+miss.length+'건: '+esc(miss.join(', ')):'')+(bad.length?'<br>형식이 맞지 않는 줄 '+bad.length+'건: '+esc(bad.slice(0,5).join(' | '))+(bad.length>5?' …':''):'');
      if(!ok.length){ $('kedBulkRes').innerHTML=res; return; }
      if(await persist(s0,ok.length+'건 반영했어요.')){ $('kedBulkRes').innerHTML=res; $('kedBulk').value=''; }
      else VETEDITS.__kpn__=s0;
    });
  };
})();

</script>
<script>showEntryGate(init);</script>
</body></html>
