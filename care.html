<p class="bx-num"><span class="bxn" data-n="1">•</span><span><a href="medicine.html#calf" style="color:var(--primary-dark);font-weight:600;">내과학 송아지</a>: 4-4 이유의 실패와 질병(영양·군·환경 스트레스, 관찰 포인트, 후보우 지표)</span></p>
</div>
<div class="bx"><div class="bx-title">4-1 이유기의 발육과 영양생리적 변화</div>
<p class="bx-num"><span class="bxn" data-n="2">•</span><span>가축인 송아지의 이유는 기본적으로 인위적인 통제 아래 이루어진다. 모자 분리, 인공포유나 로봇 포유의 중지에 의해 액상사료인 우유의 급여가 중지되고, 급여되는 주된 사료원이 곡물이나 조사료 등의 고형사료로 이행한다. 이유는 송아지의 몸에 있어 그때까지의 단위동물과 같은 비반추동물적인 소화·대사에서 "진정한 반추동물"로서의 소화·대사로 전환되어 가는 전환점이라 할 수 있다. 본 절에서는 기본 정보로서 이유기의 ①제1위(루멘)의 발달, ②대사나 내분비의 영양생리적 변화, 그리고 ③육용 및 유용 송아지 각각의 몸의 성장 특징에 초점을 맞춘다.</span></p>
<p class="bx-num"><span class="bxn" data-n="3">•</span><span>(하가 사토시(芳賀 聡))</span></p>
<div class="bx-sub"><div class="bx-subtitle">제1위의 발달</div>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>송아지의 이유기 및 이유 후에 건강을 유지하고 성장을 정체시키지 않기 위해서는 고형사료를 섭취시켜 제1위의 소화를 촉진하는 것이 필요하며, 액상사료에서 고형사료로의 원활한 이행이 중요하다. 이를 위해서는 이유기까지 제1위를 형태적·생리적으로 충분히 발달시켜야 한다¹⁾. 현재는 유용 송아지를 6~8주령 정도에 이유하는 이른바 조기이유 방식이 일반적인 기술로 이용되고 있다. 이 기술은 후술하는 과학적 근거에 기반한 것으로, 포유 초기부터 영양가가 높은 고형사료를 섭취시킴으로써 제1위의 발달을 촉진하는 것을 목적으로 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">송아지 제1위의 성장</div>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>포유기 중 고형사료를 서서히 섭취하게 됨에 따라, 불과 생후 2개월 정도 사이에 송아지 제1위의 형태와 기능은 극적으로 변화한다. 3개월령 송아지의 제1위는 기관의 중량으로서는 아직 작지만, 소화관 전체에서 차지하는 비율, 나아가 기능이나 형태도 성우 수준으로 발달하여 에너지원을 글루코스에서 휘발성지방산(VFA)으로 완전히 변화시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>출생 시 송아지의 제1위 상피조직은 형태적으로도 대사기능적으로도 미발달 상태에 있다²⁾. 신생 송아지의 제1위 상피조직은 성우에서 보이는 것과 같은 고도로 각질화된 특징이 인정되지 않는다³⁾. 또한 성우에서 보이는 것과 같은 제1위 점막조직의 유두돌기에서의 케톤체 생성능, 즉 낙산에서 β-히드록시낙산(BHBA)이나 아세토초산으로 변환하는 대사기능을 갖고 있지 않다²⁾. 신생 송아지는 2주령 이후부터 서서히 고형사료를 섭취하기 시작한다. 이에 따라 시작되는 제1위 발효에 의해 제1위의 형태적 및 대사기능적 발달이 촉진된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>제1위의 형태적 발달은 둘로 나눌 수 있다. 즉 유두돌기의 발달과 제1위 용적의 증대이다. 제1위 상피의 정상적인 발달이 진행되기 위해서는 실질적인 제1위 발효가 확립되어 있어야 한다. 즉 유두돌기가 정상적으로 발달하기 위해서는 제1위강 내에 VFA의 존재가 필요하다⁴⁾. 송아지를 1개월령까지 우유만으로 사육한 경우에는 건초 및 곡류를 함께 급여한 송아지에 비해 제1위 중량⁵⁾, 용적⁵˒⁶⁾, 유두돌기의 발달²˒⁵⁾, 각질화 정도³⁾, 색소침착⁵⁾ 및 근층의 발달²˒⁵⁻⁷⁾이 제한된다. 또한 Lane과 Jesse⁸⁾는 어린 양에서 VFA를 생리적인 농도로 제1위에 투여한 경우 유두돌기의 길이가 증가했다고 보고하였다. 한편 비닐 끈²⁾, 플라스틱 스펀지⁵⁾, 플라스틱 큐브⁹⁾, 톱밥⁶⁾ 등 제1위 내에서 불활성인 물질을 이용하여 사료에 의한 물리적 자극을 모방했을 때에는 유두돌기에 실질적인 발달이 인정되지 않았다. 그러나 이들에 의한 제1위 내 물리적 자극에 의해 제1위의 조직 중량, 근층, 용적의 발달은 촉진된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>이상으로부터, 제1위의 형태적 및 기능적 발달을 위해서는 물리적 요인(사료의 물리적 자극)과 화학적 요인(발효산물)의 양자가 필요함이 분명하다. 고형사료의 섭취는 액상사료의 섭취와 달리 제1위 내로의 물리적 자극 및 미생물의 증식과 VFA 산생을 촉진하며, 이것이 제1위 발달의 방아쇠가 되고 있음은 분명하다¹⁰⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제1위 유두돌기의 발달과 VFA</div>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>제1위 유두돌기의 발달을 촉진하는 물질과 그 기서에 대한 연구가 오래전부터 활발히 이루어져 왔다. 프로피온산나트륨 및 낙산나트륨을 투여하면 송아지의 제1위 유두돌기는 현저히 발달하지만, 초산나트륨, 염화나트륨 및 글루코스의 투여에서는 이러한 발달이 보이지 않았다⁴˒⁵⁾. 프로피온산염과 낙산염의 혼합물을 이유용 농후사료에 첨가하면 제1위 점막상피의 각화층 두께가 증가하는 것이 송아지³⁾ 및 어린 양¹¹⁾에서 인정되었다. 또한 송아지¹²⁾ 및 어린 양¹¹⁾에서 사료 중 농후사료의 비율을 늘리면 제1위 근층에는 변화를 가져오지 않지만 유두돌기의 밀도와 높이를 증가시켰다는 결과도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>Flatt 등¹³⁾은 주요 VFA(낙산, 프로피온산, 초산)의 나트륨염을 직접 제1위 내에 투여하고 제1위 상피의 발달을 관찰하였다. 그 결과 낙산염이 제1위 상피의 발달에 가장 큰 영향을 미치고, 다음으로 프로피온산의 영향이 크다는 것을 밝혔다. 이 순서는 제1위 상피에 의해 대사되는 유기산의 순서와 일치한다¹⁴⁾. 유두돌기의 발달을 유발하는 원인 중 하나로, 제1위 상피에서의 낙산과 프로피온산의 대사가 제1위를 거치는 혈류량의 증가를 가져온다는 점이 거론되어 왔다⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>최근 연구에서는 낙산 혹은 프로피온산이 직접적으로 제1위 내에서의 유전자 발현을 촉진하고 있을 가능성도 제기되고 있다⁹˒¹⁵⁾. 또한 제1위 상피세포의 분화와 대사활성에 관계하는 유전자 발현이 VFA에 의해 증가하는 것도 밝혀져 있다¹˒¹⁶⁾. Mentschel 등¹⁷⁾은 VFA의 종류가 유두돌기 발달에 미치는 영향을 검토하여, 낙산과 프로피온산이 유두돌기 길이에 미치는 자극 효과의 증가는 세포의 유사분열 속도로 설명된다고 하였다. 나아가 그들은 점막조직 세포의 아포토시스 속도에 대한 영향이 낙산은 프로피온산의 1/3에 불과함을 밝히고, 낙산은 제1위 점막세포의 아포토시스에 특이적인 저해 효과를 가진다고 결론지었다. 이러한 결과로부터도 VFA 중에서 낙산이 가장 제1위 상피세포의 분화를 촉진하고 유두돌기를 발달시킨다는 것이 분명하다. 곡류를 주체로 하는 농후사료는 제1위 내 발효에 의해 프로피온산과 낙산을 많이 생성한다. 따라서 이유까지의 기간에 농후사료를 인공유(스타터)로서 많이 섭취시키면 조기에 제1위 유두돌기가 발달하므로, 이유기의 고형사료로의 조기 및 원활한 이행과 이유가 가능해진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">반추와 제1위 운동성의 변화</div>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>제1위의 운동기능도 중요한 발달 요소이며, 제1위벽 근층의 발달과 관련되어 있다. 섭취한 사료가 충분히 발효·분해를 받으려면 제1위의 운동에 의한 위 내용물의 교반이 불가결하다. 나아가 제1위의 운동은 반추나 트림(애기)과 관련되어 있으며, 이들은 제1위에서의 발효를 촉진시키거나 항상성을 유지하는 데 매우 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>반추는 ①사료를 재저작함으로써 발효를 촉진하는 기능, ②사료를 미세화함으로써 그대로의 크기로는 제3위로 흘러가지 않는 사료의 유동을 촉진하는 기능, 그리고 ③재저작에 따라 유출되는 타액의 연하에 의해 제1위 내 pH를 안정화시키는 기능을 가진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>출생 시의 송아지는 제1위의 운동기능이 미발달이기 때문에 반추도 트림도 하지 않는다. 그러나 고형사료의 섭취와 그에 따른 제1위 근층의 발달에 의해 송아지는 반추나 트림을 시작하게 된다. 송아지의 반추 발달 정도는 주령과 고형사료 섭취량에 영향을 받는다¹⁸˒¹⁹⁾. Swanson과 Harris²⁰⁾에 따르면, 전유, 이유용 농후사료, 건초로 육성한 송아지의 1일당 반추 시간은 1주령에서도 관찰되기는 하나 47분으로 적었지만, 주령과 함께 증가하여 7주령에서는 296분, 15주령에서 376분임을 관찰했다고 한다. 다른 연구에서도 송아지는 고형사료를 섭취하기 시작하면 3주령까지는 반추를 시작하고¹⁹˒²¹˒²²⁾, 이유까지의 기간에 1일 5시간 정도에 달한다고 보고되어 있다²³˒²⁴⁾. 나아가 고형사료의 섭취량이 증가함에 따라 규칙적인 제1위, 제2위의 운동이 일어나기 시작하고 그 강도도 높아진다고 한다¹⁸⁾. 제1위의 운동과 반추의 발달은 연동하고 있으며, 양자의 발달에는 조사료 섬유에 의한 물리적 자극과 제1위 내 발효산물이 필요하다고 되어 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">급여사료와 제1위의 발달</div>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>농후사료와 조사료의 구성비나 그 섭취량이 소의 제1위액 VFA 농도와 유기산 조성에 영향을 미친다는 것은 성우를 이용한 많은 연구에서 밝혀져 있다. 이유기 송아지의 제1위에서도 사료 구성의 변동에 의해 제1위 내 발효 패턴이 변화할 것으로 예상된다. 이러한 VFA 조성의 변동과 연동하여 제1위 발달의 양상도 달라질 가능성이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="16">•</span><span>Nocek 등²⁵⁾은 8주령부터 20주령까지 농후사료만을 급여한 송아지는 조사료만을 급여한 송아지보다 제1위의 발달이 우수하고, 제1위 조직은 무겁고 제1위 상피는 더 많은 점막과 근층을 갖고 있었다고 보고하였다. 이러한 농후사료에 의한 제1위 발달 양상은 농후사료에 포함된 성분의 조성에 따라서도 변동할 가능성이 있다. Suárez 등²⁶˒²⁷⁾은 농후사료 중 탄수화물원이 제1위 발효와 제1위 발달에 미치는 영향을, 펙틴 주체(비트펄프), 섬유 주체(대두피+옥수수 종피), 전분 주체(옥수수+보리)의 펠릿화 사료를 7일령부터 8주령까지 급여하여 검토하였다. 그 결과 제1위 내 총 VFA 농도는 전분 주체 사료를 급여한 송아지에서 다른 2개 사료를 급여한 송아지보다 약간 낮은 값을 보였으나, 프로피온산의 비율은 5%가량 높은 값을 보였다. 또한 낙산의 비율은 섬유 주체 사료를 급여한 경우에 다른 2개 사료보다 낮았다. 나아가 제1위의 중량은 전분 주체 사료를 급여한 송아지에서 가장 작았다. 그러나 섬유 주체 사료를 급여한 경우에는 점막층의 두께가 최소이고, 반대로 근층의 두께는 최대였다. 이들 결과는 앞서 말한 제1위 내 VFA 조성에 의한 융모 발달 촉진의 차이나 사료 섬유에 의한 물리적 자극에 의한 근층 발달과 관련되어 있는 것으로 보이며, 포유기에 급여하는 농후사료의 탄수화물원 종류에 따라 제1위 발달의 양상이 현저히 변화함을 의미하는 것일 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>제1위의 발달은 사료의 조농비 혹은 펠릿화 사료의 물리적 구조의 변화(구성 사료의 분쇄 유무)에 따라 달라질 가능성이 있다. 큰 사료 입자 크기 및 조사료원의 부피(かさ) 증대는 제1위벽의 물리적 자극을 증가시켜 제1위 운동을 높이고, 근층 발달과 용적 증대에 기여한다²⁸˒²⁹⁾. 거칠게 혹은 중간 정도로 분쇄한 농후사료는 미분쇄 혹은 펠릿 가공한 농후사료보다 제1위 용적과 근층을 증가시키는 것으로 나타나 있으며, 이는 가공 정도나 농후사료의 입자경이 농후사료의 제1위 용적과 근층 증가에 대한 자극 효과에 영향을 미칠 수 있음을 의미한다³⁰⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span>조사료원(옥수수 사일리지, 볏짚 및 화본과 건초)을 바꾸어 8주령까지 송아지에 급여하고 제1위의 발달을 검토한 Suárez 등³¹⁾의 연구보고에 따르면, 조사료의 종류에 따라서는 제1위 중량, 점막층, 근층의 두께 등에 큰 차이는 인정되지 않았다. 제1위의 발달을 위해 조사료의 물리성이 필요한 것은 틀림없겠으나, 조사료 종류의 조작에 의해 제1위 발달 촉진을 꾀하는 것은 어려울지도 모른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>이유기 송아지 제1위의 조기 발달에는 농후사료의 급여가 유효하지만, 농후사료 전분의 제1위 내 분해성에 대해서는 주의가 필요하다. 즉 가공이나 종류에 따라 제1위 내 전분 분해속도가 빠른 사료를 송아지에 다급하는 것은, 성우와 마찬가지로 제1위에서의 과도한 VFA나 유산의 산생과 큰 폭의 pH 저하를 가져와 산독증이나 대사장애로 이어질 수 있다. 특히 제1위의 발달 단계에 있는 이유기의 송아지에게 이러한 상황은 오히려 발달을 저해하여 그 후의 생산에 영향을 미칠 가능성이 있으므로 피해야 한다³²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>(우에다 고이치로(上田宏一郎))</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">영양생리적 변화</div>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>여기서부터는 앞서 기술한 제1위의 발달에 맞추어 송아지가 이유에 걸쳐 반추동물로서의 영양생리학적 특성을 획득해 가는 과정에 대해, 영양대사 기능이나 내분비의 변화에 주목하여 개요를 기술한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">탄수화물 대사와 에너지 대사의 변화</div>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>국내의 사양 현장에서 전형적인 6주령 조기이유를 실시한 홀스타인종 수송아지에서 이유 전(1 및 3주령)과 이유 후(8, 13 및 19주령) 기간의 혈장 중 대사산물 농도의 변화가 보고되어 있다³³⁾. 혈장 중 글루코스 농도는 이유에 걸쳐 서서히 저하하여 이유 후(8주령 시)에 가장 낮아졌다. 그 후 19주령에 걸쳐 다소 농도가 증가하지만 이유 전과 비교하면 낮은 경향에 있었다. 한편 혈장 중 초산 및 BHBA 농도는 이유 후 현저히 증가하여 13주령 시점에서 이미 피크 또는 플라토 값에 달하였다. 혈장 중 초산 농도는 제1위 내 발효 상태를 나타내는 지표이고, 혈장 중 BHBA 농도는 발효 상태에 더하여 송아지의 경우 특히 제1위 점막에서의 낙산 대사활성과 수송능을 나타내는 지표이다. 이상의 혈장 중 대사산물 농도의 변화로부터, 이유 전에는 에너지원을 우유 섭취 유래 글루코스에 의존하던 대사기능이 이유를 거쳐 제1위의 발달에 따라 고형사료 섭취에 기반한 제1위 내 발효에서 생기는 VFA를 에너지원의 주체로 하는 대사기능으로 전환되어 감을 알 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>나아가 이유에 의해 에너지원이 글루코스 주체에서 VFA 주체로 전환되어 감을 뒷받침하는 연구 결과를 제시한다. 먼저 공장 부위에서 글루코스를 흡수하기 위해 필요한 수송체인 나트륨·글루코스 공수송체(SGLT1)의 mRNA 발현량은 이유 전에 비해 이유 후에는 상당히 낮다³⁴⁾. 이는 외래성 글루코스량(우유 유래)이 이유에 의해 감소함과 동시에 송아지 장관의 글루코스 흡수능도 낮아져 있음을 의미한다. 또한 Hayashi 등³⁵⁾은 이유 전(4 및 6주령)과 이유 후(13 및 24주령)의 홀스타인종 송아지를 이용하여, 안정동위원소인 ¹³C, ²H 글루코스를 구사한 동위원소 희석법으로 글루코스의 대사회전속도(단위시간당 영양소의 대사량)와 리사이클 속도(단위시간당 영양소의 재순환량)를 구하는 키네틱스 실험을 실시하였다. 그 결과 이유 후에는 글루코스의 대사회전속도 및 리사이클 속도가 큰 폭으로 저하하고, 또한 체중당 글루코스 풀 사이즈(절대량)도 작아지는 것을 알았다. 이는 이유 이후에는 송아지의 몸에서 글루코스 이용이 이유 전에 비해 감소하고 있음을 의미한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="24">•</span><span><i>그림 4-1-1 사료 급여 전후의 혈중 대사산물 및 인슐린 농도 — 4주령 송아지에는 대용유를 급여하고, 8 및 13주령 송아지에는 스타터를 급여하였다(이유는 7주령에 실시). 혈장 글루코스(mg/dL): 4주령은 급여 전 약 80~90에서 급여 후 60분에 약 135까지 상승 후 120분에 약 115로 저하, 8·13주령은 약 85~90으로 거의 평탄. 혈장 인슐린(ng/mL): 4주령은 약 0.5에서 90~120분에 약 4.4~4.7까지 상승, 8·13주령은 약 1에서 약 2.2~2.4로 완만히 상승. 혈장 케톤체(μM): 4주령은 약 10~30으로 평탄, 8·13주령은 약 300에서 120분에 약 730~760으로 상승. 혈장 중성지방(mg/dL): 4주령은 약 15에서 90분에 약 40으로 상승, 8·13주령은 약 17~21로 평탄.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>이유기 송아지의 글루코스 이용 변화에 대해 간장에 주목하여 조금 더 깊이 들어가 보자. 체내에서 글루코스 이용이 왕성한 경우, 식이 유래(외인성) 글루코스 공급이 없는 동안 글루코스 요구를 충족시키려면 내인성 글루코스, 즉 스스로의 체내에서 글루코스를 생성할 필요가 있다. 그 생성 경로로 대표적인 것이 간장에 저장된 글리코겐의 분해 및 당 이외의 기질로부터 글루코스를 생성하는 간장의 당신생을 포함하는 코리 회로이다. 앞서 말한 이유 전후 기간(1, 3, 8, 13 및 19주령)의 조사에서는³³⁾ 19주령 시의 간장 중 글리코겐 저장량이 이유 전 3주령 시의 약 6배 이상이었으며, 이유 후의 성장에 따라 간장의 글리코겐을 분해하여 글루코스를 얻을 필요성이 낮아지고 있을 가능성이 시사되었다. 코리 회로에서는 혈장 중의 유산이 간장으로 운반되어 피루브산으로 대사되고 당신생 기질로서 글루코스로 재생되어 다시 말초조직에서 이용된다. 그러나 이유 전에는 혈장 중 유산 농도가 높고 이유 후에 낮아져 있었다. 나아가 당신생의 초기 경로인 「유산→피루브산→옥살로초산→포스포에놀피루브산」을 촉매하는 율속효소인 피루브산 카르복실라아제(PC) 및 포스포에놀피루브산 카르복시키나아제(PEPCK)의 간 조직 중 효소활성이 이유기에 걸쳐 저하하고 있으며, 특히 PC는 mRNA 발현량도 저하하고 있음을 알았다. 즉 이유 전에 비해 이유 후에는 유산을 기질로 한 간 당신생의 기여가 유전자 수준에서 하향 조절되어 글루코스의 리사이클이 감소한다. 이 점에서 Hayashi 등³⁵⁾의 결과와 일치한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>다음으로 당대사 조절에 중요한 인슐린의 혈중 동태의 특성에 대해 기술한다. 그림 4-1-1에 포유기(4주령) 및 7주령 이유를 실시한 이유 후(8주령 및 13주령)의 홀스타인 송아지에서 사료 급여 전후 시간의 혈장 중 글루코스, 중성지방(TG), 케톤체 및 인슐린 농도를 나타냈다. 4주령의 대용유 섭취 후에는 혈장 중 글루코스 및 TG 농도가 증가하지만, 이유 후의 스타터 섭취 후에는 증가가 보이지 않게 된다. 한편 스타터 섭취 후에는 혈장 중 케톤체 농도가 증가한다. 이때 동화호르몬인 인슐린의 혈장 중 농도는 이유 전후 어느 쪽에서도 사료 섭취 후의 영양 흡수에 응답하여 증가한다. 포유기의 인슐린 분비 인자는 주로 글루코스였던 데 비해, 이유 후에는 제1위 내 발효로 산생되는 VFA(특히 프로피온산이나 낙산)가 된다. 포유기 쪽이 사료 섭취에 대한 분비 응답이 큰 것은 액상사료의 소화흡수 속도가 빠르기 때문이라고 생각된다. 이유 후에는 사료 섭취에 대한 인슐린 분비 응답은 포유기에 비해 작지만, 혈중 기초 수준은 포유기보다 높아진다. 이는 제1위를 사용한 단속적인 사료 소화나 영양 흡수를 반영하고 있는 것으로 추찰된다. 스타터 중에는 많은 전분이 포함되지만(건물 중 24~40%), 스타터 섭취 후의 혈장 글루코스 농도는 증가하지 않고 오히려 약간 감소한다. 사료 중의 전분은 제1위 내에서 그 대부분이 VFA가 되어, 소화관에서 흡수되는 글루코스는 거의 없어진다. 스타터 섭취 후 혈장 중 글루코스 농도의 미감은 사료 섭취 후의 인슐린 분비에 의한 혈당 저하라고 추찰된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>이상과 같이 송아지의 이유기에는 진정한 반추동물로서의 탄수화물 대사와 에너지 대사로의 시프트(변화)가 일어나고 있는 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소화관 호르몬으로 보는 이유기의 내분비적 변화</div>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>동물의 몸 안에서 영양소의 소화, 흡수, 대사 그리고 성장 등은 다양한 호르몬의 작용을 통한 내분비적 조절을 받고 있다. 또한 근년 소화관이나 지방조직 등 지금까지 내분비기관으로 분류되지 않았던 기관 부위에서도 온갖 호르몬이 합성·분비되고 있음이 보고되고 있다. 소에서는 특히 이유기와 같은 섭취 영양소의 변화에 연동하여 분비나 작용이 변화하는 호르몬이 있음이 밝혀지고 있다. 여기서는 다양한 호르몬 가운데 그렐린, 렙틴과 콜레시스토키닌에 대해 송아지의 이유기에 관한 지견을 기술한다. 또한 각 호르몬의 생리학적 기초 정보의 상세는 우수한 총설이나 해설이 생리학 전문서 등에 있으므로 그쪽을 참조하기 바란다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="29">•</span><span><b>그렐린(Ghrelin)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="30">•</span><span>그렐린은 위(반추동물의 경우 주로 제4위)에서 산생되는 펩티드 호르몬으로, 하수체에 작용하여 성장호르몬(GH) 분비를 촉진한다. 또한 시상하부에도 작용하여 섭식 항진 작용도 보이므로, 가축의 발육이나 에너지 대사에서도 중요한 역할을 담당하고 있을 가능성이 매우 높은 호르몬이다. 사람을 비롯한 단위동물의 경우 그렐린의 혈중 동태는 식후에 저하하는 것으로 알려져 있으며, 특히 글루코스의 혈중 투여에 의해서도 혈중 그렐린 농도의 저하를 초래하는 것으로부터 혈당치가 혈중 그렐린 농도를 조절하는 한 요인으로 생각되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>한편 Fukumori 등³⁶⁾은 이유에 의해 에너지원이 글루코스 주체에서 VFA 주체로 전환되는 송아지의 혈중 그렐린 동태에 대해 조사하였다. 홀스타인 수송아지를 공시하여 7주령 시 이유로 하고, 그 전후 기간의 그렐린 혈중 기초농도를 비교하면 이유 후에 저하되어 있음을 알았다. 또한 이때의 혈중 글루코스 농도는 이유 후 기간에 낮고, 반대로 혈중 초산 농도가 이유 후 기간에 높게 추이하였다. 다음으로 채식 개시 후 120분까지 10분 간격으로 연속 채혈을 실시하여 혈중 그렐린 농도의 동태를 조사한 결과, 이유 전후에 관계없이 채식 개시 후부터 혈중 농도가 저하하고 대략 30~40분 후 이후에는 저치로 추이하였다. 또한 각 주령에서 송아지의 경정맥 유치 카테터로부터 각각 글루코스 용액과 VFA 용액을 실험적으로 단회 투여하고 그 후 60분간 연속 채혈을 실시하여 혈중 그렐린 농도의 동태를 조사한 결과, 매우 흥미롭게도 이유 전후에 관계없이 VFA 투여에 의해 30분 정도의 일과성 혈중 그렐린 농도 저하가 관찰되었다. 그러나 글루코스 투여에서는 이러한 변화가 어느 주령의 송아지에서도 거의 보이지 않았다. 이상에서 특기할 것은, 단위동물에서 확인되고 있는 글루코스의 그렐린 분비 억제는 송아지에서는 보이지 않고, 반추동물의 특징으로서 제1위 내 발효에 의해 생성·흡수되는 VFA에 응답하여 그렐린 분비가 억제 제어를 받는다는 것이 발견된 점이다. 또한 이 VFA 응답성은 아직 혈중 VFA가 거의 존재하지 않는 포유 송아지에서도 보이므로, 이유에 따른 대사 변화에 수반하는 생리 반응이라기보다 반추동물이 생래적으로 갖고 있는 생리 반응일 가능성이 있다. 태아기에 어미소의 영양 상태(혈중 성분)에 의한 영향을 받고 있는지도 모른다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="32">•</span><span><b>렙틴(Leptin)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>렙틴은 주로 지방세포에서 산생되는 펩티드 호르몬, 이른바 아디포카인으로 발견되었으며, 시상하부의 수용체를 통해 강력한 섭식 억제나 에너지 소비 항진 작용을 가져온다. 그 작용에서 그렐린과는 길항적인 작용을 보이는 호르몬이다. 이 렙틴이 위의 점막에서 발현하고 있음이 사람이나 랫드에서 밝혀졌다. 이에 Yonekura 등³⁷⁾은 포유 송아지(3주령), 이유 송아지(6주령 시에 이유한 13주령) 및 육성우(1.5~2세령)의 제1위와 제4위 그리고 십이지장에서의 렙틴 유전자 발현에 대해 조사하였다(RT-PCR법). 그 결과 제1위와 제4위에서의 렙틴 mRNA 발현은 이유 전 3주령의 송아지에서는 인정되었으나,</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>13주령 송아지 및 육성우에서는 인정되지 않았다. 한편 십이지장 조직에서는 모든 소에서 렙틴 mRNA 발현이 확인되었다. 다음으로 이유 효과와 성장 효과를 구별하기 위해 이유시키지 않고 13주령까지 포유를 계속한 송아지를 이용하여 조사한 결과, 제1위와 제4위 및 십이지장에서 렙틴 발현이 확인되었다. 나아가 같은 포유 계속 송아지에 5주령 시부터 매일 식도 경유 튜브로 제1위와 제2위에 VFA 용액을 직접 투여하면 제1위와 제4위에서의 렙틴 발현은 인정되지 않게 되었다. 즉 제1위 내 발효로 산생되는 VFA에 응답하여 그 발현이 억제된 것으로 시사되며, 이유에 수반하여 송아지의 위 렙틴 발현 변화가 일어난다는 것이 발견되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>다음으로 소화관에서의 렙틴 발현 제어 기서에 대해 언급하고자 한다. 소장의 I세포에서 분비되는 콜레시스토키닌(CCK)은 지금까지 소화를 돕기 위한 췌액 등의 분비 촉진이나 단기적인 섭식 억제를 제어하는 것으로 알려져 있던 펩티드 호르몬이다. 랫드 연구에서는 위에서의 렙틴 발현이 이 CCK에 의해 조절되고 있음이 밝혀져 있다. CCK에는 서로 다른 두 가지 특이적 수용체(CCK_A-R, CCK_B-R)가 존재하며, 단위동물의 위에는 CCK_B-R이 존재하고, 위에서의 렙틴 발현은 이 수용체를 통해 이루어지는 것으로 생각되고 있다. 한편 Yonekura 등³⁷⁾의 연구에서는 CCK_A-R 발현이 이유 전 3주령 송아지의 제1위에서 인정되었으나, 이유 후 13주령 송아지 및 육성우에서는 인정되지 않았다. 또한 이 CCK_A-R 발현도 렙틴과 마찬가지로, 이유시키지 않고 13주령까지 포유를 계속한 송아지에서는 제1위에서 발현이 확인되었고, 같은 포유 계속 송아지에 식도 경유 튜브로 제1위와 제2위에 VFA 용액을 투여하면 소실(검출 불가)되었다. CCK_A-R이 제1위에서 우위로 발현하고 있는 데 비해 CCK_B-R은 제4위에서 우위로 발현하고 있었는데, 이유에 수반하는 발현 변화는 제1위에서의 CCK_A-R 발현과 유사하여 3주령 송아지에서 높고 13주령 송아지, 육성우로 성장함에 따라 감소하였다. 또한 이유시킨 경우나 제1위와 제2위에 VFA 용액을 투여한 경우, 이유시키지 않고 13주령까지 포유를 계속한 송아지보다 발현이 감소하는 경향이 있었다. 이상에서 제1위나 제4위에서의 CCK 수용체와 렙틴의 발현은 매우 관련성이 강하며, 이는 이유 전에는 송아지의 위에서의 렙틴 발현이 CCK에 의해 조절되고 이유 후에는 그러한 기능적 역할이 작아져 간다는 변화를 시사하고 있다. 지방세포 유래 렙틴이 장기적인 채식량 조절을 담당하는 데 비해 소화관의 렙틴 및 CCK는 모두 단기적인 채식량 조절을 담당하는 것으로 생각되며³⁸⁾, 그 단기 채식 조절 기구가 이유 전후에 변화하고 있는 것으로 예상된다는 점은 송아지의 발육에 관여하는 매우 흥미로운 지견이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>이상, 이유기에 조직 발현이나 체내 순환이 변화하는 것으로 밝혀진 소화관 호르몬에 대해 소개하였으나, 이들의 생리적 의의에 대해서는 아직 밝혀지지 않은 점도 많다. 또한 이들 이외에도 이유기에 동태가 변화하는 호르몬이 존재한다. 이유기의 내분비 변화는 송아지의 발육이나 영양대사에 밀접하게 관련되는 것이며, 사양관리 기술의 기반으로서 앞으로 한층 더 내분비 연구의 심화에 의한 과학적 지견의 축적이 기대된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">타액 분비 기능의 변화</div>
<p class="bx-num"><span class="bxn" data-n="37">•</span><span>송아지가 반추동물로서의 영양생리 기능을 획득하는 과정에서는 제1위의 점막 발달이나 용적 증가, 미생물총의 구축, 그리고 제1위 운동이나 반추 행동의 발현 등 이른바 제1위 기능 발달이 주목받지만, 이 제1위 내의 항상성을 유지하는 데 있어 타액 분비가 매우 중요하다. 이에 그 중요성과 이유기의 생리적 변화에 대해 서술한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>반추동물 타액의 주성분은 중탄산나트륨(NaHCO₃)과 인산염이며, 완충능이 높고 알칼리성(약 pH 8.2)이기 때문에 제1위 내에서 다량으로 산생되는 VFA를 중화할 수 있다(pH 6~7이 된다). 타액선을 외과적으로 제거하면 제1위 내 pH 저하가 일어나 이상 발효나 산독증이 발생한다. 또한 나트륨 결핍증, 혈액 농축이 일어나 결국 죽음에 이르는 경우도 있다³⁹⁾. 생명 유지 시스템에 제1위 내 발효를 편입하고 있는 반추동물에게 타액 분비는 그만큼 중요한 기능인 것이다. 반추동물에서 타액을 분비하는 타액선은 주로 이하선, 하악선 그리고 설하선이 대표적이며, 턱 주위에 좌우 3쌍 존재한다. 이 가운데 이하선에서 분비되는 타액은 장액성으로 분비 정지기가 없고 중탄산이온(HCO₃⁻)을 많이 함유하기 때문에 제1위 내 항상성을 유지하는 데 가장 중요한 타액선이라 할 수 있다. 약 50년 전에 이미 송아지의 타액 분비량이 주령과 함께 증가한다는 것, 포유만으로 사육하면 그 증가가 억제된다는 것이 보고되어 있었다⁴⁰⁾. 더하여 HCO₃⁻를 생성하는 경로 [H₂O + CO₂ ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻]를 촉매하는 탄산탈수효소(CA)가 이하선의 타액 생성·분비에 중요하다는 것이 밝혀져 왔다. 이하에 이유기의 이하선 중 CA에 착안한 타액 분비 기능에 관한 Kitade 등⁴¹⁾의 연구를 소개한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>이유 전의 1, 3주령 송아지 및 6주령 시에 이유한 7, 13 및 18주령의 이유 송아지를 공시하여 각각에서 이하선 및 이하선 분비 타액을 채취하였다. 조직 중 CA의 효소 활성을 조사한 결과, 주령과 함께 서서히 활성이 증가하여 13주령 시에는 이미 성우와 같은 수준에 도달하였다. 또한 이유 효과와 성장 효과를 구별하기 위해 이유시키지 않고 13주령까지 포유 계속(우유만)을 행한 송아지, 그리고 같은 포유 계속 송아지에 5주령 시부터 매일 튜브로 제1위에 VFA 용액을 직접 투여한 송아지에서는 어느 쪽도 13주령 시에 CA 활성치가 증가하지 않았다. CA에는 몇 가지 아이소자임이 존재하는데, 특히 이하선에서는 분비형인 CA-VI가 특이적으로 발현한다. 이하선 조직 중 CA-VI 단백량에 대해 조사한 결과, 주령에 따른 증가는 확인되었으나 18주령 시의 단백량이 성우의 약 절반이었던 점에서는 CA 효소 활성치 결과와 완전히 일치하지는 않으므로 다른 인자의 영향도 부정할 수 없다. 이유, 포유 계속, 그리고 포유 계속 + VFA 투여한 각 13주령 송아지의 이하선 중량은 각각 약 332, 142 그리고 121 mg/kg체중이었으며, 조직 크기도 타액 분비능에 크게 영향을 미치고 있을 가능성이 있다. 실제 이하선에서 분비되는 타액의 pH와 이온 조성에 대해서는, 2주령 시 타액 pH는 약 7.6~7.7이었으나 주령과 함께 상승하여 13주령 시에는 약 7.9, 그리고 18주령 시에는 약 8.2에 이르렀다. 이온 조성의 동태에서는 주령에 따라 HCO₃⁻가 크게 증가하고, 반대로 염소이온(Cl⁻)이 대폭 저하하는 것이 확인되었다. 한편 포유 계속, 그리고 포유 계속 + VFA 투여한 각 13주령 송아지에서는 pH도 이온 조성도 1주령 시 송아지의 그것들과 거의 같았다. 이상에서 제1위 내 항상성을 유지하는 데 중요한 타액 분비에 대해서는 이하선의 발달, CA 발현과 활성의 증가가 이유기에 일어난다는 것을 알았다. 또한 그 변화의 기서로는 앞서 서술한 소화관 호르몬과 같은 VFA 자극을 요인으로 하는 것이 아니라, 아마도 반추나 제1위 운동 등 물리적 자극에 의한 영향이 강한 것으로 시사되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span><span style="color:var(--ink-soft)">(저자: 芳賀聡·福森理加)</span></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="41">•</span><span>■ 몸의 성장</span></p>
<div class="bx-sub"><div class="bx-subtitle">유용 송아지</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="42">•</span><span><b>성장에 관여하는 대사성 호르몬의 동태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>송아지의 성장은 GH나 IGF-1 등의 대사성 호르몬에 의한 조절을 받는다. 이들 호르몬은 단백질 축적량을 증가시키고 지방조직의 축적을 억제한다. GH는 지방조직에 의한 글루코스 이용을 억제하고 지방 축적량을 저하시킨다. 또한 소화관으로부터의 미네랄 흡수를 조절하여 뼈 성장을 촉진한다. 나아가 GH는 인슐린 감수성을 저하시킴으로써 간 및 지방조직에 의한 글루코스 흡수를 억제한다. 이러한 작용에 의해 뼈 및 근육에 영양소를 우선적으로 분배하는 동시에 간으로부터 IGF-1 분비를 자극하여 이들 조직의 성장을 촉진한다⁴²⁾. 혈중 GH 농도는 포유기에 현저히 높고 이유 후 서서히 저하한다. 한편 혈중 IGF-1 농도는 출생 직후부터 저하하고 그 후 주령에 따라 증가한다(그림 4-1-2). IGF-1은 GH의 자극을 받아 주로 간에서 산생되는 호르몬이지만, GH와 IGF-1의 혈중 농도가 반드시 상관하는 것은 아니다. 혈중 IGF-1 농도는 영양 상태(특히 단백질 섭취량), 성장과 관련이 있으며, 그림 4-1-2와 같이 주령의 영향도 인정된다. 포유 부족이나 이유 후 고형사료 섭취 부족으로 영양 상태가 저하된 송아지에서는 혈중 IGF-1 농도가 낮게 추이한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="44">•</span><span><i>그림 4-1-2 이유 전후 기간 송아지의 혈중 GH 및 IGF-1 농도의 주령에 따른 추이(이유는 7주령에 실시). 혈중 GH(ng/mL): 0주령 약 30 → 2주령 약 52로 정점 → 3주령 약 32, 6주령 약 21 → 이유 직후 7주령 약 9 → 이후 9~13주령 약 4~8로 낮게 추이. 혈중 IGF-1(ng/mL): 0주령 약 74 → 1주령 약 29로 급감 → 4~6주령 약 53~63 → 7~9주령 약 55~60 → 10주령 약 72, 12~14주령 약 80~83으로 상승.</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="45">•</span><span><b>이유 후의 성장</b></span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>포유기의 증체는 액상사료 급여량에 의존하지만, 이유 후의 증체는 고형사료, 특히 스타터 섭취량의 영향을 받는다. 그림 4-1-3에 출생부터 3개월령까지의 이유 전후 기간 송아지의 발육 성적과 고형사료 섭취량의 추이를 나타내었다. 측정에 공시한 송아지는 모두 대용유를 1주령까지 4 L, 2주령까지 6 L, 4주령까지 8 L, 5주령에 6 L, 6주령에 4 L, 7주령에 이유로 하고, 스타터(상한 2.5 kg/일)와 세절 티모시 건초(자유 급여)를 급여받았다. 포육 종료 시(91일령)의 체중으로 120 kg 이상을 달성한 송아지를 고발육 송아지, 100 kg 이상 120 kg 미만이었던 송아지를 중발육 송아지, 그리고 100 kg 미만이었던 송아지를 저발육 송아지로 구분한 결과, 고발육 송아지는 포유량 점감기부터 이유 직후인 6~7주령에 일당증체량(DG)이 일시 저하하였으나 이유 후 곧 회복하였다. 한편 저발육 송아지는 5~7주령의 이유 이행기에 DG가 현저히 저하하였다. 고발육 및 중발육 송아지의 스타터 섭취량은 포유 기간 중인 5주령부터 급속히 증가하여, 이유 시(49일령)의 스타터 섭취량이 고발육 송아지에서 1.60 kg/일, 중발육 송아지에서 1.55 kg/일이었다. 이에 비해 저발육 송아지는 포유 기간 중 스타터 섭취량이 증가하지 않아 이유 시 0.46 kg/일이었다. 또한 고발육 송아지는 스타터 급여 상한으로 설정한 2.5 kg/일에 평균 58일령에 도달하여, 중발육 송아지(73일령)나 저발육 송아지(83일령)에 비해 이유 후 스타터 섭취량의 증가가 양호하였다. 이로부터 포유 기간 중의 스타터 섭취량은 이유 후의 스타터 섭취량 및 이유 후의 발육에 크게 영향을 미친다는 것을 알 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="47">•</span><span><i>그림 4-1-3 주령에 따른 증체 성적과 고형사료 섭취량의 추이 — 91일령 시점의 체중을 기준으로 3군(고발육: 120 kg 이상, 중발육: 100 kg 이상 120 kg 미만, 저발육: 100 kg 미만)으로 나누어 고형사료 섭취량 추이를 나타냄(이유 7주령). 체중(kg): 1주령 세 군 모두 약 42~46 → 14주령 고발육 약 121, 중발육 약 110, 저발육 약 94. 스타터 섭취량(kg/일): 고·중발육은 5주령 약 0.3에서 7주령 약 1.0~1.1, 9주령 약 2.1~2.4를 거쳐 11~12주령에 상한 2.5 도달; 저발육은 7주령 약 0.2, 9주령 약 1.8, 12주령에 2.5 도달. 건초 섭취량(kg/일): 6주령까지 0.3 미만, 13주령 고발육 약 1.3, 중발육 약 0.95, 저발육 약 0.45. DG(kg/일): 0주령 약 0.1~0.2, 3~4주령 약 0.8~0.9; 5주령 고발육 약 1.0, 중발육 약 0.7, 저발육 약 0.15; 6주령 고발육 약 0.8, 중발육 약 0.9, 저발육 약 0.45; 8주령 약 1.0~1.25; 12주령 고발육 약 1.15, 중발육 약 0.9, 저발육 약 1.6.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span><span style="color:var(--ink-soft)">(저자: 福森理加)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육용 송아지</div>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>어미소와 동거시키는 자연 포유는 인공 포유에 비해 번잡한 포유 작업을 어미소에게 맡길 수 있기 때문에 작업량으로서는 축주의 부담이 경감된다. 그러나 흑모화종 번식우의 비유 능력은 개체차가 크고 송아지의 발육은 어미소의 비유량에 영향을 받기 때문에, 송아지의 발육이 불충분한 경우에는 부족한 가소화양분총량(TDN) 및 조단백질(CP)을 보충하기 위해 송아지에 대한 스타터나 양질 조사료의 급여(크리프 피딩)가 유효하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>자연 포유로 육성한 흑모화종 송아지의 스타터 섭취 상황을 그림 4-1-4에 나타내었다. 생후 10일 전후부터 서서히 스타터 채식이 시작된다. 채식의 증가는 2차 함수적이며, 40일령을 지날 무렵부터 섭취량이 급격히 증가한다. 이는 출생 1개월 이내의 송아지는 주로 영양 보급을 모유에 의존하고 있으며, 그 이후에는 부족한 영양분을 고형사료로 보충하게 되기 때문이다. 어미소의 비유량이 평균적(흑모화종에서는 4주령 7.0 kg/일, 8주령 6.3 kg/일 및 12주령 5.6 kg/일)이라면, 체중 75~125 kg에서 체중비 0.9% 정도의 스타터를 급여함으로써 DG 1.0 kg/일 정도를 기대할 수 있다⁴³⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="51">•</span><span><i>그림 4-1-4 자연 포유 중인 흑모화종 송아지의 스타터 섭취량 추이 — 일령(0~100일) 대 스타터 섭취량(g/일) 산포도. 회귀식 y = 46.0 − 1.08x + 0.08x², R² = 0.61. 40일령까지는 대체로 100 g/일 이하, 60일령 약 250~300 g/일, 80일령 약 500~600 g/일.</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="52">•</span><span><b>자연 포유에서의 이유 시기와 성장</b></span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>자연 포유에서의 이유는 종래 5~6개월령에 실시되어 왔다. 그러나 최근에는 어미소의 번식 기능 조기 회복이나 송아지에게 더 많은 스타터 섭취를 촉진할 목적으로, 자연 포유에서도 3개월령 정도의 비교적 이른 시기에 이유가 실시되게 되었다. 이유 시기를 3개월령과 6개월령으로 비교한 시험에서는 3개월 이유 쪽이 조기부터 스타터나 조사료 섭취가 가능해져 비육 중기 이후의 순조로운 발육으로 이어졌다는 보고도 있다⁴⁴⁾. 한편 Higashiyama 등은 조사료 다급 조건하에서는 7.5개월령 이유에 비해 3개월령 이유에서 포유기 중 발육이 낮고, 이유 시 혈장 중 유리지방산(NEFA) 농도의 상승이 높았던 것(= 에너지 부족)을 보고하고 있다⁴⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>이처럼 이유 시기에 관한 보고는 몇 가지 있지만, 중요한 것은 이유 시의 스타터 등 고형사료의 섭취량이다. 고형사료의 섭취 능력은 송아지의 크기에 영향을 받기 때문에 이유 시에는 어느 정도의 체격이 필요하다. 그림 4-1-5에는 이유 시(3개월령)의 체중과 9개월령 시 체중의 관계를 나타내었다. 이유 시 체중이 95~115 kg인 송아지라면 9개월령에 체중 270~300 kg을 기대할 수 있다. 한편 이유 시 55 kg인 송아지는 9개월령에 200 kg 정도까지밖에 발육하지 않았다. 즉 이유에는 일정 이상의 체격이 필요하며, 너무 이른 이유는 그 후의 발육에 악영향을 미치므로 이유 전의 적절한 발육과 이유 시기를 가늠할 필요가 있음을 보여준다. 또한 이 배경에는 최근 주목받고 있는, 포유 기간의 후성유전학적 변화가 그 후의 발육에 영향을 미친다는 대사 임프린팅 기구가 관여하고 있을 가능성도 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="55">•</span><span><i>그림 4-1-5 흑모화종 거세우의 이유 시(3개월령) 체중과 9개월령 체중의 관계 — 이유 시 체중(55~135 kg) 대 9개월령 체중(180~330 kg) 산포도. 회귀식 y = 148.8 ln(X) − 405.9. 이유 시 55 kg → 9개월령 약 190~200 kg, 95 kg → 약 270 kg, 115 kg → 약 300 kg.</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="56">•</span><span><b>인공 포유에서의 이유 시기와 성장</b></span></p>
<p class="bx-num"><span class="bxn" data-n="57">•</span><span>흑모화종에서는 최근 수정란 이식이나 체외수정 기술의 보급에 따른 유용우의 대리모를 통한 육용종 송아지 생산을 배경으로, 대용유와 스타터를 사용한 인공 포유가 이루어지는 경우가 늘고 있다. 흑모화종 송아지에서도 인공 포유한 송아지의 이유는 모자 분리를 수반하는 자연 포유에 비해 스트레스를 주지 않고 원활하게 실시하기 쉽다.</span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>종래 흑모화종 송아지의 인공 포유에서는 400~500 g/일의 대용유를 급여하고, 생후 2~3주령부터는 소량의 스타터 급여를 개시하여 단계적으로 증가시켜 가는 것이 권장되어 왔다⁴⁶⁾. 한편 자연 포유에서는 흑모화종 송아지의 표준 발육에 6 kg/일 이상의 포유량이 필요하며, 이를 대용유로 환산하면 약 1 kg/일의 급여량이 되므로, 종래의 400~500 g/일 인공 포유에서는 대용유 급여량이 적을 가능성이 있다. 대용유로부터의 단백질 섭취량은 송아지의 발육성에 크게 영향을 미치는 것으로 보고되어 있어⁴⁷˒⁴⁸⁾, 최근에는 단백질을 강화한 대용유를 다급하는 강화 포육이 제창되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>강화 포육을 실시할 때 스타터 섭취량은 대용유 급여량의 영향을 받으므로, 대용유를 다급하는 경우에는 스타터 섭취 상황의 파악이 중요하다. 스타터 등 고형사료의 섭취 능력은 송아지의 체격에 의존하는데, 육용 송아지의 출생 시 체중은 계통에 따라 차이가 있어 「기타카(気高)」 등의 증체계와 「다지마(但馬)」 등 체격이 작은 육질계에서는 고형사료 섭취 능력이 다르므로 주의가 필요하다. 또한 지방분이 많은 대용유를 다급하면 지방 급여량이 증가하여 소화 효율이 저하할 가능성이 있으므로 저지방으로 조정된 대용유를 사용할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>흑모화종의 각 계통 간 대용유 급여와 스타터 섭취량의 관계에 대해 다음 시험을 실시하였다. 통상구로서 통상 대용유(TDN 114%, CP 25%, 조지방(EE) 23%) 500 g/일 급여 체계에서 2주령부터 스타터 급여를 시작하여 단계적으로 2.5 kg/일까지 증가시키는 포육 프로그램에서는 어느 계통의 흑모화종 송아지도 스타터를 프로그램대로 섭취할 수 있었고(그림 4-1-6), 포유기의 평균 증체는 0.7 kg/일이었다. 한편 다급구로서 단백질 함량을 높이고 지방 함량을 낮춘 강화 포유용 대용유(TDN 108%, CP 28%, EE 18%)를 최대 급여량 1.2 kg/일로 급여한 우군에서는 포유기의 증체 평균이 0.94 kg/일이었다. 스타터 섭취량에 대해서는 기타카계(1대조) 송아지는 거의 프로그램대로 섭취하였으나, 다지마계(1대조) 송아지에서는 60일령까지 0.17 kg 이상으로는 증가하지 않았고, 대용유 급여량을 줄이기 시작한 70일령부터 섭취량이 상승하였다(그림 4-1-7). 양 구 모두 대용유는 급여량대로 섭취하였으나 스타터 섭취에는 다급구에서 차이가 생겼다⁴⁹⁾. 이는 스타터 섭취량이 대용유 급여량에 영향을 받는다는 것, 대용유 급여량을 증가시킨 경우 종래의 대용유 급여량에 비해 높은 증체가 기대되지만(표 4-1-1, 그림 4-1-8) 스타터 섭취량과 증체는 송아지의 계통에 따라 차이가 생긴다는 것을 보여준다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="61">•</span><span><i>그림 4-1-6 통상 대용유 급여 프로그램과 각 계통의 스타터 섭취량 추이 — 14~91일령, 스타터 섭취량(현물 kg/일). 대용유 급여량은 0.5 kg/일로 일정하다가 77일령 이후 점감하여 91일령에 약 0.1. 기타카계·다지마계·후지요시(藤良)계 모두 스타터 급여량 선과 거의 일치: 42일령 약 0.35, 56~63일령 약 0.6, 70일령 약 0.9, 77일령 약 1.2, 84일령 약 1.6~1.8, 91일령 약 2.2~2.3.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="62">•</span><span><i>그림 4-1-7 대용유 다급 프로그램과 각 계통의 스타터 섭취량 추이 — 14~91일령. 대용유는 14일령 약 0.65에서 35일령 약 1.2 kg/일로 증가하여 63일령까지 유지 후 점감, 91일령 약 0.2. 기타카계는 스타터 급여량 선에 가깝게 섭취(63일령 약 0.6, 77일령 약 1.3, 91일령 약 2.3); 다지마계는 63일령까지 0.2 미만, 70일령 약 0.3, 77일령 약 1.0, 91일령 약 2.3; 후지요시계는 70일령 약 0.55, 91일령 약 2.35.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>표 4-1-1 대용유 급여 수준의 차이가 91일령 이유 시의 체중 및 체격에 미치는 영향.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>구분</th><th>체중(kg) 7일령</th><th>체중(kg) 91일령</th><th>DG</th><th>체고(cm) 7일령</th><th>체고(cm) 91일령</th><th>체장(cm) 7일령</th><th>체장(cm) 91일령</th><th>흉위(cm) 7일령</th><th>흉위(cm) 91일령</th></tr><tr><th>다급구</th><td style="text-align:left">37</td><td style="text-align:left">115.7</td><td style="text-align:left">0.94</td><td style="text-align:left">72.8</td><td style="text-align:left">93.2</td><td style="text-align:left">64.1</td><td style="text-align:left">92.8</td><td style="text-align:left">74.1</td><td style="text-align:left">109.3</td></tr><tr><th>통상구</th><td style="text-align:left">35.8</td><td style="text-align:left">94.3</td><td style="text-align:left">0.7</td><td style="text-align:left">71.3</td><td style="text-align:left">88.2</td><td style="text-align:left">61.9</td><td style="text-align:left">87.9</td><td style="text-align:left">73.6</td><td style="text-align:left">103.0</td></tr><tr><th>통계처리</th><td style="text-align:left">ns</td><td style="text-align:left">**</td><td style="text-align:left">**</td><td style="text-align:left">ns</td><td style="text-align:left">**</td><td style="text-align:left">ns</td><td style="text-align:left">ns</td><td style="text-align:left">ns</td><td style="text-align:left">**</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="64">•</span><span>※ 주) ** P<0.05</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="65">•</span><span><i>그림 4-1-8 각 계통의 대용유 급여량과 증체(문헌 49에서 인용·개변) — 0~91일령 체중 추이(kg). 7일령 약 30~45에서 91일령: 다급구 기타카 약 127, 다급구 후지요시 약 115, 다급구 다지마 약 102, 통상구 기타카 약 99, 통상구 후지요시 약 91, 통상구 다지마 약 90.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>인공 포유의 경우 송아지의 이유 월령은 2~3개월령이 일반적이다. 이유에 즈음하여 대용유 급여량을 급격히 감소시키면 에너지 섭취량 부족을 초래하여 이유 후 증체가 저하할 우려가 있으므로, 이유 시의 대용유 급여는 단계적으로 감소시키는 것이 바람직하다. 특히 1 kg 이상의 대용유를 급여한 경우에는 대용유 급여량을 1주일마다 3단계로 나누어 감량하여 대용유 감소 기간을 길게 잡음으로써 원활한 이유가 가능해진다. 또한 대용유 급여량을 줄임에 따라 스타터 섭취량이 증가하면, 소화 속도가 빠른 스타터를 급여하고 있는 경우에는 제1위 내에서 급속한 분해가 일어나 고창 기미가 되는 경우가 있다. 스타터 급여량을 완만하게 증가시키거나 소화 속도가 느린 스타터로 변경하는 등의 대응을 실시해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>이유 시기의 판단에 대해서는, 80 kg 이상의 송아지라면 건물 2.0 kg/일 정도의 사료를 급여함으로써 DG 0.8 kg/일 정도의 증체를 기대할 수 있다⁴⁶⁾. 또한 체중 85~130 kg이라면 약 2.5 kg/일의 고형사료를 섭취할 수 있으며 이유 후의 발육도 양호하다⁵⁰⁾. 한편 포유 기간에 사고로 증체가 부진하거나 쌍둥이 등으로 출생 시 체중이 극단적으로 낮은 송아지는 포유 기간을 연장하여 충분한 체중, 스타터 섭취량에 도달한 후에 이유를 실시할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span><span style="color:var(--ink-soft)">(저자: 武司)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span><span style="color:var(--ink-soft)">일본송아지 4-1 이유기의 발육과 영양생리적 변화.</span></span></p>
</div>
<div class="bx"><div class="bx-title">4-2 이유 전후의 사양</div>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>이 절에서는 포유기에서 이유를 거쳐 육성기로 이행하기까지의, 이유기 송아지의 사양에 대해 구체적인 방법을 다룬다. 이유기의 송아지에게 어떤 사료를 어떻게 급여해야 높은 성적(발육과 건강성)을 얻을 수 있고, 육성기 이후의 생산성으로 이어갈 수 있는가. 먼저 사료의 기본 정보를 재확인한 뒤, 육용 및 유용 송아지의 사양 실제에 대해 각각 생각해 본다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">스타터와 조사료</div>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>먼저 송아지 사양관리에서 「젖」에 관한 설명을 보충한다. 전유(whole milk)란 이른바 모유를 말한다. 흑모화종 등 육용우의 경우는 자연 포육으로 어미로부터 직접 포유되는 경우도 많다. 한편 홀스타인 등 유용우의 경우는 비유우에서 착유한 생유는 기본적으로 생산물로 출하되지만, 일부 생유를 송아지 포육용으로 이용하는 방법도 있다. 대용유(milk replacer)란 사람 또는 로봇이 송아지에게 포유할 때 이용하는, 인공적으로 제조된 밀크를 말한다. 여러 이유로 전유를 사용하지 않는 경우, 대용유 분말을 온수에 녹여 사용하게 된다. 성분을 고안한 다양한 콘셉트의 제품이 존재하지만 비교적 비용이 높아, 효율적인 포육·육성이라는 경영상의 관점에서 그 이용량의 많고 적음이 논점이 되는 경우가 많다(예: 초조기 이유). 인공유란 사람이나 반려동물 등의 분야에서는 앞서 말한 대용유와 같은 뜻인 경우가 많아 혼동하면 헷갈리지만, 송아지 사양관리에서 인공유는 카프 스타터(calf starter)라고도 불리는 고형 사료를 말하며, 일반적으로 「스타터」로 기술되는 경우가 많다. 그래서 이 책에서도 스타터라는 말을 사용한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">스타터</div>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>스타터는 이유 시 미발달 상태인 송아지의 위 구조·기능을 고려한 사료로, 소가 비반추동물에서 반추동물로 이행하기 위해 중요한 고형 사료이다. 주로 포유 기간 중부터 서서히 주어 송아지를 소량부터 익숙하게 하고, 이유기부터 육성기에 들어가기까지의 기간에 급여하는 이행기용 농후사료이다. 스타터의 역할은 주로 ① 이유를 향해 감소 또는 중지되는 밀크(모유 또는 대용유) 급여를 대신해 송아지의 주된 영양·에너지 보급원으로 대체되는 것, ② 제1위(루멘) 안에서 미생물에 에너지를 공급하고 발효 기질이 되어 VFA를 생산시켜 제1위 융모 점막의 발달을 자극하는 것, 이 두 가지이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>제1위 융모 점막의 발달 이상을 피하고 또 융모 사이에 미세한 사료 조각이 끼는 것을 방지하기 위해, 스타터는 충분한 크기의 사료 입자여야 한다¹⁾. 스타터는 그 형상에 따라 매시(분말상), 펠릿, 펠릿 앤드 플레이크의 3종류로 분류된다. 펠릿 앤드 플레이크란 단백질이나 탄수화물(주로 당이나 전분)에 비타민과 미네랄을 포함한 펠릿과, 압편한 곡물 원료(플레이크)를 혼합한 것으로, 이 종류가 국내에서 유통되는 주류 스타터이며(그림 4-2-1), 1.18 mm 이상의 입도를 「충분한 사료 입자 크기」의 기준으로 하여 이런 크기를 포함하는 스타터는 특히 「텍스처 타입」으로 정의된다²⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="74">•</span><span><i>그림 4-2-1 카프 스타터 — 널리 유통되는 펠릿 앤드 플레이크 타입의 곡물형 스타터(왼쪽)와, 발효시킨 알팔파 사료만을 고형 사료로 사용하는 조사료형 스타터(오른쪽).</i></span></p>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>성분으로는 대체로 조단백질(CP) 18~20%, 가소화양분총량(TDN) 72~75% 정도인 것이 많고, 제1위 기능이 미발달한 송아지에게 급여한다는 점에서 바이패스 단백질 원료가 높게 배합된 것이 많다. 또 고형 사료에 익숙하지 않은 단계부터 급여한다는 점에서 기호성과 소화성이 우수한 것이 중요하다. 인공 포유의 경우 스타터 채식량이 이유 시기 판단의 기준이 된다. 하루 채식량이 1 kg을 넘거나, 혹은 3일간 연속해서 500 g을 넘으면 이유 가능한 것으로 본다. 그러나 실제로는 스타터 채식량에 상당한 폭이 있어 개체차가 매우 크다. 그 폭을 고려한 위에서 일본사양표준 젖소(2017)³⁾에서는 추정식을 작성하였으며, 유용 송아지의 스타터 섭취량이 500 g/일을 넘는 것은 포유량 4.5 kg/일인 경우 체중이 70 kg 전후가 되는 6~7주령으로 하고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">조사료</div>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>송아지에게 급여하는 조사료를 표현할 때 「양질의 건초」라고 하는 것이 일반적이다. 구체적으로 양질의 건초란 어떤 것을 가리키는지, 또 포유기부터 이유기에 걸쳐 조사료를 급여하는 것 자체가 권장할 만한 일인지 아닌지, 현재로서는 그 견해가 정리되어 있지 않다. 여기서는 「조사료」에 관한 여러 견해를 다룬다. 다만 현재 명백히 권장되지 않는 것을 먼저 밝혀 둔다. 그것은 과거에 행해져 온 송아지에 대한 건초 다급이다. 과거에는 포유기 송아지에 대해 제1위의 성장을 촉진하기 위해 섬유질이 풍부한 건초 급여가 권장되었다. 그렇게 하면 제1위 용적이 커져 외견상 제1위가 발달한 것으로 여겨졌기 때문이다. 그러나 형태학적 혹은 영양생리학적으로 보면 내부의 융모 발달은 빈약하고 제1위의 기능적 발달은 불충분하므로, 영양 요구를 뒷받침하는 제1위가 되지 못해 그 후의 발육에 지연이 생긴다. 또 충분한 소화가 되지 않고 물리적 자극이 너무 강하면 제1위 식체나 제1위 점막 염증을 초래할 위험이 있다. 현 단계의 논점은 어디까지나 이유에 이르기까지 스타터만으로 좋은가, 아니면 스타터와 조사료를 어떻게 조합해 갈 것인가 하는 점에 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>반복하지만, 송아지에 대한 조사료 급여의 제1의 의의는 영양원으로서가 아니라, 오히려 그 물리적 자극에 의한 제1위 근층의 발달과 용량 확대, 반추 행동의 촉진, 그리고 제1위 내 발효 제어에 관한 효과에 있다고 여겨진다. 일본사양표준 젖소(2017)³⁾에서는 송아지에 대한 건초 급여량은 스타터의 10% 정도로 하고, 20%를 넘는 것은 바람직하지 않다고 한다. 그 이유로, 송아지는 체중당 양분 요구량이 큰 데 비해 제1위 용적이 상대적으로 작으므로 영양가가 높은 고형 사료를 급여할 필요가 있는데, 건초 비율이 늘면 고형 사료 전체의 에너지 농도가 낮아지는 수가 있다. 그래서 이유 시 건초 섭취량 상한을 200 g/일 정도로 해야 한다고 권장하고 있다. 한편 NRC¹⁾에서는 스타터에 충분한 크기의 사료 입자가 있으면 긴 건초는 이유할 때까지 송아지에게 급여해서는 안 된다고 한다. 다만 포유기부터 이유기에 걸쳐 스타터만을 급여하면 제1위 내 pH가 저하되어 루멘 아시도시스나 파라케라토시스가 일어날 가능성이 지적되고 있어, 조사료 병급법이 최근 다시 중시되고 있는 것은 확실하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>이 점에 대해 몇 가지 연구를 소개하며 생각해 본다. 이유를 향해 스타터 급여에 조사료 급여를 더해 감으로써 송아지의 건물 섭취량(DMI)이 증가한다는 보고와, 반대로 감소한다는 보고가 산견된다. 또 1998~2016년에 걸쳐 보고된 유용 송아지에 대한 조사료 급여 효과에 관한 21편의 논문(27개 사양시험 데이터)을 메타분석한 Imani 등⁴⁾의 보고에 따르면, 조사료 급여가 유효한 효과를 발휘하는지 여부는 조사료원, 품질, 양, 사료 크기, 급여 방법, 스타터의 물리성 등 많은 인자가 복잡하게 관계하는 것으로 보인다. 긍정적인 결과를 보인 연구 예를 들면, Nemati 등⁵⁾은 홀스타인 수송아지를 스타터 급여구(C구), 세단 알팔파 건초를 건물 기준 12.5% 스타터에 혼합한 혼합 사료(TMR) 급여구(12.5% AH구), 같은 방식으로 25% 혼합한 TMR 급여구(25% AH구)의 3군으로 나누어 포유기부터 이유기에 걸친 사양시험을 실시하고, 그 발육 등에 미치는 효과를 조사하였다. 세단 알팔파의 크기 구성은 1.18 mm 이하, 1.18~8 mm, 8~18 mm 및 18 mm 이상이 각각 약 38, 35, 26 및 1%였다. 16일령부터 알팔파 건초를 혼합해 TMR로 급여하고 51일령에 이유를 실시하여, 이유 후 70일령까지의 데이터를 얻었다. 그 결과 특히 이유 후에는 알팔파 건초 급여량이 많을수록 DMI가 늘었고, 25% AH구에서는 일당증체량(DG), 복위 및 흉위가 현저히 높아졌다. 사료효율에는 영향이 없었으나 제1위액 pH, 혈중 β-히드록시부티르산(BHBA) 농도도 높아, 루멘 아시도시스 억제와 제1위 점막 기능 향상도 시사되었다. 사료의 장관 내 저류가 체중이나 체격에 영향하고 있을 가능성은 검증의 여지가 있지만, 세단 알팔파 건초를 건물 기준 25%까지 스타터에 혼합함으로써 이유 후 송아지의 성적을 향상시킬 수 있음을 보여 주는 하나의 결과이다. 또 스타터와 세단 건초를 분리 급여하는 경우, 중성세제 불용 섬유(NDF) 함량이 높은 귀리(오트)가 이유 후 제1위 내 환경의 항상성과 제1위 기능 향상에 우수하다는 보고도 있다⁶⁾. 국내 연구²⁾에서는 홀스타인 수송아지를 이용하여, 밀크와 스타터 급여에 더해 건초를 급여하는 구(SH구)와 급여하지 않는 구(SO구)로 나누어 6주령까지 사육하였다. 이때의 건초는 티머시였고, 그 크기는 90% 이상이 1.18 mm 이상이었으며 약 42%가 2.36~4.75 mm 범위였다. 건초 무급여 SO구 5두의 해부 결과, 2두에서 제1위 내에 사료 조각과 털이 부착, 1두에서 모구(털뭉치), 나머지 2두에서 깔짚용 보릿짚이 각각 확인되어 해부한 전 개체에서 어떤 형태로든 이상이 인정되었다. 그에 비해 SH구 5두의 해부에서는 제1위 내용물에 부착물이나 모구 등은 확인되지 않았다. 이상으로부터 건초와 같은 물리성이 있는 조사료의 섭취는 송아지의 이상행동 발현 억제와 제1위 내 환경 개선에 효과가 있음을 보여 주었다. 또 하루 건초 섭취량이 30~50 g/일이라도 품질에 관계없이 반추를 자극하기에 충분한 양임이 제시되었다. 이러한 점으로부터, 농장의 설비 환경이나 사료 조달 등도 포함하여 어떤 콘셉트로 송아지를 키워 갈 것인지에 따라, 조사료 병급법에서 긍정적 효과를 추구해 갈 여지가 많다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>최근 곡물 프리로 사육한 가축 유래 축산물에 대한 시장 요구가 늘고 있다. 그 가운데 포유~이유기에 고형 사료로 곡물 스타터를 전혀 쓰지 않고 조사료만으로 사양하는, 종래법과 완전히 다른 방법이 뉴질랜드에서 고안되었다. 아직 과학적 지견이 부족하고 또 방목 사양을 중시하는 뉴질랜드 낙농을 전제로 한 것이긴 하지만, 국내에도 일부 보급되고 있으므로 소개한다. 앞서 말했듯 송아지에 대한 건초 다급은 단점이 생기지만, 이 사양법에서는 발효시킨 알팔파 사료만을 고형 사료로 사용한다(이른바 조사료형 스타터, 그림 4-2-1). McCoard 등⁷⁾이 실시한 사양시험에 따르면, 사용한 발효 알팔파 사료의 크기는 10 mm 미만, 10~20 mm, 20~30 mm 및 30 mm 초과가 각각 약 45, 15, 10 및 31%로 비교적 긴 것으로 구성되고, 성분은 건물률 약 44%, CP 약 19%, NDF 약 44%, 그리고 대사에너지(ME) 9.3 MJ/kg 건물(DM)로, 알팔파를 원료로 하기 때문에 섬유성이 있으면서 고단백·고에너지성도 갖는다. 송아지의 발육과 건강성에 대해 데이터가 얻어져 있지만, 이 연구에서는 곡물 스타터 사양법과의 비교가 이루어지지 않았으므로(연구 목적이 포유 기간의 검토였기 때문에), 보충으로 하가(芳賀) 등이 독자적으로 실시한 국내 조사 결과(미공표 데이터)를 소개한다. 강화 포유 조건하에서 홀스타인 송아지를 곡물 스타터 급여구와 발효 알팔파 사료를 이용한 조사료 스타터 급여구로 나누어 그 발육 등을 비교하였다. 그 결과, 신생자기부터 순치를 실시함으로써 곡물형 스타터 급여구와 마찬가지로 조사료형 스타터 급여구에서도 자발적 채식이 충분히 가능하였고, 8주령 이유까지 평균 1 kg DM/일을 채식시킬 수 있었다. 또 기호성에는 개체차가 보였다. 전 개체에서 일본 홀스타인 표준 발육치 이상의 초기 발육 수준을 확인하였다. 4일령부터 8주령까지의 체중·체격 변화치에 대해 두 구 사이에 유의한 차는 없었다. 이상으로부터 곡물형 스타터 급여구와 비교하여 동등한 초기 발육을 얻는 것은 가능할 것이다. 한편 이유 시 제1위액 내 미생물총 구성 패턴이나 분변 형상(그림 4-2-2)이 명백히 다른 것으로 판명되어 송아지 소화관의 기능 발달 등에 대한 영향도 시사되지만, 그 체질에 곡물 스타터와 전혀 다른 생리적 영향을 주는지 여부에 대해서는 향후 추가 검토가 필요하다. 새로운 콘셉트를 가진 조사료 이용형 사양법으로서 한층 더 지견의 축적이 불가결하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="80">•</span><span><i>그림 4-2-2 이유기 송아지의 분 형상 차이 — 왼쪽은 발효시킨 알팔파 사료만을 고형 사료로 사용하는 조사료형 스타터를 급여한 송아지의 분. 입경이 비교적 작은 둥근 형태의 분이 연속적으로 배설된다. 오른쪽은 곡물형 스타터를 급여한 송아지의 분. 점도가 있고 뭉쳐서 배설된다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">음수</div>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>이유기 송아지의 음수는 사료와 마찬가지로 매우 중요하다. 송아지의 음수는 출생 후 1주 무렵부터 시작되며, 그 음수량은 서서히 증가해 간다. 밀크를 마시고 있으면 수분은 보급되리라 생각하기 쉽지만, 음수에는 전혀 다른 중요한 의의가 있다. 그것은 스타터 등 고형 사료의 채식과 제1위 내 발효·소화를 촉진하는 것이다. 음수의 경우 포유와 달리 제2위구(식도구)를 경유하지 않고 직접 제1위로 물이 유입된다(포유한 밀크는 흡유 자극 반사에 의해 제4위로 유입된다). 다만 포유 직후에 물을 마시게 하면 제1위가 아니라 제4위로 흘러들어 밀크가 희석되어 소화에 악영향을 미치는 경우가 있으므로 주의가 필요하다. 따라서 물 급여는 포유 후 15분 이상 지나고 나서 해야 한다. 이유기에 걸쳐 스타터나 조사료 섭취량이 늘고 제1위 발달도 진행되는데, 거의 동시에 음수량도 증가하는 것이 중요하다. 음수는 송아지의 스타터 섭취량을 촉진하며, 생후 1개월간 자유 급수한 송아지는 급수하지 않은 송아지에 비해 스타터 섭취량이 1.5배로 증가한다. 또 여름철 폭염 아래에서는 송아지 체내 수분이 빼앗겨 혈액 농축이 일어나기 쉽고 열사병을 일으킬 위험도 있다. 이상으로부터 이유기 송아지는 자유 음수 조건에서 사양하고 항상 신선한 물을 주어야 한다. 겨울철에는 온수를 준비하는 것도 매우 효과적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span><span style="color:var(--ink-soft)">(저자: 芳賀聡)</span></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="83">•</span><span>■ 유용 송아지의 사양</span></p>
<div class="bx-sub"><div class="bx-subtitle">포유 프로그램과 이유</div>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>유용 송아지는 출생 직후 모자 분리되어 모두 인공적으로 포육 관리되므로, 포유량 조절이나 이유 시기를 계획적으로 실시할 수 있다. 앞서 말했듯 이유 후 순조로운 발육을 가능하게 하려면 이유 전에 스타터를 어느 정도 섭취하고 있는 것이 중요한데, 포유 기간 중의 스타터 섭취량은 포유 기간 중의 액상 사료 섭취량에 의존한다⁸⁾(그림 4-2-3). 유용 송아지의 이유 시기는 약 3주령의 초조기 이유부터 반년 이상 포유를 계속하는 방법까지 다양하지만, 6주령에 이유하는 조기 이유법이 일반적이다. 6주령 조기 이유법은 대용유 급여량을 출생 시 체중의 8~10%(약 4 L)로 제한함으로써 조기에 스타터 섭취를 촉진하는 것을 목적으로 하며, 노동력 절감·비용 절감의 관점에서 우수한 방법이라고 생각된다. 출생 시 체중의 8~10% 포유량에서는 보통 DG가 0.34~0.4 kg/일 정도를 보이지만, 추울 때는 열 생산에 에너지를 소모하므로 에너지 부족에 빠지는 경우가 있다. 또 최근 포유기의 DG를 높이면 초산 유량 증가 등 장래의 생산성이 높아진다는 것이 밝혀져⁹⁾, 고영양 포유(약 8 L)를 실시하는 포유 프로그램이 보급되고 있다. 이 때문에 이유 시 체중은 출생 시 체중의 약 2배로 성장해 있는 것이 목표가 된다. 이 방법에서는 DG가 대체로 0.7~1.0 kg/일이 되어 포유기 발육이 향상된다. 자연 포유 송아지는 약 8~12 L 정도의 모유를 어미소로부터 섭취한다고 하며, 성장에 필요한 목표량의 포유를 실시하는 것은 비교적 쉽다. 한편 송아지에게 스타터를 목표량만큼 섭취시키기 위해서는 포유량 조절, 고형 사료에 대한 조기 순치 같은 관리상의 궁리가 필요하다. 인공 포육하의 송아지 포유량 관리는 사람 손에 의한 통제가 쉬운 반면, 고형 사료 섭취량은 송아지의 자발적 섭취에 맡겨지므로 이를 어떻게 조정하는가가 이유 성공·실패의 열쇠가 된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="85">•</span><span><i>그림 4-2-3 포유 기간 중 액상 사료 섭취량과 스타터 섭취량의 관계 — 포유 기간 중 액상 사료 섭취량(kg DM/일, 0.4~1.2)은 평균 스타터 섭취량(kg DM/일, 약 0.2~0.8)과 부의 상관관계가 인정된다(r = −0.82). 문헌 8에서 인용·개변.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">이유 타이밍</div>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>4 L 포유나 고영양 포유를 하고 있더라도 스타터나 건초를 섭취할 수 있는 상황을 만들어 두면, 송아지는 2~3주령 무렵부터 고형 사료를 섭취하기 시작하고 반추를 개시한다. 4주령에 섭취량은 수백 g/일 정도가 되고 그 후 급속히 증가한다. 그러나 스타터 섭취량 증가는 포유량 감소 또는 포유 정지에 의한 공복감에 의해 유발되므로 포유 프로그램의 차이에 영향을 받는다. 이유 타이밍은 스타터 섭취량이 기준이 되며, 4 L 포유법에서는 1,000 g/일의 스타터 섭취량이 3일간 지속되면 이유 가능한 것으로 보고, 대체로 6주령에 달성된다. 한편 고영양으로 포유하면 포유 기간 중 스타터 섭취량 증가가 4 L 포유에 비해 둔해지므로, 종래와 같이 이유하면 설사나 섭취량 부족에 의한 발육 정체에 빠지기 쉬워진다. 그래서 고영양 포유에서는 이유 시기 약 2주 전부터 단계적으로 포유량을 낮추어 스타터 섭취량 증가를 촉진하는 것이 권장된다. 포유기 최대 포유량을 8 L로 하고 이유 2주 전부터 포유량을 점감 급여하는 방법으로 6주령 이유와 8주령 이유를 검토한 결과, 6주령 이유에서는 이유 후 에너지 섭취량 감소가 컸지만, 8주령 이유에서는 포유기에 충분한 스타터 섭취량 증가가 있었기 때문에 이유 후 에너지 섭취 부족이 일어나지 않아 그 후의 발육이 양호하였다¹⁰⁾. 이로부터 고영양 포유에서는 이유 시기를 8주령 정도로 길게 설정함으로써 비교적 이유 쇼크를 줄일 수 있다고 한다. 또 이 이유 시의 스타터 섭취량도 4 L 포유법과 같아서는 고영양 포유와의 에너지 공급량 낙차가 생기므로 1,500 g/일 정도로 보고 있다. 어느 방법에서든 포유를 중단하기 전에 스타터를 충분히 섭취시키고 반추나 분변 성상에 문제가 없음을 확인한 뒤 이유하지 않으면, 이유 직후에 일시적인 에너지 섭취량 감소와 발육 정체를 초래하는 결과가 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">고형 사료 급여에 대하여</div>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>6~8주령 정도에 이유되는 송아지는 이유 후 섭취하는 영양소 대부분을 스타터에 의존하지 않을 수 없다. 이유 후 10~13주령 정도까지는 물과 조사료도 자유 급여하면서 스타터를 자유 채식으로 하는 것이 좋다. 이 시기의 조사료 섭취량은 미량이고 제1위에서의 섬유 발효 기능도 충분하지 않으므로, 발육에 충분한 영양소를 조사료에 의존하는 것은 어렵다. 그러나 조사료는 제1위 용적 증가나 반추 자극 같은 제1위 기능의 항상성 유지에 기여하며, 스타터 섭취량을 높이기 위해서도 포유기부터 급여하는 편이 좋다. 조사료는 송아지 뜻대로 섭취되므로 송아지가 좋아하는 조사료를 사용하는 것이 전제이긴 하지만, 조사료의 종류·품질이나 스타터와의 적절한 급여 비율 등이 논의되고 있다. 또 물 급여도 매우 중요하며, 제1위 내에서 고형 사료를 발효시키기 위해서는 물이 필요하다. 송아지의 고형 사료 섭취량과 음수량은 높은 정의 상관관계가 있어, 건물 1 kg의 고형 사료를 섭취할 때마다 약 4 L의 물이 필요하다(그림 4-2-4).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="88">•</span><span><i>그림 4-2-4 유용 송아지의 음수량과 고형 사료 섭취량의 관계 — 스타터+건초 섭취량(kg, 0~3.5)에 대한 음수량(L, 0~12); 회귀식 y = 3.3584x + 0.0466, R² = 0.9864.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>제1위 기능이 불충분한 채로 이유를 하면, 이유에 따른 공복감으로 다량 섭취된 스타터가 제1위에서 충분히 발효되지 못하고 미소화 전분이 후장으로 이행하여 소화성 설사(대장 아시도시스)를 일으킬 것이 우려된다¹⁰⁾. 고전분 스타터에 비해 고섬유질 스타터는 증체 속도가 저하되지만¹¹⁾, 루멘 아시도시스를 예방할 목적으로 스타터 중 전분 함량 등을 낮추는 것은 설사 예방의 관점에서 유효할지도 모른다. 또 낙산염 보충제 등의 이용으로 조기에 소화관 기능을 발달시키는 접근도 유효하다¹²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>포유기의 체격 발육 개선이나 건강성, 동물복지의 관점에서 앞으로 고영양 포유 프로그램이 보급될 것으로 예상된다. 또 포유 로봇 도입 등으로 빈회 포유나 개체별 포유량 설정이 가능하므로 노동력 면에서도 고영양 포유를 도입하기 쉬워졌다. 한편 고영양 포유는 포유기 스타터 섭취를 억제하기 쉽고, 포유기 신체의 높은 발육과 맞물려 이유기 사양관리가 어려워진다. 앞으로 제1위나 하부 소화관의 고형 사료에 대한 적응 변화를 보다 상세히 이해하여 순조로운 이유를 실현하는 기술 개발이 이유 관리의 고도화에 기여할 것으로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span><span style="color:var(--ink-soft)">(저자: 福森理加)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육용 송아지의 사양</div>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>종래 육용우에서는 어미소에 의한 자연 포유가 주류였고, 이유는 6개월령 무렵에 하는 경우가 많았다. 그러나 최근 인공 포유 기술이 중규모(40~50두) 이상의 번식 경영까지 급속히 확산되고, 나아가 대규모 집단 포육 시설(500두 규모 이상의 캐틀 스테이션)이 각지에 정비되어, 인공 포유로 2~3개월령에 이유하는 비율이 증가하고 있다. 자연 포유에서도 이유 시기가 다소 앞당겨져 3~4개월령에 이유하는 사례가 늘고 있다. 이러한 상황을 감안하여 여기서는 이유기(이행기)에 대해 인공 포유하에서의 사양을 중심으로 검토하고, 자연 포유에 대해서는 필요에 따라 보충하였다. 또한 이 절에서는 인공 포유하의 이유기를 감유 개시~육성기에 고형 사료 섭취 수준이 안정되기 전까지의 단계로 하고, 이유 전후 각 3주 정도를 중심으로 방침을 제시하였다. 포육 방법별 구체적 프로그램에 대해서는 4-3의 「육용 송아지의 이유」항(219쪽)을 참조하기 바란다.</span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>이유를 향해 인공 포육 중에 포유량을 삭감(감유)하면 1주 이내에 고형 사료(스타터, 조사료) 섭취량이 대용유로부터의 영양 공급량 부족분을 보충하도록 증가한다. 이것은 생체의 에너지 항상성을 유지하기 위한 반응이라고 여겨지지만, 감유나 이유로 액상 사료로부터의 에너지 섭취가 급격히 감소한 경우 그에 대한 고형 사료 섭취량 증가는 반응 정도(크기·속도)에 개체차가 크다. 육용 송아지 생산에서는 송아지의 발육이 수익에 큰 영향을 미치므로, 이유기 사양에서는 고형 사료 섭취량 정체에 따른 영양 섭취량 부족이나 발육 저하를 최대한 피하는 것이 중시된다. 그래서 인공 포유하에서 이유를 원활히 하려면 감유 기간은 3주 이상으로 하고 고형 사료 섭취를 촉진하는 것이 바람직하다. 자연 포유의 경우는 3-3(145쪽)에 있는 사양관리 방침에 따라 송아지용 별도 사료(크리프 사료)와 양질의 조사료를 급여하는 것이 포육기·이유기의 기본적인 사육법이다. 다만 이유 시기를 이르게(3개월령) 설정하는 경우, 사전에 송아지의 고형 사료 섭취량이나 체중 등 영양 상태를 확인하고 제한 포유 등을 고형 사료 섭취 촉진법으로 도입하는 것도 검토한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>그림 4-2-5에는 몇 가지 사료 급여 조건에서 에너지 요구량과 사료의 에너지 함량으로부터 체중당 사료 소요량(설계 급여량)을 시산하여, 육성 개시 시(이유 후 2~5주)에 암송아지에서 측정한 체중당 사료 섭취량(사료 섭취 수준)과 비교하였다. 에너지 요구량은 일본사양표준 육우¹³⁾의 조기 이유 송아지 육성에 필요한 양분량을 따라, DG를 1.0 kg/일로 하고 농후사료(건물 중 TDN 83%)와 건초(TDN 55% 혹은 63%) 또는 볏짚(TDN 41%)을 조농비 15:85로 급여하는 전제로 산출하였다. 이 그림은 사료 구성별 사료 소요량과 섭취량의 관계를 체중을 기준으로 모식적으로 나타낸 것이다. 송아지의 사료 섭취량은 이유 후 약 2주에 거의 일정한 수준(체중비 2.5~2.7%)에 도달하며, 육성기 이후의 변동은 완만하다. 그림 4-2-5의 각 사료는 육성 개시 시의 소요량이 섭취 가능한 수준 이하이면 그 후 육성 사료로 이용 가능하다. 따라서 조사료 비율 15%의 육성 사료는 건초 급여의 경우 체중 90~100 kg 이상(···◆···과 —○—), 볏짚을 급여하는 경우에는 120 kg 이상(—●—)이면 이용 가능하다고 생각된다. 한편 이유기에 사료 섭취 증가가 불충분하여 육성기까지 일정 수준에 도달하지 못하거나 발육(체중)이 기준에 도달하지 못하는 경우는, 사료 조건(구성)을 에너지 함량이 높아지도록 변경하여 섭취 에너지를 보충하거나 이유 시기를 늦추는 등의 대책이 필요하다. 또한 그림 4-2-5에는 건초를 이용해 조농비 5:95로 계산한 값도 체중 100 kg 이하 부분에 대해 표시하였다(···◇···). 이 사료 조건은 고형 사료의 에너지 함량 상한에 가깝고, 집약적 관리(카프 허치나 슈퍼 허치 등에서의 격리 사육)를 전제로 하므로 여기서는 참고에 그쳤다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="95">•</span><span><i>그림 4-2-5 육용 송아지의 이유 후 체중당 사료 소요량(급여량)과 섭취량의 관계 — 체중 70~150 kg에 대한 건물 소요량 또는 섭취량(DM, %BW; 2.2~3.0). 볏짚(—●—), 건초(개화기, —○—), 건초(출수기, ···◆···; 조사료 15%), 건초(출수기, ···◇···; 조사료 5%)의 소요량 곡선은 체중 증가에 따라 약 2.8%에서 2.4%로 저하하며, 육성 개시 시 사료 섭취 수준(약 2.7%)과 교차한다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="96">•</span><span>※ 주1) 일본사양표준 육우(2008)¹³⁾를 이용하여 다음 조건으로 사료 소요량을 시산하고 5%의 안전율을 곱하였다. DG는 1.0 kg/일, 건물 중 TDN은 농후사료 83%, 건초(출수기) 63%, (개화기) 55%, 볏짚 41%로 하였다. 조기 이유 송아지에 준해 에너지 요구량을 산출하고, 그것을 사료의 에너지 함량으로 나누어 사료 소요량으로 하였다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="97">•</span><span>※ 주2) 이유 후 2~5주의 암송아지(90일령 이유, n=15)의 측정 예(미발표).</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>소가 섭취한 사료 식괴는 저작, 소화관 운동에 의한 미세화와 미생물에 의한 분해를 받아, 통과(유출)와 소화에 의해 반추위에서 소실된다. 사료 섭취량은 이 두 작용에 의한 반추위로부터의 식괴 소실에 크게 영향받는다. 송아지의 반추위 내 소화는 이유 직후부터 급속히 높아져, 이유기(7~9주령)에 비해 그 이후(육성기)는 거의 일정한 소화율에 도달한다(그림 4-2-6)¹⁴⁾. 한편 반추위로부터의 식괴 유출은 반추위에서의 미세화에 강하게 영향받으며, 섬유질이 많은 조사료는 반추위로부터의 유출 속도가 느려 체류 시간이 길어진다. 이 식괴의 미세화에는 섭취 시·반추 시의 저작이 크게 영향한다고 생각되는데, 발육(체중)과 섭취 사료 중량당 반추 시간에는 그림 4-2-7의 추정식¹⁵⁾과 같은 관계가 있어, 섭취 사료당 반추 시간은 발육에 따라 저하한다. 섭취량당 반추 시간은 작은 소일수록 발육에 따른 저하 비율이 크고, 육성 전기(100 kg~200 kg)에는 현저한 저하(45%)를 보인다. 육성 개시 시(100 kg)의 사료 섭취 수준(체중비 건물 2.7%, 그림 4-2-5 참조)을 그림 4-2-7에 대입한 반추 시간(약 6.5시간)은 성우와 같은 정도이며, 보통은 반추위에서의 사료 식괴 체류가 사료 섭취에 영향할 가능성은 낮다고 생각된다. 한편 이유기 송아지에서는 섭취량당 반추 시간이 육성기에 비해 더욱 길다. 특히 볏짚은 목건초에 비해 단위 중량당 총 저작 시간(RVI)이 길기(6~7할) 때문에, 이유기에 급여하면 섭취량이 목건초 급여 시에 비해 1~2할 저하할 가능성이 있다. 볏짚은 육우 농가에게 쓰기 편한 조사료이지만, 조기 이유 송아지에 대한 이유 전후의 볏짚 급여에 대해서는 아직 충분히 검토되지 않은 상황이어서, 이유기 급여 사료로서는 섭취 수준이나 외모로 영양 상태를 확인하면서 주의해서 사용할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="99">•</span><span><i>그림 4-2-6 육용 송아지의 이유 후 사료 소화율 변화 — 7주령 말에 이유(흑모화종 거세우, n=6). 유기물·NDF·전분의 7, 9, 12, 15, 18주령 소화율(%)을 반추위 내 소화와 장관 내 소화로 구분해 표시. 유기물 전체 소화율 약 75~80%(그중 반추위 내 소화가 7주령 약 30%에서 9주령 이후 약 45~50%로 상승), NDF 약 35~60%(반추위 내 소화 7주령 약 10%에서 15~18주령 약 55~60%), 전분 약 90~98%(반추위 내 소화 7주령 약 55%에서 15주령 이후 약 85%). 문헌 14에서 인용·개변.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="100">•</span><span><i>그림 4-2-7 체중과 섭취량당 반추 시간의 관계 — 체중 50~600 kg에 대한 반추 시간/사료 섭취량(시간/kg)은 100 kg 시 약 2.5, 200 kg 시 약 1.4, 300 kg 시 약 1.0으로 체중 증가에 따라 곡선적으로 저하(신뢰구간 점선 포함). 사료 중 NDF(% DM)는 36.5%로 조정. 80~700 kg에서의 측정 예(n=74)로 작성된 추정식. 문헌 15에서 인용·개변.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span><span style="color:var(--ink-soft)">(저자: 義朗)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span><span style="color:var(--ink-soft)">일본송아지 4-2 이유 전후의 사양.</span></span></p>
</div>
<div class="bx"><div class="bx-title">4-3 이유의 방법</div>
<div class="bx-sub"><div class="bx-subtitle">이유와 그 종류</div>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>이유란 액상 사료(모유나 대용유) 급여를 중지하고 고형 사료(스타터나 건초)로 이행하는 것을 말한다. 송아지는 액상 사료가 없어도 고형 사료만으로 영양을 섭취할 수 있게 된 시점에 이유가 가능해진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>이유 시기를 언제로 할 것인가에 대해서는 많은 논의가 있다. 이전에는 액상 사료의 장기 급여는 관리 노동력, 제1위(루멘) 발달, 대용유 비용 등의 이유로 바람직하지 않다고 하여 포유 기간 단축이나 조기 이유에 관한 연구가 많았다. 이유 후의 송아지는 생존과 성장에 필요한 영양분 전부를 고형 사료 섭취로 얻어야 한다. 그래서 송아지는 섭취 사료를 소화·흡수하는 능력을 획득할 필요가 있으며, 소화관의 발달, 특히 제1위의 기능 획득이 중요하다. 이러한 제1위 기능 획득에 있어 성급한 이유는 마이너스로 작용하기 때문에, 최근에는 장기 포유도 주목받게 되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>제1위 상피 조직의 발달에는 스타터 섭취가 매우 중요하다. 이는 스타터 섭취로 대량 생산되는 VFA가 반추위의 융모를 발달시키기 때문이다. VFA 가운데서도 융모 발달에 대한 효과가 큰 것은 낙산이고, 다음으로 프로피온산이 뒤따른다. 이들 VFA에 비하면 이 이유 전후 시기의 제1위 발달에 대해 초산이 하는 역할은 비교적 작다. 초산은 섬유질이 제1위 내에서 발효될 때 대량으로 생산되므로, 섬유의 과잉 급여는 제1위 융모 발달이라는 관점에서는 효과적이라고 할 수 없다. 이유는 품종이나 혈통, 송아지의 생육 상황을 잘 관찰하여 제1위의 발달을 고려하면서 실시해야 한다. 이유법은 자연 포유와 인공 포유에 따라 다르며, 또 각각 일반적인 이유와 조기 이유로 크게 나뉜다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="106">•</span><span>■ 육용 송아지의 이유</span></p>
<div class="bx-sub"><div class="bx-subtitle">자연 이유</div>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>국내에서 자연 포유로 사육되는 송아지는 흑모화종으로 대표되는 육전용 품종의 송아지이다. 육용 송아지의 이유는 일반적으로 6개월령 전후가 많다. 자연 포유는 우사 안에서 모자를 동거 사육시키는 비교적 소규모로 소를 사육하는 농장(그림 4-3-1), 혹은 방목 사육하는 농장에서 채용되는 것이 일반적이다(그림 4-3-2). 자연 포유 중인 송아지를 원활히 이유시키려면 송아지의 모유 섭취량을 서서히 감소시키는 동시에 고형 사료 채식량을 늘릴 필요가 있다. 자연 포유에서는 어미소의 비유에 의한 에너지 소비와, 비유에 의해 분비되는 프로락틴의 영향으로 성호르몬 분비가 억제되는 등의 이유로 어미소의 번식 기능 회복이 늦어진다. 이러한 위험을 피하기 위해 양질 조사료와 적절한 농후사료를 주어 어미소의 영양 요구를 충족시켜 줄 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="108">•</span><span><i>그림 4-3-1 화우의 모자 동거 펜 — 포육은 어미소에게 맡긴다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="109">•</span><span><i>그림 4-3-2 방목지에서의 자연 포유</i></span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>육용 품종으로 개량된 흑모화종은 비유량이 적기 때문에, 생후 3개월 정도 지나면 모유 양분만으로는 송아지의 양분 요구량을 충족하지 못하게 되는 경우가 많다. 어미소의 비유 능력에는 품종, 유전적 요인, 산차, 사양 내용이나 시설 환경 등이 관여하며, 자연 포유의 경우 어미소의 비유 능력이 송아지의 성장을 좌우하게 된다. 따라서 어미소의 비유량이 적은 경우에는 송아지의 발육이 떨어져 비육 밑소로서의 거래 가격이 하락한다. 어미소의 비유량이 적다고 판단된 송아지는 발육 불량이 될 우려가 있으므로 대용유를 이용한 추가 포유의 검토도 필요해진다. 축주는 어미소의 번식 관리, 송아지의 발육, 관리 작업의 노동력 절감을 고려하여 이유 방법을 선택한다. 자연 포유 송아지를 이유하려면 어미소와 송아지 쌍방의 준비가 필요하다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="111">•</span><span><b>이유 이행기의 사육 관리</b></span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>어미소의 이유 준비로서 모자 분리 전에 비유량을 감소시킬 필요가 있다. 비유량 감소를 위해서는 어미소에 대한 배합사료 급여량을 줄이거나, 포유 횟수를 제한하는 제한 포유(포유 횟수를 하루 2회 정도로 제한하는 포육 방법)가 효과적이다. 제한 포유는 어미소의 영양 상태 정상화에 의한 번식 기능 회복을 앞당기는 방법으로 효과적이다. 제한 포유를 도입하려면 송아지와 어미소를 분리해야 하므로, 간편하게 모자 분리가 가능한 시설이 필요하다¹⁾(그림 4-3-3).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="113">•</span><span><i>그림 4-3-3 모자 분리 우사의 디자인 이미지 — ① 분만방(분만~생후 2주): 분만방에서 어미와 새끼 1대1로 지낸다. ② 적응 공간(생후 2주~1개월): 송아지만 통과할 수 있는 틈새로 모자 방과 송아지 방(스타터·건초 비치)을 연결. 좌우 방에서는 모자가 함께 지낼 수 있지만 중앙 방은 송아지만 드나들 수 있어, 어미소와 안심하고 지내면서 스타터 먹는 법을 선배 송아지로부터 배울 수 있다. ③ 큰 방(생후 1개월~3개월): 중앙 공간은 송아지만 들어갈 수 있고 송아지를 지키듯 어미소가 둘러싼다. 군사의 스트레스를 어미소에게 기대는 것으로 완화시킨다. ④ 송아지방(3개월령~출하): 이유 후에는 같은 체격의 송아지 5~6두를 같은 방에서 군사한다. 문헌 1에서 인용·개변.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>송아지를 이유시키기 위해서는 고영양의 모유가 제한 혹은 중지되더라도 고형 사료로부터 충분한 영양을 흡수할 수 있는 소화관을 만들어야 한다. 조기 이유를 계획한다면 생후 1주 정도부터 스타터를 강제로 입에 넣어 순치하여, 송아지에게 스타터 채식을 학습시키는 동시에 조기에 제1위를 발달시켜야 한다. 포육 중인 송아지에 대해서는 스타터 급여는 자유 채식을 원칙으로 하되, 그 섭취량은 음수량에도 좌우되므로 언제든 자유롭게 깨끗한 물을 마실 수 있게 해야 한다. 또 이유 후에 급여할 조사료와 농후사료에 순치시키는 동시에, 계획한 사료 급여량을 충분히 채식할 수 있도록 송아지 소화관의 발달을 촉진하는 것이 송아지의 이유 준비가 된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="115">•</span><span><b>이유 시기</b></span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>자연 포유로 사육하는 송아지의 이유는 모자를 분리함으로써 모유 급여를 중지하는 경우가 많다. 이유의 방법과 시기를 표 4-3-1에 나타냈다. 이유 시기는 어미소의 비유량이 적어지는 시기로, 흑모화종에서는 비유량이 3 kg/일 이하가 되는 생후 6개월령 정도가 일반적이다. 비유량이 많은 일본단각종에서는 6개월령에도 6 kg/일 정도의 비유량이 있어 포유 기간을 다소 연장할 수 있으므로, 이유 시기는 흑모화종보다 조금 늦어진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>표 4-3-1 포유 방법과 이유 시기.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>이유 방법</th><th>품종</th><th>성별</th><th>모자 분리</th><th>이유 시기</th><th>비고</th></tr><tr><th>초조기 이유</th><td style="text-align:left">흑모화종</td><td style="text-align:left">암수</td><td style="text-align:left">6일령 이내</td><td style="text-align:left">3개월령</td><td style="text-align:left"></td></tr><tr><th>초조기 이유</th><td style="text-align:left">흑모화종</td><td style="text-align:left">암수</td><td style="text-align:left">0일 이내</td><td style="text-align:left">6주령 정도</td><td style="text-align:left">ET 송아지</td></tr><tr><th>조기 이유</th><td style="text-align:left">흑모화종</td><td style="text-align:left">암수</td><td style="text-align:left">3개월령</td><td style="text-align:left">3개월령</td><td style="text-align:left"></td></tr><tr><th>자연 이유</th><td style="text-align:left">흑모화종</td><td style="text-align:left">암수</td><td style="text-align:left">6개월령 정도</td><td style="text-align:left">6개월령 정도</td><td style="text-align:left"></td></tr><tr><th>자연 이유</th><td style="text-align:left">일본단각종</td><td style="text-align:left">암수</td><td style="text-align:left">7~8개월령</td><td style="text-align:left">7~8개월령</td><td style="text-align:left"></td></tr><tr><th>조기 이유</th><td style="text-align:left">홀스타인</td><td style="text-align:left">암</td><td style="text-align:left">0일령</td><td style="text-align:left">6주령</td><td style="text-align:left"></td></tr><tr><th>일반 이유</th><td style="text-align:left">홀스타인</td><td style="text-align:left">암</td><td style="text-align:left">0일령</td><td style="text-align:left">2개월령</td><td style="text-align:left"></td></tr><tr><th>일반 이유</th><td style="text-align:left">홀스타인</td><td style="text-align:left">수</td><td style="text-align:left">0일령</td><td style="text-align:left">1개월령</td><td style="text-align:left">유용 수송아지</td></tr><tr><th>일반 이유</th><td style="text-align:left">교잡종</td><td style="text-align:left">암수</td><td style="text-align:left">0일령</td><td style="text-align:left">1.5개월령</td><td style="text-align:left"></td></tr></table></div></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">조기 이유</div>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>조기 이유는 일반적으로 3개월령 정도에서의 이유를 가리킨다. 또 비유에 의한 부의 에너지 균형 때문에 어미소의 분만 간격이 연장되기 쉬우므로, 최근에는 이 방식이 선호되는 경향이 있다. 다만 어미소의 비유량이 적은 경우 일률적으로 3개월 전후에 이유하면 송아지의 발육이 떨어져 비육 밑소로서의 거래 가격이 하락하므로 주의가 필요하다. 이 경우는 추가 포유를 실시하는 등의 영양 보급이 필요해진다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="119">•</span><span><b>이유 이행기의 사육 관리</b></span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>자연 포유 관리에서 조기 이유를 하려면 생후 1주 정도부터 고형 사료를 급여하여 제1위 발육을 촉진하고, 조기에 고형 사료 섭취가 가능해지는 포육 관리를 한다. 그 후 3개월령 전후에 모자 분리를 실시하고 완전히 고형 사료만의 사양관리로 전환한다. 이 경우 순조롭게 이유기를 이행하면 송아지의 발육은 양호하고 어미소의 번식 기능 회복도 양호해진다. 이유 시 모자 분리 방법은 앞서 말한 「자연 이유」와 같다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="121">•</span><span><b>이유 시기</b></span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>조기 이유에서는 어미소의 비유량에 관계없이 3개월령 전후에 송아지 체중 110 kg을 기준으로 이유시킨다. 자연 포유로 사육하는 송아지의 이유는 모자를 분리함으로써 모유 급여를 중지하는 경우가 많다. 송아지의 스타터 섭취량은 90일령 시점에서 하루 2.5 kg, 이상적으로는 3 kg이 기준이 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">초조기 모자 분리 송아지(인공 포유)의 조기 이유</div>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>조기에 모자 분리하여 인공 포유로 포육한 송아지에서는 대용유, 스타터 및 조사료의 섭취량과 그에 따른 발육을 예측할 수 있다. 송아지 체격의 불균일을 피하기 위해서도 이 방법은 이점이 많다. 인공 포유는 관리자가 주체가 되어 통제할 수 있으므로 이유에 대해서도 자연 포유에 비해 쉽다. 출생 후 어미소로부터 초유를 섭취시키기는 하지만 모자 분리 이후는 완전히 인공 포유이며, 관리 작업의 간편함 때문에 최근 대형 목장에서 이 방법이 보급되고 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="124">•</span><span><b>이유 이행기의 사육 관리</b></span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>인공 포유 송아지의 이유 준비는 송아지에 대한 대응만으로 충분하다. 송아지의 이유 준비는 앞 항의 자연 포유에서의 송아지 이유 준비와 같아서, 이유 후 급여할 사료에 충분히 순치시키고 또 계획한 채식량을 확보하는 것이 필요하다. 스타터 급여는 자유 채식이 전제이지만 상황에 따라 상한치를 정해 과식을 방지한다. 개별 사육하지 않고 제한 급여를 군사로 실시하는 경우에는, 사회적 순위가 낮은 소라도 채식량을 확보할 수 있도록 사조 폭을 충분히 확보하는 동시에 채식 행동이나 분변 성상의 관찰, 발육 상황 확인 등이 요구된다. 또 카프 허치에서 포육되고 있는 경우는 이유에 따라 개체 관리에서 군 관리로 이행하므로, 이 스트레스를 완화하기 위해 5~8두 정도 사양할 수 있는 슈퍼 카프 허치에서 군 사육에 순치시킨 뒤 더 큰 군 관리로 이행하기도 한다. 이유에는 7~10일에 걸쳐 대용유 급여량을 서서히 감소시켜, 스타터 섭취 과다에 의한 소화불량성 설사나 제1위 내 이상 발효에 의한 고창증 발생을 예방한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="126">•</span><span><b>이유 시기</b></span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>흑모화종에서는 계통에 따라 출생 시 체중과 그 후의 성장 속도가 다르므로, 출생 후 일수를 참고로 이유하면 발육 불량이 되는 수도 있다. 체중이 50~70 kg에 도달할 때까지는 대용유를 0.7~1.0 kg/일 정도(5배 희석이라면 포유량으로는 3.5~5 L/일) 급여하여 확실한 발육을 촉진하고, 체중 50~70 kg에 도달한 시점에서 유용 송아지와 같은 관리 방법으로 이유를 실시하는 것이 기준이 된다. 송아지 체중이 80 kg 이상이 되면 체중의 2% 정도의 농후사료와 조사료 채식이 가능해져 0.8 kg/일 이상의 DG를 기대할 수 있다. 스타터 섭취량이 이유 시기의 기준이 되는데, 60일령 이유라면 1.0~1.5 kg/일, 90일령 이유라면 2.5~3.0 kg/일의 스타터를 3일 연속 채식할 수 있는 것이 기준이 된다. 이유 시 체중은 60일령에 70~80 kg, 90일령에는 110~130 kg을 목표로 하고 싶다. 스타터 채식량에는 개체차가 있으므로, 대용유를 무리하게 이유함으로써 영양 불량을 초래하여 영양성 면역 기능 저하에 의한 기회감염이나 폐렴 등 감염증의 위험이 높아진다. 조기 이유를 시도하는 경우 출생 후의 건강 상태나 성장 속도, 신체충실지수(BCS), 스타터 채식 상황 등을 잘 관찰하여 판단해야 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="128">•</span><span><i>그림 4-3-4 화우의 포유 로봇 — 목걸이로 개체 식별하여 포유량을 제어한다.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>요즘은 대용유를 대량으로 급여하는 강화 포유가 보급되고 있다. 강화 포유 방식은 다양한 스타일이 있지만, 최대 포유량을 6~10 L/일로 하는 경우가 많다. 대량 포유가 되면 하루 2회 급여로는 송아지의 소화기관에 스트레스가 가해지므로, 여러 회로 나누어 급여할 수 있는 포유 로봇 도입이 바람직하다(그림 4-3-4). 대량 포유 프로그램에서 문제가 되는 것은 고형 사료 섭취량이 증가하지 않는 것이다. 이 때문에 이유 시기를 향해 포유량을 서서히 감소시키거나 대용유 농도를 묽게 하여, 송아지의 식욕을 스타터 섭취량 증가 방향으로 이끌어 주는 것이 포인트가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>이상 다양한 포유 방식의 이유에 대해 서술했는데, 육용우, 특히 흑모화종은 개체차가 매우 크다. 어미소의 계통이나 종모우, 혹은 기후 등의 환경 요인에 따라 발육 정도가 크게 좌우된다. 그래서 이유 시기를 일률적으로 일령으로 정해 버리면 발육이 늦은 이른바 "히네우(발육 지연우)"를 내게 된다. 1두씩 관찰하여 체격이나 스타터 섭취 정도 등 개체별로 이유 시기를 결정하는 것이 중요하다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="131">•</span><span>■ 유용 송아지의 이유</span></p>
<div class="bx-sub"><div class="bx-subtitle">인공 포유에서의 이유</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="132">•</span><span><b>이유 시의 사육 관리</b></span></p>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span>유용우에서 태어나는 송아지는 거의 모두 출생 직후부터 모자 분리로 포유 사육된다(그림 4-3-5). 홀스타인이나 교잡종은 흑모화종에 비해 체격이나 소화성에 개체차가 적어, 인공 포유에서의 일반적인 이유는 2개월령으로 본다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="134">•</span><span><i>그림 4-3-5 유용우의 경우 모자 동거는 분만 직후에 한정된다</i></span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>출생 후 즉시 모자 분리하는 송아지에서는 포육 관리는 전유(폐기유) 혹은 대용유 급여가 된다. 액상 사료는 고형 사료에 비해 관리나 비용 등의 면에서 불리하므로, 조기에 액상 사료 급여를 중지하고 고형 사료로 전환하는 것이 경영상의 과제가 된다. 지금까지 많은 농장에서 포육 기간 단축이 검토되어 왔다. 특히 홀스타인의 이유 시기는 수송아지와 후계 암송아지에서 달라, 육용우로서의 개체 가격이 낮은 홀스타인 수송아지에서는 비용 경감이 가장 우선된다. 또 수송아지는 대규모 비육 농장에서 육성·비육되므로, 작업 효율을 높이는 등의 목적으로 이유 시기가 이르다(그림 4-3-6).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="136">•</span><span><i>그림 4-3-6 홀스타인 수송아지의 비육 농장 — 목걸이는 포유 로봇 이용을 위한 것.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>한편 홀스타인 암송아지는 착유우로서 낙농 경영을 담당할 후계우이므로 충분한 영양 환경에서 포육·육성된다. 또 축주의 육성 방침에 따라서는 더 긴 기간 포유하는 것도 있을 수 있으므로, 홀스타인 송아지의 이유는 성별이나 용도에 따라 시기가 다르다. 홀스타인에 흑모화종을 교배하여 생산한 교잡종은 출생 시 체중이 작은 점 등으로 홀스타인 수송아지보다 이유 시기가 약간 늦다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>최근에는 낙농 경영 안에서 홀스타인 암소에 흑모화종 수정란을 이식(ET)하여 비육 밑소로 출하하는 생산 형태가 늘고 있다. ET 송아지는 출생 직후 모자 분리되어 홀스타인이나 교잡종과 마찬가지로 대용유를 급여하여 포육한 뒤 이유시킨다. 액상 사료 급여 기간은 앞서 말한 「초조기 모자 분리 송아지(인공 포유)의 조기 이유」항을 참조하기 바란다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="139">•</span><span><b>이유 시기</b></span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>모자 분리 포유 송아지의 이유는 앞서 말했듯 출생 후 2개월 전후가 일반적이며, 이유할 때는 인공 포유한 흑모화종 송아지와 마찬가지로 7~10일에 걸쳐 대용유 급여량을 서서히 감소시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>일본에서는 분리 포유에서 생후 6주령까지의 조기 이유도 실시되고 있다. 일본사양표준 젖소²⁾에서는 6주령까지 이유시키는 것을 조기 이유로 정의하며, 스타터 섭취량이 하루 1 kg을 넘거나 3일간 연속하여 500 g을 넘는 경우에 이유가 가능하다고 제시하고 있다. 조기 이유 방식에서 액상 사료 급여량은 이유까지 일정하게 하는 것이 장려되며, 전유를 급여하는 경우에는 하루당 체중의 10%에 상당하는 4.5 kg을 이유까지 급여한다. 대용유(공정 규격 CP 22% 이상, TDN 75% 이상)를 급여하는 경우에는 하루당 최소한 600 g 정도(1 L에 130 g을 녹인다면 포유량은 4.6 L)를 급여한다. 대용유 용해 시에는 온수 온도(약 40℃)와 침투압(대용유 용해량)을 일정하게 유지하는 것이 설사 예방에 중요하다. 포유 횟수는 포유 버킷(그림 4-3-7)이나 포유 보틀(그림 4-3-8)을 사용한 수작업에서는 하루 2회 급여가 기준이 되지만, 포유 로봇(그림 4-3-9)을 사용하면 다회 급여가 가능해진다. 한 번에 대량의 밀크를 주면 송아지 설사가 우려되므로, 포유량을 늘릴 때는 소량 다회 급여를 검토해야 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="142">•</span><span><i>그림 4-3-7 전통적인 포유 버킷 — 카프 허치 벽에 버킷 받침을 설치하면 포유 중 작업자가 들고 있을 필요가 없다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="143">•</span><span><i>그림 4-3-8 포유 보틀</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="144">•</span><span><i>그림 4-3-9 포유 로봇</i></span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>고형 사료 섭취량과 이유 시기에 대해서는, 네덜란드 연구자³⁾가 스타터를 3일간 연속 750 g 섭취한 시점에 이유시키는 대조구와, 하루에 1.8 kg 섭취한 시점에 이유시키는 시험구를 설정하여 육성 성적을 조사하였다(표 4-3-2). 포유량은 대조구에서는 종래대로 4 L였고, 시험구에서는 최대 6 L까지 높였다(4~5주령). 이유 시기는 대조구 5.5주에 비해 시험구에서는 9주로 늦어졌지만, 시험구에서는 폐사율과 진료 비용이 저하하고 체중도 무거웠다. 이 보고에서는 이유 후 발육 정체나 질병의 위험을 경감하기 위해 스타터 채식량이 1.5~2.0 kg/일에 도달한 시점을 이유 기준으로 삼도록 권장하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span>표 4-3-2 포육 증강구와 조기 이유구의 스케줄과 급여 방법.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목</th><th></th><th>시험구(포육 증강구)</th><th>대조구(조기 이유구)</th></tr><tr><th>대용유</th><td style="text-align:left">농도</td><td style="text-align:left">125 g/L</td><td style="text-align:left">125 g/L</td></tr><tr><th></th><td style="text-align:left">스케줄</td><td style="text-align:left">0~3주: 4→6 L / 4~5주: 6 L / 6~9주: 6→2 L</td><td style="text-align:left">0~4주: 4 L / 5~6주: 2 L</td></tr><tr><th></th><td style="text-align:left">포유 기간</td><td style="text-align:left">9주</td><td style="text-align:left">5.5주</td></tr><tr><th></th><td style="text-align:left">기간 중 총급여량</td><td style="text-align:left">35 kg</td><td style="text-align:left">17 kg</td></tr><tr><th>스타터 최대 급여량</th><td style="text-align:left"></td><td style="text-align:left">2.5 kg/일</td><td style="text-align:left">3.0 kg/일</td></tr><tr><th>물(자유 섭취)</th><td style="text-align:left"></td><td style="text-align:left">전 기간</td><td style="text-align:left">전 기간</td></tr><tr><th>건초(자유 채식)</th><td style="text-align:left"></td><td style="text-align:left">0~5주</td><td style="text-align:left">1~5주</td></tr><tr><th>콘 사일리지(자유 채식)</th><td style="text-align:left"></td><td style="text-align:left">5주 이후</td><td style="text-align:left">5주 이후</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span><span style="color:var(--ink-soft)">문헌 3에서 인용·개변</span></span></p>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>3주령이라는 초조기 이유도 시도되고 있지만, 이유 기준이 되는 양의 스타터가 섭취되지 않은 경우가 많아 반추위 발달이나 발육이 충분하지 않은 것이 문제가 된다. 표 4-3-3에는 집단 포육에서의 조기 이유를 위한 사료 급여 예를 나타냈다⁴⁾. 이유 전에 대용유를 감소시키면 스타터 채식량이 급증한다. 스타터 채식량이 너무 늘어 설사 등 소화불량이 보이는 경우에는 스타터 급여량 제한을 검토해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>표 4-3-3 집단 포육에서의 조기 이유를 위한 유용 암송아지의 사료 급여 예.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>3~34일</th><th>35~38일</th><th>39~41일</th><th>42~90일</th></tr><tr><th>대용유</th><td style="text-align:left">1 L×4회/일</td><td style="text-align:left">1 L×2회/일</td><td style="text-align:left">0.5 L×2회/일</td><td style="text-align:left">이유</td></tr><tr><th>스타터</th><td style="text-align:left">2.5 kg/일/두를 상한으로 자유 급여</td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>건초·물</th><td style="text-align:left">자유 급여</td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span><span style="color:var(--ink-soft)">문헌 4에서 인용·개변</span></span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>또 ET로 태어난 흑모화종 송아지는 홀스타인이나 교잡종에 비해 몸집이 작아, 조기 이유로 성장 불량이 되는 수도 있다. 앞서 말했듯 자연 포유에서의 흑모화종 이유는 출생 3~6개월 전후이며, ET라 하더라도 흑모화종 송아지로서 포유 육성하고 이유해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>최근 포유량 증급이나 대용유 영양 농도를 높이는 등 포육기 영양의 "강화(intensified)"가 주목받게 되었다⁵⁾. 이 포육 방법에서는 포유량을 8~10 L/일까지 증량하고 포유 기간도 60일 이상으로 한다. 강화 포유 프로그램은 이유 이행기 송아지의 사료효율이 그 이후의 단계와 비교해 매우 높으므로 육성 비용 저감에 효과가 있다고 생각된다⁶⁾. 예를 들어 이유 시 사료효율은 25~35%(100 g의 사료를 섭취시키면 25~30 g의 증체)인 데 비해 22개월령의 그것은 7%에 불과하다. 나아가 포유량이나 기간을 「강화」함으로써 단순히 발육 속도 향상에 그치지 않고 초산 분만 후의 유생산에까지 효과가 지속될 가능성도 보고되고 있다. 미국의 연구에서는 강화 포육구에서 초산차 305일 유량이 관행법에 비해 1,136 kg 증가하고 유단백질 생산량도 증가했다고 보고되었다⁷⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>이처럼 요즘 주목받고 있는 대량 포유 방식(8 L 이상)이지만, 당초 문제가 되었던 것은 밀크로부터의 영양으로 송아지가 만족해 버려 고형 사료 섭취량이 늘지 않는 것이었다. 일반적으로 같은 주령이라면 종래형 제한 포유(4 L)에 비해 대량 포유에서는 고형 사료 섭취량이 적다. 고형 사료 섭취량이 정체된 채 이유하면 영양 부족으로 발육이 정체되어 버려, 때로는 대량 포유에 의한 이점을 잃어버린다. 그림 4-3-10은 같은 포유량으로 이유 시기를 6주령과 8주령의 두 가지로 한 시험 결과이다⁸⁾. 포유량이 같아도 제1위가 미성숙하고 스타터 섭취량이 적은 6주 이유에서는, 스타터 섭취량이 늘어난 8주 이유에 비해 이유 이행기의 에너지 섭취량이 감소하여 송아지의 발육이 정체되었다. 포유량을 늘리는 경우에는 스타터 섭취량이 충분히 늘어난 것을 확인한 뒤 이유하는 것이 이행기를 건강하게 넘기는 포인트가 된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="154">•</span><span><i>그림 4-3-10 이유 시기와 스타터 섭취량의 관계 — 6주 이유 송아지와 8주 이유 송아지의 대사에너지 섭취량(Mcal, 0~10) 비교(대용유·스타터·짚·총섭취량, 0~70일령). 둘 다 이유 1주 전에 포유량을 반감하였다. 포유 로봇을 이용하여 최대 8 L 포유를 실시하였다. 0일령부터 펠릿 스타터와 귀리짚을 자유 섭취시켰다. 귀리짚은 3 cm로 절단하여 급여하였다. 대용유 ME는 양 구 모두 약 5.5 Mcal로 일정하다가 이유 1주 전에 약 2.7~2.9 Mcal로 반감. 6주 이유구는 42일령 스타터 ME 약 1.5 Mcal로 이유 직후 총섭취량이 약 4 Mcal까지 떨어진 뒤 70일령에 약 8 Mcal로 회복; 8주 이유구는 56일령 스타터 ME 약 3.8 Mcal로 이유 시 총섭취량 약 6.5 Mcal, 70일령 약 8.5 Mcal. 문헌 8에서 인용·개변.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">자동 포유에서의 이유</div>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>대량 포유 프로그램에서는 포유량을 서서히 늘려 가고, 최고 포유량에 도달한 뒤에는 이유 시기를 향해 포유량을 줄여 간다. 포육우를 다두 관리하는 농장에서는 일령과 포유량이 다른 송아지가 혼재하게 되어, 허치 등 사람 손에 의한 관리에서는 포유 버킷을 바꿔 주는 등의 실수가 발생하기 쉽다(그림 4-3-11). 이 점에서 로봇 포유는 컴퓨터로 개별 포유량을 관리할 수 있으므로 유량을 바꿔 주는 등의 실수를 막을 수 있다. 송아지를 자동 포유(로봇 포유)로 관리하는 경우 군사가 되므로 스타터와 조사료는 기본적으로 자유 섭취가 된다. 이유 시에는 대용유 급여량을 1 L/일 정도까지 감량하거나 온수 비율을 높여 농도를 묽게 해 감으로써, 송아지가 대용유만으로는 배부르지 않아 고형 사료 섭취량을 늘릴 수 있다. 이유 시 대용유 포유량이 제한되어 식욕이 높아진 송아지가 바로 스타터를 채식할 수 있도록 드링크 스테이션 가까이에 충분한 공간의 사조를 배치하여 스타터와 조사료 채식을 촉진하도록 한다. 이로써 스타터 채식량이 늘고, 나아가 드링크 스테이션의 경합이나 송아지끼리의 흡인(서로 빨기) 방지가 된다. 조사료(건초)의 세절은 채식량을 높이고 사조에서 끌어내려 낭비되는 것을 피하는 데 유효하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="156">•</span><span><i>그림 4-3-11 줄지어 늘어선 포육 허치</i></span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>다두 사육에서는 송아지의 성장 불량이나 발병 발견이 늦어지는 경우가 많다. 그래서 포유 프로그램에서 설정한 일령에 순조롭게 이유할 수 있도록, 자동 포유에 의한 노동력 절감으로 생긴 축주의 정신적·시간적 여유를 송아지의 사양관리와 위생관리 관찰에 돌려야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span><span style="color:var(--ink-soft)">(저자: 賢一)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span><span style="color:var(--ink-soft)">일본송아지 4-3 이유의 방법.</span></span></p>
</div>
</div>
`;
}
