</div>
<div class="bx"><div class="bx-title">5-1 육성기의 발육과 생리적 변화</div>
<div class="bx-sub"><div class="bx-subtitle">제1위 기능의 성숙과 송아지의 발육</div>
<p class="bx-num"><span class="bxn" data-n="3">•</span><span>육성기는 육성 암소에서는 이유 후부터 성성숙에 도달할 무렵까지의 육성 전기와 그 후 초산 분만까지의 육성 후기(초산 임신기와 겹친다)로 나뉘지만, 비육 밑소에서는 이유 후부터 비육 개시까지의 기간을 육성기로 다루는 경우가 많다. 여기서 다루는 제1위 기능에 관해서는 이유 후부터 성성숙에 도달할 무렵까지, 혹은 비육에 공여될 때까지를 대상으로 기술한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성기의 제1위 기능 성숙이란</div>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>송아지의 제1위 기능은 이유를 경계로 극적인 변화를 이루는데, 그러기 위해서는 휘발성지방산(VFA)에 의한 화학적 자극과 건초 등의 거친 사료에 의한 물리적 자극 양쪽이 필요하며, 근층과 융모의 발달이 어우러져 제1위 기능을 발휘하게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>출생부터 성숙까지의 내장 중량 변화를 흑모화종 거세우로 고찰한 야마자키의 보고에 따르면, 제1위·제2위는 8개월령에 최대 발육 월령에 도달하고, 직선적인 발육은 3.3개월부터 12.6개월까지 9.3개월간 지속되었다¹⁾. 한편 제4위는 4.8개월령에 발육 최대 월령에 도달하고, 출생 전부터 13.6개월령까지 직선적인 발육이 지속된다(그림 5-1-1). 육성기간이 비육 혹은 비유에 대비한 튼튼한 제1위·제2위를 만들기 위한 기간이라는 견해는 조직중량의 추이로 보아 수긍이 가는 것이다. 나아가 이 기간의 장기 중량 변화를 체중에 대한 상대적 변화로 파악하면,</span></p>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>Log |(제1위 중량 + 제2위 중량) ÷ 출생시 체중| = 0.960 × 월령 − 1.637 (F값 = 10.69)</span></p>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>이라는 식이 성립하여, 제1위·제2위의 변화가 증체에 잘 비례하고 있음을 이해할 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="8">•</span><span><i>그림 5-1-1 위 각 부위의 발육에 관한 미분(위)·중미분(아래) 곡선. 세로축은 미분 f'(x)(kg/월; Ⅲ·Ⅳ위 눈금 0.05, Ⅰ+Ⅱ위 눈금 0.5), 중미분 f''(x)(kg/월², ±0.1), 가로축은 월령 0~40. 주: 중미분식의 최대값을 직선 발육 개시 월령, 최소값을 동 종료 월령으로 정의. 문헌 1에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>육성기에 제1위는 중량적으로 증대함과 동시에 기능적으로도 성숙을 이루어 가는데, 그 과정(속도)은 포유기의 사양방식, 즉 인공포육인가 자연포육인가에 따라 크게 달라진다. 그림 5-1-2는 포육방식의 차이에 따른 육성기의 조직중량 추이를 고찰한 데라다 등의 보고인데, 조기 이유한 홀스타인 송아지의 제1위·제2위 조직중량이 급격히 증대하여 생후 8~12주령에 체중비로는 성우 수준에 도달하는 데 비해, 자연포유한 흑모화종 송아지의 경우는 서서히 증가해 6~8개월령에 이르러서야 겨우 성우 수준에 도달하는 상황이 나타나 있다²⁾. 한편 제1위 발효에 관해 VFA 농도나 몰비율의 추이를 관찰하면 12주령 전후에 안정된다고 보고하고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="10">•</span><span><i>그림 5-1-2 제1·2위 조직중량의 발달. 세로축 제1+2위 조직중량(g/kg 체중), 가로축 주령(0, 8, 12, 15, 18, 24, 32, 52, 성우). 홀스타인 송아지(아사이 1970)는 약 5에서 24주령에 약 22로 급증 후 평탄, 흑모화종 자연포유는 약 5에서 완만히 증가해 성우에서 약 20, 홀스타인 전유 급여(다마테)는 12주령까지 약 5~7에 머무름. 문헌 2에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>육성기의 제1위 기능을 생각할 때 조직중량과 제1위 발효 양쪽에서 검토할 필요가 있지만, 이 기간에는 크기(중량·용적)의 충실이 중요하다고 말할 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성방식에 따른 소화관 조직중량의 차이</div>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>육성기의 제1위 발달에 대해서는 포육방식뿐 아니라 육성방식도 크게 영향을 미친다. 육성방식의 차이에 따른 소화관 조직중량의 영향을 검토한 보고를 소개한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="13">•</span><span><b>사사와 방목의 비교³⁾</b></span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>4개월령의 교잡종 거세우 6두를 이용하여, 농후사료 급여량을 체중의 1.4%로 제한 급여하고 오차드그라스 건초를 포식시킨 구(사사구)와 페레니얼라이그라스 초지에 방목한 구(방목구)를 비교한 결과, 방목구에서는 체중은 작았지만 소화관 중량은 커졌다(그림 5-1-3).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="15">•</span><span><i>그림 5-1-3 육성조건의 차이가 소화관 조직중량에 미치는 영향. 체중(kg): 방목구 약 240 vs 사사구 약 280(\</i>); 소화관 조직중량(g/kg 체중): 제1+2위 방목 약 20.5 vs 사사 약 18(\<i>), 제3위 약 6.5로 동등, 제4위 방목 약 7.5 vs 사사 약 4(\</i>\*). \<i>P<0.05, \</i>\<i>P<0.01. 「육성 송아지의 하부 소화관 기능과 조직형태에 대한 방목 효과」 문헌 3에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="16">•</span><span><b>조사료 급여비율의 차이가 육성기의 발육과 사료효율에 미치는 영향⁴⁾</b></span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>조사료 급여비율을 가소화양분총량(TDN) 비로 20, 40, 60%의 3수준으로 설정한 결과, 조사료 급여비율이 증가하면 일당증체량(DG)은 저하했으나, 제1위·제2위 중량은 20%구에서 작은 값을 보였다(그림 5-1-4).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="18">•</span><span><i>그림 5-1-4 육성 시의 조사료 급여비율이 육성 종료 시의 제1·2위 중량 및 용적에 미치는 영향(체중비, %). 제1+2위 중량: 20%구 약 1.9, 40%구 약 2.2, 60%구 약 2.2; 제1+2위 용적: 20%구 약 16.3, 40%구 약 18.5, 60%구 약 18.2. 문헌 4에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>육성기의 제1위·제2위 발달에 대한 급여사료의 영향은 크며, 조사료 섭취비율이 증가함에 따라 조직 용적도 증가하는 것으로 나타나 있지만, 조사료 섭취량의 증가는 영양소 섭취량의 억제로 이어질 가능성이 있으므로 기대 증체량을 바탕으로 급여사료 구성을 검토하는 것이 긴요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소화율은 어떤가</div>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>Blaxter 등은 15~81주령의 송아지에서는 소화율에 차이가 없다는 것⁵⁾을, Hamada 등은 13~14주령의 송아지에 건초를 급여한 결과 4~5주 후에 건초의 소화능력이 성우에 가까워진다는 것⁶⁾을 보고하고 있다. 또한 아베는 면양, 산양을 이용하여 3, 6, 9, 12개월령 시에 이탈리안라이그라스 건초의 소화율을 측정하였다⁷⁾. 그 결과, 면양에서는 3개월령과 그 밖의 월령 간에 차이가 보였고, 산양에서는 월령이 진행됨에 따라 소화율이 높아지는 경향이 인정되었다. 3개월령 정도에서는 소화율 면에서 미발달인 경우도 있을 수 있으나, 6개월령 정도가 되면 거의 성축의 소화능력에 도달해 있는 것으로 추찰된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성기의 성장과 그 후의 생산성</div>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>제1위의 기능과 중량(용적)의 성숙은 섭취량과 소화율을 결정하는 중요한 요인이다. 그 때문에 제1위의 성숙은 그 후의 생산성에 큰 영향을 미친다. 육성기의 비육 밑소에 조사료를 적정하게 급여하는 것은 이 시기의 과잉 체지방 축적을 억제함으로써 비육성적의 개선으로 이어진다는 것이 알려져 있다. 젖소 암소에서도 1.0 kg/일을 넘는 높은 증체속도는 비유성적을 억제하는 것으로 나타나 있다⁸⁾(그림 5-1-5). 육성기의 증체량은 그 후의 생산성, 즉 비유성적이나 비육성적에 대한 영향과 생산비용에 의해 결정되어야 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="22">•</span><span><i>그림 5-1-5 육성기의 일당증체량과 초산 시의 비유성적. 유생산량(305일, kg): MM구 약 8,700, HM구 약 6,200, HH구 약 7,300; DG(kg/일): MM구 약 0.97, HM구 약 1.13, HH구 약 1.11. MM구: 표준 DG 표준 CP구, HM구: 고 DG 표준 CP구, HH구: 고 DG 고 CP구. 문헌 8에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span><span style="color:var(--ink-soft)">(저자: 寺田文典)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">번식기능의 발달</div>
<p class="bx-num"><span class="bxn" data-n="24">•</span><span>암송아지가 태어나서 임신할 수 있게 되기까지는, 생식이 가능한 생식기관으로 발달하고, 호르몬 분비가 순조롭게 이루어지는 생리적 상태에 도달하며, 임신을 지속하여 정상적으로 분만할 수 있는 체격이 되어야 한다. 육성 암소의 번식관리에서는 초산 월령을 의식하면서 소의 성성숙 시기나 체격에 유의하여 번식공용 시기를 평가하는 것이 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">춘기발동과 성성숙</div>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>동물은 일정한 월령으로 성장하면 시상하부·뇌하수체·성선 축이 기능하기 시작하여 이윽고 완성된다. 생식기능의 일부가 분명히 인정되게 되는 것을 춘기발동(puberty)이라 한다. 수컷에서는 정세관 내에 정자가 출현하는 시기를, 암컷에서는 초회 배란 시기를 춘기발동이라 한다. 암컷에서 춘기발동 시기를 정확히 포착하는 것은 어렵지만, 일반적으로는 황체의 형성이나 처음 나타나는 발정징후의 발현을 지표로 하는 경우가 많다. 동물은 어느 월령에 도달하면 번식활동기를 맞이한다. 암컷에서는 수컷과 교미하여 임신할 수 있게 되고, 수컷은 암컷과 교미하여 임신시킬 수 있게 된다. 이처럼 번식활동기를 맞이하는 것을 「성성숙(sexual maturation)에 도달한다」고 한다. 암컷에서는 춘기발동에 도달해도 발정주기는 안정되지 않으며, 성성숙에 도달한 뒤에 안정된 발정주기를 영위하게 된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="26">•</span><span><b>성성숙에 영향을 미치는 요인</b></span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>소의 성성숙은 다른 동물과 마찬가지로 체격의 성숙보다 먼저 일어나며, 성성숙에 도달하는 연령(월령)은 품종, 계통, 기후조건, 영양, 사양관리 등의 요인에 영향을 받는다. 특히 육성 중의 영양상태가 성성숙에 미치는 영향은 커서, 고에너지 사료로 사육한 소는 저에너지 사료로 사육한 소보다 빨리 성성숙에 도달한다. 일반적으로 젖소는 육우보다 성성숙에 도달하는 것이 빠르다고 한다. 암소의 성성숙 월령은 홀스타인이 9~11개월, 저지가 8개월, 헤리퍼드가 13개월 무렵, 흑모화종이 10~14개월로 되어 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">발정주기</div>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>소는 다발정동물로, 연중 발정주기를 반복한다. 발정주기는 발정기와 황체기, 혹은 난포기와 황체기로 크게 나뉜다. 황체기는 황체 초기, 황체 개화기, 황체 후기로 구분되는 경우도 있다. 발정부터 발정까지의 간격을 성주기 또는 발정주기라 하며, 발정일 혹은 배란일을 0일로 하여 센다. 소의 발정주기 길이는 품종, 연령, 계절, 사양환경에 따라 차이가 보이지만 18~23일로 평균 21일이다. 일반적으로 영양상태가 좋은 것은 길고, 불량한 것은 짧아지는 경향이 있다. 또한 미경산우(20.2일)의 발정주기는 경산우(21.3일)보다 1~2일 짧고, 젖소의 발정주기는 육우보다 긴 경향이 있다. 나아가 성성숙에 도달한 육성우와 경산우의 분만 후 초회 배란부터 다음 배란까지의 일수는 8~15일로 짧지만, 다음 발정주기는 정상적인 길이로 반복되게 된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="29">•</span><span><b>난소, 난포 발육</b></span></p>
<p class="bx-num"><span class="bxn" data-n="30">•</span><span>소에서는 발정주기 중에 난포의 발육·퇴행이 2회 또는 3회 일어난다. 이 난포의 발육 및 퇴행은 파상적으로 일어나기 때문에 「난포파(난포발육파: follicular wave)」라고 불린다(그림 5-1-6). 하나의 난포파는 배란 직전에 직경 4 mm 정도의 여러 개의 새로운 소난포의 발육에서 시작된다. 한 무리의 난포 중에서 가장 발육이 진행된 난포의 직경이 약 8.5 mm에 도달하면 다른 난포의 발육은 정지하고, 이 최대 직경의 난포만이 발육을 계속한다. 이 선발된 난포는 「주석난포(dominant follicle)」라 불리며, 소난포의 발육을 촉진하는 난포자극호르몬(FSH)의 분비를 억제하는 인히빈을 분비함으로써 다른 난포의 발육을 억제한다. 선발된 주석난포는 난포벽에 황체형성호르몬(LH)의 수용체를 가지고 있어, LH의 일과성 대량 방출(LH 서지)에 의해 배란한다. 배란 후에 발육하는 주석난포는 발정주기 8~11일 무렵까지 발육을 계속하지만, 이 시기는 난소 내에 황체가 존재하는 황체기에 해당하며, 황체의 존재 하에서는 LH 서지가 일어나지 않기 때문에 이 주석난포는 배란에 이르지 못하고 폐쇄된다. 주석난포의 폐쇄에 따라 다시 여러 개의 새로운 소난포의 발육이 시작되어 새로운 난포파의 발현이 개시된다. 하나의 발정주기 내에 2회의 난포파(2난포파형)를 가진 소에서는 최초의 난포파(제1 난포파)는 배란 직전에 시작되고, 2회째 난포파(제2 난포파)는 발정주기 10일 전후부터 시작된다. 3난포파형의 소에서는 제1 난포파는 배란 직전에 시작되고, 제2 난포파는 발정주기 9일 전후부터, 제3 난포파는 발정주기 16일 전후부터 시작된다. 어느 난포파형에서도 최종 난포파의 주석난포가 황체 퇴행에 의한 황체호르몬 농도의 저하에 따라 발육·성숙하여 배란난포가 된다. 성숙한 배란난포는 발정기가 되면 급격히 발육하여 직경 12~24 mm에 도달하고 난소 표면에 융기한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="31">•</span><span><i>그림 5-1-6 2웨이브 소에서의 난포의 발육·퇴행 및 배란. 가로축 발정주기(발정→발정), 세로축 난포의 크기. 발정 직후 소난포군에서 제1파가 발육해 주석난포가 되었다가 폐쇄·퇴행하고, 주기 중반에 제2파가 시작되어 그 주석난포가 다음 발정 시에 배란하는 모식도</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="32">•</span><span><b>난소예비능의 평가(동난포수 계측과 항뮐러관호르몬 측정)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>난소예비능(ovarian reserve)은 난소가 가진 잠재적인 난소기능의 용량을 나타내는 지표이다. 난소의 기능은 수정 가능한 상태로의 난자 성숙과 성스테로이드호르몬의 생산으로 크게 집약할 수 있으며, 여기에는 난자, 과립막세포, 협막세포가 관여한다. 수태율 저하에는 여러 요인을 생각할 수 있지만, 난자의 양적·질적 저하도 한 원인이 된다⁹⁾. 난소예비능의 평가는 소의 장래 번식능력의 예측을 가능하게 한다¹⁰⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>항뮐러관호르몬(anti-Müllerian hormone: AMH)은 발육난포의 과립막세포에서 생산되는 당단백질로, 소에서 발육난포의 크기 마커로서의 가능성이 시사되고 있다. AMH의 혈중농도와 번식성적을 포함한 번식성, 과배란처치에 대한 난소의 반응성과의 관계가 보고되어 있다. 보고에 따라 기준치는 다르지만, 혈중농도가 높으면 번식성이나 과배란처치에 대한 반응성이 높은 결과로 나타나고 있다. 흑모화종에서는 기준치를 0.21 ng/mL(측정값의 평균값)로 하여, 혈중농도가 높은 군에서 과배란처치에 대한 반응성이 높다는 것이 보고되어 있다. AMH 농도 측정은 ELISA 키트로 이루어지기 때문에 농가에서 실시간으로 AMH 혈중농도를 측정하는 것은 곤란하다¹¹⁻¹⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>동난포수(antral follicle count: AFC)는 초음파검사로 결정되며, 모든 발육단계의 난포 총수와 정의 관계가 있고, 직경 3 mm 이상의 난포수로 정의된다. AFC는 AMH와 마찬가지로 번식성적을 포함한 번식성, 과배란처치에 대한 난포의 반응성, 생체 난자 흡인에서의 흡인 난자수, 황체기능과 관련되어 있다. AFC는 발정주기의 어느 단계에서도 평가 가능하며, 농가에서 실시간으로 측정할 수 있다. AFC는 개체 내에서의 재현성이 높고, 개체차가 크다. 보고에 따라 기준치(동난포수)는 다르지만, 난소 중의 동난포수가 많으면 과배란처치에 대한 반응성이나 번식성이 높은 결과로 나타나고 있다. 육용 품종(외국 품종)에서는 AFC가 15개 이하인 군을 저AFC군, 25개 이상인 군을 고AFC군으로 한 경우, 고AFC군에서 과배란처치에 대한 난소의 반응성이 높은 결과가 얻어지고 있다. 또한 일본의 홀스타인에서는 11개 미만을 저AFC군(Low), 11개 이상 15개 미만을 중AFC군(Intermediate), 15개 이상을 고AFC군(High)으로 한 경우, 저AFC군과 비교해 고AFC군에서 분만부터 수태까지의 기간 중앙값이 작은 등 번식성적이 양호하다는 것이 보고되어 있다(표 5-1-1)¹⁵⁻¹⁹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>표 5-1-1 젖소의 동난포수(AFC)와 번식성적의 관계.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목</th><th>저(11개 미만)</th><th>중(11~15개)</th><th>고(15개 이상)</th></tr><tr><th>두수(두)</th><td style="text-align:left">49</td><td style="text-align:left">71</td><td style="text-align:left">69</td></tr><tr><th>유기 횟수(회〈산차〉)</th><td style="text-align:left">1.6±0.7</td><td style="text-align:left">1.7±0.8</td><td style="text-align:left">1.6±0.7</td></tr><tr><th>호르몬 처치를 받은 두수(%)</th><td style="text-align:left">44.9</td><td style="text-align:left">50.7</td><td style="text-align:left">39.1</td></tr><tr><th>분만부터 초회 AI까지의 일수(일)</th><td style="text-align:left">76.6±22.6ᵇ</td><td style="text-align:left">76.5±20.7ᵃᵇ</td><td style="text-align:left">69.9±19.2ᵃ</td></tr><tr><th>초회 AI에 의한 임신율(%)</th><td style="text-align:left">42.9</td><td style="text-align:left">49.3</td><td style="text-align:left">55.1</td></tr><tr><th>분만 후 100일 시점의 임신율(%)</th><td style="text-align:left">51.0ᵇ</td><td style="text-align:left">50.7ᵃᵇ</td><td style="text-align:left">71.0ᵃ</td></tr><tr><th>분만 후 200일 시점의 임신율(%)</th><td style="text-align:left">90.6</td><td style="text-align:left">89.9</td><td style="text-align:left">94.7</td></tr><tr><th>분만부터 수태까지의 일수 중앙값(일)</th><td style="text-align:left">98.0ᵇ</td><td style="text-align:left">100.0ᵇ</td><td style="text-align:left">75.0ᵃ</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="37">•</span><span>※ 주) 고AFC군에서는 분만 후 초회 AI까지의 간격이 짧고, 분만 100일 후의 임신율이 높다. 또한 분만 후 수태까지의 간격(중앙값)이 짧다. 평균값±표준편차, a-b 간에 유의차 있음(P<0.05). 문헌 16에서 인용·개변</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="38">•</span><span><b>황체 형성과 퇴행</b></span></p>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>배란 후의 배란 부위에는 황체가 형성된다. 황체는 황체세포와 모세혈관으로 채워진 실질성 조직으로, 배란 후 약 7일 정도에 성장을 완료하여 장경 20 mm 이상의 크기가 된다. 그 후 8~9일간 존속하며 황체호르몬을 분비한다. 수태한 경우에는 황체가 그대로 존속하여 기능하지만, 불수태인 경우에는 발정주기 16~18일 무렵부터 퇴행하기 시작한다. 퇴행 개시 후 황체의 크기는 서서히 작아지고, 혈중 황체호르몬 농도는 신속히 저하한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="40">•</span><span><i>그림 5-1-7 운동장(숲속)에서의 스탠딩 행동(왼쪽)과 방목지(산림)에서의 발정행동(오른쪽). 흑모화종 사진</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="41">•</span><span><b>자궁</b></span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>자궁은 성스테로이드호르몬(에스트로겐, 프로게스테론〈P₄〉)의 작용을 받는다. 발정기에는 에스트로겐의 작용에 의해 자궁내막의 충혈, 부종이 관찰된다. 또한 자궁 평활근은 수축운동성이 항진되기 때문에 직장검사 시의 촉진에 반응하여 강하게 수축한다. 황체기에는 P₄의 작용에 의해 자궁내막의 비후나 자궁선의 증식 등 착상을 향한 변화가 보인다. 황체기의 자궁은 부드럽고 이완된 상태로 촉지된다. 발정기에는 외자궁구가 충혈, 이완되고, 자궁경관부는 투명하고 부드러우며 견사성이 높은 경관점액을 다량으로 분비한다. 발정기의 경관점액을 슬라이드글라스에 도포하여 건조시키면 양치상 결정구조가 형성되며, 이 확인은 발정기 판정의 보조수단도 된다. 황체기에는 P₄의 작용에 의해 자궁경관은 가늘게 조여진 상태가 되고, 외자궁구는 점조하고 농후한 점액으로 봉쇄된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="43">•</span><span><b>발정</b></span></p>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>교배를 위해 암컷이 수컷을 성적으로 허용하는 상태가 발정이며, 그때 보이는 특징적인 행동이나 외견의 변화가 발정징후이다. 발정기의 암소는 안절부절못하여 보행수나 발구르기 횟수 등의 상승, 식욕 감퇴, 채식의 산만, 포효 등의 특징적인 행동이 보인다. 또한 다른 소와 서로 음부의 냄새를 맡거나 허리 부위에 턱을 올려놓는 등의 동작도 보인다. 발정 암소는 다른 암소에 대한 승가(마운팅)나 다른 암소의 승가를 허용하는(스탠딩) 등의 특징적인 행동을 보인다(그림 5-1-7). 스탠딩 행동은 강한 발정상태를 나타내는 지표가 되므로 이 확인은 중요하다. 발정의 지속시간은 5~20여 시간으로 광범위에 걸치며, 개체차가 크고 연령이나 우군 규모에 따라서도 다르다. 외모의 변화로는 발정점액의 외음부로부터의 누출, 외음부의 종창, 충혈 등을 들 수 있다. 발정점액의 누출에서는 투명하고 부드러우며 견사성이 높은 점액이 외음부에서 길게 늘어져 있는 모습을 관찰할 수 있다. 황체기의 외음부는 표면에 잔주름이 보이고 긴축되어 있지만, 발정 1~2일 전부터 주름이 사라지고 종창하기 시작한다. 발정 시에는 종창의 정도가 항진되고, 질 점막이 충혈, 습윤해 있는 모습이 관찰된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="45">•</span><span><b>배란</b></span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>소의 배란은 발정 개시부터 약 28시간 후에 일어나는 것으로 되어 있지만, 그 범위는 20~45시간으로 큰 폭이 있어 개체에 따른 차이가 크다. 배란은 LH가 일과성으로 대량 방출되는 LH 서지에 의해 유발된다. LH 서지는 성숙한 배란난포에서 분비되는 다량의 에스트로겐에 의해 유도된다. 배란은 LH 서지의 약 25시간 후에 일어나며, 이 시간에는 개체차가 그다지 보이지 않는다. 이것은 성선자극호르몬 방출호르몬(GnRH) 제제를 이용하여 인위적으로 LH 서지를 유도하고 배란 유기를 꾀하는 경우에, GnRH 제제 투여부터 배란까지의 시간에 편차가 적다는 것, 호르몬 처치에 의해 배란 타이밍을 제어할 수 있다는 것을 나타낸다. 배란에 이르는 난포의 크기는 직경 15~24 mm로, 통상 1개의 난포가 배란하지만 2개 배란하는 소도 있다. 젖소는 육우에 비해 2개 배란의 비율이 높다. 특히 젖소의 경산우로 유량이 많은 소는 2개 배란의 비율이 높아 8~10%의 소가 2개 배란한다. 그 결과 쌍둥이를 임신하는 비율도 높아진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수정</div>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>정자와 난자가 만나 접합자(zygote)를 형성하기까지의 과정을 「수정(fertilization)」이라 한다. 수정은 난관팽대부에서 일어나기 때문에 정자는 난관까지 이동해야 한다. 자연교배로 질 내에 사정된 정자는 암컷 생식도(질, 자궁경관, 자궁, 난관)의 수축운동 등에 의한 수송과 정자 자신의 운동성에 의해 난관협부에 도달하여 배란까지 저류된다. 정자가 난관협부에 도달하기까지의 시간은 자연교배로 질 내에 사정된 경우는 6~8시간, 인공수정(AI)으로 자궁 내에 주입된 경우는 2~3시간을 요한다. 정자는 난관협부에서 18~20시간 저류된다. 정자는 암컷의 생식도 내를 통과하는 동안 4~8시간에 걸쳐 생리적, 기능적으로 변화하여 수정 가능한 능력을 획득한다. 이 변화를 「수정능 획득(capacitation)」이라 한다. 소 정자의 수정능력 보유시간은 24~48시간이다. 배란된 난자는 난관채에 부착하여 난관채의 융모운동에 의해 난관 내로 들어간다. 난관에 들어간 난자는 난관 내에서 난관상피의 융모운동이나 난관의 수축, 이완 등의 운동에 의해 난관팽대부로 이송된다. 배란된 소 난자의 수정능 보유시간은 10~12시간이다. 난관협부에 저류되어 있던 정자는 배란이 일어나면 난관팽대부로 이동한다. 난관팽대부에서 난자와 만난 정자는 난자를 둘러싸고 있는 투명대에 결합한다. 정자가 투명대에 결합하면 정자의 세포막과 첨체외막이 부분적으로 융합하여 포상화되고, 첨체 내의 효소가 방출된다. 이것은 「첨체반응(acrosome reaction)」이라 한다. 정자는 이들 효소의 작용으로 투명대에 작은 구멍을 뚫고 투명대를 통과하여 위란강 내로 진입한다. 정자가 난세포질에 침입하면 난자는 제2극체를 방출하고 감수분열을 완료하여 자성전핵을 형성한다. 난자에 침입한 정자는 두부가 팽창하여 웅성전핵을 형성한다. 자웅의 전핵이 융합하여 수정이 완료된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수태</div>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>수정 후, 수정배는 세포분열을 반복하면서 자궁을 향해 난관을 하강한다. 소에서는 배란 후 3~4일째에 8~16세포기의 수정란이 자궁으로 하강한다. 수정배가 난관에 존재하는 16세포기에 극미량의 인터페론(IFN)-τ가 수정배에서 분비되는 것이 세포배양계에서 확인되어 있어, 이 시기부터 수정배와 모체 측의 크로스토크가 시작되고 수태를 향해 면역계가 조절되는 것이 시사되고 있다²⁰⁾. 자궁 내의 수정배는 배란 후 6~7일에 배반포라 불리는 단계로 발육한다. 수정배와 자궁내막 사이에도 수태를 향해 여러 물질을 매개로 한 복잡한 크로스토크가 관여한다. 임신 성립 시기의 자궁내막 기능 조절은 P₄가 주체가 된다. P₄는 난소의 황체 유래이며, 자궁내막에서의 옥시토신, 프로스타글란딘(PG)F₂α의 조절을 통해 난소기능을 제어하고 있다. 이 상호조절이나 P₄ 분비, 유지 조절의 불비는 조기 배 사멸의 한 원인이 된다. 배반포는 분할을 진행하여 크기를 늘리고, 투명대에서 탈출하여(탈출 배반포) 급속히 발육을 진행해 수정 후 13일 무렵에는 길이 30 mm 정도의 타원구상으로 발육한다. 그 후 수정배는 급속히 신장을 계속하여 수정 16~18일째에는 길이 17~25 cm 정도의 가는 끈 모양으로 신장한다(그림 5-1-8). 이 시기에 수정배의 영양막세포로부터의 IFN-τ 생산·분비가 정점에 달하여 모체 측에 임신 정보를 전달(모체의 임신 인식)함과 동시에 수정배의 발육·신장 조절을 행한다. 또한 IFN-τ는 자궁내막에서의 옥시토신 수용체 발현을 억제함으로써 PGF₂α 생산을 억제하고 황체 퇴행을 저지하고 있다. 나아가 IFN-τ와 P₄는 협조하여 자궁내막에서의 자궁유상액단백질(uterine milk protein: UTMP) 생산, 매트릭스메탈로프로테아제(matrix metalloproteinase: MMP), 세포외매트릭스메탈로프로테아제유도인자(extracellular matrix metalloproteinase inducer: EMMPRIN)의 활성화를 통해 세포외매트릭스(extracellular matrix: ECM)를 개변하고, 자궁내막의 수태(수정배의 착상)를 향한 기능을 부활화한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="49">•</span><span><i>그림 5-1-8 임신 초기 수정배의 발달. 가로축 수정 후 일수(4, 8, 12, 16, 20일). 위: 난관·자궁 내에서의 이동(누두〈난관〉→난관→자궁난관접합부→자궁각; 배가 자궁에 침입, 투명대 탈출, 배의 신장, 자궁내막과의 대면·접촉, 자궁내막에의 접착; 이 구간에 IFN-τ 분비; 황체, 비임신각측 난소). 아래: 배의 성장과 발달(150 μm 분할배→상실배→205 μm 배반포→340 μm 탈출 배반포→30 mm 신장배→190 mm; 영양외배엽, 내부세포괴). 문헌 21에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>수정배는 신장을 계속하여 수정 후 22일째에는 배란측과 반대측 자궁강 내에도 신장하고, 수정 후 28~32일 무렵에는 자궁강 전체로 확장하여 자궁내막에 접착한다. 배세포와 자궁내막세포의 접착과 그 후 침윤 시기에는 자궁 측에는 렉틴, 케모카인, 카텝신 등의 관련 분자가, 배 측에는 프로락틴이나 프로락틴 관련 단백질, 케모카인 수용체 등 세포의 접착, 침윤을 촉진하는 분자가 발현한다. 수정 후 25일 이후에 태자 근방의 자궁소구부 내막에 대응하는 부분의 영양막(융모막)에서 융모총 형성이 시작되어, 자궁소구부 내막과 융합하여 태반절이 형성(최초의 태반 형성)된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>태반절 형성 시기에는 영양막의 이핵세포(binucleate cell: BNC) 유래의 내재성 레트로바이러스 분자(endogenous retrovirus: ERV)에 의해 BNC와 자궁내막 상피세포의 세포융합이 진행되어 다핵세포가 형성된다. 나아가 프로락틴, 프로락틴 관련 단백, 임신관련당단백질(pregnancy-associated glycoprotein: PAG), 카텝신이나 트랜스포밍증식인자(TGF)-β 슈퍼패밀리 등 각종 사이토카인이 공동으로 혈관신생을 행하여 융모총을 형성하고, 자궁내막 소구부의 내막 상피층이 재구축되어 태반절이 형성된다. 이 밖에 후성유전학에 의한 유전자 발현 조절이나 IFN-τ에 반응한 면역계 분자(ISG15, MX1, MX2, OAS1), 세포내 신호전달계 분자 등의 발현 조절도 더해져, 많은 분자가 통합적으로 기능하여 착상이 완료되고 수태가 성립한다²¹˒²²⁾(그림 5-1-8).</span></p>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span><span style="color:var(--ink-soft)">(저자: 堂地修·大島一修)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">성성숙과 성장생리</div>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>육성기의 송아지에게 일어나는 가장 현저한 생리적 변화는 성성숙이다. 포유동물의 S자형 성장곡선의 정점, 즉 성장이 촉진에서 억제로 옮겨가는 전환점의 성장속도가 최대가 되는 시기는 대체로 성성숙기에 해당하며, 성장속도는 성호르몬이나 그 밖의 내분비계와 관계가 깊다²³⁻²⁵⁾. 본 항에서는 성장의 성차에 대해 개설한 뒤, 성성숙 전후의 성장 촉진에 중심적인 역할을 하고 있는 성호르몬과 소마토트로핀 축의 기능에 대해 정리하고, 육성기의 영양제어에 의한 소마토트로핀 축의 수식과 성장제어의 가능성에 대해 서술한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">성장특성의 성차</div>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>소의 성장속도는 수컷이 암컷보다 빠르고, 거세는 수컷의 성장속도를 저하시킨다. Hammond나 Palsson 등의 가축 체조직 발달순위 이론에 따르면, 신경계가 가장 조기에 발달하고 뼈, 근육, 나아가 지방조직의 순으로 발달이 이어진다고 되어 있다. 소에서는 성장 초기, 생체중으로 250~300 kg 정도, 즉 성성숙기 무렵까지는 체조직 성장의 성차가 명확하지 않고, 가령과 함께 수소의 근육 생산능력과 암소의 지방 축적 비율의 증대가 분명해져 간다²⁵⁾. 여기서는 이유부터 성성숙기에 이르는 육성기의 성장특성 성차의 실례로서, 이유 후 홀스타인 수송아지의 거세 영향을 농후사료 다급 하에서 조사한 사양시험 성적을 소개한다²⁶⁾. 3개월령에 거세한 후, 성성숙 도달 후인 12개월령까지 거세 수소의 증체는 저하했지만, 대사체중당 사료섭취량 및 사료요구율에는 수송아지 거세의 영향이 보이지 않았다(표 5-1-2). 이때 지육중량은 거세에 의해 감소했으나, 지육 수율이나 등심 단면적 그 밖의 지육형질에 거세에 의한 영향은 보이지 않았고, 지육 중 적육이나 지방의 비율 등 체조직 구성에도 차이는 인정되지 않았다(표 5-1-3). 즉, 송아지의 성장속도는 이유 후부터 성성숙에 이르는 과정에서 명확한 성차가 인정되지만, 근육 혹은 지방조직의 성장속도의 성에 따른 차이는 성성숙기 이후에 명확해지는 것으로 생각된다. 실제로 심멘탈계 수소를 2개월령 시에 거세하여 22개월령에 도축하여 비교하면, 거세 수소에서는 지육중량과 등심 단면적의 저하, 피하지방 두께와 근내지방도의 증가가 관찰되고 있다²⁷⁾.</span></p>

<div class="bx-sub"><div class="bx-subtitle">성호르몬과 소마토트로핀 축에 의한 성장조절</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="59">•</span><span><b>성호르몬에 의한 소의 성장조절</b></span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>그림 5-1-9에 성호르몬의 분비 제어와 대사나 성장 조절에서의 성호르몬 작용의 개략을 나타냈다. 성호르몬에는 성장 촉진과 대사 조절 효과가 인정되며, 성장 촉진 작용의 일부는 소마토트로핀 축에 대한 영향을 통하고 있다²⁸˒²⁹⁾. 안드로겐과 에스트로겐 모두가 시상하부 경유로 소마토트로핀(성장호르몬: GH) 분비를 자극하여 인슐린유사성장인자(IGF)-1 생산량의 증대에 의해 성성숙기 골성장의 직선적인 증가를 일으킨다. 나아가 안드로겐은 연골조직에 대해 직접적으로, 그리고 IGF-1의 파라크린 작용의 증대를 일으키지만, 에스트로겐은 골단에서의 연골 융합에 의한 골성장 정지에 관여한다. 안드로겐에 의한 근육량 증대는 골격근에 존재하는 안드로겐 수용체를 통한 것으로, IGF-1의 파라크린 작용을 자극하여 근단백질 합성의 촉진, 근위성세포의 증식과 융합에 의한 근섬유당 핵수의 증가, 근형성을 촉진하는 전사인자의 발현 항진 등을 수반한다. 소나 면양의 대부분 근육에서는 안드로겐 수용체가 사람의 그것보다 적기 때문에 안드로겐에 의한 근육 증대 효과는 작다. 한편 반추동물에서는 GH계에 대한 스테로이드호르몬의 영향이 강력하다고 하며, 성장 촉진에 관해서는 테스토스테론 쪽이 에스트로겐보다 작용이 강력한 듯하다. 에스트로겐은 에너지 대사나 지방 축적의 조절에도 관여하고 있어, 지방세포의 크기나 그 에너지 대사에 관계하는 유전자군의 발현 조절에 관여하고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="61">•</span><span><i>그림 5-1-9 성호르몬 분비의 조절과 그 작용. 시상하부→GnRH→뇌하수체전엽→LH, FSH→정소(테스토스테론)/난소(에스트로겐); 부신피질의 안드로스텐디온·데히드로에피안드로스테론은 말초조직에서 변환효소로 전환, 테스토스테론은 아로마타제로 에스트로겐으로 전환. 안드로겐 수용체 경유: GH 분비↑, IGF-1 생산↑, 근육단백질 합성↑, 근위성세포 증식, 근위성세포 분화. 에스트로겐 수용체 경유: 연골세포 증식, 연골세포 증대, 인슐린 감수성↑, PPARγ↑, β아드레날린 수용체↑. 생식기능 조절 외에도 성호르몬은 대사나 성장 조절에 여러 역할을 하며, 안드로겐 수용체를 통한 작용은 성장 촉진 작용이 강한 데 비해 에스트로겐 수용체를 통한 성호르몬 작용은 대사 조절 작용이 크다. 문헌 28에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="62">•</span><span><b>소마토트로핀 축에 의한 소의 성장조절</b></span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>소마토트로핀 축은 뇌하수체전엽에서 분비되는 GH에 의한 직접 및 간접 작용에 의해 성장 및 대사 조절에서 중심적인 역할을 담당하고 있다²⁹⁾(그림 5-1-10). GH는 펄스상으로 분비되어 소 순환혈 중에서는 펄스상의 농도 변동 패턴을 보이며, 펄스의 크기나 빈도가 생리활성을 좌우하고 품종이나 계통, 성별, 가령, 영양상태 등에 따라 다르다는 것이 알려져 있다. GH의 성장 촉진 작용의 대부분은 간 및 그 밖의 조직에서 GH에 의해 합성·분비가 촉진되는 IGF-1의 작용에 의한다. GH에는 대사 조절 작용으로서 카테콜아민이나 갑상선호르몬에 대한 감수성 향상이나 인슐린 저항성의 야기 등에 의한 지방 동원의 촉진, 포도당 절약 작용 등이 알려져 있다. 나아가 GH는 영양소 분배 조절에 관여하여 호메오레시스 기구에 의한 비유 촉진 작용을 발휘하는 것으로 생각된다. GH에 의한 성장 촉진 작용을 직접적으로 담당하는 것은 IGF-1에 의한 강력한 세포 증식·증대 활성이지만, IGF-1은 GH와 영양상태에 의해 합성·분비가 조정되고 있다. 내분비 인자로서의 IGF-1의 순환혈 중 농도는 성성숙기에 최고가 되고 성장속도와 높은 정의 상관을 보이기 때문에, 개체의 성장능력 선발지표로서의 활용도 시도되고 있다. 혈중 IGF-1은 대부분이 IGF 결합단백질(IGFBP) 및 산불안정성 단백질과 함께 결합하여 존재하며, 그 반감기나 표적조직으로의 운반이 정교하게 조절되고 있는 것으로 생각된다. IGF계의 또 하나의 리간드인 IGF-2에 대해서는 태자기의 성장 촉진에 대한 관여나 암화와의 관련이 지적되고 있지만, 소에서의 분비 동태나 작용에 대해서는 불명확한 점이 많다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="64">•</span><span><i>그림 5-1-10 소마토트로핀 축을 중심으로 한 내분비계에 의한 동물의 성장조절. 시상하부→소마토스타틴(SRIF, 억제)/성장호르몬방출인자(GRF, 촉진)→뇌하수체전엽→GH→간 및 기타 장기→IGF-1→성장(세포증식·단백질합성); 여기에 갑상선호르몬, 인슐린, 안드로겐, 에스트로겐은 촉진적으로, 당질코르티코이드는 억제적으로 작용. 실선(→)은 촉진을, 파선(⇢)은 억제적 작용을 나타낸다. 문헌 29에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="65">•</span><span><b>소마토트로핀 축의 성차</b></span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>앞서 서술한, 3개월령부터 12개월령까지 농후사료 다급으로 사육하여 그 성장속도에 명확한 차이가 보인 홀스타인 수소와 동 거세 수소의 소마토트로핀 축 호르몬 및 결합단백질 농도의 성차를 측정한 결과²⁶⁾를 아래에 나타낸다. 어린 시기부터 고영양 상태에 있던 수소와 거세 수소의 GH 분비활성은 가령에 따라 급속히 저하했다. 3 내지 5개월령 시에는 수소의 혈중 GH 농도가 높았지만, 펄스상의 GH 분비는 거세에 의해 변화하지 않았고, 성성숙기 전후의 수소와 거세우의 GH 분비 동태에 분명한 차이는 인정되지 않았다(그림 5-1-11). 순환혈 중 IGF-1 농도는 어린 시기부터 성장에 따라 상승하여 성성숙기에 최고값에 도달했지만, 그 상승속도와 최고값은 모두 수소에서 거세우보다 높았고(그림 5-1-12), DG의 추이와 잘 일치하는 변화를 보였다. 또한 혈중 IGF-2 농도는 성장에 따른 저하가 수소에서 명료하게 보였고, 성성숙기에 수소에서 거세우보다 낮았다(그림 5-1-13). 성성숙기에 도달한 면양에서도 혈중 IGF-2 농도가 수컷에서 암컷보다 낮다는 성차가 인정되고 있지만³⁰⁾, 그 생리적 의의는 밝혀져 있지 않다. 그림 5-1-14에는 순환혈 중 IGFBP 가운데 농도가 높았던 IGFBP-3과 IGFBP-2의 추이를 나타냈다. IGFBP-3 농도는 성장과 함께 상승하여 수소에서 거세우보다 높았고, 혈중 IGF-1 농도와 평행한 추이를 보였다. 반대로 IGFBP-2 농도는 성장에 따라 저하하여 수소에서 거세우보다 낮았다. 이상과 같이 농후사료 다급의 고영양 조건에서 육성한 소에서는 GH 분비활성은 가령과 함께 급속히 저하하고, GH 분비 동태의 거세에 의한 성차는 성성숙기에 명료하지 않았다. 한편 IGF-1과 IGFBP-3의 혈중농도는 거세 및 가령에 의한 변화가 성장속도의 변화와 잘 대응하고 있어, 소마토트로핀 축에 의한 소의 성장조절에는 IGF-1의 작용이 중심적인 역할을 하고 있음을 나타낸다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="67">•</span><span><i>그림 5-1-11 홀스타인 수송아지의 거세가 육성기 GH의 펄스상 분비활성에 미치는 영향. 3, 5, 8, 12개월령의 GH 총평균농도(ng/mL): 수소 약 6.2→4.5→3.4→2.2, 거세 수소 약 4.0→2.9→2.3→2.2(5개월령 \</i>); GH 베이스라인 농도: 수소 약 6.1→4.6→2.5→2.4, 거세 약 3.7→2.8→1.8→2.2(3, 5개월령 \<i>); GH 펄스 크기(ng/mL): 수소 약 3.5, 1.5, 8.0, 2.0, 거세 약 6.2, 2.8, 3.7, 1.8; GH 펄스 빈도(회/6시간): 수소 약 0.6, 0.8, 2.7, 1.6, 거세 약 1.2, 2.4, 2.2, 2.0. 문헌 26에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="68">•</span><span><i>그림 5-1-12 홀스타인 수송아지의 거세가 육성기 순환혈 중 IGF-1 농도에 미치는 영향. 3, 5, 8, 12개월령의 혈중 IGF-1(ng/mL): 농후사료 다급 홀스타인 수소 약 60→145→290→295, 3개월령 거세 수소 약 50→100→160→165(8, 12개월령 \</i>\<i>). 문헌 26에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="69">•</span><span><i>그림 5-1-13 홀스타인 수송아지의 거세가 육성기 순환혈 중 IGF-2 농도에 미치는 영향. 3, 5, 8, 12개월령의 혈중 IGF-2(ng/mL): 수소 약 103→92→75→73, 거세 수소 약 95→95→88→92(12개월령 \</i>). 문헌 26에서 인용·개변*</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="70">•</span><span><i>그림 5-1-14 홀스타인 수송아지의 거세가 육성기 순환혈 중 IGF 결합단백질 농도에 미치는 영향. 상대값. IGFBP-3(36-40 kDa): 3→12개월령에 수소 약 3.9만→7.8만→11만→12만, 거세 약 3.2만→6.2만→6.9만→8.6만으로 상승; IGFBP-2(32 kDa): 수소 약 3.1만→2.0만→0.8만→0.4만, 거세 약 4.6만→2.6만→1.4만→1.6만으로 저하. 각 5두의 혼합 혈장 시료의 리간드 블로팅에 의한 측정. 문헌 26에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성기의 영양제어에 의한 성성숙 및 소마토트로핀 축 변화에 대한 영향</div>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>앞 항에서 지적되어 있듯이, 성성숙 도달 연령(월령)은 품종이나 영양 등에 의한 영향이 크며, 특히 육성 중의 영양상태를 좋게 하면 성성숙에 도달하는 것이 빨라진다. 육성기의 과잉 영양 공급은 젖소 육성우의 유선 발육 저해나 비육 밑소의 과비에 의한 비육단계에서의 조기 식욕 정체 발생 등 여러 문제의 발단이 된다. 한편으로 육성기의 발육 촉진을 손쉽게 달성하기 위해 안이하게 농후사료 다급에 의존하기 쉽다. 그래서 비육 밑소의 육성기 농후사료 급여 제한이 사양성적에 미치는 효과와 소마토트로핀 축에 나타나는 변화를 검토한 사례²⁶⁾를 소개한다. 홀스타인 거세우에 대해 성성숙 전인 5~8개월령 시에 농후사료 급여 제한을 하면, 농후사료를 포식시킨 것에 비해 육성기의 조사료 섭취비율 증가와 ME 섭취량 억제, 8~18개월령의 비육기간에서의 사료요구율 저하가 초래되었다(표 5-1-4). 이에 따라 육성기의 성장속도가 약간 저하했으나, 그 후 10개월간의 농후사료 다급에 의한 비육 시에 사료이용효율이 개선되어 증체가 회복되었고, 비육 종료 시의 육량 및 육질을 손상하지 않고 지육 중 적육 비율이 증가하고 지방 비율이 저하했다(표 5-1-5, 표 5-1-6). 이 기간의 GH 분비능에는 유의한 영향이 보이지 않았으나, 혈중 IGF-1 농도는 농후사료 급여 제한에 의해 육성기 종료 시에 저하했다. 그 후 성성숙기에 최고 수준에 도달한 뒤 가령과 함께 혈중 IGF-1 농도는 서서히 저하했다. 즉, 어린 시기의 제한 급여에 의해 혈중 IGF-1 농도가 급상승을 보이는 시기가 지연되었으며, 혈중 IGF-1 농도의 변화는 성장속도의 차이와 잘 대응하고 있었다(그림 5-1-15). 이들 결과로부터, 성성숙 전후의 육성기에서의 영양제어는 성장에 따른 소마토트로핀 축의 발달 경과를 변화시키고, 성장 이력이나 생리적 성숙도를 변화시킴으로써 지방 축적의 진행에 영향을 미칠 수 있으므로, 송아지의 성별이나 생리 단계, 생산 목적에 따른 적절한 제어가 요구된다.</span></p>

<p class="bx-num"><span class="bxn" data-n="81">•</span><span><span style="color:var(--ink-soft)">일본송아지 5-1 육성기의 발육과 생리적 변화.</span></span></p>

<div class="bx"><div class="bx-title">5-3 육성기의 영양관리와 비육</div>
<div class="bx-sub"><div class="bx-subtitle">육성기와 비육기</div>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>육우(肉用牛)의 생산 체계를 소의 출생부터 비육 종료까지 크게 둘로 나누면, 송아지의 출생부터 송아지 시장 출하까지의 기간을 「육성기」, 송아지 시장에서의 도입부터 비육 종료까지의 기간을 「비육기」로 구분할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>송아지 시장에 상장되는 비육 밑소는 거세우, 암소 모두 대체로 9개월령이다. 따라서 비육우의 육성기란 소의 출생부터 약 9개월간을 가리킨다. 한편 비육 종료는 성별에 따라 차이가 있어, 거세우의 경우 29개월령 전후에 비육이 종료되고, 암소의 경우 이보다 3개월령 정도 길어 32개월령에 비육을 종료하는 경우가 많다. 그러나 브랜드 와규(銘柄牛)<sup>주1)</sup> 중에는 암소를 36개월령까지 비육하는 사례도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>송아지 시장에서 비육 밑소를 도입하지 않는 번식·비육 일관생산의 경우도 육성기와 비육기는 약 9개월령을 경계로 구분할 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="85">•</span><span>※ 주1) 브랜드 와규(銘柄牛): 명칭이 붙여진 소를 총칭하여 브랜드 와규라 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비육 개시 시의 「재사육(飼い直し)」</div>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>고품질 쇠고기 생산을 위해서는 육성기에서 비육기로의 원활한 이행이 중요하다. 그런데 1998년경(현재도 간혹 보이지만)에는 육성기 후반에 농후사료, 즉 옥수수 등의 곡류를 대량으로 급여하여 사육된 비육 밑소가 송아지 시장에 많이 출하되었다<sup>1)</sup>. 이들 비육 밑소는 피모가 매우 부드럽고 피하지방이 두꺼우며, 미근부에 지방이 축적된 꼬리베개(尾枕)가 있는 과비 상태로, 속칭 「화장육이 붙어 있다」고 일컬어졌다. 이러한 과비 상태의 비육 밑소에 대하여 도입 직후부터 농후사료 위주의 사료를 급여하는 비육을 실시한 결과, 생산되는 지육은 지육 중량이 작고 근간지방이 두꺼우며 흉최장근(등심 단면) 면적이 작고, 나아가 등심 단면의 형상이 하트형으로 변형되는 것도 보였다(그림 5-3-1). 이러한 지육의 평가는 낮고 지육 가격도 하락한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>따라서 비육 농가는 과비한 비육 밑소를 도입한 경우, 조사료 위주의 사료를 급여하여 비육 밑소로서 이상적인 상태가 될 때까지 사육하는 「재사육」을 할 수밖에 없었다. 재사육은 2개월 정도 이루어지므로 이 기간의 비육우의 증체는 좋지 않다. 재사육 후 농후사료 위주의 사료 급여를 실시함으로써 비육우의 증체는 개선된다. 이 때문에 비육우의 발육 곡선에서는 체중이 매끄럽게 증가하는 데 비해, 재사육을 한 비육우의 발육은 S자 곡선 모양이 된다<sup>2)</sup>(그림 5-3-2).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="88">•</span><span><i>그림 5-3-1 소 지육의 흉최장근 횡단면. 위: 이상적인 지육, 아래: 등심 단면이 하트형으로 변형되고 면적이 작으며 근간지방이 두꺼워져 있다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="89">•</span><span><i>그림 5-3-2 거세우의 평균 체중과 재사육 시의 체중 추이(4~16개월령). 거세 평균치(문헌 2 참고)는 4개월령 약 120 kg에서 16개월령 약 490 kg까지 직선적으로 증가하는 반면, 재사육 구는 9~10개월령(약 300 kg)에서 정체한 뒤 12~13개월령에 다시 증가하여 14개월령 이후 평균치에 합류하는 S자형을 보인다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성기부터 비육 전기의 적정한 조사료와 농후사료의 비율</div>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>조사료를 충분히 섭취하여 발육이 좋고 골격이 크며 과비하지 않은 비육 밑소를 육성하기 위해, 전국의 도현(道県)이나 단체는 흑모화종 송아지 육성 매뉴얼을 작성하여 번식 농가의 송아지 육성에 관한 기술 지도를 하고 있다. 기후현(岐阜県)의 송아지 육성 매뉴얼<sup>3)</sup>에서는 대략 4개월령까지는 송아지의 제1위 내 융모 발달과 우체의 발육을 촉진하기 위해 농후사료를 위주로 사료를 급여한다. 그 이후는 농후사료를 일정량으로 제한하고 양질의 조사료를 다급함으로써 골격의 발육, 제1위의 근층과 용적, 골격근의 발달, 그리고 비타민 A(VA)의 전구물질인 β카로틴을 축적시키도록 한다(표 5-3-1). 또한 조사료는 화본과 초본 한 종류가 아니라 티모시, 수단그라스, 알팔파 등 송아지의 기호성과 조사료의 제1위 체류 시간을 고려하여 여러 종류를 급여하는 것이 바람직하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>표 5-3-1 사료 급여량의 기준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>월령</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><th>스타터(kg/일)</th><td style="text-align:left">0.2</td><td style="text-align:left">1.0</td><td style="text-align:left">3.0</td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>송아지 육성사료(kg/일)</th><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left">3.0</td><td style="text-align:left">3.5</td><td style="text-align:left">3.0</td><td style="text-align:left">3.0</td><td style="text-align:left">3.0</td></tr><tr><th>양질 건초(kg/일)</th><td style="text-align:left">0.02</td><td style="text-align:left">0.2</td><td style="text-align:left">0.4</td><td style="text-align:left">1.0</td><td style="text-align:left">1.5</td><td style="text-align:left">2.8</td><td style="text-align:left">4.5</td><td style="text-align:left">5.0</td></tr><tr><th>조사료 비율(%)</th><td style="text-align:left">9.1</td><td style="text-align:left">16.7</td><td style="text-align:left">11.8</td><td style="text-align:left">25.0</td><td style="text-align:left">30.0</td><td style="text-align:left">48.3</td><td style="text-align:left">60.0</td><td style="text-align:left">62.5</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span><span style="color:var(--ink-soft)">문헌 3에서 인용·개변</span></span></p>
<p class="bx-num"><span class="bxn" data-n="93">•</span><span>마루야마(丸山) 등은 육성기에서 비육기로의 이행을 원활하게 하여 고품질 쇠고기 생산을 목표로, 육성 후기부터 비육을 개시하는 비육 개시 월령의 조기화 시험을 실시하였다<sup>1)</sup>. 이 시험의 요점은 ①육성기 사양관리의 영향을 해명하기 위해 비육 개시 월령을 3개월 앞당겨 6개월령부터 비육을 개시하는 것과, ②6~9개월령까지의 적정한 조사료와 농후사료의 비율을 해명하는 것이다. 비육 시험에는 6개월령, 평균 체중 176 kg의 흑모화종 거세우 11두를 공시하여, 비육 전기에 조사료를 다량 급여하는 「조다구(粗多区)」 6두와 소량 급여하는 「조소구(粗少区)」 5두의 2구로 나누어 25개월령까지 비육 시험을 실시하였다. 공시우에게는 6~13개월령의 비육 전기에 조다구에는 조사료 비율 40%의 「사료①」을, 조소구에는 조사료 비율 20%의 「사료②」의 혼합사료를 급여하였다. 그리고 비육 중기 이후는 양 구 모두 조사료 비율 20%의 「사료③」, 그리고 조사료 비율 10%의 「사료④」를 급여하여 비육 전기 사료의 영향을 조사하였다<sup>1)</sup>(표 5-3-2). 이들 결과를 토대로 조사료 비율이 생산성에 미치는 영향을 검토한 결과를 아래에 해설한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>표 5-3-2 급여 사료의 배합 비율(DM%) 및 영양 수준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>사료①</th><th>사료②</th><th>사료③</th><th>사료④</th></tr><tr><th>시판 혼합사료<sup>1)</sup></th><td style="text-align:left">50</td><td style="text-align:left">72</td><td style="text-align:left">60</td><td style="text-align:left">55</td></tr><tr><th>대두박</th><td style="text-align:left">10</td><td style="text-align:left">8</td><td style="text-align:left">5</td><td style="text-align:left">0</td></tr><tr><th>탈피 대맥</th><td style="text-align:left">0</td><td style="text-align:left">0</td><td style="text-align:left">15</td><td style="text-align:left">35</td></tr><tr><th>알팔파 펠릿</th><td style="text-align:left">5</td><td style="text-align:left">3</td><td style="text-align:left">0</td><td style="text-align:left">0</td></tr><tr><th>알팔파 헤이큐브</th><td style="text-align:left">5</td><td style="text-align:left">3</td><td style="text-align:left">0</td><td style="text-align:left">0</td></tr><tr><th>수단그라스</th><td style="text-align:left">10</td><td style="text-align:left">5</td><td style="text-align:left">0</td><td style="text-align:left">0</td></tr><tr><th>볏짚</th><td style="text-align:left">20</td><td style="text-align:left">10</td><td style="text-align:left">20</td><td style="text-align:left">10</td></tr><tr><th>조사료 비율(%)</th><td style="text-align:left">40</td><td style="text-align:left">20</td><td style="text-align:left">20</td><td style="text-align:left">10</td></tr><tr><th>DM(%)</th><td style="text-align:left">87.0</td><td style="text-align:left">86.4</td><td style="text-align:left">86.6</td><td style="text-align:left">86.8</td></tr><tr><th>CP(% DM)</th><td style="text-align:left">15.5</td><td style="text-align:left">15.6</td><td style="text-align:left">13.4</td><td style="text-align:left">12.0</td></tr><tr><th>TDN(% DM)</th><td style="text-align:left">72.1</td><td style="text-align:left">79.9</td><td style="text-align:left">79.3</td><td style="text-align:left">82.5</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span><span style="color:var(--ink-soft)">1) 옥수수 75%, 밀기울 12%, 대두박 5%, 알팔파 펠릿 8%.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span><span style="color:var(--ink-soft)">문헌 1에서 인용·개변</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">조사료 다급은 비육 중기 이후의 발육을 좋게 한다</div>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>일당증체량(DG)은 비육 전기(6~13개월령)가 조다구 0.93 kg, 조소구 0.98 kg으로 조다구 쪽이 적었으나, 비육 중기(13~20개월령) 이후 조다구의 DG가 조소구를 웃돌아, 비육 전 기간(6~25개월령)에서는 각각 0.87 kg, 0.80 kg으로 조다구 쪽이 많았다<sup>1)</sup>(그림 5-3-3). 그 결과 체중은 비육 전기 말에는 조다구 쪽이 10 kg 적었으나 비육 종료 시에는 30 kg 이상 많았다. 또한 비육도 지수<sup>주2)</sup>는 비육 전기 말에는 조다구, 조소구 각각 295.3, 304.4로 조다구 쪽이 약간 작았으나, 비육 종료 시에는 각각 481.8, 456.4로 조다구 쪽이 비육 상태가 좋아졌다. 이상으로부터 발육은 비육 전기에는 조다구 쪽이 나쁘지만 중기 이후는 조다구 쪽이 좋고, 비육 전 기간에서도 조다구 쪽이 좋다고 할 수 있다. 따라서 발육성에 관해서는 비육 전기 사료 중의 조사료 비율은 40% 쪽이 20%보다 적합하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="98">•</span><span>※ 주2) 비육도 지수: 체중을 체고로 나누고 100을 곱하여 산출하며, 클수록 비육 상태가 좋다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="99">•</span><span><i>그림 5-3-3 DG의 추이(7.5~24.6개월령, 전기·중기·후기). 조다구는 7.5개월령 약 0.4 kg/일에서 출발해 11~18개월령에 0.9~1.0 kg/일을 유지하고 후기에도 0.9 kg/일 전후를 유지한 반면, 조소구는 전기에 0.6→0.95 kg/일로 빠르게 올랐다가 중기 이후 0.85 kg/일 이하로 점차 저하한다. 문헌 1에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="100">•</span><span><i>그림 5-3-4 1일 1두당 사료 섭취량의 추이(원물·kg). 농후사료 섭취량은 전기에 조소구가 많았으나(11.4개월령 조소구 약 9.8 kg, 조다구 약 7 kg), 중기 이후 조다구가 8~9 kg으로 조소구(7~8 kg)를 웃돈다. 조사료 섭취량은 전기 조다구 3~5 kg, 조소구 1~2.5 kg이었고 중기 이후 양 구 모두 1~2.5 kg 수준. 문헌 1에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">조사료 다급은 비육 중기 이후의 농후사료 섭취량을 늘린다</div>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>1일 1두당 사료 섭취량에 대해서는, 농후사료 섭취량은 비육 전기에는 조다구 쪽이 적었으나 비육 중기 이후는 조다구 쪽이 많았고, 비육 전 기간에서는 양 구 간에 차이가 없었다<sup>1)</sup>(그림 5-3-4). 한편 조사료 섭취량은 비육 전기에는 조다구 쪽이 많았고 전 기간에서도 조다구 쪽이 많았다. 이로부터 6~13개월령 사료의 조사료 비율은 40% 쪽이 비육 전 기간 중의 조사료 섭취량이 많았다. 또한 공시우의 외모상 특징은, 7~13개월령의 비육 전기에 영양가가 낮은 조사료를 다급한 시험<sup>4)</sup>과는 달리, 조다구에서 비육 전기 말에 피모의 거칠어짐이 보이지 않았다. 즉, 알팔파와 티모시를 혼합하여 조단백질(CP) 함량을 높이고 영양가를 높인 양질의 조사료를 사용하면, 사료 중 40%의 조사료를 급여하면서도 양호한 건강 상태를 유지하면서 육우를 비육할 수 있다고 생각된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">조사료 다급은 육량을 늘리고 육질도 좋게 한다</div>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>지육 형질에 대해서는, 지육 중량은 조다구 394.0 kg, 조소구 372.1 kg으로 조다구 쪽이 20 kg 무거웠다. 등심 단면적, 갈비 두께, 피하지방 두께, 근간지방 두께에는 차이가 없었고, 근내지방도 BMS No.<sup>주3)</sup>는 조다구 7.3, 조소구 5.6이었다<sup>1)</sup>(표 5-3-3).</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>이상으로부터 최종적으로는 지육의 육량이 늘고 육질이 좋아진다는 점에서 조사료 다급 쪽이 우수함이 밝혀졌다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="104">•</span><span>※ 주3) BMS(Beef marbling standard): 근내지방도 기준이다. BMS No.에서는 No.1(지방교잡이 거의 없는 것)부터 No.12(상당히 많은 것)까지 12단계로 구분된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="105">•</span><span>※ BCS(Beef color standard): 쇠고기 육색 기준이다. BCS No.에서는 No.1(육색이 옅은 것)부터 No.7(육색이 진한 것)까지 7단계로 구분된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="106">•</span><span>※ BFS(Beef fat standard): 우지방색 기준이다. BFS에서는 No.1(우지방색이 옅은 것)부터 No.7(우지방색이 진한 것)까지 7단계로 구분된다.</span></p>

<div class="bx-sub"><div class="bx-subtitle">육성 후기부터 비육 전기의 사료 중 조사료 비율 비교에 관한 다른 사례</div>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>지금까지 비육 전기의 조사료와 농후사료 비율이 증체량이나 육질에 미치는 영향에 관한 연구는 많이 실시되어 왔다<sup>5~9)</sup>. 하시모토(橋元) 등은 나가사키현 축산시험장에서 흑모화종 거세우 10두를 공시한 7~24개월령의 비육 시험을 실시하여, 이 기간 중 비육 전기의 조사료 비율 45%(가소화양분총량〈TDN〉 요구량의 60%의 농후사료를 급여하는 구)와 33%(TDN 요구량의 80%의 농후사료를 급여하는 구)를 비교하였다<sup>10)</sup>(표 5-3-4). 그 사례에서도 비육 전 기간에서는 농후사료 섭취량이 양 구 모두 같았으나, 조사료 비율이 높은 쪽이 조사료 섭취량이 많았고, 13개월령부터의 비육 후기에서의 TDN 충족률은 비육 전기에 조사료를 다급한 구 쪽이 높은 것으로 판명되었다. 그리고 지육 성적은 비육 전기 조사료 다급구 쪽이 지육 중량이 446.8 kg으로 10 kg 많았고 육질도 우수하였다. 이 사례로부터 지육 중량이 450 kg급에서도 육성 후기에 해당하는 7개월령 시의 조사료가 45%인 쪽이 육우의 증체량 및 육질이 좋다는 것을 알 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>표 5-3-4 육성 후기부터 비육 전기의 사료 중 조사료 비율 비교.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>실시 현</th><th>조사료 비율(%)<sup>1)</sup></th><th>급여 시기(월령)</th><th>비육우의 계통<sup>2)</sup></th></tr><tr><th>마루야마 등(1998) 기후현</th><td style="text-align:left">20 / 40※</td><td style="text-align:left">6~13</td><td style="text-align:left">다지마(但馬) + (체적)</td></tr><tr><th>하시모토 등(2006) 나가사키현</th><td style="text-align:left">33 / 45※</td><td style="text-align:left">7~12</td><td style="text-align:left">체적 + (다지마)</td></tr><tr><th>카리마타 등(2018) 사가현</th><td style="text-align:left">50※</td><td style="text-align:left">6~8</td><td style="text-align:left">체적</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span><span style="color:var(--ink-soft)">1) 나가사키현에 대해서는 TDN에서 중량으로 환산하였다. 2) 다지마계 이외를 체적계로 하였고, ( )는 약간 인정되는 계통.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span><span style="color:var(--ink-soft)">※ 비육 전 기간의 발육 및 지육 성적이 좋은 조사료 비율</span></span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>나아가 카리마타(狩又) 등은 사가현 축산시험장에서 흑모화종 거세우를 공시한 6~27개월령의 비육 시험을 실시하였다<sup>11~13)</sup>. 6~8개월령 시의 조사료 비율을 50%로 하고(11개월령까지는 수단그라스 포식), 8~9개월령부터의 농후사료 증급량을 1.5 kg/월/두로 설정하여 27개월령에 출하한 결과, 지육 형질은 지육 중량 508.3 kg, 등심 단면적 68.4 cm², BMS No. 11.0으로, 관행의 30개월령에 출하한 경우의 지육과 손색이 없고 조임·결에 의한 등급 하락도 없음을 보였다(표 5-3-5).</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>표 5-3-5 지육 형질.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>조기 개시구</th><th>관행구</th></tr><tr><th>비육 기간(월령)</th><td style="text-align:left">6~27</td><td style="text-align:left">8~30</td></tr><tr><th>두수</th><td style="text-align:left">5</td><td style="text-align:left">8</td></tr><tr><th>지육 중량(kg)</th><td style="text-align:left">508.3±20.5</td><td style="text-align:left">531.8±53.8</td></tr><tr><th>등심 단면적(cm²)</th><td style="text-align:left">68.4±8.0</td><td style="text-align:left">60.6±3.7</td></tr><tr><th>갈비 두께(cm)</th><td style="text-align:left">9.5±1.0</td><td style="text-align:left">9.1±1.1</td></tr><tr><th>피하지방 두께(cm)</th><td style="text-align:left">2.8±0.3</td><td style="text-align:left">3.2±0.8</td></tr><tr><th>육량 기준치<sup>1)</sup></th><td style="text-align:left">75.7±1.3</td><td style="text-align:left">73.9±1.4</td></tr><tr><th>BMS No.<sup>2)</sup>(1~12)</th><td style="text-align:left">11.0±1.1</td><td style="text-align:left">9.1±1.7</td></tr><tr><th>BCS No.(1~7)</th><td style="text-align:left">3.0</td><td style="text-align:left">3.3</td></tr><tr><th>조임(1~5)</th><td style="text-align:left">5.0</td><td style="text-align:left">4.9</td></tr><tr><th>결(1~5)</th><td style="text-align:left">5.0</td><td style="text-align:left">4.9</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span><span style="color:var(--ink-soft)">평균치±표준편차</span></span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span><span style="color:var(--ink-soft)">1) 육량 기준치 = 69.419 + 0.130×등심 단면적(cm²) + 0.667×갈비 두께(cm) − 0.025×좌반도체 지육 중량(kg) − 0.896×피하지방 두께(cm)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span><span style="color:var(--ink-soft)">2) BMS(Beef Marbling Standard), BCS(Beef Color Standard)</span></span></p>

</div>
<div class="bx-sub"><div class="bx-subtitle">사료 중 중성세제불용섬유 함량과 건물 섭취량</div>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>비육우가 사료를 안정적으로 섭취하게 하기 위해서는 사료의 내용이 중요하다. 사양표준에 근거하여 비육우의 발육에 필요한 CP, TDN을 충족시키고, 비육우의 기호성이 좋은 사료를 선택하여 조제할 필요가 있다. 또 하나의 중요한 요인으로, Naruse 등은 사료 중 중성세제불용섬유(NDF) 함량과 비육우의 건물 섭취량(DMI)의 관계에 대하여, 흑모화종의 비육 시험 공시우 365두를 이용하여 아이치현, 기후현, 시가현과 축초연(畜草研)이 실시한 협정 연구를 수행하여, NDF 함량이 사료 중 31%일 경우 공시우의 DMI가 최대가 됨을 보였다<sup>14)</sup>(그림 5-3-5). 또한 이 협정 연구에서는 급여 사료 중 NDF 함량이 30% 이상일 경우 비육우의 혈장 중 총콜레스테롤 농도가 149.0 mg/dL로, NDF 30% 미만일 경우의 134.5 mg/dL보다 높은 것으로 판명되었다<sup>15)</sup>. 혈장 중 총콜레스테롤 농도는 비육 성적을 모니터링하는 데 유용하며, 지육 성적을 높이기 위해서는 혈장 중 총콜레스테롤 농도를 높게 유지하는 영양관리가 필요하다<sup>16)</sup>. 따라서 사료 중 NDF 함량을 31%로 함으로써 비육우의 DMI가 최대가 되고 혈장 중 총콜레스테롤 농도를 높게 유지하여 지육 성적을 높일 수 있다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="123">•</span><span><i>그림 5-3-5 NDF 함량과 DMI의 관계. NDF 15~35%에 대한 DMI(kg/일) 산점도와 2차 회귀곡선, Y = −0.0083(x−31.4)² + 7.70, r = 0.581; NDF 약 31%에서 DMI 최대(약 7.7 kg/일). 문헌 14에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비육우의 비타민 A 제어</div>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>고품질 지육 생산을 위한 기술로서 비육우의 혈장 중 VA 제어를 들 수 있다. 비육우의 VA 제어란, 비육 중기에 혈장 중 VA 농도를 낮게 제한함으로써 근내지방도를 증가시키고, 또한 VA 결핍증에 의한 증체 저하, 사지 부종, 요석증 등의 관련 질병, 근육 수종(ズル)에 의한 지육의 흠·폐기 등을 일으키지 않도록 혈장 중 VA 농도를 적정하게 유지하는 기술이라고도 할 수 있다. 비육우의 혈장 중 VA 농도와 DMI, 증체량 및 육질의 관계는 지금까지 많은 연구가 이루어져 왔다<sup>17~20)</sup>. 오카(岡) 등은 증체를 확보하면서 육질을 향상시키는 방법으로 그림 5-3-6의 패턴 D가 최적이라고 보고하였으며<sup>21)</sup>, 현재 이 VA 컨트롤은 많은 비육 농가가 실천하고 있다. 근년 쇠고기의 근내지방도는 현저히 증가하고 있으며, VA 제어가 그 요인의 하나라고 생각된다. 또한 그림 5-3-6으로부터 비육 개시 시에는 육우의 혈장 중 VA 농도가 100 IU/dL 필요함을 알 수 있는데, 육성기부터 비육 전기에 양질의 건초를 충분히 섭취하면 비육우의 혈장 중 VA 농도는 100 IU/dL 전후까지 증가한다. 따라서 육성기에 양질의 조사료를 충분히 급여하는 것은 비육우의 혈장 중 VA 제어의 관점에서도 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="125">•</span><span><i>그림 5-3-6 비육우의 혈장 중 VA 패턴(10~30개월령, IU/dL). A: 전 기간 약 110으로 일정(증체 양호, 육질 불량). B: 10개월령 90에서 14개월령 이후 30으로 저하 유지(증체 불량, 육질 양호〈질병〉). C: 100을 20개월령까지 유지 후 30개월령 40까지 서서히 저하(증체 약간 불량, 육질 불량). D: 90에서 18~25개월령에 40으로 낮춘 뒤 30개월령 80으로 회복(증체 양호, 육질 양호). 문헌 21에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>앞서 언급한 마루야마 등의 비육 시험 공시우의 혈장 중 VA 농도는 중기 말에 조다구 33.3 IU/dL, 조소구 26.6 IU/dL였으며, 이 20.8개월령 시의 양 구의 값은 그림 5-3-6의 증체와 육질 향상을 위한 VA 패턴으로서 이상적인 값이었다<sup>1)</sup>. 따라서 비육 전기의 비육우에게 급여 사료 전체의 중량 비율 40%의 조사료를 급여하더라도, 중기에 건초를 급여하지 않으면 혈중 VA 농도는 충분히 감소하여 VA를 제어할 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성부터 비육 전기의 조사료 비율</div>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>육우를 9~29개월령 이상의 20개월 이상에 걸친 비육 기간을 내다보고 육성하여 신속하게 비육 전기로 이행시키기 위해서는, 6~13개월령의 비육 전기에 급여 사료 중 조사료 비율이 중량 비율로 35~45% 정도인 것이 비육 기간 전체의 증체량 및 육질 면에서 적정하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span><span style="color:var(--ink-soft)">(저자: 丸山新)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">근육의 성장</div>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>임신 초기의 골격근 형성에서는 배(胚) 시기에 근형성 전구세포(Myogenic progenitor cells)의 증식(Hyperplasia)이 반복된 후, 근아세포나 근섬유로의 분화가 일어난다. 임신 중기 이후는 지방세포 형성과 함께 2차 근섬유가 형성되고, 동시에 섬유아세포의 형성으로부터 결합조직이 합성되어 골격근의 성숙이 일어난다. 이들 과정에 관여하는 유전자도 근년 밝혀지고 있다. 소나 양의 골격근 발달·성숙에는 태아기가 중요한 시기이지만, 돼지에서는 골격근이 출생 시에 미성숙한 상태에 있어 골격근 형성은 신생자기로 이어진다<sup>22)</sup>.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>출생 후의 골격근 성장은 근섬유의 증식 대신 그 비대(Hypertrophy)에 의해 일어난다. 출생 시 골격근의 성숙 정도는 소나 양과 비교하여 돼지에서 다르다. 소나 양의 골격근은 임신 후기에 성숙하지만<sup>23)</sup>, 돼지의 골격근 성숙은 신생자기까지 이른다<sup>24)</sup>. 출생 후의 골격근 성장은 근섬유의 비대에 의해 일어나지만 근섬유 증식의 대부분은 태아기에 완료되므로, 태아기에 골격근의 성숙, 즉 근섬유의 증식을 촉진하는 것이 중요해지며, 근년에는 임신 중 모체의 영양 상태에 따라 태아기의 성장, 나아가 출생 후의 성장에 영향을 미친다는 것이 밝혀지고 있다(1-10[71페이지] 참조).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">골격근 형성에 관여하는 근육 내 유전자 발현</div>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>골격근 형성에 관여하는 유전자에 대하여 근육 내 발현량을 측정하는 것은 생체 내에서 어떠한 현상이 일어나고 있는지 추찰할 수 있어, 사양관리를 검토하기 위한 유용한 정보가 된다. 흑모화종 포유·육성기의 반건양근(설도)과 요최장근(서로인)에서의 유전자 발현에서는, 4개월령 이후와 비교하여 2개월령에 골격근 성장을 억제하는 MSTN<sup>주4)</sup> 유전자의 발현이 증가해 있었다<sup>25)</sup>(그림 5-3-7). 또한 근육 간에는 반건양근보다 요최장근에서 MSTN 발현 감소가 보였다. 이는 설도의 성장이 서로인의 그것보다 억제를 받고 있음을 시사하며, 흑모화종은 후구(後軀)의 발달이 늦다, 또는 충실하지 않다는 평가를 뒷받침하는 것으로 생각된다. 나아가 육성기부터 비육 후기까지의 발육 과정에서 반건양근에서 지방 합성에 관여하는 PPARγ<sup>주5)</sup>2 유전자는 4개월령 및 28개월령에 최소 발현이 되었고 16개월령에 최대 발현이었다<sup>26)</sup>(그림 5-3-8). 이상으로부터 골격근의 성장은 출생 직후와 그 이후를 비교하면 출생 직후는 억제 상태에 있으나 그 후 항진 상태에 있음이 시사되었고, 근육 내 지방 합성은 비육 중기에 해당하는 16개월령 부근에서 활성화되어 있음이 시사되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>근육 내 유전자 발현의 측정은 통상의 생산 환경에서는 실시할 수 없으나, 사양 시험 환경하에서 이러한 정보를 얻는 것은 과학적 근거에 기반한 사양 기술을 개발하는 데 유의미할 것으로 기대된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="133">•</span><span><i>그림 5-3-7 흑모화종 골격근에서의 MSTN 유전자 발현 추이(출생 후 2, 4, 6, 8, 10개월령, 상대치). 2개월령에 요최장근 약 0.30, 반건양근 약 0.58로 최대이며, 4개월령 이후 요최장근 0.17~0.20, 반건양근 0.34~0.42로 감소. 문헌 25에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="134">•</span><span><i>그림 5-3-8 흑모화종 반건양근에서의 PPARγ2 유전자 발현 추이(출생 후 4, 10, 16, 22, 28개월령, 상대치). 4개월령 약 0.1, 10개월령 약 0.7, 16개월령 약 1.25(최대), 22개월령 약 0.65, 28개월령 약 0.15. 문헌 26에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="135">•</span><span>※ 주4) MSTN(Myostatin): 골격근의 성장에 대하여 억제적 조절(브레이크)을 하여 골격근의 증식 및 비대를 억제하는 유전자. 한편 지방 합성에 대해서는 활성화시키는 작용이 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="136">•</span><span>※ 주5) PPARγ(Peroxisome proliferator-activated receptor γ): 지방 합성의 주요 인자.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비타민 A와 육질</div>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>앞서 언급했듯이, 육용 비육우에서 비육 중기에 VA를 제어함으로써 근내지방도를 증가시키는 것은 1990년대부터 이루어져 2000년 이후 근내지방도에 특화된 육질 향상 기술로 정착되어 있다. 3T3-L1 등의 지방 전구세포에 레티놀 또는 레티노인산을 첨가하면 지방세포로의 분화가 억제된다는 것이 보고되어 있다. 이처럼 지방세포의 분화와 VA는 밀접하게 관계되어 있으며, 이러한 반응이 비육우의 지방 전구세포에서 일어나고 있다고 추찰된다. 한편 육우의 생산성 향상을 목적으로 블랙 앵거스 신생 송아지에 대한 VA 급여 시험이 실시되었다<sup>27)</sup>. 출생 시 및 1개월령 시에 VA를 15만 IU 또는 30만 IU 주사하고, 그 후 시험구 간에 같은 사료를 급여하여 포유·육성 및 비육을 실시하였다. 또한 2개월령 시에 대퇴이두근에서 생검으로 근육 조직을 채취하여 근육 내 유전자 발현을 측정하고, 나아가 비육 개시 시의 초음파 영상으로 근육 내 지방 함량을 판정하였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="138">•</span><span>이유 시 체중은 VA 30만 IU구에서 무거웠고, 출생 후부터 이유 시까지의 DG는 VA 급여로 증가가 보였다. 또한 비육 개시 시의 체중은 30만 IU구에서 다른 시험구보다 무거웠다. 2개월령의 15만 IU구 골격근에서 지방 합성의 주요 인자인 ZFP423<sup>주6)</sup> 및 PPARγ 유전자의 발현 증가가 보였다(그림 5-3-9). 비육 개시 시의 초음파 영상 해석에서는 15만 IU구에서 근육 내 지방 함량의 증가가 인정되었으나, 립 및 럼프의 피하지방 두께에는 시험구 간 차이가 보이지 않았다(표 5-3-6). 또한 지육 성적에서는 15만 IU구에서 근내지방도 스코어의 증가가 보였다. 한편 지육 중량 및 등심 단면적에서는 시험구 간 차이가 보이지 않았다.</span></p>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>신생 송아지에 대한 VA 급여는 이유 시까지의 생산에 대해서는 효과가 인정되었으나, 그 후의 비육에서는 지육 성적 및 육질에서 명확한 차이가 인정되지 않았다. 그러나 송아지기의 근육 내 유전자 발현, 비육 개시 시의 초음파 영상 및 근내지방도 스코어로부터 근육 내 지방 축적 촉진에 대한 영향이 시사되었다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="140">•</span><span><i>그림 5-3-9 2개월령 앵거스 대퇴이두근에서의 ZFP423 및 PPARγ 유전자 발현(mRNA, fold change). ZFP423: 0 IU 약 1.2(c), 15만 IU 약 6.7(a), 30만 IU 약 3.5(ab). PPARγ: 0 IU 1.0(b), 15만 IU 약 3.1(a), 30만 IU 약 1.1(b). 문헌 27에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>표 5-3-6 앵거스우의 초음파 영상·지육 성분 및 육질에 대한 출생 시 VA 처리 효과.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>0 IU(n=9)</th><th>15만 IU(n=7)</th><th>30만 IU(n=9)</th><th>SE</th><th>P값</th></tr><tr><th>■ 비육 개시 시 초음파 영상</th><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>근육 내 지방 함량(%)</th><td style="text-align:left">3.95<sup>b</sup></td><td style="text-align:left">4.93<sup>a</sup></td><td style="text-align:left">4.34<sup>ab</sup></td><td style="text-align:left">0.26</td><td style="text-align:left">0.036</td></tr><tr><th>립 지방 두께(cm)</th><td style="text-align:left">0.38</td><td style="text-align:left">0.38</td><td style="text-align:left">0.41</td><td style="text-align:left">0.03</td><td style="text-align:left">0.659</td></tr><tr><th>럼프 지방 두께(cm)</th><td style="text-align:left">0.53</td><td style="text-align:left">0.53</td><td style="text-align:left">0.43</td><td style="text-align:left">0.05</td><td style="text-align:left">0.240</td></tr><tr><th>등심 단면적(cm²)</th><td style="text-align:left">53.5</td><td style="text-align:left">56.1</td><td style="text-align:left">58.3</td><td style="text-align:left">2.21</td><td style="text-align:left">0.337</td></tr><tr><th>■ 지육 성분</th><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>지육 중량(kg)</th><td style="text-align:left">341</td><td style="text-align:left">357</td><td style="text-align:left">349.5</td><td style="text-align:left">3.87</td><td style="text-align:left">0.527</td></tr><tr><th>지육률(%)</th><td style="text-align:left">59.5</td><td style="text-align:left">59.1</td><td style="text-align:left">59.8</td><td style="text-align:left">0.29</td><td style="text-align:left">0.468</td></tr><tr><th>근내지방도 스코어<sup>※1</sup></th><td style="text-align:left">583.3<sup>b</sup></td><td style="text-align:left">671.7<sup>a</sup></td><td style="text-align:left">610.0<sup>ab</sup></td><td style="text-align:left">20.2</td><td style="text-align:left">0.016</td></tr><tr><th>등심 단면적(cm²)</th><td style="text-align:left">82.2</td><td style="text-align:left">85.6</td><td style="text-align:left">84.2</td><td style="text-align:left">3.87</td><td style="text-align:left">0.565</td></tr><tr><th>피하지방 두께(cm)</th><td style="text-align:left">1.29</td><td style="text-align:left">1.46</td><td style="text-align:left">1.27</td><td style="text-align:left">0.06</td><td style="text-align:left">0.421</td></tr><tr><th>■ 흉최장근의 육질</th><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>단백질 함량(%)</th><td style="text-align:left">23.4</td><td style="text-align:left">23.3</td><td style="text-align:left">23.9</td><td style="text-align:left">0.38</td><td style="text-align:left">0.438</td></tr><tr><th>근육 내 지방 함량(%)</th><td style="text-align:left">6.33</td><td style="text-align:left">7.49</td><td style="text-align:left">6.94</td><td style="text-align:left">0.69</td><td style="text-align:left">0.572</td></tr><tr><th>쿠킹 로스(%)</th><td style="text-align:left">20.3</td><td style="text-align:left">20.6</td><td style="text-align:left">21.5</td><td style="text-align:left">1.28</td><td style="text-align:left">0.793</td></tr><tr><th>전단력가(kg)</th><td style="text-align:left">8.45</td><td style="text-align:left">10.3</td><td style="text-align:left">9.66</td><td style="text-align:left">1.12</td><td style="text-align:left">0.637</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span><span style="color:var(--ink-soft)">※1 500: 근내지방도의 최소 스코어(USDA 초이스), 600: 적은(Modest) 근내지방도, 700: 중간 정도(Moderate)의 근내지방도.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span><span style="color:var(--ink-soft)">문헌 27에서 인용·개변</span></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="144">•</span><span>※ 주6) ZFP423(Zinc finger protein 423): 지방 합성의 초기 단계에서 그 조절을 담당하는 중요한 인자.</span></p>

</div>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span><span style="color:var(--ink-soft)">일본송아지 5-3 육성기의 영양관리와 비육.</span></span></p>
</div>
<div class="bx"><div class="bx-title">5-4 송아지 사양관리 방식의 실제</div>
<div class="bx-sub"><div class="bx-subtitle">육성기의 정의와 사양관리의 요점</div>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>유용우에서는 송아지(Calf)에서 육성우(Heifer)로 명칭이 바뀌는 시기가 모호하다. 또한 육우의 육성기란 포유를 마친 후 비육이 개시되기까지의 수개월간을 가리키지만, 통상 유용우에서는 초산 분만할 때까지를 육성기로 하고 있다. 여기서는 이유를 마친 3개월령 정도부터 수태까지를 「육성기」, 이 시기의 소를 「육성우」로 정의한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>육성기 사양의 가장 중요한 요점은, 사양 규모의 대소에 관계없이 육성기는 군 관리가 기본이 되므로, 같은 시기에 초회 교배가 가능하도록 개체 간 체격의 편차를 최대한 작게 하는 것(제일성)과, 일정 시기에 전두를 수태시키는 것(번식성)이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육성기의 발육 목표(월령과 체격)</div>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>지금까지 발육 목표는 많은 육성우의 개체 데이터를 집적·해석하여 얻은 발육 곡선을 수치화한 것이었다. 그러나 이 발육 곡선은 평균치와 비교하는 데는 이용할 수 있지만, 반드시 이것이 이상적인 발육 패턴이라고는 할 수 없다. 그래서 여기서는 육성우에 관한 연구 성과를 근거로 설정한 발육 목표를 표 5-4-1에 나타낸다. 이는 NRC(2001)<sup>1)</sup>에도 기재되어 있는 「Target growth(목표 성장)」라는 사고방식이다. 아래에 이 목표치의 설정 방법에 대하여 기술한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>표 5-4-1 출생부터 수태까지의 발육 목표.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>구분</th><th>월령</th><th>체중(kg)</th><th>DG(kg/일)</th><th>체고(cm)</th><th>체고 증가량(cm/월)</th></tr><tr><th>포유기</th><td style="text-align:left">출생 시</td><td style="text-align:left">43</td><td style="text-align:left"></td><td style="text-align:left">78</td><td style="text-align:left"></td></tr><tr><th></th><td style="text-align:left">1</td><td style="text-align:left">64.5</td><td style="text-align:left">0.71</td><td style="text-align:left">83</td><td style="text-align:left">5.18</td></tr><tr><th></th><td style="text-align:left">2</td><td style="text-align:left">86</td><td style="text-align:left">0.71</td><td style="text-align:left">88</td><td style="text-align:left">5.18</td></tr><tr><th>육성기</th><td style="text-align:left">3</td><td style="text-align:left">112</td><td style="text-align:left">0.86</td><td style="text-align:left">94</td><td style="text-align:left">5.18</td></tr><tr><th></th><td style="text-align:left">4</td><td style="text-align:left">138</td><td style="text-align:left">0.86</td><td style="text-align:left">99</td><td style="text-align:left">5.18</td></tr><tr><th></th><td style="text-align:left">5</td><td style="text-align:left">165</td><td style="text-align:left">0.86</td><td style="text-align:left">104</td><td style="text-align:left">5.18</td></tr><tr><th></th><td style="text-align:left">6</td><td style="text-align:left">191</td><td style="text-align:left">0.86</td><td style="text-align:left">109</td><td style="text-align:left">5.18</td></tr><tr><th></th><td style="text-align:left">7</td><td style="text-align:left">217</td><td style="text-align:left">0.86</td><td style="text-align:left">112</td><td style="text-align:left">2.59</td></tr><tr><th></th><td style="text-align:left">8</td><td style="text-align:left">243</td><td style="text-align:left">0.86</td><td style="text-align:left">114</td><td style="text-align:left">2.59</td></tr><tr><th></th><td style="text-align:left">9</td><td style="text-align:left">269</td><td style="text-align:left">0.86</td><td style="text-align:left">117</td><td style="text-align:left">2.59</td></tr><tr><th></th><td style="text-align:left">10</td><td style="text-align:left">296</td><td style="text-align:left">0.86</td><td style="text-align:left">119</td><td style="text-align:left">2.59</td></tr><tr><th></th><td style="text-align:left">11</td><td style="text-align:left">322</td><td style="text-align:left">0.86</td><td style="text-align:left">122</td><td style="text-align:left">2.59</td></tr><tr><th></th><td style="text-align:left">12</td><td style="text-align:left">348</td><td style="text-align:left">0.86</td><td style="text-align:left">125</td><td style="text-align:left">2.59</td></tr><tr><th>교배</th><td style="text-align:left">13</td><td style="text-align:left">374</td><td style="text-align:left">0.86</td><td style="text-align:left">126</td><td style="text-align:left">1.3</td></tr><tr><th></th><td style="text-align:left">14</td><td style="text-align:left">400</td><td style="text-align:left">0.86</td><td style="text-align:left">127</td><td style="text-align:left">1.3</td></tr><tr><th></th><td style="text-align:left">15</td><td style="text-align:left">426</td><td style="text-align:left">0.86</td><td style="text-align:left">129</td><td style="text-align:left">1.3</td></tr></table></div></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">초회 교배 월령</div>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>육성우의 성장 속도는 낙농가의 수입에 영향을 준다. 영양가가 낮은 값싼 사료로 사양하면 사료 비용은 억제되지만, 육성 기간이 길어지는 결과 우유 생산에서 얻는 수입이 늦어지거나, 불충분한 체격으로 인해 초산차의 우유 생산이 제한되기도 할 가능성이 있다. 반대로 성장 속도를 높이면 사료 비용이 높아지거나, 혹은 에너지 과급과 같은 부적절한 사료 급여에 기인하는 유선 발달 저해에 의한 우유 생산 감소도 있을 수 있다. 성장 속도를 높이면서 비용 대비 효과가 가장 높아지는 초산 분만 월령은 22~24개월령 정도라고 알려져 있다<sup>2~6)</sup>. 여기서 역산하면 13개월령부터 번식 공용을 개시하여 15개월령까지는 수태를 완료시키는 것이 목표가 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">체격</div>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>목표 체중은 출생 시와 성숙 시(60개월령)의 값으로부터 계산하여 설정되어 있다. 여기서는 출생 시 체중을 43 kg, 성숙 시는 유전적 개량에 의해 대형화되어 온 것을 고려하여 지금까지의 650 kg에서 680 kg을 사용하고 있다<sup>7)</sup>. 또한 포유기를 포함한 출생 후 2개월 동안 체중을 2배<sup>8)</sup>로 하는 것이 전제이다. 성숙 시 체중의 변경에 따라 초회 교배 개시 체중은 지금까지의 350 kg에서 374 kg으로 하였다. 이는 홀스타인을 포함한 유용 품종에서는 성숙 시 체중의 약 55%에서 춘기발동기에 도달하는 것<sup>1,9)</sup>에 근거한다. 일당증체량(DG) 0.86 kg/일은 2개월령부터 13개월령까지의 체중 증가량을 이 기간의 일수로 나눈 값이며, 저품질 조사료를 사용하지 않고 단백질과 에너지의 균형 등을 고려하면 충분히 도달 가능한 수치이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>체격의 기준이 되는 체고도 체중과 마찬가지로 출생 시 및 성숙 시의 값으로부터 작성하였으며, 각각 78 cm, 146 cm로 하였다. 24개월령의 체고는 성숙 시의 96%<sup>10)</sup>로 하였다. 또한 출생부터 24개월령까지의 체고 증가량 중 50%는 출생~6개월령, 25%는 6~12개월령, 나머지 25%는 12~24개월령 사이에 증가한다는 보고<sup>11)</sup>로부터 월별 증가량을 산출하였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>이 프로그램으로 13개월령부터 번식 공용을 개시하여 수태까지의 수정 횟수가 2회 이내이면, 군 전체의 초산 분만 월령은 23개월령 정도가 된다. 이 발육 목표치 작성에 사용한 출생 시 및 성숙 시의 체중·체고 수치는 표준적인 값을 사용하고 있다. 생산 현장에서 출생 시와 60개월령 정도의 체중이나 체고의 실측이 가능하다면, 발육 목표치는 보다 실태에 맞는 수치로 조정할 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">군의 제일성에 영향을 미치는 요인</div>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>출생 시의 체중이나 체격은 유전적 요인 등으로 인해 어느 정도의 편차가 있으며, 이를 제일화하는 것은 곤란하다. 그러나 인위적 요인으로 그 편차를 확대시키지 않는 관리는 가능하며 또한 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">순치(馴致)</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="156">•</span><span><b>군에 대한 순치</b></span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>육성기는 군 관리 사양이 기본이 되므로 그 이전부터 군에 대한 순치가 필요하다. 특히 포유기에 개체 관리로 사양된 송아지는 포유기에 양호한 성장을 했더라도 군에 들어가면 사료를 충분히 섭취하지 못해 성장이 정체되는 경우가 있다. 이러한 경우는 체격이 비슷한 몇 두의 작은 군으로 이유 후 2주 정도 순치(그림 5-4-1)한 뒤 전두를 함께 큰 군으로 이동시키는 것이 바람직하다. 또한 포유기에 최소 단위의 군으로 2두를 페어로 하여 카프 허치 등에서 사양하는 방법도 제안되어 있다<sup>12,13)</sup>. 이 방법에 의해 조기부터 사회적 섭취 행동을 익혀 인공유(스타터) 섭취량이나 체중이 증가하고, 이유 후에도 효과의 지속이 인정되고 있다. 그러나 체격 차가 생기지 않도록 비슷한 체격의 개체를 페어로 하고, 유방이나 귀를 빠는 행동을 막기 위해 벌컥벌컥 마시게 하지 말고 소량씩 포유하여 만족감을 주는 등 포유량이나 방법에 주의를 기울일 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="158">•</span><span><i>그림 5-4-1 이유 후의 군 순치(소군으로 함께 수용된 송아지들 사진)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="159">•</span><span><i>그림 5-4-2 군 사양에서의 배합사료 급여. 군의 전두가 일제히 사료를 섭취할 수 있는 사조.</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="160">•</span><span><b>사료에 대한 순치</b></span></p>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>육성기에 들어가면 고형사료도 스타터에서 육성용 배합사료로 전환된다. 육성용 배합사료는 양분 농도도 물리성도 스타터와 다르므로 일시적으로 먹기를 멈추는 경우가 있다. 며칠에 걸쳐 비율을 서서히 늘리면 섭취량을 저하시키지 않고 원활하게 이행시킬 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">시설과 사료 급여</div>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>군 관리에서는 1두별 급여량을 조정하기가 어렵다. 1군의 사양 두수는 1두당 면적도 고려하면서 일제히 사조에서 사료를 섭취할 수 있는 두수로 설정한다(그림 5-4-2). 특히 3~6개월령까지는 체격이 급속히 커지는 시기이지만 섭취량은 완만하게 증가한다. 이때의 영양원은 농후사료 의존 비율이 높으므로, 배합사료를 확실히 섭취시킨 뒤에 조사료를 급여한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">번식과 영양</div>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>가령(加齡)에 따라 일정한 체격이 되면 번식 기능이 발달하여 춘기발동이 보이는데, 양호한 영양 상태에서는 춘기발동이 빨라지는 것으로 알려져 있다. 8개월령의 체중과 춘기발동의 관계에 대한 연구 결과에서는, 8개월령의 체중이 적은 소일수록 춘기발동이 늦어지지만, 체중이 대략 220 kg이 되면 8~9개월령 사이에 춘기발동이 인정되고, 체중이 그 이상 증가하더라도 춘기발동이 빨라지지는 않았다<sup>14)</sup>(그림 5-4-3). 이는 양호한 영양 상태가 춘기발동을 어느 일정 기간만 앞당기는 효과가 있음을 시사한다. 또한 발정 징후(스탠딩 행동, 마운팅 행동, 발정 후 출혈)의 관찰로부터, 성성숙(난소, 자궁 모두 충분히 발달한 임신 가능 상태)에 도달하려면 춘기발동으로부터 약 3개월은 필요하다고 결론짓고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="164">•</span><span><i>그림 5-4-3 8개월령 시 체중과 춘기발동 월령의 관계. 체중 170~215 kg 구간에서는 체중이 늘수록 춘기발동 월령이 12.3→8개월령으로 직선적으로 빨라지고, 약 220 kg 이상에서는 8~8.7개월령으로 일정.</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="165">•</span><span>■ 체형 변화로 보는 소의 상태</span></p>
<div class="bx-sub"><div class="bx-subtitle">육성우의 영양 상태와 비만·삭수(削痩)의 판단</div>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>소의 비만, 삭수를 아는 지표로 보디컨디션스코어(BCS)가 있으며, 성우에서는 5단계 평가의 3을 표준으로 하여 체지방의 부착 정도, 촉진에 의한 골격 확인 정도로부터 수치의 증감으로 비만(+) 또는 삭수(−) 상태를 알 수 있다. 성장 도중인 육성우에서의 BCS 기준은 출생 시 상태를 2.0으로 하여 가령과 함께 서서히 증가시켜 초회 교배 시에 성우와 같은 3.0으로 하고 있다<sup>8)</sup>. 이 방법에서는 출생 상태로부터 가령에 따라 어느 정도 체지방이 축적되었는가 하는 상황은 판단할 수 있지만, 같은 월령 우군에서 과비·삭수 상태를 판단하기는 매우 어렵다.</span></p>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>그래서 생산 현장에서의 소의 과수(過痩) 상태는, BCS와 같은 부위를 보고 과비, 표준, 삭수의 3단계로 판단하면 좋다. 영양 상태가 가장 체형에 반영되는 것이 후구이다. 체크할 부위는 요각폭, 관폭, 둔장을 연결한 부위 및 둔부의 살붙음으로, 영양 상태가 나쁘면 골격이 현저히 드러난다(그림 5-4-4). 섭취량의 상황을 알려면 루멘 필 스코어(RFS, 왼쪽 늑골 뒤쪽의 함몰 정도)를 본다(그림 5-4-5). 저품질 사료만 급여되고 있는 육성우에서는 RFS가 양호하다고 판단됨에도 불구하고 후구가 삭수한 소를 드물게 볼 수 있다. 이는 저품질 조사료 때문에 제1위 내 체류 시간이 길어진 결과이며, 영양으로서는 부족한 상태이다. 또한 한랭에 따른 유지 에너지 증가분의 영양분이 부족한 우군에서는 동계에 털이 길어지는 사례가 산견된다(그림 5-4-6).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="168">•</span><span><i>그림 5-4-4 보디컨디션 체크 부위. 위는 과비, 아래는 삭수(후구를 뒤에서 본 사진).</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="169">•</span><span><i>그림 5-4-5 섭취 상황의 판정 부위. 원으로 표시한 부분(왼쪽 늑골 뒤)의 함몰 정도로 판단한다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="170">•</span><span><i>그림 5-4-6 한랭기 섭취 부족 상태의 체모 신장. 원으로 표시한 부분의 체모가 길어져 있다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">번식기관의 발달</div>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>출생 시 송아지의 요각폭은 관폭보다 좁지만, 육성기에는 그 차이가 거의 같아지고 비유기에는 명확히 역전된다(그림 5-4-7). 가령에 따른 요각폭, 관폭, 체고의 추이를 나타낸 것이 그림 5-4-8이다. 육성기의 6개월령경부터 서서히 그 차이가 좁혀져 14~15개월령에 거의 같아지고(43.2 cm), 그 이후는 요각폭과 관폭의 값이 역전된다. 요각폭, 관폭, 둔장은 대략적인 골반 크기를 아는 지표이다. 골반강 내에는 자궁이나 난소 등 번식에 관여하는 기관이 배치되어 있으므로, 이들 후구 측정 부위의 변화는 번식에 관여하는 기관 발달이나 호르몬 분비의 변화라고 생각된다. 또한 요각폭과 관폭이 역전되는 시기와 번식 공용 개시 시기가 겹치므로, 체중이나 체고 값에 더하여 이들 부위의 측정치 활용도 초회 교배 기준의 참고가 될 것이다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="172">•</span><span><i>그림 5-4-7 가령에 따른 후구의 변화(송아지·육성우·경산우의 후구 사진 3장).</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="173">•</span><span><i>그림 5-4-8 가령에 따른 체고, 요각폭 및 관폭의 추이(0~24개월령, n=8,550). 체고는 출생 시 약 82 cm에서 24개월령 약 140 cm로, 요각폭은 약 17 cm에서 약 50 cm로, 관폭은 약 21 cm에서 약 48 cm로 증가하며, 13~15개월령(교배 기간)에 요각폭과 관폭이 교차한다.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span><span style="color:var(--ink-soft)">(저자: 大坂郁夫)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>육성 전기는 농후사료 급여에 의해 비교적 고영양으로 하여 골격의 발육을 촉진한다. 중기부터는 농후사료는 증량하지 않고 양질의 조사료를 급여하며, 이를 발육에 따라 증량해 감으로써 제1위의 발달을 촉진한다. 육용 번식우의 육성우 사양관리에서는 이유나 우사 이동, 비환(코뚜레) 장착 등이 필요하지만, 소에게 가능한 한 스트레스를 주지 않도록 관리하는 것이 중요하다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="176">•</span><span>■ 사양관리</span></p>
<div class="bx-sub"><div class="bx-subtitle">육성기의 개시(이유 시기)</div>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>이유 시기는 모유 또는 대용유가 아니라 고형사료, 조사료로부터의 영양 섭취가 적절히 이루어질 수 있도록 제1위 기능이 충분히 발달해 있어야 한다. 스타터 급여는 제1위의 발달을 촉진하므로 스타터 섭취량은 제1위 기능 발달의 기준도 된다. 2개월령에 1.0~2.0 kg/일, 3개월령에 2.8 kg/일 정도의 스타터를 섭취할 수 있다면 제1위 기능은 충분히 발달해 있다고 생각된다. 이유 후 육성용 사료로 전환할 때에는 500 g씩 10일 정도에 걸쳐 서서히 전환한다. 이유 2주 전쯤부터 젖을 빨 수 없게 하는 기구(Calf weaner, 그림 5-4-9)를 장착하면 이유 시 송아지의 스트레스가 경감되고, 그에 따른 발육 정체도 회피할 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="178">•</span><span><i>그림 5-4-9 이유에 앞서 사용하는 Calf weaner. 주걱 모양 부분이 방해가 되어 포유할 수 없게 되어 있다. 주걱 모양 부분 끝이 가시 모양으로 된 것도 있으나, 어미소가 아파하는 경우가 있으므로 가시 없는 쪽이 좋다고 생각된다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">사료 급여</div>
<p class="bx-num"><span class="bxn" data-n="179">•</span><span>소에 대한 사료 급여는 필요한 영양분을 공급하고 공복을 채워 정상적인 발육을 촉진하는 것을 목적으로 이루어진다. 흑모화종 암소의 육성기에 필요한 양분량은 일본사양표준에 제시되어 있으며, 자가 생산 또는 입수 가능한 사료를 조합하여 행하는 사료 설계는 체중과 목표로 하는 발육(증체)에 맞추어 제시되어 있는 양분 요구량을 기초로 행한다<sup>15)</sup>. 급여 사료의 성분 분석은 본래 필요하며 그 결과를 기초로 사료 설계를 하는 것이 기본이지만, 사료 분석에는 분석 비용이 들기 때문에 일반적으로 사용되는 사료의 성분에 대해서는 일본표준사료성분표를 이용할 수도 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="180">•</span><span><b>사료 설계</b></span></p>
<p class="bx-num"><span class="bxn" data-n="181">•</span><span>사료 설계에서는 발육 단계나 목표 발육량에 맞추어 건물량과 각 양분 요구량을 확인하고, 사용 가능한 사료를 조합하여 양분 요구량을 충족시키면서 건물량 안에 들어가게 할 필요가 있다. 건물량은 사료의 부피(嵩)이며 소가 채식할 수 있는 건물량에는 한도가 있으므로, 실제로는 에너지(일반적으로 가소화양분총량〈TDN〉으로 대체된다)나 단백질 등의 영양분을 높은 농도로 함유한 사료(농후사료)와 이들 함량이 비교적 낮은 사료(조사료)를 잘 조합하여 사료 설계를 할 필요가 있다(표 5-4-2). 건물은 그 형태도 중요하며, 특히 조사료의 경우 그 길이나 어느 정도의 단단함은 제1위벽에 대한 물리적 자극이 되어 소의 타액 분비량 증감에 관계하고 제1위의 건전성을 유지하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>육성기는 체격 형성의 중요한 시기이므로, 에너지나 단백질이 요구량을 충족하고 있는지가 사료 설계나 실제 급여에 있어 가장 중요하다. 실제 사료 설계에서는 일본사양표준의 암소 육성에 필요한 양분량에서 대상이 되는 소 또는 우군의 체중(평균 체중)과 목표로 하는 발육(증체)을 확인하고, 조단백질(CP)과 TDN의 충족률을 100% 이상으로, 건물량이 100% 정도가 되도록 급여 가능한 사료(성분 분석 완료)를 조합해 가는 것이 주된 작업이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>표 5-4-2 사료 계산의 일례.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>급여 사료 등</th><th>급여량</th><th>건물량</th><th>CP</th><th>TDN</th><th>NFC</th><th>DIP</th></tr><tr><th>육성용 배합사료</th><td style="text-align:left">4</td><td style="text-align:left">3.55</td><td style="text-align:left">567.7</td><td style="text-align:left">2.63</td><td style="text-align:left">1.42</td><td style="text-align:left">353.8</td></tr><tr><th>양질 이탈리안(출수 전)</th><td style="text-align:left">1.5</td><td style="text-align:left">1.26</td><td style="text-align:left">246.6</td><td style="text-align:left">0.87</td><td style="text-align:left">0.23</td><td style="text-align:left">111.6</td></tr><tr><th>계</th><td style="text-align:left"></td><td style="text-align:left">4.81</td><td style="text-align:left">814.3</td><td style="text-align:left">3.49</td><td style="text-align:left">1.65</td><td style="text-align:left">465.4</td></tr><tr><th>체중 150 kg, 증체 1.0 kg/일에 필요한 양분량</th><td style="text-align:left"></td><td style="text-align:left">4.24</td><td style="text-align:left">765</td><td style="text-align:left">2.94</td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>충족률</th><td style="text-align:left"></td><td style="text-align:left">114%</td><td style="text-align:left">106%</td><td style="text-align:left">119%</td><td style="text-align:left">34%</td><td style="text-align:left">3.5%</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span><span style="color:var(--ink-soft)">NFC: 비섬유성 탄수화물, DIP: 분해성 단백질.</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">급여량의 기준(표 5-4-3)</div>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>3개월령에 이유가 끝난 경우, 4~5개월령은 골격이 가장 발달하는 시기이므로, 이 시기를 향하여 스타터에서 서서히 전환한 육성용 사료(농후사료)를 최대 급여량(4 kg 정도)으로 증량하고 이를 유지할 수 있도록 하는 것이 중요하다. 6개월령 이후는 농후사료 급여량은 늘리지 않고 유지 또는 소량 감량하며, 조사료로 양질 건초를 다급하여 위의 발달을 촉진한다. 발육 속도는 월령이 어린 시기에는 빨라도 좋으나, 월령이 진행되어 체중이 250 kg에 도달한 후에는 암컷의 체질에 의한 여분의 지방 축적을 피하기 위해 DG 0.8 kg 이하로 억제하는 편이 좋다. 급여 사료의 잔량을 막기 위해서는 농후사료 증량은 500 g씩 정도를 기준으로 다 먹은 것을 확인하고 증량하며, 신선한 물을 마실 수 있게 하고(동계는 미온수, 그림 5-4-10), 조사료로 건초를 급여하는 경우에는 2~4 cm 정도로 세단하여 급여하며, 군 사양의 경우에는 사조의 길이, 높이, 폭에 유의하여 전두가 여유롭게 채식할 수 있게 하는 등의 궁리가 필요하다(그림 5-4-11). 사료 급여에 있어서는 사료를 계량하여 급여하는 것도 중요하다(그림 5-4-12). 사양 환경도 중요하며, 전 기간에 걸쳐 우사 내 환기에 주의하고 하계는 서열 대책(그림 5-4-13), 동계는 한랭 대책을 시행한다. 소가 느긋하게 쉴 수 있도록 두수에 맞는 면적이나 충분한 깔짚이 확보되어 있는지, 깔짚은 적당히 건조해 있는지 등에도 주의가 필요하다(그림 5-4-14). 하계의 등에(アブ)에 의한 흡혈은 소에게 상당한 스트레스가 되고 있다. 등에의 발생을 컨트롤하는 것은 거의 불가능하지만, 등에 트랩(그림 5-4-15)의 설치에 의한 대책은 일정한 효과가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>표 5-4-3 육성기의 사료 급여량 기준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>월령</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr><tr><th>육성용 사료(kg/일)</th><td style="text-align:left">3.0~3.6</td><td style="text-align:left">3.5~4.0</td><td style="text-align:left">3.5~4.0</td><td style="text-align:left">3.5~4.0</td><td style="text-align:left">3.5~4.0</td><td style="text-align:left">3.5~4.0</td></tr><tr><th>양질 건초(kg/일)</th><td style="text-align:left">1.0~1.4</td><td style="text-align:left">1.0~1.9</td><td style="text-align:left">1.3~3.1</td><td style="text-align:left">2.0~3.4</td><td style="text-align:left">2.5~4.0</td><td style="text-align:left">3.4~4.5</td></tr><tr><th>체고 기준(cm)</th><td style="text-align:left">93~97</td><td style="text-align:left">97~102</td><td style="text-align:left">101~106</td><td style="text-align:left">105~110</td><td style="text-align:left">108~113</td><td style="text-align:left">110~116</td></tr><tr><th>체중 기준(kg)</th><td style="text-align:left">113~136</td><td style="text-align:left">141~169</td><td style="text-align:left">169~202</td><td style="text-align:left">197~236</td><td style="text-align:left">224~269</td><td style="text-align:left">249~300</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="187">•</span><span><i>그림 5-4-10 동계 온수 급여에 사용하는 히터. 수조 안에 투입하여 사용한다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="188">•</span><span><i>그림 5-4-11 사조와 육성우용 스탠천. 스탠천이 있으면 군 사양에서도 사료를 개별 급여할 수 있으므로 치밀한 사양관리가 가능하다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="189">•</span><span><i>그림 5-4-12 사료 계량·급여를 위한 기구. 사료는 눈대중이 아니라 계량하여 급여하는 것이 중요하다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="190">•</span><span><i>그림 5-4-13 하계 서열 대책에 사용하는 미스트 기능 부착 선풍기.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="191">•</span><span><i>그림 5-4-14 우상(牛床)의 상태. 깔짚은 두껍게 깔고 우상은 가능한 한 건조한 상태를 유지한다.</i></span></p>

</div>
<div class="bx-sub"><div class="bx-subtitle">매뉴얼의 이용</div>
<p class="bx-num"><span class="bxn" data-n="193">•</span><span>실제 사료 급여에 있어서는 각 지역에서 공설 시험연구기관, 농업협동조합(JA), 와규 개량조합 등에 의한 송아지 육성 사양관리 매뉴얼이 작성되어, 그것을 기준으로 한 사양이 이루어지고 있다고 생각된다(그림 5-4-16). 대략 4개월령에 스타터에서 육성용 배합사료로 전환하고, 4~5개월령에는 농후사료 위주로 골격의 발육을 촉진한다. 6개월령 이후는 배합사료를 증량하지 않고(단, 먹다 남기지 않도록) 조사료를 포식 상태로 하여 제1위의 발달을 촉진하는 급여 체계가 제시되어 있으며, 이것이 권장되고 있다. 위의 사료 설계나 송아지 육성 사양관리 매뉴얼에 제시된 급여량 수치는 기준이며, 개개의 농가 또는 소에서는 우군, 소 개체의 관찰을 행하여 각각의 상태에 맞추어 급여량의 미세 조정을 해 나갈 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="194">•</span><span><i>그림 5-4-16 육성우 사양관리 매뉴얼의 일례(「흑모화종 육성관리 프로그램」, 신히다카초 시즈나이 와규 생산개량조합, 2009년 2월 2일 개정판 인용). 1일령~9개월령의 목표 체중(출생 시 ♂35~41 kg·♀30~36 kg → 9개월령 ♂275~320 kg·♀249~300 kg), DG(1개월령 ♂0.66~0.77 → 9개월령 ♂1.09~1.27 kg), 체고(출생 ♂70~73 cm → 9개월령 ♂113~118 cm), 출하 월령 8~10개월령·체중 기준 300~320 kg(거세 280일령 320 kg, 암 280일령 300 kg); 초유·대용유(1.0~1.5% × 3회/일 → 3.0% × 2회/일, 이유 2주 전부터 1회/일, 이유 100일령), 인공유(2개월령 1.0~2.0 kg, 3개월령 ♂2.0~2.8 kg), 배합사료(4개월령 ♂3.5~4.0 kg → 6개월령 이후 ♂4.5 kg·♀4.0 kg, 대두박 20~80 g), 건초(4개월령 1.0~1.4 kg → 9개월령 3.4~4.5 kg), 물 부단 급여; 건강관리(배꼽 소독, 5종 혼합 백신 3.5~4개월령, 혐기성균 3종 백신 4개월령, 구충제 3개월령, 철제·비타민 A·E 출생 3일 이내, 거세·제각 4개월령, 출하 10일 전 삭제·요네병 검사).</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">사료벼 WCS 급여를 도입한 사양관리</div>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>사료벼는 휴경 논의 유효 이용이나 가축 사료 자급률 향상, 안전한 국산 사료 공급 이용 등을 목적으로 재배 면적이 확대되어 생산량이 증가해 오고 있다. 특히 경엽 다수확형·고당분의 「다치스즈카(たちすずか, 그림 5-4-17)」 등의 품종은 사일리지로 조제된 홀크롭 사일리지(WCS)의 품질이 높고 소의 기호성도 양호하다(그림 5-4-18). 수입 사료의 가격 급등이나 공급 불안정을 피하기 위해, 또 안전하고 고품질의 사료를 급여하기 위해, 사료벼 WCS를 육성기의 조사료로 급여하는 것도 가능하다. 사료벼 WCS는 CP 함량이 낮고 TDN 함량이 높은 사료 특성을 가지고 있어, 그 사료 특성을 잘 이용하면 양호한 발육을 기대할 수 있다. 사료벼 WCS를 조사료로 이용하는 경우는 CP의 부족분을 대두박 등으로 보충하고, 고 TDN 섭취에 의한 과비를 막기 위해 적량 급여로 할 필요가 있다. 가능하다면 미세 세단 WCS를 이용하면 섭취량이 안정된다. 또한 급여 전에 WCS의 발효 품질을 체크하여 2차 발효한 저품질 WCS는 급여하지 않는 것도 중요하다. 표 5-4-4, 표 5-4-5, 표 5-4-6에 미세 세단 「다치스즈카」 WCS를 이용한 경우의 급여량 기준과 발육 성적을 나타낸다<sup>16)</sup>.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="196">•</span><span><i>그림 5-4-17 다치스즈카 WCS. 왼쪽: 종래 절단장 WCS(30 mm), 오른쪽: 미세 세단 WCS(이론장 6 mm).</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="197">•</span><span><i>그림 5-4-18 육성우(거세우)에 대한 다치스즈카 WCS 급여(사조에서 채식 중인 거세 송아지 사진).</i></span></p>

<p class="bx-num"><span class="bxn" data-n="202">•</span><span>표 5-4-6 미세 세단 다치스즈카 WCS를 주체로 한 급여에서의 급여 기간 중 발육 성적.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>구분</th><th>체중(kg)</th><th>DG(kg)</th><th>체고(cm)</th><th>체장(cm)</th><th>흉위(cm)</th><th>복위(cm)</th></tr><tr><th>WCS구</th><td style="text-align:left">143.6±8.1</td><td style="text-align:left">1.03±0.06</td><td style="text-align:left">18.3±0.5</td><td style="text-align:left">27.3±1.9</td><td style="text-align:left">37.0±3.1</td><td style="text-align:left">42.3±0.4</td></tr><tr><th>건초구</th><td style="text-align:left">113.5±8.5</td><td style="text-align:left">0.81±0.06</td><td style="text-align:left">16.4±1.7</td><td style="text-align:left">24.4±2.6</td><td style="text-align:left">27.9±2.6</td><td style="text-align:left">33.4±3.9</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="203">•</span><span><span style="color:var(--ink-soft)">4개월령부터 140일간의 발육량. WCS구는 미세 세단 다치스즈카 WCS와 농후사료를 급여, 건초구는 건초와 농후사료를 급여. 체장을 제외하고 시험구 간에 유의차 있음(P<0.05). 문헌 16에서 인용·개변</span></span></p>
