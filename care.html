<div class="bx-sub"><div class="bx-subtitle">제1위 미생물의 정착</div>
<p class="bx-num"><span class="bxn" data-n="353">•</span><span>반추동물의 제1위에 공생하는 미생물은 세균, 프로토조아 및 진균으로 크게 나뉘며, 성축에서는 내용물 1 g당 각각 10^10~11개, 10<sup>4</sup>~6개 및 10<sup>2</sup>~4개의 밀도로 서식한다. 신생 송아지의 제1위에는 어미소와의 접촉이나 주변 환경에의 노출을 통해 미생물이 침입하여 서서히 정착해 간다. 정착 개시는 세균이 가장 빠르고, 프로토조아와 진균은 다소 늦게 출현한다. 프로토조아의 정착에는 어미소와의 접촉이 필수이며, 출생 직후에 어미소로부터 격리하여 사육한 송아지의 제1위에서는 프로토조아가 보이지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="354">•</span><span>신생 송아지의 제1위 세균은 생후 1일에 성우와 같은 정도의 밀도로 검출된다(그림 3-4-1: A)⁴⁾. 다만 그 구성은 일령의 진행에 따라 변화하여, 전분 분해균은 출생 직후부터 정착이 확인되는 한편 셀룰로오스 분해균과 메탄균은 다소 늦게 정착한다(그림 3-4-1: B)⁵⁾. 포유기의 제1위 세균총 구성은 섭취 사료의 변화에 크게 영향을 받아, 출생 직후에는 제2위구 반사를 벗어나 제1위로 유입되는 소량의 우유나 스타터에 포함된 이분해성 당류를 이용하는 세균이 정착하고, 이어서 조사료 섭취에 따라 셀룰로오스 분해균의 정착이 일어난다. 제1위 발효가 활발해지면 수소와 이산화탄소의 생성이 증가하고, 이를 기질로 하여 메탄균이 증식한다. 제1위 발효에서 수소의 축적은 발효 정체를 일으키므로 신속히 계 밖으로 배출할 필요가 있고, 메탄 생성은 발효 유지의 관점에서 유효한 배출 경로라고 할 수 있다. 한편 메탄은 고에너지 가스이며, 이를 계 밖으로 배출함으로써 2~12%의 사료에너지 손실이 된다. 따라서 제1위 발효에서 메탄균은 공과 양면을 함께 지닌 존재이지만, 제1위 기능 발달의 관점에서 생각하면 메탄균의 정착으로써 제1위 세균총 형성이 완료된다고 할 수 있다. 앞서 말한 제1위 내 효소 활성과 발효 파라미터 및 세균총 구성의 변화로 볼 때, 신생 송아지의 제1위에서는 생후 3주까지 세균총이 형성되어 기본적인 사료 소화 기능이 갖추어진다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="355">•</span><span><i>그림 3-4-1 송아지 제1위 내 세균수와 구성. A: 총세균수(log cfu/mL) — 1·3·6·9·13일령 모두 약 9.2~9.6, 성우 약 9.0. B: 기능 분류별 세균수(log cfu/mL, 1~70일령) — 전분 분해균·자일란 이용균·펙틴 이용균은 3일령에 이미 8~9로 상승, 셀룰로오스 분해균은 1일령 0.2에서 14일령 6, 28일령 이후 7~8로 증가, 메탄균은 1~3일령 0.2~0.5에서 21일령 4, 42일령 이후 6~7로 가장 늦게 증가. 유산 자화균·황산환원균은 6~8 범위. A는 문헌 4, B는 문헌 5에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="356">•</span><span>세계 35개국, 32개 반추동물 종/품종, 742개체(가축 및 야생 반추수 포함)의 제1위 세균총을 분석한 보고⁶⁾에 따르면, 지역이나 동물 종을 불문하고 Proteobacteria문, Bacteroidetes문 및 Firmicutes문에 속하는 세균이 우세하며, 이들이 전 세계 반추동물에 공통으로 보이는 핵심 세균군으로 여겨진다. 이 3문은 출생 직후의 송아지에서도 주요 세균군으로 검출된다⁷⁾. 다만 각각의 분포량은 일령에 따라 달라서, 출생 직후에는 Proteobacteria가 우세하지만 7~14일령에 걸쳐 Bacteroidetes와 Firmicutes가 증가하고, 42일령에는 Bacteroidetes 우세의 세균총이 된다(그림 3-4-2)⁷⁻⁹⁾. 또한 Jami 등⁹⁾은 1~3일령에 걸쳐 호기성세균이 격감하고 혐기성세균이 빠르게 니치를 획득하며, 세균총의 개체차는 가령에 따라 감소하여 2~24개월령에 걸쳐 수렴해 간다고 보고하였다. 한편 생후 1일에 이미 셀룰로오스 분해균의 정착도 확인되어, 주요 제1위 세균의 정착이 조기부터 시작됨도 지적하였다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="357">•</span><span><i>그림 3-4-2 송아지의 성장에 따른 제1위 주요 세균군의 분포량 변화(총세균 대비 %, 3·7·14·28·42일령). Proteobacteria: 3일령 약 45~70%에서 7일령 이후 10~30%로 감소. Bacteroidetes: 3일령 10~40%에서 42일령 60~80%로 증가. Firmicutes: 3일령 10~15%, 14~28일령 20~45%, 42일령 10~20%. 문헌 7~9에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="358">•</span><span>프로토조아의 정착은 생후 2주 이후부터 시작되어, 처음에 소형의 Entodinium속이 정착하고 그 후 Diplodinium속 등의 빈모류가 정착한다. 이어서 전모류인 Isotricha속과 Dasytricha속이 6~8주령 무렵에 정착한 뒤, 중형인 Epidinium속, 대형으로 섬유 분해 활성이 높은 Polyplastron속과 Ophryoscolex속의 순으로 정착이 보인다. 프로토조아의 정착에는 일정 비율의 제1위 세균이 먼저 자리 잡고 있어야 한다고 여겨진다. 이는 프로토조아가 질소원으로 세균을 필요로 하고, 또 세균이 생성하는 대사물에 프로토조아가 필요로 하는 증식인자가 포함되어 있기 때문이다. 나아가 프로토조아는 pH에 민감하므로 pH 6 이하에서는 정착할 수 없다. 쌍둥이 새끼염소 30쌍을 출생 직후에 어미와 함께 두거나 어미로부터 격리하여 대용유를 인공포유하는 2구로 나누어 사육한 시험¹⁰⁾에서는, 어미와 함께 둔 구의 새끼염소는 1~2주령에 걸쳐 프로토조아 수가 약 100배가 되고 4주령까지 직선적으로 증가하였다. 한편 출생 직후에 어미로부터 떼어 놓은 대용유구의 새끼염소에서는 프로토조아의 증가가 확인되지 않았다. 이는 어미와의 접촉에 의한 프로토조아 전파가 일어나기 전에 격리함으로써 새끼염소의 제1위에 프로토조아가 정착하지 않았기 때문으로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="359">•</span><span>진균은 생후 8~10일에 제1위 내에 출현한다. 그 감염 경로는 세균과 같아서, 어미소의 비말 등 공기 전파에 의해 경구적으로 제1위에 침입한다. 제1위 진균은 높은 셀룰로오스 분해 활성을 지니며, 조사료를 다급한 송아지에서는 곡물사료 위주로 사육한 송아지에 비해 제1위 진균의 밀도가 높게 유지된다. 차세대 시퀀싱 기술을 이용해 분석한 보고¹¹⁾에 따르면, 생후 1주 송아지의 제1위에서는 신속(新屬) SK3¹²⁾와 Neocallimastigaceae과의 진균이 우세(각각 총진균의 57.7% 및 34.3%)하고, Caecomyces속과 Orpinomyces속이 각각 6.2% 및 0.2%의 비율로 검출된다. 그 후 각 진균은 증감하여, 생후 9주에는 신속 SK3, Neocallimastigaceae과, Caecomyces속 및 Orpinomyces속의 분포 비율이 각각 38.5%, 35.7%, 14.2% 및 2.0%가 되었다. 한편 이들의 분포량은 스타터 급여에 영향을 받아, 전유만을 급여한 경우에 비해 전유와 스타터를 병급한 송아지의 제1위에서는 신속 SK3의 구성 비율이 낮고(9주령에 41.7% vs. 29.5%), Neocallimastigaceae과의 구성 비율이 높아진다(9주령에 22.5% vs. 49.1%). 따라서 포유기의 급여 사료에 따라 정착하는 진균의 구성은 변화하는 것으로 생각된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">송아지의 장내세균총</div>
<p class="bx-num"><span class="bxn" data-n="360">•</span><span>장내세균이 사람의 영양과 건강에 크게 영향을 미친다는 것은 널리 인식되어 있으며, 사람이나 마우스의 장내세균총에 관해서는 많은 연구 사례가 보고되어 있다. 사람과 같은 포유동물인 소에서도 장내세균총은 숙주의 건강 유지에 크게 기여할 것으로 생각되지만 연구 사례는 적다.</span></p>
<p class="bx-num"><span class="bxn" data-n="361">•</span><span>동물의 장내세균총은 유산균(Lactobacillus속)과 비피더스균(Bifidobacterium속)의 분포에 근거하여 3가지 유형으로 나뉘며, 소는 Lactobacillus속 세균, Bifidobacterium속 세균 모두 비교적 소수만 검출되는 유형으로 분류된다. 송아지에서는 출생 직후에 경구 섭취 또는 항문으로부터의 침입에 의해 장내세균이 정착하여, 출생 후 며칠 만에 십이지장, 공장 및 회장에서 내용물 1 g당 10<sup>6</sup>~8개, 맹장, 결장 및 직장에서는 10^10개의 세균이 검출된다. 전유와 대용유를 급여한 시험¹³⁾에서는 생후 21일까지의 총세균, Enterococci 및 Lactobacilli의 균수에는 큰 차이가 인정되지 않았으나, Bifidobacteria와 Coliforms는 생후 7일 이후 전유를 급여한 송아지에서 유의하게 많아졌다(그림 3-4-3).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="362">•</span><span><i>그림 3-4-3 송아지의 성장에 따른 장내세균수의 변화(log No./g 분변, 4·7·14·21일령, 전유 vs. 대용유). 총혐기성세균 약 9~10으로 양군 동등; Bifidobacteria는 4일령 7.5로 동등하나 7·14·21일령에 전유군 약 9 vs. 대용유군 7~7.7(P<0.01); Coliforms는 14일령에 전유군 8.7 vs. 대용유군 7.9(P<0.05); Enterococci·Lactobacilli는 6~8 범위로 차이 없음. 문헌 13에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="363">•</span><span>DNA·RNA를 이용한 분석 기법에 근거한 포괄적 세균총 분석¹⁴˒¹⁵⁾에 따르면, 포유 송아지의 장내에서는 Bacteroidetes문, Firmicutes문, Proteobacteria문 및 Actinobacteria문이 주요 세균군으로 검출되고, 다른 포유동물과 마찬가지로 Bacteroidetes문과 Firmicutes문이 총세균의 60~70%를 차지하였다. 포유 송아지의 장내 세균총 구성은 가령과 함께 다양성이 증가하며, 고형사료 섭취나 제1위 발달 등의 요인에 의해 서서히 세균총 형성이 진행되는 것으로 생각된다. 폐기유의 유효 활용을 염두에 두고 살균 및 미살균 폐기유를 송아지에게 급여한 시험¹⁶⁾에서는, 살균 여부에 관계없이 1주령부터 4개월령까지 Bacteroidetes문, Firmicutes문 및 Proteobacteria문이 장내세균총 전체의 90% 이상을 차지하였다. 한편 미살균 폐기유를 급여한 우군에서는 포유기간 중 Bacteroidetes문이 전체에서 차지하는 비율이 낮게 추이(살균군 32.6~50.6% vs. 미살균군 18.8~28.7%)하고, Firmicutes문의 비율이 높아졌다(살균군 31.3~41.2% vs. 미살균군 44.3~62.6%). 또한 미살균 폐기유를 급여한 우군에서는 1주령에 Salmonella속 세균의 검출 빈도가 높아진다고 보고하였다. 세균의 활성을 반영하는 16S rRNA를 표적으로 하는 세균총 분석¹⁷⁾에서는, 1주령 송아지의 장내에서는 Bacteroides속, Clostridium coccoides–Eubacterium rectale 그룹, Atopobium속, Faecalibacterium속 및 Bifidobacterium속이 주요 세균군으로 검출되었으나, 5주령 이후에는 Atopobium속, Faecalibacterium속 및 Bifidobacterium속이 크게 감소하고 Bacteroides속이 우점하는 세균총이 됨이 밝혀졌다. 포유기의 송아지에서는 설사를 주징으로 하는 소화기 질환이 자주 발생하는데, 여기에는 장내세균이 크게 관여한다. 신생 송아지의 세균성 설사에서는 대장균(Escherichia coli), 살모넬라균(Salmonella속 세균) 또는 웰치균(Clostridium perfringens)이 주요 원인균으로 알려져 있다. Lactobacillus속이나 Bifidobacterium속 같은 유용 세균은 병원 세균의 정착을 억제한다는 것이 밝혀져 있다¹⁸˒¹⁹⁾. 또한 1주령의 장내에서 Faecalibacterium속의 분포량이 많은 송아지에서는 설사 발생이 적고 발육 성적이 양호해질 가능성도 지적되어 있다¹⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="364">•</span><span>세균총 분석 기술의 진보에 따라 송아지의 장내세균총에 관해서는 정보 축적이 진행되고 있으나, 분석 기법이나 사용하는 품종 또는 사양관리의 차이 등에 따라 일관된 견해는 얻어지지 않았다²⁰⁾. 앞으로 더 많은 연구 사례가 축적되어 송아지의 건전한 발육에 이바지하는 장내세균에 관한 지견을 얻을 수 있기를 기대한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="365">•</span><span><span style="color:var(--ink-soft)">(저자: 小池聡)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="366">•</span><span><span style="color:var(--ink-soft)">일본송아지 3-4 송아지의 제1위 발효와 장내세균총.</span></span></p>
</div>
<div class="bx"><div class="bx-title">3-5 송아지의 생체방어능 발달과 특징</div>
<div class="bx-sub"><div class="bx-subtitle">면역 시스템</div>
<p class="bx-num"><span class="bxn" data-n="367">•</span><span>동물에게는 세균이나 바이러스 등 비자기인 이물을 공격·배제하려는 방어 시스템, 즉 면역 기능이 갖추어져 있다. 면역은 자연면역과 획득면역으로 나뉜다. 자연면역은 불특정 다수의 이물·미생물 침입에 대해 신속하게 기능하는 면역응답 기구로, 곤충에서 포유류까지 폭넓게 존재하며, 태어날 때부터 지닌 유전적 요인에 근거한 감염증에 대한 저항성을 말한다. 이에 비해 획득면역은 면역세포가 일단 기억한 특정 병원체에만 강력하게 반응하는 면역 기구로, 포유류 등 고등동물만이 지니고 있다. 항원물질의 침입 후 항원 인식을 거쳐 항체가 생산되고, 감작 림프구가 작용하는 구조이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="368">•</span><span>자연면역 기구는 획득면역에 비해 감염 미생물에 대한 특이성이나 친화성이 낮지만, 외래 미생물의 분자 패턴을 인식하여 이물을 배제하고 체내 침입을 방지한다. 감염증 초기에는 자연면역 응답이 일어나고, 그 후 획득면역이 응답한다. 탐식 기능을 지닌 대식세포와 호중구는 세균을 탐식하여 배제하는 기능을 지닌다. 이 중 단구·대식세포는 「항원제시세포」라 불리며, 세균을 탐식하여 세포 내에서 소화하고 세균의 단백질을 분해·단편화하여 아미노산 수가 적은 펩티드로 만든다. 이렇게 만들어진 항원 펩티드는 CD(Clusters of Differentiation)3⁺ T세포에 항원 제시된다. 한편 자연살해(NK)세포나 킬러 T세포는 바이러스 감염세포나 종양세포를 인식하여 장애를 준다. 획득면역은 B세포나 T세포 같은 림프구에 의해 이루어지며, 다채로운 항원수용체를 형성함으로써 높은 친화성으로 특이적으로 항원을 인식한다. 또한 림프구는 이 항원성을 기억하여, 다시 같은 항원이 침입했을 때 강한 면역응답을 일으킨다. 그 때문에 획득면역이 성립하려면 면역세포에 항원이 접촉한 뒤 며칠이 필요하다. 이처럼 고등동물에서는 자연면역과 획득면역이 협조하면서 미생물을 배제하는 구조를 지니고 있다. 나아가 획득면역은 액성면역, 세포성면역, 염증·감염방어성 면역, 면역관용·완충·수복성 면역으로 크게 나뉜다(그림 3-5-1). B세포도 T세포도 항원과 반응함으로써 면역응답을 나타낸다. 이들의 표면에는 항원과 1대1로 반응하는 항원수용체가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="369">•</span><span><i>그림 3-5-1 감염 미생물에 대한 면역응답. 자연면역: 호중구(혈중에서 감염조직으로 유주, 세균 탐식), 대식세포(조직 내에서 대기·반응), NK세포(바이러스 감염세포 장애). 수지상세포·대식세포·B세포의 항원제시 → T세포 → CD4⁺T세포(Th2: 액성면역, B세포·항체), (Treg: 면역관용·완충), (Th1: 세포성면역, 대식세포·단구), (Th17: 호중구), CD8⁺T세포(킬러 T세포)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">신생자기 송아지의 면역</div>
<p class="bx-num"><span class="bxn" data-n="370">•</span><span>신생 송아지는 출생함으로써 무균 상태인 어미소의 자궁 안에서 다양한 미생물에 노출되는 자궁 밖에 놓이게 된다. 출생 후의 신생 송아지는 미생물의 침입으로부터 생체를 방어하는 시스템은 갖추고 있으나, 항원에 노출된 적이 없기 때문에 자연면역과 획득면역 양쪽에 관여하는 기능이 성우에 비해 떨어지며, 이것이 신생 송아지가 감염되기 쉬운 한 원인으로 생각된다. 구체적으로는 탐식계 세포인 호중구나 단구의 세포막 변형능과 표면접착능·주화능이 낮고, NK세포나 킬러 T세포 등의 세포장애능도 떨어진다. 또한 신생 송아지는 특정 사이토카인에 의해 단구의 항원제시능을 증강 자극하는 반응도 성우에 비해 낮다. 신생 동물 호중구의 활성산소 생산능은 성우의 호중구와 같은 정도이지만, 대장균에 대한 옵소닌 활성·탐식능은 저하되어 있다고 하며, 출생 2주 이내 신생 송아지 호중구의 살균·탐식 기능은 성우에 비해 낮다. 이 호중구 기능 저하의 원인 중 하나로 세포 내 칼슘이나 인산화효소의 부족이 관여한다고 한다¹⁾. 이처럼 자연면역, 획득면역 양쪽에서 신생 송아지의 면역 기능은 성우에 비해 떨어지며, 이를 보조하기 위해 초유를 통해 어미소의 면역 성분을 신생 송아지에게 이행한다. 초유 중에는 어미소가 그때까지 노출·감염된 항원에 대한 항체는 물론 항균성 물질과 면역세포가 대량으로 포함되어 있어, 초유 섭취는 미숙한 신생 송아지의 면역 기능 보조와 획득면역 성숙의 촉진을 위해 매우 중요한 의의를 지닌다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="371">•</span><span><i>그림 3-5-2 건강한 흑모화종 송아지의 출생 후 말초혈 T세포 및 B세포의 추이(두수 8두, 평균±표준오차). CD4⁺T세포: 0일령 약 200/μL → 14~30일령 300~400 → 90일령 약 430. CD8⁺T세포: 0일령 약 150 → 22일령 약 550 → 58일령 약 720 → 90일령 약 670</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">흉선</div>
<p class="bx-num"><span class="bxn" data-n="372">•</span><span>골수에서 공급된 골수 줄기세포는 흉선에서 자기·비자기의 인식 교육을 받고 전신에 분포한다. 먼저 줄기세포가 흉선에 들어가면 T세포가 되어 활발히 분열하여 다양한 세포군이 생기지만, MHC 단백질을 인식하지 못하는 T세포 중 90~95%가 아포토시스로 제거된다. 변성된 세포를 인식하고 또 자기 자체를 파괴하지 않는 T세포만이 성숙하여 말초 림프조직으로 이동해 면역응답을 담당한다. 흉선에서는 기능을 각 T세포에 분담시키고, 그에 따른 세포 표면분자의 발현이 일어난다. T세포 표면분자란 T세포수용체(T cell receptor: TcR)의 단백질 분자인 CD 중 CD4 또는 CD8 중 하나이며, CD4 분자는 헬퍼 T세포(Th), CD8 분자는 킬러 T세포에 특유한 분자이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="373">•</span><span>흉선은 재태 4개월 무렵에 기본 구조가 만들어지지만, T세포의 성숙은 출생 후부터 활발해진다. 난소나 정소가 활동하기 시작하여 성호르몬이 생산되기 시작할 무렵 흉선 중량의 체중비는 최대가 되고, 그 이후로는 계속 감퇴한다. 일반적으로 흉선의 노화가 T세포 기능의 감퇴를 가져와 고령 동물의 면역 기능 감소와 저항력 저하를 초래하는 것으로 생각된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">유령기의 획득면역</div>
<p class="bx-num"><span class="bxn" data-n="374">•</span><span>신생 동물의 CD4⁺세포는 기능적으로 미숙하여 항체 생산 유도능이 인정되지 않지만, T 및 B세포 직접 상호작용에 관여하는 기능 분자는 성우 수준으로 발현할 수 있다고 한다. 그림 3-5-2에는 출생 이후 건강한 흑모화종 송아지의 αβT세포에 포함되는 말초혈 CD4⁺T세포 및 CD8⁺T세포 수의 추이를 나타냈다. 출생 직후에는 어느 림프구 수도 낮은 값이며, 성장과 함께 서서히 증가한다. 신생 동물의 T세포는 CD45RA를 발현하고 CD29는 거의 발현하지 않는 나이브 T세포가 대부분이다. 이에 비해 성우의 말초혈 림프구는 CD45RO를 발현하고 있어 메모리 T세포가 많아진다. 유령기 송아지의 Th1세포, Th2세포의 반응성은 떨어지지만, Th17세포의 기능은 유령기에도 높게 유지되고 있음이 알려져 있다²⁾. 또한 유령기 동물의 NK세포나 항체의존성 및 세포장애성 킬러 T세포(CD8⁺T세포)를 포함한 세포장애 활성은 성우의 림프구보다 상당히 낮다고 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="375">•</span><span>흉선에서 성숙한 나이브 CD4⁺T세포는 2차 림프조직에서 활성화되어 이펙터 기능을 획득하는데, 각각 다른 기능을 지닌 이펙터 세포(Th1, Th2, Th17, Treg 등)로 분화하여 면역응답에서 상보적인 역할을 담당한다(그림 3-5-3).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="376">•</span><span><i>그림 3-5-3 흉선에서 성숙한 나이브 CD4⁺T세포의 분화. Th0 → [분화유도 사이토카인 / (전사인자) / 생산 사이토카인 / 생체에서의 역할] — Th1: IL-12 / (T-bet) / IFN-γ, IL-2 / 세포내 기생성 미생물 방어, 지연형 알레르기. Th2: IL-4 / (GATA3) / IL-4, IL-5, IL-13 / 항체생산 보조, I형 알레르기(IgE 생산, 호산구 활성화). Th3: TGF-β / (Smad) / TGF-β / 면역억제, IgA 생산. Th9: TGF-β+IL-4 / (IRF4) / IL-9 / 알레르기(비만세포 증식, 점액 분비). Th17: TGF-β+IL-6, IL-23 / (RORγt) / IL-17, IL-22 / 세균·진균 방어, 염증 야기(류마티스관절염, 다발성경화증). Th22: TNF-α+IL-6 / (Ahr) / IL-22 / 상피 보전, 항균펩티드 생산. Tr1: TGF-β+IL-27 / (c-Maf) / IL-10 / 면역억제, B세포 보조. Treg: TGF-β / (Foxp3) / IL-10, TGF-β, IL-35 / 면역억제. TFH: IL-6, IL-21 / (Bcl-6) / IL-21, IL-4 / B세포 보조</i></span></p>
<p class="bx-num"><span class="bxn" data-n="377">•</span><span>이 중 Th1세포는 바이러스 등 세포 내에서 증식하는 병원체에 대해 직접 공격하는 세포성 면역응답을 유도하는 역할을 지니며, 신속하게 혈류로 들어가 감염 부위로 이동하여 인터페론(IFN)-γ나 인터루킨(IL)-2 등의 사이토카인을 분비하여 대식세포의 활성화나 염증반응을 일으킨다. 이들 사이토카인이 CD4⁺T세포 상의 수용체에 결합하면 STAT1 및 STAT4 신호전달 경로가 활성화되고, T-bet이라 불리는 전사인자의 발현이 유도되어 IFN-γ의 유전자 발현을 촉진한다. 이로써 세포는 Th1세포로 분화하여 대량의 IFN-γ를 발현하게 되며, 또한 대식세포의 세포외 환경에서 감염된 병원체를 탐식·살상하는 능력 및 프로페셔널 항원제시세포로서의 기능이 강화된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="378">•</span><span>한편 Th2세포는 항체를 생산하여 병원체 공격을 촉진하는 역할을 지니며, IL-4나 IL-5 등의 사이토카인을 분비하여 2차 림프조직에서 같은 항원을 인식하는 나이브 B세포를 활성화시킨다. 활성화 B세포는 배중심 반응에 의해 세포분열·클래스 스위치·친화성 성숙을 거쳐 최종적으로 항체를 분비하는 형질세포로 분화한다. IL-4는 STAT6 신호 경로를 활성화하여 전사인자 GATA-3의 발현을 촉진한다. GATA3는 Th2세포에 특징적인 IL-4, 5, 13 등의 유전자 발현을 유도하며, 이들 사이토카인을 분비하기 시작하면 항체 생산이 촉진되게 된다. Th2세포의 활성화에 의한 면역글로불린(Ig)E 생산 유도는 기생충 배제에 중요하지만, 알레르기의 원인도 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="379">•</span><span>또한 Th17은 세포 외에서 증식하는 미생물의 공격을 촉진하는 역할을 지니며, 전환성장인자(TGF)-β와 IL-6의 두 사이토카인에 의한 자극이 동시에 일어남으로써 분화하고, IL-17과 IL-22를 고생산하는 것이 특징이다. IL-17은 호중구 등의 세포 유주나 감염 부위에서의 염증을 일으키는 것으로 알려진 사이토카인이다. Th17세포는 소화관의 장간막 림프절이나 파이어판에는 존재하지 않지만 상피 직하의 점막고유층에 다수 상주한다고 하며, 출생 후부터 서서히 증가하여 소화관 내 병원성 세균에 대한 저항성을 높이는 것으로 생각된다. 그 때문에 유령기의 세균총 형성이 송아지 획득면역의 성숙에 큰 영향을 미친다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">αβT세포와 γδT세포</div>
<p class="bx-num"><span class="bxn" data-n="380">•</span><span>T세포에는 ① 대식세포 등을 활성화하는 사이토카인을 생산하여 세균이나 이물을 처리하는 반응을 유도한다, ② 바이러스 감염세포나 종양세포, 이식세포를 파괴한다, ③ B세포나 다른 T세포의 작용을 보조 혹은 억제하는 등 조절한다, 는 기능이 있다. 이들 기능은 역할을 담당하는 각각의 T세포에 분담되어 있다. ①과 ②는 CD4 항원을 발현하는 헬퍼 T세포이며, ①은 Th1세포, ②는 Th2세포가 그 기능을 수행한다. 또한 ②의 세포를 죽이는 작용을 하는 T세포는 「킬러 T세포」라 불리며 CD8 항원을 발현한다. 이들 T세포는 세포 표면에 TcR이라는 항원수용체를 보유하는 세포로 정의되는데, 이 TcR에는 αβ와 γδ의 2종류가 있고 T세포는 둘 중 하나의 TcR을 보유한다. 위의 CD4⁺T세포나 CD8⁺T세포는 TcRαβ를 보유하는 αβT세포로 분류되며, 성우의 말초에서는 대부분이 이 αβT세포이고 γδT세포는 소수이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="381">•</span><span>사람이나 마우스에서는 말초혈 T세포의 95%를 CD4⁺CD8⁻ 혹은 CD4⁻CD8⁺ 세포인 αβT세포가 차지하며, CD4⁻CD8⁻ 세포의 비율은 낮다. 그러나 반추동물에서는 말초혈 T세포 중 TcRαβ를 보유하지 않는 CD4⁻CD8⁻ 세포의 비율이 높으며, 이는 유령기에 현저하게 보인다. 출생 후 송아지의 CD4⁺T세포는 서서히 증가하여 성우가 되면 말초혈 중 CD4⁺T세포의 비율이 CD8⁺T세포의 약 2배에 이르지만, γδT세포의 비율은 1~6개월에 걸쳐 높고 그 후 감소한다³⁾. 그림 3-5-4에는 건강한 흑모화종 송아지 출생 후 말초혈의 αβT세포, γδT세포와 CD21⁺B세포 수의 변화를 나타냈다. 어느 림프구도 출생 후부터 서서히 증가하고 있다. 1주령 홀스타인 송아지의 CD4⁺ 및 CD8⁺T세포의 마이토젠 반응성은 5~6개월령의 세포에 비해 낮지만, 1주령 γδT세포의 반응성은 5~6개월령에 비해 높다. γδT세포는 피부나 기관, 소화관 등의 점막조직과 비장 등에 많이 분포한다. γδT세포는 감염 초기의 면역반응이나 NK세포 같은 세포상해 작용을 지니며, 피부나 소장의 상피와 점막에서는 T세포 전체의 50% 이상을 차지한다. 나아가 유령의 말초혈 림프구 중 γδT세포의 비율은 많은 경우 50% 이상에 이른다. 수지상세포, NK세포, γδT세포 등이 자연면역과 획득면역의 연결 및 상호작용과 감염방어 면역에 매우 중요하다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="382">•</span><span><i>그림 3-5-4 건강한 흑모화종 송아지의 출생 후 말초혈 T세포 및 B세포의 추이(/μL). αβT세포: 0일령 약 600 → 2일령 450 → 6일령 950 → 18일령 1,330 → 58일령 1,400 → 90일령 약 1,320. γδT세포: 0일령 약 700 → 12일령 1,400 → 이후 1,250~1,400 유지. CD21⁺B세포: 0일령 약 200 → 14일령 600 → 26일령 1,080 → 44일령 1,220 → 90일령 약 1,300</i></span></p>
<p class="bx-num"><span class="bxn" data-n="383">•</span><span>γδT세포로부터 응답을 얻는 조건은 완전히 해명되어 있지 않다. 반추동물은 사람이나 마우스에 비해 γδT세포 수가 많이 존재하는 특징이 있으며, 특히 유령기에 많다. γδT세포는 IFN-γ나 IL-4, IL-12, IL-17 같은 사이토카인을 생산하여⁴⁾, 항원 미생물이 끊임없이 침입하는 점막조직에서 면역 시스템의 활성화에 유리하게 활동하는 것으로 생각된다. 또한 γδT세포가 유령기에 많이 존재하는 것은 흉선의 성숙과 그에 따른 αβT세포의 항원기억 반응에도 영향을 미치는 것으로 생각되며, γδT세포의 기능으로서 기본 면역이라는 본래의 기능뿐 아니라 획득면역에 대해서도 보조적인 역할을 담당할 가능성도 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">B세포</div>
<p class="bx-num"><span class="bxn" data-n="384">•</span><span>태자기에 무균적 환경에 있던 신생 송아지는 출생과 함께 미생물과 항원에 노출된다. 출생 직후에는 외부 세계에서 마주치는 모든 미생물에 대한 면역 기억이 없기 때문에, 감염 방어는 자연면역 응답에 의존하면서 항원을 기억하며 항체를 생산한다. 출생 후 송아지 자신의 Ig 상승이 보이는 것은 출생 후 1주 이후이다. 또한 출생 시의 말초혈 중 B세포는 미미하게 인정되는 정도이나, 성장과 함께 증가한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="385">•</span><span>특정 항원에 대해 만들어진 항체는 그 항원과 결합하지만 다른 항원과 결합하지는 않는다. 항체는 H사슬의 불변영역이 조금씩 다름에 따라 5가지 클래스(IgM, IgD, IgE, IgG, IgA)로 크게 나뉜다. 항체 생산 초기에는 IgM이 생산되지만, IgM, IgG, IgA로 하나의 세포가 각각의 클래스로 바꾸어 만들어 간다(클래스 스위치).</span></p>
<p class="bx-num"><span class="bxn" data-n="386">•</span><span>클래스 스위치를 유도하려면 헬퍼 T세포의 작용이 필요하며, 헬퍼 T세포가 생산하는 사이토카인에 따라 B세포가 생산하는 항체의 클래스가 바뀐다. 여기까지의 항원 인식부터 항체 생산까지의 독립된 면역응답을 「1차 반응(primary response)」이라 한다. B세포는 증식·분화하여 형질세포로서 항체를 생산하지만, 일부는 분화하지 않고 항원을 인식하여 기억세포로 존재한다. 이 기억세포는 다음에 같은 항원이 침입하면 재빨리 반응하여 항체를 다량 생산한다. 이를 「2차 반응(secondary response)」이라 부른다. 이 B세포에 의한 항원 기억은 유령기 동물에서 적극적으로 이루어진다. 일반적으로 B세포는 특이 항원의 존재 하에 T세포로부터의 IL-2, IL-4 등의 사이토카인 및 T세포 상의 CD40 리간드와의 접착에 의해 항체생산세포로 분화·유도된다. 앞서 말했듯이 출생 시의 T세포 및 B세포 수는 성우에 비해 적고, T세포의 헬퍼 활성, B세포 항체생산능 등 기능적인 면에서 성우 수준의 반응이 인정되지 않는 것은 신생 송아지가 감염되기 쉬운 한 원인으로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="387">•</span><span>지금까지 어미소로부터 이행한 항체의 존재 때문에 백신을 접종해도 항체가가 상승하지 않는 백신 브레이크의 존재가 지적되어, 어린 송아지에 대한 백신 접종은 부정되어 왔다. 유령 송아지에게 백신을 접종해도 항체가가 상승하기 어려운 이유에는 앞서 말한 신생 송아지의 항원에 대한 감수성의 낮음이 관여하는 것으로 시사된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="388">•</span><span><i>그림 3-5-5 건강한 흑모화종 송아지에 대한 불활화 세균 백신 접종 후의 중화항체가(화살표는 백신 접종, 관찰우 14두, 평균±표준오차). Pasteurella multocida: 1개월령 약 300, 2개월령 약 370, 3개월령 약 1,300, 4개월령 약 1,220, 5개월령 약 1,430. Mannheimia haemolytica: 1~2개월령 약 150, 3개월령 약 480, 4개월령 약 720, 5개월령 약 1,170. 백신 접종은 1개월령과 2개월령</i></span></p>
<p class="bx-num"><span class="bxn" data-n="389">•</span><span>또한 그림 3-5-5에는 출생 1개월령의 건강한 흑모화종 송아지에게 시판되는 소 호흡기 감염에 대한 3종 세균 불활화 백신을 접종한 후의 항체가 추이를 나타냈는데, 2회 백신 접종하면 2회째부터 Pasteurella multocida나 Mannheimia haemolytica 중화항체가가 상승하기 시작하여, 백신 브레이크의 개념이 반드시 들어맞지는 않음이 시사된다. 신생자기의 미생물 등 항원에 대한 항체 생산에 대해서는 적어도 Th2세포나 B세포 등을 중심으로 한 면역 시스템의 성숙 정도와 감수성이 백신 접종에 대한 응답성에 관여하는 것으로 생각된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">장관과 점막면역</div>
<p class="bx-num"><span class="bxn" data-n="390">•</span><span>앞서 말했듯이 항원 응답성이 뛰어난 면역세포나 항체 등의 면역 성분이 초유를 통해 어미소로부터 송아지에게 이행한 뒤, 이 면역 성분은 송아지의 감염 방어를 보조할 뿐 아니라 송아지 자신의 면역 시스템 활성을 촉진한다. 여기에 더해 점막이나 피부 등 체표 조직에서 미생물이 증식하고 미생물끼리 균형을 잡으면서 생체와의 공생관계가 형성되어 면역 시스템이 활성화되어 간다. 점막조직에는 점막관련 림프조직(Mucosa-associated lymphoid tissue: MALT)이 존재하여, 적극적으로 항원을 체내로 받아들여 면역 기억하면서 송아지 자신이 형성하는 획득면역을 촉진한다. 특히 완전한 무균 상태였던 소화기나 호흡기 등의 점막조직에서는 출생 후 급격히 세균 등의 미생물이 증식하고, 대량의 세균이 정착하여 세균총이 형성됨으로써 생체와의 공존관계가 만들어진다. 소화관 중에서도 장관에는 장내세균을 비롯한 장내세균총이 존재하여 항상 막대한 양과 종류의 항원과 접하고 있다. 장관에는 전신의 60~70%라고도 하는 면역세포가 집결한다. 또한 항체생산세포의 70% 이상이 IgA 생산세포이다. 장관에는 γδT세포나 B세포 등이 많이 존재하며, 이들 세포는 자연면역에 관여하는 것으로 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="391">•</span><span><i>그림 3-5-6 점막으로의 림프구 호밍: 점막면역 순환 귀소 경로(CMIS). 유도조직(소장 파이어판에서 항원(Ag) 섭취 → 장간막 림프절, 누선·타액선, 고유층)에서 자극된 림프구가 혈관을 거쳐 실효조직(유관·유선, 생식비뇨기, 비강·폐)으로 귀소하여 IgA를 분비. 메디컬 면역학(小野江和則·上出利光 감역)에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="392">•</span><span>점막면역 시스템은 ① 분비형 Ig인 IgA의 생산 유도를 하는 유도조직, ② IgA가 분비·기능하는 실효조직, 그리고 ③ 이들을 잇는 귀소 경로로 구성되어 있다(그림 3-5-6). 장관에는 복수의 림프여포가 집합하여 형성된 대표적 유도조직의 하나인 파이어판이 존재하며, 이 파이어판을 형성하는 상피세포층에 M세포가 존재한다. M세포는 바이러스나 세균 등을 적극적으로 받아들여 대식세포 등의 항원제시세포에 넘겨준다. 또한 비강 내에는 미생물이 많이 존재하기 때문에 흡기 중의 항원에 노출될 기회가 많고, 이들 미생물 항원은 편도에서 적극적으로 받아들여져 면역 기억되어 간다. 점막조직의 수지상세포는 상피세포 사이로 돌기를 뻗어 직접 장관 내 세균 등의 항원을 받아들이는 것도 알려져 있는 것 외에, 상피세포 자체에도 장관 내 항원을 받아들이는 시스템이 존재함이 밝혀지고 있다. 또한 장관 상피세포에 있는 FcRn(neonatal Fc receptor)은 장관 내강 측에서 Ig가 결합한 항원을 Ig째로 기저막 측에 수송하고 있다. 이들 세포는 림프구에 대한 항원 자극을 이끌고, 자극을 받은 림프구는 림프절에서 분화한 뒤 실효조직인 다른 점막면으로 이동하여 IgA를 생산한다. 그 때문에 정상적인 장관 내 세균총의 유지는 면역 시스템의 성숙에 매우 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">송아지의 장내세균총, 생균제의 효과</div>
<p class="bx-num"><span class="bxn" data-n="393">•</span><span>신생 송아지의 분변 내에서는 증식이 빠른 대장균 등 환경 유래의 세균이 대장 내에서 일과성으로 증식한 뒤, 이에 뒤이어 비피더스균(Bifidobacterium속)이 출현하기 시작하고, 비피더스균과 교체되듯이 대장균 등의 세균이 감소하기 시작하여 세균총이 안정된다(그림 3-5-7). 신생자기 장내세균총의 이상, 특히 리포폴리사카라이드(LPS)를 지닌 대장균 등의 과도한 증식은 장관 상피세포 상에 있는 TLR을 자극하여 내용물을 배제하는 반응이 일어나기 때문에 설사증을 일으킨다. 유령기 송아지의 장내세균총은 성분이 불안정한 모유, 소화하기 어려운 대용유, 송아지 자신의 소화능력이 낮은 것 등의 이유로 불안정하며, 장관 내의 이상발효는 장관 면역응답에 이상을 초래하여 설사증에 이르기 쉽다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="394">•</span><span><i>그림 3-5-7 건강 상태와 염증 상태의 장내세균총(이미지). 건강 상태: 정상 장내세균총(E. coli, Bacteroides, Lactobacillus, Bifidobacterium)과의 공생 → 수지상세포, Th17세포, 조절성 T세포, 대식세포(IL-10, TGF-b) → 제어형 면역응답과 활성형 면역응답의 균형. 염증 상태: 장내세균총의 난조·파탄(E. coli, Clostridium, Klebsiella, Proteus) → 대식세포(IL-6, TNF-a, IL-17, IL-23), Th17세포 증가 → 제어형 면역응답 대비 활성형 면역응답으로 실조</i></span></p>
<p class="bx-num"><span class="bxn" data-n="395">•</span><span>출생 후 서서히 장내세균총이 안정되어 생체와 장내세균총의 공생관계가 형성되기 시작할 무렵에는 장관 점막의 MALT에서 적극적으로 장내 미생물이 받아들여져 면역세포의 활성화가 촉진된다. 또한 장내세균총의 안정을 꾀하는 생균제 급여는 면역 시스템의 안정화에도 유용하다. Bacillus mesentericus, Clostridium butyricum 및 Enterococcus faecalis의 혼합 생균액을 말초혈 단핵구에 자극한 실험에서는 배양액 중의 IFN-γ와 IL-10 생산이 촉진되고 TNF-α가 저하한다고 보고되어 있다⁵⁾. 또한 이 3종 세균의 혼합제를 출생 후 경구 급여를 계속한 송아지에게 출생 2개월 이내에 백신을 접종한 경우 항체가가 상승하기 쉽다는 것도 밝혀져 있다. 이로부터 이들 생균제의 성분 자체가 면역세포에 직접 작용하여 세포성 또는 체액성 면역을 높이는 것으로 생각된다. 나아가 송아지에게 Lactobacillus plantarum, E. faecium, C. butyricum의 혼합 생균제를 급여하면 말초혈 T세포 수가 상승하고, 단핵구의 IL-6, IFN-γ 및 TNF-α 유전자 발현량이 상승하는 것도 밝혀져 있다⁶⁾. C. butyricum MIYAIRI는 항균약에 대한 내성이 강하고, 항균약 투여에 의한 의원성 설사증의 개선 효과가 있어 장내세균총을 정상화시키므로⁷⁾, 폐렴이나 제대염 등 항균약을 투여해야만 하는 송아지의 감염증에 대한 생균제 병용은 장내세균총의 안정화에 유용한 효과를 가져올지도 모른다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">흑모화종 송아지와 홀스타인 송아지의 면역 시스템 차이</div>
<p class="bx-num"><span class="bxn" data-n="396">•</span><span>흑모화종의 초유 중 Ig 농도는 홀스타인에 비해 높고, 초유 섭취 후 흑모화종 송아지의 혈중 Ig 농도도 높다. 면역세포 변화의 지표가 되는 흑모화종 송아지의 CD4⁺나 CD8⁺ 같은 림프구 집단은 림프구 내 비율로서는 흑모화종과 홀스타인의 비교에서 큰 차이가 없다고 한다⁸⁾. 그러나 말초혈 중의 실수(% 데이터와 수/μL 데이터)로서는 신생자기와 마찬가지로 흑모화종 송아지의 γδT세포 수나 IgM⁺CD21⁺B세포 수가 홀스타인 송아지에 비해 적다(그림 3-5-8). 나아가 흑모화종 송아지의 말초혈 γδT세포의 CD25 항원 양성률 및 마이토젠 자극 후의 IL-2 유전자 발현량이 홀스타인 송아지에 비해 낮다. IL-2는 림프구의 분열을 촉진하는 사이토카인이며, IL-2의 수용체로 여겨지는 CD25는 활성화된 T세포 표면에 발현하는 수용체인데, 송아지 T세포의 CD25 발현율은 성우에 비해 낮다⁹⁾. 또한 출생 후 3개월 이내의 송아지에서 말초혈 γδT세포의 마이토젠 자극 후 CD25 항원 양성률은 50~70%로, 20~50%인 αβT세포에 비해 보유율이 높다. 또한 흑모화종 송아지의 말초혈 γδT세포는 홀스타인 송아지에 비해 마이토젠 자극 후의 IFN-γ나 IL-4 등 T세포계 사이토카인의 생산능이 낮다²⁾. 이러한 점에서 흑모화종 송아지에서는 γδT세포 등 림프구의 기능이 홀스타인 송아지에 비해 떨어지는 것으로 의심된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="397">•</span><span><i>그림 3-5-8 흑모화종 송아지와 홀스타인 송아지의 말초 림프구 수 실수 비교(/μL, 주령 0~1, 1~2, 2~4, 4~6, 6~8, 8~10, 10~). CD3⁺TcR⁺: 홀스타인 약 1,500~1,900 vs. 흑모화종 약 900~1,250으로 전 주령에서 흑모화종이 낮음. B⁺IgM⁺: 0~1주령 홀스타인 약 200 vs. 흑모화종 약 100, 이후 양군 모두 증가하여 8~10주령 홀스타인 약 1,150 vs. 흑모화종 약 800</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">분만 전 어미소의 건강과 신생 송아지의 면역</div>
<p class="bx-num"><span class="bxn" data-n="398">•</span><span>분만 전 어미소의 스트레스나 영양 상태는 신생 송아지의 면역 상태에 크게 영향을 미친다. 어미소의 분만 전 서열(暑熱) 스트레스는 신생 송아지의 초유 중 Ig 흡수율 저하를 초래하여 지속적인 혈중 Ig 저하를 이끄는 동시에, 림프구의 마이토젠 활성 저하가 보인다고 보고되어 있다¹⁰⁾. 또한 분만 전 어미소의 급여 사료 충족률을 충족하지 못한 조건에서 분만된 송아지에서는 말초혈 림프구 수가 낮은 값이라는 것도 알려져 있다¹¹⁾. 태자기 말기에는 송아지의 성장에서 아미노산 요구량이 높아지므로, 아미노산을 중심으로 한 영양 부족은 태자기 면역세포의 증가를 억제할 가능성이 있다. 이에 비해 어미소의 급여 사료를 충족시킴으로써 신생 송아지의 말초혈 T세포 수나 B세포 수가 높아지고 지속적으로 증가하며 추이함이 밝혀져 있다¹²⁾. 앞서 말했듯이 면역 시스템의 성장은 태자기부터 이루어지므로, 이를 저해하는 어떤 부정적 요인이 신생자기 송아지의 면역 시스템 발달을 억제할 가능성이 있다. 출생 시 송아지의 체중과 말초혈 T세포 수에는 양의 상관성이 인정되므로, 저체중 송아지에서는 획득면역 기능에 어떤 문제가 있다고 생각되며²⁾, 신생 송아지의 높은 면역 기능을 얻기 위해서는 건강하게 출생할 수 있도록 분만 전 어미소의 사양관리에 눈을 돌릴 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">송아지의 면역 기능 저하</div>
<p class="bx-num"><span class="bxn" data-n="399">•</span><span>유령기 동물은 생리적으로 면역계 요소가 충분히 기능하지 않기 때문에 면역 방어능이 저하되어 있다. 더해서 스트레스 등 면역 기능을 억제하는 요인이 영향을 미치면 송아지는 면역 기능 부전에 이르기 쉽다. 생물에서의 스트레스란 어떤 자극에 의해 생체에 생긴 왜곡 상태를 말하며, 스트레스로 무너진 생체 균형에서 회복하려는 반응을 스트레스 반응이라 한다. 스트레스에 의해 분비되는 부신피질호르몬은 NK세포 활성, 림프구 증식반응이나 호중구의 기능 저하 같은 면역 기능 저하를 가져오고 골수로부터 호중구의 동원이 촉진되는데, 이들 모두는 면역적인 스트레스 반응이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="400">•</span><span>포유·육성기 송아지에게는 많은 스트레스 요인이 있어 면역 기능 저하와 면역 시스템 성숙을 억제한다. 그중에서도 한랭, 서열이나 일교차 등 기온이나 습도 같은 기후·계절 요소에 영향을 받기 쉬우며, 우사 내 분뇨에서 생기는 암모니아나 황화수소 등 화학물질에의 노출, 다량의 세균이나 바이러스 등 생물의 침입도 스트레스를 초래하는 요인으로 꼽힌다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="401">•</span><span><i>그림 3-5-9 영양 부족 상태의 흑모화종 송아지에서 말초혈 림프구 수(총 T림프구와 B림프구) 변화. 사료 충족률(일본사양표준 2000년판 기준 %): 2주령(25 kg) TDN 부족군 96.0 / 충족군 120.0, CP 부족군 93.8 / 충족군 117.2; 8주령(70 kg) TDN 96.9 / 121.7, CP 90.5 / 110.2. 임상적으로 이상 없는 흑모화종 송아지, 부족군 n=5, 충족군 n=5, 평균±표준오차. CD3⁺T세포 수(×10²/μL): 부족군 1·2·3개월령 약 29·37·30, 충족군 약 23·28·26. MHC class-II⁺B세포 수(×10²/μL): 부족군 약 20·34·42, 충족군 약 12·23·30</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="402">•</span><span><i>그림 3-5-10 설사증 발증 송아지의 3일령 시 말초 림프구 수(총 T림프구와 B림프구)(좌) 및 혈청 필수아미노산 농도와 말초혈 CD21⁺B세포 수의 관계(우). 좌: 대조군(n=25) CD3⁺T세포 약 1,820/μL, CD21⁺B세포 약 190(a); 설사 발증군(n=17) CD3⁺T세포 약 1,500, CD21⁺B세포 약 130(b); 이부호 간 유의차(P<0.05), 평균±표준오차. 우: CD21⁺B세포 수(0~600 cell/μL)와 필수아미노산(약 700~2,700 nmol/mL) 사이 양의 상관(R=0.52, P<0.01)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="403">•</span><span>환경 스트레스에 더해 출생 시부터의 송아지 영양 상태는 설사증이나 면역 시스템 성숙에도 영향을 미치는 요인이다. 영양불량은 송아지 면역부전의 원인 중 하나로 꼽힌다. 동물은 충분한 영양소를 섭취하지 못하면 흉선, 림프절, 편도, 비장 등 면역조직의 위축, 말초혈 림프구 수의 감소 등이 보이고 세포성 면역 기능이 저하되는 것으로 생각된다. 영양불량에서는 장관 점막의 상피세포층이 취약해지는 동시에 면역 기능도 저하되므로 빈번히 장관 감염을 일으키게 된다. 그림 3-5-9에 나타내듯이 포유기에 사료 부족에 의한 영양불량에 있던 송아지에서는 말초혈 CD3⁺T세포 수나 MHC class-II⁺B세포 수가 낮은 값으로 추이한다. 또한 영양 부족의 사육관리를 한 송아지에서는 CD4⁺T세포나 CD8⁺T세포의 마이토젠 자극 후 CD25 양성률 저하도 관찰된다¹³⁾. 그중에서도 단백질 충족은 설사나 폐렴 등의 질병을 감소시킨다고 시사되어 있다¹⁴⁾. 유령기에 T세포의 성숙을 촉진하는 흉선은 설사 등의 질병이나 영양 부족에 의해 발달불량이나 강한 위축을 초래하여 면역부전을 일으키고, 그 후의 감염성이 높아진다. 이러한 스트레스 하에서는 송아지의 면역 성숙이 정체되어 면역 시스템의 성장이 나빠진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="404">•</span><span>그림 3-5-10에는 출생 3일령의 말초혈 백혈구 수와 이후 설사증 발생의 관계, 그리고 혈청 아미노산 농도와 말초혈 CD21⁺B세포 수의 관계를 나타냈다. 설사증을 발증하는 송아지에서는 발증 전인 3일령 시점에 T세포 및 B세포 수가 낮은 값이며, 이 경우 영양소로서는 혈청 총아미노산 농도와 양의 상관성이 얻어지고 있다. 항체생산세포인 B세포가 출생 후부터 낮은 값에 있는 경우 신생 송아지의 체액성 면역응답에도 어떤 영향이 있는 것으로 생각된다. 또한 초유 중에는 아미노산이 포함되어 있어 초유를 통해 아미노산을 흡수함이 시사되므로, 송아지의 아미노산 확보는 포유기에 이르기 전부터 아미노산을 섭취하는 것이 성장에 기여하는 것으로 생각된다. 더해서 조기 이유한 홀스타인 송아지에게 알라닐글루타민을 급여하면 말초혈 CD4⁺T세포가 증가한다고 보고되어 있어¹⁵⁾, 송아지의 면역 저항성을 높이는 영양관리에서 아미노산 제제 투여에 대해서는 향후 연구가 기대된다. 영양 부족에서 일어나는 감염이 설사를 일으키고, 그것이 다시 영양불량을 악화시키는 악순환에 빠지는 것으로 생각된다. 더해서 영양소인 철, 구리, 아연, 셀레늄 등의 미네랄이나 비타민류 등의 결핍에 의해서도 면역응답은 감퇴한다고 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="405">•</span><span>반추동물인 소에게 이유는 섭취 칼로리가 저하하는 것에 더해 강한 스트레스가 부하됨으로써 호중구의 탐식능이나 살균능이 저하한다고 보고되어 있어¹⁶⁾ 감염증의 위험이 높아진다. 이유에서는 포유를 중지하는 시기에 맞추어 군사(群飼)로의 변경, 새로운 시설로의 이동, 수송, 때로는 제각이나 거세 등 스트레스가 중복되는 일도 많아 감염증 위험이 높아진다. 이유 시기는 포유 방법이나 품종에 따라서도 다양하지만, 제1위 기능이 미숙한 채로 이유하면 제1위에서의 VFA 생산 부족이 일어나므로 영양실조에 이르고, 많은 경우 감염되기 쉬운 상태가 된다. 이유 전후에 저영양 상태에 있는 송아지나 우군 전체가 저영양의 사육관리에 있는 경우에 많이 보이는 것은 기관지폐렴이다. 그 때문에 송아지의 이유에 즈음해서는 필요한 칼로리의 확보를 가능하게 하도록 제1위가 발달하게끔 사양관리에 주의할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="406">•</span><span><span style="color:var(--ink-soft)">(저자: 大塚浩通)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="407">•</span><span><span style="color:var(--ink-soft)">일본송아지 3-5 송아지의 생체방어능 발달과 특징.</span></span></p>

<div class="rb-boxes">
