<p class="bx-num"><span class="bxn" data-n="149">•</span><span><b>대용유의 종류</b> — 지방 함량 기준으로 3종(표 3-1-2).</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>표준: 일본 여러 사료회사의 표준품. 미국 관행 대용유(단백질 20~22%, 지방 20%²⁻⁵⁾)보다 단백질이 높게 설정. 제한 포유용이지만 일정 수준까지 포유량 증량도 가능.</span></p>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>저지방: 지방이 낮고 단백질이 높다. 고단백 대용유(단백질 26%, 지방 18%)는 공체중의 질소 축적을 현저히 높이고⁶⁾, 단백질·지방 모두 높이면(28%/28%) 질소와 지방 축적이 함께 증가한다. Hill 등은 ME 1 kcal당 CP 51.6~56.7 g, CP 27%·지방 17%를 최적으로 결론지었다³˒⁷˒⁸⁾. 대용유 중 에너지 함량이 가장 낮으므로 성분뿐 아니라 포유량을 높여야 하며, 포유기 발육 촉진형 포유법에 적합하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>고지방: 단백질은 표준과 비슷하고 지방이 높으며, 둘 다 24~25%. 에너지가 높아 홀스타인보다 섭취량이 적은 흑모화종이나 한랭기 유지요구량이 높은 시기에 적합하다. 지방 과다 섭취는 체지방 축적 증가⁹⁾, 스타터 섭취 저하¹⁰⁾를 초래하므로 포유량을 제한해 쓰는 것이 바람직하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기의 사료: 스타터</div>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>스타터는 대두박·압편 옥수수·대맥 등 원료만 혼합한 것(타입 I), 전부 분쇄·성형한 펠릿(타입 II), 원료와 펠릿을 혼합한 것(타입 III)이 있다. 큰 사료 조각을 포함하는 I·III은 텍스처 타입이라 부른다. 일본은 주요 영양소는 원료에서, 비타민·미네랄은 펠릿에서 얻도록 한 타입 III이 주류다. 어느 타입이든 이발효성 탄수화물이 많아 건초와 달리 제1위(루멘)에서 빠르게 발효되고 다량의 VFA가 반추위 상피와 융모 발달을 자극한다. 제1위 미발달기에도 제4위에서 소화 가능한 성분을 포함하므로 액상에서 고형 사료로의 전환에 적합하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">건초 급여의 시비</div>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>초기 연구: 건초 등 물리적 자극이 제1위 근층 발달에 유효¹¹⁾, 스타터 단독 급여는 제1위액 pH 이상 저하로 파라케라토시스 원인¹²⁾, 스타터+건초 병급이 융모 발달에 양호¹³⁾ → 포유기 건초 급여가 공통 인식.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>1990년대: 제1위 미발달기에 장건초를 급여해도 스타터만큼 VFA가 나오지 않고 셀룰로오스 소화 제한으로 스타터 섭취가 저하¹⁴⁾ → 영양 관점에서 이유까지 급여 불필요¹⁵˒¹⁶⁾. NRC는 건초를 주지 말고 물리적 효과가 있는 텍스처 타입 스타터만 급여하도록 권장¹⁶⁾. 이후 제1위 발달·영양·행동 측면에서 논의 지속.</span></p>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>타입 III 스타터만 급여한 송아지에서 깔짚 다량 섭취 등 이상행동과 제1위 발달 장애를 시사하는 이상(그림 3-1-1)이 관찰되었다. 같은 양의 스타터를 먹어도 건초 병급 쪽이 증체가 높은 경향(그림 3-1-2). 섭취량은 건초 형상뿐 아니라 급여량 과다·과소 모두에서 저하하며, 스타터 섭취를 최대로 하는 건초 섭취량은 세단 건초 40~50 g/일로 추정(그림 3-1-3).</span></p>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>최근 재검토: 포유량 제한·다급과 무관하게 세단 건초 30~100 g/일 섭취로 제1위액 pH 저하 억제¹⁰˒¹⁷⁾, pH 상승과 섭취량 향상¹⁸˒¹⁹⁾, 반추위 중량 증가²⁰⁾, 벽 핥기·혀 놀림·깔짚 섭취 등 이상행동 감소¹⁸˒²¹⁾ 보고. 이는 텍스처 타입의 정의가 모호하고 물리적 효과 원료 비율이 명시되지 않았기 때문¹⁶⁾. Kertz 등은 펠릿 포함 텍스처 스타터의 이용효율·섭취량 개선에 사료 전체의 최대 5% 정도 섬유질 조사료가 필요하다고 한다²²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>다만 포유기 제1위액 pH는 낮아 섬유분해균 증식이 어려우므로 건초에서의 영양 흡수는 기대할 수 없고, 반추로 사료편을 미세화해 하부 소화관으로 내보내야 한다. 거칠고 긴 섬유는 제1위 내 장기 체류·점막 손상으로 식체·제1위염 위험을 높이므로, 양뿐 아니라 세단한 부드러운 2번초 등 영양보다 물리성을 중시한 섬유질 사료가 바람직하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="159">•</span><span><i>그림 3-1-1 스타터만 급여한 송아지에서 본 제1위벽의 스타터 부착(좌)과 모구(우). 원도: 上田和夫</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="160">•</span><span><i>그림 3-1-2 건초 급여 유무에 따른 스타터 섭취량과 체중 증가량의 관계 — 포유기간(42일) 총 스타터 섭취량(kg, 10~30) 대 체중 증가량(kg). 스타터+건초 R²=0.9686, 스타터만 R²=0.6824; 깔짚 섭취 개체 표시</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="161">•</span><span><i>그림 3-1-3 포유기간 중 건초 섭취량과 스타터 섭취량의 관계 — y = −0.0869x² + 6.1277x + 428.78, R²=0.4446 (x: 일평균 건초 섭취량 g/일, y: 일평균 스타터 섭취량 g)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 방법과 포유 프로그램 1 ~제한 포유법과 강화 포유법의 특징과 연구 방향~</div>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>제한 포유법: 포유량을 출생체중의 10% 정도(4~5 L/일)로 제한해 건초·스타터 섭취를 앞당겨 제1위를 발달시키고, 일정량 스타터 섭취 시점에 조기 이유. 1940~1960년대 제1위 연구가 기초이며 6주령 이유가 기본. 포유기간 단축, 1일 2회 급여로 생력화, 이유 후 고형 사료 섭취 순조로 발육 양호가 장점이며 일본사양표준²³⁾도 권장. 단점은 포유기 일당증체량(DG)이 낮음.</span></p>
<p class="bx-num"><span class="bxn" data-n="163">•</span><span>강화 포유법: 전유 또는 고단백·저지방 대용유로 포유 섭취량을 높이는 방법. 1997년 이후 성장을 위한 에너지·단백질 요구량²⁴⁾, 대용유 성분과 체조성⁹⁾, 포유량과 체중 증가²⁵˒²⁶⁾ 연구가 기반. 초기에는 "만복 포유법"이라 하여 자유 섭취가 조건. 포유기 발육 향상에는 효과적이나 스타터 섭취가 억제되어 같은 포유기간이면 이유 후 성장이 느리다. 단점: 충분한 스타터 섭취까지 포유기간 연장 필요, 노동 부담 증가, 자동포유기 사용 시 포유우군 회전 지연이 율속 단계가 됨. 최근 검토에서 대용유량은 870²⁷⁾~1,200 g/일²⁸⁾로 폭이 있고, 다수는 900 g/일 정도, 전유는 출생체중의 20%(약 8 L/일)로 제한.</span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>포유기간 단축 프로그램: 전유 8 L/일을 25일령까지 → 4일간 25% 감량(6 L/일) → 45일령까지 → 4일간 감량하며 약 7주령 이유하는 2 Step down법²⁹⁾; 전유 12 L/일을 10일간 점감하여 6주령 이유하는 점감법³⁰⁾ 등.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>포유기 발육 촉진과 장래 유생산: 초산 유량 증가 보고³¹˒³²⁾와 차이 없음 보고³³˒³⁴⁾가 혼재. 최근에는 특히 포유 전기 영양 상태(=포유량)와 장래 생산성·대사 임프린팅 관계 연구 진행³⁵⁻³⁷⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>결론적으로 초기 강화 포유는 제한 포유와 전혀 다른 방식으로 여겨졌으나, "(특히 포유 전기에) 포유량을 높인 제한 포유에 의한 포유기간 단축" 방향으로 수렴 중.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 방법과 포유 프로그램 2 ~표준적인 조기 이유법의 장점과 개선점~</div>
<p class="bx-num"><span class="bxn" data-n="167">•</span><span>포유량을 높이더라도 제한하여 기간을 단축하는 방향이라면, 관행 제한 포유의 장점과 개선점(포유기 성장 억제 원인) 검토도 필요하다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="168">•</span><span><b>대용유의 포유량과 농도</b></span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>대용유 프로그램은 포유량만으로 부족하고 농도를 함께 설정해야 한다. 영양은 대용유뿐이고 희석수는 영양이 아니기 때문. 예: 100 g/L × 6 L/일과 150 g/L × 4 L/일은 포유량은 다르나 1일 영양 섭취량은 같다.</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>농도 상한에도 유의. 관행 농도 125 g/L는 전유 총고형분 약 12.5%에서 유래. 송아지 열적 중성권은 범위가 좁고 온도가 높다. 3주령 전후 송아지는 환경온도가 낮아지면 유지요구량이 증가한다. 125 g/L로 4~5 L 제한 포유 시 대용유 500~625 g/일인데, 표준 대용유라면 환경온도 0~5℃에서 거의 유지량에 불과하다(표 3-1-3).</span></p>
<p class="bx-num"><span class="bxn" data-n="171">•</span><span>농도 증가나 1회 급여량 증가로 에너지를 늘리면 소화관 내 삼투압 상승으로 영양 흡수에 영향, 질병 위험 증가. 소화율·통과속도·분변 점수와 삼투압³⁸⁾, 대용유 농도·1회 급여량과 삼투압³⁹⁾ 연구로부터 약 500 mOsm/L까지 허용되며, 이때 농도 150 g/L, 1회 최대 3 L 급여 가능. 단, 고에너지 대용유는 제4위 배출능을 저하시켜 질병 위험을 높이므로⁴⁰⁾ 150 g/L보다 낮게 수정해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="172">•</span><span>표 3-1-3 유지에 필요한 대용유량(출생~3주령), DM g/일.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>출생체중(kg)</th><th>항목</th><th>20℃</th><th>15℃</th><th>10℃</th><th>5℃</th><th>0℃</th><th>−5℃</th></tr><tr><th>40</th><td style="text-align:left">증가분</td><td style="text-align:left">0</td><td style="text-align:left">44</td><td style="text-align:left">88</td><td style="text-align:left">132</td><td style="text-align:left">177</td><td style="text-align:left">221</td></tr><tr><th>40</th><td style="text-align:left">열적 중성권</td><td style="text-align:left">329</td><td style="text-align:left">329</td><td style="text-align:left">329</td><td style="text-align:left">329</td><td style="text-align:left">329</td><td style="text-align:left">329</td></tr><tr><th>40</th><td style="text-align:left">합계</td><td style="text-align:left">329</td><td style="text-align:left">373</td><td style="text-align:left">417</td><td style="text-align:left"><b>461</b></td><td style="text-align:left"><b>505</b></td><td style="text-align:left">549</td></tr><tr><th>45</th><td style="text-align:left">증가분</td><td style="text-align:left">0</td><td style="text-align:left">48</td><td style="text-align:left">96</td><td style="text-align:left">145</td><td style="text-align:left">193</td><td style="text-align:left">241</td></tr><tr><th>45</th><td style="text-align:left">열적 중성권</td><td style="text-align:left">359</td><td style="text-align:left">359</td><td style="text-align:left">359</td><td style="text-align:left">359</td><td style="text-align:left">359</td><td style="text-align:left">359</td></tr><tr><th>45</th><td style="text-align:left">합계</td><td style="text-align:left">359</td><td style="text-align:left">407</td><td style="text-align:left">455</td><td style="text-align:left"><b>504</b></td><td style="text-align:left"><b>552</b></td><td style="text-align:left">600</td></tr><tr><th>50</th><td style="text-align:left">증가분</td><td style="text-align:left">0</td><td style="text-align:left">52</td><td style="text-align:left">104</td><td style="text-align:left">157</td><td style="text-align:left">209</td><td style="text-align:left">261</td></tr><tr><th>50</th><td style="text-align:left">열적 중성권</td><td style="text-align:left">388</td><td style="text-align:left">388</td><td style="text-align:left">388</td><td style="text-align:left">388</td><td style="text-align:left">388</td><td style="text-align:left">388</td></tr><tr><th>50</th><td style="text-align:left">합계</td><td style="text-align:left">388</td><td style="text-align:left">441</td><td style="text-align:left">493</td><td style="text-align:left"><b>545</b></td><td style="text-align:left"><b>597</b></td><td style="text-align:left">649</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="173">•</span><span>※ 주) 대용유 성분: 단백질 24%, 지방 20%, TDN 107%로 시산</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="174">•</span><span><b>대용유 및 건초 섭취량과 음수량</b></span></p>
<p class="bx-num"><span class="bxn" data-n="175">•</span><span>일본사양표준(2017)³⁷⁾ 준거 방법으로 표준 대용유(단백질 24%, 지방 20%) 600 g을 150 g/L로 희석, 아침·저녁 2 L씩 1일 2회(체중의 10%) 정량을 홀스타인 송아지에 6주간 급여했을 때의 스타터·건초 섭취량과 음수량 추이가 그림 3-1-4(초유 급여 후 스타터·건초·고형염·물 자유 접근). 요점 3가지:</span></p>
<p class="bx-num"><span class="bxn" data-n="176">•</span><span>1. 1일 4 L 제한 포유에도 포유 전기 스타터 섭취량은 극히 적다. 제한 포유는 섭취 가능량보다 낮게 설정하여 조기 스타터 증가를 기대했고, 실제 섭취 개시는 빠르며 초기 제1위 발달의 VFA 기질로는 소량도 유효하다. 그러나 영양 면에서는 21일령에도 300 g/일 정도에 불과하고, 총 ME 섭취(대용유+스타터) 중 스타터 유래 ME는 25% 정도, 3주령 미만은 더 적다. 즉 3주령 정도까지는 영양원을 거의 대용유에만 의존하는 "액상 사료기"⁵⁾이며, 이 시기 대용유 제한이 성장을 억제함이 분명하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>2. 이유 대비 포유량을 줄이지 않아도 스타터 섭취는 증가한다. 요인 ① 제1위 발달: 고형 사료 섭취로 시작되는 VFA 산생 → 융모 신장 → 제1위 상피의 대사·흡수능 획득 단계를 거쳐야 하며 일정 기간이 필요⁴¹⁾. 이 흡수능 획득이 3주령 전후이고 그 결과 스타터 섭취가 증가. ② 상대적 포유량 점감 효과: 출생 시와 이유 시 체중차는 최소 20 kg 정도이므로 포유량 고정은 체중 비율로 보면 점감과 같다.</span></p>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>3. 스타터 섭취 증가에 따라 건초 섭취와 음수량이 증가한다. 정상 제1위 기능에 중요. 액상 사료와 달리 음수는 상당 비율이 제1위로 들어가 미생물의 스타터 분해 환경을 만든다. 제1위 발효에 필요한 수분은 액상 사료에서 전혀 공급되지 않으므로 물 부족 시 스타터 섭취 증가가 억제된다. 스타터를 거의 안 먹는 시기에도 약간의 음수가 있고, 환경온도에 따라 요구량이 변하므로 포유기에도 자유 음수 환경이 필요. 건초는 반추로 타액을 유입시켜 산성으로 기운 제1위액 pH를 중성 쪽으로 돌려 섬유 분해 정착 환경을 만들고, 물리적으로 융모 간 유착을 억제한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="179">•</span><span>개체 관리에서는 군 관리처럼 다른 소에게서 학습할 기회가 없어 스타터나 건초 한쪽에 치우친 섭취가 생길 수 있으므로 관리자의 순치·양 제한 등 배려가 필요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="180">•</span><span><i>그림 3-1-4 제한 포유 송아지(4 L/일)의 스타터·건초 섭취량(상)과 음수량(하) — 3~39일령. 스타터 섭취 약 21일령부터 급증하여 39일령 약 1,500 DMg/일, 건초 약 100 DMg/일; 음수량은 100~300 g/일에서 후반 500~700 g/일로 증가</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="181">•</span><span><b>체중을 기준으로 한 포유량 설정</b></span></p>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>어느 농장이나 출생체중 편차가 있으나 포유량은 대개 일률적이다. 체중이 다르면 유지·증체 요구량도 다르고 증체에 차가 난다. 그림 3-1-5는 동일 포유량 사육 시 4일령 체중 대 21일령 체중을 보여주며, 이 포유량에서는 출생체중 45 kg을 넘으면 이 기간 체중이 거의 늘지 않는다. 출생체중을 최소 2구분으로 나눠 포유량을 설정하면 동일 증체가 기대된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="183">•</span><span><i>그림 3-1-5 동일 포유량으로 사육한 출생체중이 다른 송아지의 4일령 및 21일령 체중의 관계 — R²=0.3701; 4일령 체중 28~50 kg 범위, 21일령 체중 40~53 kg</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 방법과 포유 프로그램 3 ~수정판: 포유량을 높인 제한 포유에 의한 조기 이유 시도~</div>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span>위 문제점을 개선해 표준 조기 이유법과 비교한 시험.</span></p>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>공시우: 홀스타인 송아지 90두(암 66, 수 24). 계절·성별·체중 편중 없이 2군 배치.</span></p>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>시설: 군사, 자동포유기(포유 로봇)에 의한 다회 포유.</span></p>
<p class="bx-num"><span class="bxn" data-n="187">•</span><span>포유량: 표준 대용유(단백질 24%, 지방 20%), 농도 150 g/L 고정, 1회 최대 2 L. 포유기간 6주, 이유까지 증감 없이 일정.</span></p>
<p class="bx-num"><span class="bxn" data-n="188">•</span><span>　· 표준구: 체중 38~44 kg 600 g/일(4.0 L/일), 45~52 kg 675 g/일(4.5 L/일)</span></p>
<p class="bx-num"><span class="bxn" data-n="189">•</span><span>　· 다급구: 체중 38~44 kg 900 g/일(6.0 L/일), 45~52 kg 1,050 g/일(7.0 L/일)</span></p>
<p class="bx-num"><span class="bxn" data-n="190">•</span><span>기타: 스타터·건초·고형염·물 자유 섭취. 스타터 섭취량은 계량기 부착 사조로 개체별 매일 기록.</span></p>
<p class="bx-num"><span class="bxn" data-n="191">•</span><span>결과와 고찰:</span></p>
<p class="bx-num"><span class="bxn" data-n="192">•</span><span>양 구 모두 거의 설정량을 섭취 → 포유 전기에도 150 g/L로 6~7 L/일 섭취는 충분히 가능.</span></p>
<p class="bx-num"><span class="bxn" data-n="193">•</span><span>포유량을 높이면 스타터 섭취가 저하했으나 21일령 미만보다 그 이후의 차가 컸다(그림 3-1-6). 혈청 BHBA는 스타터 섭취와 같은 추이를 보여 제1위 발효 유래 낙산으로 판단되며, 포유량을 일정하게 하면 그 양과 무관하게 21일령 정도부터 스타터가 영양원으로 기여한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="194">•</span><span>가령에 따른 체중 증가로 체중 대비 포유량 비율이 작아지므로(그림 3-1-7) 포유량 점감과 같은 효과로 스타터 섭취 의욕이 항진되었을 가능성이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>표준 대용유로도 포유량 증가로 체중뿐 아니라 체고 증가량도 커졌다(그림 3-1-8). 이 대용유는 일본에서 표준 성분이나 구미 표준보다 단백질이 높은 점이 이런 효과를 낸 것으로 본다. 체격 차는 거의 21일령까지 형성되고 이후 유지되었으므로 포유 전기 영양 수준이 성장량 차를 결정한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="196">•</span><span>이상은 제시된 조건의 결과이며, 성분이 다른 대용유로 가령에 따라 포유량을 증가·점감하는 프로그램은 스타터 섭취 패턴이 다를 수 있어 별도 검토가 필요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="197">•</span><span><i>그림 3-1-6 송아지의 스타터 섭취량 및 혈청 β-히드록시낙산(BHBA) 농도 추이 — 3~56일령, 42일령 이유. 스타터: 21일령 다급 약 100 vs 표준 약 300 FMg/일, 42일령 약 1,200 vs 1,550, 56일령 약 2,500~2,600; BHBA는 7~14일령 약 50 µmol/L에서 56일령 약 400 µmol/L</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="198">•</span><span><i>그림 3-1-7 가령에 따른 송아지 체중 대비 포유 섭취량 비율 추이 — 1~6주령, 다급 9.3→10.7→10.4→9.7→8.9→8.2%, 표준 8.3→9.0→8.7→8.1→7.5→6.8%. 체중이 늘므로 포유량 고정 시 비율이 점감한다</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="199">•</span><span><i>그림 3-1-8 대용유 급여량에 따른 체중(좌) 및 체고(우) 추이 — 다급(n=47)·표준(n=43). 체중: 3일령 약 45 kg → 42일령 약 71 vs 66 kg → 56일령 약 86 vs 81 kg. 체고: 3일령 약 78.5 vs 79.5 cm → 42일령 약 87 vs 85.5 cm → 56일령 약 90 vs 89 cm</i></span></p>
<p class="bx-num"><span class="bxn" data-n="200">•</span><span><span style="color:var(--ink-soft)">(저자: 大坂郁夫)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육용우(흑모화종)</div>
<p class="bx-num"><span class="bxn" data-n="201">•</span><span>육용우 중 흑모화종 송아지에 관해 기술한다. 흑모화종은 자연 포유가 통상이며 어미소의 비유능력에 크게 의존한다. 비유량은 산차·체중·분만 전후 영양수준·송아지 성별 등의 영향을 상호 받으며 송아지 발육에 크게 관여한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">송아지 발육에 영향을 미치는 유전과 환경의 효과</div>
<p class="bx-num"><span class="bxn" data-n="202">•</span><span>모성효과는 환경 요인의 하나로 자리매김되나⁴²⁾, 실제로는 유전적 부분(상가적 모성 유전효과, 세포질 유전효과)과 환경적 부분(영속적 모성 환경효과, 일시적 모성 환경효과)으로 나뉜다.</span></p>
<p class="bx-num"><span class="bxn" data-n="203">•</span><span>상가적 모성 유전효과: 주로 어미소 비유능력 차로 송아지 발육에 미치는 효과. 어미 유량은 송아지 초기 발육을 거의 결정할 정도이며, 역으로 송아지 발육에서 어미 비유능력을 추정할 수 있다. 비유 관련 유전자는 어미에게서 1/2 물려받아 암송아지는 한 세대 뒤에 발휘하고, 수소(아비)도 관련 유전자를 가지므로 한 세대 더 건너 추정 대상이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="204">•</span><span>세포질 유전효과: 난자 세포질 미토콘드리아 DNA에 기인하므로 전부 어미에서 자식으로 유전. 통상 상가적 모성 유전효과보다 작다.</span></p>
<p class="bx-num"><span class="bxn" data-n="205">•</span><span>영속적 모성 환경효과: 출생 전 태아기 영향(자궁 용량 등 어미 체격, 자궁각 내 착상 위치)과 출생 후 영향(어미의 모성행동 등).</span></p>
<p class="bx-num"><span class="bxn" data-n="206">•</span><span>일시적 모성 환경효과: 산차 등에 따른 특유 효과. 특정 산차에 한해 어미 영양상태 불량 등으로 비유량이 저하해 발육에 영향; 통상 오차에 포함.</span></p>
<p class="bx-num"><span class="bxn" data-n="207">•</span><span>송아지 발육은 유전과 환경(영양·관리)의 균형으로 성립하므로 종합 해석이 필요하나, 포유기는 영양이 모유에 한정되므로 포유, 이유, 고형 사료(별사육 사료) 급여라는 한정 항목으로 파악할 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">어미소 산차가 비유량에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="208">•</span><span>비유량의 최대 요인은 산차. Shimada 등은 35두·연 74비유기를 송아지 체중차법으로 조사⁴³⁾(그림 3-1-9). 흑모화종은 유용우 같은 비유 피크가 없고 분만 직후부터 직선적으로 감소. 초산차와 8~9산차 어미는 비유량이 적었고, 이들 산차 송아지의 발육은 다른 산차보다 떨어졌다(그림 3-1-10).</span></p>
<p class="bx-num"><span class="bxn" data-n="209">•</span><span>송아지는 스스로 사료를 먹을 수 있을 때까지 영양원 대부분을 모유에 의존. Shimada 등은 주령별 어미 비유량과 송아지 DG 관계에서 1~11주령까지 상관계수 0.5 이상의 유의한 상관을 보고하며 모유 의존도가 높다고 했고, 이후 고형 사료 섭취 급증으로 의존도가 급감⁴³⁾. 따라서 3개월령 전후까지의 어미 비유량이 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="210">•</span><span><i>그림 3-1-9 흑모화종의 산차별 비유 곡선(문헌 43 인용·개변) — 1일 유량(kg) 대 주령(0~26). 2산~7산차 분만 직후 약 5.5~6.2 kg/일에서 26주 약 3.5~3.8 kg/일로 직선 감소; 초산차 약 4.3 → 2.7 kg/일, 8~9산차 약 5.0 → 3.0 kg/일</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="211">•</span><span><i>그림 3-1-10 흑모화종 송아지의 일당증체량 추이(문헌 43 인용·개변) — 주령 0~26. 초산차·8~9산차 송아지 DG는 2~10주령 약 0.5~0.6 kg으로 타 산차(0.6~0.8 kg)보다 낮고, 20주 이후 타 산차 약 1.0 kg vs 초산차 약 0.8 kg</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기 흑모화종의 표준 발육에 필요한 포유량</div>
<p class="bx-num"><span class="bxn" data-n="212">•</span><span>흑모화종 정상 발육 곡선은 전국화우등록협회 공표⁴⁴⁾. 다만 자연 포유 하에서 고형 사료를 늘려가는 형태이고 어미 유량 개체차가 커 균일성이 낮다.</span></p>
<p class="bx-num"><span class="bxn" data-n="213">•</span><span>기본적으로 생후 8주령 이후는 모유만으로 충분한 영양 섭취가 불가능해 고형 사료 채식이 필요. 자연 포유는 어린 시기 고형 사료 채식을 억제하므로 채식 촉진을 위한 책넘김 포유(柵越哺乳)나 제한 포유가 실시된다. 방목에서는 환경 급변 스트레스와 어미 추종에 의한 과도한 운동으로 증체 악화가 우려되므로, 모자를 분리해 제한 포유를 이용하는 책넘김 포유를 실시한다(어미는 방목, 송아지는 한정 패독 사육; 약간의 순치 후 포유 시에만 책을 사이에 두고 포유).</span></p>
<p class="bx-num"><span class="bxn" data-n="214">•</span><span>표준 발육에 필요한 포유량: 小畑 등은 봄~가을 방목 조건에서 포유량 1 kg이 DG 0.133 kg에 상당한다고 보고⁴⁵⁾. DG 1 kg에 8.29 kg, 0.9 kg에 7.53 kg, 0.8 kg에 6.78 kg의 유량 필요. 최근 일반적인 사사 조건에서는 운동량이 적으므로 그보다 10% 정도 적은 포유량이 적절하다고 본다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비유량 추정법과 포유량 확보</div>
<p class="bx-num"><span class="bxn" data-n="215">•</span><span>이유 시 체중에 대한 비유량 영향이 크고, 이유 시 체중은 송아지 가격에 크게 반영되므로 육용우 경영의 중요 형질. 어미 비유량 파악은 송아지 고형 사료, 어미 증사(増し飼い) 등 관리상 중요.</span></p>
<p class="bx-num"><span class="bxn" data-n="216">•</span><span>寺田 등: 체중차법과 송아지 체중·증체량에서 어미 수유량을 추정하는 방법 보고⁴⁶⁾. 그러나 현장에서는 별사육이 필요하다고 판정된 시점에 이미 발육 지연이 커 대응이 늦으므로 더 조기 추정이 필요.</span></p>
<p class="bx-num"><span class="bxn" data-n="217">•</span><span>久馬 등: 생후 1주간 증체량과 어미 일유량 간 상관 0.84(P<0.01) → 포유 초기 증체로 비유량 추정 가능⁴⁷⁾. 坂瀬 등: 비유량 부족 송아지에 조기 추가 포유하는 수법 보고⁴⁸⁾. 福島: 이로써 이유기 이전 초기 발육 수준을 유지하고 적절한 발육 확보 가능⁴⁹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="218">•</span><span>小路 등: 현장 조사에서 지육중량에 영향하는 중요 포유기 관리 항목으로 확실한 초유 섭취와 포유량 확보를 제시⁵⁰⁾. 순조로운 초기 발육 확보로 고형 사료 섭취가 늘고 그 후 혈중 BHBA 농도가 유의하게 증가. 흑모화종 발육에서 3개월령 전후까지의 비유량이 중요함을 시사.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">이유를 향한 주의점과 필요한 사육 프로그램</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="219">•</span><span><b>자연 포유에서의 사고방식</b></span></p>
<p class="bx-num"><span class="bxn" data-n="220">•</span><span>유용 송아지보다 출생체중이 가벼운 흑모화종은 각 단계가 약간 늦게 진행되나 기본 기준은 같다. 유용 송아지는 인공 포유로 포유 시간을 정확히 관리해 공복감을 느끼기 쉬워 고형 사료 이행이 원활하다. 반면 흑모화종은 자연 포유가 일반적이어서 공복을 느끼면 포유하므로 이행이 어렵다. 따라서 책넘김 포유·제한 포유 등 공복감을 느끼는 환경 설정이 중요하며, 이를 실시하면 통상 4~5개월인 이유 월령을 고형 사료 채식 상황에 따라 3개월 정도로 단축 가능. 중요한 것은 고형 사료 채식량이며, 충분히 먹지 못하는 개체를 월령만으로 이유하지 않는 것.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="221">•</span><span><b>인공 포유에서의 사고방식</b></span></p>
<p class="bx-num"><span class="bxn" data-n="222">•</span><span>초조기 모자분리처럼 분만 후 일찍 인공 포유로 전환하면 유용 송아지와 같이 원활히 이유 가능하며 특별한 주의점은 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="223">•</span><span>그러나 프로그램에는 주의. 종래 흑모화종에도 유용 송아지처럼 대용유 400~500 g/일 체계가 있었다. 표준 발육에는 6 kg 이상 포유⁴⁵⁾, 대용유 환산 약 1 kg/일이 필수. 체격이 큰 유용 송아지는 대용유 부족 시 곧 고형 사료로 보충하지만, 체격이 작은 흑모화종은 필요량의 고형 사료를 먹지 못한다. 대용유 400 g/일 체계에서 스타터 500 또는 700 g/일 섭취 요건을 검토한 결과 성·일령이 아니라 체중에 의존(표 3-1-4): 500 g/일에는 40 kg, 700 g/일에는 50 kg 체중이 필요하며 그 체중까지는 포유로 증체시켜야 한다⁵¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="224">•</span><span>따라서 계통 차는 있으나 50 kg까지는 대용유 약 1 kg/일로 확실한 발육을 촉진하고, 50 kg 도달 시점에 유용 송아지와 같은 방법으로 이유하는 것이 좋다.</span></p>
<p class="bx-num"><span class="bxn" data-n="225">•</span><span>인공 포유 흑모화종의 이유 시 스타터 섭취가 대용유를 따라가지 못해 발육 정체 개체가 보이며, 포유기간 단축이 반드시 득책은 아닌 경우가 많다. 坂瀬 등은 이유를 위한 대용유 감량 기간을 1·2·4주로 종래보다 길게 검토해 4주일 때 체중 증가를 동반한 원활한 이유가 가능하다고 보고⁵²⁾. 현장은 수고로운 포유를 줄이는 데 중점을 두기 쉬우나, 발육 좋은 송아지 확보에는 이유 시 충분한 기간 확보가 유효함을 고려해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="226">•</span><span>표 3-1-4 스타터 섭취량에 따른 이유 시 일령(체중).<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>성</th><th>스타터 1일 섭취량 500 g</th><th>스타터 1일 섭취량 700 g</th></tr><tr><th>수</th><td style="text-align:left">33±9일 (41±3 kg)</td><td style="text-align:left">41±10일 (51±2 kg)</td></tr><tr><th>암</th><td style="text-align:left">43±3일 (42±4 kg)</td><td style="text-align:left">45±1일 (49±1 kg)</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="227">•</span><span>※ 주) 대용유는 1일 400 g(6배 희석하여 2.4 L) 급여.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기 사양관리에서 주의할 점</div>
<p class="bx-num"><span class="bxn" data-n="228">•</span><span>흑모화종 포유기 비감염성 소화불량의 원인 다수는 환경 급변. 포유기 영양은 모유 의존이므로 어미 컨디션 변화에 민감. 발정기 어미는 호르몬 대사 변동으로 유성분이 변해 송아지가 백리(白痢, 소화불량성 설사)를 일으키기 쉽다. 분만 후 어미 사양 내용도 유성분에 영향하며, 특히 비유기 에너지 부족은 알코올 불안정유·고지방유 분비를 초래. 식이성 설사는 일반적으로 2~3주령에 가장 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="229">•</span><span>岡田 등: 분만 후 흑모화종 어미가 저에너지 상태로 간 지방대사능이 저하하면 송아지가 백리를 일으키기 쉽다⁵³⁾. 백리 발생에는 유지방 중 팔미트산·스테아르산 증가가 관여하며, 분만 후 어미 영양 부족으로 유지방 조성이 변해 이를 먹은 송아지가 백리를 일으키는 것으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="230">•</span><span>백리는 제4위 소화불량 → 소장 흡수불량으로 발증하는 경우가 많다. 자연 포유 흑모화종에서 식이성 설사가 의심되면 단유나 전해질액 경구 투여 등 포유 관리 대응이 있다. 수유기 어미 관리로 분만 전 증사를 실행하면 분만 후에도 환경·사양 내용에 큰 변동 없이 비유량에 맞춘 세밀한 관리가 가능하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="231">•</span><span><span style="color:var(--ink-soft)">(저자: 福島護之)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="232">•</span><span><span style="color:var(--ink-soft)">일본송아지 3-1 송아지의 포유와 영양.</span></span></p>
</div>
<div class="bx"><div class="bx-title">3-2 송아지의 영양과 대사, 성장</div>
<p class="bx-num"><span class="bxn" data-n="233">•</span><span>포유 송아지는 반추위가 미발달이기 때문에 단위동물과 유사한 영양 소화·흡수, 대사 기구를 가지지만, 자연포유에서는 생후 6개월 정도에 자연스럽게 이유하는 데 비해 인공포유에서는 일반적으로 생후 6~8주에 이유시킨다. 이 때문에 반추동물 특유의 영양 소화·흡수, 대사 기구로 원활하게 이행하도록 배려한 포유기의 사양관리가 필요하다. 본 절에서는 포유 송아지의 영양소 소화와 대사·성장에 대해 기술한다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">포유 송아지의 소화 시스템</div>
<p class="bx-num"><span class="bxn" data-n="234">•</span><span>신생 송아지는 성우와 마찬가지로 4개의 위를 갖추고 있다. 성우의 위 조직중량은 제1위 80%, 제2위 5%, 제3위 8%, 제4위 7%이다. 반면 송아지는 제4위의 조직중량이 60%, 그 외가 40% 미만이며, 반추위 기능은 당연히 미발달이다(그림 3-2-1). 이 때문에 신생 송아지는 반추동물로서의 소화흡수 기능을 갖추지 못했고, 단위동물과 유사한 소화흡수 기능을 가진다. 반추동물로서의 소화흡수 기능은 고형사료 섭취량 증가에 따라 발달하여 13주령에 성우와 같은 반추위 기능이 된다고 한다. 다만 인공포유의 경우 포유량과 이유 시기에 따라 발달 정도도 달라진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="235">•</span><span>신생 송아지는 출생 직후에 급여되는 초유를 시작으로 생유나 대용유 등의 액상사료를 급여받는다. 송아지가 액상사료를 섭취하면 식도 개구부에서 제4위로 통하는 제2위구(식도구)가 반사적으로 닫혀, 반추위로 거의 넘쳐흐르지 않고 제4위로 직접 유입된다(그림 3-2-2). 이 반사는 흡유 행동에 수반하여 유즙에 포함된 가용성 단백질과 염류가 설인신경을 자극하여 일어난다(제2위구 반사, 식도구 반사).</span></p>
<p class="bx-num"><span class="bxn" data-n="236">•</span><span>생유와 대용유는 카제인과 유청(whey) 등의 단백질, 지방 및 유당이 주성분이다. 포유기에 생유나 대용유로부터 효율적으로 이용되는 영양소는 유단백질, 유지방, 유지(油脂), 유당, 글루코스이다. 음수는 제2위구 반사를 생유나 대용유만큼 유발하지 않기 때문에 반추위로 유입되는 비율이 높다(그림 3-2-2). 제2위구 반사는 이유에 따라 섭취 사료가 고형사료만으로 되면 서서히 소멸한다. 송아지에게 고형사료를 급여한 경우 제2위구 반사는 일어나지 않고 제2위에서 제1위로 밀려 들어간다. 이와 같이 송아지는 액상사료를 제4위로, 고형사료와 물을 반추위로 분별하여 수용하면서 서서히 반추위를 발달시킨다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="237">•</span><span><i>그림 3-2-1 1일령과 12주령 송아지에서 각 위의 비율. 1일령: 제1위 25%, 제2위 5%, 제3위 10%, 제4위 60%. 12주령: 제1위 80%, 제2위 5%, 제3위 8%, 제4위 7%. (I: 제1위, II: 제2위, III: 제3위, IV: 제4위)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="238">•</span><span><i>그림 3-2-2 초생 송아지에서 유즙 및 물 섭취 시의 유입 부위. 유즙: 반추위 12%, 제4위 88%. 물: 반추위 75%, 제4위 25%.</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="239">•</span><span>■ 포유 송아지의 영양 소화</span></p>
<div class="bx-sub"><div class="bx-subtitle">타액</div>
<p class="bx-num"><span class="bxn" data-n="240">•</span><span>액상사료의 지방은 타액에 포함된 지방분해효소(프리가스트릭 에스테라제: PGE)에 의해 가수분해된다(그림 3-2-3). PGE의 생성은 흡유와 음유에 의해 자극되며, 흡유 속도가 느리더라도 포유 보틀이나 포유 버킷의 젖꼭지에서의 흡유는 큰 자극이 된다¹⁾. PGE는 선택적으로 유지방에 활성을 나타내므로 대용유에 포함된 식물성 유지에서는 활성이 낮다. 식물성 유지가 많은 경우 제4위로 유입되는 중성지방(TG)의 비율이 높아지고, 반면 PGE의 가수분해에 의한 모노·디글리세롤의 비율은 낮아진다. PGE 활성의 최적 pH는 4.5~6.0이며, 그 이하가 되면 활성이 저하한다. 섭취한 TG는 섭취 후 30분 이내에 제4위에서 가수분해된다. 응유(커드) 안에 들어간 TG는 제4위 체류시간이 길어지므로 그만큼 PGE에 의한 가수분해량도 증가하는 것으로 생각된다²˒³⁾. 또한 PGE는 가령에 따라 소실된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="241">•</span><span><i>그림 3-2-3 생유를 섭취한 7일령 송아지의 소화·흡수 과정. PGE: 타액선의 효소, W: 유청, C: 커드, P: 단백질, L: 지방, pe: 펩신, re: 레닌, HCl: 위산, la: 유당, pp: 프로테아제, a: 아밀라제, pl: 리파제. 췌장에서 pp·a·pl이 분비되고, 아미노산·글루코스는 문맥으로, 지방산은 킬로미크론으로 림프관에 이행한다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제4위</div>
<p class="bx-num"><span class="bxn" data-n="242">•</span><span>송아지의 제4위에서 염산 분비는 출생 직후에 적고, 염산을 분비하는 활성형 벽세포 수는 출생 후 수일 이내에 약 10배가 된다. 출생 직후 염산 분비가 적고 위내 산도가 낮은 것은 초유 중 면역글로불린(Ig) G의 분해를 회피할 수 있게 하며, 이로써 소장으로부터의 수동면역 획득으로 이어진다. 반면 낮은 산도는 병원성 미생물의 경구 침입 위험을 증대시키지만, 초유 중 면역물질이 소화기관 내에서 미생물을 불활화할 수 있다. 건강한 상태로 출생한 송아지는 일반적으로 발병하지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="243">•</span><span>출생한 지 얼마 되지 않은 송아지에서 생유는 제4위에서 주세포로부터 분비되는 프로레닌을 전구물질로 하는 레닌(키모신)에 의해 3~6분 정도에 고형 부분(커드)과 액상 부분(유청)으로 분리된다⁴⁾. 레닌에 의한 커드 형성의 최적 pH는 6.5이다. 한편 레닌은 단백질 분해 활성을 가지며 그 최적 pH는 3.5이다. 1주령 이상의 송아지에서는 앞서 말한 염산 분비가 활발해지고, 또 주세포가 분비하는 펩시노겐이 펩신이 되어 커드를 형성하고(최적 pH 5.25) 단백질을 분해한다(최적 pH 2.1). 펩신은 단백질에 대한 선택성이 없어 거의 모든 단백질을 분해한다⁵⁾. 반면 레닌에 의한 이 작용은 카제인을 선택적으로 분해한다. 포유량 증가에 따라 단백질 분해 활성은 향상되지만, 대용유 등에 포함된 대체 단백질의 과도한 급여는 소화되기 어렵고 설사 발생 위험을 높이므로 주의가 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="244">•</span><span>타액 항목에서도 기술했듯이, 응고된 커드 안에는 대부분의 유지방이 들어가 있어 6시간 정도에 걸쳐 PGE에 의해 서서히 분해되어 단백질과 지방을 천천히 방출한다. 그 후 커드가 무너지면 십이지장으로의 유입 속도가 증가한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소장</div>
<p class="bx-num"><span class="bxn" data-n="245">•</span><span>출생 직후부터 2일간은 췌액의 효소 농도가 낮기 때문에 면역인자를 포함하는 유청단백질(알부민, 글로불린)은 거의 소화되지 않으며⁶⁾, 1주령까지는 사료 섭취 후의 췌액 분비가 거의 인정되지 않는다. 그 후 십이지장으로 이행한 단백질은 췌액과 장액의 프로테아제에 의해 분해된다. 가령에 따라 단백질 분해효소의 분비량은 증가하지만 트립신의 활성은 높지 않고, 송아지에서는 키모트립신 농도가 트립신보다 높으며 이 비율은 가령에 따라 작아진다⁶⁾. 또한 고온 처리한 탈지분유나 대두단백질을 포함한 대용유를 송아지에게 급여하면 췌액의 효소 활성이 저하하므로 주의가 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="246">•</span><span>한편 유청에는 유당, 미네랄 등이 포함되며 액상이므로 신속하게 십이지장으로 이행하고, 유당은 췌액과 장액의 락타제에 의해 분해되어 갈락토스와 글루코스를 생성한다. 소장벽의 락타제 활성은 출생 후 높고 서서히 저하하지만 8주령에도 성우의 10배이다⁷⁾. 인공유(스타터) 등의 고형사료 섭취량이 증가하기 이전의 포유 송아지가 이용 가능한 탄수화물은 유당 및 그 분해산물인 갈락토스와 글루코스뿐이며, 과당(프럭토스)은 거의 흡수되지 않는다. 신생 송아지의 췌액 중 아밀라제 활성은 낮아 전분이나 그 분해산물인 덱스트린, 맥아당(말토스)을 소화할 수 없다⁷⁾. 췌액 중 아밀라제는 1~3주령에 걸쳐 활성이 6배 높아지고 9주령경에는 42배로 높아지며, 전분의 분해는 가령에 따라 사료 중 전분 함량이 증가함에 따라 발달한다. 소의 소장벽에는 수크라제와 이소말타제가 존재하지 않아 신생 송아지는 자당(수크로스)을 거의 소화하지 못한다⁷⁾. 이와 같이 신생 송아지는 전분 소화능력이 약하므로, 대용유 등에 포함된 전분의 급여는 설사 발생 위험을 높이고, 과도한 경우 장내에서 알코올 발효가 일어나기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="247">•</span><span>십이지장으로 이행한 지방은 췌액 중 리파제에 의해 분해된다. 리파제의 최적 pH는 8.5이며, 분해산물인 지방산 중 중쇄지방산은 그대로 소장벽에서 흡수되어 문맥으로 이행한다. 반면 장쇄지방산은 트리아실글리세롤로 재합성되어 리포단백질에 싸여 림프관으로 이행한다. 지방은 커드에서 방출되어 소장에서 소화흡수되므로 그 흡수는 비교적 완만하며, 초유 섭취 후에는 12시간 후, 생유 섭취 후에는 6시간 정도에 피크가 된다. 대용유 급여의 경우 포함된 카제인 함량에 따라 커드 형성이 다르며, 카제인 함량이 적은 경우에는 십이지장으로의 유지방 이행이 빠르기 때문에 지방이 급속히 흡수되게 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 송아지의 영양 대사</div>
<p class="bx-num"><span class="bxn" data-n="248">•</span><span>송아지가 고형사료를 이용할 수 있게 되는 것은 2~3주령 정도부터이다. 적어도 3주령까지는 포유에 의해 영양원을 획득할 필요가 있다. 이 시기의 소화흡수는 앞 항에서 기술했지만, 영양 대사도 단위동물과 같다고 보아도 좋다. 그 후 고형사료를 서서히 이용할 수 있게 되고, 반추위 내 미생물 발효를 주체로 한 소화흡수 기능이 성우 수준에 도달하는 것은 포육관리에 따른 차이는 있으나 대체로 11~13주령경이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="249">•</span><span>신생 송아지는 소장에서 흡수되는 글루코스가 주요 에너지원이 된다. 이유 후에는 반추위 내 미생물 발효에 의존하여 섭취한 고형사료를 분해하게 되고, 주요 흡수 에너지원은 탄수화물의 미생물 발효로 생성되는 초산, 프로피온산, 낙산 등의 휘발성 지방산(VFA)으로 바뀌며, VFA는 반추위벽에서 흡수된다. 자연포육 하의 송아지에서는 이 변화가 완만하게(6개월령 정도) 일어나지만, 인공포육에 의한 사양관리 하에서는 송아지의 포유 기간을 인위적으로 정하기 때문에 이유 시기까지 어느 정도 반추위 기능을 발달시켜 둘 필요가 있다. 영양 대사에 관련된 대사 호르몬 중 소화관 호르몬이라 불리는 인슐린 등은 단위동물에서는 소장으로부터의 글루코스 흡수가 자극이 되어 분비가 제어된다. 반면 이유 후의 유용우에서는 앞서 말했듯이 소장으로부터의 글루코스 흡수가 전무하기 때문에 VFA가 이들 호르몬의 분비 제어인자가 된다. VFA에 의한 대사 호르몬 조절은 반추위 내 발효가 약한 어린 송아지에서도 인정된다⁸⁾. 이는 영양 대사 기능에 관해서는 태어나면서부터 반추동물의 특성을 가지고 있음을 나타낸다(체내 영양 대사는 장래의 반추위 내 발효에 적응하고 있다).</span></p>
<p class="bx-num"><span class="bxn" data-n="250">•</span><span>표 3-2-1 초유 및 생유 중의 호르몬과 성장인자.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목 (μg/L)</th><th>초유</th><th>생유</th></tr><tr><th>인슐린</th><td style="text-align:left">6.5</td><td style="text-align:left">1</td></tr><tr><th>글루카곤</th><td style="text-align:left">0.16</td><td style="text-align:left">0.01</td></tr><tr><th>성장호르몬</th><td style="text-align:left">1.4</td><td style="text-align:left"><1</td></tr><tr><th>인슐린유사성장인자-1 (IGF-1)</th><td style="text-align:left">310</td><td style="text-align:left">2</td></tr><tr><th>IGF-2</th><td style="text-align:left">150</td><td style="text-align:left">검출한계</td></tr><tr><th>프로락틴</th><td style="text-align:left">280</td><td style="text-align:left">15</td></tr><tr><th>종양괴사인자α (TNF-α)</th><td style="text-align:left">5</td><td style="text-align:left"><2</td></tr><tr><th>렙틴</th><td style="text-align:left">13.9</td><td style="text-align:left">6.1</td></tr></table></div></span></p>

</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="252">•</span><span>■ 포유 송아지의 영양관리와 급여사료</span></p>
<div class="bx-sub"><div class="bx-subtitle">초유</div>
<p class="bx-num"><span class="bxn" data-n="253">•</span><span>신생 송아지가 탄생 후 최초로 섭취하는 것이 초유이다. 신생 송아지는 면역력이 약하기 때문에 초유에 고농도로 포함된 IgG를 섭취하여 소장에서 흡수함으로써 수동적으로 체액성 면역을 획득한다. 일반적으로 출생 후 24~48시간의 송아지 혈청 IgG 농도가 10 mg/mL 이하인 경우 수동면역 전달 부전(Failure of passive transfer: FPT)으로 정의된다⁹⁾. IgG를 흡수할 수 있는 것은 생후 24시간 이내로 여겨지지만, 생후 12시간을 경계로 흡수율이 감소하므로 생후 6시간 이내에 초유 중 IgG 농도 40 mg/mL(~50 mg/mL) 이상인 것을 최소한 3 L 이상 급여하는 것이 바람직하다고 한다⁹˒¹⁰⁾. FPT의 경우 포육 송아지의 건강과 증체에 영향을 미치고¹¹⁾, 초산 분만월령의 지연, 초산 유량의 감소, 6개월령까지의 일당증체량(DG) 감소 및 사료효율 저하를 초래한다¹²⁾. 초유는 IgG뿐 아니라 성장인자나 인슐린 등도 풍부하게 포함하고 있으며(표 3-2-1)¹³⁾, 이들 인자가 장관 기능의 발달에 영향을 준다. 이처럼 초유는 유용우의 성장에도 영향을 주므로 그 관리가 중요하다¹⁴⁾. 신생 송아지의 초유 섭취량은 출생시 체중과 정의 상관관계에 있어(그림 3-2-4)¹⁵⁾, 출생시 체중이 작을수록 섭취량이 적다. 이러한 경우 스스로 필요량의 초유를 섭취하지 못할 수 있으므로 스토막 튜브 등을 이용하여 강제적으로 초유를 섭취시키기도 한다. 스토막 튜브로 초유를 급여한 경우와 포유 보틀로 급여한 경우 혈중 IgG 농도에는 차이가 인정되지 않는다(그림 3-2-5)¹⁶⁾. 초유는 신생 송아지에게 필요불가결하므로 질이 좋은(IgG 함량이 많은) 것을 필요량, 출생 후 가능한 한 신속하게 급여하는 것이 중요하며, 또 급여할 때에는 포유 보틀 등의 위생면도 청결하게 하는 것이 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="254">•</span><span><i>그림 3-2-4 송아지의 출생시 체중과 초유 섭취량의 관계. 가로축 출생시 체중 30~60 kg, 세로축 초유 섭취량 0~6 L. 초유 섭취량 4 L 이상(●), 2~4 L(○), 2 L 이하(◆)로 구분하며, 회귀직선은 체중 33 kg에서 약 1.8 L, 60 kg에서 약 5 L로 우상향. 2 L 이하인 개체는 모두 체중 33~45 kg에 분포. 문헌 15에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="255">•</span><span><i>그림 3-2-5 송아지의 혈청 IgG 농도에 미치는 포유 보틀 및 경구 튜브에 의한 초유 급여의 영향. 가로축 초유 섭취 후 시간 0~45시간, 세로축 혈청 IgG 농도 0~30 mg/mL. 보틀 급여(●)와 튜브 급여(○) 모두 약 10시간에 24 mg/mL 전후로 피크에 달한 뒤 완만하게 20 mg/mL 전후로 저하하며 두 곡선은 거의 겹친다. 문헌 16에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="256">•</span><span><i>그림 3-2-6 3일령 송아지의 소장 융모. A: 초유 급여 1회, 그 후 생유. B: 초유 급여 1회, 그 후 50% 초유+50% 생유(이행유). C: 초유 급여 3일간. 스케일바 200 μm. B·C에서 융모가 A보다 현저히 길고 치밀하다. 컬러 화보 12페이지. 문헌 18에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">대용유(밀크 리플레이서)</div>
<p class="bx-num"><span class="bxn" data-n="257">•</span><span>신생 송아지는 출생 직후에 초유를 급여받고 그 후 1주간은 이행유(초유에서 생유로 이행하는 사이의 유즙)를 급여받지만, 최근에는 낙농장의 대규모 집약화에 따라 초유 급여 후부터 이행유가 아닌 대용유를 급여하는 경향에 있다. 그러나 초유 또는 이행유의 급여는 소장 융모 발달을 촉진시키고 그 효과는 생유보다 커서¹⁷˒¹⁸⁾(그림 3-2-6), 이행유도 신생 송아지에게 중요하다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="258">•</span><span>대용유는 모유 대신 급여되는 액상사료로, 단백질원으로는 탈지분유, 유청단백질, 대두단백질 등을 포함한다. 생유의 경우 유단백질과 유지방의 비율은 거의 1:1이지만, 대용유의 경우는 목표로 하는 DG에 따라 포함되는 단백질과 지방의 균형이 고려되어 있다(국내 대용유의 지방원에는 식물성 유지가 포함되어 있다). 따라서 대용유 급여량에 따라서는 단백질 과잉이 되는 경우도 있다(표 3-2-2)¹⁹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="259">•</span><span>대용유는 액상사료이므로 제2위구 반사에 의해 직접 제4위로 유입된다. 레닌에 의해 커드를 형성하는 것은 카제인뿐이다. 커드 형성 후에는 염산과 펩신에 의해 분해되어 단편이 소장으로 유입되고, 췌액에 포함된 키모트립신이나 트립신 등에 의해 소화·흡수된다. 유청단백질도 마찬가지로 소장에서 효소에 의해 소화된다. 제4위에서 염산과 펩신에 의한 단백질 소화 기구는 1주령 이전에는 미발달이므로, 생후 1주령까지 대용유를 다량으로 급여하는 것은 소화기관에 과도한 부하를 주게 되어 소화불량성 설사 발생으로 이어지기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="260">•</span><span>이상과 같이 대용유는 그 성분으로부터 DG와의 관계가 고려되어 있지만, 소화성은 생유와 비교하면 뒤떨어지는 부분도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="261">•</span><span>표 3-2-2 적온역에서 체중 50 kg 송아지의 일당증체량과 영양요구량.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>평균 DG (kg/일)</th><th>DMI (%체중)</th><th>대사에너지 (Mcal/일)</th><th>조단백질 (g/일)</th><th>조단백질 (%건물)</th></tr><tr><th>0.2</th><td style="text-align:left">1.08</td><td style="text-align:left">2.33</td><td style="text-align:left">97</td><td style="text-align:left">18.1</td></tr><tr><th>0.4</th><td style="text-align:left">1.34</td><td style="text-align:left">2.88</td><td style="text-align:left">155</td><td style="text-align:left">23.2</td></tr><tr><th>0.6</th><td style="text-align:left">1.62</td><td style="text-align:left">3.48</td><td style="text-align:left">214</td><td style="text-align:left">26.5</td></tr><tr><th>0.8</th><td style="text-align:left">1.89</td><td style="text-align:left">4.12</td><td style="text-align:left">272</td><td style="text-align:left">28.9</td></tr><tr><th>1.0</th><td style="text-align:left">2.22</td><td style="text-align:left">4.78</td><td style="text-align:left">331</td><td style="text-align:left">29.9</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="262">•</span><span><span style="color:var(--ink-soft)">문헌 19에서 인용·개변</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">스타터</div>
<p class="bx-num"><span class="bxn" data-n="263">•</span><span>스타터는 포육기용(13주령 정도)으로 설계된 고형의 농후사료 주체형 배합사료이다. 고형사료는 액상사료와 달리 제2위구 반사가 일어나지 않기 때문에 제1위 안으로 밀려 들어간다. 이 때문에 스타터는 조기 이유를 전제로 반추위 발달을 촉진시키기 위한 사료이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="264">•</span><span>신생 송아지는 출생 후 24시간 이내에 제1위 내에 다수의 혐기성 세균이 검출된다. 펙틴, 전분 및 자일란 분해균은 출생 후 1주령에는 성우 수준에 도달하지만, 셀룰로스 분해균은 건초를 섭취하기 시작하는 3주령부터 성우 수준이 된다. 메탄 생성균은 셀룰로스 분해균에 뒤이어 증식한다(그림 3-2-7).</span></p>
<p class="bx-num"><span class="bxn" data-n="265">•</span><span>제1위 내에서 스타터는 세균에 의해 발효·분해되어 VFA가 생성·흡수되고, 체내에서 에너지원 등으로 이용된다. 생후 1주령경부터 송아지에게 스타터를 급여하기 시작하지만, 송아지의 스타터 섭취량이 증가하기 시작하는 것은 2~3주령경부터이다(그림 3-2-8)²⁰⁾. 스타터는 제1위 내 미생물의 영양원이기도 하며, 반추위 발효에 유용한 미생물총의 발달·안정화에 중요하다. 제1위 내의 VFA, 특히 낙산은 반추위의 상피조직과 융모 발달을 촉진한다. 또한 고형사료의 섭취는 반추위에 물리적 자극을 주어 근층과 운동성을 발달시키기 위해서도 필요하다. 이처럼 스타터를 송아지에게 급여함으로써 조기 이유가 가능해진다. 후술하겠지만 스타터 섭취량은 포유량과 부의 상관관계에 있어, 포유량이 많으면 스타터 섭취량은 적다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="266">•</span><span><i>그림 3-2-7 송아지의 성장에 따른 제1위 내 세균총의 변화. 가로축 일령(9시간, 3일, 4일, 5일, 7일, 21일, 35일, 70일, 105일), 세로축 대수(0~11). 혐기성 세균·전분 분해균·펙틴 분해균은 생후 수일 내에 대수 9~10에 도달. 셀룰로스 분해균은 5일 대수 2, 7일 약 6, 21일 이후 약 7~9. 메탄 생성균은 4~5일 대수 2 이하에서 7일 약 3.5, 21일 이후 약 7. 황산염 환원균은 21일 이후 대수 5.5~8.5.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="267">•</span><span><i>그림 3-2-8 표준포유와 고영양포유 프로그램의 비교. 가로축 일령 0~56일, 좌축 DM(kg/일) 0~3, 우축 체중(kg) 20~90. 흰 기호: 표준포유, 검은 기호: 고영양포유. 체중은 표준포유가 0일 약 38 kg→56일 약 77 kg, 고영양포유가 약 40 kg→약 86 kg. 대용유(DMI)는 표준포유 약 0.5 kg/일을 유지하다 42일 이후 0으로, 고영양포유는 약 0.75~1.0 kg/일을 유지하다 42일 이후 감소해 56일 0. 스타터(DMI)는 표준포유가 28일 약 0.4, 42일 약 1.0, 56일 약 2.2 kg/일, 고영양포유는 42일 약 0.55, 49일 약 1.3, 56일 약 2.2 kg/일. 문헌 20에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">건초</div>
<p class="bx-num"><span class="bxn" data-n="268">•</span><span>종래에는 스타터 섭취량을 촉진하고 조기에 반추위를 발달시킬 목적으로 건초 급여가 제한되어 왔다. 이는 송아지가 건초를 섭취하면 스타터 섭취량이 감소한다는 이유에서였다. 그러나 이유 전의 건초 섭취량은 미미하여 스타터 섭취량에 영향을 주지 않는다²¹⁾. 또한 포유기의 건초 섭취는 이유 후의 반추위 pH를 안정화시키고, 건초에 의한 반추위로의 물리적 자극으로 근층이 발달한다. 출생 후 2주령경부터 송아지는 반추를 개시하며, 반추 시간은 신속하게 증가한다. 스타터 섭취량이 450 g 이상이 되면 반추 시간이 급증하는데, 이는 건초 섭취량의 증가도 반영하고 있다고 생각된다²²⁾(그림 3-2-9). 뉴질랜드에서는 방목지에 송아지를 가장 먼저 내보내는 것이 일반적이다. 이는 양질이고 발효되기 쉬운 목초의 끝부분 부드러운 부위를 먹이는 것을 목적으로 한다. 또한 줄기가 많은 등 질이 나쁜 건초는 그다지 강하지 않은 송아지의 소화관벽을 상하게 하기도 한다. 그러한 관점에서 건초로는 양질이고 부드러운 것을 급여하는 것이 좋다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="269">•</span><span><i>그림 3-2-9 송아지의 스타터 급여량에 따른 1일당 반추 시간의 추이. 가로축 일령 0~70일, 세로축 1일 반추 시간 0~900분. 스타터 다급(○■)과 스타터 표준(▲×). 10일령경까지 거의 0이며, 15~30일령에 급증하여 40일령 이후 약 400~600분/일에서 평형에 달한다. 스타터 다급군은 표준군보다 약 1주 이른 시기(약 15~20일령)에 상승을 시작한다.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">물</div>
<p class="bx-num"><span class="bxn" data-n="270">•</span><span>종래부터 포유기에는 대용유나 생유 등의 포유가 중요하다는 것은 말할 것도 없지만, 물도 중요하다. 포유 버킷 등으로 급여되는 대용유 등은 제2위구 반사에 의해 직접 제4위로 유입되지만, 음수는 주로 제1위로 유입된다(그림 3-2-2). 스타터 1 kg에 대해 물은 4 L 필요하다고 하며, 이는 반추위 환경을 안정화하기 위해 중요하다. 물과 스타터의 섭취 패턴은 같으며²³⁾, 불충분한 물 급여는 스타터 섭취량 저하를 초래한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="271">•</span><span><span style="color:var(--ink-soft)">(저자: 杉野利久)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="272">•</span><span><span style="color:var(--ink-soft)">일본송아지 3-2 송아지의 영양과 대사, 성장.</span></span></p>
</div>
<div class="bx"><div class="bx-title">3-3 자연 포유와 인공 포유, 자동 포유</div>
<p class="bx-num"><span class="bxn" data-n="273">•</span><span>유용 송아지의 포유 관리는 대부분 인공 포유이며, 낙농 경영의 대규모화·집약화에 따라 포유 로봇을 이용한 자동 포유도 보급되고 있다. 포유 작업 부담을 줄이기 위한 컨트랙터(위탁) 포유 사업도 늘고 있다. 저자는 담당 인력 부족에 따른 생력화 흐름 속에서 포유기 다두 관리가 늘어나고 자동 포유가 앞으로 주류가 될 것으로 전망하며, 이 절에서 자연 포유를 대조군으로 두고 인공 포유와 자동 포유를 해설한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="274">•</span><span>■ 자연 포유와 인공 포유의 차이</span></p>
<div class="bx-sub"><div class="bx-subtitle">자연 포유</div>
<p class="bx-num"><span class="bxn" data-n="275">•</span><span>유용 송아지에서는 거의 하지 않으며, 육용우 방목 중심에서 볼 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="276">•</span><span>출생 후 기립한 송아지가 어미소로부터 직접 초유를 빨고, 이후 이행유(초유→생유), 생유를 자율적으로 섭취한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="277">•</span><span>흡유 횟수 6~12회/일, 생유 섭취량 건물 기준 1~1.5 kg/일. 어미젖의 유단백 함량은 건물 중 25~26%.</span></p>
<p class="bx-num"><span class="bxn" data-n="278">•</span><span>고형 사료는 신선한 목초의 부드러운 끝부분을 먹으므로 반추위 발효가 일어나기 쉽다. 고형 사료 섭취가 서서히 늘고, 이유(모자 분리)는 6개월령 정도.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">인공 포유</div>
<p class="bx-num"><span class="bxn" data-n="279">•</span><span>자연 포유의 흐름을 인위적으로 재현한 것으로, 포유 기간은 6~8주령. 즉 자연 포유의 1/3 기간에 반추동물형 소화흡수·대사 양식으로 전환시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="280">•</span><span>모자 분리는 출생 직후, 초유는 인위적으로 급여. 경영 규모에 따라 다르나 초유 급여 후 대용유로 넘어가며, 전환 시 설사가 나기 쉬워 주의가 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="281">•</span><span>어미의 이행유를 모방해 초유와 대용유를 혼합 급여하면 소장 융모 발달이 촉진되어 좋다(그림 3-2-6, 142쪽).</span></p>
<p class="bx-num"><span class="bxn" data-n="282">•</span><span>초유의 질은 그 후 능력을 결정하는 요인(락토크린 가설, 3-2절 141쪽 참조). 최근에는 IgG 함량이 균일한 분말 초유 제제를 초유 대체 또는 어미 초유와 혼합하여 급여하기도 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="283">•</span><span>대용유 급여와 동시에 1주령 무렵부터 인공유(스타터), 건초 등 고형 사료를 급여한다(처음에는 장난삼아 먹는 정도).</span></p>
<p class="bx-num"><span class="bxn" data-n="284">•</span><span>대용유는 제2위구 반사(식도구 반사)로 직접 제4위로 가고, 스타터 등 고형 사료는 제1위로 밀려 들어가 반추위 미생물 발효로 탄수화물이 휘발성 지방산(VFA)으로 분해된다. VFA는 융모 발달을, 건초는 물리적 자극으로 근층 발달을 촉진한다. 자연 포유에서는 급여하지 않는 스타터 섭취를 유도하여 조기에 반추위를 발달시키는 것이 인공 포유의 특징이며, 스타터 섭취를 촉진하려면 신선한 물의 음수가 중요하다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="285">•</span><span>■ 인공 포유 프로그램</span></p>
<div class="bx-sub"><div class="bx-subtitle">조기 이유법과 표준 포유 프로그램</div>
<p class="bx-num"><span class="bxn" data-n="286">•</span><span>유용 송아지는 조기 이유법이 주류로, 통상 6~8주령에 이유. 단위동물형 소화흡수 기구를 반추동물형으로 지장 없이 조기에 전환시켜야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="287">•</span><span>경영 효율상 포유 기간은 짧은 편이 바람직하다. 생유/대용유 급여 기간을 제한하는 대신 반추위 발달을 촉진하는 스타터 급여에 중점을 둔 영양 관리가 조기 이유법이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="288">•</span><span>종래에는 포유량이 많으면 스타터 섭취가 줄기 때문에 포유량을 4 kg 정도(출생 시 체중의 약 10%)로 제한하여 스타터 섭취를 높이고 6주령에 이유하는 방법이 주류였다(표준 포유 프로그램, 그림 3-2-8, 143쪽).</span></p>
<p class="bx-num"><span class="bxn" data-n="289">•</span><span>표준 포유 프로그램의 포유기 일당증체량(DG)은 대략 0.7 kg/일 이하. 조기 반추위 발달이라는 장점이 있지만, 반추위가 미숙한 시기에 포유량을 제한하므로 발육이 뒤처지는 단점이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="290">•</span><span>포유 로봇 자유 포유 시험¹⁾: 3주령까지 송아지는 평균 13.5 kg/일의 대용유를 섭취했고 로봇 방문 횟수는 8.7회(1회 약 1.5 kg). 3~6주령은 평균 14.7 kg/일. 같은 시험에서 대용유를 4 kg/일로 제한하면 방문 횟수가 23.7회로 많아, 1일 4 kg 정도로는 송아지에게 부족함을 보여준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="291">•</span><span>고형 사료를 잘 이용하지 못하는 시기의 포유 제한은 발육뿐 아니라 스트레스 부하가 되어 면역력 저하와 건전성 악화를 초래하며, 동물복지 관점에서도 문제로 지적되기 시작했다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">고영양 포유 프로그램</div>
<p class="bx-num"><span class="bxn" data-n="292">•</span><span>포유기 DG는 초산차 유량에 영향을 미치며, 이유까지의 DG가 1 kg 늘면 초산 유량이 850 kg 증가한다는 보고²⁾가 있다. 장기적 경영 효율 면에서 포유기에는 반추위 조기 발달보다 충분한 발육(체격 프레임 확대)이 중요하다는 의미이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="293">•</span><span>이에 따라 최근에는 생유/대용유를 8 kg 이상(출생 시 체중의 20% 정도까지) 포유하고 이유를 8주령 정도로 늦추어, 포유 기간 내에 출생 시 체중의 2배(DG 0.7 kg/일 이상)까지 발육시키도록 설계한 고영양 포유 프로그램이 주류가 되고 있다(그림 3-2-8, 143쪽).</span></p>
<p class="bx-num"><span class="bxn" data-n="294">•</span><span>대용유 사용 시에는 포유 프로그램과 목표 DG에 따라 대용유의 단백질과 에너지(지방, 탄수화물) 균형을 고려해야 한다(표 3-2-2, 143쪽). 목표 DG가 높아지면 대사 에너지 요구량은 2배, 조단백질(CP) 요구량은 3배로 증가한다. 포유량이 적고 목표 DG도 작은 관리에서 DG 0.8 kg/일 이상용으로 설계된 대용유를 주면 단백질 과잉(질소 손실)에 그친다는 점에 주의.</span></p>
<p class="bx-num"><span class="bxn" data-n="295">•</span><span>사람이 작업하는 낙농 현장에서는 포유 횟수가 2~3회/일로 자연 포유보다 적다. 고영양 포유에서는 1회 포유량이 늘어나는데, 다 먹지 못하면 횟수 증가에 따른 작업 부담이, 다 먹더라도 포유 간격이 짧으면 영양성 소화불량 설사 위험이 커질 수 있다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="296">•</span><span>■ 인공 포유에서 이유 시기</span></p>
<div class="bx-sub"><div class="bx-subtitle">이유 시기 판단의 원칙</div>
<p class="bx-num"><span class="bxn" data-n="297">•</span><span>유용 송아지 이유 시기는 6~8주령이며, 이유까지 반추위 중심의 소화관 기능을 고형 사료에 충분히 적응시켜야 한다. 자연 포유에서는 젖→조사료 섭취로 자연스럽게 반추위가 발달하지만, 인공 포육에서는 스타터로 조기에 적응시켜 이유한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="298">•</span><span>이유 시 반추위 기능이 미발달하여 스타터 섭취량(이 시기 조사료 섭취는 미량)으로 영양·에너지를 보충하지 못하면, 이유 전 생유/대용유로 얻던 만큼 일시적으로 에너지 섭취 감소와 발육 정체를 초래한다³⁾. 따라서 표준·고영양 프로그램을 불문하고 반추위 기능이 확실히 발달한 뒤에 이유하는 것이 바람직하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="299">•</span><span>표준 포유 프로그램: 반추는 2주령부터 시작되어 3~4주령에 급증한다. 일반적으로 스타터 섭취량 1,000 g 정도가 3일 연속 지속되면 이유 시점이며, 대략 6주령이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="300">•</span><span>고영양 포유 프로그램: 포유량이 많은 기간에는 스타터 섭취가 표준 포유보다 적어 6주령에 500 g 정도이다. 이후 단계적으로 포유량을 제한하여 스타터 섭취량이 1,500 g 정도가 되는 시점이 이유 시점이며, 대략 8주령이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">고영양 포유 프로그램에서 6주 이유와 8주 이유의 비교⁴⁾</div>
<p class="bx-num"><span class="bxn" data-n="301">•</span><span>시험 조건: 1주령부터 이유 1주 전까지 대용유 8 kg, 이후 이유까지 4 kg 포유.</span></p>
<p class="bx-num"><span class="bxn" data-n="302">•</span><span>스타터 섭취는 두 구 모두 4주령 무렵부터 증가하기 시작하며, 7주령 시점의 스타터 섭취량은 6주 이유구가 8주 이유구의 약 4배이다. 그러나 총 대사 에너지(ME) 섭취량은 대용유를 먹고 있는 8주 이유구가 더 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="303">•</span><span>6주 이유구의 총 ME 섭취량은 대용유 8 kg의 ME 섭취량보다 낮아지는 반면, 8주 이유구는 7주령부터 포유 제한으로 스타터 섭취가 급증하여 이유 후에도 대용유 8 kg의 ME 섭취량을 밑돌지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="304">•</span><span>그 결과 6주 이유구는 이유 후 일시적 발육 정체를 보이며 10주령 체중이 8주 이유구보다 낮다(그림 3-3-1).</span></p>
<p class="bx-num"><span class="bxn" data-n="305">•</span><span>이는 고영양 프로그램의 6주 이유에서 소화관 기능이 미숙할 가능성을 시사한다. 실제로 7주령 분변 중 전분 함량은 6주 이유구에서 많아, 소화불량에 따른 대장 산증(설사증)이 우려된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="306">•</span><span>경영 효율상 주령을 의식하는 것도 중요하지만, 이유 이행기에는 반추 횟수, 스타터 섭취량, 분변 점수 등을 정밀히 살펴 신중히 관리하는 것이 바람직하다. 스타터 섭취를 늘려 이유 시 에너지 부족을 피하려면 신선한 물을 충분히 마시게 하고, 양질의 건초를 급여하여 반추위 융모와 근층 발달을 촉진하는 관리가 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="307">•</span><span>*그림 3-3-1 고영양 포유 프로그램의 6주 이유와 8주 이유의 비교(문헌 4에서 인용·개변). A: 6주 이유의 사료 섭취량, B: 8주 이유의 사료 섭취량(세로축 ME 섭취량 Mcal/일, 0~10; 가로축 일령 0~70; 대용유·카프스타터·건초·총 ME 섭취량 4개 선). 대용유 ME는 약 7일령부터 약 5.5 Mcal/일로 유지되다 6주 이유구는 35일령, 8주 이유구는 49일령부터 절반(약 2.8)으로 줄어 42일령/56일령에 0이 된다. 총 ME는 6주 이유구에서 35~42일령에 약 3 Mcal/일까지 떨어진 뒤 회복(70일령 약 8.5), 8주 이유구는 49일령 전후 약 7→5 Mcal/일로 소폭 하강 후 회복(70일령 약 8.5). C: 체중 추이(kg, 20~110; 0~70일령). 두 구 모두 0일령 약 38 kg, 35일령 약 65 kg으로 동일하다가, 42일령 이후 8주 이유구가 유의하게 높음(\<i>P<0.05 vs 6주 이유; 70일령 8주 이유 약 102 kg, 6주 이유 약 94 kg).</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="308">•</span><span>■ 포육 시설과 포유 관리(인공 포유, 자동 포유)</span></p>
<div class="bx-sub"><div class="bx-subtitle">포유기 시설의 기본 관점</div>
<p class="bx-num"><span class="bxn" data-n="309">•</span><span>포유기는 면역이 수동면역에서 능동면역으로 바뀌는 시기이며, 액상 사료(생유, 대용유)에서 고형 사료(스타터, 건초)로 전환되면서 반추위가 발달하고 대사 특성도 단위동물형에서 반추동물형으로 크게 바뀐다. 설사·폐렴 등 질병 발생률이 여전히 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="310">•</span><span>영양생리뿐 아니라 사회성, 발육에 따른 체격도 변한다. 따라서 포유 송아지 시설은 위생과 사양 양면을 고려해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="311">•</span><span>개별 포유가 주류이지만, 집약화·대규모화로 포유 로봇 등을 활용한 군 관리도 보급되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">개별 포유 시설의 포유 관리</div>
<p class="bx-num"><span class="bxn" data-n="312">•</span><span>개별 포유 시설은 사외(舍外)에서 격리 사육하는 카프 허치와 우사 내 개별 펜으로 나뉜다. 송아지 간 접촉을 막아 감염병 위험을 피할 수 있다. 크기, 운동장 설치, 환기 방법 등 상세는 부록 4(331쪽) 참조.</span></p>
<p class="bx-num"><span class="bxn" data-n="313">•</span><span>사외 카프 허치: 일반적으로 허치 앞에 철망 울타리로 둘러싼 운동장을 두며, 운동장은 혹서기(여름)에는 야간, 한랭기(겨울)에는 주간의 휴식 장소가 된다. 배설 장소 분산으로 허치 내 깔짚 위생에도 도움이 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="314">•</span><span>카프 허치도 사내 사육과 마찬가지로 환기가 중요하다. 여름에는 개방하여 신선한 외기를 들여 폐렴 등의 발생 위험을 줄인다. 겨울에는 허치 후면을 닫아 내부 온도를 유지해야 한다. 포유 송아지는 반추위가 미발달하여 육성우 이상에 비해 발효열이 적고 저온 임계온도가 높기 때문이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="315">•</span><span>사내 개별 펜(카프 허치를 쓰기도 함): 기본은 사외 허치와 같고, 날씨에 좌우되지 않아 작업성은 더 좋다. 그러나 포육사 전체의 환기를 고려하지 않으면 감염병 위험이 높아진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="316">•</span><span>포유 횟수는 일반적으로 아침·저녁 2회이며, 최근 고영양 포유 프로그램 보급으로 3회 포유도 보인다. 작업자가 포유하는 경우 담당자 간 정보 공유가 중요하다. 포유 시각·방법을 가능한 한 통일하고 송아지 상태를 점검·공유하여 변화에 신속히 대응함으로써 손실을 막아야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="317">•</span><span>자동 포유 관리에서는 후술하는 군 관리가 일반적이지만, 송아지가 군 관리를 견딜 체력과 건강 상태가 될 때까지 출생 후 대략 10일령까지는 개별 시설에서 사육한 뒤 군 관리로 옮기는 것이 손실 방지 면에서 일반적이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 기구와 위생</div>
<p class="bx-num"><span class="bxn" data-n="318">•</span><span>포유 병, 젖꼭지 달린 포유 버킷 또는 일반 버킷으로 생유/대용유를 급여한다. 포유 병 용량은 1.5~3 L이며 젖꼭지 부분을 분리하여 세척한다. 고영양 포유에서는 최대 1일 8 L 이상을 급여하기도 하여 최근 4 L 포유 병도 시판된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="319">•</span><span>버킷 포유: 세척·소독이 쉽고 생력적이지만, 비강 오염에 기인한 마이코플라스마성 중이염에 주의해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="320">•</span><span>젖꼭지 달린 버킷·병: 대용유 조제와 세척·소독에 시간이 들지만 오연(誤嚥) 방지, 흡유에 의한 타액 분비 촉진 등의 효과가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="321">•</span><span>고영양 포유처럼 1회 포유량이 많으면 1회 포유 시간이 길어지므로, 대용유를 녹이는 온수 온도와 덩어리 잔류에 주의하고 포유 중 온도 저하와 침전에 주의한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="322">•</span><span>사용 후 기구를 확실히 세척·소독하고 보관 장소까지 위생적으로 관리하는 것이 손실 방지에 중요하다. 특히 포유 병의 먹다 남은 젖과 대용유 침전물은 전용 브러시 등으로 완전히 제거하고, 자극이 적은 양성 또는 역성 비누에 침지 소독하며, 사용 전에 잘 헹군다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">개별 포유 시설의 자동 포유</div>
<p class="bx-num"><span class="bxn" data-n="323">•</span><span>카프 레일(그림 3-3-2)과 밀크 택시(그림 3-3-3)가 있으며, 둘 다 사외가 아닌 사내 사육에서 쓰는 것이 일반적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="324">•</span><span>카프 레일: 주행 레일에 포유기를 매달아 각 개별 펜으로 이동하며 포유시키는 장치. 별도로 컨트롤 유닛, 대용유 믹서 등 대용유 조제기가 필요하다. 최대 한쪽 16두 개별 펜에 대응하여 1기로 32두 개별 자동 포유가 가능하다. 1일 최대 8회 포유가 가능하며 항상 적정 온도의 대용유를 급여할 수 있다. 대용유 공급 라인(호스)은 군 사육용 포유 로봇보다 분명히 길지만, 포유 전후에 세척·소독이 이루어지고 젖꼭지도 소독된다. 장점은 개별 사육의 이점(감염 위험 저감 등)에 더해 자동화에 의한 생력화이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="325">•</span><span>밀크 택시: 대용유 조제기를 각 개별 펜으로 이동시켜 설치된 포유 병에 대용유를 공급하는 시스템. 자동이 아니므로 노동력은 필요하지만, 시설 개축 없이 적정 온도의 대용유를 공급할 수 있다. 다만 포유 병 세척·소독은 필요하다(사람 포유 작업과 동일).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="326">•</span><span><i>그림 3-3-2 카프 레일(사진 제공: 오리온기계(주)). 레일에 매달린 포유기에서 개별 펜의 송아지가 젖꼭지를 빨고 있는 사진.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="327">•</span><span><i>그림 3-3-3 밀크 택시(사진 제공: 효고현·永井秀樹 씨). 왼쪽: 밀크 택시, 가운데: 대용유 배급 모습, 오른쪽: 포유 병.</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">페어 허치와 군 관리</div>
<p class="bx-num"><span class="bxn" data-n="328">•</span><span>최근 집약화·대규모화로 송아지 군 관리도 보급되고 있다. 포유 로봇 활용으로 작업 부담은 줄지만 위생 면에서 감염병 위험은 높아진다. 그러나 사회성·사양 면에서 유효한 수단이며, 종합적으로 보면 경영 규모에 따라 다르나 앞으로 개별 포육 시설보다 주류가 될 것으로 본다.</span></p>
<p class="bx-num"><span class="bxn" data-n="329">•</span><span>페어 허치: 이름대로 카프 허치 2개가 운동장을 공유하는 형식.</span></p>
<p class="bx-num"><span class="bxn" data-n="330">•</span><span>군 관리: 주령·체중이 비슷한 15두(많아도 20두)를 1군으로 하고, 깔짚 교환·소독 작업을 정기적으로 할 수 있게 설계한다. 면적은 카프 허치·개별 펜 면적으로 보아 1두당 3 ㎡가 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="331">•</span><span>페어·군 관리가 행동·사양에 미치는 영향은 표 3-3-1, 표 3-3-2의 지견⁵⁾이 있다. 사회성, 증체, 섭식에서 변화가 없다는 보고도 있으나 페어 허치나 군 관리의 긍정적 효과를 인정한 보고가 대체로 많다. 따라서 이 효과를 살리기 위해서도 감염병 위험을 줄이도록 환기, 깔짚의 정기 교환, 소독을 실시하고 개체 점검이 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="332">•</span><span>페어 허치의 대용유 급여는 개별 포유와 같이 적정하게 실시하며, 자동 포유 시 카프 레일·밀크 택시를 이용할 수 있다. 군 관리에서는 포유 스테이션을 설치한 포유 로봇 관리가 일반적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="333">•</span><span>포유 로봇: 송아지에 부착한 개체 식별 IC 넥 태그로 센서가 개체를 식별하고, 컨트롤 유닛이 개체를 판별하여 대용유와 온수를 믹서에 투입·혼합해 설정된 포유량을 급여한다. 최근에는 각 송아지의 포유 상황 등이 스마트폰 등 태블릿 IT 단말로 수시 전송되어 송아지 상태를 파악할 수 있다. 포유 로봇 구성은 그림 3-3-4에 제시하였으나, 제조사에 따라 대용유 조제 등이 다르므로 상세는 제조사 홈페이지 등을 참조.</span></p>
<p class="bx-num"><span class="bxn" data-n="334">•</span><span>개별 사육과 페어/그룹 사육(3~4두 그룹, 8두 이하 복합 등)을 비교한 11건의 지견. 출전: Broom and Leaver 1978, Costa et al. 2014, de Paula Vieira et al. 2010(3건), Jensen and Larsen 2014, Jensen et al. 1997(2건), Jensen et al. 2005, Veissier et al. 1994(2건).</span></p>
<p class="bx-num"><span class="bxn" data-n="335">•</span><span>표 3-3-1 송아지 행동에 대한 군 관리의 영향(문헌 5에서 인용·개변) — 내용 요약.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>영향</th><th>건수</th><th>해당 파라미터</th></tr><tr><th>+ (증가·향상)</th><td style="text-align:left">7</td><td style="text-align:left">사회적 순위(2), 낯선 사료 섭취, 젖꼭지에서 떨어진 뒤 발성, 새 환경에서 섭식까지의 시간, 새 환경 이동 후 사료 섭취, 낯선 송아지와 접촉까지의 시간</td></tr><tr><th>− (감소)</th><td style="text-align:left">3</td><td style="text-align:left">낯선 송아지 회피, 개방된 장소에서의 공포, 군 이동 시 공격성</td></tr><tr><th>= (차이 없음)</th><td style="text-align:left">1</td><td style="text-align:left">놀이 행동</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="336">•</span><span>개별 사육과 페어/그룹(3~6두) 사육을 비교한 34건의 지견(Andrighetto 1999, Babu 2004/2009, Bernal-Rigoli 2012, Chua 2002, Costa 2015a, de Paula Vieira 2010, Hänninen 2005, Hepola 2006, Jensen 2015, Pempek 2013, Phillips 2004, Richard 1988, Tapki 2007, Terré 2006, Warnick 1977, Xiccato 2002).</span></p>
<p class="bx-num"><span class="bxn" data-n="337">•</span><span>표 3-3-2 송아지 증체와 섭식 행동에 대한 군 관리의 영향(문헌 5에서 인용·개변) — 내용 요약.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>파라미터</th><th>+</th><th>=</th><th>−</th></tr><tr><th>고형 사료·농후 사료·건물·건초 섭취량</th><td style="text-align:left">10</td><td style="text-align:left">6</td><td style="text-align:left">0</td></tr><tr><th>일당증체량·증체</th><td style="text-align:left">6</td><td style="text-align:left">6</td><td style="text-align:left">0</td></tr><tr><th>체중·최종 체중</th><td style="text-align:left">5</td><td style="text-align:left">1</td><td style="text-align:left">0</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="338">•</span><span>군 관리에서 감소(−)를 보고한 항목은 없고, 약 6할에서 양(+)의 효과가 보고되었다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">군 관리에서 자동 포유의 이점과 문제점</div>
<p class="bx-num"><span class="bxn" data-n="339">•</span><span>자동 포유의 이점은 두말할 것 없이 생력화이다. 대용유 조제부터 포유까지 일련의 작업이 자동화되어 노동 경감으로 이어진다. 특히 고영양 포유 프로그램에서는 최대 8 L 이상의 포유 작업이 자동화된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="340">•</span><span>수작업에서는 담당자가 1일 2회 포유로 1회 4 L를 먹여야 하며, 포유 간격 등에 주의하지 않으면 설사 발생으로 이어진다. 자동 포유는 프로그램에 따라 소량 다회 포유가 가능하여 자연 포유에 가까운 상황을 설정할 수 있다. 앞서 말한 바와 같이 송아지의 포유욕을 충족시킴으로써 송아지끼리 서로 빠는 행동이나 대용유 과음에 따른 설사도 방지할 수 있다. 군 관리이므로 개별 포유 시설과 달리 우상 면적도 넓고(과밀 사육은 논외) 운동량도 늘어난다. 또한 학습 효과가 촉진되기 때문에 군 관리에서는 고형 사료의 조기 섭취, 섭취량 증가 등의 이점도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="341">•</span><span>자동 포유의 문제점은 군 관리라는 점 그 자체이다. 송아지는 개별 관리에서 군 관리로 바뀌어 1방당 20두 정도(최대 25~30두)가 된다. 포유 로봇의 경우 대용유 조제기 1대에 포유 스테이션 2대를 설치할 수 있으므로 2방에서 40~60두의 군 사육이 가능해진다. 이 때문에 군 사육에 따르는 스트레스 대책, 질병 대책과 건강 관리가 앞서 말한 대로 중요하다. 포유 작업 자체는 포유 로봇에 맡기더라도, 생력화로 얻어진 시간적 여유를 송아지 관찰에 쓰고, 질병의 조기 발견과 치료를 통한 사고율 감소와 발육 개선에 힘쓰는 것이 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="342">•</span><span>앞서 말한 바와 같이 송아지의 체격과 체력을 고려하면 출생 후 1주일 정도(~10일간)는 개별 관리가 바람직하다. 또한 자동 포유 관리로 이행할 시기가 되더라도, 체격과 체력을 관찰하면서 군 관리를 견딜 수 있게 될 때까지는 일령 등에 구애받지 말고 개별 관리로 대응하는 것이 바람직하다. 송아지의 군·자동 포유 관리에서는 그 우군 구성이 중요하다. 송아지가 순차적으로 군 관리로 옮겨 가는 경우에는 기존 송아지의 행동을 학습하여 새로 도입된 송아지도 자동 포유가 촉진되지만(학습 효과), 예탁 목장처럼 대규모 집약형인 경우에는 비슷한 체격의 송아지가 일괄 도입되는 일도 있다. 포유량은 서서히 증량하여 1주일 정도에 최대 포유량에 이르도록 프로그램하는 경우가 많다고 생각되는데, 포유량이 적은 기간에는 포유 스테이션 방문 횟수가 많아지거나 스테이션 점유 시간이 길어진다. 이 경우 설정한 포유량을 다 먹지 못하는 송아지가 생기기도 한다. 도입 당초의 첫 포유는 공복 시에 작업자가 자동 포유에 순치시키는 동시에 송아지를 관찰할 필요가 있다. 또한 포유량을 소량으로 하고 급여 횟수를 늘리는 것은 포유욕을 충족시키고 스테이션 방문 횟수도 줄이므로, 스테이션 이용성이 향상되어 도입 송아지의 순치와 발육 개선도 기대할 수 있다. 포유 로봇 1대당 송아지 두수에 관해서는, 두수 12두 또는 24두, 급여 횟수 4회 또는 8회의 2요인 배치 시험 결과 두수가 적고 횟수가 많은 쪽이 점유나 경합이 적다고 보고되어 있다⁶⁾. 군 관리·자동 포유 장치에 의한 사양 관리는 틀림없이 생력화로 이어지지만, 자동 포유 장치의 최대 두수가 아니라 군 구성, 포유 프로그램 등 농장에 맞는 관리법을 설정할 필요가 있으며, 무엇보다 남는 시간을 송아지 관찰에 할애하여 손모율을 낮추는 것이 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="343">•</span><span><i>그림 3-3-4 포유 로봇. 왼쪽: 믹서·대용유 호퍼·컨트롤 유닛, 가운데: 티트(젖꼭지), 오른쪽: 포유 스테이션. 사진 제공: 효고현 나가이 히데키</i></span></p>
<p class="bx-num"><span class="bxn" data-n="344">•</span><span><span style="color:var(--ink-soft)">(저자: 杉野利久)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="345">•</span><span><span style="color:var(--ink-soft)">일본송아지 3-3 자연 포유와 인공 포유, 자동 포유.</span></span></p>
</div>
<div class="bx"><div class="bx-title">3-4 송아지의 제1위 발효와 장내세균총</div>
<p class="bx-num"><span class="bxn" data-n="346">•</span><span>성우에서는 유지에너지의 70%를 제1위(루멘) 발효로 생기는 단쇄지방산(SCFA)으로 충당한다. 따라서 제1위와 거기에 공생하는 미생물은 소의 영양 획득의 근간을 담당한다고 할 수 있지만, 제1위의 기능은 태어날 때부터 갖추어져 있는 것이 아니다. 성장 과정에서 고형사료 섭취량이 늘어남에 따라 제1위와 장내 미생물의 구성은 변화하고, 이윽고 안정된 미생물 생태계가 형성되어 소화관 환경이 적절히 유지되게 된다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">송아지의 발육에 따른 제1위 발효의 발달</div>
<p class="bx-num"><span class="bxn" data-n="347">•</span><span>신생 송아지의 제1위는 미발달 상태이며, 제4위가 복위 전체의 60%를 차지한다. 고형사료를 본격적으로 섭취하기 시작하는 생후 1~2주 시기에도 제1위의 용적은 작고 기능적으로도 미발달 상태에 있다고 여겨진다. 송아지의 발육에 따라 인공유(스타터)나 건초 등 고형사료의 섭취량이 늘어나면서 제1위는 서서히 발달하고, 이유할 무렵에는 성우와 마찬가지로 제1위 중심의 위 구조가 된다. 제1위의 형태적 발달에는 건초에 의한 물리적 자극과 제1위 발효산물에 의한 화학적 자극 양쪽이 중요하다고 여겨진다. 우유만으로 사육한 송아지에서는 체중은 문제없이 증가하지만, 제1위 용적의 증대는 건초를 병급한 경우에 비해 낮아진다. 한편 건초를 병급하면 체중 증가는 우유만 또는 곡물 병급에 비해 낮게 억제된다¹⁾. 제1위의 발달에서는 용적뿐 아니라 발효로 생기는 SCFA의 흡수를 담당하는 상피조직의 형성도 중요하다. 포유 송아지에서 제1위 상피조직의 형성은 곡물을 병급했을 때 뚜렷하게 촉진된다. 제1위 상피조직의 형성에는 SCFA에 의한 화학적 자극이 필요하며, 그중에서도 낙산의 효과가 크다²⁾. 제1위 내에서 낙산을 생성하는 미생물은 전분 분해성인 것이 많아, 포유 송아지에게 스타터를 급여하면 제1위 내 낙산 생성이 항진되어 상피조직의 형성 촉진을 기대할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="348">•</span><span>제1위 용적의 증대와 고형사료 섭취량 증가에 따라 사료 소화와 발효 기능도 크게 변화한다(표 3-4-1)³⁾. 제1위 내 산화환원전위는 출생 직후부터 빠르게 저하하여 생후 3일에 -150 mV 정도가 되고, 그 후 포유기간 내내 -100 mV 정도의 혐기 상태가 유지된다. 제1위 내 pH는 생후 7일 무렵을 경계로 산성 상태로 기울어 포유기간 내내 pH 5.5~6.5로 유지된다. 이러한 변화는 통성혐기성세균에 의한 산소의 빠른 소비와 혐기 환경의 유지, 제1위 내로 유입된 사료의 발효와 같은 기본적인 제1위 환경이 생후 1주 이내에 구축됨을 시사한다. 제1위 내 각종 효소 활성도 일령을 따라 증가하여, 자일라나아제나 아밀라아제 같은 탄수화물 이용에 관한 효소 활성은 7~10일령, 프로테아제나 우레아제 같은 질소 이용에 관한 효소 활성은 15~23일령에 최대에 이른다(표 3-4-1). 또한 어느 효소 활성이든 최대에 이른 뒤 서서히 저하하여 그 후 일정 수준으로 유지되는데, 이는 제1위 용적의 증대, 고형사료 섭취량과 음수량의 증가, 타액 유입의 증가 같은 요인으로 제1위 미생물 유래의 효소 농도가 희석되기 때문으로 생각된다. 효소 활성의 상승, 즉 제1위 미생물의 활성화에 따라 암모니아태질소는 미생물 증식에 이용되므로, 제1위 내 암모니아태질소 농도는 7일령 이후에는 저하하여 30일령 무렵에는 성우와 같은 정도의 농도(약 5 mgN/dL)로 안정된다. 제1위 내 SCFA 생성도 효소 활성 상승에 따라 증대하여, 15일령 이후의 총 SCFA 농도는 성우와 같은 수준인 약 80 mM로 유지된다. 주요 SCFA는 성우와 마찬가지로 초산, 프로피온산 및 낙산이지만, 생후 10일 무렵까지는 초산의 비율이 높아 초산/프로피온산비가 3~4이다. 그 후 프로피온산과 낙산의 생성이 높아져 포유기간 중 초산/프로피온산비는 1.5 정도를 유지하게 된다. 포유기간 중 초산/프로피온산비는 성우(2~3)에 비해 낮은데, 이는 포유 송아지에서는 조사료 섭취 비율이 성우에 비해 낮고 스타터에서 유래하는 전분 발효가 왕성하게 일어나기 때문이다.</span></p>
