<p class="bx-num"><span class="bxn" data-n="216">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-5 감염증과 태아 이상</div>
<p class="bx-num"><span class="bxn" data-n="217">•</span><span>임신우에 바이러스, 세균, 원충, 진균 등 병원미생물이 감염되면 유산, 조산, 사산, 송아지의 선천 이상의 원인이 되는 경우가 있다(표 1-5-1, 표 1-5-2). 이른바 유행성 이상산(異常産)의 발생에는 계절성, 지역성이 동반되는 경우가 있으며, 절지동물 매개 바이러스(아르보바이러스, arbovirus)가 병인인 경우가 많다. 이는 아르보바이러스를 매개하는 등에모기(ヌカカ, Culicoides)나 모기 등 흡혈곤충의 활동이 여름~가을에 활발해져, 그 기간에 전파가 일어나기 쉬워지는 것이 원인으로 생각된다. 또한 아르보바이러스 감염증의 발생은 규슈·오키나와에서 빈도가 높아지고 있다. 한편, 연중 산발적으로 또는 국지적으로 발생하는 유·사산이나 송아지의 선천 이상은 아르보바이러스 이외의 병원체가 관여하고 있을 가능성이 높다. 이상산에 관여하는 병원체의 종류와 각각의 전파 경로는 다양하므로, 이상산의 진단은 임상 증상, 병원체 검색, 역학조사 등의 복합적인 결과에 근거하여 이루어지는 것이 바람직하다. 또한 병원체가 태반을 통과하여 태아에 감염된 경우, 태아에서 부검 및 병리조직학적 소견으로 특징적인 병변이 인정되는 경우가 많아 진단에 도움이 된다. 한편, 급성 열성 질환에서 보이듯이 모우의 상태 악화가 유산의 주요인이 되는 경우도 있다. 본 절에서는 태아기에 발생하는 감염증에 대해 해설한다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">진단에서의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="218">•</span><span>태아 이상에는 다양한 병원체가 관여한다. 또한 유·사산이나 태아 이상은 유전, 영양장애, 내분비장애, 약물이나 화학물질 노출 등 비감염성 요인에 의해서도 일어나므로, 이들과의 감별도 필요하다. 모든 검사를 실시하는 것은 시간과 노력 면에서도, 비용 면에서도 불가능하므로, 증례를 주의 깊게 관찰하고 관련 정보를 음미하여 원인을 어느 정도 추정해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="219">•</span><span>임상 증상만으로 태아 감염증의 원인을 특정하는 것은 어렵기 때문에, 확정 진단에는 유산 태아나 선천 이상 송아지 등으로부터의 병원체 또는 그에 대한 특이항체의 검출이 필요하다. 나아가 해당 병원체의 관여를 병리조직학적으로 뒷받침하는 것도 중요하다. 이들 검사에서 만족스러운 결과를 얻으려면 검사에 적합한 재료를 신속히 채취해야 한다. 채재(採材)는 환경이나 목적 장기 이외로부터의 미생물 혼입을 최대한 막도록 신중하게 해야 한다. 병원체 분리나 유전자 검출에는 가능한 한 신선한 재료를 사용하고, 수송과 보존에 유의한다. 일반적으로 불활화를 피하기 위해 바이러스 분리용 재료는 -80℃ 이하로 보관하고, 동결·융해의 반복을 피해야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="220">•</span><span>표 1-5-1 소의 유산, 조산, 사산, 선천 이상에 관련된 주요 병원체.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>병원체</th><th>태아에 관련된 주요 증상</th></tr><tr><th>■ 아르보바이러스</th><td style="text-align:left"></td></tr><tr><th>아카바네바이러스</th><td style="text-align:left">유산, 조산, 사산, 선천 이상</td></tr><tr><th>아이노바이러스</th><td style="text-align:left">유산, 조산, 사산, 선천 이상</td></tr><tr><th>피톤바이러스</th><td style="text-align:left">선천 이상¹⁾</td></tr><tr><th>사슈페리바이러스</th><td style="text-align:left">선천 이상</td></tr><tr><th>샤몬다바이러스</th><td style="text-align:left">선천 이상</td></tr><tr><th>추잔바이러스</th><td style="text-align:left">선천 이상</td></tr><tr><th>디아귤라바이러스</th><td style="text-align:left">선천 이상</td></tr><tr><th>블루텅바이러스</th><td style="text-align:left">선천 이상</td></tr><tr><th>유행성출혈병바이러스</th><td style="text-align:left">유산, 사산</td></tr><tr><th>■ 비아르보바이러스</th><td style="text-align:left"></td></tr><tr><th>소헤르페스바이러스 1형</th><td style="text-align:left">유산</td></tr><tr><th>소바이러스성설사바이러스</th><td style="text-align:left">유산, 사산, 선천 이상</td></tr><tr><th>파라인플루엔자바이러스 3형</th><td style="text-align:left">유산</td></tr><tr><th>소파보바이러스</th><td style="text-align:left">유산</td></tr><tr><th>소엔테로바이러스</th><td style="text-align:left">유산</td></tr><tr><th>■ 세균</th><td style="text-align:left"></td></tr><tr><th>브루셀라</th><td style="text-align:left">유산, 사산</td></tr><tr><th>캄필로박터</th><td style="text-align:left">유산</td></tr><tr><th>리스테리아</th><td style="text-align:left">유산, 사산</td></tr><tr><th>살모넬라</th><td style="text-align:left">유산, 사산</td></tr><tr><th>클라미디아</th><td style="text-align:left">유산, 사산</td></tr><tr><th>콕시엘라</th><td style="text-align:left">유산, 사산</td></tr><tr><th>■ 원충</th><td style="text-align:left"></td></tr><tr><th>네오스포라</th><td style="text-align:left">유산, 사산, 선천 이상</td></tr><tr><th>트리코모나스</th><td style="text-align:left">유산, 사산</td></tr><tr><th>■ 진균</th><td style="text-align:left"></td></tr><tr><th>아스페르길루스</th><td style="text-align:left">유산, 사산</td></tr><tr><th>칸디다</th><td style="text-align:left">유산, 사산</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="221">•</span><span><span style="color:var(--ink-soft)">1) 최근 유산 증례에서 피톤바이러스를 검출한 것이 보고되었다.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="222">•</span><span>선천 이상 송아지의 혈청학적 진단에서는 이행항체의 영향을 배제하기 위해 초유나 초유제제 섭취 전에 채취한 혈청이나 뇌척수액 등을 사용할 필요가 있다. 또한 모우나 동거우의 혈청을 이용한 항체검사로 우군 내 병원체의 만연 상황을 확인할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="223">•</span><span>개별 증례에 관련된 정확한 기록도 원인 규명에 빠뜨릴 수 없는 정보이다. 임신 월령과 유산 태아의 상태, 질병 발생 연월일, 모우의 연령, 산력, 백신 접종력, 사양관리 정보, 동일 농장 내 우군의 백신 접종 상황, 질병 발생 이력, 이동력과 도입원의 질병 발생 상황 등이 진단의 참고가 된다. 급여 중인 사료와 음수, 분변이나 사육환경으로부터의 병원체 검출도 질병의 발생 원인을 규명하고 이후의 방제 대책을 세우는 데 중요하다. 또한 미끼소(おとり牛)<sup>주1)</sup>를 이용한 소 아르보바이러스 감염증의 항체 모니터링도 이상산의 원인을 추정하는 데 도움이 되는 정보이다. 병원체의 혈청형이나 유전자형 구별도 유래와 감염의 확산을 아는 데 중요한 단서가 된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="224">•</span><span>※ 주1) 미끼소: 각 도도부현에서는 전년도 아르보바이러스 전파 시기 이후에 태어난 소를 농가의 협력을 얻어 항체조사에 공시하고 있다. 전국에 약 3,000두 정도의 소가 배치되어, 여름부터 가을에 걸쳐 4~5회 정도 채혈하고, 분리한 혈청을 이용하여 각종 아르보바이러스에 대한 항체 양전 상황을 조사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="225">•</span><span>표 1-5-2 각 바이러스에 의한 선천 이상 송아지의 특징.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>바이러스</th><th>발생 시기</th><th>수무뇌증</th><th>내수두증</th><th>소뇌형성부전</th><th>관절만곡증</th></tr><tr><th>아카바네바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">×</td><td style="text-align:left">○</td></tr><tr><th>아이노바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">○</td></tr><tr><th>피톤바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">×</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">○</td></tr><tr><th>샤몬다바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">×</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">○</td></tr><tr><th>추잔바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">○</td><td style="text-align:left">×¹⁾</td><td style="text-align:left">○</td><td style="text-align:left">×</td></tr><tr><th>디아귤라바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">○</td><td style="text-align:left">×</td><td style="text-align:left">○</td><td style="text-align:left">×</td></tr><tr><th>블루텅바이러스</th><td style="text-align:left">겨울~이듬해 봄</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">×</td></tr><tr><th>소바이러스성설사바이러스</th><td style="text-align:left">연중</td><td style="text-align:left">×</td><td style="text-align:left">○</td><td style="text-align:left">○</td><td style="text-align:left">×</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="226">•</span><span>(병리 소견: 수무뇌증, 내수두증, 소뇌형성부전, 관절만곡증)</span></p>
<p class="bx-num"><span class="bxn" data-n="227">•</span><span><span style="color:var(--ink-soft)">1) 드물게 보이는 경우가 있다.</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">감시·예방에서의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="228">•</span><span>아카바네병 등 아르보바이러스 감염증의 예방에서는 매개 절지동물에 의한 전파가 일어나기 쉬워지는 초여름 전에 번식용 암소에 백신을 접종한다. 등에모기나 모기 같은 매개 절지동물은 살충제 살포에 의한 근절이나 기피제에 의한 흡혈 저지가 어렵고, 단기간에 광범위하게 아르보바이러스를 전파하므로, 백신을 사용하지 않을 경우 큰 피해가 발생할 가능성이 있다. 한편, 축산 환경에 널리 존재하는 병원체는 사양위생관리와 소독 등을 철저히 함과 동시에, 백신 접종이나 보균우의 적발, 치료나 도태 등으로 만연을 방지할 수 있다. 특히 세균이나 진균 등은 그것들이 증식·상재할 수 있는 환경을 가능한 한 만들지 않는 것이 중요하다. 더불어 가축의 이동이나 사료 반입, 사람과 물건의 출입에 의한 농장 내 병원체 반입에도 충분히 주의해야 한다. 또한 국내에 존재하지 않는 병원체는 적절한 검역체제 유지로 침입을 막는 것이 긴요하다. 나아가 국내 신규 또는 미지의 병원체 침입을 시야에 넣고, 감시체제의 충실과 차세대 시퀀서<sup>주2)</sup> 등 신기술을 도입한 고감도 검출법을 정비할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="229">•</span><span>※ 주2) 차세대 시퀀서: 기지의 유전자 배열을 필요로 하지 않고, 망라적으로 다검체이면서 다량의 유전자 배열을 결정할 수 있다. 최근에는 미지 병원체의 게놈 정보 취득이나 생물 또는 환경 중 미생물총 해석에도 이용된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">바이러스 감염증</div>
<p class="bx-num"><span class="bxn" data-n="230">•</span><span>태아기에 중요한 바이러스 감염증은 아르보바이러스에 의한 것과 그 이외의 것으로 크게 나눌 수 있다. 비아르보바이러스성 바이러스에서는 접촉이나 비말을 통한 경구, 경비로 감염이 확산되는 것이 일반적이며, 소독이나 격리 같은 방역 조치와 위생관리를 철저히 함으로써 농장 내 만연이나 다른 농장으로의 확대를 막을 수 있다. 한편, 아르보바이러스를 매개하는 등에모기나 모기 등은 농장 내에 쉽게 침입하며, 방제나 이들에 의한 흡혈을 저지하는 것은 매우 어렵다. 또한 비상 능력을 갖고 있고 바람 등에 의해 수동적으로 광범위하게 확산되기 때문에, 단기간에 광범위하게 바이러스를 전파하는 것으로 알려져 있다. 따라서 감염 자체를 막기는 어려우므로, 번식용 모우에 대한 백신 접종에 의한 예방이 주된 대책이 된다. 이처럼 같은 바이러스 감염증이라도 바이러스의 전파 경로와 방역·예방 조치가 다르므로, 대책 수립에는 주의가 필요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">아르보바이러스 감염증</div>
<p class="bx-num"><span class="bxn" data-n="231">•</span><span>아르보바이러스(arbovirus)란 매개 절지동물(모기, 참진드기, 등에모기 등)과 척추동물 숙주 양쪽에서 증식하며, 주로 매개 절지동물의 흡혈 활동에 의해 척추동물 숙주 간에 전파가 일어나는 바이러스의 총칭이다. 이들 바이러스는 특징적인 감염환을 가지므로 하나로 묶여 있지만, 실제로는 다양한 분류군의 바이러스를 포함한다. 또한 같은 분류군의 바이러스라도 매개 절지동물과의 공진화<sup>주3)</sup>의 결과, 한정된 매개종만이 개별 바이러스를 효율적으로 전파하는 경우가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="232">•</span><span>국내에서 이상산을 일으키는 중요한 아르보바이러스 감염증으로는 아카바네병, 아이노바이러스 감염증, 추잔병을 들 수 있다. 또한 해외에서는 블루텅바이러스에 의한 송아지 선천 이상의 발생이 인정되고 있다. 임신우에 대한 소유행열바이러스 감염에 의해서도 낮은 빈도의 유산 발생이 보고되고 있으나, 모우의 상태 악화가 원인으로 생각된다. 한편, 1990년대 중반 이후 국내 신규로 생각되는 아르보바이러스의 관여가 의심되는 유·사산이나 송아지 선천 이상의 증례가 보고되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="233">•</span><span>소에 감염하여 이상산의 원인이 되는 아르보바이러스의 대부분은 등에모기에 의해 매개된다. 등에모기과(Ceratopogonidae)에는 100 이상의 속이 포함되어 있는데, 그중 Culicoides속(그림 1-5-1)에는 소 등 반추수에서 흡혈하는 종이 많고, 그 일부가 아르보바이러스를 매개한다. 국내에서는 약 90종의 Culicoides속 등에모기가 확인되어 있으나, 이들의 분포 지역, 서식 환경, 발생 장소, 흡혈원 등은 종에 따라 다르고 다양하다. 규슈 이북에서는 등에모기 성충의 활동이 겨울철에는 거의 보이지 않으며, 유충이 월동하는 것으로 생각된다. 일반적으로 봄에 기온 상승과 함께 우화가 시작되고, 발생량은 여름~가을에 걸쳐 많아진다. 축사로의 등에모기 비래는 새벽이나 해질녘 또는 야간이 주이며, 그 미소성(체장 1~3mm)과 맞물려 존재가 별로 인식되지 않는다. 암컷만이 난소를 성숙시키는 영양을 얻기 위해 흡혈한다. 바이러스를 매개하는 종은 여러 차례에 걸쳐 흡혈과 산란을 반복하는데, 그 사이에 아르보바이러스의 전파가 일어난다.</span></p>
<p class="bx-num"><span class="bxn" data-n="234">•</span><span>혈청역학적 조사나 분리 바이러스를 이용한 분자역학적 해석은, 소에 감염하는 아르보바이러스의 대부분이 국내에 상재화하지 않고 여름철에 침입하여 일과성 감염 확대를 일으킨다는 것을 시사한다. 여름철에는 하층 제트기류에 의해 많은 곤충이 대륙이나 저위도 섬에서 운반되어 오는 것으로 알려져 있는데, 그중에는 바이러스에 감염된 등에모기가 포함되어 있어 일본 도달 후 전파를 일으키는 것으로 생각된다. 그 후 국내에 서식하는 등에모기에 의해 감염이 확산되어 가는 것으로 추측된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="235">•</span><span><i>그림 1-5-1 아르보바이러스의 벡터인 모기(왼쪽)와 등에모기(오른쪽). 몸 크기가 다른 점에 주의.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="236">•</span><span>※ 주3) 공진화: 한쪽 또는 양쪽 생물학적 요인의 영향에 의해 다른 생물의 생물학적 특성을 변화시키는 것. 아르보바이러스의 경우, 개별 매개 절지동물에서의 증식과 그에 의한 전파에 적합해진 결과, 각 아르보바이러스에 대해 한정된 매개종만이 감수성을 갖고 척추동물 숙주에 바이러스를 매개할 수 있게 되었다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">아카바네병</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="237">•</span><span><b>발생</b></span></p>
<p class="bx-num"><span class="bxn" data-n="238">•</span><span>페리부니아바이러스과 오르토부니아바이러스속 아카바네 오르토부니아바이러스종(Peribunyaviridae, Orthobunyavirus, Akabane orthobunyavirus)으로 분류되는 아카바네바이러스에 의해, 반추동물에서 태내 감염에 의해 일어나는, 유산, 조산, 사산, 선천 이상 송아지의 만출을 주징으로 하는 감염증이다. 국내에서는 신고전염병(届出伝染病)으로 지정되어 있다. 과거에 오르토부니아바이러스속은 보체결합시험에 의한 교차성에 근거하여 18개 혈청군으로 분류되었고, 아카바네바이러스를 포함하는 그룹을 「심부 혈청군(Simbu serogroup)」이라 칭했다. 공식적으로는 혈청군에 의한 분류가 사용되지 않게 되었으나, 호칭 자체는 현재도 편의상 사용되고 있다. 1959년에 군마현 다테바야시시 아자아카바네(字赤羽)에서 채집된 긴이로야부카(Aedes vexans)에서 처음 분리된 것이 명칭의 유래이다. 분리 후 한동안은 질병과의 관련이 불명으로 여겨졌다. 그러나 1972~1975년에 규슈에서 도호쿠에 걸쳐 4만 2,000두에 이르는 소의 이상산이 발생했을 때, 혈청역학적 조사 결과 선천 이상 송아지의 다수에서 아카바네바이러스에 대한 중화항체가 인정됨에 따라 원인 바이러스로 여겨졌고, 아카바네바이러스에 의한 이상산은 「아카바네병」으로 불리게 되었다. 그 후 임신우에 대한 아카바네바이러스 감염 실험에</span></p>
<p class="bx-num"><span class="bxn" data-n="239">•</span><span>의해 선천 이상 송아지의 만출이 재현되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="240">•</span><span><b>병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="241">•</span><span>성우에 아카바네바이러스가 감염된 경우, 보통 단기간의 발열이나 백혈구감소증 이외에 눈에 띄는 증상을 보이지 않는다. 바이러스혈증은 2~5일 정도이며, 중화항체(IgG)의 산생에 의해 혈류 중에서 바이러스는 검출되지 않게 된다. 또한 자연 감염에 의해 종생 면역을 획득하는 것으로 생각된다. 임신우에서는 바이러스가 혈류를 통해 태반을 통과하여 태아에 감염되는 경우가 있다. 태아 감염이 성립하더라도 불현성부터 유산까지 그 증상은 다양하다. 급성 감염으로 태아가 사망하면 유산이나 사산이 되지만, 태아가 감염을 이겨낸 경우에는 임신 만기에 만출된다. 감염에 의해 중추신경이나 골격근 등에 장애가 생긴 경우에는 그 정도에 따라 다양한 선천 이상이 인정된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="242">•</span><span>아카바네바이러스에 감염된 태아에서는 바이러스가 거의 전신의 조직에서 분리된다. 또한 감염 태아에서는 비화농성 뇌척수염이나 다발성 근염이 인정된다. 유산이나 사산을 면한 태아에서는 이들 원발성 병변에서 유래하는 후유적 병변이 더해져 현저한 선천 이상이 일어난다. 선천 이상의 양태와 정도는 감염 시 태아의 태령에 따라 변화하는 것으로 생각된다. 선천 이상 송아지에서는 사지 관절의 만곡이나 구축, 척주의 S자형 만곡이나 사경 등의 체형 이상(관절만곡증)을 동반하는 경우가 많다. 부검 소견에서는 대뇌 외투의 막상 비박화 또는 결손과 다량의 뇌척수액 저류(수무뇌증), 뇌실 확장(내수두증), 대뇌 내부의 공극(공뇌증)이 보이고, 병리조직학적 검사에서는 척수 복각 신경세포의 감소 또는 소실, 골격근 근섬유의 대소부동·왜소화(왜소근증)가 확인된다. 이들 병변으로부터 아카바네병에 의한 선천 이상은 관절만곡증·수무뇌증 증후군(Arthrogryposis-Hydranencephaly syndrome: AH 증후군)으로 특징지어진다. 한편, 골격 자체에는 이상이 인정되지 않는다. 체형 이상을 보이는 태아의 분만 시에는 태위나 태세의 이상으로 종종 난산이 되어 조력이 필요한 경우도 있다. 또한 체형 이상이 없는 산자가 허약이나 맹목, 발육불량을 보이는 경우도 있다. 바이러스의 전파는 등에모기 발생량이 많은 여름~가을에 걸쳐 일어나며, 유산은 전파 후 그다지 간격을 두지 않고 발생한다. 한편, 선천 이상 송아지의 만출은 감염 시기나 감염 시 태령의 영향을 받지만, 겨울~이듬해 봄에 발생한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="243">•</span><span>종래 아카바네병에서는 주로 태아 감염에 의한 이상산이 문제가 되어 왔다. 그러나 1984년에는 아카바네바이러스의 생후 감염에 의한 송아지 뇌염의 소규모 발생이 인정되었고, 2006년에는 규슈, 2011년에는 주고쿠·시코쿠를 중심으로 약령우에서 뇌척수염이 다발했다. 이환우에서는 기립불능이나 운동실조, 진전, 안구진탕, 후궁반장, 이상흥분 등 중추신경 장애에 의한 증상이 발현하며, 대부분의 경우 회복은 기대할 수 없다. 또한 생후 감염례의 중추신경 조직에서 분리 또는 검출된 아카바네바이러스는 특정 유전자 그룹에 속해 있어, 바이러스 게놈상의 변이가 신경병원성을 높이고 병태를 변화시킨 것으로 생각된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="244">•</span><span><b>역학</b></span></p>
<p class="bx-num"><span class="bxn" data-n="245">•</span><span>전국적으로 실시되고 있는 미끼소를 이용한 항체조사에서는, 주로 서일본을 중심으로 거의 매년같이 아카바네바이러스에 대한 항체 양전이 인정된다. 대부분의 경우 양전은 처음에 규슈에서 시작되어 그 후 동쪽으로 확대되는 경향이 있다. 한편, 백신의 개발·보급에 의해 이상산의 발생 규모는 작아지는 경향이 있지만, 백신 접종률이 낮은 지역에 바이러스가 침입하면 비교적 큰 규모의 유행이 일어나는 경우가 있다. 1985~1986년 도호쿠에서의 아카바네병 유행에서는 이와테현에서만 6,500두에 이르는 이상산 발생이 보고되었다. 또한 1998~1999년에는 전국에서 1,000두를 넘는 규모의 이상산 유행이 있었고, 홋카이도에서도 처음으로 아카바네병 발생이 확인되었다. 2010년에는 항체 양전이 처음에 이와테현과 미야기현에서 확인되어 아오모리현을 제외한 도호쿠 지방으로 감염이 확산되었고, 2011년 봄까지 200두를 넘는 이상산이 보고되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="246">•</span><span>아카바네바이러스는 당초 모기에서 분리되었으나, 그 후 국내외 조사에서 많은 바이러스주가 Culicoides속 등에모기에서 분리되어, 등에모기가 매개 절지동물로 생각되게 되었다. 가고시마시에 소재한 농연기구 동물위생연구부문 규슈연구거점에서는 장기간에 걸쳐 등에모기로부터의 바이러스 분리를 실시해 왔는데, 아카바네바이러스는 채집된 십수 종의 등에모기 중 우시누카카(Culicoides oxystoma)에서만 분리되었다. 따라서 국내에서는 이 종이 아카바네바이러스의 주요 매개종으로 추측되고 있다. 또한 우시누카카의 국내 분포가 간토 이서에 국한되어 있으므로, 아카바네병의 유행 지역은 통상 이 종의 분포와 겹치는 것으로 시사되어 왔다. 그러나 도호쿠에서의 아카바네바이러스 전파를 설명하려면 우시누카카의 일시적 분포 확대나 상재화, 또는 보다 한랭지에 적응한 다른 종의 관여를 고려할 필요가 있었다. 실험실 내 감염 실험을 통해 우시누카카 이외의 국내 분포종도 흡혈에 의해 아카바네바이러스에 감염된다는 것이 확인되었고, 2010년 도호쿠 지방에서의 조사에서는 그중 시가누카카(Culicoides tainanus)와 호시누카카(Culicoides punctatus)가 우사에 비래하는 종류상 가운데 큰</span></p>
<p class="bx-num"><span class="bxn" data-n="247">•</span><span>비율을 차지하고 있었다. 한편, 채집 개체 중에 우시누카카는 포함되어 있지 않아, 시가누카카나 호시누카카 등이 아카바네바이러스 전파에서 주요한 역할을 담당했다고 생각되었다. 이들 종은 규슈에서 홋카이도까지 널리 분포하므로, 바이러스의 침입이 일어나면 전국적으로 전파 위험이 있음이 시사되었다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="248">•</span><span><i>그림 1-5-2 아이노바이러스 감염에 의한 선천 이상 사산 송아지(A)와 수무뇌증(B) (컬러 구회 10페이지; 원도: 津田知幸)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="249">•</span><span><b>진단·치료</b></span></p>
<p class="bx-num"><span class="bxn" data-n="250">•</span><span>이상산에서는 태아, 선천 이상 송아지의 혈청이나 체액을 이용한 중화항체 검출로 진단한다. 진단 시설에서의 항체 검출은 일반적으로 햄스터 폐 유래 배양세포를 이용한 바이러스 중화시험으로 실시한다. 이행항체의 영향이 있으므로 초유를 섭취한 개체에서는 진단을 확정할 수 없다. 유산 태아나, 감염 후 재태 기간이 비교적 짧은 선천 이상 송아지에서는 RT-PCR이나 실시간 RT-PCR에 의한 바이러스 유전자 검출이 가능하다. 치료는 하지 않는다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="251">•</span><span><b>예방</b></span></p>
<p class="bx-num"><span class="bxn" data-n="252">•</span><span>국내에서는 아카바네병 예방을 위해 단미 생백신 및 다른 이상산 관련 아르보바이러스와 혼합한 불활화백신이 시판되고 있다. 생백신은 연 1회, 불활화백신은 첫해에 2회, 이후 매년 1회씩 번식용 암소에 접종할 필요가 있다. 접종은 등에모기의 활동이 왕성해져 전파가 일어나기 쉬워지기 전에 실시해야 하는데, 등에모기의 활동 시기는 지역에 따라 다르므로 주의가 필요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">아이노바이러스 감염증</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="253">•</span><span><b>발생</b></span></p>
<p class="bx-num"><span class="bxn" data-n="254">•</span><span>페리부니아바이러스과 오르토부니아바이러스속 아이노 오르토부니아바이러스종(Peribunyaviridae, Orthobunyavirus, Aino orthobunyavirus)으로 분류되는 아이노바이러스에 의해, 반추동물에서 태내 감염에 의해 일어나는 유산, 조산, 사산, 선천 이상 송아지의 만출을 주징으로 하는 감염증이다. 국내에서는 신고전염병으로 지정되어 있다. 아이노바이러스는 1964년에 나가사키현 아이노정(현 운젠시)에서 작은빨간집모기(Culex tritaeniorhynchus)에서 처음 분리되었으며, 아카바네바이러스와 마찬가지로 심부 혈청군으로 분류되어 있었다. 1972~1975년 아카바네병 유행 시 선천 이상 송아지 혈청의 일부가 아이노바이러스에 대한 중화항체를 보유하는 것이 나타나, 이 바이러스의 이상산 관여가 시사되었다. 그 후 아이노바이러스의 관여가 의심되는 소의 이상산이 산발적으로 인정되었다. 1995~1996년에 걸쳐 서일본에서 아이노바이러스의 관여가 의심되는 700두 이상의 이상산이 발생했고, 그때 유산 태아에서 이 바이러스가 분리되었다. 후에 아이노바이러스를 실험적으로 모우의 자궁 내 태아에 접종했을 때 선천 이상이 재현되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="255">•</span><span><b>병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="256">•</span><span>아이노바이러스에 감염된 태아에서의 임상적 변화는 아카바네병과 유사하다. 유산, 조산, 사산과 함께 선천 이상 송아지에서는 왜소근증을 동반한 관절만곡증이나 수무뇌증이 높은 비율로 인정된다(그림 1-5-2). 한편, 아카바네병과 달리 소뇌형성부전도 많은 증례에서 보인다. 이들 병징으로부터 아이노바이러스 감염증에서의 선천 이상은 관절만곡증·수무뇌증·소뇌형성부전 증후군(Arthrogryposis, Hydranencephaly and Cerebellar Hypoplasia syndrome: AH·CH 증후군)으로 특징지어진다. 실험 감염에서 임신우의 정맥에 바이러스를 접종한 경우 태아로의 감염은 인정되지 않았으나, 전술한 바와 같이</span></p>
<p class="bx-num"><span class="bxn" data-n="257">•</span><span>자궁 내 태아에 접종했을 때는 선천 이상이 재현되었으므로, 태반 통과능이 비교적 낮은 것으로 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="258">•</span><span><i>그림 1-5-3 추잔병의 선천 이상 송아지(A)와 수무뇌증·소뇌 왜소화(B) (컬러 구회 10페이지; 원도: 津田知幸)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="259">•</span><span><b>역학</b></span></p>
<p class="bx-num"><span class="bxn" data-n="260">•</span><span>미끼소를 이용한 항체조사에서는 아이노바이러스에 대한 항체 양전이 서일본에서 인정되지만, 아카바네바이러스만큼 빈도가 높지는 않다. 또한 지금까지 아이노바이러스 감염증의 발생은 긴키 이서에서만 보고되었다. 1998~1999년 및 2002~2003년에 걸쳐서도 서일본에서 100두 전후의 아이노바이러스 감염증 발생이 있었다. 아이노바이러스 감염이 전국적으로 확대되지 않는 것은 국내 매개종과의 친화성 문제로 생각된다. 아이노바이러스의 매개 절지동물도 아카바네바이러스와 마찬가지로 Culicoides속 등에모기로 생각된다. 국내에서는 지금까지 아이노바이러스가 우시누카카 및 호시누카카에서 분리되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="261">•</span><span><b>진단·치료</b></span></p>
<p class="bx-num"><span class="bxn" data-n="262">•</span><span>이상산에서는 태아, 초유 미섭취 선천 이상 송아지의 혈청이나 체액을 이용한 중화항체 검출로 진단한다는 점에서 아카바네병과 동일하다. 바이러스 중화시험에서는 아카바네바이러스와의 교차성은 인정되지 않는다. 유산 태아나, 감염 후 재태 기간이 비교적 짧은 선천 이상 송아지에서는 RT-PCR이나 실시간 RT-PCR에 의한 바이러스 유전자 검출이 가능하다. 또한 전술한 바와 같이 유산 태아에서 바이러스를 분리한 예도 있다. 치료는 하지 않는다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="263">•</span><span><b>예방</b></span></p>
<p class="bx-num"><span class="bxn" data-n="264">•</span><span>국내에서는 아이노바이러스 감염증 예방을 위해 불활화백신이 개발되어, 아카바네병, 추잔병 등과의 혼합백신이 시판되고 있다. 접종 시 주의점은 아카바네병과 같다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">추잔병</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="265">•</span><span><b>발생</b></span></p>
<p class="bx-num"><span class="bxn" data-n="266">•</span><span>레오바이러스과 오르비바이러스속 팔리암바이러스종(Reoviridae, Orbivirus, Palyam virus)에 속하는 추잔(카스바)바이러스(Chuzan virus)에 의해, 소에서 태내 감염에 의해 일어나는 선천 이상 송아지의 만출을 주징으로 하는 감염증이다. 국내에서는 신고전염병으로 지정되어 있다. 추잔바이러스의 명칭은 최초 분리지인 가고시마시 나카야마정(中山町)에서 유래한다. 추잔바이러스는 1985년에 소의 혈액 및 우시누카카에서 분리되어, 1985~1986년에 걸쳐 남규슈를 중심으로 2,400두를 넘는 대규모 이상산 유행의 원인으로 여겨졌다. 후에 추잔바이러스는 1956년에 인도에서 니세시로하시이에카(Cx. vishnui)에서 분리된 카스바바이러스 및 1984년에 가고시마에서 우시누카카에서 분리된 Kagoshima virus와 혈청학적으로 동일하다는 것이 확인되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="267">•</span><span><b>병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="268">•</span><span>성우에서는 눈에 띄는 임상 증상이 보이지 않고, 일과성 백혈구감소증이 인정될 뿐이다. 한편, 다른 오르비바이러스와 마찬가지로 바이러스가 적혈구 표면의 오목한 부분에 부착하여 중화항체에 의한 포착을 면하기 때문에, 바이러스혈증은 장기간(4~8주)에 이른다. 이상 송아지에서는 허약, 기립불능, 보행곤란, 포유력 결여, 맹목, 간헐성 간질양 발작, 연속적인 사지의 회전이나 굴곡, 후궁반장 등의 신경 증상이 보인다. 그러나 아카바네병이나 아이노바이러스 감염증과 달리 체형 이상 등 외모상의 현저한 변화는 인정되지 않는다. 유산·조산의 발생은 극히 적은 것으로 여겨진다. 부검 소견에서는 대뇌 결손과 뇌척수액 저류, 소뇌형성부전이 많은 증례에서 인정된다(그림 1-5-3).</span></p>
<p class="bx-num"><span class="bxn" data-n="269">•</span><span>병리조직학적 관찰에서는 대뇌 잔존부에서 신경망의 소성화(疎性化)나 세포 침윤, 석회 침착이, 소뇌에서 수질과 과립층의 비박화, 푸르키녜세포 감소가 관찰된다. 이들 병징으로부터 추잔병에서의 선천 이상은 수무뇌증·소뇌형성부전 증후군(Hydranencephaly and Cerebellar Hypoplasia syndrome: HCH 증후군)으로 특징지어진다. 또한 임신우에 대한 추잔바이러스 접종으로 같은 증상이 재현되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="270">•</span><span><b>역학</b></span></p>
<p class="bx-num"><span class="bxn" data-n="271">•</span><span>1985년 항체조사에서는 추잔바이러스 감염이 주고쿠·시코쿠까지 확산되어 있었다. 그러나 이후 대규모 유행은 없고, 추잔병 발생은 규슈·오키나와에서 산발적으로 인정될 뿐이다. 다만 최근 오키나와나 중국 본토에서 추잔바이러스가 분리되고 있으므로, 일본 주변에 만연하여 침입 위험이 계속되고 있는 것으로 생각된다. 팔리암바이러스종의 다른 바이러스와 마찬가지로 추잔바이러스는 Culicoides속 등에모기에 의해 매개되는 것으로 생각된다. 지금까지 추잔바이러스는 우시누카카에서만 분리되었다. 바이러스는 등에모기 발생량이 많은 여름부터 가을에 걸쳐 전파되고, 선천 이상 송아지의 만출은 겨울부터 이듬해 봄에 일어나는 것으로 생각된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="272">•</span><span><b>진단·치료</b></span></p>
<p class="bx-num"><span class="bxn" data-n="273">•</span><span>진단은 선천 이상 송아지의 혈청이나 체액을 이용한 항체 검출로 실시한다. 항체 검출에는 바이러스 중화법이 사용된다. 또한 이행항체의 영향이 있으므로 초유를 섭취한 개체에서는 진단을 확정할 수 없다. 후술하는 팔리암바이러스종의 디아귤라바이러스(D'Aguilar virus)와는 혈청학적으로 교차하므로 진단 시 주의가 필요하다. 치료는 하지 않는다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="274">•</span><span><b>예방</b></span></p>
<p class="bx-num"><span class="bxn" data-n="275">•</span><span>국내에서는 추잔병 예방을 위해 불활화백신이 개발되어, 아카바네바이러스, 아이노바이러스 등의 백신과의 혼합 제품이 시판되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">블루텅</div>
<p class="bx-num"><span class="bxn" data-n="276">•</span><span>레오바이러스과 오르비바이러스속 블루텅바이러스종(Reoviridae, Orbivirus, Bluetongue virus) 감염에 의한 반추동물의 질병이다. 국제수역사무국(OIE)의 리스트 질병이며, 국내에서는 신고전염병으로 지정되어 있다. 블루텅바이러스는 27 이상의 혈청형으로 구성되며, 그중 국내에서는 6개 혈청형(2, 3, 9, 12, 16 및 21)이 분리되었다. 또한 Culicoides속 등에모기가 주요 매개 절지동물로 생각된다. 일반적으로 소에서는 불현성 경과를 거치는 경우가 많지만, 드물게 바이러스의 태내 감염으로 수무뇌증을 보인 선천 이상 송아지가 만출되는 것이 보고되어 있다. 2006년 이후 유럽에서는 블루텅바이러스 혈청형 8의 감염이 확산되어 송아지 선천 이상 증례가 산견되었다. 국내에서는 블루텅바이러스에 의한 선천 이상 증례는 보고되지 않았다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">이상산과의 관련이 의심되는 기타 아르보바이러스</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="277">•</span><span><b>오르토부니아바이러스</b></span></p>
<p class="bx-num"><span class="bxn" data-n="278">•</span><span>국내에서는 아카바네바이러스, 아이노바이러스 이외에 심부 혈청군으로 분류되어 있던 3종의 오르토부니아바이러스가 분리되었다. 피톤 오르토부니아바이러스종(Peaton orthobunyavirus)에 속하는 피톤바이러스(Peaton virus)는 1976년에 호주에서 소의 혈액과 등에모기에서 처음 분리되었다. 국내에서는 1999년에 규슈에서 등에모기와 미끼소로부터 피톤바이러스가 분리되었고, 이듬해 봄에 만출된 선천 이상 송아지에서 감염이 확인되었다. 1996~2016년 사이에 규슈·오키나와를 중심으로 31례의 피톤바이러스가 관여하는 선천 이상 송아지 증례가 보고되었다. 선천 이상 송아지에서는 사지의 굴곡이나 신전, 척주의 S자형 만곡 등이 높은 빈도로 인정되었으나, 수무뇌증은 거의 없고 대신 측뇌실 확장이나 소뇌형성부전이 보였다. 또한 병리조직학적으로는 척수 복각 신경세포의 감소 또는 소실이 관찰되는 것 외에, 골격근의 감소·소실과 지방조직으로의 치환이 특징적이었다. 최근에는 피톤바이러스가 유산 증례에서도 검출되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="279">•</span><span>1999년에는 오카야마현에서 슈말렌베르크 오르토부니아바이러스종(Schmallenberg orthobunyavirus)에 속하는 사슈페리바이러스(Sathuperi virus)가 소의 혈액에서 분리되었다. 사슈페리바이러스는 1957년에 인도에서 모기로부터 처음 분리되었고, 그 후 나이지리아에서의 분포가 확인되어 있었다. 2006~2007년에 걸쳐 규슈·오키나와에서 사슈페리바이러스가 다시 분리되었고, 소수의 선천 이상 송아지에서 이 바이러스에 대한 중화항체가 검출되었다. 나아가 2002년에는 규슈에서 슈말렌베르크 오르토부니아바이러스종의 샤몬다바이러스(Shamonda virus)가 분리되었다. 샤몬다바이러스는 1960년대에 나이지리아에서 등에모기와 소에서 분리되었으나, 그 후 이 바이러스에 관한 보고는 없어, 지리적으로 멀리 떨어진 일본에서 분리된 것은 의외였다. 2002년의</span></p>
<p class="bx-num"><span class="bxn" data-n="280">•</span><span>분리 후 소수의 선천 이상 송아지에서 샤몬다바이러스 감염이 보였으나, 2015년에 샤몬다바이러스 감염이 다시 규슈로 확산되어 같은 해 겨울부터 이듬해 봄에 걸쳐 샤몬다바이러스의 관여가 의심되는 송아지 선천 이상이 보고되었다. 선천 이상 송아지는 피톤바이러스에 감염된 선천 이상 송아지와 대체로 같은 병리학적 특징을 갖고 있었다. 이들 3종의 오르토부니아바이러스는 아카바네바이러스와 근연이므로 매우 유사한 기전으로 태아에 병변을 일으키는 것으로 상정되나, 발생 수가 적으므로 기병성은 그다지 강하지 않은 것으로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="281">•</span><span>오르토부니아바이러스는 길이가 다른 3분절의 마이너스 가닥 RNA 게놈(S, M, L)을 가지며, 2종류의 근연 바이러스가 동시에 같은 세포에 감염되면 분절 게놈의 교환(유전자 재집합)이 일어나는 것으로 알려져 있다. 유럽에서는 2010년에 신규 오르토부니아바이러스로 여겨지는 슈말렌베르크바이러스 감염이 확산되어 소, 면양, 산양 등에서 이상산이 다발했다. 바이러스 게놈의 유전자 해석 결과, 슈말렌베르크바이러스의 S 및 L RNA 분절은 샤몬다바이러스와, M RNA 분절은 사슈페리바이러스와 높은 상동성을 갖는 것이 밝혀져, 진화 과정에서 이들 바이러스 사이에 유전자 재집합이 일어났음이 시사되었다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="282">•</span><span><b>디아귤라바이러스</b></span></p>
<p class="bx-num"><span class="bxn" data-n="283">•</span><span>오르비바이러스속 팔리암바이러스종의 혈청형 중 하나이다. 1968년에 호주에서 등에모기로부터 처음 분리되었다. 2001년 겨울~2002년 봄에 걸쳐 맹목이나 대뇌 결손, 소뇌형성부전을 보이는 신생 송아지의 만출이 잇따라 추잔병의 유행이 의심되었다. 그러나 분리된 바이러스는 추잔바이러스가 아니라 디아귤라바이러스였다. 이들 2종의 바이러스는 혈청학적 교차성이 있어 감염항체를 바이러스 중화시험으로 식별하기는 어렵다. 디아귤라바이러스는 규슈·오키나와에 침입을 반복하고 있으며, 이 바이러스의 관여가 의심되는 송아지 선천 이상도 보고되고 있다. 국내에서는 팔리암바이러스종의 또 다른 혈청형인 부닙크릭바이러스(Bunyip Creek virus)도 분리되었으나, 소의 질병과의 관련은 인정되지 않았다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="284">•</span><span><b>유행성출혈병바이러스</b></span></p>
<p class="bx-num"><span class="bxn" data-n="285">•</span><span>1997년에 규슈를 중심으로 1,000두를 넘는 유·사산이 보고되었고, 미끼소와 유산 태아에서 유행성출혈병바이러스(Epizootic hemorrhagic disease virus)가 분리되어 병인임이 시사되었다. 유행성출혈병바이러스는 오르비바이러스속으로 분류되는 등에모기 매개성 아르보바이러스로, 적어도 7개 혈청형으로 구성되어 있는데, 국내에서는 혈청형 1, 2, 6, 7 및 신규 혈청형 "10"이 분리되었다. 연하장애 등을 동반하는 소의 열성 질환의 원인인 이바라키바이러스는 유행성출혈병바이러스 혈청형 2에 포함된다. 유·사산의 원인이 된 바이러스는 이바라키바이러스와 혈청학적 교차성이 인정되어 당초에는 이바라키바이러스 변이주로 여겨졌다. 후에 유행성출혈병바이러스의 혈청형에 관여하는 최외각 단백질(VP2)을 코딩하는 배열이 모든 혈청형에서 결정되었고, 분자계통수 해석으로 1997년 분리주는 혈청형 7임이 밝혀졌다. 유산 태아에서는 현저한 육안적, 병리학적 이상은 인정되지 않으며, 유·사산에 이르는 기전은 불명이다. 예방법이나 치료법은 없다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">아르보바이러스 이외의 바이러스에 의한 감염증</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="286">•</span><span><b>소전염성비기관염(Infectious bovine rhinotracheitis: IBR)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="287">•</span><span>헤르페스바이러스과 알파헤르페스아과 바리셀로바이러스속(Herpesviridae, Alphaherpesvirinae, Varicellovirus)으로 분류되는 소헤르페스바이러스 1형(Bovine alphaherpesvirus 1)을 병인으로 하는 소의 급성 열성 호흡기병으로, 신고전염병으로 지정되어 있다. 임신우에 감염된 경우 태아에 수직 감염하여 유산을 일으킨다. 감염원은 이환우의 비즙, 누액, 생식기 분비물 및 이들에 오염된 먼지나 비말핵 등이며, 접촉이나 흡입에 의해 감염이 성립한다. 또한 감염우와의 교배나 바이러스에 오염된 정액에 의한 인공수정(AI)에 의해서도 감염이 일어난다. 감염을 이겨낸 후에도 바이러스는 신경세포에 잠복하여, 스트레스에 의해 바이러스가 재활성화되어 배출되게 된다. 유산례의 진단에서는 태아의 간, 폐, 비장, 신장 및 태반엽을 재료로 하여 바이러스 분리·검출을 실시한다. 호흡기 증상 등의 발증을 예방하기 위한 약독화 생백신이 실용화되어 있으나, 감염 자체를 막을 수는 없으므로 백신 접종우라도 바이러스가 잠복하여 재활성화에 의해 배출원이 될 가능성이 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="288">•</span><span><b>소바이러스성설사</b></span></p>
<p class="bx-num"><span class="bxn" data-n="289">•</span><span>플라비바이러스과 페스티바이러스속(Flaviviridae, Pestivirus)으로 분류되는 소바이러스성설사바이러스(Bovine viral diarrhea virus: BVDV)를 병인으로 하며, 소에서 설사나 호흡기 증상, 점막병을 주징으로 한다. 신고전염병으로 지정되어 있다. 바이러스는 BVDV-1(Pestivirus A)과 BVDV-2(Pestivirus B)의 2개 유전자형으로 나눌 수 있다. BVDV는 배양세포에 세포변성효과</span></p>
<p class="bx-num"><span class="bxn" data-n="290">•</span><span>(CPE)를 일으키는 세포병원성주(Cytopathogenic: CP)와 비세포병원성주(Noncytopathogenic: NCP)가 있으며, 통상의 감염우에서 NCP주가, 점막병을 발증한 소에서 CP주가 분리된다. 항체가 없는 임신우가 감염되면 태아로의 수직 감염이 일어나 유·사산이나 선천 이상의 원인이 된다. 선천 이상 송아지에서는 신경섬유 수초 형성부전, 소뇌형성부전, 내수두증, 공뇌증, 안장애(백내장이나 망막위축) 등이 보이지만, 체형 이상은 인정되지 않는다. 또한 태아에서의 다양한 병태는 감염 시 태령과 관계가 있다. 면역 기능이 어느 정도 성숙하는(태령 100일 정도) 이전에는 태아가 감염 바이러스에 대해 면역관용 상태가 되어, 바이러스를 체내에 계속 보유하는 지속감염우(PI우)가 된다. PI우는 바이러스를 계속 배설하므로 감수성 소에 대한 감염원이 되며, 일부는 발육불량, 만성 설사나 호흡기 증상을 보이고 점막병을 발증하는 경우도 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="291">•</span><span>바이러스혈증을 일으키고 있는 소나 PI우의 비즙, 타액, 유즙, 정액, 뇨 등을 통해 수평 전파가 일어난다. PI우에서 채취된 난자는 투명대에 손상이 있으면 바이러스에 감염될 가능성이 있으므로 공란은 피해야 한다. 또한 체외수정 등으로 난자를 배양할 때는 배양액에 첨가하는 혈청 등에 바이러스가 혼입되어 있지 않음을 확인할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="292">•</span><span>국내에서는 BVDV를 포함한 호흡기병 혼합 생백신 및 불활화백신이 시판되고 있으나, 수직 감염을 완전히 막기는 어렵다. 지속감염우에 대한 치료는 불가능하며, 조기 적발·도태를 실시할 필요가 있다. 태아 감염의 예방에는 우군 내 지속감염우를 적발·도태함과 동시에 위생관리와 소독을 철저히 하여 바이러스의 침입을 저지하는 것이 가장 유효한 수단이다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="293">•</span><span><b>기타 바이러스</b></span></p>
<p class="bx-num"><span class="bxn" data-n="294">•</span><span>파라인플루엔자바이러스 3형, 소파보바이러스, 소엔테로바이러스 등의 임신우 감염에 의해 유산이 일어나는 것이 알려져 있다. 이들 바이러스는 국내 우군에 널리 분포하며, 연중 산발적으로 또는 국지적으로 발생하는 유산의 원인이 되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">세균 감염증</div>
<p class="bx-num"><span class="bxn" data-n="295">•</span><span>세균에 의한 유·사산은 병원균의 축사 환경이나 사료 오염 등이 원인이 되어 발생하는 경우가 많고, 아르보바이러스에 의한 이상산과 달리 명확한 계절성이나 광범위한 유행은 인정되지 않는다. 또한 환경 상재균이 기회감염을 일으켜 산발적으로 사·유산을 일으키는 경우도 있다. 태반 감염 후 요막수를 통해 태아에 감염이 성립하는 경우, 폐나 소화관, 피부 등에 병변이 인정된다. 일반적으로 농장 내 병원균 반입 방지나 소독 등에 의한 환경 대책이 주된 방제 대책이 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">브루셀라병</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="296">•</span><span><b>발생·병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="297">•</span><span>브루셀라과 브루셀라속(Brucellaceae, Brucella) 중 Brucella abortus의 소 감염에 의해 일어나는, 유산을 주징으로 하는 감염증이다. 가축전염병예방법에서는 법정전염병으로 지정되어 있다. 사람에게도 감염되며, 감염증법에 의한 3종 병원체로 지정되어 있다. 감염우는 대부분의 경우 무증상이지만, 임신우가 감염되면 자궁에서 활발히 증식한다. 또한 태반에서의 균 증식은 태반염을 일으켜 유산의 원인이 된다. 유·사산은 전구 증상 없이 임신 7~8개월에 일어난다. 감염우의 유산 태아, 태반, 자궁 분비액, 유즙 중에는 다수의 균이 존재하며, 감수성 동물에 경구, 경피, 경점막 감염한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="298">•</span><span><b>역학</b></span></p>
<p class="bx-num"><span class="bxn" data-n="299">•</span><span>소 브루셀라병은 전 세계에 널리 분포하지만, 선진국에서는 청정화가 진행되고 있다. 일본 국내에서도 1960년대까지 발생이 계속되었으나, 적발과 도태에 의해 근년에는 발생을 보지 않는다. 오랫동안 착유우, 종모우에 대해 5년에 1회 이상의 검사가 법률로 의무화되어 있었고, 환축 적발 시에는 도태 대상이 되었다. 2018년도부터는 청정도 유지, 청정화 달성을 목표로 육용우도 포함한 전국적인 청정성 확인 서베일런스가 실시되고 있다. 2021년에는 청정화 선언이 이루어졌고, 이후에는 위험도에 따른 청정성 유지 서베일런스로 이행한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="300">•</span><span><b>진단</b></span></p>
<p class="bx-num"><span class="bxn" data-n="301">•</span><span>유산례의 진단에서는 유산한 모우의 자궁 배설물이나 유산 태아의 위 내용물, 비장, 폐, 태막 등을 사용하여 브루셀라균의 분리나 PCR에 의한 검출을 실시한다. 또한 생화학적 성상검사나 균종 특이 PCR로 균의 동정을 실시할 필요가 있다. 혈청 진단에서는 평판응집반응이나 보체결합반응, ELISA가 사용된다. 발생국에서는 예방을 위해 백신이 사용되는 경우도 있으나, 국내에서는 검사와 도태에 의해 청정성의 확인과 유지를 실시하고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">캄필로박터증</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="302">•</span><span><b>발생·병태·역학·진단</b></span></p>
<p class="bx-num"><span class="bxn" data-n="303">•</span><span>캄필로박터과 캄필로박터속(Campylobacteraceae, Campylobacter)의 Campylobacter fetus의</span></p>
<p class="bx-num"><span class="bxn" data-n="304">•</span><span>감염에 의한, 소의 불임이나 임신 중기의 산발성 유산 등 번식장애를 주징으로 하는 감염증으로, 신고전염병으로 지정되어 있다. C. fetus는 그람음성 나선상균으로, 미호기 조건에서 발육하며, C. fetus subsp. venerealis와 C. fetus subsp. fetus의 2개 아종으로 분류된다. 특히 C. fetus subsp. fetus는 태반 친화성이 강하여 유산의 원인이 되기 쉽다. C. fetus subsp. venerealis는 생식기에서 증식하며, 감염 개체와의 자연교배 또는 본균에 오염된 정액이나 기구를 매개로 한 인공수정(AI)에 의해 전파된다. C. fetus subsp. fetus는 장관 내에 보균되어, 오염된 사료나 물에 의해 전파된다. 유산은 임신 중기(태령 4~7개월)에 집중된다. 국내에서는 AI 보급에 따라 C. fetus subsp. venerealis에 의한 감염증은 감소하고 있으나, 근년에도 산발적 발생이 인정된다. 유산례에서는 검사 재료로서 유산 시의 태반, 유산 태아의 제4위, 소장 및 맹장 내용물을 균 분리에 사용한다. 또한 형광항체를 이용한 균 검출도 실시된다. 분리균은 PCR에 의한 동정이 가능하다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="305">•</span><span><b>예방·치료</b></span></p>
<p class="bx-num"><span class="bxn" data-n="306">•</span><span>국내에서는 백신이 사용되지 않으며, 종모우의 정기적인 세균학적 검사에 의한 보균우의 적발과 도태가 추장되고 있다. 암소의 치료에는 항균제 투여와 자궁 세정을 실시한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">리스테리아증</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="307">•</span><span><b>발생·병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="308">•</span><span>리스테리아과 리스테리아속(Listeriaceae, Listeria)의 Listeria monocytogenes에 의한 감염증으로, 소에서는 뇌염, 패혈증, 유산 등을 일으킨다. 신고전염병으로 지정되어 있다. 이 균은 많은 동물에 감염되며, 사람에게 리스테리아증을 일으키는 인수공통감염증의 병인이 된다. L. monocytogenes는 자연환경 중에 널리 분포하며, 오염된 목초나 사료를 섭취함으로써 감염된다. 특히 품질이 열화된 사일리지 중에 대량의 균이 존재하여 주요 감염원이 되는 경우가 있다. 소에서는 임신 후기(6~8개월)에 유·사산이 일어난다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="309">•</span><span><b>진단·예방</b></span></p>
<p class="bx-num"><span class="bxn" data-n="310">•</span><span>유산례의 진단에서는 태아의 위 내용물이나 장기, 유산 시의 태반을 사용하여 균 분리를 실시한다. 백신은 없으며, 변패한 사일리지 급여를 피하는 등의 대책으로 감염 기회를 저감시킨다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">살모넬라증</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="311">•</span><span><b>발생·병태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="312">•</span><span>장내세균과 Salmonella속균(Enterobacteriaceae, Salmonella) 감염에 의한, 설사, 패혈증을 주징으로 하는 급성 또는 만성 감염증이다. 특정 혈청형에 의한 살모넬라증은 신고전염병으로 지정되어 있다. 복수의 Salmonella속 혈청형이 소의 유산이나 조산에 관여하는 것이 보고되어 있으나, 특히 S. Dublin 감염에 의한 것이 많다. 감염은 주로 보균우의 분변 중에 배출된 균의 경구 감염에 의한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="313">•</span><span><b>진단·예방</b></span></p>
<p class="bx-num"><span class="bxn" data-n="314">•</span><span>유산 증례에서는 태아(제1위 내용물, 간 등)나 자궁 배설물을 재료로 하여 균 분리를 실시한다. 보균우의 적발, 격리, 경우에 따라서는 도태, 보균우의 도입 저지를 실시하여 오염 확산을 저지한다. 또한 청소와 소독, 쥐·파리 등 위생동물의 구제로 축사 환경을 청정하게 유지할 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">클라미디아 감염증</div>
<p class="bx-num"><span class="bxn" data-n="315">•</span><span>편성 세포내 기생성 세균인 클라미디아과 클라미도필라속(Chlamydiaceae, Chlamydophila)의 Chlamydophila abortus 감염에 의한 소의 유산, 불임증이 알려져 있으나, 국내에서의 발생은 없다. 유산은 임신 7~8개월에 보이며, 무증상인 채 유·사산 또는 허약 송아지를 만출한다. 산후에는 불임이 되고 균을 지속적으로 배출한다. 유산례에서는 태반이나 태아의 간이 유전자 검출에 사용된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">콕시엘라증</div>
<p class="bx-num"><span class="bxn" data-n="316">•</span><span>편성 세포내 기생성 세균인 콕시엘라과 콕시엘라속(Coxiellaceae, Coxiella)의 Coxiella burnetii 감염에 의해 임신우에서는 유·사산이나 허약 송아지의 만출이 일어난다. C. burnetii는 사람에게 감염되어 열성 질환(Q열)을 일으키며, 만성형에서는 중독한 증상을 보이므로 감염증법에서 3종 병원체로 분류된다. 국내에서는 소에서의 발생은 보고되지 않았다. 감염 동물은 유즙이나 분변으로 균을 배출하고, 또한 태반이나 양수는 대량의 균을 포함하므로 감염원이 된다. 태반, 질 분비물, 태아의 장기를 이용한 유전자 검출로 진단이 이루어진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">기타 세균</div>
<p class="bx-num"><span class="bxn" data-n="317">•</span><span>다양한 환경 상재성 세균의 기회감염에 의해 유·사산이 일어나는 것이 알려져 있다. 원인균으로는 Escherichia coli, Bacillus spp., Pasteurella spp., Histophilus somni, Streptococcus spp., Staphylococcus spp., Ureaplasma diversum 등을 들 수 있다. 기회감염에 의한 유·사산은 환경이나 숙주 측의 복합적 요인에 의해 일어나는 것으로 생각되나, 발생은 극히 산발적이며, 소독의 철저</span></p>
<p class="bx-num"><span class="bxn" data-n="318">•</span><span>와 적절한 사양관리로 발생 위험을 저감시키는 것이 긴요하다. 이 밖에 리케차목의 참진드기 매개성 아나플라즈마속(Anaplasma)에 의한 유산도 알려져 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">원충병</div>
<p class="bx-num"><span class="bxn" data-n="319">•</span><span>국내에서는 과거에 매개 절지동물이나 교배를 통한 원충병의 전파가 인정되었으나, 매개종의 박멸과 AI 보급에 의해 이들 원충병의 발생은 현재 보고되지 않고 있다. 한편, 오시스트에 의한 사료나 음수 오염으로 감염이 확산되는 네오스포라증은 국내에서 계속 발생하고 있으므로, 아르보바이러스 감염증과의 유사증 감별이 필요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">네오스포라증</div>
<p class="bx-num"><span class="bxn" data-n="320">•</span><span>육포자충과 톡소플라즈마아과 네오스포라속(Sarcocystidae, Toxoplasmatinae, Neospora)의 세포내 기생 원충인 네오스포라 원충(Neospora caninum) 감염에 의한, 유산을 주징으로 하는 감염증이다. 신고전염병으로 지정되어 있다. 소가 감염된 경우 무증상인 경우가 많으나, 임신우에서는 유산이나 태아의 사망·흡수, 미라 태아의 만출, 사산의 원인이 된다. 또한 태아 감염된 송아지의 일부에서는 생후 약 2개월까지 기립곤란, 신경 증상, 성장불량 등의 증상을 보인다. 드물게 수두증 등 중추신경 조직의 선천 이상이 인정된다. 네오스포라 원충은 개를 종숙주 및 중간숙주로 하며, 소, 면양, 산양 등은 중간숙주가 된다. 수평 감염은 개에서 배출된 오시스트를 소가 경구적으로 섭취함으로써 일어난다. 급성기를 이겨낸 경우에도 중추신경이나 근육 조직에 시스트를 보유하여 잠복감염우가 된다. 또한 초회 감염된 모우나 원충이 재활성화된 잠복감염 모우에서는 태반을 통해 태아에 수직 감염한다. 임상상 이상이 보이지 않는 경우에도 태아 감염된 소는 원충을 보유하여 다음 세대로의 감염원이 되거나 유산을 일으키거나 한다. 국내에서는 1991년 첫 보고 이후 발생이 계속되고 있다. 네오스포라 감염 동물의 대부분은 무증상이며, 원충 검출만으로는 유산의 원인으로 할 수 없다. 확정 진단에서는 병리조직학적 및 면역조직화학적 검사 수법이 사용된다. 항체검사에는 간접형광항체법이나 ELISA, 도트블롯법, 응집법이 사용된다. 또한 PCR이나 실시간 PCR에 의한 유전자 검출도 진단의 보조가 된다. 네오스포라의 수직 감염을 감소시키려면 항체 양성우의 적발과 도태, 항체 음성우의 도입이 유효하다. 나아가 수평 감염을 막기 위해서는 종숙주인 개와 우군의 접촉을 끊는 것이 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">트리코모나스병</div>
<p class="bx-num"><span class="bxn" data-n="321">•</span><span>트리코모나스과 트리코모나스속(Trichomonadidae, Trichomonas)의 Trichomonas foetus 기생에 의한 전염성 생식기병이다. 국내에서는 1963년 이후 발생이 보고되지 않았으나, 세계적으로는 널리 분포하고 있다. 신고전염병으로 지정되어 있다. 암소에서는 질이나 자궁에 기생하여 자궁내막염을 일으키고, 불임 또는 때로는 조기 유산(태령 2~4개월) 및 사산의 원인이 된다. 감염우와의 교배 등에 의해 전파되지만, AI 보급에 의해 국내에서의 발생은 감소, 종식되었다. 진단에서는 생식기 점액을 이용하여 도말표본을 작성하고, 김자염색 등으로 원충을 검출한다. 또한 배양이나 유전자 검출도 가능하다. 해외에서는 불활화백신이 사용되고 있다. AI는 본병 예방에 유효하지만, AI 시 정액 오염에 주의할 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">기타</div>
<p class="bx-num"><span class="bxn" data-n="322">•</span><span>해외에서는 트리파노소마 원충에 의한 소의 유·사산도 발생하고 있으나, 국내에는 병원성이 높은 종은 분포하지 않는다. 또한 소바베시아(Babesia bovis)도 유산의 원인이 되지만, 국내에서는 박멸되었다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">진균 감염증</div>
<p class="bx-num"><span class="bxn" data-n="323">•</span><span>Aspergillus속이나 Candida속 등 진균의 임신우 감염에 의해 유산이나 사산이 일어난다. Aspergillus fumigatus나 Candida albicans에 의한 증례가 많은 것으로 여겨진다. 이들 진균은 토양, 사료, 깔짚 등 사육환경 중에 보편적으로 분포하고 있다. 유산은 임신 말기에 일어나며, 사산이 되는 경우가 많다. 유산 태아와 태반의 병변부에 특징적인 조직 내 진균이 확인된다. 진단은 병변부 진균의 확인과 원인 진균의 분리·동정에 의한다. 예방에는 진균 오염 사료의 급여를 피하고 위생관리를 철저히 할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="324">•</span><span><span style="color:var(--ink-soft)">(저자: 梁瀬徹)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="325">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-6 유전성 질환</div>
<p class="bx-num"><span class="bxn" data-n="326">•</span><span>국내의 가축(소) 생산은 동결정액을 이용한 인공수정(AI) 기술에 의해 크게 진보하여, 고비유 능력을 가진 젖소나 우수한 육질의 육우의 효율적 생산이 가능해졌다. 그러나 한편으로 유전성 질환에 대해서도 우수한 특정 종모우의 집중적 이용에 의해 급속하고 광범위하게 확산되어 버렸다. 특히 상염색체 열성 유전 양식을 취하는 유전성 질환에서는 표현형으로는 질환우와 정상우의 구별이 불가능하지만, 후대에는 1/2의 확률로 질환 유전자를 전달해 버리므로, 종모우가 질환 유전자를 갖고 있으면 급속하고 광범위하게 확산된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="327">•</span><span>근년에는 유전성 질환에 대한 역학적 연구가 진행되어 유전적 불량 인자를 보유하는 보인우가 밝혀지고 있으며, 이를 바탕으로 적절한 교배 계획을 세움으로써 유전성 질환의 컨트롤이 이루어지고 있다. 그러나 많은 선천성 질환에서는 아직 유전적 변이가 해명되지 않은 질환도 적지 않으므로, 향후에도 지속적인 연구가 요구된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="328">•</span><span>본 절에서는 송아지에서 발증하는 유전성 질환 중 특히 중요하다고 생각되는 것에 대해 개설한다(표 1-6-1).</span></p>
<p class="bx-num"><span class="bxn" data-n="329">•</span><span>표 1-6-1 소의 대표적인 유전성 질환.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>동물종</th><th>질환명</th><th>유전 양식</th></tr><tr><th>홀스타인</th><td style="text-align:left">소백혈구점착부전증(BLAD)</td><td style="text-align:left">AR</td></tr><tr><th>홀스타인</th><td style="text-align:left">선천성 포르피린증</td><td style="text-align:left">AR</td></tr><tr><th>홀스타인</th><td style="text-align:left">횡격막근증</td><td style="text-align:left">AR</td></tr><tr><th>홀스타인</th><td style="text-align:left">복합척추형성부전증</td><td style="text-align:left">AR</td></tr><tr><th>홀스타인</th><td style="text-align:left">브라키스파이나</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">밴드3 결손증(유전성 구상적혈구증)</td><td style="text-align:left">AD</td></tr><tr><th>흑모화종</th><td style="text-align:left">제XI인자 결핍증</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">제VIII인자 결핍증(폰 빌레브란트병)</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">제XIII인자 결핍증</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">체디악-히가시 증후군</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">IARS 이상증</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">크산틴뇨증 II형</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">전지대근이상증(三枚肩)</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">요세관 이형성(클로딘16 결손증)</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">다중성 안구형성이상(MOD)</td><td style="text-align:left">AR</td></tr><tr><th>흑모화종</th><td style="text-align:left">마르팡 증후군</td><td style="text-align:left">AR</td></tr><tr><th>갈모화종</th><td style="text-align:left">연골이형성 왜소체구</td><td style="text-align:left">AR</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="330">•</span><span>AR: 상염색체 열성, AD: 상염색체 우성</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="331">•</span><span>■ 혈액 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">소백혈구점착부전증(BLAD)¹⁻⁵⁾</div>
<p class="bx-num"><span class="bxn" data-n="332">•</span><span>본증에 이환된 소에서는 발열이나 설사를 반복하고 발육불량이 된다. 구강 등의 점막 궤양, 구내염이나 치은염, 만성 수양성 설사 등의 소화기 증상 외에, 이감염성에 의해 비강염이나 인후두염, 폐렴 같은 호흡기 증상, 상처의 치유부전 등을 보인다. 생후 수개월에 사망하는 경우가 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="333">•</span><span>본증의 원인은 백혈구 막 표면상의 점착물질 분자인 LFA-1, Mac-1, p150·95에 공통인 β사슬 CD18의 결손으로 백혈구가 질환 부위에 부착할 수 없게 되는 것이다. CD18을 코딩하는 유전자의 383번째 염기 아데닌이 구아닌으로 변이함으로써 128번째 아스파르트산이 글리신으로 치환되기 때문에 생기는 상염색체 열성 유전성 질환이다. LFA-1, Mac-1, p150·95는 모두 백혈구의 유주나 주화, 탐식 등의 기능을 발휘하기 위한 점착 기능에 관여하는 분자로, BLAD 소는 CD18을 코딩하는 유전자의 염기배열 변이에 의해 이들 기능이 상실되어, 상재 병원균에 대해서도 저항성이 결여되어 상기 증상을 보이게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="334">•</span><span>말초혈 중 백혈구 막상의 CD18을 단클론항체를 이용하여 유세포분석기로 측정하거나, 유전자 검사로 호모 변이 유전자를 확인함으로써 진단한다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="335">•</span><span>■ 적혈구막 단백 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">밴드3 결손증(유전성 구상적혈구증)²⁻⁷⁾</div>
<p class="bx-num"><span class="bxn" data-n="336">•</span><span>발증우(호모접합체 개체)는 출생 직후부터 중증의 용혈성 빈혈, 호흡촉박, 심박수 증가, 황달, 저체중, 비종, 허약 등의 증상을 보이며, 대부분은 생후 2주째까지 사망한다. 생후 2주를 넘기면 증상은 개선되고 용혈성 빈혈의 증상은 소실된다. 1세령 이후에는 원기나 식욕은 건강 개체와 다름없으나, 구상적혈구증을 특징으로 하는 만성 빈혈이나 경도의 산증에 의한 것으로 생각되는 발육불량이 인정된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="337">•</span><span>본증은 흑모화종 신생 송아지에서 보이는 상염색체 우성 유전성 질환이다. 주로 적혈구에 분포하는 음이온 교환 수송</span></p>
<p class="bx-num"><span class="bxn" data-n="338">•</span><span>체인 밴드3 단백질이 결손되는 유전성 질환으로, 유전성 구상적혈구증을 동반하는 용혈성 빈혈을 최대 특징으로 한다. 원인 유전자 이상은 본래 930개 아미노산 잔기로 이루어진 소 밴드3 유전자의 664번째 아르기닌 코돈에서 종결 코돈으로의 넌센스 변이(R664X 변이)이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="339">•</span><span>혈액학적으로는 적혈구 수의 감소와 헤마토크리트치 및 헤모글로빈 농도의 저하가 현저하게 보인다. 또한 혈액 도말에서는 적혈구의 대소부동이나 적혈구 중심부의 센트럴 페일러<sup>주1)</sup>가 소실된 구상의 적혈구가 관찰되게 된다. 나아가 용혈에 따른 총담즙산 농도, 총빌리루빈 농도의 증가가 인정된다. 적혈구의 삼투압 취약성은 출생 후 시기를 불문하고 항진하며, 유전자형 호모 개체에서는 막 취약성의 항진이 현저하지만, 유전자형 헤테로 개체에서는 경도의 항진이 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="340">•</span><span>PCR법으로 R664X 변이를 검출함으로써 헤테로 개체도 포함하여 진단이 가능하다. 헤테로 보인 종모우를 계통 육종에 사용하지 않고, 또한 헤테로 보인 암소와의 교배를 피하는 것이 본증의 발증을 막는 유일한 방법이다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="341">•</span><span>※ 주1) 센트럴 페일러: 정상 적혈구는 중앙이 오목한 원반상 형태를 하고 있어, 현미경으로 관찰하면 중앙이 담명하게 관찰된다. 이 담명한 부분을 센트럴 페일러라 부른다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">프로테인 4.2 이상증³⁾</div>
<p class="bx-num"><span class="bxn" data-n="342">•</span><span>프로테인 4.2 이상증은 신생 송아지에 호흡기 증상이나 설사 등의 임상 증상을 일으키고, 삼투압 취약성이 경도로 항진하는 것이 보고되어 있다. 헤모글로빈 타입의 이상과 적혈구막 단백질의 프로테인 4.2 영역의 분자량 이상이 원인이 되어 일어나는 고도의 빈혈과 성상형이나 각형, 아메바상 또는 유극적혈구 등 기형 적혈구증을 보인다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">스펙트린 결손증³⁾</div>
<p class="bx-num"><span class="bxn" data-n="343">•</span><span>적혈구 막 단백질 중 하나인 스펙트린이 결손되는 스펙트린 결손증에서는 생후 얼마 안 되어 중증의 용혈성 황달, 간헐적 경련을 보이고 사망하는 예가 확인되었다. 이 예에서는 고도의 혈관내 용혈, 누적상 및 타원상의 기형 적혈구가 인정되고, 적혈구막 단백질의 SDS-PAGE에서 스펙트린에 상당하는 밴드 영역의 결손이 보인다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="344">•</span><span>■ 응고인자 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">제XI인자 결핍증³˒⁴⁾</div>
<p class="bx-num"><span class="bxn" data-n="345">•</span><span>본증에서 출혈의 빈도는 낮고 정도는 다양하다. 관절 종창이나 폐, 장, 대뇌, 척수로부터의 출혈 외에, 난포 발육부전에 기인하는 발정주기 이상이나 불임 등 번식장애에 대한 관여에 관한 보고도 있다. 선용응고계의 활성화 부분 트롬보플라스틴 시간의 연장이 보인다. 본증의 원인은 제27번 염색체에 자리하는 제XI 유전자 F11의 엑손 9에서의 15염기 삽입에 의한 상염색체 열성 유전성 질환이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제VIII인자 결핍증(폰 빌레브란트병: vWD)²⁻⁴˒⁶⁾</div>
<p class="bx-num"><span class="bxn" data-n="346">•</span><span>본증은 유전성 출혈성 질환 중에서는 증상이 가장 중독하며, 생후 수일에서 2~3개월에 발증한다. 혈종(둔부나 어깨, 경부, 사지)이나 곤충 자상 후의 체표 출혈 및 체강 내 출혈이 보이며, 1년 이내에 7할이 사망한다. 제VIII인자의 캐리어 단백질(von Willebrand 인자)의 이상에 의해 생기는 상염색체 열성 유전성 질환이다. 본증은 PCR법에 의한 진단이 가능하므로 무증상 보인우도 검출 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제XIII인자 결손증²˒⁴⁻⁷⁾</div>
<p class="bx-num"><span class="bxn" data-n="347">•</span><span>본증은 생후 수일에 중증의 제대 출혈을 보이고, 복강 내 제동맥으로부터의 출혈에 의한 급사, 혈변, 피하 및 근간 혈종, 발육지연을 보인다. 생후 바로 사망하는 것을 면하더라도 1년 이내에 8할 이상이 사망한다. 소 제23번 염색체에 자리하며 혈액응고 과정의 피브린 안정화에 관여하는 제XIII인자의 서브유닛 A 유전자의 점돌연변이(염기번호 248번의 T-C 치환)에 의해 발증한다. 상염색체 열성 유전성 질환으로 생각된다. 본증은 PCR법에 의한 진단이 가능하므로 무증상 보인우도 검출 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">체디악-히가시 증후군³⁻⁵˒⁷⁾</div>
<p class="bx-num"><span class="bxn" data-n="348">•</span><span>본증의 증상은 부분적 백색증(은회색 모색), 제대 출혈, 거세 시 출혈, 피하 출혈 등이지만, 출혈은 경도이므로 본증으로 사망하는 일은 드물다. 그 때문에 번식, 비육에 공시되는 일도 적지 않으나, 비육 중 다발성 혈종에 의한 근손상이나 현저한 발육불량으로 발견되는 경우도 있다. 이 출혈 경향은 혈관 손상에 의해 노출된 콜라겐에 대한 혈소판 응집 반응의 저하에 의한 것으로, 안저검사에서는 색소 결손(적안)이 인정된다. 출혈보다도 이감염성(호흡기 질환이나 피부염, 중이염의 반복 감염)이 문제가 되는 경우가 많다. 혈액 도말 검사에서 호산구 세포질 내에 거대 과립이 보인다. 제28번 염색체에 존재하는 CHS1 유전자(LYST 유전자)의 변이에 의해 발증하는 상염색체 열성 유전성 질환이다. 안저 이상이나 백혈구 거대 과립, 혈소판 콜라겐 응집 저하로 진단 가능하지만, PCR에 의한 진단이 가능하므로 무증상 보인우도 검출 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">IARS 이상증(허약 송아지 증후군)⁸⁾</div>
<p class="bx-num"><span class="bxn" data-n="349">•</span><span>본증의 특징적인 소견은 출생 시 저체중, 빈혈, 면역부</span></p>
<p class="bx-num"><span class="bxn" data-n="350">•</span><span>전(易感染性)이다. 발증우는 출생 시부터 기립곤란, 포유욕 감퇴를 보이며, 허약하여 난치성 설사증이나 폐렴에 걸리기 쉽다. 설사나 폐렴에서 회복하면 정상우와 다르지 않을 정도까지 식욕은 회복되지만, 증체 불량 때문에 뚜렷한 발육지연이 인정된다. 출생 후부터 신생아기에 활력 저하를 보이고 포유욕 감퇴나 기립 난삽이 인정된 개체에서는 사망률이 높다. 허약 송아지 증후군의 원인의 하나로 여겨지고 있다. 흑모화종의 제8번 염색체에 존재하는 원인 유전자의 변이에 의해 발증하는 상염색체 열성의 유전성 질환이다. 본 증에 관해서는 2-5(119페이지)를 참조하기 바란다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="351">•</span><span>■ 대사·내분비 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">선천성 포르피린증 (4)</div>
<p class="bx-num"><span class="bxn" data-n="352">•</span><span>본 증은 헤모글로빈의 구성 성분인 헴의 생합성에 관여하는 효소군의 활성 저하가 원인이 되어 여러 병태를 일으키는 선천성 대사성 질환이다. 증상은 용혈성 빈혈이나 치아의 착색(적갈색이나 담홍색), 배설되는 포르피린 양에 따라 적갈색이나 담적색 요를 배설한다. 또 포르피린은 자외선과 반응하면 백모부 피부나 무색소부에 광선과민성 피부염을 일으킨다. 헴은 프로토포르피린 IX(PROTO IX)가 철 이온과 결합하여 생합성되는데, 본 증에서는 이 PROTO IX의 전구물질(우로포르피린 III)의 생합성에 관여하는 2종류의 효소(우로포르피리노겐 III 합성효소와 우로포르피리노겐 I 합성효소) 중 우로포르피리노겐 III 합성효소가 유전적 이상 때문에 활성이 저하됨으로써 생긴다. 다른 한쪽인 우로포르피리노겐 I 합성효소의 작용에 의해 헴 합성에 관여하지 않는 우로포르피린 I과 코프로포르피린 I이 생성되어, 이들의 적혈구나 적아구 내 축적이나 뼈·치아로의 침착이 보인다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">크산틴뇨증 II형(몰리브덴 보조효소 결손증) (3, 4, 7)</div>
<p class="bx-num"><span class="bxn" data-n="353">•</span><span>흑모화종의 출생 직후부터 6개월령에 발증하며, 원기 소실, 식욕부진, 발육불량, 배만(背彎) 자세 등의 증상을 보인다. 발굽은 과장제(過長蹄)를 나타내고, 조잡하며 표면에 요철이 보인다. 퓨린 대사효소 크산틴 디하이드로게나제(xanthine dehydrogenase) 활성의 결손에 의해 퓨린 대사의 중간 대사산물인 하이포크산틴 및 크산틴이 요산으로 분해되지 않게 됨으로써, 혈중·요중 하이포크산틴 및 크산틴 농도가 상승하고, 요로에 크산틴을 주성분으로 하는 결석을 생성하는 질환으로, 신부전 때문에 사망한다. 병리 소견에서는 신장은 경도를 더하고, 절개하면 모래주머니를 자르는 듯한 저항이 있다. 1~3mm의 크산틴 결석이 요세관, 신유두, 신배에 축적되어 있다. 크산틴의 분해에 필요한 몰리브덴 보조효소의 활성화에는 보조효소로의 황 원자 배위가 필요하며, 그것을 촉매하는 것으로 여겨지는 효소 단백질을 코드하는 유전자(Molybdopterin co-factor sulfurase gene)가 제24번 염색체 상에 동정되어 있는데, 그 유전자에서의 3염기 결실이 원인으로 여겨지고 있다. 상염색체 열성 유전양식을 취한다. PCR에 의한 유전자 검사로 진단 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">콜레스테롤 대사이상증(Cholesterol deficiency/Holstein cholesterol deficiency: CD/HCD) (9)</div>
<p class="bx-num"><span class="bxn" data-n="354">•</span><span>본 증에 이환되면 발열, 만성 설사, 폐렴, 부종, 발육부전을 보이며, 생화학 소견으로서 특징적인 혈중 콜레스테롤 농도의 현저한 감소가 보인다. 홀스타인의 지질 대사에 관여하는 APOB 유전자의 변이에 의해 발생하는 상염색체 열성의 유전성 질환이다. 리포단백질 유전자(ApoB)의 엑손 5에서의 염기 삽입이 원인으로, 콜레스테롤의 대사·운반에 필요한 ApoB 단백의 산생 부전을 일으킨다. 호모 개체는 정상적인 체격으로 출생하지만, 발육불량과 난치성 설사 때문에 대부분의 개체가 3주~6개월령에 사망한다. PCR법에 의한 유전자 검사로 진단 가능하다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="355">•</span><span>■ 장기·조직의 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">횡격막근증 (4, 7)</div>
<p class="bx-num"><span class="bxn" data-n="356">•</span><span>본 증의 증상은 재발성 혹은 만성 고창증으로, 제1위 운동이 저하됨으로써 식체(食滯)나 설사가 보이는 경우도 있다. 병리해부 시 횡격막 근부의 색, 종창, 경결감을 가진다. 조직학적으로는 근섬유의 대소부동, 공포화, 비대 섬유의 분열, 핵의 중앙 이동, 섬유화 등과 함께, 근섬유의 중앙 혹은 변연부에서의 크고 작은 코어양 구조(액틴 필라멘트를 주체로 한 변성 근단백의 응집과 유비퀴틴화)의 출현을 특징으로 하며, 이들 횡격막의 근섬유 변성이 임상증상의 원인이 된다. 상염색체 열성의 유전성 질환으로, 원인 유전자는 HSP70의 아이소폼의 하나인 HSPA1B의 완전 결손에 의해 본 증이 일어난다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">전지대근 이상증(삼매견, 三枚肩) (3, 4)</div>
<p class="bx-num"><span class="bxn" data-n="357">•</span><span>본 증의 발증우는 출생 직후부터 진전, 기립곤란, 발육지연을 보인다. 일부 개체에서는 발육불량, 이개 하수 등이</span></p>
<p class="bx-num"><span class="bxn" data-n="358">•</span><span>보이는 경우도 있다. 병리학적으로는 전지대근(다수는 광배근)의 불완전 형성 혹은 저형성에 기인하는 질환이지만, 그 이외의 변화는 보이지 않는다. 전지대근 이상은 생후 1~수개월의 송아지에서 명료해진다. 제26번 염색체에 존재하는 GFRA1 유전자의 변이에 의해 발증하는 상염색체 열성의 유전성 질환이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">요세관 이형성(클라우딘 16 결손증) (2~4, 6, 7)</div>
<p class="bx-num"><span class="bxn" data-n="359">•</span><span>본 증에서는 생후 2~3개월령 이후의 흑모화종 송아지에서 난치성 설사나 연변, 발육불량, 삭수(削瘦), 과장제를 보인다. 저비중의 요를 대량으로 배설하고, 중증례에서는 신기능부전에 의한 요독증으로 사망하는 예도 있다. 치료해도 효과는 보이지 않고 다수는 생후 수개월 정도에 사망하지만, 수년 후가 되어 발증하는 사례도 보고되어 있다. 병리학적 소견은, 약령 개체에서는 조직학적으로 요세관의 형성이상이 보이고, 가령과 함께 신피질에서 수질에 걸친 섬유화가 보인다. 본 증은 흑모화종에서 사구체나 요세관 상피세포의 타이트 정션(tight junction)에 관여하는 파라셀린-1(PCLN-1)/클라우딘 16(CL16)이라 불리는 단백이 결손됨으로써 발증하는 상염색체 열성의 유전성 질환이다. PCR법으로 DNA의 결실 부위를 검출함으로써 확정진단이 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">복합 척추 형성부전(Complex vertebral malformation: CVM) (2, 4, 5, 7, 9, 10)</div>
<p class="bx-num"><span class="bxn" data-n="360">•</span><span>본 증은 2000년에 덴마크에서 발생한 치사성 신생아의 형태 이상에서 발견되었다. 홀스타인의 유산 태아 및 신생아에서 보이는, 여러 척추 형성부전을 수반하는 치사성 유전성 질환이다. 이환 개체의 특징은 경부나 흉부 척추의 단축, 양 앞다리 완관절이나 비절관절의 좌우대칭적 수축과 만곡으로, 심기형(형성부전, 심실중격결손, 우심실비대, 대혈관 형성부전)을 수반하는 경우도 있다. 주증상은 유산이나 사산으로, 약 8할은 임신 260일까지 사망한다. 우군에서의 유사산율 증가나 신생아 사망의 증가가 보인다. 배의 발생 초기에 일어난 세포 내에서 체절이나 척추의 분화에 관여하는 SLC35A3 유전자의 변이에 의해 발생하는 상염색체 열성의 유전성 질환이다. 소 제3번 염색체 상에 원인이 되는 변이 유전자의 존재가 밝혀져 있으며, PCR법에 의한 유전자 검사로 진단 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">브라키스파이나(Brachyspina: BY) (4)</div>
<p class="bx-num"><span class="bxn" data-n="361">•</span><span>본 증은 홀스타인에서 보이는 상염색체 열성의 유전성 질환이다. 본 증의 원인이 되고 있는 유전자의 이상은, DNA 수복에 관여하는 판코니 빈혈 상보군 I 단백질 유전자(FANCI 유전자)의 결실 변이이다. 주된 증상은 유·사산에 의한 출생률 저하로, 사산 태아는 저체중(10kg 정도)이 된다. 하악이 짧아 혀가 튀어나와 있고, 척추가 전장에 걸쳐 극단적으로 짧은 것이 특징이다. 또 해부 소견에서는 대부분의 증례에서 심실중격결손이나 심비대가 보이고, 그 밖에 신장, 난소, 자궁, 고환의 무형성이나 저형성, 결장폐쇄증 등이 보고되어 있다. 변이 유전자 보인율에 비해 사산 송아지의 증례가 적은 점에서, 다수는 배사멸이나 유산하고 있는 것이 아닌가 여겨지고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">연골이형성성 왜소체구 (4, 7)</div>
<p class="bx-num"><span class="bxn" data-n="362">•</span><span>본 증은 갈모화종에서 발생이 확인되어 있는 질환으로, 사지의 단축(뒷다리에서 현저)이 주된 증상이다. 장골의 단축, 슬관절 및 비절의 비대, O다리를 인정하고, 하이에나병과 유사한 체형의 뒷다리 착지 시에 슬관절이 바깥쪽으로 흔들리고 둔부를 좌우로 흔드는 보양 이상이 보인다. 병리조직학적으로는 사지골의 골단판 두께의 불균형, 연골기질의 국소적 괴사 내지 융해, 일부 균열 형성, 골단판의 폐쇄가 관찰된다. 상염색체 열성 유전양식을 취하며, 제6번 염색체에 좌위하는 LIMBIN 유전자의 2종류의 변이에 의해 생긴다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">다중성 안구 형성이상(Multiple ocular defect: MOD) (3, 4)</div>
<p class="bx-num"><span class="bxn" data-n="363">•</span><span>발증우는 출생 시부터 수정체나 홍채가 인정되지 않고, 소안구증을 수반하여 완전히 맹목이 된다. 본 증의 치사성은 낮고 맹목 이외의 특징적인 증상은 인정되지 않는다. 제18번 염색체에 존재하는 원인 유전자(WFCD1)의 변이에 의해 발증하는 상염색체 열성의 유전성 질환이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">바터 증후군 1형 (11)</div>
<p class="bx-num"><span class="bxn" data-n="364">•</span><span>본 증의 원인은 제10번 염색체에 존재하는 SLC12A1 유전자의 미스센스 변이로, 상염색체 열성의 유전성 질환이다. SLC12A1 유전자는 신장에서의 Na⁺, K⁺, Cl⁻의 트랜스포터로서 기능하는 NKCC2 단백질을 코드하고 있기 때문에, SLC12A1 유전자의 변이에 의해 NKCC2 단백질이 정상적으로 발현하지 않게 되어, 원뇨가 농축되지 않고 태아 자신의 성장에 따라 요량이 증대하여, 요관, 방광, 요막관을 거쳐 요막강 내에 요막수가 저류함으로써 어미소는 태막수종을 발증한다. 발증우는 태아기에 신장 기능의 이상에 의해 임신 5~6개월의 어미소의 요막강 내에 다량의 요막수를 저류시켜, 태막수종(요막수</span></p>
<p class="bx-num"><span class="bxn" data-n="365">•</span><span>종)을 일으킨다. 모자 모두 사망하는 예가 많다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="366">•</span><span>■ 결합조직·피부의 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">마르판 증후군 (4)</div>
<p class="bx-num"><span class="bxn" data-n="367">•</span><span>본 증은 세포외 매트릭스에 존재하며 결합조직을 구성하는 마이크로피브릴의 구성물질인 Fibrillin-1을 코드하는 유전자(FBN1)의 변이가 원인으로 여겨지고 있으며, 골격, 순환기계 및 안조직의 이상을 보이는 상염색체 우성의 유전성 질환이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="368">•</span><span>유전자 변이의 차이에 따라 징후와 병태는 다양하며, 흑모화종에서의 발생례에서는 체고는 정상이지만 체중이 가볍고, 기절골이 길고 약하며, 척추 기형, 안구 이상, 안구 백탁, 심음의 결체(結滯)(주2) 등의 증상을 보이는 개체가 보였다. 또 리무진에서의 발생례에서도 늑골의 편평화나 대동맥의 확장, 수정체의 탈구와 같이 증상이 심장이나 혈관, 뼈나 근육, 눈에 나타나고 있어, 사람의 마르판 증후군과 유사하다고 생각된다. PCR에 의한 원인 유전자 변이의 특정으로 진단 가능하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="369">•</span><span>※ 주2) 심음의 결체: 부정맥의 기외수축 증상의 하나. 규칙적인 리듬에 의한 심장의 수축이 아니기 때문에, 심실에 혈액이 충전되기 전에 심장이 수축하여 충분한 혈액량을 대동맥으로 보낼 수 없기 때문에 대동맥에 전해지는 박동이 약해져, 결과적으로 심음으로서 청취하기 어려워 건너뛰는 것처럼 들리는 것.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">피부무력증 (4)</div>
<p class="bx-num"><span class="bxn" data-n="370">•</span><span>본 증의 이환우는 피부의 이상한 신전, 유연한 피부에 의해 이상성(易傷性)이다. 또 관절, 인대의 가동역 증가, 혈관의 취약을 보인다. 피부의 과신전이나 혈종, 창상 치유 지연을 보인다. 소에서의 전형적인 피부무력증은 Dermatosparaxis형 및 Kyphoscoliosis형으로, 전자는 프로콜라겐 아미노펩티다제의 결손이, 후자는 리신 수산화효소의 이상이 원인으로 여겨지고 있다. PCR법에 의한 원인 유전자의 특정으로 진단 가능하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">지단의 이상(단제, Mule Foot: MF) (4)</div>
<p class="bx-num"><span class="bxn" data-n="371">•</span><span>발증우는 원기나 식욕은 정상이지만, 발굽의 유합(지골·지골)에 의해 발굽이 하나밖에 형성되지 않음으로써 중도의 파행이 보인다. 우전지·좌전지·우후지·좌후지 순으로 발증하기 쉬운 경향이 있다. 저밀도 리포단백 수용체 관련 단백질 4(LRP4) 유전자의 변이에 의해 발생하는 상염색체 열성의 유전성 질환이다. 생후의 신체검사나 지단의 X선 촬영, 유전자 검사에 의한 변이 유전자의 특정으로 진단 가능하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="372">•</span><span><span style="color:var(--ink-soft)">(저자: 佐藤礼一)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="373">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-7 선천성 기형과 유해물질의 영향</div>
<div class="bx-sub"><div class="bx-subtitle">선천성 기형</div>
<p class="bx-num"><span class="bxn" data-n="374">•</span><span>소의 선천이상은 세계적으로 보아 600종류 이상 있다고 생각되지만, 유전하는 형질 혹은 질환은 248종류로 되어 있으며(1), 중독이나 결핍증을 고려하더라도 선천이상의 다수는 원인불명으로 생각된다. 이상을 외견적으로 확인할 수 있는 외표 기형은 진단이 용이하지만, 내부 기형이나 효소 결손증 등은 진단이 어렵고, 또 성장호르몬류 및 그 수용체의 이상에서는 균형 잡힌 왜소증이 되기 때문에 임상진단이 어렵다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">선천성 기형과 발생 비율</div>
<p class="bx-num"><span class="bxn" data-n="375">•</span><span>선천이상 중 체형이나 내장의 형태학적 이상을 「선천성 기형」이라 하는데, 이것은 기관 형성기의 유전자 이상 또는 유전자 발현 이상에 의해 일어난다. 그러나 기관 형성기에 바이러스 감염, 유독식물, 비타민 및 미량원소의 결핍 등의 최기형 인자에 노출되어도 유전자 이상과 유사한 선천이상이 생긴다(유전학에서는 「표현형 모사(表現型模寫)」라 부른다). 이것은 물론 유전하지 않는 선천이상이다. 바이러스 감염에 의한 표현형 모사(이른바 이상산)는 발생 규모와 경제 피해가 크기 때문에 현재는 이상산이라는 용어가 쓰이는 경우가 많지만, 선천이상과 이상산은 동일하지 않다.</span></p>
<p class="bx-num"><span class="bxn" data-n="376">•</span><span>기관계통별 발생 비율에서는 골격계가 가장 많고, 척주에서는 척주만곡, 사경, 무미 등이, 흉곽에서는 흉골과 늑골의 이상이, 두개에서는 구개열, 두개·안면 이형성, 악단소(顎短小) 등의 이상이 보인다. 그 이외에서는 심혈관계, 중추신경계, 소화기계, 체강의 이상 등이 많다(2, 3).</span></p>
<p class="bx-num"><span class="bxn" data-n="377">•</span><span>기형은 특정 장기에 한정되어 일어나는 경우도 있지만, 복수의 장기에 나타나는 경우도 많고, 심기형에 심외기형이 종종 합병하는 것이나, 하악단소나 구개열이 많은 선천이상에 합병하여 출현하는 것이 알려져 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">주목해야 할 선천성 기형</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="378">•</span><span><b>장관폐쇄 및 쇄항</b></span></p>
<p class="bx-num"><span class="bxn" data-n="379">•</span><span>관강장기 및 정상공의 폐쇄(Atresia)는 각종 장기에서 일어나지만, 소화관에서는 공장, 회장, 결장, 직장 및 항문에서 일어나며, 결장폐쇄와 쇄항이 많이 보인다. 폐쇄된 장관은 끈 모양이 되어 장에 이어지는 경우와, 불연속이 되어 유리되는 경우가 있다. 맹단이 된 장에는 태변이나 액상 내용물이 저류하여 복위가 팽만한다. 배변이 없고 원기·식욕이 저하함으로써 발견되지만, 직장이 존재하더라도 소량의 백색 점조물이 배설되는 데 지나지 않는 점에서 통과장애를 추정할 수 있다. 조기 발견과 충분한 간호에 의해 외과 처치가 유효하다는 보고가 있다(4).</span></p>
<p class="bx-num"><span class="bxn" data-n="380">•</span><span>쇄항은 항문이 폐쇄되어 있는 상태로, 직장폐쇄를 수반하는 경우가 많고, 때로 직장과 비뇨생식기 사이의 누관 형성(직장질루, 직장요도루), 척주의 단축·변형, 유합신, 소뇌 형성부전 등의 기형을 합병한다. 쇄항도 외과 처치가 유효하다는 보고가 있다(4). 원인으로서 홀스타인에서 유전성 결장폐쇄가 알려져 있고, 또 태막 촉진에 의한 임신진단이 원인으로 의심된 장관폐쇄도 보고되어 있지만, 단발하는 경우는 원인의 특정은 어렵다. 때로 집단 발생하는 경우도 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="381">•</span><span><b>헤르니아</b></span></p>
<p class="bx-num"><span class="bxn" data-n="382">•</span><span>헤르니아는 장기의 전체 또는 일부가 체벽이나 체강 내의 열극 등을 통해 정상 위치에서 일탈한 상태로, 일반적으로는 복부 헤르니아를 가리키지만, 뇌나 폐가 탈출하는 경우도 있다. 복부 헤르니아에는 제대 헤르니아, 복벽 헤르니아, 서혜 헤르니아, 음낭 헤르니아 등이 있고, 제대 헤르니아가 가장 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="383">•</span><span>제대 헤르니아는 제륜이 폐쇄되지 않기 때문에 일어나며, 장이 헤르니아륜에서 피하로 탈출하여 복벽이 팽만한다. 고정법이나 외과요법에 의해 치유되지만, 발견이나 치료가 늦어지면 치명적이지는 않더라도 소의 경제 가치를 손상시킨다.</span></p>
<p class="bx-num"><span class="bxn" data-n="384">•</span><span>이스라엘의 홀스타인에서는 침투 불완전한 우성 또는 공우성의 유전양식을 보이는 제대 헤르니아가 알려져 있으며, 보인 종모우의 산자의 1~21%가 발증한다. 우성 유전이지만 보인해도 대부분의 소는 발증하지 않는다(「침투 불완전」이라 한다). 우성 유전의 경우 가계도를 작성하면 종모우는 특정 조상(발단자)에 수렴하지만, 암컷은 수렴하지 않는다. 질환 유전자는 제8번 염색체의 센트로미어 말단에 존재한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="385">•</span><span>국내에서는 흑모화종에서 특정 종모우에 수렴하는 가족성 제대 헤르니아가 발생한 것이 알려져 있다. 또 가족성 복벽 헤르니아의 보고도 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="386">•</span><span><b>음고(陰睾)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="387">•</span><span>정소는 태아기에 신장의 후극에서 음낭으로 하강하지만, 이것이 정상적으로 일어나지 않은 경우는 복강 내에 남아 음고(잠재정소, 잠복정소, 정류정소)가 된다. 발생률은 0.2~1% 정도로, 다수는 일측성이며 좌측 정소가 잠재화하기 쉽다. 잠재화한 정소는 심부 체온이 높기 때문에 정자 형성이 장애받지만, 호르몬 산생 능력을 가지기 때문에 비육한 경우 육질에 대한 영향이 우려되어 거세 시에 문제가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="388">•</span><span>음고는 유전적 요인이 관계한다고 생각되지만 자세한 것은 불명이다. 또 음고는 복합 기형의 하나로서 나타나는 경우가 있고, 나아가 염색체 전좌를 수반한 증례도 보고되어 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">유해물질의 영향</div>
<p class="bx-num"><span class="bxn" data-n="389">•</span><span>임신 초기의 기관 형성기에 임신우가 유해물질을 섭취하여 태아가 사망하면 조기 유산이 된다. 한편 태아가 죽음에 이르지 않고 기관 형성이 어떠한 최기형 인자의 영향을 받은 경우에는 선천성 기형이 일어난다. 최기형 인자에 감수성이 있는 임신 시기는 「임계기」라 불린다. 어떤 종류의 유독식물은 유독 성분이 태아로 이행하여 기형을 일으킨다. 해외에서는 초원에 임신우가 방목된 경우에 일어나지만, 국내에서는 축산시설 내와 개량 초지에서 소가 사육되는 경우가 많아 중독의 기회는 거의 없다. 그러나 야초지에서의 방목 등에서 체형 이상이 발생한 경우에는 유독식물에 의한 선천이상을 의심할 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">발생독성</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="390">•</span><span><b>유독식물</b></span></p>
<p class="bx-num"><span class="bxn" data-n="391">•</span><span>미국의 캘리포니아 여로(Veratrum californicum)는 두개안면 이형성, 단안증, 중수골과 중족골의 단축, 구개열, 기관협착 등을 일으키며(5), 원인물질은 저빈(Jervine), 사이클로파민(Cyclopamine), 베라트라민(Veratramine) 등이다(6). 국내에서는 여로(V. album)와 박새(Veratrum stamineum)가 혼슈 중부 이북의 고산과 홋카이도의 습지에 자생하여 산나물로 오식한 사람의 중독이 발생하지만, 가축에서의 중독은 보고가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="392">•</span><span>독당근(Conium maculatum)은 산자에 완관절의 현저한 만곡, 앞다리의 염전, 주관절의 구축, 척주만곡 등을 일으킨다. 원인물질은 코니인(Coniine) 등의 피페리딘 알칼로이드로, 임신 40~70일에 섭취한 경우에 발생한다(5). 독당근은 유럽 원산의 귀화식물로(7), 홋카이도와 혼슈 일부에 정착하고 있지만, 국내에서의 가축 중독은 보고가 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="393">•</span><span>미국 전역에 분포하는 야생 루피너스(Lupinus sericeus, Lupinus caudatus 등)는 앞다리의 만곡과 염전, 관절구축, 척주 또는 경부의 만곡, 구개열을 특징으로 하는 Crooked calf syndrome을 일으킨다. 원인물질은 퀴놀리지딘 알칼로이드인 아나기린(Anagyrine)으로, 임신 40~70일에 섭취한 경우에 발생한다(7). 국내에서는 원예품종의 루피너스가 일반 가정에서도 널리 재배되고 있지만, 미국의 유독종과는 달라 중독 보고도 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="394">•</span><span>콩과의 자운영속(Astragalus spp.)과 오야마노엔도우속(Oxytropis spp.)의 특정 종은 미국 서부의 건조한 알칼리 토양지대에 분포하며, 급성 중독으로 흥분 상태가 되기 때문에 「로코초(Loco는 미쳤다는 의미)」라 불리는데, 임신우에서는 배사멸, 유산, 수종태, 허약 송아지 등을 일으키고, 산자에 사지의 만곡과 구축을 일으킨다(5). 또 야생의 나무담배(Tobacco tree)도 사지의 만곡을 일으킨다. 그러나 이들 유독한 종은 국내에 존재하지 않는다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="395">•</span><span><b>사료</b></span></p>
<p class="bx-num"><span class="bxn" data-n="396">•</span><span>캐나다에서 겨울철에 그라스 사일리지 또는 클로버 사일리지만을 급여받은 육용우와, 임신 중기에 변패 사일리지를 급여받은 육용우에서 관절이완, 사지단소, 상악단소를 주증상으로 하는 선천이상이 일어나, 그 일부는 망간 결핍과의 관련이 추측되고 있다(8).</span></p>
<p class="bx-num"><span class="bxn" data-n="397">•</span><span>또 겨울철에 곰팡이 핀 밀짚을 급여받은 육용우에서 뒷다리 마비 또는 불완전마비, 사지의 단소, 관절이완, 척주관 협착, 때로 상악단소를 주증상으로 하는 선천이상이 발생한다(9).</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="398">•</span><span><b>화학물질</b></span></p>
<p class="bx-num"><span class="bxn" data-n="399">•</span><span>동물용 의약품이나 농약에 의한 선천이상은 보고되어 있지 않다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">태아사, 유산, 태내 오염</div>
<p class="bx-num"><span class="bxn" data-n="400">•</span><span>임신우가 독물을 섭취한 결과, 독물이 직접적으로 태아사나 태내 오염을 일으키는 경우와, 어미소에 장애를 주어 영양이나 산소의 공급, 임신 유지에 필요한 호르몬 조절의 장애 등을 일으켜 간접적으로 태아사나 유산을 일으키는 경우가 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="401">•</span><span><b>질산염 중독</b></span></p>
<p class="bx-num"><span class="bxn" data-n="402">•</span><span>증상의 극기를 견뎌낸 후, 혹은 목초의 질산염 함량이 높은 초지에 방목된 소에서 급성 증상을 수반하지 않고 유산이 일어나는 경우가 있으며(10), 태반에서 태아로의 산소 공급 부족에 의해 태아가 사망하기 때문이라고 생각되고 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="403">•</span><span><b>송엽 중독</b></span></p>
<p class="bx-num"><span class="bxn" data-n="404">•</span><span>북미에서의 폰데로사 파인(ponderosa pine)의 잎과 한국에서의 솔잎에 의한 유산·조산(Pine needle abortion)의 발생이 알려져 있다. 임신 후기에 일어나지만, 조산 태아의 생존은 성숙 정도에 의존하며, 어미소의 호르몬 이상이 원인으로 생각되고 있다(11).</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="405">•</span><span><b>중금속</b></span></p>
<p class="bx-num"><span class="bxn" data-n="406">•</span><span>수은이나 납은 태반을 통과하여 태아로 이행한다. 사람의 미나마타병에서 태아의 중독이 발생한 것은 유명하다. 소에서는 납의 태내 오염에 의한 송아지의 조혈 이상이 일어나는 경우가 있다(12).</span></p>
<p class="bx-num"><span class="bxn" data-n="407">•</span><span><span style="color:var(--ink-soft)">(저자: 小林正人)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="408">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-8 ET 및 클론 산자의 특징</div>
<p class="bx-num"><span class="bxn" data-n="409">•</span><span>현재 배이식(Embryo transfer: ET)은 국내외에서 널리 행해지고 있으며, 많은 산자가 유통되고 있다. 또 핵이식(Nuclear transfer: NT)에 관해서는 체세포 핵이식 기술의 개발과 함께 클론 산자의 생산이 행해지고 있는데, 그들 산자는 인공수정(AI)에 의한 산자와 출생 시의 상황이나 성장에 차이가 보인다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">일본의 ET 산자 및 클론소의 생산 현황</div>
<p class="bx-num"><span class="bxn" data-n="410">•</span><span>국내에서의 ET에 의한 산자는 농림수산성의 소 수정란이식 실시상황 조사(1)에 따르면, 2015년도의 생체 배이식 유래 산자(in vivo(주1) 산자)는 1만 5,621두, 체외수정란 이식 유래 산자(in vitro(주2) 산자)는 3,715두가 생산되고 있다. 2006~2015년의 10년간 연평균은 약 2만 두이며, 그 전 10년간(1996~2005년)의 연평균(약 1만 8,000두)과 비교하여 1할 정도 증가 경향을 보이고 있다. 한편 농림수산성의 축산통계조사(2)를 보면, 2005년도의 국내 소 총생산두수 약 139만 두 중 ET에 의해 생산된 송아지는 불과 1.3%였지만, 2015년도의 소 총생산두수가 약 121만 두로 감소한 데 비해 ET에 의해 생산된 송아지는 1.7%로 증가 경향에 있음을 알 수 있다. 이처럼 ET 산자가 국내 생산두수에서 차지하는 비율은 매우 적지만, ET는 가축의 개량과 함께 우량축의 증산에 기여하는 것으로, 생산 현장에서도 일상적으로 행해지고 있으며, 개개의 ET 산자가 가지는 영향은 크다.</span></p>
<p class="bx-num"><span class="bxn" data-n="411">•</span><span>NT에 의한 클론소는 수정란의 할구를 도너 세포핵에 이용하는 수정란 클론소와, 체세포를 도너 세포핵에 이용하는 체세포 클론소의 두 가지로 분류된다. NT는 다양한 기기나 약제를 사용하고, 나아가 마이크로매니퓰레이션 기술(주3)을 필요로 하기 때문에, 클론소의 대부분이 공립 시험장이나 연구기관에 의해 기술 개발과 함께 생산되고 있다. 2020년 현재 국내 실시기관은 47기관으로, 지금까지의 수정란 클론소의 출생두수는 741두, 체세포 클론소는 598두에 그치고 있다(3). 그러나 전술한 ET와 함께 NT는 동일한 핵내 유전자를 소유한 소를 다수 생산할 수 있기 때문에, 연구 분야뿐 아니라 유효 활용이 기대되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="412">•</span><span>국내의 소 생산의 95% 이상은 인공수정(Artificial insemination: AI)에 의해 행해지고 있는데, 종모우나 암소의 개량에 의해 육질이나 유량 등의 개선·향상과 함께 소 개체의 체격도 커지는 경향에 있으며, AI 산자의 출생 시 체중 증가와 함께 임신기간의 연장이 일어나고 있음이 시사되고 있다. 마찬가지로 ET나 NT에 의한 산자에서는 그 유래에 따라 몇 가지 특징이 보인다. 본 절에서는 ET에 의해 생산된 in vivo 산자, in vitro 산자 및 클론 산자의 특징에 관해 기술한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="413">•</span><span>※ 주1) in vivo: 생체 내에서 일어나는 반응 또는 과정. 여기서는 동물에 과잉배란 처치 후 AI를 행하고, 자궁 내에서 수정하여 성장한 배를 사용해 ET를 행하여 얻어진 것을 in vivo 산자로 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="414">•</span><span>※ 주2) in vitro: 시험관 내에서 일어나는 반응 또는 과정. 여기서는 도축장에서 난소로부터 채취된 미성숙 난자를 성숙 배양하거나, 생체의 난포에서 채취한 성숙 난자 또는 미성숙 난자를 성숙 배양한 후에, 샬레 안에서 수정능을 획득한 정자와 합쳐 배반포까지 배양한 배를 사용해 ET를 행하여 얻어진 것을 in vitro 산자로 한다. 이 과정의 수정을 체외수정(in vitro fertilization: IVF)이라 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="415">•</span><span>※ 주3) 마이크로매니퓰레이션 기술: 도립현미경과 마이크로매니퓰레이터(미세작업장치)를 사용하여 배의 분할, 분할구의 투명대 내 이동, 난자로부터의 제핵, 난자로의 DNA나 정자의 주입 등을 행하는 기술.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">ET 기술의 변천</div>
<p class="bx-num"><span class="bxn" data-n="416">•</span><span>ET에 의한 소의 생산은 1964년 杉江 등에 의한 비외과적 배이식법(경관경유법)이 성공한 이래 크게 발전하였다. 농림수산성의 축산통계조사(2)에 따르면, 2015년도의 ET에 의한 수태율은 신선배 및 동결배의 in vivo 배이식에서 각각 50% 및 45%, in vitro 배이식에서는 각각 36% 및 37%로 보고되어 있다. 또 단순히 이식두수와 산자수로부터 산출된 ET 산자의 출생률은 in vivo 배이식이 20%(1만 5,621두/7만 6,754두), in vitro 배이식이 16%(3,715두/1만 9,336두)에 지나지 않는다. 이것은 소의 등기 등록상의 문제도 포함하고 있을지 모르지만, 임신진단 이후의 유·조산 발생도 요인으로 생각된다. ET에 의한 임신진단 후의 유산 발생은 AI보다 높은 것이 알려져 있다. 또 NT에 의한 클론 배이식에서는 AI나 ET에 비해 낮은 수태율과 높은 유산율이 보고되어, 체세포 클론 배이식으로 임신한 소의 70%가 유</span></p>
<p class="bx-num"><span class="bxn" data-n="417">•</span><span>산한 것도 보고되어 있다(4). 그러나 클론 배이식 후의 초음파 화상진단장치에 의한 임신진단에서의 자궁 내 소견에서는, 태아의 결여나 태아가 정상적으로 발생하고 있지 않은 경우가 있어(그림 1-8-1), 이들 이상 임신을 임신으로 오진함으로써 유산율이 높아지는 것으로도 추측되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="418">•</span><span>또 체세포 클론 배에서는 유전자 발현의 이상도 보고되어 있으며(5), 나아가 임신 중기부터 후기에 걸쳐 태막수종의 발생도 보인다. 이들은 특히 체세포 클론 배이식에서 발생하며, 개선하기 위해 앞으로의 연구가 기대된다. 현 단계에서는 클론 배이식에 의한 임신에 관해서는 주의 깊게 경과를 관찰하는 것이 중요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="419">•</span><span><i>그림 1-8-1 NT 배이식 후 60일의 초음파상</i></span></p>
<p class="bx-num"><span class="bxn" data-n="420">•</span><span><i>A: 이상 임신. 태아가 덩어리로 보인다. 80일째에 유산하였다.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="421">•</span><span><i>B: 정상 임신. 태아에 몸의 각 부위가 보인다. 정상적인 산자가 얻어졌다. 원도: 窪田力(이하, 동일)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">클론 신생 송아지의 특징</div>
<p class="bx-num"><span class="bxn" data-n="422">•</span><span>ET나 NT에 의한 산자에서 가장 특징적인 현상은 출생 전후에 보이는 경우가 많다. 출생 시 사고의 발생도 많아, AI 유래의 산자에서는 사산율이 약 5%, 생후 직사(直死)가 약 2%로 되어 있는 데 비해, 수정란 클론 산자에서는 각각 10.4%와 5.0%, 체세포 클론 산자에서는 14.9%와 15.7%로 모두 높은 비율이 보고되어 있다(6). ET 산자나 NT 산자에서 가장 흔히 보이는 현상은 임신기간의 연장(장기 재태)과 산자의 출생 시 체중 증가로, 이것은 「과대자 증후군(Large calf syndrome: LCS)」이라 칭해진다(7). LCS는 임신기간의 연장과 출생 시 체중의 증가 외에 출생 시의 허약이 특징으로 여겨지며, ET 산자 중에서도 in vitro 산자와 NT 산자에서 흔히 보인다. in vitro 산자와 NT 산자의 출생 시 체중은 일반적인 AI 유래 산자에 비해 3할 이상의 증가가 인정되며, 때로는 배 이상의 출생 시 체중을 가지는 산자도 보인다. AI 유래의 산자에서도 임신기간(재태기간)의 연장에 의해 태아 체중이 증가하는 것이 알려져 있지만, 전술한 것처럼 in vitro와 NT에서는 배(태아)의 유전자 발현에 어떠한 이상이 있는 것으로 추측되고 있다. 또 in vitro 산자와 NT 산자에서는 생후 직사도 보이며, 그 빈도는 in vitro 산자보다 NT 산자 쪽이 높고, NT 산자 중에서도 수정란 클론 산자보다 체세포 클론 산자의 경우가 많다. 암컷 체세포 클론 산자에 관해 출생 직후에 사망한 소와 생존한 소에서 유전자 해석을 행한 성적에서는, 생후 직사한 소의 성염색체 상의 유전자 발현에 이상이 인정된 것이 보고되어 있다(8). 특히 클론 배이식에서는 전술한 것처럼 임신기간 중의 태아 손실과 함께 분만 시의 신생아 사망이 발생한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="423">•</span><span>in vitro 산자와 NT 산자의 허약은 주로 호흡·순환기계의 임상증상으로 관찰된다. 또 LCS의 특징으로 여겨지는 분만 후부터 기립까지의 시간 연장과 약한 초유 흡유 행동 때문에, 에너지 부족에 의한 저체온증 등 위기적 상황에 빠지는 산자도 있다. 그 밖에도 포유류에서는 분만 시의 제대 절단에 따라 태아 순환에서 폐순환으로 바뀌어 절단된 제동·정맥은 즉시 수축하지만, 체세포 클론 산자에서는 특히 요막관(제동맥)의 수축이 둔하여, 분만 후에 단열된 제대 단단으로부터의 출혈이 멈추지 않거나, 혹은 제대를 결찰해도 복강 내의 요막관 내에 다량의 혈액이 저류하는 등의 이상이 발생한다(그림 1-8-2). 이 때문에 분만 직후의 체세포 클론 산자는 극도의 빈혈을 보이는 경우가 있고(그림 1-8-3), 그중에는 CBC(complete blood count) 검사에서 적혈구수가 500만/mL 이하, Ht치가 30% 이하가 되는 경우도 있기 때문에, 즉시 수혈이나 산소 흡입 등의 수의학적 처치가 필요해지는 경우가 있다. 그러나 이러한 증상은 체세포 클론 산자에서만 인정되는 점에서, in vitro 산자와 NT 산자에서 보이는 LCS의 병태는 다르다고 생각된다. 또 LCS의 발생은 in vitro 산자나 NT 배처럼 난자나 배를 체외 배양할 때의 배양기간의 장단이나 배양 시의 혈청 첨가 유무가 관련되어 있음이 보고되어 있다. 나아가 출생 직후에 사망한 체세포 클론 산자의 병리조직학적 검색에서는 AI 산자에 비해 태반, 하수체, 부신, 갑상선 등에 이상이 있고, 특히 부신의 차이에 관해서는 재태기간의 연장이나 생명력에도 관련되</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="424">•</span><span><i>그림 1-8-2 소의 출생 직후 요막관 이상의 유무(화살표)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="425">•</span><span><i>A: 요막관의 퇴축 부전에 의해 혈액의 저류가 보인 클론소.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="426">•</span><span><i>B: 요막관이 정상적으로 퇴축한 AI 산자.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="427">•</span><span><i>컬러 구회(口繪), 11페이지</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="428">•</span><span><i>그림 1-8-3 체세포 클론 산자와 AI 산자(각 6두)의 출생 직후부터의 적혈구수 추이</i></span></p>
<p class="bx-num"><span class="bxn" data-n="429">•</span><span>어 있는 것으로 추측되고 있다. 또 어미소에 제한 급이(저영양)로 관리를 행하면 AI 산자에서는 출생 시 체중이 감소하지만, 체세포 클론 산자에서는 출생 시 체중의 감소가 인정되지 않는 것이 보고되어 있다(8). 이러한 점에서 출생 시 체중의 증가, 임신기간의 연장이나 신생아 허약은 in vitro 산자와 NT 산자 양쪽에 공통으로 보이는 특징이지만, 제대의 수축 부전은 NT 산자 중에서도 체세포 클론 산자에서만 인정되는 것으로, LCS는 체외에서 작출된 배나 태아의 유전자 발현의 문제인 것으로 추측된다. 또 체세포 클론 산자의 수컷 산자에서는 출생 시에 곱슬털 등 성숙 수소와 같은 외모가 보이는 경우가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">클론소의 발육</div>
<p class="bx-num"><span class="bxn" data-n="430">•</span><span>in vivo 산자, in vitro 산자 및 수정란 클론 산자는 출생 후의 발육 등에서 AI 산자와 다른 점은 보고되어 있지 않다. 전술한 것처럼 in vitro 산자 및 수정란 클론 산자는 출생 시에 LCS가 보이는 경우가 있지만, 그 후에는 AI 산자와 다르지 않은 성장을 한다. 그러나 체세포 클론 산자는 전술한 것처럼 출생 직후에 빈혈이 되는 경우가 있어, 수혈 등의 처치를 행하면 증상을 개선할 수 있지만, 수혈을 행하지 않은 경우에는 AI 산자와 동등한 혈구 성분치가 될 때까지 약 1개월을 요한다(그림 1-8-3). 그러나 출생 직후부터 1개월간의 그 밖의 혈구 성분이나 혈중 생화학 성분에 관해서는 AI 산자의 그것들과의 차이는 인정되지 않는다. 또 1례이지만, 체세포 클론 산자에서의 면역부전증의 보고가 있다(9). 체세포 클론 산자에서는 가령한 체세포를 도너로 이용하는 점에서, 산자의 수명에 관해 조사되고 있다. 그러나 수명이라고 해도 최초의 클론소가 생산되고 나서 아직 20년 남짓이며, 더욱이 출생한 산자는 식육 출하나 시험 공용에도 이용되고 있는 점에서, 생물학적 수명이 아니라 수명에 관련되는 텔로미어(주4) 유전자에 관해 조사되고 있다. 세계 최초의 체세포 클론 양(돌리)은 유선 상피세포를 도너 세포로 하여 작출되었는데, 이 텔로미어 유전자는 동년령의 양보다 짧았던 것이 보고되어 있다. 클론소에서도 마찬가지이지만, 피부 유래 섬유아세포를 도너로 한 클론소의 텔로미어 유전자는 단축되어 있지 않은 것이 보고되어 있다. 현재는 상피계 세포를 도너로 한 클론소의 텔로미어 유전자는 도너와 동등한 텔로미어 유전자 길이를 가지고, 섬유아세포를 도너로 한 경우의 클론소의 텔로미어 유전자는 재신장하여 도너보다도 길다, 즉 동년령의 소와 동등한 길이를 가진다고 여겨져, 도너로 이용하는 체세포의 종류에 따라 클론소의 텔로미어 유전자 길이가 다른 것을 알 수 있다. 그러나 이것은 텔로미어 유전자에서의 이야기이며, 체세포 클론소의 생물학적 수명의 해명에 관해서는 시간을 요하는 조사가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="431">•</span><span>ET 산자의 생산물(고기나 우유)에 관한 조사도 행해지고 있다(10). 원래 in vivo 배이식은 우량 자축의 생산을 목적으로 행해지고 있으며, 육용우의 육질이나 육량, 유용우의 유질이나 유량의 향상에 크게 공헌하고 있는 것은 틀림없다. 수정란 클론 산자는 클론끼리 동등한 표현형이나 능력을 가지는 점에서, 체세포 클론 산자는 도너 세포를 채취한 소와 완전히 같은 핵내 유전자를 가지기 때문에, 도너소와 동등한 표현형이나 능력을 보이는 것이 기대되고 있다. 그러나 클론소끼리의 출생 시 체중은 같지 않</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="432">•</span><span><i>그림 1-8-4 체세포 클론 거세우 2두의 비육 후 지육</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="433">•</span><span><i>그림 1-8-5 왼쪽 안쪽부터 도너소, 클론소(2두), 리클론소</i></span></p>
<p class="bx-num"><span class="bxn" data-n="434">•</span><span>다. 이것은 클론 배를 이식받은 대리모우의 자궁 내 환경의 차이에 의한 것으로, 같은 핵내 유전자를 가지는 클론소끼리의 비문(鼻紋)이 다른 것도 마찬가지로 대리모우의 자궁 내 환경에 의해 비문을 형성하는 유전자 발현의 타이밍이 달라져 있기 때문으로 생각되고 있다. 한편 생후의 발육은 AI 산자와 다를 바 없고, 클론끼리도 거의 같은 발육(증체, 체격 부위)을 한다. ET 산자는 춘기발동(주5)과 함께 암수 각각의 성행동을 보이고, 수컷은 정자를 생산하며 암컷은 난자를 배란한다. in vivo 산자나 in vitro 산자에 관해서는 야외에서도 문제없이 암수의 생식세포(정자, 난자)를 이용한 후대 산자의 생산이 행해지고 있다. 클론 산자에 관해서도 춘기발동이나 성성숙 시기 외에, 암수 모두 정상적인 내분비나 생식기의 번식 기능을 가지며, 후대 산자의 생산도 가능함이 보고되어 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="435">•</span><span>전술한 것처럼 클론 산자는 임신기간, 출생 시에 LCS 등의 이상이 보이는 경우가 있지만, 클론 산자에 대한 AI에 의한 후대 산자에는 아무런 이상이 보이지 않는 점에서 LCS는 유전하지 않는 것으로 생각되며, 나아가 클론 산자의 후대 산자의 번식성에 관해서도 통상의 소와 다름없음이 확인되어 있다. 또 클론 산자 및 후대 산자의 우유와 고기 등 생산물의 평가에 관해서도 지금까지 이상은 인정되지 않았고(11), 흑모화종 거세 체세포 클론 산자의 비육 후 육질은 양호했던 것이 보고되어 있다(그림 1-8-4). 나아가 클론 산자의 체세포를 도너로 한 클론 산자(리클론)에 관해, 리클론소(수컷)의 발육, 번식성에도 이상은 인정되지 않았고, 리클론소의 후대 산자도 마찬가지로 이상이 보이지 않는다(12)(그림 1-8-5).</span></p>
<p class="bx-num"><span class="bxn" data-n="436">•</span><span>이러한 점에서 ET 산자의 특징에 관해 아래와 같이 정리된다. in vivo 산자는 AI 산자와 같거나 거의 다르지 않고, in vitro 산자에서는 출생 직후에 LCS가 드물게 보인다. 나아가 ET 산자의 발육은 AI 산자와 다르지 않고, 번식성, 산육성, 산유성에 관해서도 그들의 후대 산자에는 아무런 이상이 보이지 않는다. 클론 산자에서는 유·조산의 발생이나 생후 직후의 LCS와 함께 제대의 수축 부전이 보이는 경우가 있다. 또 체세포 클론 산자에 관해서는 도너소의 연령과 NT에 이용한 체세포의 종류에 따라 텔로미어 유전자 길이에 차이가 보인다. 체세포 클론 산자는 최초의 1두가 생산되고 나서 20년이 채 되지 않는 점에서, 앞으로도 데이터의 집적이 필요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="437">•</span><span>※ 주4) 텔로미어: 염색체의 말단에 있는 구조. 세포가 둘로 분열할 때 말단 부분(텔로미어)은 복제되지 않기 때문에, 세포분열을 반복할 때마다 텔로미어가 단축되어 분열 횟수에는 한계가 있다. 그러나 암세포나 생식세포에서는 텔로미어를 신장시키는 텔로머라제가 작용하고 있으므로 제한 없이 증식 가능하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="438">•</span><span>※ 주5) 춘기발동: 성성숙이 개시되는 시기. 수컷에서는 정자 형성, 암컷에서는 배란 가능한 난포 형성이 개시되는 시기에 상당한다. 춘기발동이 완료되면 성성숙기가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="439">•</span><span><span style="color:var(--ink-soft)">(저자: 安藤貴朗)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">ET 산자나 클론 기술의 향후 과제와 활용성에 관하여</div>
<p class="bx-num"><span class="bxn" data-n="440">•</span><span>근년 낙농가에서 와규 송아지 가격의 급등 등으로 인해 유용 암소로부터의 와규 수정란을 이용한 ET가 실시되어 와규 송아지 생산이 행해지고 있다. 전국와규등록협회에 의한 ET 산자의 등록두수(13)에서는 ET 산자는 2015년 이후 급증하고 있으며, 2018년에는 4만 7,080두에 달했다. 이것은 등록된 송아지의 9.7%, 즉 약 1할에 상당한다. 그러나 유용 암소로부터 생산된 ET 산자는 작은 경우가 많고, 최종적인 산육성이나 육질이 통상의 와규 산자</span></p>
<p class="bx-num"><span class="bxn" data-n="441">•</span><span>에 비해 떨어지는 경우가 있음이 확인되어 있다(가고시마현 축산시험장 조사). 유용 암소에 관해서는 비유와 임신을 병행하여 유지하지 않으면 안 된다. 유용 암소의 내용연수에 관계되는 비유 지속성 등의 문제도 제기되고 있어, 임신기와 비유의 관계성 등 유용 암소에서의 와규 수정란 ET에 의한 와규 송아지 생산에 관해 앞으로 검토할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="442">•</span><span>소를 이용한 연구에는 막대한 경비가 필요하다. 요즈음 축산 혹은 수의 분야에서는 연구 자금의 획득이 어려워진 것이나, 대동물 실험의 노력 등의 관계로 공시두수를 많이 할 수 없는 사례가 늘고 있다. 또 동물실험의 시비에 관한 논의도 있어, 앞으로는 논리적으로 과학적 의의를 유지하는 최소한의 공시두수로 실험을 할 수밖에 없게 되는 것이 상정된다. 적은 공시두수로, 게다가 실험의 정밀도는 높이지 않으면 안 된다. 그 하나의 가능성으로서 ET 산자나 클론 산자의 활용이 생각된다. 현재 연구는 포스트 게놈 시대에 들어가, 에피제네틱스 연구의 시대에 들어가 있다. 즉 정밀도 높은 결과를 구하려면 같은 DNA를 가지는 개체 간의 비교가 필요해진다. 앞으로의 축산업 발전을 위한 연구에 클론 산자나 분할란에 의한 일란성 쌍둥이의 활용은 유용하다. 완전히 같은 유전자 배경을 가진 가축에 대해 여러 실험 처리를 가해 감으로써, 적은 두수로 그 효과를 정밀도 높게 해석하고 연구 결과를 논할 수 있다. 그들 연구의 추진에 의해 과학적 진보의 가속이 기대된다. 이러한 의미에서 ET 기술의 더 나아간 발전과, 클론 기술의 발전과 클론 산자의 연구적 활용은 앞으로도 유용한 기술이라 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="443">•</span><span><span style="color:var(--ink-soft)">(저자: 後藤貴文)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="444">•</span><span>본 절은 2009년 발간된 『子牛の科学』 게재의 窪田力 선생의 원고를 바탕으로 작성한 것이다.</span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="445">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-9 백신 접종 프로그램</div>
<div class="bx-sub"><div class="bx-subtitle">태아의 면역계</div>
<p class="bx-num"><span class="bxn" data-n="446">•</span><span>자궁 내에서 발육 중인 태아의 면역기관은 그 밖의 일반 장기와 마찬가지로 발생 도상에 있다. 이 때문에 태아의 면역 응답능은 극히 미숙하다. 태령 중기 전후에 호중구나 단구 등의 탐식세포를 주체로 하는 백혈구가 조혈 줄기세포에서 분화하여 말초혈 중으로 순환해 오지만, 그것들이 기능을 발현하는 것은 임신 후기가 되고 나서이다. 림프구를 주체로 하는 면역 담당 세포도 말초혈 중으로 보내지지만, 이들은 흉선, 비장, 림프절 등의 실질 장기 중으로 이동하여, 충분한 기능이 발현되는 것은 출생 수주 후이다(1). 자궁 내에 침입한 어떤 종류의 바이러스나 세균 등의 외래 병원인자는 태아의 면역계에 항원으로 인식되어 태아 체내에서 항체가 산생되는 경우도 있지만, 그 능력은 출생 후의 면역 응답능에 비해 매우 낮아 감염 방어의 역할을 다하기는 곤란하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="447">•</span><span>따라서 자궁 내에서 발육 중인 태아에 백신을 접종한다 하더라도 유효한 면역 부여는 이루어지지 않는다. 나아가 소에서는 태반의 구조상 태아가 자궁 내에서 모자 면역을 획득하는 것은 불가능하다. 출생 직후부터 다양한 감염 인자에 노출되는 태아에게 감염 방어의 주체가 되는 것은 출생 후의 초유 섭취에 의해 획득하는 어미소로부터의 항체나 면역 담당 세포이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">백신 접종법</div>
<p class="bx-num"><span class="bxn" data-n="448">•</span><span>태아기 백신 접종의 목적은 정상적인 임신을 저해하는 인자의 예방을 위해, 태아 기형이나 사·유산의 원인이 되는 감염성 인자에 대한 면역 응답능을 어미소에 부여하는 것이다. 더욱 중요한 것은 출생 후 신생아에게 신속하고 확실하게 감염 방어능을 획득시키기 위해, 일시적이기는 하지만 그 방어능을 담당할 수 있는 성분을 어미소의 초유 중에 분비시켜 두는 것이다. 즉 효과적인 모자 면역을 위한 초유 성분 조정을 주목적으로 한 어미소에 대한 면역 부여법으로서의 백신 접종을 생각할 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신을 저해하는 감염 인자에 대한 백신 접종 프로그램</div>
<p class="bx-num"><span class="bxn" data-n="449">•</span><span>소에 태아 기형이나 유사산 등을 유발하는 감염 인자를 표 1-9-1에 나타낸다. 대부분의 병원 인자에 대한 백신은 개발되어 있지만, 모두가 일본 국내에서 시판 유통되고 있는 것은 아니다(2).</span></p>
<p class="bx-num"><span class="bxn" data-n="450">•</span><span>소 이상산 백신으로서 아카바네 바이러스에 대한 생백신과, 복수의 바이러스를 혼합한 불활화 백신이 있다. 어느 바이러스도 흡혈 곤충(주로 모기)에 의해 매개되어, 그들의 활동 시기인 여름철부터 늦가을에 걸쳐 감염이 확대되므로, 그때까지 확실하게 면역을 부여해 둘 필요가 있다. 즉 3~6월에 걸쳐 백신 접종하는 것이 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="451">•</span><span>소 바이러스성 설사 바이러스(Bovine viral diarrhea virus: BVDV)에 대한 생 및 불활화 백신도 시판 유통되고 있지만, 다른 호흡기병 바이러스와의 혼합 백신으로 제품화되어 있다. 임신우에 생백신을 접종하면 태아가 백신주에 감염되어 지속감염우가 되는 경우가 있으므로 주의하지 않으면 안 된다. 포유 육성기에서의 호흡기병 대책으로서 백신은 유효하지만, 자궁 내 감염을 저지할 수 있을 정도의 충분한 항체가 상승은 얻어지지 않는다. 따라서 지속감염우 산출 예방 혹은 이상산 예방의 목적만으로의 백신 접종은 충분한 효과를 기대할 수 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="452">•</span><span>네오스포라증은 일본에서도 산발적으로 유행이 인정된다. 구미에서는 백신이 시판되고 있지만, 개발 도상이며 충분한 예방 효과가 얻어지지 않고 있다. 이들 이외의 표 1-9-1에 제시된 감염증에 관해 일본 국내에서 백신이 시판되지 않고 있는 것은, 일본에서는 소에 발생이 없거나 또는 일본에서는 극히 드문 감염증이라고 생각되고 있기 때문이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">효과적인 초유 성분 조정을 위한 백신 접종 프로그램</div>
<p class="bx-num"><span class="bxn" data-n="453">•</span><span>자궁 내에서 모체로부터 유효한 면역능을 획득할 수 없는 태아에게 출생 직후의 초유 섭취는 일시적인 면역 응답능을 획득하기 위해 매우 중요하다. 초유에 포함되는 면역글로불린(Ig) A, IgG, IgM 양은 상유(常乳) 중에 포함되는 <b>표 1-9-1 소에 이상산(異常産)을 일으키는 감염증</b></span></p>
