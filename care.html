:left">소 유행열</td><td style="text-align:left">Bovine ephemeral fever virus</td><td style="text-align:left">유(사)산</td><td style="text-align:left">매개하는 흡혈곤충(모기)이 활동을 시작하기 1개월 전까지</td></tr><tr><th>바이러스</th><td style="text-align:left">슈말렌베르크바이러스 감염증</td><td style="text-align:left">Schmallenberg virus</td><td style="text-align:left">골격 및 중추신경계 기형</td><td style="text-align:left">—</td></tr><tr><th>세균</th><td style="text-align:left">브루셀라증</td><td style="text-align:left">Brucella abortus</td><td style="text-align:left">유(사)산</td><td style="text-align:left">4~12개월령 시*</td></tr><tr><th>세균</th><td style="text-align:left">렙토스피라증</td><td style="text-align:left">Leptospira spp</td><td style="text-align:left">유(사)산</td><td style="text-align:left">균종에 따라 다르나 매년 1회 이상</td></tr><tr><th>세균</th><td style="text-align:left">캄필로박터병</td><td style="text-align:left">Campylobacter fetus</td><td style="text-align:left">유(사)산</td><td style="text-align:left">수정 6~8주 전 및 3~4주 전*</td></tr><tr><th>세균</th><td style="text-align:left">전염성 혈전색전성 수막뇌염</td><td style="text-align:left">Histophilus somni</td><td style="text-align:left">유(사)산</td><td style="text-align:left">육성기, 수정 전</td></tr><tr><th>세균</th><td style="text-align:left">클라미디아증</td><td style="text-align:left">Chlamydophila abortus</td><td style="text-align:left">유(사)산</td><td style="text-align:left">—</td></tr><tr><th>원충</th><td style="text-align:left">네오스포라증</td><td style="text-align:left">Neospora caninum</td><td style="text-align:left">유(사)산 / 중추 이상</td><td style="text-align:left">임신 초기*</td></tr><tr><th>원충</th><td style="text-align:left">트리코모나스</td><td style="text-align:left">Trichomonas foetus</td><td style="text-align:left">유(사)산</td><td style="text-align:left">수정 4주 전*</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="455">•</span><span>— : 백신 미개발  * : 국내(일본) 시판 백신 없음</span></p>
<p class="bx-num"><span class="bxn" data-n="456">•</span><span>그것들보다 10~수십 배나 많고, 산차를 거듭할수록 증가한다. 초유에 포함된 Ig는 분만 수 주 전부터 유선 내로 분비되어, 어미소의 혈중에서 가지고 있던 활성을 유지한 채 축적된 것이다. 출생 후 약 24시간 이내에 초유를 섭취한 신생 송아지는 이들 Ig를 흡수하여 전신 순환시키고, 스스로 어느 정도 면역응답을 할 수 있게 되는 수 주령에 이를 때까지 그 Ig를 생체방어에 이용한다. 또한 초유 중에는 인터루킨(IL)-1, IL-6, 종양괴사인자(TNF) 등의 사이토카인, T림프구와 단구를 주체로 하는 어미소의 말초혈액세포 유래 세포도 포함되어 있다. 이들은 초유로부터 신생 송아지에 흡수되어 수 일령까지는 체순환에서 이용된다. 초유로부터의 면역물질 흡수능이 저하한 뒤(약 2일령 이후)에도, 초유 중의 이들 면역물질은 소화관 내강에서 감염 방어에 이용된다. 이상과 같이 출생 직후의 송아지에게 초유가 생체방어에 담당하는 역할은 크며, 이를 적정하게 분비할 수 있도록 준비해 둘 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="457">•</span><span>경산우는 그 지역에서 유행하고 있는 병원체에 대한 항체를 초유 중에 적절히 분비할 수 있다고 생각되지만, 초산우에서는 그것이 순조롭지 않은 경우가 있다. 신생 송아지의 설사로 인한 손실이 심한 지역에서는, 초임우에 대한 분만 전 백신 접종이 유효한 대책의 하나가 된다. 특히 신생자에 중증 증상을 일으키는 감염증에 대해서는, 미리 초유 중의 항체량을 높여 두어 분만 후의 초유 분비에 대비해 두는 것이 유효하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="458">•</span><span>1주령 미만의 신생 송아지에 발생하는 치사율 높은 설사증으로 대장균성 설사증이 있다. 독소원성 대장균이 신생 송아지에 감염되어 일어나며, 소 로타바이러스나 코로나바이러스가 혼합 감염되면 4주령 전후에도 발병한다. 이 시기 송아지의 감염 저항성은 앞서 기술한 대로 초유로부터 획득한 어미소 유래 면역물질에 의존하고 있어, 초유 급여법이 적절하더라도 그 조성이 적절하지 않으면 감염 시 발증하거나 증상이 중증화할 가능성이 높아진다. 그 대책으로, 태자 단계에서 면역을 부여할 수는 없으므로 초유에 충분한 양의 이행항체를 준비해 두고, 출생 후 적절한 초유 섭취에 의해 면역을 획득시킬 필요가 있다. 효과적으로 초유 중의 이행항체량을 높이는 수단으로, 임신 말기의 어미소에 이 설사증에 대한 백신을 접종한다. 일본에서는 송아지 대장균성 설사증의 원인이 되는 대장균 K99주와 소 코로나바이러스 및 소 로타바이러스를 혼합한 3종 혼합 불활화 백신이 시판되고 있다. 백신 접종 프로그램은, 산차 혹은 유량 차이에 따른 유즙 중 항체 분비 정도의 차이를 고려하여, 경산 육우에서는 분만 예정일 3~4주 전에 1회, 미경산 육우 및 젖소에서는 분만 예정일 6~8주 전 및 3~4주 전의 총 2회 접종한다. 분만 직전의 어미소에서는 혈중 항체가의 상승에 의해 유즙 중으로의 항체 분비량도 늘어나므로, 접종 시기가 너무 이르면 유효한 초유 성분의 조정이 되지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="459">•</span><span><span style="color:var(--ink-soft)">(저자: 田島誉士)</span></span></p>

<div class="bx"><div class="bx-title">1-10 태자기 영양이 태자 골격근 및 생산된 자축의 산육성 등에 미치는 영향</div>
<div class="bx-sub"><div class="bx-subtitle">바커 가설의 진화와 DOHaD</div>
<p class="bx-num"><span class="bxn" data-n="461">•</span><span>이 책의 전신에 해당하는 『송아지의 과학』에서도 "바커 가설의 소에의 응용"이라는 항목에서 조금 소개된 바 있으나, 근년 사람의 태아기 및 동물의 태자기, 초기 성장기의 영양이 생후의 신생아 및 신생자에 미치는 영향에 관한 연구가 축적되고 있다. 영국 환경역학의 권위자인 David Barker 박사는 1980년대에 "사람 태아기에 저영양 상태인 것이 성인기 심혈관 장애의 위험인자가 된다"는 "바커 가설(Barker hypothesis)"을 발표하였다. 당시에는 전혀 찬동을 얻지 못했으나, 이후 많은 기초연구에 의해 그 가설이 실증되어 왔다¹⁾. "그 가설"이란, 저영양 상태에 노출된 태아가 그 환경에 적응하려 한 결과 전체적으로 절약적인 체질이 되고, 또 근육량 감소, 신장의 네프론 수 감소, 췌장의 β세포 감소 등이 일어난다는 것이다. 이러한 변화는 일시적인 것이 아니라 영속적으로 남아, 태어난 아이가 성인이 된 뒤의 질병, 특히 고혈압, 당뇨병, 심근경색 등의 발증 위험을 증대시킨다²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="462">•</span><span>근년 이 가설은 학문 체계로 정리되어 왔다. 즉 생물과학, 특히 의학 분야에서는 태아기나 신생아기, 특히 이유기까지 받은 영양 자극에 의해 그 후 동물체의 대사 시스템, 체질 및 형태가, 나아가 최근 연구에서는 특히 간, 골격근 및 지방조직의 대사에 커다란 영향을 미친다는 것이 밝혀지고 있다. 실험동물을 이용한 연구가 특히 의학 분야를 중심으로 진행되고 있으나, 가축을 이용한 실험도 증가하고 있다. 사람의 모델로 삼은 면양이나 돼지의 실험이나, 가축의 생산성에까지 파고든 연구도 증가하고 있다. 이 가설은 DOHaD(Developmental Origins of Health and Disease: 성장 과정의 영양 상태나 환경인자의 작용에 기인하는 질환의 발생)라는 개념으로 의학 분야에서 받아들여져³⁾, 후성유전학(epigenetics) 연구 분야와 관련하여 연구가 진행되고 있다⁴⁾⁵⁾. 이 DOHaD 가설은, 동물 생산 시스템의 고도화를 지향하는 축산 분야에서는 임신기나 신생자기의 영양 제어에 의해 가축 생산성이 바뀐다고 받아들일 수 있어, 생산 기술에 응용할 수 있는 가능성이 있다(그림 1-10-1).</span></p>
<p class="bx-num"><span class="bxn" data-n="463">•</span><span>이 DOHaD 가설과 관련하여 "네덜란드의 기근(Dutch famine)"이라는 유명한 역학조사가 있다. 이 조사는 네덜란드에 심장질환이 매우 많은 지역이 있어, 왜 그러한 질병의 발생이 편향되어 있는지에 대해 그들의 생애를 상세히 역학조사한 것이다. 그 결과, 그들이 태아기에 있던 1944~1945년에 그들의 어머니가 살고 있던 지역이 전화(戰火)를 입어 독일군에 의해 식량 봉쇄를 받았던 것이 판명되었다. 그 때문에 그들을 임신하고 있던 어머니는 (추정) 하루 약 700 kcal밖에 먹을 수 없었다. 이 조사 결과를 바탕으로 한 최근 연구에서, 태아기 어머니의 영양이 적고 출생 시 체중이 작은 것은, 특히 임신기의 저영양과 그 결과로서의 신생아 저체중, 성숙 후의 비만, 심장질환, 당뇨병이나 고혈압의 발증과 밀접하게 관련되어 있음이 밝혀졌다⁶⁾⁻⁸⁾. 이처럼 태자는 출생 후 자신이 살아갈 환경을 특히 어머니의 영양 상태로부터 모니터링하고, 그 환경에 맞추어 몸의 크기나 대사를 설정해 간다는 가설이 제창되게 되었다. 이 가설로부터, 이 개념은 "Predictive Adaptive Response(예측적응반응)"라고도 불린다⁹⁾. 특히 사람은 야생동물과 달리 출생 후의 영양 환경에서 "Mismatch"가 일어날 수 있다. 사람 임산부의 경우, 임신 중의 체형 변화 등을 신경 써서 식사량을 줄이거나, 혹은 편식 등에 의해 태아에게 저영양 상태가 되는 일이 있다. 이에 따라 생후 환경은 태아에게 저영양이라고 판단되어, 그러한 환경에서 살아남을 수 있는 몸으로 만들기 위해 몸을 소형화한다. 그것은 결과적으로 저체중아를 출산하게 된다. 그러나 그 후 어머니는 저체중이며 절약적인 체질을 준비해 온 신생아에게 (건강과 높은 성장을 바라며) 고영양을 주는 일이 있다. 이 "Mismatch"가 다양한 질병의 원인이 되고 있음이 밝혀졌다. 네덜란드 기근의 역학조사에서도, 식량 봉쇄를 받았던 지역의 어머니에게서 출생한 신생아는 종전 후 영양 환경이 개선되었다. 그것은 태아기의 영양 모니터링에 의해 준비해 두었던 몸의 크기나 대사 수준과 출생 후의 영양 수준 사이에 "Mismatch"를 낳아, 성인 후의 질병 발증에 크게 영향을 미쳤음이 밝혀졌다. 이 DOHaD 가설을 바탕으로, 인의학 분야에서는 태아기나 신생아기의 영양을 변화시켜 그 자손이 어떠한 표현형이나 체질을 갖는지에 관해 다양한 연구가 이루어지고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="464">•</span><span><i>그림 1-10-1 DOHaD 가설과 소 사양에의 응용</i></span></p>

<div class="bx-sub"><div class="bx-subtitle">DOHaD 가설과 후성유전학</div>
<p class="bx-num"><span class="bxn" data-n="465">•</span><span>이 DOHaD 개념은 주로 다음 4가지 요인에 의해 평가된다¹⁰⁾. 즉, ①태아기 및 신생아기의 한정된 기간의 가소성 시기 혹은 감수성 시기(Critical window)의 현상일 것, ②Critical window에서의 영양 자극 등에서 한 번 변화한 대사 시스템은 그 후 일관되게 변하지 않을 것, ③기관의 형태 변화 등도 동반할 것, ④Critical window에서의 영양 자극의 양적 차이가 그 후의 표현형 변화에 반영될 것, 이다. 이 개념은 앞으로 동물 생산 시스템의 고도화를 연구하고 있는 축산 분야에서는, 임신기 모축의 영양을 통한 태자 영양 혹은 신생자기의 영양이 동물 생산 기술이나 가축의 면역, 건강에도 크게 영향을 미친다는 것으로, 매우 흥미로운 것이라 할 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="466">•</span><span><i>그림 1-10-2 CpG 섬과 DNA 메틸화에 의한 전사 조절</i></span></p>
<p class="bx-num"><span class="bxn" data-n="467">•</span><span>이 개념의 기반이 되는 "후성유전학(epigenetics)"이라는 말은 Conrad Waddington 박사에 의해 명명되었다³⁾. "에피(epi)"는 "후천적"을 의미하고, "제네틱스(genetics)"는 "유전, 유전자나 유전학"을 나타낸다. 이것은 유전자(게놈)에 쓰인 유전정보를 "변경하지 않고", 개체의 발생이나 세포분화에서 후천적으로 "유전자 발현을 변화"시키거나 제어하는 현상의 총칭으로 사용된다. 후성유전학은 DNA 서열의 변화를 동반하는 것이 아니라, DNA 수식(修飾)에 관한 변화이다. 후성유전학적 수식에는 주로 3가지 패턴이 있다. 하나는 DNA 메틸화, 히스톤 수식, 그리고 noncoding micro RNA이다³⁾⁶⁾¹¹⁾. 이들 중 특히 DNA 메틸화 및 히스톤 수식은 영양 환경에 의해 강하게 영향을 받는다. 따라서 이 수식 기구를 영양 자극에 의해 제어할 수 있다면, 긍정적으로 가축 사양에 응용할 수 있는 가능성이 있다. 이들 수식의 영향은 세포분화 시의 유전자 발현의 강도와 발현 타이밍에 영향을 미치고 있다. 많은 포유류에서 엑손과 트랜스포존(전이하는 DNA)을 포함한 DNA는 메틸화된다. 메틸화는 시토신(C) 다음에 구아닌(G)이 나타나는 유형의 2염기 서열인 CpG 부위에서 일어난다(그림 1-10-2). CpG의 "p"라는 문자는 시토신과 구아닌 사이의 포스포디에스테르 결합(Phosphodiester bond)을 나타낸다. CpG 섬(CpG island)은 CpG 부위의 출현 빈도가 게놈 중 다른 영역에 비해 높고, 많은 CpG 부위가 메틸화되는 영역이다. 포유류 유전자 중 40% 이상이 프로모터 내부 혹은 그 근방에 CpG 섬을 포함하고 있는 경우가 많다. CpG 섬의 메틸화 패턴은 조직에 따라 다르며, 이 변이는 전사 스위치의 ON과 OFF를 관장하여 여러 조직에서 유전자 발현을 변화시킨다(그림 1-10-2). 히스톤 수식도 중요한 후성유전학적 수식이며, 히스톤은 DNA와 유사하게 메틸화에 의해 수식된다. 그러나 DNA와 달리 히스톤은 N말단의 아세틸화, 인산화, 비오틴화, 유비퀴틴화와 ADP리보스화를 포함하는 수식 패턴에 의해 수식되어 유전자 발현 제어를 수행하고 있다. 이들 후성유전학적 수식은 영양이나 환경 자극에 의해 제어되어 많은 대사 관련 유전자의 발현을 변화시키고, 결과적으로 대사 표현형에 강하게 영향을 미친다.</span></p>
<p class="bx-num"><span class="bxn" data-n="468">•</span><span>후성유전학적 수식은 유전자형 안에서 표현형의 가소성을 가능하게 하는 열쇠가 되는 기구이며, 환경으로부터의 자극에 최적으로 대응하도록 태자의 유전자 발현 변화를 가능하게 한다. 모체의 유지와 태자의 에너지 수요 사이의 영양 분배에 영향을 미치는 주요 요인은, 어미소의 연령, 태자 수, 젖소 등에서는 유생산과 자궁 내 태자에 관련된 영양 균형과 환경 스트레스이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="469">•</span><span>현재 태자기 프로그래밍에 관해 많은 기반 연구가 있다. 특히 태자기의 빈영양, 혹은 자궁내 발육지연(Intrauterine growth retardation: IUGR)이 자축에 미치는 영향을 보는 연구가 활발하다⁷⁾. 이들 연구에서는 자축의 출생 시 체중은 작지만, 그 후의 성장에 의해 태자기에 통상의 영양 환경이었던 자축을 따라잡는다(Catch-up-growth). 그러나 특히 지방이 많은 식사에 의해 지방 축적 항진, 글루코스 내성 이상, 인슐린 내성이 일어난다. 이것은 태자기나 신생자기의 렙틴 서지(주1)에 의한 에너지 대사 변화가 관련되어 있다고 보고되어 있다¹²⁾. 또 태자기의 발육지연은 신장의 네프론 수 감소나, 골격근 내 미토콘드리아의 기능부전도 일으킨다고 보고되어 있다¹³⁾. 또한 출생 시 체중과 밀접하게 관련된 성장호르몬(GH)-인슐린유사성장인자(IGF-I) 축(GH-IGF-I)도 태자기의 영양에 의해 조절을 받는다¹⁴⁾¹⁵⁾. 한편, 어머니의 임신기 BMI(Body mass index) 값의 크기는 그 아이의 비만 정도의 지표라고 보고되어 있다¹⁶⁾. 어머니가 임신기에 섭취하는 단백질과 엽산의 비율은, 자축의 이유 후 간에서의 DNA 메틸화 동태나 글루코코르티코이드 수용체, PPARγ(Peroxisomal proliferator-activated receptor γ)(주2)의 발현에 영향을 미친다는 것도 보고되어 있다¹⁷⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="470">•</span><span>축산에서 식육 생산이라는 관점에서 태자기의 골격근 형성을 생각할 때, 태자기의 영양은 우선 우선적으로 중요한 기관, 예컨대 뇌, 심장, 간 등 주요 기관의 형성에 사용되며, 골격근의 우선도는 낮아진다¹⁸⁾¹⁹⁾. 그 때문에 골격근에 대한 영양 신호가 감소하면 Wnt(Wingless and int) 신호(주3)에 작용하여 β카테닌을 통해 근세포의 분화가 억제되고, 반대로 지방세포의 분화 억제 수준도 저감된다⁸⁾²⁰⁾. 한편, 반대로 모축의 과잉 영양 섭취 혹은 비만은 염증이라는 현상에 의해 NF-κB(Nuclear factor-κB) 및 JNK(c-Jun N-terminal kinase) 신호를 통해 근세포 분화를 억제하고 지방세포 분화를 항진시킨다⁴⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="471">•</span><span>※ 주1) 렙틴 서지: 지방세포에서 생산되는 호르몬인 렙틴의 혈중 농도의 일과성 상승을 말한다. 태자기 저영양 마우스에서는 신생자기의 렙틴 서지가 조기에, 그리고 증강되어 나타나며, 이 변화가 성수기(成獸期)의 대사 이상 발증에 매우 중요한 역할을 한다고 보고되어 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="472">•</span><span>※ 주2) PPARγ(Peroxisomal proliferator-activated receptor γ): 지방 합성의 주요 인자.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="473">•</span><span>※ 주3) Wnt(Wingless and int) 신호: 배(胚) 발생과 암에 관련된 단백질 네트워크로 발견된 경로. 이 경로는 많은 생물종에 보존되어 있다. 세포 표면의 수용체 등에 결합하는 등의 방식으로 β카테닌을 안정화시켜 핵에 들어가, 다른 전사인자와 상호작용하여 근세포 분화를 억제하는 등 여러 특이적 유전자 발현을 촉진시키며, 발생이나 세포분화 등에 관여하고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 태자의 골격근 형성</div>
<p class="bx-num"><span class="bxn" data-n="474">•</span><span>소의 식육 생산이라는 관점에서 임신기는 골격근 형성에 중요한 시기이다. 원래 골격근세포(Skeletal muscle cells)는 지방세포나 골세포와 같은 간엽계 줄기세포에서 유래한다. 즉 육질에 중요한 골격근세포와 지방세포는 같은 세포에서 유래하는 셈이다. 수태 후 배기(胚期)에 간엽계 줄기세포의 일부가 근세포의 조상에 해당하는 전구세포(Myogenic progenitor)가 된다. 이것은 아직 근세포는 아니지만, 근세포가 되도록 운명지어진 세포이다. 배기의 근형성은 Wnt, Paired box gene인 Pax3와 Pax7, 근형성 유전자군인 MRFs 같은 유전자군에 의해 매우 정교한 시스템으로 통제되고 있다. Wnt가 간엽계 줄기세포로부터 근전구세포로의 분화에 가장 중요한 인자이며, 이어서 근전구세포에서 발현하는 Pax3와 Pax7에 의해 추가적인 근세포로의 분화를 촉진하는 MRFs의 발현을 유도한다²¹⁾²²⁾. MRFs는 MyoD, Myf5, Myogenin 및 MRF4로 구성된다. MRF4가 근형성 초기에 단시간 발현하고, 이어서 MyoD와 Myf5가 발현한다. Myogenin은 근형성 후반에 발현하여 태자기까지 유지된다. MyoD와 Myf5의 발현에 의해 다능성을 가진 근전구세포로부터 근아세포로의 분화가 촉진된다. 그 후 Myogenin의 발현이 근아세포의 융합에 의한 근관 형성을 촉진한다. 먼저 초기의 근형성에 의해 1차 근섬유(Primary muscle fibers)가 형성된다. 배기에 형성되는 1차 근섬유를 구성하는 근세포(근섬유) 수는 한정된 것이며, 다음 형성에 이어지는 2차 근섬유(Secondary muscle fibers)의 기반이 된다²³⁾(그림 1-10-3). 이 배기에 형성되는 1차 근섬유의 기반적 증식을 높이는 것은 그 후의 근 발달에 영향을 미칠 것으로 예상되나, 그 수는 한정된 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="475">•</span><span>배로부터 세포분화가 진행되어 태자기에 들어가면 다수의 근섬유가 형성된다. 태자기는 근형성에 매우 중요한 시기이다. 이 시기는 배기에 형성되는 1차 근섬유에 이어지는 2차 근섬유의 형성 시기이다. 이 시기에도 여전히 많은 전구세포가 존재하지만, 우선 미분화 상태로 증식하고 그 후 근아세포나 근섬유로 분화한다. 이 시기에는 1차 근섬유 쪽이 2차 근섬유보다 크다. 2차 근섬유의 형성은 지방 형성(Adipogenesis)과 동시에 일어난다. 2차 근섬유의 형성은 소나 면양에서는 임신 중기에 일어나지만, 돼지나 설치류에서는 임신 후기에 일어난다. 이 시기는 동시에 섬유 형성(Fibrogenesis)의 시기이기도 하다. 이 시기의 섬유 형성은 말하자면 결합조직의 초기 합성 시기이며, 다음 임신 후기에 근주막이나 근외막을 형성한다. 근세포, 지방세포 및 섬유아세포는 모두 간엽계 세포 기원이다. 소나 면양의 골격근 형성에서 태자기는 매우 중요한 시기라 할 수 있다. 한편 설치류나 돼지에서는 이 시기에 소나 면양의 발달 수준에 비하면 여전히 미숙하며, 생후 신생자기까지 2차 근섬유 형성이 계속된다²⁴⁾²⁵⁾. 지금까지의 연구는 어느 쪽인가 하면 1차 근섬유의 형성, 이른바 초대(初代)의 근형성 사건에 초점을 맞춘 보고가 많고, 기관으로서의 골격근 형성에 중요한 2차 근섬유 형성, 근내지방 형성 및 그것들을 지탱하는 결합조직 등의 섬유 형성에 관한 연구는 적다. 식육 생산에서 이러한 것들은 육량과 육질의 형성에 매우 중요하며, 태자기에서의 이러한 현상에 관한 앞으로의 연구가 요망된다²⁶⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="476">•</span><span><i>그림 1-10-3 근형성과 관련된 유전자 발현에 관한 모식도 (문헌 23에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="477">•</span><span>한편 근 발달에서 생후 단계에는 세포 수의 증가라기보다 세포의 비대라는 현상이 주된 변화가 된다. 앞서 기술한 대로 소 및 면양에서는 설치류나 돼지와 비교하여 신생자기 골격근의 성숙도가 다르다²⁷⁾. 소나 면양에서는 골격근 형성이 임신 후기에 성숙하므로, 설치류나 돼지의 데이터를 골격근 형성의 각종 지표로 안이하게 이용하는 것은 위험하다. 근위성세포(Satellite cells)에 관한 연구에서도, 임신 후기의 소나 면양, 사람의 골격근은 설치류나 돼지와 달리 이미 정지기에 들어가 있다²⁷⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 영양이 태자 골격근의 크기, 수 및 근섬유형에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="478">•</span><span>임신기의 영양은 태자의 발육, 특히 골격근의 발달을 프로그래밍하고 있다. 또 이 시기의 영양은 뇌나 심장, 간 같은 주요 기관으로의 배분이 우선되기 때문에, 영양 배분이 이차적이 되는 골격근 형성은 영향을 받기 쉽다²⁸⁾. 배기는 비교적 한정된 수의 근섬유 형성이 주이므로, 영양이 근형성에 미치는 영향은 그다지 크지 않다고 여겨진다. Du 등은 소의 임신 30일부터 120일(이른바 임신 전기)의 영양 요구량을 70%와 100%로 처리하여 태자 체중과 지육 중량을 조사하였으나, 양 구에서 차이는 없었다²⁹⁾. 한편 Quigley 등은 면양의 수태 전후 24일간을 영양 요구량 50%와 100%로 비교하였는데, 태자 체중에서는 양 구에 차이가 인정되지 않았으나, 영양 요구량 50%의 면양에서 근섬유 수가 감소하였음을 보고하였다³⁰⁾. 또 1차 근섬유에 대한 2차 근섬유의 수가 감소하였다. 즉 근섬유 수의 감소는 주로 2차 근섬유 수에 의한 것으로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="479">•</span><span>소에서는 임신 200일 전후에, 면양에서는 105일 전후에 태자의 골격근 형성, 이른바 개체로서의 기반적 근섬유 수의 형성이 성숙 단계가 된다. 그 때문에 임신 말기의 영양 제한은 근섬유 크기의 감소를 초래하지만, 근섬유 수의 감소는 일어나지 않는다³¹⁾. 소에게 임신 중기는 특히 골격근 형성에 중요한 시기라 할 수 있다(그림 1-10-4). 신생자기에는 근섬유 수가 대체로 고정되어 버려, 그 후의 골격근 발달 잠재력이 규정된다. 그러한 의미에서 골격근 발달의 한계치에 영향을 미치는 태자기의 골격근 형성 정체는 되돌릴 수 없는 현상이 되어 그 후의 건강이나 산육성에 영향을 미칠 가능성이 있다³²⁾³³⁾. 근년 골격근은 운동기관일 뿐 아니라 각종 생리활성물질을 분비하여 면역에도 관여하고 있다고 보고되어 있다³⁴⁾. 또 근육량은 각종 대사성 질환에서의 영향을 완화하는 흡수재 같은 역할도 하고 있다고 보고되어 있다³⁵⁾. 이러한 점들로부터, 무엇보다 굵은 근섬유를 많이 가진, 골격근이 더 발달한 신생자를 생산하는 것이 신생자의 면역에서도 그 후의 비육이나 산육성에서도 중요하다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="480">•</span><span><i>그림 1-10-4 소에서 태자기 및 생후 영양에 따른 후성유전학을 기반으로 한 근형성 및 지방형성 잠재력의 크기에 관한 개관도 (문헌 4에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="481">•</span><span>면양에서는 임신 전기부터 중기에 걸친 영양 제한(영양 요구량 50%)이 태자 골격근의 근섬유 수를 감소시키고, 그 내용으로서 1차 근섬유에 대한 2차 근섬유의 비율도 감소시켰다. 나아가 그것들로부터 생산된 자축의 8개월령 시 골격근을 조사하니 역시 근섬유 수의 감소가 관찰되었다. 또 속근섬유의 일종인 IIX 근섬유 비율의 증가, 근내 트리글리세리드량의 증가, 그리고 골격근에 대한 지방 비율의 증가가 인정되었다²⁸⁾³⁵⁾. 이러한 점들로부터 임신 전기부터 중기에 걸친 영양 제한은 골격근의 형태학적 견지에서는 그 후 자축의 산육성에 지속적으로 크게 영향을 미친다고 생각된다. 소의 실험에서는 임신 31일부터 125일째까지의 영양 제한이 태령 125일 태자 골격근의 1차 근속(筋束) 내 근섬유 수를 감소시켰다. 또 태령 250일 태자 골격근의 근섬유 횡단면적을 증가시켰으나, 결과적으로 단위면적당 근섬유 수를 감소시켰다. 이러한 점들로부터 임신 전기의 영양 제한은 근 발달에 영향을 미친다는 것이 시사되었다²⁶⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="482">•</span><span>골격근량에 더하여 그 내용, 즉 근섬유형 구성의 변화도 생산되는 자축의 골격근 발달 잠재력을 좌우한다. 지근섬유인 I형 근섬유는 에너지 대사와 관련하여 이화작용이 크고, 성장에서의 에너지 효율이 나쁘다. 한편 속근섬유인 II형 근섬유는 이화작용이 작고 높은 성장 효율을 가진다. 임신기의 영양 제한에서는 그 자축의 골격근에서 근섬유 수는 감소하지만 II형 근섬유의 비율이 커지므로, 효율적인 골격근 성장, 즉 II형 근섬유의 크기 증대에 의한 성장을 촉진한다²⁸⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="483">•</span><span>임신기의 영양 제한은 내장지방이나 피하지방의 축적을 촉진한다. 이것은 면양이나 돼지의 실험에서도 보고되어 있다²⁸⁾³⁶⁾. 한편 임신기의 과잉 영양도 태자 골격근의 발달에 영향을 미친다. 면양의 실험에서 임신 초기부터 임신 75일까지를 영양 요구량 150%의 영양으로 사양한 경우, 그 태자의 반건양근 중량은 무거워지고 근세포 수의 변화는 인정되지 않았으나, 근섬유 밀도의 감소가 관찰되었다⁵⁾. 돼지에서는 수태부터 임신 50일째까지의 과도한 영양에 의한 신생자기 자축의 지방 비율 증가나 근섬유형 구성의 변화가 관찰되고 있다. 한편 고영양 중에서도 고지방식, 즉 고칼로리식을 급여한 임신 래트의 실험에서는 근 횡단면적의 25% 감소, 근섬유 수의 20% 감소가 관찰되고 있다³⁷⁾³⁸⁾. 이처럼 임신기의 영양은 동물종에 관계없이 자축 골격근의 근섬유 수나 근섬유형 구성을 변화시킨다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 영양이 태자 골격근 내 지방교잡에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="484">•</span><span>골격근 내 지방, 이른바 지방교잡(마블링)은 문자 그대로 골격근 내의 지방세포로부터 형성되며, 그것을 지탱하는 것이 결합조직, 이른바 세포외 기질(Extra cellular matrix)이다. 지방세포와 결합조직 양쪽 모두 육질 형성에 중요하다. 지금까지 기술한 대로 골격근세포도 지방세포도 간엽계 세포를 기원으로 한다. 임신 중기에도 태자의 골격근에는 많은 다능성 세포가 존재하며, 그 시점에서는 그것들이 골격근세포로도 지방세포로도 분화할 수 있다(그림 1-10-4). 즉 간엽계 세포로부터 형성되는 지방세포는 임신 중기부터 시작된다³⁹⁾⁻⁴¹⁾. 그러나 수의 증가라는 의미에서 새로운 지방 형성은 출생 후에도 내장지방이나 골반강 내 지방, 피하지방 내에서 계속 일어난다. 극히 미미하지만 근내지방도 (수의 증가라는 의미에서) 생후에도 형성이 계속된다고 보고되어 있다³⁹⁾⁴²⁾. 태자기의 근내지방 형성은 골격근 내 지방세포 수의 증가에 영향을 미친다. 임신기의 과도한 영양이 태자기의 지방 형성에 미치는 영향은, 골격근 내 지방세포 수를 증가시키고 그 지방세포가 비대해짐으로써 골격근 내에 지방을 축적시킨다. 그러나 in vivo 실험은 적고, 대부분은 세포 배양에 의한 in vitro 실험 결과이다⁴³⁾. 면양을 수태 전부터 임신 75일까지 영양 요구량 150%로 사양하면, 태자의 골격근 내 지방과 세포외 공간이 증가한다고 보고되어 있다. 이것은 임신기의 과잉 영양이 근내 지방 형성과 섬유 형성을 촉진함을 보여준다. 물론 이 시기에는 성숙한 지방세포는 없으나, 이것은 나중에 중성지방(TG)이 축적됨으로써 성숙한 지방세포, 이른바 비만세포가 된다. 지방 형성에서는 PPARγ가 중요한 역할을 하며, 이 유전자의 발현이 다능성 세포로부터 전구지방세포, 지방세포로의 분화를 유도하는 것으로 알려져 있다⁴⁴⁾. 임신기에 과잉 영양이었던 모축의 태자 골격근에서는 많은 전구지방세포의 마커인 pref-1의 발현도 높으며, 이것은 많은 세포가 지방세포로의 분화를 운명지어져 있음을 보여준다⁴⁵⁾. 소에서는 임신 초기부터 중기에 영양 요구량을 70%로 하고 거기에 바이패스 단백질을 보조사료로 급여한 경우, 그 자축의 근내지방과 피하지방이 감소하였다. 이것은 단백질 보조사료가 태자기의 지방 형성을 정체시킴을 보여준다²⁶⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="485">•</span><span>태자기부터 생후에 걸친, 골격근 내 지방세포 분화라는 의미에서의 지방 형성은 이유 시기, 소에서는 250일령 전후까지가 왕성하며, 그 후에는 영양에 의한 (수의 증가라는 의미에서의) 지방 형성은 거의 일어나지 않고, 그때 존재하는 지방세포 수 안에서 영양의 영향에 의한 크기 변화가 주요한 변화로 일어날 뿐이라고 생각되고 있다⁴⁶⁾⁻⁴⁸⁾. 실제로 출생 후의 실험에서, 조기에 이유하여 농후사료 급여를 일찍 시작한 경우 지방교잡도가 향상된다고 보고되어 있다⁴⁸⁾⁻⁵⁰⁾. 즉 이유까지 지방 형성이 계속된다고 하면, 그 전에 농후사료를 다급(多給)함으로써(고영양으로 함으로써) 지방 형성을 갱신하여 지방세포 수를 증가시키는 동시에 거기에 TG를 축적시켜 가는 것이다. 결과적으로 모자 방목 같은 종래의 구미식 cow-calf 방식에서 이유 시기까지의 영양이 부족한 경우에 비해 출하 시의 지방교잡도는 향상된다. 현재 일본에서는 와규(和牛) 사양에서 조기 이유가 통상 관리로 채택되어 있으며, 이것이 와규의 유전적 능력과 함께 지방교잡도를 높이는 요인이 되고 있을 가능성이 있다. 흑모화종에서도 신생자기부터 육성기까지 고영양으로 한 경우와 조사료만으로 사양한 경우에서, 11개월령 이후 똑같이 조사료만으로 비육하더라도 지방교잡도나 육량에 큰 차이를 가져온다고 보고되어 있어(지방교잡도는 전자에서 약 40% 증가하고, 지육 중량은 약 10% 증가하였다)⁵¹⁾, 상술한 현상을 뒷받침하는 결과가 되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="486">•</span><span>근년 in vivo에서의 소 후성유전학에 관한 연구도 진행되고 있다. Paradis 등은 교잡종 소에서 대사에너지의 100%와 85%의 2개 영양 처리구로 임신 중기부터 후기에 걸친 수태 후 147일부터 247일까지 사양하고, 어미소를 도축 후 태자를 적출하여 각종 조사를 실시하였다⁵²⁾. 이들 어미소는 영양 처리의 영향을 받아 85%구의 소 무리에서 체중이 유의하게 작아졌다. 적출한 태자의 체중이나 심장, 간, 신장, 태반의 중량에는 양 구에서 차이가 인정되지 않았으나, 간, 심장, 흉최장근, 반건양근 및 태반에서 성장인자 관련 유전자군의 발현에 유의한 차이가 인정되었다. 흉최장근의 micro RNA 발현에도 유의한 차이가 인정되었다. 나아가 흉최장근이나 반건양근에서 IGF-2의 DNA 메틸화 수준을 조사하여, 특히 흉최장근에서 DNA 메틸화 수준에 양 구간 유의한 차이가 인정되었다. 이러한 점들은 체중이나 장기, 골격근 중량에 양 구에서 유의한 차이는 인정되지 않았으나, 골격근 유전자 발현의 차이나 DNA 메틸화 수준의 차이로부터 기관의 대사 수준이 다를 가능성을 시사하고 있다. 대사에너지의 85% 정도의 제한에서는 어미소의 태반에서의 영양 공급 조정 등도 고려되어 장기 중량 등에도 영향이 나타나기 어려운 것인지도 모른다.</span></p>
<p class="bx-num"><span class="bxn" data-n="487">•</span><span>반추 가축에서 임신 초기와 중기의 지금까지의 실험 수준에서의 영양 제한은 태자의 골격근세포나 지방세포 수에는 영향을 미치지만, 임신 후기의 영양 혹은 신생자기의 영양에 의해 세포 비대라는 형태로 표현형을 개선할 수 있다. 육질에 관해서는 골격근세포나 지방세포의 수나 크기의 차이가 생기고 있어 영향을 미칠 가능성이 있다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="488">•</span><span>■ 임신기 영양이 자축 비육 후의 산육성에 미치는 영향</span></p>
<div class="bx-sub"><div class="bx-subtitle">면양에서의 연구</div>
<p class="bx-num"><span class="bxn" data-n="489">•</span><span>지금까지는 임신기 영양이 태자기의 골격근 형성에 어떻게 영향을 미치는지를 보아 왔으나, 여기서부터는 비육한 경우 어떠한 영향이 있는지를 생각하고자 한다. 근년 가축, 특히 면양을 중심으로 한 태자기 프로그래밍 연구가 다수 이루어지고 있다. 영양 변동이나 환경 요인 등에 의한 태자기의 성장 제한은 생후 성장에 영향을 미친다. 면양에서 임신 초기의 영양 제한은 자축의 생후 성장 비율을 높이지만, 골격근량을 감소시키고 글루코스 대사를 변화시킨다⁵³⁾. 면양에서 임신 110일부터 147일까지의 영양 제한은 자축의 글루코스 저항성을 변화시키고 지방조직의 글루코스 수송체를 감소시킨다⁵⁴⁾. 면양에서 교배 30일 전부터 수태 후 100일까지를 영양 요구량 70%로 사양한 경우, 같은 시기에 100%로 사양된 자축보다 신생자기의 사망률이 높아지고, 출생 시 체중이 작으며, 생후 성장이 더 완만해진다고 보고되어 있다⁵⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="490">•</span><span>영양 상황은 체중에 반영된다는 가정 하에 체중을 지표로 한 면양의 대규모 조사에서는, 교배 "시"의 모축 체중과 자축의 63개월령까지의 체중에는 정(正)의 상관관계가 있었고, 교배 "후" 분만까지의 모축 체중은 자축의 39개월령까지 정의 상관관계가 있었으나 그 후에는 상관관계가 사라졌다⁵⁶⁾. 면양을 이용하여 임신 초기와 중기의 영양 제한 영향을 본 많은 실험에서는, 생산되는 자축의 출생 시 체중은 작아지지만 생후의 인공적인 영양 보급에 의해 개선의 여지는 충분히 있으며, 자연적인 모자 사양으로 두면 자축의 성숙 크기를 작게 만들어 버릴 가능성이 있는 것으로 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="491">•</span><span>Lan 등은 면양에서 임신 중기(임신 67일째)부터 임신 후기(임신 130일)에 헤일리지 급여구, 옥수수 급여구 및 옥수수 주정박(蒸留産物) 급여구의 영양 질이 다른 3개 사료 급여구로 나누어 사양하고, 임신 130일에 태자를 적출하여 게놈 각인(Genome imprinting)(주4)에 관여하는 유전자나 DNA 메틸화 효소 생성에 관여하는 유전자군의 발현, 그리고 그들 유전자의 프로모터 영역의 DNA 메틸화 동태를 조사하였다⁵⁷⁾. 그 결과, 우선 이들 유전자군의 발현에서 3구 간에 유의한 차이가 발견되었다. 또 배최장근의 IGF-2R과 반건양근의 H19의 엑손부 CpG 메틸화 수준은 옥수수 급여구보다 헤일리지 및 주정박 급여구가 높다는 것도 발견되었다. 옥수수 급여구에서는 사료 중 DNA 메틸화 반응 경로에 메틸기를 제공하는(메틸기 공여체인) 메티오닌, 콜린, 엽산 등의 성분이 적었다. DNA 메틸화 수준, 특히 프로모터 영역의 메틸화 수준의 높이와 유전자 발현은 통상 부(負)의 상관관계에 있으나, 이 연구에서는 정의 관계였다. 최근 유전자 구조 내부(Gene body)의 메틸화 수준이 유전자 발현과 정의 상관관계에 있다는 보고도 있어⁵⁸⁾, 이들 유전자 발현과 DNA 메틸화 수준의 관계는 앞으로 추가 연구가 필요하다. 그러나 Lan 등의 연구에서는 임신기 영양의 질의 영향이 태자 DNA의 후성유전학적 변화에 강하게 영향을 미치고 있음을 증명하고 있다. 면양은 반추동물로서 다루기 쉬운 점에서, 실용적인 면뿐 아니라 대가축에의 응용을 염두에 둔 기초적인 연구도 실시되고 있다⁵⁷⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="492">•</span><span>※ 주4) 게놈 각인(Genome imprinting): 유전적 각인을 말한다. 일반적으로 포유류는 아버지와 어머니로부터 같은 유전자를 2개(성염색체의 경우는 1개) 물려받는다. 자식이 물려받은 많은 유전자는 원칙적으로 아버지 유래와 어머니 유래의 대립유전자가 양쪽 모두 작동하거나 혹은 작동하지 않도록 제어된다. 게놈 각인은 유전자에 주로 메틸화로서 붙은 표지(게노믹 임프린트)로, 한쪽 부모로부터 물려받은 유전자만이 발현하는 것으로 알려져 있다. 이처럼 포유류의 몇몇 유전자에서는 그 유전자를 양친 중 어느 쪽으로부터 받았는지를 기억하고, 그것이 발현하고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소에서 출생 시 체중이 산육성에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="493">•</span><span>DOHaD에서는 출생 시 저체중자는 성숙 후 비만을 통해 많은 질병의 원인이 되는 경우가 많다고 한다. 소에서 출생 시 체중은 그 후의 산육성에 어떻게 영향을 미칠까. 출생 시 체중은 임신기의 영양 상태를 반영하고 있을 가능성이 높다. 그래서 출생 시 체중이 그 후의 성장이나 육질에 어떠한 영향을 미치는지에 대해 몇몇 대규모 연구가 이루어져 있다. 호주 팀의 연구에서는, 기본적으로 출생 시 체중이 작은 소는 이유 시 체중도 작고, 피드롯 방식으로 비육한 경우 출하 시 체중도 작아지는 경향이 있었다⁵⁹⁾⁶⁰⁾. Greenwood 등은 출생 시 체중은 사료 효율에 대한 영향에 관해 명확한 차이는 없다고 보고하였다⁶¹⁾. 또 출생 시 체중의 크기는 출하 시 둔부의 피하지방 두께에는 영향을 미쳤으나, 그 밖의 지방교잡, 산육량, 등심 단면적 등의 지육 특성에는 영향을 미치지 않았다고 한다. 나아가 출생 시 체중은 흉최장근과 반건양근의 쿠킹로스(주5)나 경도(かたさ)에도 영향을 미치지 않았다고 보고하고 있다⁶⁰⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="494">•</span><span>※ 주5) 쿠킹로스(cooking loss): 고기를 가열했을 때 증발이나 단백질 변성 등에 의해 보수력이 저하하여 육즙이 배출된다. 그 손실량을 "쿠킹로스"라 부르며, 이를 측정하여 식육의 보수력 등을 평가한다. 조지방 함량이 높은 쇠고기는 가열에 의한 육즙 손실이 적은 경향이 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신 전기 영양이 자축의 산육성에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="495">•</span><span>Long 등은 앵거스와 헤리퍼드의 교잡우에서 임신 전기(수정 후 32~115일)의 영양을 영양 요구율 55%로 제한한 경우와 100%로 설정한 경우에, 그 자축을 피드롯 방식으로 비육하여 출생 시 체중 및 송아지의 성장이나 출하 시 체중에 양 구간 차이가 인정되지 않음을 보고하였다⁶²⁾⁶³⁾. 출하 후에 주요 장기를 조사한 결과, 임신 전기에 영양 제한함으로써 폐와 기관(氣管)의 중량에만 차이가 인정되었다. 또 흉최장근의 근내 DNA량과 골격근섬유의 횡단면적은 이 영양 제한으로 커졌다. 이것은 임신 전기의 영양 제한에 의해 근섬유 수가 적어지고, 그것을 보충하기 위해 근섬유의 비대가 일어나고 있는 것으로 추찰되었다. 또 그들은 이 소 무리에 글루코스 부하시험을 실시하였으나 그 반응성은 차이를 보이지 않았다. 이어서 Long 등은 앵거스 교잡종을 이용하여 임신 전기부터 중기에 해당하는 임신 후 45~185일에 영양 요구량의 100%를 급여한 대조구(CON), 70%구(NR), 70%에 단백질을 보조사료로 급여한 구(NRP)의 3구로 나누어 사양하였다⁶⁴⁾. 이렇게 생산된 자축을 비육한 결과, 수율 등급(주6)은 NR에서 유의하게 높고 지육 중량에 대한 반건양근의 중량 비율은 낮았으나, 체중이나 반건양근, 심장, 폐, 신장, 췌장 중량에는 3구 간에 유의한 차이가 인정되지 않았다. 또 피하지방, 신주위지방, 내장 및 대망지방의 지방세포 직경은 NR에서 CON에 비해 유의하게 커졌다. 피하지방에서 Fatty acid transporter 1 유전자의 발현이 높아져 있었으나, Glut4, FATP4, LPL의 발현에는 차이가 인정되지 않았다. 임신 중기의 영양 제한에 의해 지방세포로의 분화 수준이 낮고, 결과적으로 지방세포 수가 적으며, 그것을 보충하듯 지방세포의 비대가 일어나고 있을 가능성이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="496">•</span><span>이상과 같이 근년의 연구에서는 임신 초기의 강한 영양 제한이나, 중기에 걸쳐 영양 요구 70%로 제한을 가하더라도 그 자축의 피드롯 방식 비육 후 출하 시 지육 중량 등에는 큰 영향이 인정되지 않는다는 것을 알 수 있다. 그 한편으로 조직 내에서는 근섬유 수나 세포 크기 등의 차이가 생기고 있을 가능성이 시사되고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="497">•</span><span>※ 주6) 수율 등급(Yield grade): 지육에서 쇠고기가 얻어지는 비율의 지표. 일본이나 미국 등에서 각각 소 지육의 데이터를 이용하여 지표를 도출하는 계산식이 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신 중기·후기 영양이 자축의 산육성에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="498">•</span><span>태자기 프로그래밍에 관한 소의 실험도 근년 많아지고 있다. 근년의 연구에서는, 소에서 어미소의 방목지 초지 개량에 의해 임신 중기부터 후기의 영양을 높이면, 그 자축의 성장, 비육 후 출하 시 체중이나 흉최장근의 연도(やわらかさ), 지방 축적이 개량되지 않은 방목지에서 사양한 어미소 무리의 자축에 비해 향상되는 경향이 나타나고 있다⁶⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="499">•</span><span>Webb 등은 앵거스와 시멘탈의 교잡종을 이용하여 임신 중기와 후기의 대사단백질(Metabolizable protein: MP) 제한에 대한 자축의 산육성에의 영향을 조사하였다⁶⁶⁾. MP 102%와 MP 85%의 2군을 설정하여 실험을 행한 결과, 임신기 요구량 85%라는 가벼운 MP 제한은 그 자축의 비육에서의 산육성에서 대조구(요구량 102% 충족)에 비해 지육 구성, 고기의 전단력가(주7)나 지방산 구성을 조금 변화시킨다. 즉 임신 후기에 MP가 제한되면 식육의 전단력가가 늘어 단단해진다. 또 육질로서 지방산 구성에서는 팔미트산(C16:0)이나 올레산(C18:1 n9 cis), 아라키돈산(C20:4 n6)의 비율을 유의하게 감소시켰다. 그러나 Webb 등은 그것은 미량이며, 비육 방법으로 극복할 수 있는 정도일 것이라고 결론지었다. 한편 좀 더 극단적으로 영양을 변화시킨 경우의 연구도 있다. Maresca 등은 앵거스 번식우의 임신 중기부터 후기의 영양을 정미에너지(Net Energy: NE) 요구량의 121%(사료 중 단백질 약 12%)와 64%(사료 중 단백질 약 6%)의 2군으로 나누어, 그 송아지의 비육 후 산육성에 대해 비교하였다⁶⁷⁾. 비육 후의 지육 중량이나 골격근 내 지방 비율, 피하지방 비율은 양 구간 차이가 인정되지 않았으나, 등심 단면적(ロース芯面積)이 64%구에서 유의하게 작아졌고, 근섬유 직경에 차이는 없었으나 근섬유 수가 감소하였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="500">•</span><span>다음으로 임신 중기부터 후기의 영양을 양이 아니라 질을 변화시킨 경우, 그 어미소로부터 생산된 송아지의 산육성이 어떠한 영향을 받는지에 대해 몇몇 연구를 소개한다. Radunz 등은 앵거스 교잡종의 임신 후기에 해당하는 임신 167일부터 건초(섬유질 사료), 옥수수(전분 사료) 및 주정박(蒸留穀物; 섬유질+단백질+지질) 급여구의 영양 질이 다른 3구로 나누어 사양하였다(모든 구에서 건초의 에너지 섭취량과 동일하게 급여)⁶⁸⁾⁶⁹⁾. 우선 어미소를 보면, 어미소의 급여 후 혈중 인슐린 농도나 BUN은 주정박구에서 가장 높아졌으나, 비유량이나 그 유질에는 구간 차이가 인정되지 않았다. 다음으로 생산된 송아지에 대해서는, 옥수수구와 주정박 급여구에서 사양된 어미소에게서 태어난 송아지의 체중이 건초구보다 컸다. 어미소의 섭취 영양의 질에 의한 대사 변화가 태자로의 에너지 분배에 영향을 미쳤다고 고찰되었고, 출생 시 체중에도 영향을 미치고 있음이 나타났다. 생산된 송아지의 이유 시 체중은 옥수수구와 주정박구에서 건초구보다 컸으나, 비육 종료 시 체중과 지육 중량에는 3구 간에 차이가 인정되지 않았다. 공복 시 글루코스 농도는 옥수수구에서 가장 높고 주정박구에서 가장 낮았다. 송아지의 비육 후 지방교잡도는 건초구에서 가장 높고 옥수수구에서 가장 낮은 경향이 인정되었다. 주정박구는 그 중간이었다. 한편 같은 그룹의 연구에서 Wang 등은 앵거스 교잡종 암소의 임신 중기부터 후기에 저전분질 사료인 헤일리지와 고전분질 사료인 옥수수 사일리지의 2구로 나누어 급여하고, 그 어미소에게서 생산된 신생 송아지로부터 생검으로 골격근 샘플을 채취하여 게놈 각인에 관여하는 유전자나 DNA 메틸화 효소 생성에 관여하는 유전자군의 발현을 조사하였다⁷⁰⁾. 결과, 유전자 발현에서 2구 간에 다름이 발견되었다. 즉 이들 유전자군은 특히 옥수수 사일리지구에서 헤일리지구보다 높은 발현이 관찰되었다. 이러한 점들은 임신 중 어미소의 사료가 태자 프로그래밍에 관여하여, 기반적 성장에 관여하는 인자나 그 유전자의 메틸화에 영향을 미치고 있을 가능성을 보여주었다. 그러나 상기 Radunz 등의 연구⁶⁸⁾⁶⁹⁾를 보면, 같은 처리에서 자축의 비육 후 산육성의 표현형에는 큰 차이가 인정되지 않고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="501">•</span><span>後藤 등 연구 그룹의 예비 실험에서는, 와규에서 임신 후기의 영양 요구량을 60%로 한 영양 제한에 의해, 그 송아지는 영양 요구량 100%의 어미소에게서 태어난 송아지에 비해 흉최장근 내 지방 형성과 관련된 유전자 발현이 유의하게 변화함을 확인하고 있다. 앞으로 추시(追試)가 필요하지만, 와규에서 태자기 대사 프로그래밍의 가능성이 시사되고 있다(미발표 데이터).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="502">•</span><span>※ 주7) 전단력가(shear force): 식육의 연도(부드러움)의 세계적 지표. 근섬유에 대해 수직 방향으로 물리적 압력을 가하여 절단될 때의 최대 저항을 측정하여 얻는 값.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 영양이 자축의 번식성 등에 미치는 영향</div>
<p class="bx-num"><span class="bxn" data-n="503">•</span><span>그 밖에 소에서 육용 번식우나 그 번식성에 대한 영향에 관해서도 근년 데이터가 축적되고 있다⁶⁾. 젊은 번식우의 임신 초기 영양 제한은 125일령 태자의 체중을 감소시킨다⁷¹⁾. 한편 임신 말기에 영양 섭취가 부족했던 어미소에서는 태반 중량이 증가해 있었다⁷²⁾. 또 태자기 성장이 정체되어 있던 번식우 무리에서는 난소 중량과 난포 크기가 작다고 보고되어 있다⁷³⁾. 나아가 임신 후기에 단백질을 보충받은 어미소에게서 태어난 암송아지는 성숙 후의 번식성이 향상될 가능성이 있다고 보고되어 있다⁷⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="504">•</span><span>지금까지의 연구를 개관하면, 태자기에는 임신 전기의 55%까지의 영양 제한이나 전기·중기의 70% 정도의 영양 제한으로 태자의 골격근 수나 근섬유형, 지방세포 수 등에 대한 영향이 인정되며, 그것은 출생 시 체중에도 반영된다고 생각된다. 그러나 지금까지의 임신기 영양 제한 연구에서, 현실적으로는 피드롯 방식이나 그 밖의 사양 혹은 비육에 의해 차이가 명확히 나타나지 않은 보고도 많다. 동물은 출생 후의 영양 섭취에 의해 가능한 부분에서 세포를 비대시켜 보충하려 한다. 실험으로서는 적지만, 반대로 수정 전부터 임신 중기까지를 과도한 영양 상태로 한 경우, 태자의 체중, 체장, 혈중 글루코스 농도, 혈중 IGF-I 농도, 인슐린 농도, 반건양근은 현저히 커진다고 한다. 이로부터 임신기에 과도한 영양 상태에 놓인 어미소에게서 생산된 송아지의 산육성은 상당히 향상될지도 모른다⁵⁾. 면양에서는 신생자기에 모축에 의한 자연 포유인지 혹은 인공 포유인지 등에 따라 그 후의 성장에 명확한 차이가 나타나는 것으로 보인다. 앞으로 이 대사 프로그래밍이라는 개념을 축산 분야에 적극적으로 응용해 갈 경우, 태자기·신생자기의 사양과 비육을 조합하여 고려할 필요가 있다. 최근 골격근은 간이나 지방조직과 네트워크를 구축하고 있어, 운동기관일 뿐 아니라 마이오카인 등의 생리활성물질을 분비하여 면역에도 관여하고 있다고 보고되어 있다³⁴⁾. 또 골격근량은 각종 대사성 질환에서 흡수재 같은 역할도 하고 있다고 보고되어 있다. 이러한 점들은 무엇보다 임신기의 영양 상태가 태자의 성장을 촉진하여, 굵은 근섬유가 풍부한, 이른바 골격근이 더 발달한 신생자를 생산하는 것이 면역을 높이고 사료 섭취량을 향상시킨다는 것을 의미한다. 나아가 비육과 그 후의 산육성에서도 중요하다고 추찰된다. 더하여 지방세포를 골격근 내에 많이 분화시켜 두는 것은 생후의 육질 조절에서 유리해질 것으로 예상된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="505">•</span><span>이상, 태자기의 영양 환경과 영양의 질이 생산된 자축의 기반적 체질에 현저한 영향을 미친다는 것이 시사되고 있다. 소 생산에서 이 메커니즘을 긍정적으로 활용할 수 있다면, 소의 능력을 더욱 항진시켜 지금까지 없던 저비용으로 고품질 쇠고기를 생산하는 사양 시스템을 창출할 가능성이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="506">•</span><span><span style="color:var(--ink-soft)">(저자: 後藤貴文)</span></span></p>
</div>

<div class="bx-sub"><div class="bx-subtitle">에너지 이용효율</div>
<p class="bx-num"><span class="bxn" data-n="527">•</span><span>모체가 섭취한 대사에너지가 태아에 의해 이용되는 효율은 젖소에서 10.5%, 헤리퍼드에서 14%, 흑모화종에서 15%라는 보고가 있다. 이러한 태아 축적에 대한 대사에너지 이용효율의 값은 각각 유지의 이용효율이 70~80%, 비유가 60~70%, 발육이나 비육이 40~60%라고 알려진 것과 비교하면 현저히 낮다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신 말기에 유지에 더하는 양분량</div>
<p class="bx-num"><span class="bxn" data-n="528">•</span><span>일본사양표준 육용우(2008년판)에서는 임신 말기 2개월간 태아 발육에 필요한 양분으로서 더하는 1일당 양분량을 조단백질 212 g, 가소화양분총량 0.83 kg, 가소화에너지 3.67 Mcal, 대사에너지 3.01 Mcal(12.58 MJ), 칼슘 14 g, 인 4 g으로 하고 있다⁶⁾. 또한 비타민 A 요구량은 체중 1 kg당 33.6 IU를 유지량에 더한다. 나아가 이 기간에 더하는 1일당 건물량은 1.0 kg을 기준으로 제시할 수 있다고 하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="529">•</span><span><span style="color:var(--ink-soft)">(저자: 西田武弘)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="530">•</span><span><span style="color:var(--ink-soft)">일본송아지 부록1 양분요구량의 사고방식.</span></span></p>
</div>

</div>
<div class="bx"><div class="bx-title">2-2 신생 송아지의 생리</div>
<div class="bx-sub"><div class="bx-subtitle">태아에서 신생 송아지로</div>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>태아는 출생에 의해 모체에 의존하던 자궁 내 환경에서 독립하여 생존을 시작한다. 그 때문에 신생기(新生子期)는 일생 중 가장 극적인 생리학적·해부학적 변화가 일어나는 시기다. 생물학적으로 불안정한 신생 송아지는 질병에 걸릴 위험이 높고, 때로는 생존에 관련된 사태에 빠지는 일도 적지 않다. 이 시기 사망 사고의 많은 부분은 순환기, 호흡기, 체온조절 또는 대사의 이상에 기인한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">순환·호흡기 기능</div>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>태반(placenta)은 자궁 내에서 발육 중인 태아의 호흡기로 기능한다. 태아 헤모글로빈의 산소 친화성은 성우보다 높아¹⁾, 산소분압이 같은 조건이라면 태아 혈액은 모체 혈액보다 많은 산소를 운반할 수 있다. 태반을 경유하여 산소화된 혈액의 산소포화도는 약 80%이며, 제정맥(umbilical vein)을 통해 태아로 운반되어 간 부근의 문맥에 연결된다. 혈류의 약 3분의 2는 정맥관(venous duct)을 통해 후대정맥과 합류한다(그림 2-2-1)²⁾. 후대정맥은 우심방으로 흘러들고, 혈류의 50% 이상이 난원공(foramen ovale)을 통해 좌심방으로 흘러 폐순환을 우회(bypass)한다²⁾. 우심실로 들어간 혈액은 폐동맥으로 박출되지만, 폐동맥압이 전신 동맥압보다 높기 때문에 폐동맥 혈류의 약 70%가 동맥관(arterial duct)을 통해 대동맥으로 흐르고, 나머지가 폐를 관류한다²⁾. 폐에서 좌심방으로 돌아오는 소량의 혈액은 난원공에서 온 혈류와 섞여 대동맥으로 박출되어 전신 조직에 배분된다. 2개의 제동맥(umbilical artery)은 마지막 요추 영역의 대동맥에서 분기하여 정맥혈(산소포화도 약 58%)을 태반으로 되돌린다²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>자궁 내에서 태아의 폐포 및 기관지는 폐에서 분비되는 액체(폐액, lung fluid)로 가득 차 있으며, 출생 전후에 일어나는 폐액의 제거는 폐호흡 개시에 중요한 이벤트다³⁾. 에피네프린의 영향으로 폐액 분비는 분만 2~3일 전부터 감소하기 시작한다⁴⁾. 태아 만출 중에 혈중 에피네프린 농도의 급격한 상승이 확인되며 폐액 흡수가 가속된다. 폐액은 폐포 내강에서 간질로 이동하여 혈관이나 림프관으로 흡수된다³⁾. 출생 시 폐액의 일부는 기관을 통해 체외로 배출되지만, 대부분은 폐호흡 초기 단계에서 폐포벽을 통해 흡수된다⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>제대(umbilical cord)가 단열되면 태반으로부터의 산소 공급이 끊기기 때문에 저산소 상태가 된 송아지는 헐떡임 반사(gasp reflex)를 일으키고 폐호흡이 시작된다. 폐에서 환기가 시작되면 폐순환의 혈관 저항이 낮아지고 폐조직 내 혈액순환이 촉진된다²⁾. 혈액의 산소포화도가 상승하면 출생 후 4~5분 이내에 동맥관 폐쇄가 일어난다⁶˒⁷⁾. 폐정맥으로부터의 환류가 증가하여 좌심방 내압이 상승하면 출생 후 5~20분 이내에 난원공은 기능적으로 닫힌다⁶⁾. 난원공과 동맥관의 해부학적 폐쇄에는 수 주가 걸리는 경우가 있다⁶⁾. 건강한 송아지의 출생 시 평균 폐동맥압은 40~82 mmHg이고, 2주령 무렵까지 서서히 저하하여 22~25 mmHg가 된다⁸⁾. 전신 동맥압은 약 100 mmHg로 유지되며 동맥혈 산소포화도는 90% 이상이다. 심박수는 분당 약 120회(100~140회), 호흡수는 분당 48회(30~60회)다⁹⁾. 출생 시 송아지의 평균 환기량은 1회 호흡당 220 mL이고, 생후 2시간부터 2주까지 1분당 환기량은 6.9~8 L로 유지된다⁸⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>제대 단열 후 신생 송아지에서는 일시적으로 경도의 대사성 및 호흡성 산증(acidosis)이 확인된다. 이는 태반으로부터의 산소 공급 정지와 폐호흡 개시 사이의 틈에서 송아지가 에너지 대사를 유지하려 할 때 생기는 혐기성 해당의 결과로 생각된다¹⁰⁾. 보통 경도의 대사성 산증은 생후 1~4시간에 보정되지만, 호흡성 산증은 종종 48시간 이상 지속되는 경우가 있다¹⁰⁾. 지속적인 산증과 저산소혈증은 폐(세)동맥의 지속적인 수축을 초래하기 때문에 폐 순환혈류량이 적어지고 동맥관의 기능적 폐쇄를 저해한다¹¹⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="11">•</span><span><i>그림 2-2-1 태아기에 특징적인 순환기계 (문헌 2에서 인용·개변)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">체온조절 기능</div>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>태아의 체온은 양수의 온도에 의해 일정하게 유지되지만, 출생에 의해 자궁 외 환경에서의 생활이 시작되면 스스로 체온조절을 해야 한다. 태어난 송아지는 체중의 약 2%가 갈색지방조직(brown adipose tissue)으로 구성되어 있는데, 이 지방조직은 비떨림 열생산(nonshivering thermogenesis)에 관여하여 송아지의 체온 유지에 중요한 역할을 한다¹²˒¹³⁾. 생후 4일령까지의 정상 직장온도는 37.2~38.9℃다¹⁴⁾. 신생 송아지는 체중 대비 표면적 비가 크고 피부가 얇으며 피하지방이 적기 때문에 한랭 조건에서 열손실을 일으키기 쉽다¹⁵⁻¹⁸⁾. 출생 직후의 송아지는 양수로 피모가 젖어 있어 환경온도에 의한 냉각이나 양수 증발에 따른 기화열로 체온이 저하한다¹⁹˒²⁰⁾. 신생 송아지는 성우에 비해 열생산능이 낮은 것으로 알려져 있다. 신생 송아지는 근육 활동에 의한 열생산이 거의 없고, 대사 과정에서 생산되는 열이 주된 열원이 된다. 그 때문에 초유 섭취는 면역인자나 영양성분 섭취로서의 중요성뿐 아니라 체온 유지에도 크게 기여하게 된다¹⁹⁾. 혹한기 분만에서는 보온이 신생 송아지의 생존을 결정하는 중요한 관리가 된다(분만사의 보온이나 몸에 붙은 여분의 양수 제거, 초유의 적절한 급여 등). 생후 1주간 송아지의 사망률은 하계보다 동계에 높아진다고 보고되어 있다²¹⁾. 또한 난산으로 태어난 송아지에서는 고젖산혈증이나 산증 외에, 체온 유지에 관여하는 갑상선호르몬(T₃ 및 T₄)의 혈중 농도가 낮고 열생산능이 낮았다는 보고도 있다¹⁹⁾. 저체온증이 되어 버린 경우에는 히터로 데우거나 온수에 담그는 것으로 열손실을 방지하고, 동시에 포도당 등을 정맥 내 투여하여 대사열 생산을 촉진하는 것도 유용하다²²⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소화기관</div>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>출생 시 제1·2위(reticulorumen), 제3위(omasum) 및 제4위(abomasum)의 중량은 전체의 38%, 13%, 49%다²³⁾. 이 비율은 8주령까지 61.2%, 13.4%, 25.4%로, 12~16주령까지 67%, 18%, 15%로 변화한다²³˒²⁴⁾. 제2위구(reticular groove)는 송아지 위 내 구조 중에서도 독특한 특징의 하나다(그림 2-2-2)²⁵⁾. 송아지가 섭취한 액상 사료(초유, 전유 및 대용유)의 대부분은 식도나 위 내로 유입되면 제2위구가 반사적으로 닫혀 파이프 모양이 되어, 제1·2위, 제3위를 우회하여 제4위로 직접 유입된다²⁶⁾. 제4위는 출생 시에 기능적으로 완성되어 있는 유일한 위이며, 신생 송아지의 소화기능상 가장 중요한 기관이다. 지방, 탄수화물 및 단백질의 소화는 단위동물의 소화기계와 유사하며, 제4위와 소장에서 분비되는 소화효소에 의존한다. 성장과 함께 건물 섭취량이 늘어나면 제1위가 발달하기 시작하여 더 중요한 소화기관으로서의 역할을 하게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>태변(meconium)은 태아기에 마신 양수나 소화관 점막의 분비물, 탈락한 세포로 구성되며 출생 시 송아지의 장관 내에 존재한다²⁷⁾. 보통은 타르 모양이며 생후 48시간 이내에 배설된다. 초유 섭취 부족이나 미숙한 송아지의 경우 장 운동성이 저하되어 태변 배설이 곤란해지는 경우가 있으며, 진행성 산통 유사 증상을 보인다. 쇄항 등 기형과의 감별도 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>신생 송아지의 장관 점막에는 면역글로불린(Ig) 등의 고분자 화합물을 비선택적으로 흡수하는 특수한 상피세포가 존재한다²⁸⁾. 이 특수한 세포는 생후 약 24~36시간에 통상의 점막 상피세포로 치환된다. 이 현상은 「장 폐쇄(gut closure)」라 불리며, 이 시기를 지나면 장관 점막에서 고분자 화합물을 흡수할 수 없게 된다. 생후 4시간 무렵까지는 장관 점막을 통한 Ig 흡수효율이 높고, 생후 12시간을 지나면 급속히 저하하기 시작한다²⁹⁻³¹⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="16">•</span><span><i>그림 2-2-2 신생 송아지 위의 모식도 (문헌 25에서 인용·개변)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">면역기능</div>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span>임신 후기까지 태아의 호중구는 탐식작용을 발휘하지만, 출생 직전이 되면 태아 유래 코르티솔의 영향으로 탐식 및 살균능력이 저하한다³²⁾. 출생 후 초유를 섭취함으로써 호중구와 대식세포의 탐식기능은 급속히 증대한다³³⁾. 1주령 무렵까지는 호중구가 기능적인 응답이 가능해지고³⁴⁾, 5개월령 무렵까지는 성우와 같은 수준까지 발달한다³⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span>태아 혈청 중의 살균활성은 임신 75일까지 확인되며, 90일까지는 보체활성이 확인된다³⁶⁾. 출생 시 송아지의 보체활성은 성우의 약 50%이고, 생후 1일령에 성우의 20%까지 급속히 저하한다. 그 후 순환혈액 중 보체 수준은 서서히 증가하여 생후 1개월령까지 성우의 약 50%까지 증가한다³⁷⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="19">•</span><span>면역응답에 필요한 모든 세포 성분은 출생 시 송아지에 갖추어져 있지만³⁸⁾, 생후 2~4주령까지는 충분히 기능하지 않고 춘기발동 무렵까지 계속 발달한다³⁹⁾. 신생 송아지의 면역학적 특징을 말하는 데 가장 중요한 것은, 자궁 내에서 감염되지 않는 한 출생 시의 송아지는 면역글로불린(Ig)을 갖고 있지 않다는 점이다⁴⁰⁾. 이는 소의 태반(결합조직 융모막 태반)의 구조상 Ig 등 분자량이 큰 물질은 태반을 통과하여 태아로 이행하지 않기 때문이다. 따라서 초유 중의 Ig를 경구적으로 섭취하는 것은 적어도 생후 2~4주령 송아지의 면역학적 방어능을 보장하기 위해 불가결하다⁴¹⁾. 송아지 체내에서 초유 유래 IgG의 반감기는 약 20일이다⁴²⁾. 초유 중에는 모체 유래 백혈구(주로 T림프구)가 포함되어 있으며, 송아지의 순환혈액 중으로도 이행하여 생후 24시간에 피크 수준에 도달한다³⁹⁾. 모체 백혈구를 포함한 초유를 섭취한 동물은 항원제시세포가 더 빨리 발달한다고 보고되어 있다⁴³⁾. 이에 따라 항병성이 높아질 뿐 아니라 백신 접종에 대한 반응성도 높아질 가능성이 생각된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">에너지 대사</div>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>태아기에는 글루코스와 젖산이 주요 에너지원이 된다. 유리 아미노산도 태아의 에너지원으로 이용되지만 지방산이나 케톤체는 그다지 중요하지 않다⁴⁴⁾. 태아의 주요 영양원인 글루코스는 태반을 통해 모체로부터 공급된다⁴⁵⁾. 출생이 가까워지면 태아의 성숙에 따라 태아 체내의 글루코코르티코이드, 카테콜아민 및 갑상선호르몬 활성이 높아지고, 당신생 활성이나 간의 글리코겐 저장이 증가한다⁴⁶⁾. 출생으로 태반으로부터의 글루코스 공급이 끊기면 송아지는 외인성 및 내인성 에너지원을 확보할 필요가 있다. 초유 중의 락토스를 경구 섭취할 수 있지만 송아지의 글루코스 요구량을 충족하기에는 충분하지 않다⁴⁶⁾. 또한 송아지는 체지방에서 동원한 유리지방산으로 에너지 부족을 보충할 수 있다⁴⁶⁾. 임신 후기에 저장된 간 글리코겐은 생후 수 시간의 에너지원으로 이용되지만⁴⁷⁾, 생후 4~6시간에 고갈된다²⁾. 그 때문에 면역학적 관점뿐 아니라 영양학적으로도 초유를 조기에 섭취하는 것이 중요하다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span><span style="color:var(--ink-soft)">(저자: 滝木孝弘)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">흑모화종과 홀스타인의 생리적 차이</div>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>현재 일본에서 사육되고 있는 육용 품종은 주로 흑모화종, 갈모화종, 일본단각종, 무각화종의 4품종인데, 이 중 품종별 사육두수에서는 흑모화종이 약 165만 3,000두로 가장 많아 2위인 갈모화종의 약 2만 2,000두를 크게 앞선다(2018년)⁴⁸⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>이하 일본의 주요 품종인 흑모화종의 생리적 특징에 대해 유용 품종인 홀스타인과 비교함으로써 체격(성장), 내분비 및 면역 등의 관점에서 해설한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">체격적 특징</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="24">•</span><span><b>출생 시 체중</b></span></p>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>흑모화종은 육용 품종의 다른 품종에 비해 근육 내 지방, 이른바 「사시(마블링)」가 들어가기 쉬운 특징을 갖고 있다. 일본에서는 일반적으로 다지리(田尻)계, 케타카(気高)계, 이토자쿠라(糸桜)계(또는 후지요시(藤吉)계)의 3계통을 이용하여 육질, 육량, 증체속도 등 유전적 산육능력의 개량을 하고, 나아가 효율적 사양기술의 개선도 추진함으로써 흑모화종의 지육 성적 향상을 도모해 왔다. 흑모화종의 출생 시 체중이나 그 후의 발육은 이들 계통의 차이 외에 사육지에서 정한 개량목표, 그리고 각 사육장에서의 여러 육성방법에 의해 영향을 받는 것으로 알려져 있지만, 본 절에서는 일반론으로 논한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>표 2-2-1 및 표 2-2-2는 출생 시부터 18개월령까지의 흑모화종 암소⁴⁹⁾와 홀스타인 암소⁵⁰⁾의 체중 및 체고 표준치를 나타낸다(1995년). 출생 시 흑모화종의 표준 체중은 암송아지가 28.0 kg, 수송아지가 30.0 kg, 표준 체고는 암송아지가 67.0 cm, 수송아지가 69.0 cm다⁴⁹⁾. 암송아지의 경우 유용 품종의 대표인 홀스타인의 출생 시 표준 체중은 40.0 kg, 표준 체고는 75.1 cm이므로, 흑모화종의 신생 송아지는 압도적으로 몸집이 작다⁵⁰⁾.</span></p>

<p class="bx-num"><span class="bxn" data-n="31">•</span><span><span style="color:var(--ink-soft)">1) 일본사양표준 육용우 1995</span></span></p>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span><span style="color:var(--ink-soft)">2) 일본홀스타인등록협회 1995</span></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="33">•</span><span><b>성장</b></span></p>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>흑모화종 암송아지의 체중 및 체고 표준치는 1개월령에 50.6 kg, 74.4 cm다⁴⁹⁾. 이로부터 생후 1개월령까지의 증가량은 체중, 체고에서 각각 +22.6 kg, +7.4 cm가 된다. 한편 홀스타인 암송아지에서는 체중 및 체고 표준치가 1개월령에 56.3 kg, 80.6 cm이므로 생후 1개월령까지의 증가량은 +16.3 kg, +5.5 cm가 된다⁵⁰⁾. 암송아지의 경우 생후 1개월령까지의 체중 및 체고 증가량은 흑모화종 쪽이 홀스타인보다 약간 크다고 생각된다. 나아가 출생 시부터 1개월령까지의 체중 증가율(=〈1개월령 체중−출생 시 체중〉/출생 시 체중)로 비교한 경우에도 흑모화종 암송아지는 1개월령에 80.7%, 홀스타인 암송아지는 40.8%가 되어, 생후 1개월간의 체중 증가율은 흑모화종 암송아지 쪽이 홀스타인 암송아지보다 약 2배 크다(체고 증가율: 11.0%〈흑모화종 암송아지〉, 7.3%〈홀스타인 암송아지〉). 이는 같은 기간 양 품종의 체중 증가율을 조사한 결과와 거의 일치하며⁵¹⁾, 이 시기 흑모화종 암송아지의 양분 요구량은 홀스타인 암송아지보다 크다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>그러나 흑모화종 암소의 체중 증가량은 2~4개월령 사이에, 또 체고 증가량은 4~6개월령 사이에 각각 홀스타인 암송아지에 역전되어, 이후 홀스타인의 체중 및 체고 증가량이 우세해진다(표 2-2-1, 표 2-2-2).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="36">•</span><span>*그림 2-2-3 혈장 GH 농도(기초치)의 품종 간 비교. 홀스타인 암송아지(n=10), 흑모화종 암송아지(n=9). 동령의 홀스타인 암송아지 값에 대해 차이의 경향(† P<0.1) 또는 유의차 있음. *P<0.05, **P<0.01*</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="37">•</span><span>*그림 2-2-4 혈장 인슐린 농도(기초치)의 품종 간 비교. 홀스타인 암송아지(n=10), 흑모화종 암송아지(n=9). 동령의 홀스타인 암송아지 값에 대해 차이의 경향(† P<0.1) 또는 유의차 있음. *P<0.05, **P<0.01*</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">내분비적 특징</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="38">•</span><span><b>성장호르몬(GH) 및 인슐린 유사 성장인자(IGF)-1</b></span></p>
<p class="bx-num"><span class="bxn" data-n="39">•</span><span>성장호르몬(growth hormone: GH)은 뇌하수체 전엽에서 방출되는 호르몬으로, 간에 있는 수용체와 결합함으로써 인슐린 유사 성장인자(insulin-like growth factor: IGF)-1의 분비를 촉진한다. GH 및/또는 IGF-1은 체단백질의 동화(합성) 효과, 성장기 골단부 연골세포의 분열·증식 촉진 효과, 그리고 간에서의 글리코겐 분해 촉진에 의한 혈당 상승 효과 등을 갖는다. 한편 지질대사에 대해서는 지질 합성을 억제하고(항인슐린 작용), 근육이나 지방조직에서의 당 흡수 촉진 및 간에서의 당신생 억제 등 인슐린 효과에 길항하는 작용(인슐린 저항성)을 갖는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>혈장 GH 농도(기초치)에 대해 동일 개체의 흑모화종 암소와 홀스타인 암소를 출생 후부터 생후 18개월령까지의 기간에 비교한 경우, 흑모화종 암소의 GH 기초치는 홀스타인 암소에 비해 낮고(그림 2-2-3)⁵²⁾, 또한 22개월령 암소에서도 흑모화종의 GH 및 IGF-1 기초치는 홀스타인보다 낮다⁵³⁾. 나아가 뇌하수체 전엽의 소마토트로프(GH 분비세포)에서 GH를 방출시키는 GH 방출호르몬을 말초혈에 주입한 경우에도 GH 분비에 대한 반응성은 3개월령 이후 흑모화종 쪽이 홀스타인보다 낮으며⁵²⁾, 18~21개월령 흑모화종 및 홀스타인 거세우의 뇌하수체 전엽 후방 배측부에서 소마토트로프가 차지하는 비율은 홀스타인에 비해 흑모화종 쪽이 낮다⁵⁴⁾. 이 소마토트로프의 수적 열세가 흑모화종의 GH 분비량이 홀스타인에 비해 상대적으로 낮은 이유의 하나로 생각된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="41">•</span><span><b>인슐린</b></span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>인슐린은 3대 영양소의 대사조절에 밀접하게 관여하는데, 특히 섭취한 영양분의 체내 축적을 촉진하는 동화 효과를 발휘한다. 암소의 경우 혈장 인슐린 농도(기초치)는 12개월령 이전에는 흑모화종과 홀스타인 사이에 큰 차이가 없지만, 12개월령을 넘으면 홀스타인에 비해 흑모화종 쪽이 현저히 높아진다(그림 2-2-4)⁵²⁾. 같은 결과는 22개월령 암소나 체중 400 kg의 거세우에서도 보고되어 있다⁵³˒⁵⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>이 12개월령을 넘은 무렵부터의 흑모화종의 높은 인슐린 분비능에 의해, 섭취한 영양분은 골격 형성보다 근단백질이나 지질을 합성하는 소재로서 더 우선적으로 배분된다고 생각된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="44">•</span><span><b>렙틴</b></span></p>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>지방세포에서 분비되는 렙틴은 뇌의 시상하부에 있는 포만중추를 자극하여 채식행동 억제, 에너지 대사 활성, 그리고 인슐린 작용 증강 등의 효과를 갖는 펩티드 호르몬이며, 체지방량 증가에 따라 그 분비량은 증가한다. 흑모화종과 홀스타인의 혈장 렙틴 농도를 생후 20주령까지 경시적으로 조사한 연구에서는 혈장 렙틴 농도는 흑모화종 쪽이 전반적으로 높고⁵⁶⁾, 특히 6 및 9주령에서 유의차를 보인다. 또한 비육기에도 홀스타인에 비해 흑모화종 쪽이 혈장 렙틴 농도 및 피하지방의 렙틴 mRNA량이 높고, 혈장 렙틴 농도와 피하지방 렙틴 mRNA량 사이에는 양의 상관관계가 있음이 제시되어 있다⁵⁷⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>표 2-2-3 초유의 유량 및 유성분(평균치)의 품종 간 비교.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목</th><th>흑모화종¹⁾</th><th>홀스타인¹⁾</th><th>흑모화종²⁾</th><th>홀스타인²⁾</th></tr><tr><th>유량(kg)</th><td style="text-align:left">0.3</td><td style="text-align:left">4.6</td><td style="text-align:left">1.3</td><td style="text-align:left">9.9</td></tr><tr><th>유성분(%)</th><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>유지방</th><td style="text-align:left">4.5</td><td style="text-align:left">8.3</td><td style="text-align:left">5.1</td><td style="text-align:left">6.2</td></tr><tr><th>유단백질</th><td style="text-align:left">11.4</td><td style="text-align:left">13.9</td><td style="text-align:left">16.7</td><td style="text-align:left">13.7</td></tr><tr><th>유당</th><td style="text-align:left">3.6</td><td style="text-align:left">2.7</td><td style="text-align:left">2.0</td><td style="text-align:left">2.4</td></tr><tr><th>무지고형분</th><td style="text-align:left">—</td><td style="text-align:left">—</td><td style="text-align:left">19.6</td><td style="text-align:left">17.1</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span><span style="color:var(--ink-soft)">1) 흑모화종 초산우 6두, 홀스타인 초산우 7두(문헌 58에서 인용·개변)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span><span style="color:var(--ink-soft)">2) 흑모화종 경산우 14두, 홀스타인 경산우 35두(문헌 59에서 인용·개변)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>초유: 분만 직후의 첫 착유</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">면역학적 특징</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="50">•</span><span><b>초유</b></span></p>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>신생 송아지에 대한 적시 초유 급여의 중요성은 송아지에 대한 면역 부여 관점에서 홀스타인, 흑모화종 등 품종에 관계없이 인정된다. 초유를 분만 직후의 첫 착유로 정의한 경우, 흑모화종의 초유량은 홀스타인에 비해 극히 적다(표 2-2-3)⁵⁸˒⁵⁹⁾. 초유의 유성분은 암소의 계통, 산차, 영양상태, 사양상황 등에 따라 달라지므로 일률적으로 말할 수 없지만, 홀스타인에 비해 흑모화종의 유지방률은 동등하거나 약간 낮고⁵⁸˒⁵⁹⁾, 유당률은 동등하거나 약간 높다⁵⁸˒⁵⁹⁾. 또한 유단백질률 및 무지고형분률은 거의 동등하다⁵⁸˒⁵⁹⁾(표 2-2-3). 나아가 Ig의 일종인 IgG의 서브타입 중 하나로 면역력의 지표가 되는 IgG1의 초유 중 농도는 초유량이 적은 흑모화종(160.1 mg/mL) 쪽이 홀스타인(73.1 mg/mL)보다 높다⁵⁹⁾.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="52">•</span><span><b>면역응답</b></span></p>
<p class="bx-num"><span class="bxn" data-n="53">•</span><span>자신의 조직이나 세포와 다른 것이 외부에서 침입한 경우, 이를 이물로 인식하여 배제하는 생체방어기구가 발동한다. 송아지의 경우 IgG를 함유한 초유를 출생 후 6시간 이내에 섭취함으로써, 자연면역(대응세포: 대식세포, 호중구, 수지상세포)으로는 대항할 수 없는 이물에 대해 백혈구를 매개로 한 면역기능이 획득되어 그 이물의 배척률을 높인다. 그 후 다시 공격을 받아도 먼저 획득한 정보를 백혈구가 기억하고 있기 때문에 그 이물은 정착하지 못하고 배척된다(면역응답).</span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>백혈구는 과립구(호중구, 호산구, 호염기구)와 단핵구(림프구와 단구)로 나뉜다. 나아가 림프구는 자연살해(NK)세포, B세포, T세포로 크게 나뉜다. 이 중 T세포는 병원체에 침식당한 자신의 세포나 암세포를 제거하는 세포성 면역의 역할을 가지며, 헬퍼 T세포, 세포상해성(킬러) T세포, 조절성 T세포 등의 서브타입이 존재한다. 성숙한 T세포에는 막을 관통하는 당단백질 표면항원인 CD4 또는 CD8(둘 다 T세포 수용체의 공수용체로서의 기능을 가짐) 중 하나가 존재한다. 이로부터 헬퍼 T세포는 「CD4 양성 T세포(CD4⁺ T세포)」, 킬러 T세포는 「CD8 양성 T세포(CD8⁺ T세포)」라고도 불린다. 백혈구의 표면항원에는 이 밖에 T세포 서브셋으로서 CD3(총 T세포: CD3⁺ T세포), CD14(단구), WC1(γδ T세포<sup>주1)</sup>⁶⁰⁾) 등이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>일반적으로 흑모화종의 어린 송아지는 같은 시기의 홀스타인에 비해 세균 감염증에 걸리기 쉽기 때문에 조기 사망이나 발육부전이 되는 개체가 많다고 한다. 이 원인에 관해 면역응답 관점에서 고찰한다. 흑모화종 송아지 및 홀스타인 송아지의 말초혈 백혈구의 생리학적 특징(백혈구 집단)을 조사한 보고에서는, 12주령에 백혈구 수는 흑모화종(111×10²/μL)이 홀스타인(80×10²/μL)보다 높고⁶¹⁾, 호중구 수도 흑모화종(42×10²/μL) 쪽이 홀스타인(24×10²/μL)보다 유의하게 높으며, 나아가 말초혈 단핵구의 표면항원 양성 세포 수에서는 홀스타인에 비해 흑모화종의 CD3⁺ T세포 수, CD4⁺ T세포 수 및 CD14⁺ T세포 수는 시기에 따라 높은 값을 보이는 한편 WC1⁺ T세포 수는 전반적으로 낮아지는 경향에 있다고 한다(표 2-2-4). 이와 같이 적어도 생후 12주령까지의 흑모화종 송아지가 홀스타인이나 그 F1 송아지보다 질병 저항성이 낮은 원인의 하나로, T세포가 관련된 세포성 면역응답의 품종 간 차이가 관계하고 있을 가능성이 있다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="56">•</span><span>※ 주1) γδ T세포: 통상의 α사슬·β사슬과 달리 γ사슬·δ사슬의 이량체로 구성되는 수용체를 가진 소 고유의 T세포로, 감염 초기의 면역반응이나 암세포 배제 등 킬러 T세포와 같은 작용을 갖는다.</span></p>

2.50</td><td style="text-align:left">7.88</td><td style="text-align:left">*</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>흑모화종 송아지 10두(수 5두·암 5두)</span></p>
<p class="bx-num"><span class="bxn" data-n="59">•</span><span>홀스타인 송아지 10두(수 6두·암 4두)</span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span><span style="color:var(--ink-soft)">\*P<0.05 (문헌 61에서 인용·개변)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">형태생리학적 특징</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="61">•</span><span><b>지질합성 핵내 전사인자</b></span></p>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>흑모화종은 근육조직에서의 지방교잡도(마블링)가 큰 특징을 가진 육용 품종이다. 흑모화종의 지방교잡은 제6~7늑골 간에 있는 등심 부위의 절단면에서 본 경우 생후 8개월령까지는 전혀 보이지 않지만, 12개월령에 극히 약간 확인되고 이후 24개월령까지 그 정도가 직선적으로 증가한다⁶²⁾. 그러나 이 지방교잡이 근육 내, 근육 간에서 육안적으로 확인되기 이전부터 전구지방세포의 지방세포로의 분화 준비는 이미 시작되어 있을 가능성이 있다. 지방세포가 전구지방세포로부터 분화 유도되는 것을 촉진하는 지질합성계 인자(단백질)로 CCAAT/enhancer-binding protein(C/EBP) 패밀리의 C/EBPδ(지방세포 분화 초기에 발현량이 증가하여 초기 분화 제어에 관여하는 인자)나 C/EBPα(지방세포 분화 후기에 발현량이 증가하여 지방세포 종말분화에 관여하는 인자) 등의 핵내 전사인자를 들 수 있는데, 생후 2~16개월령까지의 흑모화종과 홀스타인 사이에는 이들 인자의 발현 피크와 그 발현량에 차이가 있다⁶³⁾. 또한 비육 중기에 해당하는 생후 19개월령의 근간지방조직을 품종 간 비교하면, 흑모화종의 C/EBPδ 발현량은 홀스타인보다 유의하게 높고 C/EBPα 발현량도 높은 경향을 보이는 등 홀스타인에 비해 흑모화종의 지방세포로의 분화가 더 활발히 이루어지고 있음을 시사하며, 동시에 같은 월령에서의 도축 해체 시 근간 체지방 비율도 유의하게 높은 것⁶⁴⁾이 보고되어 있다. 이로부터 지방세포로의 분화에 관여하는 지질합성계 인자의 발현 피크 및 그 발현량의 차이가 그 후의 지방교잡도나 지방축적에 큰 영향을 주고 있을 가능성이 있다. 나아가 19~22개월령 양 품종의 장간막 지방조직에서 지방세포로의 분화를 억제하는 인자인 preadipocyte factor-1(pref-1)의 mRNA량을 조사한 연구에서는 홀스타인에 비해 흑모화종 쪽이 유의하게 낮은 것⁶⁵⁾, 10~26개월령 흉최장근의 pref-1을 품종 간 비교한 연구에서도 흑모화종의 발현량이 낮은 경향을 보이는 것⁶⁶⁾으로부터, 흑모화종의 낮은 pref-1 발현량이 높은 지방교잡도에 관여하고 있다고 시사된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>이와 같이 흑모화종에서 육성기부터 비육기에 걸쳐 지질의 합성이나 억제를 관장하는 핵내 전사인자의 발현 피크나 그 발현량에 홀스타인과 차이가 인정되는 것은, 흑모화종을 특징짓는 지방교잡의 심화와 밀접한 관련이 있다고 생각된다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="64">•</span><span><b>근섬유</b></span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>어린 시기의 흑모화종과 홀스타인의 근섬유 성상을 비교한 보고는 거의 없다. 생후 10개월령부터 26개월령까지 최장근의 근섬유 크기를 경시적으로 조사한 연구에서는⁶⁷⁾, 흑모화종은 10~14개월령 기간에, 홀스타인은 14~18개월령 기간에 증대하는 경향에 있으며, 이후 홀스타인에서는 동등한 정도를 유지하지만 흑모화종에서는 22개월령을 경계로 이후 감소하는 것이 보고되어 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span><span style="color:var(--ink-soft)">(저자: 新宮博行)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span><span style="color:var(--ink-soft)">일본송아지 2-2 신생 송아지의 생리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">2-3 출생 시 관리와 환경</div>
<div class="bx-sub"><div class="bx-subtitle">분만실 관리</div>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>낙농장의 대형화와 다두 사육화가 진행됨에 따라, 근년에는 분만실을 굳이 만들지 않고 건유 후기군에서 분만시키는 농장도 산견된다. 그러나 난산이나 신생 송아지 폐사의 발생률을 낮게 억제하기 위해서는 분만 감시가 매우 중요하며¹⁾, 제대로 관리할 수 있는 분만실을 준비하는 것은 낙농장에 큰 이익을 가져다준다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>송아지는 면역글로불린(주로 IgG)을 전혀 갖지 않은 상태로 태어나며, 초유를 섭취함으로써 비로소 체액성 면역능을 획득한다²⁾. 신생 송아지의 장관 점막에는 특수한 세포가 존재하여 피노사이토시스(pinocytosis, 거대분자를 받아들이는 작용)에 의해 Ig가 효율적으로 흡수되지만³⁾, 그 작용은 비선택적이어서 동시에 세균 등도 받아들여지는 위험이 있다. 따라서 송아지가 태어나서 초유를 섭취할 때까지의 시간을 보내게 될 분만실은 항상 위생적인 것이 바람직하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>분만실을 위생적으로 유지하기 위한 조건으로 ① 충분한 면적이 있을 것, ② 청소와 소독이 쉬울 것, ③ 청결한 깔짚이 풍부할 것 등을 들 수 있다. 분만실에 필요한 면적은 동물복지 관점에서 1두당 최저 10 m²로 되어 있으나⁴⁾, 나아가 청소 등의 작업성을 고려하면 20 m² 정도가 이상적이다⁵⁾. 또한 사방을 벽으로 막지 않고 최소 2면은 파이프 등의 구조로 해 두면 난산 시 견인 등을 할 때 편리하다(그림 2-3-1).</span></p>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>분만 시 흔히 보이는 질병으로 난산, 자궁탈, 자궁염전 및 분만 전후 기립불능증이 있다. 이들 질환에서는 카우리프트를 이용해 소의 후구를 들어 올리거나 뒷다리에 로프를 걸어 들어 올릴 필요가 생길 수 있다. 그러므로 분만실 천장을 체인블록을 걸 수 있는 구조(그림 2-3-2)로 하거나 트랙터가 쉽게 들어올 수 있는 구조로 하면 개조가 쉬워진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>바닥재는 소가 미끄러지지 않고 눕고 일어서기 쉬운 것이 이상적이며, 고무매트, 모래, 흙 등이 적합하지만, 청소의 용이성 등을 고려하면 고무매트 위에 미끄럼 방지로 밀짚 등의 건조한 깔짚을 대량으로 넣는 것이 좋다⁶⁾. 또한 분만실은 분만마다 청소하고 소독하는 것이 기본이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span>소는 군집으로 행동하는 동물이므로 단독으로 격리되었을 때의 스트레스가 매우 크며, 특히 분만 전 2~5일의 이동은 소의 채식량을 감소시킨다. 나아가 분만실 체류 기간이 3일 이상이 되면 주산기 질병의 발생률이 2배가 된다는 데이터도 있다. 따라서 분만실에서의 관리는 가능한 한 짧은 것이 좋다고 여겨지며, 분만 12~24시간 전에 들여보내고 분만 후에는 3일 이내에 프레시군(비유 초기의 착유우군)으로 이동시키도록 한다. 또한 분만 전 이동의 수고 등을 고려하면 분만실은 건유 후기군에 인접해 있고 동료가 보이는 환경에서 분만시키는 것이 바람직하다⁵⁻⁷⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="74">•</span><span><i>그림 2-3-1 이상적인 분만실. 충분한 면적이 있고 대량의 깔짚으로 채워져 있다. (日本全薬工業㈱ 제공)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="75">•</span><span><i>그림 2-3-2 소를 쉽게 매달아 올릴 수 있는 분만실 (日本全薬工業㈱ 제공)</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="76">•</span><span>■ 초유 급여와 관리</span></p>
<div class="bx-sub"><div class="bx-subtitle">IgG 흡수에 영향을 미치는 요인</div>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>앞서 말한 바와 같이 신생 송아지는 혈중에 IgG가 전혀 없는 상태로 태어나며, 초유를 섭취함으로써 비로소 체액성 면역능을 획득한다. 따라서 송아지를 감염증으로부터 지키기 위해서는 IgG를 풍부하게 함유한 초유의 급여가 불가결하지만, 그 방법이 잘못되어 있으면 급여하더라도 송아지는 충분한 IgG를 흡수할 수 없다. IgG 흡수에 영향을 미치는 요인으로 출생 시 송아지의 상태, 초유의 품질, 급여 방법, 급여까지의 시간, 급여량 등을 들 수 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="78">•</span><span><b>출생 시 송아지의 상태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>출생 시 송아지는 생리적으로 저산소혈증, 고이산화탄소혈증, 호흡성 및 대사성 산증을 나타낸다. 이 상태는 건강한 송아지에서는 출생 후 12시간 이내에 개선되지만, 난산이나 그에 따른 신생 송아지 가사 등으로 태어난 송아지에서는 이들이 보정될 때까지의 시간이 연장된다. 또한 출생 직후 송아지의 제4위 내에는 체중의 약 5%의 양수가 저류되어 있으며, 저산소혈증의 개선에 따라 그 양수는 장관으로 이송된다. 이에 따라 송아지는 포유욕을 보이지만, 저산소혈증의 개선이 늦어진 경우에는 양수가 제4위 내에 머물러 포유욕이 장시간 발현되지 않는다. 이 경우 카테터 등으로 강제로 초유를 투여하더라도 제4위 내에서 희석되어 IgG 흡수량은 저하된다(그림 2-3-3, 2-3-4)⁸⁻¹¹⁾. 따라서 난산으로 견인한 송아지나 출생 시 가사로 진단된 송아지에 대해서는 적절한 소생 처치(후술)를 함과 동시에 높은 IgG 농도가 보증된 초유를 급여할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="80">•</span><span><i>그림 2-3-3 신생 송아지의 동맥혈 PO₂ 분압과 초유 이행 면역 (문헌 10에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="81">•</span><span><i>그림 2-3-4 출생 후 포유욕과 혈청 γ글로불린 농도의 추이 (문헌 10에서 인용·개변)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="82">•</span><span><b>초유의 품질</b></span></p>
<p class="bx-num"><span class="bxn" data-n="83">•</span><span>초유 중 IgG 농도는 품종별, 산차별, 나아가 개체별로 편차가 매우 크지만, 50 mg/mL 이상이면 만족스러운 수준으로 여겨진다<sup>2,12)</sup>^. 또한 초유 중 IgG 농도는 비중 및 당도(Brix값)와 높은 상관이 있으며, IgG 농도 50 mg/mL인 초유의 비중은 약 1.050, Brix값은 약 20%이다<sup>2,13,14)</sup>^. Brix값은 비교적 저렴한 당도계(그림 2-3-5)로 간단히 측정할 수 있고, 비중계처럼 온도에 의한 오차를 고려하지 않아도 되는 등의 이유로 현장에서 초유의 품질을 평가할 때 매우 유효한 도구이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>또한 세균수가 많은 초유에서는 IgG의 혈중 흡수량이 감소하고, 나아가 출생 후 약 24시간은 IgG뿐 아니라 세균도 체내로 흡수되기 쉬우므로 초유 중 세균수를 가능한 한 적게 유지할 필요가 있다¹⁵⁻¹⁷⁾. 초유 중에서 세균이 증가하는 요인으로 부적절한 기구 세척 방법이나 초유 보존 방법을 들 수 있다. 초유를 다루는 기구(버킷밀커나 포유병 등)는 매회 사용 후 알칼리성 세제로 세척하고, 3~4일마다 산성 세제로 세척하며, 나아가 사용 전 매회 살균하는 것이 바람직하다. 위생적으로 착유된 초유라도 상온에서 9시간 이상 방치한 경우 일반 세균수가 1.5만/mL를 넘으므로, 초유를 그대로 급여할 경우에는 가능한 한 빨리, 가급적 1시간 이내에 급여한다. 또한 냉장 보존하는 경우에도 착유 후 1시간 이내에 냉장하고, 늦어도 다음 날까지는 급여해야 한다<sup>15,18)</sup>^.</span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>초유를 동결 보존하는 경우, 동결·해동·급여를 신속하게 할 수 있는 2 L들이 지퍼백 비닐봉지가 편리하다(그림 2-3-6). 동결할 초유는 사전에 Brix값을 측정하여 Brix값 20% 이상인 것만 사용한다. 동결한 초유는 -20℃ 이하에서 1년 이상 안정하다고 여겨지지만, 해동 시 60℃ 이상의 열을 가하면 Ig가 실활하므로 과도한 가온은 금물이며, 이상적으로는 50℃ 정도의 온수에서 천천히 해동하는 것이 좋다¹⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>초유의 세균수를 낮게 유지하는 방법으로 저온살균(파스퇴르 처리)이 있다. 초유의 저온살균은 통상 전용 파스퇴라이저를 이용해 60℃, 30분간 실시한다(그림 2-3-7). 이 조건이라면 세균수는 감소하지만 Ig의 실활은 최소한으로 억제된다. 착유 후 1시간 이내의 초유를 이용해 저온살균한 뒤 그대로 급여하거나 냉장, 냉동 처리한다. 저온살균 처리에는 보존 기간 중 세균 증식을 억제하는 효과에 더해, 소 백혈병 바이러스나 요네균(Mycobacterium avium subsp. paratuberculosis)을 불활화하여 송아지로의 감염원을 차단하는 효과도 있다<sup>12,15,19)</sup>^.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="87">•</span><span><i>그림 2-3-5 초유의 Brix값을 측정하기 위한 당도계</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="88">•</span><span><i>그림 2-3-6 지퍼백이 달린 초유 봉지. 채취 월일과 Brix값을 라벨해 둔다. (日本全薬工業㈱ 제공)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="89">•</span><span><i>그림 2-3-7 초유나 이행유를 저온살균하기 위한 파스퇴라이저 (『子牛の科学』에서 인용)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="90">•</span><span><b>초유 급여 방법</b></span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>초유 급여법으로 포유병에서 자발적으로 빨게 하는 방법과 식도 카테터를 이용해 강제로 먹이는 방법(그림 2-3-8)이 있다. 전자에서는 제2위구 반사(식도구 반사)가 일어나 초유가 제1위를 거치지 않고 직접 제4위 내로 유입되지만, 후자에서는 제2위구 반사가 일어나지 않으므로 초유는 제1위를 경유하여 제4위로 유입된다. 이 때문에 언뜻 포유병을 사용하는 편이 IgG 흡수 효율이 높을 것처럼 생각되지만, Quigley는 생후 2시간의 송아지에 대해 합계 200 g의 IgG를 함유한 초유를 1회 급여한 경우, 어느 방법에서도 혈중 IgG 농도에 차이가 없었다고 보고하고 있다²⁰⁾. 그 이유로 신생 송아지의 제1위는 400 mL의 용적밖에 없으므로 넘친 초유가 그대로 제4위로 흘러들어 실질적으로 양 급여법에서 흡수율에 차이가 나지 않은 것이 아닌가 하고 고찰하고 있다. 이 실험 결과로부터 단순히 IgG 흡수 효율만을 생각할 경우 어느 방법이라도 상관없다고 생각되지만, 앞서 말한 저산소혈증에 의한 제4위 내 양수 저류의 가능성 및 오연의 위험 등을 고려하면 가능한 한 스스로 포유시키고, 부득이한 경우에 카테터를 이용하는 것이 바람직하다<sup>12,13)</sup>^.</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>식도 카테터 사용법은 ① 송아지를 기립위 또는 흉와위로 하고 머리와 목을 겨드랑이에 단단히 안는다, ② 튜브의 밑동을 확실히 접어 액체가 새지 않도록 한다, ③ 튜브 끝이 인후두부를 넘어 식도까지 들어간 것을 확인하고 주입한다, ④ 튜브 밑동을 다시 확실히 접은 뒤 뽑는다, 는 순서로 실시한다. 오연 사고는 ① 끝이 식도까지 들어간 것을 확인하고 주입했으나 갑자기 소가 날뛰어 튜브가 인후두부 앞까지 빠져 버렸다, ② 튜브를 뽑을 때 밑동을 접지 않고 뽑아 튜브 안의 우유가 기관으로 들어갔다, 는 경우가 많다. 그러므로 소를 확실히 보정하고, 보정할 수 없을 정도로 날뛸 경우에는 즉시 튜브를 뽑으며, 튜브를 뽑을 때는 반드시 밑동을 접은 뒤 뽑는 점에 주의한다. 또한 대량의 초유를 한 번에 강제 급여한 결과 제4위가 급격히 커져 횡격막을 압박하여 호흡부전을 일으키는 경우가 있으므로¹⁰⁾, 호흡부전인 소나 체격이 작은 소에 대해서는 2~3회로 나누어 급여하는 편이 안전하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="93">•</span><span><i>그림 2-3-8 식도 카테터를 이용한 초유 급여 (『子牛の科学』에서 인용)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="94">•</span><span><i>그림 2-3-9 초유 급여까지의 시간과 겉보기 흡수율(AEA)의 관계. AEA(%) = -0.259 × TIME(h) + 27.27, 변곡점 12.3시간, AEA(%) = -2.546 × TIME(h) + 55.38 (문헌 13에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="95">•</span><span><i>그림 2-3-10 초유 급여까지의 시간과 송아지로의 면역글로불린 이행. 생후 1시간(n=5), 생후 3시간(n=5), 생후 6시간(n=5) (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="96">•</span><span><b>초유 급여까지의 시간</b></span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>초유로부터의 Ig 흡수율은 출생 직후가 가장 높지만, 그 후 직선적으로 저하되어 24~36시간이 경과하면 전혀 흡수되지 않게 된다<sup>13,21)</sup>^(그림 2-3-9). 이 때문에 과거에는 초유 급여는 빠르면 빠를수록 좋다고 여겨져, 출생 직후의 송아지에 대해 식도 카테터를 이용하여 초유를 강제로 급여하는 농장도 산견되었다. 그러나 최근 연구에서 출생 직후의 송아지에 초유를 강제로 급여하더라도 제4위 내에 남아 있는 양수에 의해 Ig가 희석되고, 나아가 커드 형성이 불완전하기 때문에 흡수율이 저하되어 버릴 가능성이 지적되어¹⁰⁾, 현재 이 방법은 권장되지 않는다. 또한 小原 등은 흑모화종 송아지에 대해 출생 후 1시간, 3시간 및 6시간 후에 초유를 급여하고 그 후의 혈중 IgG 농도 변화를 비교한 결과, 3군에서 차이가 없었다고 보고하고 있다¹²⁾(그림 2-3-10). 이들 성적으로부터, 아직 포유욕이 없는 송아지에 대해 서둘러 초유를 강제 투여할 필요는 없으며, 기립하여 포유욕이 나타난 시점에 초유를 급여하면 충분하다는 것을 알 수 있다. 다만 출생 후 6시간을 넘으면 IgG 흡수율이 급격히 저하되므로, 그때까지 자발적으로 초유를 마시지 못하는 송아지에 대해서는 카테터에 의한 강제 급여를 실시할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="98">•</span><span><i>그림 2-3-11 홀스타인우와 흑모화종우의 초유 중 IgG1 농도 비교. 홀스타인 초산우(n=20) 56.2±29.4 mg/mL, 홀스타인 경산우(n=35) 73.1±27.9 mg/mL, 흑모화종 경산우(n=14) 160.1±52.2 mg/mL (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="99">•</span><span><i>그림 2-3-12 송아지의 혈청 중 IgG 농도와 생존율. >10 mg/mL, <10 mg/mL, 일령(일) 0~60 (문헌 13에서 인용·개변)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="100">•</span><span><b>초유 급여량</b></span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>과거에 초유의 필요 급여량은 체중의 5%라고 말해져 왔다. 그러나 초유 중에 함유된 IgG 농도에는 개체차나 산차, 품종 등에 따라 큰 편차가 있기 때문에¹²⁾(그림 2-3-11), 이 급여량으로는 많은 경우 충분한 IgG를 섭취할 수 없다는 것이 밝혀졌다. 현재 홀스타인 송아지에서 권장되는 초유 급여량은 생후 6시간 이내에 3 L 이상, 생후 24시간 이내에 합계 6 L 이상이다. 大坂 등은 초유 급여까지의 시간과 그때 마신 초유의 양을 조사한 결과, 대부분의 소가 출생 후 6시간 이내에 3 L 이상의 초유를 섭취했다고 보고하고 있다²²⁾. 이 점에서 양질의 초유를 송아지가 자발적으로 마시는 경우에는 마시고 싶은 만큼 마시게 하는 것도 정답일 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수동면역 이행 부전(FPT)</div>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>앞서 말한 요건을 충족하지 못하는 경우, 송아지의 IgG 흡수량이 부족한 결과 혈중 IgG 농도의 저하를 초래한다. 생후 24~48시간의 혈중 IgG 농도가 10 mg/mL에 미치지 못하는 경우를 "수동면역 이행 부전(failure of passive transfer: FPT)"이라 부른다⁸⁾. FPT 송아지는 질병 이환율이 높고 생존율이 저하된다(그림 2-3-12)¹³⁾. 송아지의 혈중 IgG 농도를 10 mg/mL 이상으로 하기 위해서는 생후 6시간 이내에 최저 120 g의 IgG를 섭취할 필요가 있으며(그림 2-3-13)¹³⁾, IgG 흡수능에 개체차가 있는 것을 고려하면 최저 150 g의 IgG를 함유한 초유를 급여하는 것이 좋다. 이 양은 꼭 IgG 농도 50 mg/mL 이상인 초유 3 L에 해당한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>초유의 성분이나 급여법의 문제 이외에 송아지가 FPT에 빠지는 요인으로 난산에 의한 저산소혈증과 산증, 어미소의 사양관리 실패 등을 들 수 있다. 杉本 등은 분만 난이도를 점수화하여 각 점수군 간에 출생 5분 후의 혈액 pH 및 출생 24시간 후의 혈중 IgG 농도를 비교했다²³⁾. 그 결과 분만 난이도가 높을수록 혈액 pH와 혈중 IgG 농도가 낮았고, 나아가 출생 5분 후의 혈액 pH와 24시간 후의 혈중 IgG 농도 사이에 양의 상관이 보였다(그림 2-3-14). 이로부터 난산에 의한 태아의 저산소혈증과 산증에 의해, 포유 초기에 충분한 초유를 섭취하더라도 흡수 부전에 의한 FPT가 될 수 있다고 보고하고 있다. 또한 本田는 출생한 송아지가 모두 FPT였던 농장에서 초유 급여 상황과 어미소의 사양관리 상황을 조사한 결과, 초유 급여 시간 및 IgG 급여량에는 문제가 없었으나 사료 급여량 부족에 의한 어미소의 영양불량과 태반 기능 저하가 보였다고 보고하고 있다²⁴⁾. 나아가 피모의 코르티솔 농도가 현저히 높은 값을 보인 점에서, 열악한 환경과 사료 부족에 의한 만성적 스트레스가 출생 송아지의 IgG 흡수율을 저하시킬 가능성을 지적하고 있다. 이들 성적으로부터 FPT를 예방하기 위해서는 초유 관리와 동시에 출생 송아지에 대한 적절한 소생 처치 및 어미소의 적절한 사양관리가 필요하다고 생각된다. 출생 후 24시간 이상 경과한 FPT 송아지에 대한 IgG 보급에는 수혈이 유일한 방법이지만, 소 백혈병 바이러스와 같은 혈액을 매개로 하는 병원체의 전파 위험도 있어 신중을 요한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="104">•</span><span><i>그림 2-3-13 IgG 섭취량과 혈청 중 IgG 농도 및 초유 급여까지의 시간의 관계. 1시간 미만 y=0.0832x, 1시간 이상 6시간 미만 y=0.0804x, 6시간 이상 12시간 미만 y=0.0681x, 12시간 이상 18시간 미만 y=0.0450x (문헌 13에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="105">•</span><span><i>그림 2-3-14 송아지의 출생 5분 후 정맥혈 pH와 24시간 후 혈청 IgG 농도의 관계. y=50.40x-351.2, r=0.69 (문헌 22에서 인용·개변)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">면역글로불린(Ig) 보급 이외의 초유의 역할</div>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>초유 중에는 Ig 이외에도 송아지의 성장과 면역계 발달에 중요한 성분이 함유되어 있다. 예를 들어 백혈구 등의 세포 성분, 성장인자, 호르몬, 사이토카인, 비특이적 항균인자 등이다. 이들은 송아지의 소화관 내에서 분해되지 않고 일부는 장관에서 흡수되어 세포성 면역의 발달 등에 중요한 역할을 담당하고 있다²⁵⁾. 저온살균이나 동결 등에 의해 이들의 대부분은 파괴되어 버리므로, 면역학적 견지에서 보면 초유는 어미소에서 착유한 것을 그대로 급여하는 것이 이상적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>초유의 또 다른 역할로 신생 송아지에 영양을 공급한다는 점이 있다. 신생 송아지는 체지방 축적량이 극히 적어 특히 한랭 조건에서는 체온 유지를 위해 반나절~1일 정도면 에너지가 고갈된다. 초유는 상유(常乳)에 비해 4배의 단백질을 함유하고, 나아가 에너지원으로 가장 유효한 지방 함량도 약 2배 함유하는 등 에너지가 고갈되기 쉬운 신생 송아지에게는 귀중한 영양원이다<sup>15,26,27)</sup>^.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">초유 제제</div>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>고품질의 초유를 확보할 수 없는 경우나 어미소가 요네균이나 소 백혈병 바이러스 감염우인 경우, Ig 보급을 위해 소 초유로 제조한 시판 제제(초유 제제)를 단독 급여하거나 초유와 병용 급여한다. 시판 초유 제제는 함유 IgG량을 명기한 것이 많으며, 단독으로 줄 경우에는 초유와 마찬가지로 출생 후 6시간 이내에 IgG 150 g 상당의 제제를 여러 회로 나누어 급여하는 것이 바람직하다. 다만 초유 제제에 함유된 항체는 반드시 사용하는 농장의 병원체에 대응하는 것이 아니며, 나아가 세포 성분이나 생리활성물질도 거의 함유되어 있지 않으므로 보조적으로 사용해야 할 것이다<sup>12,13,27,28)</sup>^.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">신생 송아지의 평가와 소생</div>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>출생 직후 신생 송아지의 건강 상태를 평가하는 지표로 신생 송아지 Apgar 점수가 널리 이용되고 있다<sup>2,29)</sup>^. 이는 사람 신생아에 대한 평가법인 Apgar 점수를 石井 등이 신생 송아지용으로 개변한 것으로, 총 5항목을 각각 3단계로 평가한다(표 2-3-1). 출생 후 1분 및 5분에 판정하며, 10점 만점 중 6점 이하이면 즉시 소생 처치에 들어갈 필요가 있다. 소생 처치 중에는 5분마다 판정을 반복하여 점수가 높아지는 것을 확인할 때까지 계속한다. 출생 5분 후의 Apgar 점수와 송아지의 혈액 pH는 상관을 보이며²³⁾, 점수가 낮은 소는 산증에 빠져 있을 가능성이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>표 2-3-1 신생 송아지 Apgar 점수 채점표</span></p>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span><div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>징후</th><th>점수 1</th><th>점수 2</th><th>점수 3</th></tr><tr><th>심박</th><td style="text-align:left">없음</td><td style="text-align:left"><100회/분</td><td style="text-align:left">100회/분 ≤</td></tr><tr><th>호흡</th><td style="text-align:left">없음</td><td style="text-align:left">불규칙하고 얕음</td><td style="text-align:left">규칙적이고 깊음</td></tr><tr><th>잇몸색</th><td style="text-align:left">창백~암자색</td><td style="text-align:left">자색</td><td style="text-align:left">분홍색</td></tr><tr><th>근긴장</th><td style="text-align:left">횡와·침울</td><td style="text-align:left">복와·때때로 머리를 흔듦</td><td style="text-align:left">빈번히 머리를 흔듦</td></tr><tr><th>자극(서혜부)</th><td style="text-align:left">반사 없음</td><td style="text-align:left">둔하고 완만</td><td style="text-align:left">예민하고 신속</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span><span style="color:var(--ink-soft)">문헌 28에서 인용·개변</span></span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>소생 처치에는 기도 확보(Airway: A), 호흡 확립(Breathing: B), 순환 확립(Circulation: C), 소생약 사용(Drug: D)의 4가지가 있으며, 이들을 순서대로 실시한다²⁾. 먼저 기도 확보는 ① 소를 횡와 상태로 한다, ② 경부를 신장시킨다, ③ 비강에 막힌 양수를 수건 등으로 닦아낸다, ④ 양수를 오연했을 가능성이 있는 경우에는 머리를 낮게 유지한다, 는 방법으로 실시한다. 양쪽 뒷다리를 잡고 송아지를 매달아 올리는 방법도 구강이나 비강의 양수를 배출시키는 데는 유효하지만, 기도나 폐 심부의 양수 제거에는 무효이므로 가능한 한 짧은 시간에 그쳐야 한다. 나아가 호흡을 하지 않는 상태에서의 매달아 올리기는 호흡 억제를 조장하므로 해서는 안 된다. 기도가 확보되면 다음에 실시하는 것은 호흡 개시 자극이다. 예로부터 행해져 온 머리와 목에 냉수를 끼얹기, 콧구멍을 짚 등으로 자극하기 같은 행위는 언뜻 민간요법처럼 보이지만, 호흡 자극법으로서 과학적으로도 증명된 방법이며 손쉽게 할 수 있으므로 실천해야 한다. 다음으로 폐의 가동성을 높이기 위해 송아지의 자세를 횡와위에서 흉와위로 한다²⁹⁾. 이 상태에서 호흡을 시작하지 않는 경우나 이상 호흡을 보이는 경우에는 인공호흡을 실시한다. 인공호흡법으로는 ① 소를 우측 횡와 상태로 한다, ② 위가 되는 왼쪽 앞다리를 굴곡시킨 상태로 들어 올려 흉강을 확장시켜 공기를 흡인시킨다, ③ 들어 올린 앞다리를 되돌리고 체벽에 눌러 흉부를 가볍게 압박하여 공기를 배출시킨다, 는 동작을 반복하여 실시하는 것이 효과적이다²⁹⁾(그림 2-3-15).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="114">•</span><span><i>그림 2-3-15 인공호흡의 모습(이미지). 실선 화살표: 공기 흡인, 점선 화살표: 공기 배출</i></span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>기도 내 양수 제거와 인공호흡을 동시에 할 수 있는 기구로 송아지용 간이형 인공호흡기가 있다(그림 2-3-16). 이 기구는 통을 이중으로 한 구조로 되어 있어, 마스크를 흡기 쪽에 장착하여 송아지의 코와 입에 밀착시켜 양수를 제거한 뒤, 마스크를 송아지에 댄 채 통을 분리하여 반대 방향으로 장착해 공기를 불어넣는 조작을 반복한다. 다만 공기를 불어넣을 때는 인두 부분을 눌러 식도에서 위로 공기가 들어가지 않도록 한다. 安藤는 신생 송아지 가사로 진단된 송아지에 대해 이 기구로 소생 처치를 실시하고 그 후 동맥 혈액가스의 경시적 변화를 조사했다<sup>9,11)</sup>^. 그 결과 흡인 처치는 기도 내 양수 제거 및 고이산화탄소혈증의 개선에 유효하고, 송기 처치는 폐포 내에 강제적으로 공기를 보냄으로써 저산소혈증을 개선하는 데 유효하다는 것이 밝혀졌다. 다만 급격한 흡인은 미주신경 장애나 폐포 상피 손상을 일으킬 위험이 있어 오히려 호흡부전을 조장하는 경우가 있으므로, 인공호흡기 사용은 신중하게 할 필요가 있다. 나아가 마스크를 확실히 송아지에 대고 있어야 하므로 최소 2명이 조작하는 것이 기본이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>호흡이 확보된 뒤에는 심박수를 모니터링함으로써 전신 순환을 평가하는데, 심박수가 60회/분 이하이면 심장 마사지를 실시한다²⁾. 방법은 흉부 압박을 반복하지만, 통상 심기능 부전과 호흡부전은 동시에 발현하는 경우가 많으므로, 앞서 말한 인공호흡법에서 앞다리를 체벽에 누를 때 흉부를 강하게 압박함으로써 심장 마사지를 동시에 실시하는 것이 좋다.</span></p>
<p class="bx-num"><span class="bxn" data-n="117">•</span><span>이상의 방법으로 Apgar 점수의 개선이 보이지 않는 경우, 염산독사프람(doxapram hydrochloride, 호흡 흥분), 에피네프린(epinephrine, 심장 자극), 덱사메타손(dexamethasone, 폐의 수종과 염증 경감)의 투여를 실시한다<sup>2,11)</sup>^.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="118">•</span><span><i>그림 2-3-16 송아지용 간이형 인공호흡기</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="119">•</span><span><i>그림 2-3-17 리킹 행동 (日本全薬工業㈱ 제공)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제대 감염과 환경</div>
<p class="bx-num"><span class="bxn" data-n="120">•</span><span>자연분만에 의해 태아가 만출된 경우, 제대는 통상 천천히 이단되며, 제대를 구성하는 제동맥은 복강 내부의 방광 쪽으로 수축하고, 제정맥은 폐쇄되어 배꼽에 남으며, 요막관은 내제륜까지 퇴행한다. 또한 건강한 송아지의 제대는 통상 출생 후 약 1주일이면 건조·탈락하여 외부로부터의 감염을 막는다. 그러나 난산 혹은 너무 이른 태아 견인 등으로 제대의 이단이 정상적으로 이루어지지 않은 경우, 대량 출혈에 의한 빈혈이 보이거나, 본래 되돌아가야 할 혈관이 배꼽에서 노출되어 세균 감염의 원인이 되는 경우가 있다. 또한 정상적인 제대라도 출생 시나 출생 후에 오염된 환경에 송아지가 놓인 경우, 아직 건조되지 않은 제대에서 세균이 증식하여 그것이 원인이 되어 요막관·제동맥·제정맥에 상행성 감염을 일으키는 경우가 있다. 특히 FPT 송아지의 경우 배꼽 국소의 감염이 혈행성으로 전신에 파종되어 다발성 화농성 관절염 등을 속발할 위험이 높아진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>제대 감염을 막기 위해서는 청결한 분만실, 적정한 분만 개조, 지속적인 제대 소독, 적절한 초유 급여가 필요하다. 제대 소독에는 2% 포비돈요오드제 또는 0.5% 클로르헥시딘의 사용이 권장되며, 출생 직후 및 그 후 1일 2회 정도, 제대가 건조될 때까지 침지 소독한다. 출생 직후의 제대 내부에는 혈액이나 장액 같은 세균이 번식하기 쉬운 액체가 저류되어 있는 경우가 있으므로, 미리 제대 밑동을 청결한 손으로 훑어 배출시킨 뒤에 소독하면 좋다. 감염 예방을 위해 항균제를 국소 도포하는 것은 내성균 출현을 고려하면 극력 피해야 한다. 또한 제대 단면을 벌려 내부에 약제를 주입하는 것은 배꼽 구조에 자극을 주어 염증을 유발하므로 해서는 안 된다. 길게 남은 제대는 약 10 cm를 남기고 위생적으로 절단한다. 제동맥이나 제정맥의 단단이 배꼽에서 밖으로 늘어져 있는 경우, 짧게 절단하면 대량 출혈을 일으킬 수 있으므로 소독하고 결찰한 뒤 절단한다<sup>2</sup>,8,30-33)^.</span></p>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>어쨌든 제대염뿐 아니라 신생 송아지의 감염증을 막는 최대의 수단은 위생적인 환경을 제공하는 것과 송아지의 면역력을 높이는 것이며, 소독이나 예방적 치료는 어디까지나 보조적 처치라고 생각해야 할 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">신생 송아지의 격리와 환경</div>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>송아지는 출생 후 신속히 어미소에서 떼어 위생적인 환경에서 개별 사육하는 편이 병원체 노출을 받기 어렵다. 한편 근년 출생 후의 송아지를 어미소가 핥는 생리적 행위(리킹 행동, 그림 2-3-17)가 그 후 송아지의 건강에 중요한 역할을 가진다는 것이 밝혀져 왔다³⁴⁾. 大塚는 어미소와 함께 분만실에 두어 리킹시킨 군과, 출생 후 즉시 어미소에서 떼어 단독 사육한 군에서 출생 후 송아지의 혈청 γ-글루타밀트랜스펩티다제(GGT) 활성치 및 γ글로불린 농도의 추이를 비교한 결과, 모두 리킹군에서 유의하게 높았다고 보고하고 있다²⁵⁾. 나아가 혈액가스 분석에 의해 리킹군에서 동맥혈 산소분압이 높은 경향이 보였다고 한다. 이들 성적으로부터 리킹은 신생 송아지의 초유 흡수율을 높이고 호흡 기능의 개선 효과도 있다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>리킹의 또 하나의 중요한 역할은 송아지의 저체온을 막는 것이다. 출생 직후의 송아지는 양수로 젖어 있어 열을 빼앗기기 쉽고, 나아가 축적 에너지도 매우 적으므로 특히 겨울철에는 저체온이 되기 쉽다. 리킹에 의한 신속한 피모 건조는 그것을 막기 위해 이상적이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>그 밖에도 리킹에는 송아지의 배변이나 배뇨를 촉진하는 효과가 있으며, 나아가 타액 부착이 세균 증식 억제에 관여한다는 보고도 있으므로, 분만 후 최소 1~2시간 정도는 어미소와 송아지를 동거시키고 충분한 리킹이 이루어진 뒤에 송아지를 단방으로 옮겨 초유를 섭취시키는 것이 바람직하다. 그러나 불결한 분만실 혹은 건유 후기군 내에서 분만해 버린 경우에는 감염 위험을 중시하여 신속히 어미소에서 송아지를 떼어야 하며, 리킹을 할 수 없었던 부분은 송아지의 몸을 수건 등으로 닦아 마사지하는 등 사람 손으로 보완하는 것이 바람직하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>리킹이 불충분했던 경우, 피모가 완전히 건조되지 않아 저체온이 된 결과 포유욕이 발현되지 않게 된다. 이를 막기 위해서는 가능한 한 빨리 송아지를 말릴 필요가 있다. 송아지의 몸을 신속히 건조시키는 장치로 최근에는 카프워머가 보급되고 있다(그림 2-3-18). 이는 출생 직후의 송아지를 격리 해치에 수용하고 온풍을 쏘여 몸을 데우는 장치로, 특히 한랭지인 홋카이도에서 보급률이 높으며 신생 송아지의 손모 방지에 상당한 효과를 올리고 있다. 이 장치의 주의점은 너무 장시간 송아지를 넣어 두면 더위와 건조 때문에 탈수 증상이 될 위험이 있다는 것으로, 송아지가 마르고 포유욕이 발현된 단계에서 꺼내야 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="127">•</span><span><i>그림 2-3-18 카프워머의 한 예 (FRP우치야마 제품, 酪農総合研究所 제공)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>생후 1주일 이내의 송아지는 아직 감염이나 한랭 자극에 약하므로 펜 또는 카프해치에서 개별 사육하는 것이 바람직하며, 그 시설은 어미소에서 떨어져 있고, 청결하고 건조하며, 외풍이 들이치지 않고, 환기가 좋다는 조건을 충족하는 것이 바람직하다. 펜이나 해치는 송아지를 넣기 전에 충분히 소독하고 건조시킨 뒤 사용한다. 깔짚은 건조한 밀짚 등을 충분량(관리자가 무릎을 꿇어도 젖지 않을 정도) 넣고 자주 교체한다. 송아지에 외풍이 닿으면 열을 빼앗겨 에너지를 손실하므로, 바닥 위 1 m 정도까지는 외풍이 들어오지 않도록 한다. 우사 내에 카프해치나 펜을 설치할 경우, 환기를 충분히 하여 암모니아 가스에 의한 호흡기병을 예방하는 것이 중요하다<sup>5,16,26,27)</sup>^.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">신생 송아지에 대한 사료 급여</div>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>초유를 준 뒤의 신생 송아지(출생 후 24시간~1주령)에 대해서는 일반적으로 이행유, 상유 또는 대용유(분유)가 급여된다. 이행유란 초유를 짠 뒤 출하할 수 있을 때까지의 약 5일간의 모유를 가리키며, Ig를 소량 함유하므로 국소 면역을 보강하는 효과를 기대할 수 있어 2~3일령까지의 송아지에게 주는 것이 권장된다. 그러나 그 품질에 대해서는 주의할 필요가 있으며, 특히 유방염 이환우의 이행유를 송아지가 섭취한 경우 치사적인 장염을 발증할 우려가 있으므로 절대로 급여해서는 안 된다. 또한 항균제가 잔류한 유즙이나 고도의 혈유 등도 급여를 삼가야 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>대용유는 이행유나 상유만큼의 품질 관리가 불필요하고 성분도 균일하여 사용하기 쉽지만, 그중에는 제4위 내에서의 커드 형성이 나쁜 것이 있어, 이를 출생 후 1주일 이내의 송아지에게 주었을 경우 소화불량성 설사를 발증하는 경우가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>포유기 송아지의 제4위에서 분비되는 단백질 분해효소의 주체는 레닌(rennin)이다. 레닌은 위산과 함께 유단백질 중의 카제인을 응고시킴으로써 커드를 형성하여 천천히 소화 분해를 이룬다. 그러나 시판 대용유에는 카제인 함량이 낮고 유청(whey) 함량이 높은 것이 있어, 커드 형성이 방해된 결과 장관에 대량의 단백질과 지방이 유입되어 소화효소 분비능이 아직 낮은 신생 송아지에서는 소화불량성 설사가 되기 쉽다³⁵⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>현재 권장되는 포유량은 성분에 따라 다르지만 일반적으로 홀스타인 송아지의 2~3일령에서 4~6 L/일, 4~7일령에서 체중의 15%(약 6 L/일)이다. 또한 그 밖에 2일령부터 인공유(스타터)를 급여한다. 스타터 급여는 제1위의 발달을 촉진하고 융모로부터의 휘발성 지방산(VFA) 흡수능을 높이므로, 출생 후 조기부터 급여함으로써 조기 이유가 가능해진다. 2일령의 송아지는 아직 자발적으로 스타터를 섭취하지 않지만, 포유 후 소량을 손으로 송아지의 입에 밀어 넣는 행위를 2~3일 반복하면 스타터를 자발적으로 섭취하는 시기를 앞당길 수 있다. 처음에는 50 g/일부터 시작하여 다 먹으면 100 g씩 늘리되, 21일령까지는 300 g/일을 상한으로 한다. 또한 스타터가 제1위 내에서 발효하기 위해서는 동시에 제1위 내에 물이 필요하므로, 신선한 물을 2일령부터 자유 채식시킨다²⁸⁾. 그 밖에 부드럽고 양질인 건초를 2일령부터 50 g/일을 상한으로 섭취시키는 것은 스타터 과잉 섭취에 따른 루멘 파라케라토시스(rumen parakeratosis) 예방에 유효하다²²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span><span style="color:var(--ink-soft)">(저자: 髙橋英二)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span><span style="color:var(--ink-soft)">일본송아지 2-3 출생 시 관리와 환경.</span></span></p>
</div>
<div class="bx"><div class="bx-title">3-1 송아지의 포유와 영양</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="135">•</span><span>■ 유용우</span></p>
<div class="bx-sub"><div class="bx-subtitle">송아지의 사양 환경</div>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>포유·육성기의 질병과 폐사는 3개월령 이하에 집중한다. 선천 이상·허약 송아지도 원인이지만 출생 직후부터의 부적절한 사양관리가 큰 요인이다. 출생~포유기 송아지는 질병 이환율이 높고 한랭 감작에 극히 약하므로, ① 병원 미생물로부터 격리, ② 송아지 체열 손실 방지를 기본으로 청결·건조·외풍 없는 환경이 대전제가 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기의 사료: 액상 사료</div>
<p class="bx-num"><span class="bxn" data-n="137">•</span><span>일본 낙농 사정상 전유가 남는 상황이 아니므로 대부분 농장이 대용유(분유)를 사용한다. 전유와 대용유, 그리고 대용유 간에도 차이가 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="138">•</span><span><b>전유와 대용유의 차이점</b></span></p>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>대용유는 버터·치즈 제조 부산물이 주원료이므로 주 에너지원인 지방은 별도로 첨가해야 하고, 단백질 중 카제인도 적다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>일본은 BSE 예방을 위해 동물 유래 원료를 엄격히 제한한다. 단백질원은 포유동물의 유·유제품과 가금 난·난제품, 지방원은 특정 동물성 유지(식용 지방만 원료, 불용성 불순물 0.02% 이하), 회수 식용유(동 0.02% 이하), 어유로 한정된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>단백질 원료는 탈지분유(버터 부산물), 유청 분말(치즈 부산물), 단백질 농축 유청 분말(유청에서 유당·미네랄 제거 후 농축 건조)의 3종이 주체이며 거의 모든 대용유가 이를 혼합해 만든다. 유청 단백질은 카제인과 유사한 아미노산 조성으로 양질이지만, 카제인은 탈지분유에만 있어 대용유는 전유만큼 레넷 커드를 형성하지 못한다. 제4위에서 커드 이외의 액상 부분 영양분이 많아져 설사 유발 우려가 있으므로 1회 포유량이 제한된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>지방 원료로 회수 식용유·어유는 실제로 쓰이지 않는다. 유지방과 지방산 조성(중쇄 포화지방산 비율)이 비슷한 라드 사용 제품이 일부 있으나 대부분 저렴한 식물성 유지를 쓴다. 옥수수유·채종유는 불포화지방산 비율이 높지만 팜유·코코넛유와 섞으면 유지방에 가까워지고(표 3-1-1) 라드와 동등한 증체 효과가 있어¹⁾ 혼합 사용이 많다.</span></p>
<p class="bx-num"><span class="bxn" data-n="143">•</span><span>대용유는 전유보다 지방 함량이 낮아 TDN%는 7~17포인트, ME는 0.26~0.67 Mcal/kg DM 정도 낮다(표 3-1-2). 전유와 동등한 에너지를 주려면 농도나 양을 조정해야 한다.</span></p>
