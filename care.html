async function initAuth(){
  if(typeof firebase==='undefined') return;
  try {
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const auth=firebase.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    let resolveInitial;
    const initial=new Promise(resolve=>{resolveInitial=resolve;});
    auth.onAuthStateChanged(user=>{
      _isOwner=!!(user && !user.isAnonymous && user.email===OWNER_EMAIL);
      if(!isAdmin()) {VETEDITS={};_vetLoaded=false;}
      if(window.__appReady) render();
      resolveInitial();
      if(authReady) vetEditsEnsure();
    });
    await initial;
    if(!auth.currentUser) await auth.signInAnonymously();
    authReady=true;
    await vetEditsEnsure();
  } catch(e) { console.warn('수의학 온라인 연결 실패',e); toast('기본 자료를 표시합니다. 온라인 편집 내용은 연결 후 불러올 수 있어요.'); }
}
async function openAdminLogin(){
  if(typeof firebase==='undefined' || !firebase.apps.length){toast('로그인 연결을 확인한 후 다시 시도해주세요.');return;}
  try {
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const result=await firebase.auth().signInWithPopup(provider);
    if(result.user.email!==OWNER_EMAIL){await firebase.auth().signOut();await firebase.auth().signInAnonymously();toast('이 계정은 수정 권한이 없어요.');return;}
    _vetLoaded=false;
    await vetEditsEnsure();
    toast('수의학 자료를 편집할 수 있어요.');
  } catch(e){ if(e.code!=='auth/popup-closed-by-user')toast('로그인하지 못했어요. 연결과 로그인 설정을 확인해주세요.'); }
}

function esc(str){

function toast(msg){

}

<div class="bx"><div class="bx-title">1-1 품종</div>
<p class="bx-num"><span class="bxn" data-n="7">•</span><span>가축소는 포유강 우제목 소과에 속하는 대형 반추동물 가축이다. 가축소의 조상은 "오록스(aurochs: <i>Bos primigenius</i>)" 또는 "원우"라 불리는 야생소이며, 메소포타미아 문명과 인더스 문명이 발상한 지역에서 1만 1,000년~8,000년 전에 가축화된 소를 "가축소"라 부른다. 가축화 이후 인류의 이동에 따라 가축소는 전 세계로 퍼져 나갔다. 2017년 국제연합식량농업기구(Food and Agriculture Organization of the United Nations: FAO) 통계에 따르면 세계에는 14억 9,000만 두의 가축소가 사육되고 있다. 대형 가축 중에서는 사육두수가 가장 많은 동물이며, 식육, 착유, 피혁, 역용, 분뇨의 퇴비 이용을 비롯하여 다양한 지역에서 그 목적과 기후에 따른 사육·이용이 이루어지고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="8">•</span><span>소의 조상인 오록스는 홍적세 말기(1만 수천 년 전)에는 북아프리카와 유라시아 대륙 대부분에 널리 서식했으나 약 400년 전에 절멸했다. 현재 세계에서 사육되는 가축소의 계통은 크게 북방계 소(<i>Bos taurus</i>, 타우린)와 인도계 소(<i>Bos indicus</i>, 제부)로 분류할 수 있다. 한편 가축소의 근연종으로는 야생종이 현존하며, 야크(<i>Bos mutus</i>), 가우르(<i>Bos gaurus</i>), 반텡(<i>Bos javanicus</i>) 등이 소속(Bos)에 속한다. 이들 야생 근연종은 가축소와 교잡이 가능하다¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="9">•</span><span>가축소의 품종 분화는 북방계 소와 인도계 소 각각에서 진행되어 왔으나, 특히 북방계 소에서는 유럽을 중심으로 육종개량이 이루어져 왔다. 그 이용 목적에 따라 육전용 품종, 유전용 품종, 유육겸용 품종 등이 품종으로 확립되어 왔다. 일반적으로 품종이란 모색, 뿔의 유무, 체형 등의 형태나 생태, 능력이 다른 품종과 구별되는 유전적 특징을 가진 집단으로 정의할 수 있다. 그러나 엄밀히 말하면 품종의 정의에는 생물학적 의미가 없으며, 육종가나 육종협회의 판단에 근거하는 경우가 많다²⁾. 소 품종의 대표적인 것으로는 유전용 품종에서는 홀스타인 프리지안, 저지 등, 육전용 품종에서는 애버딘 앵거스, 헤리퍼드, 샤롤레, 흑모화종 등, 유육겸용 품종으로는 브라운 스위스 등이 있다. 현재 일본의 품종별 사육두수를 표 1-1-1에 나타냈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>한편, 지금까지 가축 품종명에는 "홀스타인종", "랜드레이스종"과 같이 "종"을 덧붙이는 경우가 산견되었다. 그러나 재래가축연구회에서는 과거에 이 점에 대해 논의하여 품종에는 "종"을 덧붙이지 않기로 하였다. 그 이유는 "종"은 본래 "생물종"에 사용되어야 하는 것이고, 과거의 예에서는 동일 품종의 계통에 "흑색종"이나 "적조종(赤笹種)" 등 독자에게 "종"에 대한 혼란을 초래한다고 판단했기 때문이다. 이에 따라 본서에서도 품종에는 "종"을 덧붙이지 않기로 한다. 다만 흑모화종과 같이 "종"을 포함하여 하나의 명사가 되는 것은 예외로 한다. 또한 근년에는 많은 서적에서도 품종명에 "종"을 생략하는 경향이 있다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">유용 품종</div>
<p class="bx-num"><span class="bxn" data-n="11">•</span><span>일본에서는 홀스타인, 저지, 브라운 스위스, 건지, 에어셔의 5품종이 유용 품종으로 이용되고 있으나, 두수로는 99% 이상이 홀스타인이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">홀스타인 프리지안</div>
<p class="bx-num"><span class="bxn" data-n="12">•</span><span>라인강 하류의 네덜란드 북부에서 독일 서북부에 걸쳐 사육되던 재래소에서 유래하며, 네덜란드의 프리슬란트에서 품종이 확립되었기 때문에 "프리지안"이라고도 불린다. 이 품종은 기원전 300년경 이주민과 함께 들어온, 가장 역사가 오래된 품종 중 하나이다. 미국에서는 19세기 중엽에 이 품종을 수입했는데, 수출지가 독일의 홀스타인 지방이었기 때문에 "홀스타인"이라는 이름이 사용되었다. 일본에서는 북아메리카 대륙에서 유용 품종으로 개량이 진행된 것이 수입되었기 때문에 "홀스타인"이라는 호칭이 일반적이다. 19세기 후반에 "홀스타인 프리지안"으로 통일되었으나, 많은 나라에서는 "국명+홀스타인"의 이름이 많이 사용되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="13">•</span><span>유럽에서는 각국에서 유육겸용 품종으로 개량되었으나, 북아메리카에서는 유전용 품종으로 개량되어 온 경위가 있으며, 일본에서도 북아메리카형 유전용 품종이 기초가 되어 있다. 네덜란드에서는 체격과 육질 향상을 도모할 목적으로 한때 쇼트혼이 도입된 경위가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="14">•</span><span>표 1-1-1 일본의 주요 가축소 품종별 사육두수(2019년 1월 현재).<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>구분</th><th>품종</th><th>두수</th></tr><tr><th>유용 품종¹⁾</th><td style="text-align:left">홀스타인</td><td style="text-align:left">162만 6,000</td></tr><tr><th></th><td style="text-align:left">저지</td><td style="text-align:left">1만 3,000</td></tr><tr><th>육용 품종²⁾</th><td style="text-align:left">흑모화종</td><td style="text-align:left">164만</td></tr><tr><th></th><td style="text-align:left">갈모화종</td><td style="text-align:left">2만 2,000</td></tr><tr><th></th><td style="text-align:left">일본단각종</td><td style="text-align:left">8,000</td></tr><tr><th></th><td style="text-align:left">무각화종</td><td style="text-align:left">200</td></tr><tr><th></th><td style="text-align:left">교잡종³⁾</td><td style="text-align:left">50만 5,000</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="15">•</span><span>(독)가축개량센터 소 개체식별 전국 데이터베이스로부터 작성</span></p>
<p class="bx-num"><span class="bxn" data-n="16">•</span><span><span style="color:var(--ink-soft)">1) 기타로 브라운 스위스, 건지 등이 소수 존재한다.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="17">•</span><span><span style="color:var(--ink-soft)">2) 기타로 애버딘 앵거스, 헤리퍼드 등이 소수 존재한다.</span></span></p>
<p class="bx-num"><span class="bxn" data-n="18">•</span><span><span style="color:var(--ink-soft)">3) 대부분은 홀스타인×흑모화종의 교잡이다.</span></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="19">•</span><span><i>그림 1-1-1 홀스타인</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="20">•</span><span><i>그림 1-1-2 저지</i></span></p>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>이 품종의 모색은 대부분 흑백반이지만, 쇼트혼 도입의 잔재로 적백반도 드물게 인정된다. 체격·체형은 이 품종의 긴 역사와 광범위한 분포역으로 인해 국가·지역 간 변이가 크지만, 성축 암컷의 체고는 141 cm, 체중은 650 kg 정도이다(그림 1-1-1). 대형이며, "쐐기형"이라 불리는 전구가 가늘고 후구가 발달한 형상을 보인다. 송아지의 출생 시 체중은 암컷 42~43 kg, 수컷 46 kg 정도이다. 연간 유량은 6,000~1만 kg이지만 이를 넘는 것도 드물지 않으며, 세계 기록은 3만 kg을 넘는다. 우유는 음용에 적합하고, 유지방률은 3.5~4.0% 정도, 무지고형분은 8.7% 정도이다. 일본의 사육두수는 약 162만 두이며, 그중 약 100만 두가 홋카이도에서 사육되고, 다음으로 도치기현, 이와테현, 군마현, 지바현, 구마모토현이 4~5만 두 전후로 많다(2019년 현재).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">저지</div>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>원산지는 영국 해협 제도의 저지섬이다. 이 섬은 12세기까지 프랑스령이었으며, 프랑스 브르타뉴 지방의 브르통이 기초가 되어 노르망디와의 교잡으로 품종이 확립되었다. 18세기 후반부터 품종 고정이 계획되었고, 섬 외부로부터의 종우 도입이 금지되어 순수 번식이 계속되었기 때문에 유전적 제일성이 높다.</span></p>
<p class="bx-num"><span class="bxn" data-n="23">•</span><span>모색은 담갈색에서 농갈색의 단색이며, 비경이 검고, 입과 눈 주위를 단색의 털이 둘러싸 "풀칠한 입(糊口)"이라 불리는 특징을 보인다(그림 1-1-2). 성축 암컷의 체고는 130 cm, 체중은 400 kg 정도인 소형 유전용 품종이다. 송아지의 출생 시 체중은 24 kg 정도이다. 연간 유량은 3,500~7,000 kg이지만, 근년 개량이 진행되어 유량은 증가 경향에 있다. 유지방률은 5% 정도, 무지고형분은 9% 정도이며, 지방구가 커서 버터 제조 효율이 좋고, 카로틴 함량이 많기 때문에 버터의 황색이 아름답다. 육질은 섬유가 가늘고 맛·풍미는 좋으나 산육량이 부족하고 체지방의 황색미가 강하기 때문에 육용으로는 부적당하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="24">•</span><span>일본에서는 오카야마현과 구마모토현을 중심으로 1만 두 남짓이 사육되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">브라운 스위스</div>
<p class="bx-num"><span class="bxn" data-n="25">•</span><span>원산지는 스위스 북동부의 산악지대이며, 이 지역에서는 "스위스 브라운"이라 불린다. 9세기경부터 역육겸용으로 사육되었으나, 19세기에 들어 비유 형질에 대한 개량이 시도되어 역유육겸용으로 이용되었다. 19세기 후반에 미국으로 수출되어 유전용 품종으로서의 개량이 진행되었고, "브라운 스위스"라 불리게 되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="26">•</span><span>일본에는 1901년 고이와이 목장에 처음 도입되었고, 그 후 효고현과 돗토리현 등의 재래소 개량에 공헌했다. 방목 적성과 조사료 이용성이 우수하기 때문에 현재는 치즈 가공 등에 적성이 높은 특징을 가진 브라운 스위스를 도입하는 기회가 늘고 있다. 오이타현과 홋카이도를 비롯하여(500두 이상) 돗토리현, 군마현, 히로시마현 등(100두 미만)에서 1,000두 남짓이 사육되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="27">•</span><span>모색은 회갈색의 단색이지만, 은회색에서 흑갈색까지 폭이 있다. 체격·체형은 국가나 지역에 따른 변이가 크지만, 근년 미국에서 유전적 개량이 진행되어 성축 암컷의 체고는 132 cm 정도, 체중은 600 kg 정도이다. 연간 유량은 7,000~8,000 kg으로 홀스타인과 비교하여 약 2,000 kg 적으나, 유성분율, 특히 유단백질률이 약 3.5% 이상으로 높고 유단백질 조성이 좋아 치즈 생산용 원유에 적합하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">기타 유용 품종</div>
<p class="bx-num"><span class="bxn" data-n="28">•</span><span>건지는 영국 해협 제도에 있는 건지섬이 원산으로, 프랑스를 원산으로 하는 브르통과 노르망디의 교잡으로 확립된 품종이지만, 노르망디의 유전적 영향이 강하다고 한다. 모색은 갈색에서 담갈색에 백색반을 가진다. 성축 암컷의 체고는 130 cm 정도, 체중은 450 kg 정도이다. 연간 유량은 5,000 kg 정도이고, 유지방률은 4.6~4.9%로 높으며, 지방구가 커서 버터 제조에 적합하다. 국내에서는 희소하며, 도치기현, 오이타현, 니가타현에서 200~300두가 사육되고 있을 뿐이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="29">•</span><span>에어셔는 영국 스코틀랜드 남서부의 에어주가 원산이다. 재래종을 기초로 몇몇 품종이 교배되어 성립한 품종으로 생각된다. 모색은 적색 또는 갈색에 백반을 가진다. 체격은 중형으로, 성축 암컷의 체고는 130 cm 정도, 체중은 500~550 kg 정도이다. 연간 유량은 4,000~4,500 kg 정도이고, 유지방률은 평균 3.9%이며, 지방구가 작아 유유아나 환자용 음용에 적합하다. 국내에서는 수십 두가 있을 뿐이다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="30">•</span><span>■ 육용 품종</span></p>
<div class="bx-sub"><div class="bx-subtitle">화우</div>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>일본 재래소의 조상은 야요이 시대 초기 이후 한반도로부터 벼농사 기술과 함께 일본에 건너온 것으로 생각된다. 그 이래 일본에서 재래소는 농경용으로 사용되었다. 특히 산간지에 적합하도록 좁은 길에서 회전 동작이 뛰어난 소가 선호되어 농경, 수송, 퇴비 만들기 등에 이용되어 왔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>가마쿠라 시대에 가와토 보쿠도 야스나오마로(河東牧童寧直麿)가 그린 『국우십도(国牛十図)(1310년)』에는 다지마우(但馬牛), 단바우(丹波牛), 아와지우(淡路牛), 가와치우(河内牛), 야마토우(大和牛), 쓰쿠시우(筑紫牛), 미쿠리야우(御厨牛), 도토미우(遠江牛), 에치젠우(越前牛), 에치고우(越後牛)의 특징이 잘 그려져 있다. 메이지 이전의 화우는 지방 산업의 수요에 따른 개량이 이루어졌으며, 주고쿠 산지의 제철 지대에서 사육된 재래소는 신탄 제철용 목재 운반에 적합한, 큰 몸집에 근육질의 후구가 발달한 소가 되었다. 게이한신 지방의 우차에 쓰인 다지마우는 전구가 발달한 지속력 있는 소가 선호되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>메이지 시대에 들어 대도시를 중심으로 쇠고기 수요가 증대한 것을 받아 주고쿠 지방을 중심으로 각 현에서 외국 품종을 교잡한 개량 노력이 이루어졌다. 그러나 그 결과 이들 교잡우는 체격, 발육, 비유능력 등이 향상된 반면 역용 능력이나 육질 등이 저하되었기 때문에 이 잡종열은 식어, 다시 재래소의 장점을 살린 순수종이 권장되게 되었다. 따라서 현재의 화우가 가진 외국 품종의 유전적 영향은 화우 품종이나 지역에 따라 다양하다고 생각된다. 근년의 DNA 해석 등으로부터는 흑모화종과 고치계 갈모화종이 비교적 외국 품종의 영향이 적다는 것이 인정되었고, 일본단각종과 무각화종은 외국 품종의 영향이 크다는 것이 제시되었다³⁾. 그 후 개량화종이라는 이름 아래 개량이 진행되어 1944년에 흑모화종, 갈모화종, 무각화종의 3품종이, 1957년에는 일본단각종이 고정종으로 인정되어 일본의 화우는 4품종으로 정해졌다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">흑모화종</div>
<p class="bx-num"><span class="bxn" data-n="34">•</span><span>지방교잡을 중심으로 한 고품질의 육질을 생산하는, 일본이 세계에 자랑하는 육용 품종이다. 메이지 시대에 현마다 다른 외국 품종과의 교잡 배경을 가진 것과 각 현마다 품종 고정을 목표로 한 역사가 있기 때문에, 현재에도 체격이나 육질에 특징을 가진 계통이 유지되고 있다. 1944년 화우 품종으로 인정된 이래 1948년에 발족한 전국화우등록협회에 의해 일원적으로 등록이 이루어지고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="35">•</span><span>모색은 흑갈 단색이며, 몸 아랫부분과 다리 안쪽은 담색을 보인다(그림 1-1-3). 송아지 때에는 갈색에서 농갈색을 보이지만 성장에 따라 흑색에 가까워진다. 성질은 온순하여 관리가 쉽다. 특징적인 형질은 일반적으로 "시모후리(霜降り)"라 불리는 근육 내 지방교잡이며, 대리석 무늬를 띠는 쇠고기를 생산한다. 특히 1990년대 전반부터 쇠고기 수입 자유화에 대응하기 위해 종웅 모델·애니멀 모델 BLUP법에 의한 육종가 평가 도입으로 지방교잡을 대표로 하는 지육 형질이 크게 개량되기에 이르렀다. 과거에는 주고쿠 지방</span></p>
<p class="bx-num"><span class="bxn" data-n="36">•</span><span>이 주산지였으나, 현재는 홋카이도에서 오키나와현까지 전국에서 사육되고 있으며, 특히 가고시마현, 미야자키현, 홋카이도에서 사육두수가 많다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="37">•</span><span><i>그림 1-1-3 흑모화종</i></span></p>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>표준 발육치는 성축 수컷에서 체고 147 cm, 체중 718 kg, 성축 암컷에서 130 cm, 체중 454 kg이며, 송아지의 출생 시 체중은 수컷이 30 kg 정도, 암컷이 27 kg 정도이다. 일반 출하된 거세우의 지육 형질 평균은 지육중량 500 kg, 지육 보류율(枝肉歩留)<sup>주1)</sup> 74.5%, 지방교잡 평점(BMS) 7.2로 되어 있어[(공사)일본식육등급협회, 2017], 해마다 개량이 진행되고 있음이 제시되며, 육질이 좋음을 알 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="39">•</span><span>※ 주1) 지육 보류율: 전체 중에서 식용으로 할 수 있는 비율(지육중량/생체중).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">갈모화종</div>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>갈모화종은 구마모토계와 고치계의 2계통이 각각의 현 내에서 사육되고 있다. 이들은 양현에서 사육되던 재래 조선우를 기초로 하여 메이지 이후에 심멘탈이나 조선우를 교배하여 개량한 품종이다. 구마모토계는 심멘탈, 고치계는 조선우를 주로 교배·개량이 진행된 경위가 있어, 이 2계통에는 형태적 특징이 다른 점이 많이 보인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="41">•</span><span>모색은 황갈색에서 적갈색이며, 양 계통에는 차이가 있다. 체격은 구마모토계에서는 성축 수컷의 체고가 153 cm, 체중이 1,000 kg, 성축 암컷의 체고가 134 cm, 체중이 600 kg 정도이고, 고치계에서는 성축 수컷의 체고가 141 cm, 체중이 850 kg, 성축 암컷의 체고가 125 cm, 체중이 480 kg 정도로, 구마모토계 쪽이 몸집이 크다.</span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>산육능력은 20~25개월령에 지육중량 400~500 kg, 지육 보류율 62~65%로, 흑모화종에 이어 육질이 좋다. 또한 조사료 이용성이 높고, 특히 구마모토계는 방목에도 적합하다. 구마모토현과 고치현을 중심으로 홋카이도에서도 사육되고 있으며, 합계 약 2만 두가 사육되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">일본단각종</div>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>도호쿠 지방 북부에서는 예로부터 "난부우(南部牛)"라 불리는 재래소가 사육되고 있었다. 메이지 시대 초기, 이 난부우에 미국에서 수입된 쇼트혼과 데어리 쇼트혼을 교잡하여 개량되었고, 그 후 육용종으로 개량이 진행되어 품종이 확립되었다.</span></p>
<p class="bx-num"><span class="bxn" data-n="44">•</span><span>모색은 농적갈색으로 농담의 폭이 있다. 체격은 화우 중에서도 대형으로, 성축 수컷에서 체고 140~150 cm, 체중 880~1,100 kg, 성축 암컷에서 126~135 cm, 체중 480~680 kg이며, 송아지의 출생 시 체중은 수컷이 36 kg 정도이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="45">•</span><span>산육능력은 거세우 24개월령에 지육중량 420 kg, 지육 보류율 72.5%로, 적육이며 지방이 적다. 이 품종의 최대 특징은 조사료 이용효율이 높고, 조방한 방목에 적응하는 능력이 높다는 점에 있다. 이와테현을 중심으로 한 도호쿠 지방과 홋카이도에서 약 8,000두가 사육되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">무각화종</div>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>야마구치현 아부군에서 사육되던 재래소에 애버딘 앵거스를 교잡하여 개량해 성립한 소형 육용종이다. 모색은 흑색이며, 앵거스의 영향을 받아 흑모화종보다 흑색이 강하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>체격은 성축 수컷에서 체고 137 cm, 체중 880 kg, 성축 암컷에서 122 cm, 체중 450 kg 정도이다. 현재는 야마구치현에서 200두 미만의 개체수밖에 사육되지 않고 있어, 품종 보존과 새로운 생산유통 시스템을 구축하기 위한 품종 재생의 길이 모색되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">외국 품종</div>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>일본에서 외국 육용 품종의 이용은 감소하는 경향에 있으며, 사육·유지두수 파악도 해마다 어려워지고 있다. 현재 등록되어 있는 외국 품종은 애버딘 앵거스뿐이며, 그 두수도 50두 정도에 지나지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">애버딘 앵거스</div>
<p class="bx-num"><span class="bxn" data-n="49">•</span><span>육용 3대 브리티시 품종 중 하나이다. 영국 북스코틀랜드의 무각 재래소가 개량되어 애버딘주와 앵거스주의 2계통이 통일되어 성립한 육용 품종이다. 모색은 흑색이고 무각인 것이 특징이다. 갈색 개체도 존재하지만, 레드 앵거스라는 별도 품종으로 미국 등에서 사육되고 있다. 체격은 성축 수컷에서 체고 145 cm, 체중 1,000 kg 정도, 성축 암컷에서 135 cm, 체중 650~700 kg 정도이며, 송아지의 출생 시 체중은 수컷이 33 kg 정도이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">헤리퍼드</div>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>육용 3대 브리티시 품종 중 하나이다. 원산지는 영국의 헤리퍼드주이며, 영국에서는 가장 오래된 육용우이다. 모색은 적갈색이고, 몸 아랫부분과 안면의 우성 백반이 특징이다. 체격은 성축 수컷에서 체고 152 cm, 체중 1,100 kg 정도, 성축 암컷에서 140 cm, 체중 700~800 kg 정도이며, 송아지의 출생 시 체중은 수컷이 35 kg 정도이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">샤롤레</div>
<p class="bx-num"><span class="bxn" data-n="51">•</span><span>프랑스 중부 느베르 고원 샤롤레 지방에서 사육되던 재래소를 개량한 유육역 3용 품종이었으나, 근대에 들어 산육능력을 중심으로 한 개량이 진행되어 육용 품종이 되었다. 모색은 백색에서 담황색이다. 대형이고 근육질의 체격을 보이며, 성축 수컷에서 체고 150 cm, 체중 1,100~1,400 kg 정도, 성축 암컷에서 135~140 cm, 체중 700~800 kg 정도이다. 송아지의 출생 시 체중은 수컷이 44 kg 정도로 크며, 난산 발생률이 비교적 높다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">기타</div>
<p class="bx-num"><span class="bxn" data-n="52">•</span><span>기타 외국 육용 품종으로는 프랑스 품종인 리무쟁, 오스트레일리아 품종인 머레이 그레이, 영국 품종인 쇼트혼이 도입·사육되어 온 경위가 있으나, 어느 품종도 일본에서는 두수가 감소하고 있으며, 그 두수 파악은 해마다 곤란해지고 있다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="53">•</span><span>■ 교배</span></p>
<div class="bx-sub"><div class="bx-subtitle">교배 양식의 기본적 분류</div>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>가축에 국한되지 않고 포유류는 수컷과 암컷의 교배에 의해 자손을 만든다. 가축의 경우는 인간이 그 교배에 관여하고 있으며, 그 교배 방법을 "교배 양식"이라 한다. 이 교배 양식은 크게 임의교배(무작위교배)와 비임의교배(작위교배)로 분류된다. 임의교배는 가축 집단에서 무작위로 추출된 암수 간의 교배이며, 집단의 유전적 다양성이 유지되는 랜덤한 교배라 할 수 있다. 비임의교배는 일정한 방침에 따라 선발한 암수를 교배시키는 방법이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>비임의교배는 표현형의 유사성에 의한 교배와 혈연관계의 상사성에 의한 교배로 분류할 수 있다. 표현형의 유사성에 의한 교배에는 표현형이 비슷한 것, 예를 들어 체격이 큰 것끼리 교배하는 유사교배와, 표현형이 비슷하지 않은 암수를 교배하는 비유사교배가 있으며, 이는 집단의 제일성을 높이는 경우 등에 쓰인다. 혈연관계의 상사성에 의한 교배는 혈연관계의 원근을 고려하여 이루어지는 교배로, 근연관계에 기초한 극단적인 예로는 근친교배가 있다. 근친교배는 개체 유전자의 호모접합화가 진행되기 때문에 계통 조성 시 유용 유전자의 집적과 고정에 유용하다. 한편 근친교배는 다양한 유전적 능력의 저하를 일으키는 근교퇴화라 불리는 현상도 일으킨다. 이는 유해 유전자가 호모화되기 때문이라고 생각된다. 원연교배는 근친교배 등에 의한 유전적 폐해를 피하기 위해 이용되는 경우가 많으며, 집단의 근교계수를 낮추는 목적 등에 쓰인다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">대표적인 교배 양식</div>
<p class="bx-num"><span class="bxn" data-n="56">•</span><span>품종 내에서 혈연적으로 근연에 있는 집단을 "계통"이라 부르며, 이 계통이나 품종에 기초한 교배 양식이 있다. 이들 교배 명칭은 일반적으로 자주 쓰이므로 이하에 설명한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="57">•</span><span><b>계통교배(순계교배)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>유전적으로 근연인 계통 내에서의 교배를 "계통교배(순계교배)"라 한다. 이 중에서도 형제나 조부-손 같은 예는 "근친교배"라 불린다. 일본의 흑모화종에서는 메이지 이전에 주고쿠 지방에서 이루어지던 "쓰루우(つる牛)"의 조성도 계통교배에 의해 조성된 것이며, 화우 개량에 큰 공헌을 해 왔다. 계통교배도 근친교배만큼은 아니더라도 유용 유전자의 고정화에 공헌하는 한편, 유해 유전자의 호모화도 진행된다. 따라서 집단 내의 유전적 다양성을 유지하기 위해서도 그 교배 방법에는 공조계수<sup>주2)</sup> 등을 고려하면서 교배할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="59">•</span><span>※ 주2) 공조계수: "근연계수"라고도 불리며, 개체 간 혈연관계의 정도를 측정하기 위한 지표 중 하나로, 2개체로부터 무작위로 추출한 유전자가 동조(Identical By Descent: IBD)가 될 확률로 정의된다. 양친 2개체 간의 공조계수는 자식의 근교계수와 같아진다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="60">•</span><span><b>계통간교배</b></span></p>
<p class="bx-num"><span class="bxn" data-n="61">•</span><span>조성된 계통 간의 교배를 "계통간교배"라 한다. 계통간교배에서는 계통마다 다른 유전적 배경이나 유전적 분화가 기대되는 교배가 가능해진다. 따라서 이 교배 방법에서는 유전자의 헤테로접합성이 높아져 자식의 능력이 양친 능력의 평균값보다 높아지는 효과도 기대된다. 이 현상을 "헤테로시스(잡종강세)"라 한다. 이에 따라 송아지의 출생 시 체중, 생존성 및 포육능력 등이 높아지고, 번식에 이용한 경우에는 수태율 및 포육능력 등이 높아지는 것이 알려져 있다⁴⁾. 한편 유전율이 높은 체중, 유량, 지육 형질 등에서는 헤테로시스가 별로 보이지 않으며, 자식의 능력은 양친의 중간적인 값을 보인다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="62">•</span><span><b>품종간교잡</b></span></p>
<p class="bx-num"><span class="bxn" data-n="63">•</span><span>유전적으로 떨어진 품종 간의 교배를 "품종간교잡"이라 한다. 품종간교잡은 헤테로시스 효과를 기대하는 경우나</span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>소 생산 시스템상의 편의성 때문에 이루어지는 경우가 많다. 일본에서는 홀스타인 번식 암소의 약 40%(2018년 현재)에 대해 흑모화종 정액을 이용한 품종간교잡이 이루어지고 있다. 또한 오스트레일리아에서는 애버딘 앵거스와 흑모화종의 교잡이 이루어져 일본과 아시아를 겨냥한 비육 밑소로 이용·수출되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="65">•</span><span>일본에서 홀스타인 암컷과 흑모화종 수컷 정액을 이용한 품종간교잡이 빈번히 이루어지는 이유는, 유용우인 홀스타인은 우유를 생산하기 위해 정기적으로 새끼를 낳을 필요가 있지만 품종 내 교배에 의할 필요는 없기 때문이다. 한편 흑모화종과의 교잡을 하면 홀스타인과 흑모화종의 중간적인 지육을 생산하는 것이 가능해져 비육우로 적합하다. 이 교잡우는 적당한 가격과 육질을 원하는 소비자의 수요에 대응하고 있다고 할 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">유전정보를 이용한 교배</div>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>가축 육종에서는 어미로서 바람직한 형질을 가진 개체를 선발하는 것이 중요하다. 가축의 경제 형질 대부분은 양적 형질이다. 인류의 선인은 오랜 세월에 걸쳐 이 경제 형질에 대해 표현형으로부터 동물을 선발하는 방법을 취해 왔다. 18세기 영국 출신의 Bakewell에 의해 동물의 육종 이론이 싹텄다. 그와 그의 제자들은 개량 목표 설정, 개체 선발, 우량 형질 고정을 위한 근친교배, 해외로부터의 우량 개체 도입 등 새로운 이론을 받아들여 지금도 남아 있는 가축 품종을 다수 만들어냈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span>20세기에 들어 멘델 유전법칙이 인정되어, 양적 형질에 대해서도 효과가 작은 다수의 유전자를 가정함으로써 설명이 가능해졌다. 유전자의 개념이 뿌리내리자 1930년대에는 집단유전학과 양적유전학의 기반이 확립되었다. 그 집대성이라 할 수 있는 성과가 Henderson에 의해 개발된 BLUP법이다. 1950년대에 이미 이 발상은 있었으나, 동물 육종 현장에서 이용되게 된 것은 컴퓨터 이용이 보급된 1970년대에 들어서부터이다. BLUP법에서는 개체가 가진 생산능력 기록에 기초하여 가축 개체의 유전적 능력을 예측하고, 종축의 유전 효과를 구체적인 수치(육종가)로 추정할 수 있는 통계적 수법이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span>일본의 흑모화종에 대해서도 BLUP법은 1990년 전반부터 시행되어, 화우 개량의 비장의 카드로서 전국화우등록협회의 주도 아래 이 방법에 의한 육종가 평가법이 도입되어 현재에 이르고 있다. BLUP법에서는 양친의 육종가를 평균함으로써 산자의 능력을 추정하는 것이 가능하다. 현재 육종가의 이용은 우수한 산자를 만드는 데 있어 강력한 교배 방법 중 하나가 되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>20세기 이후의 동물 육종에 큰 영향을 준 또 하나의 흐름이 분자유전학의 발전이다. 특히 1980년대 이후 가축의 DNA 해석이 활발히 이루어지게 되었다. 그 성과로 개체 식별과 친자 감정, 유전병의 원인 유전자 특정과 배제, 경제 형질에 관여하는 유전자의 동정과 이용을 들 수 있다. 한편 지육 형질이나 육질 등의 경제 형질에 대해서는 작은 효과를 가진 유전자가 다수 있기 때문인지, 현재에 이르러서도 동정된 원인 유전자와 그 이용은 한정되어 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="70">•</span><span>21세기에 들어 인간의 전 게놈 정보가 해명됨에 따라 주요 동식물의 전 게놈 배열이 잇달아 밝혀져 왔다. 소에서도 2009년에 전 게놈의 완전 해독이 이루어졌고, 같은 시기에 수만 이상의 단일염기다형(SNP)을 해석할 수 있는 고밀도 SNP 어레이(DNA 칩)도 개발되어 다양한 해석이 진행되고 있다. 이 SNP 유전정보를 이용한 추정 육종가(게놈 육종가)의 이론도 확립되어, 소 현장에서도 이 방법을 이용한 교배 계획이 시작되고 있으며, 그 유용성에 대해 기대되고 있는 바이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">교배의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>송아지의 출생 시 체중은 아비소의 영향이 크다. 따라서 흑모화종의 경우라도 체격이 작은 어미소에 체격이 큰 종모우를 교배하면 난산 발생률이 올라가 모자 모두를 위험에 노출시키게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>홀스타인 암소와 흑모화종 종모우의 품종간교잡은 기본적으로 홀스타인 쪽이 대형이기 때문에 거의 문제가 되지 않았다. 그러나 근년 흑모화종에서는 산육량 증대를 목표로 한 개량도 진행되어 발육이 좋은 종모우도 조성되어 왔다. 따라서 이와 같은 품종간교잡이라도 종모우의 체격 등에는 주의할 필요가 있을 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span><span style="color:var(--ink-soft)">(저자: 万年英之)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="74">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-2 수태와 배사멸</div>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>수정에 의해 싹튼 새로운 생명은 송아지로서 모체 밖으로 나오기까지 280~290일 전후를 모체 내에서 보낸다. 건강한 송아지를 기르기 위한 첫걸음은 건강한 모체, 건강한 배, 그리고 건강한 태자를 기르는 것이다. 그러나 실제로는 많은 생명이 배사멸이라는 형태로 사라지고 있다. 이들의 현황과 원인을 앎으로써 예방으로 이어갈 수 있다면 더 많은 송아지를 얻을 수 있다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">수정 후부터 착상, 태막 형성까지</div>
<p class="bx-num"><span class="bxn" data-n="76">•</span><span>수정 과정이 끝난 직후부터 접합자는 배가 되어 난관 내에서 난할을 반복한다. 배란 후 4~5일의 8~16세포기에 자궁 내로 진입하고, 배란 후 7일에 배반포가 되며, 9일 전후에 투명대를 탈출, 즉 해칭(부화)한 후에는 급속히 발육한다. 한편 초기배는 상실배 이후 단계의 배와 비교하여 서열 환경에 대한 감수성이 높다는 것이 알려져 있다. 이 때문에 근년 유용우의 여름철 수태율 향상 대책으로 인공수정(AI)이 아닌 수정란이식(ET)을 적극적으로 이용함으로써 번식 성적 향상으로 이어가는 사례가 보고되고 있다<sup>1~3)</sup>.</span></p>
<p class="bx-num"><span class="bxn" data-n="77">•</span><span>소의 착상은 배가 자궁에 접착하면서 시작된다. 배의 부동화와 신장은 교배 후 15~20일에 일어나며, 이 무렵에는 전장이 20 cm 이상으로 신장하여 끈 모양이 된다(그림 1-2-1). 모체 측 및 태자 측 세포가 마주보고 작은 융모가 끼워 들어가는 것이 교배 후 20~22일, 착상 완료가 교배 후 35일경이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">모체의 임신 인식</div>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>비임신 발정주기에서는 난포에서 분비되는 에스트라디올-17β(E₂)가 자궁내막의 E₂ 수용체와 결합함으로써 옥시토신 수용체의 발현을 유도한다. 또한 황체에서 분비되는 옥시토신은 자궁내막의 프로스타글란딘(PG)F₂α 합성을 자극한다. PGF₂α 생산은 발정주기의 어느 특정 시기에 자궁내막 세포에 발현하는 옥시토신 수용체의 수에 좌우된다. 자궁내막에 충분한 양의 옥시토신 수용체가 존재하면 황체로부터의 옥시토신 분비에 반응하여 펄스상의 PGF₂α 분비가 촉진되어 황체퇴행에 이른다. 따라서 교배 후 임신이 지속되기 위해서는 이 메커니즘이 작용하지 않는 것이 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="79">•</span><span>모자 간 커뮤니케이션은 새끼의 출생 후에만 한정된 것이 아니라 임신 극초기부터 시작된다. 모체의 임신 인식은 교배 후 16~19일에 일어난다. 착상 전의 배는 모체에 대해 배의 존재를 알리기 위해 다양한 종류의 단백질을 신호로 분비한다. 모체는 이들 신호를 받음으로써 임신을 인식하고, 황체를 유지하여 임신을 지속시켜 나가게 된다. 자궁강 내에 부유하는 소의 배반포가 분비하는 신호 중 하나로 사이토카인이 있다. 반추류에서 중요한 사이토카인으로 인터페론(IFN)-τ(타우)를 들 수 있다. 구조와 기능의 유사점에서 I형 인터페론의 하나로 분류되고 있다. "타우"는 그 분비원인 영양막세포(Trophoblast)의 머리글자 T의 그리스 문자(τ)에서 유래</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="80">•</span><span><i>그림 1-2-1 임신 29일의 임신 자궁</i></span></p>
<p class="bx-num"><span class="bxn" data-n="81">•</span><span>우자궁각에 끈 모양으로 신장한 요막(화살표)과 양막낭(화살촉)을 확인할 수 있다. 컬러 구회, 10페이지 (원도: 坪井孝益)</span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>한다. 수태산물에서 분비된 IFN-τ는 자궁내막의 옥시토신 수용체 발현을 억제함으로써 황체퇴행 인자인 PGF₂α의 생산을 억제하는 것이 알려져 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="83">•</span><span><i>그림 1-2-2 자궁내막 상피에 접착하기까지의 기간 중 배의 형태 변화와 그에 따른 P₄ 및 IFN-τ 분비 추이</i></span></p>
<p class="bx-num"><span class="bxn" data-n="84">•</span><span>위 그림: 자궁 내 수태산물의 발육. 아래 그림: 임신이 안정되어 있는 동안은 P₄ 분비가 유지되지만(검은 실선), 황체기 말에는 P₄ 분비가 저하한다(검은 파선). INF-τ 생산은 공간적 그리고 시간적으로 제어되고 있다(회색선). 문헌 4에서 인용·개변</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">태막·태반 형성과 기능</div>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>태막은 양막 및 요막융모막으로 이루어진다. 반추류는 다태반(궁부성 태반)이며, 궁부(융모총)는 자궁소구와 혈관이나 결합조직이 풍부한 태반절을 형성한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="86">•</span><span>요막융모막이 임신각(임신하고 있는 쪽의 자궁각) 및 비임신각의 전면으로 퍼지는 시기가 교배 후 35일경이 된다. 40일경까지는 태반절도 명료해지며, 요막융모막의 혈관 형성이 교배 후 40~60일에 일어난다. 태반절을 통해 모체와 태자 사이의 영양이나 배설물 교환이 이루어진다. 임신 경과에 따라 태반절은 현저히 발달하여 임신 말기에는 직경이 5~6 cm에 달하게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>태반은 영양 공급과 대사산물 배설이라는 기능 외에, 임신기에는 난소기능 조절, 임신 유지, 태자 발육, 유선 기능 발달, 분만 준비와 같은 사항에 관한 중요한 내분비 기관으로서 기능한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>자궁내막 증식 작용을 가진 프로게스테론(P₄)은 배의 발육에 불가결한 호르몬이다. 임신기간을 통해 황체에서 분비되지만, 임신 7개월 이후는 태반에서도 분비된다. 그러나 임신 8개월까지는 임신을 유지하고 건전한 태자가 자라기 위해 황체의 존재가 불가결하다. 또한 P₄뿐 아니라 에스트로젠도 태반에서 분비되는 주요 호르몬으로, 특히 임신 말기에 중요한 역할을 한다. 스테로이드 호르몬뿐 아니라 태반은 태반성 락토젠이라 불리는 폴리펩타이드 호르몬을 분비하는 것이 알려져 있으며, 태반성 락토젠은 태자 성장 촉진 작용 및 유선 자극 작용을 가진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">배사멸</div>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>소의 배사멸은 일반적으로 임신 42일 미만에 일어나는 배의 사멸로 정의되며, 임신 42일 이후의 임신 중단은 태자의 사망, 즉 유산으로 구별하고 있다. 한편 임신 16일까지의 배사멸을 특히 조기 배사멸이라 부르고, 그 이후의 후기 배사멸과 구별하기도 한다. AI 후 일수와 배의 생존율의 관계로 말하면, AI 후 16~19일은 IFN-τ 분비가 피크가 되는 시기이며, 배에게 생존을 건 중요한 시기이기도 하다(그림 1-2-2)⁴⁾. AI 후 15일 이전에 배가 사멸한 경우, AI 후 21일 전후에 재발정이 오기 때문에 사양자는 일시적이나마 수태한 사실을 파악하지 못하고 "불수태"로 인식하게 된다. 한편 AI 후 16일 이후에 배가 사멸한 경우, 재발정이 오는 타이밍은 21일보다 늦어진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span>배사멸은 분만 전후의 사고나 난산에 의한 송아지 사망, 혹은 신생자기, 이유기까지의 설사나 폐렴과 같은 눈에 보이는 현상이 아니기 때문에 그 손실의 크기가 인식되고 있지 않지만, 실제 발생률을 비교하면 신생자기 사망률보다 배사멸률 쪽이 훨씬 높다. 특히 유용우에서는 모체의 임신 인식 및 태막 형성 시기에 발생하는 배사멸이 송아지 손실의 큰 부분을 차지하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>건강한 발정우에 대해 정상적인 정자 활력과 정자 수를 가진 정액을 이용하여 적기에 AI를 실시한 경우, 수정률은 85% 이상에 달한다고 한다⁵⁾. 이것과, 현재의 고비유우에서는 1회의 AI로 송아지 분만까지 이르는 비율이 30% 이하라는 보고⁶⁾를 대조하면, 이 숫자의 차이는 임신 상실(임신 손실), 즉 배사멸과 유산에 기인하는 것이 된다. 실제로 비유우의 수태율 저하의 가장 큰 요인 중 하나가 배사멸이며</span></p>
<p class="bx-num"><span class="bxn" data-n="92">•</span><span>, 배사멸률은 40% 이상으로 보고되어 있다⁷⁾. 또한 수정 후 8~16일의 사멸이 많다고 생각된다⁸⁾(그림 1-2-3). 배의 25%가 임신 후 21일까지의 기간에 사멸한다. 정시 AI 후 28일에 초음파 검사로 임신으로 진단된 개체 중 약 1할은 그 후 2주 내에 사멸하고, 다른 약 1할은 100일까지 유산했다는 보고⁹⁾가 있다. 다른 보고¹⁰⁾에서는 임신 25~45일에 6.5%, 45~65일까지 1.5%의 비율로 배사멸 혹은 유산에 의한 임신 손실이 있었다고 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="93">•</span><span><i>그림 1-2-3 수정 후 일수와 배의 생존율의 관계</i></span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span>(수정 후 0일: 231두=100%, 8일: 93%, 16일: 66%, 42일: 58%) 문헌 8에서 인용·개변</span></p>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span>배사멸의 원인은 다양하지만, 본고에서는 그 원인을 P₄ 분비 이상, 모체의 임신 인식 이상, 서열 스트레스, 영양상의 문제, 인위적 요인, 기타로 나누어 기술한다. 한편 감염증에 의한 배사멸 및 유산에 대해서는 1-5(44페이지)를 참조하기 바란다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="96">•</span><span>■ 프로게스테론(P₄) 분비 이상</span></p>
<div class="bx-sub"><div class="bx-subtitle">배란 전의 분비 이상</div>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>퇴행 전 황체에서 분비되는 P₄와 그에 이어 발정 시에 분비되는 E₂는 발정 후에 건강한 난자를 배란시키기 위해 빠뜨릴 수 없다. 발정 전에 P₄가 존재하지 않는 경우, 또 발정 전부터 발정기에 걸친 E₂ 분비가 충분하지 않은 경우, 파라크린 작용 등에 의해 자궁내막 간질의 P₄ 수용체량이 감소하게 되어 교배 후 4~9일에 과잉의 PGF₂α가 분비되고, 그것이 배에 악영향을 미치게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>교배 전 발정주기의 황체기에 P₄ 분비가 낮은 상태로 계속되면 황체형성호르몬(LH) 펄스 빈도가 증가한다. 그 결과 주석난포<sup>주1)</sup>가 정상보다 오래 존속·성장한 뒤 배란하기 때문에 난자는 노화한다. 즉 난포 내의 난자는 배란까지 더 장기간에 걸쳐 난포 내 고농도의 E₂에 노출되게 된다. 이것이 배의 품질을 저하시키고 배사멸률을 상승시키는 원인이 된다. 이 경우 배는 통상 16세포기 이전에 사멸한다고 생각된다¹¹⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="99">•</span><span>※ 주1) 주석난포(Dominant follicle): 소의 한 발정주기에 2개 내지 3개의 난포파(난포군의 소장)가 있으며, 각 난포파 출현 시에는 다수의 소난포가 존재하여 동시에 발육을 시작하지만, 그 과정에서 통상 1개의 난포가 선택된다. 이 난포를 "주석난포"라 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">배란 후의 분비 이상</div>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>혈액 중 고P₄ 상태는 모체의 임신 인식 시기까지가 특히 중요하다. 배란 후에 형성되는 황체는 배란 후 약 4일부터 P₄를 활발히 분비하여 혈중으로 방출하게 된다. 수태율이 낮은 소나 리피트브리더<sup>주2)</sup>에서는 정상우와 비교하여 발정 후 6일간의 혈중 P₄ 농도 상승이 늦거나 혹은 낮은 채로 추이하는 것이 알려져 있다. AI 후 조기에 P₄ 제제를 투여하면 수태율이 상승한다는 것이 보고되어 있다<sup>12,13)</sup>. 조기 배사멸 원인의 적어도 일부는 임신 초기의 P₄ 분비 부족, 혹은 자궁 내 P₄ 수용체의 감수성 저하(정상보다 다량의 P₄를 필요로 하는 상태)에 의한 것으로 추찰된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>배란 난포의 직경이 작을수록 그 후 형성되는 황체도 작고, 분비되는 P₄량도 적다. 주석난포의 직경이 12 mm 이하일 때 배란 유기 처치를 받은 개체에서는 직경 13 mm 이상에서 배란 유기된 경우와 비교하여 교배 후 P₄ 농도 상승이 늦고 수태율도 낮다⁹⁾. 또한 기능성 황체가 순조롭게 형성되기 위해서는 정상적인 LH 분비가 필요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="102">•</span><span>※ 주2) 리피트브리더: 발정주기가 정상적으로 영위되고 임상적으로 난소, 부생식기에 특별히 이상이 인정되지 않음에도 불구하고, 소에서는 3회 이상, 돼지에서는 2회 이상의 수정 혹은 교배로 수태하지 않는 개체를 말한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">프로게스테론(P₄)의 대사속도(배출률) 증가</div>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>말초혈 중 P₄ 농도가 낮다는 것은 황체로부터의 분비량이 감소한 경우 외에, 분비된 P₄의 대사속도가 증가한 경우가 생각된다. 고비유우는 저비유우와 비교하여 혈중 P₄ 농도가 낮다는 것이 알려져 있다. 그 원인 중 하나는 고비유우 쪽이 간에서의 스테로이드 호르몬 대사속도(배출률)가 높다는 것이다. 비유우에서 간의 혈류량과 P₄ 대사율은 급이 후 2시간에 최대가 되며, 급이량이 많은 개체일수록 최대 대사율이 오래 지속되었다고 보고되어 있다¹⁴⁾. 이것이 일반적으로 고비유우의 수태율이 낮은(배사멸이 많은) 이유 중 하나라고 생각된다. 또한 건유우에서도 사료 섭취량이 많은 개체일수록 혈중 P₄ 농도가 낮다는 것이</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>보고되어 있다¹⁵⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="105">•</span><span><i>그림 1-2-4 말초혈 중 P₄ 농도 및 자궁 환경의 변화, 그리고 그 후의 배 신장과 INF-τ 생산에 미치는 영향의 관계</i></span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>낮은 말초혈 중 P₄ 농도가 자궁내막의 트랜스크립톰*을 변화시켜 배의 신장이 지연되는 결과, INF-τ 생산이 저하하고 수태성도 저하한다. *: 특정 상황하에서 세포 중에 존재하는 모든 mRNA 또는 1차 전사산물의 총체를 "트랜스크립톰"이라 부르며, 트랜스크립톰 시그니처란 그 발현 패턴을 나타낸다. 문헌 18에서 인용·개변</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>이상의 사실로부터, 배사멸을 예방하기 위해 AI 후 황체기의 P₄ 분비를 높이는 방법이 검토되고 있다. P₄ 제제를 직접 투여하는 방법 외에, AI 후 5일에 인간 융모성 성선자극호르몬(hCG) 혹은 성선자극호르몬 방출호르몬(GnRH)을 투여하는 방법도 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">모체의 임신 인식 이상</div>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>수정 후 15~17일의 말초혈 중 P₄ 농도가 높은 소의 배는 크고, IFN-τ 생산량도 많다¹⁶⁾. PGF₂α 생산을 억제하려면 신장배가 황체 측 자궁각의 거의 전역을 차지할 필요가 있다. 그러나 실제로 이 시기의 자궁 내 배를 관찰한 연구에 따르면 길이는 15~250 mm로 제각각이었다고 보고되어 있다¹⁷⁾. 이 결과는 설령 배가 존재하더라도 충분한 크기가 없으면 황체퇴행이 진행되어 배는 사멸한다는 것을 시사한다. 또한 말초혈 중 P₄ 농도가 낮으면 자궁내막의 유전자 발현 패턴이 최적의 상태가 되지 않고, 그 결과 수태산물의 신장도 충분히 일어나지 않게 된다. 그러면 IFN-τ 생산도 저하하고, 모체의 임신 인식도 정상적으로 작용하지 않게 되어 수태성이 저하한다¹⁸⁾(그림 1-2-4).</span></p>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>배가 모체에 신호를 보낼 수 없는 경우나 모체가 신호를 받지 못한 경우에는 황체가 퇴행하여 임신이 중단되게 된다. 배가 PGF₂α 생산을 억제하는 작용이 있는 항황체퇴행 신호를 적절히 모체 측에 보내 주지 않으면, 자궁내막에서는 PGF₂α가 분비되어 황체</span></p>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>를 퇴행시키는 프로그램으로 진행하게 된다. 따라서 PGF₂α 생산을 억제할 수 있으면 임신이 유지될 가능성도 커진다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">서열 스트레스</div>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>여름철 서열 스트레스가 소의 수태율을 저하시키고 조기 배사멸을 초래하는 한 요인이 되고 있다는 것은 예로부터 알려져 있으나¹⁹⁾, 지구온난화가 현 사회의 심각한 환경 문제로 진행되고 있는 가운데 유용우가 받는 서열 스트레스는 앞으로 한층 더 중요한 과제가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="112">•</span><span>서열 스트레스의 영향은 배란 전 난자나 난포막 세포뿐 아니라 초기배의 발육, 황체 기능과 자궁내막, 그리고 뇌하수체 전엽에까지 미치고 있다. 또한 서열 환경에 놓이는 상황이 만성화되면 P₄ 생산은 억제된다²⁰⁾. 나아가 서열 환경에서 소는 열을 방산하기 위해 에너지를 소비하므로 몸을 유지하기 위한 에너지가 더 많이 필요해진다. 그러나 식욕 저하로 에너지 섭취량은 감소한다. 이 때문에 에너지의 대부분은 모체 유지를 위해 쓰이게 되어 번식을 위한 에너지가 부족한 결과가 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>온도와 함께 중요한 요소가 습도이다. 습도가 올라가면 체표로부터의 증산이 저하하므로 열 방산이 더 어려워진다. 서열 환경의 객관적 지표로 평균 온습도지수(temperature-humidity index: Mean THI)와 최고 온습도지수(Max THI)가 쓰이고 있다. Max THI의 산출식을 아래에 나타낸다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>Max THI = 0.8 maxT + 0.01 RH (maxT − 14.4) + 46.4</span></p>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>＊maxT: 최고 온도, RH: 상대습도 %</span></p>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>Max THI가 증가함에 따라 임신 21~30일의 배사멸률도 상승했다고 보고되어 있다(그림 1-2-5)²¹⁾. 우사 온도와 습도를 매일 정해진 시각에 기록함으로써 소의 불쾌지수를 추측하고, 필요에 따라 대책을 강구할 수 있다. 이러한 점에서 여름철 수태율을 향상시키기 위해서는 선풍기나 자연풍 이용, 미스트(세무) 살포, 우사 구조 재검토 등을 통해 효과적으로 우체를 식히는 것이 필요하다. 환기를 실시하여 공기의 움직임을 만들어 증산을 돕게 된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="117">•</span><span><i>그림 1-2-5 임신 21-30일의 최고 온습도지수(Max THI)와 배사멸률의 관계</i></span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>(Max THI <55: 약 0%, 55~59: 약 1.5%, 60~64: 약 3%, 65~69: 약 9%, 69<: 약 13%) 문헌 21에서 인용·개변</span></p>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>서열 스트레스가 배에 직접 미치는 영향으로는 배의 열에 대한 감수성을 들 수 있다. 특히 배란일과 그 다음 날의 수정란, 초기배(1세포기, 2세포기)는 열충격단백질<sup>주3)</sup>을 갖지 않으므로 서열 환경에 의한 영향을 받기 쉽다고 한다. 이 시기의 소를 충분히 시원한 환경하에 두거나 혹은 우체를 냉각하는 것이 배사멸 예방에 유효하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="120">•</span><span>※ 주3) 열충격단백질: 세포가 열에 대해 저항성을 가질 때 발현하는 단백질. 열 등의 스트레스로부터 세포를 보호하는 역할을 담당하고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">영양상의 문제</div>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>제1위 분해성 단백질을 많이 함유한 사료를 분만 후 9주에 걸쳐 소에 급여하면, 통상 급여 소와 비교하여 난포 발육이 쇠퇴하고 분만 후 첫 배란이 늦어지며(25.2일 vs. 38.6일), 황체 형성이 불활발해지고 P₄ 농도가 낮아지는 것이 보고되어 있다²²⁾. 고단백 사료를 급여받은 소에서는 혈액요소질소(BUN)가 높아지고 첫 AI 수태율이 낮아지는(31% vs. 48%) 것이 알려져 있다²³⁾. 과잉의 제1위 분해성 단백질은 혈중 암모니아 농도를 상승시킨다. 이 경우 수정 직후에 급여하는 사료 중의 에너지 함유량이 적으면 고농도의 BUN을 초래하여 P₄ 농도 저하와 자궁 환경 변화에 의해 조기 배사멸을 초래한다고 한다. 나아가 난포는 1차 난포 단계에서 배란하기까지 수십 일을 요하는데, 초기 단계에서 모체가 에너지 부족에 빠진 경우 그 영향이 후의 성숙 난포 단계에까지 미쳐 배란하더라도 질이 좋지 않은 난자가 될 가능성이 있다고 지적되고 있다. 이러한 의미에서도 건유기의 사양관리, 특히 에너지 밸런스에 대한 배려가 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">인위적 요인</div>
<p class="bx-num"><span class="bxn" data-n="122">•</span><span>조기 임신진단을 위한 직장검사가 배 생존에 영향을 미치는지 여부에 대해서는 오랫동안 논의되어 왔다. 결론이 나지 않는 이유</span></p>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>중 하나로, 직장검사에 의한 영향을 밝히기 위해 필요한 대조군 설정이 어렵다는 점을 들 수 있다. 즉 직장검사 없이 임신우의 상태를 모니터링하는 것이 곤란하기 때문이다. 그러나 초음파 검사 기술의 진전으로 직장검사가 배사멸에 미치는 영향을 객관적으로 검토하는 것이 가능해졌다.</span></p>
<p class="bx-num"><span class="bxn" data-n="124">•</span><span>표 1-2-1 젖소에서 산력이 쌍태율에 미치는 영향.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>문헌</th><th>관찰한 분만수</th><th>1산</th><th>2산</th><th>3산</th><th>4산</th><th>5산</th><th>6산</th><th>합계(%)</th></tr><tr><th>Pfau et al., 1948</th><td style="text-align:left">937</td><td style="text-align:left">0.7</td><td style="text-align:left">5.0</td><td style="text-align:left">4.2</td><td style="text-align:left">5.0</td><td style="text-align:left">7.0</td><td style="text-align:left">6.7¹⁾</td><td style="text-align:left">4.2</td></tr><tr><th>Erb and Morrison, 1959</th><td style="text-align:left">7,387</td><td style="text-align:left">1.3</td><td style="text-align:left">4.4</td><td style="text-align:left">5.3</td><td style="text-align:left">4.6</td><td style="text-align:left">5.8</td><td style="text-align:left">6.0</td><td style="text-align:left">4.6</td></tr><tr><th>Nielen et al., 1989</th><td style="text-align:left">11,951</td><td style="text-align:left">0.8</td><td style="text-align:left">2.7</td><td style="text-align:left">4.1</td><td style="text-align:left">4.5</td><td style="text-align:left">4.9</td><td style="text-align:left">4.8¹⁾</td><td style="text-align:left">3.2</td></tr><tr><th>Eddy et al., 1991</th><td style="text-align:left">19,755</td><td style="text-align:left">0.9</td><td style="text-align:left">2.1</td><td style="text-align:left">3.5</td><td style="text-align:left">3.4</td><td style="text-align:left">3.7</td><td style="text-align:left">3.2</td><td style="text-align:left">2.5</td></tr><tr><th>Ryan and Boland, 1991</th><td style="text-align:left">24,843</td><td style="text-align:left">1.0</td><td style="text-align:left">7.0</td><td style="text-align:left">7.5</td><td style="text-align:left">7.9</td><td style="text-align:left">9.1²⁾</td><td style="text-align:left">…</td><td style="text-align:left">4.2</td></tr><tr><th>Berry et al., 1994</th><td style="text-align:left">19,497</td><td style="text-align:left">1.3</td><td style="text-align:left">6.0</td><td style="text-align:left">9.4³⁾</td><td style="text-align:left">…</td><td style="text-align:left">…</td><td style="text-align:left">…</td><td style="text-align:left">—</td></tr><tr><th>Kinsel et al., 1998</th><td style="text-align:left">52,362</td><td style="text-align:left">1.0</td><td style="text-align:left">2.9</td><td style="text-align:left">3.2</td><td style="text-align:left">3.9</td><td style="text-align:left">3.3</td><td style="text-align:left">4.1¹⁾</td><td style="text-align:left">2.4</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>(산차별 쌍태율, %) 1) 6산 이상의 쌍태율 합계, 2) 5산 이상의 쌍태율 합계, 3) 3산 이상의 쌍태율 합계. 문헌 27을 인용·개변</span></p>
<p class="bx-num"><span class="bxn" data-n="126">•</span><span>AI 후 29~32일 사이에 경직장 프로브를 이용한 초음파 검사로 임신을 확인한 520두의 유용우(경산우 및 미경산우)에 대해, 경험이 풍부한 동일 인물이 임신 34~41일 사이에 직장검사를 하는 군(직검군 258두)과 직장검사를 하지 않는 군(비직검군 262두)의 2군으로 임의로 나눈 시험²⁴⁾을 실시했다. 직장검사로는 임신각에서 양막낭을 피한 태막 슬립법을 이용했다. 양 군에 대해 AI 후 45일과 60일에 초음파 검사를 실시하여 태자의 생사를 확인했다. 그 결과 직검군과 비직검군 사이에는 배사멸(태자사) 발생률에 차이가 인정되지 않았다. 따라서 임신 초기의 태막 슬립법은 임신각이라도 양막낭을 피해 실시하면 안전하다는 결과였다. 그러나 2만 두 가까운 임신우를 모니터링한 다른 보고²⁵⁾에 따르면, 임신 28~35일 혹은 43일 이후에 직장검사를 실시한 경우와 비교하여 임신 35~42일 사이에 직장검사한 경우에 유의하게 배사멸률이 높았던 결과가 얻어졌다. 이로부터 양막 촉진이나 태막 슬립 방법을 잘못하면 배사멸 위험이 높아진다는 것은 인식해야 할 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>덧붙여 전술한 보고²⁴⁾에서는 합계 14%에서 배사멸(태자사)이 확인되었는데, 태자사(4.5%)보다 배사멸(10%) 발생 쪽이 많았다. 또한 미경산우(8.8%)보다 경산우(16.4%)에서의 배사멸(태자사)이 많았고, 단태(12.9%)보다 쌍태(25.5%) 쪽이 많이 배사멸(태자사)이 발생했다. 쌍태 임신 비유우를 관찰한 연구²⁶⁾에서는 211두 중 51두(24.2%)가 임신 90일까지 유산했다. 51두 중 좌우 자궁각에 1두씩 태자가 있었던 경우의 유산이 7두였던 데 비해 한쪽 자궁각에 2두의 태자가 있었던 경우의 유산이 44두로 유의하게 높았다고 보고하고 있다. 또한 13두(6.2%)는 쌍태 중 1두가 임신 도중에 사멸(사망)하고 나머지 1두만이 분만된 예였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>한편 쌍태 임신의 발생률은 유량 및 산차 증가에 따라 증가하는 것이 알려져 있다²⁷⁾(표 1-2-1).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">기타, 난자·난포와 배의 발육을 저해하는 요인</div>
<p class="bx-num"><span class="bxn" data-n="129">•</span><span>AI가 적기에 혹은 적절하게 실시되지 않은 경우, 수정 장해라는 형태로 수태 불성립이 되는 한편, 수정에 이르는 경우도 있다. 그러나 그 후 형성된 배에서 난자나 정자의 노화, 수정능 저하 등이 원인으로 유전자 또는 염색체 이상, 난할 이상 등에 의해 사멸할 확률이 높아진다. 또한 수정 후 8~10일경은 배가 배반포에서 탈출 배반포로 발육하여 해칭하는 시기와 일치하는데, 해칭에 관여하는 배 자신의 물리적 작용이나 여러 효소 작용이 정상적으로 기능하지 않으면 해칭하지 못하고 사멸에 이른다. 소의 ET에서 이식배의 해칭을 인위적으로 보조하는(투명대에 작은 흠집을 내는) 것(어시스티드 해칭)으로 동결융해 후 배의 생존성이 향상되는 것과 양호한 수태율을 얻을 수 있다는 것이 보고되어 있다<sup>28,29)</sup>.</span></p>
<p class="bx-num"><span class="bxn" data-n="130">•</span><span>그 밖에 어미소의 급속한 신체충실지수(BCS) 저하, 발열, 중증 파행, 태반정체, 그리고 대사병이나 유방염 등도 정상적인 난자와 난포 발육을 저해하거나, 혹은 배반포로의 발육을 저해하는 요인이 된다고 생각되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>번식성적의 향상이 더 많은 송아지 생산으로 이어지지만, 무사히 임신기간을 보내고 분만에 이르지 못하면 생산자의 이익이 되지 않는다. 수태율 저하, 분만율 저하의 한 원인으로서의 배사멸(胚死滅)의 중요성을 인식해야 한다. 생산성을 최대한으로 끌어올리기 위해서는 생산자, 인공수정사, 수의사, 영양 컨설턴트, 행정기관 등 관계자가 연계하여 하나가 되어 배사멸의 위험을 줄이는 부단한 노력을 계속하는 것이 필요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span><span style="color:var(--ink-soft)">(저자: 大澤健司)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="133">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-3 태아의 생리</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 발육의 특징</div>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span>태아의 발육을 이해하는 데 있어 임신기를 3개의 시기로 구분하여 설명하는 경우가 있다. 제1기는 수정 후 세포수가 증가하는 시기로, 각 기관의 세포수 증가가 주체이며 세포비대는 적다. 제1기는 삼분기(trimester)의 첫 시기에 해당한다(3개월령까지). 제2기는 세포수 증가에서 세포비대로의 이행기로, 양쪽이 병존한다(4~6개월령). 제3기는 세포비대가 주체가 되는 시기이다(7~9개월령). 체중 증가는 S자 곡선을 그리며 마지막 삼분기에 배증하는데, 이는 세포비대에 의한 증가이다¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>태아 발육에 관련된 병인 인자로는 유전, 환경, 영양의 3가지가 있다. 또한 관련되는 해부학적 부위를 보면 유전 인자는 태아에만 관계하고, 환경 인자는 태아, 태반-제대, 모체의 3가지 모두에 관계한다. 나아가 영양 인자는 모체에만 관계한다. 유전 인자에 의한 질병에는 유전병의 유전자 검사를 통해 수정 전에 예방할 수 있는 것도 있다. 환경 인자에 의한 질병은 모체의 감염증(바이러스, 세균), 유해물질(중독식물, 마이코톡신, 엔도톡신 등), 최기형성이 강한 약제, 스트레스(더위, 질환 등)를 피함으로써 예방할 수 있다. 이들 환경 인자의 영향을 가장 받기 쉬운 시기는 첫 삼분기이며, 기관 형성이 이루어지는 시기에 영향이 크다. 이 시기에 치료가 필요한 경우에는 최기형성이 적은 제제를 선택할 필요가 있다. 영양 인자 부족에 의한 질병도 충분히 예방 가능하다. 임신기에 투여하는 보충제는 그 영향과 효과를 충분히 고려하여 주어야 한다. 특히 요오드는 태아에서 특이적으로 갑상선에 흡수되어 장기간에 걸쳐 기능저하를 일으키므로 임신우에는 금기이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">태반의 발달과 생리</div>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>소 배(胚)의 착상 시기는 수정 후 17~35일로 알려져 있으며, 착상은 수정과 함께 배 소실이 가장 일어나기 쉬운 단계이다. 수태율 40%의 경우 수정 시와 착상 시의 배사멸률은 각각 약 25%로 알려져 있다. 혈중 프로게스테론(P₄)의 특성으로서 8~10일간 작용하면 자궁내막의 P₄ 수용체를 감소시키는 작용이 있다(다운레귤레이션). 이 현상에 의해 내막상피를 덮고 있는 뮤신 1(고분자 당단백질)이 감소하여 배영양막과 자궁내막의 결합이 가능해진다. 소의 수태율에 영향이 큰 인자로서 수정 후 5~6일경의 P₄ 농도가 있다. 예를 들어 배 이식 전날(6일)의 혈중 P₄ 농도 1.5 ng/mL 이하에서의 수태율은 25%, 1.5~2.5 ng/mL에서는 43.8%, 2.5~3.5 ng/mL에서는 54.8%, 3.5 ng/mL 이상에서는 78.6%로, P₄ 농도와 수태율 사이에 높은 상관이 있음이 보고되어 있다²⁾. 이로부터 황체 초기의 P₄ 분비가 낮으면 P₄ 수용체의 정상적인 다운레귤레이션이 일어나지 않아 배와 자궁내막의 응답이나 배 신장(伸長)에 지장을 초래한다고 생각되고 있다. 그 증거로 들 수 있는 것이 자궁 내 인터페론(IFN)-τ 농도(임신 16일)와 수정 4~5일의 혈중 P₄의 관계로, 양자 사이에는 높은 상관이 보인다³⁾(그림 1-3-1). 임신 인식 물질인 IFN-τ가 배에서 충분히 생산되지 않으면 황체퇴행 임계기에 프로스타글란딘(PG)F₂α 방출을 충분히 억제하지 못하여 임신을 유지할 수 없게 된다. 배에서 충분한 IFN-τ를 생산시키기 위해서는 임신 초기 발육황체의 성장이 큰 열쇠가 되므로, 분만 후 가능한 한 이른 시기에 인슐린이나 인슐린유사성장인자(IGF)-1 등의 대사 호르몬을 억제하는 음의 에너지 균형을 해소할 필요가 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="137">•</span><span><i>그림 1-3-1 소의 혈중 P₄ 값과 IFN-τ 값의 관계 (문헌 3에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="138">•</span><span><i>그림 1-3-2 소의 태아태반 및 모태반에 함유된 P₄와 에스트로겐의 임신월령 추이 (문헌 4에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="139">•</span><span>소 자궁내막의 P₄ 수용체는 황체측 자궁각에 많이 존재하기 때문에 대부분의 소 배는 배란측에 착상하고, 태막은 급속히 비임신각까지 도달한다. 그 후 배영양막은 자궁의 궁부(宮阜, 융모총) 부위의 자궁내막 상피를 용해하여 결합조직까지 진입한다. 궁부가 없는 영역에는 자궁선이 다수 존재하며, 태반 형성 후에도 조직영양소인 자궁유(子宮乳)의 공급원으로서 임신기간 중 계속하여 작용한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="140">•</span><span>태반은 태아에 대해 호흡기, 순환기, 소화기, 비뇨기, 내분비기 등 다양한 역할을 담당하고 있다. 따라서 태아의 발육·기능을 유지하기 위해 성장에 걸맞은 태반의 크기나 기능이 동반되지 않으면 태아 발육불량이나 배 또는 태아의 사망 등을 일으킨다. 와규(和牛) 배를 유용우에 이식할 때 분만 후 유용우의 비유량이 감소하는 것이 알려져 있는데, 이는 태반의 크기가 분만 후 유량에 영향을 미친 결과로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="141">•</span><span>임신기 P₄의 작용으로는 자궁내막의 분화(착상성 증식), 자궁근의 수축 억제, 자궁경관의 폐쇄, 임신자궁의 국소 면역관용 등이 있다. 한편 에스트로겐의 작용으로는 영양막의 분화, 태반 스테로이드 생산의 자기조절, 모체 심혈관계와 자궁-태반 혈류의 조절, 태반의 유선 발육 등을 들 수 있으며, 두 호르몬은 임신기간을 통해 임신 유지와 태아 발육에 중요한 역할을 하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="142">•</span><span>태반에서 P₄와 에스트로겐은 태아태반 측에서만 합성되며, 특히 P₄는 임신 7개월령부터 급증한다. 그러나 P₄는 생산 직후 태아 적혈구에 의해 생물학적 작용이 없는 20α-하이드록시프로게스테론으로 대사되므로, P₄는 모태반이나 태아혈로는 거의 이행하지 않는다. 임신 7개월령을 지나서 모우의 난소를 적출하면 유산하는 비율은 적어지지만 신생자 발육은 불량해지는 경우가 많아, 충분한 발육에는 임신황체로부터의 P₄가 불가결하다고 여겨진다. 한편 에스트로겐은 임신 5개월령에 한 번 상승하고 그 후 임신 말기에 걸쳐 다시 증가한다⁴⁾(그림 1-3-2).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="143">•</span><span><i>그림 1-3-3 소 태아의 반추위와 체중의 태령별 증가율 (문헌 5에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>종래 이 임신 5개월령에서 태반의 에스트로겐 함량과 에스트로겐 합성효소인 아로마타제 활성값이 일과성으로 증가하는 의의에 대해서는 전혀 알려져 있지 않았다. Masri 등⁵⁾은 임신 3~9개월의 소 태아(30두)의 CT 해석을 실시하여, 태아의 제1·2위, 제3위, 제4위의 중량이 임신 5개월령에 수십 배의 월증가율을 보이는 것을 보고하였다(그림 1-3-3). 이 임신 5개월에서의 반추위 중량의 월증가율이 태아태반 에스트로겐 합성이 증가하는 시기와 일치했다는 점에서 매우 흥미로운 보고이다. 한편 제1·2위의 용적 비율은 임신 5개월에 최대가 되지만, 제4위는 임신 6개월 이후 임신 말기에 걸쳐 증가하여, 태아 반추위의 발달·분화는 부위에 따라 다르다고 하였다. 태아의 체장과 체중은 분만 전 1개월간 급격히 증가하는데, 임신 말기의 에스트로겐 증가가 급격한 태아 발육을 위한 대사를 촉진하고 있다. 이 시기에는 태아의 발육에 더하여 자궁, 태반, 유선의 증대도 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="145">•</span><span><i>그림 1-3-4 면양, 돼지 및 말 태아의 분만 전 혈중 코르티솔 농도의 변화 (문헌 9에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="146">•</span><span><i>그림 1-3-5 소 태아 및 신생자의 혈중 코르티솔 및 ACTH 농도의 추이 (문헌 11에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>에스트로겐 농도가 증가하는 임신 후기부터 임신 말기에 걸친 급격한 태아 발육은 대사단백질 요구량을 높이는 것으로 알려져 있다. 특히 임신 말기 28일간 건물섭취량(DMI)의 0.09%의 메티오닌을 첨가한 군에서는 대조군과 비교하여 초유 성분에는 차이가 없음에도 불구하고 송아지의 출생 시 체중과 체고, 9주령까지의 체중, 체고, 일당증체량(DG)도 유의하게 높아진다는 보고가 있어⁶⁾, 에스트로겐 증가에 충족되지 않는 대사단백질의 공급은 태아나 신생자 발육에 큰 영향을 미치게 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">태아 부신피질의 발달과 생리</div>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>뇌하수체 이상을 동반하는 사람의 무뇌아나 소의 뇌기형아에서는 임신기간이 연장되기 때문에 뇌하수체와 분만의 관계가 예측되어 왔다. 실험적으로 태아 뇌하수체가 분만에 관여함을 처음으로 증명한 것은 오스트레일리아의 산부인과 의사 Liggins이다. 그는 양 태아에 부신피질자극호르몬(ACTH)이나 코르티솔을 투여하면 분만이 빨라지는 것⁷⁾, 반대로 뇌하수체를 파괴하면 분만 시기가 연장되는 것을 실제로 증명하였다⁸⁾. 태아에 직접 카뉼레를 장착하여 출생 전부터의 혈중 코르티솔 추이를 관찰한 연구에서는, 양이나 돼지의 태아에서 혈중 코르티솔 값이 출생 2주 이상 전부터 상승을 시작하고 있음이 밝혀졌다⁹⁾(그림 1-3-4). 그러나 출생 전 태아 혈중 코르티솔의 추이와 그것을 자극하는 ACTH의 추이가 일치하지 않는다는 것이 양에서 알려져 있다. 즉 ACTH 값이 110일 이후에 증가를 시작하는 데 비해 코르티솔 값은 130일 이후에 증가를 시작한다¹⁰⁾. 소에서도 혈중 ACTH가 8개월령부터 선행하여 증가를 시작하고 분만 시에는 저하되어 있는 데 비해, 코르티솔은 9개월령부터 증가하여 분만 시에 최고값에 달한다¹¹⁾(그림 1-3-5). 이처럼 단순히 혈중 호르몬 추이만을 관찰해서는 이 시간차(time lag)의 설명이 곤란하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>그래서 津曲 등은 6~9개월령의 소 태아 세포를 사용하여 ACTH에 대한 코르티솔 반응성을 검토하였다. 태아 부신세포를 준비하여 ACTH를 첨가하면서 6일간 배양하고, 코르티솔 생산량을 2일 간격으로 측정하였다. 그 결과 1~2일 또는 3~4일간 배양에서는 코르티솔 생산</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>반응성은 낮았으나, 5~6일간 배양에서 비약적으로 증가함이 판명되었다¹²⁾(그림 1-3-6). 더욱이 ACTH에 대한 코르티솔 반응성은 태령 6~7개월보다 8개월에서 약간 증가하고, 9개월에서 급증하는 것이 관찰되었다. 이상의 결과로부터 부신의 코르티솔 생산능은 일정 기간(적어도 수일 이상) ACTH의 자극을 받음으로써 코르티솔 반응성이 높아지며(ACTH 수용체 수의 증가), 소 부신의 성숙은 9개월령에 가속된다는 것이 판명되었다(그림 1-3-7). 또한 이 배양실험 결과로부터 임신 말기의 ACTH와 코르티솔 농도의 시간차에 대한 설명도 가능하다고 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="151">•</span><span><i>그림 1-3-6 9개월령 소 태아의 배양 부신세포에서 ACTH 첨가에 의한 배양일수별 코르티솔 생산능 (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="152">•</span><span><i>그림 1-3-7 소 태아의 배양 부신세포에서 ACTH 첨가에 의한 임신월령별 코르티솔 생산능 (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>Liggins가 제창한 태아 시상하부-뇌하수체-부신축을 중심으로 한 분만 발래(發來) 기전의 가설에서는 무엇이 태아 시상하부를 자극하는지 불분명하였다. Liggins의 제자인 Thorburn 등¹³⁾은 그 인자가 태아태반에서 방출되는 PGE₂임을, 양 자궁-난소정맥 중 PGE₂가 출생 2주 전부터 증가한다는 결과에 근거하여 새로운 가설로 제안하였다(그림 1-3-8). 자연분만에서는 태아가 성장함에 따라 필요한 혈류량도 비약적으로 증가하는데, 이 영양요구량의 급증이 태아태반으로부터의 PGE₂ 분비 신호가 된다고 한다. 또한 태반 기능 저하 혹은 손상을 받은 경우에도 태아태반에서 PGE₂가 방출되어 유산이 일어난다는 설명은 종래의 가설보다 설득력이 매우 높다. 소나 돼지도 기본적으로는 이 흐름으로 분만이 유발되는 것은 틀림없다고 생각되지만, 유일하게 고려해야 할 것은 P₄ 생산원의 차이이다. 분만이 가까워지면 양의 태반에서는 P₄ 생산에서 에스트로겐 생산으로 바뀌어 P₄ 저하와 에스트로겐 증가가 동시에 일어난다(결과적으로 혈중 에스트로겐은 분만 직전에 급격히 증가한다). 한편 소나 돼지에서는 P₄의 생산원은 황체이고 에스트로겐의 생산원은 태반이므로, 같은 조직에서 대사경로의 변화가 일어나는 것은 아니다. 소나 돼지에서는 태반으로부터의 에스트로겐이 태아 부신의 코르티솔 생산보다도 더 이른 시기부터 증가를 시작하는데, 양과 비교하여 어떤 의미를 갖는지는 불분명하다. 최근 소 임신 후기에 모태반 자궁내막 실질 내의 부신피질호르몬 수용체 증가가 관찰되어, 태아 혈중 코르티솔 증가(모체에 대한 부신피질호르몬 투여에서도 마찬가지)가 자궁내막 PGF₂α를 직접 자극하여 단번에 황체퇴행을 진행시킬 가능성이 시사되고 있다¹⁴⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="154">•</span><span><i>그림 1-3-8 양에서의 분만 발래 기전 (문헌 13에서 인용·개변)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">순환기·혈액계의 발달과 생리</div>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>심·혈관계는 가장 일찍 기능을 시작하는 기관이다. 소의 조기 임신진단 초음파검사에서 배의 심박동을 가지고 양성 소견으로 삼는 경우가 있다(31~40일).</span></p>
<p class="bx-num"><span class="bxn" data-n="156">•</span><span>포유동물에서는 태반의 제정맥에서 혈액 공급을 받아 간을 경유하지 않고 후대정맥에 문합하는 경로가 있다(정맥관). 후대정맥으로부터의 혈액은 분할즐(分割櫛)<sup>주1)</sup>에 의해 대부분이 난원공을 지나 좌심방으로 유입된다. 이 혈액은 다시 좌심실에서 전대동맥으로 구출됨으로써 심장과 뇌에는 산소포화도<sup>주2)</sup>가 높은 혈액이 공급된다. 한편 전대정맥에서 우심방으로 유입된 산소포화도가 다소 낮은 혈액은 우심실에서 폐동맥으로 들어가 대부분은 동맥관의 우회로를 경유하여 후대동맥에 합류한다(폐동맥 혈압은 대동맥 혈압보다 수 mmHg 높다). 따라서 태아기의 혈액은 완전한 동정맥혈의 분리가 이루어지지 않지만, 일반적으로 심박출량은 우심실에서 많고 산소포화도는 좌심실에서 높다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="157">•</span><span><i>그림 1-3-9 난원공의 폐쇄 기전 (문헌 15에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>출생 후에는 말초순환 저항이 급격히 증가하기 때문에 대동맥압이 상승한다. 폐포가 펼쳐짐으로써 폐혈관 저항은 저하되고 폐동맥압 저하와 우심방압 저하가 일어난다. 이에 따라 폐로의 혈류량은 증대하고, 폐에서 환류하는 혈액도 증가하기 때문에 좌심방압이 상승한 결과 난원공은 폐쇄, 유착한다. 나아가 동맥관이 위축, 폐쇄됨으로써 폐순환이 완성됨에 따라 신생자는 폐에 의한 자연호흡을 획득한다. 동맥관의 폐쇄는 만기 출생 사람 신생아에서는 24시간 이내에 50%, 48시간까지 90%, 72시간까지는 통상 완전히 폐쇄된다¹⁵⁾(그림 1-3-9).</span></p>
<p class="bx-num"><span class="bxn" data-n="159">•</span><span>태아 혈관을 확장 유지하고 있는 물질은 PG이며, 특히 PGE₂가 중요한 역할을 하고 있다. 이 PGE₂는 혈관 내에서도 만들어지지만, 태아 내에서 순환하는 많은 PGE₂는 태반 유래이다. PG 이외의 물질이 간에서 대사되는 데 비해 PG는 폐에서 대사되는 특징을 가지므로, 태아기에는 폐혈액순환이 적고 PG 대사가 낮기 때문에 태아 혈중에는 PGE₂가 높은 농도로 유지된다. 한편 임신 말기 태반에서의 혈액공급량의 급격한 증가나 태반염 등의 자극은 태아태반에서 다량의 PGE₂를 생산하여 분만 발래의 방아쇠가 되는 것으로 알려져 있다. 이상으로부터 태아태반에서 적당한 PGE₂가 생산되고 있는 동안에는 임신이 계속되지만, 일단 다량의 PGE₂가 방출되면 분만 개시의 자극이 된다. 나아가 분만 후에는 PGE₂ 생산원인 태반과 분리되기 때문에 신생자 혈중 PGE₂ 농도가 감소하고, 신생자나 태반의 혈관은 축소 또는 폐쇄하게 된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="160">•</span><span>한편 난산에 동반하는 출생 후 저산소혈증이나 저체온증에 빠지면 노르아드레날린에 의한 폐동맥 수축, 태아 혈관으로부터의 PGE₂ 생산이 야기되어 난원공 및 동맥관의 폐쇄 지연, 태아 혈액순환 온존으로 인해 저산소혈증은 더욱 진행된다. 동맥관이 폐쇄되지 않으면 대동맥혈이 동맥관을 경유하여 폐동맥으로 역류 현상을 일으킨다(대동맥압>폐동맥압). 그 후 혈액은 좌심방→좌심실→대동맥→동맥관→심장으로 순환하므로 혈액은 전신을 돌지 못하고 심장에 큰 부담이 가해지게 된다. 이 상태가 지속되는 것은 생체에 있어 위기적 상태이며, 생명 유지에 중요한 장기인 뇌, 심근, 부신으로의 혈류를 우선하기 위해 말초의 피부, 근육, 장관으로의 혈류는 선택적으로 억제된다(혈액 재분배 현상). 이러한 상황을 한시라도 빨리 해소하기 위해 산소 흡입이나 보온을 적극적으로 실시하여 태아기 혈액순환에서 성체형 혈액순환으로 되돌릴 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="161">•</span><span>태아기 혈액세포의 생산 부위는 배와 태아의 발육에 따라 난황낭→간→골수로 변천한다. 또한 적혈구에 포함된 헤모글로빈(Hb)에는 배성 Hb, 태아 Hb 및 성체 Hb의 3종류가 있다. 태아 Hb는 산소결합력이 높아 태반에서의 낮은 산소 혈액으로부터 많은 산소를 결합할 수 있다. 많은 출생 직후 신생자의 털이 없는 부위나 사람 신생아가 붉게 보이는 것은 산소결합력이 강한 태아 Hb의 영향이다. 출생 전부터 태아 Hb와 성체 Hb는 교체되기 시작하지만, 출생 후에는 그 속도가 급격히 빨라져 신생자 황달의 원인이 되기도 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="162">•</span><span><i>그림 1-3-10 출생 전후 양에서 동맥혈 산소함량과 뇌혈류량의 관계 (문헌 16에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="163">•</span><span><i>그림 1-3-11 양 태아, 신생자에서 뇌 글루코스 이용의 추이 (문헌 17에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>태아의 뇌혈류량은 태아 성장에 따라 크게 변화한다. 양 태아의 뇌혈류량은 임신 중기에 55 mL/100 g/분인 데 비해 임신 말기에는 225 mL/100 g/분으로 급증한다. 이 증가량은 신체 성장만으로는 설명이 곤란하며, 뇌의 기능적 증대가 시사된다(시냅스의 증대). 출생 후의 뇌혈류량은 1/3 정도로 격감하지만, 그 차이는 산소함량의 증대에 의해 보충되는 것으로 생각된다. 그러나 출생 후 2시간은 물론이고 24시간이 경과해도 산소함량에는 개체차가 크며, 이러한 차이가 그 후의 발육에 영향을 미칠 가능성이 있다¹⁶⁾(그림 1-3-10). 또한 이들 뇌혈류량의 변화는 뇌의 산소소비량과 글루코스 소비량의 추이를 반영하고 있다¹⁷⁾(그림 1-3-11). 저혈당 시에는 뇌혈류량이 급격히 증대하는 것, 나아가 글루코스뿐 아니라 젖산도 이용하는 것이 알려져 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="165">•</span><span>※ 주1) 분할즐: 우심방으로 유입된 하대정맥혈이나 상대정맥혈을 우심실이 아니라 난원공으로 유도하기 위한 홈이다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="166">•</span><span>※ 주2) 산소포화도(SpO₂): 적혈구의 헤모글로빈 중 산소와 결합하고 있는 비율을 말하며, 정상 동맥혈의 포화도는 96% 이상이다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="167">•</span><span>■ 호흡기계의 발달과 생리</span></p>
<div class="bx-sub"><div class="bx-subtitle">폐포의 발달</div>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>사람에서는 수정 후 4주령부터 폐가 발달하고, 20~24주경부터 폐상피세포는 I형 폐포세포와 II형 폐포세포로 분화한다. 24주경부터 입방상피세포의 다수는 편평화하여 폐포가 완성된다. I형 폐포세포는 입방상피세포 주위에 있는 얇고 편평한 세포로, 폐모세혈관의 산소와 이산화탄소 교환을 하지만 세포가 얇아서 취약하다(폐포상피의 95%를 차지한다). 입방상피세포인 II형 폐포세포는 I형 폐포세포가 손상되면 I형 폐포세포로 변화하여 조직을 수복하는 작용을 갖는다. I형 폐포세포는 매우 얇기 때문에 폐모세혈관으로부터의 누출액이 폐수(肺水)로서 저류한다. II형 폐포세포는 폐 서팩턴트(surfactant)의 생산을 24주령부터 조금씩 시작하지만, 일정 수준에 달하는 것은 35주령 이후이다. 사람 태아는 12주령이 되면 양수 속에서 호흡양 운동을 시작하는데(호기와 흡기의 균형이 잡히는 것은 30주령 이후), 이는 출생 후의 호흡 준비로 여겨진다. 이 운동에 의해 양수 중에 폐수가 방출되기 때문에(사람 태아에서 임신 말기 150 mL/일) 양수 중에도 폐 서팩턴트가 포함된다. II형 폐포세포가 강한 손상을 받으면 폐포는 수복되지 못하고 섬유화를 일으켜 폐기능이 크게 손상된다. 폐용량·폐포면적은 27주령부터 급속히 발달하여 출생 시의 폐포 수는 2,400만 개에 달하는데, 이는 성인의 10% 이하의 수이다. 양, 소에서도 기본적으로는 사람과 마찬가지로 발달한다고 생각되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">양수 중 폐 서팩턴트의 발달과 생리</div>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>양수 중에 포함된 폐 서팩턴트에는 스핑고미엘린(뇌신경계에 많다)과 레시틴(폐포 유래)이 있으며, 스핑고미엘린이 임신기간을 통해 일정한 데 비해 레시틴은 임신 말기에 걸쳐 증가하는 것으로 알려져 있다. 따라서 레시틴과 스핑고미엘린의 비(L/S)를 측정하여 폐포의 성숙도를 판정하는 방법이 인의학에서 종래부터 사용되고 있다. 사람에서는 30주령 이후 L/S비가 급증하고, L/S비가 2 이상에 달하는 35주령 이후에 거의 호흡 준비 체제가 갖추어진다고 여겨진다. 소 양수 중의 레시틴과 스핑고미엘린을 임신월령마다 측정한 결과 거의 사람과 같은 추이를 보였다. 즉 스핑고미엘린이 임신기간을 통해 거의 일정한 데 비해 레시틴은 8개월령 이후에 증가하고(L/S비: 약 2), 9개월령에 더욱 증가하였다(L/S</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>비: 약 3)(그림 1-3-12).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="171">•</span><span><i>그림 1-3-12 소 양수 중 L/S비의 임신월령별 추이 (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="172">•</span><span><i>그림 1-3-13 소 태아의 배양 폐세포에서 코르티솔 첨가에 의한 임신월령별 레시틴 생산능 (문헌 12에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>또한 분만 발래에 관여하는 부신피질호르몬이 폐 서팩턴트 생산을 촉진하는 것이 양에서 증명되어 있다¹⁸⁾. 태아에 대한 코르티솔 투여는 폐의 세포분열을 억제하고, 그 대신 폐 서팩턴트를 분비시킨다고 한다¹⁹⁾. 이처럼 몇몇 동물에서 코르티솔과 폐 성숙의 관계가 알려져 있다. 그래서 津曲은 소 태아의 폐세포를 배양하여 코르티솔에 의한 폐 서팩턴트 생산 반응성을 검토하였다. 태아 폐세포에서 코르티솔에 대한 레시틴 생산은 임신 9개월에 현저히 증가하였으나(그림 1-3-13), 스핑고미엘린의 증가는 보이지 않았다. 또한 임신 4~5개월령에서는 코르티솔에 의한 폐세포 증식 억제 효과가 보이지 않았던 데 비해, 9개월령에서는 명백히 세포 증식이 억제되었다. 그러나 코르티솔의 세포 증식 억제 작용은 생리적 농도에서는 일어나지 않고 고농도 코르티솔에서만 나타나는 현상이라는 보고도 있다²⁰⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>출생 후 신생자의 자연스러운 호흡의 개시는 태반 박리나 제대 폐쇄 등에 의해 먼저 산소분압과 혈중 pH의 저하와 탄산가스 분압의 상승을 초래하고, 이 자극이 횡격막 반사에 의한 흉강 내 음압을 가져옴으로써 최종적으로는 폐쇄되어 있던 폐를 확장하여 야기된다. 통상 분만이 정상적으로 경과한 경우에는 출생 후 60초 이내에 자발적인 호흡운동이 시작된다. 횡격막 반사에는 피부의 촉각이나 차가운 외기 자극도 촉진 인자가 된다. 최초의 호흡운동에 의해 공기가 유입되어 폐가 확장된다. 그러나 호흡 개시 전에 폐포에 가득 차 있던 폐수가 출생 직후에 배출되어야 한다. 그러기 위해서는 동맥관 폐쇄나 난원공 폐쇄가 순조롭게 진행되어 폐로의 순환혈액량이 증가할 필요가 있다(그림 1-3-14).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="175">•</span><span><i>그림 1-3-14 출생 전후 폐수의 모식도 — 폐혈액순환이 시작되고 폐수는 흡수된다.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="176">•</span><span>미숙 신생자에서의 폐 서팩턴트 저값, 난산에 의한 부종에 기인하는 체액의 증가나 태아로부터의 태변 배출에 의해 폐 서팩턴트 작용이 저하된 경우 호흡곤란증후군(RDS)을 발증하는 경우가 있다. 출생 후 동맥관은 산소분압이 높아짐으로써 폐쇄되지만, RDS나 신생자 가사(假死)처럼 산소 공급이 충분하지 않은 경우 동맥관의 폐쇄가 저해되어 동맥관개존증(PDA)이 생후에도 지속되는 경우가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">폐 서팩턴트 관련 단백질</div>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>폐 서팩턴트 관련 단백질(SP)로는 SP-A, B, C, D의 4종류가 있으며, SP-B와 SP-C는 소수성 단백질로 폐 서팩턴트와 강고하게 결합하고 있어 표면활성 발현에 불가결한 성분이다. 한편 SP-A와 SP-D는 감염방어 기능에 관련되어 있다. 이들 단백질은 폐 서팩턴트와 병행하여 증가하며, 폐 성숙의 지표로도 이용된다. 외계에 면하는 점막에서는 점액, 면역글로불린(Ig) A, 락토페린 등뿐 아니라 다양한 세균감염 방어 기능이 요구되므로, 향후 폐포 점막에서 SP-A나 SP-D의 역할 해명이 기대된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소화기계의 발달과 생리</div>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>당초 초식동물은 동아프리카 삼림지대의 부드러운 풀을 먹고 있었으나, 3,400만 년 전쯤부터 한랭화에 따라 삼림이 감소하고 반대로 초원이 많아졌다. 이 초원에 있는 딱딱한 풀을 소화할 수 있게 된 것이 반추동물이나 말과 동물이다. 특히 식물섬유의 분해능은 반추동물이 말보다 효율적이다. 반추동물에서는 발생 초기에 1개의 위가 4개의 위로 분화한다. 당초 위의 크기는 제1위>>제4위이지만, 임신 7개월에는 거의 같아지고 그 후에는 제1위<제4위(출생 직후 1:2)가 된다. 생후 먹이를 먹게 되면 다시 제1위가 발달하여 성체에서는 10:1의 비율이 된다. 태반 형성 후의 태아에서는 조직영양에서 혈액영양으로 이행하지만, 상피융모성 태반(돼지, 말)이나 결합조직융모 태반(반추동물)에서는 태반 형성 후에도 조직영양의 보급은 임신기간을 통해 계속된다. 나아가 임신이 진행됨에 따라 양수를 소화관에서 흡수하는 영양보급이 더해진다. 이는 출생 후 소화흡수 훈련의 역할도 갖는다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="179">•</span><span><i>그림 1-3-15 임신 8개월령 소 태아의 복부(이미지) — 임신 말기의 제4위 내에는 양수가 충만해 있으나, 출생 후 양수는 흡수된다. (문헌 5의 CT상으로부터 작도)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">출생 시 소화기의 상황과 포유 의욕</div>
<p class="bx-num"><span class="bxn" data-n="180">•</span><span>출생 시 신생자의 제4위에는 양수가 많이 포함되어 있으며, 이 양수가 소장으로 이동하거나 흡수되지 않는 한 초유 섭취는 곤란하다(그림 1-3-15). 특히 출생 후의 저체온이나 난산에 의한 저산소혈증 상태에서는 노르아드레날린에 의한 폐동맥 수축에 이어 난원공 및 동맥관의 폐쇄부전을 일으키기 때문에 저산소혈증 상태가 더욱 진행된다. 저산소 상태가 계속되면 혈액 재분배에 의해 소화기 등 말초기관으로의 혈류가 억제되기 때문에 제4위의 양수 흡수는 진행되지 않고, 출생 후 이른 시기의 포유 의욕은 기대할 수 없게 된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">임신기 저영양이 태아, 신생아에 미치는 발육 영향</div>
<p class="bx-num"><span class="bxn" data-n="181">•</span><span>영국 환경역학의 권위자인 David Barker는 1980년대에 "사람 태아기에 저영양 상태인 것이 성인기 심혈관장애의 위험 인자가 된다"고 하는 "바커 가설"을 발표하였으나, 당시에는 전혀 찬동을 얻지 못하였다. 그 가설이란 태아가 저영양 상태에 노출되면 태아가 그 환경에 적응하려는 결과 근육량의 감소, 신장 네프론 수의 감소, 췌장 β세포의 감소 등이 일어난다. 이들 변화는 태어난 후에도 영속적으로 계속되기 때문에 태어난 아이가 성인이 된 후 고혈압, 당뇨병, 심근경색 등의 발증 위험을 증대시킨다는 것이다. 현재 이 가설은 많은 연구자로부터 지지를 받게 되었다²¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>태아는 혈액이나 단백질을 만들기 위해 많은 철을 필요로 하는데, 모체가 충분히 철을 공급하지 못하면 신생아의 심실중격결손증 등의 원인이 된다고 여겨진다. 또한 임신 초기에 엽산이 부족하면 이분척추증 등의 선천성 기형이 증가할 가능성이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>이상의 지견은 사람에서의 연구 성과이지만, 같은 포유류로서 소에도 들어맞을 가능성은 부정할 수 없다.</span></p>
<p class="bx-num"><span class="bxn" data-n="184">•</span><span><span style="color:var(--ink-soft)">(저자: 津曲茂久)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span><span style="color:var(--ink-soft)">일본송아지 제1장 태생기의 생리와 관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">1-4 태아의 영양과 성장</div>
<p class="bx-num"><span class="bxn" data-n="186">•</span><span>임신 말기에는 경산우에서는 모체의 신체충실지수(body condition)를 조정하여 전 비유기에 소모된 소화기관과 유선을 회복시킴과 동시에 태아를 순조롭게 생육시키는 것이 필요하다. 또한 최근에는 초산 시의 유량도 현저히 증대하고 있어, 임신 말기에는 모우, 태아 및 유선의 성장에 충분한 양의 양분을 공급하도록 주의할 필요가 있다. 그 때문에 태아의 양분 대사에 대한 이해를 깊게 하는 것은 임신 말기의 정밀한 사양관리에 기여하게 되며, 건강한 송아지를 얻음과 동시에 모우의 비유 및 번식성적에 좋은 영향을 미칠 것으로 생각된다.</span></p>
<div class="bx-sub"><div class="bx-subtitle">태아의 영양원</div>
<p class="bx-num"><span class="bxn" data-n="187">•</span><span>태아의 성장 속도는 임신 초기에는 완만하지만 임신 말기의 약 3개월간 급격히 증대한다¹⁾(그림 1-4-1). 태아의 성장과 에너지 대사에 필요한 영양소는 주로 글루코스와 아미노산으로 공급되고 있으며, 표 1-4-1에는 임신 말기 소에서 태아 성장에 관한 에너지와 질소의 공급원과 요구량이 제시되어 있다²⁾. 포식시킨 산양 태아의 글루코스와 젖산염의 대사를 직접 측정한 결과, 이들 영양원이 태아의 대사에서 차지하는 비율은 50~60%였다는 보고가 있다. 반추동물에서는 단쇄나 장쇄 지방산이나 케톤체는 태반을 잘 통과하지 못하기 때문에, 아세트산은 임신 말기 소 태아의 에너지원으로서는 대략 10~15% 정도를 차지하는 것으로 생각되고 있다. 나머지 30~40%의 에너지원은 아미노산이라고 생각된다. 소와 면양 태아에서 아미노산의 정미(正味) 흡수량을 구한 보고에서는 아미노산이 에너지원으로서 50%를 차지하고 있었다고 제시하고 있다³⁾. 표 1-4-1에서는 임신 말기 소의 태아에서 흡수된 아미노산의 32%(12/38, g/일)밖에 조직에 축적되지 않는다. 이는 정미 요구량에 대해 대사 아미노산량은 3배 공급할 필요가 있다는 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="188">•</span><span>임신 말기 태아로의 지방 축적량은 매우 낮은 경향이 있는데, 이는 모체 혈중의 장쇄 지방산이 태반을 통과하지 못하기 때문이라고 생각된다. 또한 임신 말기 태아의 지방세포에서 지방산 합성 능력이 상당히 낮기 때문이라고도 생각된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="189">•</span><span><i>그림 1-4-1 소의 태아, 양수, 태막 및 자궁의 중량과 임신일수의 관계 (문헌 1에서 인용·개변)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">태반과 자궁의 대사</div>
<p class="bx-num"><span class="bxn" data-n="190">•</span><span>자궁 및 태반의 조직(태반, 자궁내막, 자궁근층)은 임신 말기에는 임신자궁 전체 중량의 20% 정도를 차지하는 데 지나지 않는다. 그러나 소나 면양에서는 이들 조직이 자궁에 흡수된 산소의 35~50%, 그리고 글루코스의 65%를 소비하고 있음이 확인되어 있다. 자궁에 흡수된 글루코스는 그 30~40%가 젖산염으로 변환되어 모체나 태아의 혈액 중으로 방출된다³⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="191">•</span><span><i>표 1-4-1 임신 말기 소 태아의 에너지와 질소원 및 요구량</i></span></p>
<p class="bx-num"><span class="bxn" data-n="192">•</span><span><div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>에너지 (kcal/일)</th><th>질소 (g/일)</th></tr><tr><th>■ 기질</th><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>글루코스 및 젖산염</th><td style="text-align:left">775</td><td style="text-align:left">—</td></tr><tr><th>아미노산</th><td style="text-align:left">1,306</td><td style="text-align:left">38</td></tr><tr><th>아세트산</th><td style="text-align:left">255</td><td style="text-align:left">—</td></tr><tr><th>합계</th><td style="text-align:left">2,336</td><td style="text-align:left">38</td></tr><tr><th>■ 요구량</th><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>조직 축적</th><td style="text-align:left">605</td><td style="text-align:left">12</td></tr><tr><th>심장</th><td style="text-align:left">1,605</td><td style="text-align:left">—</td></tr><tr><th>요소</th><td style="text-align:left">125</td><td style="text-align:left">23</td></tr><tr><th>합계</th><td style="text-align:left">2,335</td><td style="text-align:left">35</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="193">•</span><span>임신 250일의 홀스타인에서 태아 체중을 35 kg으로 하여 시산. (문헌 2에서 인용·개변)</span></p>
<p class="bx-num"><span class="bxn" data-n="194">•</span><span>또한 태아태반에 흡수된 글루코스는 프럭토스로 변환되어 태아의 혈중으로 방출된다. 반추동물의 태아 혈중 프럭토스 농도는 높고 태반에서 왕성하게 생성되지만, 대사 회전 속도는 느려 에너지원으로서는 글루코스의 1/5 정도이다⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>소의 태반은 임신 230일경까지 성장하고 있는 것으로 알려져 있다¹⁾. 자궁태반에서 아미노산의 대사가 활발히 이루어지고 있다고 보고되어 있지만, 이 기전에 대해서는 소에서 아직 해명되지 않았다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="196">•</span><span>■ 태아의 양분 요구량</span></p>
<div class="bx-sub"><div class="bx-subtitle">임신 시의 에너지 및 단백질 요구량</div>
<p class="bx-num"><span class="bxn" data-n="197">•</span><span>Jakobsen 등이 1957년에 소의 태아, 자궁 및 태반 등의 에너지 축적량을 직접 측정한 결과를 나타낸, 임신일수에 대한 이들의 합계 에너지 축적곡선⁵⁾은 그 후 많은 연구자에게 인용되고 있다. 홀스타인의 임신 시 태아로의 단백질 축적량은 Bell 등의 1995년 관찰 결과⁶⁾가 참고가 된다. 흑모화종(黒毛和種)에서 임신 시의 에너지 및 단백질 축적량은 1983년에 吉田 등에 의해 임신일수를 변수로 한 식이 제시되어 있다⁷⁾. 유용우의 임신 시 대사에너지 요구량은 Moe와 Tyrrell이 1972년에 보고한 97예의 대사시험 결과⁸⁾로부터, 또한 흑모화종 임신우에서는 岩崎 등에 의한 1986년의 대사시험 결과⁹⁾로부터 임신 말기의 1일당 대사에너지 요구량이 구해져 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">에너지 이용효율</div>
<p class="bx-num"><span class="bxn" data-n="198">•</span><span>모우가 섭취한 대사에너지가 태아에 의해 이용되는 효율은 유용우에서 10.5%, 헤리퍼드에서 14%, 흑모화종에서 15%라는 보고가 있다. 이들 태아 축적으로의 대사에너지 이용효율 값은 유지로의 이용효율이 70~80%, 비유에서 60~70%, 발육이나 비육에서 40~60%라고 하는 것과 비교하면 현저히 낮다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="199">•</span><span>■ 태아의 성장에 영향을 미치는 요인</span></p>
<div class="bx-sub"><div class="bx-subtitle">혈류량</div>
<p class="bx-num"><span class="bxn" data-n="200">•</span><span>태아로의 양분 공급을 제어하는 요인으로 생각되는 것으로 자궁 및 제대 동정맥의 혈류량을 들 수 있다. 소의 임신자궁으로의 혈류량은 임신 137일에 비해 250일에는 4.5배로, 제대의 혈류량은 21배가 되어 있다¹⁰⁾. 임신 말기 면양의 급여량을 제한함으로써 자궁을 통과하는 혈류량은 저영양의 경우 32% 감소하고, 그 결과 자궁에서의 산소와 글루코스 흡수량은 각각 63% 및 66% 저하한다¹¹⁾. 최근 면양에서의 연구에서는 미경산의 성장 중인 임신 면양에서는 분만 전 영양 과다의 경우에도 적절한 영양관리의 임신 면양에 비해 자궁동맥 혈류량이 저하하고 태아의 출생 시 체중이 감소한다는 보고가 있다¹²⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="201">•</span><span>2001년에 Nishida 등은 임신우의 복부를 기립위 그대로 절개하고 촉진으로 자궁동맥에 초음파 혈류량 센서를 장착함으로써 분만 전 유용우의 자궁동맥 혈류량을 연속적으로 장기간 측정할 수 있는 수법을 개발하였다¹³⁾. 이 수법을 사용하여 임신 220, 250 및 266일째 홀스타인 경산 임신우의 중자궁동맥 혈류량을 측정한 결과, 각각 6.7, 8.9 및 8.8 L/분이었다. 또한 같은 수법을 사용하여 홀스타인 경산 임신우의 임신 226, 248 및 269일(분만 전 8주간)에서 기립 및 횡와 시의 중자궁동맥 혈류량을 측정하였다. 그 결과 중자궁동맥 혈류량은 기립과 횡와 시에 각각 8.0과 8.8 L/분, 9.9와 11.1 L/분, 그리고 8.1과 9.7 L/분으로, 모두 횡와 시 쪽이 유의하게 증가하였다¹⁴⁾. 나아가 홀스타인 경산 임신우 4두의 양측 자궁동맥에 초음파 혈류계를 장착하고 임신 약 226, 248 및 269일에 혈류량을 측정한 결과, 임신각, 비임신각 측에서 각각 7.98과 2.36 L/분, 8.88과 2.88 L/분, 7.77과 3.21 L/분이었다¹⁵⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">환경온도(더위)</div>
<p class="bx-num"><span class="bxn" data-n="202">•</span><span>임신기간 중의 열 스트레스는 태반의 중량, 태반 유래 호르몬 농도 및 자궁과 제대 혈류량을 감소시킨다. 또한 임신 말기의 열 스트레스는 임신기간을 단축시켜 출생 시 체중의 감소를 일으킨다¹⁶⁾. 임신 100일째의 소를 더위 환경하에서 사육한 경우 임신 180일째에는 태아의 중량이 22% 감소하였다. 그때 자궁 및 제대 혈류량은 각각 50 및 30% 저하되어 있었다. 태아의 산소 및 글루코스의 정미 흡수량은 열 스트레스에 의해 22% 및 65% 저하하고, 자궁태반 조직에서의 흡수량은 산소에서 49%, 글루코스에서 42% 감소하였다¹⁷⁾. 이로부터 열 스트레스는 태아에 대해서보다 자궁태반 조직에서의 에너지 대사에 대한 영향 쪽이 크다는 것을 알 수 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">품종</div>
<p class="bx-num"><span class="bxn" data-n="203">•</span><span>1991년에 Ferrell은 샤롤레와 브라만 소를 사용하여 모체의 품종 차이가 태아의 성장에 미치는 영향에 대해 검토하였다¹⁸⁾. 샤롤레 태아의 경우 임신 230일에서의 태반 중량 및 자궁 혈류량은 모우가 브라만에서는 각각 4.7 kg, 4.7 L/분이고, 모우가 샤롤레에서는 각각 5.6 kg 및 9.2 L/분으로, 모두 샤롤레 모우 쪽이 큰 값을 보이고 있다. 또한 임신 230일에서는 모우의 품종은 태아의 체중에 영향이 없었으나, 임신 270일에서의 샤롤레 태아의 체중은 모우가 브라만인 경우는 33.9 kg, 샤롤레인 경우는 46.9 kg으로 큰 차이가 보여, 태아의 성장에는 모체의 환경이 크게 영향을 미치고 있다는 결과를 얻었다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">모체의 영양상태</div>
<p class="bx-num"><span class="bxn" data-n="204">•</span><span>모체에서 태아로의 글루코스 수송은 반추동물에서는 촉진확산<sup>주1)</sup>에 의해 이루어지므로, 모체와 태아의 혈중 글루코스 농도 차이 및 태반에서의 수송능력이 매우 중요한 역할을 갖는다¹⁶⁾. 그 때문에 모체 측의 혈중 글루코스 농도가 감소하면 농도 차이가 감소하여 결과적으로 임신자궁으로의 흡수량이 저하하게 된다¹⁹⁾. 또한 촉진확산을 하는 담체의 양은 태반의 크기에 비례하므로 태반의 성장은 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="205">•</span><span>그런데 임신 말기의 산양을 5일간에 걸쳐 절식시킨 경우에도 태아로의 아미노산 흡수량에는 거의 영향이 없다. 이는 대부분의 아미노산이 능동수송으로 흡수되기 때문에 모체의 혈중 아미노산 농도에 영향을 받지 않기 때문일 것으로 생각된다. 다만 에너지 부족 상태가 오래 계속되면 글루코스 부족을 보충하기 위해 에너지원으로서 아미노산을 이용하게 되어 단백질 합성이나 태아 조직의 축적이 희생되고, 결과적으로 태아 발육 지연이 생기게 된다²⁰⁾. 태아의 골격근은 뇌나 심장에 비해 영양 분배의 우선순위가 낮아 특히 영양부족의 영향을 받기 쉽다. 출생 후에 근섬유 수는 증가하지 않기 때문에 태아기 동안의 골격근 발달은 중요하다. 모우로의 단백질 보급이 송아지의 출생 시 체중을 증가시키고 태아 근육의 성장을 잠재적으로 바꿀 가능성이 있음이 제시되어 있다²¹⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="206">•</span><span>※ 주1) 촉진확산: 생체막을 물질이 통과하는 양식의 하나로, 농도 기울기에 따르는 확산의 일종이지만 막에 담체(지질 이중층에 삽입된 단백질)가 있어 확산을 돕는 방식. 에너지는 사용하지 않는다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">호르몬</div>
<p class="bx-num"><span class="bxn" data-n="207">•</span><span>태아 중의 렙틴<sup>주2)</sup> 농도는 임신 40~130일의 면양에서 끊임없이 상승하고 있으나, 임신 130일째 태아의 체중이나 태반 중량과는 관계가 없었다는 보고가 있다²²⁾. 태아의 렙틴 유전자는 뇌와 간에서는 임신기간 전반에 걸쳐 관찰되지만, 지방 중에는 임신 100일째 이후에 관찰된다. 임신 130일째 이후 태아의 신장 주위 지방세포 중 렙틴 유전자량은 모체의 1/10 정도였다. 대조적으로 태반 조직이나 자궁 조직에서는 전혀 관찰되지 않았다. 임신 122~135일의 면양 사료 급여량을 요구량의 55%까지 감소시키면 태아 혈중 렙틴 농도에는 변화가 없지만 모체 혈중 렙틴 농도는 급격히 감소한다. 임신 초기의 태아 렙틴은 대부분이 지방조직 이외의 유래이며, 분만이 가까워짐에 따라 지방조직에서 분비된다. 태아 혈중 렙틴은 현재로서는 그 역할이 밝혀져 있지 않다.</span></p>
<p class="bx-num"><span class="bxn" data-n="208">•</span><span>임신 말기 모체의 인슐린유사성장인자(IGF)-1<sup>주3)</sup> 농도는 임신우 쪽이 비임신우보다 높다. 임신 15주째 이후에 그 차이가 현저해진다. 임신 초기부터 중기에 걸쳐 IGF-1 농도는 상승해 가지만 임신 말기가 되면 서서히 감소하기 시작한다. 이러한 간에서 분비되는 IGF-1 농도의 변화는 사료 섭취량에 의한 영향을 받고 있기 때문으로 생각된다²³⁾. 태아 혈중 IGF-1은 태아의 체단백으로부터의 아미노산 동원을 억제하는 작용이 알려져 있다. 그러나 현재로서는 태아 간 중의 성장호르몬(GH) 수용체 발현이나 태아 혈중 IGF-1 농도가 낮은 것 등으로부터, 태아 기간 중에는 GH와 IGF-1에 의한 대사 제어 기구가 미발달 상태인 것이 아닌가 생각되고 있다. 양에서는 임신 후기에 모체 혈중 IGF-1을 증가시키면 모체 혈중 인슐린, 글루코스 및 유리지방산이 증가함으로써 임신자궁에 의한 영양소 흡수에 유리하게 모체 대사가 전환되었다. 또한 태반의 대사 기능도 변화하여 태아로의 글루코스와 젖산 흡수를 촉진하는 것이 시사되어 있다²⁴⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="209">•</span><span>태반성 락토겐(placental lactogen: PL)<sup>주4)</sup>은 양이나 산양, 사람 등에서 임신 중기경부터 혈중에 출현하여 분만까지 값이 상승을 계속하고 분만과 함께 소실된다. 이러한 분비 패턴으로부터 유선 발육에 큰 역할을 하고 있는 것으로 여겨지지만, 태아의 발달을 유지하기 위해 양분을 분배하는 데 잠재적으로 관여하고 있다고도 생각되고 있다²⁵⁾. 임신 양에 유지량으로 제한하거나 자유 채식할 수 있게 한 실험을 실시한 결과, 임신 말기에는 유지량 급여구 쪽이 모체의 증체나 신체충실지수(BCS)는 낮았으나 PL이나 프로게스테론(P₄) 농도는 높고(그림 1-4-2), 태반 중량과 새끼양의 출생 시 체중이 컸다²⁶⁾. Rasby 등은 BCS가 낮거나 적절한 임신우의 모체 혈장 중 영양소와 PL 농도를 관찰했다²⁷⁾. 어느 쪽도 태아 성장에 유의차는 없었다. 모체 혈장 중 PL 농도는 BCS가 낮은 소 쪽이 높았다. BCS가 낮은 소에서는 자궁 중량은 작았지만, 요막 및 태반엽의 중량은 BCS가 적절한 소보다 컸다. 이는 PL이 BCS가 낮은 소의 태아 태반에 도달하는 영양소의 양을 증가시키는 메커니즘을 갖고 있음을 시사한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="210">•</span><span>이처럼 모체의 영양 상태와 태아의 발육은 단순한 양의 상관관계에 있는 것이 아니라, 여러 조절 기구가 작동하여 저영양 상태에 대비하고 있을 가능성이 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="211">•</span><span>※ 주2) 렙틴: 주로 지방세포에서 분비되는 펩타이드 호르몬. 사료 섭취량, 에너지 대사 및 체중 조절에 관여한다. 최근에는 렙틴을 매개로 영양 상태와 생식이 밀접하게 관계한다고 생각되고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="212">•</span><span>※ 주3) 인슐린 유사 성장인자(IGF)-1: 주로 간에서 분비되는, 인슐린과 유사한 구조를 가진 펩타이드 호르몬. 성장호르몬의 자극에 의해 분비된다. 인슐린과 마찬가지로 당·아미노산의 막 투과 촉진, RNA 합성·단백질 합성 촉진 등의 동화 촉진 활성을 가진다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="213">•</span><span>※ 주4) 태반성 락토젠(PL): 영장류, 설치류 및 반추류 등의 태반에서 분비되는 펩타이드 호르몬.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="214">•</span><span><i>그림 1-4-2 양의 임신기간 중 태반성 락토젠 및 P₄ 농도 (문헌 25에서 인용·개변)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="215">•</span><span><span style="color:var(--ink-soft)">(저자: 西田武弘)</span></span></p>
