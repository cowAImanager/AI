<div class="bx-sub"><div class="bx-subtitle">표 1 젖소의 동물복지 평가법</div>
<p class="bx-num"><span class="bxn" data-n="135">•</span><span>(대상 약어) 착유우 TS: 계류(타이스톨), 착유우 FS: 프리스톨, 착유우 FB: 프리반, 육성: 육성우, 포유: 포유 송아지</span></p>
<p class="bx-num"><span class="bxn" data-n="136">•</span><span>표 1-A 동물 베이스 평가기준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>평가항목</th><th>대상</th><th>평가기준</th><th>점검방법(측정방법)</th></tr><tr><th>BCS</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">BCS<sup>주1)</sup> 2.0 이하인 소가 1마리도 없다</td><td style="text-align:left">횡와하고 있는 소를 제외하고 가능한 한 전두 조사한다. 해당 소가 있으면 그 개체번호를 기록한다</td></tr><tr><th>우체의 청결도</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">청결도 스코어<sup>주2)</sup> 3과 4로 분류된 소의 비율이 ①대퇴 35% 이하, ②유방 9% 이하이다</td><td style="text-align:left">무작위로 선정한 30마리 이상을 조사한다(단, 조사 대상우가 30마리 미만이면 가능한 한 전두 조사)</td></tr><tr><th></th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">청결도 스코어 3과 4로 분류된 소의 비율이 ①대퇴 17% 이하, ②유방 20% 이하이다</td><td style="text-align:left">(상동)</td></tr><tr><th></th><td style="text-align:left">육성</td><td style="text-align:left">청결도 스코어 3과 4로 분류된 소의 비율이 대퇴 17% 이하이다(단, 조사일에 방목지 또는 패독을 이용할 수 있는 경우는 조사 대상 외로 한다)</td><td style="text-align:left">(상동)</td></tr><tr><th>비절의 상태</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">비절 스코어<sup>주3)</sup> 3 이상인 소의 비율이 18% 이하이다</td><td style="text-align:left">무작위로 선정한 30마리 이상을 조사한다(단, 조사 대상우가 30마리 미만이면 가능한 한 전두 조사)</td></tr><tr><th>꼬리 골절</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">꼬리를 인위적으로 꺾인 소가 1마리도 없다</td><td style="text-align:left">전두 조사한다(단, 꼬리가 꺾인 소가 있으면 해당 소의 번호를 적어 두고 관리자에게 이유를 물어, 그 관리자에 의해 인위적으로 꺾인 것이 아닌지 확인)</td></tr><tr><th>발굽의 상태</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">방목을 하는 경우, 제관부 스코어<sup>주4)</sup> 3 이상이 1마리도 없고, 또한 로코모션 스코어<sup>주5)</sup> 2 이상인 소의 비율이 14% 미만이다(단, 제관부 스코어 3 이상이나 로코모션 스코어 2 이상인 경우 적절한 치료를 하고 있으면 된다). 방목을 하지 않는 경우, 제관부 스코어 3 이상이 1마리도 없다(단, 제관부 스코어 3 이상인 경우 적절한 치료를 하고 있으면 된다)</td><td style="text-align:left">무작위로 선정한 30마리 이상을 조사한다(단, 조사 대상우가 30마리 미만이면 가능한 한 전두 조사)</td></tr><tr><th></th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">로코모션 스코어 2 이상인 소의 비율이 14% 미만이다(단, 로코모션 스코어 2 이상인 경우 적절한 치료를 하고 있으면 된다)</td><td style="text-align:left">(상동)</td></tr><tr><th>외상</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">비절을 제외한 목, 앞무릎, 등, 뒷무릎 등의 부위에 상처, 찰과상, 굳은살, 출혈, 부종, 화농 등의 외상(직경 2 cm 이상)이 보이는 소의 비율이 7% 미만이다</td><td style="text-align:left">가능한 한 전두를 조사한다</td></tr><tr><th>피부병</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">피부병이 발증한 소가 1마리도 없다. 피부병이 발증한 경우 적절한 치료를 하고 있다</td><td style="text-align:left">가능한 한 전두를 조사한다</td></tr><tr><th>병상사고 두수 피해율</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">지역 평균값 이하이다</td><td style="text-align:left">조사 전년도 1년분의 공제 기록을 이용한다. 단, 어떤 이유로 증가한 경우는 과거 3년간의 평균값을 이용한다</td></tr><tr><th>사망·폐사 사고 두수 피해율</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">지역 평균값 이하이다</td><td style="text-align:left">조사 전년도 1년분의 공제 기록을 이용한다. 단, 어떤 이유로 증가한 경우는 과거 3년간의 평균값을 이용한다</td></tr><tr><th>제4위 변위 발생률</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">질병 발생률이 성젖소 두수의 3% 이하이다</td><td style="text-align:left">조사 전년도 1년분의 공제 기록을 이용한다. 단, 어떤 이유로 증가한 경우는 과거 3년간의 평균값을 이용한다</td></tr><tr><th>제적우 평균 월령</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">지역 평균값 이상이다</td><td style="text-align:left">우군검정 성적표에서 조사월의 "제적우 평균 월령"을 이용한다. 단, 어떤 이유로 저하한 경우 조사월부터 과거 3년간의 "제적우 평균 월령"의 평균값을 이용한다(과거 3년간으로 하는 경우, 우군검정 성적표에서 당년, 전년 및 전전년 같은 달의 "제적우 평균 월령"의 평균값을 산출한 것을 사용). 우군검정을 하지 않아 검정 성적표가 없는 경우, 관리자로부터 조사월 기준 과거 1년간 또는 과거 3년간에 제적한 소의 월령을 듣고 그 평균값을 산출한 것을 이용한다</td></tr><tr><th>이상행동</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">개 앉은 자세, 혀놀림, 이물 핥기, 웅벽과 같은 이상행동이 1마리도 없다</td><td style="text-align:left">실제로 조사한다</td></tr><tr><th>회피·도주 반응</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">회피반응 스코어<sup>주6)</sup>의 평균값이 5.3 이하이다</td><td style="text-align:left">무작위로 선정한 30마리 이상을 조사한다(단, 조사 대상우가 30마리 미만이면 가능한 한 전두 조사)</td></tr><tr><th></th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">도주반응 스코어<sup>주7)</sup>의 평균값이 3.3 이하이다</td><td style="text-align:left">(상동)</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="137">•</span><span>※ 주1) 보디컨디션스코어의 약자로, 지방 축적 정도를 수치화한 것. 수치가 작아질수록 말랐다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="138">•</span><span>※ 주2) 체표면의 분뇨에 의한 오염 정도를 수치화한 것. 수치가 커질수록 더럽다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="139">•</span><span>※ 주3) 비절 주변의 피모와 피부 상태를 수치화한 것. 주로 우상의 쾌적성을 평가한다. 수치가 커질수록 악화되어 있다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="140">•</span><span>※ 주4) 발굽의 상태를 수치화한 것. 제병 등으로 발굽이 악화된 소를 발견할 수 있다. 수치가 커질수록 발굽 상태가 악화되어 있다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="141">•</span><span>※ 주5) 보양(걸음걸이)의 상태를 수치화한 것. 프리스톨 우사나 방목지 등에서 자유롭게 움직일 수 있는 소에서 제병 등으로 발굽 상태가 악화된 소를 발견할 수 있다. 수치가 커질수록 정상적으로 걷지 못한다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="142">•</span><span>※ 주6) 사람에 대한 공포 정도를 수치화한 것. 사람이 매여 있는 소에게 다가가 도망치려는 반응의 정도를 본다. 수치가 커질수록 사람에게 익숙하지 않다고 판단한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="143">•</span><span>※ 주7) 사람에 대한 공포 정도를 수치화한 것. 사람이 프리스톨 우사나 방목지 등에서 자유롭게 움직이는 소에게 다가가 도망치려는 반응의 정도를 본다. 수치가 커질수록 사람에게 익숙하지 않다고 판단한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="144">•</span><span>표 1-B 시설 베이스 평가기준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>평가항목</th><th>대상</th><th>평가기준</th><th>점검방법(측정방법)</th></tr><tr><th>수조의 치수·급수능력</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">①워터컵의 경우 2마리당 1개 이상이다 ②급수능력이 2 L/10초 이상이다</td><td style="text-align:left">저수탱크가 있는 경우 탱크 배관에서 가장 먼 워터컵의 토수량을 계측한다. 저수탱크가 없는 경우 배관을 보고 말단 워터컵의 토수량을 계측한다</td></tr><tr><th></th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">①20마리에 1개소 이상의 비율로, 각 군당 2개소 이상 설치되어 있다 ②상시 급수되고 있다</td><td style="text-align:left">형태가 다른 것을 줄자를 이용하여 모두 계측한다. 군이 20마리 이상인 경우 두수에 따라 급수기를 설치하고 있는지 조사한다</td></tr><tr><th></th><td style="text-align:left">육성</td><td style="text-align:left">①1군에 1기 이상, 20마리당 1개소 이상 설치되어 있다 ②상시 급수되고 있다</td><td style="text-align:left">(상동)</td></tr><tr><th>더위 대책[THI와 풍속]</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">THI[T: 기온(℃), H: 상대습도(%)][=0.8×T+0.01×H×(T−14.3)+46.3]가 72 미만이다. THI가 72 이상일 때 풍속이 2 m/초 이상이다</td><td style="text-align:left">온도 및 습도는 여러 곳의 우상 위에서 우체 높이로 계측하여 최대값을 이용한다. 풍속은 여러 곳의 우상 위에서 우체 높이로 계측하여 평균값을 이용한다</td></tr><tr><th>우사 내 조도</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">우사 내 조도가 70 LUX 이상이다</td><td style="text-align:left">유방 부근의 조도를 여러 곳의 우상에서 계측하여 평균값을 이용한다</td></tr><tr><th>소음</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">우사 내에 80 dB 이상의 단속적인 소음이 없다</td><td style="text-align:left">소의 머리 부근에서 계측하여 최대값을 이용한다</td></tr><tr><th>공기의 질</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">우사 내 암모니아 농도가 25 ppm 미만이다</td><td style="text-align:left">소가 이용할 수 있는 통로·우상·사조를 계측하여 최대값을 이용한다</td></tr><tr><th>휴식 구역 치수</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">1마리당 우상 면적이 1.8 m² 이상이다</td><td style="text-align:left">우상 여러 곳을 계측하여 최소값을 이용한다(단, 일반적인 소보다 소형인 소의 경우는 고려한다)</td></tr><tr><th></th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">1마리당 축사 면적이 4.0 m² 이상이다</td><td style="text-align:left">소가 이용할 수 있는 축사 면적을 계측한다</td></tr><tr><th>계류 방법</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">착유, 급이, 인공수정 등의 일시적 사용 이외에는 스탠천을 사용하지 않는다</td><td style="text-align:left">실제로 조사한다</td></tr><tr><th>카우 트레이너</th><td style="text-align:left">착유우 TS</td><td style="text-align:left">원칙적으로 가능한 한 카우 트레이너는 사용하지 않는다. 부득이 사용하는 경우 다음 조건을 모두 충족한다 ①변압할 수 없는 전기목책 전원이 사용되지 않는다 ②본체의 접지가 우사 밖에 매설되어 있다 ③카우 트레이너는 통상 기립 상태인 소의 등에서 5 cm 이상 떨어져 있다</td><td style="text-align:left">①②카우 트레이너의 접지, 전원을 설문으로 확인한다 ③카우 트레이너의 높이는 모두 조사한다(방목기에 카우 트레이너를 사용하지 않는 경우는 사사기에 조사)</td></tr><tr><th>사람용 발판 소독조</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">청결한 소독조가 있다</td><td style="text-align:left">실제로 조사한다</td></tr><tr><th>분만방</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">다음 조건을 모두 충족한 분만방을 설치하여 사용하고 있다(방목지에서 분만시키는 경우 제외) ①1마리당 10 m² 이상이다 ②청결하고 마른 깔짚으로 덮여 있다 ③30마리에 1개소 이상 있다</td><td style="text-align:left">실제로 조사하고, 설문에 의한 청취조사도 한다</td></tr><tr><th>1마리당 우상 수</th><td style="text-align:left">착유우 FS, 육성</td><td style="text-align:left">1마리에 1.1스톨 이상이다</td><td style="text-align:left">스톨 수와 소의 두수를 세어 1마리당을 계산한다</td></tr><tr><th>설비 불량</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">시설 전체에 사양관리상 문제가 될 만한 결함이 없다</td><td style="text-align:left">우사 내 설비를 모두 조사하여 외상이나 틈새바람이 생길 만한 결함이 없는지 확인한다</td></tr><tr><th>방목</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">착유우를 질병우를 제외하고 다음 조건으로 전두 방목하고 있다 ①방목 가능 시기에는 매일 주야, 주간 또는 야간에 소를 방목하고 있다(이른 봄, 악천후, 더위 시 등 제외) ②동계에도 매일 패독 또는 방목지에 소를 내놓고 있다(악천후 시 제외) ③방목지 또는 패독의 하루 이용시간이 4시간 이상이다(악천후 시 제외) ④우사 안으로의 출입이 자유롭지 않은 경우, 방목지 또는 패독에서도 섭식·음수가 항상 가능하다 ⑤우사 안으로의 출입이 자유롭지 않은 경우, 전두가 들어갈 수 있는 셸터 또는 그늘이 있다(단, 일부 목구에만 그늘이 없는 경우, 팬팅 행동이 보일 만한 더위 시에는 그 목구로의 방목을 피하고 있으면 된다) ⑥우사에서 방목지·패독으로의 통로 및 패독이 과도하게 질퍽하지 않다(악천후 시 제외) ⑦방목지, 패독, 통로 등의 목책에 가시철선을 사용하지 않는다 ⑧방목지 면적이 성우 1마리당 주야 방목의 경우 25 a 이상, 야간 방목 또는 주간 방목의 경우 15 a 이상 있다</td><td style="text-align:left">실제로 조사하고 설문에 의한 청취조사도 한다(단, ⑥에서 질퍽함이 있었을 때 관리자에게 그 이유를 확인하여 악천후로 생긴 것이라고 판단할 수 있는 경우는 보류하고 후일 재조사)</td></tr><tr><th>우체 브러시</th><td style="text-align:left">착유우 FS·FB</td><td style="text-align:left">우체 브러시를 설치하고 있다. 단, 우체 브러시를 설치하지 않은 경우라도 관리자가 전두에 대해 주 1회 이상 브러싱을 하고 있으면 된다</td><td style="text-align:left">실제로 조사하고 설문에 의한 청취조사도 한다</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="145">•</span><span>표 1-C 관리 베이스 평가기준.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>평가항목</th><th>대상</th><th>평가기준</th><th>점검방법(측정방법)</th></tr><tr><th>농후사료 급여량</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">농후사료 급여량이 건물중량 환산으로 평균 채식량의 50% 이하이다</td><td style="text-align:left">조사월의 우군검정 성적표를 이용한다(우군검정을 하지 않는 경우 관리자의 기록부에서 확인). 평균 채식량은 유기축산물의 일본농림규격을 참조한다</td></tr><tr><th>1인당 사육두수</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">낙농업 종사자 1인당 착유우 사육두수가 30마리 이하이다</td><td style="text-align:left">실제로 조사하고 설문에 의한 청취도 한다</td></tr><tr><th>사조의 청결도</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">①사조 표면이 평평하고 파손된 곳이 보이지 않는다 ②사료의 눌어붙음, 사료의 변패가 보이지 않는다</td><td style="text-align:left">사조를 모두 조사한다</td></tr><tr><th>수조의 청결도</th><td style="text-align:left">착유우 TS·FS·FB, 육성</td><td style="text-align:left">수조 내에 ①부패한 사료의 침전, ②과도한 미끈거림, ③과도한 분변 부착, ④이끼 부착이 보이지 않는다</td><td style="text-align:left">수조를 모두 조사한다</td></tr><tr><th>미주전류</th><td style="text-align:left">착유우 TS·FS</td><td style="text-align:left">검출된 전압이 0.5 V 미만이다</td><td style="text-align:left">수조와 수조 주위 바닥, 또는 수조와 우상 사이의 전압을 미주전류 계측기로 측정한다</td></tr><tr><th>포유 송아지에 대한 초유 급여</th><td style="text-align:left">포유</td><td style="text-align:left">①생후 6시간 이내에 확실히 초유를 급여하고 있다 ②흡유가 불가능한 경우, 포유용 카테터 등으로 생후 24시간 이내에 초유를 급여하고 있다 ③3일간 이상 초유 또는 전유를 급여하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>포유 송아지에 대한 급수</th><td style="text-align:left">포유</td><td style="text-align:left">스타터를 급여받고 있는 송아지가 충분한 양의 신선한 물을 상시 음수할 수 있다</td><td style="text-align:left">스타터를 급여하고 있는 송아지를 대상으로 한다. 카프 허치나 송아지 방 사육의 경우는 1마리씩 평가하고, 군사육의 경우는 그 군에 음수할 수 있는 설비가 있는지 조사한다</td></tr><tr><th>이유 시기</th><td style="text-align:left">포유</td><td style="text-align:left">이유는 ①6주령 이전에 하지 않는다 ②하루 고형사료 채식량이 1 kg을 넘거나, 또는 3일간 연속 0.5 kg을 넘은 후에 하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>포유 송아지에 대한 조사료 급여</th><td style="text-align:left">포유</td><td style="text-align:left">2주령 이상의 송아지에게 양질의 조사료를 급여하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>우상의 부드러움</th><td style="text-align:left">착유우 TS·FS</td><td style="text-align:left">①50 mm 이상의 깔짚(짚·톱밥 등)을 깔고 있다 ②매트리스에 소량의 깔짚을 깔고 있다 ③150 mm 이상의 모래를 깔고 있다</td><td style="text-align:left">깔짚이 적은 우상에서 깔짚을 옆으로 고르게 하고 우상의 앞·중·뒤에서 깔짚 깊이를 계측하여 그 우상의 평균을 낸다. 여러 곳의 우상의 최소값을 이용한다</td></tr><tr><th></th><td style="text-align:left">포유</td><td style="text-align:left">잘 건조되고 곰팡이가 피지 않은 청결한 깔짚을 50 mm 이상의 깊이로 깔고 있다</td><td style="text-align:left">깔짚이 적은 시설(단사·군사 펜)에서 깔짚 깊이를 측정한다</td></tr><tr><th>우상의 미끄러움</th><td style="text-align:left">착유우 TS·FS</td><td style="text-align:left">장화를 우상에 눌러 대어 미끄러지지 않는다</td><td style="text-align:left">분변을 피해 장화 뒤꿈치 부분을 눌러 대어 계측한다</td></tr><tr><th>우상의 청결도</th><td style="text-align:left">착유우 TS·FS, 육성</td><td style="text-align:left">분변이 올라와 있는 우상의 비율이 전체의 25% 미만이다</td><td style="text-align:left">우상을 모두 보고 분변이 올라와 있는 우상을 센다</td></tr><tr><th>단미</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">1마리도 실시하지 않는다(도입 시부터 단미되어 있는 경우는 제외)</td><td style="text-align:left">전두 조사하여 단미된 소가 있으면 해당 소의 번호를 적어 두고 관리자에게 이유를 묻는다. 단, 이유로 보아 해당 목장의 관리자에 의해 인위적으로 단미된 것이 아닌 듯하면 기준을 충족한 것으로 한다</td></tr><tr><th>제각</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">제각하지 않은 경우(유전적으로 무각이 되는 정액을 이용하는 경우 포함)는 기준을 충족한 것으로 한다. 제각하는 경우 생후 4주령 이내에 하고 있다(마취 하 실시가 바람직함)</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>부유두</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">부유두를 제거하지 않은 경우는 기준을 충족한 것으로 한다. 부유두를 제거하는 경우 ①생후 7일령 이내에 하고 있다 ②그 이후는 마취 하에 실시하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>삭제 횟수</th><td style="text-align:left">착유우 TS·FS·FB</td><td style="text-align:left">①1년에 2회 이상 삭제를 하고 있다(주년 방목의 경우 제외) ②방목을 하는 경우 연 1회 이상 삭제를 하고 있다(주년 방목의 경우 제외)</td><td style="text-align:left">실제로 조사하고 설문에 의한 청취조사도 한다</td></tr><tr><th>기립불능우(다우너 카우) 대응</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">①기립할 수 없는 소를 이동시킬 때 육체적 손상을 더 일으킬 만한 방법(우체에 상처가 나지 않도록 하는 조치도 없이 끌어내는 등)을 하지 않는다 ②급이·급수 등의 돌봄을 하고 방치하지 않는다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>장착 기구</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">목줄이나 다리줄, 굴레 등을 이용하는 경우 그 기구가 소를 다치게 하지 않도록 장착하고 있다</td><td style="text-align:left">가능한 한 전두 조사한다</td></tr><tr><th>포유도구의 세정</th><td style="text-align:left">포유</td><td style="text-align:left">①세정: 브러시 등으로 오물(유기성분)을 제거하고 있다 ②살균: 세제를 사용하고 있다 ③보관: 거꾸로 세워 겹치지 않고 보관하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>포유 송아지에 대한 우유 급여</th><td style="text-align:left">포유</td><td style="text-align:left">포유는 모두 젖꼭지 달린 양동이나 포유 보틀, 자동포유시스템 중 하나를 이용하여 하고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>포유 송아지의 사회행동</th><td style="text-align:left">포유</td><td style="text-align:left">카프 허치·단사 펜이 송아지끼리 서로 확인할 수 있는 설비이다</td><td style="text-align:left">조사원이 송아지의 눈높이에서 평가한다</td></tr><tr><th>포유 송아지의 군사</th><td style="text-align:left">포유</td><td style="text-align:left">수의사의 지시나 전염병 등 특별한 이유가 없는 경우, 8주령 이후의 송아지가 군사되고 있다</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>포유 송아지의 계류</th><td style="text-align:left">포유</td><td style="text-align:left">상시 계류의 경우 70 cm 이하 길이의 짧은 로프로 계류하지 않는다</td><td style="text-align:left">실제로 조사한다</td></tr><tr><th>취급</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">소를 유도할 때 스턴건이나 전기봉 등 전기자극을 주는 기구는 사용하지 않는다(소에게 1마리씩 이름을 붙여 이름으로 부르거나 소에게 말을 걸어 주는 것이 바람직함)</td><td style="text-align:left">설문에 의한 청취조사를 한다</td></tr><tr><th>사망가축 취급장 반입</th><td style="text-align:left">착유우 TS·FS·FB, 육성, 포유</td><td style="text-align:left">사망가축 취급장(화제장)에 소를 반입하는 경우 수의사에 의한 안락사를 한 뒤에 수송하고 있다</td><td style="text-align:left">설문에 의한 청취조사 후 관계 서류로 확인한다</td></tr></table></div></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="146">•</span><span><span style="color:var(--ink-soft)">일본송아지 부록2 동물복지.</span></span></p>
</div>
<div class="bx"><div class="bx-title">부록4 송아지의 우사 시설</div>
<div class="bx-sub"><div class="bx-subtitle">우사 시설 관리 시 유의점</div>
<p class="bx-num"><span class="bxn" data-n="147">•</span><span>축산경영의 후계우로서 송아지는 건강하게 키울 필요가 있다. 포유우나 육성우를 수용하는 우사 시설을 설계하고 관리하는 데 있어 다음 사항에 충분히 유의한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">결로수나 낙숫물로 송아지를 적시지 않는다</div>
<p class="bx-num"><span class="bxn" data-n="148">•</span><span>송아지를 수용하는 장소는 간이 시설이 되는 경우가 많아, 환기도 나쁘고 추울 때 결로가 발생하거나 비가 새어 낙숫물로 송아지가 젖는 경우가 있다. 송아지는 몸도 작고 체중도 적기 때문에 젖어서 체온을 빼앗기는 일이 많다. 젖은 채 바람을 맞으면 저체온이 되어 버리지만, 피모가 건조한 상태에서 바람이 없으면 상당한 추위라도 견딜 수 있다. 이 때문에 어떤 기상 상황에서도 송아지가 젖는 일이 없도록 튼튼한 구조로 하거나 대책을 세울 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">바람에 노출시키지 않고, 틈새바람을 맞히지 않는다</div>
<p class="bx-num"><span class="bxn" data-n="149">•</span><span>몸이 젖는 것과 마찬가지로 바람을 맞히는 것은 송아지의 체온을 빼앗기 쉽다. 옆으로 누운 송아지에게 바람이 닿지 않도록 바닥면에서 높이 90 cm 정도는 고정벽으로 한다. 또한 벽면에는 틈이 생기지 않도록 확실히 막아 송아지에게 틈새바람을 맞히지 않는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="150">•</span><span>더위에는 공기를 움직여 체온 저하를 꾀하지만, 시설 전체가 바람에 그대로 노출되지 않도록 코너부나 벽에 가까운 곳에 L자형 울타리를 만들어 송아지가 바람을 피해 휴식할 수 있는 장소를 확보해 둔다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">바닥에서 오는 냉기를 막기 위해 충분한 깔짚을 이용한다</div>
<p class="bx-num"><span class="bxn" data-n="151">•</span><span>추울 때는 옆으로 누웠을 때 차가운 바닥에 체온을 빼앗기는 것을 막기 위해 바닥면에 단열 시공을 하거나 단열성이 높은 밀짚 깔짚을 듬뿍 넣는다. 톱밥은 단열성이 낮고 차가워지기 쉬우므로 주의한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="152">•</span><span>바닥난방은 바닥면에서의 암모니아 휘산을 조장하여 바닥 부근의 암모니아 농도가 높아지므로 사용하지 않는 편이 좋다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">한랭기에는 복사냉각을 막는다</div>
<p class="bx-num"><span class="bxn" data-n="153">•</span><span>송아지의 체온을 빼앗는 또 하나의 원인이 복사냉각이다. 송아지에게 천장이 높은 일반적인 우사에서는 하늘을 향해 복사냉각이 일어나 체온을 빼앗긴다. 복사냉각을 막기 위해서는 천장을 단열하거나 천장이 낮은 울타리를 만들면 좋다. 울타리를 투명 비닐시트로 만드는 예도 보이지만, 투명 비닐시트로는 복사냉각을 막을 수 없다. 비닐시트 대신 반사율이 높은 알루미늄 증착 시트를 사용하면 좋다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">필요한 경우에는 가온한다</div>
<p class="bx-num"><span class="bxn" data-n="154">•</span><span>송아지의 체력이 저하된 경우나 컨디션 불량으로 체온이 저하되어 있는 경우에는 적외선 히터 등으로 가온하여 체온 유지를 지원한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="155">•</span><span>기온이 10℃ 정도까지 내려갔을 때 송아지의 냉기를 걱정하여, 특별히 컨디션 불량의 징후가 보이지 않는데도 송아지용 재킷을 입히거나 히터로 보온하는 것은 송아지를 추위에 적응시키는 것이 되지 않는다. 송아지의 피모를 건조 상태로 하고, 밀짚 등 마른 깔짚을 충분히 넣고, 바람이 닿지 않도록 주위를 둘러싸서 추위에 적응시킨다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="156">•</span><span>■ 개별 포유 시설</span></p>
<div class="bx-sub"><div class="bx-subtitle">카프 허치</div>
<p class="bx-num"><span class="bxn" data-n="157">•</span><span>카프 허치는 바람이나 비·눈을 막는 오두막 부분과 철망 등으로 둘러싼 옥외 부분으로 구성되는 간이 사양 시설이다(그림 1). 날씨에 따라 가장 쾌적한 장소를 송아지가 고를 수 있도록 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="158">•</span><span>허치 폭 120 cm, 입구 높이 120 cm, 안길이 240 cm로 하고, 지붕은 안쪽을 향해 내리막 경사로 한다(그림 2). 전방의 운동 공간은 철망 등으로 둘러싼다. 포유용기나 음수 버킷의 부착부는 허치 안이나 철망 부분 혹은 철망 앞에 설치한다. 더위 대책으로 허치 후방에 환기구를 설치할 때는 바닥에서 50~70 cm 높이로 하여 송아지가 옆으로 누웠을 때 바람을 막을 수 있도록 한다. 추울 때는 완전히 폐쇄한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="159">•</span><span><i>그림 1 카프 허치의 예(사진: 초지 위에 돔형 허치 여러 동과 홀스타인 송아지)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="160">•</span><span><i>그림 2 카프 허치의 치수(cm): 오두막 부분 폭 120·안길이 240·뒤쪽 높이 105·앞쪽(입구) 높이 120, 전방 철망 운동장 안길이 180·높이 90·폭 120. 다카하시(2020)에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="161">•</span><span><b>옥외에 설치하는 경우</b></span></p>
<p class="bx-num"><span class="bxn" data-n="162">•</span><span>카프 허치는 일상적으로 관리하기 쉬운 장소로, 자갈을 깔아 조금 높이는 등 배수가 양호하고 통풍과 볕이 좋은 장소에 간격을 두고 설치한다. 비가 올 때나 눈이 녹을 때 물이 흘러들지 않도록 배수구를 설치한다. 성우사의 배기가 닿는 장소는 피한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="163">•</span><span><b>옥내에 설치하는 경우</b></span></p>
<p class="bx-num"><span class="bxn" data-n="164">•</span><span>날씨가 나쁠 때도 수유 작업을 쉽게 할 수 있도록, 통층(吹き抜け) 구조나 파이프하우스 안에 카프 허치를 설치할 수도 있다(그림 3). 더운 시기에는 시설 벽면을 크게 열어 통풍을 좋게 하는 동시에 개폐식 차양을 단다. 추울 때는 시설 개구부를 최소로 하여 바람이 불어 들어오는 것을 막는다. 해가 잘 들어오게 하면 일사에 의한 승온 효과를 기대할 수 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="165">•</span><span>시설의 천장면에서 빗물이나 결로수가 떨어져 송아지가 젖지 않도록 한다. 야간의 복사냉각을 막기 위해 낮 이외에는 알루미늄 증착 시트로 상부를 덮는다. 설치 장소에 오줌이 고이지 않도록 후방을 향해 바닥면에 경사를 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="166">•</span><span>더운 시기의 깔짚은 톱밥이나 모래를 넣고, 추울 때는 단열성이 높은 밀짚을 사용한다. 분뇨로 더러워진 깔짚은 제거하고 새 깔짚을 추가한다. 이용이 끝나면 깔짚을 제거하고 내부를 고압세척기 등으로 잘 세척하여 살균제를 뿌리고 뒤집어 햇볕에 쬐어 건조·살균한다. 허치와 설치 장소는 2주 정도 비웠다가 재이용하도록 예비를 준비한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="167">•</span><span><i>그림 3 카프 허치를 옥내에 설치하는 경우(cm): D형 통층 또는 파이프하우스, 오픈리지 또는 정부 환기구; 더운 시기에는 알루미늄 증착 시트로 차광, 겨울에는 야간에 알루미늄 증착 시트로 복사냉각 방지 및 결로수 낙하 방지; 한쪽 벽은 여름 개방, 반대쪽은 겨울 폐쇄(높이 300); 바닥 폭 1,080. 다카하시(2020)에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포육우사</div>
<p class="bx-num"><span class="bxn" data-n="168">•</span><span>포육우사는 우사 안에 울타리만으로 된 시설(개별 펜)을 설치한 우사이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="169">•</span><span>개별 펜을 2열 배치한 우사(그림 4)에서는 수유 작업과 관찰, 제분을 위한 중앙통로를 배치하고 그 양측에 폭 120 cm, 안길이 240 cm의 개별 펜을 배치한다. 개별 펜과 벽 사이에는 청소할 수 있는 폭을 확보한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="170">•</span><span>박공형 지붕이나 파이프하우스를 이용할 수 있다. 일사와 복사냉각의 제어, 결로에 대한 대책이 필요하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="171">•</span><span><i>그림 4 포육우사의 단면도(cm): 오픈리지(폭 30), 한쪽 여름 개방·반대쪽 겨울 폐쇄(높이 300), 중앙통로 300, 양측에 120×240 cm 개별 펜, 통로와 펜 사이 30, 펜 바닥을 15 높임, 벽측 여유 120, 전체 폭 1,080. 다카하시(2020)에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="172">•</span><span><b>우사 구조</b></span></p>
<p class="bx-num"><span class="bxn" data-n="173">•</span><span>중앙통로는 제분 작업 시 트랙터가 지나갈 수 있는 폭을 확보한다. 우사 폭이 9 m(5칸 폭)일 때는 240 cm, 9.9~10.8 m(5.5~6칸 폭)일 때는 300 cm로 하고 중앙을 높게 한다. 중앙통로의 양측을 10~15 cm 높여 개별 펜을 설치할 공간을 만든다. 바닥은 벽을 향해 경사를 두어 오줌이 벽 쪽으로 흐르도록 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="174">•</span><span>개별 펜은 120×240 cm의 수용 공간과 펜 앞에 30 cm 폭의 포유용기·음수 버킷을 놓는 공간을 설치하고, 개별 펜과 벽면 사이는 60 cm 이상으로 한다. 좁으면 청소 작업을 할 수 없거나 송아지가 환기용 커튼을 끌어당기기도 한다. 벽면의 환기용 커튼은 하부는 감아올리는 식, 상부는 감아내리는 식의 2단 구조로 한다. 새의 분변으로부터 송아지를 지키기 위해 상부에 새가 앉지 못하도록 철망을 친다. 평면 배치에서는 우사 끝에 그룹 펜을 마련하여 이유 후 이행 우사·시설로 옮기기 전의 송아지를 수용한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="175">•</span><span><i>그림 5 개별 펜의 예(미야자키현 JA아야초)(사진: 파이프 울타리로 구획한 개별 펜과 번호표가 달린 젖병 거치대)</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="176">•</span><span><b>개별 펜</b></span></p>
<p class="bx-num"><span class="bxn" data-n="177">•</span><span>개별 펜은 1두당 폭 120 cm, 안길이 240 cm로(그림 5, 그림 6), 펜 사이에 합판으로 높이 120 cm의 고정벽을 만들고, 서로 핥는 것을 막기 위해 이를 30 cm 전방으로 내민다. 앞뒤는 개폐할 수 있는 구조로 하고, 전방에는 포유용기와 음수 버킷을 설치하며, 깔짚이 밖으로 나오지 않도록 하부 30 cm는 합판으로, 상부는 환기를 위해 철망으로 한다. 후부는 옆으로 누웠을 때 바람이 닿지 않도록 하부 50 cm를 합판으로 하고 상부 70 cm는 환기를 위해 철망으로 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="178">•</span><span>바닥은 아래로부터의 냉기를 막기 위해 단열재를 깐다. "스노코(나무 발판)"는 틈새바람의 원인이 되거나 분뇨로 오염된 채 방치되기 쉽다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="179">•</span><span><i>그림 6 개별 펜의 구조: 측방 패널은 합판, 상부 70 cm는 철망, 하부 50 cm는 막음, 전면 하부 30 cm는 합판, 서로 핥는 것을 막기 위해 칸막이를 30 cm 연장, 겨울에는 후방 120 cm까지 패널로 막고 후부 개구도 패널로 막음, 깔짚을 많이 넣음</i></span></p>
<p class="bx-num"><span class="bxn" data-n="180">•</span><span>겨울철에는 후방 상부를 합판으로 막아 틈새바람을 막는다. 나아가 개별 펜 후방측 120 cm의 상부를 합판이나 단열재 또는 알루미늄 증착 시트로 막아 복사냉각을 막는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="181">•</span><span>포유우라 하더라도 더운 시기뿐 아니라 항상 자유롭게 물을 마실 수 있게 하고, 한랭지에서는 동결을 막기 위해 동결방지형 음수기를 이용한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="182">•</span><span>카프 허치나 포육우사의 포유 장치는 보틀형이 일반적으로 쓰이지만, 저온살균기가 달린 이동식 우유 공급 장치도 이용되어 중앙통로를 이동하면서 급여할 수 있다. 또한 최근에는 카프 레일이라는 자동 포유 장치를 이용하여 개별 펜 포육우사에서 포유를 할 수 있다(그림 3-3-2[148쪽]).</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">개별 포육 방식에서의 이행기 시설</div>
<p class="bx-num"><span class="bxn" data-n="183">•</span><span>이유한 송아지를 카프 허치나 개별 펜에서 작은 그룹에 적응시키기 위해 3~5개월령에 이용하는 시설이다. 다른 송아지와의 사료 채식이나 음수 경합, 새로운 우사 등에 대한 스트레스는 그 후 송아지의 성장에 크게 영향을 미친다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="184">•</span><span><b>슈퍼 허치</b></span></p>
<p class="bx-num"><span class="bxn" data-n="185">•</span><span>슈퍼 허치는 송아지 6두까지 수용할 수 있는 이동 가능한 이행기 우사의 하나이다(그림 7). 펜스로 둘러싸고 포장한 운동장 위에 슈퍼 허치를 설치한다. 오두막 부분에는 깔짚을 충분히 넣는다. 송아지 무리가 교체될 때 설치 장소를 옮긴다. 방목지에서 이용하는 경우에는 방목지 안에서 이동한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="186">•</span><span><i>그림 7 슈퍼 허치의 예(목조 외다락 지붕의 이동식 오두막 그림). MWPS(1996)에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="187">•</span><span><b>이행기의 우사</b></span></p>
<p class="bx-num"><span class="bxn" data-n="188">•</span><span>안길이 3.0 m, 폭 7.2 m의 연속된 펜을 6개월령까지 송아지의 "이행기 우사"로 이용할 수 있다(그림 8). 채식통로를 매일 제분하는 경우는 6두, 깔짚을 전체에 넣는 경우는 8두를 수용할 수 있다. 한랭기에는 개폐 게이트 하부를 고무판 등으로 막아 틈새바람을 막는다. 더운 시기에는 환기를 양호하게 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="189">•</span><span><i>그림 8 이행기 우사의 상세도: 지붕 경사 12:3, 전부 개방, 오픈이브(처마 밑 개방부)와 커튼, 뒤쪽 벽 높이 3.0 m, 높이 60 cm의 벽, 콘크리트 연석, 콘크리트 에이프런 1.2 m + 채식통로 3.0 m + 깔짚 펜 4.2 m = 안길이 8.4 m; 평면도에는 사조, 급수기, 채식통로, 펜 폭 3.0 m, 깔짚(옵션). MWPS(1996)에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">집단 포유 시설</div>
<p class="bx-num"><span class="bxn" data-n="190">•</span><span>포유 로봇을 이용하는 집단 포육 시설에는 중앙에 포유 로봇을 배치하고 포유우만을 수용하는 시설과, 한쪽 통로 부분에 포유 로봇을 배치한 시설이 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">시설 구조상의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="191">•</span><span>포유 로봇을 설치하는 데 있어 특히 주의를 요하는 것은 "건축"에 속하는 울타리나 기계실과 "설비"에 속하는 스테이션 사이에 생기는 틈에 송아지가 목이 끼이지 않도록 하는 것이다. 그림 9에 표시한 흰 선 부분을 파이프 등으로 막아 절대로 송아지가 머리를 넣지 못하도록 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="192">•</span><span>또한 송아지 수용 부분이 바람에 그대로 노출되지 않도록 강풍 시나 추울 때 주위를 커튼으로 폐쇄할 수 있게 하는 것도 필요하다(그림 10).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="193">•</span><span><i>그림 9 포유 스테이션과 울타리의 틈(사진): 이 틈을 흰 선으로 표시한 것처럼 막는다.</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="194">•</span><span><i>그림 10 포유 로봇 우사의 커튼 설치 예(미야자키현 JA아야초)(사진)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수용두수와 관리상의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="195">•</span><span>젖소 송아지나 육용 송아지의 경우에는 1군으로 10두 정도, 홀스타인 수송아지의 경우에는 20~50두로 관리한다. 또한 포유우라 하더라도 음수 시설의 설치가 필요하며, 조형(槽型) 사조로 양질 조사료를 급여한다. 깔짚은 온난기에는 톱밥이라도 문제없지만, 한랭기에는 밀짚을 많이 넣어 보온에 유의한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">외부에서 송아지를 도입하는 경우의 유의점</div>
<p class="bx-num"><span class="bxn" data-n="196">•</span><span>홀스타인 수송아지 등 외부에서 송아지를 도입하여 포유 로봇을 이용해 사육하는 경우에는, 송아지 도입 후 1주간은 개별 사육으로 질병 유무나 건강 상태를 확인한 뒤 포유 로봇 군에 넣는다.</span></p>
<p class="bx-num"><span class="bxn" data-n="197">•</span><span>개별 사육 시설로 이용되는 것에는 옥외용 카프 허치나 옥내용 개별 펜(그림 5, 그림 6)이 있다. 질병 확인을 위해 수용하는 것이므로 다음의 필요 사항이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="198">•</span><span>수용 시 다른 송아지와 접촉이 없을 것</span></p>
<p class="bx-num"><span class="bxn" data-n="199">•</span><span>사용 후 세척·살균 처리를 확실히 할 수 있을 것</span></p>
<p class="bx-num"><span class="bxn" data-n="200">•</span><span>수용 중인 송아지를 젖음, 강풍, 틈새바람, 추위, 복사냉각으로부터 보호할 것</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="201">•</span><span><i>그림 11 홀스타인 수송아지에서의 포유 로봇 이용 예(사진: 깔짚 위에 누운 다수의 홀스타인 송아지와 기계실)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">농장에서의 레이아웃 예</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="202">•</span><span><b>중앙에 포유 로봇을 배치한 레이아웃</b></span></p>
<p class="bx-num"><span class="bxn" data-n="203">•</span><span>포유 로봇 우사는 중앙에 기계실을 설치하고 그 양측에 포유 스테이션과 우방을 배치한 레이아웃이 많다(그림 11). 그림 12에서는 남측이 개폐식 구조이고, 우사 중앙부에 작업통로를 두고 그 안쪽에 자동 포유 장치를 설치하고 있다. 작업통로 양측에 포유우 수용 공간이 배치되어 있다. 작업통로 양측에는 사조가 부착되어 있다. 북측은 높이 1.5 m 이상 부분을 커튼 개폐식으로 하고 있다. 혹한기에는 적외선 난방기를 채식이나 로봇 수유에 방해가 되지 않는 위치에 설치한다. 또한 벽과 천장은 단열하여 복사냉각을 막는다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="204">•</span><span><i>그림 12 집단 포육 전용 시설의 개략도: 중앙 기계실과 좌우 자동 포유 장치, 양측에 음수기와 상자형 사조, 북측 높이 1.5 m 이상은 커튼 개폐식, 남측은 투명판을 댄 미닫이문, 제분 방향은 남측을 향함, ★는 적외선 난방기 설치 위치.</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="205">•</span><span><b>한쪽 통로에 포유 로봇을 배치한 레이아웃</b></span></p>
<p class="bx-num"><span class="bxn" data-n="206">•</span><span>보통의 육성우사와 마찬가지로 포유우, 이유우와 함께 비슷한 월령의 소를 1군으로 하여 우방에 수용하고 순차적으로 이동해 가는 방식이다(그림 13).</span></p>
<p class="bx-num"><span class="bxn" data-n="207">•</span><span>포유우에서는 개폐 게이트 하부로부터의 틈새바람을 막는다. 또한 측벽은 적어도 90 cm 이상으로 하여 옆으로 누운 송아지에게 바람이 닿는 것을 막을 수 있도록 해 둔다.</span></p>
<p class="bx-num"><span class="bxn" data-n="208">•</span><span>우방의 넓이는 같은 두수를 수용하는 경우라도 우체의 증가에 맞추어 서서히 넓게 잡는다. 혹한지에서는 우방의 벽 쪽에 단열재로 둘러싼 장소를 만들고 난방기를 설치하여 추위 대책을 하고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="209">•</span><span><i>그림 13 통로에 포유 로봇을 배치하고 이유우 수용부를 설치한 우사 예: 4개 우방(각 휴식 에리어+채식통로), 통로 쪽에 포유 로봇·포유 스테이션·상자형 사조·급수기 배치. 다카하시(2020)에서 인용·개변</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="210">•</span><span>■ 모자 사양 시설</span></p>
<div class="bx-sub"><div class="bx-subtitle">생후 1~2주간(분만우사)</div>
<p class="bx-num"><span class="bxn" data-n="211">•</span><span>화우의 경우 태어나서 1~2주간은 모자만으로 사양한다. 사양 시설로는 분만방을 이용하는 경우가 많다. 분만을 위한 공간 등은 어미소 관리를 중심으로 치수가 결정되지만, 송아지를 위한 안전성에도 충분히 배려할 필요가 있다. 게이트 살의 간격은 송아지가 끼이거나 밀려 나가지 않는 치수로 한다. 보드나 고무판 등으로 막거나 망으로 하는 것(그림 14)도 하나의 방법이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="212">•</span><span>분만방의 필요 면적은 7.2~12.6 ㎡/두(홋카이도 농업기술체계)로, 어미소를 계류할 수 있게 한다. 송아지를 위해서는 보온 설비를 설치한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="213">•</span><span>모자를 수용하는 분만방의 치수는 게이트의 개폐를 고려하여 정한다. 분만우사의 치수 예를 그림 15에 나타냈다. 게이트 폭이 2.7 m이면 분만방의 폭도 2.7 m가 되고, 우방 면적은 14.6 ㎡로 충분한 넓이가 된다. 패독을 설치하면 제분 시 소를 이동시킬 수 있으므로 분만방의 길이를 3.6 m 정도로 억제할 수 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="214">•</span><span><i>그림 14 분만우사에서의 모자 사양 예(사진: 흑모화종 어미소와 송아지, 망을 댄 게이트)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="215">•</span><span><i>그림 15 분만우사의 치수 예: 우방 폭 2.4~2.7 m × 안길이 2.4~2.7 m, 통로 측 2.7 m, 게이트 회전 반경을 점선으로 표시, 사조와 급수기(水) 위치</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기의 시설</div>
<p class="bx-num"><span class="bxn" data-n="216">•</span><span>모자만으로의 사양이 끝나면 여러 모자를 함께 사양하는 포유우사를 이용한다. 그림 16의 우사에서는 16조의 모자가 한데 사양되고 있으며, 크리프 펜스<sup>주1)</sup>로 송아지만의 별도 사육 공간이 확보되어 있다. ①송아지에게 수유시키기 위한 공간이 있을 것, ②송아지의 별도 사육 공간(모자 분리 시설)이 있을 것이 송아지 입장에서 본 포유우사의 조건이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="217">•</span><span>또한 포유우사 안을 여러 우방으로 크리프 펜스가 달린 게이트로 구획하고 중앙 우방에 송아지를 넣으면 양측에 어미소를 배치할 수 있다(그림 17, 그림 18).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="218">•</span><span>※ 주1) 크리프 펜스: 송아지만 통과할 수 있는 울타리.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="219">•</span><span><i>그림 16 포유우사의 예: 유형 번식우 70두 타입, 이유 월령 3개월, 어미소와 포유우 16조, 포유 면적 6.48 ㎡/조, 별도 사육 면적 1.08 ㎡/두, 연동 스탠천·로프 계류 0.9 m/두; 우방 3.6 m+3.6 m+급이통로 2.7 m, 길이 18 m, 별도 사육 공간 폭 2.4 m(통로 1.2 m), 높이 제한 또는 폭 제한에 의한 여러 출입구, 패독 병설</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="220">•</span><span><i>그림 17 포유우사의 예(미야자키현 JA아야초): 급이통로 양측에 사조, 어미소(3두)·송아지(6두)·어미소(3두)·송아지(3두)·어미소(3두) 우방이 크리프 부분으로 연결됨</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="221">•</span><span><i>그림 18 미야자키현 JA아야초의 포유우사 예(사진: 모래 깔짚 위의 흑모화종 모자)</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="222">•</span><span>■ 육성우사</span></p>
<div class="bx-sub"><div class="bx-subtitle">젖소의 프리스톨 우사</div>
<p class="bx-num"><span class="bxn" data-n="223">•</span><span>육성기의 송아지는 증체에 따라 체격이 크게 다르다는 점과 관리자 측에 발정 발견·인공수정 등의 작업이 필요해지므로, 월령에 따라 6~9개월, 9~12개월, 12~18개월, 18개월부터 분만까지로 세밀하게 군을 나눈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="224">•</span><span>육성우사에는 이러한 군 분리가 가능한 게이트 개폐식 프리스톨 우사나 프리반이 있다. 어느 경우든 제분 시 작업자 1인이 육성우를 제분통로에서 다른 통로로 간단히 이동시킬 수 있는 레이아웃이나 게이트 배치로 한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="225">•</span><span>게이트 개폐식 프리스톨 우사에서는 사조에 평행한 우상 열을 2열 혹은 3열 배치한다(그림 19). 통로의 기계 제분이 쉽도록 월령이 다른 군이라도 같은 길이로 우상 기부를 만들어 우상의 후단 위치를 직선으로 한다. 실제로 소가 눕기 위한 우상의 폭과 길이, 칸막이 치수는 각 우군의 젖소 크기에 맞추어 조정한다. 이유 직후부터 분만 직전까지의 우상을 일렬로 배치하려 하면 우상 길이가 120~210 cm로 폭이 있기 때문에 작은 송아지군에서는 전방에 쓸모없는 공간이 넓게 생겨 버린다. 이런 경우에는 중앙 급이 방식으로 양측에 우상 열을 배치한 레이아웃으로 하여 쓸모없는 공간을 줄인다.</span></p>
<p class="bx-num"><span class="bxn" data-n="226">•</span><span>사조 울타리는 간이한 가로 파이프식을 기본으로 한다. 12~15개월령의 인공수정 대상 우군에는 셀프록 스탠천을 설치하여 발정 확인, 인공수정 작업이 쉽도록 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="227">•</span><span><i>그림 19 육성우용 프리스톨 우사의 레이아웃 예(2열 우상): 17~20개월·13~16개월·9~12개월·5~8개월 군, 우상 후단을 맞추고 우상 길이를 짧게 함, 우상측 통로·사조측 통로·급이통로, 음수기, 셀프록, 사조, 가로 파이프, 제분 방향</i></span></p>
<p class="bx-num"><span class="bxn" data-n="228">•</span><span>사조벽의 높이는 4~6개월령에서 45 cm, 6개월령 이상에서는 50 cm로 한다. 사조의 넥레일은 사조벽에서 전방으로 20 cm 내밀고, 높이는 평균 체고의 80% 정도를 기준으로 100~120 cm로 설치한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="229">•</span><span>급수는 상시 급수로 한다. 부동결형 급수기를 사용하여 횡단통로 등에 설치한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="230">•</span><span>환기는 자연환기로 하지만, 겨울철에는 북서의 찬 계절풍이 육성우에 직접 닿지 않도록 게이트 개폐부나 벽면 기부 등에서 틈새바람이 들어오지 않는 구조로 한다. 지붕은 오픈리지나 외쪽지붕, 세미모니터 등으로 하여 충분한 환기량을 확보한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="231">•</span><span>연장우로부터의 감염을 방지하기 위해 제분은 월령이 어린 쪽에서 많은 쪽을 향해 밀어낼 수 있는 레이아웃으로 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">육용우의 육성우사</div>
<p class="bx-num"><span class="bxn" data-n="232">•</span><span>육용우의 경우는 우방 방식이 일반적이다(그림 20). 그림 중의 1군 두수는 비육우의 경우이며, 비육 밑소라면 월령에 따라 4~6두 수용할 수 있다. 1두당 바닥면적을 약 4 ㎡ 확보하는 동시에 1두당 사조 폭을 충분히 확보한다. 이 예의 경우에는 6두라도 60 cm/두를 확보할 수 있다. 상시 급여로 하는 경우라도 1두당 사조 폭을 확보하여 채식량에 편차가 생기지 않도록 한다. 홀스타인 수송아지처럼 1군의 두수를 늘리는 경우에도 중앙 부분에 고정 칸막이 울타리를 설치하여 가능한 한 사조 폭을 넓게 한다. 물통은 사료를 적시지 않기 위해 사조와 반대쪽에 설치한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="233">•</span><span>송아지의 발육 상황을 확인할 수 있도록 각 우방의 목표 체고를 벽이나 칸막이 울타리에 기준으로 표시해 두면 관리하기 쉽다(그림 21). 여름에는 환기량을 많이 확보할 수 있도록 벽면을 크게 개폐할 수 있는 커튼 방식으로 한다(그림 22). 온난한 지역이라도 추울 때의 강풍을 송아지에게 맞히지 않도록 커튼 개폐식으로 사방을 둘러쌀 수 있게 한다(그림 23).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="234">•</span><span><i>그림 20 화우 육성의 표준적 레이아웃: 우방 3.6 m+3.6 m, 통로 2.7 m, 안길이 3.6 m; 1군 두수 4~6두, 우상 면적 6.48 ㎡/두, 우사 면적 8.91 ㎡/두, 사조 폭 0.90 m/두, 물통(水)은 사조 반대쪽</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="235">•</span><span><i>그림 21 벽에 체고의 기준을 표시한 예(사진: 흑모화종 육성우)</i></span></p>

/* 박스 2열 배치: 순서대로 앞 절반(높이 기준)은 왼쪽, 나머지는 오른쪽 */
function vetBoxLayout(root){
  root.querySelectorAll('.rb-boxes').forEach(function(wrap){
    var boxes=[].slice.call(wrap.querySelectorAll(':scope > .bx, :scope > .col > .bx'));
    if(!boxes.length) return;
    wrap.innerHTML='';
    boxes.forEach(function(b){ wrap.appendChild(b); }); return;
    var left=document.createElement('div'), right=document.createElement('div');
    left.className='col'; right.className='col';
    var full=boxes.filter(function(b){ return b.getAttribute('data-col')==='full'; });
    boxes=boxes.filter(function(b){ return b.getAttribute('data-col')!=='full'; });
    full.forEach(function(b){ b.classList.add('bx-full'); wrap.appendChild(b); });
    wrap.appendChild(left); wrap.appendChild(right);
    if(!boxes.length) return;
    boxes.forEach(function(b){ left.appendChild(b); });
    var mk=boxes.findIndex(function(b){ return b.getAttribute('data-col')==='right'; });
    if(mk>0){ boxes.forEach(function(b,k){ if(k>=mk) right.appendChild(b); }); return; }
    var hs=boxes.map(function(b){ return b.offsetHeight+6; });
    var total=hs.reduce(function(a,c){ return a+c; },0), acc=0, best=1, bestDiff=Infinity;
    for(var k=1;k<boxes.length;k++){ acc+=hs[k-1]; var d=Math.abs(acc-(total-acc)); if(d<bestDiff){ bestDiff=d; best=k; } }
    boxes.forEach(function(b,k){ if(k>=best) right.appendChild(b); });
  });
}

    var html=VETEDITS[key]; if(html==null) return;
    var nodes=vetSecNodes(h); if(!nodes.length) return;
    var parent=nodes[0].parentNode;
    var anchor=nodes[nodes.length-1].nextSibling;
    nodes.forEach(function(n){ n.remove(); });
    var tmp=document.createElement('div'); tmp.innerHTML=html;
    // Plain text must remain a section node so it can be edited again.
    Array.from(tmp.childNodes).forEach(function(n){
      if(n.nodeType===3 && n.textContent.trim()){
        var p=document.createElement('p'); p.className='rb-p'; p.textContent=n.textContent; n.replaceWith(p);
      }
    });
    while(tmp.firstChild){ parent.insertBefore(tmp.firstChild, anchor); }
  });
}
/* 강조(형광펜): 본문에서 드래그한 구절을 저장해 두었다가 다시 표시한다. 주인 로그인 상태에서만 추가·해제 가능 */
var HLSEL=null, _hlTimer=null;
var HL_BLOCK='p.rb-p, .rb-list li, .rb-key li, .rb-cc-b, p.bx-num, .bx-title, .bx-subtitle, .bx-note, table.bxt td, table.bxt th';
function vetHlList(tab, create){
  var all=VETEDITS && VETEDITS.__hl__;
  if(!all || typeof all!=='object'){ if(!create) return []; all=VETEDITS.__hl__={}; }
  if(!Array.isArray(all[tab])){ if(!create) return []; all[tab]=[]; }
  return all[tab];
}
function vetHlWrap(block, start, end, idx){
  var walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  var pos=0, nodes=[], n;
  while((n=walker.nextNode())){
    var s=pos, e=pos+n.nodeValue.length;
    if(e>start && s<end) nodes.push({n:n, from:Math.max(start,s)-s, to:Math.min(end,e)-s});
    pos=e; if(pos>=end) break;
  }
  nodes.forEach(function(o){
    var mid=o.from>0 ? o.n.splitText(o.from) : o.n;
    if(o.to-o.from < mid.nodeValue.length) mid.splitText(o.to-o.from);
    var m=document.createElement('mark'); m.className='hl'; m.dataset.hl=idx;
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  return nodes.length>0;
}
function vetHlApplyOne(root, it, idx){
  var blocks=Array.prototype.slice.call(root.querySelectorAll(HL_BLOCK));
  var pre=it.b||'', needle=pre+it.t+(it.a||'');
  for(var i=0;i<blocks.length;i++){
    var k=blocks[i].textContent.indexOf(needle);
    if(k>=0){ var st=k+pre.length; return vetHlWrap(blocks[i], st, st+it.t.length, idx); }
  }
  var hit=null, cnt=0;
  blocks.forEach(function(b){
    var tx=b.textContent, p=tx.indexOf(it.t);
    while(p>=0){ cnt++; hit={b:b,p:p}; p=tx.indexOf(it.t,p+1); }
  });
  if(cnt===1) return vetHlWrap(hit.b, hit.p, hit.p+it.t.length, idx);
  return false;
}
function vetApplyHighlights(root, tab){
  vetHlList(tab).forEach(function(it,i){ vetHlApplyOne(root,it,i); });
}
function vetHlRefresh(root, tab){
  root.querySelectorAll('mark.hl').forEach(function(m){
    var par=m.parentNode; while(m.firstChild) par.insertBefore(m.firstChild,m);
    par.removeChild(m); par.normalize();
  });
  vetApplyHighlights(root, tab);
}
function vetHlSelInfo(){
  var main=document.querySelector('#main .namu-doc');
  if(!main) return null;
  if(!((typeof isAdmin==='function') && isAdmin())) return null;
  if(document.querySelector('.vet-edit-box')) return null;
  var sel=window.getSelection(); if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  var r=sel.getRangeAt(0);
  var s0=r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
  var e0=r.endContainer.nodeType===3 ? r.endContainer.parentElement : r.endContainer;
  var bs=(s0 && s0.closest) ? s0.closest(HL_BLOCK) : null, be=(e0 && e0.closest) ? e0.closest(HL_BLOCK) : null;
  if(!bs || bs!==be || !main.contains(bs)) return null;
  var pre=document.createRange(); pre.selectNodeContents(bs); pre.setEnd(r.startContainer, r.startOffset);
  var start=pre.toString().length, raw=r.toString();
  start+=raw.length-raw.replace(/^\s+/,'').length;
  var t=raw.trim(); if(!t || t.length>240) return null;
  var full=bs.textContent, marks=[];
  bs.querySelectorAll('mark.hl').forEach(function(m){ if(r.intersectsNode(m)) marks.push(+m.dataset.hl); });
  return {t:t, b:full.slice(Math.max(0,start-15),start), a:full.slice(start+t.length,start+t.length+15), marks:marks};
}
function vetHlBar(){
  var bar=document.getElementById('hlBar'); if(bar) return bar;
  bar=document.createElement('div'); bar.id='hlBar'; bar.className='hl-bar';
  bar.innerHTML='<button type="button" data-hl-act="add">강조</button><button type="button" data-hl-act="del">해제</button>';
  document.body.appendChild(bar);
  bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  bar.addEventListener('click', vetHlAct);
  return bar;
}
function vetHlShow(info){
  HLSEL=info; clearTimeout(_hlTimer);
  var bar=vetHlBar();
  bar.querySelector('[data-hl-act="add"]').disabled=!info.t;
  bar.querySelector('[data-hl-act="del"]').disabled=!(info.marks && info.marks.length);
  bar.style.display='flex';
}
function vetHlHideSoon(ms){
  clearTimeout(_hlTimer);
  _hlTimer=setTimeout(function(){ var b=document.getElementById('hlBar'); if(b) b.style.display='none'; HLSEL=null; }, ms);
}
async function vetHlAct(e){
  var btn=e.target.closest('[data-hl-act]'); if(!btn || btn.disabled || !HLSEL) return;
  if(!_vetLoaded){ if(typeof toast==='function') toast('저장된 내용을 불러오는 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  var tab=UI.vetTab, list=vetHlList(tab,true), snap=JSON.stringify(VETEDITS.__hl__||{}), info=HLSEL;
  if(btn.dataset.hlAct==='add'){
    list.push({t:info.t, b:info.b, a:info.a});
  } else {
    info.marks.slice().sort(function(x,y){return y-x;}).forEach(function(i){ list.splice(i,1); });
  }
  var ok=await vetEditsSave();
  if(!ok){ VETEDITS.__hl__=JSON.parse(snap); return; }
  vetHlRefresh(document.querySelector('#main .namu-doc'), tab);
  var s=window.getSelection(); if(s) s.removeAllRanges();
  HLSEL=null; var b=document.getElementById('hlBar'); if(b) b.style.display='none';
}
function vetHlInit(){
  document.addEventListener('selectionchange', function(){
    var info=vetHlSelInfo();
    if(info) vetHlShow(info); else if(HLSEL) vetHlHideSoon(1500);
  });
  document.addEventListener('click', function(e){
    var m=e.target.closest && e.target.closest('mark.hl'); if(!m) return;
    if(!((typeof isAdmin==='function') && isAdmin()) || document.querySelector('.vet-edit-box')) return;
    var s=window.getSelection(); if(s && !s.isCollapsed) return;
    vetHlShow({t:'', b:'', a:'', marks:[+m.dataset.hl]}); vetHlHideSoon(4000);
  });
}
function vetEnterEdit(h){
  if(!((typeof isAdmin==='function') && isAdmin())) return;
  if(document.querySelector('.vet-edit-box')) return;
  var nodes=vetSecNodes(h); if(!nodes.length) return;
  var parent=nodes[0].parentNode;
  var box=document.createElement('div');
  box.className='vet-edit-box'; box.setAttribute('contenteditable','true');
  parent.insertBefore(box, nodes[0]);
  nodes.forEach(function(n){ box.appendChild(n); });
  var bar=document.createElement('div');
  bar.className='vet-edit-bar';
  bar.innerHTML='<button type="button" class="vet-eb-save">저장</button><button type="button" class="vet-eb-cancel">취소</button>';
  box.insertAdjacentElement('afterend', bar);
  box.focus();
  bar.querySelector('.vet-eb-save').addEventListener('click', async function(){
    const oldHtml=VETEDITS[h.dataset.vkey];
    VETEDITS[h.dataset.vkey]=box.innerHTML;
    this.textContent='저장 중…'; this.disabled=true;
    const saved = await vetEditsSave();
    if(saved) renderVet();
    else { if(oldHtml===undefined) delete VETEDITS[h.dataset.vkey]; else VETEDITS[h.dataset.vkey]=oldHtml; this.textContent='저장'; this.disabled=false; }
  });
  bar.querySelector('.vet-eb-cancel').addEventListener('click', function(){ renderVet(); });
}

/* 풀정보: 섹션 제목 + 카드를 접이식(아코디언)으로 묶기 — 모바일에서 목차부터 보이게 */
function groupGrassSections(root){
  root = root || document.getElementById('main');
  if(!root) return;
  const titles = [...root.querySelectorAll('.grass-section-title')];
  titles.forEach(title => {
    const details = document.createElement('details');
    details.className = 'grass-acc';
    details.open = false;          // 기본 접힘 → 목차처럼 보임
    const summary = document.createElement('summary');
    summary.className = 'grass-acc-sum';
    summary.innerHTML = title.innerHTML;
    details.appendChild(summary);
    title.replaceWith(details);
    let node = details.nextElementSibling;
    while(node && !node.classList.contains('grass-section-title') && !node.classList.contains('modal-actions')){
      const next = node.nextElementSibling;
      details.appendChild(node);
      node = next;
    }
  });
}

}

<script>
(function(){
  var KEY='careBoxOpen';
  var open={}; try{ open=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(open)); }catch(e){} }
  function keyOf(bx){ var t=bx.querySelector(':scope>.bx-title'); return t? t.textContent.trim().slice(0,40) : ''; }
  function apply(root){
    if(document.documentElement.classList.contains('ps-on')) return;
    (root||document).querySelectorAll('.rb-boxes .bx').forEach(function(bx){
      if(!bx.querySelector(':scope>.bx-title')) return;
      var k=keyOf(bx);
      if(open[k]) bx.classList.remove('collapsed'); else bx.classList.add('collapsed');
    });
    (root||document).querySelectorAll('.rb-boxes').forEach(function(rb){
      if(rb.previousElementSibling && rb.previousElementSibling.classList.contains('bx-tools')) return;
      if(rb.parentNode.classList.contains('bx-group') && rb.parentNode.previousElementSibling && rb.parentNode.previousElementSibling.classList.contains('bx-tools')) return;
      if(rb.hasAttribute('data-notools')) return;
      if(!rb.querySelector('.bx>.bx-title')) return;
      var d=document.createElement('div'); d.className='bx-tools';
      d.innerHTML='<button type="button" data-all="1">모두 펼치기</button><button type="button" data-all="0">모두 접기</button>';
      var anchor=rb.parentNode.classList.contains('bx-group')?rb.parentNode:rb; if(anchor.previousElementSibling&&anchor.previousElementSibling.classList.contains('bx-tools')) return; anchor.parentNode.insertBefore(d, anchor);
    });
  }
  document.addEventListener('click', function(e){
    var t=e.target.closest('.rb-boxes .bx>.bx-title');
    if(t){ var bx=t.parentElement; bx.classList.toggle('collapsed'); open[keyOf(bx)]=!bx.classList.contains('collapsed'); save(); return; }
    var b=e.target.closest('.bx-tools button[data-all]');
    if(b){ var rb=b.closest('.namu-doc')||b.parentElement.nextElementSibling; var on=b.getAttribute('data-all')==='1';
      rb.querySelectorAll('.rb-boxes .bx').forEach(function(bx){ if(!bx.querySelector(':scope>.bx-title')) return; bx.classList.toggle('collapsed',!on); open[keyOf(bx)]=on; }); save(); }
  });
  var mo=new MutationObserver(function(){ apply(); });
  document.addEventListener('DOMContentLoaded', function(){ apply(); mo.observe(document.body,{childList:true,subtree:true}); });
  if(document.readyState!=='loading'){ apply(); mo.observe(document.body,{childList:true,subtree:true}); }
})();
</script>
