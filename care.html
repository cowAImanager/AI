<div class="bx-sub"><div class="bx-subtitle">번식관리</div>
<p class="bx-num"><span class="bxn" data-n="204">•</span><span>번식관리의 기본은 발정을 발견하여 적기에 수정하고 조기 수태를 도모하는 것이다. 육성우의 경우는 10개월령경부터 시작되는 초회 발정 발현을 놓치지 않는 것이 중요하다. 또한 초회 발정에 따른 발정주기는 짧은 주기인 경우도 있으므로, 다음 이후 발정의 간격이나 발정주기의 길이 등 개체의 리듬을 이른 시기에 파악하는 것도 중요하다. 발정 발견을 위한 보조 기구의 사용이나 검지 시스템의 도입은 비용과 비용 대비 효과를 고려하여 행한다면 유효한 수단이라고 생각된다. 인공수정(AI) 시의 동결 정액이나 기구의 취급에도 충분히 신경 쓸 필요가 있으며, 특정 융해 조건이 지정되어 있는 동결 정액은 지정 조건을 준수하지 않으면 활성이 저하되어 수태율이 현저히 저하됨에 유의해야 한다. 번식관리 기록을 남기는 것은 가장 중요하며, 소의 관리에 종사하는 전원이 공유할 수 있는 형태로 번식관리, 사양관리의 기록이 정리되어 언제든 확인할 수 있는 시스템이 구축되어 있는 것이 바람직하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">목표와 현황</div>
<p class="bx-num"><span class="bxn" data-n="205">•</span><span>2015년 제정된 가축증식목표에서는 육우의 번식 능력 목표로서 제정 시 24.4개월의 초산 월령을 10년 후인 2025년에는 23.5개월로 단축하는 것이 목표 수치로 제시되어 있다<sup>17)</sup>. 2017년 전국와규등록협회의 데이터 해석 결과에서는 초산 월령의 평균치는 24.9개월, 중앙치는 24.0개월로, 대체로 소가 2세에 초산을 맞이하는 상황이 되어 있다<sup>18)</sup>. 또한 분만 간격에 대해서는 제정 시의 405일을 2025년에는 380일로 단축하는 목표 수치가 제시되어 있으며, 2018년에는 전 기록에 대한 분만 간격의 평균치는 398.6일, 중앙치는 380.0일로 대체로 달성되고 있는 듯한 상황이다. 분만 간격에 대해서는, 전회 분만 월의 분만 간격에 대한 효과로서 12~3월에 분만한 개체는 다음 분만 간격이 길고, 6~9월에 분만한 개체에서는 다음 분만 간격이 단축되는 경향이 있다. 분만 후 번식우 관리의 난이도를 시사한다고 생각되며, AI 적기에 사람, 소 모두 계절적 스트레스의 크기나 다른 농작업 등의 번망기와의 중복도 관계되어 있다고 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="206">•</span><span>육우의 영양 상태 평가는 주로 등록 심사 시에 사용되는 영양도 판정에 의해 이루어지고 있다. 영양도 판정은 기갑, 등뼈, 늑골, 요각, 둔부, 미근부의 6부위 촉진에 의해 피하지방의 부착 정도를 평가한다. 초산 월령에 대한 영양도의 효과로서, 영양도 7~8인 개체에서는 초산 월령이 지연되는 영향이 있다<sup>18)</sup>(그림 5-4-19). 후천적으로 획득한 비유전적인 암소 자신의 능력을 나타내는 영속적 환경효과는 후대에 전해질 수는 없지만, 해당 소가 현역으로 활약하는 동안 반복적으로 영향을 주는 개체 특유의 효과를 나타낸다. 이 영속적 환경효과에 대한 영양도(등록 심사 시)의 영향으로는 영양도 6인 개체가 최량이며, 등록 심사 시 영양도 6(인 개체)이 그 후의 분만 간격에 대하여 가장 좋은 효과라는 것(그림 5-4-20), 이 시기에 말라 있는 것, 사료 부족 기미인 것이 그 후의 번식 성적에 영향을 미친다는 것이 시사되어 있다<sup>18)</sup>(그림 5-4-21).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="207">•</span><span><i>그림 5-4-19 초산 월령에 대한 영양도의 효과(영양도 3~8, 초산 월령 편차 월). 영양도 3~6은 −0.1~−0.13개월, 7은 +0.06개월, 8은 +0.37개월; 영양도 7, 8은 초산 월령을 지연시킨다. 문헌 18에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="208">•</span><span><i>그림 5-4-20 임신 말기의 미경산우(영양도 6)(측면 사진 2장).</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="209">•</span><span><i>그림 5-4-21 등록 심사 시 영양도별 영속적 환경효과(분만 간격)의 평균치(일). 영양도 3 약 +0.9일, 4 약 +0.35일, 5 약 −0.02일, 6 약 −0.15일(최량), 7 약 −0.08일, 8 약 +0.15일. 등록 심사 시 영양도가 낮으면 그 후의 번식성(분만 간격)에 악영향을 미친다. 영양도 6이 효과는 미미하지만 해당 소의 번식성에 좋은 영향을 준다. 문헌 18에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">게노믹 육종가</div>
<p class="bx-num"><span class="bxn" data-n="210">•</span><span>육질, 번식성 등의 경제 형질은 양적 형질로서 소수의 유전자로 결정되지 않고 복수 유전자 효과의 총합에 의해 결정된다. 게놈상에 수만 개로 다수 존재하는 DNA 염기서열의 1개소 염기가 다른 염기로 바뀌어 있는 단일염기다형(Single nucleotide polymorphism: SNP) 정보를 이용하여 경제 형질에 관한 양적 형질 유전자좌(Quantitative trait locus: QTL)를 포착하고 개체의 유전적 능력을 예측·추정하는 기법이 게놈 선발이다<sup>19)</sup>. 게놈 선발의 흑모화종에서의 활용으로서, 종래의 육종가를 계산하는 정보에 SNP 정보를 더하여 계산된 게노믹 육종가가 이용되고 있다. 게노믹 육종가의 특징, 종래 육종가에 대한 우위점은, 같은 부모 유래의 전형제 산자의 능력 차이를 구별할 수 있는 것과, 후대가 없는 상황에서도 어느 정도의 신뢰도를 가지고 해당 소의 유전적 능력을 판정할 수 있는 것이다<sup>20)</sup>(그림 5-4-22). 게노믹 육종가의 이용에 의해 미경산우 단계에서 후계우 생산 대상우를 어느 정도 압축할 수 있으므로, 우군의 개량 속도 향상이 기대된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="211">•</span><span><i>그림 5-4-22 게노믹 평가의 신뢰도(평가 형질: 지육 중량). 종래 육종가(DNA 정보 없음, BLUP법): 혈통 정보 없음 0% → 미경산우(혈통 정보) 28% → 경산우(산자 1~3두) 40% → 산자 수 증가 99%. 게노믹 육종가(DNA 정보 있음, ssGBLUP법): 미경산우(혈통 정보+DNA 정보) 74% → 경산우(산자 1~3두+DNA 정보) 77% → 산자 수 증가 99%. 게노믹 육종가를 이용하면(해당 소의 SNP 정보를 알면) 후대가 없는 상태(육성우, 미경산우)에서도 개체의 능력을 판정할 수 있다(신뢰도 74%). 문헌 20에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="212">•</span><span><span style="color:var(--ink-soft)">(저자: 大島一修)</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">비육 밑소의 송아지 시장 출하 시 체중</div>
<p class="bx-num"><span class="bxn" data-n="213">•</span><span>2019년 2월 1일 시점의 육우 사육 동향에서는 국내 육우 사육 호수 중 번식용 암소를 보유한 경영체가 4만 6,000호 존재한다<sup>21)</sup>. 그중 번식부터 비육까지를 사양하는 일관 경영은 (비육 전업 및 번식 전업 경영체를 뺀 값으로부터) 1,290호로 추정할 수 있다. 번식부터 비육까지를 담당하는 일관 경영의 사양 형태가 보급되어 왔다고는 하나, 3만 8,900호가 번식 전업이므로, 여기서는 송아지 시장에 출하되는 송아지를 비육 밑소로 정의한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="214">•</span><span>송아지 시장에서의 가격 결정은 혈통에 의한 바가 크지만, 관례적으로 발육이 우수한 개체가 고가로 거래된다. 1981~1982년의 송아지 거래 정보에서는 평균 출하 월령 8.4개월령, 평균 출하 체중은 253 kg으로 되어 있는데<sup>22)</sup>, 이 당시부터 송아지의 과비는 문제라고 지적되고 있다. 2019년도 육용 송아지 거래 상황표에서는 흑모화종 송아지의 출하 월령이 9.1개월령, 출하 체중이 암컷 276 kg, 수컷(거세) 291 kg(2019년도, 전국 평균)으로<sup>23)</sup>, 앞서 언급한 1981년대의 출하 체중보다 더욱 증대되어 있다. 비육 밑소 도입 시에 과비이면(비육도 지수가 높으면) 비육 전기부터 중기의 조사료 섭취량 및 비육 중기의 농후사료 섭취량이 저하되는 경향이 보이며, 비육 전기의 증체량이 유의하게 낮아 전 비육 기간의 증체량도 낮은 경향이 된다<sup>24)</sup>. 나아가 지육 형질 중 근내지방도·육색·결에 대하여 도입 시 과비가 아니었던 군보다 뒤떨어진다. 과비한 송아지는 비육기의 생산병(비타민 A 결핍증, 지방 괴사, 루멘 산독증 등)을 막기 위해 도입한 경영체에서는 비육을 하기 전에 조사료를 다급하는 「재사육(飼い直し)」의 필요가 생겨 비육 기간의 연장이라는 부담으로 이어진다.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="215">•</span><span>■ 방목 육성의 장점</span></p>
<div class="bx-sub"><div class="bx-subtitle">방목 육성 송아지의 발육</div>
<p class="bx-num"><span class="bxn" data-n="216">•</span><span>종전에는 방목 육성 송아지는 사사(舎飼) 육성에 비해 발육이 뒤떨어진다고 평가되어 왔으나, 근년에는 발육의 개선이 인정된다<sup>25~27)</sup>(표 5-4-7). 표에 제시한 사례는 성별, 방목 개시·종료 일령, 급여 사료의 조건 등이 다르지만, 모두 0.97 kg 이상의 증체량을 나타냈다. 이 발육은 흑모화종 정상발육곡선의 범위 내이며, 육용 송아지 거래 상황표의 DG 조건에도 부합하는 것이다. 이 방목 육성 송아지의 발육을 바탕으로 방목 활용에 의한 비육 밑소 생산의 장점을 논한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="217">•</span><span>표 5-4-7 방목 육성 송아지의 발육.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>아오모리현 축산시험장 나카자토 등<sup>25)</sup></th><th>농연기구 키도 등<sup>26)</sup></th><th>홋카이도립 축산시험장 스기모토 등<sup>27)</sup></th></tr><tr><th>품종·성별</th><td style="text-align:left">흑모화종 거세 3두, 암 3두</td><td style="text-align:left">흑모화종 거세 5두</td><td style="text-align:left">흑모화종 거세 6두</td></tr><tr><th>이유 유무</th><td style="text-align:left">이유하지 않고 모자 방목</td><td style="text-align:left">이유하지 않고 모자 방목</td><td style="text-align:left">이유 후 방목</td></tr><tr><th>방목 기간·방목 기간 중 송아지 월령</th><td style="text-align:left">133일간·1, 2~6개월령</td><td style="text-align:left">126일간·약 4~6개월령</td><td style="text-align:left">140일간·약 4~8개월령</td></tr><tr><th>급여 사료, 방목초</th><td style="text-align:left">농후사료: 시판 인공유(3개월령까지), 시판 배합사료를 체중비 1% 상한(3개월령 이후). 방목초: 페레니얼 라이그라스 주체 초지, 2~5일 간격으로 윤목</td><td style="text-align:left">농후사료: 시판 배합사료를 2 kg 상한. 방목초: 켄터키 블루그라스 혼파 초지, 7일 간격으로 윤목</td><td style="text-align:left">농후사료: 시판 배합사료(CP 20%)를 급여량 50 g DM/MBS/일로 설정. 방목초: 오차드그라스 우점 초지, 3일마다 윤목 시 예취고 10 cm로 예취</td></tr><tr><th>시험 개시 시 일령(일)</th><td style="text-align:left">평균 50.9</td><td style="text-align:left">56.4±4.5</td><td style="text-align:left">—</td></tr><tr><th>시험 개시 시 체중(kg)</th><td style="text-align:left">평균 50.0</td><td style="text-align:left">80.4±6.5</td><td style="text-align:left">97.5±6.4</td></tr><tr><th>방목 종료 시 체중(kg)</th><td style="text-align:left">평균 185.4</td><td style="text-align:left">199.0±9.2</td><td style="text-align:left">266.8±13.9*</td></tr><tr><th>방목 기간 중 DG(kg/일)</th><td style="text-align:left">0.97±0.09</td><td style="text-align:left">1.01±0.05</td><td style="text-align:left">0.97±0.05*</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="218">•</span><span><span style="color:var(--ink-soft)">평균치±표준오차. *: 스기모토 등의 시험은 방목 종료 후에 1개월간 사사 사양한 시험 종료 시의 값. 사사 기간의 농후사료 설정은 방목 기간과 같고, 조사료는 티모시 주체 1번초 건초를 자유 채식시켰다.</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">소화관의 발달</div>
<p class="bx-num"><span class="bxn" data-n="219">•</span><span>방목 육성 송아지는 방목초를 다량 섭취하므로, 도입하는 비육 농가로부터는 소화관이 발달해 있을 것이 기대된다. 방목 육성 송아지는 사사 송아지에 비해 제1위, 제2위, 제4위, 소장, 대장의 중량이 크다는 보고가 있다<sup>28)</sup>. 조직학적 구조로서는 결장 점막층, 공장, 회장 및 맹장, 결장의 근층은 사사구보다 두껍다. 또한 맹장 및 결장의 점막세포 활성 향상, 공장 점막세포의 단백질 합성능 향상과 같이 기능적으로도 소화관 발달의 징후가 인정된다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">경영적 장점</div>
<p class="bx-num"><span class="bxn" data-n="220">•</span><span>흑모화종 송아지의 생산비는 1두당 약 60만 엔이 들며, 그중 40%를 사료비가, 30.8%를 노동비가 차지한다<sup>29)</sup>(그림 5-4-23, 2018년 현재). 송아지 생산에 지출되는 사료비는 약 24만 엔, 거세 약령 비육우의 사료비는 약 32만 엔이지만, 생산 개황으로부터 송아지 육성이 약 9개월간, 비육 기간은 20개월간이므로, 1일당 드는 사료비는 송아지기 쪽이 고액임을 알 수 있다. 이는 번식 전업 경영체를 압박하고 나아가 비육 밑소 가격의 급등과 비육 전업 경영체의 부담을 초래하고 있다고 생각되는데, 후술하는 모자 방목으로 육성하면 특히 고액인 대용유비가 들지 않고, 또 포유에 드는 노동 시간의 단축이 가능해진다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="221">•</span><span><i>그림 5-4-23 2018년도(헤이세이 30년도) 육용 송아지 생산비(원 그래프). 합계 59만 엔; 사료비 23만 7,620엔(40%), 노동비 18만 3,114엔(30.8%), 그 밖에 번식우 상각비, 수의 진료·의약품비, 종부료, 광열수도·동력비, 기타. 문헌 29에서 인용·개변</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">모자 방목의 장점</div>
<p class="bx-num"><span class="bxn" data-n="222">•</span><span>번식 경영체의 큰 노동 부담 중 하나로 이유 관리를 들 수 있다. 이유 시에는 사사에서 정밀하게 관리되고 있는 송아지라도 영양·심리면의 환경 변화가 초래하는 스트레스로 인해 발육 정체나 질병을 일으킨다. 모자 방목이라면 이유의 어려움을 회피하고 모유의 영양을 송아지의 발육에 활용할 수 있다. 출생 시부터 모자 방목하던 송아지를 3개월령에 이유한 사례와, 이유하지 않고 육성한 모자 방목 송아지의 사례를 표 5-4-8에 나타낸다. 방목지에서 이유한 송아지는 모자 방목 송아지에 비해 이유 후 3개월 체중이 작은 경향에 있으며, DG가 유의하게 낮다. 관찰 사례에서는 이유 후에 설사를 발증하는 개체가 많았고 쇠약의 징후가 보였다. 이유 시에는 충분한 순치(군에 대한 순치, 영양적 순치)가 필요하지만, 방목지에서는 집축(集畜)의 수고가 들기 때문에 순치가 불충분해질 우려가 있어, 방목하면서의 이유는 곤란하다고 생각한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="223">•</span><span>표 5-4-8 방목 암송아지의 이유의 영향.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>이유 송아지</th><th>모자 방목 송아지</th><th>P값</th></tr><tr><th>두수(두)</th><td style="text-align:left">10</td><td style="text-align:left">4</td><td style="text-align:left"></td></tr><tr><th>이유 시 일령(일)</th><td style="text-align:left">86.3±4.0</td><td style="text-align:left">84.3±1.7</td><td style="text-align:left">0.76</td></tr><tr><th>이유 시 체중(kg)</th><td style="text-align:left">94.7±5.7</td><td style="text-align:left">90.7±3.3</td><td style="text-align:left">0.68</td></tr><tr><th>이유 후 3개월 체중(kg)</th><td style="text-align:left">144.3±9.2</td><td style="text-align:left">172.1±3.9</td><td style="text-align:left">0.09</td></tr><tr><th>이유부터 3개월간의 DG(kg/일)</th><td style="text-align:left">0.59±0.06</td><td style="text-align:left">0.93±0.01</td><td style="text-align:left"><0.01</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="224">•</span><span><span style="color:var(--ink-soft)">모자 방목 송아지는 이유하지 않고 사양한다. 이유 시 체중, 이유 후 3개월 체중, 이유부터 3개월간의 DG는 이유 송아지가 이유한 같은 날의 값을 나타낸다. 농연기구 산지방목연구거점에서 2014~2016년의 각 7~10월에 켄터키 블루그라스 혼파 초지 약 0.38 ha의 소목구 6구(총면적 2.28 ha)에서 윤환 방목하였다. 키도(미발표)</span></span></p>
<p class="bx-num"><span class="bxn" data-n="225">•</span><span>2개월령까지의 흑모화종 송아지의 DG 변동은 어미소의 유량에 의해 80% 이상을 설명할 수 있다고 보고되어 있다<sup>30)</sup>. 방목 육성에서도 이유하지 않고 모자 방목으로 육성한 송아지의 DG는 포유량과 높은 상관을 나타낸다<sup>31)</sup>. 포유량은 12~16주령 이후부터 점감하기 시작하지만, 목초 채식량의 증가에 의해 12주령 이후는 포유량과 DG의 상관도 저하된다. 조사료 다급하에서는 12주령 시보다 더 이유 시기를 늦추는(30주령 이상) 쪽이 발육 성적이 향상된다는 보고가 있다<sup>32)</sup>. 이처럼 송아지의 발육에 어미소의 비유량은 관여하지만, 유량은 어미소의 계통 및 종모우의 유전적 능력에 의할 가능성이 있음에도, 흑모화종의 개량은 육질에 주력해 온 경위로 인해 비유 능력의 유전학적 정보는 결락되어 있다<sup>30,33)</sup>.</span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="226">•</span><span>■ 모자 방목의 유의점</span></p>
<div class="bx-sub"><div class="bx-subtitle">모자 방목우의 혈액 성상</div>
<p class="bx-num"><span class="bxn" data-n="227">•</span><span>방목을 활용한 소의 사양은 목초의 생육 세력이 계절에 따라 변동하는 것, 그리고 자유 채식이라는 점에서 영양적인 컨트롤이 곤란해진다. 그 일단으로서 혈액 성상을 그림 5-4-24에 나타낸다(농연기구 산지방목연구거점 조사, 2016~2017년, 켄터키 블루그라스 주체 혼파 초지에 방목한 농후사료 무급여 흑모화종 모자 8쌍의 데이터). 가로축은 송아지의 월령을 나타냈는데, 계절로는 7월 상순(1.8개월령)부터 9월 하순(4.5개월령)의 값이며, 그림에 표시한 X축과 평행한 직선은 사사우의 기준치<sup>34)</sup>이다. 글루코스, 혈중 요소 질소(BUN), 유리 지방산(NEFA)에 대하여 모자 간에 변동이 비슷한 경향이 보인다. 특히 BUN에서는 송아지 2.7개월령 시(7월 하순)에 현저히 값이 높은 어미 개체가 2예 보였는데, 그 송아지의 BUN도 높은 값을 나타냈다. 또한 이 조사 기간 송아지(거세우 8두, 1.8~4.5개월령)의 발육은 DG로 0.77±0.04 kg/일이었으나(최고치 0.96, 최소치 0.61 kg/일), 흑모화종 정상발육곡선의 범위 내에서 추이하였다<sup>35)</sup>.</span></p>
<p class="bx-num"><span class="bxn" data-n="228">•</span><span>BUN의 상승은 간 기능 장애, 번식성 저하나 유산을 초래할 위험성이 있어<sup>36)</sup>, BUN을 적절히 유지하는 관점에서 어미소에게는 CP 함량이 높은 목초지보다 억새(ススキ)나 조릿대(ネザサ)가 우점하는 야초지가 적합하다<sup>37)</sup>. 다만 야초지에서의 방목은 추계에 에너지 부족 및 미네랄 밸런스의 붕괴를 일으킬 위험성이 있다는 지적도 있다<sup>38)</sup>. 야초뿐 아니라 목초지라 하더라도 일반적으로 화본과 목초는 칼륨을 많이 함유하는 것, 또 토양 중 마그네슘 함량의 저하 등의 요인으로, 화본과 목초지에서의 방목 시에는 저마그네슘혈증(그래스 테타니)의 발생에 유의할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="229">•</span><span>송아지에게도 BUN이 높은 것은 주의해야 할 징후이다. 육성기의 성장 지체우는 사료 섭취량이 양호함에도 불구하고 에너지 마이너스의 징후가 나타난다<sup>39)</sup>(알부민 농도가 낮고 BUN, β-히드록시부티르산, 아세토아세트산이 고치가 된다). 다만 BUN을 낮게 유지할 수 있는 야초지에서의 송아지 육성은 에너지 섭취량으로서는 부족</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="230">•</span><span><i>그림 5-4-24 모자 방목우의 혈액 성상(송아지 1.8, 2.7, 3.7, 4.5개월령; ●어미소, ○송아지; 8패널). 총단백질(g/dL): 어미 약 7.5, 송아지 5.5→6.0. BUN(mg/dL): 어미 21→44(2.7개월령 피크)→28→31, 송아지 10→27→18→23(기준 상한 약 25). 글루코스(mg/dL): 어미 65~72, 송아지 89~97(기준 상한 약 75). 총콜레스테롤(mg/dL): 어미 150~170, 송아지 125~155. NEFA(μEq/dL): 어미 49→18→17→26, 송아지 31→23→17→23. iP(mg/dL): 어미 5~6, 송아지 8.8~9.9. Ca(mg/dL): 어미 9~9.7, 송아지 10.3~10.7. Mg(mg/dL): 어미 1.9~2.1, 송아지 1.9~2.2. 채혈 시기 1.8(7월 상순), 2.7(7월 하순), 3.7(8월 하순), 4.5(9월 하순). 직선은 기준치의 상한 및 하한(농림수산성: 가축공제에서의 임상병리검사요령, 1997), Error Bar: 표준오차. 키도(미발표)</i></span></p>
<p class="bx-num"><span class="bxn" data-n="231">•</span><span>표 5-4-9 이유한 흑모화종 거세우의 방목 성적.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th></th><th>옥외 패독 사료 CP 20%</th><th>방목 사료 CP 20%</th><th>방목 사료 CP 15%</th></tr><tr><th></th><td style="text-align:left">3개월령에 이유한 후 9개월령까지 공시. 어느 구도 배합사료 급여량은 50 g DM/MBS/일</td><td style="text-align:left"></td><td style="text-align:left"></td></tr><tr><th>조사료</th><td style="text-align:left">티모시 건초(자유 채식)</td><td style="text-align:left">목초(자유 채식)</td><td style="text-align:left">목초(자유 채식)</td></tr><tr><th>건물 섭취량(g DM/MBS/일)</th><td style="text-align:left">94.3</td><td style="text-align:left">97.4</td><td style="text-align:left">100.5</td></tr><tr><th>TDN 섭취량(g/MBS/일)</th><td style="text-align:left">66.5</td><td style="text-align:left">69.3</td><td style="text-align:left">70.4</td></tr><tr><th>이유 시 체중(kg)</th><td style="text-align:left">100.2±7.1</td><td style="text-align:left">97.5±6.4</td><td style="text-align:left">98.0±6.4</td></tr><tr><th>종료 시 체중(kg)</th><td style="text-align:left">283.5±15.2</td><td style="text-align:left">266.8±13.9</td><td style="text-align:left">262.6±13.9</td></tr><tr><th>DG(kg/일)</th><td style="text-align:left">1.01±0.06</td><td style="text-align:left">0.97±0.05</td><td style="text-align:left">0.94±0.05</td></tr><tr><th>복위/흉위(%)</th><td style="text-align:left">122.6±1.2</td><td style="text-align:left">123.5±1.1</td><td style="text-align:left">125.6±1.1</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="232">•</span><span><span style="color:var(--ink-soft)">문헌 27에서 인용·개변</span></span></p>
<p class="bx-num"><span class="bxn" data-n="233">•</span><span>이유 후 방목한 흑모화종 송아지에게 급여하는 사료(배합사료 보조 급여)에 대해 CP 함량을 조정한 예를 나타낸다<sup>27)</sup>(표 5-4-9). 방목 기간 중 급여하는 농후사료의 CP 함량을 낮추어도 DG에 차이는 없었고, 방목구는 반추위액 중 총휘발성지방산(VFA) 농도가 유의하게 높았으며 복위/흉위 비가 큰 경향을 보여, 소화관 발달이 우수함을 시사한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">친자 방목에서의 번식 관리</div>
<p class="bx-num"><span class="bxn" data-n="234">•</span><span>이유를 거치지 않고 친자 방목을 계속하면 송아지의 발육은 안정적으로 높은 수준에서 유지할 수 있다. 다만 송아지의 포유 자극이 계속되면 어미소의 발정 회귀가 지연될 위험이 있다<sup>30,40)</sup>. 포유 동물에서는 포유 자극이 원인이 되어 성선자극호르몬 방출호르몬(LH-RH) 분비가 억제되고, 이어서 뇌하수체에서 황체형성호르몬(LH)과 난포자극호르몬(FSH) 분비 억제 및 프로락틴 분비 항진이 유도된 결과, 난소에서는 난포 발육이 억제된다<sup>41)</sup>. 그러나 인위적으로 LH 또는 FSH를 투여하면 난포 발육이 촉진되는 것<sup>42)</sup>이 알려져 있고, 이를 번식 프로그램에 활용한 예가 있다<sup>43)</sup>. 합성 성선자극호르몬 방출호르몬(초산 페르틸레린, GnRH)과 프로스타글란딘(PG) F2α(클로프로스테놀)에 질내 유치형 프로제스테론 제제(CIDR)를 병용한 배란 동기화와 조기 임신진단을 조합하여 번식 관리를 하는 방법인데, 이를 통해 친자 방목 중인 번식우도 송아지가 포유하지 않는 번식우와 차이 없이 수태시킬 수 있다<sup>44)</sup>. 방목우에서는 발정 발견과 번식 관리에 따르는 소 모으기 작업이 부담이지만, 방목우 번식 관리 프로그램은 이러한 작업의 노동 경감을 도모하는 점에서도 유효하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">주년 친자 방목에 의한 비육 밑소 생산 사례</div>
<p class="bx-num"><span class="bxn" data-n="235">•</span><span>방목을 이용한 흑모화종 비육 밑소 생산의 실천 사례를 표 5-4-10에 나타낸다<sup>45)</sup>. 한랭지에서의 주년 방목은 겨울철에 건초 롤이나 벼 WCS를 급여하고, 온수를 주고, 우상을 보온하는 등의 방법으로 주년 방목을 실현하고 있다. 생산된 비육 밑소는 대체로 발육 성적이 양호하여, 종래 방목 송아지에 대한 부정적 평가(발육이 떨어진다, 사람에 길들지 않는다)를 불식시켰고, 송아지 시장에서는 조사료를 풍부하게 채식함에 따른 소화관 발달과 운동을 억제하지 않음에 따른 지제(脚部)의 튼튼함이 평가받고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="236">•</span><span>표 5-4-10 육용우 주년 친자 방목의 사례.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목</th><th>A 목장</th><th>B 목장</th><th>C 목장</th></tr><tr><th>입지 조건</th><td style="text-align:left">홋카이도 내륙(연평균 기온 6.8℃, 강수량 880 mm, 누적 적설 201 cm)</td><td style="text-align:left">이와테현 태평양 측</td><td style="text-align:left">규슈 북부 중산간지(연평균 기온 15.6℃, 강수량 1,422 mm)</td></tr><tr><th>노동력</th><td style="text-align:left">2명(경영주, 가족)</td><td style="text-align:left">2.2명(경영주, 가족)</td><td style="text-align:left">4명(경영주, 종업원)</td></tr><tr><th>경영 면적</th><td style="text-align:left">30 ha(이 중 방목 전용지 21 ha)</td><td style="text-align:left">15.6 ha(이 중 방목 전용지 3.6 ha)</td><td style="text-align:left">17 ha(방목 전용지)</td></tr><tr><th>사육 두수</th><td style="text-align:left">번식우(2세 이상): 65두 / 미경산우·송아지: 43두 / 경산 비육우: 22두</td><td style="text-align:left">번식우: 18두 / 육성우·송아지: 14두</td><td style="text-align:left">번식우: 38두 / 송아지: 21두</td></tr><tr><th>사양 관리</th><td style="text-align:left">주년 방목(티모시 건초 급여) / 송아지: 육성용 배합사료 1일 1~2 kg</td><td style="text-align:left">주년 방목(여름: 건초 롤 급여, 겨울: 건초 롤·사일리지 급여) / 송아지: 배합사료, 옥수수 사일리지 급여</td><td style="text-align:left">주년 방목(여름: 밀기울 급여, 겨울: 배합사료·벼 WCS 급여) / 송아지: 육성 배합사료 급여</td></tr><tr><th>송아지 발육 성적</th><td style="text-align:left">(거세, 일부) / 출하 시 체중 286 kg / 출하 시 일령 265일 / DG 1.0 kg/일</td><td style="text-align:left">출하 시 월령 8개월령</td><td style="text-align:left">(거세) / 출하 시 체중 282 kg / 출하 시 일령 291일 / DG 0.87 kg/일</td></tr><tr><th>번식 성적</th><td style="text-align:left">수태까지 평균 종부 횟수: 1.4회 / 평균 분만 간격: 421일</td><td style="text-align:left">평균 분만 간격: 411일</td><td style="text-align:left">수태까지 평균 종부 횟수: 1.9회 / 평균 분만 간격: 378일</td></tr></table></div></span></p>

<div class="bx"><div class="bx-title">6-2 안산을 위한 초회 임신기의 영양관리</div>
<div class="bx-sub"><div class="bx-subtitle">유용우</div>
<p class="bx-num"><span class="bxn" data-n="4">•</span><span>송아지 육성의 최종 목표는 안전한 분만과 분만 후 생산성의 확보이다¹⁾. 초산우에서는 모체의 체격에 대한 태아의 비율이 크기 때문에, 분만 시 체중(분만한 뒤의 체중)이 목표에 이르지 못한 경우 난산이 되기 쉽고, 또한 분만 후 유생산성의 저하를 초래한다¹⁾. 유용우의 평균 임신기간은 홀스타인 279일(262~309일), 저지 279일(270~285일), 브라운스위스 290일(270~306일), 에어셔 278일, 건지 284일로 기재되어 있어²⁾, 품종에 따라 다소 차이는 있으나 대략 10개월이다. 따라서 이 10개월간의 영양관리에 대해, 안전한 분만과 분만 후 생산성을 확보할 수 있는 초회 종부 시 및 초산 분만 시의 목표 체중, 사육 기준이 되는 일당증체량(DG), 그때의 건물섭취량(DMI)과 양분요구량, 아울러 사육환경에 대해서도 파악하는 것이 중요하다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">초회 발정과 월령 및 체중의 관계</div>
<p class="bx-num"><span class="bxn" data-n="5">•</span><span>초회 발정(춘기발동)은 유전적으로 결정된 월령과 체중이 관여하며, 홀스타인의 초회 발정 월령은 양호하게 발육한 경우 8개월령, 체중은 260 kg 전후, 체고는 115 cm 전후로, 체중과 체고는 월령과 관계없이 거의 일정하다¹˒³⁾. 일본사양표준(2017년판)에서는 초회 종부 개시 기준은 14~15개월령 이후, 목표 체중은 성숙 시 체중의 약 55%로 350 kg 정도, 체고 125 cm 정도로 되어 있다¹⁾. 그러나 근년에는 초산차의 유량이 증가하고 있어, 분만 후 유생산성의 관점에서 375 kg 정도에서의 수태가 권장되고 있다¹⁾. 또한 송아지의 출생 시 체중이 모우의 분만 전 체중의 9% 이하일 때 난산 발생률이 저하되므로, 예상되는 출생 송아지 체중의 적어도 11배의 체중으로 발육시킬 필요가 있다고 여겨지며, 초산 분만 시의 체중은 성숙 시 체중의 82~90% 정도를 적정으로 하고 있다¹⁾. 한편 NRC 사양표준(2001)의 목표 체중은 절식 후 체중(사료나 물을 섭취시키지 않고 하룻밤 절식한 뒤의 체중: 통상 체중의 96%)을 기준으로 생각되고 있다. 초회 종부 및 초산 분만 시의 목표 체중은 일본사양표준(2017년판)과 거의 같아 성숙 시의 각각 55%와 82%이며, 기보고된 성숙 시 체중 641 kg으로부터 각각 352 kg과 526 kg이 기준으로 되어 있다³⁾. 또한 캐나다의 1995~2012년 데이터에 기초한 조사에서는 15개월령, 24개월령 및 성숙 시 체중에 해당하는 3산 이상 경산우의 분만 시 체중이 각각 홀스타인 425 kg, 627 kg, 710 kg, 에어셔 334 kg, 482 kg, 625 kg, 저지 297 kg, 429 kg, 470 kg, 브라운스위스 379 kg, 560 kg, 670 kg이며, 각 유용우의 최적 수태 월령은 13.6개월령, 15.5개월령, 12.6개월령, 14.5개월령이었다고 제시하고 있다⁴⁾. 이 조사로부터 성장이 느린 에어셔 이외의 유용우는 24개월령에서의 초회 분만이 가능하며, 또한 일본사양표준(2017년판)에서도 초산 분만이 22~24개월령 정도에서 초산 시 유생산량이 높아진다고 하고 있다¹⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">초회 분만과 유량의 관계</div>
<p class="bx-num"><span class="bxn" data-n="6">•</span><span>영국의 대규모 조사에서는 21개월령 분만이 그 이후 월령에서의 분만에 비해 초산 시 305일 유량이 낮아지는 것으로 나타났으나, 생애 유량은 가장 많은 22개월령에 이어 두 번째였다⁵⁾. 또한 국내 조사에서는 육성우의 종부까지의 DG를 0.9~1.0 kg 정도로 높이고, 나아가 급여 사료 중 조단백질(CP) 함량도 높임으로써 11~12개월령에 수태시켜 21개월령에 초회 분만을 맞아도 초산 시 유생산성에 악영향이 없는 것으로 나타났다⁶⁾. 이 조사에서 수태 시 체중은 345 kg, 임신기간의 DG는 0.67 kg, 초산 분만 후 체중은 531 kg이었으므로⁶⁾, 종부 전 발육이 양호한 개체는 이들 수치를 목표로 사육함으로써 21개월령에서도 안전한 분만이 가능하다고 할 수 있다. 생산 현장에서 체중 측정이 곤란한 경우도 있으므로 흉위에 의한 체중 추정이 유효하다(표 6-2-1). 한편 초회 종부까지의 DG가 1.03 kg을 넘으면 유선 발달에 악영향을 미쳐 초산차의 유량이 저하된다고 보고되어 있다¹⁾. 또한 분만 시의 과비는 분만 후 케토시스나 지방간 등 대사병 발병 위험을 높이므로⁷˒⁸⁾, 체중뿐 아니라 BCS도 모니터링하면서 사육해야 한다.</span></p>

<div class="bx-sub"><div class="bx-subtitle">DG와 양분요구량의 관계</div>
<p class="bx-num"><span class="bxn" data-n="10">•</span><span>목표로 하는 DG를 달성시키기 위한, 임신요구량을 제외한 초임우 육성에 필요한 1일당 양분요구량을 표 6-2-2에 나타냈다. 나아가 일본사양표준(2017년판)에서는 태아 발육에 필요한 양분도 고려해야 한다고 제시하고, 분만 전 9~4주와 분만 전 3주~분만의 각 기간에 가산해야 할 양이 설정되어 있다¹⁾. 더불어 난산 회피와 육용 밑소 확보를 위해 유용우, 특히 홀스타인 미경산우에 흑모화종의 수정란 이식 또는 인공수정(AI)도 일상적으로 이루어지고 있으므로, 태아 품종별 발육에 필요한 1일당 양분요구량을 표 6-2-3에 나타냈다. 이들 기준치를 참고로 육성 암소의 월령과 임신 일령, 태아 품종을 고려한 사료 설계가 요망된다. 또한 양분요구량을 충족하기 위한 완전혼합사료(TMR) 급여 사료 중 양분 함량의 기준을 표 6-2-4에 나타냈다. 사료 중 CP 함량이 12% 이하가 되면 소화율이 저하되는 경향이 있으므로 TMR 급여 사료 중 CP는 12%로 하는 것이 바람직하다¹⁾. 이상의 영양관리에 의해 분만 예정일 8~6주 전에는 BCS⁹⁾가 3.25~3.50, 체중 약 580 kg(흉위 193 cm)에 도달해 있을 것, 거기서 분만까지의 BCS 증가는 0.25 이내로 억제하고 분만 시에는 3.50 정도로 할 것을 권장하고 있다¹˒¹⁰⁾. 나아가 임신 말기 21일간은 태아의 급성장에 더해 분만을 향한 호르몬의 혈중 농도 변화가 극적으로 일어나므로 채식량이 저하된다¹˒³⁾. NRC 사양표준(2001)에서는 이 기간의 DMI 추정식을 「DMI(체중 대비 %) = 1.71 − 0.69e^0.35t (t = 임신일수 − 280)」로 제시하고 있다³⁾. 더불어 이 기간은 유선의 성장도 고려하여 급여 사료 중 CP 함량을 15%(일본사양표준(2017년판)에서는 14% 정도), 건물 중 에너지 함량을 1.62 Mcal NE_L/kg(TDN 환산 70%)으로 할 것을 권장하고 있다¹˒³⁾.</span></p>

<div class="bx-sub"><div class="bx-subtitle">기온과 수분요구량</div>
<p class="bx-num"><span class="bxn" data-n="20">•</span><span>물도 중요한 영양소이다. 수분 섭취, 물의 체내 이동 및 방산은 체액과 태수의 항상성 유지, 사료의 소화관 내 이동과 소화·흡수, 세포 내 물질대사와 대사산물의 운반·배설 및 체온조절 등에 관여한다¹⁾. 육성우의 수분요구량은 몸의 유지와 성장, 태아의 성장, 분뇨, 땀, 폐와 피부로부터의 불감증산에 필요한 양이며, 기온 13℃ 이하에서는 DMI 1 kg당 3.5~3.6 kg이고, 기온이 이보다 높아지면 요구량은 기온이 1℃ 오를 때마다 0.1 kg 증가한다¹⁾. 육성우의 자유음수량은 사료의 건물 함량과 음의 상관관계에 있으나, 건물 함량이 33~48% 범위에서는 그 영향이 없다¹⁾. 또한 방목 시의 음수량은 체중 100 kg당 하절기 16 kg, 추절기 12 kg 정도가 기준이 된다¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="21">•</span><span>서열이나 한랭 같은 외기온의 영향과 방목 사양에 대해서도 고려할 필요가 있다. 육성우에서 서열의 영향은 종부 전 육성 전기보다 임신기인 육성 후기에 더 현저하며, 서열 환경에서는 증체가 억제되지만, 육성 전기에 서열 환경에서는 체단백질이 아닌 체지방의 축적 배분이 높아진다고 제시되어 있다¹⁾. 육성기의 여분의 지방 부착은 분만 후 대사병 발병의 요인이 된다⁷˒⁸⁾. 그 때문에 육성우에서도 비유우와 같은 대응이 필요하며, 기온이 떨어지기 시작하는 저녁 이후의 급이나, 발한과 유연에 의한 칼륨 및 나트륨 손실을 고려하여 환경온도가 26℃를 넘는 경우에는 미네랄 급여를 10% 증가시킬 것이 권장되고 있다¹⁾. 한편 한랭 시에 대해서는 서열 시에 비해 연구 보고가 적으나, 유량이 많을수록 발열량이 많기 때문에 비유하지 않는 육성우에서는 한랭 대책이 필요하다¹⁾. 한랭하에서 체온을 유지하기 위해 필요한 에너지는 표면적과 열생산량에 더해 풍속과 피모의 길이 및 상태가 관여한다³⁾. 피모의 단열 효과는 오염이 없고 건조한 상태에 비해 몸 아랫부분이 약간 오염된 경우 0.8배, 젖어서 엉킨 경우 0.5배, 젖은 눈이나 진흙으로 덮인 경우 0.2배로 저하된다는 점을 고려해야 한다³⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">목표 체중과 에너지요구량</div>
<p class="bx-num"><span class="bxn" data-n="22">•</span><span>방목 시에는 사사 시에 비해 채초나 보행 이동에 의한 에너지 소비량이 증가하는 것도 고려해야 하는데, 표 6-2-5에 나타낸 것처럼 유지에너지 증가량은 방목 조건에 따라 크게 다르다¹⁾. 가장 가까운 방목 조건의 초질을 기준으로, 표 6-2-6에서 채식 초량과 TDN 섭취량을 확인함과 아울러 유지요구량의 증가 비율로부터 표 6-2-7에 제시한 에너지요구량을 참조하여, 목표 체중 및 DG에 따른 영양관리가 필요하다.</span></p>

<p class="bx-num"><span class="bxn" data-n="29">•</span><span>표 6-2-7 방목 시 육성 암소의 1일당 에너지요구량.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>체중(kg)</th><th>DG(kg)</th><th>유지에너지 증가 10%: TDN(kg)</th><th>ME(Mcal)</th><th>20%: TDN(kg)</th><th>ME(Mcal)</th><th>30%: TDN(kg)</th><th>ME(Mcal)</th><th>40%: TDN(kg)</th><th>ME(Mcal)</th></tr><tr><th>300</th><td style="text-align:left">0.7</td><td style="text-align:left">4.4</td><td style="text-align:left">16.1</td><td style="text-align:left">4.7</td><td style="text-align:left">16.9</td><td style="text-align:left">4.9</td><td style="text-align:left">17.7</td><td style="text-align:left">5.1</td><td style="text-align:left">18.6</td></tr><tr><th>300</th><td style="text-align:left">0.9</td><td style="text-align:left">5.0</td><td style="text-align:left">18.0</td><td style="text-align:left">5.2</td><td style="text-align:left">18.9</td><td style="text-align:left">5.4</td><td style="text-align:left">19.7</td><td style="text-align:left">5.7</td><td style="text-align:left">20.5</td></tr><tr><th>400</th><td style="text-align:left">0.7</td><td style="text-align:left">5.5</td><td style="text-align:left">19.9</td><td style="text-align:left">5.8</td><td style="text-align:left">21.0</td><td style="text-align:left">6.1</td><td style="text-align:left">22.0</td><td style="text-align:left">6.4</td><td style="text-align:left">23.0</td></tr><tr><th>400</th><td style="text-align:left">0.9</td><td style="text-align:left">6.2</td><td style="text-align:left">22.3</td><td style="text-align:left">6.5</td><td style="text-align:left">23.4</td><td style="text-align:left">6.8</td><td style="text-align:left">24.4</td><td style="text-align:left">7.0</td><td style="text-align:left">25.5</td></tr><tr><th>500</th><td style="text-align:left">0.7</td><td style="text-align:left">6.5</td><td style="text-align:left">23.6</td><td style="text-align:left">6.9</td><td style="text-align:left">24.8</td><td style="text-align:left">7.2</td><td style="text-align:left">26.0</td><td style="text-align:left">7.5</td><td style="text-align:left">27.2</td></tr><tr><th>500</th><td style="text-align:left">0.9</td><td style="text-align:left">7.3</td><td style="text-align:left">26.4</td><td style="text-align:left">7.6</td><td style="text-align:left">27.7</td><td style="text-align:left">8.0</td><td style="text-align:left">28.9</td><td style="text-align:left">8.3</td><td style="text-align:left">30.1</td></tr></table></div></span></p>

<div class="bx-sub"><div class="bx-subtitle">초종과 계절에 따른 변화</div>
<p class="bx-num"><span class="bxn" data-n="31">•</span><span>초종의 차이나 계절에 따른 성분 변화에도 유의해야 한다. 일반적인 한지형 목초의 건물 중 TDN 함량 및 CP 함량은 오차드그라스와 티머시에서 봄 75%와 20~25%, 여름 65%와 18%, 가을 70%와 17%, 페레니얼라이그라스에서 봄 80%와 23%, 여름 70%와 22%, 가을 75%와 30%, 메도우페스큐에서 봄 75%와 20%, 여름과 가을 67%와 30%이다¹⁾. 또한 잔디(시바)의 TDN 함량은 봄·여름·가을 모두 52% 정도이고 CP 함량은 10~12%로 매우 낮다¹⁾. 나아가 방목 시 초고와 초량, 식생에 따른 방목초의 영양 변화나, 자교성 곤충에 대한 행동 변화도 방목 시 채식량과 에너지 소비량에 영향을 미친다는 점에 유의해야 한다¹⁾.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">사사 시의 주의점</div>
<p class="bx-num"><span class="bxn" data-n="32">•</span><span>시설의 제한이 없는 방목 시에는 소의 하루 행동의 약 80%를 채초 행동, 반추 행동, 횡와 행동이 차지한다¹¹⁾. 그 때문에 사사 시에는 소의 행동에 지장이 없는 휴식 장소와 채식 장소, 음수 설비를 설계해야 한다. 표 6-2-8에 육성우사에서 횡와와 기립 시 행동에 지장이 없는 설계치를 나타냈다¹¹⁾. 우상 폭은 소가 회전하지 않도록 요각폭의 75퍼센타일 값의 2배 정도로 해야 한다¹¹⁾. 또한 채식 장소가 부적절한 경우에는 몰아먹기나 골라먹기, 사조를 둘러싼 과도한 투쟁 행동 등이 일어나며, 특히 서열이 낮은 소에서는 채식 행동이 현저히 제한되므로, 임신 말기에 육성우와 경산우를 한 무리로 사양하는 경우에는 특히 배려가 필요하다¹¹⁻¹³⁾. 사조 폭은 우군 두수 × 요각폭의 1.5배로 하고, 통로 폭은 16개월령 미만에서 3,000 mm, 16개월령 이상에서 3,600 mm가 필요하다¹¹⁾. 급수기의 적절한 높이와 폭은 월령에 따라 다르며, 높이는 12~16개월령 75 cm, 16~20개월령 78 cm, 20개월령~분만 1개월 전 80 cm이고, 1두당 폭은 각각 50 cm, 55 cm, 60 cm로 하고 있다¹¹⁾.</span></p>
<p class="bx-num"><span class="bxn" data-n="33">•</span><span>표 6-2-8 육성우사 휴식 장소의 설계치.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>단계</th><th>체중(kg)</th><th>프리반: 1두당 면적(m²)¹⁾</th><th>프리스톨: 우상 길이(mm) 전방 폐쇄²⁾/전방 개방³⁾</th><th>브리스킷 로케이터~연석 거리(mm)</th><th>넥레일~연석 거리(mm)</th><th>우상 폭(mm)</th><th>넥레일 높이(mm)</th></tr><tr><th>12~16개월령</th><td style="text-align:left">340~430</td><td style="text-align:left">5.6</td><td style="text-align:left">2,200/1,800</td><td style="text-align:left">1,530</td><td style="text-align:left">1,480</td><td style="text-align:left">1,000</td><td style="text-align:left">1,050</td></tr><tr><th>16~20개월령</th><td style="text-align:left">430~520</td><td style="text-align:left">6.5</td><td style="text-align:left">2,300/1,900</td><td style="text-align:left">1,610</td><td style="text-align:left">1,560</td><td style="text-align:left">1,100</td><td style="text-align:left">1,100</td></tr><tr><th>20개월령~분만 1개월 전</th><td style="text-align:left">520~550</td><td style="text-align:left">7.5</td><td style="text-align:left">2,400/2,000</td><td style="text-align:left">1,650</td><td style="text-align:left">1,600</td><td style="text-align:left">1,150</td><td style="text-align:left">1,150</td></tr></table></div></span></p>

</div>
<div class="bx-sub"><div class="bx-subtitle">육용 번식우(흑모화종)</div>
<p class="bx-num"><span class="bxn" data-n="38">•</span><span>육용우 번식경영(흑모화종)에서는 송아지가 거의 유일한 생산물이며, 유산 또는 난산에 의한 사산은 경영상 큰 손실이 된다. 또한 송아지가 생산되어도 면역력이 떨어지고 각종 질병에 저항력이 없으면 발육도 떨어져 시장 가치가 낮아진다. 따라서 안산으로 튼튼한 송아지를 생산하는 것이 중요하다. 한편 미경산우는 앞으로 많은 산자를 낳을 것으로 기대되지만, 발육과 임신이 동시에 진행되는 시기이며 큰 스트레스를 받고 있는 상황에 있다. 특히 초산 시의 난산은 자궁 손상 등을 고려하면 향후 번식에 큰 악영향을 줄 가능성이 있다. 또한 분만 후 비유량도 성숙한 소에 비해 적을 것으로 생각되어 송아지 발육에 미치는 영향도 유의해야 한다. 이를 바탕으로 미경산우의 관리에 대해서는 충분히 신경 쓰고 정성껏 할 필요가 있다. 다만 육용 미경산우 관리에 관한 보고는 극히 적으므로, 여기서는 일반적인 경산우에 관한 지견도 바탕으로 미경산우의 임신기에 대해 해설한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">영양관리로 조절할 수 없는 부분</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="39">•</span><span><b>초회 종부 시 미경산우의 체격, 성숙도</b></span></p>
<p class="bx-num"><span class="bxn" data-n="40">•</span><span>흑모화종은 8개월령 전후에 성성숙을 맞고 13개월령 전후에 초회 교배를 하는 것이 일반적이다¹⁴⁾. 교배 시 체중은 300 kg, 체고는 116 cm로 되어 있으나¹⁵⁾, 흑모화종은 각 지역에서 개량된 품종이므로 계통에 따라 체형에 차이가 보인다. 계통도 고려하여 발육의 양부를 판단하고 교배에 공시할 필요가 있다¹⁵⁾.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="41">•</span><span><b>초회 종부 시 주의사항</b></span></p>
<p class="bx-num"><span class="bxn" data-n="42">•</span><span>미경산우는 경산우에 비해 체격이 작기 때문에, 정상적으로 분만 기전이 일어났다 하더라도 태아가 큰 경우에는 난산 위험이 높아진다고 생각된다. 흑모화종의 임신기간과 송아지의 출생 시 체중은 태아(송아지)의 유전자형의 영향을 받는다고 보고되어 있으므로¹⁶⁾, 미경산우의 교배 시 사용하는 정액의 선택은 중요하다. 근년에는 육종개량이 진행되어 증체 형질이 우수한 종모우가 많아졌는데, 증체 형질이 우수하다는 것은 출생 후뿐 아니라 태내에서도 우수하다고 생각할 수 있다. 또한 임신기간이 길어짐으로써 출생 시 체중도 커질 수 있다. 이로부터 안산을 최우선으로 생각한다면, 종모우의 후대검정 시 임신기간이나 산자의 출생 시 체중을 조사하는 등, 적어도 미경산우의 교배 종모우 정액은 극단적인 증체계 종모우의 이용을 피하는 등 신중하게 선택할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="43">•</span><span>표 6-2-9 육우 육성 암소의 1일당 요구량.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>체중(kg)</th><th>DG(kg)</th><th>건물량(kg)</th><th>CP(g)</th><th>TDN(kg)</th><th>Ca(g)</th><th>P(g)</th><th>비타민A(1,000 IU)</th></tr><tr><th>250</th><td style="text-align:left">0.6</td><td style="text-align:left">5.64</td><td style="text-align:left">658</td><td style="text-align:left">3.5</td><td style="text-align:left">21</td><td style="text-align:left">13</td><td style="text-align:left">10.6</td></tr><tr><th>300</th><td style="text-align:left">0.6</td><td style="text-align:left">6.46</td><td style="text-align:left">700</td><td style="text-align:left">4.01</td><td style="text-align:left">22</td><td style="text-align:left">14</td><td style="text-align:left">12.7</td></tr><tr><th>350</th><td style="text-align:left">0.6</td><td style="text-align:left">7.26</td><td style="text-align:left">739</td><td style="text-align:left">4.5</td><td style="text-align:left">22</td><td style="text-align:left">15</td><td style="text-align:left">14.8</td></tr><tr><th>400</th><td style="text-align:left">0.4</td><td style="text-align:left">7.34</td><td style="text-align:left">673</td><td style="text-align:left">4.29</td><td style="text-align:left">19</td><td style="text-align:left">15</td><td style="text-align:left">17</td></tr><tr><th>450</th><td style="text-align:left">0.4</td><td style="text-align:left">8.02</td><td style="text-align:left">709</td><td style="text-align:left">4.69</td><td style="text-align:left">20</td><td style="text-align:left">17</td><td style="text-align:left">19.1</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="44">•</span><span>※ 주) 문헌 14에서 인용·개변.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">사양관리</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="45">•</span><span><b>초회 임신기(수정 시)의 영양관리(기본 개념)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="46">•</span><span>일반적으로 미경산우는 경산우보다 수태하기 쉽다고 하지만, 적정한 사양관리를 게을리하면 수태율 저하를 초래하게 된다. 미경산우는 발육 도중에 있어 섭취해야 할 영양량이 나날이 증가하기 때문에, 섭취 양분량의 부족은 발육 저하를 가져오고 초회 발정이 늦어지는 경향이 있다¹⁷⁾. 한편 과잉 양분 섭취는 과비에 의한 번식성 저하를 초래한다고 생각된다. 또한 경산우에서는 CP의 과잉 섭취가 번식성 저하를 일으킨다는 보고가 있으며¹⁸⁾, 이는 미경산우에서도 마찬가지라고 생각된다. 과잉 CP 섭취는 제1위에서 과잉 암모니아 발생을 가져오고, 이 과잉 암모니아는 간에서 분해(해독)되게 된다. 이 시기의 미경산우는 간기능이 경산우만큼 높지 않다고 생각되므로, 암모니아 분해는 간의 부담을 증대시켜 간기능 저하 등을 일으킬 수 있다. 한편 CP 부족도 번식성을 저하시킬 가능성이 있다¹⁹⁾. 이로부터 미경산우에서는 경산우 이상으로 TDN, CP 섭취량의 과부족에 유의할 필요가 있다. 육용 미경산우의 필요 양분량을 표 6-2-9에 나타냈다.</span></p>
<p class="bx-num"><span class="bxn" data-n="47">•</span><span>또한 흑모화종은 다른 품종에 비해 자연 쌍태 발생률이 낮다고 여겨지지만, 지속적으로 영양상태가 나쁜 우군에서는 흑모화종에서도 이란성 쌍태 발생률이 높아지는 것이 의심되는 사례가 보고되어 있다²⁰⁾. 쌍태는 단태에 비해 난산이 될 가능성이 높으므로, 과거에 자연 쌍태 발생이 인정된 농장에서는 미경산우에 한하지 않고 초음파검사 등으로 쌍태 여부를 확인함과 아울러 사료 설계의 재확인이 필요하다. 또한 쌍태 임신의 경우 임신기간은 짧아지는 경향이 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="48">•</span><span>이처럼 초회 임신에서 미경산우의 사양관리는 자신의 발육에 필요한 양분을 섭취하면서 과잉 양분 섭취를 막는 것이 중요하다. 과비가 된 미경산우의 사료 급여량을 줄이는 것은 발육 정체도 초래할 수 있으므로 그 후의 사료 설계는 어려워진다. 이 때문에 사료 설계와 섭취 영양량의 확인 및 영양상태 모니터링으로서 체중과 영양도, BCS의 확인을 수시로 해 나갈 필요가 있다. 대사 프로파일 테스트 등을 이용해 영양상태를 모니터링하는 수법도 있으나, 미경산우는 발육에 맞추어 혈액검사치가 변동하므로(그림 6-2-1)²¹⁾, 경산우의 적정치²²⁾를 이용한 안이한 혈액진단은 피해야 한다고 생각된다(표 6-2-10).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="49">•</span><span><i>그림 6-2-1 흑모화종 미경산우의 혈액생화학검사치와 월령의 관계(문헌 21의 보고에서 월령에 따른 변화가 보인 항목을 발췌하여 작도). 12~21개월령에 걸쳐 Glu(혈당)는 약 85→60 mg/dL로 저하, FFA(유리지방산)는 약 80~130에서 110~225 μEq/L로 상승, T-cho(총콜레스테롤)는 약 115~140에서 75~115 mg/dL로 저하, Ca(칼슘)는 9.7~10.5 mg/dL로 거의 일정.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="50">•</span><span>표 6-2-10 경산우와 미경산우의 혈액생화학검사치 비교.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>항목</th><th>미경산우 12개월령</th><th>15개월령</th><th>19개월령</th><th>경산우 건유(유지)기</th><th>임신 말기</th></tr><tr><th>Glu(mg/dL)</th><td style="text-align:left">81±5</td><td style="text-align:left">73±4</td><td style="text-align:left">68±7</td><td style="text-align:left">64±5</td><td style="text-align:left">62±7</td></tr><tr><th>FFA(μEq/dL)</th><td style="text-align:left">104±25</td><td style="text-align:left">99±30</td><td style="text-align:left">143±53</td><td style="text-align:left">115±56</td><td style="text-align:left">158±79</td></tr><tr><th>BHB(μmol/dL)</th><td style="text-align:left">573±52</td><td style="text-align:left">498±63</td><td style="text-align:left">517±101</td><td style="text-align:left">439±104</td><td style="text-align:left">594±156</td></tr><tr><th>Alb(g/dL)</th><td style="text-align:left">3.7±0.1</td><td style="text-align:left">3.7±0.2</td><td style="text-align:left">3.7±0.2</td><td style="text-align:left">3.8±0.2</td><td style="text-align:left">3.6±0.2</td></tr><tr><th>T-cho(mg/dL)</th><td style="text-align:left">127±11</td><td style="text-align:left">111±21</td><td style="text-align:left">99±21</td><td style="text-align:left">89±18</td><td style="text-align:left">92±14</td></tr><tr><th>BUN(mg/dL)</th><td style="text-align:left">14±2</td><td style="text-align:left">13±2</td><td style="text-align:left">11±1</td><td style="text-align:left">11±2</td><td style="text-align:left">10±2</td></tr></table></div></span></p>

<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="52">•</span><span><b>초회 임신기(분만 전)의 영양관리, 군 관리</b></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="53">•</span><span><b>(임신 말기) 분만 2개월 전 이전의 관리(영양상태)</b></span></p>
<p class="bx-num"><span class="bxn" data-n="54">•</span><span>미경산우는 임신기간 중에도 자신이 발육하고 있으므로, 모체 발육에 필요한 양분량은 조금씩이지만 서서히 늘어나게 된다. 이 때문에 임신 말기에는 성우보다 체격이 작음에도 불구하고 필요한 양분량은 성우보다 많아질 가능성이 있다. 예를 들어 13개월령 전후에 초회 교배를 한 경우 분만은 23개월령 전후가 되는데, 이 월령의 평균 체중은 428.9 kg¹⁴⁾이 된다. 체중 400 kg의 미경산우라도 발육하고 있는 경우에는 체중 450 kg의 성우보다 필요한 양분량이 많아진다(표 6-2-11). 이 시기가 분만 전 2개월이 되는 경우에도 필요한 양분량이 성우보다 많아진다는 점을 유의해 둘 필요가 있다(표 6-2-11). 이로부터 미경산우의 임신 후기는 체중과 BCS, 임신 월령을 지표로 한 사료 설계가 중요하다. 더불어 미경산우의 임신 말기는 체중에 대해 DMI가 많아지는 시기이기도 하므로, 사료 설계대로의 사료량을 섭취하고 있는지 항상 확인할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="55">•</span><span>표 6-2-11 성우와 미경산우의 임신 말기 필요 양분량 비교.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>구분</th><th>항목</th><th>체중(kg)</th><th>DG(kg)</th><th>건물량(kg)</th><th>CP(g)</th><th>TDN(kg)</th></tr><tr><th>성우</th><td style="text-align:left">성우의 유지에 필요한 양분량</td><td style="text-align:left">450</td><td style="text-align:left">—</td><td style="text-align:left">6.04</td><td style="text-align:left">479</td><td style="text-align:left">3.02</td></tr><tr><th>성우</th><td style="text-align:left">성우의 유지에 필요한 양분량 + 임신 말기 양분량¹⁾</td><td style="text-align:left">450</td><td style="text-align:left">—</td><td style="text-align:left">7.04</td><td style="text-align:left">691</td><td style="text-align:left">3.85</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량</td><td style="text-align:left">350</td><td style="text-align:left">0.4</td><td style="text-align:left">6.64</td><td style="text-align:left">635</td><td style="text-align:left">3.88</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량 + 임신 말기 양분량</td><td style="text-align:left">350</td><td style="text-align:left">0.4</td><td style="text-align:left">7.64</td><td style="text-align:left">847</td><td style="text-align:left">4.71</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량</td><td style="text-align:left">400</td><td style="text-align:left">0.2</td><td style="text-align:left">6.42</td><td style="text-align:left">556</td><td style="text-align:left">3.52</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량 + 임신 말기 양분량</td><td style="text-align:left">400</td><td style="text-align:left">0.2</td><td style="text-align:left">7.42</td><td style="text-align:left">768</td><td style="text-align:left">4.35</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량</td><td style="text-align:left">400</td><td style="text-align:left">0.4</td><td style="text-align:left">7.34</td><td style="text-align:left">673</td><td style="text-align:left">4.29</td></tr><tr><th>미경산우</th><td style="text-align:left">암소의 육성에 필요한 양분량 + 임신 말기 양분량</td><td style="text-align:left">400</td><td style="text-align:left">0.4</td><td style="text-align:left">8.34</td><td style="text-align:left">885</td><td style="text-align:left">5.12</td></tr></table></div></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="56">•</span><span>※ 주1) 일본사양표준 육용우 2008년판에 기재된 임신 말기 2개월간에 더하는 양분량. 문헌 14에서 인용·개변.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="57">•</span><span><b>초회 임신기(분만 전)의 영양관리의 영향</b></span></p>
<p class="bx-num"><span class="bxn" data-n="58">•</span><span>임신 말기의 영양상태 저하는 태아(송아지)의 면역에 악영향을 미친다는 보고가 많이 나와 있다²³⁻²⁶⁾. 이 때문에 미경산우에서도 임신 말기에는 적절한 증사를 할 필요가 있다. 그러나 과비 상태라면 난산 위험이 높아질 가능성이 있으므로 증사를 주저하지 않을 수 없다. 임신 말기의 증사는 적정한 BCS가 전제이며, 증사 전인 임신 후기에 과비로 만들지 않는 것이 중요하다. 난산 발생 예방으로 분만 전 모우의 사료 급여량을 줄이는 행위는 모우의 영양 부족을 초래하여 분만 지연을 일으키는 요인의 하나로 생각된다²⁷⁾. 소의 분만은 태아에서 분비되는 부신피질호르몬이 방아쇠가 된다고 여겨지므로²⁸⁾, 태아의 영양상태 저하로 장기의 성숙이 늦어지면²⁹⁾ 분만 개시 신호가 늦어져 임신기간이 길어질 가능성이 있다. 이러한 상태에서 임신기간이 길어지면 분만 유기를 하게 되는데, 성숙하지 않은 송아지가 허약하다는 것은 쉽게 상상이 간다. 태아도 태어난 송아지도 동일한 개체이므로, 태아기에 영양불량이나 스트레스 부하에 노출되면 출생 송아지에도 영향이 나오는 것은 당연하다고 생각된다. 또한 미경산우는 경산우에 비해 저영양의 영향을 받기 쉽다고 여겨지며, 분만 후 비유성이나 번식성이 저하될 가능성이 있다¹⁴⁾.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="59">•</span><span><b>분만 유기</b></span></p>
<p class="bx-num"><span class="bxn" data-n="60">•</span><span>분만 유기에 대해서는 태반 정체 발생이 많아지는 경향이 있을 뿐 아니라, 분만 유기로 태어난 송아지는 면역능이 낮아질 가능성이 지적되고 있다²⁹⁾. 임신기간이 길어져 부득이 분만 유기를 하는 경우에는 송아지가 허약할 가능성을 고려하면서, 장기 재태가 다발하는 경우에는 교배 종모우나 모우의 영양관리를 재점검할 필요가 있다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="61">•</span><span><b>영양관리의 정확도를 높이기 위한 사양관리</b></span></p>
<p class="bx-num"><span class="bxn" data-n="62">•</span><span>미경산우는 경산우에 비해 체격이 작고 군 사육 경험이 얕기도 하여, 경산우 무리에 섞어 사양하면 사회적 순위가 낮아지는 경향이 있다. 그 결과 충분히 사료를 섭취하지 못하거나 스트레스 부하가 커져 영양상태가 악화될 수 있다. 원래 미경산우는 경산우와 필요한 양분량이 다르다는 점과, 이러한 사회적 순위에 의한 영양상태 악화를 고려하면, 군 사육의 경우에는 경산우와의 혼사를 가급적 피해야 한다. 다만 미경산우만의 관리에서도 영양섭취량의 균일화는 중요하므로, 군 관리에서는 사료 섭취 중의 연동 스탠천 이용이 유효하다(그림 6-2-2).</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="63">•</span><span><i>그림 6-2-2 사료 섭취량의 균일화에 대하여(문헌 31에서 인용·개변). 군 사육의 경우 사료 섭취 중에는 연동 스탠천 등을 이용해 사료 섭취량을 균일화한다. 동일 군은 가급적 같은 체격의 소로 구성하고 사료 급여량을 평등하게 한다.</i></span></p>
<p class="bx-num"><span class="bxn" data-n="64">•</span><span>또한 분만 전에는 소독을 실시한 분만방을 준비하고 깔짚 등을 충분히 깔아 둔다. 1두만 있게 되는 고립 스트레스를 피하기 위해, 가능하면 분만방은 우군이 보이는 장소에 설치한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="65">•</span><span><b>미경산우의 방목</b></span></p>
<p class="bx-num"><span class="bxn" data-n="66">•</span><span>미경산우를 방목 이용하는 경우, 방목 순치가 충분히 되어 있지 않은 상황에서는 섭취 사료의 감소에 따라 영양 부족이 될 가능성이 있다. 또한 방목 순치가 되어 있는 경우에도 경사지 보행이나 서열, 한랭 등으로 양분요구량이 증가할 뿐 아니라, 방목초의 사료 성분이나 기호성에 따라 섭취 양분량의 과부족이 생길 가능성이 있다. 이처럼 방목 이용에서는 필요한 양분량이나 섭취 양분량의 파악이 곤란하므로 체중과 BCS 등을 정기적으로 확인하는 것이 중요하다. 섭취 양분량이 부족한 경우에는 필요에 따라 배합사료 등의 추가 급여가 필요하다. 한편 방목은 포식 상태가 되므로 방목초의 영양가가 높은 경우에는 과비나 CP의 과잉 섭취로 이어진다. CP의 과잉 섭취는 번식성 저하뿐 아니라 유산의 가능성도 지적되고 있으므로³⁰⁾, 방목초의 사료 성분과 초량은 사전에 확인해 둘 필요가 있다. 또한 미경산우는 방목 경험이 적기 때문에 다양한 초종을 입에 댈 가능성이 있으므로, 방목지에 소에게 해가 되는 풀이 없는지 등 방목 전에 방목지의 식생을 확인할 필요가 있다. 임신우를 방목 이용하는 경우에는 분만 예정일 2개월 전까지 방목을 종료하고 임신 말기의 사양관리로 전환하는 것이 이상적이다. 방목 중에 과비나 삭수 등이 보인 경우에는 분만 2개월 전보다 일찍 방목을 끝내고 BCS를 조정할 필요가 있다. 이처럼 미경산우의 방목은 경산우보다 면밀한 관리가 중요하다.</span></p>
<p class="bx-num"><span class="bxn" data-n="67">•</span><span><span style="color:var(--ink-soft)">(저자: 와타나베 다카유키)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="68">•</span><span><span style="color:var(--ink-soft)">일본송아지 6-2 안산을 위한 초회 임신기의 영양관리.</span></span></p>
</div>
<div class="bx"><div class="bx-title">6-3 유방의 발달</div>
<p class="bx-num"><span class="bxn" data-n="69">•</span><span>성장(Growth)에는 물리적인 중량의 증가뿐 아니라 조직의 발달(Development)도 포함된다. 동물은 여러 기관을 발달시키면서 성장하지만, 발달 시기는 기관에 따라 각각 다르다. 반추동물의 경우 출생 후 가장 이른 시기에, 그리고 짧은 기간에 발달하는 것이 제1위이며, 송아지의 제1위가 성우와 같은 기능을 갖게 되는 것은 2~3개월령 무렵이다. 또한 번식기관이 급속히 발달하는 시기는 6개월령 무렵부터로 생각되며, 이르면 8개월령 무렵, 통상 10개월령 정도에 첫 발정이 관찰된다. 이처럼 출생 후 1년 이내에 제1위는 발달을 마치고 번식능력을 획득한다. 한편 유방은 분만이 가까워짐에 따라 커지기 때문에 임신기간의 발달만이 강조되지만, 이 변화는 극히 일부에 지나지 않으며, 태아기부터 비유할 때까지 장기간에 걸쳐 발달을 계속한다. 또한 유선 발달(Mammary development)은 영양상태나 호르몬의 영향을 크게 받는다. 그래서 본 절에서는 홀스타인의 단계별 유선 발달, 그리고 유선 발달과 사료·영양수준 및 호르몬의 관련을 중심으로 개설한다.</span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="70">•</span><span>■ 단계별 유방 발달</span></p>
<div class="bx-sub"><div class="bx-subtitle">태아기의 유방 발달</div>
<p class="bx-num"><span class="bxn" data-n="71">•</span><span>홀스타인의 태아기는 약 280일간이지만, 유방 조직의 큰 변화는 태아기의 처음 2/3(약 180일간)에 일어난다¹⁾(표 6-3-1). 태령 30일 무렵에 태아 양측의 겨드랑이에서 하복부에 걸쳐 선상으로 피부가 비후하기 시작하여, 유선제(乳腺堤, Milk band), 유선조(乳腺縞, Milk streak), 유선(乳線, Milk line)을 거친 뒤 분절되어 징검돌 모양의 유점(乳点, Milk point)이 된다. 1개의 유점은 장래의 유방 1개에 해당하며, 소에서는 2쌍(4유점)을 남기고 나머지는 퇴행한다. 이 유점이 다시 유릉(乳稜, Milk crest), 유구(乳塚, Milk hillock)의 과정을 거쳐 융기하여 유선아(乳腺芽, Milk bud)가 된다. 유선제에서 유선아까지 소요되는 일수는 10일 전후이며, 이 기간에 두부에서 둔부까지의 길이(Crown-rump length)는 14 mm에서 25 mm 정도로 성장한다. 태령 65일 무렵부터 유두가, 110일까지는 유두조와 유선조(乳腺槽) 및 유관의 원기가 형성되고, 수태 180일의 두부에서 둔부까지의 길이는 480 mm 정도가 되며, 이때까지는 유두층, 유방 내의 지방층(Fat pad) 및 유방을 복벽에서 매달아 지탱하는 중앙제인대(Median suspensory ligament)가 형성된다. 이후로는 중량과 체적이 증가해 가며, 조직학적으로 큰 변화는 없지만 부수되는 기본구조(혈관, 신경, 림프관)가 나타난다. 출생 시에는 유방 내부가 지방층으로 차 있다. 유관은 유두의 기부(작은 유선조)에 약간 인정될 뿐이다(그림 6-3-1).</span></p>
<p class="bx-num"><span class="bxn" data-n="72">•</span><span>표 6-3-1 소의 태아기에 있어서 유방의 분화와 태아의 크기.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>유방의 분화</th><th>임신일령</th><th>두부~둔부 길이(mm)</th></tr><tr><th>유선제</th><td style="text-align:left">32</td><td style="text-align:left">14</td></tr><tr><th>유선조(縞)</th><td style="text-align:left">34</td><td style="text-align:left">16</td></tr><tr><th>유선(線)</th><td style="text-align:left">35</td><td style="text-align:left">17</td></tr><tr><th>유릉</th><td style="text-align:left">37</td><td style="text-align:left">19</td></tr><tr><th>유구</th><td style="text-align:left">40</td><td style="text-align:left">21</td></tr><tr><th>유선아</th><td style="text-align:left">43</td><td style="text-align:left">25</td></tr><tr><th>유두</th><td style="text-align:left">65</td><td style="text-align:left">80</td></tr><tr><th>유선조(槽)</th><td style="text-align:left">110</td><td style="text-align:left">230</td></tr><tr><th>유두조</th><td style="text-align:left">130</td><td style="text-align:left">300</td></tr><tr><th>중앙제인대·지방층</th><td style="text-align:left">180</td><td style="text-align:left">480</td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="73">•</span><span><span style="color:var(--ink-soft)">문헌 1에서 인용·개변</span></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="74">•</span><span><i>그림 6-3-1 출생 직후의 유방(홀스타인). 전·후 방향 표시, 지방층(Fat pad)과 유두(Teat)의 위치가 표시되어 있다. 컬러 화보 15쪽. 원도: 大坂郁夫(이하 동일)</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">출생 후~수태까지의 유방 발달</div>
<p class="bx-num"><span class="bxn" data-n="75">•</span><span>유방의 발달 정도는 어느 시점의 체중(X)에 대한 유방의 성장속도(Y)로 평가한다. 이를 「상대성장」이라 하며, 일차식으로 log Y = log b + α log X로 나타낸다. α는 「성장계수」 또는 「성장비」라 하며, α < 1인 경우 Y는 X보다 느린 성장속도, α ≒ 1.0인 경우 Y는 X와 같은 성장속도, α > 1인 경우 Y는 X보다 빠른 성장속도가 되며, 각각 「열상대성장(Negative allometric growth)」 「등성장(Isometric growth)」 「우상대성장(Positive allometric growth)」이라 한다. 이 기간의 유방은 우상대성장을 하고 있으나, 특히 체중 100 kg(3개월령) 정도에서 250 kg(10개월령) 정도가 될 때까지의 기간에 발달이 현저하다(α = 3.5)²⁾(그림 6-3-2). 우상대성장 기간에 유두에서 유관이 지방층 방향으로 서로 교차하지 않고 수상(樹狀)으로 신장하는 동시에 유선실질이 형성되고, 지방조직은 주변부로 밀려나 결합·지지조직이 된다(그림 6-3-3). 유방 발달은 수태할 때까지 이보다 앞선 단계(유선포의 형성)로는 진행하지 않는다. 등성장으로 돌아가면 유방의 체적은 증가하지만, 이는 세포의 증식(Hyperplasia)이 아니라 세포가 비대화(Hypertrophy)하기 때문이다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="76">•</span><span><i>그림 6-3-2 육성우에 있어서 유선조직의 DNA량과 체중의 관계. 세로축 유선조직 DNA량(mg, 1~10,000 대수눈금), 가로축 체중(kg, 50~400). 체중 약 100 kg까지 α=1.6, 100~250 kg 구간 α=3.5, 그 이후 α=1.5. Log Y = Log b + α Log X. 문헌 2에서 인용·개변</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="77">•</span><span><i>그림 6-3-3 6개월령의 유방(홀스타인). 전·후 방향, 유선실질·지방·유관·유두 표시. 컬러 화보 15쪽</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수태 후의 유방 발달</div>
<p class="bx-num"><span class="bxn" data-n="78">•</span><span>임신기의 유방 발달은 임신 초기에는 큰 변화가 보이지 않으나, 임신 110~140일 이후부터 급속히 발달한다. 지방층 내의 지방조직은 유관, 유선포, 혈관, 림프관, 콜라겐이나 엘라스틴 등의 지지결합조직으로 치환된다. 임신기간 중 유관은 지방층 전역에 걸쳐 신장을 계속하지만, 선단 부위(Bud)가 유선포로 분화하여 지수함수적으로 증식한다. 유선포 내의 하나하나의 세포를 「유선상피세포」, 각 유선포가 소유관으로 연결되어 포도송이처럼 된 형상을 「유선소엽」, 여러 유선소엽의 집합을 「유선엽」이라 한다(그림 6-3-4). 비유 시에는 모세혈관에서 유선포로 영양을 받아들여 포 내부에 유즙을 분비한다. 분비된 유즙은 세유관에서 더 굵은 유관으로 이행하여 최종적으로는 유선조로 이어진다. 그림 6-3-4는 분만 시의 유방이지만 임신 후기의 유방과 거의 같다. 그림 6-3-4는 유방 내에 유즙이 가득 차 있기 때문에 전체가 희지만, 적어도 분만 30일 전까지는 유당 합성이 없고 지방 합성도 거의 이루어지지 않기 때문에 실제로는 연한 분홍색을 띤다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="79">•</span><span><i>그림 6-3-4 분만 시의 유방(홀스타인). 전·후 방향, 유선엽·유선소엽·유선상피세포·유선포·소유관·유관·유선조·유두조의 위치를 모식도와 함께 표시. 컬러 화보 15쪽</i></span></p>
</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="80">•</span><span>■ 영양과 유선 발달의 관련</span></p>
<div class="bx-sub"><div class="bx-subtitle">출생~수태까지의 유선 발달</div>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="81">•</span><span><b>출생~2개월령</b></span></p>
<p class="bx-num"><span class="bxn" data-n="82">•</span><span>지금까지 포유기는 등성장기이며 우상대성장기가 될 때까지 유선실질의 발달은 최소한이라는 것이 공통된 견해였다. 생산현장에 널리 보급된 제한포유법은 포유 횟수가 적다는 노동력 절감, 포유기간 중 인공유(스타터) 섭취량이 높아짐에 따른 제1위 발달 촉진 효과에 더하여, 송아지의 유방 중에 포함되는 지방 축적이 적어지므로 이유 후의 우상대성장기에 유선 발달을 저해하지 않고 장래의 우유 생산을 향상시키는 방법이라고 믿어져 왔다. 그러나 포유기간에 단백질 함량이 높은 대용유(건물 중 CP 28~29%)를 써서 포유량을 높인 고증체 송아지는 유방 중량이 많아지지만 유선 발달을 저해하지 않으며³⁾, 오히려 유선세포 증식에 의한 유선실질량 및 지방층량의 증가(그림 6-3-5)가 인정되고 있다⁴⁻⁶⁾. 이처럼 유선 발달이 촉진됨으로써 초산 유량의 향상도 시사되고 있다⁷,⁸⁾. 또한 포유량의 증가는 mRNA 발현에 변화를 주어 형태적·생리적으로 유선조직의 발달에 영향을 준다고도 한다⁹⁾. 이러한 사실로부터, 포유량을 높여 영양조건을 좋게 하면 우상대성장은 포유기부터 시작되고, 체적이 증가한 지방층 내에서 일어나는 유관의 신장이나 유선실질로의 치환도 많아져 장래의 우유 생산 향상으로 이어진다고 생각되고 있다. 또한 송아지기의 사회적·물리적 제한이나 변화(개체 사육에서 군 사육으로 등) 같은 환경요인도 장래의 생산성(우유 생산, 번식)에 영향을 준다는 것이 제시되어 있다¹⁰⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="83">•</span><span>*그림 6-3-5 지방층량(좌) 및 유선실질량(우)의 비교. 제한포유 vs 강화포유: 지방층량 약 30 g vs 약 175 g, 유선실질량 약 1.5 g vs 약 10 g, \<i>P<0.01. 문헌 5에서 인용·개변</i></span></p>
<p class="bx-num" style="font-weight:700;margin-top:10px"><span class="bxn" data-n="84">•</span><span><b>3개월령~수태</b></span></p>
<p class="bx-num"><span class="bxn" data-n="85">•</span><span>우상대성장기에 성장 촉진을 목적으로 과잉 에너지를 섭취시키면 일당증체량(DG)은 증가한다. 그러나 잉여 에너지를 지방으로 지방층 내에 축적함으로써 세포가 비대화하여 유관의 신장이 방해된다(그림 6-3-6). 그 때문에 우상대성장기의 DG는 0.7 kg 이하로 제한하는 것이 권장되어 왔다. 그러나 급속히 프레임 사이즈가 커지는 이 시기에는 단백질 요구량이 높아진다. 에너지에 대한 단백질 비율의 검토에서는, 에너지와 함께 단백질 비율을 높인 사료를 급여하면 DG가 1.1 kg 정도라도 지방 축적에 의한 과비가 되지 않고 체격이 커지며¹¹⁾, 초산 유량이 저하하지 않는 것이 보고되어 있다¹²⁾. 다만 그 상한에 대해서는 아직 검토의 여지가 있으므로, 일본사양표준(2017)¹³⁾에서는 안전을 감안하여 상한을 0.95 kg 정도로 하고 있다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="86">•</span><span><i>그림 6-3-6 농후사료 다급 시의 유방(흑모화종). 지방·유선실질·유관·유두 표시, 전·후 방향</i></span></p>
<p class="bx-num"><span class="bxn" data-n="87">•</span><span>이상, 출생부터 수태까지 유선을 충분히 발달시키기 위해 영양 면에서 공통되는 것은 사료의 단백질량을 높이는 것, 에너지와 균형을 맞추는 것, 섭취량을 높이는 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">수태 후의 영양수준과 유선 발달</div>
<p class="bx-num"><span class="bxn" data-n="88">•</span><span>수태 후의 고에너지 사료는 유선 발달에 영향을 미치지 않는다. 이 시기는 주로 유선포가 비약적으로 증식하는 시기로, 유관도 충분히 신장해 있기 때문에 영향을 받지 않는다. 반대로 체중이 증가하면 유량도 증가하는 경향이 있다. 표 6-3-2에 임신기의 체중 증가량 차이에 따른 우유 생산에의 영향을 나타냈다. 임신기의 증체량을 높이면 초산차의 4% 지방보정유량(Fat correct milk: FCM)이 약 1,000 kg 증가하였다. 이는 유선 발달에 대한 영양의 효과라기보다, 분만 후의 체지방 동원량의 차이나 체격도 커져 있었기 때문에 비유기에 섭취한 영양분의 성장과 우유 생산으로의 배분 비율이 변화한 결과로 생각된다.</span></p>
<p class="bx-num"><span class="bxn" data-n="89">•</span><span>표 6-3-2 임신기간의 DG 차이와 체격 및 초산차 우유 생산.<div class="bxt-wrap"><table class="bxt bxt-spec"><tr><th>임신기간의 DG</th><th></th><th>0.5 kg/일</th><th>0.8 kg/일</th></tr><tr><th>체고</th><td style="text-align:left">수태 시(cm)</td><td style="text-align:left">128.1</td><td style="text-align:left">128.6</td></tr><tr><th></th><td style="text-align:left">분만 시(cm)</td><td style="text-align:left">135.6</td><td style="text-align:left">139.4</td></tr><tr><th></th><td style="text-align:left">건유 시(cm)</td><td style="text-align:left">140.0</td><td style="text-align:left">140.0</td></tr><tr><th>우유 생산</th><td style="text-align:left">실유량(kg)</td><td style="text-align:left">6,821\*</td><td style="text-align:left">7,638\*</td></tr><tr><th></th><td style="text-align:left">유지방(%)</td><td style="text-align:left">3.96</td><td style="text-align:left">4.13</td></tr><tr><th></th><td style="text-align:left">4% FCM(kg)</td><td style="text-align:left">6,776\<i>\</i></td><td style="text-align:left">7,777\<i>\</i></td></tr></table></div></span></p>
<p class="bx-num"><span class="bxn" data-n="90">•</span><span><span style="color:var(--ink-soft)">\<i>P<0.05, \</i>\*P<0.01</span></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">호르몬과 유선 발달의 관련</div>
<p class="bx-num"><span class="bxn" data-n="91">•</span><span>유선의 발달에는 많은 호르몬이 복잡하게 관여하고 있다. 임신하지 않은 육성우의 난소를 절제하면 혈중 에스트로겐(E₂) 농도가 극히 낮은 농도가 되어¹⁴⁾ 유선조직의 발달이 현저히 방해된다¹⁵⁾. 이유 후에 E₂를 투여하면 지방층이나 유선실질량이 많아지고, 포유기에 영양수준을 높임으로써 그 효과는 현저하다(그림 6-3-7)는 것⁵⁾이나, 유선포 증식이 현저한 임신 후기에 E₂가 증가한다(그림 6-3-8)는 것¹⁶⁾으로부터, E₂는 육성기 전반의 유선 발달에 영향을 준다. 한편 프로게스테론은 그러한 효과가 작다. 뇌하수체 전엽 호르몬의 하나인 프로락틴은 래트, 마우스 등에서 유선의 분화에 필요하다고 되어 있으나 소에 대한 효과는 작다. 또한 성장호르몬(GH)은 그 자극을 통해 인슐린양 성장인자(IGF)-1이나 그 밖의 성장·증식인자가 유선 발달에 영향을 준다고 한다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="92">•</span><span><i>그림 6-3-7 이유 후 2주간의 E₂ 임플란트 유무와 지방층량(좌) 및 유선실질량(우)의 비교. 제한포유 / 제한포유+E₂ / 강화포유 / 강화포유+E₂: 지방층량 약 38(a) / 60(ab) / 88(b) / 128(c) g, 유선실질량 약 2(a) / 5(a) / 15.5(b) / 27.5(c) g. abc: 다른 부호 간 유의차 있음, P<0.05. 문헌 5에서 인용</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="93">•</span><span><i>그림 6-3-8 임신기간 중의 스테로이드 호르몬 농도. 가로축 임신기간(일, 50~250, 배란~분만), 세로축 혈장 중 스테로이드 호르몬 농도(대수눈금, 10 pg~100 ng). 프로게스테론은 배란 직후 급상승하여 약 100 ng 수준에서 임신기간 내내 유지되다 분만 직전 급감. 포합형 에스트로겐, 포합형 17α 에스트라디올, 포합형 17β 에스트라디올, 17α 에스트라디올, 에스트론, E₂, 에스트리올은 임신 100~150일 이후 점증하여 분만 직전 급격히 상승. 문헌 16에서 인용·개변</i></span></p>
<p class="bx-num"><span class="bxn" data-n="94">•</span><span><span style="color:var(--ink-soft)">(저자: 大坂郁夫)</span></span></p>
</div>
<p class="bx-num"><span class="bxn" data-n="95">•</span><span><span style="color:var(--ink-soft)">일본송아지 6-3 유방의 발달.</span></span></p>
</div>
<div class="bx"><div class="bx-title">부록2 동물복지</div>
<div class="bx-sub"><div class="bx-subtitle">동물복지란 무엇인가</div>
<p class="bx-num"><span class="bxn" data-n="96">•</span><span>영어로는 Animal welfare, 이를 가타카나로 적으면 아니마루 웨루훼아, 일본어로 번역하면 가축(동물) 복지가 된다. 동물복지란 "태어나서 도축될 때까지 가능한 한 스트레스를 억제하여 사육하고 수송하자"는 사고방식이다. 가장 쉽게 말하면 "가축의 삶을 좋게 한다"고도 할 수 있을 것이다.</span></p>
<p class="bx-num"><span class="bxn" data-n="97">•</span><span>그러나 결국은 죽여서 먹어 버리는 가축인데 왜 복지를 생각할 필요가 있느냐며 위화감을 느끼는 소비자가 많은 듯하다. 복지라는 말에는 사회복지, 장애인복지, 고령자복지, 생활보호 등 사회적 약자를 지원하는 이미지가 강하기 때문이다. "Welfare"에는 행복이나 안녕이라는 의미도 있지만, 복지로 번역해 버리면 이 의미가 빠져 버린다. 그래서 (공사) 축산기술협회에서는 "쾌적성을 배려한 가축의 사육관리"라고 정의하고, 가타카나로 아니마루 웨루훼아라고 표기하도록 하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="98">•</span><span>인간에게 살 권리가 보장되어 있다면 인간 이외의 동물에게도 그 권리를 주어야 한다고 생각하는 "동물의 권리" 사상과 "동물복지"의 사고방식은 근본적으로 다르다. "동물의 권리" 사상은 가축을 인간을 위해 이용하는 것을 부정하지만, "동물복지"의 사고방식은 동물을 인간을 위해 이용하는 것을 인정한 다음 적절한 사육관리를 지향하는 것으로, 지금까지의 축산 방식을 반성하고 탄생부터 도축될 때까지 과학적 근거에 기초하여 쾌적성을 배려한 사육방법을 지향하려는 사고방식이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">동물애호와의 차이</div>
<p class="bx-num"><span class="bxn" data-n="99">•</span><span>동물에 대한 일본 고유의 사상으로 "동물애호"가 있으며, 이는 우리 일본인에게 깊이 침투해 있을 뿐 아니라 "동물의 애호 및 관리에 관한 법률(동물애호관리법)"도 있다. 동물애호란 "동물을 귀여워하고 보호하는" 것으로, 주어는 사람이고 사람의 심정이나 행위가 있다. 동물복지는 동물 자체의 상태를 말하는 것이지 사람의 심정이나 행위를 말하는 것이 아니다. 동물복지는 어디까지나 동물이 어떻게 느끼고 있는지를 과학적으로 판단하려는 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">카우 컴포트와의 차이</div>
<p class="bx-num"><span class="bxn" data-n="100">•</span><span>카우 컴포트란 소를 쾌적한 환경에서 사육하면 생산성도 향상된다는 생산자 입장에서의 사고방식으로, 미국과 캐나다에서 퍼져 일본의 낙농가와 지도기관에서도 쓰이게 되었다. 소의 입장에서 보면 동물복지든 카우 컴포트든 마찬가지이며, 관리자가 가축이 쾌적해지도록 사육관리에 힘쓰는 것이므로 양자에 차이는 없다. 그러나 카우 컴포트는 소비자 입장에서의 것이 아니라는 점, 카우=젖소만을 가리키며 애니멀 컴포트라고는 거의 말하지 않는다는 점에서, 세계적으로는 동물복지를 쓰는 쪽이 일반적이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">동물복지의 역사와 국제 동향</div>
<p class="bx-num"><span class="bxn" data-n="101">•</span><span>동물복지 사고방식의 토대가 된 것은 영국의 주부 루스 해리슨이 1964년에 쓴 저서 『애니멀 머신(공장축산)』이다. 경제성장에 따라 가축 사육두수가 대폭 증가한 결과, 가축의 집약적 사육방식이 일반화되어 왔다. 이 책에서 루스 해리슨은 "생명 있는 가축을 인간의 욕구대로 고기, 우유, 알의 제조기계처럼만 다루고 있으며, 마치 공장에서 그것들을 생산하는 것 같다"고 호소하였다. 이 책을 통해 동물복지라는 사고방식이 시민에게 퍼졌고, 영국 의회는 노스웨일스대학의 브람벨 교수를 위원장으로 하는 전문위원회를 만들어 과학적 조사를 하여 브람벨 보고서로 답신하였다. 거기에는 "복지는 육체적 건강과 정신적 건강 양쪽을 포괄하는 넓은 의미의 말이다. 따라서 복지는 동물 자체의 구조, 생리 및 행동으로부터 판단하는 동물 자체의 심적 체험에 관한 과학적 사실을 바탕으로 고려되어야 한다"고 기술되어 있다. 그리고 가축이라도 살아 있는 한 불필요한 고통이나 괴로움을 받지 않을 권리의 보장을 요구하는 "동물복지"라는 사상으로부터 가축의 사육방식을 규제하기 위한 법적 체제가 정비되기 시작하였다.</span></p>
<p class="bx-num"><span class="bxn" data-n="102">•</span><span>유럽에서는 1998년에 농용동물보호지령이 시행되었고, 나아가 산란계, 돼지, 송아지 각각에 사양기준이 정해져 있다. 성우의 것은 아직 없지만, 송아지에 관해서는 1991년에 채택되어 1997년에 일부 개정된 지령이 있다. 거기에서는 8주령 이후의 단사 펜에서의 사육과 포유 시 이외의 계류 사육을 금지하고, 면적, 조명, 사료 등에 대해서도 규정하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="103">•</span><span>1993년에 영국 정부에 의해 설립된 농용동물복지심의회(FAWC)는 다음의 5가지 자유(파이브 프리덤스)를 제창하였고, 이것이 동물복지에 관한 세계적 공통 인식이 되어 있다. 즉 ①굶주림과 갈증으로부터의 자유, ②질병과 부상으로부터의 자유, ③불쾌한 환경으로부터의 자유, ④정상 행동을 발현할 자유, ⑤공포와 고통으로부터의 자유이다. 이들 자유를 최대한 충족시키는 것이 가축의 복지 수준을 향상시키는 것으로 이어진다. 가축 자신이 "어떻게 느끼고 있는가"를 과학적으로 파악하는 것이 매우 중요해진다.</span></p>
<p class="bx-num"><span class="bxn" data-n="104">•</span><span>국제수역사무국(OIE, 별명: 세계동물보건기구)은 일본도 가맹하고 있는 수역에 관한 국제조직이다. 질병의 전파 방제에 그치지 않고 가축의 건강과 동물복지는 밀접한 관계에 있다고 인정하여, 동물복지의 세계기준이 되는 가이드라인 작성을 검토하고 있다. 2004년 총회에서 동물복지 원칙에 관한 지침을 채택하였고, 2005년에는 동물복지의 4가지 기준을 채택하였다. 4가지 기준이란 식용가축의 도축, 육상수송, 해상수송, 질병관리 목적의 처분에 관한 것이다. 그 후 가축종별 사육관리에 관한 기준이 검토되기 시작하여, 2012년에 동물복지와 육우 생산시스템, 2013년에 동물복지와 브로일러 생산시스템, 2015년에 동물복지와 젖소 생산시스템이 채택되었다. 현재는 산란계에 대한 기준 책정이 진행되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">해외 동물복지 인증제도의 동향</div>
<p class="bx-num"><span class="bxn" data-n="105">•</span><span>구미에서는 동물보호단체나 생산단체에 의해 사육기준(평가법)이 정해져 있다. 먼저 가장 잘 알려진 영국 왕립동물학대방지협회(RSPCA)의 평가법을 소개한다. RSPCA는 영국의 가장 오래된 동물보호단체이며, 소비자에게 동물복지를 배려하여 사육된 생산물인지를 제시하기 위해 1994년에 프리덤 푸드라는 식품 라벨을 개발하였다. 5가지 자유를 충족하는 것을 바탕으로 작성된 평가기준이며, 이를 충족하면 그 생산물에 이 라벨을 표시하여 판매할 수 있다. 사육관리뿐 아니라 수송, 도축까지 1년에 1회 정도 점검된다. 현재 젖소, 육우, 돼지, 양, 산란계, 브로일러, 칠면조, 오리 등 12가축종에 대한 기준이 작성되어 있다. 나아가 영국 환경·식료·농촌지역부(Defra)가 작성한 Code of recommendations for the welfare of livestock에 기재된 법률을 숙지하는 것도 요구되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="106">•</span><span>미국에서는 2003년에 설립된 NPO인 인도적 가축관리(HFAC)가 동물복지 인증을 하고 있으며, "Certified humane raised and handled" 라벨로 12종 가축의 우유, 고기, 알이 판매되고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="107">•</span><span>미국과 캐나다에서 유기농 식품을 판매하는 대형 식품체인인 홀푸드마켓은 2011년에 동물복지 인증시스템을 도입하여, 매장에서 판매되는 모든 소고기, 닭고기 및 돼지고기에 5단계의 복지 수준을 나타내는 라벨을 부착하고 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="108">•</span><span>독일과 오스트리아에서는 유기축산의 판단기준으로 Animal needs index(ANI)라는 소, 돼지, 닭에 관한 사육환경 평가기준이 실제로 이용되고 있다. 젖소용 ANI에서는 운동, 사회적 관계, 바닥, 조명과 공조, 스톡맨십(관리자와 소의 관계)의 5항목에 대해 세밀하게 점수를 매기고, 그 합계 점수로 복지 수준을 평가한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="109">•</span><span>유럽에서는 2004년부터 2009년까지 총액 1,700만 유로를 들여 44개 대학과 연구기관이 참가한 Welfare quality 프로젝트를 통해 소(젖소, 육우, 송아지고기용 송아지), 돼지(번식돈, 비육돈), 닭(산란계, 브로일러)의 동물복지 평가법을 개발하였다. 젖소에서는 적절한 사양, 적절한 축사, 적절한 건강성, 적절한 행동의 4측면에 대해 합계 12개의 기준이 있고, 그 아래에 합계 18개의 평가항목이 설정되어 있다. 최종적으로 농가의 복지 수준을 우, 양, 가, 불가 중 하나로 판정한다. 핀란드의 Juustoportti사에서는 이 인증을 받아 "Welfare Quality" 라벨이 표시된 우유가 2017년부터 판매되고 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">국내 동물복지의 동향</div>
<p class="bx-num"><span class="bxn" data-n="110">•</span><span>해외의 동물복지 움직임을 받아 농림수산성은 "동물복지에 대하여"라는 홈페이지를 작성하고 있다. (공사) 축산기술협회 및 (공사) 일본마사협회도 동물복지 사고방식에 대응한 사양관리지침을 가축종별(육우, 젖소, 브로일러, 산란계, 돼지, 말)로 작성하고 있다. 이를 바탕으로 사진과 그림을 더해 해설한 『동물복지 향상을 지향하여 – AW를 향상시키기 위한 사양관리 –』도 마련되어 있다. 이처럼 국내에서도 동물복지에 대한 대응을 시작하고 있다. 그렇다면 낙농가가 어떤 사육방법을 하면 "쾌적성을 배려한 가축의 사육관리"라고 할 수 있고, 제3자가 동물복지적 사육이라고 판단할 수 있을까. 그래서 瀬尾(세오)의 연구실에서는 지금까지의 연구 지견과 이미 해외에 있는 동물복지 평가기준을 바탕으로 일본에서도 이용할 수 있는 젖소용 동물복지 평가법을 작성하였다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">국내 동물복지 인증제도</div>
<p class="bx-num"><span class="bxn" data-n="111">•</span><span>瀬尾 등은 2016년 5월에 (일사) 동물복지축산협회¹⁾를 설립하였다. 앞서 말한 젖소용 동물복지 평가법을 바탕으로 기준의 재검토와 평가항목 추가 등의 개량을 더한 평가기준(표 1, 320쪽)에 따라 동물복지 인증을 하고 있다. 평가기준은 "동물" "관리" "시설"의 베이스별로 나뉘어 있으며, 각 베이스 모두 기준을 충족한 항목의 비율이 80%를 넘는 것을 인증 조건으로 하고 있다. 협회의 심사원이 농장에 들어가 가축의 상태, 사육관리 방법 및 사육환경을 평가하여 인증한다. 1년째는 하계와 동계 2회의 농장심사가 있다. 1년째 심사에 합격하면 2년째 이후는 연 1회 인증이 된다. 1년째에 2회 심사를 하는 이유는 하계와 동계에 가축의 환경이 크게 다르기 때문이다. 예를 들어 방목을 도입하고 있는 홋카이도나 도호쿠 지방의 농가에서는 봄부터 방목을 시작해도 가을·겨울에는 강설 때문에 방목이 어려워져 축사에서의 사육이 중심이 된다. 심사에 합격하지 못한 경우는 지적받은 점의 개량에 힘쓰고 재심사를 받게 된다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="112">•</span><span><i>그림 1 (일사) 동물복지축산협회의 인증 마크</i></span></p>
<p class="bx-num"><span class="bxn" data-n="113">•</span><span>인증을 받은 목장은 협회가 정한 인증 마크(그림 1)를 목장 간판에 표시할 수 있다. 제품에 인증 마크를 표시하려면 인증되지 않은 농장의 원료를 사용하지 않았는지 등을 확인하는 사업소 심사도 받아 합격할 필요가 있다.</span></p>
<p class="bx-num"><span class="bxn" data-n="114">•</span><span>인증된 제품이 판매됨으로써 생산자와 소비자에게 알릴 기회를 늘릴 수 있고, 소비자의 선택 폭이 넓어진다. 소비자는 동물복지에 관심이 있더라도 그것이 어떤 것인지 막연한 이미지밖에 없었지만, 이 라벨이 붙은 상품을 선택함으로써 동물복지에 힘쓰는 생산농가를 지원할 수 있다. 현재는 젖소뿐이지만 앞으로는 육우와 돼지 등으로도 넓혀 갈 것이다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">인증기준에서 송아지에 관한 평가항목</div>
<p class="bx-num"><span class="bxn" data-n="115">•</span><span>여기서는 낙농가에서 평가기준 중 기준을 충족하는 일이 적거나, 별로 의식되지 않아 실천되고 있지 않은 송아지 관련 항목에 대해 기술한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 송아지에 대한 급수(그림 2)</div>
<p class="bx-num"><span class="bxn" data-n="116">•</span><span>이 항목에서는 스타터를 급여받고 있는 송아지가 충분한 양의 신선한 물을 상시 음수할 수 있는 것을 기준으로 하고 있다. 포유 중에는 물을 주지 않아도 된다고 생각하는 사람이 많지만, 포유 중인 송아지에게도 물은 필요하다²⁾. 포유 중에 인공유(스타터)가 송아지의 제1위 점막을 자극하려면 발효와 휘발성지방산(VFA) 생성이 필요하며, 그러려면 제1위 내에 충분한 물(유리수)이 필수이다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="117">•</span><span><i>그림 2 급수되고 있는 포유 송아지 펜</i></span></p>
<p class="bx-num"><span class="bxn" data-n="118">•</span><span>전유나 대용유는 제2위구 반사에 의해 전위를 통과하므로 유리수로서 작용하지 않기 때문에, 이들과는 별도로 물을 급여하는 것이 빠질 수 없다³⁾. 대용유 포육의 경우 음수 부족으로 염류중독을 일으켜 중추신경장애가 생길 우려가 있으므로, 그 농도에 맞춘 충분한 급수가 필요하다³⁾. 또한 물은 체액의 항상성 유지, 사료의 소화관 내 이동과 소화·흡수, 물질대사 및 체온조절을 위해 중요하며⁴⁾, 일본사양표준 젖소⁵⁾에는 대용유 포육 중인 송아지의 음수량이 동계 0.3~1.0 kg/일, 하계 2.0~4.2 kg/일로 기재되어 있다. 한편 스타터 섭취량과 음수량은 연동하므로²˒⁶⁾ 스타터 급여량에 따라 물 급여량을 조절할 필요가 있다. 나아가 워터컵을 이용하는 경우는 송아지가 레버를 누를 수 있게 될 때까지 컵에 물이 떨어지지 않도록 한다⁴⁾. 또한 양동이나 수조에 분변이나 사료가 들어가 있으면 수질이 악화될 뿐 아니라⁷⁾ 미끈거림도 음수량 감소의 원인이 되므로⁸⁾, 양동이와 수조는 자주 청소하여⁹⁾ 송아지가 항상 신선한 물을 마실 수 있도록¹⁰⁾ 배려해야 한다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">우상의 부드러움(그림 3)</div>
<p class="bx-num"><span class="bxn" data-n="119">•</span><span>이 항목에서는 곰팡이가 피지 않은 잘 마른 청결한 깔짚을 5 cm 이상의 두께로 깔고 있는 것을 기준으로 하고 있다. 출생부터 이유까지 송아지는 하루의 73~81%의 시간을 횡와에 쓰므로¹¹⁾, 설사를 일으키는 병원체의 분구감염을 최소한으로 억제하기 위해 잠자리 관리는 매우 중요해진다. 깔짚을 깔면 분변에 포함된 미생물로부터 송아지를 멀리할 수 있는 동시에 송아지의 쾌적성도 증가한다¹²⁾. 또한 깔짚은 송아지의 체온 유지에 도움이 되므로¹³⁾ 두껍게 깔짚을 까는 것은 중요하다. 이는 송아지가 어미소에 비해 체중당 표면적이 크고, 제1위 기능이 미발달하여 발효열을 기대할 수 없으며, 체모가 짧아 보온성이 부족하고, 체지방 축적이 적은 등의 이유로 추위에 약하기¹⁴⁾ 때문이다. 그러나 깔짚을 두껍게 깔았더라도 그것이 분뇨로 오염되어 있으면 송아지의 체온을 빼앗거나¹⁵⁻¹⁷⁾ 호흡기질환 등을 일으키므로¹⁸⁻²¹⁾, 자주 깔짚을 교환하여 청결하고 건조한 상태¹⁶⁾를 유지할 필요가 있다. 또한 곰팡이가 발생한 깔짚을 섭식한 소에서는 이개와 꼬리 끝 등의 괴사나 왼쪽 뒷다리의 괴저 등의 증상이 인정된 예²²⁾가 보고되어 있어, 깔짚을 깔 때에는 곰팡이가 발생하지 않았는지 주의할 필요가 있다²³˒²⁴⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="120">•</span><span><i>그림 3 청결하고 건조한 깔짚이 두껍게 깔린 포유 송아지 펜</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">제각(그림 4)</div>
<p class="bx-num"><span class="bxn" data-n="121">•</span><span>이 항목에서는 제각을 4주령 이내에 실시하고 있는 것(마취 하 실시가 바람직함)을 기준으로 하고 있다. 다만 유전적으로 무각이 되는 정액을 이용하는 등 제각이 필요 없는 경우도 기준을 충족하는 것으로 하고 있다. 근년에는 이러한 정액이 판매되고 있는데, 무각은 우성유전이므로 제각 작업이 불필요해지기²⁵⁾ 때문에 HFAC는 무각이 되는 정액의 이용을 권장하고²⁶⁾, 또 OIE에서는 제각보다 무각 소를 선택하는 쪽이 바람직하다고 하고 있다²⁷⁾. 이처럼 동물복지 관점에서는 제각을 하지 않는 것이 바람직하지만, 소는 다른 소나 사람에게 뿔로 들이받기를 하는 경우가 있고, 유각 소가 흥분하여 관리자를 사상시키는 불의의 사고도 발생하고 있으므로, 일반 농가에서의 제각은 안전 면에서 필요한 처치가 된다²⁵⁾. 협회에서는 앞서 말한 대로 4주령 이내의 제각을 기준으로 하고 있는데, 해외에서도 3주령²⁶⁾이나 5주령 이내²⁸⁾의 제각이 요구되고 있으며, 송아지의 스트레스 저감을 위해서는 각아(뿔눈)가 형성되면 바로 제각하는 것이 바람직하다²⁸˒²⁹⁾. 한편 해외 기준에서는 제각 시 국소마취나 진통약을 쓰는 것을 원칙으로 하거나²⁶˒²⁸˒²⁹⁾ 강하게 권장하는²⁷⁾ 경우가 많아, 마취 하에서의 실시가 바람직하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="122">•</span><span><i>그림 4 적절하게 제각된 송아지</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유기구의 세정(그림 5)</div>
<p class="bx-num"><span class="bxn" data-n="123">•</span><span>이 항목에서는 포유기구(포유병이나 포유 양동이 등)를 브러시 등으로 오물을 제거하고 있을 것, 세제 등으로 소독하고 있을 것, 겹치지 않고 거꾸로 세우는 등 건조되도록 보관하고 있을 것을 기준으로 하고 있다. 사용한 포유기구를 뜨거운 물로 가볍게 헹구기만 하는 농가도 있지만, 그래서는 위생적으로 좋지 않다³⁰⁾. 포유기구의 위생상태가 부적절하면 생균수가 증가하므로³¹⁾ 감염성 설사증 등의 전파원이 되는 일이 많다³²⁾. 이 때문에 사용한 포유기구는 확실하게 세정, 소독, 건조시키는³⁰⁾ 것이 중요하며, 위생상태에 충분히 주의하지 않으면 안 된다³³˒³⁴⁾. 그 방법으로는 마시다 남은 대용유 성분을 전용 브러시 등으로 꼼꼼히 제거한 후, 자극이 적은 양성비누나 역성비누 소독액에 침지하고 잘 헹군 뒤 사용하는 방법³⁵⁾과, 포유도구를 매회 분해하여 알칼리 세제 등으로 세정한 후 살균제 등으로 소독하고, 씻기 어려운 젖꼭지 등은 한동안 소독액에 담가 두는 방법³⁰⁾ 등이 권장되고 있다. 다만 사용하는 포유기구가 플라스틱제인 경우 브러시로 세정하면 포유기구에 흠이 나서 그 부분에 세균이 번식하기 쉬워지므로, 세정용구로는 브러시보다 스펀지가 바람직하다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="124">•</span><span><i>그림 5 소독 중인 포유기구</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">포유 송아지의 군사(그림 6)</div>
<p class="bx-num"><span class="bxn" data-n="125">•</span><span>이 항목에서는 수의사의 지시나 전염병 등 특별한 이유가 있는 경우를 제외하고 8주령 이후의 송아지를 단사하지 않는 것을 기준으로 하고 있다. 이는 유럽의 규칙과 해외의 동물복지 평가기준²⁶˒²⁸⁾에서도 금지되어 있다. 단사는 질병이나 섭식량 상황을 조기에 파악할 수 있고, 전염성 질병이 다른 송아지에게 감염되기 어렵다는 등의 장점이 있으므로²⁰⁾ 송아지에서는 일반적인 사양관리 방법이 되어 있다. 그러나 일생에서 가장 노는 시간이 많은 시기인데도 단사라면 동료와 달리거나 머리를 맞대고 비비는 등의 사회적 놀이를 할 수 없다³⁶⁾는 문제가 있다. 본래 소는 사회적 무리를 형성하는 동물이며, 군사는 송아지에게 사회화와 자연스러운 행동 발현의 기회를 주고 동작과 운동의 자유를 촉진시킨다²⁶⁾. 송아지는 무리 안에서 사회적 접촉에 대한 동기를 가지며³⁷⁾, 앞서 말한 사회적 유희행동을 특히 많이 발현하는 것이고³⁸⁾, 또 유희행동은 가축의 성장에 따른 외면적 및 내면적 발달에 불가결한 행동이기도 하다³⁹⁾. 田中(다나카)는 유령기 놀이의 중요성은 ①적응적 행동의 유연성을 발달시키고, ②신체적 발육을 촉진하고 뇌 발달을 자극하며, ③영양불량이나 사회적 격리에 의한 악영향으로부터의 회복을 돕고, ④환경 인식능력과 운동능력의 발달, 육체 단련의 기초가 되며, ⑤혈연관계와 사회적 관계의 인식 및 사회적 유대의 유지·강화를 촉진하는 점으로 요약된다고 하였다⁴⁰⁾. 또한 부신피질자극호르몬에 대한 부신 반응으로 측정되는 바와 같이 단사는 송아지에게 스트레스를 줄 가능성이 있다고 보고되어 있고⁴¹⁾, Seo 등은 단사 펜에서 사육된 송아지에서는 이상행동인 혀놀림 행동을 발현할 가능성이 높다는 것을 밝혔다⁴²⁾.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="126">•</span><span><i>그림 6 청결한 깔짚이 두껍게 깔린 송아지 군사 펜</i></span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">이상행동(그림 7)</div>
<p class="bx-num"><span class="bxn" data-n="127">•</span><span>이 항목에서는 개 앉은 자세, 혀놀림, 이물 핥기, 웅벽(熊癖)과 같은 이상행동을 발현하고 있는 소가 1마리도 없는 것을 기준으로 하고 있다. 이상행동이란 사양환경의 부자연스러움 때문에 갈등·욕구불만 상태가 지속되고, 그에 따라 특수화되어⁴³⁾ 출현하는 행동인데, 이 중 송아지에서 흔히 보이는 것은 혀놀림이며, 이는 저지나 흑모화종, F1 소에서 많이 발현한다.</span></p>
<p class="bx-num"><span class="bxn" data-n="128">•</span><span>혀놀림 행동이란 혀를 입 밖으로 길게 내밀거나, 혀를 좌우로 움직이거나, 혀끝을 둥글게 마는 동작을 지속적으로 하는 행동⁴³⁾이다. 또한 울타리나 파이프, 사료가 없는 사조를 핥거나 깨무는 모의 혀놀림 행동도 있다⁴⁴⁾. 송아지에서 혀놀림 행동의 원인은 주로 흡유시간 부족에 의한 스트레스이며, 이는 젖꼭지가 달리지 않은 양동이에서 직접 우유를 벌컥벌컥 마시게 하거나, 1회당 포유시간이 짧은 포유로봇에 의한 포유이거나, 젖꼭지 구멍이 커서 한 번에 나오는 우유량이 많아 포유시간이 단축되는 경우 등에 일어난다. 자연포유의 경우 하루 포유횟수는 6~17회, 1회 포유시간은 10~15분이며⁴⁵⁾, 송아지는 이 사이에 6,000회 정도 유두를 빨고, 진정한 흡유(젖 섭취를 동반)와 비영양적 흡인(젖 섭취를 동반하지 않는 단순한 빨기)을 절반씩 한다⁴⁶⁾. 그러나 인공포유에서는 하루 2회 포유가 일반적이고, 1회 포유시간은 젖꼭지 달린 양동이 포유에서 5~15분, 양동이 포유에서 1~3분이 되며⁴⁵⁾, 젖꼭지 달린 양동이를 써도 2주령 정도에 1,000회/일, 6주령에는 500회/일밖에 흡유할 수 없다⁴⁷⁾. 송아지는 2개월령 정도까지 매우 강한 흡유 욕구를 갖고 있으므로⁴⁴⁾ 젖꼭지 달린 양동이나 보틀을 이용하여 충분한 포유시간을 확보해야 한다(그림 8). 다만 젖꼭지를 장기간 사용하면 고무가 열화되어 구멍이 커지므로, 정기적으로 젖꼭지를 교환하여 포유시간이 짧아지지 않도록 주의할 필요가 있다. 한편 이상과 같은 이유로 본 평가법에서 정한 "포유 송아지에 대한 우유 급여" 항목에서는 포유는 모두 젖꼭지 달린 양동이나 포유 보틀, 또는 자동포유시스템 중 하나를 이용하는 것을 기준으로 하고 있으며, 양동이로 벌컥벌컥 마시게 하는 것은 인정하지 않는다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="129">•</span><span><i>그림 7 이상행동(혀놀림 행동)</i></span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="130">•</span><span><i>그림 8 포유병 홀더에 의한 포유</i></span></p>
<p class="bx-num"><span class="bxn" data-n="131">•</span><span>송아지에서는 흡인이나 상호흡인 같은 갈등행동의 발현도 많다. 포유 직후의 송아지에서는 울타리나 파이프 등을 빨거나 울타리를 깨무는 행동이 보인다. 군사하고 있을 때에는 다른 송아지의 귀, 코, 제대, 생식기 흡인이나 서로 입끼리 빨아 대는 상호흡인이 보인다⁴⁴⁾. 이 원인은 앞서 말한 혀놀림 행동과 같다고 여겨지지만, 흡인과 상호흡인의 다발은 송아지가 욕구불만 상태에 있음을 나타낼 뿐이 아니다. 잡균 오염과 설사 발증, 제대를 빨 때 털을 삼켜 위에 털뭉치를 만들어 소화장애가 되거나, 반대로 흡인당하는 송아지는 제대염을 일으키는 일이 있다⁴⁴⁾. 이 때문에 앞서 말한 대책을 강구하여 포유시간을 길게 할 필요가 있다.</span></p>
</div>
<div class="bx-sub"><div class="bx-subtitle">분만방(그림 9)</div>
<p class="bx-num"><span class="bxn" data-n="132">•</span><span>이 항목에서는 1마리당 10 m² 이상의 면적이 있고, 청결하고 마른 깔짚으로 덮여 있는 것을 기준으로 하고 있다. 계류 우사의 경우 분만방을 설치하지 않고 소를 우상에 매어 둔 채 분만시키는 일도 적지 않다. 아침에 우사에 가 보니 태어난 송아지가 반 클리너에 떨어져 다리를 다쳤거나, 추위에 떨고 있거나⁴⁸⁾, 심지어 죽어 있었다는 경험을 한 관리자도 있을 것이다⁴⁹⁾. 또한 어미소가 분만 시 다리를 미끄러뜨려 반 클리너에 허리를 떨어뜨리고 기립불능에 빠지는 일도 있다⁵⁰⁾. 나아가 방목지 등에서 자연분만하는 경우 많은 소는 무리에서 떨어져 단독으로 분만하는 특성을 갖고 있으므로, 정상행동의 발현이라는 관점에서 보아도 안심하고 분만할 수 있는 장소를 확보하는 것이 바람직하다⁵¹⁾. 다만 가축화가 진행된 현재는 주로 우사 안에서 사육되어 항상 무리에서 생활하는 소에게 분만 전에 갑자기 무리에서 격리되어 단사되는 것은 강한 스트레스가 될 가능성이 있다. Edwards⁵²⁾와 Lidfors 등⁵³⁾은 다른 소로부터 떨어질 수 있는 넓은 장소보다 다른 소가 많이 있는 장소를 분만 장소로 선택하는 소가 많다는 것을 밝혔으며, 이 점에서도 분만방의 면적이 충분한 경우는 여러 마리의 분만우를 하나의 분만방에서 사육해도 무방하다고 생각된다. 분만방의 면적은 소가 자유롭게 움직일 수 있는 공간에 더하여 난산 등의 분만 개조를 원활하게 하기 위해 필요한 공간도 확보할 필요가 있다. 그러나 분만방이 설치되어 있더라도 오염된 분만방에서 분뇨에 뒤덮인 상태로 태아가 출생하면, 입(소화관)과 콧구멍(호흡기) 및 제대(복강 내 순환기)로부터의 오염 위험이 높아져 면역학적으로 무방비한 신생 송아지에게 현저히 위험한 상태가 된다. 어미소에게도 산도에서 생식기로 오염이 파급될 위험이 높아지므로⁵⁴⁾ 청결한 상태를 유지하지 않으면 안 된다. 나아가 충분히 건조한 청결한 깔짚을 깔면 어미소는 분만 시 다리를 미끄러뜨리지 않고 버틸 수 있고, 감염증의 발생과 확산 예방²⁹⁾으로도 이어진다.</span></p>
<p class="bx-num" style="color:var(--ink-soft)"><span class="bxn" data-n="133">•</span><span><i>그림 9 청결하고 건조한 깔짚이 두껍게 깔린 분만방</i></span></p>
<p class="bx-num"><span class="bxn" data-n="134">•</span><span><span style="color:var(--ink-soft)">(저자: 瀬尾哲也)</span></span></p>
